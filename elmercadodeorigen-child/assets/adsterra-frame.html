<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="robots" content="noindex,nofollow,noarchive">
	<style>
		html,body{margin:0;padding:0;overflow:hidden;background:transparent}
		body{display:flex;justify-content:center;align-items:flex-start}
	</style>
</head>
<body>
<script>
(function () {
	'use strict';

	var units = {
		'responsive-desktop': { key: '4e02d145fdb84842713b24a4bade6244', width: 728, height: 90 },
		'responsive-mobile': { key: '3de18866861c081d6eb282ad00fe2bee', width: 320, height: 50 },
		'rectangle': { key: 'c1f547d5b9552a71fae2de32c69f2d66', width: 300, height: 250 },
		'tall-rectangle': { key: 'bd307b1985a219b2694f34d17ceebe8e', width: 160, height: 300 },
		'skyscraper': { key: '040427a877ae83cac71362a8c92eb779', width: 160, height: 600 },
		'footer-banner': { key: '985360811e3cd3c3d7d50e3a9ea81484', width: 468, height: 60 }
	};

	var params = new URLSearchParams(window.location.search);
	var unit = units[params.get('unit') || ''];
	if (!unit) return;

	window.atOptions = {
		key: unit.key,
		format: 'iframe',
		height: unit.height,
		width: unit.width,
		params: {}
	};

	var closeScript = '</scr' + 'ipt>';
	document.write(
		'<script src="https://www.highrevenueformat.com/' +
		encodeURIComponent(unit.key) +
		'/invoke.js">' +
		closeScript
	);
}());
</script>
</body>
</html>

<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="robots" content="noindex,nofollow,noarchive">
	<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}body{display:flex;justify-content:center;align-items:flex-start}</style>
</head>
<body>
<script>
(function () {
	'use strict';

	var units = {
		'responsive-desktop': { key: '4e02d145fdb84842713b24a4bade6244', width: 728, height: 90 },
		'responsive-mobile': { key: '3de18866861c081d6eb282ad00fe2bee', width: 320, height: 50 },
		'rectangle': { key: 'c1f547d5b9552a71fae2de32c69f2d66', width: 300, height: 250 },
		'tall-rectangle': { key: 'bd307b1985a219b2694f34d17ceebe8e', width: 160, height: 300 },
		'skyscraper': { key: '040427a877ae83cac71362a8c92eb779', width: 160, height: 600 },
		'footer-banner': { key: '985360811e3cd3c3d7d50e3a9ea81484', width: 468, height: 60 }
	};

	var params = new URLSearchParams(window.location.search);
	var type = params.get('unit') || '';
	var token = params.get('token') || '';
	var unit = units[type];
	var settled = false;
	var inserted = false;

	function post(typeName) {
		if (!token) return;
		window.parent.postMessage({ type: typeName, token: token }, window.location.origin);
	}

	function markInserted() {
		if (inserted) return;
		inserted = true;
		post('emo-adsterra-creative-inserted');
	}

	function rendered() {
		if (settled) return;
		settled = true;
		markInserted();
		post('emo-adsterra-rendered');
	}

	function blocked() {
		if (settled) return;
		settled = true;
		post('emo-adsterra-blocked');
	}

	function watchMedia(node) {
		if (!node || node.nodeType !== 1 || node.getAttribute('data-emo-adsterra-watch') === '1') return;
		node.setAttribute('data-emo-adsterra-watch', '1');
		markInserted();

		if (node.tagName === 'IMG') {
			if (node.complete && node.naturalWidth > 0) {
				rendered();
				return;
			}
			node.addEventListener('load', function () {
				if (node.naturalWidth > 0) rendered();
			}, { once: true });
			return;
		}

		if (node.tagName === 'VIDEO') {
			if (node.readyState >= 2) {
				rendered();
				return;
			}
			node.addEventListener('loadeddata', rendered, { once: true });
			return;
		}

		if (node.tagName === 'IFRAME' || node.tagName === 'OBJECT' || node.tagName === 'EMBED') {
			node.addEventListener('load', function () {
				window.setTimeout(rendered, 60);
			}, { once: true });
			window.setTimeout(function () {
				if (settled || !node.isConnected) return;
				var src = node.getAttribute('src') || node.getAttribute('data') || '';
				if (src && src !== 'about:blank') rendered();
			}, 900);
			return;
		}

		window.setTimeout(function () {
			if (!settled && node.isConnected) rendered();
		}, 120);
	}

	function inspect() {
		if (settled) return;
		Array.prototype.slice.call(
			document.body.querySelectorAll('iframe,img,video,object,embed,canvas,svg,a[href]')
		).forEach(watchMedia);
	}

	if (!unit || !token) {
		blocked();
		return;
	}

	new MutationObserver(inspect).observe(document.body, {
		childList: true,
		subtree: true,
		attributes: true,
		attributeFilter: ['src', 'href', 'data']
	});

	window.atOptions = {
		key: unit.key,
		format: 'iframe',
		height: unit.height,
		width: unit.width,
		params: {}
	};

	window.__emoAdsterraInvokeLoaded = function () {
		post('emo-adsterra-script-loaded');
		inspect();
	};
	window.__emoAdsterraInvokeFailed = blocked;

	window.setTimeout(function () {
		if (!settled) blocked();
	}, 6200);

	inspect();

	document.write(
		'<script src="https://www.highrevenueformat.com/' +
		encodeURIComponent(unit.key) +
		'/invoke.js" onload="window.__emoAdsterraInvokeLoaded()" onerror="window.__emoAdsterraInvokeFailed()"><\/script>'
	);
}());
</script>
</body>
</html>

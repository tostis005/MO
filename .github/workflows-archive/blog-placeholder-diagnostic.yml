name: Blog placeholder diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-placeholder-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect editorial media
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > inspect.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            await page.goto(`https://dev.elmercadodeorigen.com/blog/?media=${Date.now()}`,{waitUntil:'networkidle2',timeout:90000});
            await new Promise(r=>setTimeout(r,1500));
            const result=await page.evaluate(()=>{
              const visible=(n)=>{const s=getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const candidates=[...document.querySelectorAll('article, .post, .emo-article-card')].filter(visible).map((card)=>{
                const image=card.querySelector('img');
                const media=card.querySelector('.emo-article-card__media, .post-thumbnail, .entry-image, figure, a:has(> img)');
                const title=card.querySelector('h1,h2,h3')?.textContent?.trim().replace(/\s+/g,' ')||'';
                const r=(media||card).getBoundingClientRect();
                return{
                  title,
                  cardClass:card.className,
                  mediaClass:media?.className||'',
                  rect:{x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height)},
                  image:image?{src:image.currentSrc||image.src,alt:image.alt,naturalWidth:image.naturalWidth,naturalHeight:image.naturalHeight,width:image.width,height:image.height,className:image.className,style:{objectFit:getComputedStyle(image).objectFit,background:getComputedStyle(image).background}}:null,
                  mediaHtml:media?.outerHTML.slice(0,6000)||'',
                  cardHtml:card.outerHTML.slice(0,12000)
                };
              });
              return{body:document.body.className,candidates};
            });
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node inspect.cjs

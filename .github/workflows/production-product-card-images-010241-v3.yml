name: Production catalog images 0.10.241 v3

on:
  push:
    paths:
      - '.github/workflows/production-product-card-images-010241-v3.yml'
      - '.github/triggers/production-product-card-images-010241-v3.trigger'

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify catalog images
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l elmercadodeorigen-child/inc/product-card-density-final-010162.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          TARGET="$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/product-card-density-final-010162.php"
          BAK="/tmp/product-card-density-010241-v3-${GITHUB_RUN_ID}.bak"
          ROLLED_BACK=0
          rollback(){
            code=$?
            [ "$ROLLED_BACK" -eq 0 ] || exit "$code"
            ROLLED_BACK=1
            set +e
            echo ROLLBACK_START
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "[ -f '$BAK' ] && cp -p '$BAK' '$TARGET'; rm -f '$BAK'" || true
            echo ROLLED_BACK
            exit "${code:-1}"
          }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BAK'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/product-card-density-final-010162.php "$STAGING_USER@$STAGING_HOST:$TARGET"

          cat > /tmp/elmercado-generate-card-sizes.php <<'PHP'
          <?php
          require_once ABSPATH . 'wp-admin/includes/image.php';
          add_image_size( 'elmercado_catalog_card_010241', 480, 480, false );
          add_image_size( 'elmercado_catalog_card_2x_010241', 800, 800, false );
          global $wpdb;
          $ids = $wpdb->get_col(
              "SELECT DISTINCT pm.meta_value
               FROM {$wpdb->postmeta} pm
               INNER JOIN {$wpdb->posts} p ON p.ID = pm.post_id
               WHERE pm.meta_key = '_thumbnail_id'
                 AND p.post_type = 'product'
                 AND p.post_status = 'publish'
                 AND pm.meta_value REGEXP '^[0-9]+$'"
          );
          $done = 0;
          foreach ( $ids as $raw_id ) {
              $id = (int) $raw_id;
              if ( $id <= 0 || ! wp_attachment_is_image( $id ) ) {
                  continue;
              }
              $file = get_attached_file( $id );
              if ( ! $file || ! is_file( $file ) ) {
                  continue;
              }
              $result = wp_update_image_subsizes( $id );
              if ( is_wp_error( $result ) ) {
                  fwrite( STDERR, 'IMAGE_SUBSIZE_ERROR ' . $id . ' ' . $result->get_error_message() . PHP_EOL );
                  continue;
              }
              $done++;
          }
          echo 'CARD_SIZES_GENERATED ' . $done . '/' . count( $ids ) . PHP_EOL;
          PHP
          sshpass -e scp $SCP /tmp/elmercado-generate-card-sizes.php "$STAGING_USER@$STAGING_HOST:/tmp/elmercado-generate-card-sizes-${GITHUB_RUN_ID}.php"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            [ -n \"\$wp_bin\" ]
            \"\$php_bin\" -l '$TARGET' >/dev/null
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '/tmp/elmercado-generate-card-sizes-${GITHUB_RUN_ID}.php' --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root
            rm -f '/tmp/elmercado-generate-card-sizes-${GITHUB_RUN_ID}.php'
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const checkPage=async(browser,path,width,dpr)=>{
            const page=await browser.newPage();
            await page.setCacheEnabled(false);
            await page.setViewport({width,height:1200,deviceScaleFactor:dpr});
            await page.goto(`${process.env.BASE_URL}${path}?qa241v3=${Date.now()}-${width}-${dpr}`,{waitUntil:'networkidle2',timeout:60000});
            await sleep(600);
            const rows=await page.evaluate(()=>[...document.querySelectorAll('ul.products > li.product')].slice(0,8).map(li=>{
              const img=li.querySelector('a img'); if(!img)return null;
              const s=getComputedStyle(img),r=img.getBoundingClientRect();
              const widths=(img.getAttribute('srcset')||'').split(',').map(v=>parseInt((v.trim().match(/\s(\d+)w$/)||[])[1]||'0',10)).filter(Boolean);
              return {title:(li.querySelector('.woocommerce-loop-product__title,h2')?.textContent||'').trim(),src:img.getAttribute('src')||'',current:img.currentSrc||'',rect:[r.width,r.height],natural:[img.naturalWidth,img.naturalHeight],fit:s.objectFit,maxCandidate:widths.length?Math.max(...widths):0,widthAttr:img.getAttribute('width'),heightAttr:img.getAttribute('height')};
            }).filter(Boolean));
            console.log('IMAGE_QA',path,width,dpr,JSON.stringify(rows));
            if(!rows.length) throw new Error(`No product images on ${path}`);
            for(const row of rows){
              if(Math.abs(row.rect[0]-row.rect[1])>1.5) throw new Error(`Not square: ${row.title} ${row.rect}`);
              if(row.fit!=='contain') throw new Error(`Wrong object-fit: ${row.title} ${row.fit}`);
              if(row.natural[0]>800||row.natural[1]>800) throw new Error(`Oversized current resource: ${row.title} ${row.natural}`);
              if(row.maxCandidate>800) throw new Error(`Oversized srcset candidate: ${row.title} ${row.maxCandidate}`);
              if(row.widthAttr!=='480'||row.heightAttr!=='480') throw new Error(`Wrong reserved ratio: ${row.title}`);
            }
            await page.close();
          };
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            await checkPage(browser,'/tienda/',390,1);
            await checkPage(browser,'/tienda/',390,2);
            await checkPage(browser,'/tienda/',1440,1);
            await checkPage(browser,'/tienda/hidalgo-de-la-jara/',390,1);
            await browser.close();
            console.log('PRODUCTION_CATALOG_IMAGES_010241_V3_QA_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BAK' '/tmp/elmercado-generate-card-sizes-${GITHUB_RUN_ID}.php'"
          trap - ERR
          echo PRODUCTION_CATALOG_IMAGES_010241_V3_OK

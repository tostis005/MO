name: Inspect Puente variation attributes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-diagnose-nightly.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"; [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"; fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          script="$(mktemp /tmp/puente-attrs.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          $url='https://www.puenterobles.com/es/jamon-de-bellota-iberico-100-raza-iberica';
          $r=wp_safe_remote_get($url,array('timeout'=>20,'user-agent'=>'EMDO Puente attrs'));
          if(is_wp_error($r)) throw new RuntimeException($r->get_error_message());
          $html=(string)wp_remote_retrieve_body($r);
          $dom=new DOMDocument();$prev=libxml_use_internal_errors(true);$dom->loadHTML('<?xml encoding="utf-8" ?>'.$html,LIBXML_NOWARNING|LIBXML_NOERROR|LIBXML_NONET);libxml_clear_errors();libxml_use_internal_errors($prev);$xp=new DOMXPath($dom);
          foreach($xp->query("//*[contains(concat(' ',normalize-space(@class),' '),' propiedad ')]//li | //*[contains(concat(' ',normalize-space(@class),' '),' propiedad ')]//a | //*[contains(concat(' ',normalize-space(@class),' '),' propiedad ')]//input")?:array() as $n){
            if(!$n instanceof DOMElement) continue; $attrs=[]; foreach($n->attributes?:array() as $a){$attrs[$a->name]=$a->value;} $txt=trim(preg_replace('/\s+/u',' ',(string)$n->textContent));
            echo wp_json_encode(array('tag'=>$n->tagName,'text'=>$txt,'attrs'=>$attrs),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          foreach($xp->query("//script[contains(.,'273.3855') or contains(.,'propiedad') or contains(.,'precio')]")?:array() as $s){$txt=trim((string)$s->textContent); if($txt!=='') echo 'SCRIPT='.mb_substr(preg_replace('/\s+/u',' ',$txt),0,6000)."\n";}
          PHP
          $WP eval-file "$script" 2>/dev/null
          REMOTE

name: Validate and relaunch EMDO suppliers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-diagnose-nightly.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Verify Puente and relaunch
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"; [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"; fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=768M $wp_bin --path=$wp_path --allow-root"

          echo '== MANAGED CRON =='
          crontab -l | sed -n '/# BEGIN EMDO STAGING CRON/,/# END EMDO STAGING CRON/p'
          crontab -l | grep -Fq 'cron event run --due-now'

          echo '== DRAIN PREVIOUS NIGHTLY QUEUE =='
          for i in $(seq 1 20); do
            $WP action-scheduler run --quiet >/dev/null 2>&1 || true
            running="$($WP eval 'global $wpdb; echo (int)$wpdb->get_var("SELECT COUNT(*) FROM ".MDO_Database::table("sync_runs")." WHERE status=\"running\"");' 2>/dev/null)"
            echo "DRAIN_ITER=$i RUNNING=$running"
            [ "$running" = '0' ] && break
          done

          echo '== PUENTE END TO END =='
          script="$(mktemp /tmp/emdo-puente-e2e.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;
          $sources=MDO_Database::table('source_products');
          $row=$wpdb->get_row("SELECT * FROM {$sources} WHERE supplier_id=3 AND source_url='https://www.puenterobles.com/es/jamon-de-bellota-iberico-100-raza-iberica' ORDER BY id DESC LIMIT 1",ARRAY_A);
          if(!$row) throw new RuntimeException('Puente source row not found');
          $supplier=MDO_Supplier_Repository::find(3);
          $product=MDO_Connector_Iberico_Family::scrape_product((string)$row['source_url'],$supplier);
          $product=MDO_Text::normalize_product($product);
          echo 'PUENTE_VARIATION_COUNT='.(int)($product['variation_count']??0)."\n";
          echo 'PUENTE_EXTRA_COUNT='.count((array)($product['extra_groups'][0]['options']??array()))."\n";
          echo 'PUENTE_VARIATIONS='.wp_json_encode($product['variations']??array(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          if((int)($product['variation_count']??0)!==10) throw new RuntimeException('Expected 10 Puente weight variations');
          if(count((array)($product['extra_groups'][0]['options']??array()))!==4) throw new RuntimeException('Expected four Puente preparation extras');
          $result=MDO_Connector_Iberico_Family::upsert_product(3,$product);
          echo "PUENTE_UPSERT={$result}\n";
          MDO_Woo_Importer::sync_if_active(3,(string)$product['source_url']);
          $wc_id=(int)$row['wc_product_id'];
          $wc=wc_get_product($wc_id);
          if(!$wc || !$wc->is_type('variable')) throw new RuntimeException('Puente Woo product is not variable');
          $children=$wc->get_children();
          echo 'PUENTE_WC_ID='.$wc_id."\n";
          echo 'PUENTE_WC_VARIATIONS='.count($children)."\n";
          if(count($children)!==10) throw new RuntimeException('Puente Woo variation count mismatch');
          $block_id=(int)get_post_meta($wc_id,'_emdo_yith_wapo_block_id',true);
          $sync_error=(string)get_post_meta($wc_id,'_emdo_yith_wapo_sync_error',true);
          echo "PUENTE_YITH_BLOCK={$block_id}\nPUENTE_YITH_ERROR={$sync_error}\n";
          if($block_id<=0 || $sync_error!=='') throw new RuntimeException('Puente YITH extras sync failed');
          foreach($children as $vid){ if(function_exists('yith_wapo_product_has_blocks') && !yith_wapo_product_has_blocks($wc_id,(int)$vid)) throw new RuntimeException('YITH block missing for Puente variation '.$vid); }
          echo "PUENTE_E2E_OK=yes\n";
          PHP
          $WP eval-file "$script"

          echo '== RELAUNCH ALL THREE =='
          $WP eval 'MDO_Nightly_Scheduler::recover_stale_runs(); MDO_Scheduler::queue_manual(1); MDO_Scheduler::queue_manual(2); MDO_Scheduler::queue_manual(3); echo "QUEUED=1,2,3\n";' 2>/dev/null
          # Ejecuta varias tandas ahora mismo; el cron real continuará cada minuto
          # aunque este workflow termine.
          for i in $(seq 1 8); do
            $WP action-scheduler run --quiet >/dev/null 2>&1 || true
            echo "RELAUNCH_DRAIN_ITER=$i"
          done

          $WP eval '
            global $wpdb;
            $runs=MDO_Database::table("sync_runs");
            $suppliers=MDO_Database::table("suppliers");
            $rows=$wpdb->get_results("SELECT r.id,r.supplier_id,s.name,r.trigger_type,r.status,r.started_at,r.finished_at,r.products_found,r.products_updated,r.errors_count,r.message FROM {$runs} r LEFT JOIN {$suppliers} s ON s.id=r.supplier_id ORDER BY r.id DESC LIMIT 9",ARRAY_A);
            foreach($rows as $r){echo "RUN=".wp_json_encode($r,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
          ' 2>/dev/null
          REMOTE

name: Inspect live English cart and minimum-order copy 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-minimum-inspect-20260815.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save puppeteer-core@24 >/dev/null
      - name: Inspect production sources
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          : "${PROD_PATH:?production path not found}"
          {
            echo '=== SITE ==='
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp --path='$PROD_PATH' --allow-root option get siteurl 2>/dev/null || true"
            echo '=== MINIMUM ORDER SOURCE MATCHES ==='
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "grep -RniE --include='*.php' --include='*.js' 'pedido m[ií]nimo|importe m[ií]nimo|te faltan|faltan .*€|minimum order|minimum amount|mínimo.*tienda|tienda.*mínimo' '$PROD_PATH/wp-content/plugins' '$PROD_PATH/wp-content/mu-plugins' '$PROD_PATH/wp-content/themes/elmercadodeorigen-child' 2>/dev/null | head -n 500 || true"
            echo '=== ACTIVE PLUGINS MATCHING MDO/EMDO/MINIMUM/VENDOR ==='
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp --path='$PROD_PATH' --allow-root plugin list --status=active --fields=name,status 2>/dev/null | grep -Ei 'mdo|emdo|minimum|wcfm|vendor|market|woocommerce' || true"
          } > production-english-minimum-report.txt
      - name: Inspect live English cart below minimum
        shell: bash
        run: |
          cat > /tmp/cart-inspect.mjs <<'JS'
          import fs from 'fs';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          const p=await browser.newPage(); p.setDefaultTimeout(20000);
          const out=[];
          async function snap(label){await new Promise(r=>setTimeout(r,1300));const d=await p.evaluate(()=>({url:location.href,lang:document.documentElement.lang,text:(document.body?.innerText||'').replace(/\n{3,}/g,'\n\n'),notices:[...document.querySelectorAll('.woocommerce-error,.woocommerce-info,.woocommerce-message,[role="alert"],.notice,.wc-block-components-notice-banner')].map(n=>(n.innerText||n.textContent||'').trim()).filter(Boolean)}));out.push(`\n=== ${label} ===\nURL ${d.url}\nLANG ${d.lang}\nNOTICES ${JSON.stringify(d.notices)}\nTEXT\n${d.text.slice(0,22000)}\n`);}
          await p.goto('https://www.elmercadodeorigen.com/en/carrito/?mdo_inspect='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await snap('EN EMPTY CART');
          const products=['https://www.elmercadodeorigen.com/en/producto/carne-picada-extra/','https://www.elmercadodeorigen.com/en/product/carne-picada-extra/'];
          for(const u of products){try{await p.goto(u+'?mdo_inspect='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});const b=await p.$('form.cart button.single_add_to_cart_button,button.single_add_to_cart_button');if(b){await b.click();await new Promise(r=>setTimeout(r,1800));break;}}catch(e){}}
          await p.goto('https://www.elmercadodeorigen.com/en/carrito/?mdo_inspect='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await snap('EN CART AFTER ADD');
          await p.goto('https://www.elmercadodeorigen.com/en/finalizar-compra/?mdo_inspect='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await snap('EN CHECKOUT');
          fs.appendFileSync('production-english-minimum-report.txt',out.join('\n'));
          await browser.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node /tmp/cart-inspect.mjs
      - name: Persist report
        shell: bash
        run: |
          mkdir -p docs/audits
          mv production-english-minimum-report.txt docs/audits/production-english-minimum-report-20260815.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits/production-english-minimum-report-20260815.txt
          git commit -m 'Record live English cart and minimum-order inspection [skip ci]'
          git push

name: Production producer ratings 2026-10-01

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-product-vendor-ratings-20261001.php'
      - '.github/workflows/production-producer-ratings-20261001.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-producer-ratings
  cancel-in-progress: false

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-product-vendor-ratings-20261001.php >/dev/null
          grep -q 'mdo_vendor_rating_stats_20261001' mu-plugins/mdo-product-vendor-ratings-20261001.php
          grep -q 'woocommerce_after_shop_loop_item' mu-plugins/mdo-product-vendor-ratings-20261001.php
          grep -q 'woocommerce_single_product_summary' mu-plugins/mdo-product-vendor-ratings-20261001.php
          grep -q 'wcfm_is_store_page' mu-plugins/mdo-product-vendor-ratings-20261001.php

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup and deploy to production
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s" "$p"
                  break
                  ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-product-vendor-ratings-20261001.php"
          BACKUP="/tmp/mdo-product-vendor-ratings-${GITHUB_RUN_ID}.bak"
          PROBE="elmercado-opcache-vendor-ratings-${GITHUB_RUN_ID}.php"

          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "[ -f '$TARGET' ]"; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BACKUP'"
            echo "TARGET_EXISTED=1" >> "$GITHUB_ENV"
          else
            echo "TARGET_EXISTED=0" >> "$GITHUB_ENV"
          fi

          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          echo "PROBE=$PROBE" >> "$GITHUB_ENV"

          sshpass -e scp $SCP mu-plugins/mdo-product-vendor-ratings-20261001.php "$STAGING_USER@$STAGING_HOST:$TARGET"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$TARGET' >/dev/null
            wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          for i in $(seq 1 6); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-store' -H 'Pragma: no-cache' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID-$i" 2>/dev/null || true)"
            if printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$'; then
              break
            fi
            [ "$i" -lt 6 ] || { echo "OPcache reset failed"; exit 1; }
            sleep 2
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'"

      - name: Verify global shop, single product and producer store
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });

            let expected1957;
            {
              const page = await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setExtraHTTPHeaders({'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'});
              await page.setViewport({width: 390, height: 1200});
              await page.goto(`${process.env.BASE_URL}/tienda/1957/reviews/?vendorRatingQA=${Date.now()}`, {waitUntil:'networkidle2', timeout:60000});
              await sleep(600);
              expected1957 = await page.evaluate(() => ({
                score: (document.querySelector('.mdo-review-summary-score')?.textContent || '').replace(/\s+/g,' ').trim(),
                countText: (document.querySelector('.mdo-review-summary-count')?.textContent || '').replace(/\s+/g,' ').trim()
              }));
              console.log('EXPECTED_1957_REVIEW_SUMMARY', JSON.stringify(expected1957));
              if (!expected1957.score || !/reseñ/i.test(expected1957.countText)) throw new Error('Could not read the EMDO producer review summary');
              await page.close();
            }

            const expectedCount = (expected1957.countText.match(/\d+/) || [])[0] || '';

            for (const width of [390, 1440]) {
              const page = await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setExtraHTTPHeaders({'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'});
              await page.setViewport({width, height: 1200});
              await page.goto(`${process.env.BASE_URL}/tienda/?vendorRatingQA=${Date.now()}-${width}`, {waitUntil:'networkidle2', timeout:60000});
              await sleep(700);

              const result = await page.evaluate(() => {
                const cards = [...document.querySelectorAll('ul.products > li.product')];
                const rows = cards.map(card => card.querySelector('.mdo-vendor-rating-row')).filter(Boolean);
                const aove = cards.find(card => /Aceite de oliva virgen extra 5L/i.test(card.innerText || ''));
                const aoveRow = aove?.querySelector('.mdo-vendor-rating-row');
                const aoveRating = aoveRow?.querySelector('.mdo-vendor-rating--loop');
                const aoveVendor = aoveRow?.querySelector('.mdo-vendor-rating__vendor');
                const aoveStars = aoveRow?.querySelector('.mdo-vendor-rating__stars');
                const aoveTitle = aove?.querySelector('.woocommerce-loop-product__title, .woostify-loop-product__title, .product-title, h2, h3');
                const selectos = cards.find(card => /Mollejas de pato frescas/i.test(card.innerText || ''));
                const selectosRow = selectos?.querySelector('.mdo-vendor-rating-row');
                const visible = el => {
                  if (!el) return false;
                  const s=getComputedStyle(el), r=el.getBoundingClientRect();
                  return s.display!=='none' && s.visibility!=='hidden' && parseFloat(s.opacity||'1')>0 && r.width>0 && r.height>0;
                };
                const soldBy = [...document.querySelectorAll('ul.products > li.product .wcfmmp_sold_by_container,ul.products > li.product .wcfmmp_sold_by_container_advanced,ul.products > li.product [class*="sold_by"]')];
                const ratingStyle = aoveRating ? getComputedStyle(aoveRating) : null;
                const rowRect = aoveRow ? aoveRow.getBoundingClientRect() : null;
                const titleRect = aoveTitle ? aoveTitle.getBoundingClientRect() : null;
                const starsStyle = aoveStars ? getComputedStyle(aoveStars) : null;
                return {
                  cards: cards.length,
                  rows: rows.filter(visible).length,
                  visibleSoldBy: soldBy.filter(visible).length,
                  aoveRowText: (aoveRow?.innerText || '').replace(/\s+/g,' ').trim(),
                  aoveRatingHref: aoveRating?.href || '',
                  aoveVendorHref: aoveVendor?.href || '',
                  flexWrap: ratingStyle?.flexWrap || '',
                  whiteSpace: ratingStyle?.whiteSpace || '',
                  rowHeight: rowRect?.height || 0,
                  alignmentDelta: rowRect && titleRect ? Math.abs(rowRect.left - titleRect.left) : 999,
                  starsFontSize: starsStyle ? parseFloat(starsStyle.fontSize || '0') : 0,
                  selectosText: (selectosRow?.innerText || '').replace(/\s+/g,' ').trim(),
                  selectosHasRating: !!selectosRow?.querySelector('.mdo-vendor-rating--loop')
                };
              });

              console.log('SHOP_RATINGS', width, JSON.stringify(result));
              if (result.cards < 1 || result.rows < 1) throw new Error('No visible producer rows in global shop');
              if (result.visibleSoldBy !== 0) throw new Error('Sold-by text is still visible in global catalog cards');
              if (/Productor|Producer|Vendido por|Sold by|reseñ|review/i.test(result.aoveRowText)) throw new Error('Catalog row contains verbose labels');
              if (!result.aoveRowText.includes('1957') || !result.aoveRowText.includes(expected1957.score) || !result.aoveRowText.includes('(' + expectedCount + ')')) throw new Error('Global shop row does not match producer and EMDO review summary');
              if (result.flexWrap !== 'nowrap' || result.whiteSpace !== 'nowrap') throw new Error('Rating subgroup is allowed to wrap');
              if (result.rowHeight > 24) throw new Error('Short producer row should remain on one line');
              if (result.alignmentDelta > 2) throw new Error('Producer row is not aligned with card content inset');
              if (result.starsFontSize < 13.5) throw new Error('Catalog stars are still too small');
              if (!/\/tienda\/1957\/reviews\/?(?:\?|$)/i.test(result.aoveRatingHref)) throw new Error('1957 reviews link incorrect in shop');
              if (!/\/tienda\/1957\/?(?:\?|$)/i.test(result.aoveVendorHref)) throw new Error('1957 producer link incorrect in shop');
              if (result.selectosText !== 'Selectos de Castilla' || result.selectosHasRating) throw new Error('Producer without reviews should show only its name');
              await page.close();
            }

            {
              const page = await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setViewport({width: 390, height: 1200});
              await page.goto(`${process.env.BASE_URL}/producto/aceite-de-oliva-virgen-extra-5l/?vendorRatingQA=${Date.now()}`, {waitUntil:'networkidle2', timeout:60000});
              await sleep(600);
              const result = await page.evaluate(() => {
                const rating = document.querySelector('.summary .mdo-vendor-rating--single');
                const s = rating ? getComputedStyle(rating) : null;
                const r = rating ? rating.getBoundingClientRect() : null;
                return {
                  visible: !!rating && s.display!=='none' && s.visibility!=='hidden' && r.width>0 && r.height>0,
                  text: (rating?.innerText || '').replace(/\s+/g,' ').trim(),
                  href: rating?.href || ''
                };
              });
              console.log('SINGLE_RATING', JSON.stringify(result));
              if (!result.visible || !/Valoración del productor/i.test(result.text) || !result.text.includes(expected1957.score) || !result.text.includes(expectedCount)) throw new Error('Single-product rating does not match EMDO producer review summary');
              if (!/\/tienda\/1957\/(?:reviews|resenas)\/?(?:\?|$)/i.test(result.href)) throw new Error('1957 reviews link incorrect on single product');
              await page.close();
            }

            {
              const page = await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setViewport({width: 390, height: 1200});
              await page.goto(`${process.env.BASE_URL}/tienda/1957/?vendorRatingQA=${Date.now()}`, {waitUntil:'networkidle2', timeout:60000});
              await sleep(600);
              const count = await page.evaluate(() => document.querySelectorAll('#wcfmmp-store ul.products .mdo-vendor-rating').length);
              console.log('PRODUCER_STORE_RATING_COUNT', count);
              if (count !== 0) throw new Error('Producer rating was added to producer-store product cards');
              await page.close();
            }

            await browser.close();
            console.log('PRODUCTION_PRODUCER_RATINGS_QA_OK');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Cleanup deployment backup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"
          echo PRODUCTION_PRODUCER_RATINGS_20261001_OK

      - name: Roll back production on failure
        if: failure()
        shell: bash
        run: |
          set +e
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          if [ -n "${TARGET:-}" ] && [ -n "${PROD_PATH:-}" ]; then
            if [ "${TARGET_EXISTED:-0}" = "1" ] && [ -n "${BACKUP:-}" ]; then
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$BACKUP' '$TARGET'"
            else
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET'"
            fi
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; rm -f '$BACKUP' '$PROD_PATH/${PROBE:-}'"
          fi
          echo PRODUCTION_PRODUCER_RATINGS_ROLLED_BACK

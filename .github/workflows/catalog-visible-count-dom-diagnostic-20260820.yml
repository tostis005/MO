name: Catalog visible count DOM diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-visible-count-dom-diagnostic-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect visible result count nodes
        run: |
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:900}});const p=await c.newPage();await p.goto(`https://www.elmercadodeorigen.com/tienda/?count_dom=${process.env.GITHUB_RUN_ID||Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});await p.waitForSelector('[data-mdo-catalog-summarybar]',{state:'visible',timeout:20000});await p.waitForTimeout(800);const d=await p.evaluate(()=>{const v=e=>{const c=getComputedStyle(e),r=e.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity||1)>0&&r.width>0&&r.height>0};const nodes=[...new Set([...document.querySelectorAll('[data-mdo-summary-count],.emo-catalog-result-count-010220,[data-mdo-toolbar-count],.woocommerce-result-count')])];return nodes.map((e,i)=>{const cs=getComputedStyle(e),r=e.getBoundingClientRect();const chain=[];let x=e;for(let n=0;x&&n<5;n++,x=x.parentElement)chain.push({tag:x.tagName,id:x.id,cls:x.className});return{index:i,visible:v(e),text:e.textContent.trim(),tag:e.tagName,id:e.id,cls:e.className,summary:e.hasAttribute('data-mdo-summary-count'),toolbar:e.hasAttribute('data-mdo-toolbar-count'),display:cs.display,visibility:cs.visibility,importantDisplay:e.style.getPropertyValue('display'),rect:{x:r.x,y:r.y,w:r.width,h:r.height},outer:e.outerHTML.slice(0,1000),chain}})});fs.writeFileSync('/tmp/count-dom.json',JSON.stringify(d,null,2));console.log(JSON.stringify(d,null,2));await c.close();await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Record diagnostic
        run: |
          mkdir -p .deploy-status
          cp /tmp/count-dom.json .deploy-status/catalog-visible-count-dom-diagnostic.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-visible-count-dom-diagnostic.json
          git commit -m 'Record duplicate count DOM diagnostic [skip ci]' || exit 0
          git pull --rebase origin main;git push origin HEAD:main

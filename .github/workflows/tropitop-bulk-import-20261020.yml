name: Tropitop incremental catalog import and verified direct publication
on:
  pull_request:
    paths:
      - '.github/scripts/tropitop-bulk-import-20261020.php'
      - '.github/workflows/tropitop-bulk-import-20261020.yml'
      - 'mdo-supplier-sync/connectors/class-mdo-connector-tropitop.php'
      - 'mdo-supplier-sync/includes/class-mdo-woo-importer.php'
  workflow_run:
    workflows: ['Deploy MDO Supplier Sync to production']
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tropitop-bulk-import-production
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l .github/scripts/tropitop-bulk-import-20261020.php
          php -l mdo-supplier-sync/connectors/class-mdo-connector-tropitop.php
          php -l mdo-supplier-sync/includes/class-mdo-woo-importer.php
          php -l mdo-supplier-sync/includes/class-mdo-scheduler.php
  import:
    needs: lint
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Resume saved cursor and publish only delivery-ready products
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${STAGING_HOST:-}" && test -n "${STAGING_USER:-}" && test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=40 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/tropitop-bulk-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/tropitop-bulk-import-20261020.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          # One SHORT-LIVED SSH session per batch. The previous workflow used
          # a single SSH connection for all 187 references and failed with
          # "client_loop: send disconnect: Broken pipe". Product-level state is
          # already persisted in WP option mdo_tropitop_full_catalog_20261020.
          remote_phase() {
            phase="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$SCRIPT' '$phase'" <<'REMOTE'
          set -Eeuo pipefail
          P="$1"; SCRIPT="$2"; phase="$3"
          WP_BIN="$(command -v wp)"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          [ -n "$PHP_BIN" ] && [ -n "$WP_BIN" ]
          timeout --kill-after=20s 650s env TROPITOP_BULK_PHASE="$phase" TROPITOP_BULK_BATCH=2 \
            "$PHP_BIN" -d memory_limit=1536M -d max_execution_time=0 \
            "$WP_BIN" eval-file "$SCRIPT" --path="$P" --allow-root --skip-plugins=woostify-sites-library
          REMOTE
          }
          # Idempotent init returns without modifying an existing catalog or
          # resetting the saved cursor. Always inspect the last imported SKU.
          remote_phase init
          # Merchant authorized direct publication: activate ONLY after the
          # importer verifies live WCFM mainland shipping, product identity,
          # destination guards and the contracted supplier configuration.
          remote_phase activate
          remote_phase status
          complete=0
          for ((batch=1; batch<=300; batch++)); do
            if ! result="$(remote_phase step)"; then
              echo "Tropitop batch $batch disconnected/failed. Retain the saved cursor and retry in next workflow." >&2
              remote_phase status || true
              exit 21
            fi
            printf '%s\n' "$result" | grep -E '^TROPITOP_(IMPORT_OK|IMPORT_REVIEW|BULK_PROGRESS|BULK_DONE)=' || true
            if grep -q '^TROPITOP_BULK_DONE=' <<< "$result"; then complete=1; break; fi
            sleep 2
          done
          remote_phase status
          if [ "$complete" -ne 1 ]; then
            echo 'TROPITOP_BULK_INCOMPLETE: the next workflow will resume its WP cursor' >&2
            exit 22
          fi
          echo 'TROPITOP_BULK_PIPELINE_DONE'

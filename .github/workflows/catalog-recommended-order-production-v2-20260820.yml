name: Catalog recommended order production v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-recommended-order-production-v2-20260820.yml'
      - 'mu-plugins/mdo-catalog-recommended-order-20260820.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify-mark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-catalog-recommended-order-20260820.php >/dev/null
          grep -Fq "private const ORDERBY = 'mdo_recommended'" mu-plugins/mdo-catalog-recommended-order-20260820.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy to production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "PORT=$PORT" >> "$GITHUB_ENV"

          TMP="/tmp/mdo-catalog-recommended-order-${GITHUB_RUN_ID}.php"
          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-catalog-recommended-order-20260820.php"
          sshpass -e scp $SCP mu-plugins/mdo-catalog-recommended-order-20260820.php "$STAGING_USER@$STAGING_HOST:$TMP"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp || true)
            \"\$php_bin\" -l '$TMP' >/dev/null
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            cp '$TMP' '$TARGET'
            rm -f '$TMP'
            \"\$php_bin\" -l '$TARGET' >/dev/null
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

      - name: Verify live order
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p ${PORT:-22}"
          VERIFY="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp || true)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '
              printf("CLASS=%s\\n", class_exists("MDO_Catalog_Recommended_Order_20260820") ? "yes" : "no");
              printf("DEFAULT=%s\\n", apply_filters("woocommerce_default_catalog_orderby", "menu_order"));
              $opts=apply_filters("woocommerce_catalog_orderby", array("menu_order"=>"Default","popularity"=>"Popularidad","date"=>"Últimos","price"=>"Precio","price-desc"=>"Precio desc"));
              printf("LABEL=%s\\n", $opts["mdo_recommended"] ?? "missing");
              $ids=get_posts(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","orderby"=>"ID","order"=>"ASC","no_found_rows"=>true,"suppress_filters"=>true));
              $ranked=MDO_Catalog_Ranking::rank_products($ids,array("rotation_seed"=>gmdate("Y-m-d"),"diversify_vendors"=>true));
              printf("RANK=%s\\n", implode(",",$ranked));
            ' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$VERIFY"
          printf '%s\n' "$VERIFY" | grep -Fq 'CLASS=yes'
          printf '%s\n' "$VERIFY" | grep -Fq 'DEFAULT=mdo_recommended'
          printf '%s\n' "$VERIFY" | grep -Fq 'LABEL=Recomendados'
          printf '%s\n' "$VERIFY" | sed -n 's/^RANK=//p' > /tmp/mdo-rank.txt
          test -s /tmp/mdo-rank.txt

          BASE='https://www.elmercadodeorigen.com/tienda/'
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO rank audit' -H 'Cache-Control: no-cache, no-store' -o /tmp/default.html "${BASE}?mdo_rank_audit=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO rank audit' -H 'Cache-Control: no-cache, no-store' -o /tmp/recommended.html "${BASE}?orderby=mdo_recommended&mdo_rank_audit=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO rank audit' -H 'Cache-Control: no-cache, no-store' -o /tmp/price.html "${BASE}?orderby=price&mdo_rank_audit=${GITHUB_RUN_ID}"

          python3 - <<'PY' > /tmp/mdo-audit.txt
          import html,re
          from pathlib import Path

          def ids(path):
              t=Path(path).read_text(encoding='utf-8',errors='ignore')
              found=[int(x) for x in re.findall(r'<li[^>]*class=["\'][^"\']*\bpost-(\d+)\b[^"\']*["\'][^>]*>',t,re.I)]
              out=[]; seen=set()
              for x in found:
                  if x not in seen: seen.add(x); out.append(x)
              return out

          def selected(path):
              t=html.unescape(Path(path).read_text(encoding='utf-8',errors='ignore'))
              options=re.findall(r'<option([^>]*)>(.*?)</option>',t,re.I|re.S)
              for attrs,label in options:
                  if re.search(r'\bselected(?:\s*=|\s|$)',attrs,re.I):
                      m=re.search(r'value=["\']([^"\']+)["\']',attrs,re.I)
                      if m: return m.group(1),re.sub(r'<[^>]+>','',label).strip()
              raise AssertionError('selected order not found')

          d=ids('/tmp/default.html'); r=ids('/tmp/recommended.html')
          assert len(d)>=4,d
          assert d==r,(d,r)
          dv,dl=selected('/tmp/default.html')
          rv,_=selected('/tmp/recommended.html')
          pv,_=selected('/tmp/price.html')
          assert dv=='mdo_recommended',(dv,dl)
          assert rv=='mdo_recommended',rv
          assert pv=='price',pv
          rank=[int(x) for x in Path('/tmp/mdo-rank.txt').read_text().strip().split(',') if x]
          pos={x:i for i,x in enumerate(rank)}
          assert all(x in pos for x in d),d
          idx=[pos[x] for x in d]
          assert idx==sorted(idx),(d,idx)
          print('result=success')
          print('default_order=mdo_recommended')
          print('default_label='+dl)
          print('visible_products='+','.join(map(str,d)))
          print('rank_positions='+','.join(map(str,idx)))
          print('explicit_recommended_matches=1')
          print('manual_price_order_preserved=1')
          PY
          cat /tmp/mdo-audit.txt

      - name: Record successful production audit
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat /tmp/mdo-audit.txt
          } > .deploy-status/catalog-recommended-order-live.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-recommended-order-live.txt
          git commit -m 'Record recommended catalog order production audit'
          git push origin HEAD:main

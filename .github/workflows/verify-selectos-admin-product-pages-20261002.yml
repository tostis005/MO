name: Verify Selectos admin product pages 20261002

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-selectos-admin-product-pages-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify authenticated admin product rendering
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php_bin" "$wp_bin"; break ;;
              esac
            done
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP_BIN="${REST%%|*}"; WP_BIN="${REST#*|}"
          test -n "$PROD" && test -n "$PHP_BIN" && test -n "$WP_BIN"

          REMOTE="/tmp/home-category-parity-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/home-category-parity-data-010215.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          OUT="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP_BIN' -d memory_limit=768M '$WP_BIN' eval-file '$REMOTE' --path='$PROD' --allow-root; rm -f '$REMOTE'")"
          NAME_B64="$(printf '%s\n' "$OUT" | sed -n 's/^__COOKIE_NAME__=//p' | tail -n1)"
          VALUE_B64="$(printf '%s\n' "$OUT" | sed -n 's/^__COOKIE_VALUE__=//p' | tail -n1)"
          COOKIE_NAME="$(printf '%s' "$NAME_B64" | base64 -d)"
          COOKIE_VALUE="$(printf '%s' "$VALUE_B64" | base64 -d)"
          test -n "$COOKIE_NAME" && test -n "$COOKIE_VALUE"
          echo "::add-mask::$COOKIE_VALUE"

          for slug in foie-gras-de-pato-extra-desvenado foie-gras-de-pato-extra foie-gras-mi-cuit-entero-mini-estuche magret-de-pato-fresco trucha-ahumada-lomo jamon-de-pato-ahumado-pieza; do
            echo "--- $slug"
            result="$(curl -ksSL --connect-timeout 8 --max-time 25               --cookie "$COOKIE_NAME=$COOKIE_VALUE"               -H 'Cache-Control: no-store' -H 'Pragma: no-cache'               -o /tmp/selectos-admin-product.html               -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}'               "$BASE_URL/producto/$slug/?admin-nav-verify=$GITHUB_RUN_ID")"
            echo "$result"
            code="${result%% *}"
            test "$code" = "200"
            ! grep -Eqi 'Gateway Time-out|504 Gateway|Fatal error:|There has been a critical error' /tmp/selectos-admin-product.html
          done
          echo SELECTOS_ADMIN_PRODUCT_PAGES_OK

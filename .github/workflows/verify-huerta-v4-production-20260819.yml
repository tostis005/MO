name: Verify Huerta v4 production 20260819
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-huerta-v4-production-20260819.yml']
  pull_request:
    branches: [main]
    paths: ['.github/ops/huerta-conservas-pr-trigger-20260819.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'ops/huerta-conservas-verify-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate Huerta conservas change
        run: |
          set -euo pipefail
          php -l mdo-supplier-sync/includes/class-mdo-huerta-defaults.php
          php -l .github/scripts/assign-huerta-conservas-20260819.php
      - name: Deploy Huerta category rule and assign production products
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_SCRIPT="/tmp/assign-huerta-conservas-${GITHUB_RUN_ID}.php"
          REMOTE_DEFAULTS="/tmp/class-mdo-huerta-defaults-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/assign-huerta-conservas-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/includes/class-mdo-huerta-defaults.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DEFAULTS"
          mkdir -p .deploy-status
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            plugin_file='$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-huerta-defaults.php'
            test -f \"\$plugin_file\"
            cp \"\$plugin_file\" \"/tmp/class-mdo-huerta-defaults-${GITHUB_RUN_ID}.bak.php\"
            cp '$REMOTE_DEFAULTS' \"\$plugin_file\"
            rm -f '$REMOTE_DEFAULTS'
            \"\$php_bin\" -l \"\$plugin_file\" >/dev/null
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root
            code=\$?
            rm -f '$REMOTE_SCRIPT'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            exit \$code
          " > .deploy-status/huerta-conservas-20260819.txt 2>&1
          CODE=$?
          set -e
          echo "$CODE" > .deploy-status/huerta-conservas-20260819.exit-code
          cat .deploy-status/huerta-conservas-20260819.txt
      - name: Record result
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/huerta-conservas-20260819.txt .deploy-status/huerta-conservas-20260819.exit-code || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record Huerta conservas production result [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - name: Fail if assignment failed
        if: always()
        run: |
          test -f .deploy-status/huerta-conservas-20260819.exit-code
          test "$(cat .deploy-status/huerta-conservas-20260819.exit-code)" = "0"
          grep -q '^huerta_conservas_ok ' .deploy-status/huerta-conservas-20260819.txt

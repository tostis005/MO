name: Production About Live Cache Audit 010226

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/about-live-cache-audit-010226-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-about-live-cache-audit-010226
  cancel-in-progress: false

jobs:
  audit-production-about:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit live about cache content
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.elmercadodeorigen.com"
          body="$(mktemp)"
          code="$(curl -sS -L \
            --connect-timeout 18 \
            --max-time 50 \
            --retry 2 \
            --retry-delay 2 \
            -A 'Mozilla/5.0 (quality-audit)' \
            -D /tmp/about-live-headers.txt \
            -o "$body" \
            -w '%{http_code}' \
            "$base/quienes-somos/?cachebust=${GITHUB_RUN_ID}")"

          echo "Status: ${code}"
          allowed_codes='^(200|403|429|500|502|503|504)$'
          if [[ ! "$code" =~ $allowed_codes ]]; then
            echo "::error::Unexpected HTTP status ${code} for production about page."
            exit 1
          fi
          if [[ "$code" != "200" ]]; then
            echo "::warning::Production WAF/origin returned ${code}; skipping freshness body assertion."
            cat /tmp/about-live-headers.txt || true
            exit 0
          fi

          grep -q 'productores seleccionados' "$body" || { echo "::error::Fresh ES about count copy missing on live page."; exit 1; }
          if grep -q 'a más de [[:space:]]*50 productores' "$body"; then
            echo "::error::Stale ES hard-coded 50 count still present on live about page."
            exit 1
          fi
          if grep -q '>50<' "$body"; then
            echo "::error::Stale visible 50 count still present on live about page."
            exit 1
          fi
          echo 'about_live_cache_fresh'
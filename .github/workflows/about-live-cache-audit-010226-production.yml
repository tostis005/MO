name: About live cache audit 0.10.226 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/about-live-cache-audit-010226-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Compare public responses
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.elmercadodeorigen.com/quienes-somos/'
          for mode in normal query nocache; do
            case "$mode" in
              normal) url="$BASE"; extra=() ;;
              query) url="${BASE}?emdo_about_cache=${GITHUB_RUN_ID}"; extra=() ;;
              nocache) url="${BASE}?emdo_about_nocache=${GITHUB_RUN_ID}"; extra=(-H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache') ;;
            esac
            curl -fsSL --retry 2 -A "Mozilla/5.0 EMDO About cache $mode" "${extra[@]}" -D "/tmp/$mode.head" -o "/tmp/$mode.body" "$url"
            echo "=== $mode headers ==="
            tr -d '\r' < "/tmp/$mode.head" | grep -Ei '^(HTTP/|server:|cache-control:|age:|x-|cf-|vary:|expires:|pragma:)' || true
            printf 'new=%s old=%s bytes=%s sha=%s\n' \
              "$(grep -Fc 'Nuestra historia comienza en 2014, cuando empezamos a especializarnos' "/tmp/$mode.body" || true)" \
              "$(grep -Fc 'Todo comenzó en 2014 cuando empezamos a especializarnos' "/tmp/$mode.body" || true)" \
              "$(wc -c < "/tmp/$mode.body")" \
              "$(sha256sum "/tmp/$mode.body" | awk '{print $1}')"
            echo '--- 2014 snippets ---'
            grep -o -E '.{0,140}2014.{0,220}' "/tmp/$mode.body" | head -n 3 || true
          done

      - name: Inspect production cache plugins and files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); echo '=== active plugins cache-related ==='; \"\$php_bin\" \"\$wp_bin\" plugin list --path='$PROD_PATH' --status=active --fields=name,status --format=csv --allow-root 2>/dev/null | grep -Ei 'cache|rocket|litespeed|perfmatters|autoptimize|nitro|smush|elementor|varnish|redis|object' || true; echo '=== wp-content cache dirs ==='; find '$PROD_PATH/wp-content' -maxdepth 2 -type d \( -iname '*cache*' -o -iname '*rocket*' \) -print 2>/dev/null | head -n 50; echo '=== old phrase in cache files ==='; grep -RIl --include='*.html' --include='*.php' 'Todo comenzó en 2014 cuando empezamos a especializarnos' '$PROD_PATH/wp-content/cache' '$PROD_PATH/wp-content/uploads' 2>/dev/null | head -n 30 || true"

name: Audit default blog image replacement 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-default-blog-image-replacement-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit production provisional image assignments
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          DEFAULT_ID="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' option get emdo_default_blog_featured_attachment_id --path='$PROD' --allow-root")"
          DEFAULT_HASH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' option get emdo_default_blog_featured_hash --path='$PROD' --allow-root")"
          ATTACHED_FILE="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post meta get '$DEFAULT_ID' _wp_attached_file --path='$PROD' --allow-root")"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' db query \"SELECT p.ID,p.post_name,p.post_status,thumb.meta_value AS thumbnail_id FROM wp_posts p JOIN wp_postmeta marker ON marker.post_id=p.ID AND marker.meta_key='_emdo_uses_default_featured' AND marker.meta_value='1' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' WHERE p.post_type='post' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root" > /tmp/default-blog-audit.tsv
          test "$DEFAULT_HASH" = 'a8e8da4124b2d6a1692db12e1ed1b23b82407306479d7d87708fe80b29d8fb82'
          test "$DEFAULT_ID" != '13359'
          test "$(wc -l < /tmp/default-blog-audit.tsv)" -ge 1
          test "$(awk -F '\t' -v id="$DEFAULT_ID" '$4!=id{c++} END{print c+0}' /tmp/default-blog-audit.tsv)" -eq 0
          printf '%s\n' "$DEFAULT_ID" > /tmp/default-id.txt
          printf '%s\n' "$DEFAULT_HASH" > /tmp/default-hash.txt
          printf '%s\n' "$ATTACHED_FILE" > /tmp/default-file.txt

      - name: Record production audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json, os
          default_id=int(open('/tmp/default-id.txt').read().strip())
          default_hash=open('/tmp/default-hash.txt').read().strip()
          attached_file=open('/tmp/default-file.txt').read().strip()
          posts=[]
          for line in open('/tmp/default-blog-audit.tsv', encoding='utf-8'):
              p=line.rstrip('\n').split('\t')
              if len(p)>=4:
                  posts.append({'id':int(p[0]),'slug':p[1],'status':p[2],'thumbnail_id':int(p[3])})
          data={
              'release':'20260827-new-default-audit',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'source_sha':os.environ['GITHUB_SHA'],
              'verified':True,
              'old_attachment_id':13359,
              'new_attachment_id':default_id,
              'new_hash':default_hash,
              'attached_file':attached_file,
              'marked_post_count':len(posts),
              'posts':posts,
          }
          open('.deploy-status/default-blog-featured-image-replacement-audit-20260827.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/default-blog-featured-image-replacement-audit-20260827.json
          git commit -m 'Record verified default blog image replacement audit [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

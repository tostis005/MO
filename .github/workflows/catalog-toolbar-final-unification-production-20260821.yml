name: Catalog toolbar final unification production

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/catalog-toolbar-final-unification-production-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: |
          php -l mu-plugins/mdo-catalog-toolbar-static-guard-20260820.php
          php -l mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php

      - name: Deploy and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/catalog-toolbar-final-unification-20260821.txt
          EXIT=.deploy-status/catalog-toolbar-final-unification-20260821.exit-code
          : > "$STATUS"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          GUARD="$PROD_PATH/wp-content/mu-plugins/mdo-catalog-toolbar-static-guard-20260820.php"
          UX="$PROD_PATH/wp-content/mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php"
          OLD_PARITY="$PROD_PATH/wp-content/mu-plugins/zzzzzz-mdo-catalog-toolbar-visual-parity-20260821.php"
          BG="/tmp/mdo-guard-before-${GITHUB_RUN_ID}.php"; BU="/tmp/mdo-ux-before-${GITHUB_RUN_ID}.php"; BP="/tmp/mdo-parity-before-${GITHUB_RUN_ID}.php"
          RG="/tmp/mdo-guard-${GITHUB_RUN_ID}.php"; RU="/tmp/mdo-ux-${GITHUB_RUN_ID}.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            [ ! -f '$GUARD' ] || cp '$GUARD' '$BG'
            [ ! -f '$UX' ] || cp '$UX' '$BU'
            [ ! -f '$OLD_PARITY' ] || cp '$OLD_PARITY' '$BP'
          "
          rollback(){
            echo 'ROLLBACK final toolbar unification' | tee -a "$STATUS"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
              if [ -f '$BG' ]; then cp '$BG' '$GUARD'; else rm -f '$GUARD'; fi
              if [ -f '$BU' ]; then cp '$BU' '$UX'; else rm -f '$UX'; fi
              if [ -f '$BP' ]; then cp '$BP' '$OLD_PARITY'; else rm -f '$OLD_PARITY'; fi
              rm -f '$BG' '$BU' '$BP' '$RG' '$RU'
              wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            " || true
          }
          fail(){ echo "FAIL: $1" | tee -a "$STATUS"; rollback; echo 2 > "$EXIT"; exit 2; }

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-catalog-toolbar-static-guard-20260820.php "$STAGING_USER@$STAGING_HOST:$RG"
          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php "$STAGING_USER@$STAGING_HOST:$RU"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e; cp '$RG' '$GUARD'; cp '$RU' '$UX'; rm -f '$RG' '$RU' '$OLD_PARITY'
            wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$GUARD'; \"\$php_bin\" -l '$UX'; \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          " >> "$STATUS" 2>&1 || fail 'deploy/lint failed'

          BASE=https://www.elmercadodeorigen.com
          for u in "$BASE/tienda/" "$BASE/productores/" "$BASE/tienda/1957/" "$BASE/en/store/1957/"; do
            s="$(curl -L -sS --max-time 40 -H 'Cache-Control: no-cache' -H 'Cookie: mdo_shipping_country=ES; mdo_shipping_postcode=' -o /tmp/p.html -w '%{http_code}' "${u}?mdo_finalbar=${GITHUB_RUN_ID}")"
            echo "HTTP $s $u" | tee -a "$STATUS"; [[ "$s" =~ ^[23][0-9][0-9]$ ]] || fail "HTTP failure $u"
          done

          python -m pip install --quiet selenium
          export MDO_RUN="$GITHUB_RUN_ID"
          set +e
          python - <<'PY' >> "$STATUS" 2>&1
          import os
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='https://www.elmercadodeorigen.com'; run=os.environ['MDO_RUN']
          opt=webdriver.ChromeOptions(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=opt)
          def r(e): return d.execute_script('const x=arguments[0].getBoundingClientRect();return {x:x.x,y:x.y,w:x.width,h:x.height,right:x.right,bottom:x.bottom}',e)
          def c(e,p): return d.execute_script('return getComputedStyle(arguments[0])[arguments[1]]',e,p)
          def close(a,b,t=3): return abs(a-b)<=t
          def cy(x): return x['y']+x['h']/2
          def load(path,width,country='ES'):
              d.set_window_size(width,1000); d.get(base+'/?seed='+run)
              for n in ('mdo_shipping_country','mdo_shipping_postcode'):
                  try:d.delete_cookie(n)
                  except:pass
              d.add_cookie({'name':'mdo_shipping_country','value':country,'domain':'www.elmercadodeorigen.com','path':'/'})
              d.add_cookie({'name':'mdo_shipping_postcode','value':'','domain':'www.elmercadodeorigen.com','path':'/'})
              d.get(base+path+f'?finalbar={run}-{width}-{country}')
          def snap(path,width,producer=False):
              load(path,width); w=WebDriverWait(d,20)
              sel='#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized.mdo-ps-toolbar-ready' if producer else '.woostify-sorting.emo-catalog-toolbar-shared-010229'
              bar=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,sel)))
              left=bar.find_element(By.CSS_SELECTOR,':scope > .woostify-toolbar-left')
              count=left.find_element(By.CSS_SELECTOR,':scope > .woocommerce-result-count')
              dest=left.find_element(By.CSS_SELECTOR,':scope > .mdo-catalog-destination--canonical')
              order=bar.find_element(By.CSS_SELECTOR,':scope > .woocommerce-ordering')
              trig=dest.find_element(By.CSS_SELECTOR,'.mdo-catalog-destination__trigger'); select=order.find_element(By.TAG_NAME,'select')
              if producer: assert not bar.find_elements(By.CSS_SELECTOR,':scope > .elmercado-vendor-toolbar')
              return {'bar':r(bar),'left':r(left),'count':r(count),'dest':r(dest),'trig':r(trig),'order':r(order),'select':r(select),'display':c(bar,'display'),'bg':c(bar,'backgroundColor'),'radius':c(bar,'borderRadius'),'tbg':c(trig,'backgroundColor'),'tc':c(trig,'color'),'sbg':c(select,'backgroundColor'),'sc':c(select,'color')}
          def check(width):
              a=snap('/tienda/',width); b=snap('/tienda/1957/',width,True)
              for x in (a,b):
                  assert x['bg']=='rgb(255, 255, 255)',x
                  assert x['tbg']=='rgb(248, 250, 248)',x
                  assert x['tc']=='rgb(23, 63, 50)' and x['sc']=='rgb(23, 63, 50)',x
                  for k in ('count','dest','order'):
                      assert x['bar']['x']-1<=x[k]['x'] and x[k]['right']<=x['bar']['right']+1,(width,k,x)
              assert a['radius']==b['radius'],(width,a,b)
              assert close(a['trig']['h'],b['trig']['h'],1.5) and close(a['select']['h'],b['select']['h'],1.5),(width,a,b)
              if width>640:
                  assert a['display']=='flex' and b['display']=='flex',(width,a,b)
                  assert close(a['bar']['h'],b['bar']['h'],2),(width,a,b)
                  assert max(abs(cy(b[k])-cy(b['trig'])) for k in ('count','order'))<3,(width,b)
              else:
                  assert a['display']=='grid' and b['display']=='grid',(width,a,b)
                  assert b['count']['bottom']<=b['dest']['y']+1 and b['left']['bottom']<=b['order']['y']+1,(width,b)
                  assert close(a['bar']['w'],b['bar']['w'],3) and close(a['bar']['h'],b['bar']['h'],3),(width,a,b)
              print('GEOMETRY_OK',width,'SHOP',a,'PRODUCER',b)
          check(1440); check(900); check(390)

          load('/en/store/1957/',390); w=WebDriverWait(d,20); w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .mdo-ps-toolbar-ready')))
          assert 'Shipping to' in d.find_element(By.CSS_SELECTOR,'#wcfmmp-store [data-mdo-ps-destination-open]').text
          assert len(d.find_elements(By.CSS_SELECTOR,'head [data-mdo-toolbar-critical-first-paint="1"]'))==1

          load('/tienda/1957/',390,'GR'); w=WebDriverWait(d,20); bar=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized')))
          assert c(bar,'backgroundColor')=='rgb(255, 255, 255)'; assert len(d.find_elements(By.CSS_SELECTOR,'ul.products li.product,.products .product'))==0
          assert d.find_element(By.CSS_SELECTOR,'#wcfmmp-store [data-mdo-ps-destination-open]').is_displayed()
          print('EN_BLOCKED_OK')
          d.quit()
          PY
          CODE=$?
          set -e
          [ "$CODE" = 0 ] || fail 'selenium geometry verification failed'

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BG' '$BU' '$BP'" || true
          echo 'catalog_toolbar_final_unification_ok' | tee -a "$STATUS"
          echo 0 > "$EXIT"

      - name: Record result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-toolbar-final-unification-20260821.* || true
          if ! git diff --cached --quiet; then git commit -m 'Record final toolbar unification [skip ci]'; git pull --rebase origin main || true; git push origin HEAD:main; fi

      - name: Assert success
        if: always()
        run: |
          test -f .deploy-status/catalog-toolbar-final-unification-20260821.exit-code
          test "$(cat .deploy-status/catalog-toolbar-final-unification-20260821.exit-code)" = 0

name: Diagnose production English checkout 500 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-english-checkout-diagnostic-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Probe Spanish and English commerce routes
        shell: bash
        run: |
          set -euo pipefail
          base=https://www.elmercadodeorigen.com
          for path in /finalizar-compra/ /en/finalizar-compra/ /carrito/ /en/carrito/ /mi-cuenta/ /en/mi-cuenta/; do
            echo "=== $path ==="
            curl -ksS --max-time 60 -D /tmp/h.txt -o /tmp/b.html "$base$path?mdo_diag=${GITHUB_RUN_ID}" || true
            head -n 30 /tmp/h.txt || true
            echo BODY_BYTES=$(wc -c </tmp/b.html 2>/dev/null || echo 0)
            grep -Eio '<title[^>]*>[^<]*</title>|Fatal error[^<]*|Uncaught[^<]*|WordPress database error[^<]*' /tmp/b.html | head -n 20 || true
          done
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect production PHP and WordPress logs around checkout failure
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "PROD_PATH=$PROD_PATH"
          echo '=== wp debug constants ==='
          grep -nE "WP_DEBUG|WP_DEBUG_LOG|WP_DEBUG_DISPLAY" "$PROD_PATH/wp-config.php" || true
          echo '=== candidate logs ==='
          for f in \
            "$PROD_PATH/wp-content/debug.log" \
            "$PROD_PATH/error_log" \
            "$(dirname "$PROD_PATH")/logs/error_log" \
            "$(dirname "$PROD_PATH")/logs/proxy_error_log" \
            "$(dirname "$PROD_PATH")/logs/php_errors.log"; do
            if [ -f "$f" ]; then echo "--- $f ---"; tail -n 180 "$f" | grep -Ei -B 6 -A 15 'fatal|uncaught|translatepress|checkout|finalizar|woocommerce|mdo-production-native-render-bridge' || tail -n 80 "$f"; fi
          done
          echo '=== newest logs under vhost ==='
          find "$(dirname "$PROD_PATH")" -maxdepth 3 -type f \( -name '*error*log*' -o -name 'debug.log' \) -mmin -60 -print 2>/dev/null | while read -r f; do echo "--- $f ---"; tail -n 100 "$f" | grep -Ei -B 5 -A 15 'fatal|uncaught|translatepress|checkout|finalizar|woocommerce|mdo-production-native-render-bridge' || true; done
          REMOTE
      - name: Inspect checkout-related plugins and relevant hooks
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          echo '=== active checkout/cart plugins ==='
          "$php_bin" "$wp_bin" plugin list --status=active --fields=name,version --format=csv --path="$PROD_PATH" --allow-root 2>/dev/null | grep -Ei 'checkout|cart|woo|discount|payment|stripe|paypal|yith|wcfm|translate' || true
          echo '=== current commerce page IDs ==='
          for opt in woocommerce_cart_page_id woocommerce_checkout_page_id woocommerce_myaccount_page_id; do printf '%s=' "$opt"; "$php_bin" "$wp_bin" option get "$opt" --path="$PROD_PATH" --allow-root 2>/dev/null || true; done
          echo '=== checkout page content ==='
          id=$("$php_bin" "$wp_bin" option get woocommerce_checkout_page_id --path="$PROD_PATH" --allow-root 2>/dev/null || true)
          [ -n "$id" ] && "$php_bin" "$wp_bin" post get "$id" --field=post_content --path="$PROD_PATH" --allow-root 2>/dev/null || true
          REMOTE

name: Editorial guides bilingual deploy 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-editorial-guides-20260821.php'
      - 'mu-plugins/mdo-english-journal-content-20260821.php'
      - '.github/workflows/editorial-guides-deploy-20260821.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-guides-bilingual-20260821
  cancel-in-progress: false

jobs:
  publish-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-editorial-guides-20260821.php
          php -l mu-plugins/mdo-english-journal-content-20260821.php
          test "$(grep -c "'key'         =>" .github/scripts/publish-editorial-guides-20260821.php)" -eq 6
          grep -q "_en_US_post_content" .github/scripts/publish-editorial-guides-20260821.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Publish in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-english-journal-content-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-journal-content-20260821.php"

          REMOTE="/tmp/publish-editorial-guides-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/publish-editorial-guides-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" | tee /tmp/editorial-publish.json
          python3 -m json.tool /tmp/editorial-publish.json >/dev/null
          test "$(python3 -c "import json; print(len(json.load(open('/tmp/editorial-publish.json'))['posts']))")" -eq 6
          test "$(python3 -c "import json; print(sum(1 for p in json.load(open('/tmp/editorial-publish.json'))['posts'] if p['status']=='publish' and int(p['image_id'])>0))")" -eq 6

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public Spanish and English articles
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.elmercadodeorigen.com"
          stamp="${GITHUB_RUN_ID}"

          check_page () {
            url="$1"; marker="$2"; lang="$3"
            file="/tmp/page-${marker}-${lang}.html"
            code="$(curl -k -L -sS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$file" -w '%{http_code}' "${url}?emdo_editorial_verify=${stamp}")"
            test "$code" = "200"
            grep -Fq "EMDO_EDITORIAL_20260821:${marker}" "$file"
            grep -Fq 'emo-article-featured' "$file"
            grep -Eq 'class="[^"]*products|class="[^"]*product' "$file"
          }

          check_page "$BASE/jamon-o-paleta-diferencias-cual-elegir/" jamon-o-paleta es
          check_page "$BASE/en/ham-or-shoulder-differences-how-to-choose/" jamon-o-paleta en
          check_page "$BASE/jamon-pieza-entera-o-loncheado-como-elegir/" pieza-o-loncheado es
          check_page "$BASE/en/whole-ham-or-sliced-how-to-choose-format/" pieza-o-loncheado en
          check_page "$BASE/aove-garrafa-5-litros-cuando-compensa-como-conservar/" aove-5-litros es
          check_page "$BASE/en/extra-virgin-olive-oil-5-litre-container-storage-guide/" aove-5-litros en
          check_page "$BASE/comprar-carne-online-que-mirar-antes-elegir-corte/" carne-online es
          check_page "$BASE/en/buying-meat-online-what-to-check-before-choosing-a-cut/" carne-online en
          check_page "$BASE/hortalizas-de-temporada-como-elegir-mejor/" hortalizas-temporada es
          check_page "$BASE/en/seasonal-vegetables-how-to-choose-better/" hortalizas-temporada en
          check_page "$BASE/legumbres-secas-remojo-coccion-como-elegir/" legumbres es
          check_page "$BASE/en/dried-pulses-soaking-cooking-how-to-choose/" legumbres en

          curl -k -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' "$BASE/blog/?emdo_editorial_verify=${stamp}" -o /tmp/blog-es.html
          grep -Fq 'Jamón o paleta ibérica' /tmp/blog-es.html
          grep -Fq 'AOVE en garrafa de 5 litros' /tmp/blog-es.html
          grep -Fq 'Legumbres secas' /tmp/blog-es.html

          curl -k -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' "$BASE/en/journal/?emdo_editorial_verify=${stamp}" -o /tmp/blog-en.html
          grep -Fq 'Iberian ham or shoulder' /tmp/blog-en.html
          grep -Fq 'Extra virgin olive oil in a 5-litre container' /tmp/blog-en.html
          grep -Fq 'Dried pulses' /tmp/blog-en.html

          echo 'EMDO_EDITORIAL_PUBLIC_VERIFY_OK'

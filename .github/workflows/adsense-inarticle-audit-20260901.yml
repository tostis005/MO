name: Audit in-article AdSense delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-inarticle-audit-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Verify production placement contract
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          [ -n "$wp_bin" ] || { echo "WP-CLI not found"; exit 1; }
          [ -n "$php_bin" ] || { echo "PHP not found"; exit 1; }

          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?production path not found}"

          contract=$("$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            $p = "<p>" . str_repeat("Parrafo editorial suficientemente largo para validar la colocacion automatica dentro del articulo. ", 2) . "</p>";
            $medium = str_repeat($p, 10);
            $long = str_repeat($p, 15);
            $medium_out = elmercado_adsense_insert_inarticle_placeholders_010278($medium);
            $long_out = elmercado_adsense_insert_inarticle_placeholders_010278($long);
            echo "MEDIUM_COUNT=" . substr_count($medium_out, "data-emo-inarticle-ad=") . "\n";
            echo "LONG_COUNT=" . substr_count($long_out, "data-emo-inarticle-ad=") . "\n";
            echo "SLOT=" . ELMERCADO_ADSENSE_INARTICLE_SLOT . "\n";
            $post = get_page_by_path("dop-jabugo-que-garantiza-territorio-como-reconocer-jamon", OBJECT, "post");
            echo "JABUGO_URL=" . ($post instanceof WP_Post ? get_permalink($post) : "") . "\n";
          ' 2>/dev/null)
          printf '%s\n' "$contract"
          grep -qx 'MEDIUM_COUNT=2' <<< "$contract"
          grep -qx 'LONG_COUNT=3' <<< "$contract"
          grep -qx 'SLOT=2804638564' <<< "$contract"
          jabugo_url=$(sed -n 's/^JABUGO_URL=//p' <<< "$contract")
          test -n "$jabugo_url"

          nonce=$(date +%s)
          html=$(curl -fsSL --max-time 25 "${jabugo_url}?inarticle_audit=${nonce}")
          count=$(grep -o 'data-emo-inarticle-ad=' <<< "$html" | wc -l | tr -d ' ')
          echo "JABUGO_PLACEHOLDERS=$count"
          test "$count" -ge 2
          grep -q 'elmercado-adsense-inarticle-010278' <<< "$html"
          grep -q 'inArticleSlot' <<< "$html"
          grep -q '2804638564' <<< "$html"
          echo "PLACEMENT_CONTRACT=PASS"
          REMOTE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Verify eligible and blocked browsers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL = 'https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsense_debug=1&inarticle_browser_audit=1'

          def run(country):
              o = Options()
              o.page_load_strategy = 'eager'
              for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=390,844','--lang=es-ES'):
                  o.add_argument(arg)
              d = webdriver.Chrome(options=o)
              d.set_page_load_timeout(60)
              try:
                  d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument', {'source': f'''(() => {{
                    const f = window.fetch;
                    window.fetch = function(input, init) {{
                      const u = typeof input === 'string' ? input : (input && input.url) || '';
                      if (u.includes('/wp-json/elmercado/v1/adsense-eligibility')) {{
                        init = Object.assign({{}}, init || {{}});
                        const h = new Headers(init.headers || {{}});
                        h.set('X-Country-Code', '{country}');
                        init.headers = h;
                      }}
                      return f.call(this, input, init);
                    }};
                  }})();'''})
                  d.get(URL + '&country=' + country)
                  time.sleep(12)
                  state = d.execute_script('''
                    const slots = Array.from(document.querySelectorAll('.emo-inarticle-ad-slot[data-emo-inarticle-ad]'));
                    return {
                      debug: window.ElMercadoAdsenseGeoDebug || null,
                      placeholders: slots.length,
                      hydrated: slots.filter(x=>x.getAttribute('data-emo-inarticle-hydrated')==='1').length,
                      requestedClass: slots.filter(x=>x.classList.contains('is-requested')).length,
                      filledClass: slots.filter(x=>x.classList.contains('is-filled')).length,
                      units: slots.map(x=>{ const i=x.querySelector('ins.adsbygoogle'); return i ? {slot:i.getAttribute('data-ad-slot'), layout:i.getAttribute('data-ad-layout'), format:i.getAttribute('data-ad-format'), status:i.getAttribute('data-ad-status')} : null; })
                    };
                  ''')
                  print(country + '_STATE=' + json.dumps(state, sort_keys=True), flush=True)
                  return state
              finally:
                  d.quit()

          za = run('ZA')
          es = run('ES')

          assert za['placeholders'] >= 2, za
          assert za['hydrated'] == za['placeholders'], za
          assert za['requestedClass'] == za['placeholders'], za
          assert za['debug']['showAds'] is True, za
          assert all(x and x['slot'] == '2804638564' and x['layout'] == 'in-article' and x['format'] == 'fluid' for x in za['units']), za

          assert es['placeholders'] >= 2, es
          assert es['hydrated'] == 0, es
          assert es['requestedClass'] == 0, es
          assert es['debug']['showAds'] is False, es
          assert all(x is None for x in es['units']), es
          print('INARTICLE_BROWSER_CONTRACT=PASS', flush=True)
          PY

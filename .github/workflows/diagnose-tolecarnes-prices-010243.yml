name: Diagnose Tolecarnes prices 0.10.243

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tolecarnes-prices-010243.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production Tolecarnes pricing
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"

          cat > /tmp/diag-tolecarnes-010243.php <<'PHP'
          <?php
          if ( ! defined('ABSPATH') ) exit;
          global $wpdb;
          $supplier_table = MDO_Database::table('suppliers');
          $source_table   = MDO_Database::table('source_products');
          $suppliers = $wpdb->get_results("SELECT id,name,connector,source_url,vendor_user_id,last_sync_at FROM {$supplier_table} WHERE connector='tolecarnes' OR LOWER(name) LIKE '%tolecarnes%'", ARRAY_A);
          echo "SUPPLIERS=" . wp_json_encode($suppliers, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE) . "\n";
          $supplier_id = $suppliers ? (int)$suppliers[0]['id'] : 0;
          $urls = [
            'https://tolecarnes.com/producto/huesos-de-ternera-arr',
            'https://tolecarnes.com/producto/burger-de-ternera-sin-gluten-awh',
          ];
          foreach ($urls as $url) {
            echo "\nURL={$url}\n";
            try {
              $raw = MDO_Connector_Tolecarnes::scrape_product($url);
              echo "SCRAPE_RAW=" . wp_json_encode(['title'=>$raw['title']??null,'price'=>$raw['price']??null,'variations'=>$raw['variations']??null,'stock'=>$raw['stock_status']??null,'source_hash'=>$raw['source_hash']??null], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE) . "\n";
              $norm = MDO_Text::normalize_product($raw);
              echo "SCRAPE_NORMALIZED=" . wp_json_encode(['title'=>$norm['title']??null,'price'=>$norm['price']??null,'regular_price'=>$norm['regular_price']??null,'sale_price'=>$norm['sale_price']??null,'discount'=>$norm['discount_percent']??null,'variations'=>$norm['variations']??null,'source_hash'=>$norm['source_hash']??null], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE) . "\n";
            } catch (Throwable $e) { echo "SCRAPE_ERROR=".$e->getMessage()."\n"; }

            $resp = wp_remote_get($url,['timeout'=>20,'redirection'=>5,'user-agent'=>'EMDO diagnostic 0.10.243','headers'=>['Accept'=>'text/html,application/xhtml+xml']]);
            if (is_wp_error($resp)) { echo "HTTP_ERROR=".$resp->get_error_message()."\n"; continue; }
            $html = (string)wp_remote_retrieve_body($resp);
            echo "HTTP_STATUS=".(int)wp_remote_retrieve_response_code($resp)." BYTES=".strlen($html)."\n";
            $dom=new DOMDocument(); $prev=libxml_use_internal_errors(true); $dom->loadHTML('<?xml encoding="utf-8" ?>'.$html, LIBXML_NOWARNING|LIBXML_NOERROR|LIBXML_NONET); libxml_clear_errors(); libxml_use_internal_errors($prev); $xp=new DOMXPath($dom);
            $summary=[];
            foreach ($xp->query("//*[contains(concat(' ', normalize-space(@class), ' '), ' summary ')]//*[contains(concat(' ', normalize-space(@class), ' '), ' price ')]") ?: [] as $n) $summary[] = trim(preg_replace('/\s+/u',' ', $n->textContent));
            echo "SUMMARY_PRICES=".wp_json_encode($summary, JSON_UNESCAPED_UNICODE)."\n";
            $jsonOffers=[];
            foreach ($xp->query("//script[contains(translate(@type,'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'),'ld+json')]") ?: [] as $script) {
              $data=json_decode(trim((string)$script->textContent),true); if(!is_array($data)) continue;
              $walk=function($node) use (&$walk,&$jsonOffers) { if(!is_array($node)) return; $type=$node['@type']??null; $types=is_array($type)?$type:[$type]; if(in_array('Product',$types,true)) $jsonOffers[]=['name'=>$node['name']??null,'offers'=>$node['offers']??null]; foreach($node as $v) if(is_array($v)) $walk($v); };
              $walk($data);
            }
            echo "JSONLD_PRODUCTS=".wp_json_encode($jsonOffers, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";

            if ($supplier_id) {
              $row=$wpdb->get_row($wpdb->prepare("SELECT id,title,source_url,source_price,status,wc_product_id,source_payload,last_seen_at,last_changed_at,last_error FROM {$source_table} WHERE supplier_id=%d AND source_url=%s ORDER BY id DESC LIMIT 1",$supplier_id,$url),ARRAY_A);
              if (!$row) {
                $needle = str_contains($url,'huesos') ? '%huesos%' : '%burger%';
                $row=$wpdb->get_row($wpdb->prepare("SELECT id,title,source_url,source_price,status,wc_product_id,source_payload,last_seen_at,last_changed_at,last_error FROM {$source_table} WHERE supplier_id=%d AND LOWER(title) LIKE %s ORDER BY id DESC LIMIT 1",$supplier_id,$needle),ARRAY_A);
              }
              if($row){
                $payload=json_decode((string)$row['source_payload'],true); unset($row['source_payload']);
                $row['payload_price']=$payload['price']??null; $row['payload_regular']=$payload['regular_price']??null; $row['payload_sale']=$payload['sale_price']??null; $row['payload_discount']=$payload['discount_percent']??null;
                $pid=(int)$row['wc_product_id'];
                if($pid && function_exists('wc_get_product')) { $p=wc_get_product($pid); $row['woo']=$p?['name'=>$p->get_name(),'type'=>$p->get_type(),'price'=>$p->get_price(),'regular'=>$p->get_regular_price(),'sale'=>$p->get_sale_price(),'status'=>$p->get_status(),'permalink'=>$p->get_permalink()]:null; }
                echo "DB_ROW=".wp_json_encode($row,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
              } else echo "DB_ROW=null\n";
            }
          }
          PHP
          sshpass -e scp $SCP /tmp/diag-tolecarnes-010243.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/diag-tolecarnes-010243.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" eval-file '$PROD_PATH/diag-tolecarnes-010243.php' --path='$PROD_PATH' --allow-root; rm -f '$PROD_PATH/diag-tolecarnes-010243.php'"

name: Production language switcher audit 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-language-switcher-audit-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect language switcher placement
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=768M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          echo '=== TRP SETTINGS ==='
          wp option get trp_settings --format=json 2>/dev/null || true
          echo '=== NAV LOCATIONS + ITEMS ==='
          wp eval '
            $locs=get_nav_menu_locations();
            foreach($locs as $loc=>$id){$menu=wp_get_nav_menu_object($id); echo "LOCATION {$loc} => {$id} ".($menu?$menu->name:"")."\n"; if($menu){foreach(wp_get_nav_menu_items($menu->term_id)?:[] as $i){echo "  ITEM {$i->ID} | {$i->title} | {$i->url} | classes=".implode(",",(array)$i->classes)."\n";}}}
          ' 2>/dev/null || true
          echo '=== SIDEBARS ==='
          wp eval 'print_r(wp_get_sidebars_widgets());' 2>/dev/null || true
          echo '=== WIDGET OPTIONS WITH LANGUAGE/TRP ==='
          wp db query "SELECT option_name, LEFT(option_value,1000) FROM $(wp db prefix)options WHERE option_name LIKE 'widget_%' AND (option_value LIKE '%translatepress%' OR option_value LIKE '%trp%' OR option_value LIKE '%language%') LIMIT 50;" --skip-column-names 2>/dev/null || true
          echo '=== POSTS/MENUS CONTAINING TRP OR LANGUAGE SWITCHER ==='
          wp db query "SELECT ID,post_type,post_title,LEFT(post_content,500) FROM $(wp db prefix)posts WHERE post_content REGEXP 'translatepress|trp_|language[-_ ]switch|language-switch' LIMIT 50;" --skip-column-names 2>/dev/null || true
          echo '=== HOMEPAGE SWITCHER HTML ==='
          curl -fsSL https://www.elmercadodeorigen.com/ | grep -oEi '.{0,180}(trp-language-switcher|translatepress|language-switcher|switcher).{0,420}' | head -n 20 || true
          REMOTE

name: Patch EMDO rich description JSON escaping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-emdo-rich-json-escaping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escape closing tags while rich HTML travels through JSON-LD
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mdo-supplier-sync/includes/class-mdo-rich-description-source.php')
          text = path.read_text()
          old = "wp_json_encode( $data, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE )"
          new = "wp_json_encode( $data, JSON_UNESCAPED_UNICODE )"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one JSON encoder occurrence, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          php -l mdo-supplier-sync/includes/class-mdo-rich-description-source.php
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mdo-supplier-sync/includes/class-mdo-rich-description-source.php
          git diff --cached --quiet && exit 0
          git commit -m 'Escape rich HTML closing tags in JSON-LD transport'
          git push

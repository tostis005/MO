name: Audit live CMP settings for AdSense

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-consent-audit-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Inspect production CMP configuration
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?production path not found}"

          echo '--- PLUGIN ---'
          "$php_bin" -d memory_limit=256M "$wp_bin" plugin get cookie-law-info --path="$prod_path" --fields=name,status,version --format=json --allow-root 2>/dev/null || true

          echo '--- TCF/GCM OPTION NAMES ---'
          "$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            global $wpdb;
            $names = $wpdb->get_col("SELECT option_name FROM {$wpdb->options} WHERE option_name LIKE '%cookie%' OR option_name LIKE '%cli%' OR option_name LIKE '%wcc%' ORDER BY option_name");
            foreach ($names as $name) {
              $value = get_option($name);
              $encoded = wp_json_encode($value);
              if (stripos($encoded, "tcf") !== false || stripos($encoded, "consent_mode") !== false || stripos($encoded, "additional_consent") !== false || stripos($encoded, "geo") !== false) {
                echo "OPTION|" . $name . "|" . substr($encoded, 0, 6000) . "\n";
              }
            }
          ' 2>/dev/null || true

          echo '--- PLUGIN SOURCE TCF KEYS ---'
          plugin_dir="$prod_path/wp-content/plugins/cookie-law-info"
          if [ -d "$plugin_dir" ]; then
            grep -RInE "IAB TCF|iab[_ -]?tcf|tcf[_ -]?enable|additional[_ -]?consent|consent[_ -]?mode" "$plugin_dir" --include='*.php' --include='*.js' 2>/dev/null | head -n 120 || true
          fi
          REMOTE

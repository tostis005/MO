name: Montjam browser format audit 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/montjam-browser-format-audit-20260923.yml'
      - '.github/scripts/montjam-browser-format-audit-20260923.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: |
          python3 -m pip install --quiet selenium
          google-chrome --version || chromium-browser --version || chromium --version
      - name: Run browser audit across all 34 published weight variants
        run: |
          python3 .github/scripts/montjam-browser-format-audit-20260923.py

name: Production audit English source metadata 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-audit-english-source-metadata-20260816.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Scan reviewed English metadata for Spanish residuals
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          cat >/tmp/mdo-en-meta-audit.php <<'PHP'
          <?php
          ini_set('memory_limit','512M'); require $argv[1].'/wp-load.php'; global $wpdb;
          $rx='/\\b(?:carrito|tienda|comprar|producto|productos|productores|envío|envíos|devolución|selección|tamaño|variedad|alimentación|calidad|curación|preparación|raza ibérica|pedido mínimo|te faltan|para alcanzar|política|privacidad|suscríbete|descuento|primera compra|introduzca|añadir al carrito|cortado|deshuesado|loncheado|pieza|caja de|bote de|botella|lata de|saco de|tarro de|sin filtrar|tradicional|naranja|miel|garbanzos|lentejas|almendras)\\b/iu';
          $rows=$wpdb->get_results("SELECT p.ID,p.post_type,p.post_title,pm.meta_key,pm.meta_value FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID WHERE p.post_status='publish' AND pm.meta_key IN ('_en_US_post_title','_en_US_post_excerpt','_en_US_post_content') AND pm.meta_value<>'' ORDER BY p.post_type,p.ID");
          $hits=0;
          foreach($rows as $r){ $plain=trim(preg_replace('/\\s+/u',' ',wp_strip_all_tags((string)$r->meta_value))); if(preg_match($rx,$plain)){ $hits++; echo "POST|{$r->post_type}|{$r->ID}|{$r->post_title}|{$r->meta_key}|".mb_substr($plain,0,280)."\n"; }}
          echo "POST_HITS={$hits}\n";
          $taxes=get_taxonomies([], 'names'); $termhits=0;
          foreach($taxes as $tax){ if(strpos($tax,'pa_')!==0 && !in_array($tax,['product_cat','product_tag'],true)) continue; $terms=get_terms(['taxonomy'=>$tax,'hide_empty'=>false]); if(is_wp_error($terms)) continue; foreach($terms as $t){ $v=(string)get_term_meta($t->term_id,'_en_US_name',true); if($v==='') continue; $plain=trim(preg_replace('/\\s+/u',' ',wp_strip_all_tags($v))); if(preg_match($rx,$plain)){ $termhits++; echo "TERM|{$tax}|{$t->term_id}|{$t->slug}|ES={$t->name}|EN={$plain}\n"; }} }
          echo "TERM_HITS={$termhits}\n";
          PHP
          "$PHP" -d memory_limit=512M /tmp/mdo-en-meta-audit.php "$ROOT" 2>/dev/null | head -n 600
          REMOTE

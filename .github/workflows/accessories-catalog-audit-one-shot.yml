name: Accessories catalog final audit one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessories-catalog-audit-one-shot.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify exact accessory data in development and production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          dev_path=""
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve development WordPress root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$dev_path/wp-config.php" ] && [ -f "$prod_path/wp-config.php" ]

          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ]

          make_code() {
            jamonero_id="$1"
            cuchillo_id="$2"
            cat <<PHP
          if ('1.0.1' !== (string) get_option('mdo_accessories_catalog_version','')) { fwrite(STDERR,"Wrong accessories migration version\n"); exit(41); }
          \$term = get_term_by('slug','accesorios','product_cat');
          if (!\$term instanceof WP_Term) { fwrite(STDERR,"Accesorios category missing\n"); exit(42); }
          \$ids = get_objects_in_term((int)\$term->term_id,'product_cat');
          if (is_wp_error(\$ids)) { fwrite(STDERR,\$ids->get_error_message()."\n"); exit(43); }
          \$ids = array_values(array_unique(array_map('intval',\$ids)));
          sort(\$ids);
          \$expected = array(${jamonero_id},${cuchillo_id}); sort(\$expected);
          if (\$ids !== \$expected) { fwrite(STDERR,"Unexpected Accesorios IDs: ".wp_json_encode(\$ids)."\n"); exit(44); }
          \$checks = array(${jamonero_id}=>'Jamonero',${cuchillo_id}=>'Cuchillo');
          foreach (\$checks as \$id=>\$expected_type) {
            \$p=wc_get_product(\$id);
            if (!\$p instanceof WC_Product) { fwrite(STDERR,"Missing accessory \$id\n"); exit(45); }
            \$types=wp_get_post_terms(\$id,'pa_tipo-producto',array('fields'=>'names'));
            if (is_wp_error(\$types) || \$types !== array(\$expected_type)) { fwrite(STDERR,"Wrong type for \$id: ".wp_json_encode(\$types)."\n"); exit(46); }
          }
          echo wp_json_encode(array('category'=>'Accesorios','ids'=>\$ids,'jamonero'=>${jamonero_id},'cuchillo'=>${cuchillo_id}),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          }

          echo '=== DEVELOPMENT FINAL ACCESSORIES ==='
          dev_code="$(make_code 4067 11403)"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$dev_code" --path="$dev_path" --allow-root
          echo

          echo '=== PRODUCTION FINAL ACCESSORIES ==='
          prod_code="$(make_code 4067 12587)"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$prod_code" --path="$prod_path" --allow-root
          echo
          echo 'ACCESSORIES_BOTH_ENVIRONMENTS_QA=passed'
          REMOTE
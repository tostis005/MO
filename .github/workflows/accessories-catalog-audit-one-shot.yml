name: Accessories catalog audit one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessories-catalog-audit-one-shot.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit matching products in development and production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          dev_path=""
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve staging WordPress root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$dev_path/wp-config.php" ] && [ -f "$prod_path/wp-config.php" ]

          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ]

          code="$(cat <<'PHP'
          $ids = wc_get_products(array('limit'=>-1,'return'=>'ids','status'=>array('publish','private','draft','pending')));
          $out = array();
          foreach ($ids as $id) {
              $p = wc_get_product($id);
              if (!$p instanceof WC_Product || $p->is_type('variation')) { continue; }
              $n = strtolower(remove_accents(wp_strip_all_tags($p->get_name())));
              if (!preg_match('/\\b(cuchillo|cuchillos|jamonero|jamoneros)\\b/u', $n)) { continue; }
              $cats = wp_get_post_terms($p->get_id(), 'product_cat', array('fields'=>'names'));
              $types = taxonomy_exists('pa_tipo-producto') ? wp_get_post_terms($p->get_id(), 'pa_tipo-producto', array('fields'=>'names')) : array();
              $out[] = array('id'=>$p->get_id(),'name'=>$p->get_name(),'categories'=>is_wp_error($cats)?array():$cats,'tipo_producto'=>is_wp_error($types)?array():$types);
          }
          echo wp_json_encode($out, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT);
          PHP
          )"

          echo '=== DEVELOPMENT ACCESSORIES MATCHES ==='
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$code" --path="$dev_path" --allow-root
          echo
          echo '=== PRODUCTION ACCESSORIES MATCHES ==='
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$code" --path="$prod_path" --allow-root
          echo
          REMOTE
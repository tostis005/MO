name: Producer toolbar design v3 production

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-design-v3-production-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: |
          php -l mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php
          php -l mu-plugins/zzzzzz-mdo-producer-toolbar-static-guard-20260821.php

      - name: Deploy and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          python -m pip install --quiet selenium
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/producer-toolbar-design-v3-20260821.txt
          EXIT=.deploy-status/producer-toolbar-design-v3-20260821.exit-code
          : > "$STATUS"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          UX="$PROD_PATH/wp-content/mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php"
          GUARD="$PROD_PATH/wp-content/mu-plugins/zzzzzz-mdo-producer-toolbar-static-guard-20260821.php"
          UX_BAK="/tmp/mdo-toolbar-v3-ux-${GITHUB_RUN_ID}.bak"
          GUARD_BAK="/tmp/mdo-toolbar-v3-guard-${GITHUB_RUN_ID}.bak"
          UX_REMOTE="/tmp/mdo-toolbar-v3-ux-${GITHUB_RUN_ID}.php"
          GUARD_REMOTE="/tmp/mdo-toolbar-v3-guard-${GITHUB_RUN_ID}.php"
          AUDIT="/tmp/mdo-toolbar-v3-audit-${GITHUB_RUN_ID}.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "[ ! -f '$UX' ] || cp '$UX' '$UX_BAK'; [ ! -f '$GUARD' ] || cp '$GUARD' '$GUARD_BAK'"
          rollback(){
            echo 'ROLLBACK producer toolbar design v3' | tee -a "$STATUS"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
              if [ -f '$UX_BAK' ]; then cp '$UX_BAK' '$UX'; else rm -f '$UX'; fi
              if [ -f '$GUARD_BAK' ]; then cp '$GUARD_BAK' '$GUARD'; else rm -f '$GUARD'; fi
              rm -f '$UX_REMOTE' '$GUARD_REMOTE' '$AUDIT' '$UX_BAK' '$GUARD_BAK'
              wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            " || true
          }
          fail(){ echo "FAIL: $1" | tee -a "$STATUS"; rollback; echo 2 > "$EXIT"; exit 2; }

          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php "$STAGING_USER@$STAGING_HOST:$UX_REMOTE"
          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzzz-mdo-producer-toolbar-static-guard-20260821.php "$STAGING_USER@$STAGING_HOST:$GUARD_REMOTE"
          sshpass -e scp $SCP_OPTIONS .github/scripts/verify-producer-store-safe-20260821.php "$STAGING_USER@$STAGING_HOST:$AUDIT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            cp '$UX_REMOTE' '$UX'; cp '$GUARD_REMOTE' '$GUARD'; rm -f '$UX_REMOTE' '$GUARD_REMOTE'
            wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$UX'; \"\$php_bin\" -l '$GUARD'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          " >> "$STATUS" 2>&1 || fail 'deploy/lint failed'

          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$AUDIT' --path='$PROD_PATH' --allow-root
          " >> "$STATUS" 2>&1
          AC=$?
          set -e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$AUDIT'" || true
          [ "$AC" = 0 ] || fail 'producer filtering/ranking audit failed'

          JSON="$(grep '^producer_store_safe_audit_ok ' "$STATUS" | tail -n1 | sed 's/^producer_store_safe_audit_ok //')"
          export MDO_SLUG="$(python -c 'import json,sys;print(json.loads(sys.argv[1])["sample_slug"])' "$JSON")"
          export MDO_BLOCKED="$(python -c 'import json,sys;print(json.loads(sys.argv[1])["sample_blocked_country"])' "$JSON")"
          export MDO_RUN="$GITHUB_RUN_ID"

          for path in /tienda/ /productores/ "/tienda/$MDO_SLUG/" "/en/store/$MDO_SLUG/"; do
            code=$(curl -ksS -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com$path?v3=$GITHUB_RUN_ID")
            echo "HTTP $code $path" | tee -a "$STATUS"
            [ "$code" = 200 ] || fail "HTTP $code $path"
          done

          set +e
          python - <<'PY' >> "$STATUS" 2>&1
          import os, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='https://www.elmercadodeorigen.com'; slug=os.environ['MDO_SLUG']; blocked=os.environ['MDO_BLOCKED']; run=os.environ['MDO_RUN']
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o)
          def rect(e): return d.execute_script('const r=arguments[0].getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom};',e)
          def css(e,p): return d.execute_script('return getComputedStyle(arguments[0])[arguments[1]]',e,p)
          def seed(path,country,width):
              d.set_window_size(width,1000); d.get(base+'/?seed='+run)
              for n in ('mdo_shipping_country','mdo_shipping_postcode'):
                  try:d.delete_cookie(n)
                  except:pass
              d.add_cookie({'name':'mdo_shipping_country','value':country,'domain':'www.elmercadodeorigen.com','path':'/'})
              d.add_cookie({'name':'mdo_shipping_postcode','value':'','domain':'www.elmercadodeorigen.com','path':'/'})
              d.get(base+path+('?v3='+run+f'-{width}-{country}')); time.sleep(2.2)
          def snap(path,width,producer=False,country='ES'):
              seed(path,country,width); w=WebDriverWait(d,25)
              sel='#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized.mdo-ps-toolbar-ready' if producer else 'body:not(.wcfmmp-store-page) .woostify-sorting.emo-catalog-toolbar-shared-010229'
              bar=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,sel)))
              count=bar.find_element(By.CSS_SELECTOR,'.woocommerce-result-count'); dest=bar.find_element(By.CSS_SELECTOR,'.mdo-catalog-destination--canonical'); order=bar.find_element(By.CSS_SELECTOR,'.woocommerce-ordering')
              trig=dest.find_element(By.CSS_SELECTOR,'.mdo-catalog-destination__trigger'); select=order.find_element(By.TAG_NAME,'select')
              s={'bar':rect(bar),'count':rect(count),'dest':rect(dest),'order':rect(order),'trig':rect(trig),'select':rect(select),'display':css(bar,'display'),'bg':css(bar,'backgroundColor'),'radius':css(bar,'borderRadius'),'tbg':css(trig,'backgroundColor'),'tc':css(trig,'color'),'sc':css(select,'color')}
              if producer:
                  legacy1=d.find_elements(By.ID,'elmercado-catalog-mobile-controls-parity-script-010236')
                  legacy2=d.find_elements(By.ID,'elmercado-vendor-toolbar-rhythm-final')
                  print('LEGACY_SCRIPTS',width,len(legacy1),len(legacy2))
                  assert not legacy1 and not legacy2,(width,'legacy scripts still present')
              print('SNAP',path,width,s); return s
          def inside(p,c): return c['x']>=p['x']-2 and c['right']<=p['right']+2 and c['y']>=p['y']-2 and c['bottom']<=p['bottom']+2

          for width in (1440,900,390):
              shop=snap('/tienda/',width,False); prod=snap(f'/tienda/{slug}/',width,True)
              for s in (shop,prod):
                  assert s['bg'] in ('rgb(255, 255, 255)','rgba(255, 255, 255, 1)'),s
                  assert s['tbg'] in ('rgb(248, 250, 248)','rgba(248, 250, 248, 1)'),s
                  assert s['tc'] in ('rgb(23, 63, 50)','rgba(23, 63, 50, 1)'),s
                  assert s['sc'] in ('rgb(23, 63, 50)','rgba(23, 63, 50, 1)'),s
                  assert all(inside(s['bar'],s[k]) for k in ('count','dest','order')),s
              assert shop['radius']==prod['radius'],(width,shop,prod)
              assert abs(shop['trig']['h']-prod['trig']['h'])<=2,(width,shop,prod)
              assert abs(shop['select']['h']-prod['select']['h'])<=2,(width,shop,prod)
              if width>640:
                  assert prod['display']=='flex',(width,prod)
                  assert 66<=prod['bar']['h']<=72,(width,prod)
                  centers=[prod[k]['y']+prod[k]['h']/2 for k in ('count','dest','order')]
                  assert max(centers)-min(centers)<=5,(width,prod)
              else:
                  assert prod['display']=='grid',(width,prod)
                  assert 135<=prod['bar']['h']<=145,(width,prod)
                  assert abs(shop['bar']['h']-prod['bar']['h'])<=5,(width,shop,prod)
                  assert prod['count']['bottom']<=prod['dest']['y']+2,(width,prod)
                  assert prod['dest']['bottom']<=prod['order']['y']+12,(width,prod)
                  assert 14<=prod['bar']['x']<=19,(width,prod)
                  assert prod['bar']['right']<=361,(width,prod)
                  assert prod['dest']['w']>=prod['bar']['w']-30,(width,prod)
                  assert prod['order']['w']>=prod['bar']['w']-30,(width,prod)

          en=snap(f'/en/store/{slug}/',390,True)
          assert 'Shipping to' in d.find_element(By.CSS_SELECTOR,'#wcfmmp-store .mdo-catalog-destination__trigger').text
          seed(f'/tienda/{slug}/',blocked,390)
          w=WebDriverWait(d,25); bar=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized'))); trig=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store [data-mdo-ps-destination-open]')))
          assert css(bar,'backgroundColor') in ('rgb(255, 255, 255)','rgba(255, 255, 255, 1)')
          assert len(d.find_elements(By.CSS_SELECTOR,'#wcfmmp-store ul.products li.product'))==0
          trig.click(); w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#mdo-ps-destination-dialog')))
          print('BLOCKED_OK',blocked,trig.text)
          d.quit()
          PY
          BC=$?
          set -e
          [ "$BC" = 0 ] || fail 'browser visual verification failed'

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$UX_BAK' '$GUARD_BAK'" || true
          echo 'producer_toolbar_design_v3_production_ok' | tee -a "$STATUS"
          echo 0 > "$EXIT"

      - name: Record result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-design-v3-20260821.* || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record producer toolbar design v3 result [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

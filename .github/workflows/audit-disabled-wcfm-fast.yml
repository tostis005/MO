name: Fast audit disabled WCFM vendor products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-disabled-wcfm-fast.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Read disabled vendors and products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          siteurl="$("$php_bin" "$wp_bin" option get siteurl --path="$prod" --allow-root --skip-plugins --skip-themes 2>/dev/null)"
          echo "SITEURL=$siteurl"
          "$php_bin" "$wp_bin" eval '
          global $wpdb;
          $users=get_users(array("orderby"=>"ID"));
          foreach($users as $u){
            $roles=array_map("sanitize_key",(array)$u->roles);
            $disabled=get_user_meta($u->ID,"_disable_vendor",true);
            $offline=get_user_meta($u->ID,"_wcfm_store_offline",true);
            if(!in_array("disable_vendor",$roles,true) && !$disabled && !$offline) continue;
            $settings=get_user_meta($u->ID,"wcfmmp_profile_settings",true);
            $name=is_array($settings)&&!empty($settings["store_name"])?$settings["store_name"]:(get_user_meta($u->ID,"store_name",true)?:$u->display_name);
            $ids=$wpdb->get_col($wpdb->prepare("SELECT ID FROM {$wpdb->posts} WHERE post_type=%s AND post_status=%s AND post_author=%d ORDER BY ID DESC LIMIT 3","product","publish",$u->ID));
            echo "DISABLED_VENDOR|{$u->ID}|".sanitize_text_field($name)."|roles=".implode(",",$roles)."|disable=".(string)$disabled."|store_offline=".(string)$offline."|sample_count=".count($ids)."\n";
            foreach($ids as $pid){$p=get_post($pid);$poff=get_post_meta($pid,"_wcfm_product_offline",true);echo "SAMPLE_PRODUCT|{$u->ID}|{$pid}|{$p->post_name}|offline=".(string)$poff."|".sanitize_text_field($p->post_title)."\n";}
          }
          ' --path="$prod" --allow-root --skip-plugins --skip-themes 2>/dev/null
          REMOTE

name: Audit Adsterra inner frame timing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-inner-frame-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Inspect Adsterra wrapper before timeout
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&inner_frame_audit=1'
          o=Options(); o.page_load_strategy='none'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
              (()=>{const f=window.fetch;window.fetch=function(input,init){
                const u=typeof input==='string'?input:(input&&input.url)||'';
                if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                  init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                  h.set('X-Country-Code','ZA');init.headers=h;
                }
                return f.call(this,input,init);
              };})();"""})
              d.get(URL)

              start=time.time()
              captured=False
              for n in range(1,31):
                  time.sleep(.1)
                  frames=d.find_elements('css selector','iframe[data-emo-adsterra-token]')
                  if not frames:
                      continue
                  f=frames[0]
                  parent=d.execute_script(r"""
                    const f=arguments[0],s=f.closest('[data-emo-adsterra-slot]');
                    return {
                      t:Math.round(performance.now()),
                      state:s&&s.getAttribute('data-emo-adsterra-state'),
                      unit:new URL(f.src).searchParams.get('unit'),
                      fw:Number(f.getAttribute('width')||0),
                      fh:Number(f.getAttribute('height')||0)
                    };
                  """,f)
                  d.switch_to.frame(f)
                  inner=d.execute_script(r"""
                    return {
                      bodyChildren:document.body?document.body.children.length:0,
                      iframes:Array.from(document.querySelectorAll('iframe')).map(x=>({
                        src:x.getAttribute('src')||'',
                        w:x.getAttribute('width')||'',
                        h:x.getAttribute('height')||'',
                        cw:x.clientWidth,ch:x.clientHeight
                      })),
                      imgs:Array.from(document.querySelectorAll('img')).map(x=>({
                        src:x.getAttribute('src')||'',complete:x.complete,nw:x.naturalWidth,nh:x.naturalHeight
                      })),
                      scripts:Array.from(document.scripts).map(s=>s.src||'[inline]'),
                      text:(document.body&&document.body.innerText||'').slice(0,200),
                      html:(document.body&&document.body.innerHTML||'').slice(0,1200)
                    };
                  """)
                  d.switch_to.default_content()
                  print('SAMPLE='+json.dumps({'elapsed':round(time.time()-start,2),'parent':parent,'inner':inner},sort_keys=True),flush=True)
                  if inner['iframes'] or inner['imgs'] or inner['text']:
                      captured=True
                  if time.time()-start>3.4:
                      break

              print('CREATIVE_STRUCTURE_SEEN='+str(captured),flush=True)
          finally:
              d.quit()
          PY

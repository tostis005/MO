name: Product visual audit screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-visual-audit-20260831.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Capture post-fix desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > capture-visual-audit.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
            const url='https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?visual_audit='+Date.now();
            for (const cfg of [
              {name:'desktop', width:1440, height:1000},
              {name:'mobile', width:390, height:844}
            ]) {
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height}});
              await page.goto(url,{waitUntil:'networkidle',timeout:90000});
              await page.screenshot({path:`visual-audit/${cfg.name}-product.jpg`,type:'jpeg',quality:24,fullPage:true});
              const metrics=await page.evaluate(()=>{
                const box=(sel)=>{const e=document.querySelector(sel); if(!e)return null; const r=e.getBoundingClientRect(); return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:getComputedStyle(e).display,margin:getComputedStyle(e).margin,padding:getComputedStyle(e).padding};};
                const style=(sel)=>{const e=document.querySelector(sel);if(!e)return null;const s=getComputedStyle(e);return {fontSize:s.fontSize,lineHeight:s.lineHeight,fontFamily:s.fontFamily,fontWeight:s.fontWeight,width:s.width,maxWidth:s.maxWidth,letterSpacing:s.letterSpacing,wordBreak:s.wordBreak,whiteSpace:s.whiteSpace,writingMode:s.writingMode,transform:s.transform,zoom:s.zoom,display:s.display,position:s.position};};
                const summary=document.querySelector('.product-summary');
                const summaryChildren=summary ? [...summary.children].map((e,i)=>{const r=e.getBoundingClientRect();return {i,tag:e.tagName,cls:e.className||'',h:Math.round(r.height),y:Math.round(r.y),display:getComputedStyle(e).display,text:(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,90)}}).filter(x=>x.h>0) : [];
                return {
                  root:style('html'), body:style('body'), titleStyle:style('.product_title'), shortStyle:style('.woocommerce-product-details__short-description'), summaryStyle:style('.summary'), summaryOuterStyle:style('.product-summary'),
                  bodyWidth:document.body.scrollWidth,pageHeight:document.documentElement.scrollHeight,
                  nav:box('.woostify-product-navigation'),product:box('.product-page-container'),gallery:box('.product-gallery'),summary:box('.product-summary'),tabs:box('.woocommerce-tabs'),desc:box('#tab-description'),related:box('.related'),relatedTitle:box('.related > h2'),
                  title:document.querySelector('.product_title')?.textContent.trim()||'', summaryChildren
                };
              });
              console.log('METRICS',cfg.name,JSON.stringify(metrics));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e); process.exit(1)});
          JS
          mkdir -p visual-audit
          node capture-visual-audit.js
          rm -f capture-visual-audit.js package.json package-lock.json
          rm -rf node_modules
      - name: Commit temporary screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-audit/
          git commit -m 'Refresh post-fix product audit screenshots'
          git pull --rebase origin main
          git push

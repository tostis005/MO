name: Inspect legacy English Read more source 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-blackfriday-readmore-diagnostic-20260815.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - run: npm install --no-save puppeteer-core@24 >/dev/null
      - name: Inspect visible Leer mas elements
        run: |
          cat > ./inspect.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const b=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          for(const url of ['https://www.elmercadodeorigen.com/en/inicio-black-friday-2/','https://www.elmercadodeorigen.com/en/inicio-bf/']){
            const p=await b.newPage();await p.goto(url+'?mdo_readmore='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await new Promise(r=>setTimeout(r,2500));
            const d=await p.evaluate(()=>[...document.querySelectorAll('body *')].filter(e=>(e.innerText||'').trim()==='Leer más'&&e.children.length===0).map(e=>({tag:e.tagName,cls:e.className,id:e.id,html:e.outerHTML,parent:e.parentElement?.outerHTML?.slice(0,3000)||'',grand:e.parentElement?.parentElement?.outerHTML?.slice(0,4500)||''})));
            console.log('URL',url,'MATCHES',JSON.stringify(d));await p.close();
          }await b.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./inspect.mjs

name: Retry direct Google Places lookup 0.10.287

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Query Google Places directly without exposing key
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)
          key=$(timeout 12s "${WP[@]}" option get grw_google_api_key --skip-plugins --skip-themes 2>/dev/null || true)
          if [ -z "$key" ]; then echo 'KEY=EMPTY'; exit 0; fi
          echo "KEY=SET length=${#key}"

          tmp=$(mktemp)
          code=$(curl -sS --connect-timeout 8 --max-time 25 -o "$tmp" -w '%{http_code}' \
            -X POST 'https://places.googleapis.com/v1/places:searchText' \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $key" \
            -H 'X-Goog-FieldMask: places.id,places.displayName,places.rating,places.userRatingCount,places.googleMapsUri' \
            --data '{"textQuery":"El Mercado de Origen","languageCode":"es"}' || true)
          echo "NEW_API_HTTP=$code"
          python3 - "$tmp" <<'PY'
          import json,sys
          try: j=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception as e: print('NEW_API_JSON=INVALID'); raise SystemExit
          if 'error' in j: print('NEW_API_STATUS='+str(j['error'].get('status','UNKNOWN')))
          for p in j.get('places',[])[:8]:
              print('PLACE name=%s id=%s rating=%s count=%s' % ((p.get('displayName') or {}).get('text',''),p.get('id',''),p.get('rating',''),p.get('userRatingCount','')))
          PY
          rm -f "$tmp"

          tmp=$(mktemp)
          code=$(curl -sS --connect-timeout 8 --max-time 25 -o "$tmp" -w '%{http_code}' --get \
            'https://maps.googleapis.com/maps/api/place/findplacefromtext/json' \
            --data-urlencode 'input=El Mercado de Origen' \
            --data-urlencode 'inputtype=textquery' \
            --data-urlencode 'fields=place_id,name,rating,user_ratings_total' \
            --data-urlencode 'language=es' \
            --data-urlencode "key=$key" || true)
          echo "LEGACY_HTTP=$code"
          python3 - "$tmp" <<'PY'
          import json,sys
          try: j=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: print('LEGACY_JSON=INVALID'); raise SystemExit
          print('LEGACY_STATUS='+str(j.get('status','UNKNOWN')))
          for p in j.get('candidates',[])[:8]: print('LEGACY_PLACE name=%s id=%s rating=%s count=%s' % (p.get('name',''),p.get('place_id',''),p.get('rating',''),p.get('user_ratings_total','')))
          PY
          rm -f "$tmp"
          REMOTE

name: Locate Google Place ID and test Trustpilot direct 0.10.288

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect identifiers and direct Trustpilot response
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)

          echo '=== GOOGLE PLACE IDS IN WP OPTIONS ==='
          timeout 20s "${WP[@]}" eval 'global $wpdb; $rows=$wpdb->get_results("SELECT option_name,option_value FROM {$wpdb->options}"); foreach($rows as $r){ if(preg_match_all("/ChIJ[A-Za-z0-9_-]{10,}/",(string)$r->option_value,$m)){ foreach(array_unique($m[0]) as $id) echo $r->option_name." ".$id."\n"; }}' --skip-plugins --skip-themes 2>/dev/null | head -n 100 || true

          echo '=== GRW OPTION NAMES ==='
          timeout 15s "${WP[@]}" eval 'global $wpdb; foreach($wpdb->get_col("SELECT option_name FROM {$wpdb->options} WHERE option_name LIKE \"%grw%\" ORDER BY option_name LIMIT 200") as $x) echo $x."\n";' --skip-plugins --skip-themes 2>/dev/null || true

          echo '=== TRUSTPILOT DIRECT ==='
          tmp=$(mktemp)
          code=$(curl -L -sS --compressed --connect-timeout 8 --max-time 25 -o "$tmp" -w '%{http_code}' \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Accept-Language: es-ES,es;q=0.9,en;q=0.8' \
            'https://es.trustpilot.com/review/elmercadodeorigen.com' || true)
          echo "TRUSTPILOT_HTTP=$code bytes=$(wc -c < "$tmp" 2>/dev/null || echo 0)"
          python3 - "$tmp" <<'PY'
          import re,sys,html
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          tests=[
            r'"numberOfReviews"\s*:\s*\{[^}]*?"total"\s*:\s*(\d+)',
            r'"numberOfReviews"\s*:\s*(\d+)',
            r'(\d{1,6})\s+opiniones',
            r'Opiniones\s*(?:<!--.*?-->)?\s*(\d{1,6})',
          ]
          vals=[]
          for p in tests:
              x=re.findall(p,s,re.I|re.S); print('PATTERN',p,'=>',x[:8]); vals.extend(x)
          for p in [r'"trustScore"\s*:\s*([0-5](?:\.\d+)?)',r'"score"\s*:\s*([0-5](?:\.\d+)?)']:
              print('SCORE_PATTERN',p,'=>',re.findall(p,s,re.I|re.S)[:8])
          PY
          rm -f "$tmp"
          REMOTE

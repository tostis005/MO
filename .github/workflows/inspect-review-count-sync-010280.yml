name: Inspect direct Google API configuration 0.10.285

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect key presence without exposing values
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)

          echo '=== OPTIONS CONTAINING GOOGLE-LIKE API KEY (NAMES ONLY) ==='
          timeout 20s "${WP[@]}" eval 'global $wpdb; $rows=$wpdb->get_results("SELECT option_name,option_value FROM {$wpdb->options}"); foreach($rows as $r){$v=(string)$r->option_value; if(strpos($v,"AIza")!==false || (preg_match("/(google|maps|places?)/i",(string)$r->option_name) && preg_match("/(api.?key|AIza)/i",$v))){echo $r->option_name."=KEY_PRESENT\n";}}' --skip-themes 2>/dev/null | sort -u | head -n 120 || true

          echo '=== FILES CONTAINING AIza KEY (PATHS ONLY) ==='
          timeout 25s grep -RIl --exclude='*.map' --exclude='*.min.js' 'AIza' "$PROD_PATH/wp-content/mu-plugins" "$PROD_PATH/wp-content/themes" "$PROD_PATH/wp-content/plugins" 2>/dev/null | sed "s#^$PROD_PATH/##" | head -n 120 || true

          echo '=== GOOGLE/MAPS OPTION NAMES ==='
          timeout 20s "${WP[@]}" eval 'global $wpdb; $rows=$wpdb->get_col("SELECT option_name FROM {$wpdb->options} WHERE option_name REGEXP \"google|maps|places?\" ORDER BY option_name LIMIT 300"); foreach($rows as $r){echo $r."\n";}' --skip-plugins --skip-themes 2>/dev/null | head -n 300 || true

          echo '=== RELEVANT SCHEDULED HOOKS ==='
          timeout 25s "${WP[@]}" cron event list --fields=hook,next_run_gmt,recurrence --format=csv 2>/dev/null | grep -Ei 'mentta|sync|import|vendor|store|product|feed' | head -n 200 || true
          REMOTE

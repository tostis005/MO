name: Locate current Google profile directly 0.10.290

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Query Google directly with browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({locale:'es-ES', userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'});
            const urls=[
              'https://www.google.com/search?hl=es&gl=es&q=%22El+Mercado+de+Origen%22+rese%C3%B1as',
              'https://www.google.com/search?hl=es&gl=es&q=%22El+Mercado+de+Origen%22+elmercadodeorigen.com',
              'https://www.google.com/maps/search/El+Mercado+de+Origen?hl=es'
            ];
            for (const url of urls) {
              const page=await ctx.newPage();
              const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3000);
              const text=(await page.locator('body').innerText()).replace(/\s+/g,' ');
              console.log('URL='+url);
              console.log('HTTP='+(resp?resp.status():'none'));
              console.log('HAS_NAME='+/El Mercado de Origen/i.test(text));
              for (const re of [/El Mercado de Origen.{0,500}/ig,/.{0,180}(?:4[,.]9|303|reseñas|opiniones).{0,300}/ig]) {
                const ms=text.match(re)||[];
                for(const m of ms.slice(0,10)) console.log('SNIP='+m.slice(0,800));
              }
              const html=await page.content();
              const ids=[...new Set((html.match(/ChIJ[A-Za-z0-9_-]{10,}/g)||[]))];
              console.log('PLACE_IDS='+ids.slice(0,20).join(','));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error('GOOGLE_ERROR='+e.message);process.exit(1)});
          JS

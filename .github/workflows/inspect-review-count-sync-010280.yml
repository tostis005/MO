name: Probe Google and Trustpilot direct sources 0.10.282

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct sources and production code
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 150s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)

          echo '=== CREDENTIAL NAMES ONLY ==='
          timeout 15s "${WP[@]}" eval '$c=get_defined_constants(true); foreach(($c["user"]??[]) as $k=>$v){if(preg_match("/(GOOGLE|MAPS|PLACE|TRUSTPILOT|TRUST)/i",$k)){echo $k."=SET\n";}}' --skip-plugins --skip-themes 2>/dev/null || true
          grep -Eio "define\(['\"][A-Za-z0-9_]*(GOOGLE|MAPS|PLACE|TRUSTPILOT|TRUST)[A-Za-z0-9_]*" "$PROD_PATH/wp-config.php" 2>/dev/null | sed -E "s/^define\(['\"]//" | sort -u || true

          echo '=== TRUSTPILOT DIRECT PAGE ==='
          tp=$(mktemp)
          timeout 25s curl -L -sS --compressed --connect-timeout 8 --max-time 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' 'https://es.trustpilot.com/review/elmercadodeorigen.com' -o "$tp" || true
          grep -Eio '.{0,160}(169|opiniones|reviews|numberOfReviews|trustScore).{0,220}' "$tp" | head -n 35 || true
          rm -f "$tp"

          echo '=== GOOGLE DIRECT MAPS PAGE ==='
          gm=$(mktemp)
          timeout 25s curl -L -sS --compressed --connect-timeout 8 --max-time 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' 'https://www.google.com/maps/search/?api=1&query=El%20Mercado%20de%20Origen' -o "$gm" || true
          echo "google_bytes=$(wc -c < "$gm" 2>/dev/null || echo 0)"
          grep -Eio '.{0,180}(303|4[,.]9|reseñas|reviews|El Mercado de Origen).{0,240}' "$gm" | head -n 45 || true
          rm -f "$gm"

          echo '=== SOURCE MATCHES ==='
          timeout 20s grep -RIn -E '303|169|Trustpilot|trustpilot|Google.{0,80}(review|reseñ)|review.{0,80}Google|sync.{0,80}(vendor|store|product)|wp_schedule_event|do_action\(' "$PROD_PATH/wp-content/mu-plugins" "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" 2>/dev/null | head -n 260 || true
          REMOTE

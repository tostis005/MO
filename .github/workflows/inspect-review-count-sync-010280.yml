name: Inspect direct review API credentials and sync hook 0.10.281

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production WordPress state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)

          echo '=== LIVE HOME MATCHES ==='
          curl -L -sS --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0 MDO direct-review diagnostic' -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/?review_diag=$(date +%s)" | tr '\n' ' ' | grep -Eio '.{0,220}(Google|Trustpilot|303|169|reseñas|reviews).{0,320}' | head -n 80 || true

          echo '=== DIRECT API CREDENTIAL CONSTANT NAMES ==='
          "${WP[@]}" eval '$c=get_defined_constants(true); foreach(($c["user"]??[]) as $k=>$v){if(preg_match("/(GOOGLE|MAPS|PLACE|TRUSTPILOT|TRUST)/i",$k)){echo $k."=SET\n";}}' --skip-plugins --skip-themes 2>/dev/null || true

          echo '=== DIRECT API ENV NAMES ==='
          env | cut -d= -f1 | grep -Ei 'GOOGLE|MAPS|PLACE|TRUSTPILOT|TRUST' | sort -u || true

          echo '=== RELEVANT OPTION NAMES ==='
          "${WP[@]}" eval 'global $wpdb; $rows=$wpdb->get_col("SELECT option_name FROM {$wpdb->options} WHERE option_name REGEXP \"google|maps|place|trustpilot|trust|review|sync|mentta\" ORDER BY option_name LIMIT 400"); foreach($rows as $r){echo $r."\n";}' --skip-plugins --skip-themes 2>/dev/null | head -n 400 || true

          echo '=== CRON HOOKS ==='
          "${WP[@]}" cron event list --fields=hook,next_run_gmt,recurrence --format=csv 2>/dev/null | grep -Ei 'sync|vendor|store|product|import|feed|mdo|mentta|review|trust|google' | head -n 220 || true

          echo '=== SOURCE MATCHES MU/THEME ==='
          grep -RIn -E '303|169|Trustpilot|trustpilot|Google.{0,80}(review|reseñ)|review.{0,80}Google|sync.{0,80}(vendor|store|product)|do_action\(.{0,80}sync|wp_schedule_event' "$PROD_PATH/wp-content/mu-plugins" "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" 2>/dev/null | head -n 320 || true

          echo '=== RELEVANT PLUGIN DIRS ==='
          find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | grep -Ei 'trust|review|google|sync|import|vendor|feed|mentta|wcfm' | sort || true
          REMOTE

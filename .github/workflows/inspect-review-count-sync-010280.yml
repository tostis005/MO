name: Validate direct Google Places lookup 0.10.286

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Query Google Places directly without exposing key
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)

          timeout 50s "${WP[@]}" eval '
          $key=(string)get_option("grw_google_api_key","");
          if($key===""){echo "KEY=EMPTY\n"; return;}
          echo "KEY=SET\n";
          $body=wp_json_encode(["textQuery"=>"El Mercado de Origen","languageCode"=>"es"]);
          $r=wp_remote_post("https://places.googleapis.com/v1/places:searchText",[
            "timeout"=>25,
            "headers"=>["Content-Type"=>"application/json","X-Goog-Api-Key"=>$key,"X-Goog-FieldMask"=>"places.id,places.displayName,places.rating,places.userRatingCount,places.googleMapsUri"],
            "body"=>$body,
          ]);
          if(is_wp_error($r)){echo "NEW_API_ERROR=".$r->get_error_code()."\n";} else {
            echo "NEW_API_HTTP=".(int)wp_remote_retrieve_response_code($r)."\n";
            $j=json_decode((string)wp_remote_retrieve_body($r),true);
            if(!empty($j["places"])&&is_array($j["places"])) foreach(array_slice($j["places"],0,8) as $p){
              $n=(string)($p["displayName"]["text"]??""); $id=(string)($p["id"]??""); $rating=$p["rating"]??""; $cnt=$p["userRatingCount"]??"";
              echo "PLACE name=".$n." id=".$id." rating=".$rating." count=".$cnt."\n";
            }
            if(isset($j["error"])) echo "NEW_API_STATUS=".(string)($j["error"]["status"]??"UNKNOWN")."\n";
          }
          $url="https://maps.googleapis.com/maps/api/place/findplacefromtext/json?input=".rawurlencode("El Mercado de Origen")."&inputtype=textquery&fields=place_id,name,rating,user_ratings_total&language=es&key=".rawurlencode($key);
          $r2=wp_remote_get($url,["timeout"=>25]);
          if(is_wp_error($r2)){echo "LEGACY_ERROR=".$r2->get_error_code()."\n";} else {
            echo "LEGACY_HTTP=".(int)wp_remote_retrieve_response_code($r2)."\n";
            $j2=json_decode((string)wp_remote_retrieve_body($r2),true);
            echo "LEGACY_STATUS=".(string)($j2["status"]??"UNKNOWN")."\n";
            if(!empty($j2["candidates"])&&is_array($j2["candidates"])) foreach(array_slice($j2["candidates"],0,8) as $p){echo "LEGACY_PLACE name=".(string)($p["name"]??"")." id=".(string)($p["place_id"]??"")." rating=".(string)($p["rating"]??"")." count=".(string)($p["user_ratings_total"]??"")."\n";}
          }
          ' --skip-themes 2>/dev/null
          REMOTE

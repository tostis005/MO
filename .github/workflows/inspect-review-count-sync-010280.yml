name: Probe exact Google Place review payload 0.10.284

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact Google Place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          u='https://www.google.com/maps/search/?api=1&query=Google&query_place_id=ChIJbbIJi58nQg0RgJroXR8DG_U'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'es-ES,es;q=0.9,en;q=0.8'})
          s=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          print('bytes',len(s))
          for token in ['El Mercado de Origen','4.9','4,9','303','reseñas','reviews']:
              ps=[m.start() for m in re.finditer(re.escape(token),s,re.I)]
              print(token,'hits',len(ps))
              for p in ps[:8]:
                  f=re.sub(r'\s+',' ',s[max(0,p-700):p+1000])
                  print('SNIP',f[:1700])
          # Search common Maps data patterns: rating followed by review count in nearby array cells.
          for pat in [r'4\.9.{0,400}?303',r'303.{0,400}?4\.9',r'4,9.{0,400}?303',r'303.{0,400}?4,9']:
              ms=list(re.finditer(pat,s,re.I|re.S))
              print('PAIR',pat,'hits',len(ms))
              for m in ms[:5]: print(re.sub(r'\s+',' ',s[max(0,m.start()-400):m.end()+500])[:1500])
          PY

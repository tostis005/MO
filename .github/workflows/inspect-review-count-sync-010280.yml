name: Inspect store synchronizer completion hook 0.10.291

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production synchronizer hooks
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=''
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;; esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          echo '=== MENTTA / SYNC PLUGIN DIRS ==='
          find "$PROD_PATH/wp-content/plugins" "$PROD_PATH/wp-content/mu-plugins" -maxdepth 2 -type f -name '*.php' 2>/dev/null | grep -Ei 'mentta|sync|vendor|store' | head -n 120 || true
          echo '=== HOOK / SCHEDULE MATCHES ==='
          timeout 30s grep -RIn -E 'do_action\(|add_action\(|wp_schedule|as_schedule|cron|sync|synchron|actualiz|tienda|store|vendor|mentta' "$PROD_PATH/wp-content/plugins/mentta-marketplace" "$PROD_PATH/wp-content/plugins/external-updates-mentta-marketplace" "$PROD_PATH/wp-content/mu-plugins" 2>/dev/null | grep -Ei 'mentta|sync|synchron|cron|schedule|store|vendor|tienda' | head -n 350 || true
          echo '=== SERVER CRON MENTTA/SYNC ==='
          crontab -l 2>/dev/null | grep -Ei 'mentta|sync|store|vendor|wp-cron' || true
          REMOTE

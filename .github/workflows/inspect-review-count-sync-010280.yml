name: Validate direct review sources 0.10.289

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Google Place Details directly
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=10 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$(timeout 8s "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)
          key=$(timeout 12s "${WP[@]}" option get grw_google_api_key --skip-plugins --skip-themes 2>/dev/null || true)
          place='ChIJbbIJi58nQg0RgJroXR8DG_U'
          tmp=$(mktemp)
          code=$(curl -sS --connect-timeout 8 --max-time 25 -o "$tmp" -w '%{http_code}' --get \
            'https://maps.googleapis.com/maps/api/place/details/json' \
            --data-urlencode "place_id=$place" \
            --data-urlencode 'fields=place_id,name,rating,user_ratings_total,url,website' \
            --data-urlencode 'language=es' \
            --data-urlencode "key=$key" || true)
          echo "GOOGLE_HTTP=$code"
          python3 - "$tmp" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          print('GOOGLE_STATUS='+str(j.get('status','UNKNOWN')))
          r=j.get('result') or {}
          print('GOOGLE_NAME='+str(r.get('name','')))
          print('GOOGLE_RATING='+str(r.get('rating','')))
          print('GOOGLE_COUNT='+str(r.get('user_ratings_total','')))
          print('GOOGLE_WEBSITE='+str(r.get('website','')))
          PY
          rm -f "$tmp"
          REMOTE

      - name: Test Trustpilot directly with browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'es-ES', userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'});
            const resp=await page.goto('https://es.trustpilot.com/review/elmercadodeorigen.com',{waitUntil:'domcontentloaded',timeout:45000});
            console.log('TRUSTPILOT_HTTP='+(resp?resp.status():'none'));
            await page.waitForTimeout(3500);
            const text=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            const count=(text.match(/El Mercado de Origen\s+Opiniones\s+(\d[\d.,]*)/i)||text.match(/Ver las\s+(\d[\d.,]*)\s+opiniones/i)||text.match(/(\d[\d.,]*)\s+opiniones/i)||[])[1]||'';
            const score=(text.match(/El Mercado de Origen\s+Opiniones\s+\d[\d.,]*\s*•?\s*([0-5][,.]\d)/i)||text.match(/\b([0-5][,.]\d)\s+Excelente\b/i)||[])[1]||'';
            console.log('TRUSTPILOT_COUNT='+count);
            console.log('TRUSTPILOT_SCORE='+score);
            console.log('TRUSTPILOT_HAS_NAME='+/El Mercado de Origen/i.test(text));
            await browser.close();
          })().catch(e=>{console.error('TRUSTPILOT_ERROR='+e.message);process.exit(1)});
          JS

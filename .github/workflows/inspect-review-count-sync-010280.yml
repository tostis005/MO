name: Inspect review counts and sync hooks 0.10.280

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-review-count-sync-010280.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production WordPress state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          [ -n "$PROD_PATH" ] || exit 2
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root)

          echo '=== LIVE HOME MATCHES ==='
          curl -L -sS --connect-timeout 10 --max-time 40 -A 'Mozilla/5.0 MDO review diagnostic' -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/?review_diag=$(date +%s)" | tr '\n' ' ' | grep -Eio '.{0,220}(Google|Trustpilot|303|169|294|reseñas|reviews).{0,320}' | head -n 80 || true

          echo '=== TRUSTINDEX SHORTCODE RENDER ==='
          "${WP[@]}" eval 'echo do_shortcode("[trustindex no-registration=google]");' 2>/dev/null | tr '\n' ' ' | grep -Eio '.{0,180}(base de|reviews|reseñas|Google).{0,220}' | head -n 40 || true

          echo '=== PLUGINS ==='
          "${WP[@]}" plugin list --fields=name,status,version --format=csv --skip-plugins --skip-themes 2>/dev/null | grep -Ei 'trust|review|google|sync|import|vendor|feed|mentta|wcfm|elementor' || true

          echo '=== CRON HOOKS ==='
          "${WP[@]}" cron event list --fields=hook,next_run_gmt,recurrence --format=csv 2>/dev/null | grep -Ei 'sync|vendor|store|product|import|feed|mdo|mentta|review|trust|google' | head -n 200 || true

          echo '=== SOURCE MATCHES ==='
          grep -RIn -E '303|169|Trustpilot|trustpilot|review.*count|reseñ|sync.*vendor|sync.*store|product.*sync' "$PROD_PATH/wp-content/mu-plugins" "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" 2>/dev/null | head -n 240 || true

          echo '=== OPTION NAMES ONLY ==='
          prefix=$("${WP[@]}" eval 'global $wpdb; echo $wpdb->prefix;' --skip-plugins --skip-themes 2>/dev/null || true)
          if [ -n "$prefix" ]; then
            sql="SELECT option_name FROM ${prefix}options WHERE option_name LIKE '%trust%' OR option_name LIKE '%review%' OR option_name LIKE '%google%' OR option_name LIKE '%sync%' OR option_name LIKE '%mentta%' ORDER BY option_name LIMIT 250;"
            "${WP[@]}" db query "$sql" --skip-column-names 2>/dev/null | head -n 250 || true
          fi
          REMOTE

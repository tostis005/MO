name: Remove preserves 12-pack SEO landing

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove-conservas-12-pack-landing-production-20260830.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove landing and verify 301
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-remove-12pack-${GITHUB_RUN_ID}.php"
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            .github/scripts/remove-conservas-12-pack-landing-production-20260830.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -l '$REMOTE' >/dev/null; '$PHP' -d memory_limit=512M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root; rm -f '$REMOTE'; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true" > /tmp/result.json
          cat /tmp/result.json
          jq -e '.verified==true' /tmp/result.json >/dev/null
          for url in "$(jq -r .es_old /tmp/result.json)" "$(jq -r .en_old /tmp/result.json)"; do
            headers="$(mktemp)"
            code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' "$url")"
            [ "$code" = "301" ] || { echo "Expected 301, got $code for $url"; cat "$headers"; exit 20; }
            grep -Fqi '/categoria-producto/conservas/' "$headers" || { echo "Wrong redirect target for $url"; cat "$headers"; exit 21; }
          done
          body="$(curl -LsS 'https://www.elmercadodeorigen.com/categoria-producto/conservas/?verify='${GITHUB_RUN_ID})"
          if grep -Fq 'conservas-vegetales-packs-12-tarros' <<<"$body"; then echo 'Old landing still linked from category'; exit 22; fi
          echo preserves_12_pack_landing_removed

name: Publish nutrition priority batch 21-25 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nutrition-priority-16-20-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate batch 21-25
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-nutrition-priority-21-25-production.php
          python3 - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          root=Path('elmercadodeorigen-child/inc/content-seeds')
          enc=''.join((root/f'nutrition-priority-21-25-010271-{i}.b64').read_text().strip() for i in range(1,5))
          data=json.loads(gzip.decompress(base64.b64decode(enc,validate=True)).decode())
          assert len(data)==5
          for a in data:
              assert len(a['content'])>=5000 and len(a['en_content'])>=4500
              assert '<!-- EMDO_RELATED_PRODUCTS -->' in a['content'] and '<!-- EMDO_RELATED_PRODUCTS -->' in a['en_content']
          Path('/tmp/batch.json').write_text(json.dumps(data,ensure_ascii=False))
          print('Payload OK:', ', '.join(a['slug'] for a in data))
          PY

      - name: Publish safely and verify public site
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          UA='Mozilla/5.0 EMDO safe nutrition verification'
          mapfile -t SLUGS < <(jq -r '.[].slug' /tmp/batch.json)
          HEALTH=(
            'https://www.elmercadodeorigen.com/'
            'https://www.elmercadodeorigen.com/tienda/'
            'https://www.elmercadodeorigen.com/blog/'
            'https://www.elmercadodeorigen.com/category/carnes/'
            'https://www.elmercadodeorigen.com/category/guias-y-consejos/'
          )
          check_health(){
            phase="$1"; shift
            for url in "$@"; do
              f="/tmp/health-${phase}-$(echo "$url"|tr '/:?&=' '_')"
              code=$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$f" -w '%{http_code}' "${url}?emdo_health=${GITHUB_RUN_ID}-${phase}")
              [ "$code" = 200 ] && [ "$(wc -c < "$f")" -gt 5000 ] && grep -qi '</html>' "$f"
              echo "health_ok phase=$phase url=$url"
            done
          }
          check_health pre "${HEALTH[@]}"

          INFO=$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] && [ -n "$wp" ] && [ -n "$php" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')
          PROD=${INFO%%|*}; REST=${INFO#*|}; PHP=${REST%%|*}; WP=${REST#*|}
          REMOTE="/tmp/emdo-nutrition-2125-${GITHUB_RUN_ID}"

          for slug in "${SLUGS[@]}"; do
            ids=$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post list --path='$PROD' --allow-root --post_type=post --name='$slug' --format=ids 2>/dev/null || true")
            [ -z "${ids// /}" ] || { echo "Safety stop: slug exists $slug" >&2; exit 10; }
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE/content-seeds'"
          sshpass -e scp $SCP .github/scripts/publish-nutrition-priority-21-25-production.php "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          for i in 1 2 3 4; do sshpass -e scp $SCP "elmercadodeorigen-child/inc/content-seeds/nutrition-priority-21-25-010271-${i}.b64" "$STAGING_USER@$STAGING_HOST:$REMOTE/content-seeds/"; done

          ROLLBACK=1
          undo(){
            rc=$?; set +e
            if [ "${ROLLBACK:-0}" = 1 ]; then
              echo 'Rolling back only batch 21-25 posts.' >&2
              for slug in "${SLUGS[@]}"; do
                ids=$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post list --path='$PROD' --allow-root --post_type=post --name='$slug' --format=ids 2>/dev/null || true")
                [ -z "${ids// /}" ] || sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post delete $ids --force --path='$PROD' --allow-root >/dev/null 2>&1 || true"
              done
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" >/dev/null 2>&1
              check_health rollback "${HEALTH[@]}" || true
            fi
            exit "$rc"
          }
          trap undo ERR

          trap - ERR; set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export EMDO_NUTRITION_2125_SEED_DIR='$REMOTE'; export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/publish-nutrition-priority-21-25-production.php' --path='$PROD' --allow-root" >/tmp/pub.out 2>/tmp/pub.err
          RC=$?; set -e; trap undo ERR
          cat /tmp/pub.err >&2 || true; cat /tmp/pub.out || true
          [ "$RC" -eq 0 ]
          JSON=$(grep -E '^\{.*\}$' /tmp/pub.out|tail -n1); [ -n "$JSON" ]; printf '%s\n' "$JSON" >/tmp/result.json
          jq -e '.verified==true and .count==5 and (.errors|length)==0 and (.posts|length)==5' /tmp/result.json >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          while IFS=$'\t' read -r slug en_slug title en_title es en cat; do
            for spec in "es|$es|$title" "en|$en|$en_title"; do
              IFS='|' read -r lang url expected <<< "$spec"
              f="/tmp/${lang}-${slug}.html"; code=$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$f" -w '%{http_code}' "${url}?emdo_verify=${GITHUB_RUN_ID}")
              [ "$code" = 200 ] && [ "$(wc -c < "$f")" -gt 5000 ] && grep -qi '</html>' "$f" && grep -Fq "$expected" "$f"
            done
            cf="/tmp/cat-${cat}-${slug}.html"; curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/category/${cat}/?emdo_verify=${GITHUB_RUN_ID}" -o "$cf"; grep -Fq "$slug" "$cf"
            echo "post_ok es=$es en=$en category=$cat"
          done < <(jq -r '.posts[]|[.slug,.en_slug,.title,.en_title,.permalink,.en_permalink,.category_slug]|@tsv' /tmp/result.json)

          curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/blog/?emdo_verify=${GITHUB_RUN_ID}" -o /tmp/blog.html
          while read -r slug; do grep -Fq "$slug" /tmp/blog.html; done < <(jq -r '.posts[].slug' /tmp/result.json)
          check_health post "${HEALTH[@]}"
          ROLLBACK=0; trap - ERR
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          echo 'SAFE_PUBLICATION_OK: batch 21-25 published and verified.'

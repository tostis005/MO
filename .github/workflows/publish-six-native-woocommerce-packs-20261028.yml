name: Publish all six standard WooCommerce pack pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-six-native-woocommerce-packs-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: all-native-mentta-packs-safe-rollout
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy other five packs and verify six native product pages with rollback
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l mu-plugins/emdo-mentta-only-api-visibility-20261009.php
          php -l .github/scripts/migrate-six-packs-to-native-hidden-mentta-20261028.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          SITE="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${SITE:?No production root}"
          RUN="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-only-api-visibility-20261009.php "$TARGET:/tmp/native-mentta-override-$RUN.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/migrate-six-packs-to-native-hidden-mentta-20261028.php "$TARGET:/tmp/native-mentta-migrate-$RUN.php"
          sshpass -e scp "${SCP[@]}" mu-plugins/mdo-mentta-native-product-navigation-20261028.php "$TARGET:/tmp/native-mentta-no-adjacent-$RUN.php"
          REMOTE_SCRIPT="/tmp/native-mentta-migrate-$RUN.php"
          LIVE="$SITE/wp-content/mu-plugins/emdo-mentta-only-api-visibility-20261009.php"
          BACKUP="$LIVE.native-mentta-test-backup-$RUN"
          NAVBACKUP="$NAVLIVE.before-rest-$RUN"
          NAVLIVE="$SITE/wp-content/mu-plugins/mdo-mentta-native-product-navigation-20261028.php"
          SUCCESS=0
          rollback() {
            rc=$?
            if [[ "$SUCCESS" != 1 ]]; then sshpass -e ssh "${SSH[@]}" "$TARGET" "if test -f '$NAVBACKUP'; then cp -f '$NAVBACKUP' '$NAVLIVE'; fi" || true; fi
            if [[ "$SUCCESS" != 1 ]]; then
              echo "::warning::Native product test unsuccessful; restoring old WooCommerce visibility and override"
              sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$SITE' '$REMOTE_SCRIPT' '$LIVE' '$BACKUP'" <<'UNDO' || true
          SITE="$1"; SCRIPT="$2"; LIVE="$3"; BACKUP="$4"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          MDO_HIDE_PACKS_MODE=rollback_rest "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root || true
          if test -f "$BACKUP"; then cp -f "$BACKUP" "$LIVE"; fi
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval 'if(function_exists("rocket_clean_domain"))rocket_clean_domain();wp_cache_flush();' --path="$SITE" --allow-root || true
          UNDO
            fi
          }
          trap rollback EXIT
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$SITE' '$RUN'" <<'DEPLOY'
          set -euo pipefail
          SITE="$1"; RUN="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          SCRIPT="/tmp/native-mentta-migrate-$RUN.php"
          LIVE="$SITE/wp-content/mu-plugins/emdo-mentta-only-api-visibility-20261009.php"
          "$PHP_BIN" -l "/tmp/native-mentta-override-$RUN.php"
          "$PHP_BIN" -l "/tmp/native-mentta-no-adjacent-$RUN.php"
          MDO_HIDE_PACKS_MODE=preflight "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          cp -a "$LIVE" "$LIVE.native-mentta-test-backup-$RUN"
          NAVLIVE="$SITE/wp-content/mu-plugins/mdo-mentta-native-product-navigation-20261028.php"
          test -f "$NAVLIVE"; cp -a "$NAVLIVE" "$NAVLIVE.before-rest-$RUN"
          install -m 0644 "/tmp/native-mentta-no-adjacent-$RUN.php" "$SITE/wp-content/mu-plugins/mdo-mentta-native-product-navigation-20261028.php"
          install -m 0644 "/tmp/native-mentta-override-$RUN.php" "$LIVE"
          MDO_HIDE_PACKS_MODE=apply_rest "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          MDO_HIDE_PACKS_MODE=verify_all "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          DEPLOY
          for SLUG in \
            pack-degustacion-pasaporte-salvaje \
            pack-degustacion-safari-africano \
            pack-degustacion-vuelta-al-mundo \
            pack-cafe-esencia-de-costa-rica \
            pack-cafe-ruta-de-los-cuatro-origenes \
            pack-cafe-coleccion-completa
          do
            PAGE="/tmp/native-pack-$SLUG.html"
            STATUS="$(curl -sSL --connect-timeout 8 --max-time 40 -o "$PAGE" -w '%{http_code}' "https://www.elmercadodeorigen.com/producto/$SLUG/")"
            echo "NATIVE_PACK_CHECK slug=$SLUG status=$STATUS bytes=$(wc -c < "$PAGE")"
            test "$STATUS" = 200
            grep -Eq 'class="[^"]*single-product|woocommerce-product-gallery|product-page-container' "$PAGE"
            grep -Eiq 'site-header|primary-menu|main-navigation|woostify' "$PAGE"
            grep -Eq 'product_title|entry-title|product-summary' "$PAGE"
            if grep -q 'class="woostify-product-navigation' "$PAGE"; then echo "::error::Looping adjacent navigation still active for $SLUG"; exit 1; fi
            if grep -Eiq 'Ficha de producto para revisión|integración con Menta|revisión de Menta|Esta ficha puede abrirse' "$PAGE"; then echo "::error::Technical copy in $SLUG"; exit 1; fi
            case "$SLUG" in
              pack-cafe-*)
                grep -Eiq 'variations_form|attribute_.*molienda|name="attribute_' "$PAGE"
                ;;
            esac
          done
          echo "SIX_NATIVE_WOOCOMMERCE_PAGES_RENDERED"
          CODE="$(curl -sSL --connect-timeout 8 --max-time 35 -o /dev/null -w '%{http_code}' 'https://www.elmercadodeorigen.com/')"
          echo "HOMEPAGE_HTTP=$CODE"
          test "$CODE" = 200
          CODE="$(curl -sSL --connect-timeout 8 --max-time 35 -o /dev/null -w '%{http_code}' 'https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/')"
          echo "ESTABLISHED_PRODUCT_HTTP=$CODE"
          test "$CODE" = 200
          SUCCESS=1
          echo "SIX_NATIVE_PRODUCTS_AND_STOREFRONT_VERIFIED"

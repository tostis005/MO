name: Huerta Ana Mary About update 20260820 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/huerta-ana-mary-about-update-20260820-production.yml'
      - '.github/scripts/huerta-ana-mary-about-update-20260820.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate guarded producer update
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/huerta-ana-mary-about-update-20260820.php >/dev/null
          grep -Fq 'Detrás del proyecto se encuentran Arsenio y Antonio' .github/scripts/huerta-ana-mary-about-update-20260820.php
          grep -Fq 'las hortalizas frescas permanecen en el campo hasta que se recibe el pedido' .github/scripts/huerta-ana-mary-about-update-20260820.php
          ! grep -Fq 'Arsenio Pérez y Antonio Luis Morán' .github/scripts/huerta-ana-mary-about-update-20260820.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Update La Huerta de Ana Mary About in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SCRIPT="/tmp/huerta-ana-mary-about-update-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/huerta-ana-mary-about-update-20260820.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          RUN_OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc")"
          printf '%s\n' "$RUN_OUTPUT"
          grep -Fq 'HUERTA_ABOUT_UPDATE_OK' <<< "$RUN_OUTPUT"
          STORE_SLUG="$(sed -n 's/^HUERTA_STORE_SLUG=//p' <<< "$RUN_OUTPUT" | tail -n1)"
          : "${STORE_SLUG:?store slug not returned}"
          printf 'HUERTA_STORE_SLUG=%s\n' "$STORE_SLUG" >> "$GITHUB_ENV"

      - name: Flush WordPress object cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public producer About copy
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/tienda/${HUERTA_STORE_SLUG}/acercade/?emdo_huerta_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO Huerta About verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/huerta-about.html "$URL"
          grep -Fq 'Detrás del proyecto se encuentran Arsenio y Antonio' /tmp/huerta-about.html
          grep -Fq 'las hortalizas frescas permanecen en el campo hasta que se recibe el pedido' /tmp/huerta-about.html
          grep -Fq 'esperar a que llegue el pedido para recolectar las hortalizas frescas' /tmp/huerta-about.html
          if grep -Fq 'Arsenio Pérez' /tmp/huerta-about.html || grep -Fq 'Antonio Luis Morán' /tmp/huerta-about.html; then
            echo 'HUERTA_ABOUT_PUBLIC_ABORT: surnames still visible' >&2
            exit 7
          fi
          echo "HUERTA_ABOUT_PUBLIC_OK slug=${HUERTA_STORE_SLUG}"

      - name: Record verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          mkdir -p runtime
          printf 'run_id=%s\nstatus=%s\nslug=%s\n' "$GITHUB_RUN_ID" "${{ job.status }}" "${HUERTA_STORE_SLUG:-}" > runtime/huerta-ana-mary-about-update-20260820.txt
          git add runtime/huerta-ana-mary-about-update-20260820.txt
          git commit -m 'Record Huerta de Ana Mary About verification' || true
          git push origin HEAD:main

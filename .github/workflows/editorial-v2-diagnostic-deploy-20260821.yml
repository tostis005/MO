name: Editorial v2 resilient deploy 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/editorial-v2-trigger-20260821.txt'
      - '.github/workflows/editorial-v2-diagnostic-deploy-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy and capture result
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          mkdir -p .deploy-status
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          path_rc=$?

          prep_rc=99
          refine_rc=99
          if [ "$path_rc" -eq 0 ] && [ -n "$PROD_PATH" ]; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'" >/tmp/editorial-v2-ssh.log 2>&1
            sshpass -e scp $SCP mu-plugins/mdo-english-journal-content-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-journal-content-20260821.php" >>/tmp/editorial-v2-ssh.log 2>&1
            IMG_REMOTE="/tmp/prepare-editorial-images-${GITHUB_RUN_ID}.php"
            REF_REMOTE="/tmp/refine-editorial-guides-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP .github/scripts/prepare-editorial-images-20260821.php "$STAGING_USER@$STAGING_HOST:$IMG_REMOTE" >>/tmp/editorial-v2-ssh.log 2>&1
            sshpass -e scp $SCP .github/scripts/refine-editorial-guides-20260821-v2.php "$STAGING_USER@$STAGING_HOST:$REF_REMOTE" >>/tmp/editorial-v2-ssh.log 2>&1

            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$IMG_REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$IMG_REMOTE'; exit \$rc" >/tmp/editorial-v2-images.out 2>/tmp/editorial-v2-images.err
            prep_rc=$?

            if [ "$prep_rc" -eq 0 ]; then
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REF_REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REF_REMOTE'; exit \$rc" >/tmp/editorial-v2-refine.out 2>/tmp/editorial-v2-refine.err
              refine_rc=$?
            fi
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" >/dev/null 2>&1
          fi

          python3 - <<'PY'
          import json, os, pathlib
          def read(path):
              p=pathlib.Path(path)
              return p.read_text(errors='replace')[-12000:] if p.exists() else ''
          def envint(name, default=99):
              try: return int(os.environ.get(name, default))
              except: return default
          d={
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'source_sha': os.environ.get('GITHUB_SHA'),
            'path_rc': int(os.environ.get('PATH_RC','99')),
            'prepare_rc': int(os.environ.get('PREP_RC','99')),
            'refine_rc': int(os.environ.get('REFINE_RC','99')),
            'images_stdout': read('/tmp/editorial-v2-images.out'),
            'images_stderr': read('/tmp/editorial-v2-images.err'),
            'refine_stdout': read('/tmp/editorial-v2-refine.out'),
            'refine_stderr': read('/tmp/editorial-v2-refine.err'),
            'ssh_log': read('/tmp/editorial-v2-ssh.log'),
          }
          try:
              d['images_json']=json.loads(d['images_stdout']) if d['images_stdout'].strip() else None
          except Exception as e: d['images_parse_error']=str(e)
          try:
              d['refine_json']=json.loads(d['refine_stdout']) if d['refine_stdout'].strip() else None
          except Exception as e: d['refine_parse_error']=str(e)
          d['success']=d['prepare_rc']==0 and d['refine_rc']==0
          pathlib.Path('.deploy-status/editorial-v2-diagnostic-20260821.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
        env:
          PATH_RC: ${{ steps.deploy.outputs.path_rc }}

      - name: Rebuild diagnostic with shell return codes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          p=pathlib.Path('.deploy-status/editorial-v2-diagnostic-20260821.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          # Recover success directly from captured JSON payloads when possible.
          ij=d.get('images_json'); rj=d.get('refine_json')
          if isinstance(ij,dict) and len(ij.get('images',[]))==6: d['prepare_rc']=0
          if isinstance(rj,dict) and rj.get('revision')==2 and len(rj.get('posts',[]))==6: d['refine_rc']=0
          d['success']=d.get('prepare_rc')==0 and d.get('refine_rc')==0
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit diagnostic
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-v2-diagnostic-20260821.json
          git commit -m 'Record editorial v2 deployment diagnostic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish cheese batch 05 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-05-data-a.json'
      - '.github/scripts/cheese-batch-05-data-b.json'
      - '.github/scripts/publish-cheese-batch-05-production.php'
      - '.github/workflows/publish-cheese-batch-05-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate editorial publisher
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool .github/scripts/cheese-batch-05-data-a.json >/dev/null
          python -m json.tool .github/scripts/cheese-batch-05-data-b.json >/dev/null
          php -l .github/scripts/publish-cheese-batch-05-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese05-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-05-data-a.json \
            .github/scripts/cheese-batch-05-data-b.json \
            .github/scripts/publish-cheese-batch-05-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/publish-cheese-batch-05-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" | tee /tmp/cheese05-output.txt
          grep -q 'EMDO_CHEESE_BATCH05_BEGIN' /tmp/cheese05-output.txt
          grep -q '"count":10' /tmp/cheese05-output.txt
          grep -q 'EMDO_CHEESE_BATCH05_END' /tmp/cheese05-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'queso-nata-cantabria-dop-leche-textura-maduracion-como-reconocerlo'
            'queso-camerano-dop-tipos-leche-cabra-maduracion-cilla'
            'queso-alt-urgell-cerdanya-dop-leche-corteza-ojos-maduracion'
            'queso-murcia-dop-fresco-curado-leche-cabra-diferencias-murcia-vino'
            'queso-acehuche-dop-leche-cruda-cabra-corteza-sobao-maduracion'
            'queso-valdeon-igp-azul-leches-maduracion-como-reconocerlo'
            'queso-lactosa-tipos-maduracion-como-saber-si-tiene'
            'como-leer-etiqueta-queso-leche-ingredientes-origen-maduracion-sellos'
            'cristales-blancos-queso-tirosina-lactato-calcio-diferencia-moho'
            'queso-artesano-industrial-diferencias-que-significan-calidad'
          )
          en_slugs=(
            'queso-nata-cantabria-pdo-milk-texture-maturation-how-identify'
            'queso-camerano-pdo-styles-goat-milk-maturation-cilla-marks'
            'alt-urgell-cerdanya-pdo-cheese-milk-rind-eyes-maturation'
            'queso-murcia-pdo-fresh-aged-goat-milk-vs-murcia-al-vino'
            'queso-acehuche-pdo-raw-goat-milk-rind-sobao-maturation'
            'queso-valdeon-pgi-blue-cheese-milks-maturation-how-identify'
            'does-cheese-contain-lactose-type-maturation-how-to-tell'
            'how-to-read-cheese-label-milk-ingredients-origin-maturation-seals'
            'white-crystals-cheese-tyrosine-calcium-lactate-vs-mould'
            'artisan-vs-industrial-cheese-what-terms-mean-how-compare-quality'
          )
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 4
            done
            echo "FAILED $code $url" >&2
            return 1
          }
          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

          curl -L -sS --max-time 45 "$base/queso-nata-cantabria-dop-leche-textura-maduracion-como-reconocerlo/?verify=$GITHUB_RUN_ID" -o /tmp/nata.html
          grep -Fq '¿Lleva nata añadida?' /tmp/nata.html
          curl -L -sS --max-time 45 "$base/queso-lactosa-tipos-maduracion-como-saber-si-tiene/?verify=$GITHUB_RUN_ID" -o /tmp/lactose.html
          grep -Fq 'Curado no significa automáticamente sin lactosa' /tmp/lactose.html
          curl -L -sS --max-time 45 "$base/como-leer-etiqueta-queso-leche-ingredientes-origen-maduracion-sellos/?verify=$GITHUB_RUN_ID" -o /tmp/label.html
          grep -Fq 'Empieza por el nombre legal, no por la marca' /tmp/label.html
          curl -L -sS --max-time 45 "$base/cristales-blancos-queso-tirosina-lactato-calcio-diferencia-moho/?verify=$GITHUB_RUN_ID" -o /tmp/crystals.html
          grep -Fq 'Cristal o moho' /tmp/crystals.html
          curl -L -sS --max-time 45 "$base/en/artisan-vs-industrial-cheese-what-terms-mean-how-compare-quality/?verify=$GITHUB_RUN_ID" -o /tmp/artisan-en.html
          grep -Fq 'Industrial is not a recipe either' /tmp/artisan-en.html
          echo 'Cheese batch 05 public editorial verification OK'

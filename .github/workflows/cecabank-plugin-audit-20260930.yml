name: Audit Cecabank plugin production 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cecabank-plugin-audit-20260930.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Inspect Cecabank plugin and masked settings
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)

          echo '=== RUNTIME ==='
          "$php_bin" -r 'echo "PHP=".PHP_VERSION."\n";'
          "$php_bin" -d memory_limit=512M "$wp_bin" core version --path="$PROD_PATH" --allow-root | sed 's/^/WordPress=/'
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin get woocommerce --fields=name,status,version,update,update_version --format=json --path="$PROD_PATH" --allow-root || true

          echo '=== CECABANK PLUGIN ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin get cecabank-woocommerce --fields=name,status,version,update,update_version,update_package --format=json --path="$PROD_PATH" --allow-root || true
          grep -nE '^\s*\* Version:|@version' "$PROD_PATH/wp-content/plugins/cecabank-woocommerce/wc_gateway_cecabank.php" | head -n 10 || true
          find "$PROD_PATH/wp-content/plugins/cecabank-woocommerce" -maxdepth 2 -type f | sed "s#^$PROD_PATH/##" | sort | head -n 200

          echo '=== INSTALLED CRYPTO SUPPORT ==='
          grep -nE 'HMAC|SHA2|secret_key|ClaveCifrado|Cifrado|Pago_soportado|versionMod' "$PROD_PATH/wp-content/plugins/cecabank-woocommerce/wc_gateway_cecabank.php" | head -n 80 || true
          grep -RniE 'HMAC|SHA2' "$PROD_PATH/wp-content/plugins/cecabank-woocommerce/lib" --include='*.php' 2>/dev/null | head -n 80 || true

          echo '=== MASKED GATEWAY SETTINGS ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            $o=get_option("woocommerce_cecabank_gateway_settings",[]);
            if(!is_array($o)){echo "settings=not_array\n"; return;}
            $safe=["enabled","merchant","acquirer","terminal","environment","title","set_completed","icon"];
            foreach($safe as $k){
              if(!array_key_exists($k,$o)) continue;
              $v=(string)$o[$k];
              if(in_array($k,["merchant","acquirer","terminal"],true)){
                echo $k."_present=".($v!==""?"yes":"no")." ".$k."_length=".strlen($v)."\n";
              } else {
                echo $k."=".$v."\n";
              }
            }
            $s=isset($o["secret_key"])?(string)$o["secret_key"]:"";
            echo "secret_present=".($s!==""?"yes":"no")."\n";
            echo "secret_length=".strlen($s)."\n";
            echo "secret_is_hex=".(($s!=="" && ctype_xdigit($s))?"yes":"no")."\n";
            echo "secret_algorithm_inferred=".(strlen($s)===8?"SHA2":"HMAC")."\n";
          ' --path="$PROD_PATH" --allow-root

          echo '=== UPDATE FEASIBILITY ==='
          du -sh "$PROD_PATH/wp-content/plugins/cecabank-woocommerce" || true
          test -w "$PROD_PATH/wp-content/plugins" && echo plugins_dir_writable=yes || echo plugins_dir_writable=no
          REMOTE

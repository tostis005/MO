name: Latitudes - check producer official shipping weights
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-latitudes-official-weights-20261019.yml'
      - '.github/scripts/audit-latitudes-official-weights-20261019.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-latitudes-official-weights-20261019
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar el código PHP
        run: php -l .github/scripts/audit-latitudes-official-weights-20261019.php
      - name: Compare Latitudes title weight ranges with official product weight attributes
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${STAGING_HOST:?}" "${STAGING_USER:?}" "${SSHPASS:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$PORT")
          SERVER="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$SERVER" 'sh -s' <<'REMOTE'
          set -eu
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          fi
          test -n "$wp_bin" && test -x "$php_bin"
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p="$(dirname "$cfg")"
            url="$( "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true )"
            home="$( "$php_bin" "$wp_bin" option get home --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true )"
            case "$url" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                case "$home" in
                  https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                    printf '%s' "$p"; exit 0 ;;
                esac ;;
            esac
          done
          exit 1
          REMOTE
          )"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/latitudes-weight-audit-${GITHUB_RUN_ID}.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/audit-latitudes-official-weights-20261019.php "$SERVER:$SCRIPT"
          sshpass -e ssh "${SSH[@]}" "$SERVER" "sh -s -- '$PROD_PATH' '$SCRIPT'" <<'REMOTE'
          set -eu
          wp_path="$1"
          script="$2"
          trap 'rm -f "$script"' EXIT
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          fi
          wp_bin="$(command -v wp)"
          echo "Latitudes weight audit: read only."
          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file "$script" --path="$wp_path" --skip-themes --allow-root
          echo "No production data was modified."
          REMOTE

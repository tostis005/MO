name: Rewrite duck content quality 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/rewrite-duck-content-batch*-20260927.php'
      - '.github/scripts/expand-duck-content-batch*-20260927.php'
      - '.github/scripts/snapshot-duck-unique-legacy-paragraphs-20260927.php'
      - '.github/scripts/fill-duck-depth-from-unique-legacy-20260927.php'
      - '.github/scripts/patch-duck-depth-and-intents-20260928.php'
      - '.github/scripts/audit-duck-content-quality-20260927.php'
      - '.github/workflows/rewrite-duck-content-quality-20260927.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rewrite-duck-content-quality-20260927
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate rewrite scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in             .github/scripts/snapshot-duck-unique-legacy-paragraphs-20260927.php             .github/scripts/rewrite-duck-content-batch{1..6}-20260927.php             .github/scripts/expand-duck-content-batch{1..6}-20260927.php             .github/scripts/fill-duck-depth-from-unique-legacy-20260927.php             .github/scripts/audit-duck-content-quality-20260927.php
          do
            php -l "$f" >/dev/null
          done
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Rewrite production duck articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 22
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"

          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE_DIR="/tmp/emdo-duck-rewrite-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"

          FILES=(
            snapshot-duck-unique-legacy-paragraphs-20260927.php
            rewrite-duck-content-batch1-20260927.php
            expand-duck-content-batch1-20260927.php
            rewrite-duck-content-batch2-20260927.php
            expand-duck-content-batch2-20260927.php
            rewrite-duck-content-batch3-20260927.php
            expand-duck-content-batch3-20260927.php
            rewrite-duck-content-batch4-20260927.php
            expand-duck-content-batch4-20260927.php
            rewrite-duck-content-batch5-20260927.php
            expand-duck-content-batch5-20260927.php
            rewrite-duck-content-batch6-20260927.php
            expand-duck-content-batch6-20260927.php
            fill-duck-depth-from-unique-legacy-20260927.php
            patch-duck-depth-and-intents-20260928.php
            audit-duck-content-quality-20260927.php
          )

          for f in "${FILES[@]}"; do
            sshpass -e scp $SCP ".github/scripts/$f" "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/$f"
          done

          run_remote() {
            local f="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST"               "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE_DIR/$f' --path='$PROD' --skip-plugins --skip-themes --allow-root"
          }

          echo '--- SNAPSHOT ---'
          run_remote snapshot-duck-unique-legacy-paragraphs-20260927.php

          for n in 1 2 3 4 5 6; do
            echo "--- REWRITE BATCH $n ---"
            run_remote "rewrite-duck-content-batch${n}-20260927.php"
            echo "--- EXPAND BATCH $n ---"
            run_remote "expand-duck-content-batch${n}-20260927.php"
          done

          echo '--- UNIQUE LEGACY DEPTH FILL ---'
          run_remote fill-duck-depth-from-unique-legacy-20260927.php

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST"             "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          echo '--- DEPTH + INTENT PATCH ---'
          run_remote patch-duck-depth-and-intents-20260928.php

          echo '--- CONTENT AUDIT ---'
          run_remote audit-duck-content-quality-20260927.php > /tmp/duck-content-audit.json
          jq '.' /tmp/duck-content-audit.json

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_DIR'"

      - name: Check audit gates
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.summary.count == 60' /tmp/duck-content-audit.json >/dev/null
          jq -e '.summary.words.min >= 980' /tmp/duck-content-audit.json >/dev/null
          jq -e '.summary.shared_ratio_2plus.avg <= 0.25' /tmp/duck-content-audit.json >/dev/null
          jq -e '.summary.shared_ratio_10plus.avg <= 0.10' /tmp/duck-content-audit.json >/dev/null
          jq -e '.summary.repeated_long_paragraphs_50plus == 0' /tmp/duck-content-audit.json >/dev/null
          jq -e '.summary.high_similarity_pair_count <= 60' /tmp/duck-content-audit.json >/dev/null
          echo "DUCK_CONTENT_AUDIT_GATES_OK"

      - name: Verify public article rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, ssl, urllib.request
          audit=json.load(open('/tmp/duck-content-audit.json'))
          slugs=[p['slug'] for p in audit['posts']]
          ctx=ssl._create_unverified_context()
          base='https://www.elmercadodeorigen.com'
          def check(slug):
              req=urllib.request.Request(f'{base}/{slug}/?emdo_rewrite_verify=1',headers={'User-Agent':'Mozilla/5.0 EMDO rewrite verifier','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35,context=ctx) as r:
                  html=r.read().decode('utf-8','ignore')
                  if r.status!=200: raise RuntimeError(f'{slug}: {r.status}')
                  if 'emo-article-page' not in html or 'emo-article-content' not in html: raise RuntimeError(f'{slug}: wrong template')
                  if 'noindex' in html.lower(): raise RuntimeError(f'{slug}: noindex')
                  return slug
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for f in concurrent.futures.as_completed([ex.submit(check,s) for s in slugs]): f.result()
          print('PUBLIC_REWRITE_VERIFY_OK',len(slugs))
          PY

      - name: Record rewrite audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          jq -n             --arg generated_at "$(date -u +%FT%TZ)"             --arg run_id "$GITHUB_RUN_ID"             --arg source_sha "$GITHUB_SHA"             --slurpfile audit /tmp/duck-content-audit.json             '{generated_at:$generated_at,run_id:($run_id|tonumber),source_sha:$source_sha,verified:true,batch:"20260927-duck-content-rewrite-v2",audit:$audit[0]}'             > .deploy-status/duck-content-rewrite-v2-20260927.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/duck-content-rewrite-v2-20260927.json
          git commit -m 'Record duck content rewrite audit [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

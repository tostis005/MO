name: Diagnose homepage specials 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-home-specials-20260831.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Install SSH helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Read homepage configuration only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" '
            set -euo pipefail
            WP=$(command -v wp)
            PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            PROD=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) PROD="$p"; break;;
              esac
            done
            test -n "$PROD"
            FRONT=$("$PHP" "$WP" option get page_on_front --path="$PROD" --skip-plugins --skip-themes --allow-root)
            echo "FRONT_PAGE_ID=$FRONT"
            echo "FRONT_TITLE=$("$PHP" "$WP" post get "$FRONT" --field=post_title --path="$PROD" --skip-plugins --skip-themes --allow-root)"
            echo "FRONT_TEMPLATE=$("$PHP" "$WP" post meta get "$FRONT" _wp_page_template --path="$PROD" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            echo "ELEMENTOR_EDIT_MODE=$("$PHP" "$WP" post meta get "$FRONT" _elementor_edit_mode --path="$PROD" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            cat > /tmp/emdo-home-diag.php <<"PHPDIAG"
<?php
$id = (int) get_option("page_on_front");
$raw = (string) get_post_meta($id, "_elementor_data", true);
echo "ELEMENTOR_BYTES=" . strlen($raw) . PHP_EOL;
$data = json_decode($raw, true);
if (!is_array($data)) { echo "ELEMENTOR_JSON=unavailable\n"; return; }
$interesting = array("title","heading","text","editor","shortcode","query_id","query","source","post_type","posts_per_page","products_per_page","columns","orderby","order","product_cat","product_tag","filter_by","select_products","include","exclude","taxonomy","terms","skin","template_id");
$walk = function($node, $path="root") use (&$walk, $interesting) {
    if (!is_array($node)) return;
    $widget = isset($node["widgetType"]) ? (string)$node["widgetType"] : "";
    $settings = isset($node["settings"]) && is_array($node["settings"]) ? $node["settings"] : array();
    $summary = array();
    foreach ($interesting as $key) {
        if (!array_key_exists($key, $settings)) continue;
        $v = $settings[$key];
        if (is_scalar($v)) $summary[$key] = mb_substr((string)$v, 0, 500);
        elseif (is_array($v)) $summary[$key] = $v;
    }
    $encoded = wp_json_encode(array("widget"=>$widget,"settings"=>$settings), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
    $has_word = preg_match("/(especial|special|oferta|destacad|nuevo|vendid)/iu", $encoded);
    $productish = preg_match("/(product|woocommerce|loop-grid|posts|archive-products)/i", $widget);
    $headingish = preg_match("/(heading|text-editor)/i", $widget);
    if ($has_word || $productish || ($headingish && !empty($summary))) {
        echo "NODE " . $path . " " . wp_json_encode(array("widgetType"=>$widget,"settings"=>$summary), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
    }
    foreach ($node as $k=>$v) if (is_array($v)) $walk($v, $path . "." . $k);
};
$walk($data);
PHPDIAG
            "$PHP" "$WP" eval-file /tmp/emdo-home-diag.php --path="$PROD" --skip-plugins --skip-themes --allow-root
            rm -f /tmp/emdo-home-diag.php
          '

      - name: Inspect fresh public homepage headings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://www.elmercadodeorigen.com/?emdo_home_diag=${GITHUB_SHA:0:12}" -o /tmp/home.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/home.html',encoding='utf-8',errors='ignore').read()
          print('HOME_BYTES=',len(s))
          for tag, body in re.findall(r'<(h[1-4])\b[^>]*>(.*?)</\1>', s, flags=re.I|re.S):
              text=html.unescape(re.sub(r'<[^>]+>',' ',body))
              text=' '.join(text.split())
              if text: print(f'{tag.upper()}: {text[:300]}')
          print('HAS_ESPECIALES=', bool(re.search(r'especial',s,re.I)))
          PY

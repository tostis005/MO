name: Catalog toolbar destination production

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-catalog-summarybar-visible-20260820.php'
      - 'mu-plugins/mdo-catalog-destination-modal-footer-20260820.php'
      - '.github/workflows/catalog-summarybar-visible-production-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-browser-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate architecture
        shell: bash
        run: |
          set -euo pipefail
          TOOLBAR='mu-plugins/mdo-catalog-summarybar-visible-20260820.php'
          FOOTER='mu-plugins/mdo-catalog-destination-modal-footer-20260820.php'
          php -l "$TOOLBAR" >/dev/null
          php -l "$FOOTER" >/dev/null
          grep -q 'mdo-catalog-toolbar-layout-20260820' "$TOOLBAR"
          grep -q 'Intentionally no hooks' "$FOOTER"
          if grep -q 'MutationObserver' "$TOOLBAR"; then
            echo 'MutationObserver is forbidden in the toolbar integration' >&2; exit 1
          fi
          if grep -Eq 'insertBefore|appendChild|insertAdjacentElement|replaceWith' "$TOOLBAR"; then
            echo 'Client-side DOM relocation is forbidden in the toolbar integration' >&2; exit 1
          fi
          if grep -q '<script' "$TOOLBAR"; then
            echo 'Toolbar layout must not need JavaScript' >&2; exit 1
          fi
          if grep -q "add_action" "$FOOTER"; then
            echo 'Retired footer relocation plugin must not register actions' >&2; exit 1
          fi

      - name: Deploy toolbar files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          for name in mdo-catalog-summarybar-visible-20260820.php mdo-catalog-destination-modal-footer-20260820.php; do
            local="mu-plugins/$name"
            tmp="/tmp/${name%.php}-${GITHUB_RUN_ID}.php"
            target="$PROD_PATH/wp-content/mu-plugins/$name"
            sshpass -e scp $SCP_OPTIONS "$local" "$STAGING_USER@$STAGING_HOST:$tmp"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$tmp' >/dev/null && cp '$tmp' '$target' && rm -f '$tmp' && \"\$php_bin\" -l '$target' >/dev/null"
          done
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); [ -z \"\$wp_bin\" ] || \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium verifier
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify polished toolbar and root modal
        id: browser
        shell: bash
        env:
          SHOP_URL: https://www.elmercadodeorigen.com/tienda/
        run: |
          set +e
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const status={result:'failed',viewports_ok:0,inside_toolbar:0,single_visible_count:0,no_horizontal_overflow:0,no_leading_pin:0,chevron_centered:0,hover_readable:0,modal_root:0,modal_above_catalog:0,close_control_ok:0,click_opens_modal:0,other_destination_option:0,destination_change:0,default_products:0,selected_destination:'',note:''};
          const views=[['desktop',1440,900],['laptop',1180,780],['tablet',768,1024],['landscape',844,390],['portrait',390,844],['narrow',360,800],['tiny',320,720]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const snaps={};
            try{
              for(const [name,width,height] of views){
                const context=await browser.newContext({viewport:{width,height}});
                const page=await context.newPage();
                await page.goto(`${process.env.SHOP_URL}?toolbar_polish=${process.env.GITHUB_RUN_ID||Date.now()}&vp=${name}`,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForSelector('.woostify-sorting.emo-catalog-toolbar-shared-010229',{state:'visible',timeout:20000});
                await page.waitForSelector('.emo-catalog-result-count-010220',{state:'visible',timeout:20000});
                await page.waitForSelector('.emo-catalog-toolbar-shared-010229 .mdo-catalog-destination--canonical [data-mdo-destination-open]',{state:'visible',timeout:20000});
                await page.waitForSelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering',{state:'visible',timeout:20000});
                await page.waitForTimeout(500);
                const button=page.locator('.emo-catalog-toolbar-shared-010229 .mdo-catalog-destination--canonical [data-mdo-destination-open]');
                snaps[name]=await page.evaluate(()=>{
                  const visible=e=>{if(!e)return false;const c=getComputedStyle(e),r=e.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity||1)>0&&r.width>0&&r.height>0};
                  const toolbar=document.querySelector('.woostify-sorting.emo-catalog-toolbar-shared-010229');
                  const count=toolbar?.querySelector('.emo-catalog-result-count-010220');
                  const destination=toolbar?.querySelector('.mdo-catalog-destination--canonical [data-mdo-destination-open]');
                  const ordering=toolbar?.querySelector('.woocommerce-ordering');
                  const chevron=destination?.querySelector('.mdo-catalog-destination__chevron');
                  const pin=toolbar?.querySelector('.mdo-catalog-destination__pin,.mdo-catalog-summarybar__pin');
                  const candidates=[...new Set([...document.querySelectorAll('.woocommerce-result-count,.emo-catalog-result-count-010220,[data-mdo-summary-count],[data-mdo-toolbar-count]')])];
                  const visibleCounts=candidates.filter(visible);
                  const tr=toolbar?.getBoundingClientRect(),dr=destination?.getBoundingClientRect(),or=ordering?.getBoundingClientRect(),cr=count?.getBoundingClientRect(),chr=chevron?.getBoundingClientRect();
                  const inside=r=>!!(tr&&r&&r.left>=tr.left-1.5&&r.right<=tr.right+1.5&&r.top>=tr.top-1.5&&r.bottom<=tr.bottom+1.5);
                  return {visible:visible(toolbar)&&visible(count)&&visible(destination)&&visible(ordering),inside:inside(cr)&&inside(dr)&&inside(or),visibleCountTotal:visibleCounts.length,pinExists:!!pin,chevronDelta:(dr&&chr)?Math.abs((chr.top+chr.height/2)-(dr.top+dr.height/2)):999,pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,toolbarOverflow:toolbar?toolbar.scrollWidth>toolbar.clientWidth+2:true,products:document.querySelectorAll('li.product').length};
                });
                await button.hover();
                const hover=await button.evaluate(el=>({color:getComputedStyle(el).color,children:[...el.querySelectorAll('*')].map(x=>getComputedStyle(x).color)}));
                const white=v=>/rgb\(255,\s*255,\s*255\)/.test(v||'');
                snaps[name].hoverReadable=!white(hover.color)&&hover.children.every(c=>!white(c));
                await page.screenshot({path:`artifacts/catalog-toolbar-${name}.png`,fullPage:false});
                await context.close();
              }

              status.default_products=snaps.desktop?.products||0;
              status.viewports_ok=Object.values(snaps).every(s=>s.visible)?1:0;
              status.inside_toolbar=Object.values(snaps).every(s=>s.inside)?1:0;
              status.single_visible_count=Object.values(snaps).every(s=>s.visibleCountTotal===1)?1:0;
              status.no_horizontal_overflow=Object.values(snaps).every(s=>!s.pageOverflow&&!s.toolbarOverflow)?1:0;
              status.no_leading_pin=Object.values(snaps).every(s=>!s.pinExists)?1:0;
              status.chevron_centered=Object.values(snaps).every(s=>s.chevronDelta<=1.25)?1:0;
              status.hover_readable=Object.values(snaps).every(s=>s.hoverReadable)?1:0;

              const context=await browser.newContext({viewport:{width:390,height:844}});
              const page=await context.newPage();
              await page.goto(`${process.env.SHOP_URL}?modal_polish=${process.env.GITHUB_RUN_ID||Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
              const trigger=page.locator('.emo-catalog-toolbar-shared-010229 .mdo-catalog-destination--canonical [data-mdo-destination-open]');
              await trigger.waitFor({state:'visible',timeout:20000});
              await trigger.click();
              await page.waitForSelector('.mdo-destination-modal--root:not([hidden])',{state:'visible',timeout:7000});
              status.click_opens_modal=1;
              const modalCheck=await page.evaluate(()=>{
                const modal=document.querySelector('.mdo-destination-modal--root');
                const panel=modal?.querySelector('.mdo-destination-modal__panel');
                const close=modal?.querySelector('.mdo-destination-modal__close');
                if(!modal||!panel||!close)return {root:false,above:false,close:false};
                const mc=getComputedStyle(modal),pr=panel.getBoundingClientRect(),cr=close.getBoundingClientRect();
                const x=Math.max(0,Math.min(innerWidth-1,pr.left+pr.width/2));
                const y=Math.max(0,Math.min(innerHeight-1,pr.top+Math.min(110,pr.height/2)));
                const top=document.elementFromPoint(x,y);
                const before=getComputedStyle(close,'::before'),after=getComputedStyle(close,'::after');
                return {root:modal.parentElement===document.body,above:Number(mc.zIndex)>=1000000&&!!top&&modal.contains(top),close:cr.width>=39&&cr.height>=39&&before.content!=='none'&&after.content!=='none'};
              });
              status.modal_root=modalCheck.root?1:0;
              status.modal_above_catalog=modalCheck.above?1:0;
              status.close_control_ok=modalCheck.close?1:0;
              await page.screenshot({path:'artifacts/catalog-toolbar-modal-mobile.png',fullPage:false});

              const select=page.locator('[data-mdo-destination-country]');
              const options=await select.locator('option').evaluateAll(opts=>opts.map(o=>({value:o.value,label:o.textContent.trim()})).filter(o=>o.value));
              const target=options.find(o=>o.value!=='ES');
              if(!target)throw new Error('No supported destination other than Spain is available');
              status.other_destination_option=1;
              status.selected_destination=`${target.value}:${target.label}`;
              await select.selectOption(target.value);
              const responsePromise=page.waitForResponse(r=>{const data=r.request().postData()||'';return r.url().includes('admin-ajax.php')&&data.includes('mdo_set_shipping_destination')},{timeout:15000});
              const navigationPromise=page.waitForNavigation({waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
              await page.locator('[data-mdo-destination-save]').click();
              const response=await responsePromise;let payload=null;try{payload=await response.json()}catch(_){}
              if(!response.ok()||!payload||!payload.success)throw new Error(`Destination AJAX failed: ${response.status()} ${JSON.stringify(payload)}`);
              await navigationPromise;await page.waitForTimeout(500);
              const cookies=await context.cookies();const cc=cookies.find(c=>c.name==='mdo_shipping_country');
              if(!cc||cc.value!==target.value)throw new Error(`Destination cookie not persisted: expected ${target.value}, got ${cc?.value||'missing'}`);
              status.destination_change=1;
              await context.close();

              const keys=['viewports_ok','inside_toolbar','single_visible_count','no_horizontal_overflow','no_leading_pin','chevron_centered','hover_readable','modal_root','modal_above_catalog','close_control_ok','click_opens_modal','other_destination_option','destination_change'];
              if(keys.every(k=>status[k]===1)&&status.default_products>0){status.result='success';status.note='Polished toolbar verified at seven resolutions; no overflow/duplicates, centered chevron, readable hover and root modal above catalogue layers.'}
              else status.note='Failed checks: '+keys.filter(k=>status[k]!==1).join(', ')+' snapshots='+JSON.stringify(snaps);
            }catch(e){status.note=(e&&e.stack?e.stack:String(e)).replace(/\n/g,' | ')}
            finally{await browser.close();fs.writeFileSync('/tmp/mdo-toolbar-browser.json',JSON.stringify(status,null,2));console.log(JSON.stringify(status,null,2))}
          })();
          NODE
          [ -s /tmp/mdo-toolbar-browser.json ] || printf '{"result":"failed","note":"missing browser status"}\n' >/tmp/mdo-toolbar-browser.json
          RESULT="$(python3 -c "import json;print(json.load(open('/tmp/mdo-toolbar-browser.json')).get('result','failed'))")"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record verification
        if: always()
        shell: bash
        run: |
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os,datetime
          try:d=json.load(open('/tmp/mdo-toolbar-browser.json'))
          except Exception as e:d={'result':'failed','note':str(e)}
          keys=['result','viewports_ok','inside_toolbar','single_visible_count','no_horizontal_overflow','no_leading_pin','chevron_centered','hover_readable','modal_root','modal_above_catalog','close_control_ok','click_opens_modal','other_destination_option','destination_change','default_products','selected_destination','note']
          out=[f'source_commit={os.environ.get("GITHUB_SHA","")}',f'workflow_run={os.environ.get("GITHUB_RUN_ID","")}',f'checked_at={datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}']+[f'{k}={str(d.get(k,"" )).replace(chr(10)," ")}' for k in keys]
          open('.deploy-status/catalog-toolbar-live.txt','w').write('\n'.join(out)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-toolbar-live.txt
          git commit -m 'Record polished catalog toolbar check [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-toolbar-browser-${{ github.run_id }}
          path: artifacts/catalog-toolbar-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if verification is wrong
        if: steps.browser.outputs.result != 'success'
        run: exit 1

name: Request 010195 Home inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/request-010195-home-inspect.cjs'
      - '.github/workflows/request-010195-home-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Inspect Home structure
        run: node .github/scripts/request-010195-home-inspect.cjs

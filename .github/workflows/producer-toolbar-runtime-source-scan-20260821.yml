name: Producer toolbar runtime source scan

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-runtime-source-scan-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Temporarily mount producer toolbar and scan runtime scripts
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/producer-toolbar-runtime-source-scan-20260821.txt
          : > "$STATUS"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          TARGET="$PROD_PATH/wp-content/mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php"
          REMOTE="/tmp/mdo-toolbar-runtime-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "cp '$REMOTE' '$TARGET'; rm -f '$REMOTE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null || true"
          cleanup(){ sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null || true" || true; }
          trap cleanup EXIT
          python -m pip install --quiet selenium
          export RUN="$GITHUB_RUN_ID"
          python - <<'PY' >> "$STATUS" 2>&1
          import os, json
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1440,1000')
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,20); base='https://www.elmercadodeorigen.com'; run=os.environ['RUN']
          d.get(base+'/?seed='+run); d.add_cookie({'name':'mdo_shipping_country','value':'ES','domain':'www.elmercadodeorigen.com','path':'/'}); d.get(base+'/tienda/1957/?runtime='+run)
          t=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'[data-mdo-ps-destination-open]')))
          bar=t.find_element(By.XPATH,"ancestor::*[contains(concat(' ',normalize-space(@class),' '),' woostify-sorting ')][1]")
          print('BAR_CLASS',bar.get_attribute('class'))
          print('BAR_STYLE',repr(bar.get_attribute('style')))
          print('BAR_BG',d.execute_script('return getComputedStyle(arguments[0]).backgroundColor',bar))
          result=d.execute_async_script(r'''
          const done=arguments[arguments.length-1];
          (async()=>{
            const needles=['elmercado-vendor-sorting-normalized','woostify-sorting','removeAttribute','removeAttr','style.cssText'];
            const out=[];
            const scripts=Array.from(document.scripts);
            for(let i=0;i<scripts.length;i++){
              const s=scripts[i]; let text='', source=s.src||('inline#'+i);
              try{
                if(s.src){ const u=new URL(s.src,location.href); if(u.origin!==location.origin) continue; text=await (await fetch(u.href,{credentials:'same-origin',cache:'no-store'})).text(); }
                else text=s.textContent||'';
              }catch(e){ continue; }
              const hit=needles.filter(n=>text.includes(n));
              if(!hit.length) continue;
              const snippets=[];
              for(const n of hit){ const p=text.indexOf(n); snippets.push(text.slice(Math.max(0,p-450),Math.min(text.length,p+900))); }
              out.push({source,hit,snippets});
            }
            done(out);
          })().catch(e=>done([{error:String(e),stack:e&&e.stack}]));
          ''')
          print('RUNTIME_SCRIPT_MATCHES',json.dumps(result,ensure_ascii=False,indent=2))
          d.quit()
          PY
      - name: Record runtime source scan
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-runtime-source-scan-20260821.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record producer toolbar runtime source scan [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

name: Audit blog/product category map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-category-map-audit-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read and verify live taxonomies
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          [ -n "$wp_bin" ] || { echo "WP-CLI not found"; exit 1; }
          [ -n "$php_bin" ] || { echo "PHP not found"; exit 1; }
          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?production path not found}"
          output=$("$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            $blog = get_terms(array("taxonomy"=>"category","hide_empty"=>false));
            usort($blog, fn($a,$b)=>strcmp($a->slug,$b->slug));
            foreach ($blog as $t) echo "BLOG_CATEGORY|{$t->slug}|{$t->name}|{$t->count}\n";
            $prod = get_terms(array("taxonomy"=>"product_cat","hide_empty"=>false));
            usort($prod, fn($a,$b)=>strcmp($a->slug,$b->slug));
            foreach ($prod as $t) echo "PRODUCT_CATEGORY|{$t->slug}|{$t->name}|{$t->count}\n";

            $tests = array(
              "aceite" => "aceites",
              "aceites" => "aceites",
              "carnes" => "carnes",
              "conservas" => "conservas",
              "embutidos" => "embutidos-y-curados",
              "embutidos-y-curados" => "embutidos-y-curados",
              "hortalizas-y-verduras" => "hortalizas-verduras",
              "jamones-y-paletas" => "jamones-paletas",
              "legumbres" => "legumbres",
              "packs-y-lotes" => "packs-y-lotes",
              "quesos" => "quesos"
            );
            foreach ($tests as $from => $expected) {
              $actual = elmercado_blog_filter_product_category_slug_010277($from, 0);
              echo "MAP|{$from}|{$actual}|" . ($actual === $expected ? "PASS" : "FAIL") . "\n";
            }

            foreach (array("jamones-y-paletas"=>"jamones-paletas", "hortalizas-y-verduras"=>"hortalizas-verduras") as $editorial => $expected) {
              $term = get_term_by("slug", $editorial, "category");
              if (!$term instanceof WP_Term) {
                echo "ARTICLE_TEST|{$editorial}|NO_TERM|FAIL\n";
                continue;
              }
              $posts = get_posts(array("post_type"=>"post", "post_status"=>"publish", "numberposts"=>1, "category"=>(int)$term->term_id));
              if (empty($posts)) {
                echo "ARTICLE_TEST|{$editorial}|NO_POST|FAIL\n";
                continue;
              }
              $p = $posts[0];
              setup_postdata($p);
              $resolved = elmercado_blog_product_category_slug_010277((int)$p->ID);
              $rendered = do_shortcode("[elmercado_dynamic_products category=\"{$resolved}\" heading=\"1\"]");
              $ok = $resolved === $expected && false !== strpos($rendered, "data-product-category=\"{$expected}\"");
              echo "ARTICLE_TEST|{$editorial}|{$p->ID}|{$resolved}|" . ($ok ? "PASS" : "FAIL") . "|" . get_permalink($p) . "\n";
              wp_reset_postdata();
            }

            $jabugo_posts = get_posts(array("post_type"=>"post", "post_status"=>"publish", "numberposts"=>5, "s"=>"Jabugo"));
            foreach ($jabugo_posts as $p) {
              setup_postdata($p);
              $resolved = elmercado_blog_product_category_slug_010277((int)$p->ID);
              $rendered = do_shortcode("[elmercado_dynamic_products category=\"{$resolved}\" heading=\"1\"]");
              $ok = "jamones-paletas" === $resolved && false !== strpos($rendered, "data-product-category=\"jamones-paletas\"");
              echo "JABUGO_TEST|{$p->ID}|{$resolved}|" . ($ok ? "PASS" : "FAIL") . "|" . get_the_title($p) . "|" . get_permalink($p) . "\n";
              wp_reset_postdata();
            }
          ' 2>/dev/null)
          printf '%s\n' "$output"
          ! grep -q '|FAIL' <<< "$output"
          grep -qx 'MAP|jamones-y-paletas|jamones-paletas|PASS' <<< "$output"
          grep -qx 'MAP|hortalizas-y-verduras|hortalizas-verduras|PASS' <<< "$output"
          grep -q '^ARTICLE_TEST|jamones-y-paletas|[0-9].*|jamones-paletas|PASS|' <<< "$output"
          grep -q '^ARTICLE_TEST|hortalizas-y-verduras|[0-9].*|hortalizas-verduras|PASS|' <<< "$output"
          REMOTE

name: Home runtime performance 0.10.258 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-runtime-performance-010258-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Home runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) La sonda geométrica de H1 sólo pertenece al blog/editorial.
          p=Path('elmercadodeorigen-child/inc/semantic-polish.php')
          s=p.read_text()
          old="""\t\t\t/* En el archivo del blog el nombre del sitio no debe competir con el H1 editorial. */
\t\t\tconst visibleHeadingOne = [...document.querySelectorAll('h1')].filter((heading) => {
\t\t\t\tconst style = getComputedStyle(heading);
\t\t\t\treturn style.display !== 'none' && style.visibility !== 'hidden' && heading.getClientRects().length > 0;
\t\t\t});
\t\t\tconst brandingHeading = document.querySelector('.site-branding h1.site-title');

\t\t\tif (brandingHeading && visibleHeadingOne.length > 1) {
\t\t\t\tconst replacement = document.createElement('div');
\t\t\t\t[...brandingHeading.attributes].forEach((attribute) => replacement.setAttribute(attribute.name, attribute.value));
\t\t\t\treplacement.removeAttribute('id');
\t\t\t\treplacement.classList.add('site-title');
\t\t\t\treplacement.append(...brandingHeading.childNodes);
\t\t\t\tbrandingHeading.replaceWith(replacement);
\t\t\t}
"""
          new="""\t\t\t<?php if ( is_home() || is_singular( 'post' ) || is_category() || is_tag() || is_author() || is_date() ) : ?>
\t\t\t/* En el contexto editorial el nombre del sitio no debe competir con el H1. */
\t\t\tconst visibleHeadingOne = [...document.querySelectorAll('h1')].filter((heading) => {
\t\t\t\tconst style = getComputedStyle(heading);
\t\t\t\treturn style.display !== 'none' && style.visibility !== 'hidden' && heading.getClientRects().length > 0;
\t\t\t});
\t\t\tconst brandingHeading = document.querySelector('.site-branding h1.site-title');

\t\t\tif (brandingHeading && visibleHeadingOne.length > 1) {
\t\t\t\tconst replacement = document.createElement('div');
\t\t\t\t[...brandingHeading.attributes].forEach((attribute) => replacement.setAttribute(attribute.name, attribute.value));
\t\t\t\treplacement.removeAttribute('id');
\t\t\t\treplacement.classList.add('site-title');
\t\t\t\treplacement.append(...brandingHeading.childNodes);
\t\t\t\tbrandingHeading.replaceWith(replacement);
\t\t\t}
\t\t\t<?php endif; ?>
"""
          if old not in s:
              raise SystemExit('semantic H1 block not found')
          p.write_text(s.replace(old,new,1))

          # 2) La tubería de Home elimina scripts geométricos redundantes y retrasa sólo GLA Ads.
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          needle="""\n\treturn $html;\n}\n\nfunction elmercado_can_cache_home_request(): bool {"""
          if needle not in s:
              raise SystemExit('home optimization return marker not found')
          addition=r'''
	/*
	 * Dos capas históricas siguen imprimiendo JavaScript de geometría en Home
	 * aunque sus medidas ya están fijadas por el CSS crítico. Quitarlas evita
	 * lecturas de layout tras escrituras de estilo (forced reflow).
	 */
	$html = preg_replace(
		"~<script\\b[^>]*\\bid=[\"']elmercado-mobile-header-hitareas-final[\"'][^>]*>.*?</script\\s*>~is",
		'',
		$html
	) ?? $html;
	$html = preg_replace(
		"~<script\\b[^>]*\\bid=[\"']elmercado-catalog-mobile-controls-parity-script-010236[\"'][^>]*>.*?</script\\s*>~is",
		'',
		$html
	) ?? $html;

	/*
	 * Google for WooCommerce necesita conservar dataLayer, consentimiento y
	 * eventos. Sólo retrasamos la descarga pesada de gtag.js de Google Ads en
	 * la portada. Todo lo que el plugin empuje a dataLayer queda en cola y se
	 * procesa en la primera interacción; GA4/MonsterInsights permanece intacto.
	 */
	$delayed_ads_src = '';
	$html = preg_replace_callback(
		"~<script\\b[^>]*\\bsrc=[\"'](https://www\\.googletagmanager\\.com/gtag/js\\?id=(AW-[^\"'&<>]+)[^\"']*)[\"'][^>]*>\\s*</script\\s*>~i",
		static function ( array $matches ) use ( &$delayed_ads_src ): string {
			$delayed_ads_src = html_entity_decode( (string) $matches[1], ENT_QUOTES | ENT_HTML5, 'UTF-8' );
			return '<script type="application/json" id="elmercado-delayed-google-ads-source" data-src="' . esc_attr( $delayed_ads_src ) . '"></script>';
		},
		$html,
		1
	) ?? $html;

	if ( '' !== $delayed_ads_src && false === strpos( $html, 'id="elmercado-delayed-google-ads-loader"' ) ) {
		$loader = <<<'HTML'
<script id="elmercado-delayed-google-ads-loader">
(()=>{'use strict';const marker=document.getElementById('elmercado-delayed-google-ads-source');if(!marker)return;let loaded=false;const events=['pointerdown','touchstart','keydown','scroll'];const cleanup=()=>events.forEach((name)=>window.removeEventListener(name,load,true));const load=()=>{if(loaded)return;loaded=true;cleanup();const src=marker.dataset.src;if(!src)return;const script=document.createElement('script');script.async=true;script.src=src;script.dataset.elmercadoDelayed='google-ads';document.head.appendChild(script);};events.forEach((name)=>window.addEventListener(name,load,{once:true,capture:true,passive:name!=='keydown'}));window.setTimeout(load,30000);})();
</script>
HTML;
		$html = preg_replace( '~</body>~i', $loader . '</body>', $html, 1 ) ?? $html;
	}
'''
          s=s.replace(needle,addition+needle,1)
          p.write_text(s)

          # 3) Nueva versión: invalida cache/transient y crea CSS diferido nuevo.
          p=Path('elmercadodeorigen-child/functions.php')
          s=p.read_text()
          s=s.replace("define( 'ELMERCADO_THEME_VERSION', '0.10.256' );", "define( 'ELMERCADO_THEME_VERSION', '0.10.258' );", 1)
          s=s.replace('/* 0.10.256 estabiliza el primer render de Home, CLS y renueva sus cachés estáticas. */', '/* 0.10.258 reduce trabajo JS/reflows de Home y difiere Google Ads sin perder su cola de eventos. */', 1)
          p.write_text(s)
          PY
          php -l elmercadodeorigen-child/inc/semantic-polish.php
          php -l elmercadodeorigen-child/inc/home-cache.php
          php -l elmercadodeorigen-child/functions.php
          grep -q 'elmercado-delayed-google-ads-loader' elmercadodeorigen-child/inc/home-cache.php
          grep -q "ELMERCADO_THEME_VERSION', '0.10.258" elmercadodeorigen-child/functions.php

      - name: Deploy production runtime optimization
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/semantic-polish.php "$STAGING_USER@$STAGING_HOST:/tmp/semantic-polish-010258.php"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-010258.php"
          sshpass -e scp $SCP elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:/tmp/functions-010258.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            cp \"\$THEME/inc/semantic-polish.php\" \"\$THEME/inc/semantic-polish.php.bak-$GITHUB_RUN_ID\"
            cp \"\$THEME/inc/home-cache.php\" \"\$THEME/inc/home-cache.php.bak-$GITHUB_RUN_ID\"
            cp \"\$THEME/functions.php\" \"\$THEME/functions.php.bak-$GITHUB_RUN_ID\"
            install -m 0644 /tmp/semantic-polish-010258.php \"\$THEME/inc/semantic-polish.php\"
            install -m 0644 /tmp/home-cache-010258.php \"\$THEME/inc/home-cache.php\"
            install -m 0644 /tmp/functions-010258.php \"\$THEME/functions.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/semantic-polish.php\"
            \"\$php_bin\" -l \"\$THEME/inc/home-cache.php\"
            \"\$php_bin\" -l \"\$THEME/functions.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/semantic-polish-010258.php /tmp/home-cache-010258.php /tmp/functions-010258.php
          "

      - name: Verify live HTML browser behavior and Lighthouse
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          HTML=/tmp/home-010258.html
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          semantic_h1=$(grep -c 'visibleHeadingOne' "$HTML" || true)
          mobile_hitareas=$(grep -c 'id="elmercado-mobile-header-hitareas-final"' "$HTML" || true)
          catalog_parity=$(grep -c 'id="elmercado-catalog-mobile-controls-parity-script-010236"' "$HTML" || true)
          ads_external=$(grep -c 'googletagmanager.com/gtag/js?id=AW-' "$HTML" || true)
          ads_marker=$(grep -c 'id="elmercado-delayed-google-ads-source"' "$HTML" || true)
          ads_loader=$(grep -c 'id="elmercado-delayed-google-ads-loader"' "$HTML" || true)
          ga4_external=$(grep -c 'googletagmanager.com/gtag/js?id=G-515YQ0XMS4' "$HTML" || true)
          hustle_inline=$(grep -c 'hustle_inline_styles_front-inline-css' "$HTML" || true)

          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/browser-010258.json
          const { chromium }=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1800);
            const before=await page.evaluate(()=>({
              ads:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js?id=AW-')).length,
              ga4:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js?id=G-515YQ0XMS4')).length,
              dataLayer:Array.isArray(window.dataLayer),
              queued:Array.isArray(window.dataLayer)?window.dataLayer.length:0
            }));
            await page.evaluate(()=>window.dispatchEvent(new Event('scroll')));
            await page.waitForTimeout(1800);
            const after=await page.evaluate(()=>({
              ads:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js?id=AW-')).length,
              delayed:[...document.scripts].filter(s=>s.dataset.elmercadoDelayed==='google-ads').length,
              dataLayer:Array.isArray(window.dataLayer),
              queued:Array.isArray(window.dataLayer)?window.dataLayer.length:0
            }));
            console.log(JSON.stringify({before,after},null,2));
            await browser.close();
            if(before.ads!==0 || before.ga4<1 || !before.dataLayer || after.ads<1 || after.delayed<1 || !after.dataLayer) process.exit(12);
          })().catch(e=>{console.error(e);process.exit(13)});
          JS

          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr-010258.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          SEMANTIC="$semantic_h1" MOBILE="$mobile_hitareas" CATALOG="$catalog_parity" ADS="$ads_external" MARKER="$ads_marker" LOADER="$ads_loader" GA4="$ga4_external" HUSTLE="$hustle_inline" python3 - <<'PY' > runtime/home-runtime-performance-010258.txt
          import json,os
          a=json.load(open('/tmp/lhr-010258.json'))['audits']
          print('deploy=success')
          print('semantic_h1_probe=',os.environ['SEMANTIC'])
          print('mobile_hitareas_script=',os.environ['MOBILE'])
          print('catalog_parity_script=',os.environ['CATALOG'])
          print('ads_external_initial=',os.environ['ADS'])
          print('ads_delayed_marker=',os.environ['MARKER'])
          print('ads_delayed_loader=',os.environ['LOADER'])
          print('ga4_external_initial=',os.environ['GA4'])
          print('hustle_inline=',os.environ['HUSTLE'])
          print(open('/tmp/browser-010258.json').read().strip())
          for k in ('first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','unused-javascript','mainthread-work-breakdown','forced-reflow-insight'):
              x=a.get(k,{})
              print(f'{k}: numeric={x.get("numericValue")} display={x.get("displayValue")} score={x.get("score")}')
              if k in ('mainthread-work-breakdown','forced-reflow-insight'):
                  items=((x.get('details') or {}).get('items') or [])[:12]
                  if items: print(json.dumps(items,ensure_ascii=False,separators=(',',':')))
          PY
          cat runtime/home-runtime-performance-010258.txt
          test "$semantic_h1" -eq 0
          test "$mobile_hitareas" -eq 0
          test "$catalog_parity" -eq 0
          test "$ads_external" -eq 0
          test "$ads_marker" -ge 1
          test "$ads_loader" -ge 1
          test "$ga4_external" -ge 1

      - name: Commit optimized source and verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-runtime-performance-010258.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-runtime-performance-010258.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/semantic-polish.php elmercadodeorigen-child/inc/home-cache.php elmercadodeorigen-child/functions.php runtime/home-runtime-performance-010258.txt
          git commit -m 'Reduce Home reflows and defer Google Ads gtag' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: SEO finalize production 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-finalize-20260821.yml'
      - 'mu-plugins/emdo-seo-cleanup-layer.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-finalize-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate SEO layer
        run: php -l mu-plugins/emdo-seo-cleanup-layer.php

      - name: Deploy and verify production SEO
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "Production path located"

          REMOTE_FILE="$PROD_PATH/wp-content/mu-plugins/emdo-seo-cleanup-layer.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$REMOTE_FILE' ]; then cp '$REMOTE_FILE' '$REMOTE_FILE.bak-${GITHUB_RUN_ID}'; fi"
          sshpass -e scp $SCP mu-plugins/emdo-seo-cleanup-layer.php "$STAGING_USER@$STAGING_HOST:$REMOTE_FILE"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -l '$REMOTE_FILE'; wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          # Verify redirects and action-URL robots from the production host itself.
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e;
            base='https://www.elmercadodeorigen.com';
            h1=\$(curl -ksSI --max-time 20 \"\$base/inicio-bf/\"); echo \"\$h1\" | head -n 8; echo \"\$h1\" | grep -Eq '^HTTP/[^ ]+ 301'; echo \"\$h1\" | grep -qi '^location: .*elmercadodeorigen.com/';
            h2=\$(curl -ksSI --max-time 20 \"\$base/el-mercado-de-origen/\"); echo \"\$h2\" | head -n 8; echo \"\$h2\" | grep -Eq '^HTTP/[^ ]+ 301'; echo \"\$h2\" | grep -qi '/quienes-somos/';
            h3=\$(curl -ksSI --max-time 20 \"\$base/condiciones-especiales/\"); echo \"\$h3\" | head -n 8; echo \"\$h3\" | grep -Eq '^HTTP/[^ ]+ 301'; echo \"\$h3\" | grep -qi '/envios/';
            action=\$(curl -ksS --max-time 25 \"\$base/?add-to-cart=5080\" || true); printf '%s' \"\$action\" | grep -Eqi '<meta[^>]+name=[\"'\"']robots[\"'\"'][^>]+noindex|<meta[^>]+content=[\"'\"'][^\"'\"']*noindex[^\"'\"']*[\"'\"'][^>]+name=[\"'\"']robots' || true;
          "

          # Verify sitemap policy using WP itself: no legacy/functional pages, no disabled vendors,
          # and stock visibility mirrors the WooCommerce setting.
          AUDIT="/tmp/emdo-seo-final-${GITHUB_RUN_ID}.php"
          cat > /tmp/emdo-seo-final.php <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit(1);
          $hide = (string) get_option('woocommerce_hide_out_of_stock_items', 'no');
          $ids = function_exists('emdo_cleanup_eligible_product_ids') ? emdo_cleanup_eligible_product_ids() : array();
          $bad_disabled = 0; $bad_stock = 0; $bad_hidden = 0;
          foreach ($ids as $id) {
              $p = get_post($id); $wc = function_exists('wc_get_product') ? wc_get_product($id) : null;
              if ($p && function_exists('emdo_cleanup_vendor_is_disabled') && emdo_cleanup_vendor_is_disabled((int)$p->post_author)) $bad_disabled++;
              if ($wc && 'hidden' === (string)$wc->get_catalog_visibility()) $bad_hidden++;
              if ($wc && 'yes' === $hide && 'outofstock' === (string)$wc->get_stock_status()) $bad_stock++;
          }
          $excluded = function_exists('emdo_cleanup_excluded_page_ids') ? emdo_cleanup_excluded_page_ids() : array();
          $legacy = array('inicio-bf','el-mercado-de-origen','condiciones-especiales','store-manager','affiliates');
          $missing_exclusions = array();
          foreach ($legacy as $slug) { $page=get_page_by_path($slug, OBJECT, 'page'); if ($page instanceof WP_Post && !in_array((int)$page->ID,$excluded,true)) $missing_exclusions[]=$slug; }
          echo 'HIDE_OUT_OF_STOCK='.$hide."\n";
          echo 'ELIGIBLE_PRODUCTS='.count($ids)."\n";
          echo 'BAD_DISABLED='.$bad_disabled."\n";
          echo 'BAD_HIDDEN='.$bad_hidden."\n";
          echo 'BAD_OUT_OF_STOCK='.$bad_stock."\n";
          echo 'MISSING_PAGE_EXCLUSIONS='.implode(',', $missing_exclusions)."\n";
          if ($bad_disabled || $bad_hidden || $bad_stock || $missing_exclusions) exit(2);
          echo "SEO_FINAL_POLICY_VERIFY=PASS\n";
          PHP
          sshpass -e scp $SCP /tmp/emdo-seo-final.php "$STAGING_USER@$STAGING_HOST:$AUDIT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$AUDIT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$AUDIT'; exit \$rc"

name: Deploy visible category SEO descriptions 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/emdo-category-seo-description.php'
      - '.github/workflows/deploy-category-seo-description-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-category-seo-description
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint plugin
        run: php -l mu-plugins/emdo-category-seo-description.php
      - name: Install SSH helper
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/emdo-category-seo-description-${GITHUB_RUN_ID}.php"
          DEST="$PROD_PATH/wp-content/mu-plugins/emdo-category-seo-description.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/emdo-category-seo-description.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$DEST' ]; then cp -a '$DEST' '$DEST.bak-'\$(date +%Y%m%d%H%M%S); fi; cp '$REMOTE' '$DEST'; rm -f '$REMOTE'; \"\$php_bin\" -l '$DEST'; \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify ES and EN category archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/reports
          python3 - <<'PY' | tee .github/reports/category-seo-description-production-20260821.txt
          import ssl,time,urllib.request,urllib.error
          base='https://www.elmercadodeorigen.com'
          ctx=ssl.create_default_context(); stamp=str(time.time_ns())
          paths=[
            '/categoria-producto/aceites/', '/en/product-category/oils/',
            '/categoria-producto/jamones-paletas/', '/en/product-category/hams-and-shoulders/',
            '/categoria-producto/embutidos-y-curados/', '/en/product-category/cured-meats/',
            '/categoria-producto/packs-y-lotes/', '/en/product-category/packs-and-bundles/',
            '/categoria-producto/carnes/', '/en/product-category/meat/',
            '/categoria-producto/conservas/', '/en/product-category/preserves/',
            '/categoria-producto/hortalizas-verduras/', '/en/product-category/vegetables/',
            '/categoria-producto/legumbres/', '/en/product-category/pulses/',
          ]
          failures=[]
          for path in paths:
            req=urllib.request.Request(base+path+'?emdo_category_desc_verify='+stamp,headers={'User-Agent':'EMDO-Category-Description-Verify/2026-08-21'})
            try:
              with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
                status=r.status; body=r.read().decode('utf-8','replace')
            except urllib.error.HTTPError as e:
              status=e.code; body=e.read().decode('utf-8','replace')
            marker='data-emdo-category-description="1"' in body
            print(f'CATEGORY|{path}|HTTP={status}|DESCRIPTION_MARKER={marker}|BYTES={len(body.encode())}')
            if status!=200: failures.append(f'{path} HTTP {status}')
            if not marker: failures.append(f'{path} missing visible category description')
          # The visible description is intentionally omitted on page 2 to avoid repeating a long block.
          req=urllib.request.Request(base+'/categoria-producto/jamones-paletas/page/2/?emdo_category_desc_verify='+stamp,headers={'User-Agent':'EMDO-Category-Description-Verify/2026-08-21'})
          try:
            with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
              p2status=r.status; p2body=r.read().decode('utf-8','replace')
          except urllib.error.HTTPError as e:
            p2status=e.code; p2body=e.read().decode('utf-8','replace')
          p2marker='data-emdo-category-description="1"' in p2body
          print(f'PAGINATION|HTTP={p2status}|DESCRIPTION_MARKER={p2marker}')
          if p2status==200 and p2marker: failures.append('category description repeated on page 2')
          if failures:
            print('FAILURES:')
            for f in failures: print('- '+f)
            raise SystemExit(2)
          print('CATEGORY_SEO_DESCRIPTION_VERIFY=PASS')
          PY
      - name: Save report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT=.github/reports/category-seo-description-production-20260821.txt
          [ -f "$REPORT" ] || echo "Verification report missing" > "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record category SEO description verification [skip ci]"
          git pull --rebase origin main
          git push

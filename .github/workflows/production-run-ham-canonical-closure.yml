name: Run ham canonical closure in production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-run-ham-canonical-closure.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN: elmercadodeorigen.com
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      PASS: ${{ secrets.STAGING_PASSWORD }}
      HINT: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Apply canonical closure with eval-file
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$P" -H "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$HINT' '$DOMAIN'" <<'REMOTE'
          set -eu
          hint="${1%/}"
          target="$2"
          wp="$(command -v wp)"
          php="$(command -v php || true)"
          if [ -z "$php" ]; then
            php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          fi
          [ -x "$php" ]

          candidates="$(mktemp)"
          script="$(mktemp --suffix=.php)"
          trap 'rm -f "$candidates" "$script"' EXIT
          for base in "$(dirname "$hint")" "$HOME" /var/www/vhosts /var/www /home; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true
          done
          wp_path=""
          while IFS= read -r config; do
            [ -n "$config" ] || continue
            path="$(dirname "$config")"
            siteurl="$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            norm="$(printf '%s' "$siteurl" | sed -E 's#^https?://##; s#^www\.##; s#/*$##')"
            if [ "$norm" = "$target" ]; then
              wp_path="$path"
              break
            fi
          done < "$candidates"
          [ -n "$wp_path" ] || { echo 'Production WordPress not found.' >&2; exit 2; }

          version="$("$php" -d memory_limit=512M "$wp" plugin get mdo-supplier-sync --field=version --path="$wp_path" --allow-root)"
          [ "$version" = '1.0.5' ] || { echo "Expected EMDO 1.0.5, got $version" >&2; exit 3; }
          "$php" -d memory_limit=512M "$wp" plugin is-active mdo-supplier-sync --path="$wp_path" --allow-root

          cat > "$script" <<'PHP'
          <?php
          if ( ! class_exists( 'MDO_Ham_Catalog_Canonical_Closure' ) ) {
              fwrite( STDERR, "Canonical closure class is unavailable.\n" );
              exit( 4 );
          }

          $report = MDO_Ham_Catalog_Canonical_Closure::apply_catalog();
          $category = get_term_by( 'slug', 'jamones-paletas', 'product_cat' );
          if ( ! $category ) {
              fwrite( STDERR, "Jamones y paletas category is missing.\n" );
              exit( 5 );
          }

          $ids = get_posts(
              array(
                  'post_type'      => 'product',
                  'post_status'    => array( 'publish', 'private', 'draft', 'pending', 'future' ),
                  'posts_per_page' => -1,
                  'fields'         => 'ids',
                  'tax_query'      => array(
                      array(
                          'taxonomy' => 'product_cat',
                          'field'    => 'term_id',
                          'terms'    => array( (int) $category->term_id ),
                      ),
                  ),
              )
          );

          $extra_changed = 0;
          foreach ( array_map( 'intval', $ids ) as $id ) {
              $result = MDO_Ham_Catalog_Canonical_Closure::canonicalize_product( $id );
              if ( ! empty( $result['changed'] ) ) {
                  ++$extra_changed;
              }
          }

          $weight_terms = wp_get_post_terms( 12460, 'pa_rango-peso', array( 'fields' => 'names' ) );
          $producer_terms = wp_get_post_terms( 12631, 'pa_productor', array( 'fields' => 'names' ) );

          echo wp_json_encode(
              array(
                  'status'          => 'completed',
                  'siteurl'         => get_option( 'siteurl' ),
                  'emdo_version'    => MDO_SUPPLIER_SYNC_VERSION,
                  'catalog_report'  => $report,
                  'category_count'  => count( $ids ),
                  'extra_changed'   => $extra_changed,
                  'sample_weight'   => is_wp_error( $weight_terms ) ? array() : $weight_terms,
                  'sample_producer' => is_wp_error( $producer_terms ) ? array() : $producer_terms,
              ),
              JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT
          ) . PHP_EOL;
          PHP

          "$php" -d memory_limit=1024M "$wp" eval-file "$script" --path="$wp_path" --allow-root
          "$php" -d memory_limit=512M "$wp" cache flush --path="$wp_path" --allow-root || true
          REMOTE

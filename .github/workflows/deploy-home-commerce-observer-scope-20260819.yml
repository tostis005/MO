name: Scope Home commerce observer 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-commerce-observer-scope-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-commerce-observer-scope-20260819
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope mini-cart MutationObserver
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/assets/js/commerce.js')
          s=p.read_text()
          old="""\tpolishMiniCart();
\tlet miniCartFrame = 0;
\tconst miniCartObserver = new MutationObserver((mutations) => {
\t\tif (!mutations.some((mutation) => [...mutation.addedNodes].some((node) => node.nodeType === Node.ELEMENT_NODE))) return;
\t\tif (miniCartFrame) return;
\t\tminiCartFrame = window.requestAnimationFrame(() => {
\t\t\tpolishMiniCart();
\t\t\tupdateCartAccessibleName();
\t\t\tminiCartFrame = 0;
\t\t});
\t});
\tminiCartObserver.observe(document.body, { childList: true, subtree: true });

\tif (window.jQuery) {
\t\twindow.jQuery(document.body).on('wc_fragments_loaded wc_fragments_refreshed added_to_cart removed_from_cart', () => {
\t\t\twindow.requestAnimationFrame(() => polishMiniCart());
\t\t});
\t}
"""
          new="""\tpolishMiniCart();
\t/*
\t * El observador anterior vigilaba todo document.body. En la Home eso lo
\t * despertaba por cada slider, widget o fragmento añadido aunque no tuviera
\t * relación con el carrito. WooCommerce ya emite eventos cuando reemplaza
\t * fragments, por lo que basta con observar el panel del mini-carrito.
\t */
\tconst miniCartPanel = document.querySelector('#shop-cart-sidebar');
\tlet miniCartFrame = 0;
\tif (miniCartPanel) {
\t\tconst miniCartObserver = new MutationObserver((mutations) => {
\t\t\tif (!mutations.some((mutation) => [...mutation.addedNodes].some((node) => node.nodeType === Node.ELEMENT_NODE))) return;
\t\t\tif (miniCartFrame) return;
\t\t\tminiCartFrame = window.requestAnimationFrame(() => {
\t\t\t\tpolishMiniCart(miniCartPanel);
\t\t\t\tupdateCartAccessibleName();
\t\t\t\tminiCartFrame = 0;
\t\t\t});
\t\t});
\t\tminiCartObserver.observe(miniCartPanel, { childList: true, subtree: true });
\t}

\tif (window.jQuery) {
\t\twindow.jQuery(document.body).on('wc_fragments_loaded wc_fragments_refreshed added_to_cart removed_from_cart', () => {
\t\t\twindow.requestAnimationFrame(() => {
\t\t\t\tpolishMiniCart();
\t\t\t\tupdateCartAccessibleName();
\t\t\t});
\t\t});
\t}
"""
          if old not in s:
              if new in s:
                  print('already_patched=true')
              else:
                  raise SystemExit('observer block not found')
          else:
              p.write_text(s.replace(old,new,1))
          PY
          node --check elmercadodeorigen-child/assets/js/commerce.js
          grep -q "miniCartObserver.observe(miniCartPanel" elmercadodeorigen-child/assets/js/commerce.js
          ! grep -q "miniCartObserver.observe(document.body" elmercadodeorigen-child/assets/js/commerce.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/assets/js/commerce.js
          git commit -m 'Scope commerce observer to mini cart' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy commerce.js
        id: deploy
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/commerce-scope-${GITHUB_RUN_ID}.js"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/js/commerce.js "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'; STATIC='$PROD_PATH/wp-content/uploads/elmercado-home-static'
            install -m 0644 '$REMOTE' \"\$THEME/assets/js/commerce.js\"
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true)
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f \"\$STATIC/index.html\" '$REMOTE'
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 "https://www.elmercadodeorigen.com/wp-content/themes/elmercadodeorigen-child/assets/js/commerce.js?v=${GITHUB_RUN_ID}" -o /tmp/live-commerce.js
          grep -q "miniCartObserver.observe(miniCartPanel" /tmp/live-commerce.js
          ! grep -q "miniCartObserver.observe(document.body" /tmp/live-commerce.js

      - name: Browser mini-cart observer regression
        id: browser
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > /tmp/commerce-browser.json
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle2',timeout:60000});
            const data=await page.evaluate(async()=>{
              const panel=document.querySelector('#shop-cart-sidebar');
              const before={exists:!!panel,role:panel?.getAttribute('role')||'',label:panel?.getAttribute('aria-label')||''};
              let observerApplied=null;
              if(panel){
                const probe=document.createElement('li');
                probe.className='woocommerce-mini-cart-item';
                probe.innerHTML='<a href="/producto/prueba/">Producto prueba</a>';
                panel.append(probe);
                await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
                observerApplied=probe.classList.contains('emo-mini-cart-item');
                probe.remove();
              }
              const unrelated=document.createElement('div'); unrelated.id='emo-commerce-unrelated-probe'; document.body.append(unrelated); unrelated.remove();
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
              return {before,observerApplied,cartLabel:document.querySelector('.shopping-bag-button.shopping-cart, a.shopping-cart')?.getAttribute('aria-label')||''};
            });
            console.log(JSON.stringify(data)); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat /tmp/commerce-browser.json > runtime/home-commerce-observer-20260819.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/commerce-browser.json'))
          print(d)
          assert d['before']['exists'],d
          assert d['observerApplied'] is True,d
          PY

      - name: Lighthouse 3x
        id: lighthouse
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/lh-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet; done
          python3 - <<'PY' >> runtime/home-commerce-observer-20260819.txt
          import json,statistics
          rows=[]
          for i in (1,2,3):
              a=json.load(open(f'/tmp/lh-{i}.json')); x=a['audits']; boot=x.get('bootup-time',{}); commerce=0
              for z in (boot.get('details') or {}).get('items',[]):
                  if '/assets/js/commerce.js' in z.get('url',''): commerce += z.get('total',0) or 0
              r={'score':round(a['categories']['performance']['score']*100),'fcp':round(x['first-contentful-paint']['numericValue']),'lcp':round(x['largest-contentful-paint']['numericValue']),'tbt':round(x['total-blocking-time']['numericValue']),'cls':round(x['cumulative-layout-shift']['numericValue'],5),'commerce_cpu':round(commerce,1)}
              rows.append(r); print('run',i,r)
          for k in rows[0]: print('median_'+k+'=',statistics.median(r[k] for r in rows))
          PY
          cat runtime/home-commerce-observer-20260819.txt

      - name: Record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-commerce-observer-20260819.txt ] || printf 'deploy=%s\nbrowser=%s\nlighthouse=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.lighthouse.outcome }}' > runtime/home-commerce-observer-20260819.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-commerce-observer-20260819.txt
          git commit -m 'Record scoped commerce observer verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

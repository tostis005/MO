name: Vendor no-cache guard production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-no-cache-production.yml'
      - '.github/scripts/elmercado-vendor-no-cache.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-vendor-cache
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate guard
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/elmercado-vendor-no-cache.php >/dev/null
          grep -q "'/tienda/'" .github/scripts/elmercado-vendor-no-cache.php
          grep -q 'X-El-Mercado-Vendor-Cache: BYPASS' .github/scripts/elmercado-vendor-no-cache.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Install MU plugin in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

          remote_tmp="/tmp/elmercado-vendor-no-cache-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-vendor-no-cache.php "$STAGING_USER@$STAGING_HOST:$remote_tmp"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php' ]; then cp -p '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php' '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php.bak'; fi; cp '$remote_tmp' '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php'; rm -f '$remote_tmp'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php' >/dev/null"

      - name: Verify live vendor responses bypass cache
        shell: bash
        run: |
          set -euo pipefail
          VENDOR='https://www.elmercadodeorigen.com/tienda/hidalgo-de-la-jara/acercade/'
          HOME='https://www.elmercadodeorigen.com/'
          curl -fsSL -D /tmp/vendor-head -o /tmp/vendor-body -A 'Mozilla/5.0 EMDO vendor cache verify' "$VENDOR"
          tr -d '\r' < /tmp/vendor-head
          grep -Eiq '^cache-control:.*no-store' /tmp/vendor-head
          grep -Eiq '^cache-control:.*no-cache' /tmp/vendor-head
          grep -Eiq '^x-el-mercado-vendor-cache:[[:space:]]*BYPASS' /tmp/vendor-head
          grep -Fq 'La historia de <strong>Hidalgo de la Jara</strong> está profundamente ligada' /tmp/vendor-body
          if grep -Fq 'Los ganaderos que integran Hidalgo de la Jara mantienen intacta' /tmp/vendor-body; then
            echo 'Old Hidalgo copy still present' >&2
            exit 7
          fi
          curl -fsSL -D /tmp/home-head -o /dev/null -A 'Mozilla/5.0 EMDO vendor cache verify' "$HOME"
          if grep -Eiq '^x-el-mercado-vendor-cache:' /tmp/home-head; then
            echo 'Vendor no-cache leaked to Home' >&2
            exit 8
          fi
          echo 'VENDOR_NO_CACHE_PRODUCTION_OK'

      - name: Roll back MU plugin on failure
        if: failure()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          [ -n "${PROD_PATH:-}" ] || exit 0
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "if [ -f '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php.bak' ]; then mv -f '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php.bak' '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php'; else rm -f '$PROD_PATH/wp-content/mu-plugins/elmercado-vendor-no-cache.php'; fi"

name: Home mobile navigation hard close 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-mobile-nav-display-none-20260820.yml'

permissions:
  contents: write

concurrency:
  group: home-mobile-nav-hard-close-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build self-contained first-paint guard
        shell: bash
        run: |
          set -euo pipefail
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/home-cache-before-hard-close.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          old="\t$critical_tag = '<style id=\"elmercado-home-first-view-css\">' . $critical . '</style>';"
          new="""\t/* The closed mobile drawer must not create any box before user intent. */
\t$mobile_nav_guard = '@media(min-width:992px){body.home #mobile-navigation.sidebar-menu,body.home .sidebar-menu{display:none!important}}@media(max-width:991px){html:not([data-emo-menu-intent=\"1\"]) body.home #mobile-navigation.sidebar-menu{display:none!important}}';
\t$mobile_nav_intent = '<script id=\"elmercado-home-mobile-nav-intent-critical\">document.addEventListener(\"click\",function(e){var t=e.target&&e.target.closest?e.target.closest(\".toggle-sidebar-menu-btn\"):null;if(t){document.documentElement.setAttribute(\"data-emo-menu-intent\",\"1\");}},true);</script>';
\t$critical_tag = '<style id=\"elmercado-home-first-view-css\">' . $mobile_nav_guard . $critical . '</style>' . $mobile_nav_intent;"""
          if old not in s:
              raise SystemExit('critical_tag anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
          grep -q 'mobile_nav_guard' elmercadodeorigen-child/inc/home-cache.php
          grep -q 'elmercado-home-mobile-nav-intent-critical' elmercadodeorigen-child/inc/home-cache.php

      - name: Deploy experiment and clear Home cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "$PROD" >/tmp/prod-hard-close
          timeout 45s sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-hard-${GITHUB_RUN_ID}.php"
          timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e; THEME='$PROD/wp-content/themes/elmercadodeorigen-child'
            cp \"\$THEME/inc/home-cache.php\" /tmp/home-cache-server-before-hard-${GITHUB_RUN_ID}.php
            install -m0644 /tmp/home-cache-hard-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/home-cache-hard-${GITHUB_RUN_ID}.php
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-hard.html
          grep -q 'elmercado-home-mobile-nav-intent-critical' /tmp/home-hard.html
          grep -q 'html:not(\[data-emo-menu-intent' /tmp/home-hard.html

      - name: Verify menu still opens on interaction
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' | tee /tmp/menu-interaction.json
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setViewport({width:412,height:915,deviceScaleFactor:1});
            await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:60000});
            const before=await p.evaluate(()=>{const n=document.querySelector('#mobile-navigation');return n?{display:getComputedStyle(n).display,hidden:n.getAttribute('aria-hidden')}:null});
            await p.click('.toggle-sidebar-menu-btn'); await new Promise(r=>setTimeout(r,250));
            const after=await p.evaluate(()=>{const n=document.querySelector('#mobile-navigation');return {intent:document.documentElement.getAttribute('data-emo-menu-intent'),display:getComputedStyle(n).display,visibility:getComputedStyle(n).visibility,hidden:n.getAttribute('aria-hidden'),open:document.documentElement.classList.contains('sidebar-menu-open')||document.body.classList.contains('sidebar-menu-open')}});
            console.log(JSON.stringify({before,after})); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/menu-interaction.json'))
          assert d['before']['display']=='none',d
          assert d['after']['intent']=='1',d
          assert d['after']['display']!='none',d
          PY

      - name: Lighthouse mobile 3x and desktop 2x
        shell: bash
        run: |
          set -euo pipefail; mkdir -p runtime
          for i in 1 2 3; do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=mobile --output=json --output-path="/tmp/mobile-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'; done
          for i in 1 2; do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/desktop-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'; done
          python3 - <<'PY' | tee runtime/home-mobile-nav-hard-close-20260820.txt
          import json,statistics
          def collect(prefix,n):
              rows=[]; print(prefix.upper())
              for i in range(1,n+1):
                  r=json.load(open(f'/tmp/{prefix}-{i}.json')); a=r['audits']; row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']}; rows.append(row); print('run',i,row)
                  for x in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]: n0=x.get('node') or {}; print(' shift',x.get('score'),n0.get('selector') or n0.get('nodeLabel') or '')
              med={k:statistics.median(x[k] for x in rows) for k in rows[0]}; print('median',med); return med
          m=collect('mobile',3); d=collect('desktop',2)
          keep=m['cls']<0.10 and d['cls']<0.10 and m['lcp']<7000 and d['lcp']<7000
          print('keep=',str(keep).lower()); open('/tmp/keep-hard-close','w').write('1' if keep else '0')
          PY

      - name: Keep only on material improvement
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep-hard-close 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then
            cp /tmp/home-cache-before-hard-close.php elmercadodeorigen-child/inc/home-cache.php
            PROD=$(cat /tmp/prod-hard-close); PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
            timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; install -m0644 /tmp/home-cache-server-before-hard-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            "
          fi
          mkdir -p runtime; [ -f runtime/home-mobile-nav-hard-close-20260820.txt ] || echo failed > runtime/home-mobile-nav-hard-close-20260820.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/home-cache.php runtime/home-mobile-nav-hard-close-20260820.txt
          git commit -m 'Measure hard-closed Home mobile navigation' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish nutrition priority batch 21-25 production

on:
  push:
    branches: [main]

concurrency:
  group: publish-nutrition-priority-21-25-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish protected batch 21-25
        shell: bash
        run: bash .github/scripts/run-nutrition-priority-21-25-production.sh

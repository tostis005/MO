name: Publicar rediseño del directorio de productores
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-producer-directory-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emdo-production-producer-directory-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar archivos antes de publicar
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l elmercadodeorigen-child/inc/producer-list-image-square-010242.php
          php -l elmercadodeorigen-child/inc/editorial-finish.php
          php -l elmercadodeorigen-child/inc/editorial-system.php
          grep -q 'elmercado-producer-directory-editorial-20261020' elmercadodeorigen-child/inc/producer-list-image-square-010242.php
          grep -q 'emo-contact-aside emo-producers-intro' elmercadodeorigen-child/inc/editorial-system.php
          ! grep -q 'elmercado-producer-layout-normalizer' elmercadodeorigen-child/inc/editorial-finish.php
          grep -q 'producer-list-image-square-010242.php' elmercadodeorigen-child/functions.php
          : "${STAGING_HOST:?SSH host absent}"
          : "${STAGING_USER:?SSH user absent}"
          : "${SSHPASS:?SSH password absent}"

      - name: Validar las dos imágenes definitivas de jamón
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/emdo-final-hams
          curl --fail --silent --show-error --location --max-time 90 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a0a8-820e-841e-f60d4493205a/raw?se=2026-10-20T19%3A54%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=44b3c3c3-03dc-53e4-af08-53f9565adb64&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T10%3A01%3A28Z&ske=2026-10-21T10%3A01%3A28Z&sks=b&skv=2026-02-06&sig=ih2QbLGrh9DgZyKr0XbG01NfC6SONAnJjXB04su1A38%3D' -o /tmp/emdo-final-hams/hidalgo-de-la-jara.webp
          echo '7c97e33d81cf6f659af7fbf2c90af3126f71394f177e1fab634df72ee4ea083e  /tmp/emdo-final-hams/hidalgo-de-la-jara.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-final-hams/hidalgo-de-la-jara.webp)" -eq 329826
          echo 'FINAL_HAM_VERIFIED hidalgo-de-la-jara'
          curl --fail --silent --show-error --location --max-time 90 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-13dc-820e-81aa-f21f8887491c/raw?se=2026-10-20T19%3A54%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=e98ed0d9-343c-5fdf-8bb2-854c06f6f737&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T21%3A56%3A51Z&ske=2026-10-20T21%3A56%3A51Z&sks=b&skv=2026-02-06&sig=LpEAGQj7cAX13rKMBhSbeJfkJLyztCCMjMq2ETL4ZmU%3D' -o /tmp/emdo-final-hams/montjam.webp
          echo '01cb6148648dbeda0fba4590714413e4a76d6644ca18f9547e7c9300771cd1fc  /tmp/emdo-final-hams/montjam.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-final-hams/montjam.webp)" -eq 267740
          echo 'FINAL_HAM_VERIFIED montjam'
      - name: Instalar utilidades de despliegue y navegador
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null

      - name: Copia de seguridad y publicación acotada a productores
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          SSH_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          INC="$ROOT/wp-content/themes/elmercadodeorigen-child/inc"
          STAGE="/tmp/emdo-producers-design-$GITHUB_RUN_ID"
          BACKUP="$ROOT/wp-content/.emdo-producers-design-backup-$GITHUB_RUN_ID"
          ONE=producer-list-image-square-010242.php
          TWO=editorial-finish.php
          THREE=editorial-system.php
          rollback() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo "::error::Publicación sin verificar; restaurando los tres archivos anteriores"
              sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$INC' '$BACKUP' '$STAGE'" <<'RESTORE' || true
              set -eu
              inc="$1"; backup="$2"; stage="$3"
              test -s "$backup/producer-list-image-square-010242.php" && cp -p "$backup/producer-list-image-square-010242.php" "$inc/"
              test -s "$backup/editorial-finish.php" && cp -p "$backup/editorial-finish.php" "$inc/"
              test -s "$backup/editorial-system.php" && cp -p "$backup/editorial-system.php" "$inc/"
              root="$(dirname "$(dirname "$(dirname "$(dirname "$inc")")")")"
              if [ -s "$backup/native-wcfm-profile-settings.ser" ] && [ -s "$stage/sync-approved-wcfm-banners-20261020.php" ]; then
                EMDO_BANNER_MODE=rollback EMDO_BANNER_META_BACKUP="$backup/native-wcfm-profile-settings.ser" /opt/plesk/php/8.2/bin/php -d memory_limit=512M "$(command -v wp)" eval-file "$stage/sync-approved-wcfm-banners-20261020.php" --path="$root" --allow-root || true
              fi
              dest="$(dirname "$inc")/assets/images/producer-banners"
              if [ -f "$backup/ham-deployment-started" ]; then
              for slug in hidalgo-de-la-jara montjam; do
                if [ -s "$backup/previous-ham-images/$slug.webp" ]; then
                  cp -p "$backup/previous-ham-images/$slug.webp" "$dest/$slug.webp"
                else
                  rm -f "$dest/$slug.webp"
                fi
              done
              fi
              rm -rf "$stage"
              php_bin="$(command -v php || true)"; wp_bin="$(command -v wp || true)"
              root="$(dirname "$(dirname "$(dirname "$(dirname "$inc")")")")"
              if [ -n "$php_bin" ] && [ -n "$wp_bin" ]; then
                "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$root" --skip-plugins --allow-root || true
              fi
          RESTORE
            fi
            exit "$status"
          }
          trap rollback EXIT
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$STAGE'"
          sshpass -e scp $SCP_OPTS "elmercadodeorigen-child/inc/$ONE" "elmercadodeorigen-child/inc/$TWO" "elmercadodeorigen-child/inc/$THREE" ".github/scripts/audit-producer-store-banners-20261020.php" ".github/scripts/sync-approved-wcfm-banners-20261020.php" /tmp/emdo-final-hams/*.webp "$STAGING_USER@$STAGING_HOST:$STAGE/"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$ROOT' '$STAGE' '$BACKUP'" <<'REMOTE'
          set -Eeuo pipefail
          root="$1"; stage="$2"; backup="$3"
          inc="$root/wp-content/themes/elmercadodeorigen-child/inc"
          php_bin=/opt/plesk/php/8.2/bin/php
          wp_bin="$(command -v wp || true)"
          test -f "$root/wp-config.php"
          test -x "$php_bin" && test -n "$wp_bin"
          printf 'REMOTE_PHP=%s WP_CLI=%s\\n' "$php_bin" "$wp_bin"
          url="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$root" --skip-plugins --skip-themes --allow-root)"
          case "$url" in
            https://elmercadodeorigen.com|https://www.elmercadodeorigen.com|http://elmercadodeorigen.com|http://www.elmercadodeorigen.com) ;;
            *) echo "La instalación no es la de producción: $url" >&2; exit 1;;
          esac
          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file "$stage/audit-producer-store-banners-20261020.php" --path="$root" --allow-root
          "$php_bin" -l "$stage/sync-approved-wcfm-banners-20261020.php"
          for slug in hidalgo-de-la-jara montjam; do
            test -s "$stage/$slug.webp"
          done
          for f in producer-list-image-square-010242.php editorial-finish.php editorial-system.php; do
            test -s "$inc/$f" && test -s "$stage/$f"
            "$php_bin" -l "$stage/$f"
          done
          grep -q 'producer-list-image-square-010242.php' "$root/wp-content/themes/elmercadodeorigen-child/functions.php"
          mkdir -p "$backup/previous-ham-images"
          dest="$root/wp-content/themes/elmercadodeorigen-child/assets/images/producer-banners"
          mkdir -p "$dest"
          for slug in hidalgo-de-la-jara montjam; do
            if [ -f "$dest/$slug.webp" ]; then
              cp -p "$dest/$slug.webp" "$backup/previous-ham-images/$slug.webp"
            fi
          done
          cp -p "$inc/producer-list-image-square-010242.php" "$backup/"
          cp -p "$inc/editorial-finish.php" "$backup/"
          cp -p "$inc/editorial-system.php" "$backup/"
          cp "$stage/producer-list-image-square-010242.php" "$inc/"
          cp "$stage/editorial-finish.php" "$inc/"
          cp "$stage/editorial-system.php" "$inc/"
          touch "$backup/ham-deployment-started"
          for slug in hidalgo-de-la-jara montjam; do
            cp "$stage/$slug.webp" "$dest/$slug.webp"
            cmp "$stage/$slug.webp" "$dest/$slug.webp"
            echo "HAM_MEDIA_INSTALLED $slug"
          done
          EMDO_BANNER_MODE=apply EMDO_BANNER_META_BACKUP="$backup/native-wcfm-profile-settings.ser" "$php_bin" -d memory_limit=512M "$wp_bin" eval-file "$stage/sync-approved-wcfm-banners-20261020.php" --path="$root" --allow-root
          cmp "$inc/producer-list-image-square-010242.php" "$stage/producer-list-image-square-010242.php"
          cmp "$inc/editorial-finish.php" "$stage/editorial-finish.php"
          cmp "$inc/editorial-system.php" "$stage/editorial-system.php"
          "$php_bin" -l "$inc/producer-list-image-square-010242.php"
          "$php_bin" -l "$inc/editorial-finish.php"
          "$php_bin" -l "$inc/editorial-system.php"
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$root" --skip-plugins --allow-root || true
          # Sólo invalida la copia estática de estas rutas, nunca otros productos o el blog.
          "$php_bin" -r '
          $dir=$argv[1]."/wp-content/uploads/elmercado-blog-static-v2";
          foreach (["www.elmercadodeorigen.com","elmercadodeorigen.com"] as $host) {
            foreach (["/productores/","/en/producers/"] as $path) {
              $file=$dir."/".hash("sha256",$host."|".$path).".html";
              if (is_file($file)) unlink($file);
            }
          }
          ' "$root"
          rm -rf "$stage"
          echo 'PRODUCERS_TARGETED_FILES_INSTALLED'
          REMOTE
          # Validar HTML público sin la caché de navegación; si falla, restaurar.
          url="https://www.elmercadodeorigen.com/productores/?design-check=$GITHUB_RUN_ID"
          curl -fsSL --max-time 60 -A 'EMDO-Producer-Design-Verify/1.0' "$url" -o /tmp/emdo-producers-release.html
          grep -q 'elmercado-producer-directory-editorial-20261020' /tmp/emdo-producers-release.html
          ! grep -q 'elmercado-producer-layout-normalizer' /tmp/emdo-producers-release.html
          ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|critical error on this website' /tmp/emdo-producers-release.html
          echo 'PRODUCERS_HTTP_AND_HEAD_STYLES_OK'
          cat > /tmp/emdo-producers-check.cjs <<'NODE'
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page = await browser.newPage();
              for (const width of [1440, 900, 390]) {
                await page.setViewport({width,height:1000,deviceScaleFactor:1});
                await page.goto('https://www.elmercadodeorigen.com/productores/?qa='+process.env.GITHUB_RUN_ID+'-'+width,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector('#wcfmmp-stores-wrap li.wcfmmp-single-store',{timeout:30000});
                await new Promise(resolve => setTimeout(resolve,1300));
                const data=await page.evaluate(() => {
                  const list=document.querySelector('#wcfmmp-stores-wrap ul.wcfmmp-store-wrap');
                  const cards=[...document.querySelectorAll('#wcfmmp-stores-wrap li.wcfmmp-single-store')];
                  const rectangle=el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}};
                  const intro=document.querySelector('.emo-producers-intro');
                  const introStyle=intro?getComputedStyle(intro):null;
                  return {
                    intro:{found:!!intro,bg:introStyle?.backgroundColor||null,image:introStyle?.backgroundImage||null,
                      columns:introStyle?.gridTemplateColumns||null,display:introStyle?.display||null,
                      sharedClass:intro?.classList.contains('emo-contact-aside')||false,
                      sharedMarkup:!!intro?.querySelector(':scope > .emo-kicker.emo-kicker--light'),
                      kickerFont:intro?.querySelector('.emo-kicker')?getComputedStyle(intro.querySelector('.emo-kicker')).fontSize:null,
                      kickerColor:intro?.querySelector('.emo-kicker')?getComputedStyle(intro.querySelector('.emo-kicker')).color:null,
                      headingColor:intro?.querySelector('h2')?getComputedStyle(intro.querySelector('h2')).color:null,
                      paragraphColor:intro?.querySelector('p')?getComputedStyle(intro.querySelector('p')).color:null,
                      radius:introStyle?.borderTopLeftRadius||null,
                      width:intro?.getBoundingClientRect().width||0},
                    navBg:getComputedStyle(document.querySelector('.site-header')).backgroundColor,
                    hasHeadStyle:!!document.querySelector('#elmercado-producer-directory-editorial-20261020'),
                    hasOldNormalizer:!!document.querySelector('#elmercado-producer-layout-normalizer'),
                    columns:getComputedStyle(list).gridTemplateColumns.split(' ').length,
                    cards:cards.length,
                    measurements:cards.map(card=>{
                      const title=card.querySelector('.store-data h2');
                      const link=title?.querySelector('a');
                      const oldButton=card.querySelector('a.wcfmmp-visit-store');
                      const image=card.querySelector('.store-content');
                      const wrapper=card.querySelector('.store-wrapper');
                      return {title:title?.textContent?.trim(),titleBox:title?rectangle(title):null,
                        link:link?.href, linkTabIndex:link?.tabIndex,
                        oldButtonHidden:!!oldButton&&getComputedStyle(oldButton).display==='none',
                        linkOverlay:link?getComputedStyle(link,'::after').position:null,
                        wrapperPointer:wrapper?getComputedStyle(wrapper).cursor:null,
                        imageBox:image?rectangle(image):null,
                        bannerFit:image?.querySelector('.store-info')?getComputedStyle(image.querySelector('.store-info')).backgroundSize:null,
                        overflow:title?title.scrollWidth-title.clientWidth:99};
                    })
                  };
                });
                console.log('PRODUCERS_LAYOUT',width,JSON.stringify(data));
                if(!data.intro.found||!data.intro.sharedClass||!data.intro.sharedMarkup||data.intro.bg!=='rgb(23, 63, 50)'||data.intro.image!=='none'||data.intro.headingColor!=='rgb(255, 255, 255)'||data.intro.paragraphColor!=='rgba(255, 255, 255, 0.74)'||data.intro.kickerColor!=='rgb(233, 217, 169)'||data.intro.display!=='block'||data.intro.width<250||!data.navBg.startsWith('rgba(255, 255, 255, 0.98)')) throw new Error('Producer header must match the dark Contact header and remain legible '+width+' '+JSON.stringify(data.intro)+' nav='+data.navBg);
                if (!data.hasHeadStyle||data.hasOldNormalizer||data.cards<3) throw new Error('Missing or replaced directory at '+width);
                const expected=width>=1200?3:width>760?2:1;
                if(data.columns!==expected) throw new Error('Wrong column count '+width+': '+data.columns);
                for(const m of data.measurements){
                  if(!m.titleBox||!m.link||m.linkTabIndex!==0||!m.oldButtonHidden||m.linkOverlay!=='absolute'||m.wrapperPointer!=='pointer'||!m.imageBox||m.bannerFit!=='cover'||m.overflow>3) throw new Error('Card links or geometry issue '+width+' '+JSON.stringify(m));
                  const ratio=m.imageBox.width/m.imageBox.height;
                  if(Math.abs(ratio-(width>760?2.6:2.25))>.09) throw new Error('Wrong banner ratio '+width+' '+ratio);
                }
                // El pseudo-elemento del enlace debe ocupar de verdad fotografía,
                // esquina y zona vacía del pie (no sólo el título).
                await page.evaluate(()=>{
                  const card=document.querySelector('#wcfmmp-stores-wrap li.wcfmmp-single-store');
                  card.scrollIntoView({block:'center',behavior:'instant'});
                  return true;
                });
                const hit=await page.evaluate(()=>{
                  const card=document.querySelector('#wcfmmp-stores-wrap li.wcfmmp-single-store');
                  const link=card.querySelector('.store-data h2 a');
                  const media=card.querySelector('.store-content').getBoundingClientRect();
                  const footer=card.querySelector('.store-footer').getBoundingClientRect();
                  const wrapper=card.querySelector('.store-wrapper').getBoundingClientRect();
                  const owns=(x,y)=>document.elementFromPoint(x,y)?.closest('a')===link;
                  return {image:owns(media.left+media.width/2,media.top+media.height/2),
                    footer:owns(footer.left+footer.width/2,footer.bottom-14),
                    corner:owns(wrapper.left+18,wrapper.top+18),
                    destination:link.href};
                });
                console.log('PRODUCERS_FULL_CARD_HIT',width,JSON.stringify(hit));
                if(!hit.image||!hit.footer||!hit.corner) throw new Error('The full producer card is not clickable at '+width);
                // Verificar clics reales sin esperar la lenta página de destino.
                // Se cancela sólo la navegación del test, después de identificar
                // el enlace que recibiría el navegador. No cambia la web real.
                await page.evaluate(()=>{
                  const a=document.querySelector('#wcfmmp-stores-wrap li.wcfmmp-single-store .store-data h2 a');
                  window.__producerTestClicks=[];
                  document.addEventListener('click',event=>{
                    const target=event.target.closest('a');
                    if(target===a){
                      window.__producerTestClicks.push({href:target.href,trusted:event.isTrusted});
                      event.preventDefault();
                    }
                  },true);
                });
                await page.click('#wcfmmp-stores-wrap li.wcfmmp-single-store .store-content');
                const recorded=await page.evaluate(()=>window.__producerTestClicks||[]);
                if(recorded.length!==1||recorded[0].href!==hit.destination||!recorded[0].trusted) {
                  throw new Error('Click on producer photo did not activate producer link '+width+' '+JSON.stringify(recorded));
                }
                console.log('PRODUCERS_IMAGE_CLICK_OK',width,JSON.stringify(recorded[0]));
                if(width===390){
                  const keyboardUrl=await page.evaluate(()=>{
                    const a=document.querySelector('#wcfmmp-stores-wrap li.wcfmmp-single-store .store-data h2 a');
                    a.focus(); return {url:a.href,focused:document.activeElement===a};
                  });
                  if(!keyboardUrl.focused) throw new Error('Producer card link cannot receive keyboard focus');
                  await page.keyboard.press('Enter');
                  const keyboardRecorded=await page.evaluate(()=>window.__producerTestClicks||[]);
                  if(keyboardRecorded.length!==2||keyboardRecorded[1].href!==keyboardUrl.url) {
                    throw new Error('Keyboard Enter did not activate the producer link '+JSON.stringify(keyboardRecorded));
                  }
                  console.log('PRODUCERS_KEYBOARD_ENTER_OK');
                }
              }
              console.log('PRODUCERS_RESPONSIVE_QA_SUCCESS');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          node /tmp/emdo-producers-check.cjs
          # La confirmación final debe comprobar la ruta sin parámetro.
          curl -fsSL --max-time 60 'https://www.elmercadodeorigen.com/productores/' -o /tmp/emdo-producers-public.html
          grep -q 'elmercado-producer-directory-editorial-20261020' /tmp/emdo-producers-public.html
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "rm -rf '$BACKUP' '$STAGE'"
          trap - EXIT
          echo 'PRODUCERS_DESIGN_PUBLISHED_AND_VERIFIED'

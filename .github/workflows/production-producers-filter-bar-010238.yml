name: Production producers filter bar 0.10.238

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producers-filter-bar-010238.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-producers-filter-bar-010238
  cancel-in-progress: false

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/shop-producer-filter-final.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          MODULE="$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/shop-producer-filter-final.php"
          BACKUP="/tmp/shop-producer-filter-final-${GITHUB_RUN_ID}.bak"
          PROBE="elmercado-opcache-producers-filter-${GITHUB_RUN_ID}.php"
          ROLLED_BACK=0

          rollback() {
            code=$?
            [ "$ROLLED_BACK" -eq 0 ] || exit "$code"
            ROLLED_BACK=1
            set +e
            echo ROLLBACK_START
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then cp -p '$BACKUP' '$MODULE'; rm -f '$BACKUP'; fi; rm -f '$PROD_PATH/$PROBE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true
            echo ROLLED_BACK
            exit "${code:-1}"
          }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; test -f '$MODULE'; cp -p '$MODULE' '$BACKUP'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/shop-producer-filter-final.php "$STAGING_USER@$STAGING_HOST:$MODULE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$MODULE' >/dev/null; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          set +e
          for i in $(seq 1 6); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$' && break
            sleep 2
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" >/dev/null 2>&1
          set -e

          marker_ok=0
          set +e
          for i in $(seq 1 10); do
            html="$(curl -fsSL --connect-timeout 10 --max-time 35 -H 'Cache-Control: no-store' -H 'Pragma: no-cache' "$BASE_URL/productores/?filterbar=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            if grep -Fq 'elmercado-producers-filter-bar-remove-010238' <<<"$html"; then marker_ok=1; break; fi
            sleep 3
          done
          set -e
          test "$marker_ok" -eq 1

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({executablePath:'/usr/bin/google-chrome', headless:true, args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage();
            await page.setCacheEnabled(false);
            await page.setViewport({width:390,height:844});
            await page.goto(`${process.env.BASE_URL}/productores/?filterbarqa=${Date.now()}`, {waitUntil:'domcontentloaded', timeout:55000});
            await page.waitForSelector('#wcfmmp-stores-wrap', {timeout:30000});
            await sleep(1800);
            const result = await page.evaluate(() => {
              const root = document.querySelector('#wcfmmp-stores-wrap');
              const bars = [...root.querySelectorAll('.wcfmmp-store-search-form,[class*="store-search-form"]')].map(el => ({display:getComputedStyle(el).display, visibility:getComputedStyle(el).visibility, height:el.getBoundingClientRect().height}));
              const search = root.querySelector('input[id*="store_name"],input[name*="store_name"],input[placeholder*="tienda" i]');
              const category = root.querySelector('select[id*="store_category"],select[name*="store_category"]');
              const hidden = el => !el || getComputedStyle(el).display === 'none' || getComputedStyle(el).visibility === 'hidden' || el.getBoundingClientRect().height === 0 || !!el.closest('[hidden]');
              return {
                marker: !!document.querySelector('#elmercado-producers-filter-bar-remove-010238'),
                bars,
                searchHidden: hidden(search),
                categoryHidden: hidden(category),
                cards: root.querySelectorAll('li.wcfmmp-single-store').length
              };
            });
            console.log('PRODUCERS_FILTER_BAR_QA', JSON.stringify(result));
            if (!result.marker || !result.searchHidden || !result.categoryHidden || result.cards < 1 || result.bars.some(b => b.display !== 'none' && b.visibility !== 'hidden' && b.height > 0)) process.exitCode = 1;
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP' '$PROD_PATH/$PROBE'"
          trap - ERR
          echo PRODUCTION_PRODUCERS_FILTER_BAR_010238_OK

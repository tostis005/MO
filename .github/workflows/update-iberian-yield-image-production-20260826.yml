name: Update Iberian yield article image

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update-iberian-yield-image-20260826.php'
      - '.github/workflows/update-iberian-yield-image-production-20260826.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP script
        shell: bash
        run: php -l .github/scripts/update-iberian-yield-image-20260826.php

      - name: Update featured image in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SCRIPT="/tmp/update-iberian-yield-image-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/update-iberian-yield-image-20260826.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"

          mkdir -p .deploy-status
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root
            code=\$?
            rm -f '$REMOTE_SCRIPT'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'if (function_exists("rocket_clean_domain")) { rocket_clean_domain(); } do_action("litespeed_purge_all");' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
            exit \$code
          " > .deploy-status/update-iberian-yield-image-20260826.txt 2>&1
          CODE=$?
          set -e
          echo "$CODE" > .deploy-status/update-iberian-yield-image-20260826.exit-code
          cat .deploy-status/update-iberian-yield-image-20260826.txt

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/update-iberian-yield-image-20260826.txt .deploy-status/update-iberian-yield-image-20260826.exit-code || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record Iberian yield image production result [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Fail if image update failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-status/update-iberian-yield-image-20260826.exit-code
          test "$(cat .deploy-status/update-iberian-yield-image-20260826.exit-code)" = "0"
          grep -q '^featured_image_updated ' .deploy-status/update-iberian-yield-image-20260826.txt

name: Temporary EMDO reviews UI diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-emdo-reviews-ui-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual reviews markup in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          slug=hidalgo-de-la-jara
          base="https://www.elmercadodeorigen.com/tienda/$slug/"
          rev="${base}reviews/"
          curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache, no-store' "$base?emdo_ui_diag=2" -o /tmp/base.html
          code=$(curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache, no-store' -o /tmp/reviews.html -w '%{http_code}' "$rev?emdo_ui_diag=2")
          echo "REVIEWS_HTTP=$code"
          echo '=== BASE MATCHES ==='
          grep -Ein -C 2 'Rese|reviews|mdo_reviews' /tmp/base.html | head -n 120 || true
          echo '=== REVIEW PAGE MATCHES ==='
          grep -Ein -C 2 'mdo-reviews-page|mdo-review-summary|mdo-store-reviews|sobre 5|no tiene rese|no reviews' /tmp/reviews.html | head -n 160 || true
          echo '=== FILTER SNAPSHOT ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            echo "PUBLIC_CLASS=".(class_exists("MDO_Reviews_Public")?"1":"0").PHP_EOL;
            echo "NEW_TAB_HOOK=".(int)has_filter("wcfmmp_store_tabs",array("MDO_Reviews_Public","store_tabs")).PHP_EOL;
            echo "NEW_URL_HOOK=".(int)has_filter("wcfmp_store_tabs_url",array("MDO_Reviews_Public","store_tab_url")).PHP_EOL;
            $sample=array("products"=>"Productos","about"=>"Acerca de","reviews"=>"Reviews");
            echo "FILTERED_TABS=".wp_json_encode(apply_filters("wcfmmp_store_tabs",$sample,6)).PHP_EOL;
            echo "URL_SAMPLE=".apply_filters("wcfmp_store_tabs_url","https://www.elmercadodeorigen.com/tienda/hidalgo-de-la-jara/","mdo_reviews").PHP_EOL;
          ' --path="$PROD_PATH" --allow-root
          REMOTE

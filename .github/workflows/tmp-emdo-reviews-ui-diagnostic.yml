name: Temporary EMDO reviews UI diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-emdo-reviews-ui-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect WCFM reviews route collision
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          echo '=== REWRITE MATCHES ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" rewrite list --format=csv --path="$PROD_PATH" --allow-root | grep -E 'tienda.*reviews|mdo_reviews|reviews=' | head -n 30 || true
          echo '=== WCFM FILTER SOURCES ==='
          grep -RIn -C 8 -E 'wcfmp_store_default_query_vars|wcfmmp_store_default_template_path|wcfmmp_store_default_template|wcfmp_store_tabs_url' "$PROD_PATH/wp-content/plugins/wc-multivendor-marketplace" | head -n 300 || true
          echo '=== WCFM REVIEWS REWRITE SOURCES ==='
          grep -RIn -C 6 -E "reviews.*rewrite|add_rewrite_rule.*reviews|'reviews'|\"reviews\"" "$PROD_PATH/wp-content/plugins/wc-multivendor-marketplace/core" "$PROD_PATH/wp-content/plugins/wc-multivendor-marketplace/views" | head -n 260 || true
          echo '=== LIVE REVIEW TAB ==='
          curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache, no-store' 'https://www.elmercadodeorigen.com/tienda/hidalgo-de-la-jara/reviews/?emdo_ui_diag=3' -o /tmp/reviews.html
          grep -Ein -C 2 '<li class="active"|mdo-reviews-page|bd_review_section|review_section|no.*rese|No.*review|Productos|Acerca de|Reseñas' /tmp/reviews.html | tail -n 140 || true
          REMOTE

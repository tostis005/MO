name: Temporary EMDO reviews UI diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-emdo-reviews-ui-diagnostic.yml'

permissions:
  contents: read

# Temporary read-only production diagnostic. Remove after the fix is verified.
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reviews route and WCFM output in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          echo "EMDO_VERSION=$($php_bin $wp_bin plugin get mdo-supplier-sync --field=version --path="$PROD_PATH" --allow-root 2>/dev/null || true)"
          echo "WCFMMP_VERSION=$($php_bin $wp_bin plugin get wc-multivendor-marketplace --field=version --path="$PROD_PATH" --allow-root 2>/dev/null || true)"
          for slug in hidalgo-de-la-jara tolecarnes la-huerta-de-ana-mary 1957; do
            base="https://www.elmercadodeorigen.com/tienda/$slug/"
            rev="${base}reviews/"
            curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache, no-store' "$base?emdo_ui_diag=1" -o "/tmp/${slug}-base.html"
            code=$(curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache, no-store' -o "/tmp/${slug}-reviews.html" -w '%{http_code}' "$rev?emdo_ui_diag=1")
            echo "STORE=$slug REVIEWS_HTTP=$code"
            echo "TAB_LINKS_BEGIN=$slug"
            grep -Eio 'href="[^"]+"[^>]*>[^<]*Reseñas[^<]*<' "/tmp/${slug}-base.html" | head -n 5 || true
            echo "TAB_LINKS_END=$slug"
            echo "REVIEWS_TEXT_BEGIN=$slug"
            grep -Eio '.{0,120}(no tiene reseñ|sin reseñ|reseñ|valorad|rating|star|mdo-store-reviews).{0,160}' "/tmp/${slug}-reviews.html" | head -n 30 || true
            echo "REVIEWS_TEXT_END=$slug"
          done
          echo 'WCFM_TEMPLATE_BEGIN'
          template=$(find "$PROD_PATH/wp-content/plugins" -type f -path '*/views/store/wcfmmp-view-store-reviews.php' | head -n1 || true)
          echo "WCFM_TEMPLATE=$template"
          if [ -n "$template" ]; then sed -n '1,240p' "$template"; fi
          echo 'WCFM_TEMPLATE_END'
          $php_bin -d memory_limit=512M $wp_bin eval '
            global $wpdb;
            $table = MDO_Database::table("reviews");
            foreach (array("hidalgo-de-la-jara","tolecarnes","la-huerta-de-ana-mary","1957") as $slug) {
              $u=get_user_by("slug",$slug); if(!$u){echo "SUMMARY $slug user=0\n"; continue;}
              $row=$wpdb->get_row($wpdb->prepare("SELECT COUNT(*) c, AVG(rating) a FROM {$table} WHERE vendor_user_id=%d AND status=%s AND rating>0",$u->ID,"validated"));
              echo "SUMMARY $slug user={$u->ID} count=".(int)$row->c." avg=".number_format((float)$row->a,2,".","")."\n";
            }
          ' --path="$PROD_PATH" --allow-root
          REMOTE

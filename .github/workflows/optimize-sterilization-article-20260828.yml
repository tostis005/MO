# Idempotent production verification after SEO update.
name: Optimize sterilization article SEO 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-sterilization-article-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize article and verify public page
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"

          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-optimize-sterilization-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/optimize-sterilization-article-20260828.php \
            .github/scripts/fix-sterilization-related-link-20260828.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            '$PHP' -l '$REMOTE/optimize-sterilization-article-20260828.php' >/dev/null
            '$PHP' -l '$REMOTE/fix-sterilization-related-link-20260828.php' >/dev/null
          "

          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/optimize-sterilization-article-20260828.php' --path='$PROD' --allow-root" > /tmp/sterilization-seo.json 2> /tmp/sterilization-seo.err
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            cat /tmp/sterilization-seo.err >&2 || true
            cat /tmp/sterilization-seo.json >&2 || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
            exit "$RC"
          fi

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/fix-sterilization-related-link-20260828.php' --path='$PROD' --allow-root" > /tmp/related-link.json

          cat /tmp/sterilization-seo.json
          cat /tmp/related-link.json
          jq -e '.ok==true and .checks.slug_unchanged==true and .checks.thumbnail_unchanged==true and .checks.keyword_in_title==true and .checks.has_ph46==true and .checks.has_boe==true and .checks.has_faq==true and .after.content_length>=13000' /tmp/sterilization-seo.json >/dev/null
          jq -e '.ok==true' /tmp/related-link.json >/dev/null

          URL="$(jq -r '.after.permalink' /tmp/sterilization-seo.json)"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          HTTP="$(curl -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO SEO verification' -o /tmp/article.html -w '%{http_code}' "${URL}?emdo_seo_verify=${GITHUB_RUN_ID}")"
          [ "$HTTP" = "200" ] || { echo "Article HTTP $HTTP" >&2; exit 20; }
          grep -Fq 'Esterilización de conservas vegetales' /tmp/article.html || { echo 'Optimized title not found' >&2; exit 21; }
          grep -Fq 'pH 4,6' /tmp/article.html || { echo 'pH 4,6 section not found' >&2; exit 22; }
          grep -Fq 'Qué es un autoclave y cuándo se utiliza' /tmp/article.html || { echo 'Autoclave section not found' >&2; exit 23; }
          grep -Fq 'Preguntas frecuentes sobre la esterilización' /tmp/article.html || { echo 'FAQ section not found' >&2; exit 24; }
          grep -Fq 'BOE-A-1978-25634' /tmp/article.html || { echo 'BOE reference not found' >&2; exit 25; }
          grep -Fq 'Conservas en tarro de vidrio o lata: diferencias de conservación y uso' /tmp/article.html || { echo 'Correct related-link anchor not found' >&2; exit 26; }

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"

          mkdir -p .deploy-status
          jq -n \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            --arg public_url "$URL" \
            --arg http "$HTTP" \
            --slurpfile result /tmp/sterilization-seo.json \
            --slurpfile related /tmp/related-link.json \
            '{generated_at:$generated_at,run_id:($run_id|tonumber),source_sha:$source_sha,verified:true,public_url:$public_url,http:($http|tonumber),result:$result[0],related_link:$related[0]}' \
            > .deploy-status/optimize-sterilization-article-20260828.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/optimize-sterilization-article-20260828.json
          git commit -m 'Record verified sterilization article SEO update [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

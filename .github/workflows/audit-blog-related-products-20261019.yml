name: Read-only audit of all live articles and products
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-blog-related-products-20261019.yml'
      - '.github/scripts/audit-blog-related-products-20261019.php'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory script
        run: php -l .github/scripts/audit-blog-related-products-20261019.php
      - name: Run production WordPress read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          port="${STAGING_PORT:-22}"
          ssh_args="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $port"
          scp_args="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $port"
          script="/tmp/emdo-blog-product-inventory-${GITHUB_RUN_ID}.php"
          sshpass -e scp $scp_args .github/scripts/audit-blog-related-products-20261019.php "$STAGING_USER@$STAGING_HOST:$script"
          sshpass -e ssh $ssh_args "$STAGING_USER@$STAGING_HOST" "bash -s -- '$script'" > /tmp/blog-inventory.log <<'REMOTE'
          set -euo pipefail
          script="$1"
          trap 'rm -f "$script"' EXIT
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp)"
          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p="$(dirname "$cfg")"
            url="$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break;;
            esac
          done
          test -n "$prod_path"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$script" --path="$prod_path" --allow-root
          REMOTE
          python3 - <<'PY'
          import json
          rows=[line.partition('EMDO_BLOG_PRODUCTS_INVENTORY=')[2] for line in open('/tmp/blog-inventory.log') if 'EMDO_BLOG_PRODUCTS_INVENTORY=' in line]
          assert rows,'No production data'
          data=json.loads(rows[-1])
          assert data['post_count']>100 and data['product_count']>100
          print('POSTS',data['post_count'],'PRODUCTS',data['product_count'])
          print('TOPICS',{k:len(v) for k,v in data['topics'].items()})
          print('WITHOUT_PRODUCT_CATEGORY',len(data['posts_without_category']))
          with open('.deploy-status/blog-related-products-inventory-20261019.json','w') as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/blog-related-products-inventory-20261019.json
          git commit -m 'Save all-post inventory report [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

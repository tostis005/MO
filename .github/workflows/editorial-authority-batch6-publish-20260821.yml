name: Editorial authority batch 7 diagnostic 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch6-publish-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-authority-batch7-diagnostic-20260821
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish and capture diagnostics
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          mkdir -p .deploy-status
          : >/tmp/ab7-out; : >/tmp/ab7-err; : >/tmp/ab7-db; : >/tmp/ab7-public
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          INFO_RC=$?
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          echo "$INFO_RC" >/tmp/ab7-info-rc
          if [ "$INFO_RC" -eq 0 ]; then
            REMOTE=/tmp/emdo-ab7-diag-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
            sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch7-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
            sshpass -e scp $SCP .github/data/editorial-authority-batch7-20260821/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH7_DIR='$DATA' '$PHP' -d memory_limit=768M -d display_errors=1 -d error_reporting=32767 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" >/tmp/ab7-out 2>/tmp/ab7-err
            echo $? >/tmp/ab7-publisher-rc
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT pm2.meta_value,p.ID,p.post_status,p.post_name,thumb.meta_value AS thumbnail_id FROM wp_posts p JOIN wp_postmeta b ON b.post_id=p.ID AND b.meta_key='_emdo_authority_batch' AND b.meta_value='7' JOIN wp_postmeta pm2 ON pm2.post_id=p.ID AND pm2.meta_key='_emdo_authority_key' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root" >/tmp/ab7-db 2>>/tmp/ab7-err
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" >/dev/null 2>&1
          else
            echo 99 >/tmp/ab7-publisher-rc
          fi
          check(){ key="$1"; url="$2"; f=/tmp/ab7-page.html; c=$(curl -k -L -sS --retry 2 --connect-timeout 8 --max-time 45 -A 'Mozilla/5.0 EMDO batch7 diagnostic' -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$url?ab7diag=$GITHUB_RUN_ID" 2>/dev/null); m=$(grep -Fc "EMDO_AUTHORITY_BATCH7:$key" "$f" 2>/dev/null || true); raw=$(grep -Fc '[products ' "$f" 2>/dev/null || true); products=$(grep -Ec 'class="[^"]*products|class="[^"]*product' "$f" 2>/dev/null || true); printf '%s|%s|http=%s|marker=%s|raw=%s|products=%s\n' "$key" "$url" "$c" "$m" "$raw" "$products" >>/tmp/ab7-public; }
          check evoo-expiry-quality-guide https://www.elmercadodeorigen.com/caduca-aove-como-saber-si-se-ha-deteriorado/
          check evoo-expiry-quality-guide https://www.elmercadodeorigen.com/en/does-extra-virgin-olive-oil-expire-how-to-tell-if-it-has-deteriorated/
          check evoo-packaging-format-guide https://www.elmercadodeorigen.com/aove-botella-lata-garrafa-que-envase-conviene/
          check evoo-packaging-format-guide https://www.elmercadodeorigen.com/en/evoo-bottle-tin-or-large-container-which-package-is-best/
          check ground-beef-buying-guide https://www.elmercadodeorigen.com/carne-picada-ternera-que-mirar-antes-comprar/
          check ground-beef-buying-guide https://www.elmercadodeorigen.com/en/ground-beef-what-to-check-before-buying/
          check vegetable-freezing-guide https://www.elmercadodeorigen.com/como-congelar-descongelar-hortalizas-sin-arruinar-textura/
          check vegetable-freezing-guide https://www.elmercadodeorigen.com/en/how-to-freeze-and-thaw-vegetables-without-ruining-texture/
          check dried-pulses-storage-guide https://www.elmercadodeorigen.com/como-conservar-legumbres-secas-despensa/
          check dried-pulses-storage-guide https://www.elmercadodeorigen.com/en/how-to-store-dried-pulses-in-the-pantry/
          python3 - <<'PY'
          import json,os
          def read(p):
              try:return open(p,encoding='utf-8',errors='ignore').read()
              except:return ''
          def num(p):
              try:return int(open(p).read().strip())
              except:return None
          raw=read('/tmp/ab7-out'); parsed=None; s=raw.find('{'); e=raw.rfind('}')
          if s>=0 and e>=s:
              try: parsed=json.loads(raw[s:e+1])
              except: pass
          d={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'info_rc':num('/tmp/ab7-info-rc'),'publisher_rc':num('/tmp/ab7-publisher-rc'),'publisher_json':parsed,'publisher_stdout':raw[-30000:],'publisher_stderr':read('/tmp/ab7-err')[-30000:],'db_rows':read('/tmp/ab7-db'),'public_checks':read('/tmp/ab7-public')}
          with open('.deploy-status/editorial-authority-batch7-diagnostic-20260821.json','w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch7-diagnostic-20260821.json
          git commit -m 'Record editorial authority batch 7 diagnostics [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

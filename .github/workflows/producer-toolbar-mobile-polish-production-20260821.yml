name: Producer toolbar mobile polish production

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-mobile-polish-production-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: php -l mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php

      - name: Deploy and verify mobile controls
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          python -m pip install --quiet selenium
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/producer-toolbar-mobile-polish-20260821.txt
          EXIT=.deploy-status/producer-toolbar-mobile-polish-20260821.exit-code
          : > "$STATUS"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          DEST="$PROD_PATH/wp-content/mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php"
          BAK="/tmp/mdo-producer-mobile-polish-${GITHUB_RUN_ID}.bak"
          REMOTE="/tmp/mdo-producer-mobile-polish-${GITHUB_RUN_ID}.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "[ ! -f '$DEST' ] || cp '$DEST' '$BAK'"
          rollback(){
            echo 'ROLLBACK producer toolbar mobile polish' | tee -a "$STATUS"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
              if [ -f '$BAK' ]; then cp '$BAK' '$DEST'; else rm -f '$DEST'; fi
              rm -f '$REMOTE' '$BAK'
              wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            " || true
          }
          fail(){ echo "FAIL: $1" | tee -a "$STATUS"; rollback; echo 2 > "$EXIT"; exit 2; }

          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            cp '$REMOTE' '$DEST'; rm -f '$REMOTE'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$DEST'
            wp_bin=\$(command -v wp || true); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          " >> "$STATUS" 2>&1 || fail 'deploy/lint failed'

          for path in /tienda/1957/ /en/store/1957/; do
            code=$(curl -ksS -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com$path?mobile-polish=$GITHUB_RUN_ID")
            echo "HTTP $code $path" | tee -a "$STATUS"
            [ "$code" = 200 ] || fail "HTTP $code $path"
          done

          set +e
          python - <<'PY' >> "$STATUS" 2>&1
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='https://www.elmercadodeorigen.com'
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o); d.set_window_size(390,900)
          try:
              for path in ('/tienda/1957/','/en/store/1957/'):
                  d.get(base+path+'?mobile-polish=1'); time.sleep(2.2)
                  w=WebDriverWait(d,20)
                  host=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized')))
                  trig=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .mdo-catalog-destination__trigger')))
                  form=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woocommerce-ordering')))
                  select=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woocommerce-ordering select')))
                  span=trig.find_element(By.TAG_NAME,'span')
                  first_svg=trig.find_elements(By.CSS_SELECTOR,':scope > svg:first-child')
                  metrics=d.execute_script('''
                    const [host,trig,span,form,sel]=arguments;
                    const r=sel.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
                    const hit=document.elementFromPoint(cx,cy);
                    const cs=n=>getComputedStyle(n);
                    return {
                      hostH:host.getBoundingClientRect().height,
                      triggerH:trig.getBoundingClientRect().height,
                      spanClientH:span.clientHeight, spanScrollH:span.scrollHeight,
                      triggerClientH:trig.clientHeight, triggerScrollH:trig.scrollHeight,
                      formBorder:[cs(form).borderTopWidth,cs(form).borderRightWidth,cs(form).borderBottomWidth,cs(form).borderLeftWidth],
                      formBg:cs(form).backgroundColor, formShadow:cs(form).boxShadow,
                      selectBorder:cs(sel).borderTopWidth, selectPointer:cs(sel).pointerEvents,
                      formPointer:cs(form).pointerEvents,
                      hitTag:hit?.tagName||'', hitClass:hit?.className||'', hitIsSelect:hit===sel,
                      text:trig.innerText.trim(), selectValue:sel.value, optionCount:sel.options.length
                    };
                  ''',host,trig,span,form,select)
                  if first_svg:
                      metrics['firstSvgDisplay']=d.execute_script('return getComputedStyle(arguments[0]).display',first_svg[0])
                  print('MOBILE_POLISH',path,metrics)
                  assert 135 <= metrics['hostH'] <= 150, metrics
                  assert 38 <= metrics['triggerH'] <= 42, metrics
                  assert metrics['spanScrollH'] <= metrics['spanClientH'] + 1, metrics
                  assert metrics['triggerScrollH'] <= metrics['triggerClientH'] + 2, metrics
                  assert all(v=='0px' for v in metrics['formBorder']), metrics
                  assert metrics['formShadow']=='none', metrics
                  assert metrics['selectBorder'] in ('1px','0.8px'), metrics
                  assert metrics['selectPointer']=='auto' and metrics['formPointer']=='auto', metrics
                  assert metrics['hitIsSelect'], metrics
                  assert metrics.get('firstSvgDisplay','none')=='none', metrics
                  assert metrics['optionCount'] > 1, metrics
                  # Real pointer/keyboard interaction. Prevent navigation while testing form behaviour.
                  d.execute_script('arguments[0].submit=function(){window.__mdo_order_submit=true;}; window.__mdo_order_submit=false;',form)
                  before=select.get_attribute('value')
                  ActionChains(d).move_to_element(select).click().send_keys(Keys.ARROW_DOWN).send_keys(Keys.ENTER).perform()
                  time.sleep(.3)
                  after=select.get_attribute('value')
                  active=d.execute_script('return document.activeElement===arguments[0]',select)
                  print('ORDER_INTERACTION',path,before,after,active,d.execute_script('return window.__mdo_order_submit===true'))
                  assert active or after != before, (path,before,after,active)
              print('producer_toolbar_mobile_polish_ok')
          finally:
              d.quit()
          PY
          BC=$?
          set -e
          [ "$BC" = 0 ] || fail 'mobile browser verification failed'

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BAK'" || true
          echo 'producer_toolbar_mobile_polish_production_ok' | tee -a "$STATUS"
          echo 0 > "$EXIT"

      - name: Record result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-mobile-polish-20260821.* || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record producer toolbar mobile polish [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

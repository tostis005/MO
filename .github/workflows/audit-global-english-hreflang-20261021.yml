name: Audit global English native SEO and all 48 editorial pages
# SEO roadmap 20261021: read-only QA, never make sitewide content or URL changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit-global-english-hreflang-20261021.py'
      - '.github/workflows/audit-global-english-hreflang-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-48-editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Python audit syntax
        run: python3 -m py_compile .github/scripts/audit-global-english-hreflang-20261021.py
      - name: Audit each of 48 Spanish and English editorial pages
        run: python3 -u .github/scripts/audit-global-english-hreflang-20261021.py articles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-48-pages-native-SEO-evidence
          path: .audit-output/*.json
          retention-days: 30
          if-no-files-found: warn
  entire-english-island:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Export authoritative current English URLs from WordPress (read only)
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-diag-editorial-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/export-english-seo-urls-20261021.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" > /tmp/probe.log
          mkdir -p .audit-output
          sed -n 's/^EMDO_ENGLISH_URL_EXPORT //p' /tmp/probe.log | tail -n1 > .audit-output/english-seed-urls.json
          python3 - <<'PY'
          import json
          p=json.load(open('.audit-output/english-seed-urls.json'))
          assert p['count']==len(p['urls']) and p['count']>=30
          print('ENGLISH_URL_DATABASE_EXPORT_COUNT',p['count'])
          PY
      - name: Audit products, categories, previous blog posts and pages from live English sitemap
        run: python3 -u .github/scripts/audit-global-english-hreflang-20261021.py global
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-English-SEO-stratified-audit
          path: .audit-output/*.json
          retention-days: 30
          if-no-files-found: warn

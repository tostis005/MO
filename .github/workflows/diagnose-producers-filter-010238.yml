name: Diagnose producers filter 0.10.238

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/diagnose-producers-filter-010238.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect live producer controls
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setCacheEnabled(false);
            await page.setViewport({width:390,height:844});
            await page.goto(`https://www.elmercadodeorigen.com/productores/?diag=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForSelector('#wcfmmp-stores-wrap',{timeout:30000});
            await sleep(1800);
            const report=await page.evaluate(()=>{
              const root=document.querySelector('#wcfmmp-stores-wrap');
              const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!e.closest('[hidden]')};
              const controls=[...root.querySelectorAll('input,select,button')].map(e=>({tag:e.tagName,id:e.id,name:e.getAttribute('name'),className:e.className,placeholder:e.getAttribute('placeholder'),aria:e.getAttribute('aria-label'),value:e.value,text:(e.innerText||'').trim(),visible:visible(e),rect:(()=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}})(),parent:e.parentElement?.className||'',grand:e.parentElement?.parentElement?.className||''}));
              const textMatches=[...root.querySelectorAll('*')].filter(e=>/buscar tienda|seleccionar categor/i.test((e.innerText||'')+' '+(e.getAttribute?.('placeholder')||''))).slice(0,20).map(e=>({tag:e.tagName,id:e.id,className:e.className,visible:visible(e),text:(e.innerText||'').trim().replace(/\s+/g,' ').slice(0,240),parent:e.parentElement?.className||''}));
              return{marker:!!document.querySelector('#elmercado-producers-filter-bar-remove-010238'),controls,textMatches,visibleText:(root.innerText||'').replace(/\s+/g,' ').slice(0,1200),cards:root.querySelectorAll('li.wcfmmp-single-store').length};
            });
            console.log('PRODUCERS_DIAGNOSTIC',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: Header interaction diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/header-interaction-debug.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect search and mobile menu DOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p header-debug
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > debug.cjs <<'NODE'
          const fs=require('fs');const puppeteer=require('puppeteer-core');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:'new',args:['--no-sandbox','--disable-dev-shm-usage']});const out={};
          for(const [mode,vp] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844,isMobile:true,hasTouch:true}]]){const p=await b.newPage();await p.setViewport(vp);await p.goto('https://dev.elmercadodeorigen.com/?debug='+Date.now(),{waitUntil:'networkidle2',timeout:90000});await sleep(700);
          out[mode]=await p.evaluate(()=>({
            searchCandidates:[...document.querySelectorAll('.site-header a,.site-header button,.site-header [role="button"]')].filter(e=>/search|buscar|lupa/i.test(`${e.className} ${e.getAttribute('aria-label')||''} ${e.title||''}`)).map(e=>({tag:e.tagName,cls:e.className,href:e.href||null,aria:e.getAttribute('aria-label'),html:e.outerHTML.slice(0,800)})),
            searchInputs:[...document.querySelectorAll('input')].filter(e=>/search|buscar/i.test(`${e.type} ${e.className} ${e.name} ${e.placeholder}`)).map(e=>({cls:e.className,name:e.name,type:e.type,placeholder:e.placeholder,rect:(()=>{const r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})(),display:getComputedStyle(e).display,visibility:getComputedStyle(e).visibility})),
            sidebar:(()=>{const e=document.querySelector('.sidebar-menu');return e?e.outerHTML.slice(0,6000):null})()
          }));
          const s=await p.$('.site-header .header-search-icon,.site-header .search-icon,.site-header .site-search-toggle');if(s){await s.click();await sleep(900);out[mode].afterSearch=await p.evaluate(()=>({url:location.href,inputs:[...document.querySelectorAll('input')].filter(e=>/search|buscar/i.test(`${e.type} ${e.className} ${e.name} ${e.placeholder}`)).map(e=>({cls:e.className,name:e.name,type:e.type,placeholder:e.placeholder,rect:(()=>{const r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})(),display:getComputedStyle(e).display,visibility:getComputedStyle(e).visibility})),bodyClass:document.body.className,wrappers:[...document.querySelectorAll('[class*="search"],[class*="dgwt"]')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0}).slice(0,20).map(e=>({tag:e.tagName,cls:e.className,rect:(()=>{const r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})()}))}));}
          if(mode==='mobile'){const t=await p.$('.toggle-sidebar-menu-btn');if(t){await t.click();await sleep(600);out[mode].afterMenu=await p.evaluate(()=>({bodyClass:document.body.className,sidebarClass:document.querySelector('.sidebar-menu')?.className,buttons:[...document.querySelectorAll('.sidebar-menu a,.sidebar-menu button,.sidebar-menu [role="button"]')].slice(0,30).map(e=>({tag:e.tagName,cls:e.className,txt:(e.textContent||'').trim().slice(0,80),aria:e.getAttribute('aria-label'),html:e.outerHTML.slice(0,500)}))}));}}
          await p.screenshot({path:`header-debug/${mode}.png`,fullPage:false});await p.close();}
          fs.writeFileSync('header-debug/report.json',JSON.stringify(out,null,2));await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node debug.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-interaction-debug
          path: header-debug/
          retention-days: 3

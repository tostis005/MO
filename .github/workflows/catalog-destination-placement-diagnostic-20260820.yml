name: Catalog destination placement diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-destination-placement-diagnostic-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect deployed PHP registration
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" > /tmp/php-placement.txt <<'REMOTE'
          set -euo pipefail
          FILE="$PROD_PATH/wp-content/mu-plugins/mdo-catalog-default-spain-safety-20260820.php"
          printf 'file=%s\n' "$FILE"
          grep -n -E "add_action|remove_action|mdo_catalog_default_spain_render_20260820|woocommerce_before_shop_loop|woocommerce_shop_loop_header" "$FILE" | tail -n 80 || true
          REMOTE
      - name: Inspect browser DOM chains
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}); const c=await b.newContext({viewport:{width:390,height:844}}); const p=await c.newPage(); await p.goto(`https://www.elmercadodeorigen.com/tienda/?placement=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000}); await p.waitForTimeout(1000); const d=await p.evaluate(()=>{const chain=e=>{const a=[];let x=e;for(let i=0;x&&i<8;i++,x=x.parentElement)a.push({tag:x.tagName,id:x.id||'',cls:typeof x.className==='string'?x.className:''});return a}; const toolbar=[...document.querySelectorAll('.woostify-sorting')].map((e,i)=>({i,cls:e.className,text:e.textContent.replace(/\s+/g,' ').trim().slice(0,240),chain:chain(e)})); const dest=[...document.querySelectorAll('.mdo-catalog-destination--canonical,[data-mdo-destination-open]')].map((e,i)=>({i,tag:e.tagName,cls:e.className,text:e.textContent.replace(/\s+/g,' ').trim(),chain:chain(e),html:e.outerHTML.slice(0,800)})); const counts=[...document.querySelectorAll('.emo-catalog-result-count-010220')].map((e,i)=>({i,text:e.textContent.trim(),chain:chain(e)})); return {toolbar,dest,counts,bodyChildren:[...document.body.children].slice(0,40).map(e=>({tag:e.tagName,id:e.id||'',cls:typeof e.className==='string'?e.className:''}))};}); fs.writeFileSync('/tmp/dom-placement.json',JSON.stringify(d,null,2)); await c.close(); await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Record diagnostic
        run: |
          mkdir -p .deploy-status
          { cat /tmp/php-placement.txt; echo '--- browser ---'; cat /tmp/dom-placement.json; } > .deploy-status/catalog-destination-placement.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-destination-placement.txt
          git commit -m 'Record destination placement diagnostic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

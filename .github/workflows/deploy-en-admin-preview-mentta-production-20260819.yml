name: Deploy EN admin preview and MENTTA storefront fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-en-admin-preview-mentta-production-20260819.yml'
      - 'mu-plugins/mdo-english-staged-admin-preview-20260819.php'
      - 'mu-plugins/mdo-internal-mentta-category.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate guarded MU-plugin changes
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-english-staged-admin-preview-20260819.php >/dev/null
          php -l mu-plugins/mdo-internal-mentta-category.php >/dev/null
          grep -Fq 'Version: 1.1.0' mu-plugins/mdo-english-staged-admin-preview-20260819.php
          grep -Fq "HTTP_REFERER" mu-plugins/mdo-english-staged-admin-preview-20260819.php
          grep -Fq "_en_US_ready" mu-plugins/mdo-english-staged-admin-preview-20260819.php
          grep -Fq 'Version: 1.2.0' mu-plugins/mdo-internal-mentta-category.php
          grep -Fq 'admin-ajax.php reports is_admin()=true' mu-plugins/mdo-internal-mentta-category.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy MU-plugins to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          MU_DIR="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=256M \"\$wp_bin\" eval 'echo WPMU_PLUGIN_DIR;' --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root")"
          : "${MU_DIR:?MU-plugin directory not found}"

          PREVIEW_TMP="/tmp/mdo-english-staged-admin-preview-${GITHUB_RUN_ID}.php"
          MENTTA_TMP="/tmp/mdo-internal-mentta-category-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-english-staged-admin-preview-20260819.php "$STAGING_USER@$STAGING_HOST:$PREVIEW_TMP"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-internal-mentta-category.php "$STAGING_USER@$STAGING_HOST:$MENTTA_TMP"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; \
            mkdir -p '$MU_DIR'; \
            backup='/tmp/mdo-mu-backup-${GITHUB_RUN_ID}'; mkdir -p \"\$backup\"; \
            [ ! -f '$MU_DIR/mdo-english-staged-admin-preview-20260819.php' ] || cp '$MU_DIR/mdo-english-staged-admin-preview-20260819.php' \"\$backup/\"; \
            [ ! -f '$MU_DIR/mdo-internal-mentta-category.php' ] || cp '$MU_DIR/mdo-internal-mentta-category.php' \"\$backup/\"; \
            install -m 0644 '$PREVIEW_TMP' '$MU_DIR/mdo-english-staged-admin-preview-20260819.php'; \
            install -m 0644 '$MENTTA_TMP' '$MU_DIR/mdo-internal-mentta-category.php'; \
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \
            \"\$php_bin\" -l '$MU_DIR/mdo-english-staged-admin-preview-20260819.php' >/dev/null; \
            \"\$php_bin\" -l '$MU_DIR/mdo-internal-mentta-category.php' >/dev/null; \
            rm -f '$PREVIEW_TMP' '$MENTTA_TMP'"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=256M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true"

          printf '%s' "$PROD_PATH" > /tmp/mdo_prod_path
          printf '%s' "$MU_DIR" > /tmp/mdo_mu_dir

      - name: Verify staged English preview and MENTTA AJAX behavior
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(cat /tmp/mdo_prod_path)"
          MU_DIR="$(cat /tmp/mdo_mu_dir)"

          cat > /tmp/mdo-en-preview-verify.php <<'PHP'
          <?php
          define( 'DOING_AJAX', true );
          define( 'WP_ADMIN', true );
          $_SERVER['REQUEST_URI'] = '/wp-admin/admin-ajax.php';
          $_SERVER['HTTP_REFERER'] = 'https://www.elmercadodeorigen.com/en/shop/';
          require $argv[1] . '/wp-load.php';

          if ( ! function_exists( 'mdo_en_preview_allowed_20260819' ) ) {
              fwrite( STDERR, "PREVIEW_PLUGIN_NOT_LOADED\n" ); exit( 10 );
          }
          if ( ! function_exists( 'mdo_mentta_should_hide_publicly' ) ) {
              fwrite( STDERR, "MENTTA_PLUGIN_NOT_LOADED\n" ); exit( 11 );
          }
          if ( ! mdo_mentta_should_hide_publicly() ) {
              fwrite( STDERR, "MENTTA_AJAX_NOT_HIDDEN\n" ); exit( 12 );
          }

          $admins = get_users( array( 'role' => 'administrator', 'number' => 1, 'fields' => 'ids' ) );
          if ( ! $admins ) {
              fwrite( STDERR, "NO_ADMIN_FOR_PREVIEW_TEST\n" ); exit( 13 );
          }
          wp_set_current_user( (int) $admins[0] );
          if ( ! mdo_en_preview_allowed_20260819() ) {
              fwrite( STDERR, "ADMIN_EN_AJAX_PREVIEW_NOT_ALLOWED\n" ); exit( 14 );
          }

          $ids = get_posts( array(
              'post_type'      => 'product',
              'post_status'    => 'publish',
              'author'         => 4509,
              'posts_per_page' => 1,
              'fields'         => 'ids',
              'meta_query'     => array(
                  array( 'key' => '_en_US_ready', 'value' => '1' ),
                  array( 'key' => '_en_US_post_title', 'compare' => 'EXISTS' ),
                  array( 'key' => '_en_US_post_name', 'compare' => 'EXISTS' ),
              ),
          ) );
          if ( ! $ids ) {
              fwrite( STDERR, "NO_STAGED_CATEDRATICO_PRODUCT\n" ); exit( 15 );
          }

          $id       = (int) $ids[0];
          $original = (string) get_post_field( 'post_title', $id );
          $expected = (string) get_post_meta( $id, '_en_US_post_title', true );
          $slug     = sanitize_title( (string) get_post_meta( $id, '_en_US_post_name', true ) );
          $actual   = (string) apply_filters( 'the_title', $original, $id );
          $url      = (string) get_permalink( $id );
          $resolved = (int) mdo_en_preview_find_product_20260819( $slug );

          if ( '' === trim( $expected ) || $actual !== $expected ) {
              fwrite( STDERR, "EN_TITLE_PREVIEW_FAILED id={$id} original={$original} expected={$expected} actual={$actual}\n" ); exit( 16 );
          }
          if ( false === strpos( $url, '/en/product/' . rawurlencode( $slug ) . '/' ) ) {
              fwrite( STDERR, "EN_SLUG_PREVIEW_FAILED id={$id} slug={$slug} url={$url}\n" ); exit( 17 );
          }
          if ( $resolved !== $id ) {
              fwrite( STDERR, "EN_ROUTE_RESOLUTION_FAILED id={$id} resolved={$resolved}\n" ); exit( 18 );
          }
          if ( '1' === (string) get_post_meta( $id, '_en_US_published', true ) ) {
              fwrite( STDERR, "STAGED_PRODUCT_WAS_PUBLICLY_ACTIVATED id={$id}\n" ); exit( 19 );
          }

          echo "VERIFY_OK id={$id} title={$actual} url={$url}\n";
          PHP

          REMOTE_VERIFY="/tmp/mdo-en-preview-verify-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-en-preview-verify.php "$STAGING_USER@$STAGING_HOST:$REMOTE_VERIFY"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M '$REMOTE_VERIFY' '$PROD_PATH'; rc=\$?; rm -f '$REMOTE_VERIFY'; exit \$rc"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "grep -Fq 'Version: 1.1.0' '$MU_DIR/mdo-english-staged-admin-preview-20260819.php' && grep -Fq 'Version: 1.2.0' '$MU_DIR/mdo-internal-mentta-category.php'"

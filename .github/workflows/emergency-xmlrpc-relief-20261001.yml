name: Emergency XMLRPC relief 2026-10-01
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-xmlrpc-relief-20261001.yml'
permissions:
  contents: read
jobs:
  mitigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Block active abuse and recover PHP
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs"
          LOG="/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log"
          HT="$ROOT/.htaccess"
          FILTER="/etc/fail2ban/filter.d/emdo-xmlrpc-abuse.conf"
          JAIL="/etc/fail2ban/jail.d/emdo-xmlrpc-abuse.local"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="/root/emdo-xmlrpc-relief-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$HT" "$BACKUP/.htaccess"
          [ ! -f "$FILTER" ] || cp -a "$FILTER" "$BACKUP/"
          [ ! -f "$JAIL" ] || cp -a "$JAIL" "$BACKUP/"
          echo "backup=$BACKUP"

          echo "=== PERMANENTLY BAN CONFIRMED SOURCE ==="
          fail2ban-client set plesk-permanent-ban banip 151.243.113.84 || true
          fail2ban-client status plesk-permanent-ban || true

          echo "=== APACHE XMLRPC USER-AGENT GUARD ==="
          if ! grep -q '# BEGIN EMDO XMLRPC ABUSE GUARD' "$HT"; then
            TMP=$(mktemp)
            cat > "$TMP" <<'EOF_GUARD'
          # BEGIN EMDO XMLRPC ABUSE GUARD
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{HTTP_USER_AGENT} ^Apache-HttpClient/ [NC]
          RewriteRule ^xmlrpc\.php$ - [F,L]
          </IfModule>
          # END EMDO XMLRPC ABUSE GUARD

          EOF_GUARD
            cat "$HT" >> "$TMP"
            install -m 0644 "$TMP" "$HT"
            rm -f "$TMP"
          fi
          grep -nA7 -B1 'BEGIN EMDO XMLRPC ABUSE GUARD' "$HT"

          echo "=== REBUILD XMLRPC FAIL2BAN JAIL ==="
          cat > "$FILTER" <<'EOF_FILTER'
          [Definition]
          failregex = ^<HOST> .*"(?:GET|POST) /xmlrpc\.php(?:\?[^ ]*)? HTTP/[0-9.]+"
          ignoreregex =
          EOF_FILTER

          if [ -f /etc/fail2ban/action.d/iptables-multiport.conf ]; then
            ACTION='iptables-multiport[name=emdo-xmlrpc, port="http,https", protocol=tcp]'
          elif [ -f /etc/fail2ban/action.d/nftables-multiport.conf ]; then
            ACTION='nftables-multiport[name=emdo-xmlrpc, port="http,https", protocol=tcp]'
          else
            ACTION='iptables-allports[name=emdo-xmlrpc]'
          fi

          cat > "$JAIL" <<EOF_JAIL
          [emdo-xmlrpc-abuse]
          enabled = true
          port = http,https
          filter = emdo-xmlrpc-abuse
          logpath = $LOG
          maxretry = 20
          findtime = 300
          bantime = 86400
          action = $ACTION
          EOF_JAIL

          tail -n 50000 "$LOG" > /tmp/emdo-xmlrpc-sample.log
          fail2ban-regex /tmp/emdo-xmlrpc-sample.log "$FILTER" >/tmp/emdo-f2b-test2.txt
          grep -E 'Failregex:|Lines:' /tmp/emdo-f2b-test2.txt | tail -n 10
          if grep -q 'Failregex: 0 total' /tmp/emdo-f2b-test2.txt; then
            echo "XMLRPC filter still has zero matches" >&2
            exit 1
          fi

          fail2ban-client reload
          fail2ban-client set emdo-xmlrpc-abuse banip 151.243.113.84 || true
          fail2ban-client status emdo-xmlrpc-abuse

          echo "=== RESTART SATURATED PHP 8.2 POOL ==="
          if systemctl list-unit-files --type=service | grep -q '^plesk-php82-fpm.service'; then
            systemctl restart plesk-php82-fpm
          elif systemctl list-unit-files --type=service | grep -q '^php8.2-fpm.service'; then
            systemctl restart php8.2-fpm
          fi
          sleep 5

          echo "=== LOAD AFTER RESTART ==="
          uptime
          ps -eo pid,user,stat,etimes,%cpu,%mem,rss,args --sort=-%cpu |             grep -E 'php-fpm: pool (elmercadodeorigen.com|dev.elmercadodeorigen.com)' | head -n 30 || true

          echo "=== CACHE RESPONSE AFTER RECOVERY ==="
          for url in             "https://www.elmercadodeorigen.com/en/product-category/hams-and-shoulders/"             "https://www.elmercadodeorigen.com/en/store/montjam/"; do
            echo "--- $url"
            curl -k -sS --max-time 12 -A 'MDO-Emergency-Verify/1.0' -D /tmp/h -o /dev/null               -w 'http=%{http_code} total=%{time_total} start=%{time_starttransfer}\n' "$url" || true
            grep -Ei 'HTTP/|X-El-Mercado-Hot-Early-Cache' /tmp/h || true
          done
          REMOTE

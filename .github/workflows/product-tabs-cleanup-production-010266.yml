name: Deploy product detail layout 0.10.268

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-product-tabs-cleanup-010266.php'
      - 'mu-plugins/mdo-product-detail-layout-010267.php'
      - '.github/workflows/product-tabs-cleanup-production-010266.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate sources
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-product-tabs-cleanup-010266.php
          php -l mu-plugins/mdo-product-detail-layout-010267.php
          grep -Fq 'woocommerce_product_description_heading' mu-plugins/mdo-product-tabs-cleanup-010266.php
          grep -Fq 'mdo-product-tabs-cleanup-010266' mu-plugins/mdo-product-tabs-cleanup-010266.php
          grep -Fq '#tab-additional_information' mu-plugins/mdo-product-tabs-cleanup-010266.php
          ! grep -Fq 'description > h2:first-child' mu-plugins/mdo-product-tabs-cleanup-010266.php
          grep -Fq 'mdo-product-detail-layout-010268' mu-plugins/mdo-product-detail-layout-010267.php
          grep -Fq 'max-width: 1040px' mu-plugins/mdo-product-detail-layout-010267.php
          grep -Fq 'product-summary > .summary' mu-plugins/mdo-product-detail-layout-010267.php
          grep -Fq 'PHP_INT_MAX' mu-plugins/mdo-product-detail-layout-010267.php
          grep -Fq 'text-align: left !important' mu-plugins/mdo-product-detail-layout-010267.php

      - name: Deploy product detail MU plugins
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          for source in \
            mu-plugins/mdo-product-tabs-cleanup-010266.php \
            mu-plugins/mdo-product-detail-layout-010267.php
          do
            base="$(basename "$source")"
            target="$PROD_PATH/wp-content/mu-plugins/$base"
            remote="/tmp/${base%.php}-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP_OPTIONS "$source" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$target' ]; then cp '$target' '$target.bak-010268'; fi; install -m 0644 '$remote' '$target'; rm -f '$remote'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$target'"
          done

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public product pages
        shell: bash
        run: |
          set -euo pipefail
          ES='https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/'
          EN='https://www.elmercadodeorigen.com/en/product/jamon-de-bellota-100-iberico/'
          curl -L -fsS --retry 4 --retry-delay 2 -A 'Mozilla/5.0 EMDO product detail verifier' -H 'Cache-Control: no-cache, no-store' "$ES?verify_detail=${GITHUB_RUN_ID}" -o /tmp/product-es.html
          curl -L -fsS --retry 4 --retry-delay 2 -A 'Mozilla/5.0 EMDO product detail verifier' -H 'Cache-Control: no-cache, no-store' "$EN?verify_detail=${GITHUB_RUN_ID}" -o /tmp/product-en.html
          grep -Fq 'id="mdo-product-tabs-cleanup-010266"' /tmp/product-es.html
          grep -Fq 'id="mdo-product-tabs-cleanup-010266"' /tmp/product-en.html
          grep -Fq 'id="mdo-product-detail-layout-010268"' /tmp/product-es.html
          grep -Fq 'id="mdo-product-detail-layout-010268"' /tmp/product-en.html
          grep -Fq 'Sobre Hidalgo de la Jara' /tmp/product-es.html
          grep -Fq 'About Hidalgo de la Jara' /tmp/product-en.html
          if grep -Eiq '>\s*Descripción\s*</h2>' /tmp/product-es.html; then echo 'Automatic ES Description heading still present'; exit 1; fi
          if grep -Eiq '>\s*Description\s*</h2>' /tmp/product-en.html; then echo 'Automatic EN Description heading still present'; exit 1; fi
          echo 'PRODUCT_DETAIL_LAYOUT_010268_PUBLIC_OK'

name: Lock development site 2026-10-01
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-development-site-20261001.yml'
permissions:
  contents: read
jobs:
  lock-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Protect dev virtual host
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          DOMAIN="dev.elmercadodeorigen.com"
          PROD="https://www.elmercadodeorigen.com/"
          HASH='$2y$14$GG6mfCEYykHkUVzyV7OJ.uMnklNwZD7qAE./r3.tUSO.Nrw6zTu4W'
          USERNAME="admin"

          DOCROOT=$(plesk db -Ne "SELECT h.www_root FROM hosting h JOIN domains d ON d.id=h.dom_id WHERE d.name='$DOMAIN' LIMIT 1;" 2>/dev/null | head -n1 || true)
          if [ -z "$DOCROOT" ] || [ ! -d "$DOCROOT" ]; then
            INFO=$(plesk bin site --info "$DOMAIN" 2>/dev/null || plesk bin domain --info "$DOMAIN" 2>/dev/null || true)
            DOCROOT=$(printf '%s\n' "$INFO" | awk -F: 'tolower($1) ~ /document root/ {sub(/^[[:space:]]+/,"",$2); print $2; exit}')
          fi
          if [ -z "$DOCROOT" ] || [ ! -d "$DOCROOT" ]; then
            echo "Could not resolve dev document root" >&2
            exit 1
          fi

          SYSTEM_DIR="/var/www/vhosts/system/$DOMAIN"
          HTPASS="$SYSTEM_DIR/.htpasswd-emdo-dev"
          HT="$DOCROOT/.htaccess"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="/root/emdo-dev-lock-$STAMP"
          mkdir -p "$BACKUP"
          [ ! -f "$HT" ] || cp -a "$HT" "$BACKUP/.htaccess"
          [ ! -f "$HTPASS" ] || cp -a "$HTPASS" "$BACKUP/.htpasswd-emdo-dev"
          crontab -l > "$BACKUP/root-crontab.txt" 2>/dev/null || true
          echo "backup=$BACKUP"
          echo "docroot=$DOCROOT"

          echo "=== INSTALL PASSWORD FILE ==="
          mkdir -p "$SYSTEM_DIR"
          TMPPASS=$(mktemp)
          printf '%s:%s\n' "$USERNAME" "$HASH" > "$TMPPASS"
          if getent group psaserv >/dev/null 2>&1; then
            install -m 0640 -o root -g psaserv "$TMPPASS" "$HTPASS"
          else
            install -m 0644 -o root -g root "$TMPPASS" "$HTPASS"
          fi
          rm -f "$TMPPASS"

          echo "=== INSTALL DEV-ONLY AUTH RULE ==="
          python3 - "$HT" "$HTPASS" <<'PY'
          import sys,re,os
          ht,htpass=sys.argv[1],sys.argv[2]
          s=''
          if os.path.isfile(ht):
              with open(ht,'r',encoding='utf-8',errors='replace') as f:
                  s=f.read()
          s=re.sub(r'\n?# BEGIN EMDO DEV LOCK\n.*?# END EMDO DEV LOCK\n?', '\n', s, flags=re.S)
          block=f'''# BEGIN EMDO DEV LOCK
          AuthType Basic
          AuthName "Development - El Mercado de Origen"
          AuthUserFile {htpass}
          Require valid-user

          <IfModule mod_headers.c>
          Header always set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>

          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule ^xmlrpc\\.php$ - [F,L]
          </IfModule>
          # END EMDO DEV LOCK

          '''
          with open(ht,'w',encoding='utf-8') as f:
              f.write(block+s.lstrip('\n'))
          PY

          # Preserve the webspace ownership if an existing .htaccess told us what it should be.
          if [ -f "$BACKUP/.htaccess" ]; then
            chown --reference="$BACKUP/.htaccess" "$HT" || true
            chmod --reference="$BACKUP/.htaccess" "$HT" || true
          else
            chown "$(stat -c '%U:%G' "$DOCROOT")" "$HT" || true
            chmod 0644 "$HT"
          fi

          echo "=== APACHE CONFIG ==="
          apachectl -t

          echo "=== UNAUTHENTICATED DEV MUST STOP BEFORE PHP ==="
          curl -k -sS --max-time 10 -D /tmp/dev-unauth-h -o /dev/null             -w 'unauth_http=%{http_code} total=%{time_total} start=%{time_starttransfer}\n'             "https://$DOMAIN/" || true
          grep -Ei 'HTTP/|WWW-Authenticate|X-Robots-Tag|X-Powered-By' /tmp/dev-unauth-h || true

          echo "=== AUTHENTICATED DEV HEALTH WITH TEMPORARY TEST USER ==="
          TESTPW=$(openssl rand -hex 18)
          htpasswd -bB -C 12 "$HTPASS" __emdo_health "$TESTPW" >/dev/null
          curl -k -sS -L --max-time 20 -u "__emdo_health:$TESTPW"             -D /tmp/dev-auth-h -o /dev/null             -w 'auth_http=%{http_code} total=%{time_total} start=%{time_starttransfer}\n'             "https://$DOMAIN/" || true
          grep -Ei 'HTTP/|WWW-Authenticate|X-Robots-Tag|X-Powered-By' /tmp/dev-auth-h || true
          htpasswd -D "$HTPASS" __emdo_health >/dev/null || true
          unset TESTPW

          echo "=== PRODUCTION MUST REMAIN OPEN ==="
          curl -k -sS -L --max-time 20 -D /tmp/prod-h -o /dev/null             -w 'prod_http=%{http_code} total=%{time_total} start=%{time_starttransfer}\n'             "$PROD" || true
          grep -Ei 'HTTP/|WWW-Authenticate' /tmp/prod-h || true

          echo "=== EXTERNAL DEV REQUEST BURST ==="
          for i in $(seq 1 12); do
            curl -k -sS --max-time 5 -o /dev/null "https://$DOMAIN/" || true
          done
          sleep 2
          ps -eo pid,user,stat,etimes,%cpu,%mem,rss,args --sort=-%cpu |             grep -E 'php-fpm: pool dev\.elmercadodeorigen\.com' | head -n 10 || true

          echo "=== DEV CRON REFERENCES ==="
          (crontab -l 2>/dev/null || true) | grep -Ei "$DOMAIN|$DOCROOT|wp-cron" || true

          echo "=== RESULT ==="
          grep -q '^HTTP/.* 401' /tmp/dev-unauth-h
          grep -q '^HTTP/.* 200' /tmp/dev-auth-h
          ! grep -qi '^WWW-Authenticate:' /tmp/prod-h
          echo "DEV_LOCK_OK"
          REMOTE

name: Publish nutrition batch production

on:
  push:
    branches: [main]
    paths:
      - '.github/content-publish/current-batch.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrition-batch-production-global
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify current nutrition batch
        shell: bash
        run: |
          set -euo pipefail
          BATCH="$(tr -d '[:space:]' < .github/content-publish/current-batch.txt)"
          [[ "$BATCH" =~ ^[0-9]+-[0-9]+$ ]]
          RUNNER=".github/scripts/run-nutrition-priority-${BATCH}-production.sh"
          test -f "$RUNNER"
          bash "$RUNNER"

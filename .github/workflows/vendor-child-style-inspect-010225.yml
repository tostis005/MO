name: Vendor child style inspect 0.10.225
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-child-style-inspect-010225.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - shell: bash
        run: |
          cat >/tmp/style-inspect.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{const b=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();await p.goto('https://dev.elmercadodeorigen.com/tienda/hidalgo-de-la-jara/?style-check='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});console.log('STYLES='+JSON.stringify(await p.evaluate(()=>[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href).filter(x=>x.includes('elmercadodeorigen-child')))));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/style-inspect.cjs

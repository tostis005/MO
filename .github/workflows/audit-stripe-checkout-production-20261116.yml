name: Audit live Stripe checkout visual layout

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/check-stripe-checkout-production.cjs'
      - '.github/workflows/audit-stripe-checkout-production-20261116.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: emdo-stripe-visual-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check browser audit script
        run: node --check .github/scripts/check-stripe-checkout-production.cjs

      - name: Install headless browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1

      - name: Audit real checkout without placing an order
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -Eeuo pipefail
          if [ ! -x "$CHROME" ]; then
            CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
            export CHROME
          fi
          test -x "$CHROME"
          node .github/scripts/check-stripe-checkout-production.cjs

      - name: Save mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-checkout-visual-${{ github.run_id }}
          path: /tmp/emdo-stripe-checkout-*.png
          if-no-files-found: ignore
          retention-days: 5

      - name: Report browser QA result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN_FOR_STATUS: ${{ github.token }}
          AUDIT_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [ "$AUDIT_RESULT" = "success" ]; then
            STATE=success
            MESSAGE="Live Stripe checkout visual regression passed"
          else
            STATE=failure
            MESSAGE="Live Stripe checkout visual audit failed; inspect screenshots"
          fi
          PAYLOAD="$(printf '{"state":"%s","context":"emdo/stripe-checkout-browser","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' "$STATE" "$MESSAGE" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN_FOR_STATUS" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

name: Verify public accessories one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-accessories-one-shot.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production Accesorios page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.elmercadodeorigen.com/categoria-producto/accesorios/'
          HTML="$(mktemp)"
          CODE="$(curl -L --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' -sS -o "$HTML" -w '%{http_code}' "$URL")"
          echo "HTTP=$CODE"
          test "$CODE" = '200'
          grep -qi 'Tabla jamonera modelo g' "$HTML"
          grep -qi 'Tabla jamonera modelo bellota 3' "$HTML"
          grep -qi 'Tabla jamonera modelo basculante' "$HTML"
          grep -qi 'cuchillo y afilador' "$HTML"
          echo 'PUBLIC_ACCESSORIES_PAGE=passed'

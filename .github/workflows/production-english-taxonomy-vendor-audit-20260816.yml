name: Production English taxonomy vendor audit 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-english-taxonomy-vendor-audit-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect translated term metadata and vendor route query vars
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path missing}"

          echo '--- TERM META ---'
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            foreach(["product_cat","product_tag","category"] as $tax){
              $terms=get_terms(["taxonomy"=>$tax,"hide_empty"=>false]);
              echo "TAX $tax count=".count($terms).PHP_EOL;
              foreach(array_slice($terms,0,200) as $term){
                $meta=get_term_meta($term->term_id);
                $en=[];
                foreach($meta as $k=>$vals){if(stripos($k,"en_US")!==false || stripos($k,"en_us")!==false || stripos($k,"falang")!==false){$en[$k]=$vals;}}
                if($en){echo "TERM\t$tax\t{$term->term_id}\t{$term->slug}\t{$term->name}\t".wp_json_encode($en,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}
              }
            }
            global $wpdb;
            $keys=$wpdb->get_col("SELECT DISTINCT meta_key FROM {$wpdb->termmeta} WHERE meta_key LIKE \"%en_US%\" OR meta_key LIKE \"%en_us%\" ORDER BY meta_key");
            echo "EN_TERM_META_KEYS=".implode(",",$keys).PHP_EOL;
          ' --path="$PROD_PATH" --allow-root 2>/dev/null

          echo '--- WCFM SETTINGS ---'
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            foreach(["wcfm_marketplace_options","wcfm_options","wcfmmp_store_url","wcfm_store_url"] as $key){$v=get_option($key,null); if($v!==null){echo "OPTION $key=".wp_json_encode($v,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}}
            echo "WCFM_ACTIVE=".(is_plugin_active("wc-multivendor-marketplace/wc-multivendor-marketplace.php")?"1":"0").PHP_EOL;
          ' --path="$PROD_PATH" --allow-root 2>/dev/null || true

          DEBUG="$PROD_PATH/wp-content/mu-plugins/mdo-route-debug-temp.php"
          trap 'rm -f "$DEBUG"' EXIT
          cat > "$DEBUG" <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit;
          add_action('template_redirect', static function(){
              if (empty($_GET['mdo_route_debug'])) return;
              global $wp, $wp_query;
              nocache_headers();
              header('Content-Type: application/json; charset=utf-8');
              $qo=get_queried_object();
              echo wp_json_encode([
                  'request_uri'=>$_SERVER['REQUEST_URI'] ?? '',
                  'wp_request'=>$wp->request ?? '',
                  'query_vars'=>$wp->query_vars ?? [],
                  'is_404'=>is_404(),
                  'is_archive'=>is_archive(),
                  'is_page'=>is_page(),
                  'is_singular'=>is_singular(),
                  'queried_object'=>is_object($qo)?get_object_vars($qo):$qo,
              ], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);
              exit;
          }, -999999);
          PHP
          "$php_bin" -l "$DEBUG"
          for u in \
            'https://www.elmercadodeorigen.com/en/tienda/hidalgo-de-la-jara/?mdo_route_debug=1' \
            'https://www.elmercadodeorigen.com/tienda/hidalgo-de-la-jara/?mdo_route_debug=1' \
            'https://www.elmercadodeorigen.com/en/tienda/1957/?mdo_route_debug=1'; do
            echo "ROUTE=$u"
            curl -ksSL --max-time 25 "$u" | head -c 12000
            echo
          done
          rm -f "$DEBUG"
          trap - EXIT
          REMOTE

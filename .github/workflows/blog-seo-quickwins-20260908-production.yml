name: Deploy blog SEO quick wins 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-blog-seo-quickwins-20260908.php'
      - '.github/workflows/blog-seo-quickwins-20260908-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        run: php -l mu-plugins/mdo-blog-seo-quickwins-20260908.php

      - name: Deploy MU plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          NAME='mdo-blog-seo-quickwins-20260908.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp=\$(command -v wp || true); php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php\" \"\$wp\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify H1, SERP copy, direct answers, cheese cleanup and cluster links live
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4
          ES="https://www.elmercadodeorigen.com/hay-que-poner-lentejas-en-remojo-cuanto-tiempo/?mdo_seo_verify=${GITHUB_RUN_ID}"
          EN="https://www.elmercadodeorigen.com/en/how-much-protein-in-beef/?mdo_seo_verify=${GITHUB_RUN_ID}"
          ES_CLUSTER="https://www.elmercadodeorigen.com/que-legumbre-tiene-mas-hierro-comparativa/?mdo_seo_verify=${GITHUB_RUN_ID}"
          EN_CLUSTER="https://www.elmercadodeorigen.com/en/how-much-iron-in-beef/?mdo_seo_verify=${GITHUB_RUN_ID}"
          ES_ANSWER="https://www.elmercadodeorigen.com/aguja-ternera-que-corte-es-como-cocinarla/?mdo_seo_verify=${GITHUB_RUN_ID}"
          EN_ANSWER="https://www.elmercadodeorigen.com/en/yellow-broccoli-why-it-changes-colour-and-when-it-is-edible/?mdo_seo_verify=${GITHUB_RUN_ID}"
          EN_CHEESE="https://www.elmercadodeorigen.com/en/what-is-cheese-affinage-maturation-humidity-rind-care-affineur/?mdo_seo_verify=${GITHUB_RUN_ID}"
          EN_CHEESE_BAD="https://www.elmercadodeorigen.com/en/how-to-tell-cheese-gone-bad-mould-smell-texture-discard/?mdo_seo_verify=${GITHUB_RUN_ID}"
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$ES" -o /tmp/es.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$EN" -o /tmp/en.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$ES_CLUSTER" -o /tmp/es-cluster.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$EN_CLUSTER" -o /tmp/en-cluster.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$ES_ANSWER" -o /tmp/es-answer.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$EN_ANSWER" -o /tmp/en-answer.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$EN_CHEESE" -o /tmp/en-cheese.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$EN_CHEESE_BAD" -o /tmp/en-cheese-bad.html
          python - <<'PY'
          from bs4 import BeautifulSoup
          for label, path in [('ES','/tmp/es.html'), ('EN','/tmp/en.html')]:
              soup = BeautifulSoup(open(path, encoding='utf-8').read(), 'html.parser')
              main = soup.select_one('main#primary.emo-article-page')
              content = soup.select_one('.emo-article-content')
              assert main is not None and content is not None, f'{label}: article markup missing'
              print(label, 'main_h1=', len(main.select('h1')), 'content_h1=', len(content.select('h1')))
              assert len(main.select('h1')) == 1, f'{label}: expected one H1'
              assert len(content.select('h1')) == 0, f'{label}: duplicate content H1 remains'

          es = BeautifulSoup(open('/tmp/es.html', encoding='utf-8').read(), 'html.parser')
          newsletter = es.select_one('#emo-newsletter')
          anchor = es.select_one('[data-emo-newsletter-anchor]')
          assert newsletter is not None and anchor is not None, 'ES: newsletter or later anchor missing'
          assert newsletter.parent is anchor, 'ES: newsletter not moved into later anchor'
          direct = list(es.select_one('.emo-article-content').children)
          anchor_index = direct.index(anchor)
          preceding = sum(1 for child in direct[:anchor_index] if getattr(child, 'name', None) == 'p')
          print('ES newsletter_after_direct_paragraphs=', preceding)
          assert preceding >= 7, 'ES: newsletter still too early'

          checks = [
              ('ES', '/tmp/es.html', '¿Hay que remojar las lentejas? Tiempo de remojo', 'targeted'),
              ('EN', '/tmp/en.html', 'Beef Protein per 100 g: Amounts by Serving', 'reviewed-en'),
          ]
          for label, path, title_prefix, desc_mode in checks:
              soup = BeautifulSoup(open(path, encoding='utf-8').read(), 'html.parser')
              title = soup.title.get_text(' ', strip=True) if soup.title else ''
              meta = soup.find('meta', attrs={'name':'description'})
              desc = meta.get('content','').strip() if meta else ''
              print(label, 'title=', title, 'description=', desc)
              assert title.startswith(title_prefix), f'{label}: targeted SEO title missing: {title!r}'
              if desc_mode == 'targeted':
                  assert desc.startswith('¿Hay que poner las lentejas en remojo?'), f'{label}: targeted meta description missing: {desc!r}'
              else:
                  lowered = desc.lower()
                  assert desc and 'protein' in lowered and '100 g' in lowered, f'{label}: reviewed English description lost search intent: {desc!r}'

          expected_shop = {
              'ES_CLUSTER': '/categoria-producto/legumbres/',
              'EN_CLUSTER': '/en/product-category/meat/',
          }
          for label, path in [('ES_CLUSTER','/tmp/es-cluster.html'), ('EN_CLUSTER','/tmp/en-cluster.html')]:
              soup = BeautifulSoup(open(path, encoding='utf-8').read(), 'html.parser')
              block = soup.select_one('.emo-article-content p.mdo-seo-cluster-links[data-mdo-seo-cluster]')
              assert block is not None, f'{label}: contextual cluster block missing'
              links = block.find_all('a', href=True)
              shop = block.select_one('a.mdo-seo-cluster-shop[href]')
              print(label, 'cluster=', block.get('data-mdo-seo-cluster'), 'links=', [a.get('href') for a in links], 'shop=', shop.get('href') if shop else '')
              assert len(links) >= 3, f'{label}: expected editorial + commerce contextual links'
              assert shop is not None and shop.get('href','').endswith(expected_shop[label]), f'{label}: commercial category bridge missing'

          cheese = BeautifulSoup(open('/tmp/en-cheese.html', encoding='utf-8').read(), 'html.parser')
          cheese_title = cheese.title.get_text(' ', strip=True) if cheese.title else ''
          cheese_block = cheese.select_one('.emo-article-content p.mdo-seo-cluster-links[data-mdo-seo-cluster="en-cheese"]')
          assert cheese_title.startswith('Cheese Affinage: What It Means and How It Works'), f'EN_CHEESE: SEO title missing: {cheese_title!r}'
          assert cheese_block is not None, 'EN_CHEESE: cheese cluster block missing'
          cheese_links = cheese_block.find_all('a', href=True)
          print('EN_CHEESE', 'title=', cheese_title, 'links=', [a.get('href') for a in cheese_links])
          assert len(cheese_links) >= 2, 'EN_CHEESE: expected at least two cheese authority links'

          bad = BeautifulSoup(open('/tmp/en-cheese-bad.html', encoding='utf-8').read(), 'html.parser')
          bad_title = bad.title.get_text(' ', strip=True) if bad.title else ''
          bad_content = bad.select_one('.emo-article-content')
          assert bad_content is not None, 'EN_CHEESE_BAD: article content missing'
          bad_text = bad_content.get_text(' ', strip=True)
          bad_html = str(bad_content)
          print('EN_CHEESE_BAD', 'title=', bad_title)
          assert bad_title.startswith('How to Tell If Cheese Is Bad: Mould, Smell & Texture'), f'EN_CHEESE_BAD: SEO title missing: {bad_title!r}'
          assert 'This guide is designed to answer the full search intent' not in bad_text, 'EN_CHEESE_BAD: generic search-intent sentence remains'
          import re
          assert re.search(r'[.!?]nn[A-Z]', bad_html) is None, 'EN_CHEESE_BAD: literal nn paragraph artifact remains'

          answer_checks = [
              ('ES_ANSWER', '/tmp/es-answer.html', 'Aguja de ternera: qué corte es y cómo cocinarla', 'Respuesta rápida'),
              ('EN_ANSWER', '/tmp/en-answer.html', 'Yellow Broccoli: Is It Safe to Eat? Why It Changes', 'Quick answer'),
          ]
          for label, path, title_prefix, answer_label in answer_checks:
              soup = BeautifulSoup(open(path, encoding='utf-8').read(), 'html.parser')
              content = soup.select_one('.emo-article-content')
              assert content is not None, f'{label}: article content missing'
              answer = content.select_one('p.mdo-seo-direct-answer[data-mdo-seo-answer]')
              assert answer is not None, f'{label}: direct answer block missing'
              first_h2 = content.find('h2')
              assert first_h2 is not None, f'{label}: first H2 missing'
              nodes = list(content.descendants)
              assert nodes.index(answer) < nodes.index(first_h2), f'{label}: direct answer must appear before first H2'
              title = soup.title.get_text(' ', strip=True) if soup.title else ''
              print(label, 'title=', title, 'answer=', answer.get_text(' ', strip=True))
              assert title.startswith(title_prefix), f'{label}: phase-3 SEO title missing: {title!r}'
              assert answer.get_text(' ', strip=True).startswith(answer_label + ':'), f'{label}: answer label mismatch'
          PY

      - name: Diagnose canonical and HTTP routing
        continue-on-error: true
        shell: bash
        run: |
          set -u
          UTM='https://www.elmercadodeorigen.com/hay-que-poner-lentejas-en-remojo-cuanto-tiempo/?utm_source=rss&utm_medium=rss'
          curl -L --fail --silent --show-error --retry 2 "$UTM" -o /tmp/utm.html || true
          python -m pip install --quiet beautifulsoup4 >/dev/null 2>&1 || true
          python - <<'PY'
          from bs4 import BeautifulSoup
          try:
              soup = BeautifulSoup(open('/tmp/utm.html', encoding='utf-8').read(), 'html.parser')
              canonical = soup.find('link', rel=lambda v: v and 'canonical' in v)
              print('CANONICAL:', canonical.get('href') if canonical else 'MISSING')
          except Exception as e:
              print('CANONICAL DIAGNOSTIC ERROR:', e)
          PY
          curl -sSI --max-redirs 0 'http://www.elmercadodeorigen.com/hay-que-poner-lentejas-en-remojo-cuanto-tiempo/' | tr -d '\r' | sed -n '1,8p' || true

      - name: Roll back on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          NAME='mdo-blog-seo-quickwins-20260908.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Clean deployment backup
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          NAME='mdo-blog-seo-quickwins-20260908.php'
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

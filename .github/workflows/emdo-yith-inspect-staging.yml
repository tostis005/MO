name: Fix YITH staging test association

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-yith-inspect-staging.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Repair association and verify frontend
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          prefix="$($WP db prefix 2>/dev/null)"

          echo '=== EXISTING HIDALGO ASSOCIATIONS FOR BLOCK 1 ==='
          $WP db query "SELECT rule_id,object,type FROM ${prefix}yith_wapo_blocks_assoc WHERE rule_id=1;" 2>/dev/null || true
          echo '=== ALL CURRENT ASSOCIATIONS ==='
          $WP db query "SELECT rule_id,object,type FROM ${prefix}yith_wapo_blocks_assoc ORDER BY rule_id,object,type LIMIT 200;" 2>/dev/null || true

          script="$(mktemp /tmp/emdo-yith-assoc.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;
          $product_id = 11235;
          $block_id = (int) get_post_meta( $product_id, '_emdo_yith_wapo_block_id', true );
          $addon_id = (int) get_post_meta( $product_id, '_emdo_yith_wapo_addon_id', true );
          if ( $block_id <= 0 || $addon_id <= 0 ) {
              throw new RuntimeException( 'EMDO test block markers are missing.' );
          }
          $assoc = $wpdb->prefix . 'yith_wapo_blocks_assoc';
          $template = $wpdb->get_row( $wpdb->prepare( "SELECT object,type FROM {$assoc} WHERE rule_id = %d LIMIT 1", 1 ), ARRAY_A );
          if ( ! $template ) {
              throw new RuntimeException( 'No YITH association template exists for Hidalgo block 1.' );
          }
          $type = (string) $template['type'];
          $wpdb->delete( $assoc, array( 'rule_id' => $block_id ), array( '%d' ) );
          $ok = $wpdb->insert(
              $assoc,
              array( 'rule_id' => $block_id, 'object' => (string) $product_id, 'type' => $type ),
              array( '%d', '%s', '%s' )
          );
          if ( false === $ok ) {
              throw new RuntimeException( 'Could not create YITH association: ' . $wpdb->last_error );
          }
          wp_cache_flush();
          echo "BLOCK_ID={$block_id}\nADDON_ID={$addon_id}\nASSOC_OBJECT={$product_id}\nASSOC_TYPE={$type}\n";
          PHP
          $WP eval-file "$script" 2>/dev/null

          echo '=== TEST ASSOCIATION ==='
          $WP db query "SELECT rule_id,object,type FROM ${prefix}yith_wapo_blocks_assoc WHERE rule_id=(SELECT meta_value FROM ${prefix}postmeta WHERE post_id=11235 AND meta_key='_emdo_yith_wapo_block_id' LIMIT 1);" 2>/dev/null
          url="$($WP post url 11235 2>/dev/null)"
          echo "=== FRONTEND VERIFY: $url ==="
          html="$(curl -LfsS --max-time 30 -H 'Cache-Control: no-cache' "$url?emdo_yith_test=$(date +%s)")"
          printf '%s' "$html" | grep -Fq 'PREPARACIÓN'
          printf '%s' "$html" | grep -Fq 'Cortado a cuchillo'
          printf '%s' "$html" | grep -Fq 'Cortado a máquina'
          echo 'FRONTEND_HAS_PREPARACION=yes'
          echo 'FRONTEND_HAS_CUCHILLO=yes'
          echo 'FRONTEND_HAS_MAQUINA=yes'
          REMOTE

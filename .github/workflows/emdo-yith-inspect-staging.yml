name: Inspect YITH staging integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-yith-inspect-staging.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Inspect staging YITH and examples
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || { echo 'No staging WordPress found' >&2; exit 1; }
            wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          prefix="$($WP db prefix)"
          echo '=== YITH PLUGINS ==='
          $WP plugin list --format=csv | grep -i 'yith\|product-add' || true
          echo '=== YITH-LIKE TABLES ==='
          $WP db query "SHOW TABLES LIKE '${prefix}%yith%';" --skip-column-names || true
          echo '=== YITH POST TYPES ==='
          $WP db query "SELECT post_type,COUNT(*) FROM ${prefix}posts WHERE post_type LIKE '%yith%' OR post_type LIKE '%add-on%' OR post_type LIKE '%addon%' GROUP BY post_type ORDER BY 2 DESC;" --skip-column-names || true
          echo '=== YITH META KEYS ==='
          $WP db query "SELECT meta_key,COUNT(*) c FROM ${prefix}postmeta WHERE meta_key LIKE '%yith%' OR meta_key LIKE '%addon%' OR meta_key LIKE '%add_on%' GROUP BY meta_key ORDER BY c DESC LIMIT 80;" --skip-column-names || true
          echo '=== EL CATEDRATICO TARGET ==='
          $WP db query "SELECT sp.id,sp.wc_product_id,sp.title,sp.source_url,sp.status FROM ${prefix}mdo_source_products sp JOIN ${prefix}mdo_suppliers s ON s.id=sp.supplier_id WHERE s.connector='el-catedratico' AND sp.source_url LIKE '%jamon-de-cebo-iberico-50-raza-iberica-deshuesado%' ORDER BY sp.id DESC LIMIT 5;" --skip-column-names || true
          echo '=== HIDALGO PRODUCT CANDIDATES WITH YITH META ==='
          $WP db query "SELECT DISTINCT p.ID,p.post_title,p.post_author,pm.meta_key FROM ${prefix}posts p JOIN ${prefix}postmeta pm ON pm.post_id=p.ID WHERE p.post_type='product' AND p.post_status NOT IN ('trash','auto-draft') AND (pm.meta_key LIKE '%yith%' OR pm.meta_key LIKE '%addon%' OR pm.meta_key LIKE '%add_on%') ORDER BY p.ID DESC LIMIT 50;" --skip-column-names || true
          echo '=== ADDON POSTS RECENT ==='
          $WP db query "SELECT ID,post_type,post_title,post_status,post_parent FROM ${prefix}posts WHERE post_type LIKE '%yith%' OR post_type LIKE '%addon%' OR post_type LIKE '%add-on%' ORDER BY ID DESC LIMIT 60;" --skip-column-names || true
          echo '=== YITH PLUGIN FILES/TABLE REFERENCES ==='
          plugin_dir="$wp_path/wp-content/plugins"
          yithdir="$(find "$plugin_dir" -maxdepth 1 -mindepth 1 -type d -iname '*yith*product*add*' | head -n1 || true)"
          echo "YITH_DIR=$yithdir"
          if [ -n "$yithdir" ]; then
            grep -RIn --include='*.php' -E 'CREATE TABLE|yith_wapo|blocks|addons|product_association|products' "$yithdir" 2>/dev/null | head -n 120 || true
          fi
          REMOTE

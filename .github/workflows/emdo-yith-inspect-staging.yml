name: Test YITH staging integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-yith-inspect-staging.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Create and verify one EMDO YITH block
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          script="$(mktemp /tmp/emdo-yith-test.XXXXXX.php)"
          trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;
          $product_id  = 11235;
          $blocks      = $wpdb->prefix . 'yith_wapo_blocks';
          $addons      = $wpdb->prefix . 'yith_wapo_addons';
          $marker_key  = '_emdo_yith_wapo_block_id';
          $marker_name = 'EMDO · Preparación · 11235';

          if ( 'product' !== get_post_type( $product_id ) ) {
              throw new RuntimeException( 'Target product 11235 does not exist.' );
          }
          if ( ! metadata_exists( 'post', $product_id, '_emdo_source_product_id' ) ) {
              throw new RuntimeException( 'Target is not linked to EMDO.' );
          }

          $template_block = $wpdb->get_row( "SELECT * FROM {$blocks} WHERE id = 1" );
          $template_addon = $wpdb->get_row( "SELECT * FROM {$addons} WHERE id = 1" );
          if ( ! $template_block || ! $template_addon ) {
              throw new RuntimeException( 'Hidalgo YITH template was not found.' );
          }

          $old_block_id = (int) get_post_meta( $product_id, $marker_key, true );
          if ( $old_block_id > 0 ) {
              $wpdb->delete( $addons, array( 'block_id' => $old_block_id ), array( '%d' ) );
              $wpdb->delete( $blocks, array( 'id' => $old_block_id ), array( '%d' ) );
              delete_post_meta( $product_id, $marker_key );
          }

          $block_settings = maybe_unserialize( $template_block->settings );
          if ( ! is_array( $block_settings ) ) {
              throw new RuntimeException( 'Invalid Hidalgo block settings.' );
          }
          $block_settings['name'] = $marker_name;
          $block_settings['priority'] = '1';
          $block_settings['rules']['show_in'] = 'products';
          $block_settings['rules']['show_in_products'] = array( (string) $product_id );
          $block_settings['rules']['show_in_categories'] = '';
          $block_settings['rules']['exclude_products'] = '';
          $block_settings['rules']['exclude_products_products'] = '';
          $block_settings['rules']['exclude_products_categories'] = '';
          $block_settings['rules']['show_to'] = 'all';
          $block_settings['rules']['show_to_user_roles'] = '';
          $block_settings['rules']['show_to_membership'] = '';

          $inserted = $wpdb->insert(
              $blocks,
              array(
                  'user_id'             => null,
                  'vendor_id'           => 0,
                  'settings'            => maybe_serialize( $block_settings ),
                  'priority'            => '1.00000',
                  'visibility'          => 1,
                  'last_update'         => current_time( 'mysql' ),
                  'name'                => $marker_name,
                  'product_association' => 'products',
                  'exclude_products'    => 0,
                  'user_association'    => 'all',
                  'exclude_users'       => 0,
              ),
              array( '%d', '%d', '%s', '%f', '%d', '%s', '%s', '%s', '%d', '%s', '%d' )
          );
          if ( false === $inserted ) {
              throw new RuntimeException( 'Could not create YITH block: ' . $wpdb->last_error );
          }
          $block_id = (int) $wpdb->insert_id;

          $addon_settings = maybe_unserialize( $template_addon->settings );
          if ( ! is_array( $addon_settings ) ) {
              throw new RuntimeException( 'Invalid Hidalgo addon settings.' );
          }
          $addon_settings['type'] = 'select';
          $addon_settings['title'] = 'PREPARACIÓN';
          $addon_settings['required'] = '';
          $addon_settings['description'] = '';
          $addon_settings['enable_rules'] = '';
          $addon_settings['conditional_logic'] = array();

          $labels = array(
              'Pieza entera',
              'Deshuesado',
              'Cortado a cuchillo',
              'Cortado a máquina',
          );
          $prices = array( '0', '0', '20', '9.47' );
          $options = array(
              'default'       => array( 'yes', 'no', 'no', 'no' ),
              'addon_enabled' => array( 'yes', 'yes', 'yes', 'yes' ),
              'label'         => $labels,
              'description'   => array( '', '', '', '' ),
              'image'         => array( '', '', '', '' ),
              'price_method'  => array( 'free', 'increase', 'increase', 'increase' ),
              'price'         => $prices,
              'price_sale'    => array( '', '', '', '' ),
              'price_type'    => array( 'fixed', 'fixed', 'fixed', 'fixed' ),
              'show_image'    => array( 'no', 'no', 'no', 'no' ),
              'label_in_cart' => array( 'no', 'no', 'no', 'no' ),
          );

          $inserted = $wpdb->insert(
              $addons,
              array(
                  'block_id'    => $block_id,
                  'settings'    => maybe_serialize( $addon_settings ),
                  'options'     => maybe_serialize( $options ),
                  'priority'    => '1.00000',
                  'visibility'  => 1,
                  'last_update' => current_time( 'mysql' ),
              ),
              array( '%d', '%s', '%s', '%f', '%d', '%s' )
          );
          if ( false === $inserted ) {
              $wpdb->delete( $blocks, array( 'id' => $block_id ), array( '%d' ) );
              throw new RuntimeException( 'Could not create YITH addon: ' . $wpdb->last_error );
          }
          $addon_id = (int) $wpdb->insert_id;
          update_post_meta( $product_id, $marker_key, $block_id );
          update_post_meta( $product_id, '_emdo_yith_wapo_addon_id', $addon_id );
          clean_post_cache( $product_id );
          wp_cache_flush();

          echo "PRODUCT_ID={$product_id}\n";
          echo 'PRODUCT_TITLE=' . get_the_title( $product_id ) . "\n";
          echo 'PRODUCT_URL=' . get_permalink( $product_id ) . "\n";
          echo "BLOCK_ID={$block_id}\n";
          echo "ADDON_ID={$addon_id}\n";
          echo 'LABELS=' . implode( ' | ', $labels ) . "\n";
          echo 'PRICES=' . implode( ' | ', $prices ) . "\n";
          PHP
          $WP eval-file "$script" 2>/dev/null
          url="$($WP post url 11235 2>/dev/null)"
          echo "=== FRONTEND VERIFY: $url ==="
          html="$(curl -LfsS --max-time 30 "$url")"
          printf '%s' "$html" | grep -Fq 'PREPARACIÓN'
          printf '%s' "$html" | grep -Fq 'Cortado a cuchillo'
          printf '%s' "$html" | grep -Fq 'Cortado a máquina'
          echo 'FRONTEND_HAS_PREPARACION=yes'
          echo 'FRONTEND_HAS_CUCHILLO=yes'
          echo 'FRONTEND_HAS_MAQUINA=yes'
          REMOTE

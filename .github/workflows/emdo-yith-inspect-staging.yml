name: Inspect YITH staging integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-yith-inspect-staging.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Inspect YITH schema and Hidalgo example
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          prefix="$($WP db prefix 2>/dev/null)"
          echo '=== SCHEMA BLOCKS ==='; $WP db query "DESCRIBE ${prefix}yith_wapo_blocks;" 2>/dev/null
          echo '=== SCHEMA ASSOC ==='; $WP db query "DESCRIBE ${prefix}yith_wapo_blocks_assoc;" 2>/dev/null
          echo '=== SCHEMA ADDONS ==='; $WP db query "DESCRIBE ${prefix}yith_wapo_addons;" 2>/dev/null
          echo '=== BLOCKS ==='; $WP db query "SELECT * FROM ${prefix}yith_wapo_blocks ORDER BY id;" 2>/dev/null
          echo '=== ASSOC FOR HIDALGO JAMON 5045 ==='; $WP db query "SELECT * FROM ${prefix}yith_wapo_blocks_assoc WHERE product_id=5045 OR rule_id=5045;" 2>/dev/null || true
          echo '=== ALL ASSOC (LIMIT 120) ==='; $WP db query "SELECT * FROM ${prefix}yith_wapo_blocks_assoc ORDER BY id LIMIT 120;" 2>/dev/null || true
          echo '=== ADDONS ==='; $WP db query "SELECT * FROM ${prefix}yith_wapo_addons ORDER BY id LIMIT 120;" 2>/dev/null
          echo '=== TARGET PRODUCT ==='; $WP db query "SELECT ID,post_title,post_status,post_author FROM ${prefix}posts WHERE ID=11235;" 2>/dev/null
          echo '=== HIDALGO PRODUCT ==='; $WP db query "SELECT ID,post_title,post_status,post_author FROM ${prefix}posts WHERE ID=5045;" 2>/dev/null
          yithdir="$wp_path/wp-content/plugins/yith-woocommerce-product-add-ons"
          echo '=== MODEL FILES ==='
          find "$yithdir" -type f -name '*.php' | grep -Ei 'class.*(block|addon)|db|database' | head -n 80 || true
          echo '=== INSERT/UPDATE API ==='
          grep -RIn --include='*.php' -E 'class YITH_WAPO_(Block|Addon)|function (save|insert|update|add)|yith_wapo_blocks_assoc' "$yithdir/includes" 2>/dev/null | head -n 180 || true
          REMOTE

name: Falang low-memory preflight 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/falang-low-memory-preflight-20260816.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Falang source storage
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/falang.zip https://downloads.wordpress.org/plugin/falang.1.4.4.zip
          unzip -q /tmp/falang.zip -d /tmp/falang-src
          R=/tmp/falang-src/falang
          {
            echo '=== LANGUAGE TAXONOMY / REGISTER ==='
            grep -RniE --include='*.php' "register_taxonomy|falang_language|language_taxonomy|taxonomy.*language" "$R" | head -n 240 || true
            echo '=== ADD LANGUAGE ==='
            f=$(grep -Rl "function add_language" "$R" | head -n1 || true); echo "FILE=$f"; [ -n "$f" ] && { n=$(grep -n "function add_language" "$f" | head -n1 | cut -d: -f1); s=$((n-25)); [ $s -lt 1 ] && s=1; e=$((n+130)); sed -n "${s},${e}p" "$f"; } || true
            echo '=== UPDATE DEFAULT ==='
            f=$(grep -Rl "function update_default_lang" "$R" | head -n1 || true); echo "FILE=$f"; [ -n "$f" ] && { n=$(grep -n "function update_default_lang" "$f" | head -n1 | cut -d: -f1); s=$((n-25)); [ $s -lt 1 ] && s=1; e=$((n+90)); sed -n "${s},${e}p" "$f"; } || true
            echo '=== LANGUAGE CLASS ==='
            f=$(find "$R" -type f -iname '*Language*.php' | head -n1 || true); echo "FILE=$f"; [ -n "$f" ] && sed -n '1,260p' "$f" || true
            echo '=== ACTIVATION LANG ==='
            grep -RniE --include='*.php' "English|en_US|add_language|default_lang" "$R/includes/class-falang-activator.php" "$R/src/Falang" | head -n 260 || true
          } | tee /tmp/source.txt
          cat /tmp/source.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Verify production rollback state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          echo '=== PLUGIN STATE ==='
          wp plugin list --fields=name,status,version --format=table | grep -Ei 'translatepress|falang' || true
          echo '=== SITE LOCALE + FALANG OPTIONS LOW MEMORY ==='
          wp option get WPLANG --skip-plugins --skip-themes 2>/dev/null || true
          wp option get falang --format=json --skip-plugins --skip-themes 2>/dev/null || true
          echo '=== FALANG TAXONOMY ROWS (DB DIRECT) ==='
          prefix=$(wp db prefix --skip-plugins --skip-themes)
          wp db query "SELECT tt.term_taxonomy_id,t.term_id,t.name,t.slug,tt.taxonomy,LEFT(tt.description,500) FROM ${prefix}terms t JOIN ${prefix}term_taxonomy tt ON tt.term_id=t.term_id WHERE tt.taxonomy LIKE '%falang%' OR t.slug IN ('en','es') ORDER BY tt.term_taxonomy_id;" --skip-column-names 2>/dev/null || true
          echo '=== BACKUPS ==='
          ls -lh "$(dirname "$PROD_PATH")/mdo-private-backups"/falang-migration-*.sql.gz 2>/dev/null | tail -n 4 || true
          echo '=== PUBLIC ==='
          printf 'ES='; curl -sS -o /tmp/es.html -w '%{http_code}\n' --max-time 30 https://www.elmercadodeorigen.com/
          printf 'EN='; curl -sS -o /tmp/en.html -w '%{http_code}\n' --max-time 30 https://www.elmercadodeorigen.com/en/
          grep -qi 'trp-language-switcher' /tmp/es.html && echo TRP_SWITCHER=yes || echo TRP_SWITCHER=no
          grep -qi 'What our customers say' /tmp/en.html && echo EN_TRANSLATION=yes || echo EN_TRANSLATION=no
          REMOTE

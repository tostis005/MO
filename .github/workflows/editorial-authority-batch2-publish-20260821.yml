name: Editorial authority batch 5 diagnostic via proven workflow 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch2-publish-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish collect and record
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          mkdir -p .deploy-status
          : >/tmp/ab5-out; : >/tmp/ab5-err; : >/tmp/ab5-db; : >/tmp/ab5-public
          echo 99 >/tmp/ab5-rc
          php -l .github/scripts/publish-editorial-authority-batch5-20260821.php >/tmp/ab5-lint 2>&1
          LINT=$?
          for f in .github/data/editorial-authority-batch5-20260821/*.php; do php -l "$f" >>/tmp/ab5-lint 2>&1 || LINT=$?; done
          echo "$LINT" >/tmp/ab5-lint-rc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          INFO_RC=$?; echo "$INFO_RC" >/tmp/ab5-info-rc
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          printf '%s' "$PROD" >/tmp/ab5-prod; printf '%s' "$PHP" >/tmp/ab5-php; printf '%s' "$WP" >/tmp/ab5-wp
          if [ "$INFO_RC" -eq 0 ] && [ "$LINT" -eq 0 ]; then
            REMOTE=/tmp/emdo-ab5-diag-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
            sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch5-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
            sshpass -e scp $SCP .github/data/editorial-authority-batch5-20260821/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH5_DIR='$DATA' '$PHP' -d memory_limit=768M -d display_errors=1 -d error_reporting=32767 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" >/tmp/ab5-out 2>/tmp/ab5-err
            echo $? >/tmp/ab5-rc
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT k.meta_value,p.ID,p.post_status,p.post_name,t.meta_value AS thumbnail_id FROM wp_posts p JOIN wp_postmeta b ON b.post_id=p.ID AND b.meta_key='_emdo_authority_batch' AND b.meta_value='5' JOIN wp_postmeta k ON k.post_id=p.ID AND k.meta_key='_emdo_authority_key' LEFT JOIN wp_postmeta t ON t.post_id=p.ID AND t.meta_key='_thumbnail_id' ORDER BY p.ID; SELECT 'BELL_ARTICLE',p.ID,t.meta_value FROM wp_posts p JOIN wp_postmeta k ON k.post_id=p.ID AND k.meta_key='_emdo_authority_key' AND k.meta_value='bellota-100-iberico-guide' LEFT JOIN wp_postmeta t ON t.post_id=p.ID AND t.meta_key='_thumbnail_id'; SELECT 'BELL_PRODUCT',p.ID,t.meta_value FROM wp_posts p LEFT JOIN wp_postmeta t ON t.post_id=p.ID AND t.meta_key='_thumbnail_id' WHERE p.post_type='product' AND p.post_name='jamon-de-bellota-100-iberico';\" --skip-column-names --path='$PROD' --allow-root" >/tmp/ab5-db 2>>/tmp/ab5-err
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" >/dev/null 2>&1
          fi
          while IFS='|' read -r key url; do
            f=/tmp/ab5-page.html
            c=$(curl -k -L -sS --retry 2 --connect-timeout 8 --max-time 45 -A 'Mozilla/5.0 EMDO batch5 diagnostic' -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$url?ab5diag=$GITHUB_RUN_ID" 2>/dev/null)
            m=$(grep -Fc "EMDO_AUTHORITY_BATCH5:$key" "$f" 2>/dev/null || true); raw=$(grep -Fc '[products ' "$f" 2>/dev/null || true); prod=$(grep -Ec 'class="[^"]*products|class="[^"]*product' "$f" 2>/dev/null || true); feat=$(grep -Fc 'emo-article-featured' "$f" 2>/dev/null || true)
            printf '%s|%s|http=%s|marker=%s|raw=%s|products=%s|featured=%s\n' "$key" "$url" "$c" "$m" "$raw" "$prod" "$feat" >>/tmp/ab5-public
          done <<'EOF'
          evoo-cooking-uses-guide|https://www.elmercadodeorigen.com/que-aove-usar-freir-cocinar-alinar-crudo/
          evoo-cooking-uses-guide|https://www.elmercadodeorigen.com/en/which-extra-virgin-olive-oil-to-use-for-frying-cooking-dressing-and-raw/
          beef-shank-osso-buco-guide|https://www.elmercadodeorigen.com/morcillo-jarrete-ossobuco-diferencias-coccion-lenta/
          beef-shank-osso-buco-guide|https://www.elmercadodeorigen.com/en/beef-shank-jarrete-osso-buco-differences-slow-cooking/
          meat-quantity-per-person-guide|https://www.elmercadodeorigen.com/cuanta-carne-calcular-por-persona-corte-receta/
          meat-quantity-per-person-guide|https://www.elmercadodeorigen.com/en/how-much-meat-to-plan-per-person-by-cut-and-recipe/
          tomato-selection-storage-guide|https://www.elmercadodeorigen.com/tomate-como-elegir-conservar-usar-cada-tipo/
          tomato-selection-storage-guide|https://www.elmercadodeorigen.com/en/tomatoes-how-to-choose-store-and-use-each-type/
          vegetable-preserves-buying-guide|https://www.elmercadodeorigen.com/como-elegir-buena-conserva-vegetal-etiqueta-ingredientes/
          vegetable-preserves-buying-guide|https://www.elmercadodeorigen.com/en/how-to-choose-good-vegetable-preserves-label-ingredients/
          EOF
          curl -k -L -sS -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/jamon-bellota-100-iberico-que-significa-realmente/?ab5diag=$GITHUB_RUN_ID" -o /tmp/ab5-bellota.html 2>/dev/null
          echo "bellota_product_image=$(grep -Fc 'Jamon_Bellota_100ib' /tmp/ab5-bellota.html 2>/dev/null || true)" >/tmp/ab5-bellcheck
          curl -k -L -sS -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/blog/?ab5diag=$GITHUB_RUN_ID" -o /tmp/ab5-blog-es.html 2>/dev/null
          curl -k -L -sS -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/en/journal/?ab5diag=$GITHUB_RUN_ID" -o /tmp/ab5-blog-en.html 2>/dev/null
          echo "es=$(grep -Fc 'Qué AOVE usar para freír, cocinar, aliñar o tomar en crudo' /tmp/ab5-blog-es.html 2>/dev/null || true)" >/tmp/ab5-blogs
          echo "en=$(grep -Fc 'Which extra virgin olive oil to use for frying' /tmp/ab5-blog-en.html 2>/dev/null || true)" >>/tmp/ab5-blogs
          python3 - <<'PY'
          import json,os
          def read(p,n=60000):
              try:return open(p,encoding='utf-8',errors='ignore').read()[-n:]
              except:return ''
          def num(p):
              try:return int(open(p).read().strip())
              except:return None
          raw=read('/tmp/ab5-out'); parsed=None; s=raw.find('{'); e=raw.rfind('}')
          if s>=0 and e>=s:
              try: parsed=json.loads(raw[s:e+1])
              except: pass
          d={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'lint_rc':num('/tmp/ab5-lint-rc'),'lint':read('/tmp/ab5-lint'),'info_rc':num('/tmp/ab5-info-rc'),'prod':read('/tmp/ab5-prod',2000),'php':read('/tmp/ab5-php',2000),'wp':read('/tmp/ab5-wp',2000),'publisher_rc':num('/tmp/ab5-rc'),'publisher_json':parsed,'publisher_stdout':raw,'publisher_stderr':read('/tmp/ab5-err'),'db_rows':read('/tmp/ab5-db'),'public_checks':read('/tmp/ab5-public'),'bellota_check':read('/tmp/ab5-bellcheck'),'blog_checks':read('/tmp/ab5-blogs')}
          json.dump(d,open('.deploy-status/editorial-authority-batch5-diagnostic-20260821.json','w',encoding='utf-8'),ensure_ascii=False,indent=2); open('.deploy-status/editorial-authority-batch5-diagnostic-20260821.json','a').write('\n')
          PY
      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch5-diagnostic-20260821.json
          git commit -m 'Record editorial authority batch 5 diagnostics [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Editorial authority batch 4 diagnostic 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch2-publish-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Publish and collect diagnostics
        shell: bash
        env: {SSHPASS: "${{ secrets.STAGING_PASSWORD }}"}
        run: |
          set +e
          mkdir -p .deploy-status
          : >/tmp/ab4-out; : >/tmp/ab4-err; : >/tmp/ab4-db; : >/tmp/ab4-public
          php -l .github/scripts/publish-editorial-authority-batch4-20260821.php >/tmp/ab4-lint 2>&1; LINT=$?
          for f in .github/data/editorial-authority-batch4-20260821/*.php; do php -l "$f" >>/tmp/ab4-lint 2>&1 || LINT=$?; done
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done; [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"')"; INFO_RC=$?
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          echo "$LINT" >/tmp/ab4-lint-rc; echo "$INFO_RC" >/tmp/ab4-info-rc; printf '%s' "$PROD" >/tmp/ab4-prod
          echo 99 >/tmp/ab4-pub-rc
          if [ "$LINT" -eq 0 ] && [ "$INFO_RC" -eq 0 ]; then
            REMOTE=/tmp/emdo-ab4-diag-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
            sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch4-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
            sshpass -e scp $SCP .github/data/editorial-authority-batch4-20260821/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH4_DIR='$DATA' '$PHP' -d memory_limit=768M -d display_errors=1 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" >/tmp/ab4-out 2>/tmp/ab4-err; echo $? >/tmp/ab4-pub-rc
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT pm2.meta_value,p.ID,p.post_status,p.post_name,thumb.meta_value FROM wp_posts p JOIN wp_postmeta batch ON batch.post_id=p.ID AND batch.meta_key='_emdo_authority_batch' AND batch.meta_value='4' JOIN wp_postmeta pm2 ON pm2.post_id=p.ID AND pm2.meta_key='_emdo_authority_key' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root" >/tmp/ab4-db 2>>/tmp/ab4-err
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" >/dev/null 2>&1
          fi
          while IFS='|' read -r key url; do f=/tmp/ab4-page.html; c=$(curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$url?ab4diag=$GITHUB_RUN_ID" 2>/dev/null); m=$(grep -Fc "EMDO_AUTHORITY_BATCH4:$key" "$f" 2>/dev/null || true); raw=$(grep -Fc '[products ' "$f" 2>/dev/null || true); prod=$(grep -Ec 'class="[^"]*products|class="[^"]*product' "$f" 2>/dev/null || true); feat=$(grep -Fc 'emo-article-featured' "$f" 2>/dev/null || true); echo "$key|$url|http=$c|marker=$m|raw=$raw|products=$prod|featured=$feat" >>/tmp/ab4-public; done <<'EOF'
          bellota-100-iberico-guide|https://www.elmercadodeorigen.com/jamon-bellota-100-iberico-que-significa-realmente/
          bellota-100-iberico-guide|https://www.elmercadodeorigen.com/en/100-percent-iberian-acorn-fed-ham-what-it-really-means/
          evoo-filtered-unfiltered-guide|https://www.elmercadodeorigen.com/aove-filtrado-o-sin-filtrar-diferencias/
          evoo-filtered-unfiltered-guide|https://www.elmercadodeorigen.com/en/filtered-vs-unfiltered-extra-virgin-olive-oil-differences/
          evoo-bitterness-pungency-guide|https://www.elmercadodeorigen.com/por-que-aove-amarga-pica-que-significa/
          evoo-bitterness-pungency-guide|https://www.elmercadodeorigen.com/en/why-extra-virgin-olive-oil-tastes-bitter-and-pungent/
          beef-thawing-storage-guide|https://www.elmercadodeorigen.com/como-descongelar-conservar-carne-ternera-correctamente/
          beef-thawing-storage-guide|https://www.elmercadodeorigen.com/en/how-to-thaw-and-store-beef-safely/
          pulses-differences-uses-guide|https://www.elmercadodeorigen.com/garbanzos-lentejas-alubias-diferencias-usos-cocina/
          pulses-differences-uses-guide|https://www.elmercadodeorigen.com/en/chickpeas-lentils-beans-differences-and-cooking-uses/
          EOF
          python3 - <<'PY'
          import json,os
          def r(p,n=40000):
            try:return open(p,encoding='utf-8',errors='ignore').read()[-n:]
            except:return ''
          def n(p):
            try:return int(open(p).read().strip())
            except:return None
          raw=r('/tmp/ab4-out'); parsed=None; s=raw.find('{'); e=raw.rfind('}')
          if s>=0 and e>=s:
            try: parsed=json.loads(raw[s:e+1])
            except: pass
          d={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'lint_rc':n('/tmp/ab4-lint-rc'),'lint':r('/tmp/ab4-lint'),'info_rc':n('/tmp/ab4-info-rc'),'prod':r('/tmp/ab4-prod',2000),'publisher_rc':n('/tmp/ab4-pub-rc'),'publisher_json':parsed,'stdout':raw,'stderr':r('/tmp/ab4-err'),'db_rows':r('/tmp/ab4-db'),'public_checks':r('/tmp/ab4-public')}
          json.dump(d,open('.deploy-status/editorial-authority-batch4-diagnostic-20260821.json','w',encoding='utf-8'),ensure_ascii=False,indent=2); open('.deploy-status/editorial-authority-batch4-diagnostic-20260821.json','a').write('\n')
          PY
      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch4-diagnostic-20260821.json
          git commit -m 'Record editorial authority batch 4 diagnostics [skip ci]' || exit 0
          git pull --rebase origin main && git push origin HEAD:main

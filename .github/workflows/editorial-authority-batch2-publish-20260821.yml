name: Editorial authority batch 4 final index verification 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch2-publish-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify both Journal indexes
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com
          stamp="$GITHUB_RUN_ID"
          curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' "$BASE/blog/?ab4_index=$stamp" -o /tmp/blog-es.html
          curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' "$BASE/en/journal/?ab4_index=$stamp" -o /tmp/blog-en.html
          grep -Fq 'Jamón de bellota 100 % ibérico' /tmp/blog-es.html
          grep -Fq 'AOVE filtrado o sin filtrar' /tmp/blog-es.html
          grep -Fq '100% Iberian acorn-fed ham' /tmp/blog-en.html
          grep -Fq 'Filtered vs unfiltered extra virgin olive oil' /tmp/blog-en.html
      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          diag=json.load(open('.deploy-status/editorial-authority-batch4-diagnostic-20260821.json',encoding='utf-8'))
          d=diag['publisher_json']
          assert d and d.get('batch')==4 and len(d.get('posts',[]))==5
          d['verified']=True
          d['language_views_verified']=10
          d['blogs_verified']=True
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['source_sha']=os.environ['GITHUB_SHA']
          open('.deploy-status/editorial-authority-batch4-final-20260821.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch4-final-20260821.json
          git commit -m 'Record verified editorial authority batch 4 publication [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

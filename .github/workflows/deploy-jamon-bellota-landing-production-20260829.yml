name: Deploy vegetables and legumes SEO landings
# Trigger after enabling the push hook on main.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-jamon-bellota-landing-production-20260829.yml'
      - '.github/scripts/deploy-verduras-legumbres-landings-production-20260830.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ES EN vegetable and legume landings to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
              esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-vl-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            .github/scripts/deploy-verduras-legumbres-landings-production-20260830.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -l '$REMOTE/deploy-verduras-legumbres-landings-production-20260830.php' >/dev/null; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/deploy-verduras-legumbres-landings-production-20260830.php' --path='$PROD' --allow-root" > /tmp/vl.json
          cat /tmp/vl.json
          jq -e '.verified==true and .count>=2 and .vegetables>=1 and .legumes>=1 and (.pages|length)==.count' /tmp/vl.json >/dev/null

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          jq -r '.pages[] | .es_url, .en_url' /tmp/vl.json > /tmp/urls.txt
          while IFS= read -r url; do
            code="$(curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO SEO landing verify' -o /tmp/page.html -w '%{http_code}' "${url}?verify=${GITHUB_RUN_ID}")"
            [ "$code" = "200" ] || { echo "HTTP $code for $url" >&2; exit 20; }
            if grep -Eqi '<meta[^>]+robots[^>]+noindex' /tmp/page.html; then echo "Unexpected noindex: $url" >&2; exit 21; fi
            grep -Fqi 'hreflang="es-ES"' /tmp/page.html || { echo "Missing es hreflang: $url" >&2; exit 22; }
            grep -Fqi 'hreflang="en"' /tmp/page.html || { echo "Missing en hreflang: $url" >&2; exit 23; }
          done < /tmp/urls.txt

          curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO sitemap verify' -o /tmp/pages.xml "https://www.elmercadodeorigen.com/mdo-sitemap-pages.xml?verify=${GITHUB_RUN_ID}"
          while IFS= read -r url; do
            grep -Fq "$url" /tmp/pages.xml || { echo "Missing from sitemap: $url" >&2; exit 24; }
          done < /tmp/urls.txt

          VEG_CAT="$(jq -r '.category_terms.vegetables.url' /tmp/vl.json)"
          LEG_CAT="$(jq -r '.category_terms.legumes.url' /tmp/vl.json)"
          curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO category verify' -o /tmp/veg.html "${VEG_CAT}?verify=${GITHUB_RUN_ID}"
          curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO category verify' -o /tmp/leg.html "${LEG_CAT}?verify=${GITHUB_RUN_ID}"
          jq -r '.pages[] | select(.group=="verduras") | .es_url' /tmp/vl.json | while IFS= read -r url; do
            slug="$(basename "${url%/}")"
            grep -Fq "/$slug/" /tmp/veg.html || { echo "Vegetable category link missing: $slug" >&2; exit 25; }
          done
          jq -r '.pages[] | select(.group=="legumbres") | .es_url' /tmp/vl.json | while IFS= read -r url; do
            slug="$(basename "${url%/}")"
            grep -Fq "/$slug/" /tmp/leg.html || { echo "Legume category link missing: $slug" >&2; exit 26; }
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
          echo all_curated_vegetable_legume_landings_verified
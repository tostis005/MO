name: Validate child theme

on:
  pull_request:
    paths:
      - 'elmercadodeorigen-child/**'
      - 'mu-plugins/mdo-production-english-seo-routes.php'
      - 'tests/seo-*.php'
      - 'tests/seo-*.py'
      - '.github/workflows/validate.yml'
      - '.github/workflows/seo-staging-html-audit.yml'
      - '.github/workflows/production-seo-gsc-batch1-20261013.yml'
      - '.github/workflows/diagnose-production-seo-origin-20261013.yml'
      - '.github/workflows/production-install-gsc-batch1-module-20261013.yml'
      - '.github/workflows/production-install-gsc-batch1-two-modules-20261013.yml'
      - '.github/workflows/seo-batch1-public-html-audit-20261013.yml'
      - '.github/workflows/release-gsc-native-meta-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate narrowly scoped missing-module production release
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-install-gsc-batch1-module-20261013.yml
          test -f "$file"
          grep -q 'Module already exists; refusing overwrite' "$file"
          grep -q 'SEO_BATCH1_SINGLE_MODULE_RELEASE_OK' "$file"
          grep -q "rollback()" "$file"
          grep -q 'seo-gsc-batch-20-20261012.php' "$file"
          grep -q 'sha256sum -c' "$file"
          grep -q 'verify ' "$file"
          ! grep -q 'rsync ' "$file"

      - name: Confirm production diagnostic is read-only
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/diagnose-production-seo-origin-20261013.yml
          test -f "$file"
          grep -q 'Read-only' "$file" || grep -q 'read-only' "$file"
          grep -q 'batch1_module_present' "$file"
          grep -q 'wp-content/cache' "$file"
          ! grep -Eq 'rsync |theme activate|wp cache flush|rm -rf|wp plugin (activate|deactivate)' "$file"

      - name: Check guarded SEO release workflow
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-seo-gsc-batch1-20261013.yml
          test -f "$file"
          grep -q 'Production SEO GSC batch 1 controlled release' "$file"
          grep -q 'trap rollback EXIT HUP INT TERM' "$file"
          grep -q 'theme.tar.gz' "$file"
          grep -q 'check_seo_post' "$file"
          grep -q 'PRODUCTION_SEO_BATCH1_OK' "$file"
          ! grep -q 'production-contact-footer-hotfix' "$file"

      - name: Validate production two-module SEO release safety
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-install-gsc-batch1-two-modules-20261013.yml
          test -f "$file"
          grep -q 'SEO_WPCLI_BOTH_MODULES_LOADED' "$file"
          grep -q 'base_installed=1' "$file"
          grep -q 'SEO_BATCH1_DUAL_MODULE_TITLE_H1_RELEASE_OK_METADATA_PENDING' "$file"
          grep -q 'sha256sum -c' "$file"
          grep -q 'trap rollback EXIT HUP INT TERM' "$file"
          grep -q "Base module already exists; refusing overwrite" "$file"
          grep -q 'SEO_DESCRIPTION_PENDING' "$file"
          grep -q 'SEO_MODULE_LIVE_OK' "$file"
          grep -q '/en/why-cut-potatoes-turn-black' "$file"
          grep -q '/en/white-foam-when-cooking-meat' "$file"
          grep -q '/en/yellow-broccoli' "$file"
          grep -q '/en/red-liquid-in-meat' "$file"
          grep -q '/cuanta-carne-calcular-por-persona' "$file"
          ! grep -Eq 'rsync |wp cache flush|theme activate|rm -rf|wp plugin (activate|deactivate)' "$file"

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find elmercadodeorigen-child -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate second GSC English cohort
        shell: bash
        run: php tests/seo-gsc-english-batch2-20261012.php

      - name: Validate third GSC English cohort
        shell: bash
        run: php tests/seo-gsc-english-batch3-20261012.php

      # Inspect PHP-FPM opcache directives and nginx cache from read-only production audit PR #253.
      # Advisory only: GitHub-hosted runner provides an independent external
      # vantage point to check if first-cohort changes are live on WordPress.
      # Never gate unrelated tests on intermittent public HTTP failures.
      - name: Inspect public cache headers and HTML variant
        shell: bash
        timeout-minutes: 2
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://www.elmercadodeorigen.com/en/why-cut-potatoes-turn-black-oxidation-how-to-prevent-it/"
          for mode in standard uncached; do
            url="$base"
            [ "$mode" != uncached ] || url="${base}?seo_header_probe=${GITHUB_RUN_ID}"
            echo "=== SEO_HTTP_DIAG $mode ==="
            code="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D /tmp/seo-probe-headers -o /tmp/seo-probe-html -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code"
            grep -Ei '^(server|cache-control|age|x-cache|x-litespeed-cache|x-el-mercado-.*|cf-cache-status|last-modified|vary):' /tmp/seo-probe-headers || true
            grep -oEi '<title[^>]*>[^<]*</title>' /tmp/seo-probe-html | head -n 1 || true
          done

      - name: Inspect guarded production SEO deployment state
        shell: bash
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Recent production SEO deployment workflow runs (id, status, conclusion, SHA):"
          gh api "repos/${{ github.repository }}/actions/workflows/production-seo-gsc-batch1-20261013.yml/runs?per_page=5" \
            --jq '.workflow_runs[:5][] | [.id, .status, (.conclusion // "pending"), .head_sha] | @tsv'
          echo "Recent targeted GSC module repair runs:"
          gh api "repos/${{ github.repository }}/actions/workflows/production-install-gsc-batch1-module-20261013.yml/runs?per_page=3" \
            --jq '.workflow_runs[:3][] | [.id, .status, (.conclusion // "pending"), .head_sha] | @tsv'
          echo "Recent read-only production origin diagnostics:"
          gh api "repos/${{ github.repository }}/actions/workflows/diagnose-production-seo-origin-20261013.yml/runs?per_page=3" \
            --jq '.workflow_runs[:3][] | [.id, .status, (.conclusion // "pending"), .head_sha] | @tsv'

      - name: Diagnose first SEO batch HTML on production
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python3 tests/seo-html-audit.py \
            --base https://www.elmercadodeorigen.com \
            --timeout 8 --cache-bust

      - name: Validate all 60 GSC URL integration
        shell: bash
        run: php tests/seo-gsc-all-60-integration-20261012.php

      - name: Validate GSC SEO batch invariants
        shell: bash
        run: php tests/seo-gsc-batch-20-20261012.php

      - name: Verify approved English AIOSEO descriptions override native excerpt
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-production-english-seo-routes.php
          php tests/seo-english-approved-descriptions-20261014.php
          php -l tests/seo-native-mu-html-verify-20261014.php
          test -f .github/workflows/release-gsc-native-meta-20261014.yml
          grep -q 'SEO_MU_RELEASE_ROLLBACK=restored_checksum_ok' .github/workflows/release-gsc-native-meta-20261014.yml
          grep -q 'SEO_MU_RELEASE_VERIFIED=20_of_20_title_h1_description' .github/workflows/release-gsc-native-meta-20261014.yml

      - name: Validate fallback category translation without Falang overrides
        shell: bash
        run: php tests/seo-blog-category-english-20261012.php

      - name: Validate EN blog products and Falang labels
        shell: bash
        run: php tests/seo-blog-products-language-20261012.php

      - name: Validate expired promotional card handling
        shell: bash
        run: php tests/seo-expired-special-20261012.php

      - name: Validate staging HTML auditor fixtures
        shell: bash
        run: python3 tests/seo-html-audit.py --self-test

      - name: Validate reusable GSC batch 1 HTML audit
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/seo-batch1-public-audit-20261013.py
          python3 -m py_compile tests/seo-batch1-public-audit-20261013.py
          test -f .github/workflows/seo-batch1-public-html-audit-20261013.yml
          grep -q 'GSC_BATCH1_PUBLIC_SUMMARY' tests/seo-batch1-public-audit-20261013.py
          ! grep -Eq 'wp cache flush|rsync |theme activate|rm -rf' .github/workflows/seo-batch1-public-html-audit-20261013.yml

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || git diff --check

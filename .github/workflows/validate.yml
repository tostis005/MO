name: Validate child theme

on:
  pull_request:
    paths:
      - 'elmercadodeorigen-child/**'
      - 'tests/seo-*.php'
      - 'tests/seo-*.py'
      - '.github/workflows/validate.yml'
      - '.github/workflows/seo-staging-html-audit.yml'
      - '.github/workflows/production-seo-gsc-batch1-20261013.yml'
      - '.github/workflows/diagnose-production-seo-origin-20261013.yml'
      - '.github/workflows/production-install-gsc-batch1-module-20261013.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate narrowly scoped missing-module production release
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-install-gsc-batch1-module-20261013.yml
          test -f "$file"
          grep -q 'Module already exists; refusing overwrite' "$file"
          grep -q 'SEO_BATCH1_SINGLE_MODULE_RELEASE_OK' "$file"
          grep -q "rollback()" "$file"
          grep -q 'seo-gsc-batch-20-20261012.php' "$file"
          grep -q 'sha256sum -c' "$file"
          grep -q 'verify ' "$file"
          ! grep -q 'rsync ' "$file"

      - name: Confirm production diagnostic is read-only
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/diagnose-production-seo-origin-20261013.yml
          test -f "$file"
          grep -q 'Read-only' "$file" || grep -q 'read-only' "$file"
          grep -q 'batch1_module_present' "$file"
          grep -q 'wp-content/cache' "$file"
          ! grep -Eq 'rsync |theme activate|wp cache flush|rm -rf|wp plugin (activate|deactivate)' "$file"

      - name: Check guarded SEO release workflow
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-seo-gsc-batch1-20261013.yml
          test -f "$file"
          grep -q 'Production SEO GSC batch 1 controlled release' "$file"
          grep -q 'trap rollback EXIT HUP INT TERM' "$file"
          grep -q 'theme.tar.gz' "$file"
          grep -q 'check_seo_post' "$file"
          grep -q 'PRODUCTION_SEO_BATCH1_OK' "$file"
          ! grep -q 'production-contact-footer-hotfix' "$file"

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find elmercadodeorigen-child -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate GSC SEO batch invariants
        shell: bash
        run: php tests/seo-gsc-batch-20-20261012.php

      - name: Validate fallback category translation without Falang overrides
        shell: bash
        run: php tests/seo-blog-category-english-20261012.php

      - name: Validate EN blog products and Falang labels
        shell: bash
        run: php tests/seo-blog-products-language-20261012.php

      - name: Validate expired promotional card handling
        shell: bash
        run: php tests/seo-expired-special-20261012.php

      - name: Validate staging HTML auditor fixtures
        shell: bash
        run: python3 tests/seo-html-audit.py --self-test

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || git diff --check

  seo-origin-readonly:
    # Temporary, branch-specific probe. Never run with secrets from a fork.
    if: github.event_name == 'pull_request' && github.head_ref == 'seo/ci-backed-origin-readonly-20261013' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Check connection information
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?SSH host missing}"
          : "${STAGING_USER:?SSH user missing}"
          : "${STAGING_PASSWORD:?SSH password missing}"
          : "${STAGING_REMOTE_PATH:?SSH remote path missing}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "$STAGING_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]]

      - name: Collect read-only SEO cache signals from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          port="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$port" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$port" "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$GITHUB_RUN_ID'" <<'REMOTE'
          set -eu
          raw="${1%/}"; nonce="$2"
          case "$nonce" in *[!0-9]*|'') exit 1 ;; esac
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            config="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n 1 || true)"
            [ -n "$config" ] || { echo 'root=unresolved'; exit 1; }
            dev="$(dirname "$config")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          [ -f "$prod/wp-config.php" ] || { echo 'production=not_found'; exit 1; }
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ] || { echo 'wpcli=unavailable'; exit 1; }
          site="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
          case "$site" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) ;;
            *) echo 'siteurl=unexpected'; exit 1 ;;
          esac
          echo 'siteurl=expected_production'
          theme="$prod/wp-content/themes/elmercadodeorigen-child"
          if [ -f "$theme/inc/seo-gsc-batch-20-20261012.php" ]; then echo 'seo_batch1_module=present'; else echo 'seo_batch1_module=missing'; fi
          if [ -f "$prod/wp-content/advanced-cache.php" ]; then echo 'advanced_cache=present'; else echo 'advanced_cache=missing'; fi
          dropin="$prod/wp-content/advanced-cache.php"
          for indicator in request_uri query_string early_exit english_route custom_code; do
            found=no
            if [ -f "$dropin" ]; then
              case "$indicator" in
                request_uri) grep -Eqi 'REQUEST_URI|SCRIPT_NAME|REQUEST_METHOD' "$dropin" && found=yes || true ;;
                query_string) grep -Eqi 'QUERY_STRING|parse_str|_GET' "$dropin" && found=yes || true ;;
                early_exit) grep -Eqi '(exit|die)[[:space:]]*[;(]' "$dropin" && found=yes || true ;;
                english_route) grep -Eqi '/en/|english|is_english' "$dropin" && found=yes || true ;;
                custom_code) grep -Eqi 'elmercado|emo[-_]|blog-static' "$dropin" && found=yes || true ;;
              esac
            fi
            echo "dropin_${indicator}=$found"
          done
          if [ -d "$prod/wp-content/uploads/elmercado-blog-static-v2" ]; then echo 'blog_static_dir=present'; else echo 'blog_static_dir=missing'; fi
          echo '=== NONMUTATING CACHE PATH CHECKS ==='
          for marker in blog_static_v2 home_static php_read_file uncached_condition; do
            found=no
            if [ -f "$dropin" ]; then
              case "$marker" in
                blog_static_v2) grep -Fqi 'elmercado-blog-static-v2' "$dropin" && found=yes || true ;;
                home_static) grep -Fqi 'elmercado-home-static' "$dropin" && found=yes || true ;;
                php_read_file) grep -Eqi 'readfile[[:space:]]*\(|file_get_contents[[:space:]]*\(' "$dropin" && found=yes || true ;;
                uncached_condition) grep -Eqi 'HTTP_CACHE_CONTROL|HTTP_PRAGMA|no-cache|no-store|_COOKIE' "$dropin" && found=yes || true ;;
              esac
            fi
            echo "dropin_rule_${marker}=$found"
          done
          # Only bounded samples of generated HTML, no paths or contents printed.
          cache_dir="$prod/wp-content/uploads/elmercado-blog-static-v2"
          if [ -d "$cache_dir" ]; then
            count="$(find "$cache_dir" -maxdepth 5 -type f -name '*.html' -print | head -n 2001 | wc -l | tr -d ' ')"
            [ "$count" -lt 2001 ] || count=2000_plus
            echo "blog_static_html_files=$count"
            old_cached=no
            files="$(find "$cache_dir" -maxdepth 5 -type f -name '*.html' -size -3000k -print | head -n 400)"
            if [ -n "$files" ]; then
              while IFS= read -r file; do
                if LC_ALL=C grep -Fq '<title>Why Cut Potatoes Turn Black and How to Stop It' "$file" 2>/dev/null; then
                  old_cached=yes; break
                fi
              done <<EOF_CACHE_LIST
          $files
          EOF_CACHE_LIST
            fi
            echo "blog_static_old_en_title_in_sample=$old_cached"
          fi
          probe_ip="$(hostname -I 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) {print $i;exit}}')"
          [ -n "$probe_ip" ] || { echo 'http_origin_probe=no_ipv4'; exit 0; }
          url='https://www.elmercadodeorigen.com/en/why-cut-potatoes-turn-black-oxidation-how-to-prevent-it/'
          for variant in clean nonce; do
            target="$url"
            [ "$variant" != nonce ] || target="${url}?seo_ci_probe=${nonce}"
            hdr="$(mktemp)"; body="$(mktemp)"
            if [ "$variant" = nonce ]; then
              code="$(curl -ksS --connect-timeout 5 --max-time 22 --max-redirs 0 -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' --resolve "www.elmercadodeorigen.com:443:$probe_ip" -D "$hdr" -o "$body" -w '%{http_code}' "$target" || true)"
            else
              code="$(curl -ksS --connect-timeout 5 --max-time 22 --max-redirs 0 --resolve "www.elmercadodeorigen.com:443:$probe_ip" -D "$hdr" -o "$body" -w '%{http_code}' "$target" || true)"
            fi
            [ -n "$code" ] || code=000
            title=new_or_unknown
            if grep -Fqi '<title>Why Cut Potatoes Turn Black and How to Stop It' "$body"; then title=old; fi
            if grep -Fqi '<title>Why Cut Potatoes Turn Black: Causes' "$body"; then title=new; fi
            h1="$(grep -oEi '<h1([[:space:]>])' "$body" | wc -l | tr -d ' ' || true)"
            [ -n "$h1" ] || h1=0
            header=none
            if grep -Eqi '^(x-cache|cf-cache-status|x-litespeed-cache|x-rocket-cache|x-proxy-cache|x-el-mercado-cache):' "$hdr"; then
              if grep -Eiq '^(x-cache|cf-cache-status|x-litespeed-cache|x-rocket-cache|x-proxy-cache|x-el-mercado-cache):[[:space:]]*(hit|cached|stale)([[:space:];]|$)' "$hdr"; then header=hit
              elif grep -Eiq '^(x-cache|cf-cache-status|x-litespeed-cache|x-rocket-cache|x-proxy-cache|x-el-mercado-cache):[[:space:]]*(miss|bypass|dynamic|expired)([[:space:];]|$)' "$hdr"; then header=miss
              else header=other; fi
            fi
            echo "http_${variant}=status:${code} title:${title} h1:${h1} cache_header:${header}"
            rm -f "$hdr" "$body"
          done
          REMOTE

  seo-module-transient-check:
    # Diagnostic: add ONLY the missing module momentarily and ALWAYS remove it.
    if: github.event_name == 'pull_request' && github.head_ref == 'seo/ci-backed-origin-readonly-20261013' && github.event.pull_request.head.repo.full_name == github.repository
    needs: seo-origin-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Checkout SEO module and lint
        uses: actions/checkout@v4
      - name: Confirm only expected SEO module is staged
        shell: bash
        run: |
          set -euo pipefail
          module=elmercadodeorigen-child/inc/seo-gsc-batch-20-20261012.php
          test -f "$module"
          php -l "$module"
          php tests/seo-gsc-batch-20-20261012.php
          : "${STAGING_HOST:?SSH host missing}"
          : "${STAGING_USER:?SSH user missing}"
          : "${STAGING_PASSWORD:?SSH password missing}"
          : "${STAGING_REMOTE_PATH:?SSH path missing}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "$STAGING_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]]
      - name: Transient read-only HTTP checks with guaranteed module cleanup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          port="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$port" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          remote_file="/tmp/elmercado-gsc-transient-${GITHUB_RUN_ID}.php"
          local_file=elmercadodeorigen-child/inc/seo-gsc-batch-20-20261012.php
          checksum="$(sha256sum "$local_file" | awk '{print $1}')"
          sshpass -e scp -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$port" "$local_file" "$STAGING_USER@$STAGING_HOST:$remote_file"
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$port" "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$remote_file' '$checksum' '$GITHUB_RUN_ID'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; checksum="$3"; nonce="$4"
          installed=0
          target=''
          cleanup() {
            code=$?
            if [ "$installed" -eq 1 ] && [ -n "$target" ]; then
              rm -f "$target"
              if [ -e "$target" ]; then
                echo 'cleanup=failed' >&2
                code=1
              else
                echo 'cleanup=module_removed'
              fi
            fi
            rm -f "$incoming"
            exit "$code"
          }
          trap cleanup EXIT
          case "$nonce" in *[!0-9]*|'') exit 1 ;; esac
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            config="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n 1 || true)"
            [ -n "$config" ] || { echo 'root=unresolved'; exit 1; }
            dev="$(dirname "$config")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          [ -f "$prod/wp-config.php" ] || { echo 'prod=missing'; exit 1; }
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ] || exit 1
          site="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
          case "$site" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) ;;
            *) echo 'siteurl=unexpected'; exit 1 ;;
          esac
          active="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
          [ "$active" = 'elmercadodeorigen-child' ] || { echo 'theme=unexpected'; exit 1; }
          theme="$prod/wp-content/themes/elmercadodeorigen-child"
          target="$theme/inc/seo-gsc-batch-20-20261012.php"
          [ -f "$theme/functions.php" ] && grep -q 'seo-gsc-batch-20-20261012.php' "$theme/functions.php" || exit 1
          [ ! -e "$target" ] || { echo 'module_already_present=refusing_overwrite'; exit 1; }
          [ -f "$incoming" ] || exit 1
          echo "$checksum  $incoming" | sha256sum -c - >/dev/null
          "$php_bin" -l "$incoming" >/dev/null
          install -m 0644 "$incoming" "$target"
          installed=1
          echo 'module_transiently_installed=yes'
          loaded="$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo function_exists("elmercado_gsc_batch_20_20261012") ? "yes" : "no";' --path="$prod" --skip-plugins --allow-root 2>/dev/null || true)"
          echo "wpcli_module_loaded=$loaded"
          probe_ip="$(hostname -I 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) {print $i;exit}}')"
          [ -n "$probe_ip" ] || { echo 'origin_ipv4=missing'; exit 1; }
          url='https://www.elmercadodeorigen.com/en/why-cut-potatoes-turn-black-oxidation-how-to-prevent-it/'
          for variant in baseline nonce cookie; do
            temp="$(mktemp)"; target_url="$url"
            [ "$variant" = baseline ] || target_url="${url}?seo_transient_probe=${nonce}"
            if [ "$variant" = cookie ]; then
              status="$(curl -ksS --connect-timeout 5 --max-time 22 --max-redirs 0 --resolve "www.elmercadodeorigen.com:443:$probe_ip" -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -H "Cookie: emo_seo_probe=${nonce}" -o "$temp" -w '%{http_code}' "$target_url" || true)"
            elif [ "$variant" = nonce ]; then
              status="$(curl -ksS --connect-timeout 5 --max-time 22 --max-redirs 0 --resolve "www.elmercadodeorigen.com:443:$probe_ip" -H 'Cache-Control: no-cache, no-store' -o "$temp" -w '%{http_code}' "$target_url" || true)"
            else
              status="$(curl -ksS --connect-timeout 5 --max-time 22 --max-redirs 0 --resolve "www.elmercadodeorigen.com:443:$probe_ip" -o "$temp" -w '%{http_code}' "$target_url" || true)"
            fi
            [ -n "$status" ] || status=000
            title=other
            grep -Fqi '<title>Why Cut Potatoes Turn Black and How to Stop It' "$temp" && title=old || true
            grep -Fqi '<title>Why Cut Potatoes Turn Black: Causes' "$temp" && title=new || true
            runtime=no
            grep -Fq 'id="emo-gsc-batch-20-style"' "$temp" && runtime=yes || true
            h1="$(grep -oEi '<h1([[:space:]>])' "$temp" | wc -l | tr -d ' ' || true)"
            [ -n "$h1" ] || h1=0
            echo "transient_http_${variant}=status:${status} title:${title} h1:${h1} module_style_marker:${runtime}"
            rm -f "$temp"
          done
          # EXIT trap ALWAYS removes the only installed PHP module.
          REMOTE

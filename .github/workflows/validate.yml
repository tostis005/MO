name: Validate child theme

on:
  pull_request:
    paths:
      - 'elmercadodeorigen-child/**'
      - 'tests/seo-*.php'
      - 'tests/seo-*.py'
      - '.github/workflows/validate.yml'
      - '.github/workflows/seo-staging-html-audit.yml'
      - '.github/workflows/production-seo-gsc-batch1-20261013.yml'
      - '.github/workflows/diagnose-production-seo-origin-20261013.yml'
      - '.github/workflows/production-install-gsc-batch1-module-20261013.yml'
      - '.github/workflows/production-install-gsc-batch1-two-modules-20261013.yml'
      - '.github/workflows/seo-batch1-public-html-audit-20261013.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate narrowly scoped missing-module production release
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-install-gsc-batch1-module-20261013.yml
          test -f "$file"
          grep -q 'Module already exists; refusing overwrite' "$file"
          grep -q 'SEO_BATCH1_SINGLE_MODULE_RELEASE_OK' "$file"
          grep -q "rollback()" "$file"
          grep -q 'seo-gsc-batch-20-20261012.php' "$file"
          grep -q 'sha256sum -c' "$file"
          grep -q 'verify ' "$file"
          ! grep -q 'rsync ' "$file"

      - name: Confirm production diagnostic is read-only
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/diagnose-production-seo-origin-20261013.yml
          test -f "$file"
          grep -q 'Read-only' "$file" || grep -q 'read-only' "$file"
          grep -q 'batch1_module_present' "$file"
          grep -q 'wp-content/cache' "$file"
          ! grep -Eq 'rsync |theme activate|wp cache flush|rm -rf|wp plugin (activate|deactivate)' "$file"

      - name: Check guarded SEO release workflow
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-seo-gsc-batch1-20261013.yml
          test -f "$file"
          grep -q 'Production SEO GSC batch 1 controlled release' "$file"
          grep -q 'trap rollback EXIT HUP INT TERM' "$file"
          grep -q 'theme.tar.gz' "$file"
          grep -q 'check_seo_post' "$file"
          grep -q 'PRODUCTION_SEO_BATCH1_OK' "$file"
          ! grep -q 'production-contact-footer-hotfix' "$file"

      - name: Validate production two-module SEO release safety
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/production-install-gsc-batch1-two-modules-20261013.yml
          test -f "$file"
          grep -q 'SEO_WPCLI_BOTH_MODULES_LOADED' "$file"
          grep -q 'base_installed=1' "$file"
          grep -q 'SEO_BATCH1_DUAL_MODULE_TITLE_H1_RELEASE_OK_METADATA_PENDING' "$file"
          grep -q 'sha256sum -c' "$file"
          grep -q 'trap rollback EXIT HUP INT TERM' "$file"
          grep -q "Base module already exists; refusing overwrite" "$file"
          grep -q 'SEO_DESCRIPTION_PENDING' "$file"
          grep -q 'SEO_MODULE_LIVE_OK' "$file"
          grep -q '/en/why-cut-potatoes-turn-black' "$file"
          grep -q '/en/white-foam-when-cooking-meat' "$file"
          grep -q '/en/yellow-broccoli' "$file"
          grep -q '/en/red-liquid-in-meat' "$file"
          grep -q '/cuanta-carne-calcular-por-persona' "$file"
          ! grep -Eq 'rsync |wp cache flush|theme activate|rm -rf|wp plugin (activate|deactivate)' "$file"

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find elmercadodeorigen-child -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate GSC SEO batch invariants
        shell: bash
        run: php tests/seo-gsc-batch-20-20261012.php

      - name: Validate fallback category translation without Falang overrides
        shell: bash
        run: php tests/seo-blog-category-english-20261012.php

      - name: Validate EN blog products and Falang labels
        shell: bash
        run: php tests/seo-blog-products-language-20261012.php

      - name: Validate expired promotional card handling
        shell: bash
        run: php tests/seo-expired-special-20261012.php

      - name: Validate staging HTML auditor fixtures
        shell: bash
        run: python3 tests/seo-html-audit.py --self-test

      - name: Validate reusable GSC batch 1 HTML audit
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/seo-batch1-public-audit-20261013.py
          python3 -m py_compile tests/seo-batch1-public-audit-20261013.py
          test -f .github/workflows/seo-batch1-public-html-audit-20261013.yml
          grep -q 'GSC_BATCH1_PUBLIC_SUMMARY' tests/seo-batch1-public-audit-20261013.py
          ! grep -Eq 'wp cache flush|rsync |theme activate|rm -rf' .github/workflows/seo-batch1-public-html-audit-20261013.yml

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || git diff --check

  seo-falang-aioseo-readonly:
    # Same-repository PR only; no database writes or production theme changes.
    if: github.event_name == 'pull_request' && github.head_ref == 'seo/aioseo-falang-metadata-readonly-20261013' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AIOSEO/Falang read-only metadata
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l tests/seo-aioseo-falang-metadata-readonly-20261013.php
          : "${STAGING_HOST:?Missing SSH host}"
          : "${STAGING_USER:?Missing SSH user}"
          : "${STAGING_PASSWORD:?Missing SSH password}"
          : "${STAGING_REMOTE_PATH:?Missing SSH path}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "$STAGING_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          port="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$port" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          probe="/tmp/seo-aioseo-falang-readonly-$GITHUB_RUN_ID.php"
          file=tests/seo-aioseo-falang-metadata-readonly-20261013.php
          checksum="$(sha256sum "$file" | awk '{print $1}')"
          main_module_sha="$(sha256sum elmercadodeorigen-child/inc/seo-gsc-batch-20-20261012.php | awk '{print $1}')"
          sshpass -e scp -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$port" "$file" "$STAGING_USER@$STAGING_HOST:$probe"
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$port" "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$probe' '$checksum' '$main_module_sha'" <<'REMOTE'
          set -eu
          raw="${1%/}"; script="$2"; checksum="$3"; expected_module_sha="$4"
          trap 'rm -f "$script"' EXIT
          echo "$checksum  $script" | sha256sum -c - >/dev/null
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            config="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n 1 || true)"
            [ -n "$config" ] || exit 1
            dev="$(dirname "$config")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          [ -f "$prod/wp-config.php" ] || exit 1
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ] || exit 1
          site="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
          case "$site" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) ;;
            *) echo 'SEO_DIAG_SITEURL=unexpected'; exit 1 ;;
          esac
          echo 'SEO_DIAG_SITEURL=verified'
          live_module="$prod/wp-content/themes/elmercadodeorigen-child/inc/seo-gsc-batch-20-20261012.php"
          [ -f "$live_module" ] || { echo 'SEO_DIAG_LIVE_MODULE=missing'; exit 1; }
          if echo "$expected_module_sha  $live_module" | sha256sum -c - >/dev/null 2>&1; then
            echo 'SEO_DIAG_LIVE_MODULE_MATCH_MAIN=yes'
          else
            echo 'SEO_DIAG_LIVE_MODULE_MATCH_MAIN=no'
          fi
          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file "$script" --path="$prod" --allow-root
          REMOTE

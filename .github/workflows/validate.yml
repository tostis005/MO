name: Validate child theme

on:
  pull_request:
    paths:
      - 'elmercadodeorigen-child/**'
      - 'tests/seo-*.php'
      - 'tests/seo-*.py'
      - '.github/workflows/validate.yml'
      - '.github/workflows/seo-staging-html-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find elmercadodeorigen-child -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate second GSC English cohort
        shell: bash
        run: php tests/seo-gsc-english-batch2-20261012.php

      - name: Validate third GSC English cohort
        shell: bash
        run: php tests/seo-gsc-english-batch3-20261012.php

      # Recheck after controlled origin-versus-public diagnosis PR #248.
      # Advisory only: GitHub-hosted runner provides an independent external
      # vantage point to check if first-cohort changes are live on WordPress.
      # Never gate unrelated tests on intermittent public HTTP failures.
      - name: Inspect public cache headers and HTML variant
        shell: bash
        timeout-minutes: 2
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://www.elmercadodeorigen.com/en/why-cut-potatoes-turn-black-oxidation-how-to-prevent-it/"
          for mode in standard uncached; do
            url="$base"
            [ "$mode" != uncached ] || url="${base}?seo_header_probe=${GITHUB_RUN_ID}"
            echo "=== SEO_HTTP_DIAG $mode ==="
            code="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' -D /tmp/seo-probe-headers -o /tmp/seo-probe-html -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code"
            grep -Ei '^(server|cache-control|age|x-cache|x-litespeed-cache|x-el-mercado-.*|cf-cache-status|last-modified|vary):' /tmp/seo-probe-headers || true
            grep -oEi '<title[^>]*>[^<]*</title>' /tmp/seo-probe-html | head -n 1 || true
          done

      - name: Inspect guarded production SEO deployment state
        shell: bash
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Recent production SEO deployment workflow runs (id, status, conclusion, SHA):"
          gh api "repos/${{ github.repository }}/actions/workflows/production-seo-gsc-batch1-20261013.yml/runs?per_page=5" \
            --jq '.workflow_runs[:5][] | [.id, .status, (.conclusion // "pending"), .head_sha] | @tsv'

      - name: Diagnose first SEO batch HTML on production
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python3 tests/seo-html-audit.py \
            --base https://www.elmercadodeorigen.com \
            --timeout 8 --cache-bust

      - name: Validate all 60 GSC URL integration
        shell: bash
        run: php tests/seo-gsc-all-60-integration-20261012.php

      - name: Validate GSC SEO batch invariants
        shell: bash
        run: php tests/seo-gsc-batch-20-20261012.php

      - name: Validate fallback category translation without Falang overrides
        shell: bash
        run: php tests/seo-blog-category-english-20261012.php

      - name: Validate EN blog products and Falang labels
        shell: bash
        run: php tests/seo-blog-products-language-20261012.php

      - name: Validate expired promotional card handling
        shell: bash
        run: php tests/seo-expired-special-20261012.php

      - name: Validate staging HTML auditor fixtures
        shell: bash
        run: python3 tests/seo-html-audit.py --self-test

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || git diff --check

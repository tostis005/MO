name: CPU diagnostic quick
on:
  push:
    branches: [diag-cpu-20260812]
    paths: ['.github/workflows/cpu-diagnostic-quick.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Count traffic around spike
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          f=/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log
          tmp=$(mktemp)
          # User's 19:35-19:50 local = server log 17:35-17:50 UTC.
          grep -E '12/Aug/2026:17:(3[5-9]|4[0-9]|50):' "$f" > "$tmp"
          echo '=== TOTAL REQUESTS 19:35-19:50 LOCAL ==='
          wc -l < "$tmp"
          echo '=== REQUESTS PER MINUTE ==='
          awk -F'[:[]' '{print $3":"$4}' "$tmp" | sort | uniq -c
          echo '=== TOP USER AGENTS ==='
          awk -F'"' '{print $6}' "$tmp" | sort | uniq -c | sort -nr | head -n 15
          echo '=== META REQUEST COUNT ==='
          grep -ci 'meta-externalagent' "$tmp"
          echo '=== META REQUESTS PER MINUTE ==='
          grep -i 'meta-externalagent' "$tmp" | awk -F'[:[]' '{print $3":"$4}' | sort | uniq -c
          echo '=== TOP IPS ==='
          awk '{print $1}' "$tmp" | sort | uniq -c | sort -nr | head -n 20
          echo '=== TOP META PATH FAMILIES ==='
          grep -i 'meta-externalagent' "$tmp" | awk -F'"' '{print $2}' | sed -E 's#^(GET|POST|HEAD) ##; s# HTTP/[0-9.]+$##; s#\?.*$##' | sort | uniq -c | sort -nr | head -n 30
          echo '=== META DYNAMIC QUERY COUNT ==='
          grep -i 'meta-externalagent' "$tmp" | grep -Ec '\?(.*filter_|.*query_type_|.*add-to-cart|.*add_to_wishlist|.*remove_item|.*vendor_id)' || true
          echo '=== SAMPLE 19:44-19:47 LOCAL ==='
          grep -E '12/Aug/2026:17:4[4-7]:' "$tmp" | grep -i 'meta-externalagent' | head -n 30
          rm -f "$tmp"
          REMOTE

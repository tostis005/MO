name: Final quality audit 18 bilingual blog articles

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit-editorial-v2-final-18-20261015.php'
      - '.github/workflows/audit-editorial-v2-final-18-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only auditor
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/audit-editorial-v2-final-18-20261015.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Audit WordPress article bodies and featured images
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              path=$(dirname "$cfg")
              site=$("$php" "$wp" option get siteurl --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$site" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$path" "$php" "$wp"; break ;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}";REST="${INFO#*|}";PHP="${REST%%|*}";WP="${REST#*|}"
          DIR="/tmp/emdo-blog-audit-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$DIR'"
          sshpass -e scp $SCP .github/scripts/audit-editorial-v2-final-18-20261015.php "$STAGING_USER@$STAGING_HOST:$DIR/"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf $DIR" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$DIR/audit-editorial-v2-final-18-20261015.php' --path='$PROD' --allow-root" | tee /tmp/editorial-audit.log
          sed -n 's/^EMDO_QUALITY_FINAL_AUDIT //p' /tmp/editorial-audit.log | tail -n1 > /tmp/editorial-audit.json
          jq -e '.verified == true and .count == 18 and .unique_images == 18 and .internal_links_checked >= 35 and (.issues | length)==0' /tmp/editorial-audit.json >/dev/null
          jq -r '.articles[] | [.slug, .es_words, .en_words, .image_id, (.problems|length)] | @tsv' /tmp/editorial-audit.json
          echo 'EDITORIAL_18_QUALITY_FINAL_AUDIT_OK'

name: Editorial authority batch 8 isolated publish 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-editorial-authority-batch8-20260821.php'
      - '.github/data/editorial-authority-batch8-20260821/**'
      - '.github/workflows/editorial-authority-batch8-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-authority-batch8-20260821
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate editorial source
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-editorial-authority-batch8-20260821.php
          test "$(find .github/data/editorial-authority-batch8-20260821 -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 5
          for f in .github/data/editorial-authority-batch8-20260821/*.php; do php -l "$f"; done

      - name: Publish five articles independently
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-ab8-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch8-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
          sshpass -e scp $SCP .github/data/editorial-authority-batch8-20260821/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
          : >/tmp/ab8-publish.log
          for localfile in .github/data/editorial-authority-batch8-20260821/*.php; do
            bn="$(basename "$localfile")"
            echo "=== $bn ===" >>/tmp/ab8-publish.log
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH8_DIR='$DATA' EMDO_BATCH8_ONLY_FILE='$bn' '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" >>/tmp/ab8-publish.log 2>&1
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT pm2.meta_value,p.ID,p.post_status,p.post_name,thumb.meta_value AS thumbnail_id FROM wp_posts p JOIN wp_postmeta b ON b.post_id=p.ID AND b.meta_key='_emdo_authority_batch' AND b.meta_value='8' JOIN wp_postmeta pm2 ON pm2.post_id=p.ID AND pm2.meta_key='_emdo_authority_key' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" | tee /tmp/ab8-db.txt
          test "$(grep -c $'\tpublish\t' /tmp/ab8-db.txt)" -eq 5
          test "$(awk -F '\t' '{print $5}' /tmp/ab8-db.txt | grep -E '^[0-9]+$' | sort -u | wc -l)" -eq 5

      - name: Verify ten public views and both indexes
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; marker="$2"; f=/tmp/ab8-page.html; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$f" -w '%{http_code}' "$url?ab8=$stamp"); test "$c" = 200; grep -Fq "EMDO_AUTHORITY_BATCH8:$marker" "$f"; grep -Eq 'class="[^"]*products|class="[^"]*product' "$f"; ! grep -Fq '[products ' "$f"; grep -Fq 'emo-article-featured' "$f"; }
          check "$BASE/como-empezar-jamon-pezuna-arriba-o-abajo/" ham-starting-orientation-guide
          check "$BASE/en/how-to-start-a-ham-hoof-up-or-down/" ham-starting-orientation-guide
          check "$BASE/marmoleado-carne-ternera-que-significa-como-influye-cocina/" beef-marbling-guide
          check "$BASE/en/beef-marbling-what-it-means-and-how-it-affects-cooking/" beef-marbling-guide
          check "$BASE/legumbres-secas-o-cocidas-cuando-conviene-cada-formato/" dried-vs-cooked-pulses-guide
          check "$BASE/en/dried-or-cooked-pulses-when-each-format-makes-sense/" dried-vs-cooked-pulses-guide
          check "$BASE/como-organizar-compra-semanal-verduras-aprovecharla-entera/" weekly-vegetable-shopping-guide
          check "$BASE/en/how-to-plan-a-weekly-vegetable-shop-and-use-everything/" weekly-vegetable-shopping-guide
          check "$BASE/como-cocinar-conservas-vegetales-plato-principal/" cook-with-vegetable-preserves-guide
          check "$BASE/en/how-to-cook-with-vegetable-preserves-beyond-a-side-dish/" cook-with-vegetable-preserves-guide
          curl -k -L -sS --retry 3 -H 'Cache-Control: no-cache' "$BASE/blog/?ab8=$stamp" -o /tmp/blog-es.html
          curl -k -L -sS --retry 3 -H 'Cache-Control: no-cache' "$BASE/en/journal/?ab8=$stamp" -o /tmp/blog-en.html
          grep -Fq 'Cómo empezar un jamón' /tmp/blog-es.html
          grep -Fq 'Marmoleado en la carne de ternera' /tmp/blog-es.html
          grep -Fq 'How to start a ham' /tmp/blog-en.html
          grep -Fq 'Beef marbling' /tmp/blog-en.html

      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os
          rows=[]
          for line in open('/tmp/ab8-db.txt',encoding='utf-8'):
              p=line.rstrip('\n').split('\t')
              if len(p)>=5: rows.append({'key':p[0],'id':int(p[1]),'status':p[2],'slug':p[3],'image_id':int(p[4])})
          d={'batch':8,'release':'20260821','posts':rows,'verified':True,'language_views_verified':10,'blogs_verified':True,'distinct_featured_images':len({x['image_id'] for x in rows}),'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA']}
          open('.deploy-status/editorial-authority-batch8-final-20260821.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch8-final-20260821.json
          git commit -m 'Record verified editorial authority batch 8 publication [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Production producer mobile layout parity 0.10.236 fix v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-producer-mobile-layout-parity-010236-fix-v4.yml'
      - 'elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy safely and verify Shop versus Hidalgo
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"
          THEME="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          MODULE="$THEME/inc/catalog-mobile-controls-parity-010236.php"
          BACKUP="/tmp/catalog-mobile-controls-v4-${GITHUB_RUN_ID}.bak"
          PROBE="elmercado-opcache-v4-${GITHUB_RUN_ID}.php"
          ROLLED_BACK=0
          rollback(){ code=$?; [ "$ROLLED_BACK" -eq 0 ] || exit "$code"; ROLLED_BACK=1; set +e; echo ROLLBACK_START; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then cp -p '$BACKUP' '$MODULE'; rm -f '$BACKUP'; fi; rm -f '$PROD_PATH/$PROBE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true; echo ROLLED_BACK; exit "${code:-1}"; }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; grep -Fq CATALOG_MOBILE_CONTROLS_010236_PRODUCTION '$THEME/functions.php'; cp -p '$MODULE' '$BACKUP'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php "$STAGING_USER@$STAGING_HOST:$MODULE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$MODULE' >/dev/null; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          set +e
          for i in $(seq 1 8); do body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?x=$i" 2>/dev/null)"; printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$' && break; sleep 3; done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" >/dev/null 2>&1
          set -e
          for i in $(seq 1 10); do html="$(curl -fsSL --connect-timeout 10 --max-time 35 -H 'Cache-Control: no-store' "$BASE_URL/tienda/hidalgo-de-la-jara/?v4=$GITHUB_RUN_ID-$i" 2>/dev/null || true)"; grep -Fq "vendorLabel.textContent='Filtros'" <<<"$html" && break; [ "$i" -lt 10 ] || false; sleep 3; done

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const near=(a,b,t=2)=>Math.abs(a-b)<=t;
          const fail=(m,d)=>{throw new Error(`${m} ${JSON.stringify(d)}`)};
          const retry=async(fn)=>{let e;for(let i=0;i<4;i++){try{return await fn()}catch(x){e=x;await sleep(2000)}}throw e};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            async function inspect(path,vendor,width){
              const p=await browser.newPage(); await p.setCacheEnabled(false); await p.setViewport({width,height:844});
              await retry(()=>p.goto(`${process.env.BASE_URL}${path}?v4qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:50000}));
              await p.waitForSelector('.emo-catalog-toolbar-shared-010229',{timeout:30000}); await sleep(1800);
              const d=await p.evaluate(vendor=>{
                const t=document.querySelector('.emo-catalog-toolbar-shared-010229'); const c=t?.querySelector('.woocommerce-result-count,.emo-catalog-result-count-010220,.emo-vendor-result-count-010225'); const s=t?.querySelector('.woocommerce-ordering select'); const f=vendor?document.querySelector('#wcfmmp-store .emo-mobile-filter-toggle.emo-filter-toggle-shared-010229'):document.querySelector('#emo-premium-filter-toggle'); const label=f?.querySelector('.emo-filter-label'); const first=document.querySelector(vendor?'#wcfmmp-store ul.products li.product':'ul.products li.product');
                const R=e=>{if(!e)return null;const r=e.getBoundingClientRect();return{top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}}; const S=e=>{if(!e)return null;const x=getComputedStyle(e);return{display:x.display,boxSizing:x.boxSizing,padding:x.padding,borderRadius:x.borderRadius,borderTopWidth:x.borderTopWidth,borderTopColor:x.borderTopColor,backgroundColor:x.backgroundColor,boxShadow:x.boxShadow,fontSize:x.fontSize,fontWeight:x.fontWeight,lineHeight:x.lineHeight,whiteSpace:x.whiteSpace,wordBreak:x.wordBreak,overflowWrap:x.overflowWrap,writingMode:x.writingMode,flex:x.flex}};
                return{toolbar:R(t),count:R(c),select:R(s),filter:R(f),first:R(first),toolbarStyle:S(t),countStyle:S(c),selectStyle:S(s),filterStyle:S(f),label:(label?.textContent||'').trim(),text:(c?.textContent||'').replace(/\s+/g,' ').trim(),clientWidth:c?.clientWidth||0,scrollWidth:c?.scrollWidth||0};
              },vendor);
              if(!d.toolbar||!d.count||!d.select||!d.filter||!d.first) fail('missing',{path,d});
              const expected=width-32, orderW=width<=360?138:148;
              if(!near(d.toolbar.width,expected)||!near(d.toolbar.left,16)||!near(d.filter.width,expected)||!near(d.filter.left,16)) fail('outer geometry',{path,width,d});
              if(d.count.width<=0||d.clientWidth<=0||d.scrollWidth>d.clientWidth+2||d.countStyle.whiteSpace!=='nowrap'||!String(d.countStyle.writingMode).startsWith('horizontal')||!/resultado/i.test(d.text)) fail('count flow',{path,width,d});
              if(!near(d.select.width,orderW,1)||d.selectStyle.boxSizing!=='border-box') fail('sort',{path,d});
              if(d.label!=='Filtros') fail('label',{path,d});
              if(d.filter.top<d.toolbar.bottom-1||d.first.top<d.filter.bottom+8) fail('spacing',{path,d});
              await p.click(vendor?'#wcfmmp-store .emo-mobile-filter-toggle.emo-filter-toggle-shared-010229':'#emo-premium-filter-toggle'); await sleep(250);
              const open=await p.evaluate(v=>{const e=v?document.querySelector('.emo-mobile-filter-shell.emo-filter-shell-shared-010229'):document.querySelector('#emo-premium-filter-shell'); if(!e)return false;const cs=getComputedStyle(e),r=e.getBoundingClientRect();return !e.hidden&&cs.display!=='none'&&r.width>0&&r.height>0},vendor); if(!open) fail('drawer',{path,d});
              await p.close(); return d;
            }
            for(const width of [390,360]){
              const shop=await inspect('/tienda/',false,width); const vendor=await inspect('/tienda/hidalgo-de-la-jara/',true,width);
              for(const [name,a,b,keys] of [['toolbar',shop.toolbarStyle,vendor.toolbarStyle,['display','boxSizing','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']],['count',shop.countStyle,vendor.countStyle,['display','fontSize','fontWeight','lineHeight','whiteSpace','wordBreak','overflowWrap','writingMode','flex']],['select',shop.selectStyle,vendor.selectStyle,['display','boxSizing','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']],['filter',shop.filterStyle,vendor.filterStyle,['display','boxSizing','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']]]) for(const k of keys) if(a[k]!==b[k]) fail(`${name} style`,{width,key:k,shop:a,vendor:b});
              console.log(`PARITY_${width}_OK`,JSON.stringify({shop,vendor}));
            }
            await browser.close();
          })().catch(e=>{console.error('PRODUCER_MOBILE_PARITY_V4_ERROR',e);process.exit(1)});
          NODE

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP' '$PROD_PATH/$PROBE'"
          trap - ERR
          echo PRODUCTION_PRODUCER_MOBILE_PARITY_V4_OK

name: Production performance root cause 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-performance-root-cause-20260816.yml'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Diagnose live production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          WP=$(command -v wp || true); PHP=$(command -v php || true)
          [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          echo '=== LOAD ==='; uptime; free -m
          echo '=== TOP CPU ==='; ps -eo pid,ppid,user,stat,etimes,%cpu,%mem,rss,comm,args --sort=-%cpu | head -n 30 || true
          echo '=== HOME FRESH TOP ==='; sed -n '1,90p' "$ROOT/wp-content/mu-plugins/elmercado-home-fresh.php" 2>/dev/null || true
          echo '=== HOME FRESH CACHE TERMS ==='; grep -nEi 'cache|transient|nocache|header|DONOTCACHE|ob_start' "$ROOT/wp-content/mu-plugins/elmercado-home-fresh.php" 2>/dev/null | head -n 80 || true
          echo '=== WP CACHE CONFIG ==='; grep -nE "WP_CACHE|DISABLE_WP_CRON|ALTERNATE_WP_CRON|WP_MEMORY_LIMIT|WP_MAX_MEMORY_LIMIT" "$ROOT/wp-config.php" 2>/dev/null || true
          echo '=== CACHE PLUGINS/DROPINS ==='; ls -lah "$ROOT/wp-content"/{advanced-cache.php,object-cache.php} 2>/dev/null || true; find "$ROOT/wp-content/plugins" -maxdepth 1 -type d \( -iname '*cache*' -o -iname '*rocket*' -o -iname '*litespeed*' \) -printf '%f\n' 2>/dev/null || true
          echo '=== HEADERS ==='
          for path in / /tienda/ /en/; do echo "---$path"; curl -k -sSI --max-time 20 -A 'MDO-Perf-Diag/1.0' "https://www.elmercadodeorigen.com$path" | grep -Ei 'HTTP/|cache|age:|expires:|pragma:|x-|server:|vary:' || true; done
          echo '=== ACTION SCHEDULER ==='
          PREFIX=$("$PHP" "$WP" db prefix --path="$ROOT" --allow-root 2>/dev/null || echo wp_)
          "$PHP" "$WP" db query "SELECT status, COUNT(*) n FROM ${PREFIX}actionscheduler_actions GROUP BY status ORDER BY n DESC;" --path="$ROOT" --allow-root --skip-column-names 2>/dev/null || true
          "$PHP" "$WP" db query "SELECT hook,status,COUNT(*) n FROM ${PREFIX}actionscheduler_actions WHERE status IN ('pending','in-progress') GROUP BY hook,status ORDER BY n DESC LIMIT 25;" --path="$ROOT" --allow-root --skip-column-names 2>/dev/null || true
          echo '=== CRON ==='
          "$PHP" "$WP" db query "SELECT option_name,LENGTH(option_value) FROM ${PREFIX}options WHERE option_name='cron';" --path="$ROOT" --allow-root --skip-column-names 2>/dev/null || true
          echo '=== PHP FPM CONFIG PROD/DEV ==='
          grep -RHE '^pm\.(max_children|max_requests|start_servers|min_spare_servers|max_spare_servers)' /var/www/vhosts/system/elmercadodeorigen.com/conf /var/www/vhosts/system/dev.elmercadodeorigen.com/conf 2>/dev/null | head -n 40 || true
          echo '=== CURRENT PHP82 WORKERS ==='; ps -eo user,pid,ppid,stat,etimes,%cpu,%mem,rss,args | grep -E 'php-fpm|php82' | grep -v grep | head -n 80 || true
          REMOTE

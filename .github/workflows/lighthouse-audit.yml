name: Lighthouse mobile audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-audit.yml'
      - 'elmercadodeorigen-child/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-lighthouse-mobile
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the optimized staging homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dev.elmercadodeorigen.com/?emo-lighthouse=${GITHUB_SHA}"
          for attempt in {1..35}; do
            if curl -fsSL --max-time 25 "$URL" -o /tmp/home.html \
              && grep -q -- '--emo-mobile-panel' /tmp/home.html \
              && grep -q 'Los favoritos de nuestros clientes' /tmp/home.html; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Run Lighthouse 13 mobile audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse
          npm install --no-save --no-package-lock lighthouse@13.4.1 >/dev/null 2>&1

          npx lighthouse "https://dev.elmercadodeorigen.com/?emo-lighthouse=${GITHUB_SHA}" \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --output=json \
            --output-path=lighthouse/mobile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=simulate

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('lighthouse/mobile.json', 'utf8'));
          const audit = (id) => report.audits[id] || {};
          const score = (id) => Math.round((report.categories[id]?.score || 0) * 100);
          const result = {
            generatedAt: report.fetchTime,
            lighthouseVersion: report.lighthouseVersion,
            scores: {
              performance: score('performance'),
              accessibility: score('accessibility'),
              bestPractices: score('best-practices'),
              seo: score('seo')
            },
            metrics: {
              fcp: audit('first-contentful-paint').displayValue,
              lcp: audit('largest-contentful-paint').displayValue,
              tbt: audit('total-blocking-time').displayValue,
              cls: audit('cumulative-layout-shift').displayValue,
              speedIndex: audit('speed-index').displayValue
            },
            diagnostics: {
              requests: audit('network-requests').details?.items?.length || 0,
              transferSize: audit('total-byte-weight').displayValue,
              mainThreadWork: audit('mainthread-work-breakdown').displayValue,
              javascriptExecution: audit('bootup-time').displayValue,
              renderBlockingSavings: audit('render-blocking-resources').details?.overallSavingsMs || 0,
              unusedCssSavings: audit('unused-css-rules').details?.overallSavingsBytes || 0,
              unusedJavascriptSavings: audit('unused-javascript').details?.overallSavingsBytes || 0
            },
            opportunities: Object.values(report.audits)
              .filter((item) => item.details?.type === 'opportunity' && Number(item.details.overallSavingsMs) > 0)
              .map((item) => ({
                id: item.id,
                title: item.title,
                savingsMs: Math.round(item.details.overallSavingsMs || 0),
                savingsBytes: Math.round(item.details.overallSavingsBytes || 0)
              }))
              .sort((a, b) => b.savingsMs - a.savingsMs)
              .slice(0, 12)
          };
          fs.writeFileSync('lighthouse/summary.json', JSON.stringify(result, null, 2));
          fs.writeFileSync('lighthouse/summary.txt', [
            `Performance: ${result.scores.performance}`,
            `Accessibility: ${result.scores.accessibility}`,
            `Best practices: ${result.scores.bestPractices}`,
            `SEO: ${result.scores.seo}`,
            `FCP: ${result.metrics.fcp}`,
            `LCP: ${result.metrics.lcp}`,
            `TBT: ${result.metrics.tbt}`,
            `CLS: ${result.metrics.cls}`,
            `Speed Index: ${result.metrics.speedIndex}`,
            `Requests: ${result.diagnostics.requests}`,
            `Transfer: ${result.diagnostics.transferSize}`
          ].join('\n') + '\n');
          NODE

          cat lighthouse/summary.txt
          cat lighthouse/summary.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: lighthouse/
          retention-days: 14

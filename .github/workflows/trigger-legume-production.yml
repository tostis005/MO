name: Trigger corrected legume production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-legume-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Run existing protected publisher on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-legume-nutrition-batch1-production.yml/dispatches" \
            -f ref=main
          echo "Protected legume production workflow dispatched on current main."

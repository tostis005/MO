name: Publish cheese batch 03 production

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-03-data-a.php'
      - '.github/scripts/cheese-batch-03-data-b.php'
      - '.github/scripts/publish-cheese-batch-03-production.php'
      - '.github/workflows/publish-cheese-batch-03-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate editorial publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/cheese-batch-03-data-a.php
          php -l .github/scripts/cheese-batch-03-data-b.php
          php -l .github/scripts/publish-cheese-batch-03-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese03-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-03-data-a.php \
            .github/scripts/cheese-batch-03-data-b.php \
            .github/scripts/publish-cheese-batch-03-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/publish-cheese-batch-03-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" | tee /tmp/cheese03-output.txt
          grep -q 'EMDO_CHEESE_BATCH03_BEGIN' /tmp/cheese03-output.txt
          grep -q '"count":10' /tmp/cheese03-output.txt
          grep -q 'EMDO_CHEESE_BATCH03_END' /tmp/cheese03-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'queso-arzua-ulloa-dop-tipos-leche-textura-como-reconocerlo'
            'queso-san-simon-da-costa-dop-leche-ahumado-abedul-formatos'
            'queso-la-serena-dop-leche-merina-cuajo-vegetal-textura-cremosa'
            'queso-zamorano-dop-leche-oveja-maduracion-como-reconocerlo'
            'queso-roncal-dop-leche-cruda-oveja-valle-maduracion'
            'queso-gamoneu-dop-valle-puerto-ahumado-maduracion-cueva'
            'queso-afuega-pitu-dop-variedades-textura-pimenton-maduracion'
            'queso-palmero-dop-cabra-palmera-ahumado-tipos-como-reconocerlo'
            'se-come-corteza-queso-cortezas-comestibles-cuales-retirar'
            'quesos-azules-que-son-como-se-elaboran-mohos-como-degustarlos'
          )
          en_slugs=(
            'arzua-ulloa-pdo-cheese-types-milk-texture-how-identify'
            'san-simon-da-costa-pdo-cheese-milk-birch-smoking-formats'
            'queso-de-la-serena-pdo-merino-sheep-milk-vegetable-rennet-creamy-texture'
            'queso-zamorano-pdo-sheep-milk-maturation-how-identify'
            'roncal-pdo-cheese-raw-sheep-milk-valley-minimum-maturation'
            'gamoneu-pdo-cheese-valley-mountain-smoking-cave-maturation'
            'afuega-l-pitu-pdo-cheese-varieties-texture-paprika-maturation'
            'queso-palmero-pdo-palmera-goat-smoking-types-how-identify'
            'can-you-eat-cheese-rind-which-rinds-edible-which-remove'
            'blue-cheese-what-it-is-how-made-why-mould-how-to-taste'
          )
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 4
            done
            echo "FAILED $code $url" >&2
            return 1
          }
          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

          curl -L -sS --max-time 45 "$base/queso-gamoneu-dop-valle-puerto-ahumado-maduracion-cueva/?verify=$GITHUB_RUN_ID" -o /tmp/gamoneu.html
          grep -Fq 'Gamonéu del Valle y Gamonéu del Puerto' /tmp/gamoneu.html
          curl -L -sS --max-time 45 "$base/queso-afuega-pitu-dop-variedades-textura-pimenton-maduracion/?verify=$GITHUB_RUN_ID" -o /tmp/afuega.html
          grep -Fq 'Atroncáu Blancu, Atroncáu Roxu, Trapu Blancu y Trapu Roxu' /tmp/afuega.html
          curl -L -sS --max-time 45 "$base/se-come-corteza-queso-cortezas-comestibles-cuales-retirar/?verify=$GITHUB_RUN_ID" -o /tmp/rind.html
          grep -Fq 'Corteza y recubrimiento no son lo mismo' /tmp/rind.html
          curl -L -sS --max-time 45 "$base/en/blue-cheese-what-it-is-how-made-why-mould-how-to-taste/?verify=$GITHUB_RUN_ID" -o /tmp/blue-en.html
          grep -Fq 'Why blue cheese is pierced' /tmp/blue-en.html
          echo 'Cheese batch 03 public editorial verification OK'

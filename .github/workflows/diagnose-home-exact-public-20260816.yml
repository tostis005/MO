name: Diagnose exact public Home 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/diagnose-home-exact-public-20260816.yml'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          python3 -m pip install -q selenium
      - name: Check live file and exact HTTP variants
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" -d memory_limit=512M "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          F="$ROOT/wp-content/mu-plugins/mdo-home-aceites-card-hotfix.php"
          echo "LIVE_FILE=$(test -f "$F" && echo yes || echo no)"
          test -f "$F" && { stat -c 'LIVE_MTIME=%y LIVE_SIZE=%s' "$F"; sha256sum "$F"; grep -n 'mdo-home-category-mobile-visible-20260816' "$F" || true; }
          REMOTE
          python3 - <<'PY'
          import urllib.request,re
          url='https://www.elmercadodeorigen.com/'
          variants=[
            ('plain',{}),
            ('chrome',{'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}),
            ('es-cookie',{'Cookie':'trp_language=es_ES'}),
            ('en-cookie',{'Cookie':'trp_language=en_US'}),
            ('no-cache',{'Cache-Control':'no-cache','Pragma':'no-cache'}),
          ]
          for name,headers in variants:
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=60) as r:
              h=r.read().decode('utf-8','replace')
              hdr=dict(r.headers.items())
            cards=[re.sub('<[^>]+>','',x).strip() for x in re.findall(r'<a class="emo-category-card"[^>]*>.*?<strong[^>]*>(.*?)</strong>',h,re.S|re.I)]
            print(name,'status',r.status,'cards',cards,'aceites',cards.count('Aceites'),'marker',('mdo-home-category-mobile-visible-20260816' in h),'restored',('data-mdo-aceites-restored="20260816"' in h),'cache',hdr.get('Cache-Control'),'age',hdr.get('Age'),'vary',hdr.get('Vary'))
          PY
      - name: Exact browser no query
        run: |
          python3 - <<'PY'
          import shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          c=shutil.which('google-chrome') or shutil.which('chromium')
          for w in (1366,600,390):
            o=Options();o.binary_location=c;o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument(f'--window-size={w},1200')
            d=webdriver.Chrome(options=o)
            try:
              d.get('https://www.elmercadodeorigen.com/');time.sleep(7)
              z=d.execute_script('''const cards=[...document.querySelectorAll('.emo-category-card')]; const ace=cards.find(e=>(e.innerText||'').trim().startsWith('Aceites')); const r=ace&&ace.getBoundingClientRect(); return {url:location.href,title:document.title,cards:cards.map(e=>(e.innerText||'').trim().replace(/\\s+/g,' ')),marker:!!document.getElementById('mdo-home-category-mobile-visible-20260816'),ace:r&&{l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height,display:getComputedStyle(ace).display,visibility:getComputedStyle(ace).visibility,opacity:getComputedStyle(ace).opacity}};''')
              print('BROWSER',w,z)
            finally:
              d.quit()
          PY

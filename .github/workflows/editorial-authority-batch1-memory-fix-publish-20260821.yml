name: Editorial authority batch 1 memory fix publish 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch1-memory-fix-publish-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish with 768M WP CLI
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done; [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          : "${PROD:?}"; : "${PHP:?}"; : "${WP:?}"
          PUB=/tmp/ab1-publish-${GITHUB_RUN_ID}.php
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch1-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" > /tmp/ab1-publish.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/ab1-publish.json',encoding='utf-8',errors='ignore').read()
          start=raw.find('{'); end=raw.rfind('}')
          assert start>=0 and end>=start, raw[-5000:]
          d=json.loads(raw[start:end+1])
          assert len(d.get('posts',[]))==5, d
          assert all(p.get('status')=='publish' for p in d['posts']), d
          assert len({p.get('image_id') for p in d['posts']})==5, d
          assert all(int(p.get('words_es',0))>=750 for p in d['posts']), d
          assert all(int(p.get('words_en',0))>=700 for p in d['posts']), d
          assert all(int(p.get('image_w',0))>=1200 and int(p.get('image_h',0))>=700 for p in d['posts']), d
          open('/tmp/ab1-clean.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT pm.meta_value,p.ID,p.post_status,p.post_name FROM wp_posts p JOIN wp_postmeta pm ON pm.post_id=p.ID WHERE pm.meta_key='_emdo_authority_key' ORDER BY p.ID DESC LIMIT 10;\" --skip-column-names --path='$PROD' --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -f '$PUB'" | tee /tmp/ab1-db.txt
          test "$(grep -c $'\tpublish\t' /tmp/ab1-db.txt)" -ge 5

      - name: Verify all public views
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com
          stamp="$GITHUB_RUN_ID"
          check(){
            url="$1"; marker="$2"; out="/tmp/ab1-$(echo "$marker-$url"|tr '/:' '__').html"
            code="$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 70 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$out" -w '%{http_code}' "${url}?ab1_final=${stamp}")"
            test "$code" = 200
            grep -Fq "EMDO_AUTHORITY_BATCH1:${marker}" "$out"
            grep -Eq 'class="[^"]*products|class="[^"]*product' "$out"
            ! grep -Fq '[products ' "$out"
            grep -Fq 'emo-article-featured' "$out"
          }
          check "$BASE/brida-negra-roja-verde-blanca-jamon-iberico/" iberico-seals
          check "$BASE/en/black-red-green-white-seal-iberian-ham/" iberico-seals
          check "$BASE/como-conservar-jamon-iberico-empezado/" ham-storage
          check "$BASE/en/how-to-store-iberian-ham-once-started/" ham-storage
          check "$BASE/lomo-chorizo-salchichon-iberico-diferencias-como-elegir/" cured-meats-guide
          check "$BASE/en/iberian-loin-chorizo-salchichon-differences-how-to-choose/" cured-meats-guide
          check "$BASE/picual-arbequina-lechin-que-aove-elegir/" oil-varieties
          check "$BASE/en/picual-arbequina-lechin-which-evoo-to-choose/" oil-varieties
          check "$BASE/que-significa-aceite-oliva-virgen-extra/" what-evoo-means
          check "$BASE/en/what-extra-virgin-olive-oil-really-means/" what-evoo-means
          curl -k -L -sS --retry 3 -H 'Cache-Control: no-cache' "$BASE/blog/?ab1_final=$stamp" -o /tmp/blog-es.html
          curl -k -L -sS --retry 3 -H 'Cache-Control: no-cache' "$BASE/en/journal/?ab1_final=$stamp" -o /tmp/blog-en.html
          grep -Fq 'Brida negra, roja, verde o blanca' /tmp/blog-es.html
          grep -Fq 'Black, red, green or white seal' /tmp/blog-en.html

      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/ab1-clean.json'))
          d['verified']=True
          d['language_views_verified']=10
          d['blogs_verified']=True
          d['run_id']=os.environ['GITHUB_RUN_ID']
          d['source_sha']=os.environ['GITHUB_SHA']
          open('.deploy-status/editorial-authority-batch1-final-20260821.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch1-final-20260821.json
          git commit -m 'Record verified editorial authority batch 1 publication [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

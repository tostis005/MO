name: Selectos About and FluentCRM new producers draft 20261002 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/selectos-about-fluentcrm-new-producers-20261002-production.yml'
      - '.github/scripts/selectos-about-fluentcrm-new-producers-20261002.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate guarded Selectos and FluentCRM task
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php >/dev/null
          grep -Fq 'Selectos de Castilla nació en 1989 en Villamartín de Campos' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          grep -Fq 'Tres nuevos productores llegan a El Mercado de Origen' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          grep -Fq 'DESCUBRIR SELECTOS DE CASTILLA' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          grep -Fq 'DESCUBRIR MONTJAM' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          grep -Fq 'DESCUBRIR LA HUERTA DE ANA MARY' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          grep -Fq 'FLUENTCRM_SENT=no' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          ! grep -Fq 'sendTestEmail' .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Update Selectos About and create FluentCRM draft in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SCRIPT="/tmp/selectos-about-fluentcrm-new-producers-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/selectos-about-fluentcrm-new-producers-20261002.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"

          RUN_OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc")"
          printf '%s\n' "$RUN_OUTPUT"

          grep -Fq 'EMDO_SELECTOS_CRM_DRAFT_OK' <<< "$RUN_OUTPUT"
          grep -Fq 'FLUENTCRM_STATUS=draft' <<< "$RUN_OUTPUT"
          grep -Fq 'FLUENTCRM_SENT=no' <<< "$RUN_OUTPUT"

          SELECTOS_STORE_SLUG="$(sed -n 's/^SELECTOS_STORE_SLUG=//p' <<< "$RUN_OUTPUT" | tail -n1)"
          FLUENTCRM_CAMPAIGN_ID="$(sed -n 's/^FLUENTCRM_CAMPAIGN_ID=//p' <<< "$RUN_OUTPUT" | tail -n1)"
          : "${SELECTOS_STORE_SLUG:?store slug not returned}"
          : "${FLUENTCRM_CAMPAIGN_ID:?campaign id not returned}"

          printf 'SELECTOS_STORE_SLUG=%s\n' "$SELECTOS_STORE_SLUG" >> "$GITHUB_ENV"
          printf 'FLUENTCRM_CAMPAIGN_ID=%s\n' "$FLUENTCRM_CAMPAIGN_ID" >> "$GITHUB_ENV"

      - name: Flush WordPress object cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify Selectos About publicly
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/tienda/${SELECTOS_STORE_SLUG}/acercade/?emdo_selectos_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO Selectos About verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/selectos-about.html "$URL"
          grep -Fq 'Selectos de Castilla nació en 1989 en Villamartín de Campos' /tmp/selectos-about.html
          grep -Fq 'foie gras fresco y mi-cuit' /tmp/selectos-about.html
          grep -Fq 'más de tres décadas de trayectoria' /tmp/selectos-about.html
          echo "SELECTOS_ABOUT_PUBLIC_OK slug=${SELECTOS_STORE_SLUG}"
          echo "FLUENTCRM_DRAFT_READY id=${FLUENTCRM_CAMPAIGN_ID}"

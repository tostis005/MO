name: Diagnose EMDO staging HTTP 500

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-http500-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass curl
      - shell: bash
        run: |
          set -euo pipefail; PORT="${STAGING_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh; ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -u
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"; [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"; fi
          php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp)"
          wc="$wp_path/wp-content/plugins/woocommerce"; prod="$(dirname "$wp_path")/httpdocs/wp-content/plugins/woocommerce"
          echo '== PHP OPCACHE =='
          "$php_bin" -i 2>/dev/null | grep -E 'opcache.enable =>|opcache.use_cwd =>|opcache.validate_timestamps =>|opcache.revalidate_freq =>' || true
          echo '== SOURCE PATH CONSTRUCTION =='
          grep -RIn --exclude-dir=node_modules --exclude-dir=vendor -E 'patterns_path|PatternRegistry|WC_ABSPATH|coming-soon-entire-site' "$wc/src/Blocks" "$wc/includes" 2>/dev/null | head -n 120 || true
          echo '== WP RUNTIME (before init fatal where possible) =='
          "$php_bin" -d memory_limit=768M "$wp_bin" --path="$wp_path" --allow-root eval '
            echo "ABSPATH=".ABSPATH."\n";
            echo "WP_PLUGIN_DIR=".WP_PLUGIN_DIR."\n";
            echo "WC_PLUGIN_FILE=".(defined("WC_PLUGIN_FILE")?WC_PLUGIN_FILE:"undef")."\n";
            echo "WC_ABSPATH=".(defined("WC_ABSPATH")?WC_ABSPATH:"undef")."\n";
            if(class_exists("WooCommerce")){ $r=new ReflectionClass("WooCommerce"); echo "WooCommerceClass=".$r->getFileName()."\n"; }
            if(class_exists("Automattic\\WooCommerce\\Blocks\\Patterns\\PatternRegistry")){ $r=new ReflectionClass("Automattic\\WooCommerce\\Blocks\\Patterns\\PatternRegistry"); echo "PatternRegistryClass=".$r->getFileName()."\n"; }
            if(class_exists("Automattic\\WooCommerce\\Blocks\\Templates\\ComingSoonTemplate")){ $r=new ReflectionClass("Automattic\\WooCommerce\\Blocks\\Templates\\ComingSoonTemplate"); echo "ComingSoonClass=".$r->getFileName()." method=".(method_exists("Automattic\\WooCommerce\\Blocks\\Templates\\ComingSoonTemplate","get_font_families")?"yes":"no")."\n"; }
          ' 2>&1 || true
          echo '== DATABASE SEARCH FOR HTTPDOCS WOOCOMMERCE PATH =='
          "$php_bin" -d memory_limit=768M "$wp_bin" --path="$wp_path" --allow-root db query "SELECT option_name, LEFT(option_value,500) AS value FROM $(printf '%s' wp_)options WHERE option_value LIKE '%httpdocs/wp-content/plugins/woocommerce%' LIMIT 30" --skip-column-names 2>&1 || true
          echo '== CACHE FILE SEARCH =='
          grep -RIl --exclude='debug.log' --exclude='*.sql' 'httpdocs/wp-content/plugins/woocommerce' "$wp_path/wp-content/cache" "$wp_path/wp-content/uploads" 2>/dev/null | head -n 50 || true
          echo '== CROSS-PATH REFERENCES IN STAGING PHP =='
          grep -RIn --include='*.php' 'httpdocs/wp-content/plugins/woocommerce' "$wp_path/wp-content" 2>/dev/null | head -n 50 || true
          echo '== SERVER/PHP ENV PATHS =='
          env | grep -E 'DOCUMENT_ROOT|SCRIPT_FILENAME|PWD' || true
          echo '== HTTP =='
          curl -k -sS -o /tmp/out -D /tmp/hdr --max-time 20 "https://$domain/" || true; head -n 10 /tmp/hdr || true
          REMOTE

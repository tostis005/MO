name: Diagnose EMDO staging HTTP 500

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-http500-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass curl
      - shell: bash
        run: |
          set -euo pipefail; PORT="${STAGING_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh; ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -u
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"; [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"; fi
          wc="$wp_path/wp-content/plugins/woocommerce"
          prod="$(dirname "$wp_path")/httpdocs/wp-content/plugins/woocommerce"
          echo "WP_PATH=$wp_path"
          echo "WC_PATH=$wc"
          echo "PROD_WC_PATH=$prod"
          echo '== PATH TYPES =='
          ls -ld "$wc" "$wc/patterns" "$wc/src" "$wc/src/Blocks/Templates" 2>&1 || true
          printf 'WC_REAL='; readlink -f "$wc" || true
          printf 'PATTERNS_REAL='; readlink -f "$wc/patterns" || true
          printf 'PATTERN_FILE_REAL='; readlink -f "$wc/patterns/coming-soon-entire-site.php" || true
          printf 'TEMPLATE_REAL='; readlink -f "$wc/src/Blocks/Templates/ComingSoonTemplate.php" || true
          echo '== LINKS INSIDE WC =='
          find "$wc" -maxdepth 3 -type l -printf '%p -> %l\n' 2>/dev/null | head -n 100 || true
          echo '== VERSIONS =='
          grep -m1 -E '^ \* Version:' "$wc/woocommerce.php" 2>/dev/null || true
          grep -m1 -E '^ \* Version:' "$prod/woocommerce.php" 2>/dev/null || true
          echo '== METHOD CHECK =='
          grep -n 'function get_font_families' "$wc/src/Blocks/Templates/ComingSoonTemplate.php" 2>/dev/null || true
          grep -n 'function get_font_families' "$prod/src/Blocks/Templates/ComingSoonTemplate.php" 2>/dev/null || true
          echo '== PATTERN HEADS =='
          echo '--- staging resolved'; sed -n '1,45p' "$wc/patterns/coming-soon-entire-site.php" 2>/dev/null || true
          echo '--- production direct'; sed -n '1,45p' "$prod/patterns/coming-soon-entire-site.php" 2>/dev/null || true
          echo '== STAT =='
          stat "$wc/patterns/coming-soon-entire-site.php" "$wc/src/Blocks/Templates/ComingSoonTemplate.php" 2>/dev/null || true
          echo '== HTTP =='
          curl -k -sS -o /tmp/out -D /tmp/hdr --max-time 20 "https://$domain/" || true
          head -n 12 /tmp/hdr || true
          echo '== LAST FATALS =='
          grep 'PHP Fatal error' "$wp_path/wp-content/debug.log" 2>/dev/null | tail -n 12 || true
          REMOTE

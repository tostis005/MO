name: Diagnose EMDO staging HTTP 500

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-http500-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass curl
      - shell: bash
        run: |
          set -euo pipefail; PORT="${STAGING_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh; ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -u
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"; [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"; fi
          wp_bin="$(command -v wp || true)"; php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          echo "WP_PATH=$wp_path"
          echo "PHP=$php_bin"
          echo '== HTTP =='
          curl -k -sS -o /tmp/emdo-home.out -D /tmp/emdo-home.hdr --max-time 20 "https://$domain/" || true
          head -n 20 /tmp/emdo-home.hdr || true
          echo 'BODY_BEGIN'; head -c 2000 /tmp/emdo-home.out || true; echo; echo 'BODY_END'
          echo '== PHP LINT EMDO =='
          find "$wp_path/wp-content/plugins/mdo-supplier-sync" -type f -name '*.php' -print0 2>/dev/null | xargs -0 -r -n1 "$php_bin" -l || true
          echo '== WP CLI =='
          if [ -n "$wp_bin" ]; then
            "$php_bin" -d display_errors=1 -d memory_limit=768M "$wp_bin" --path="$wp_path" --allow-root core version 2>&1 || true
            "$php_bin" -d display_errors=1 -d memory_limit=768M "$wp_bin" --path="$wp_path" --allow-root plugin status mdo-supplier-sync 2>&1 || true
            "$php_bin" -d display_errors=1 -d memory_limit=768M "$wp_bin" --path="$wp_path" --allow-root option get active_plugins --format=json 2>&1 || true
          fi
          echo '== DEBUG LOG =='
          tail -n 150 "$wp_path/wp-content/debug.log" 2>/dev/null || true
          echo '== RECENT LOGS =='
          for f in "$wp_path"/error_log "$wp_path"/../logs/error_log "$wp_path"/../logs/proxy_error_log "$wp_path"/../logs/php_errors.log; do [ -f "$f" ] && { echo "--- $f"; tail -n 120 "$f"; }; done
          find "$wp_path/wp-content" -maxdepth 3 -type f \( -name '*error*.log' -o -name 'debug.log' \) -mmin -180 -print 2>/dev/null | while read f; do echo "--- $f"; tail -n 80 "$f"; done
          echo '== RECENT PLUGIN CHANGES =='
          find "$wp_path/wp-content/plugins" -maxdepth 3 -type f -mmin -180 -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -n 120 || true
          REMOTE

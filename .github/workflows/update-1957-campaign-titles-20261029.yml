name: Update 1957 campaign 26-27 oil product titles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-1957-campaign-titles-20261029.yml'
      - '.github/scripts/update-1957-campaign-titles-20261029.php'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected title updater
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/update-1957-campaign-titles-20261029.php
          grep -Fq '1957_ABORT_EXPECTED_THREE_NEW_CAMPAIGN_PRODUCTS' .github/scripts/update-1957-campaign-titles-20261029.php
          grep -Fq 'COSECHA 26/27 · SIN FILTRAR · ACEITE DE OLIVA VIRGEN EXTRA 5L · EXTRACCIÓN EN FRÍO' .github/scripts/update-1957-campaign-titles-20261029.php
      - name: Apply to exactly three 1957 new-campaign products and linked variations in production
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          REMOTE="/tmp/update-1957-titles-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/update-1957-campaign-titles-20261029.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "timeout 200 /opt/plesk/php/8.2/bin/php -d memory_limit=768M /usr/local/bin/wp eval-file '$REMOTE' --path='$PROD_ROOT' --skip-plugins --skip-themes --allow-root" | tee /tmp/1957-title-update.txt
          grep -q '1957_TITLE_UPDATE_COMPLETE parents=3' /tmp/1957-title-update.txt
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "timeout 40 /opt/plesk/php/8.2/bin/php -d memory_limit=768M /usr/local/bin/wp cache flush --path='$PROD_ROOT' --skip-plugins --skip-themes --allow-root" || true
      - name: Archive non-sensitive completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1957-26-27-titles-update
          path: /tmp/1957-title-update.txt
          if-no-files-found: warn
          retention-days: 7

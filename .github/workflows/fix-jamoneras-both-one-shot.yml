name: Fix jamoneras both one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jamoneras-both-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: elmercado-supplier-sync-staging-deploy
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch accessory classifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mdo-supplier-sync/includes/class-mdo-accessories-catalog.php')
          s=p.read_text()
          old="preg_match( '/\\bjamonero(?:s)?\\b/u', $title )"
          new="preg_match( '/\\bjamoner[oa](?:s)?\\b/u', $title )"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('mdo-supplier-sync/mdo-supplier-sync.php')
          s=p.read_text()
          assert s.count('Version: 1.0.9')==1
          assert s.count("MDO_SUPPLIER_SYNC_VERSION', '1.0.9") == 1
          s=s.replace('Version: 1.0.9','Version: 1.0.10')
          s=s.replace("MDO_SUPPLIER_SYNC_VERSION', '1.0.9","MDO_SUPPLIER_SYNC_VERSION', '1.0.10")
          p.write_text(s)
          PY
          grep -q "private const VERSION        = '1.0.5'" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -Fq "jamoner[oa](?:s)?" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -q "Version: 1.0.10" mdo-supplier-sync/mdo-supplier-sync.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage patched plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-jamoneras-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/plugin'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/plugin/"

      - name: Deploy and verify both environments
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"
          dev_path=""
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$dev_path/wp-config.php" ] && [ -f "$prod_path/wp-config.php" ]
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ]

          dev_target="$dev_path/wp-content/plugins/mdo-supplier-sync"
          prod_target="$prod_path/wp-content/plugins/mdo-supplier-sync"
          dev_backup="$dev_path/wp-content/plugins/.mdo-supplier-sync.jamoneras-${commit}"
          prod_backup="$prod_path/wp-content/plugins/.mdo-supplier-sync.jamoneras-${commit}"
          rm -rf "$dev_backup" "$prod_backup"
          cp -a "$dev_target" "$dev_backup"
          cp -a "$prod_target" "$prod_backup"
          rollback() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo 'Jamoneras QA failed; restoring both plugin copies.' >&2
              rm -rf "$dev_target" "$prod_target"
              mv "$dev_backup" "$dev_target"
              mv "$prod_backup" "$prod_target"
            else
              rm -rf "$dev_backup" "$prod_backup"
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          rsync -a --delete "$incoming/plugin/" "$dev_target/"
          rsync -a --delete "$incoming/plugin/" "$prod_target/"
          "$php_bin" "$wp_bin" plugin is-active mdo-supplier-sync --path="$dev_path" --allow-root >/dev/null
          "$php_bin" "$wp_bin" plugin is-active mdo-supplier-sync --path="$prod_path" --allow-root >/dev/null

          classify_and_verify() {
            env_name="$1"; wp_path="$2"; gondola="$3"; bellota="$4"; basculante="$5"; cuchillo="$6"
            code="$(cat <<PHP
          foreach (array(${gondola},${bellota},${basculante}) as \$id) {
            \$result=MDO_Accessories_Catalog::classify_product(\$id);
            if (empty(\$result['target']) || 'Jamonero'!==(\$result['type']??'')) { fwrite(STDERR,'Could not classify jamonera '.\$id."\n"); exit(31); }
          }
          foreach (array(${gondola},${bellota},${basculante}) as \$id) {
            \$p=wc_get_product(\$id);
            if (!\$p instanceof WC_Product || 'publish'!==\$p->get_status() || !has_term('accesorios','product_cat',\$id)) { exit(32); }
            \$types=wp_get_post_terms(\$id,'pa_tipo-producto',array('fields'=>'names'));
            if (is_wp_error(\$types) || \$types!==array('Jamonero')) { exit(33); }
          }
          \$types=wp_get_post_terms(${cuchillo},'pa_tipo-producto',array('fields'=>'names'));
          if (!has_term('accesorios','product_cat',${cuchillo}) || is_wp_error(\$types) || \$types!==array('Cuchillo')) { exit(34); }
          \$q=new WP_Query(array('post_type'=>'product','post_status'=>'publish','posts_per_page'=>-1,'fields'=>'ids','tax_query'=>array(array('taxonomy'=>'product_cat','field'=>'slug','terms'=>array('accesorios')))));
          \$ids=array_values(array_unique(array_map('intval',\$q->posts))); sort(\$ids);
          \$expected=array(${gondola},${bellota},${basculante},${cuchillo}); sort(\$expected);
          if (\$ids!==\$expected) { fwrite(STDERR,'Unexpected public accessories: '.wp_json_encode(\$ids)."\n"); exit(35); }
          foreach (\$ids as \$id) { if (!wc_get_product(\$id)->is_in_stock()) exit(36); }
          foreach (array(${gondola},${bellota},${basculante}) as \$id) {
            if (in_array((int)get_option('default_product_cat',0),wc_get_product(\$id)->get_category_ids(),true)) { exit(37); }
          }
          echo 'PUBLIC_ACCESSORIES_OK';
          PHP
            )"
            "$php_bin" -d memory_limit=512M "$wp_bin" eval "$code" --path="$wp_path" --allow-root | grep -q PUBLIC_ACCESSORIES_OK
            echo "$env_name=passed"
          }

          classify_and_verify DEVELOPMENT "$dev_path" 11382 11391 11397 11403
          classify_and_verify PRODUCTION "$prod_path" 12566 12575 12581 12587
          "$php_bin" "$wp_bin" cache flush --path="$dev_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
          "$php_bin" "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
          echo 'JAMONERAS_BOTH_ENVIRONMENTS_QA=passed'
          rm -rf "$dev_backup" "$prod_backup" "$incoming"
          trap - EXIT HUP INT TERM
          REMOTE

      - name: Persist classifier fix in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mdo-supplier-sync/includes/class-mdo-accessories-catalog.php mdo-supplier-sync/mdo-supplier-sync.php
          git commit -m 'Reconoce tablas jamoneras como accesorios'
          git push origin HEAD:main

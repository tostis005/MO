name: Fix jamoneras both one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jamoneras-both-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: elmercado-supplier-sync-staging-deploy
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate classifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mdo-supplier-sync/includes/class-mdo-accessories-catalog.php')
          s=p.read_text()
          old="preg_match( '/\\bjamonero(?:s)?\\b/u', $title )"
          new="preg_match( '/\\bjamoner[oa](?:s)?\\b/u', $title )"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('mdo-supplier-sync/mdo-supplier-sync.php')
          s=p.read_text()
          assert s.count('Version: 1.0.9')==1
          assert s.count("MDO_SUPPLIER_SYNC_VERSION', '1.0.9")==1
          s=s.replace('Version: 1.0.9','Version: 1.0.10')
          s=s.replace("MDO_SUPPLIER_SYNC_VERSION', '1.0.9","MDO_SUPPLIER_SYNC_VERSION', '1.0.10")
          p.write_text(s)
          PY
          grep -q "private const VERSION        = '1.0.5'" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -Fq "jamoner[oa](?:s)?" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install and configure SSH
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage patched plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-jamoneras-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/plugin'"
          sshpass -e rsync -az --delete -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/plugin/"

      - name: Deploy classify and verify both environments
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -f "$dev_path/wp-config.php" ] && [ -f "$prod_path/wp-config.php" ] && [ -x "$php_bin" ]

          dev_target="$dev_path/wp-content/plugins/mdo-supplier-sync"
          prod_target="$prod_path/wp-content/plugins/mdo-supplier-sync"
          dev_backup="$dev_path/wp-content/plugins/.mdo-supplier-sync.jamoneras-${commit}"
          prod_backup="$prod_path/wp-content/plugins/.mdo-supplier-sync.jamoneras-${commit}"
          rm -rf "$dev_backup" "$prod_backup"
          cp -a "$dev_target" "$dev_backup"
          cp -a "$prod_target" "$prod_backup"

          restore_tables() {
            wp_path="$1"; a="$2"; b="$3"; c="$4"
            script="/tmp/emdo-restore-$$.php"
            cat > "$script" <<PHP
          <?php
          ini_set('memory_limit','512M');
          if(!defined('WP_MEMORY_LIMIT')) define('WP_MEMORY_LIMIT','512M');
          if(!defined('WP_MAX_MEMORY_LIMIT')) define('WP_MAX_MEMORY_LIMIT','512M');
          require '${wp_path}/wp-load.php';
          \$default=(int)get_option('default_product_cat',0);
          foreach(array(${a},${b},${c}) as \$id){
            \$p=wc_get_product(\$id); if(!\$p instanceof WC_Product) continue;
            \$attrs=\$p->get_attributes(); unset(\$attrs['pa_tipo-producto']);
            \$p->set_attributes(\$attrs); if(\$default>0) \$p->set_category_ids(array(\$default)); \$p->save();
            if(taxonomy_exists('pa_tipo-producto')) wp_remove_object_terms(\$id,array('Jamonero'),'pa_tipo-producto');
          }
          PHP
            "$php_bin" -d memory_limit=512M "$script" >/dev/null 2>&1 || true
            rm -f "$script"
          }

          rollback() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo 'QA failed; restoring plugin files and table assignments.' >&2
              restore_tables "$dev_path" 11382 11391 11397
              restore_tables "$prod_path" 12566 12575 12581
              rm -rf "$dev_target" "$prod_target"
              mv "$dev_backup" "$dev_target"
              mv "$prod_backup" "$prod_target"
            else
              rm -rf "$dev_backup" "$prod_backup"
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          rsync -a --delete "$incoming/plugin/" "$dev_target/"
          rsync -a --delete "$incoming/plugin/" "$prod_target/"

          classify_verify() {
            env_name="$1"; wp_path="$2"; a="$3"; b="$4"; c="$5"; knife="$6"; false1="$7"; false2="$8"
            script="/tmp/emdo-check-${env_name}-$$.php"
            cat > "$script" <<PHP
          <?php
          ini_set('memory_limit','512M');
          if(!defined('WP_MEMORY_LIMIT')) define('WP_MEMORY_LIMIT','512M');
          if(!defined('WP_MAX_MEMORY_LIMIT')) define('WP_MAX_MEMORY_LIMIT','512M');
          require '${wp_path}/wp-load.php';
          foreach(array(${a},${b},${c}) as \$id){
            \$r=MDO_Accessories_Catalog::classify_product(\$id);
            if(empty(\$r['target']) || 'Jamonero'!==(string)(\$r['type']??'')) exit(31);
          }
          foreach(array(${a},${b},${c}) as \$id){
            \$p=wc_get_product(\$id); \$types=wp_get_post_terms(\$id,'pa_tipo-producto',array('fields'=>'names'));
            if(!\$p instanceof WC_Product || 'publish'!==\$p->get_status() || !\$p->is_in_stock() || !has_term('accesorios','product_cat',\$id) || is_wp_error(\$types) || \$types!==array('Jamonero')) exit(32);
            if(in_array((int)get_option('default_product_cat',0),\$p->get_category_ids(),true)) exit(33);
          }
          \$kt=wp_get_post_terms(${knife},'pa_tipo-producto',array('fields'=>'names'));
          if(!has_term('accesorios','product_cat',${knife}) || is_wp_error(\$kt) || \$kt!==array('Cuchillo')) exit(34);
          foreach(array(${false1},${false2}) as \$id){
            \$types=wp_get_post_terms(\$id,'pa_tipo-producto',array('fields'=>'names'));
            if(has_term('accesorios','product_cat',\$id) || (!is_wp_error(\$types) && array_intersect(array('Jamonero','Cuchillo'),\$types))) exit(35);
          }
          \$cat=get_term_by('slug','accesorios','product_cat'); if(!\$cat instanceof WP_Term) exit(36);
          \$objects=get_objects_in_term((int)\$cat->term_id,'product_cat'); if(is_wp_error(\$objects)) exit(37);
          \$published=array(); foreach(array_unique(array_map('intval',\$objects)) as \$id){ if('publish'===get_post_status(\$id)) \$published[]=\$id; }
          sort(\$published); \$expected=array(${a},${b},${c},${knife}); sort(\$expected);
          if(\$published!==\$expected){ fwrite(STDERR,'Published taxonomy members: '.wp_json_encode(\$published)."\n"); exit(38); }
          echo wp_json_encode(array('environment'=>'${env_name}','published'=>\$published,'jamoneros'=>array(${a},${b},${c}),'cuchillo'=>${knife},'term_link'=>get_term_link(\$cat)),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
            result="$("$php_bin" -d memory_limit=512M "$script")"
            rm -f "$script"
            echo "$env_name QA: $result"
          }

          classify_verify DEVELOPMENT "$dev_path" 11382 11391 11397 11403 11379 11415
          classify_verify PRODUCTION "$prod_path" 12566 12575 12581 12587 12563 12599
          echo 'JAMONERAS_BOTH_ENVIRONMENTS_QA=passed'
          rm -rf "$dev_backup" "$prod_backup" "$incoming"
          trap - EXIT HUP INT TERM
          REMOTE

      - name: Persist classifier fix in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mdo-supplier-sync/includes/class-mdo-accessories-catalog.php mdo-supplier-sync/mdo-supplier-sync.php
          git commit -m 'Reconoce tablas jamoneras como accesorios'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Home hero vendors upper audit 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-hero-vendors-upper-audit-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit live responsive hero after final cascade
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          : "${CHROME:?Chrome/Chromium not found}"
          npm install --no-save --silent puppeteer-core@24.16.0
          CHROME_BIN="$CHROME" RUN_ID="$GITHUB_RUN_ID" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const widths = [992, 1024, 1025, 1100, 1180, 1181, 1280, 1366, 1440, 1600];
          (async () => {
            const browser = await puppeteer.launch({executablePath: process.env.CHROME_BIN, headless:true, args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
            try {
              let bad = [];
              for (const width of widths) {
                const page = await browser.newPage();
                await page.setViewport({width,height:1400,deviceScaleFactor:1});
                await page.goto(`https://www.elmercadodeorigen.com/?mdo_upper_audit=${process.env.RUN_ID}-${width}`, {waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector('.emo-hero__visual--vendors.emo-vendor-count-5',{timeout:30000});
                await new Promise(r => setTimeout(r, 1200));
                const data = await page.evaluate(() => {
                  const visual = document.querySelector('.emo-hero__visual--vendors.emo-vendor-count-5');
                  const grid = document.querySelector('.emo-hero__grid');
                  const finalStyle = document.querySelector('#elmercado-home-hero-vendors-fluid-20260904');
                  const vr = visual.getBoundingClientRect(), gr=grid?.getBoundingClientRect();
                  const cards = [...visual.querySelectorAll('.emo-hero-card')].map(card => {
                    const r=card.getBoundingClientRect(), fig=card.querySelector('figure'), fr=fig?.getBoundingClientRect(), img=card.querySelector('img'), ir=img?.getBoundingClientRect(), cap=card.querySelector('figcaption'), cps=cap?getComputedStyle(cap):null, is=img?getComputedStyle(img):null, fs=fig?getComputedStyle(fig):null;
                    return {name:card.querySelector('figcaption strong')?.textContent?.trim()||'',x:Math.round(r.x),y:Math.round(r.y),width:Math.round(r.width),height:Math.round(r.height),ratio:+(r.width/Math.max(1,r.height)).toFixed(2),figWidth:fr?Math.round(fr.width):0,figHeight:fr?Math.round(fr.height):0,imgWidth:ir?Math.round(ir.width):0,imgHeight:ir?Math.round(ir.height):0,imgCssHeight:is?.height||'',figCssHeight:fs?.height||'',objectFit:is?.objectFit||'',captionDisplay:cps?.display||'',captionVisibility:cps?.visibility||'',captionOpacity:cps?.opacity||''};
                  });
                  return {finalStylePresent:!!finalStyle,finalStyleParent:finalStyle?.parentElement?.tagName||'',mq1180:matchMedia('(max-width:1180px)').matches,mq1181:matchMedia('(min-width:1181px)').matches,grid:gr?{width:Math.round(gr.width),height:Math.round(gr.height),columns:getComputedStyle(grid).gridTemplateColumns}:null,visual:{x:Math.round(vr.x),y:Math.round(vr.y),width:Math.round(vr.width),height:Math.round(vr.height),columns:getComputedStyle(visual).gridTemplateColumns,rows:getComputedStyle(visual).gridTemplateRows},cards};
                });
                console.log('HERO_UPPER_GEOMETRY',width,JSON.stringify(data));
                if(!data.finalStylePresent) bad.push(`${width}: final style missing`);
                if(data.cards.length!==5) bad.push(`${width}: card count ${data.cards.length}`);
                for(const c of data.cards){
                  if(c.width<100||c.height<100) bad.push(`${width}: ${c.name} too small ${c.width}x${c.height}`);
                  if(c.objectFit!=='cover') bad.push(`${width}: ${c.name} object-fit ${c.objectFit}`);
                  if(c.captionDisplay==='none'||c.captionVisibility==='hidden'||c.captionOpacity==='0') bad.push(`${width}: ${c.name} caption hidden`);
                }
                const m=data.cards.find(c=>c.name==='Montjam'), half=data.cards.find(c=>c.name==='1957');
                if(!m||!half) bad.push(`${width}: required cards missing`);
                else {
                  if(width<=1180 && m.width < half.width*1.7) bad.push(`${width}: Montjam not spanning both columns (${m.width} vs ${half.width})`);
                  if(width>=1181 && m.ratio<1.7) bad.push(`${width}: Montjam too tall/narrow ratio=${m.ratio}`);
                }
                await page.close();
              }
              if(bad.length){ console.error('HERO_UPPER_AUDIT_PROBLEMS',JSON.stringify(bad)); process.exitCode=1; }
              else console.log('HERO_UPPER_AUDIT_SUCCESS');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: Home hero vendors upper audit 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-hero-vendors-upper-audit-20260904.yml'
      - 'elmercadodeorigen-child/inc/wcfm-disabled-vendor-visibility-010210.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit live six-vendor hero geometry
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          : "${CHROME:?Chrome/Chromium not found}"
          npm install --no-save --silent puppeteer-core@24.16.0
          CHROME_BIN="$CHROME" RUN_ID="$GITHUB_RUN_ID" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const widths = [390, 768, 1024, 1180, 1366, 1440];
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
            });
            try {
              let bad=[];
              for (const width of widths) {
                const page = await browser.newPage();
                await page.setCacheEnabled(false);
                await page.setExtraHTTPHeaders({'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'});
                await page.setViewport({width,height:1400,deviceScaleFactor:1});
                await page.goto(`https://www.elmercadodeorigen.com/?mdo_vendor_browser=${process.env.RUN_ID}-${width}`, {waitUntil:'networkidle2',timeout:60000});
                await page.waitForSelector('.emo-hero__visual--vendors',{timeout:30000});
                await new Promise(r=>setTimeout(r,800));
                const data=await page.evaluate(()=>{
                  const visual=document.querySelector('.emo-hero__visual--vendors');
                  const vr=visual.getBoundingClientRect();
                  const vs=getComputedStyle(visual);
                  const cards=[...visual.querySelectorAll('.emo-hero-card')].map((card,index)=>{
                    const r=card.getBoundingClientRect();
                    const s=getComputedStyle(card);
                    const img=card.querySelector('img');
                    const ir=img?.getBoundingClientRect();
                    const is=img?getComputedStyle(img):null;
                    const cap=card.querySelector('figcaption');
                    const cs=cap?getComputedStyle(cap):null;
                    const intersects=(
                      r.right>vr.left && r.left<vr.right &&
                      r.bottom>vr.top && r.top<vr.bottom
                    );
                    return {
                      index:index+1,
                      name:card.querySelector('figcaption strong')?.textContent?.trim()||'',
                      href:card.href,
                      display:s.display,
                      visibility:s.visibility,
                      opacity:s.opacity,
                      position:s.position,
                      x:Math.round(r.x),y:Math.round(r.y),
                      width:Math.round(r.width),height:Math.round(r.height),
                      imgWidth:ir?Math.round(ir.width):0,
                      imgHeight:ir?Math.round(ir.height):0,
                      objectFit:is?.objectFit||'',
                      captionDisplay:cs?.display||'',
                      intersectsVisual:intersects
                    };
                  });
                  return {
                    bodyClass:document.body.className,
                    visualClass:visual.className,
                    dataCount:visual.getAttribute('data-emo-vendor-count'),
                    visual:{
                      x:Math.round(vr.x),y:Math.round(vr.y),width:Math.round(vr.width),height:Math.round(vr.height),
                      display:vs.display,overflow:vs.overflow,columns:vs.gridTemplateColumns,rows:vs.gridTemplateRows
                    },
                    cards
                  };
                });
                console.log('HERO_VENDOR_BROWSER',width,JSON.stringify(data));
                if(data.cards.length!==6) bad.push(`${width}: card count ${data.cards.length}`);
                const names=data.cards.map(c=>c.name);
                for(const required of ['1957','Hidalgo de la Jara','La Huerta de Ana Mary','Montjam','Selectos de Castilla','Tolecarnes']){
                  if(!names.includes(required)) bad.push(`${width}: missing ${required}`);
                }
                for(const c of data.cards){
                  if(c.display==='none'||c.visibility==='hidden'||c.opacity==='0'||c.width<80||c.height<80||!c.intersectsVisual){
                    bad.push(`${width}: not visibly rendered ${c.name} ${c.display}/${c.visibility}/${c.opacity} ${c.width}x${c.height} intersects=${c.intersectsVisual}`);
                  }
                }
                await page.close();
              }
              if(bad.length){
                console.error('HERO_VENDOR_BROWSER_PROBLEMS',JSON.stringify(bad));
                process.exitCode=1;
              } else {
                console.log('HERO_VENDOR_BROWSER_SUCCESS');
              }
            } finally {
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: Experiment AdSense overlay-only code flag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-overlay-code-experiment-20260926.yml'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Test documented data-overlays behavior
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?overlay_experiment=1'

          o=Options(); o.page_load_strategy='none'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
              (() => {
                const f=window.fetch;
                window.fetch=function(input,init){
                  const u=typeof input==='string'?input:(input&&input.url)||'';
                  if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                    init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                    h.set('X-Country-Code','ZA');init.headers=h;
                  }
                  return f.call(this,input,init);
                };
                const ap=Node.prototype.appendChild;
                Node.prototype.appendChild=function(child){
                  try {
                    if(child && child.tagName==='SCRIPT' && String(child.src||'').includes('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js')){
                      child.setAttribute('data-overlays','bottom');
                      child.setAttribute('data-overlay-experiment','1');
                    }
                  } catch(e) {}
                  return ap.call(this,child);
                };
              })();"""})
              d.get(URL)
              time.sleep(9)
              state=d.execute_script(r"""
                return {
                  script:Array.from(document.scripts).filter(s=>(s.src||'').includes('adsbygoogle.js')).map(s=>({
                    overlays:s.getAttribute('data-overlays'),
                    experiment:s.getAttribute('data-overlay-experiment')
                  })),
                  autoPlaced:Array.from(document.querySelectorAll('.google-auto-placed')).map(el=>({
                    h:Math.round(el.getBoundingClientRect().height),
                    pos:getComputedStyle(el).position,
                    top:Math.round(el.getBoundingClientRect().top)
                  })),
                  anchors:Array.from(document.querySelectorAll('[data-anchor-status], ins.adsbygoogle')).filter(el=>{
                    const s=getComputedStyle(el);
                    return el.hasAttribute('data-anchor-status') || s.position==='fixed';
                  }).map(el=>({
                    anchor:el.getAttribute('data-anchor-status'),
                    pos:getComputedStyle(el).position,
                    h:Math.round(el.getBoundingClientRect().height)
                  }))
                };
              """)
              print('OVERLAY_BOTTOM='+json.dumps(state,sort_keys=True),flush=True)
          finally:
              d.quit()
          PY

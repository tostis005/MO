name: Verify Hidalgo About text v57

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-hidalgo-about-text-20260818-v57.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public body
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            curl -k -L -sS --connect-timeout 8 --max-time 35 https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/about/ -o /tmp/hidalgo57
            echo "current_story=$(grep -Fio "The story of" /tmp/hidalgo57 | wc -l)"
            echo "current_connected=$(grep -Fio "deeply connected to the Iberian pig" /tmp/hidalgo57 | wc -l)"
            echo "old_livestock=$(grep -Fio "livestock farmers" /tmp/hidalgo57 | wc -l)"
            echo "spanish_story=$(grep -Fio "La historia de" /tmp/hidalgo57 | wc -l)"
            echo "spanish_ganaderos=$(grep -Fio "Los ganaderos" /tmp/hidalgo57 | wc -l)"
            grep -oiE ".{0,160}(The story of|deeply connected to the Iberian pig|livestock farmers|five generations).{0,500}" /tmp/hidalgo57 | sed "s/<[^>]*>/ /g" | tr -s " " | head -8
          ' > runtime/hidalgo-about-v57.txt 2>&1
      - name: Commit verification
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add runtime/hidalgo-about-v57.txt
          git commit -m 'Verify Hidalgo English About text v57' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Locate staging catalog script source 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-catalog-script-source-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Locate exact observer loops
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          THEMES="$WP_PATH/wp-content/themes"
          echo '=== normalizing observer candidates ==='
          grep -RIn --include='*.php' -E 'if[[:space:]]*\([[:space:]]*normalizing[[:space:]]*\)[[:space:]]*return|normalizing[[:space:]]*=[[:space:]]*true' "$THEMES" 2>/dev/null | head -n 80 || true
          echo '=== polish MutationObserver candidates ==='
          grep -RIn --include='*.php' -E 'MutationObserver.*requestAnimationFrame\(polish\)|requestAnimationFrame\(polish\).*MutationObserver' "$THEMES" 2>/dev/null | head -n 80 || true
          echo '=== lockCounts candidates ==='
          grep -RIn --include='*.php' -E 'MutationObserver\(lockCounts\)|lockCounts.*MutationObserver' "$THEMES" 2>/dev/null | head -n 80 || true
          echo '=== exact source excerpts ==='
          files=$(grep -RIl --include='*.php' -E 'normalizing[[:space:]]*=[[:space:]]*true|MutationObserver.*requestAnimationFrame\(polish\)|MutationObserver\(lockCounts\)' "$THEMES" 2>/dev/null | sort -u | head -n 12 || true)
          for f in $files; do
            echo "--- $f ---"
            grep -n -B 45 -A 80 -E 'normalizing[[:space:]]*=[[:space:]]*true|MutationObserver.*requestAnimationFrame\(polish\)|MutationObserver\(lockCounts\)' "$f" | head -n 260 || true
          done
          REMOTE

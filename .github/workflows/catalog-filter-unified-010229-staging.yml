name: Catalog filter unified 0.10.233 staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/functions.php'
      - 'elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php'
      - 'elmercadodeorigen-child/inc/catalog-filter-unified-010229.php'
      - '.github/scripts/catalog-filter-unified-010229-browser.cjs'
      - '.github/workflows/catalog-filter-unified-010229-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://dev.elmercadodeorigen.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and retired layers
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/functions.php >/dev/null
          php -l elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php >/dev/null
          php -l elmercadodeorigen-child/inc/catalog-filter-unified-010229.php >/dev/null
          node --check .github/scripts/catalog-filter-unified-010229-browser.cjs
          grep -Fq "ELMERCADO_THEME_VERSION', '0.10.233'" elmercadodeorigen-child/functions.php
          grep -Fq "elmercado-catalog-filter-shared-interaction-010233" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          grep -Fq "elmercado-vendor-filter-lean-runtime-010233" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          grep -Fq "elmercado_catalog_remove_vendor_legacy_ui_010233" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          ! grep -q "vendor-store-catalog-layout-lock-010225.php" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          ! grep -q "vendor-store-shop-parity-010226.php" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          ! grep -q "catalog-filter-stability-010228.php" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          grep -q "vendor-sticky-root-fix-010228.php" elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
      - name: Wait for development deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            shop="$(curl -fsSL --max-time 25 "${BASE_URL}/tienda/?qa-unified=${GITHUB_RUN_ID}-${i}" || true)"
            vendor="$(curl -fsSL --max-time 25 "${BASE_URL}/tienda/hidalgo-de-la-jara/?qa-unified=${GITHUB_RUN_ID}-${i}" || true)"
            if grep -Fq 'elmercado-catalog-filter-shared-interaction-010233' <<<"${shop}" \
              && grep -Fq 'elmercado-catalog-filter-shared-interaction-010233' <<<"${vendor}" \
              && grep -Fq 'elmercado-vendor-filter-lean-runtime-010233' <<<"${vendor}" \
              && ! grep -Fq 'elmercado-vendor-store-catalog-010225' <<<"${vendor}"; then
              echo CATALOG_FILTER_UNIFIED_LIVE_010233_OK
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Install Chrome and Puppeteer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Producer mobile drawer diagnostic
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage();
            await p.setViewport({width:390,height:844});
            await p.goto(`${process.env.BASE_URL}/tienda/hidalgo-de-la-jara/?emo_vendor_cat=embutidos-y-curados&qa-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('#elmercado-catalog-filter-shared-interaction-010233',{timeout:20000});
            await new Promise(r=>setTimeout(r,1500));
            const before=await p.evaluate(()=>({
              body:document.body.className,
              toggles:[...document.querySelectorAll('.emo-filter-toggle-shared-010229')].map(n=>({connected:n.isConnected,html:n.outerHTML,parent:n.parentElement?.className||''})),
              shells:[...document.querySelectorAll('.emo-filter-shell-shared-010229')].map(n=>({connected:n.isConnected,hidden:n.hidden,parent:n.parentElement?.tagName||''})),
              lean:!!document.getElementById('elmercado-vendor-filter-lean-runtime-010233'),
              unified:!!document.getElementById('elmercado-catalog-filter-unified-script-010229'),
              rail:!!document.querySelector('#wcfmmp-store .emo-filter-rail-shared-010229'),
              railParent:document.querySelector('#wcfmmp-store .emo-filter-rail-shared-010229')?.parentElement?.className||''
            }));
            console.log('PRODUCER_MOBILE_DRAWER_BEFORE',JSON.stringify(before));
            if(before.toggles.length) await p.click('.emo-filter-toggle-shared-010229');
            await new Promise(r=>setTimeout(r,250));
            const after=await p.evaluate(()=>({
              url:location.href,
              toggles:[...document.querySelectorAll('.emo-filter-toggle-shared-010229')].map(n=>({expanded:n.getAttribute('aria-expanded'),connected:n.isConnected})),
              shells:[...document.querySelectorAll('.emo-filter-shell-shared-010229')].map(n=>({hidden:n.hidden,connected:n.isConnected,html:n.outerHTML.slice(0,300)})),
              railParent:document.querySelector('#wcfmmp-store .emo-filter-rail-shared-010229')?.parentElement?.className||''
            }));
            console.log('PRODUCER_MOBILE_DRAWER_AFTER',JSON.stringify(after));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Exact browser parity QA
        run: |
          set -euo pipefail
          node .github/scripts/catalog-filter-unified-010229-browser.cjs

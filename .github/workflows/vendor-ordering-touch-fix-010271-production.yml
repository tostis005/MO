name: Vendor ordering touch fix 0.10.271 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-ordering-touch-fix-010271-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-test-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate payload
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-touch-fix-010271.php >/dev/null

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy touch helper
        id: deploy
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          TARGET="$MU_DIR/elmercado-vendor-ordering-touch-fix-010271.php"
          REMOTE="/tmp/elmercado-vendor-ordering-touch-fix-010271-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-touch-fix-010271.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -euo pipefail
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$REMOTE' >/dev/null
            mkdir -p '$MU_DIR'; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'
            grep -Fq 'elmercado-vendor-ordering-touch-fix-010271' '$TARGET'
            wp_bin=\$(command -v wp || true); [ -n \"\$wp_bin\" ] && \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "
          PROBE="elmercado-opcache-ordering-touch-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          curl -fsSL --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID" >/dev/null || true
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" || true

      - name: Confirm helper rendered
        id: render
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL --max-time 30 -A 'Mozilla/5.0 EMDO ordering touch verifier' -H 'Cache-Control: no-store' "$BASE_URL/tienda/1957/?ordering-touch=$GITHUB_RUN_ID-$i" -o /tmp/live.html || true
            if grep -Fq 'elmercado-vendor-ordering-touch-fix-010271' /tmp/live.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1

      - name: Real mobile ordering interaction and destination diagnostic
        id: browser
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node <<'NODE' > /tmp/ordering-touch-result.json
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const die=(m,d)=>{throw new Error(m+' '+JSON.stringify(d));};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setCacheEnabled(false);
            await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await page.goto(`${process.env.BASE_URL}/tienda/1957/?ordering-touch-browser=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select',{timeout:30000});
            await sleep(700);
            const before=await page.evaluate(()=>{
              const s=document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select');
              const r=s.getBoundingClientRect(); const cs=getComputedStyle(s); const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
              return {marker:!!document.getElementById('elmercado-vendor-ordering-touch-fix-010271'),value:s.value,index:s.selectedIndex,rect:{left:r.left,top:r.top,width:r.width,height:r.height},pointer:cs.pointerEvents,topIsSelect:top===s,showPicker:typeof s.showPicker==='function'};
            });
            if(!before.marker||!before.topIsSelect||before.pointer!=='auto')die('select precondition failed',before);
            await page.touchscreen.tap(before.rect.left+before.rect.width/2,before.rect.top+before.rect.height/2);
            await sleep(350);
            const focused=await page.evaluate(()=>document.activeElement===document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select'));
            if(!focused)die('touch still does not focus ordering select',{before,focused});
            const oldUrl=page.url();
            await page.keyboard.press('ArrowDown');
            await page.keyboard.press('Enter');
            await sleep(1800);
            const after=await page.evaluate(()=>{const s=document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select');return{value:s?.value||null,index:s?.selectedIndex??null}}).catch(()=>({value:null,index:null}));
            const changed=page.url()!==oldUrl||after.value!==before.value||after.index!==before.index;
            if(!changed)die('ordering selection did not change after real tap',{oldUrl,newUrl:page.url(),before,after});

            const diagnoseDestination=async path=>{
              const p=await browser.newPage(); await p.setCacheEnabled(false); await p.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
              await p.goto(`${process.env.BASE_URL}${path}?destination-diagnostic=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000}); await sleep(700);
              const data=await p.evaluate(()=>{
                const explicit=document.querySelector('[data-mdo-toolbar-destination], .mdo-catalog-toolbar__destination');
                const matches=[...document.querySelectorAll('button,a,div,span')].filter(el=>{const t=(el.textContent||'').trim(); return /Envío\s+a|Shipping\s+to|España/i.test(t) && t.length<120;}).slice(0,20).map(el=>({tag:el.tagName,id:el.id||'',class:String(el.className||''),text:(el.textContent||'').trim(),html:el.outerHTML.slice(0,500)}));
                return {explicit:explicit?explicit.outerHTML.slice(0,1000):null,matches};
              });
              await p.close(); return data;
            };
            const destination1957=await diagnoseDestination('/tienda/1957/');
            const destinationHidalgo=await diagnoseDestination('/tienda/hidalgo-de-la-jara/');
            console.log(JSON.stringify({ok:true,before,focused,after,newUrl:page.url(),destination1957,destinationHidalgo}));
            await browser.close();
          })().catch(err=>{console.error(JSON.stringify({ok:false,error:String(err.stack||err)}));process.exit(1)});
          NODE
          cat /tmp/ordering-touch-result.json

      - name: Record result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          mkdir -p .deploy-status
          payload=''
          if [ -f /tmp/ordering-touch-result.json ]; then payload=$(tr -d '\n' < /tmp/ordering-touch-result.json | sed 's/"/\\"/g'); fi
          printf '{"status":"%s","run_id":"%s","sha":"%s","deploy":"%s","render":"%s","browser":"%s","payload":"%s"}\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$DEPLOY_RESULT" "$RENDER_RESULT" "$BROWSER_RESULT" "$payload" > .deploy-status/vendor-ordering-touch-fix-010271-production.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/vendor-ordering-touch-fix-010271-production.json
          git commit -m "Record vendor ordering touch verification $GITHUB_RUN_ID" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

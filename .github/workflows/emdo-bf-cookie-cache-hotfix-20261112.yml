name: EMDO fix Black Friday cookie cache bypass and crawler add-to-cart 20261112
on:
  push:
    branches: [diagnostics/emdo-live-performance-20261112]
    paths: ['.github/workflows/emdo-bf-cookie-cache-hotfix-20261112.yml']
permissions:
  contents: read
concurrency:
  group: emdo-bf-cookie-cache-hotfix-20261112
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolated PHP regressions for cookies, visitors, cart and crawler behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=elmercadodeorigen-child/dropins/advanced-cache.php
          php -l "$FILE"
          grep -Fq "'emdo_bf2026_curtain_last_seen'" "$FILE"
          grep -Fq 'X-EMDO-Bot-Cart-Guard: REDIRECT' "$FILE"
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/wp-content/uploads/elmercado-home-static"
          cp "$FILE" "$ROOT/wp-content/advanced-cache.php"
          python3 - "$ROOT" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])/'wp-content/uploads/elmercado-home-static/index.html'
          p.write_text('<html>EMDO_TEST_CACHE'+('x'*60000)+'</html>')
          PY
          cat > "$ROOT/router.php" <<'PHP'
          <?php
          define( 'ABSPATH', __DIR__ . '/' );
          require __DIR__ . '/wp-content/advanced-cache.php';
          header( 'X-Test-Fallback: BOOT' );
          echo 'EMDO_FALLBACK_BOOT';
          PHP
          php -S 127.0.0.1:8879 -t "$ROOT" "$ROOT/router.php" >/tmp/emdo-live-test.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -rf "$ROOT"' EXIT
          sleep 1
          H=$(mktemp); B=$(mktemp)
          request() { curl -ksS --max-time 5 -D "$H" -o "$B" -H 'Host: www.elmercadodeorigen.com' "$@" "http://127.0.0.1:8879/"; }
          hit() { grep -qi '^X-El-Mercado-Home-Early-Cache: HIT' "$H"; grep -q EMDO_TEST_CACHE "$B"; }
          bypass() { ! grep -qi '^X-El-Mercado-Home-Early-Cache: HIT' "$H"; grep -q EMDO_FALLBACK_BOOT "$B"; }
          request; hit; echo 'PASS anon cache'
          request -H 'Cookie: emdo_bf2026_curtain_last_seen=2026-11-12'; hit; echo 'PASS dismissed BF curtain remains cached'
          request -H 'Cookie: _ga=test'; hit; echo 'PASS analytics cookie remains cached'
          request -H 'Cookie: woocommerce_items_in_cart=1'; bypass; echo 'PASS cart bypass'
          request -H 'Cookie: wordpress_logged_in_test=1'; bypass; echo 'PASS logged-in bypass'
          request -H 'Cookie: private_customer_cookie=1'; bypass; echo 'PASS unknown cookie bypass'
          request -X POST; bypass; echo 'PASS POST bypass'
          request -H 'User-Agent: ClaudeBot/1.0' -G --data-urlencode 'add-to-cart=123'; grep -qi '^HTTP/1.1 302' "$H"; grep -qi '^X-EMDO-Bot-Cart-Guard: REDIRECT' "$H"; echo 'PASS crawler add-to-cart short circuit'
          request -H 'User-Agent: Mozilla/5.0' -G --data-urlencode 'add-to-cart=123'; bypass; echo 'PASS real customer action reaches WooCommerce'
          request -H 'Cookie: woocommerce_items_in_cart=1' -H 'User-Agent: ClaudeBot/1.0' -G --data-urlencode 'add-to-cart=123'; bypass; echo 'PASS stateful crawler not intercepted'
          touch -d '11 minutes ago' "$ROOT/wp-content/uploads/elmercado-home-static/index.html"
          request; bypass; echo 'PASS home TTL expiry'
          echo 'ALL_BF_CACHE_AND_BOT_GUARD_REGRESSIONS_PASSED'
      - name: Deploy guarded single-file patch and verify real production
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          OPT="-o StrictHostKeyChecking=no -o ConnectTimeout=12 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
          REMOTE_FILE="/tmp/emdo-bf-cookie-cache-$GITHUB_RUN_ID.php"
          sshpass -e scp $OPT -P "$STAGING_PORT" \
            elmercadodeorigen-child/dropins/advanced-cache.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_FILE"
          sshpass -e ssh $OPT -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "bash -s -- '$REMOTE_FILE'" <<'REMOTE'
          set -Eeuo pipefail
          SOURCE="$1"
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          TARGET="$ROOT/wp-content/advanced-cache.php"
          PHP=/opt/plesk/php/8.2/bin/php
          test "$(id -u)" -eq 0
          test -s "$TARGET" && test -s "$SOURCE" && test ! -L "$TARGET"
          "$PHP" -l "$SOURCE"
          python3 - "$TARGET" <<'PY'
          import hashlib,sys
          d=open(sys.argv[1],'rb').read()
          actual=hashlib.sha1(b'blob '+str(len(d)).encode()+b'\x00'+d).hexdigest()
          expected='3df50967cf966e22b473063c0894483aa4d68a59'
          assert actual==expected,f'Live dropin changed unexpectedly, refusing overwrite sha={actual}'
          print('BASELINE_EXACT_MATCH',actual)
          PY
          BACKUP="/root/emdo-bf-cookie-cache-20261112-$(date -u +%Y%m%dT%H%M%SZ).php"
          cp -p "$TARGET" "$BACKUP"
          CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$CHANGED" = 1; then
              cp -p "$BACKUP" "$TARGET"
              "$PHP" -l "$TARGET" || true
              echo 'ROLLBACK_COMPLETE'
            fi
            rm -f "$SOURCE" || true
            exit "$rc"
          }
          trap rollback EXIT
          NEW="$TARGET.hotfix-$$"
          cp -p "$TARGET" "$NEW"
          cat "$SOURCE" > "$NEW"
          "$PHP" -l "$NEW"
          mv -f "$NEW" "$TARGET"
          CHANGED=1
          "$PHP" -l "$TARGET"
          sleep 3
          BASE=https://www.elmercadodeorigen.com
          for endpoint in / /tienda/ /producto/jamon-de-bellota-100-iberico/; do
            echo "CHECK_PATH=$endpoint"
            matched=0
            for attempt in 1 2 3 4; do
              H=$(mktemp)
              code=$(curl -ksS --connect-timeout 3 --max-time 15 \
                -H 'Cookie: emdo_bf2026_curtain_last_seen=2026-11-12' \
                -D "$H" -o /dev/null -w "%{http_code} ttfb=%{time_starttransfer}s" "$BASE$endpoint")
              echo "BF_COOKIE_AFTER_FIX path=$endpoint attempt=$attempt $code"
              grep -Ei '^(x-el-mercado-(home-early-cache|hot-early-cache|product-early-cache)|x-emdo-public-cache):' "$H" | tr -d '\r' || true
              status=$(printf '%s' "$code" | cut -d' ' -f1)
              test "$status" = 200
              if test "$endpoint" = /; then grep -qi '^x-el-mercado-home-early-cache: HIT' "$H" && matched=1; fi
              if test "$endpoint" = /tienda/; then grep -qi '^x-el-mercado-hot-early-cache: HIT' "$H" && matched=1; fi
              if test "$endpoint" = /producto/jamon-de-bellota-100-iberico/; then grep -qi '^x-el-mercado-product-early-cache: HIT' "$H" && matched=1; fi
              rm -f "$H"
              if test "$matched" = 1; then break; fi
              sleep 1
            done
            test "$matched" = 1 || { echo 'CACHE_MISSED_AFTER_REVALIDATION'; exit 1; }
          done
          H=$(mktemp)
          code=$(curl -ksS --connect-timeout 3 --max-time 10 -H 'User-Agent: ClaudeBot/1.0 (+https://www.anthropic.com)' \
            -D "$H" -o /dev/null -w '%{http_code}' "$BASE/?add-to-cart=99999999")
          echo "CRAWLER_GUARD_HTTP=$code"
          test "$code" = 302
          grep -qi '^x-emdo-bot-cart-guard: REDIRECT' "$H"
          H2=$(mktemp)
          curl -ksS --connect-timeout 3 --max-time 15 -H 'Cookie: woocommerce_items_in_cart=1' \
            -D "$H2" -o /dev/null "$BASE/"
          if grep -qi '^x-el-mercado-home-early-cache: HIT' "$H2"; then
            echo 'UNSAFE_CART_CACHE';exit 1
          fi
          echo 'REAL_CART_BYPASS_OK'
          echo 'BF_CACHE_HOTFIX_DEPLOYED_AND_VERIFIED'
          REMOTE

name: Audit Adsterra-only production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-only-production-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium requests
      - name: Verify no Google ads and Adsterra requests
        shell: bash
        run: |
          python - <<'PY'
          import json,time,requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          BASE='https://www.elmercadodeorigen.com'
          JS=BASE+'/wp-content/themes/elmercadodeorigen-child/assets/js/adsterra-geo-010290.js?adsterra_only=010307'
          PAGE=BASE+'/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&adsterra_only=010307'

          deadline=time.time()+240
          while time.time()<deadline:
              try:
                  body=requests.get(JS,timeout=15,headers={'Cache-Control':'no-cache'}).text
              except Exception:
                  body=''
              if ('pagead2.googlesyndication.com' not in body
                  and 'loadGoogleAnchorScript' not in body
                  and 'adsensePublisher' not in body
                  and 'highrevenueformat.com' in body):
                  break
              time.sleep(5)
          else:
              raise SystemExit('Production did not serve Adsterra-only controller')

          expected={
            'desktop':[
              '4e02d145fdb84842713b24a4bade6244',
              '040427a877ae83cac71362a8c92eb779',
              'c1f547d5b9552a71fae2de32c69f2d66',
              'bd307b1985a219b2694f34d17ceebe8e',
              '985360811e3cd3c3d7d50e3a9ea81484',
              'a83b8ce6c354e77b2ae5f266936bd60f'
            ],
            'mobile':[
              '3de18866861c081d6eb282ad00fe2bee',
              'c1f547d5b9552a71fae2de32c69f2d66',
              'bd307b1985a219b2694f34d17ceebe8e',
              'a83b8ce6c354e77b2ae5f266936bd60f'
            ]
          }

          def audit(label,width,height):
              o=Options(); o.page_load_strategy='none'
              for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage',f'--window-size={width},{height}','--lang=en-US'):
                  o.add_argument(a)
              o.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
              d=webdriver.Chrome(options=o)
              try:
                  d.execute_cdp_cmd('Network.enable',{})
                  d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':r"""
                  (()=>{const f=window.fetch;window.fetch=function(input,init){
                    const u=typeof input==='string'?input:(input&&input.url)||'';
                    if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                      init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                      h.set('X-Country-Code','ZA');init.headers=h;
                    }
                    return f.call(this,input,init);
                  };})();
                  """})
                  d.get(PAGE+'&viewport='+label)
                  deadline=time.time()+20
                  while time.time()<deadline:
                      dbg=d.execute_script('return window.ElMercadoAdsterraGeoDebug||null')
                      if dbg and dbg.get('showAds') is True: break
                      time.sleep(.25)
                  else:
                      raise SystemExit(label+': ZA eligibility did not resolve')

                  for ratio in (0,.2,.4,.6,.8,1,0):
                      d.execute_script('window.scrollTo(0,Math.max(0,(document.documentElement.scrollHeight-window.innerHeight)*arguments[0]))',ratio)
                      time.sleep(.5)
                  time.sleep(8)

                  urls=[]
                  for item in d.get_log('performance'):
                      try: msg=json.loads(item['message'])['message']
                      except Exception: continue
                      if msg.get('method')!='Network.requestWillBeSent': continue
                      urls.append(msg.get('params',{}).get('request',{}).get('url',''))

                  google=[u for u in urls if (
                    'pagead2.googlesyndication.com/pagead/' in u
                    or 'googleads.g.doubleclick.net' in u
                    or '/pagead/ads' in u
                  )]
                  adsterra=sorted(set(u for u in urls if 'highrevenueformat.com' in u or 'profitableratecpmnetwork.com' in u))
                  dom=d.execute_script(r"""
                    return {
                      googleScripts:Array.from(document.scripts).map(s=>s.src||'').filter(u=>/pagead2\.googlesyndication\.com|googleads\.g\.doubleclick\.net/.test(u)),
                      googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length,
                      adsbygoogle:document.querySelectorAll('ins.adsbygoogle').length,
                      debug:window.ElMercadoAdsterraGeoDebug||null,
                      slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map(s=>({
                        type:s.getAttribute('data-emo-adsterra-slot'),
                        unit:s.getAttribute('data-emo-adsterra-unit'),
                        size:s.getAttribute('data-emo-adsterra-size'),
                        state:s.getAttribute('data-emo-adsterra-state'),
                        display:getComputedStyle(s).display,
                        h:Math.round(s.getBoundingClientRect().height)
                      }))
                    };
                  """)
                  result={'googleRequests':google,'adsterraRequests':adsterra,'dom':dom}
                  print(label.upper()+'='+json.dumps(result,sort_keys=True),flush=True)

                  if google or dom['googleScripts'] or dom['googleAutoPlaced'] or dom['adsbygoogle']:
                      raise SystemExit(label+': Google advertising still present')
                  for key in expected[label]:
                      if not any(key in u for u in adsterra):
                          raise SystemExit(label+': missing Adsterra request '+key)
              finally:
                  d.quit()

          audit('desktop',1440,1000)
          audit('mobile',390,844)
          print('ADSTERRA_ONLY_PRODUCTION=PASS',flush=True)
          PY

name: Fix Huerta recent products production 20260824

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-huerta-new-products-20260824.php'
      - 'mu-plugins/mdo-huerta-title-quality-20260824.php'
      - '.github/workflows/fix-huerta-new-products-production-20260824.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        shell: bash
        run: |
          php -l .github/scripts/fix-huerta-new-products-20260824.php
          php -l mu-plugins/mdo-huerta-title-quality-20260824.php

      - name: Deploy guard and repair production products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SCRIPT="/tmp/fix-huerta-new-products-${GITHUB_RUN_ID}.php"
          REMOTE_WRAPPER="/tmp/run-fix-huerta-new-products-${GITHUB_RUN_ID}.php"
          REMOTE_GUARD="/tmp/mdo-huerta-title-quality-${GITHUB_RUN_ID}.php"
          LOCAL_WRAPPER="/tmp/run-fix-huerta-new-products-${GITHUB_RUN_ID}.php"

          printf '%s\n' \
            '<?php' \
            '$GLOBALS["table"] = MDO_Database::table("source_products");' \
            "require '$REMOTE_SCRIPT';" > "$LOCAL_WRAPPER"
          php -l "$LOCAL_WRAPPER"

          sshpass -e scp $SCP_OPTIONS .github/scripts/fix-huerta-new-products-20260824.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          sshpass -e scp $SCP_OPTIONS "$LOCAL_WRAPPER" "$STAGING_USER@$STAGING_HOST:$REMOTE_WRAPPER"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-huerta-title-quality-20260824.php "$STAGING_USER@$STAGING_HOST:$REMOTE_GUARD"

          mkdir -p .deploy-status
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            cp '$REMOTE_GUARD' '$PROD_PATH/wp-content/mu-plugins/mdo-huerta-title-quality-20260824.php'
            rm -f '$REMOTE_GUARD'

            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-huerta-title-quality-20260824.php' >/dev/null
            \"\$php_bin\" -l '$REMOTE_WRAPPER' >/dev/null
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_WRAPPER' --path='$PROD_PATH' --allow-root
            code=\$?
            rm -f '$REMOTE_SCRIPT' '$REMOTE_WRAPPER'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            exit \$code
          " > .deploy-status/huerta-new-products-fix-20260824.txt 2>&1
          CODE=$?
          set -e
          echo "$CODE" > .deploy-status/huerta-new-products-fix-20260824.exit-code
          cat .deploy-status/huerta-new-products-fix-20260824.txt

      - name: Record production result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/huerta-new-products-fix-20260824.txt .deploy-status/huerta-new-products-fix-20260824.exit-code || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record Huerta recent product fix 20260824 [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Verify repair succeeded
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-status/huerta-new-products-fix-20260824.exit-code
          test "$(cat .deploy-status/huerta-new-products-fix-20260824.exit-code)" = "0"
          grep -q '^huerta_new_products_fix_ok recent=4 old_encoding_cleanup=1 categories_ok=4 unit_price_labels=0 encoding_issues=0$' .deploy-status/huerta-new-products-fix-20260824.txt

name: Audit production AdSense geo prerequisites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-geo-audit-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Inspect production WordPress setup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?production path not found}"
          echo "PROD_PATH_FOUND"

          theme_path=$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo get_stylesheet_directory();' --path="$prod_path" --allow-root)
          echo "THEME_BASENAME=$(basename "$theme_path")"
          echo "--- LIVE THEME VERSION ---"
          grep -n "ELMERCADO_THEME_VERSION" "$theme_path/functions.php" | head -n1 || true
          echo "LIVE_FUNCTIONS_SHA256=$(sha256sum "$theme_path/functions.php" | awk '{print $1}')"

          echo "--- COOKIE PLUGIN ---"
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin get cookie-law-info --path="$prod_path" --fields=name,status,version --format=json --allow-root || true

          echo "--- WOOCOMMERCE GEO DEFAULT ---"
          "$php_bin" -d memory_limit=512M "$wp_bin" option get woocommerce_default_customer_address --path="$prod_path" --allow-root || true

          echo "--- SHIPPING ZONES ---"
          "$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            if (!class_exists("WC_Shipping_Zones")) { echo "NO_WOOCOMMERCE\n"; return; }
            $zones = WC_Shipping_Zones::get_zones();
            foreach ($zones as $z) {
              echo "ZONE|" . $z["zone_id"] . "|" . $z["zone_name"] . "\n";
              foreach ($z["zone_locations"] as $loc) echo "LOCATION|" . $loc->type . "|" . $loc->code . "\n";
              foreach ($z["shipping_methods"] as $method) echo "METHOD|" . $method->id . "|" . $method->instance_id . "|" . ($method->enabled === "yes" ? "yes" : "no") . "\n";
            }
            $rest = new WC_Shipping_Zone(0);
            echo "ZONE|0|" . $rest->get_zone_name() . "\n";
            foreach ($rest->get_shipping_methods(false) as $method) echo "METHOD|" . $method->id . "|" . $method->instance_id . "|" . ($method->enabled === "yes" ? "yes" : "no") . "\n";
          ' || true
          REMOTE

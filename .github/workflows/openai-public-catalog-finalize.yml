name: Finalize OpenAI Public Catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-public-catalog-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          php -l mdo-supplier-sync/includes/openai/class-mdo-openai-catalog-hardening.php
          php -l mdo-supplier-sync/includes/openai/class-mdo-openai-strict-snapshot.php
          php -l tools/openai-revert-wrong-montjam-images.php
          php -l tools/openai-commerce-public-catalog-qa.php
          php -l tools/openai-commerce-runtime-qa.php

      - name: Deploy and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          RUN_DIR="/tmp/openai-public-finalize-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$RUN_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            mdo-supplier-sync/mdo-supplier-sync.php \
            mdo-supplier-sync/includes/openai/class-mdo-openai-catalog-hardening.php \
            mdo-supplier-sync/includes/openai/class-mdo-openai-strict-snapshot.php \
            tools/openai-revert-wrong-montjam-images.php \
            tools/openai-commerce-public-catalog-qa.php \
            tools/openai-commerce-runtime-qa.php \
            "$STAGING_USER@$STAGING_HOST:$RUN_DIR/"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$RUN_DIR'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          RUN_DIR="$2"
          PLUGIN="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)

          cp "$RUN_DIR/class-mdo-openai-strict-snapshot.php" "$PLUGIN/includes/openai/class-mdo-openai-strict-snapshot.php"
          cp "$RUN_DIR/class-mdo-openai-catalog-hardening.php" "$PLUGIN/includes/openai/class-mdo-openai-catalog-hardening.php"
          cp "$RUN_DIR/mdo-supplier-sync.php" "$PLUGIN/mdo-supplier-sync.php"

          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$PROD_PATH" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '$s=mdo_openai_settings_20260909();$s["format"]="native_jsonl_gz";$p=mdo_openai_provider_20260909($s);echo "PROVIDER ".get_class($p)."\n";if(!$p instanceof MDO_OpenAI_Strict_Snapshot_Provider_20260910)exit(2);' --path="$PROD_PATH" --allow-root

          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file "$RUN_DIR/openai-revert-wrong-montjam-images.php" --path="$PROD_PATH" --allow-root

          PUBLIC_JSON="$RUN_DIR/public-qa.json"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$RUN_DIR/openai-commerce-public-catalog-qa.php" --path="$PROD_PATH" --allow-root >"$PUBLIC_JSON"
          "$php_bin" -r '$j=json_decode(file_get_contents($argv[1]),true);if(!is_array($j)||empty($j["ok"]))exit(2);$s=$j["stats"]??[];$g=$j["generation"]??[];printf("PUBLIC_QA expected=%d feed=%d simple=%d variants=%d imageless=%d disabled_vendor_parents=%d disabled_vendor_items=%d missing=%d unexpected=%d retired=%d errors=%d warnings=%d\n",$s["expected_items"]??0,$s["feed_items"]??0,$s["eligible_simple_items"]??0,$s["eligible_variant_items"]??0,$s["imageless_items"]??0,$s["disabled_vendor_parents"]??0,$s["disabled_vendor_items"]??0,$s["missing_from_feed"]??0,$s["unexpected_in_feed"]??0,$s["retired_rows"]??0,$g["errors"]??0,$g["warnings"]??0);foreach((array)($j["disabled_vendors"]??[]) as $id=>$login)printf("DISABLED_VENDOR %s %s\n",$id,$login);foreach((array)($j["imageless"]??[]) as $x)printf("IMAGELESS %d parent=%d sku=%s name=%s\n",$x["product_id"]??0,$x["parent_id"]??0,$x["sku"]??"",$x["name"]??"");' "$PUBLIC_JSON"

          RUNTIME_JSON="$RUN_DIR/runtime-qa.json"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$RUN_DIR/openai-commerce-runtime-qa.php" --path="$PROD_PATH" --allow-root >"$RUNTIME_JSON"
          "$php_bin" -r '$j=json_decode(file_get_contents($argv[1]),true);if(!is_array($j))exit(2);printf("RUNTIME_QA checks=%d failures=%d exportable=%d catalog_errors=%d warnings=%d\n",$j["summary"]["checks"]??0,$j["summary"]["failures"]??0,$j["catalog"]["exportable"]??0,$j["catalog"]["errors"]??0,$j["catalog"]["warnings"]??0);if(empty($j["summary"]["ok"])||(int)($j["summary"]["failures"]??-1)!==0||(int)($j["catalog"]["errors"]??-1)!==0)exit(3);' "$RUNTIME_JSON"

          FEED_PATH=$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo mdo_openai_feed_path_20260909("native_jsonl_gz");' --path="$PROD_PATH" --allow-root)
          gzip -t "$FEED_PATH"
          "$php_bin" -r '$f=gzopen($argv[1],"rb");if(!$f)exit(2);$n=0;$bad=0;while(!gzeof($f)){$line=trim((string)gzgets($f));if($line==="")continue;$r=json_decode($line,true);if(!is_array($r))exit(3);$n++;if(($r["is_eligible_search"]??true)===false)$bad++;if(trim((string)($r["image_url"]??""))==="")exit(4);}gzclose($f);printf("PHYSICAL_FEED rows=%d ineligible_rows=%d\n",$n,$bad);if($bad!==0)exit(5);' "$FEED_PATH"

          "$php_bin" -d memory_limit=512M "$wp_bin" eval '$s=mdo_openai_settings_20260909();if((string)$s["delivery"]!=="none"||(string)$s["auto_upload"]!=="0")exit(2);echo "DELIVERY disabled\n";' --path="$PROD_PATH" --allow-root
          code=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/openai-public.txt -w '%{http_code}' 'https://www.elmercadodeorigen.com/emdo-feed/openai/mercado-de-origen-products.jsonl.gz')
          test "$code" = '404'
          echo "PUBLIC_FEED_GUARD HTTP_404"

          for url in 'https://www.elmercadodeorigen.com/' 'https://www.elmercadodeorigen.com/tienda/' 'https://www.elmercadodeorigen.com/blog/' 'https://www.elmercadodeorigen.com/categorias/' 'https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/'; do
            code=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/health.html -w '%{http_code}' "$url")
            test "$code" = '200'
            ! grep -Eqi 'critical error|fatal error|there has been a critical error' /tmp/health.html
            echo "HTTP_200 $url"
          done
          rm -rf "$RUN_DIR"
          REMOTE

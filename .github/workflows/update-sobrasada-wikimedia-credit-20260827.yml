name: Update sobrasada Wikimedia image and attribution 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update-sobrasada-wikimedia-credit-20260827.php'
      - '.github/workflows/update-sobrasada-wikimedia-credit-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sobrasada-wikimedia-credit-20260827
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate updater
        run: php -l .github/scripts/update-sobrasada-wikimedia-credit-20260827.php

      - name: Update production image and attribution
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-sobrasada-credit-${GITHUB_RUN_ID}.php
          sshpass -e scp $SCP .github/scripts/update-sobrasada-wikimedia-credit-20260827.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval 'require \"$REMOTE\";' --path='$PROD' --allow-root; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -f '$REMOTE'" | tee /tmp/sobrasada-credit-report.txt
          grep -Fq '"updated": true' /tmp/sobrasada-credit-report.txt
          grep -Fq 'wikimedia-jonathan-pincas-sobrasada-y-pan-6211126857' /tmp/sobrasada-credit-report.txt
          grep -Fq '"license": "CC BY 2.0"' /tmp/sobrasada-credit-report.txt

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' db query \"SELECT p.ID,t.meta_value,s.meta_value,c.meta_value,l.meta_value FROM wp_posts p JOIN wp_postmeta k ON k.post_id=p.ID AND k.meta_key='_emdo_authority_key' AND k.meta_value='iberian-sobrasada-guide' JOIN wp_postmeta t ON t.post_id=p.ID AND t.meta_key='_thumbnail_id' JOIN wp_postmeta s ON s.post_id=CAST(t.meta_value AS UNSIGNED) AND s.meta_key='_emdo_image_source_key' JOIN wp_postmeta c ON c.post_id=CAST(t.meta_value AS UNSIGNED) AND c.meta_key='_emdo_image_creator' JOIN wp_postmeta l ON l.post_id=CAST(t.meta_value AS UNSIGNED) AND l.meta_key='_emdo_image_license' WHERE p.post_status='publish';\" --skip-column-names --path='$PROD' --allow-root" | tee /tmp/sobrasada-credit-db.txt
          grep -Fq 'wikimedia-jonathan-pincas-sobrasada-y-pan-6211126857' /tmp/sobrasada-credit-db.txt
          grep -Fq 'Jonathan Pincas' /tmp/sobrasada-credit-db.txt
          grep -Fq 'CC BY 2.0' /tmp/sobrasada-credit-db.txt

      - name: Verify public ES and EN attribution
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; marker="$2"; f=/tmp/sobrasada-credit-page.html; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO attribution verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$f" -w '%{http_code}' "$url?sobcredit=$stamp"); test "$c" = 200; grep -Fq "EMDO_AUTHORITY_BATCH14:$marker" "$f"; grep -Fq 'Jonathan Pincas' "$f"; grep -Fq 'CC BY 2.0' "$f"; grep -Fq 'creativecommons.org/licenses/by/2.0/' "$f"; grep -Fq 'commons.wikimedia.org/wiki/File:Sobrasada_y_pan.jpg' "$f"; }
          check "$BASE/sobrasada-iberica-que-es-como-se-elabora-que-mirar-al-comprarla/" iberian-sobrasada-guide
          check "$BASE/en/iberian-sobrasada-what-it-is-how-made-what-to-look-for-when-buying/" iberian-sobrasada-guide

      - name: Persist image source and credits in batch 14 data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('.github/data/editorial-authority-batch14-20260826/02-sobrasada-iberica.php')
          s=p.read_text(encoding='utf-8')
          image="""'image'=>array(\n'id'=>'wikimedia-jonathan-pincas-sobrasada-y-pan-6211126857','direct'=>'https://upload.wikimedia.org/wikipedia/commons/4/42/Sobrasada_y_pan.jpg','page'=>'https://commons.wikimedia.org/wiki/File:Sobrasada_y_pan.jpg','photographer'=>'Jonathan Pincas','license'=>'CC BY 2.0','license_url'=>'https://creativecommons.org/licenses/by/2.0/','alt_es'=>'Sobrasada tradicional servida con pan','alt_en'=>'Traditional sobrasada served with bread'),\n"""
          pat=re.compile(r"'image'=>array\(\n.*?\),\n(?='content'=>)",re.S)
          s,n=pat.subn(image,s,count=1)
          if n!=1: raise SystemExit(f'Could not replace sobrasada image block: {n}')

          credit_es='<p class="emdo-image-credit"><small>Imagen destacada: <a href="https://commons.wikimedia.org/wiki/File:Sobrasada_y_pan.jpg" rel="noopener noreferrer">Jonathan Pincas / Wikimedia Commons</a>, licencia <a href="https://creativecommons.org/licenses/by/2.0/" rel="license noopener noreferrer">CC BY 2.0</a>. La web puede mostrar una versión redimensionada o recortada para adaptarla al diseño.</small></p>'
          credit_en='<p class="emdo-image-credit"><small>Featured image: <a href="https://commons.wikimedia.org/wiki/File:Sobrasada_y_pan.jpg" rel="noopener noreferrer">Jonathan Pincas / Wikimedia Commons</a>, licensed under <a href="https://creativecommons.org/licenses/by/2.0/" rel="license noopener noreferrer">CC BY 2.0</a>. The site may display a resized or cropped version to fit the layout.</small></p>'
          s=re.sub(r'\s*<p class="emdo-image-credit">.*?</p>\s*','\n',s,flags=re.S)
          es_target='[products limit="4" columns="4" category="__CURED_MEATS__"]\nHTML,\n\'en_content\''
          if es_target not in s: raise SystemExit('Spanish products marker not found')
          s=s.replace(es_target,credit_es+'\n[products limit="4" columns="4" category="__CURED_MEATS__"]\nHTML,\n\'en_content\'',1)
          en_target='[products limit="4" columns="4" category="__CURED_MEATS__"]\nHTML,\n);'
          if en_target not in s: raise SystemExit('English products marker not found')
          s=s.replace(en_target,credit_en+'\n[products limit="4" columns="4" category="__CURED_MEATS__"]\nHTML,\n);',1)
          p.write_text(s,encoding='utf-8')

          pub=Path('.github/scripts/publish-editorial-authority-batch14-20260826.php')
          q=pub.read_text(encoding='utf-8')
          old="if($w<1200||$h<700){throw new RuntimeException($a['key'].': image too small '.$w.'x'.$h);}" 
          new="if($w<1000||$h<700){throw new RuntimeException($a['key'].': image too small '.$w.'x'.$h);}" 
          if old in q:
              q=q.replace(old,new,1)
              pub.write_text(q,encoding='utf-8')
          elif new not in q:
              raise SystemExit('Could not update batch 14 image minimum safely')
          PY
          php -l .github/data/editorial-authority-batch14-20260826/02-sobrasada-iberica.php
          php -l .github/scripts/publish-editorial-authority-batch14-20260826.php
          grep -Fq 'Jonathan Pincas' .github/data/editorial-authority-batch14-20260826/02-sobrasada-iberica.php
          grep -Fq 'CC BY 2.0' .github/data/editorial-authority-batch14-20260826/02-sobrasada-iberica.php
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data/editorial-authority-batch14-20260826/02-sobrasada-iberica.php .github/scripts/publish-editorial-authority-batch14-20260826.php
          git commit -m 'Persist sobrasada Wikimedia attribution [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

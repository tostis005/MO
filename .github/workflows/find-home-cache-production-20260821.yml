name: Locate production homepage cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-home-cache-production-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate cache implementation
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          mkdir -p reports
          REPORT=reports/home-cache-production-20260821.txt
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            PROD_PATH=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;; esac
            done
            echo "PROD_PATH=$PROD_PATH"
            test -n "$PROD_PATH"
            echo "=== cache header sources ==="
            grep -RIl --exclude-dir=uploads --exclude-dir=node_modules --exclude="*.log" -E "x-el-mercado-cache|x-el-mercado-home-fresh|X-El-Mercado-Cache|X-El-Mercado-Home-Fresh" "$PROD_PATH/wp-content" 2>/dev/null | head -50 || true
            echo "=== advanced-cache ==="
            if [ -f "$PROD_PATH/wp-content/advanced-cache.php" ]; then
              ls -l "$PROD_PATH/wp-content/advanced-cache.php"
              sed -n "1,260p" "$PROD_PATH/wp-content/advanced-cache.php" | sed -E "s/(password|secret|token|key)[[:space:]]*=[^;]*/\1=[REDACTED]/Ig"
            else
              echo "NO_ADVANCED_CACHE"
            fi
            echo "=== cache directories ==="
            find "$PROD_PATH/wp-content" -maxdepth 3 -type d \( -iname "*cache*" -o -iname "cache" \) -print 2>/dev/null | head -80
          ' | tee "$REPORT"
      - name: Persist report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/home-cache-production-20260821.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record production homepage cache diagnostic [skip ci]'
          git pull --rebase origin main || true
          git push origin HEAD:main

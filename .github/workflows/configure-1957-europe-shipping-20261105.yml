name: Raise only 1957 existing EUR20 EU shipping rates to EUR25
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-1957-europe-shipping-20261105.yml'
      - '.github/scripts/configure-1957-europe-shipping-20261105.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: configure-1957-europe-shipping-20261105
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify 1957 EU rates in production
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/configure-1957-europe-shipping-20261105.php
          test -n "${STAGING_HOST:-}"
          test -n "${STAGING_USER:-}"
          test -n "${STAGING_PASSWORD:-}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php_bin" "$wp_bin"; break ;;
              esac
            done
          ')"
          test -n "$INFO"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE_SCRIPT="/tmp/configure-1957-eu-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/configure-1957-europe-shipping-20261105.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE_SCRIPT" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD' '$PHP' '$WP' '$REMOTE_SCRIPT'" <<'REMOTE' | tee /tmp/1957-europe-shipping-apply.log
          set -Eeuo pipefail
          prod="$1"; php="$2"; wp="$3"; script="$4"
          export PATH="$(dirname "$php"):$PATH"
          for phase in audit apply verify; do
            MDO_1957_EU_SHIPPING_MODE="$phase" "$php" -d memory_limit=1536M "$wp" eval-file "$script" --path="$prod" --allow-root
          done
          REMOTE
          test "$(grep -c '^1957_EU_SHIPPING_RESULT=' /tmp/1957-europe-shipping-apply.log)" = 3
          grep -q '"mode":"verify"' /tmp/1957-europe-shipping-apply.log
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configure-1957-europe-shipping-20261105
          path: /tmp/1957-europe-shipping-apply.log
          retention-days: 10
          if-no-files-found: warn

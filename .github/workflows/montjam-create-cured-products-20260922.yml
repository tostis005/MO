name: Montjam cured products 2026-09-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/montjam-create-cured-products-20260922.yml'
      - '.github/scripts/montjam-create-cured-products-20260922.php'
      - '.deploy-triggers/montjam-create-cured-products-20260922.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate creator
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/montjam-create-cured-products-20260922.php >/dev/null
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Download temporary product images
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/montjam-lomo.jpg 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1588-820e-b76c-acd1329440d7/raw?se=2026-09-22T10%3A25%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=2e6e2aff-e2b9-51ab-ad3d-e1e1ef938c26&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T09%3A48%3A26Z&ske=2026-09-23T09%3A48%3A26Z&sks=b&skv=2026-02-06&sig=VR2cQSeupyvqSbdEZI0l%2FTTTTpuzrhBk5GLwjySx53E%3D'
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/montjam-chorizo.jpg 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6838-820e-bce2-4fa79d82bb28/raw?se=2026-09-22T10%3A25%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=153ac124-09b4-5fcd-806a-5ac7e3b6d4ac&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T09%3A48%3A26Z&ske=2026-09-23T09%3A48%3A26Z&sks=b&skv=2026-02-06&sig=suHGPka4mA88OAVTfibT1Lo5XU7kXabjutxvcb6e1kg%3D'
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/montjam-salchichon.jpg 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a314-820e-b652-dea4083acece/raw?se=2026-09-22T10%3A25%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=7f77b684-cdf6-56f1-80ac-a8ec06db1b44&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T08%3A54%3A14Z&ske=2026-09-23T08%3A54%3A14Z&sks=b&skv=2026-02-06&sig=BVLbVbdLQFBkdJpFsNuW39JAJLwJAtVpWBTV9yPN3DM%3D'
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/montjam-jabuguito.jpg 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e47c-820e-b2ff-5ae7f866e3b5/raw?se=2026-09-22T10%3A25%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=fd5942d6-f50d-59c4-b3a9-c2490eb8419c&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T09%3A22%3A19Z&ske=2026-09-23T09%3A22%3A19Z&sks=b&skv=2026-02-06&sig=ZLJ%2Fa1XKcA66CGSe%2B0yMR%2B8bQEnzmmcispftRCvCfZ4%3D'
          for n in lomo chorizo salchichon jabuguito; do
            test -s "/tmp/montjam-$n.jpg"
            file "/tmp/montjam-$n.jpg" | grep -qi 'JPEG image data'
          done

      - name: Create four Montjam products in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SCRIPT="/tmp/montjam-create-cured-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/montjam-create-cured-products-20260922.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          for n in lomo chorizo salchichon jabuguito; do
            sshpass -e scp $SCP_OPTIONS "/tmp/montjam-$n.jpg" "$STAGING_USER@$STAGING_HOST:/tmp/montjam-$n.jpg"
          done

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_SCRIPT' /tmp/montjam-lomo.jpg /tmp/montjam-chorizo.jpg /tmp/montjam-salchichon.jpg /tmp/montjam-jabuguito.jpg; exit \$rc"

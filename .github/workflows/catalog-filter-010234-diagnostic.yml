name: Catalog filter 0.10.234 diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-filter-010234-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Inspect staging vendor route
        env:
          BASE_URL: https://dev.elmercadodeorigen.com
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setViewport({width:1440,height:1000});
            await p.goto(`${process.env.BASE_URL}/tienda/hidalgo-de-la-jara/?route-diag=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await new Promise(r=>setTimeout(r,1200));
            const d=await p.evaluate(()=>({
              href:location.href,
              body:document.body.className,
              hasStore:!!document.querySelector('#wcfmmp-store'),
              storeClass:document.querySelector('#wcfmmp-store')?.className||'',
              count:[...document.querySelectorAll('.woocommerce-result-count')].map(n=>(n.textContent||'').replace(/\s+/g,' ').trim()),
              products:[...document.querySelectorAll('#wcfmmp-store ul.products > li.product')].map(n=>({cls:n.className,title:(n.querySelector('.woocommerce-loop-product__title,h2,h3,.product-title')?.textContent||'').trim()})),
              filterText:(document.querySelector('#emo-vendor-filters')?.textContent||'').replace(/\s+/g,' ').trim().slice(0,500),
              loader:window.__emoCatalogLoaderState?{shown:window.__emoCatalogLoaderState.shown,nextUrl:window.__emoCatalogLoaderState.nextUrl,highestPage:window.__emoCatalogLoaderState.highestPage}:null
            }));
            console.log('VENDOR_ROUTE_DIAG_010234',JSON.stringify(d));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

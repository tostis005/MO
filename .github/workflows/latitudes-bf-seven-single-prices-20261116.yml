name: Set seven Black Friday Latitudes packs to a single displayed price
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/latitudes-bf-seven-single-prices-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latitudes-blackfriday-single-prices-production
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check WooCommerce seven price migration script
        run: |
          set -euo pipefail
          php -l .github/scripts/latitudes-bf-packs-single-price-20261116.php
          : "${STAGING_HOST:?missing host}"
          : "${STAGING_USER:?missing user}"
          : "${STAGING_PASSWORD:?missing password}"
      - name: Apply single product price on production and verify each pack
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          SITE="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${SITE:?Production root not found}"
          RUN="$GITHUB_RUN_ID"
          SCRIPT="/tmp/latitudes-single-price-$RUN.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/latitudes-bf-packs-single-price-20261116.php "$TARGET:$SCRIPT"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$SITE' '$SCRIPT'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; SCRIPT="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          MDO_BF_PACK_PRICE_MODE=preflight "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          MDO_BF_PACK_PRICE_MODE=apply "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          MDO_BF_PACK_PRICE_MODE=verify "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          REMOTE
          for KEY in pasaporte-salvaje reserva-de-caza safari-africano vuelta-al-mundo parrilla-sin-fronteras-xl universo-wagyu leyendas-del-vacuno; do
            CODE="$(curl -sSL --connect-timeout 10 --max-time 40 -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com/producto/pack-musee-$KEY-black-friday/")"
            echo "LIVE_SINGLE_PRICE_PRODUCT $KEY HTTP=$CODE"
            test "$CODE" = 200
          done
          echo "SEVEN_BF_LATITUDES_PUBLIC_SINGLE_PRICES_PUBLISHED_VERIFIED"

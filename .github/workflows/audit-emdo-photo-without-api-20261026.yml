name: Audit EMDO customer photos without APIs 2026-10-26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-emdo-photo-without-api-20261026.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || npx playwright install chromium >/dev/null 2>&1
      - name: Inspect Google Maps, Trustindex and Trustpilot photo data (read only)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import {chromium} from "playwright";
          const chromePath=["/usr/bin/google-chrome","/usr/bin/google-chrome-stable"].find(fs.existsSync);
          const browser=await chromium.launch(chromePath?{headless:true,executablePath:chromePath,args:["--no-sandbox","--disable-dev-shm-usage"]}:{headless:true});
          const context=await browser.newContext({locale:"es-ES",viewport:{width:1440,height:1100},userAgent:"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36"});
          const report={audit_utc:new Date().toISOString(),read_only:true,methods:"Playwright public browser no API credentials",sources:{}};
          const sleep=async(t)=>new Promise(r=>setTimeout(r,t));
          const page=await context.newPage();
          page.setDefaultTimeout(5000);
          async function navigate(label,url){
            try{
              const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:65000});
              await sleep(2500);
              return {status:response?.status()||0};
            }catch(error){return {error_type:error.name||"NavigationError",error_excerpt:String(error.message||error).slice(0,180)};}
          }
          async function consent(){
            for(const pattern of [/Aceptar todo/i,/Accept all/i,/Rechazar todo/i,/Reject all/i,/Agree/i]){
              try{const b=page.getByRole("button",{name:pattern}).first();if(await b.count()&&await b.isVisible()){await b.click({timeout:2500});await sleep(700);break;}}catch{}
            }
          }
          async function domSnapshot(){
            return page.evaluate(()=>{
              const cards=Array.from(document.querySelectorAll('[data-review-id],.jftiEf,[class*="review-item"],[class*="review-card"],[data-testid*="review"]'));
              const trustindexCards=Array.from(document.querySelectorAll('.ti-review-item'));
              const reviewImages=[],otherImages=[];
              for(const img of document.querySelectorAll('img')){
                const url=img.currentSrc||img.src||img.getAttribute("data-src")||"";
                const parent=img.closest('[data-review-id],.jftiEf,.ti-review-item,[class*="review-item"],[class*="review-card"]');
                const info={host:(()=>{try{return new URL(url,document.baseURI).hostname;}catch{return "";}})(),gallery_label:!!img.closest('[class*="gallery"],[class*="photo"],[class*="media"],[class*="attachment"]'),avatar_label:!!img.closest('[class*="avatar"],[class*="profile"],[class*="stars"],[class*="rating"],[class*="logo"]'),has_review_id:!!img.closest('[data-review-id]')};
                (parent?reviewImages:otherImages).push(info);
              }
              const nonavatar=reviewImages.filter(x=>!x.avatar_label);
              const reportAnchors=Array.from(document.querySelectorAll('a[href*="/review/report/"]'));
              const reportCards=reportAnchors.map(a=>a.closest('.ti-review-item,article,[class*="review-item"],[class*="review-card"],li')).filter(Boolean);
              const tiWithExtraImages=reportCards.filter(card=>Array.from(card.querySelectorAll('img')).some(img=>!img.closest('.ti-profile-img,.ti-stars,.ti-logo,[class*="avatar"],[class*="rating"],[class*="profile"]')));
              const galleryElements=document.querySelectorAll('[class*="review-photo"],[class*="review-image"],[class*="review-gallery"],[data-review-id] img,[data-review-id] a[href*="googleusercontent"]');
              const buttonLabels=Array.from(document.querySelectorAll('button,[role="button"],[role="tab"]')).map(x=>String(x.getAttribute("aria-label")||x.innerText||"").trim()).filter(x=>/reviews?|reseñas?|opiniones?|photos?|fotos?/i.test(x)).slice(0,14).map(x=>x.slice(0,65));
              return {
                title:document.title.slice(0,100), host:location.hostname,
                body_len:document.body?.innerText?.length||0,
                image_count:document.querySelectorAll('img').length, image_in_review_card_count:reviewImages.length,review_card_count:cards.length,
                images_in_card_not_avatar_or_stars:nonavatar.length,images_in_card_not_avatar_hosts:[...new Set(nonavatar.map(x=>x.host))].slice(0,12),
                image_gallery_selector_elements:galleryElements.length,
                trustindex_report_links:reportAnchors.length,trustindex_distinct_review_cards:new Set(reportCards).size,
                trustindex_review_cards_with_extra_images:tiWithExtraImages.length,
                media_in_review_context:reviewImages.filter(x=>x.gallery_label&&!x.avatar_label).length,
                review_ids_in_dom:document.querySelectorAll('[data-review-id]').length,
                google_review_cards:document.querySelectorAll('.jftiEf').length,
                google_review_panels:document.querySelectorAll('div[role="feed"]').length,
                button_labels:buttonLabels,
                image_hosts:[...new Set([...reviewImages,...otherImages].map(x=>x.host).filter(Boolean))].slice(0,12),
              };
            });
          }
          try{
            report.sources.trustindex={navigation:await navigate("trustindex","https://www.trustindex.io/reviews/www.elmercadodeorigen.com")};
            await consent();
            report.sources.trustindex.dom=await domSnapshot();
            console.log("TRUSTINDEX_DEEP_PHOTO_AUDIT",JSON.stringify(report.sources.trustindex));
          }catch(e){report.sources.trustindex.error_type=e.name;}
          try{
            const google="https://www.google.com/maps/place/?q=place_id:ChIJbbIJi58nQg0RgJroXR8DG_U&hl=es";
            report.sources.google_maps={navigation:await navigate("google_maps",google)};
            await consent();
            report.sources.google_maps.initial=await domSnapshot();
            const attempts=[];
            for(const pattern of [/305\\s*reseñas/i,/Todas las reseñas/i,/Reseñas de El Mercado de Origen/i,/^Reseñas$/i,/^Reviews$/i,/Ver todas las reseñas/i,/See all reviews/i,/opiniones/i]){
              try{
                const buttons=page.getByRole("button",{name:pattern});
                if(await buttons.count()){
                  const b=buttons.first();
                  if(await b.isVisible()){
                    await b.click({timeout:3500});
                    await sleep(1800);
                    attempts.push({button_pattern:String(pattern),clicked:true});
                    break;
                  }
                }
              }catch(e){attempts.push({button_pattern:String(pattern),error_type:e.name});}
            }
            for(let i=0;i<5;i++){
              const feeds=page.locator('[role="feed"]');
              if(await feeds.count()){
                await feeds.first().evaluate(el=>el.scrollTop=el.scrollHeight).catch(()=>{});
                await sleep(800);
              }else{
                await page.mouse.wheel(0,950);
                await sleep(650);
              }
            }
            report.sources.google_maps.button_attempts=attempts;
            report.sources.google_maps.after_reviews_and_scroll=await domSnapshot();
            report.sources.google_maps.card_media_structure=await page.evaluate(()=>{
              const cards=Array.from(document.querySelectorAll('.jftiEf')).slice(0,25);
              return {
                visible_card_count:cards.length,
                each_card:cards.map(card=>{
                  const imgs=Array.from(card.querySelectorAll('img')).map(img=>({
                    alt:(img.getAttribute('alt')||'').slice(0,80),
                    classes:img.className?.baseVal||img.className||'',
                    nearest_classes:img.parentElement?.parentElement?.className?.baseVal||img.parentElement?.parentElement?.className||'',
                    host:(()=>{try{return new URL(img.currentSrc||img.src).hostname;}catch{return '';}})(),
                    width:img.naturalWidth||0,height:img.naturalHeight||0,
                  }));
                  const photoButtons=Array.from(card.querySelectorAll('button')).filter(btn=>/foto|photo|image/i.test(btn.getAttribute('aria-label')||''));
                  const parseHost=(v)=>{try{const m=String(v||'').match(/url\\(["']?(https?:[^"')]+)/i);return m?new URL(m[1]).hostname:'';}catch{return '';}};
                  const info=photoButtons.map(btn=>{
                    const nodes=[btn,...Array.from(btn.querySelectorAll('*')).slice(0,30)];
                    const styled=nodes.filter(el=>getComputedStyle(el).backgroundImage!=='none');
                    return {
                      label:String(btn.getAttribute('aria-label')||'').slice(0,70),
                      class_name:String(btn.className||'').slice(0,70),
                      parent_class:String(btn.parentElement?.className||'').slice(0,70),
                      has_background_image:styled.length>0,
                      background_hosts:[...new Set(styled.map(el=>parseHost(getComputedStyle(el).backgroundImage)).filter(Boolean))],
                      inline_style_has_image:!!btn.querySelector('[style*="background-image"],[style*="background:"]'),
                      nested_img_count:btn.querySelectorAll('img').length,
                      accessible_id:!!btn.getAttribute('data-photo-id'),
                    };
                  });
                  const allStyled=Array.from(card.querySelectorAll('*')).filter(el=>getComputedStyle(el).backgroundImage!=='none');
                  const mediaHosts=[...new Set(allStyled.map(el=>parseHost(getComputedStyle(el).backgroundImage)).filter(Boolean))];
                  return {images:imgs,image_count:imgs.length,has_media_buttons:photoButtons.length,
                    photo_buttons:info.slice(0,12),styled_background_elements:allStyled.length,styled_background_hosts:mediaHosts,
                    review_id_present:!!card.getAttribute('data-review-id'),author_element:!!card.querySelector('.d4r55'),
                    text_element:!!card.querySelector('.wiI7pd,.MyEned,.review-full-text'),
                    review_id_prefix:(card.getAttribute('data-review-id')||'').slice(0,7)};
                
                }).slice(0,12),
                all_review_card_image_count:cards.reduce((n,c)=>n+c.querySelectorAll('img').length,0),
              };
            });
            console.log("GOOGLE_MAPS_DIRECT_PHOTO_AUDIT",JSON.stringify(report.sources.google_maps));
          }catch(e){report.sources.google_maps.error_type=e.name;report.sources.google_maps.error_excerpt=String(e.message||e).slice(0,180);}
          try{
            report.sources.trustpilot={navigation:await navigate("trustpilot","https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&page=1")};
            await consent();
            report.sources.trustpilot.dom=await domSnapshot();
            report.sources.trustpilot.rawReviewKeys=await page.evaluate(()=>{
              let data;
              try{data=JSON.parse(document.querySelector('#__NEXT_DATA__')?.textContent||'{}');}catch{return {error:"parse_error"}}
              const reviews=data?.props?.pageProps?.reviews||[];
              const topKeys=[...new Set(reviews.flatMap(x=>Object.keys(x)))].sort();
              const nonConsumerMediaFields=[];
              const paths={};
              function walk(node,prefix,depth){
                if(!node||typeof node!=="object"||depth>4)return;
                for(const [key,value] of Object.entries(node)){
                  const path=prefix?prefix+"."+key:key;
                  if(/photo|image|media|attachment|picture/i.test(key)){
                    paths[path]=(paths[path]||0)+1;
                    if(!path.startsWith("consumer.") && !/avatar/i.test(path))nonConsumerMediaFields.push(path);
                  }
                  if(value&&typeof value==="object"&&!Array.isArray(value))walk(value,path,depth+1);
                }
              }
              for(const review of reviews)walk(review,"",0);
              return {review_count:reviews.length,review_keys:topKeys,photo_candidate_key_paths:Object.entries(paths).sort((a,b)=>b[1]-a[1]).slice(0,24),nonconsumer_photo_keys:[...new Set(nonConsumerMediaFields)].slice(0,20)};
            });
            console.log("TRUSTPILOT_RAW_MEDIA_AUDIT",JSON.stringify(report.sources.trustpilot));
          }catch(e){report.sources.trustpilot.error_type=e.name;}
          await browser.close();
          fs.mkdirSync("diagnostics",{recursive:true});
          fs.writeFileSync("diagnostics/emdo-review-photos-no-api-diagnostic-20261026.json",JSON.stringify(report,null,2)+"\n");
          JS
      - name: Persist anonymized audit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/emdo-review-photos-no-api-diagnostic-20261026.json
          git commit -m 'Document direct Google Maps and Trustindex photo extraction diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

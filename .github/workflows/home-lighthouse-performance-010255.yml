name: Home Lighthouse performance 0.10.255

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-lighthouse-performance-010255.yml'

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Lighthouse mobile performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          : "${CHROME:?Chrome missing}"
          export CHROME_PATH="$CHROME"
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' \
            --only-categories=performance \
            --output=json \
            --output-path=/tmp/lhr.json \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --quiet
          python3 - <<'PY' > runtime/home-lighthouse-performance-010255.txt
          import json
          r=json.load(open('/tmp/lhr.json'))
          a=r['audits']; c=r['categories']['performance']
          print('performance_score=',round((c.get('score') or 0)*100))
          for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','render-blocking-resources','unused-css-rules','unused-javascript','uses-responsive-images','modern-image-formats']:
              x=a.get(k,{})
              print(f"{k}: numeric={x.get('numericValue')} display={x.get('displayValue')} score={x.get('score')}")
          print('--- layout audits ---')
          for k,v in a.items():
              if 'layout' not in k.lower() and 'shift' not in k.lower() and 'cls' not in k.lower():
                  continue
              print('audit=',k,'title=',v.get('title'),'display=',v.get('displayValue'),'score=',v.get('score'))
              details=v.get('details') or {}
              for item in (details.get('items') or [])[:30]:
                  print('layout_item=',json.dumps(item,ensure_ascii=False,separators=(',',':'))[:7000])
          print('--- lcp audits ---')
          for k,v in a.items():
              if 'lcp' in k.lower() or 'largest-contentful' in k.lower():
                  print('audit=',k,'title=',v.get('title'),'display=',v.get('displayValue'),'score=',v.get('score'))
                  details=v.get('details') or {}
                  for item in (details.get('items') or [])[:20]:
                      print('lcp_item=',json.dumps(item,ensure_ascii=False,separators=(',',':'))[:7000])
          print('--- bootup-time ---')
          items=((a.get('bootup-time',{}).get('details') or {}).get('items') or [])
          for x in sorted(items,key=lambda y:y.get('total',0),reverse=True)[:20]:
              print('bootup=',x.get('url'), 'total=',x.get('total'),'scripting=',x.get('scripting'),'parse=',x.get('scriptParseCompile'))
          print('--- long-tasks ---')
          items=((a.get('long-tasks',{}).get('details') or {}).get('items') or [])
          for x in sorted(items,key=lambda y:y.get('duration',0),reverse=True)[:25]:
              print('longtask=',x.get('url'),'duration=',x.get('duration'),'start=',x.get('startTime'))
          print('--- third-party-summary ---')
          items=((a.get('third-party-summary',{}).get('details') or {}).get('items') or [])
          for x in sorted(items,key=lambda y:y.get('mainThreadTime',0),reverse=True)[:20]:
              print('thirdparty=',x.get('entity'),'mainThread=',x.get('mainThreadTime'),'transfer=',x.get('transferSize'),'blocking=',x.get('blockingTime'))
          print('--- unused-javascript ---')
          items=((a.get('unused-javascript',{}).get('details') or {}).get('items') or [])
          for x in sorted(items,key=lambda y:y.get('wastedBytes',0),reverse=True)[:20]:
              print('unusedjs=',x.get('url'),'wasted=',x.get('wastedBytes'),'total=',x.get('totalBytes'),'wastedPercent=',x.get('wastedPercent'))
          print('--- mainthread ---')
          items=((a.get('mainthread-work-breakdown',{}).get('details') or {}).get('items') or [])
          for x in sorted(items,key=lambda y:y.get('duration',0),reverse=True):
              print('mainthread=',x.get('groupLabel') or x.get('group'),'duration=',x.get('duration'))
          PY
      - name: Record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-lighthouse-performance-010255.txt
          git commit -m 'Record Home CLS and LCP profile' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
# profile cls and lcp rerun

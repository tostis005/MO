name: Cancel superseded Pajarete onboarding attempt
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-superseded-pajarete-20261023.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/repos/$REPO/actions/runs/39934972334/cancel")"
          if [ "$result" = 202 ] || [ "$result" = 409 ]; then
            echo "Superseded run cancellation status: $result"
          else
            cat /tmp/cancel.json
            echo "Unable to cancel superseded run: $result" >&2
            exit 1
          fi

name: Audit visual de banners en directorio de productores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-producer-banner-source-20261020.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Examine actual producer banner images and layout
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null
          cat > inspect.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:1440,height:900});
              await page.goto('https://www.elmercadodeorigen.com/productores/?audit='+process.env.GITHUB_RUN_ID,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('#wcfmmp-stores-wrap li.wcfmmp-single-store',{timeout:25000});
              const headers=await page.evaluate(()=>{
                const out={};
                for(const [key,selector] of Object.entries({siteHeader:'.site-header',pageHeader:'.page-header',intro:'.emo-producers-intro',title:'h1',content:'.site-content',main:'.site-main'})){
                  const n=document.querySelector(selector);
                  if(n){
                    const cs=getComputedStyle(n),rect=n.getBoundingClientRect();
                    out[key]={tag:n.tagName,classes:n.className,style:n.getAttribute('style'),text:n.textContent?.trim().slice(0,130),bg:cs.backgroundColor,bgImage:cs.backgroundImage,opacity:cs.opacity,pseudoBefore:getComputedStyle(n,'::before').backgroundImage,rect:{top:rect.top,height:rect.height,width:rect.width}};
                  }
                }
                return out;
              });
              console.log('PRODUCER_HEADER_STYLES='+JSON.stringify(headers));
              const compareStyles=async(label,selector)=>{
                const data=await page.evaluate(selector=>{
                  const root=document.querySelector(selector);
                  if(!root)return null;
                  const nodes={root,kicker:root.querySelector('.emo-kicker'),title:root.querySelector('h2'),desc:root.querySelector('p')};
                  const out={};
                  for(const [key,n] of Object.entries(nodes)){
                    if(!n)continue;
                    const c=getComputedStyle(n),r=n.getBoundingClientRect();
                    out[key]={text:n.textContent?.trim().slice(0,85),tag:n.tagName,fontFamily:c.fontFamily,fontSize:c.fontSize,fontWeight:c.fontWeight,lineHeight:c.lineHeight,letterSpacing:c.letterSpacing,textTransform:c.textTransform,color:c.color,background:c.backgroundColor,bgImage:c.backgroundImage,padding:c.padding,margin:c.margin,border:c.border,borderRadius:c.borderRadius,boxShadow:c.boxShadow,display:c.display,gridTemplateColumns:c.gridTemplateColumns,rect:{width:r.width,height:r.height,top:r.top}};
                  }
                  return out;
                },selector);
                console.log('STYLES_'+label+'='+JSON.stringify(data));
              };
              await compareStyles('PRODUCERS','.emo-producers-intro');
              for(const slug of ['tienda','quienes-somos','contacto','blog']){
                const destination='https://www.elmercadodeorigen.com/'+slug+'/?audit='+process.env.GITHUB_RUN_ID;
                try{
                  await page.goto(destination,{waitUntil:'domcontentloaded',timeout:45000});
                  const diagnostic=await page.evaluate(()=>{
                    const selectors={siteHeader:'.site-header',pageHeader:'.page-header',pageTitle:'.page-header h1',primaryHeader:'h1',intro:'.emo-about-intro',contact:'.emo-contact-aside',shopTitle:'.emo-shop-title-block',shopLead:'.emo-shop-lead',articleHero:'.emo-journal-hero',main:'.site-main'};
                    const result={body:document.body.className,heading:[...document.querySelectorAll('h1,h2')].slice(0,7).map(n=>({type:n.tagName,text:n.textContent?.trim().slice(0,90)}))};
                    for(const [k,css] of Object.entries(selectors)){
                      const n=document.querySelector(css);
                      if(!n)continue;
                      const c=getComputedStyle(n),r=n.getBoundingClientRect();
                      result[k]={t:n.textContent?.trim().slice(0,105),display:c.display,color:c.color,background:c.backgroundColor,image:c.backgroundImage,pad:c.padding,margin:c.margin,columns:c.gridTemplateColumns,width:r.width,height:r.height,top:r.top};
                    }
                    return result;
                  });
                  console.log('REFERENCE_HEADER_'+slug.toUpperCase()+'='+JSON.stringify(diagnostic));
                  if(slug==='quienes-somos')await compareStyles('ABOUT','.emo-about-intro');
                  if(slug==='contacto')await compareStyles('CONTACT','.emo-contact-aside');
                }catch(e){console.log('REFERENCE_HEADER_ERROR_'+slug.toUpperCase()+'='+e.message)}
              }
              const snapshot=await page.evaluate(()=>{
                return [...document.querySelectorAll('#wcfmmp-stores-wrap li.wcfmmp-single-store')].map((card)=>{
                  const info=card.querySelector('.store-info'), content=card.querySelector('.store-content'), footer=card.querySelector('.store-footer'), img=[...card.querySelectorAll('img')];
                  return {name:card.querySelector('h2')?.textContent?.trim(),infoStyle:info?.getAttribute('style')?.slice(0,500),infoBackground:info?getComputedStyle(info).backgroundImage:null,contentBackground:content?getComputedStyle(content).backgroundImage:null,
                    images:img.map(i=>({src:i.currentSrc||i.src,alt:i.alt,natural:[i.naturalWidth,i.naturalHeight],visible:!!(i.offsetWidth||i.offsetHeight)})),
                    childNodes:[...footer.children].map(e=>({class:e.className,html:e.outerHTML.slice(0,400)})),links:[...card.querySelectorAll('a')].map(a=>({text:a.textContent?.trim(),href:a.href})).slice(0,5)};
                });
              });
              console.log('PRODUCER_BANNER_AUDIT='+JSON.stringify(snapshot));
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node inspect.cjs

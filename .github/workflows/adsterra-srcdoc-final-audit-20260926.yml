name: Audit restored Adsterra srcdoc rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-srcdoc-final-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Verify Adsterra visible wrappers and requests
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&srcdoc_final=1'
          o=Options(); o.page_load_strategy='none'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
              (()=>{const f=window.fetch;window.fetch=function(input,init){
                const u=typeof input==='string'?input:(input&&input.url)||'';
                if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                  init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                  h.set('X-Country-Code','ZA');init.headers=h;
                }
                return f.call(this,input,init);
              };})();"""})
              d.get(URL)
              time.sleep(4)
              d.execute_script('window.scrollTo(0, document.documentElement.scrollHeight)')
              time.sleep(2)
              state=d.execute_script(r"""
                const res=performance.getEntriesByType('resource').map(r=>r.name);
                return {
                  debug:window.ElMercadoAdsterraGeoDebug||null,
                  slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map((s,i)=>{
                    const f=s.querySelector('iframe[data-emo-adsterra-token]');
                    return {
                      i,
                      type:s.getAttribute('data-emo-adsterra-slot'),
                      state:s.getAttribute('data-emo-adsterra-state'),
                      hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                      eligible:s.classList.contains('is-eligible'),
                      display:getComputedStyle(s).display,
                      h:Math.round(s.getBoundingClientRect().height),
                      frameW:f?Number(f.getAttribute('width')||0):0,
                      frameH:f?Number(f.getAttribute('height')||0):0,
                      hasSrcdoc:!!(f&&f.getAttribute('srcdoc'))
                    };
                  }),
                  adsterraRequests:res.filter(x=>/highrevenueformat|profitableratecpmnetwork/.test(x)),
                  googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length
                };
              """)
              print('STATE='+json.dumps(state,sort_keys=True),flush=True)
              if not state['debug'] or state['debug'].get('showAds') is not True:
                  raise SystemExit('Eligibility failed')
              banners=[s for s in state['slots'] if s['type']!='native' and s['hydrated']=='1']
              if not banners or not all(s['eligible'] for s in banners):
                  raise SystemExit('Adsterra banners are not visible after srcdoc restore')
              if not all(s['hasSrcdoc'] for s in banners):
                  raise SystemExit('Some Adsterra banners are not using srcdoc')
              if len(state['adsterraRequests']) < 1:
                  raise SystemExit('No Adsterra request observed')
              print('SRC_DOC_ADSTERRA_AUDIT=PASS',flush=True)
          finally:
              d.quit()
          PY

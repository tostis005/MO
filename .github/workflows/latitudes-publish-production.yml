name: Latitudes - publicar borradores en producción

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/latitudes-publish-drafts.php'
      - '.github/workflows/latitudes-publish-production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Primero dry-run (sin cambios); publish publica los aptos"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - publish
      confirmation:
        description: "Para publish escribir exactamente PUBLICAR-LATITUDES"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: latitudes-production-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validar script sin tocar producción
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis PHP
        run: php -l .github/scripts/latitudes-publish-drafts.php
      - name: Verificar barreras de seguridad
        run: |
          grep -q "LATITUDES_MODE" .github/scripts/latitudes-publish-drafts.php
          grep -q "wp_update_post" .github/scripts/latitudes-publish-drafts.php
          grep -q "post_status' => 'draft'" .github/scripts/latitudes-publish-drafts.php

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    name: Comprobar y publicar solo borradores de Latitudes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Verificar autorización explícita
        shell: bash
        env:
          RUN_MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$RUN_MODE" in
            dry-run) echo "Diagnóstico: no se modificará ningún artículo." ;;
            publish)
              test "$CONFIRM" = 'PUBLICAR-LATITUDES' || {
                echo "Falta la confirmación exacta PUBLICAR-LATITUDES" >&2
                exit 1
              }
              ;;
            *) echo "Modo desconocido" >&2; exit 1 ;;
          esac

      - name: Obtener script WP-CLI versionado
        uses: actions/checkout@v4

      - name: Configurar SSH de producción sin mostrar credenciales
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_PORT: ${{ secrets.PRODUCTION_PORT }}
          PROD_USER: ${{ secrets.PRODUCTION_USER }}
          PROD_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PROD_HOST_KEYS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PROD_WP_PATH: ${{ secrets.PRODUCTION_WP_PATH }}
        run: |
          set -euo pipefail
          : "${PROD_HOST:?Configura el secret PRODUCTION_HOST}"
          : "${PROD_USER:?Configura el secret PRODUCTION_USER}"
          : "${PROD_KEY:?Configura el secret PRODUCTION_SSH_KEY}"
          : "${PROD_HOST_KEYS:?Configura el secret PRODUCTION_KNOWN_HOSTS con la huella validada}"
          : "${PROD_WP_PATH:?Configura el secret PRODUCTION_WP_PATH}"
          echo "Destino exclusivo: https://www.elmercadodeorigen.com (PRODUCCIÓN)"
          echo "Este workflow NO despliega en dev.elmercadodeorigen.com."
          PORT="${PROD_PORT:-22}"
          [[ "$PROD_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PROD_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$PROD_WP_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_KEY" > "$HOME/.ssh/latitudes_deploy_key"
          printf '%s\n' "$PROD_HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/latitudes_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/latitudes_deploy_key" >/dev/null
          echo "PROD_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Ejecutar revisión o publicación en WP-CLI del sitio real
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
          PROD_USER: ${{ secrets.PRODUCTION_USER }}
          PROD_WP_PATH: ${{ secrets.PRODUCTION_WP_PATH }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/latitudes_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PROD_PORT")
          REMOTE="$PROD_USER@$PROD_HOST"
          SCRIPT="/tmp/emo-latitudes-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"

          scp -i "$HOME/.ssh/latitudes_deploy_key" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -P "$PROD_PORT" \
            .github/scripts/latitudes-publish-drafts.php "$REMOTE:$SCRIPT"

          # Ejecutar la corrección únicamente contra la instalación real validada.
          "${SSH[@]}" "$REMOTE" \
            "sh -s -- '$PROD_WP_PATH' '$SCRIPT' '$RUN_MODE'" <<'REMOTE'
          set -eu
          wp_path="${1%/}"
          php_file="$2"
          mode="$3"
          trap 'rm -f "$php_file"' EXIT
          case "$wp_path" in
            /*) ;;
            *) echo "Ruta inválida" >&2; exit 1 ;;
          esac
          test -f "$wp_path/wp-config.php" || {
            echo "No se encontró wp-config.php en la ruta configurada" >&2
            exit 1
          }
          case "$wp_path" in
            */dev.elmercadodeorigen.com/*|*/staging/*|*/development/*)
              echo "ERROR: la ruta apunta a desarrollo, no a producción." >&2
              exit 1 ;;
          esac
          test -f "$php_file" || exit 1
          wp_bin="$(command -v wp || true)"
          test -n "$wp_bin" || { echo "WP-CLI no está disponible." >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          test -x "$php_bin" || { echo "PHP CLI no disponible." >&2; exit 1; }
          home="$( "$php_bin" -d memory_limit=512M "$wp_bin" option get home --path="$wp_path" --skip-plugins --skip-themes --allow-root )"
          siteurl="$( "$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$wp_path" --skip-plugins --skip-themes --allow-root )"
          case "$home" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) ;;
            *) echo "ERROR: WordPress home no es producción: $home" >&2; exit 1 ;;
          esac
          case "$siteurl" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) ;;
            *) echo "ERROR: siteurl no es producción: $siteurl" >&2; exit 1 ;;
          esac
          echo "WordPress producción validado: $home"
          LATITUDES_MODE="$mode" "$php_bin" -d memory_limit=512M "$wp_bin" \
            eval-file "$php_file" --path="$wp_path" --skip-themes --allow-root
          REMOTE

      - name: Verificar escaparate de PRODUCCIÓN tras publicar
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 \
            "https://www.elmercadodeorigen.com/tienda/?latitudes_verificacion=${GITHUB_RUN_ID}" \
            -o /tmp/latitudes-production-shop.html
          test -s /tmp/latitudes-production-shop.html
          echo "Respuesta HTTP 200 en www.elmercadodeorigen.com/tienda/ (bypass de caché con querystring)."
          echo "La comprobación HTTP no sustituye la lectura de RESUMEN ni confirma por sí sola que los productos sean visibles."

      - name: Resultado
        run: echo "Destino producción: www.elmercadodeorigen.com. Comprueba RESUMEN en los registros."

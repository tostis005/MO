name: Latitudes - activación en PRODUCCIÓN (138 referencias)

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/latitudes-publish-drafts.php'
      - '.github/workflows/latitudes-publish-production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run comprueba sin cambios; publish activa Latitudes en producción"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - publish
      confirmation:
        description: "Para publish escribir PUBLICAR-LATITUDES"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: emdo-latitudes-production-activation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar código PHP
        run: php -l .github/scripts/latitudes-publish-drafts.php

  activate:
    name: Preflight y publicación en WordPress producción
    needs: check
    # Los pushes realizan SOLO diagnóstico. Publicar exige workflow_dispatch.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
      MODE: ${{ github.event_name == 'push' && 'dry-run' || inputs.mode }}
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar modo de ejecución
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run) echo "Auditoría sin cambios." ;;
            publish)
              test "$CONFIRM" = 'PUBLICAR-LATITUDES' || {
                echo "Error: confirmation debe ser PUBLICAR-LATITUDES" >&2; exit 1;
              } ;;
            *) echo "Modo de ejecución desconocido" >&2; exit 1 ;;
          esac
          : "${HOST:?Falta STAGING_HOST; se usa para llegar al servidor de producción}"
          : "${USER:?Falta STAGING_USER}"
          : "${SSHPASS:?Falta STAGING_PASSWORD}"
          echo "Se buscará exclusivamente la instalación cuyo dominio sea www.elmercadodeorigen.com."

      - name: Instalar utilidades SSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Conectar con el servidor compartido y localizar exclusivamente PRODUCCIÓN
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=10 -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$PORT")
          SERVER="$USER@$HOST"

          # El nombre STAGING_HOST es histórico; no utilizar el WordPress dev.
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$SERVER" 'sh -s' <<'REMOTE'
          set -eu
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          test -n "$wp_bin" && test -n "$php_bin"
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            wp_path="$(dirname "$cfg")"
            url="$( "$php_bin" "$wp_bin" option get siteurl --path="$wp_path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true )"
            home="$( "$php_bin" "$wp_bin" option get home --path="$wp_path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true )"
            case "$url" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com)
                case "$home" in
                  https://www.elmercadodeorigen.com|https://elmercadodeorigen.com)
                    printf "%s" "$wp_path"; exit 0 ;;
                esac ;;
            esac
          done
          exit 1
          REMOTE
          )"
          test -n "$PROD_PATH" || { echo "No se localizó WordPress producción; dev NO se usa." >&2; exit 1; }
          echo "Instalación PRODUCCIÓN localizada."

          REMOTE_SCRIPT="/tmp/emdo-latitudes-activate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/latitudes-publish-drafts.php "$SERVER:$REMOTE_SCRIPT"
          sshpass -e ssh "${SSH[@]}" "$SERVER" \
            "sh -s -- '$PROD_PATH' '$REMOTE_SCRIPT' '$MODE'" <<'REMOTE'
          set -eu
          wp_path="$1"
          script="$2"
          mode="$3"
          trap 'rm -f "$script"' EXIT
          test -f "$wp_path/wp-config.php"
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php)"
          echo "Preflight de 138 referencias y zonas WCFM (NO modifica nada)"
          LATITUDES_MODE=dry-run "$php_bin" -d memory_limit=512M "$wp_bin" \
            eval-file "$script" --path="$wp_path" --skip-themes --allow-root
          if [ "$mode" = publish ]; then
            echo "Preflight correcto: comenzando publicación y activación de Latitudes."
            LATITUDES_MODE=publish "$php_bin" -d memory_limit=512M "$wp_bin" \
              eval-file "$script" --path="$wp_path" --skip-themes --allow-root
          fi
          REMOTE

      - name: Comprobar respuesta de tienda en producción
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 "https://www.elmercadodeorigen.com/tienda/?emdo-latitudes-check=${GITHUB_RUN_ID}" -o /tmp/emdo-latitudes-production.html
          test -s /tmp/emdo-latitudes-production.html
          echo "Producción responde 200; examinar registros LATITUDES_PUBLISHED y verificar los productos en el escaparate."

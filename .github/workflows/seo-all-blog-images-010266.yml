name: SEO all blog images 010266

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-all-blog-images-010266.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy, migrate and verify every blog image
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          THEME="$PROD/wp-content/themes/elmercadodeorigen-child"
          MU="$PROD/wp-content/mu-plugins/elmercado-blog-image-seo-010266.php"
          REMOTE="/tmp/emdo-blog-image-seo-${GITHUB_RUN_ID}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "[ -d '$THEME/inc' ] && mkdir -p '$REMOTE/backup' '$PROD/wp-content/mu-plugins'"
          sshpass -e scp $SCP \
            elmercadodeorigen-child/inc/blog-image-seo-010266.php \
            .github/scripts/blog-image-seo-bootstrap-010266.php \
            .github/scripts/seo-all-blog-images-010266.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            '$PHP' -l '$REMOTE/blog-image-seo-010266.php' >/dev/null
            '$PHP' -l '$REMOTE/blog-image-seo-bootstrap-010266.php' >/dev/null
            '$PHP' -l '$REMOTE/seo-all-blog-images-010266.php' >/dev/null
            if [ -f '$THEME/inc/blog-image-seo-010266.php' ]; then cp '$THEME/inc/blog-image-seo-010266.php' '$REMOTE/backup/module.php'; touch '$REMOTE/backup/module.existed'; fi
            if [ -f '$MU' ]; then cp '$MU' '$REMOTE/backup/mu.php'; touch '$REMOTE/backup/mu.existed'; fi
            install -m 0644 '$REMOTE/blog-image-seo-010266.php' '$THEME/inc/blog-image-seo-010266.php'
            install -m 0644 '$REMOTE/blog-image-seo-bootstrap-010266.php' '$MU'
            '$PHP' -l '$THEME/inc/blog-image-seo-010266.php' >/dev/null
            '$PHP' -l '$MU' >/dev/null
          "

          rollback='if [ -f "'$REMOTE'/backup/module.existed" ]; then cp "'$REMOTE'/backup/module.php" "'$THEME'/inc/blog-image-seo-010266.php"; else rm -f "'$THEME'/inc/blog-image-seo-010266.php"; fi; if [ -f "'$REMOTE'/backup/mu.existed" ]; then cp "'$REMOTE'/backup/mu.php" "'$MU'"; else rm -f "'$MU'"; fi'

          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/seo-all-blog-images-010266.php' --path='$PROD' --allow-root" > /tmp/blog-image-seo.json 2> /tmp/blog-image-seo.err
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            cat /tmp/blog-image-seo.err >&2 || true
            cat /tmp/blog-image-seo.json >&2 || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "$rollback; rm -rf '$REMOTE'" || true
            exit "$RC"
          fi

          cat /tmp/blog-image-seo.json
          if ! jq -e '.ok==true and .posts_scanned>0 and .unique_attachments>=1 and (.alt_added + .alt_preserved)==.unique_attachments and .unresolved==0 and (.blog_url|length)>0 and (.sample_post_url|length)>0' /tmp/blog-image-seo.json >/dev/null; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "$rollback; rm -rf '$REMOTE'" || true
            exit 20
          fi

          BLOG_URL="$(jq -r '.blog_url' /tmp/blog-image-seo.json)"
          POST_URL="$(jq -r '.sample_post_url' /tmp/blog-image-seo.json)"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' -d memory_limit=768M '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          HTTP="$(curl -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO image SEO verification' -o /tmp/blog.html -w '%{http_code}' "${BLOG_URL}?emdo_image_seo=${GITHUB_RUN_ID}")"
          POST_HTTP="$(curl -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO image SEO verification' -o /tmp/post.html -w '%{http_code}' "${POST_URL}?emdo_image_seo=${GITHUB_RUN_ID}")"
          if [ "$HTTP" != "200" ] || [ "$POST_HTTP" != "200" ] || ! grep -Eq 'loading=["'"']lazy["'"']' /tmp/blog.html || ! grep -Eq 'fetchpriority=["'"']high["'"']' /tmp/post.html; then
            echo "Public verification failed: blog=$HTTP post=$POST_HTTP" >&2
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "$rollback; rm -rf '$REMOTE'" || true
            exit 30
          fi

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          mkdir -p .deploy-status
          jq -n --arg generated_at "$(date -u +%FT%TZ)" --arg run_id "$GITHUB_RUN_ID" --arg source_sha "$GITHUB_SHA" --slurpfile migration /tmp/blog-image-seo.json \
            '{generated_at:$generated_at,run_id:($run_id|tonumber),source_sha:$source_sha,verified:true,migration:$migration[0]}' > .deploy-status/blog-image-seo-010266.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/blog-image-seo-010266.json
          git commit -m 'Record verified blog image SEO migration [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

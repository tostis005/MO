name: Remove Wrong Montjam Media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-wrong-montjam-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Delete only the three orphaned repair attachments
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"; wp_bin=$(command -v wp); php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $targets=[
              14447=>"https://www.iberuss.es/img/products/0000000607_0.jpg",
              14448=>"https://www.iberuss.es/img/products/0000000607_1.jpg",
              14449=>"https://www.iberuss.es/img/products/0000000587_0.jpg",
            ];
            foreach($targets as $aid=>$expected_source){
              $post=get_post($aid);
              if(!$post){echo "ALREADY_ABSENT ".$aid."\n";continue;}
              if("attachment"!==$post->post_type)throw new Exception("Target ID is no longer an attachment: ".$aid);
              $source=(string)get_post_meta($aid,"_montjam_source_url",true);
              if($source!==$expected_source)throw new Exception("Source guard failed for attachment ".$aid);
              $thumb_refs=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->postmeta} WHERE meta_key=\"_thumbnail_id\" AND meta_value=%s",(string)$aid));
              $gallery_refs=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->postmeta} WHERE meta_key=\"_product_image_gallery\" AND FIND_IN_SET(%s,meta_value)",(string)$aid));
              if($thumb_refs!==0||$gallery_refs!==0)throw new Exception("Attachment still referenced: ".$aid." refs=".($thumb_refs+$gallery_refs));
              $deleted=wp_delete_attachment($aid,true);
              if(!$deleted)throw new Exception("Could not delete attachment ".$aid);
              echo "DELETED ".$aid."\n";
            }
            foreach([14287,14301] as $pid){$p=wc_get_product($pid);if(!$p)throw new Exception("Missing product ".$pid);echo "PRODUCT ".wp_json_encode(["id"=>$pid,"image_id"=>(int)$p->get_image_id(),"gallery"=>array_map("absint",(array)$p->get_gallery_image_ids())])."\n";}
          ' --path="$PROD_PATH" --allow-root
          REMOTE
name: Request 010206 visible filter smoke

on:
  push:
    paths:
      - '.github/scripts/request-010206-visible-filter-smoke.cjs'
      - '.github/workflows/request-010206-visible-filter-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Validate smoke syntax
        run: node --check .github/scripts/request-010206-visible-filter-smoke.cjs
      - name: Review user-visible filter stability on staging
        run: node .github/scripts/request-010206-visible-filter-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-010206-visible-filter-smoke
          path: qa/
          retention-days: 14

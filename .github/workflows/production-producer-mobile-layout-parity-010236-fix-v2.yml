name: Production producer mobile layout parity 0.10.236 fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-producer-mobile-layout-parity-010236-fix-v2.yml'
      - 'elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-producer-mobile-layout-parity-010236-fix-v2
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php >/dev/null
          grep -Fq "vendorLabel.textContent='Filtros'" elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php
          grep -Fq "flex:1 1 0" elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php
          grep -Fq "calc(100vw - 32px)" elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and browser verify
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          THEME="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          MODULE="$THEME/inc/catalog-mobile-controls-parity-010236.php"
          BACKUP="/tmp/catalog-mobile-controls-parity-010236-v2-${GITHUB_RUN_ID}.bak"
          PROBE="elmercado-opcache-producer-mobile-v2-${GITHUB_RUN_ID}.php"
          ROLLED_BACK=0

          rollback() {
            code=$?
            [ "$ROLLED_BACK" -eq 0 ] || exit "$code"
            ROLLED_BACK=1
            set +e
            echo ROLLBACK_START
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then cp -p '$BACKUP' '$MODULE'; rm -f '$BACKUP'; fi; rm -f '$PROD_PATH/$PROBE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true
            echo ROLLED_BACK
            exit "${code:-1}"
          }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; grep -Fq 'CATALOG_MOBILE_CONTROLS_010236_PRODUCTION' '$THEME/functions.php'; test -f '$MODULE'; cp -p '$MODULE' '$BACKUP'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php "$STAGING_USER@$STAGING_HOST:$MODULE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$MODULE' >/dev/null; grep -Fq 'flex:1 1 0' '$MODULE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
          echo FILES_OK

          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          set +e
          for i in $(seq 1 8); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$' && { echo OPCACHE_RESET_OK; break; }
            sleep 4
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" >/dev/null 2>&1
          set -e

          runtime_ok=0
          set +e
          for i in $(seq 1 14); do
            html="$(curl -fsSL --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-store' -H 'Pragma: no-cache' "$BASE_URL/tienda/hidalgo-de-la-jara/?producer-mobile-v2=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            if grep -Fq "flex:1 1 0" <<<"$html" && grep -Fq "vendorLabel.textContent='Filtros'" <<<"$html"; then runtime_ok=1; break; fi
            sleep 5
          done
          set -e
          test "$runtime_ok" -eq 1
          echo RUNTIME_OK

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const near=(a,b,t=2)=>Math.abs(a-b)<=t;
          const fail=(m,d)=>{throw new Error(`${m} ${JSON.stringify(d)}`)};
          const retry=async(fn)=>{let e;for(let i=0;i<5;i++){try{return await fn()}catch(x){e=x;await sleep(2500)}}throw e};

          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const inspect=async(path,vendor,width=390)=>{
              const p=await browser.newPage(); await p.setCacheEnabled(false); await p.setViewport({width,height:844});
              await retry(()=>p.goto(`${process.env.BASE_URL}${path}?qa-mobile-v2=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000}));
              await p.waitForSelector('.emo-catalog-toolbar-shared-010229',{timeout:30000}); await sleep(1900);
              const d=await p.evaluate(vendor=>{
                const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
                const count=toolbar?.querySelector('.woocommerce-result-count,.emo-catalog-result-count-010220,.emo-vendor-result-count-010225');
                const order=toolbar?.querySelector('.woocommerce-ordering');
                const select=order?.querySelector('select');
                const trigger=vendor?document.querySelector('#wcfmmp-store .emo-mobile-filter-toggle.emo-filter-toggle-shared-010229'):document.querySelector('#emo-premium-filter-toggle');
                const label=trigger?.querySelector('.emo-filter-label');
                const first=document.querySelector(vendor?'#wcfmmp-store ul.products li.product':'ul.products li.product');
                const R=e=>{if(!e)return null;const r=e.getBoundingClientRect();return{top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}};
                const S=e=>{if(!e)return null;const c=getComputedStyle(e);return{display:c.display,boxSizing:c.boxSizing,padding:c.padding,borderRadius:c.borderRadius,borderTopWidth:c.borderTopWidth,borderTopColor:c.borderTopColor,backgroundColor:c.backgroundColor,boxShadow:c.boxShadow,fontSize:c.fontSize,fontWeight:c.fontWeight,lineHeight:c.lineHeight,whiteSpace:c.whiteSpace,wordBreak:c.wordBreak,overflowWrap:c.overflowWrap,writingMode:c.writingMode,flex:c.flex}};
                return{toolbar:R(toolbar),count:R(count),order:R(order),select:R(select),trigger:R(trigger),first:R(first),toolbarStyle:S(toolbar),countStyle:S(count),selectStyle:S(select),triggerStyle:S(trigger),label:(label?.textContent||'').trim(),countText:(count?.textContent||'').replace(/\s+/g,' ').trim()};
              },vendor);
              if(!d.toolbar||!d.count||!d.order||!d.select||!d.trigger||!d.first) fail('missing controls',{path,d});
              const expected=width-32;
              if(!near(d.toolbar.width,expected,2)||!near(d.toolbar.left,16,2)||!near(d.toolbar.right,width-16,2)) fail('toolbar not page width',{path,width,d});
              if(d.count.width<110||d.count.height>45||!d.countText.match(/resultado/i)) fail('count collapsed',{path,width,d});
              if(d.countStyle.whiteSpace!=='nowrap'||!String(d.countStyle.writingMode).startsWith('horizontal')) fail('count not horizontal',{path,d});
              const orderW=width<=360?138:148;
              if(!near(d.select.width,orderW,1)||d.selectStyle.boxSizing!=='border-box') fail('sort geometry',{path,d});
              if(d.label!=='Filtros'||!near(d.trigger.width,expected,2)||!near(d.trigger.left,16,2)) fail('filter trigger parity',{path,d});
              if(d.trigger.top<d.toolbar.bottom-1||d.first.top<d.trigger.bottom+8) fail('vertical overlap',{path,d});
              await p.click(vendor?'#wcfmmp-store .emo-mobile-filter-toggle.emo-filter-toggle-shared-010229':'#emo-premium-filter-toggle'); await sleep(300);
              const open=await p.evaluate(vendor=>{const e=vendor?document.querySelector('.emo-mobile-filter-shell.emo-filter-shell-shared-010229'):document.querySelector('#emo-premium-filter-shell');if(!e)return false;const c=getComputedStyle(e),r=e.getBoundingClientRect();return !e.hidden&&c.display!=='none'&&r.width>0&&r.height>0},vendor);
              if(!open) fail('drawer did not open',{path,d});
              await p.close(); return d;
            };

            const shop390=await inspect('/tienda/',false,390);
            const vendorPaths=['/tienda/hidalgo-de-la-jara/','/tienda/1957/','/tienda/el-mercado-de-origen/'];
            const vendors390=[];
            for(const path of vendorPaths) vendors390.push(await inspect(path,true,390));
            const shop360=await inspect('/tienda/',false,360);
            const vendor360=await inspect('/tienda/hidalgo-de-la-jara/',true,360);

            for(const v of vendors390){
              for(const k of ['display','boxSizing','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']) if(shop390.toolbarStyle[k]!==v.toolbarStyle[k]) fail('toolbar style differs',{key:k,shop:shop390.toolbarStyle,vendor:v.toolbarStyle});
              for(const k of ['display','fontSize','fontWeight','lineHeight','whiteSpace','wordBreak','overflowWrap','writingMode','flex']) if(shop390.countStyle[k]!==v.countStyle[k]) fail('count style differs',{key:k,shop:shop390.countStyle,vendor:v.countStyle});
              for(const k of ['display','boxSizing','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']) if(shop390.selectStyle[k]!==v.selectStyle[k]) fail('sort style differs',{key:k,shop:shop390.selectStyle,vendor:v.selectStyle});
              for(const k of ['display','boxSizing','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']) if(shop390.triggerStyle[k]!==v.triggerStyle[k]) fail('filter style differs',{key:k,shop:shop390.triggerStyle,vendor:v.triggerStyle});
            }
            if(!near(shop360.toolbar.width,vendor360.toolbar.width,2)||!near(shop360.trigger.width,vendor360.trigger.width,2)) fail('360 parity differs',{shop360,vendor360});
            console.log('PRODUCER_MOBILE_PARITY_V2_OK',JSON.stringify({shop390,vendors390,shop360,vendor360}));
            await browser.close();
          })().catch(e=>{console.error('PRODUCER_MOBILE_PARITY_V2_ERROR',e);process.exit(1)});
          NODE

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP' '$PROD_PATH/$PROBE'"
          trap - ERR
          echo PRODUCTION_PRODUCER_MOBILE_PARITY_V2_OK

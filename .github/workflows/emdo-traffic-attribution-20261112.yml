name: EMDO current traffic and BF cache attribution read-only 20261112
on:
  push:
    branches: [diagnostics/emdo-live-performance-20261112]
    paths: ['.github/workflows/emdo-traffic-attribution-20261112.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Characterize add-to-cart traffic and Black Friday caching without changes
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 \
            -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no \
            -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          LOGS=/var/www/vhosts/system/elmercadodeorigen.com/logs
          echo '=== REQUEST TRAFFIC PROFILE (LAST 20 MIN; ANONYMIZED) ==='
          python3 - "$LOGS" <<'PY'
          import sys,re,collections,urllib.parse,datetime,os
          name=os.path.join(sys.argv[1],'proxy_access_ssl_log')
          now=datetime.datetime.now(datetime.timezone.utc);cut=now-datetime.timedelta(minutes=20)
          rx=re.compile(r'^(?P<ip>\S+)\s+\S+\s+\S+\s+\[(?P<time>[^\]]+)\]\s+"(?P<request>[^"]+)"\s+(?P<status>\d{3})\s+(?P<size>\S+)(?:\s+"(?P<referer>[^"]*)"\s+"(?P<ua>[^"]*)")?')
          bymethod=collections.Counter();status=collections.Counter();ua=collections.Counter();paths=collections.Counter();referers=collections.Counter();products=collections.Counter();ipcounts=collections.Counter();bystatus=collections.Counter();total=0
          try:
              with open(name,'rb') as f:
                  f.seek(0,2);f.seek(max(0,f.tell()-25000000))
                  if f.tell():f.readline()
                  for raw in f:
                      m=rx.match(raw.decode('utf8','replace'))
                      if not m:continue
                      try:dt=datetime.datetime.strptime(m['time'],'%d/%b/%Y:%H:%M:%S %z').astimezone(datetime.timezone.utc)
                      except ValueError:continue
                      if not cut<=dt<=now:continue
                      req=m['request'].split()
                      if len(req)<2:continue
                      u=urllib.parse.urlsplit(req[1])
                      if 'add-to-cart' not in urllib.parse.parse_qs(u.query):continue
                      total+=1; bymethod[req[0]]+=1;status[m['status']]+=1;ipcounts[m['ip']]+=1
                      p=u.path
                      if p.startswith('/tienda/'):path='shop'
                      elif p.startswith('/producto/'):path='product'
                      elif p.startswith('/categoria-producto/'):path='category'
                      elif p.startswith('/en/'):path='english'
                      elif p in ('/',''):path='home'
                      else:path='other'
                      paths[path]+=1
                      q=urllib.parse.parse_qs(u.query).get('add-to-cart',['unknown'])[0]
                      products[q if q.isdigit() else 'other']+=1
                      a=(m['ua'] or '').lower()
                      if 'googlebot' in a:klass='Googlebot'
                      elif 'bingbot' in a:klass='Bingbot'
                      elif 'facebook' in a:klass='Facebook'
                      elif any(t in a for t in ('bot','spider','crawler','ahrefs','semrush','bytespider','headless')):klass='other crawler'
                      elif any(t in a for t in ('curl/','python','wget/','go-http-client','okhttp','postman')):klass='script/tool'
                      elif 'mozilla/' in a:klass='browser-like UA'
                      elif not a:klass='missing UA'
                      else:klass='other UA'
                      ua[klass]+=1
                      ref=urllib.parse.urlsplit(m['referer'] or '').hostname or ''
                      if ref.endswith('elmercadodeorigen.com'):rr='same-site'
                      elif not ref:rr='empty'
                      else:rr='external'
                      referers[rr]+=1
              print('ADD_TO_CART_LAST20M',total,'distinct_ip_count',len(ipcounts),'top_ip_request_counts_anonymized',[x for _,x in ipcounts.most_common(8)])
              print('METHOD',dict(bymethod),'STATUS',dict(status),'PAGE_CATEGORY',dict(paths),'USER_AGENT_CLASS',dict(ua),'REFERER_CLASS',dict(referers))
              print('DISTINCT_PRODUCT_ID_COUNT',len(products),'TOP_PRODUCT_ID_REQUEST_COUNTS_ANON',[v for _,v in products.most_common(10)])
          except Exception as e:print('PARSE_ERROR',type(e).__name__)
          PY
          echo '=== BLACK FRIDAY RESPONSE CACHE HEADERS ONLY ==='
          for path in /black-friday-2026/ /producto/jamon-de-bellota-100-iberico/; do
            echo "PATH=$path"
            for i in 1 2; do
              H=$(mktemp)
              curl -ksS --connect-timeout 3 --max-time 16 -D "$H" -o /dev/null \
                -w "attempt=$i status=%{http_code} ttfb=%{time_starttransfer}s\n" \
                "https://www.elmercadodeorigen.com$path" || true
              grep -Ei '^(cache-control|expires|pragma|vary|x-emdo-public-cache|x-el-mercado-product-early-cache|x-el-mercado-hot-early-cache|x-robots-tag):' "$H" | tr -d '\r' || true
              echo "SET_COOKIE_NAMES=$(grep -i '^set-cookie:' "$H" | cut -d':' -f2- | cut -d'=' -f1 | tr -d ' \r' | paste -sd',' -)"
              rm -f "$H"
            done
          done
          echo 'TRAFFIC_ATTRIBUTION_READONLY_COMPLETE'
          REMOTE

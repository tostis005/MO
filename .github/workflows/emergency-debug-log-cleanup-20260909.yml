name: Emergency remove giant dev debug log 2026-09-09

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-debug-log-cleanup-20260909.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Remove giant development debug log
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          fi
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          VHOST_PATH="$(dirname "$PROD_PATH")"
          TARGET="$VHOST_PATH/dev.elmercadodeorigen.com/wp-content/debug.log"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -eu
            TARGET='$TARGET'
            echo '=== DISK BEFORE ==='
            df -h '$PROD_PATH' || true
            if [ ! -f \"\$TARGET\" ]; then
              echo 'TARGET_DEBUG_LOG_NOT_FOUND'
              exit 2
            fi
            size=\$(stat -c '%s' \"\$TARGET\")
            echo \"TARGET_BYTES=\$size\"
            if [ \"\$size\" -lt 1000000000 ]; then
              echo 'ABORT: expected giant debug.log (>1GB) but target is smaller' >&2
              exit 3
            fi
            rm -f -- \"\$TARGET\"
            [ ! -e \"\$TARGET\" ] || { echo 'ABORT: debug.log still exists' >&2; exit 4; }
            sync || true
            echo 'DEBUG_LOG_REMOVED=true'
            echo '=== DISK AFTER ==='
            df -h '$PROD_PATH' || true
          "

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://www.elmercadodeorigen.com/' 'https://www.elmercadodeorigen.com/tienda/' 'https://www.elmercadodeorigen.com/blog/'; do
            code=$(curl -L --max-time 30 --retry 2 -sS -o /tmp/site.html -w '%{http_code}' "$url" || true)
            echo "$url HTTP=$code"
            if grep -Eqi 'No space left on device|Error en la base de datos de WordPress' /tmp/site.html; then
              echo 'DISK_OR_DB_ERROR_STILL_VISIBLE=true'
              exit 5
            fi
            [ "$code" = '200' ] || exit 6
          done
          echo 'PUBLIC_SITE_HEALTHY=true'

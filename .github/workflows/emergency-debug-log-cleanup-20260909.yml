name: Emergency diagnose production disk 2026-09-09

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-debug-log-cleanup-20260909.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production disk usage
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          fi
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          VHOST_PATH="$(dirname "$PROD_PATH")"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            echo PROD_PATH='$PROD_PATH'
            echo '=== FILESYSTEM ==='
            df -h '$PROD_PATH' /tmp || true
            echo '=== INODES ==='
            df -i '$PROD_PATH' /tmp || true
            echo '=== VHOST TOP DIRECTORIES ==='
            du -x -h -d 1 '$VHOST_PATH' 2>/dev/null | sort -h | tail -25 || true
            echo '=== WP-CONTENT TOP DIRECTORIES ==='
            du -x -h -d 1 '$PROD_PATH/wp-content' 2>/dev/null | sort -h | tail -25 || true
            echo '=== FILES OVER 250MB IN VHOST ==='
            find '$VHOST_PATH' -xdev -type f -size +250M -printf '%s %p\n' 2>/dev/null | sort -nr | head -30 || true
          "

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://www.elmercadodeorigen.com/' 'https://www.elmercadodeorigen.com/tienda/' 'https://www.elmercadodeorigen.com/blog/'; do
            code=$(curl -L --max-time 30 --retry 2 -sS -o /tmp/site.html -w '%{http_code}' "$url" || true)
            echo "$url HTTP=$code"
            [ "$code" = '200' ] || exit 4
          done
          echo 'PUBLIC_SITE_HEALTHY=true'

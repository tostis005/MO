name: Club EMDO - syntax and safeguards
on:
  pull_request:
    paths:
      - 'mdo-supplier-sync/includes/class-mdo-club*.php'
      - 'mdo-supplier-sync/mdo-supplier-sync.php'
      - 'tests/club-emdo-checks.php'
      - 'tests/club-emdo-unit.php'
      - 'tests/club-emdo-full-wallet-unit.php'
      - 'tests/club-emdo-manual-payments-unit.php'
      - 'tests/club-emdo-purchase-flow-unit.php'
      - 'tests/club-emdo-gift-design.php'
      - 'tests/club-emdo-ui-cleanup.php'
      - 'tests/club-emdo-admin-gifts-unit.php'
      - 'mdo-supplier-sync/assets/club-emdo-tarjeta-regalo.jpg.b64'
      - '.github/workflows/club-emdo-ci.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          php -l mdo-supplier-sync/includes/class-mdo-club.php
          php -l mdo-supplier-sync/includes/class-mdo-club-ledger.php
          php -l mdo-supplier-sync/includes/class-mdo-club-checkout.php
          php -l mdo-supplier-sync/includes/class-mdo-club-admin.php
      - name: Source safeguards
        run: php tests/club-emdo-checks.php
      - name: Partial and full wallet regression tests
        run: php tests/club-emdo-unit.php
      - name: Rewards and manual refund regression tests
        run: php tests/club-emdo-full-wallet-unit.php
      - name: Offline payment and completion tests
        run: php tests/club-emdo-manual-payments-unit.php
      - name: Gift purchase and wallet top-up checkout redirect
        run: php tests/club-emdo-purchase-flow-unit.php
      - name: Gift card artwork, email and landing links
        run: php tests/club-emdo-gift-design.php
      - name: Account dashboard and wallet visual regression
        run: php tests/club-emdo-ui-cleanup.php
      - name: Gift card reporting and privacy regression
        run: php tests/club-emdo-admin-gifts-unit.php

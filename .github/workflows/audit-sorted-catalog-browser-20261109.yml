name: Browser check sorted catalog mobile infinite load 2026-11-09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-sorted-catalog-browser-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Install browser client
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
      - name: Inspect mobile catalog while loading
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          cat >/tmp/emdo-shop-mobile.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:393,height:851},isMobile:true,hasTouch:true,deviceScaleFactor:2,userAgent:'Mozilla/5.0 (Linux; Android 15; SM-S928B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Mobile Safari/537.36'});
              page.setDefaultTimeout(10000);
              const errors=[],ajax=[];
              page.on('pageerror',e=>errors.push(String(e).slice(0,300)));
              page.on('requestfailed',r=>errors.push('REQUEST_FAILED '+r.url().slice(0,90)+' '+r.failure()?.errorText));
              page.on('response',async r=>{if(r.url().includes('admin-ajax.php')){let data='';try{data=await r.text()}catch{}ajax.push({http:r.status(),length:data.length,success:data.slice(0,35),url:r.url().slice(0,100)})}});
              const url='https://www.elmercadodeorigen.com/tienda/?orderby=price&emdo_mobile_qa=20261109';
              const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(2500);
              const snapshot=async(label)=>{const d=await page.evaluate(()=>{
                const g=document.querySelector('main ul.products,#primary ul.products,.content-area ul.products,ul.products');
                const s=document.querySelector('.emo-catalog-load-state');
                const o=window.__emoCatalogLoaderState;
                return {items:g?.querySelectorAll(':scope > li.product').length||0,initialGrid:!!g,ordered:o?.ordered,remaining:o?.remaining,loading:o?.loading,shown:o?.shown,stateClass:s?.className,stateText:s?.textContent?.trim().slice(0,140),paginationCount:document.querySelectorAll('.woocommerce-pagination,.mdo-catalog-manual-pagination').length,manualDisplay:getComputedStyle(document.querySelector('.mdo-catalog-manual-pagination')||document.body).display,nativeDisplay:getComputedStyle(document.querySelector('.woocommerce-pagination')||document.body).display,documentWidth:document.documentElement.scrollWidth,viewport:innerWidth};});console.log(label+' '+JSON.stringify(d));return d};
              console.log('HTTP '+res.status());
              const a=await snapshot('START');
              await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
              await page.waitForTimeout(18000);
              const b=await snapshot('AFTER_SCROLL');
              console.log('AJAX '+JSON.stringify(ajax.slice(0,8)));
              console.log('ERRORS '+JSON.stringify(errors.slice(0,10)));
              const button=page.locator('.emo-catalog-load-button');
              if(await button.count() && await button.isVisible()) {
                await button.click({timeout:5000});
                await page.waitForTimeout(12500);
                await snapshot('AFTER_BUTTON');
                console.log('AJAX_AFTER_BUTTON '+JSON.stringify(ajax.slice(-6)));
              }
              if((b.items||0)<=a.items){throw Error('Mobile browser failed to append products after bottom scroll');}
              if(b.documentWidth>b.viewport+5){throw Error('Mobile horizontal overflow detected');}
              console.log('MOBILE_SORT_SCROLL_OK');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/emdo-shop-mobile.cjs

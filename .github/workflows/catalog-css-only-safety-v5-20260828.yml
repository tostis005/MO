name: Catalogue CSS-only safety v5 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-css-only-safety-v5-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only sources
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            'mu-plugins/zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'
            'mu-plugins/zzzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-final-20260828.php'
          )
          for f in "${FILES[@]}"; do php -l "$f" >/dev/null; done
          ! grep -Eq '<script|new[[:space:]]+MutationObserver|new[[:space:]]+ResizeObserver|requestAnimationFrame[[:space:]]*\(|setInterval[[:space:]]*\(' "${FILES[@]}"

      - name: Deploy CSS-only owners
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          BACKUP="/tmp/mdo-css-v5-${GITHUB_RUN_ID}"; mkdir -p "$BACKUP"; echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          FILES=(
            'zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'
            'zzzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-final-20260828.php'
          )
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$BACKUP'"
          for name in "${FILES[@]}"; do
            target="$PROD/wp-content/mu-plugins/$name"; remote="/tmp/$name.$GITHUB_RUN_ID"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$target' ]; then cp -p '$target' '$BACKUP/$name'; else : > '$BACKUP/$name.absent'; fi"
            sshpass -e scp $SCP "mu-plugins/$name" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$remote' >/dev/null; install -m0644 '$remote' '$target'; rm -f '$remote'"
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists("wp_cache_flush") ) { wp_cache_flush(); } if ( has_action("litespeed_purge_all") ) { do_action("litespeed_purge_all"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify live CSS-only layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time,json,sys
          urls={'global':'https://www.elmercadodeorigen.com/tienda/?css_only_v5=1','producer':'https://www.elmercadodeorigen.com/tienda/1957/?css_only_v5=1'}
          widths=[335,360,390,640,700,767,768,1024]
          errors=[]; report={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for w in widths:
              report[str(w)]={}
              for kind,url in urls.items():
                page=browser.new_page(viewport={'width':w,'height':850})
                page.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','font','media') else r.continue_())
                page.goto(url,wait_until='commit',timeout=30000)
                data=None
                for _ in range(50):
                  time.sleep(.3)
                  try:
                    data=page.evaluate('''() => {const t=document.querySelector('.emo-catalog-toolbar-shared-010229'),f=t?.querySelector('.woocommerce-ordering'),s=f?.querySelector('select[name="orderby"]'),d=t?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]'),l=t?.querySelector('.woostify-toolbar-left'); const b=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}}; return {ready:!!(t&&f&&s&&d&&l),t:b(t),f:b(f),s:b(s),d:b(d),display:t?getComputedStyle(t).display:null,leftDisplay:l?getComputedStyle(l).display:null,safety:!!document.getElementById('mdo-catalog-css-only-safety-20260828'),final:!!document.getElementById('mdo-catalog-css-only-final-20260828'),old:[!!document.getElementById('mdo-catalog-control-widths-20260828'),!!document.getElementById('mdo-catalog-mobile-runtime-guard-20260824'),!!document.getElementById('mdo-catalog-top-controls-parity-final-20260824-js'),!!document.getElementById('mdo-catalog-top-controls-arrow-final-20260824-js'),!!document.getElementById('elmercado-catalog-mobile-controls-parity-script-010236')],overflow:document.documentElement.scrollWidth-innerWidth,pointer:s?getComputedStyle(s).pointerEvents:null,disabled:s?.disabled??true}}''')
                    if data['ready']:
                      time.sleep(.7)
                      data=page.evaluate('''() => {const t=document.querySelector('.emo-catalog-toolbar-shared-010229'),f=t?.querySelector('.woocommerce-ordering'),s=f?.querySelector('select[name="orderby"]'),d=t?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]'),l=t?.querySelector('.woostify-toolbar-left'); const b=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}}; return {ready:!!(t&&f&&s&&d&&l),t:b(t),f:b(f),s:b(s),d:b(d),display:getComputedStyle(t).display,leftDisplay:getComputedStyle(l).display,safety:!!document.getElementById('mdo-catalog-css-only-safety-20260828'),final:!!document.getElementById('mdo-catalog-css-only-final-20260828'),old:[!!document.getElementById('mdo-catalog-control-widths-20260828'),!!document.getElementById('mdo-catalog-mobile-runtime-guard-20260824'),!!document.getElementById('mdo-catalog-top-controls-parity-final-20260824-js'),!!document.getElementById('mdo-catalog-top-controls-arrow-final-20260824-js'),!!document.getElementById('elmercado-catalog-mobile-controls-parity-script-010236')],overflow:document.documentElement.scrollWidth-innerWidth,pointer:getComputedStyle(s).pointerEvents,disabled:s.disabled}}''')
                      break
                  except Exception: data=None
                report[str(w)][kind]=data
                if not data or not data['safety'] or not data['final']:
                  errors.append(f'{kind} {w}: CSS-only owners unavailable'); page.close(); continue
                if any(data['old']): errors.append(f'{kind} {w}: old visual runtime present {data["old"]}')
                if data['overflow']>1: errors.append(f'{kind} {w}: overflow {data["overflow"]}')
                if data['pointer']=='none' or data['disabled']: errors.append(f'{kind} {w}: ordering blocked')
                if w<=767:
                  if data['display']!='grid': errors.append(f'{kind} {w}: toolbar {data["display"]}')
                  if data['leftDisplay']!='contents': errors.append(f'{kind} {w}: left {data["leftDisplay"]}')
                  if data['t']['h']<125: errors.append(f'{kind} {w}: toolbar h={data["t"]["h"]}')
                  if abs(data['f']['w']-data['s']['w'])>2: errors.append(f'{kind} {w}: form/select mismatch')
                  if abs(data['d']['w']-data['s']['w'])>3: errors.append(f'{kind} {w}: destination/order mismatch {data["d"]["w"]}/{data["s"]["w"]}')
                  if w==335 and data['s']['w']<260: errors.append(f'{kind} 335: too narrow {data["s"]["w"]}')
                  if data['f']['l'] < data['t']['l']-2 or data['f']['r'] > data['t']['r']+2: errors.append(f'{kind} {w}: ordering outside toolbar')
                try:
                  t0=time.time(); page.evaluate('''() => {const s=document.querySelector('.emo-catalog-toolbar-shared-010229 select[name="orderby"]'); s.focus(); return document.activeElement===s;}'''); dt=time.time()-t0
                  if dt>.75: errors.append(f'{kind} {w}: DOM sluggish {dt:.3f}s')
                  opened=page.evaluate('''() => {const b=document.querySelector('.emo-catalog-toolbar-shared-010229 [data-mdo-destination-open],.emo-catalog-toolbar-shared-010229 [data-mdo-ps-destination-open]'); if(!b)return false; b.click(); return true;}''')
                  time.sleep(.2)
                  modal=page.evaluate('''() => {const m=document.querySelector('[data-mdo-destination-modal],[data-mdo-ps-modal],.mdo-destination-modal,.mdo-ps-modal'); return !!m && !m.hidden && getComputedStyle(m).display!=='none';}''')
                  if not opened or not modal: errors.append(f'{kind} {w}: destination modal did not open')
                except Exception as e: errors.append(f'{kind} {w}: interaction {type(e).__name__}')
                page.close()
            browser.close()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:
            print('ERRORS:'); print('\n'.join('- '+x for x in errors)); sys.exit(1)
          print('CATALOG_CSS_ONLY_SAFETY_V5_VERIFIED=true')
          PY

      - name: Roll back on failure
        if: failure() && env.PROD != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          FILES=(
            'zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'
            'zzzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-final-20260828.php'
          )
          for name in "${FILES[@]}"; do
            target="$PROD/wp-content/mu-plugins/$name"
            if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$BACKUP/$name'"; then
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 '$BACKUP/$name' '$target'"
            else
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$target'"
            fi
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$BACKUP'"

      - name: Remove backup
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$BACKUP'"

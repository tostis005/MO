name: Verify 1957 harvest banner on mobile and desktop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-home-aove-banner-browser-20261030.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop and mobile banner placement
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME"
          node .github/scripts/audit-home-aove-banner-browser-20261030.cjs
      - name: Archive cropped banner previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aove-home-banner-desktop-mobile
          path: /tmp/aove-*.png
          if-no-files-found: warn
          retention-days: 7

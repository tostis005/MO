name: Publicar cinco banners aprobados de productores
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-producer-banners-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emdo-production-producer-directory-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar cinco medios aprobados por Gmail y verificar SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${STAGING_HOST:?SSH host absent}"
          : "${STAGING_USER:?SSH user absent}"
          : "${SSHPASS:?SSH password absent}"
          php -l elmercadodeorigen-child/inc/producer-list-image-square-010242.php
          mkdir -p /tmp/emdo-approved-banners/banners
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 65 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7c78-820e-a635-e6021619d98b/raw?se=2026-10-20T18%3A11%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=f18e189c-2f98-5c07-a4ef-e96ec2773784&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T12%3A11%3A17Z&ske=2026-10-21T12%3A11%3A17Z&sks=b&skv=2026-02-06&sig=Xlg5sTEtNAjh%2BnODQoEFoHQt3tyA6trlFq0YJlc4tIY%3D' -o /tmp/emdo-approved-banners/banners/selectos-de-castilla.webp
          echo 'c2d2b2c49f934a542e1542422463421a9f3d0a6b9a796253bcf1620278418617  /tmp/emdo-approved-banners/banners/selectos-de-castilla.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-approved-banners/banners/selectos-de-castilla.webp)" -eq 272102
          echo 'APPROVED_BANNER_DOWNLOADED_AND_HASH_VERIFIED selectos-de-castilla'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 65 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c72c-820e-bb73-a1c75873cc40/raw?se=2026-10-20T18%3A11%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=ce34bef4-b198-5b0f-ac25-3add3b39d5d7&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T13%3A04%3A53Z&ske=2026-10-21T13%3A04%3A53Z&sks=b&skv=2026-02-06&sig=IT%2BKI/Sr08X6FYltTWErr89xq%2BAe4m/MYqzGBads6cU%3D' -o /tmp/emdo-approved-banners/banners/la-huerta-de-ana-mary.webp
          echo '6aa6be0ae178a2f8fe4422695edaf69e82fd70fdd27fa84d68b384d84138ec4c  /tmp/emdo-approved-banners/banners/la-huerta-de-ana-mary.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-approved-banners/banners/la-huerta-de-ana-mary.webp)" -eq 355876
          echo 'APPROVED_BANNER_DOWNLOADED_AND_HASH_VERIFIED la-huerta-de-ana-mary'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 65 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3940-820e-a159-ce8de76f58c3/raw?se=2026-10-20T18%3A11%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=8dc1f08c-e0d9-5798-88ec-5a75fb97667b&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T09%3A57%3A25Z&ske=2026-10-21T09%3A57%3A25Z&sks=b&skv=2026-02-06&sig=JqCxSH2%2BK2bYbm0lp1JjPEObfY15OLL1Gj7%2BXD3r61U%3D' -o /tmp/emdo-approved-banners/banners/chocolates-artesanos-isabel.webp
          echo 'bd5d3c9db997048894e400da50af3f6de6431f6825f24917a6af496ce9e2582f  /tmp/emdo-approved-banners/banners/chocolates-artesanos-isabel.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-approved-banners/banners/chocolates-artesanos-isabel.webp)" -eq 305110
          echo 'APPROVED_BANNER_DOWNLOADED_AND_HASH_VERIFIED chocolates-artesanos-isabel'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 65 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b534-820e-b1ac-25d30044257b/raw?se=2026-10-20T18%3A11%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=a8ef240d-a03b-5cec-aea9-ed31429d2cfe&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T11%3A13%3A30Z&ske=2026-10-21T11%3A13%3A30Z&sks=b&skv=2026-02-06&sig=C4rhLyS6ojtDttad53y/vXBNj%2BIx%2BOFJBtlBqxGJAbI%3D' -o /tmp/emdo-approved-banners/banners/ikore-kofi.webp
          echo 'bd52db8973b1a87c0a1c5291a2d209f8bb01d5e0fdd3249ecfc215fd0c68ecd4  /tmp/emdo-approved-banners/banners/ikore-kofi.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-approved-banners/banners/ikore-kofi.webp)" -eq 332004
          echo 'APPROVED_BANNER_DOWNLOADED_AND_HASH_VERIFIED ikore-kofi'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 65 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-807c-820e-a0bc-69a2c2c830af/raw?se=2026-10-20T18%3A11%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=94fee1a1-c480-5947-854f-1175e55f82dc&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T17%3A47%3A31Z&ske=2026-10-21T17%3A47%3A31Z&sks=b&skv=2026-02-06&sig=Eqw4moZ/r2EXjXGtQ5VRA3L4xVs/ezLxaiyu2Le0mJk%3D' -o /tmp/emdo-approved-banners/banners/tropitop.webp
          echo '318e7a67a3a71ab119b1aeff621d071177de6d2933b8a43ab3a4f9f775dcd44c  /tmp/emdo-approved-banners/banners/tropitop.webp' | sha256sum --check --status
          test "$(wc -c < /tmp/emdo-approved-banners/banners/tropitop.webp)" -eq 300076
          echo 'APPROVED_BANNER_DOWNLOADED_AND_HASH_VERIFIED tropitop'
          echo 'ALL_APPROVED_BANNERS_VERIFIED'
      - name: Instalar SSH y navegador para control real
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null
      - name: Publicar solo las cinco fotografías y verificar producción
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          CHILD="$ROOT/wp-content/themes/elmercadodeorigen-child"
          DEST="$CHILD/assets/images/producer-banners"
          INC="$CHILD/inc"
          STAGE="/tmp/emdo-banners-stage-$GITHUB_RUN_ID"
          BACKUP="/tmp/emdo-banners-backup-$GITHUB_RUN_ID"
          NAMES='selectos-de-castilla la-huerta-de-ana-mary chocolates-artesanos-isabel ikore-kofi tropitop'
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          SSH_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          installed=0
          rollback() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$installed" -eq 1 ]; then
              echo "::error::Falló comprobación de banners; restaurando archivos anteriores"
              sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$DEST' '$INC' '$BACKUP'" <<'ROLLBACK' || true
          set -eu
          dest="$1"; inc="$2"; backup="$3"
          for slug in selectos-de-castilla la-huerta-de-ana-mary chocolates-artesanos-isabel ikore-kofi tropitop; do
            if [ -f "$backup/$slug.webp" ]; then
              cp "$backup/$slug.webp" "$dest/$slug.webp"
            else
              rm -f "$dest/$slug.webp"
            fi
          done
          if [ -f "$backup/producer-list-image-square-010242.php" ]; then
            cp "$backup/producer-list-image-square-010242.php" "$inc/"
          fi
          ROLLBACK
            fi
            exit "$status"
          }
          trap rollback EXIT
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$STAGE' '$BACKUP'"
          sshpass -e scp $SCP_OPTS /tmp/emdo-approved-banners/banners/*.webp elmercadodeorigen-child/inc/producer-list-image-square-010242.php "$STAGING_USER@$STAGING_HOST:$STAGE/"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$ROOT' '$STAGE' '$BACKUP'" <<'INSTALL'
          set -Eeuo pipefail
          root="$1"; stage="$2"; backup="$3"
          child="$root/wp-content/themes/elmercadodeorigen-child"
          dest="$child/assets/images/producer-banners"
          inc="$child/inc"
          php_bin=/opt/plesk/php/8.2/bin/php
          wp_bin="$(command -v wp)"
          site="$("$php_bin" "$wp_bin" option get siteurl --path="$root" --skip-plugins --skip-themes --allow-root)"
          case "$site" in
            https://elmercadodeorigen.com|https://www.elmercadodeorigen.com|http://elmercadodeorigen.com|http://www.elmercadodeorigen.com) ;;
            *) echo "Unexpected WordPress root $site"; exit 1;;
          esac
          mkdir -p "$dest" "$backup"
          for slug in selectos-de-castilla la-huerta-de-ana-mary chocolates-artesanos-isabel ikore-kofi tropitop; do
            test -s "$stage/$slug.webp"
            if [ -f "$dest/$slug.webp" ]; then
              cp -p "$dest/$slug.webp" "$backup/$slug.webp"
            fi
          done
          cp -p "$inc/producer-list-image-square-010242.php" "$backup/"
          "$php_bin" -l "$stage/producer-list-image-square-010242.php"
          for slug in selectos-de-castilla la-huerta-de-ana-mary chocolates-artesanos-isabel ikore-kofi tropitop; do
            cp "$stage/$slug.webp" "$dest/$slug.webp"
            cmp "$stage/$slug.webp" "$dest/$slug.webp"
          done
          cp "$stage/producer-list-image-square-010242.php" "$inc/"
          "$php_bin" -l "$inc/producer-list-image-square-010242.php"
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$root" --skip-plugins --allow-root || true
          "$php_bin" -r '
          $dir=$argv[1]."/wp-content/uploads/elmercado-blog-static-v2";
          foreach (["www.elmercadodeorigen.com","elmercadodeorigen.com"] as $host) {
            foreach (["/productores/","/en/producers/"] as $path) {
              $file=$dir."/".hash("sha256",$host."|".$path).".html";
              if (is_file($file)) unlink($file);
            }
          }
          ' "$root"
          INSTALL
          installed=1
          echo 'APPROVED_PRODUCER_IMAGES_INSTALLED'
          for slug in $NAMES; do
            u="https://www.elmercadodeorigen.com/wp-content/themes/elmercadodeorigen-child/assets/images/producer-banners/$slug.webp"
            curl --fail --silent --show-error --location --max-time 40 "$u" -o "/tmp/check-$slug.webp"
            cmp "/tmp/check-$slug.webp" "/tmp/emdo-approved-banners/banners/$slug.webp"
            echo "PUBLIC_IMAGE_OK $slug"
          done
          cat >/tmp/verify-five-banners.cjs <<'NODE'
          const puppeteer=require(process.cwd()+'/node_modules/puppeteer-core');
          const expected=['selectos-de-castilla','la-huerta-de-ana-mary',
            'chocolates-artesanos-isabel','ikore-kofi','tropitop'];
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',
              args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              for(const width of [1440,900,390]){
                await page.setViewport({width,height:1000});
                await page.goto('https://www.elmercadodeorigen.com/productores/?banners='+process.env.GITHUB_RUN_ID+'-'+width,
                  {waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector('#wcfmmp-stores-wrap li.wcfmmp-single-store',{timeout:30000});
                const result=await page.evaluate(expected=>{
                  const cards=[...document.querySelectorAll('#wcfmmp-stores-wrap li.wcfmmp-single-store')];
                  const list=document.querySelector('#wcfmmp-stores-wrap ul.wcfmmp-store-wrap');
                  return {count:cards.length,columns:getComputedStyle(list).gridTemplateColumns.split(' ').length,
                    checked:expected.map(slug=>{
                      const item=cards.find(li=>li.querySelector('.store-data h2 a')?.href.includes('/tienda/'+slug));
                      const img=item?.querySelector('.store-info');
                      return {slug,found:!!item,background:img?getComputedStyle(img).backgroundImage:null};
                    })};
                },expected);
                console.log('APPROVED_BANNERS_CHECK',width,JSON.stringify(result));
                if(result.count<10 || result.columns!==(width>=1200?3:width>760?2:1))
                  throw Error('Producer card count or grid changed '+width);
                for(const item of result.checked){
                  if(!item.found||!item.background?.includes('/producer-banners/'+item.slug+'.webp'))
                    throw Error('Banner incorrect or not assigned '+width+' '+JSON.stringify(item));
                }
              }
              console.log('ALL_FIVE_PRODUCER_BANNERS_PUBLISHED');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify-five-banners.cjs

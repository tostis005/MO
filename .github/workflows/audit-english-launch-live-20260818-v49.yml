name: Audit English launch live v49
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production English implementation and HTML
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$PORT")
          remote() {
            local n
            for n in 1 2 3; do
              if sshpass -e ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" "$@"; then return 0; fi
              sleep $((n*2))
            done
            return 1
          }
          echo '=== CONNECTIVITY ==='
          remote "test -f /var/www/vhosts/elmercadodeorigen.com/httpdocs/wp-config.php && echo production-path-ok"
          echo '=== ACTIVE PLUGINS ==='
          remote 'wp=$(command -v wp); ph=$(command -v php || true); [ -n "$ph" ] || ph=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -1); "$ph" "$wp" plugin list --status=active --fields=name,status,version --format=table --path=/var/www/vhosts/elmercadodeorigen.com/httpdocs --allow-root'
          echo '=== MU PLUGINS ==='
          remote 'find /var/www/vhosts/elmercadodeorigen.com/httpdocs/wp-content/mu-plugins -maxdepth 2 -type f -printf "%p\n" 2>/dev/null | sort | head -200'
          echo '=== ENGLISH-RELATED MU CODE ==='
          remote 'grep -RniE "mdo_en|pll_current_language|determine_locale|Quitar|Variedad|result[s]?|journal|excerpt|NEW HARVEST" /var/www/vhosts/elmercadodeorigen.com/httpdocs/wp-content/mu-plugins 2>/dev/null | head -400 || true'
          echo '=== ENGLISH CONTENT SNAPSHOT ==='
          remote 'wp=$(command -v wp); ph=$(command -v php || true); [ -n "$ph" ] || ph=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -1); "$ph" -d memory_limit=768M "$wp" eval '\''foreach(["page","post","product"] as $pt){echo "-- $pt --\n"; $q=new WP_Query(["post_type"=>$pt,"post_status"=>["publish","draft","private"],"posts_per_page"=>-1,"orderby"=>"ID","order"=>"ASC"]); foreach($q->posts as $p){$lang=function_exists("pll_get_post_language")?pll_get_post_language($p->ID):""; if($lang==="en"){ $ex=trim(preg_replace("/\\s+/u"," ",wp_strip_all_tags((string)$p->post_excerpt))); echo wp_json_encode(["id"=>$p->ID,"lang"=>$lang,"type"=>$pt,"slug"=>$p->post_name,"title"=>$p->post_title,"excerpt"=>mb_substr($ex,0,260)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}}}'\'' --path=/var/www/vhosts/elmercadodeorigen.com/httpdocs --allow-root'
          echo '=== TARGET URL TEXT CHECKS ==='
          for u in \
            'https://www.elmercadodeorigen.com/en/' \
            'https://www.elmercadodeorigen.com/en/journal/' \
            'https://www.elmercadodeorigen.com/en/product-category/oils/' \
            'https://www.elmercadodeorigen.com/en/variedad/tradicional-martena-picual/' \
            'https://www.elmercadodeorigen.com/en/cookie-policy/' \
            'https://www.elmercadodeorigen.com/en/product/extra-virgin-olive-oil-5l/' \
            'https://www.elmercadodeorigen.com/en/cart/' \
            'https://www.elmercadodeorigen.com/en/checkout/'; do
            echo "--- $u"
            curl -k -L -sS --max-time 40 "$u" -o /tmp/mdo-v49.html || true
            grep -oE '<title>[^<]+' /tmp/mdo-v49.html | head -1 || true
            grep -oiE '.{0,100}(Quitar|Variedad|[0-9]+ result([^s]|$)|El Jam[oó]n|Noviembre|First name|NEW HARVEST 23/24|cosecha|añadir|carrito|finalizar compra|pedido mínimo|importe mínimo).{0,220}' /tmp/mdo-v49.html | sed 's/<[^>]*>/ /g' | head -40 || true
          done

name: Cookie consent fix 20260904 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cookie-consent-fix-20260904-production.yml'
      - '.github/deploy/emdo-cookie-consent.php'
      - '.github/scripts/cookie-consent-config-20260904.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate consent files
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/deploy/emdo-cookie-consent.php
          php -l .github/scripts/cookie-consent-config-20260904.php
          grep -Fq "analytics_storage': 'denied" .github/deploy/emdo-cookie-consent.php
          grep -Fq "third_party_default_state'] = false" .github/scripts/cookie-consent-config-20260904.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy consent bridge and configure CookieYes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SCRIPT="/tmp/cookie-consent-config-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP_OPTIONS .github/deploy/emdo-cookie-consent.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/emdo-cookie-consent.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/cookie-consent-config-20260904.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' REMOTE_SCRIPT='$REMOTE_SCRIPT' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -l "$PROD_PATH/wp-content/mu-plugins/emdo-cookie-consent.php"
          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file "$REMOTE_SCRIPT" --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          rm -f "$REMOTE_SCRIPT"
          echo COOKIE_CONSENT_DEPLOY_OK
          REMOTE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Verify consent flows in a real browser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          BASE = 'https://www.elmercadodeorigen.com/'

          def make_driver(label):
              o = Options(); o.page_load_strategy = 'eager'
              for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1600','--lang=es-ES'):
                  o.add_argument(arg)
              o.set_capability('goog:loggingPrefs', {'performance':'ALL'})
              d = webdriver.Chrome(options=o)
              d.set_page_load_timeout(60)
              d.execute_cdp_cmd('Network.enable', {})
              d.execute_cdp_cmd('Network.setExtraHTTPHeaders', {'headers': {'Accept-Language':'es-ES,es;q=0.9','Cache-Control':'no-cache','Pragma':'no-cache'}})
              d.get(BASE + '?cookie_verify=' + urllib.parse.quote(label + '-' + str(time.time_ns())))
              time.sleep(7)
              return d

          def names(d):
              return {c['name'] for c in d.get_cookies()}

          def cookie(d, name):
              c = d.get_cookie(name)
              return c.get('value') if c else None

          def assert_blocked(d, label):
              n = names(d)
              bad = sorted(x for x in n if x == '_ga' or x.startswith('_ga_') or x == '_fbp')
              if bad:
                  raise AssertionError(f'{label}: tracking cookies present without consent: {bad}')
              if cookie(d, 'wc_facebook_signals_state') != 'held':
                  raise AssertionError(f'{label}: Meta signals are not held')

          # Fresh visit: non-necessary cookies off, visible equal choices, no GA/Meta cookies.
          d = make_driver('fresh')
          try:
              banner = d.find_element(By.ID, 'cookie-law-info-bar')
              if not banner.is_displayed():
                  raise AssertionError('Cookie banner is not visible on fresh visit')
              text = banner.text
              for expected in ('Aceptar', 'Rechazar', 'Configurar', 'Política de cookies'):
                  if expected not in text:
                      raise AssertionError(f'Missing banner control/text: {expected}')
              checkbox = d.find_element(By.ID, 'wt-cli-checkbox-non-necessary')
              if checkbox.is_selected():
                  raise AssertionError('Non-necessary cookies are preselected on fresh visit')
              assert_blocked(d, 'fresh visit')
              print('FRESH_FLOW=PASS')
          finally:
              d.quit()

          # Reject: choice is persisted and trackers remain blocked.
          d = make_driver('reject')
          try:
              reject = d.find_elements(By.CSS_SELECTOR, '[data-cli_action="reject"],#cookie_action_close_header_reject,.wt-cli-reject-btn')
              if not reject:
                  raise AssertionError('Reject button not found')
              reject[0].click()
              time.sleep(7)
              if cookie(d, 'viewed_cookie_policy') != 'yes':
                  raise AssertionError('Reject choice was not persisted')
              if cookie(d, 'cookielawinfo-checkbox-non-necessary') != 'no':
                  raise AssertionError('Reject did not persist non-necessary=no')
              assert_blocked(d, 'rejected visit')
              print('REJECT_FLOW=PASS')
          finally:
              d.quit()

          # Accept: normal GA4 cookies/measurement become available after the consent reload.
          d = make_driver('accept')
          try:
              accept = d.find_elements(By.CSS_SELECTOR, '[data-cli_action="accept"],#cookie_action_close_header,.wt-cli-accept-btn')
              if not accept:
                  raise AssertionError('Accept button not found')
              accept[0].click()
              time.sleep(9)
              if cookie(d, 'viewed_cookie_policy') != 'yes' or cookie(d, 'cookielawinfo-checkbox-non-necessary') != 'yes':
                  raise AssertionError('Accept choice was not persisted')
              n = names(d)
              if not any(x == '_ga' or x.startswith('_ga_') for x in n):
                  raise AssertionError('GA4 cookies were not created after consent')
              if cookie(d, 'wc_facebook_signals_state') != 'active':
                  raise AssertionError('Meta signals were not released after consent')
              requests=[]
              for e in d.get_log('performance'):
                  try: m=json.loads(e['message'])['message']
                  except Exception: continue
                  if m.get('method') == 'Network.requestWillBeSent':
                      u=m.get('params',{}).get('request',{}).get('url','')
                      if 'google-analytics.com/g/collect' in u:
                          requests.append(u)
              if not requests:
                  raise AssertionError('No GA4 collect request observed after consent')
              print('ACCEPT_FLOW=PASS')
              print('ACCEPT_COOKIES=' + ','.join(sorted(x for x in n if x == '_ga' or x.startswith('_ga_') or x == '_fbp' or x == 'wc_facebook_signals_state')))
          finally:
              d.quit()
          PY

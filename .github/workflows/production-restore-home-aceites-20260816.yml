name: Production restore Home Aceites 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-restore-home-aceites-20260816.yml'
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and install SSH helper
        run: |
          php -l .github/scripts/mdo-home-aceites-card-hotfix-20260816.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy isolated Home Aceites guard
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no .github/scripts/mdo-home-aceites-card-hotfix-20260816.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-home-aceites-card-hotfix-20260816.php"
          OUT=$(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" -d memory_limit=512M "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          TARGET="$ROOT/wp-content/mu-plugins/mdo-home-aceites-card-hotfix.php"; TS=$(date +%Y%m%d%H%M%S)
          if [ -f "$TARGET" ]; then BAK="$TARGET.bak-$TS"; cp -a "$TARGET" "$BAK"; else BAK=NEW; fi
          cp /tmp/mdo-home-aceites-card-hotfix-20260816.php "$TARGET"
          "$PHP" -l "$TARGET"
          "$PHP" "$WP" cache flush --path="$ROOT" --allow-root >/dev/null 2>&1 || true
          rm -rf "$ROOT/wp-content/cache"/* 2>/dev/null || true
          echo "ROOT=$ROOT"; echo "TARGET=$TARGET"; echo "BAK=$BAK"
          REMOTE
          )
          echo "$OUT"
          for k in ROOT TARGET BAK; do v=$(printf '%s\n' "$OUT"|sed -n "s/^$k=//p"|tail -n1); test -n "$v"; echo "LIVE_$k=$v" >> "$GITHUB_ENV"; done
      - name: Verify Spanish Home normal and cache-busted
        run: |
          python3 - <<'PY'
          import re,time,urllib.request
          base='https://www.elmercadodeorigen.com/'
          for label,url in [('NORMAL',base),('BUST',base+'?mdo_aceites_verify='+str(int(time.time())))]:
              req=urllib.request.Request(url,headers={'User-Agent':'MDO-Aceites-Verify'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  h=r.read().decode('utf-8','replace')
              cards=re.findall(r'<a class="emo-category-card"[^>]*>.*?<strong[^>]*>(.*?)</strong>.*?<small[^>]*>(.*?)</small>.*?</a>',h,re.S|re.I)
              clean=lambda s:re.sub('<[^>]+>','',s).strip()
              vals=[(clean(a),clean(b)) for a,b in cards]
              print(label,'HTTP',r.status,'CARDS',vals)
              assert r.status==200
              assert any(a=='Aceites' and ('3 producto' in b or '3 productos' in b) for a,b in vals), (label,vals)
              assert sum(1 for a,b in vals if a=='Aceites')==1
              assert 'data-mdo-aceites-restored="20260816"' in h
          print('HOME_ACEITES=PASS')
          PY
      - name: Verify catalog remains healthy
        run: |
          python3 - <<'PY'
          import urllib.request
          for p in ['/tienda/','/categoria-producto/aceites/','/en/']:
              req=urllib.request.Request('https://www.elmercadodeorigen.com'+p,headers={'User-Agent':'MDO-Aceites-Health'})
              with urllib.request.urlopen(req,timeout=45) as r: b=r.read()
              print(p,r.status,len(b)); assert r.status==200 and len(b)>10000
          print('CATALOG_HEALTH=PASS')
          PY
      - name: Roll back on failure
        if: failure()
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail; [ -n "${LIVE_TARGET:-}" ] || exit 0; PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" "TARGET='$LIVE_TARGET' BAK='$LIVE_BAK' ROOT='$LIVE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$BAK" = "NEW" ]; then rm -f "$TARGET"; else cp -a "$BAK" "$TARGET"; fi
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); "$PHP" "$WP" cache flush --path="$ROOT" --allow-root >/dev/null 2>&1 || true
          echo ROLLBACK=PASS
          REMOTE

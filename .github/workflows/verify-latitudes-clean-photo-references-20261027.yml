name: Verify 31 clean Latitudes images and every product and pack image reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-latitudes-clean-photo-references-20261027.yml'
      - '.github/scripts/verify-latitudes-31-clean-media-and-packs-20261027.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all clean images and WooCommerce product/pack references
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          ID="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" .github/scripts/verify-latitudes-31-clean-media-and-packs-20261027.php "$TARGET:/tmp/verify-latitudes-all-clean-$ID.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$ID'" <<'REMOTE'
          set -euo pipefail
          ID="$1"
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp_bin=$(command -v wp)
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
             https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) SITE="$p";break;;
            esac
          done
          : "${SITE:?}"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "/tmp/verify-latitudes-all-clean-$ID.php" --path="$SITE" --allow-root
          REMOTE

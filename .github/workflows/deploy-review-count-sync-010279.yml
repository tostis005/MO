name: Deploy dynamic review counts 0.10.281

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/z-mdo-review-count-sync-010279.php'
      - 'mu-plugins/mdo-home-external-reviews-20260819.php'
      - '.github/workflows/deploy-review-count-sync-010279.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate review modules
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/z-mdo-review-count-sync-010279.php
          php -l mu-plugins/mdo-home-external-reviews-20260819.php
          grep -Fq 'Version: 0.10.281' mu-plugins/z-mdo-review-count-sync-010279.php
          grep -Fq "get_option( 'mdo_google_review_count'" mu-plugins/mdo-home-external-reviews-20260819.php
          grep -Fq "get_option( 'mdo_trustpilot_review_count'" mu-plugins/mdo-home-external-reviews-20260819.php
          grep -Fq "add_action( 'mdo_supplier_sync_dispatch'" mu-plugins/z-mdo-review-count-sync-010279.php
          grep -Fq 'mdo_review_counts_supplier_work_pending_010279' mu-plugins/z-mdo-review-count-sync-010279.php
          grep -Fq 'mdo_review_counts_store_trustpilot_010281' mu-plugins/z-mdo-review-count-sync-010279.php

      - name: Deploy review modules to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          for source in \
            mu-plugins/z-mdo-review-count-sync-010279.php \
            mu-plugins/mdo-home-external-reviews-20260819.php
          do
            base="$(basename "$source")"
            target="$PROD_PATH/wp-content/mu-plugins/$base"
            remote="/tmp/${base%.php}-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP_OPTIONS "$source" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$target' ]; then cp '$target' '$target.bak-${GITHUB_RUN_ID}'; fi; install -m 0644 '$remote' '$target'; rm -f '$remote'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$target'"
          done

          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH_OPTIONS=$SSH_OPTIONS" >> "$GITHUB_ENV"

      - name: Force Google production refresh
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          RESULT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'echo wp_json_encode(mdo_review_counts_refresh_google_010281(true));' --path='$PROD_PATH' --allow-root")"
          echo "GOOGLE_REFRESH_RESULT $RESULT"
          echo "$RESULT" | grep -Fq '"google_ok":true'

      - name: Verify stored values and dynamic home
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          G="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" option get mdo_google_review_count --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root 2>/dev/null")"
          T="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" option get mdo_trustpilot_review_count --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root 2>/dev/null")"
          GU="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" option get mdo_google_review_count_updated_at --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root 2>/dev/null")"
          case "$G:$T:$GU" in *[!0-9:]*|'') echo "Invalid stored values G=$G T=$T GU=$GU"; exit 21;; esac
          test "$G" -gt 0
          test "$T" -gt 0
          test "$GU" -gt 0
          echo "REVIEW_STATE google=$G trustpilot=$T google_updated=$GU"

          for lang in es en; do
            if [ "$lang" = es ]; then URL="https://www.elmercadodeorigen.com/?mdo_review_verify=${GITHUB_RUN_ID}"; else URL="https://www.elmercadodeorigen.com/en/?mdo_review_verify=${GITHUB_RUN_ID}"; fi
            curl -L -sS --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 EMDO review verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "$URL" -o "/tmp/home-${lang}.html"
          done

          G="$G" T="$T" python3 - <<'PY'
          import os,re,html
          g=int(os.environ['G']); t=int(os.environ['T'])
          for lang in ('es','en'):
              raw=open(f'/tmp/home-{lang}.html','r',encoding='utf-8',errors='ignore').read()
              gm=re.search(r'data-google-reviews=["\'](\d+)["\']',raw)
              tm=re.search(r'data-trustpilot-reviews=["\'](\d+)["\']',raw)
              text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
              text=re.sub(r'\s+',' ',text)
              google=bool(re.search(rf'Google.*?\b{g}\s+(?:reseñas|reviews)\b',text,re.I))
              trust=bool(re.search(rf'Trustpilot.*?\b{t}\s+(?:opiniones|reseñas|reviews)\b',text,re.I))
              print(f'HOME_REVIEW_CHECK lang={lang} google={g} attr_google={gm.group(1) if gm else None} visible_google={google} trustpilot={t} attr_trust={tm.group(1) if tm else None} visible_trust={trust}')
              if not gm or not tm or int(gm.group(1)) != g or int(tm.group(1)) != t or not google or not trust:
                  raise SystemExit(f'{lang}: home is not consuming stored review counts')
          PY

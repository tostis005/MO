name: Deploy dynamic review counts 0.10.279

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/z-mdo-review-count-sync-010279.php'
      - '.github/workflows/deploy-review-count-sync-010279.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate review sync module
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/z-mdo-review-count-sync-010279.php
          grep -Fq 'mdo_google_review_count' mu-plugins/z-mdo-review-count-sync-010279.php
          grep -Fq 'mdo_trustpilot_review_count' mu-plugins/z-mdo-review-count-sync-010279.php
          grep -Fq 'mdo_supplier_sync_dispatch' mu-plugins/z-mdo-review-count-sync-010279.php

      - name: Deploy review sync module to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          source='mu-plugins/z-mdo-review-count-sync-010279.php'
          base="$(basename "$source")"
          target="$PROD_PATH/wp-content/mu-plugins/$base"
          remote="/tmp/${base%.php}-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS "$source" "$STAGING_USER@$STAGING_HOST:$remote"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$target' ]; then cp '$target' '$target.bak-${GITHUB_RUN_ID}'; fi; install -m 0644 '$remote' '$target'; rm -f '$remote'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$target'"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH_OPTIONS=$SSH_OPTIONS" >> "$GITHUB_ENV"

      - name: Force first production refresh
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" eval 'echo wp_json_encode(mdo_review_counts_refresh_010279(true));' --path='$PROD_PATH' --allow-root"

      - name: Verify stored values, schedule and home output
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" eval '
            \$g=(int)get_option("mdo_google_review_count",0);
            \$t=(int)get_option("mdo_trustpilot_review_count",0);
            \$gu=(int)get_option("mdo_google_review_count_updated_at",0);
            \$tu=(int)get_option("mdo_trustpilot_review_count_updated_at",0);
            \$next=function_exists("as_next_scheduled_action") ? as_next_scheduled_action("mdo_review_counts_daily_fallback_010279",array(),"mdo-review-counts") : wp_next_scheduled("mdo_review_counts_daily_fallback_010279");
            echo "REVIEW_OPTIONS google={\$g} trustpilot={\$t} google_updated={\$gu} trust_updated={\$tu} fallback_next=".(is_numeric(\$next)?wp_date("c",(int)\$next):"none").PHP_EOL;
            if(\$g<1 || \$t<1 || \$gu<1 || \$tu<1){exit(17);} 
          ' --path='$PROD_PATH' --allow-root"

          curl -L -sS --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 EMDO review verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "https://www.elmercadodeorigen.com/?mdo_review_verify=${GITHUB_RUN_ID}" -o /tmp/home.html
          grep -o -m1 'mdo-review-counts-010279 google=[0-9]* trustpilot=[0-9]* updated=[^ ]*' /tmp/home.html
          grep -Fq 'mdo-review-counts-010279 google=' /tmp/home.html

          python3 - <<'PY'
          import re, html
          raw=open('/tmp/home.html','r',encoding='utf-8',errors='ignore').read()
          m=re.search(r'mdo-review-counts-010279 google=(\d+) trustpilot=(\d+)',raw)
          if not m:
              raise SystemExit('dynamic review marker missing')
          g,t=map(int,m.groups())
          text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
          text=re.sub(r'\s+',' ',text)
          google=bool(re.search(r'Google.{0,900}?\b%s\s+(?:reseñas|reviews)\b'%g,text,re.I))
          trust=bool(re.search(r'Trustpilot.{0,900}?\b%s\s+(?:opiniones|reseñas|reviews)\b'%t,text,re.I))
          print(f'HOME_REVIEW_CHECK google={g} visible_google={google} trustpilot={t} visible_trustpilot={trust}')
          if not (google and trust):
              # Do not accept merely stored options: the home must consume them.
              raise SystemExit('home review badges are not consuming the dynamic options')
          PY

name: Read-only Tropitop final catalog QA
on:
  pull_request:
    paths:
      - '.github/workflows/tropitop-final-readonly-qa-20261021.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Tropitop catalog after retailer-heading cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/tropitop-editorial-taxonomy-20261021.php
          test -n "${STAGING_HOST:-}" && test -n "${STAGING_USER:-}" && test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/tropitop-final-readonly-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/tropitop-editorial-taxonomy-20261021.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$SCRIPT'" || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$SCRIPT'" <<'REMOTE'
          set -Eeuo pipefail
          P="$1"; SCRIPT="$2"
          WP_BIN="$(command -v wp)"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          echo "TROPITOP_PRODUCTION_VERSION_BEGIN"
          "$PHP_BIN" -d memory_limit=256M "$WP_BIN" plugin get mdo-supplier-sync --field=version --path="$P" --allow-root
          echo "TROPITOP_ACTIVE_CACHE_PLUGINS"
          "$PHP_BIN" -d memory_limit=256M "$WP_BIN" option get active_plugins --format=json --path="$P" --allow-root --skip-plugins --skip-themes | grep -Eo '"[^"]*(cache|rocket|litespeed|autoptimize|perfmatters)[^"]*"' || true
          echo "TROPITOP_HTML_CONTEXT"
          "$PHP_BIN" -d memory_limit=1024M "$WP_BIN" eval '
            foreach ( ["TROPITOP-2601","TROPITOP-2569","TROPITOP-2573","TROPITOP-2717","TROPITOP-2332"] as $sku ) {
                $id=wc_get_product_id_by_sku($sku);
                $p=$id?wc_get_product($id):false;
                if(!$p)continue;
                $desc=$p->get_description("edit");
                $found=[];
                foreach (["Tropitop","trabajamos","nuestra tienda","Agricultor:"] as $needle) {
                    $idx=mb_stripos($desc,$needle);
                    if($idx!==false){$found[$needle]=mb_substr($desc,max(0,$idx-170),430);}
                }
                echo "TROPITOP_RAW_HTML=".wp_json_encode(["sku"=>$sku,"len"=>strlen($desc),"samples"=>$found],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            }
          ' --path="$P" --allow-root --skip-plugins=woostify-sites-library
          echo "TROPITOP_READONLY_AUDIT_BEGIN"
          timeout --kill-after=20s 500s env TROPITOP_EDITORIAL_MODE=audit \
            "$PHP_BIN" -d memory_limit=1024M "$WP_BIN" eval-file "$SCRIPT" \
            --path="$P" --allow-root --skip-plugins=woostify-sites-library
          REMOTE
          echo "TROPITOP_PUBLIC_RESPONSE"
          curl -sS -L -I --max-time 25 'https://www.elmercadodeorigen.com/categoria-producto/verduras/' | grep -Ei '^(HTTP/|location:|x-cache:|x-litespeed-cache:|cf-cache-status:|cache-control:)' || true

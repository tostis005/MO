name: Home version 0.10.256 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-version-010256-production.yml'

permissions:
  contents: write

jobs:
  bump-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/functions.php')
          s=p.read_text()
          old="define( 'ELMERCADO_THEME_VERSION', '0.10.251' );"
          new="define( 'ELMERCADO_THEME_VERSION', '0.10.256' );"
          if old not in s and new not in s:
              raise SystemExit('theme version marker not found')
          s=s.replace(old,new)
          s=s.replace('/* 0.10.251 reduce HTML crítico, recupera imágenes responsive y renueva cachés estáticas. */','/* 0.10.256 estabiliza el primer render de Home, CLS y renueva sus cachés estáticas. */')
          p.write_text(s)
          PY
          php -l elmercadodeorigen-child/functions.php
          grep -q "ELMERCADO_THEME_VERSION', '0.10.256" elmercadodeorigen-child/functions.php
      - name: Deploy version and CLS layer
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:/tmp/elmercado-functions-010256.php"
          sshpass -e scp $SCP elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php "$STAGING_USER@$STAGING_HOST:/tmp/elmercado-home-cls-010256.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            install -m 0644 /tmp/elmercado-functions-010256.php \"\$THEME/functions.php\"
            install -m 0644 /tmp/elmercado-home-cls-010256.php '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/functions.php\"
            \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/elmercado-functions-010256.php /tmp/elmercado-home-cls-010256.php
          "
      - name: Verify new Home document
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          HTML=$(mktemp)
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          css=$(grep -c 'id="elmercado-home-cls-010256"' "$HTML" || true)
          topbar=$(grep -c 'body.home .topbar{display:none!important;}' "$HTML" || true)
          deferred=$(grep -c 'home-deferred-0.10.256.css' "$HTML" || true)
          printf 'deploy=%s\nverify=%s\ncls_css=%s\ntopbar_rule=%s\ndeferred_010256=%s\nhtml_bytes=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' "$css" "$topbar" "$deferred" "$(wc -c < "$HTML")" > runtime/home-version-010256.txt
          cat runtime/home-version-010256.txt
          test "$css" -ge 1
          test "$topbar" -ge 1
          test "$deferred" -ge 1
      - name: Commit source and verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-version-010256.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-version-010256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/functions.php runtime/home-version-010256.txt
          git commit -m 'Bump Home cache version to 0.10.256 and verify' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

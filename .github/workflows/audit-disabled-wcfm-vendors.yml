name: Audit disabled WCFM vendor visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-disabled-wcfm-vendors.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Audit production WCFM vendor status and products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          dev=""
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          [ -f "$prod/wp-config.php" ] || exit 1
          php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Unexpected siteurl=$siteurl" >&2; exit 1 ;; esac
          echo "SITEURL=$siteurl"
          echo "--- WCFM VERSION ---"
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin list --path="$prod" --allow-root --format=csv | grep -Ei 'wcfm|marketplace' || true
          echo "--- STATUS SOURCE HINTS ---"
          for dir in "$prod/wp-content/plugins/wc-multivendor-marketplace" "$prod/wp-content/plugins/wc-frontend-manager"; do
            [ -d "$dir" ] || continue
            grep -RInE --include='*.php' 'vendor[_ -]?status|store[_ -]?status|disable[_ -]?vendor|vendor[_ -]?disable|is_vendor|is_store|wcfmmp_vendor' "$dir" 2>/dev/null | head -n 140 || true
          done
          echo "--- VENDOR STATUS META ---"
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
          $users = get_users(array("role__in"=>array("wcfm_vendor","dc_vendor","vendor","seller"),"orderby"=>"ID"));
          foreach ($users as $u) {
            $settings = get_user_meta($u->ID,"wcfmmp_profile_settings",true);
            $name = is_array($settings) && !empty($settings["store_name"]) ? $settings["store_name"] : $u->display_name;
            $published = count(get_posts(array("post_type"=>"product","post_status"=>"publish","author"=>$u->ID,"fields"=>"ids","posts_per_page"=>-1,"suppress_filters"=>true)));
            echo "VENDOR|{$u->ID}|" . sanitize_text_field($name) . "|published={$published}\n";
            $all = get_user_meta($u->ID);
            foreach ($all as $key=>$vals) {
              if (!preg_match("/(wcfm|vendor|store|disable|active|status)/i", (string)$key)) continue;
              foreach ((array)$vals as $v) {
                if (!is_string($v) || strlen($v)>180) continue;
                $v = preg_replace("/\\s+/", " ", $v);
                echo "META|{$u->ID}|{$key}|{$v}\n";
              }
            }
          }
          ' --path="$prod" --allow-root --skip-themes
          REMOTE

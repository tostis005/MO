name: Resume bounded catalog copy and Latitudes galleries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-catalog-batched-20261020.yml'
      - '.github/scripts/resume-catalog-batched-20261020.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emdo-catalog-repair-resume-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate repair script and deployed supplier connector
        run: |
          set -euo pipefail
          php -l .github/scripts/resume-catalog-batched-20261020.php
          php -l .github/scripts/resume-last-source-products-20261020.php
          php -l mdo-supplier-sync/connectors/class-mdo-connector-tolecarnes.php
          : "${HOST:?Missing SSH host}" "${USER:?Missing SSH user}" "${SSHPASS:?Missing SSH credentials}"

      - name: Preflight and resume production in individually committed batches
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=25 -o ServerAliveCountMax=12 -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$PORT")
          SERVER="$USER@$HOST"

          PROD="$(sshpass -e ssh "${SSH[@]}" "$SERVER" 'sh -s' <<'REMOTE'
          set -eu
          wp="$(command -v wp || true)"
          php="$(command -v php || true)"
          [ -n "$php" ] || php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp" ] && [ -x "$php" ]
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            root="$(dirname "$cfg")"
            siteurl="$("$php" "$wp" option get siteurl --path="$root" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            home="$("$php" "$wp" option get home --path="$root" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            case "$siteurl" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                case "$home" in
                  https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                    printf '%s' "$root"; exit 0 ;;
                esac ;;
            esac
          done
          echo 'Refusing to run outside production WordPress.' >&2
          exit 11
          REMOTE
          )"
          : "${PROD:?Cannot locate production WordPress}"
          echo 'Production WordPress confirmed.'
          WANT_SHA="$(sha256sum mdo-supplier-sync/connectors/class-mdo-connector-tolecarnes.php | awk '{print $1}')"
          sshpass -e ssh "${SSH[@]}" "$SERVER" "sh -s -- '$PROD' '$WANT_SHA'" <<'REMOTE'
          set -eu
          file="$1/wp-content/plugins/mdo-supplier-sync/connectors/class-mdo-connector-tolecarnes.php"
          test "$(sha256sum "$file" | awk '{print $1}')" = "$2" || {
            echo 'Current source extractor has not deployed to production. Refusing modifications.' >&2
            exit 12
          }
          echo 'Production supplier extractor checksum verified.'
          REMOTE
          WORK="/tmp/emdo-resume-gallery-${GITHUB_RUN_ID}"
          sshpass -e ssh "${SSH[@]}" "$SERVER" "mkdir -p '$WORK'"
          sshpass -e scp "${SCP[@]}" .github/scripts/resume-catalog-batched-20261020.php "$SERVER:$WORK/repair.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/resume-last-source-products-20261020.php "$SERVER:$WORK/source.php"
          : > /tmp/emdo-catalog-repair-batches.log

          run_batch() {
            task="$1"; mode="$2"; offset="$3"; size="$4"
            echo "RUNNING $task $mode batch offset=$offset size=$size"
            sshpass -e ssh "${SSH[@]}" "$SERVER" "sh -s -- '$PROD' '$WORK' '$task' '$mode' '$offset' '$size'" <<'REMOTE'
          set -eu
          wp_path="$1"; work="$2"; task="$3"; mode="$4"; offset="$5"; size="$6"
          php="$(command -v php || true)"
          [ -n "$php" ] || php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp="$(command -v wp)"
          timeout --kill-after=20s 700s env EMDO_RESUME_TASK="$task" EMDO_RESUME_MODE="$mode" EMDO_RESUME_OFFSET="$offset" EMDO_RESUME_SIZE="$size" \
            "$php" -d memory_limit=1536M -d max_execution_time=0 "$wp" eval-file "$work/repair.php" --path="$wp_path" --allow-root
          REMOTE
          }

          # Preflight is read-only and limited to a single supplier batch.
          run_batch copy audit 0 100 > /tmp/emdo-copy-preflight.log
          run_batch gallery audit 0 6 > /tmp/emdo-gallery-preflight.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ['/tmp/emdo-copy-preflight.log','/tmp/emdo-gallery-preflight.log']:
              lines=[s.split('=',1)[1] for s in Path(path).read_text().splitlines() if s.startswith('EMDO_RESUME_BATCH=')]
              assert lines, f'No preflight report: {path}'
              d=json.loads(lines[-1])
              assert d['mode']=='audit'
              if d['task']=='gallery':
                  assert 125<=d['total']<=165, 'Unexpected Latitudes inventory'
                  assert d.get('latest_created',{}).get('id'), 'Missing newest imported product'
                  Path('/tmp/emdo-supplier-total').write_text(str(d['total']))
                  print('LAST_CREATED_PRODUCT',json.dumps(d['latest_created'],ensure_ascii=False))
                  print('START_CURSOR',d.get('cursor_before',0))
              else:
                  assert d['checked']>0, 'Copy preflight contains no products'
              print('PREFLIGHT_PASS',d['task'],d['checked'],len(d['errors']))
          PY

          # Before changing catalog entries, check the latest CREATED product,
          # never scrape/recreate existing supplier rows, and wait for the
          # exact importer version that supports direct publication and timeout
          # recovery. Source import is limited to 3 pending SKUs per batch.
          EXPECTED_IMPORTER="$(sha256sum mdo-supplier-sync/includes/class-mdo-woo-importer.php | awk '{print $1}')"
          sshpass -e ssh "${SSH[@]}" "$SERVER" "sh -s -- '$PROD' '$EXPECTED_IMPORTER'" <<'REMOTE'
          set -eu
          expected="$2"; file="$1/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-woo-importer.php"
          for i in $(seq 1 120); do
            sha="$(sha256sum "$file" 2>/dev/null | awk '{print $1}' || true)"
            if [ "$sha" = "$expected" ]; then echo 'SOURCE_IMPORTER_VERSION_OK'; exit 0; fi
            sleep 5
          done
          echo 'New importer has not yet deployed; stop without importing.' >&2
          exit 31
          REMOTE
          run_source() {
            mode="$1"
            sshpass -e ssh "${SSH[@]}" "$SERVER" "sh -s -- '$PROD' '$WORK' '$mode'" <<'REMOTE'
          set -eu
          wp_path="$1"; work="$2"; mode="$3"
          php="$(command -v php || true)"
          [ -n "$php" ] || php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp="$(command -v wp)"
          timeout --kill-after=20s 650s env MDO_RESUME_SOURCE_MODE="$mode" MDO_RESUME_SOURCE_LIMIT=3 \
            "$php" -d memory_limit=1536M -d max_execution_time=0 "$wp" eval-file "$work/source.php" --path="$wp_path" --allow-root
          REMOTE
          }
          run_source audit | tee /tmp/emdo-last-product-inspection.log
          : > /tmp/emdo-incremental-source.log
          for (( IMPORT_BATCH=0; IMPORT_BATCH<30; IMPORT_BATCH++ )); do
            if ! run_source apply | tee -a /tmp/emdo-incremental-source.log; then
              echo "Source product batch interrupted. The next execution will resume from pending records." >&2
              exit 32
            fi
            MORE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          r=[json.loads(x.split('=',1)[1]) for x in Path('/tmp/emdo-incremental-source.log').read_text().splitlines() if x.startswith('EMDO_LAST_SOURCE_RESUME=')]
          assert r
          print('yes' if r[-1]['imported'] else 'no')
          PY
            )"
            [ "$MORE" = 'yes' ] || break
          done

          # Copies: batches of 100, including all published and draft products.
          for OFFSET in 0 100 200 300 400 500 600 700 800; do
            if ! run_batch copy apply "$OFFSET" 100 | tee -a /tmp/emdo-catalog-repair-batches.log; then
              echo "Copy batch failed at $OFFSET; previous batches remain saved." >&2
              exit 21
            fi
            THIS_CHECKED="$(python3 -c 'import json; s=[a.split("=",1)[1] for a in open("/tmp/emdo-catalog-repair-batches.log") if a.startswith("EMDO_RESUME_BATCH=")]; print(json.loads(s[-1])["checked"])')"
            [ "$THIS_CHECKED" != 0 ] || break
          done

          # Persisted source-row cursor in WordPress makes this *strictly*
          # resumable, even if the prior GitHub job died in mid-batch.
          # Inspect the last-created Woo product first; process next source row.
          # A later rerun sees the stored cursor and skips all finished products.
          TOTAL="$(cat /tmp/emdo-supplier-total)"
          for (( BATCH=0; BATCH<90; BATCH++ )); do
            if ! run_batch gallery apply 0 3 | tee -a /tmp/emdo-catalog-repair-batches.log; then
              echo "Gallery batch $BATCH failed; next run will start at the last saved source ID." >&2
              exit 22
            fi
            BATCH_DONE="$(python3 -c 'import json; d=[json.loads(a.split("=",1)[1]) for a in open("/tmp/emdo-catalog-repair-batches.log") if a.startswith("EMDO_RESUME_BATCH=") and "\"task\":\"gallery\"" in a]; print("1" if d[-1]["complete"] else "0")')"
            [ "$BATCH_DONE" = '0' ] || break
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s.split('=',1)[1]) for s in Path('/tmp/emdo-catalog-repair-batches.log').read_text().splitlines() if s.startswith('EMDO_RESUME_BATCH=')]
          copy=[r for r in rows if r['task']=='copy']
          gallery=[r for r in rows if r['task']=='gallery']
          assert copy and gallery, 'No applied batches'
          total=int(Path('/tmp/emdo-supplier-total').read_text())
          assert gallery[-1].get('complete') is True, 'Gallery cursor did not reach the end'
          assert not any(r['errors'] for r in gallery), 'Some product images need retry'
          source_rows=[json.loads(line.split('=',1)[1]) for line in Path('/tmp/emdo-incremental-source.log').read_text().splitlines() if line.startswith('EMDO_LAST_SOURCE_RESUME=')]
          latest_snapshot=[json.loads(line.split('=',1)[1]) for line in Path('/tmp/emdo-last-product-inspection.log').read_text().splitlines() if line.startswith('EMDO_LAST_SOURCE_RESUME=')]
          assert latest_snapshot, 'Last-created product inspection was not recorded'
          summary={
              'source_latest_product_inspection':latest_snapshot[-1]['suppliers'],
              'source_imported':sum(len(row['imported']) for row in source_rows),
              'source_import_errors':[err for row in source_rows for err in row['errors']],
              'completed_at':gallery[-1]['at'],
              'copy_products_checked':sum(r['checked'] for r in copy),
              'copy_products_updated':sum(r['changed'] for r in copy),
              'gallery_source_products':total,
              'latest_created':gallery[-1].get('latest_created'),
              'resume_cursor_first':gallery[0].get('cursor_before'),
              'resume_cursor_last':gallery[-1].get('cursor_after',gallery[-1].get('cursor_before')),
              'gallery_reached_end':gallery[-1].get('complete'),
              'gallery_products_checked':sum(r['checked'] for r in gallery),
              'gallery_products_updated':sum(r['changed'] for r in gallery),
              'photos_imported':sum(r['added'] for r in gallery),
              'errors':[{**e,'batch_offset':r['offset']} for r in rows for e in r['errors']],
              'batches':rows,
          }
          Path('.deploy-status').mkdir(exist_ok=True)
          out=Path('.deploy-status/catalog-copy-gallery-resume-20261020.json')
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print('COPY_CHECKED',summary['copy_products_checked'])
          print('COPY_UPDATED',summary['copy_products_updated'])
          print('GALLERIES_CHECKED',summary['gallery_products_checked'])
          print('GALLERIES_UPDATED',summary['gallery_products_updated'])
          print('PHOTOS_IMPORTED',summary['photos_imported'])
          print('ERRORS',len(summary['errors']))
          PY
          sshpass -e ssh "${SSH[@]}" "$SERVER" "rm -rf '$WORK'"
      - name: Persist verified batch report in MO
        run: |
          set -euo pipefail
          test -s .deploy-status/catalog-copy-gallery-resume-20261020.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-copy-gallery-resume-20261020.json
          git commit -m 'Record catalog copy and supplier photo reconciliation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

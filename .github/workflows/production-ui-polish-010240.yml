name: Production UI polish 0.10.240

on:
  push:
    paths:
      - 'elmercadodeorigen-child/inc/user-reported-corrections-010239.php'
      - '.github/workflows/production-ui-polish-010240.yml'
      - '.github/triggers/production-ui-polish-010240.trigger'

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/user-reported-corrections-010239.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          THEME="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          CORR="$THEME/inc/user-reported-corrections-010239.php"
          BAK="/tmp/user-reported-corrections-010240-${GITHUB_RUN_ID}.bak"
          PROBE="elmercado-opcache-ui-polish-${GITHUB_RUN_ID}.php"
          ROLLED_BACK=0

          rollback() {
            code=$?
            [ "$ROLLED_BACK" -eq 0 ] || exit "$code"
            ROLLED_BACK=1
            set +e
            echo ROLLBACK_START
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              if [ -f '$BAK' ]; then cp -p '$BAK' '$CORR'; fi
              rm -f '$BAK' '$PROD_PATH/$PROBE'
              wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
            " || true
            echo ROLLED_BACK
            exit "${code:-1}"
          }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$CORR' && cp -p '$CORR' '$BAK'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/user-reported-corrections-010239.php "$STAGING_USER@$STAGING_HOST:$CORR"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$CORR' >/dev/null
            wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          set +e
          for i in $(seq 1 6); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$' && break
            sleep 2
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" >/dev/null 2>&1
          set -e

          marker_ok=0
          set +e
          for i in $(seq 1 10); do
            shop="$(curl -fsSL --connect-timeout 10 --max-time 35 -H 'Cache-Control: no-store' -H 'Pragma: no-cache' "$BASE_URL/tienda/?release240=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            if grep -Fq 'elmercado-production-ui-polish-010240' <<<"$shop" && grep -Fq 'elmercado-user-reported-corrections-010240' <<<"$shop"; then marker_ok=1; break; fi
            sleep 3
          done
          set -e
          test "$marker_ok" -eq 1

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const isVisible=el=>{
            if(!el) return false;
            const s=getComputedStyle(el),r=el.getBoundingClientRect();
            return s.display!=='none'&&s.visibility!=='hidden'&&parseFloat(s.opacity||'1')>0&&r.width>0&&r.height>0;
          };
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});

            for(const width of [390,1440]){
              const page=await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setViewport({width,height:1000});
              await page.goto(`${process.env.BASE_URL}/productores/?qa240=${Date.now()}-${width}`,{waitUntil:'domcontentloaded',timeout:60000});
              await sleep(2600);
              const result=await page.evaluate(()=>{
                const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&parseFloat(s.opacity||'1')>0&&r.width>0&&r.height>0;};
                const bars=[...document.querySelectorAll('.wcfmmp-store-search-form,.wcfmmp-store-search-form-box,.wcfmmp-store-lists-sorting,[class*="store-search-form"]')];
                return {marker:!!document.querySelector('#elmercado-production-ui-polish-010240'),visibleBars:bars.filter(visible).map(el=>({cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,120)})),visibleCounts:[...document.querySelectorAll('.woocommerce-result-count')].filter(visible).length};
              });
              console.log(`PRODUCERS_240_${width}`,JSON.stringify(result));
              if(!result.marker||result.visibleBars.length||result.visibleCounts) throw new Error(`Producer cleanup failed at ${width}`);
              await page.close();
            }

            for(const width of [390,1440]){
              const page=await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setViewport({width,height:1000});
              await page.goto(`${process.env.BASE_URL}/tienda/?qa240=${Date.now()}-${width}`,{waitUntil:'domcontentloaded',timeout:60000});
              await sleep(900);
              const result=await page.evaluate(()=>{
                const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&parseFloat(s.opacity||'1')>0&&r.width>0&&r.height>0;};
                const leads=[...document.querySelectorAll('.emo-shop-lead--final')];
                const sold=[...document.querySelectorAll('ul.products li.product .wcfmmp_sold_by_container')];
                return {marker:!!document.querySelector('#elmercado-production-ui-polish-010240'),visibleFinalLead:leads.filter(visible).length,bodyHasRemovedCopy:(document.body.innerText||'').includes('Una selección de productos con procedencia clara para acercar el origen a tu mesa de una forma más directa.'),visibleSoldBy:sold.filter(visible).length};
              });
              console.log(`SHOP_240_${width}`,JSON.stringify(result));
              if(!result.marker||result.visibleFinalLead||result.bodyHasRemovedCopy||result.visibleSoldBy<1) throw new Error(`Shop cleanup failed at ${width}`);
              await page.close();
            }

            {
              const page=await browser.newPage();
              await page.setJavaScriptEnabled(false);
              await page.setCacheEnabled(false);
              await page.setViewport({width:390,height:1000});
              await page.goto(`${process.env.BASE_URL}/tienda/hidalgo-de-la-jara/?qa240-nojs=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              const result=await page.evaluate(()=>{
                const el=document.querySelector('#wcfmmp-store .woocommerce-result-count');
                if(!el) return null;
                const s=getComputedStyle(el),after=getComputedStyle(el,'::after');
                return {text:(el.textContent||'').replace(/\s+/g,' ').trim(),fontSize:s.fontSize,color:s.color,after:after.content,afterSize:after.fontSize,afterColor:after.color,marker:!!document.querySelector('#elmercado-production-ui-polish-010240')};
              });
              console.log('VENDOR_240_NOJS',JSON.stringify(result));
              if(!result||!result.marker||parseFloat(result.fontSize)!==0||!String(result.after).includes('17 resultados')) throw new Error('Vendor pre-paint count guard failed');
              await page.close();
            }

            {
              const page=await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setViewport({width:390,height:1000});
              await page.goto(`${process.env.BASE_URL}/tienda/hidalgo-de-la-jara/?qa240=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('ul.products li.product',{timeout:30000});
              let state;
              for(let i=0;i<20;i++){
                state=await page.evaluate(()=>({count:[...document.querySelectorAll('ul.products>li.product')].length,loading:!!window.__emoCatalogLoaderState?.loading,next:window.__emoCatalogLoaderState?.nextUrl||''}));
                if(state.count>=17&&!state.loading&&!state.next) break;
                await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
                await sleep(700);
              }
              await sleep(500);
              const result=await page.evaluate(()=>{
                const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&parseFloat(s.opacity||'1')>0&&r.width>0&&r.height>0;};
                const sold=[...document.querySelectorAll('#wcfmmp-store ul.products li.product .wcfmmp_sold_by_container,#wcfmmp-store ul.products li.product [class*="sold_by"]')];
                return {marker:!!document.querySelector('#elmercado-production-ui-polish-010240'),countText:(document.querySelector('#wcfmmp-store .woocommerce-result-count')?.textContent||'').replace(/\s+/g,' ').trim(),products:document.querySelectorAll('ul.products>li.product').length,visibleSoldBy:sold.filter(visible).length,bodyHasSoldBy:/Vendido por:/i.test(document.body.innerText||'')};
              });
              console.log('VENDOR_240_FINAL',JSON.stringify(result));
              if(!result.marker||result.countText!=='17 resultados'||result.products!==17||result.visibleSoldBy||result.bodyHasSoldBy) throw new Error('Vendor final UI cleanup failed');
              await page.close();
            }

            await browser.close();
            console.log('PRODUCTION_UI_POLISH_010240_QA_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BAK' '$PROD_PATH/$PROBE'"
          trap - ERR
          echo PRODUCTION_UI_POLISH_010240_OK

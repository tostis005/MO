name: Isolate production checkout plugin memory v3 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-checkout-plugin-isolation-v3-20260815.yml']

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Install temporary request-scoped plugin filter
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); grep -q "elmercadodeorigen" "$cfg" 2>/dev/null || true; if [ -f "$p/wp-content/themes/elmercadodeorigen-child/functions.php" ]; then printf "%s" "$p"; break; fi; done
          ')"
          : "${PROD_PATH:?production path not found}"; echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          TOKEN="mdo-${GITHUB_RUN_ID}-checkout"; echo "DIAG_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' TOKEN='$TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          cat > "$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php" <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit;
          $expected='__TOKEN__';
          $given=isset($_GET['mdo_checkout_diag'])?(string)$_GET['mdo_checkout_diag']:'';
          if(!hash_equals($expected,$given)) return;
          $raw=isset($_GET['mdo_disable'])?(string)$_GET['mdo_disable']:'';
          $disable=array_values(array_filter(array_map('sanitize_key',explode(',',$raw))));
          if(!$disable) return;
          $matches=static function($plugin)use($disable){
              $plugin=strtolower((string)$plugin); $dir=(string)strtok($plugin,'/'); $base=strtolower(basename($plugin,'.php'));
              foreach($disable as $slug){ if($slug===$dir||$slug===$base||str_contains($dir,$slug)||str_contains($base,$slug)) return true; }
              return false;
          };
          add_filter('option_active_plugins',static function($plugins)use($matches){return is_array($plugins)?array_values(array_filter($plugins,static fn($p)=>!$matches($p))):$plugins;},-99999);
          add_filter('site_option_active_sitewide_plugins',static function($plugins)use($matches){if(!is_array($plugins))return $plugins;foreach(array_keys($plugins)as$p){if($matches($p))unset($plugins[$p]);}return $plugins;},-99999);
          PHP
          sed -i "s/__TOKEN__/$TOKEN/g" "$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php"
          "$php_bin" -l "$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php"
          REMOTE
      - name: Probe plugin groups without changing global activation
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com/finalizar-compra/'
          probe(){
            label="$1"; disable="$2"
            code=$(curl -ksS --max-time 40 -o "/tmp/$label.html" -w '%{http_code}' "$base?mdo_checkout_diag=${DIAG_TOKEN}&mdo_disable=${disable}&mdo_probe=${GITHUB_RUN_ID}" || true)
            bytes=$(wc -c <"/tmp/$label.html" 2>/dev/null || echo 0)
            loc=$(grep -i '^location:' "/tmp/$label.headers" 2>/dev/null | tail -n1 || true)
            echo "$label code=$code bytes=$bytes disable=$disable $loc"
          }
          probe baseline ''
          probe no_trp 'translatepress-multilingual'
          probe no_checkout_manager 'woocommerce-checkout-manager'
          probe no_flexible_checkout 'flexible-checkout-fields,flexible-checkout-fields-pro'
          probe no_rules 'rulesengine,woo-discount-rules,woo-discount-rules-pro,payment-gateway-based-fees-and-discounts-for-woocommerce'
          probe no_tracking_crm 'pixelyoursite-pro,fluentcrm-woocommerce,mailchimp-for-woocommerce'
          probe no_marketplace 'wc-multivendor-marketplace,wc-multivendor-membership,wcfm,woo-wcfm-vendor'
          probe no_payments 'woocommerce-gateway-stripe,woocommerce-gateway-paypal-express-checkout,mollie-payments-for-woocommerce'
          probe no_shipping 'shipping-method-display-style-for-woocommerce,show-shipping-class-in-product-page,woocommerce-advanced-shipment-tracking,woocommerce-shipping-tracking'
          probe no_extras 'woocommerce-gift-cards,woocommerce-product-addons,woocommerce-product-bundles,woocommerce-subscriptions,ni-purchase-order-quantity'
          probe broad_checkout 'translatepress-multilingual,woocommerce-checkout-manager,flexible-checkout-fields,flexible-checkout-fields-pro,rulesengine,woo-discount-rules,woo-discount-rules-pro,payment-gateway-based-fees-and-discounts-for-woocommerce,pixelyoursite-pro,fluentcrm-woocommerce,mailchimp-for-woocommerce,wc-multivendor-marketplace,wc-multivendor-membership,wcfm,woo-wcfm-vendor,woocommerce-gateway-stripe,woocommerce-gateway-paypal-express-checkout,mollie-payments-for-woocommerce,shipping-method-display-style-for-woocommerce,show-shipping-class-in-product-page,woocommerce-advanced-shipment-tracking,woocommerce-shipping-tracking,woocommerce-gift-cards,woocommerce-product-addons,woocommerce-product-bundles,woocommerce-subscriptions,ni-purchase-order-quantity'
      - name: Remove temporary request-scoped plugin filter
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php'"

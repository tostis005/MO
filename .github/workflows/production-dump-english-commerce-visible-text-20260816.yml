name: Production dump English commerce visible text 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-dump-english-commerce-visible-text-20260816.yml'
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump visible text from filled English cart and checkout
        run: |
          python3 - <<'PY'
          import html, http.cookiejar, re, time, urllib.parse, urllib.request
          base='https://www.elmercadodeorigen.com'; jar=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar)); op.addheaders=[('User-Agent','MDO-English-Text-Dump/1.0')]
          def req(path,data=None):
              payload=urllib.parse.urlencode(data).encode() if data else None
              r=op.open(base+path,data=payload,timeout=45); return r.read().decode('utf-8','replace')
          def lines(body):
              s=re.sub(r'(?is)<script\b.*?</script>|<style\b.*?</style>|<noscript\b.*?</noscript>|<svg\b.*?</svg>|<head\b.*?</head>',' ',body)
              s=re.sub(r'(?is)<!--.*?-->',' ',s); s=re.sub(r'(?s)<[^>]+>','\n',s); s=html.unescape(s)
              out=[]
              for x in s.splitlines():
                  x=re.sub(r'\s+',' ',x).strip()
                  if 1 < len(x) <= 240 and x not in out: out.append(x)
              return out
          data={'attribute_pa_tamano':'envase-de-5l-de-pet','attribute_pa_variedad':'sin-filtrar-de-martena-picual','add-to-cart':'1056','product_id':'1056','variation_id':'2486','quantity':'1'}
          req('/producto/aceite-de-oliva-virgen-extra-5l/',data)
          for label,path in [('CART','/en/cart/'),('CHECKOUT','/en/checkout/'),('ACCOUNT','/en/my-account/')]:
              print('\n===== '+label+' =====')
              for i,x in enumerate(lines(req(path)),1): print(f'{i:03d}|{x}')
          print('ORDER_CREATED=NO')
          PY

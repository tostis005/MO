name: Check final Puente/Catedrático verification status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-final-puente-catedratico-verification-status-20260818.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify-puente-catedratico-prelaunch-en-final-20260818.yml/runs?per_page=5" > runtime/prelaunch-puente-catedratico-final-verify-status-20260818.json
      - name: Commit status
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f runtime/prelaunch-puente-catedratico-final-verify-status-20260818.json
          git commit -m 'Record final Puente/Catedrático verification status' || true
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply destination-aware catalogue counts

on:
  push:
    branches: [feature/catalog-destination-frontend]
    paths: ['.github/workflows/apply-catalog-destination-counts-20260820.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/catalog-destination-frontend
          fetch-depth: 0
      - name: Make catalogue totals destination-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php')
          text = path.read_text()
          old = '''function elmercado_catalog_counts_excluded_authors_010217(): array {
          \tif ( elmercado_catalog_counts_can_view_disabled_010217() || ! function_exists( 'elmercado_wcfm_disabled_vendor_ids_010210' ) ) {
          \t\treturn array();
          \t}

          \treturn array_values(
          \t\tarray_unique(
          \t\t\tarray_filter(
          \t\t\t\tarray_map( 'absint', elmercado_wcfm_disabled_vendor_ids_010210() )
          \t\t\t)
          \t\t)
          \t);
          }'''
          new = '''function elmercado_catalog_counts_excluded_authors_010217(): array {
          \t$excluded = array();

          \t/* Los administradores pueden auditar vendedores offline, pero el destino seleccionado sigue aplicando. */
          \tif ( ! elmercado_catalog_counts_can_view_disabled_010217() && function_exists( 'elmercado_wcfm_disabled_vendor_ids_010210' ) ) {
          \t\t$excluded = array_merge( $excluded, (array) elmercado_wcfm_disabled_vendor_ids_010210() );
          \t}

          \t/* EMDO añade los vendedores que no sirven el destino actual (España por defecto, sin geolocalización). */
          \tif ( class_exists( 'MDO_Catalog_Destination_Frontend' ) ) {
          \t\t$excluded = array_merge( $excluded, MDO_Catalog_Destination_Frontend::excluded_vendor_ids() );
          \t}

          \treturn array_values(
          \t\tarray_unique(
          \t\t\tarray_filter(
          \t\t\t\tarray_map( 'absint', $excluded )
          \t\t\t)
          \t\t)
          \t);
          }'''
          if old not in text:
              raise SystemExit('Expected excluded-authors function not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l mu-plugins/mdo-catalog-destination-frontend-20260820.php
          php -l elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-catalog-destination-counts-20260820.yml
          git add elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php mu-plugins/mdo-catalog-destination-frontend-20260820.php
          git commit -m 'Make catalogue counts destination-aware'
          git push origin HEAD:feature/catalog-destination-frontend

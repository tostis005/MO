name: Hide language switchers in production 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-language-switchers-production-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate language UI suppression
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/falang-switcher-010245.php >/dev/null
          grep -Fq 'elmercado-language-switchers-hidden-010246' elmercadodeorigen-child/inc/falang-switcher-010245.php
          grep -Fq 'display: none !important' elmercadodeorigen-child/inc/falang-switcher-010245.php
          if grep -Fq "do_shortcode( '[falangsw" elmercadodeorigen-child/inc/falang-switcher-010245.php; then
            echo 'LANGUAGE_UI_ABORT: custom Falang switcher is still rendered' >&2
            exit 4
          fi
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy suppression to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo 'PRODUCTION_LOCATED=1'
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

          REMOTE_FILE="/tmp/mdo-hide-language-switchers-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/inc/falang-switcher-010245.php "$STAGING_USER@$STAGING_HOST:$REMOTE_FILE"
          echo 'PRODUCTION_UPLOAD_OK=1'

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' REMOTE_FILE='$REMOTE_FILE' bash -s" <<'REMOTE'
          set -euo pipefail
          theme="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          target="$theme/inc/falang-switcher-010245.php"
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -f "$theme/functions.php"
          mkdir -p "$theme/inc"
          if [ -f "$target" ]; then
            cp -a "$target" "$target.before-hide-language-switchers-${GITHUB_RUN_ID}"
          fi
          install -m 0644 "$REMOTE_FILE" "$target"
          "$php_bin" -l "$target" >/dev/null
          grep -Fq 'elmercado-language-switchers-hidden-010246' "$target"
          rm -f "$REMOTE_FILE"
          echo 'PRODUCTION_INSTALL_OK=1'
          REMOTE

      - name: Flush production cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); if [ -n \"\$wp_bin\" ]; then \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; fi"

      - name: Verify Spanish and English public storefronts
        shell: bash
        run: |
          set -euo pipefail
          for lang_path in '' 'en/'; do
            suffix="${lang_path//\//-}"
            url="https://www.elmercadodeorigen.com/${lang_path}?mdo_hide_lang_verify=${GITHUB_RUN_ID}"
            file="/tmp/mdo-lang-${suffix:-es}.html"
            curl -fsSL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 EMDO language UI verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o "$file" "$url"
            grep -Fq 'id="elmercado-language-switchers-hidden-010246"' "$file"
            if grep -Fq '<div class="elmercado-falang-switcher"' "$file"; then
              echo "LANGUAGE_UI_PUBLIC_ABORT: old custom switcher visible on /${lang_path}" >&2
              exit 8
            fi
            if grep -Eq '<[^>]+class="[^"]*falang-language-switcher' "$file"; then
              echo "LANGUAGE_UI_NOTE: Falang markup exists on /${lang_path}, but suppression CSS is active"
            fi
          done
          echo 'LANGUAGE_UI_PUBLIC_OK: switcher render removed; suppression active on ES and EN URLs'

name: Request 010206 filter final smoke

on:
  push:
    paths:
      - 'elmercadodeorigen-child/functions.php'
      - 'elmercadodeorigen-child/inc/category-specific-filters-010185.php'
      - 'elmercadodeorigen-child/inc/catalog-filter-system-final-010206.php'
      - '.github/scripts/request-010206-filter-final-smoke.cjs'
      - '.github/workflows/request-010206-filter-final-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Validate smoke syntax
        run: node --check .github/scripts/request-010206-filter-final-smoke.cjs
      - name: Review definitive filter system on staging
        run: node .github/scripts/request-010206-filter-final-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-010206-filter-final-smoke
          path: qa/
          retention-days: 14

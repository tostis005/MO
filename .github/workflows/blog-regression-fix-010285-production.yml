name: Publish Wagyu 65 through registered production runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-regression-fix-010285-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-wagyu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify protected Wagyu batch
        shell: bash
        run: bash .github/scripts/run-wagyu-65-production.sh

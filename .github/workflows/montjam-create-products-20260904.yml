name: Montjam create products 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/montjam-create-products-20260904.yml'
      - '.github/scripts/montjam-create-products-20260904.php'
      - '.github/scripts/montjam-adjustments-20260904.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate importer and adjustments
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/montjam-create-products-20260904.php
          php -l .github/scripts/montjam-adjustments-20260904.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Create Montjam products in production and apply final adjustments
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          # Keep the legacy source importer safe to rerun: use globally unique SKUs and
          # normalize the brand spelling at runtime so it cannot recreate Mont Jam/mont-jam.
          cp .github/scripts/montjam-create-products-20260904.php /tmp/montjam-importer.php
          sed -i 's/MJ-JN-/MONTJAM-JN-/g; s/MJ-JR-/MONTJAM-JR-/g; s/MJ-PN-/MONTJAM-PN-/g; s/Mont Jam/Montjam/g; s/mont-jam/montjam/g' /tmp/montjam-importer.php

          REMOTE_IMPORTER="/tmp/montjam-create-products-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS /tmp/montjam-importer.php "$STAGING_USER@$STAGING_HOST:$REMOTE_IMPORTER"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_IMPORTER' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_IMPORTER'; exit \$rc"

          # The final adjustment is deliberately run after every importer execution. It keeps
          # descriptions free of changeable format choices and expands YITH associations to
          # every variation so the FORMATO selector does not disappear after variation AJAX.
          REMOTE_ADJUST="/tmp/montjam-adjustments-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/montjam-adjustments-20260904.php "$STAGING_USER@$STAGING_HOST:$REMOTE_ADJUST"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_ADJUST' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_ADJUST'; exit \$rc"

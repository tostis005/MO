name: Deploy current scoped commerce observer 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-current-commerce-observer-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-current-commerce-observer-20260819
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate current commerce source
        run: |
          set -euo pipefail
          node --check elmercadodeorigen-child/assets/js/commerce.js
          grep -q 'miniCartObserver.observe(miniCartPanel' elmercadodeorigen-child/assets/js/commerce.js
          ! grep -q 'miniCartObserver.observe(document.body' elmercadodeorigen-child/assets/js/commerce.js

      - name: Deploy commerce.js
        id: deploy
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/current-commerce-${GITHUB_RUN_ID}.js"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/js/commerce.js "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'; STATIC='$PROD_PATH/wp-content/uploads/elmercado-home-static'
            install -m 0644 '$REMOTE' \"\$THEME/assets/js/commerce.js\"
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true)
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f \"\$STATIC/index.html\" '$REMOTE'
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 "https://www.elmercadodeorigen.com/wp-content/themes/elmercadodeorigen-child/assets/js/commerce.js?verify=${GITHUB_RUN_ID}" -o /tmp/live.js
          grep -q 'miniCartObserver.observe(miniCartPanel' /tmp/live.js
          ! grep -q 'miniCartObserver.observe(document.body' /tmp/live.js

      - name: Browser regression
        id: browser
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > /tmp/browser.json
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setViewport({width:412,height:915,deviceScaleFactor:1});
            await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle2',timeout:60000});
            const d=await p.evaluate(async()=>{
              const panel=document.querySelector('#shop-cart-sidebar');
              let applied=null;
              if(panel){const li=document.createElement('li');li.className='woocommerce-mini-cart-item';li.innerHTML='<a href="/">Producto prueba</a>';panel.append(li);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));applied=li.classList.contains('emo-mini-cart-item');li.remove();}
              return {panel:!!panel,role:panel?.getAttribute('role')||'',label:panel?.getAttribute('aria-label')||'',observerApplied:applied,cartLabel:document.querySelector('.shopping-bag-button.shopping-cart, a.shopping-cart')?.getAttribute('aria-label')||''};
            });
            console.log(JSON.stringify(d)); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat /tmp/browser.json > runtime/home-commerce-current-20260819.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/browser.json')); print(d)
          assert d['panel'] and d['observerApplied'] is True,d
          PY

      - name: Lighthouse 3x
        id: lighthouse
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/lh-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet; done
          python3 - <<'PY' >> runtime/home-commerce-current-20260819.txt
          import json,statistics
          rows=[]
          for i in (1,2,3):
              a=json.load(open(f'/tmp/lh-{i}.json')); x=a['audits']; commerce=0; jquery=0; theme=0; unat=0
              for z in (x.get('bootup-time',{}).get('details') or {}).get('items',[]):
                  if '/assets/js/commerce.js' in z.get('url',''): commerce += z.get('total',0) or 0
              for g in (x.get('forced-reflow-insight',{}).get('details') or {}).get('items',[]):
                  for z in g.get('items',[]):
                      src=z.get('source') or {}; u=(src.get('url') or src.get('value') or '') if isinstance(src,dict) else ''; t=z.get('reflowTime',0) or 0
                      if '/jquery/jquery.min.js' in u: jquery+=t
                      if '/assets/js/theme.js' in u: theme+=t
                      if 'unattributed' in u.lower(): unat+=t
              r={'score':round(a['categories']['performance']['score']*100),'fcp':round(x['first-contentful-paint']['numericValue']),'lcp':round(x['largest-contentful-paint']['numericValue']),'tbt':round(x['total-blocking-time']['numericValue']),'cls':round(x['cumulative-layout-shift']['numericValue'],5),'commerce_cpu':round(commerce,1),'jquery_reflow':round(jquery,3),'theme_reflow':round(theme,3),'unattributed_reflow':round(unat,3)}
              rows.append(r); print('run',i,r)
          for k in rows[0]: print('median_'+k+'=',statistics.median(r[k] for r in rows))
          PY
          cat runtime/home-commerce-current-20260819.txt

      - name: Record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-commerce-current-20260819.txt ] || printf 'deploy=%s\nbrowser=%s\nlighthouse=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.lighthouse.outcome }}' > runtime/home-commerce-current-20260819.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-commerce-current-20260819.txt
          git commit -m 'Record current scoped commerce observer' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Catalogue visual finish 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-visual-finish-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only visual owner
        shell: bash
        run: |
          set -euo pipefail
          f='mu-plugins/zzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-controls-visual-finish-20260828.php'
          php -l "$f" >/dev/null
          ! grep -Eq '<script|new[[:space:]]+MutationObserver|new[[:space:]]+ResizeObserver|requestAnimationFrame[[:space:]]*\(|setInterval[[:space:]]*\(|setTimeout[[:space:]]*\(' "$f"

      - name: Deploy visual owner
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          NAME='zzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-controls-visual-finish-20260828.php'
          TARGET="$PROD/wp-content/mu-plugins/$NAME"
          BACKUP="/tmp/$NAME.$GITHUB_RUN_ID.backup"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"; echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$TARGET'"; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BACKUP'"; echo EXISTED=1 >> "$GITHUB_ENV"
          else
            echo EXISTED=0 >> "$GITHUB_ENV"
          fi
          REMOTE="/tmp/$NAME.$GITHUB_RUN_ID"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; install -m0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify live visual finish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time,json,sys
          urls={
            'global':'https://www.elmercadodeorigen.com/tienda/?visual_finish=1',
            'producer':'https://www.elmercadodeorigen.com/tienda/1957/?visual_finish=1',
          }
          widths=[335,390,640,767,768,1024,1440]
          errors=[]; report={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for w in widths:
              report[str(w)]={}
              for kind,url in urls.items():
                page=browser.new_page(viewport={'width':w,'height':850})
                page.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','font','media') else r.continue_())
                page.goto(url,wait_until='commit',timeout=30000)
                data=None
                for _ in range(50):
                  time.sleep(.25)
                  try:
                    data=page.evaluate('''() => {
                      const t=document.querySelector('.emo-catalog-toolbar-shared-010229');
                      const f=t?.querySelector('.woocommerce-ordering');
                      const s=f?.querySelector('select[name="orderby"]');
                      const d=t?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]');
                      const span=d?.querySelector('span');
                      const strong=d?.querySelector('strong');
                      const icons=d?.querySelectorAll(':scope > svg');
                      const pin=icons?.[0]||null, chev=icons?.[icons.length-1]||null;
                      const b=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}};
                      const cs=e=>e?getComputedStyle(e):null;
                      return {
                        ready:!!(t&&f&&s&&d&&span&&strong&&pin&&chev),
                        visual:!!document.getElementById('mdo-catalog-controls-visual-finish-20260828'),
                        old:[!!document.getElementById('mdo-catalog-control-widths-20260828'),!!document.getElementById('mdo-catalog-mobile-runtime-guard-20260824'),!!document.getElementById('mdo-catalog-top-controls-parity-final-20260824-js'),!!document.getElementById('mdo-catalog-top-controls-arrow-final-20260824-js'),!!document.getElementById('elmercado-catalog-mobile-controls-parity-script-010236')],
                        t:b(t), f:b(f), s:b(s), d:b(d), pin:b(pin), chev:b(chev),
                        dAlign:cs(d)?.textAlign, spanAlign:cs(span)?.textAlign,
                        spanWeight:parseInt(cs(span)?.fontWeight||'0',10), strongWeight:parseInt(cs(strong)?.fontWeight||'0',10),
                        pinDisplay:cs(pin)?.display, chevDisplay:cs(chev)?.display,
                        sAlign:cs(s)?.textAlign, sAlignLast:cs(s)?.textAlignLast,
                        sBg:cs(s)?.backgroundImage,
                        overflow:document.documentElement.scrollWidth-innerWidth,
                        pointer:cs(s)?.pointerEvents, disabled:!!s?.disabled
                      };
                    }''')
                    if data.get('ready'):
                      time.sleep(.6)
                      break
                  except Exception:
                    data=None
                report[str(w)][kind]=data
                if not data or not data['visual']:
                  errors.append(f'{kind} {w}: visual owner unavailable'); page.close(); continue
                if any(data['old']): errors.append(f'{kind} {w}: retired visual runtime present {data["old"]}')
                if data['overflow']>1: errors.append(f'{kind} {w}: overflow {data["overflow"]}')
                if data['dAlign']!='left' or data['spanAlign']!='left': errors.append(f'{kind} {w}: destination text not left aligned')
                if data['sAlign']!='left': errors.append(f'{kind} {w}: ordering text not left aligned ({data["sAlign"]})')
                if data['strongWeight'] <= data['spanWeight']: errors.append(f'{kind} {w}: destination is not bolder ({data["spanWeight"]}/{data["strongWeight"]})')
                if data['pinDisplay']=='none' or abs(data['pin']['w']-14)>1.5: errors.append(f'{kind} {w}: pin missing/wrong size')
                if data['chevDisplay']=='none' or abs(data['chev']['w']-12)>1.5 or abs(data['chev']['h']-8)>1.5: errors.append(f'{kind} {w}: destination chevron wrong')
                if not data['sBg'] or data['sBg']=='none': errors.append(f'{kind} {w}: ordering chevron missing')
                if data['pointer']=='none' or data['disabled']: errors.append(f'{kind} {w}: ordering blocked')
                if w<=767:
                  if abs(data['d']['w']-data['s']['w'])>3: errors.append(f'{kind} {w}: mobile widths differ {data["d"]["w"]}/{data["s"]["w"]}')
                  if w==335 and data['s']['w']<260: errors.append(f'{kind} 335: ordering too narrow {data["s"]["w"]}')
                try:
                  responsive=page.evaluate('''() => {const s=document.querySelector('.emo-catalog-toolbar-shared-010229 select[name="orderby"]'); const b=document.querySelector('.emo-catalog-toolbar-shared-010229 [data-mdo-destination-open],.emo-catalog-toolbar-shared-010229 [data-mdo-ps-destination-open]'); s.focus(); b.click(); return document.activeElement===s || true;}''')
                  time.sleep(.15)
                  modal=page.evaluate('''() => {const m=document.querySelector('[data-mdo-destination-modal],[data-mdo-ps-modal],.mdo-destination-modal,.mdo-ps-modal'); return !!m && !m.hidden && getComputedStyle(m).display!=='none';}''')
                  if not modal: errors.append(f'{kind} {w}: destination modal did not open')
                except Exception as e:
                  errors.append(f'{kind} {w}: interaction {type(e).__name__}')
                page.close()
            browser.close()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:
            print('ERRORS:'); print('\n'.join('- '+x for x in errors)); sys.exit(1)
          print('CATALOG_VISUAL_FINISH_VERIFIED=true')
          PY

      - name: Roll back on failure
        if: failure() && env.TARGET != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "${EXISTED:-0}" = 1 ]; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 '$BACKUP' '$TARGET'; rm -f '$BACKUP'"
          else
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET'"
          fi

      - name: Remove backup
        if: success() && env.EXISTED == '1'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

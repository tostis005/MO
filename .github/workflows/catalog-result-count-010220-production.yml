name: Catalog result count 0.10.220 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-result-count-010220-production.yml'
      - 'elmercadodeorigen-child/inc/catalog-result-total-010220.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-result-count-010220-production
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Validate catalog result count module
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          FILE='elmercadodeorigen-child/inc/catalog-result-total-010220.php'
          php -l "$FILE" >/dev/null
          grep -Fq 'function elmercado_catalog_remove_legacy_result_count_010220' "$FILE"
          grep -Fq "wp_normalize_path( ELMERCADO_THEME_PATH . '/inc/catalog-visibility-counts-010217.php' )" "$FILE"
          grep -Fq 'emo-catalog-result-count-010220' "$FILE"
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy module to production
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          LOCAL='elmercadodeorigen-child/inc/catalog-result-total-010220.php'
          TMP="/tmp/catalog-result-total-010220-${GITHUB_RUN_ID}.php"
          TARGET="$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/catalog-result-total-010220.php"
          BACKUP="/tmp/catalog-result-total-010220-${GITHUB_RUN_ID}.backup.php"
          sshpass -e scp $SCP "$LOCAL" "$STAGING_USER@$STAGING_HOST:$TMP"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            test -f '$TARGET'
            php_bin=/opt/plesk/php/8.3/bin/php
            [ -x \"\$php_bin\" ] || php_bin=\$(command -v php)
            \"\$php_bin\" -l '$TMP' >/dev/null
            cp -p '$TARGET' '$BACKUP'
            install -m 0644 '$TMP' '$TARGET'
            \"\$php_bin\" -l '$TARGET' >/dev/null
            rm -f '$TMP'
          "

      - name: Flush WordPress object cache
        id: cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp)
            php_bin=/opt/plesk/php/8.3/bin/php
            [ -x \"\$php_bin\" ] || php_bin=\$(command -v php)
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

      - name: Verify initial shop HTML
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            URL="https://www.elmercadodeorigen.com/tienda/?emdo_result_count_verify=${GITHUB_RUN_ID}-$i"
            curl -fsS --compressed --max-time 50 -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "$URL" -o "/tmp/emdo-shop-$i.html"
          done
          cp /tmp/emdo-shop-3.html /tmp/emdo-shop.html
          OLD_COUNT="$(grep -Fc '<p class="woocommerce-result-count emo-catalog-result-count-010218"' /tmp/emdo-shop.html || true)"
          NEW_COUNT="$(grep -Fc '<p class="woocommerce-result-count emo-catalog-result-count-010220"' /tmp/emdo-shop.html || true)"
          printf 'old=%s\nnew=%s\n' "$OLD_COUNT" "$NEW_COUNT" >/tmp/catalog-result-count-verify.txt
          echo "CATALOG_RESULT_COUNTS old=$OLD_COUNT new=$NEW_COUNT"
          test "$OLD_COUNT" -eq 0
          test "$NEW_COUNT" -eq 1

      - name: Record deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OLD_COUNT='unknown'; NEW_COUNT='unknown'
          if [ -f /tmp/catalog-result-count-verify.txt ]; then
            OLD_COUNT="$(sed -n 's/^old=//p' /tmp/catalog-result-count-verify.txt | head -n1)"
            NEW_COUNT="$(sed -n 's/^new=//p' /tmp/catalog-result-count-verify.txt | head -n1)"
          fi
          mkdir -p .deploy-status
          cat > .deploy-status/catalog-result-count-010220.txt <<EOF
          validate=${{ steps.validate.outcome }}
          deploy=${{ steps.deploy.outcome }}
          cache=${{ steps.cache.outcome }}
          verify=${{ steps.verify.outcome }}
          old_count=$OLD_COUNT
          new_count=$NEW_COUNT
          commit=${GITHUB_SHA}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/catalog-result-count-010220.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record catalog result count deployment verification [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

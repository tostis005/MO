name: Final production multilingual verification 2026-08-15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-multilingual-postfix-20260815.yml'
      - '.github/data/native-translations-20260815/*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save puppeteer-core@24 >/dev/null
      - name: Persist latest reviewed translations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/mdo-postfix-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-native-translations.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/import.php"
          sshpass -e scp $SCP_OPTIONS .github/data/native-translations-20260815/*.json "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" eval-file "$REMOTE_DIR/import.php" --path="$PROD_PATH" --allow-root
          "$php_bin" -d display_errors=0 "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          rm -rf "$REMOTE_DIR"
          REMOTE
      - name: Browser verify key pages and full English catalog
        shell: bash
        run: |
          set -euo pipefail
          cat > ./verify.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const b=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          async function check(url, forbidden=[]){const p=await b.newPage();const r=await p.goto(url+'?mdo_postfix='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});const d=await p.evaluate(()=>({selector:!!document.querySelector('.trp-language-switcher,.trp-floater-ls,.mdo-language-switcher'),text:document.body?.innerText||'',lang:document.documentElement.lang}));console.log('PAGE',url,r.status(),d.lang,'selector',d.selector);if(r.status()!==200||d.selector)throw new Error('Page failed '+url);for(const x of forbidden)if(d.text.includes(x))throw new Error('Spanish remnant '+x+' '+url);await p.close();}
          await check('https://www.elmercadodeorigen.com/en/');
          await check('https://www.elmercadodeorigen.com/en/blog/',['Historias para elegir con más criterio.','Ideas, procesos y personas para entender qué hay detrás de un producto y por qué su origen importa.']);
          await check('https://www.elmercadodeorigen.com/en/producto/jamon-de-bellota-100-iberico/',['Jamón procedente de un cerdo de pura raza ibérica','Envíos en 1-2 días hábiles','Deshuesado','Loncheado']);
          await check('https://www.elmercadodeorigen.com/en/producto/jamon-de-bellota-100-iberico-en-sobres/',['Cortado a cuchillo']);
          await check('https://www.elmercadodeorigen.com/en/inicio-bf/',['Leer más']);
          await check('https://www.elmercadodeorigen.com/en/condiciones-especiales/',['PRODUCTOS LÁCTEOS ARTESANALES']);
          await check('https://www.elmercadodeorigen.com/en/producto/aceite-de-oliva-virgen-extra-5l/',['Gastos de envío incluidos','Gasto de envío incluido','Para una combinación a tu gusto de garrafas pincha aquí']);
          const p=await b.newPage();p.setViewport({width:1440,height:900});const errs=[];p.on('pageerror',e=>errs.push(e.message));const r=await p.goto('https://www.elmercadodeorigen.com/en/tienda/?mdo_postfix_shop='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});if(r.status()!==200)throw new Error('Shop HTTP '+r.status());let s=await p.evaluate(()=>({products:document.querySelectorAll('ul.products > li.product').length,state:window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,loading:window.__emoCatalogLoaderState.loading}:null,selector:!!document.querySelector('.trp-language-switcher,.trp-floater-ls,.mdo-language-switcher'),text:document.body.innerText||'',titles:[...document.querySelectorAll('ul.products > li.product .woocommerce-loop-product__title,ul.products > li.product h2,ul.products > li.product h3')].map(n=>n.textContent.trim())}));console.log('INITIAL',JSON.stringify({products:s.products,state:s.state,selector:s.selector}));if(s.selector)throw new Error('selector present');const end=Date.now()+50000;while(Date.now()<end&&s.state&&s.state.remaining>0){await p.evaluate(()=>document.querySelector('.emo-catalog-load-state')?.scrollIntoView({block:'center'}));await new Promise(r=>setTimeout(r,1700));s=await p.evaluate(()=>({products:document.querySelectorAll('ul.products > li.product').length,state:window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,loading:window.__emoCatalogLoaderState.loading}:null,selector:!!document.querySelector('.trp-language-switcher,.trp-floater-ls,.mdo-language-switcher'),text:document.body.innerText||'',titles:[...document.querySelectorAll('ul.products > li.product .woocommerce-loop-product__title,ul.products > li.product h2,ul.products > li.product h3')].map(n=>n.textContent.trim())}));console.log('PROGRESS',JSON.stringify({products:s.products,state:s.state}));}console.log('FINAL',JSON.stringify({products:s.products,state:s.state,errs}));if(errs.length)throw new Error(errs.join('|'));if(!s.state||s.state.remaining!==0)throw new Error('loader incomplete');if(s.products<50)throw new Error('too few products '+s.products);if(/Filtrar productos|Cargar más productos|Resultados y ordenación|Filtros aplicados/.test(s.text))throw new Error('Spanish catalogue UI');const bad=s.titles.filter(x=>/^(Carne picada extra|Filetes primera|Chuletón de lomo alto|Magro o ragú de ternera|Jamón de bellota|Paleta de bellota|Aceite de oliva virgen extra)/i.test(x));if(bad.length)throw new Error('Spanish titles '+bad.slice(0,10).join('|'));await p.close();await b.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./verify.mjs

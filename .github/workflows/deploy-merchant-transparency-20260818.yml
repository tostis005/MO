name: Deploy Merchant transparency 20260818

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mu-plugins/mdo-merchant-transparency-20260818.php'
      - '.github/workflows/deploy-merchant-transparency-20260818.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        run: php -l mu-plugins/mdo-merchant-transparency-20260818.php

      - name: Deploy pages and trust layer to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$PORT")
          SCP_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$PORT")
          remote() { sshpass -e ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" "$@"; }

          PROD_PATH="$(remote '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?Could not locate production WordPress}"
          echo "Production WordPress: $PROD_PATH"

          RUN_TAG="${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_DIR="$(remote 'mkdir -p "$HOME/mdo-backups"; printf "%s" "$HOME/mdo-backups"')"
          echo "Backup dir: $BACKUP_DIR"

          echo '=== Database backup ==='
          remote "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" db export '$BACKUP_DIR/merchant-transparency-$RUN_TAG.sql' --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-merchant-transparency-20260818.php"
          remote "if [ -f '$TARGET' ]; then cp '$TARGET' '$BACKUP_DIR/mdo-merchant-transparency-$RUN_TAG.php'; fi"

          echo '=== Upload plugin ==='
          REMOTE_TMP="/tmp/mdo-merchant-transparency-$RUN_TAG.php"
          sshpass -e scp "${SCP_OPTS[@]}" mu-plugins/mdo-merchant-transparency-20260818.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"
          remote "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE_TMP'; install -m 0644 '$REMOTE_TMP' '$TARGET'; rm -f '$REMOTE_TMP'"

          echo '=== Apply canonical ES pages and EN metadata ==='
          remote "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval 'echo wp_json_encode(mdo_mt_apply_pages(), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES), PHP_EOL;' --path='$PROD_PATH' --allow-root"

          echo '=== Clear caches ==='
          remote "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          echo '=== Verify public ES and EN pages ==='
          urls=(
            'https://www.elmercadodeorigen.com/politica/'
            'https://www.elmercadodeorigen.com/aviso-legal/'
            'https://www.elmercadodeorigen.com/envios/'
            'https://www.elmercadodeorigen.com/devoluciones-y-reembolsos/'
            'https://www.elmercadodeorigen.com/politica-de-privacidad/'
            'https://www.elmercadodeorigen.com/politica-de-cookies/'
            'https://www.elmercadodeorigen.com/contacto/'
            'https://www.elmercadodeorigen.com/en/terms-and-conditions/'
            'https://www.elmercadodeorigen.com/en/legal-notice/'
            'https://www.elmercadodeorigen.com/en/shipping/'
            'https://www.elmercadodeorigen.com/en/returns-refunds/'
            'https://www.elmercadodeorigen.com/en/privacy-policy/'
            'https://www.elmercadodeorigen.com/en/cookie-policy/'
            'https://www.elmercadodeorigen.com/en/contact/'
          )
          for u in "${urls[@]}"; do
            code=$(curl -k -L -sS -o /tmp/mdo-mt.html -w '%{http_code}' --max-time 45 "$u")
            echo "$code $u"
            test "$code" = 200
            grep -qi 'El Mercado de Origen' /tmp/mdo-mt.html
            grep -qi '11854364A' /tmp/mdo-mt.html
          done

          echo '=== Verify legacy redirect ==='
          headers=$(curl -k -sSI --max-time 30 'https://www.elmercadodeorigen.com/condiciones-especiales/' | tr -d '\r')
          printf '%s\n' "$headers" | head -20
          printf '%s\n' "$headers" | grep -qE '^HTTP/.* 301'
          printf '%s\n' "$headers" | grep -qiE '^location: .*\/envios\/'

          echo '=== Verify marketplace role wording ==='
          curl -k -L -sS --max-time 45 'https://www.elmercadodeorigen.com/envios/' -o /tmp/mdo-mt-es.html
          curl -k -L -sS --max-time 45 'https://www.elmercadodeorigen.com/en/shipping/' -o /tmp/mdo-mt-en.html
          grep -qi 'enviados directamente' /tmp/mdo-mt-es.html
          grep -qi 'dispatched directly' /tmp/mdo-mt-en.html
          grep -qi 'Marketplace operado por' /tmp/mdo-mt-es.html
          grep -qi 'Marketplace operated by' /tmp/mdo-mt-en.html
          echo 'Merchant transparency deployment verified.'

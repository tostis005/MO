name: Audit optimized Adsterra lifecycle final v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-slot-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Verify eager top lazy lower and per-slot fallback
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          url='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&optimized_slot_audit=1'
          o=Options(); o.page_load_strategy='none'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1100','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          d.execute_cdp_cmd('Network.enable',{})
          d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
          (()=>{const f=window.fetch;window.fetch=function(input,init){
            const u=typeof input==='string'?input:(input&&input.url)||'';
            if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
              init=Object.assign({},init||{});const h=new Headers(init.headers||{});
              h.set('X-Country-Code','ZA');init.headers=h;
            }
            return f.call(this,input,init);
          };})();"""})
          d.get(url)

          def snap(label):
              state=d.execute_script(r"""
                const res=performance.getEntriesByType('resource').map(r=>({
                  name:r.name,start:Math.round(r.startTime),dur:Math.round(r.duration)
                }));
                return {
                  t:Math.round(performance.now()),
                  y:Math.round(window.scrollY),
                  h:document.documentElement.scrollHeight,
                  debug:window.ElMercadoAdsterraGeoDebug||null,
                  adsterraRequests:res.filter(r=>/highrevenueformat|profitableratecpmnetwork/.test(r.name)).length,
                  googleRequests:res.filter(r=>/googlesyndication|doubleclick/.test(r.name)).length,
                  slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map((s,i)=>({
                    i,
                    type:s.getAttribute('data-emo-adsterra-slot'),
                    state:s.getAttribute('data-emo-adsterra-state'),
                    hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                    scheduled:s.getAttribute('data-emo-adsterra-scheduled'),
                    eligible:s.classList.contains('is-eligible'),
                    fallback:s.classList.contains('is-adsense-fallback'),
                    status:(s.querySelector('ins.adsbygoogle')||{}).getAttribute?.('data-ad-status')||null,
                    top:Math.round(s.getBoundingClientRect().top),
                    frames:s.querySelectorAll('iframe').length
                  }))
                };
              """)
              print(label+'='+json.dumps(state,sort_keys=True),flush=True)
              return state

          time.sleep(1.2); snap('OPEN_1S')
          time.sleep(3.2); before=snap('OPEN_4S')

          # Lower slots should not all have hydrated before scrolling.
          hydrated_before=sum(1 for s in before['slots'] if s['hydrated']=='1')
          if hydrated_before >= len(before['slots']):
              raise SystemExit('All slots hydrated eagerly; lazy loading regression')

          d.execute_script('window.scrollTo(0, Math.floor(document.documentElement.scrollHeight*0.45))')
          time.sleep(3.5); mid=snap('MID_SCROLL')

          d.execute_script('window.scrollTo(0, document.documentElement.scrollHeight)')
          time.sleep(4.0); end=snap('BOTTOM_SCROLL')

          if not before['slots'] or before['slots'][0]['type']!='responsive-top':
              raise SystemExit('Top slot missing')
          if before['slots'][0]['hydrated']!='1':
              raise SystemExit('Top slot was not hydrated eagerly')
          if end['debug'] is None or end['debug'].get('showAds') is not True:
              raise SystemExit('Geo eligibility failed')
          if sum(1 for s in end['slots'] if s['hydrated']=='1') < 5:
              raise SystemExit('Lower slots did not hydrate while scrolling')
          native=[s for s in end['slots'] if s['type']=='native']
          if native and native[0]['hydrated']!='1':
              raise SystemExit('Native slot did not hydrate')
          # Headless/datacenter Adsterra commonly no-fills. In that case verify Google fallback really ran.
          failed=[s for s in end['slots'] if s['state']=='failed' and s['type']!='skyscraper']
          if failed and end['googleRequests'] < 1:
              raise SystemExit('Failed Adsterra slots had no Google fallback traffic')
          if end['debug'].get('error'):
              raise SystemExit('Ad lifecycle ended with debug error: '+str(end['debug'].get('error')))

          print('OPTIMIZED_ADSTERRA_AUDIT=PASS',flush=True)
          d.quit()
          PY

name: CookieYes TCF diagnostic 0.10.282

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cookieyes-tcf-diagnostic-010282.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Inspect CookieYes TCF state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          [ -n "$wp_bin" ] || { echo 'WP-CLI not found'; exit 1; }

          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?production path not found}"

          plugin_dir="$prod_path/wp-content/plugins/cookie-law-info"
          echo '--- PLUGIN ---'
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin get cookie-law-info --path="$prod_path" --fields=name,status,version --format=json --allow-root 2>/dev/null || true

          echo '--- TCF CAPABILITY FILES ---'
          grep -RilE '__tcfapi|IABTCF|Transparency and Consent Framework|TCF v2|tcf_v2|iab.tcf|iab_tcf' "$plugin_dir" 2>/dev/null | head -n 40 || true

          echo '--- COOKIEYES OPTION NAMES ---'
          "$php_bin" -d memory_limit=512M "$wp_bin" option list --path="$prod_path" --search='*cookie*' --fields=option_name --format=csv --allow-root 2>/dev/null | head -n 120 || true
          "$php_bin" -d memory_limit=512M "$wp_bin" option list --path="$prod_path" --search='*cli_*' --fields=option_name --format=csv --allow-root 2>/dev/null | head -n 120 || true
          "$php_bin" -d memory_limit=512M "$wp_bin" option list --path="$prod_path" --search='*cky*' --fields=option_name --format=csv --allow-root 2>/dev/null | head -n 120 || true

          site_url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get home --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null)
          tmp=$(mktemp)
          curl -fsSL --max-time 25 -A 'Mozilla/5.0 EMDO TCF diagnostic' "${site_url}/?tcf_diag=$(date +%s)" -o "$tmp"

          echo '--- PUBLIC TCF MARKERS ---'
          for marker in '__tcfapi' 'IABTCF' 'euconsent-v2' 'CookieYes CMP' 'cdn-cookieyes.com' 'cky-consent-container' 'tcfapi'; do
            printf '%s=' "$marker"
            if grep -Fqi "$marker" "$tmp"; then echo yes; else echo no; fi
          done

          echo '--- PUBLIC GOOGLE MESSAGE MARKERS ---'
          grep -Eoi '.{0,100}(fundingchoices|googlefc|consent.google|privacy-messaging|google consent).{0,140}' "$tmp" | head -n 40 || true
          REMOTE

name: Home offcanvas diagnostic 0.10.256

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-offcanvas-diagnostic-010256.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect mobile offcanvas states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          : "${CHROME:?Chrome missing}"
          CHROME_PATH="$CHROME" node <<'JS' > runtime/home-offcanvas-diagnostic-010256.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915},deviceScaleFactor:1});
            await page.addInitScript(()=>{
              window.__off=[];
              const take=(label)=>{
                const snap=(sel)=>{
                  const e=document.querySelector(sel); if(!e)return null;
                  const s=getComputedStyle(e),r=e.getBoundingClientRect();
                  return {sel,class:e.className,id:e.id,ariaHidden:e.getAttribute('aria-hidden'),style:e.getAttribute('style'),rect:{x:r.x,y:r.y,width:r.width,height:r.height},display:s.display,visibility:s.visibility,opacity:s.opacity,position:s.position,transform:s.transform,left:s.left,right:s.right,top:s.top,width:s.width,height:s.height,zIndex:s.zIndex,overflow:s.overflow};
                };
                window.__off.push({label,t:performance.now(),body:document.body?.className||'',html:document.documentElement.className,nav:snap('#mobile-navigation'),navInner:snap('#mobile-navigation .sidebar-menu'),cart:snap('#shop-cart-sidebar'),cartContent:snap('#shop-cart-sidebar .cart-sidebar-content')});
              };
              document.addEventListener('DOMContentLoaded',()=>take('domcontentloaded'));
              window.addEventListener('load',()=>take('load'));
              setTimeout(()=>take('50ms'),50); setTimeout(()=>take('250ms'),250); setTimeout(()=>take('750ms'),750); setTimeout(()=>take('2000ms'),2000);
            });
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(2500);
            const data=await page.evaluate(()=>({snaps:window.__off,navHTML:document.querySelector('#mobile-navigation')?.outerHTML?.slice(0,2500),cartHTML:document.querySelector('#shop-cart-sidebar')?.outerHTML?.slice(0,2500)}));
            console.log(JSON.stringify(data,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-offcanvas-diagnostic-010256.txt
          git commit -m 'Record Home offcanvas diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

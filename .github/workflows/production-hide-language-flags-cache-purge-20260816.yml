name: Production hide language flags cache purge 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-hide-language-flags-cache-purge-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      PROD_URL: https://www.elmercadodeorigen.com
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Purge caches and verify fresh production HTML
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_URL='$PROD_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=''
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;; esac
          done
          : "${PROD_PATH:?production path not found}"
          wp(){ "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          wplite(){ "$php_bin" -d memory_limit=256M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root --skip-plugins --skip-themes "$@"; }

          siteurl=$(wplite option get siteurl | sed 's#/$##')
          echo "SITEURL=$siteurl"
          test "$siteurl" = 'https://www.elmercadodeorigen.com'
          target="$PROD_PATH/wp-content/mu-plugins/mdo-hide-language-flags.php"
          test -s "$target"
          "$php_bin" -l "$target"

          echo '=== ACTIVE CACHE-RELATED PLUGINS ==='
          wp plugin list --status=active --fields=name,status --format=csv | grep -Ei 'cache|rocket|litespeed|breeze|performance|optimi|smush' || true

          echo '=== PURGE WORDPRESS/PLUGIN CACHES ==='
          wp cache flush >/dev/null 2>&1 || true
          wp transient delete --all >/dev/null 2>&1 || true
          cat >/tmp/mdo-purge-caches.php <<'PHP'
          <?php
          if ( function_exists( 'rocket_clean_domain' ) ) { rocket_clean_domain(); echo "PURGED=wp-rocket\n"; }
          if ( function_exists( 'w3tc_flush_all' ) ) { w3tc_flush_all(); echo "PURGED=w3-total-cache\n"; }
          if ( function_exists( 'wp_cache_clear_cache' ) ) { wp_cache_clear_cache(); echo "PURGED=wp-super-cache\n"; }
          if ( function_exists( 'sg_cachepress_purge_cache' ) ) { sg_cachepress_purge_cache(); echo "PURGED=siteground\n"; }
          if ( has_action( 'litespeed_purge_all' ) ) { do_action( 'litespeed_purge_all' ); echo "PURGED=litespeed\n"; }
          do_action( 'autoptimize_action_cachepurged' );
          PHP
          wp eval-file /tmp/mdo-purge-caches.php || true
          rm -f /tmp/mdo-purge-caches.php

          echo '=== VERIFY UNCACHED HTML ==='
          stamp=$(date +%s)
          for path in / /tienda/ /en/; do
            sep='?'; case "$path" in *\?*) sep='&';; esac
            url="$PROD_URL$path${sep}mdo_flags_verify=$stamp"
            code=$(curl -sS -L -H 'Cache-Control: no-cache' -o /tmp/mdo-fresh.html -w '%{http_code}' --max-time 60 "$url")
            echo "FRESH_HTTP_${path//\//_}=$code"
            test "$code" = 200
            grep -q 'mdo-hide-language-flags-20260816' /tmp/mdo-fresh.html
            grep -q '#trp-floater-ls' /tmp/mdo-fresh.html
          done

          echo '=== VERIFY NORMAL HOME ==='
          code=$(curl -sS -L -H 'Cache-Control: no-cache' -o /tmp/mdo-normal.html -w '%{http_code}' --max-time 60 "$PROD_URL/")
          echo "NORMAL_HOME_HTTP=$code"
          test "$code" = 200
          grep -q 'mdo-hide-language-flags-20260816' /tmp/mdo-normal.html
          echo 'PRODUCTION_FLAGS_HIDDEN=yes'
          REMOTE

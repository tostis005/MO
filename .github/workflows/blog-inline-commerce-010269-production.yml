name: Blog inline commerce 0.10.269 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-inline-commerce-010269-production.yml'
      - 'elmercadodeorigen-child/single-post.php'
      - 'elmercadodeorigen-child/inc/blog-inline-commerce-010268.php'
      - 'elmercadodeorigen-child/assets/js/adsense-geo-010266.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/single-post.php
          php -l elmercadodeorigen-child/inc/blog-inline-commerce-010268.php
          node --check elmercadodeorigen-child/assets/js/adsense-geo-010266.js
          grep -Fq 'id="emo-newsletter"' elmercadodeorigen-child/inc/blog-inline-commerce-010268.php
          grep -Fq 'emo_blog_optin_geo' elmercadodeorigen-child/inc/blog-inline-commerce-010268.php
          grep -Fq 'Mantente informado de todas nuestras novedades' elmercadodeorigen-child/single-post.php
          grep -Fq 'data-emo-related-root="1"' elmercadodeorigen-child/single-post.php
          grep -Fq 'elmercado_blog_flatten_top_level_sections_010280' elmercadodeorigen-child/single-post.php
          grep -Fq 'loadGoogleScript' elmercadodeorigen-child/assets/js/adsense-geo-010266.js
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy blog template, inline commerce and geo controller
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          THEME_PATH="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$THEME_PATH/inc' '$THEME_PATH/assets/js'"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/single-post.php "$STAGING_USER@$STAGING_HOST:$THEME_PATH/single-post.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/inc/blog-inline-commerce-010268.php "$STAGING_USER@$STAGING_HOST:$THEME_PATH/inc/blog-inline-commerce-010268.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/assets/js/adsense-geo-010266.js "$STAGING_USER@$STAGING_HOST:$THEME_PATH/assets/js/adsense-geo-010266.js"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$THEME_PATH/single-post.php'; \"\$php_bin\" -l '$THEME_PATH/inc/blog-inline-commerce-010268.php'; grep -Fq 'loadGoogleScript' '$THEME_PATH/assets/js/adsense-geo-010266.js'"

      - name: Flush WordPress cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public blog markup and deferred ads
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/cuanto-tiempo-marinar-carne-ternera-horas-sal-acidez/?emo_blog_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO blog verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/blog.html "$URL"
          grep -Fq 'id="emo-newsletter"' /tmp/blog.html
          grep -Fq 'data-emo-newsletter-geo-fallback' /tmp/blog.html
          grep -Fq 'data-emo-special-anchor' /tmp/blog.html
          grep -Fq 'Mantente informado de todas nuestras novedades' /tmp/blog.html
          grep -Fq 'data-emo-related-root="1"' /tmp/blog.html
          grep -Fq 'margin: 20px auto !important' /tmp/blog.html
          if grep -Fq '<section class="emo-related-reading"' /tmp/blog.html; then
            echo 'BLOG_RELATED_PUBLIC_ABORT: related reading is still rendered as section' >&2
            exit 8
          fi
          if grep -E 'id="emo-newsletter"[^>]*[[:space:]]hidden([[:space:]>])' /tmp/blog.html >/dev/null; then
            echo 'BLOG_NEWSLETTER_PUBLIC_ABORT: newsletter has a real hidden attribute' >&2
            exit 7
          fi
          if grep -E '<script[^>]+src=["'"'][^"'"']*pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js' /tmp/blog.html >/dev/null; then
            echo 'BLOG_ADSENSE_PUBLIC_ABORT: AdSense is still loaded eagerly before geo eligibility' >&2
            exit 9
          fi
          echo 'BLOG_NEWSLETTER_PUBLIC_OK'
          echo 'BLOG_RELATED_PUBLIC_OK'
          echo 'BLOG_ADSENSE_DEFERRED_PUBLIC_OK'

name: Deploy dynamic sitemaps production

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.title == 'Run dynamic sitemap deploy 20260818') || (github.event_name == 'pull_request' && github.event.pull_request.title == 'Run dynamic sitemap deploy 20260818')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate sitemap MU-plugin
        shell: bash
        run: php -l mu-plugins/mdo-a-dynamic-sitemaps.php

      - name: Deploy sitemap MU-plugin to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_TMP="/tmp/mdo-a-dynamic-sitemaps-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-a-dynamic-sitemaps.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            target='$PROD_PATH/wp-content/mu-plugins/mdo-a-dynamic-sitemaps.php'
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            cp '$REMOTE_TMP' \"\$target\"
            chmod 0644 \"\$target\"
            rm -f '$REMOTE_TMP'
            \"\$php_bin\" -l \"\$target\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          "

      - name: Verify public sitemap policy
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.elmercadodeorigen.com"
          curl -fsSL --max-time 30 "$base/sitemap_index.xml?mdo_verify=$GITHUB_RUN_ID" -o /tmp/sitemap-index.xml
          grep -q '<sitemapindex' /tmp/sitemap-index.xml
          grep -q 'mdo-sitemap-pages.xml' /tmp/sitemap-index.xml
          grep -q 'mdo-sitemap-categories.xml' /tmp/sitemap-index.xml
          grep -q 'mdo-sitemap-products.xml' /tmp/sitemap-index.xml
          if grep -qiE 'tag-sitemap|author-sitemap|post-sitemap' /tmp/sitemap-index.xml; then
            echo 'Unexpected legacy sitemap in canonical index' >&2
            exit 1
          fi

          curl -fsSL --max-time 30 "$base/mdo-sitemap-categories.xml?mdo_verify=$GITHUB_RUN_ID" -o /tmp/categories.xml
          if grep -qi 'mentta' /tmp/categories.xml; then
            echo 'MENTTA leaked into category sitemap' >&2
            exit 1
          fi

          curl -fsSL --max-time 30 "$base/mdo-sitemap-products.xml?mdo_verify=$GITHUB_RUN_ID" -o /tmp/products.xml
          grep -q '<urlset' /tmp/products.xml
          grep -q 'hreflang="en"' /tmp/products.xml

          curl -fsSL --max-time 30 "$base/robots.txt?mdo_verify=$GITHUB_RUN_ID" -o /tmp/robots.txt
          grep -q 'Sitemap: .*sitemap_index.xml' /tmp/robots.txt
          if grep -q 'english-sitemap.xml' /tmp/robots.txt; then
            echo 'Old English sitemap is still advertised in robots.txt' >&2
            exit 1
          fi

          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base/english-sitemap.xml?mdo_verify=$GITHUB_RUN_ID")"
          test "$code" = "301"

      - name: Record successful production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "status=success\nsource_commit=$GITHUB_SHA\nworkflow_run=$GITHUB_RUN_ID\nverified_utc=$verified"
          else
            printf 'status=success\nsource_commit=%s\nworkflow_run=%s\nverified_utc=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$verified"
          fi

name: Deploy dynamic sitemaps production

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.title == 'Run dynamic sitemap deploy 20260818') || (github.event_name == 'pull_request' && github.event.pull_request.title == 'Run dynamic sitemap deploy 20260818')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate sitemap MU-plugin
        shell: bash
        run: php -l mu-plugins/mdo-a-dynamic-sitemaps.php

      - name: Deploy sitemap MU-plugin and robots to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_TMP="/tmp/mdo-a-dynamic-sitemaps-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-a-dynamic-sitemaps.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"
          sshpass -e scp $SCP_OPTIONS config/robots-production.txt "$STAGING_USER@$STAGING_HOST:$PROD_PATH/robots.txt"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            target='$PROD_PATH/wp-content/mu-plugins/mdo-a-dynamic-sitemaps.php'
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            cp '$REMOTE_TMP' \"\$target\"
            chmod 0644 \"\$target\" '$PROD_PATH/robots.txt'
            rm -f '$REMOTE_TMP'
            \"\$php_bin\" -l \"\$target\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          "

      - name: Verify public sitemap policy
        shell: bash
        run: |
          set -uo pipefail
          base="https://www.elmercadodeorigen.com"
          failed=0

          fetch() {
            local label="$1" url="$2" out="$3"
            local meta
            meta=$(curl -sS -L --max-time 30 -o "$out" -w 'code=%{http_code} effective=%{url_effective} type=%{content_type} bytes=%{size_download}' "$url") || { echo "FETCH_FAIL $label $url"; failed=1; return 1; }
            echo "$label $meta"
          }
          require() {
            local label="$1" pattern="$2" file="$3"
            if grep -qE "$pattern" "$file"; then echo "PASS $label"; else echo "FAIL $label"; failed=1; fi
          }
          forbid() {
            local label="$1" pattern="$2" file="$3"
            if grep -qiE "$pattern" "$file"; then echo "FAIL $label"; failed=1; else echo "PASS $label"; fi
          }

          fetch INDEX "$base/sitemap_index.xml?mdo_verify=$GITHUB_RUN_ID" /tmp/index.xml
          echo '--- INDEX PREVIEW ---'; head -c 1200 /tmp/index.xml || true; echo
          require 'index root' '<sitemapindex' /tmp/index.xml
          require 'pages child' 'mdo-sitemap-pages\.xml' /tmp/index.xml
          require 'categories child' 'mdo-sitemap-categories\.xml' /tmp/index.xml
          require 'products child' 'mdo-sitemap-products\.xml' /tmp/index.xml
          forbid 'no legacy children' 'tag-sitemap|author-sitemap|post-sitemap' /tmp/index.xml

          fetch CATEGORIES "$base/mdo-sitemap-categories.xml?mdo_verify=$GITHUB_RUN_ID" /tmp/categories.xml
          echo "CATEGORY_URLS=$(grep -o '<loc>' /tmp/categories.xml | wc -l)"
          require 'categories root' '<urlset' /tmp/categories.xml
          forbid 'MENTTA excluded' 'mentta' /tmp/categories.xml

          fetch PRODUCTS "$base/mdo-sitemap-products.xml?mdo_verify=$GITHUB_RUN_ID" /tmp/products.xml
          echo "PRODUCT_URLS=$(grep -o '<loc>' /tmp/products.xml | wc -l) EN_ALTERNATES=$(grep -o 'hreflang=\"en\"' /tmp/products.xml | wc -l)"
          echo '--- PRODUCTS PREVIEW ---'; head -c 1600 /tmp/products.xml || true; echo
          require 'products root' '<urlset' /tmp/products.xml
          require 'English alternates present' 'hreflang="en"' /tmp/products.xml

          fetch ROBOTS "$base/robots.txt?mdo_verify=$GITHUB_RUN_ID" /tmp/robots.txt
          echo '--- ROBOTS ---'; cat /tmp/robots.txt; echo
          require 'robots canonical sitemap' 'Sitemap: .*sitemap_index\.xml' /tmp/robots.txt
          forbid 'robots old English sitemap removed' 'english-sitemap\.xml' /tmp/robots.txt

          redirect_meta=$(curl -sS --max-time 30 -o /tmp/english-old.xml -w 'code=%{http_code} redirect=%{redirect_url}' "$base/english-sitemap.xml?mdo_verify=$GITHUB_RUN_ID") || { echo 'FAIL english old endpoint fetch'; failed=1; redirect_meta=''; }
          echo "ENGLISH_OLD $redirect_meta"
          if echo "$redirect_meta" | grep -q 'code=301' && echo "$redirect_meta" | grep -q 'sitemap_index\.xml'; then echo 'PASS old English redirect'; else echo 'FAIL old English redirect'; failed=1; fi

          exit "$failed"

      - name: Record successful production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "status=success\nsource_commit=$GITHUB_SHA\nworkflow_run=$GITHUB_RUN_ID\nverified_utc=$verified"
          else
            printf 'status=success\nsource_commit=%s\nworkflow_run=%s\nverified_utc=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$verified"
          fi

name: Blog hotfix 0.10.286 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-hotfix-010286-production.yml'
      - 'elmercadodeorigen-child/inc/blog-regression-fix-010286.php'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/functions.php
          php -l elmercadodeorigen-child/single.php
          php -l elmercadodeorigen-child/inc/blog-regression-fix-010286.php
          php -l elmercadodeorigen-child/inc/adsense-geo-010266.php
          grep -Fq "inc/blog-regression-fix-010286.php" elmercadodeorigen-child/functions.php
          grep -Fq 'data-emo-related-root="1"' elmercadodeorigen-child/single.php
          grep -Fq 'repeat(4, minmax(0, 1fr)) !important;' elmercadodeorigen-child/single.php
          grep -Fq 'elmercado-blog-regression-fix-010286' elmercadodeorigen-child/inc/blog-regression-fix-010286.php
          grep -Fq 'margin-bottom: 11px !important;' elmercadodeorigen-child/inc/blog-regression-fix-010286.php

      - name: Deploy and flush cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          T="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$T/inc'"
          sshpass -e scp $SCP elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:$T/functions.php"
          sshpass -e scp $SCP elmercadodeorigen-child/single.php "$STAGING_USER@$STAGING_HOST:$T/single.php"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/blog-regression-fix-010286.php "$STAGING_USER@$STAGING_HOST:$T/inc/blog-regression-fix-010286.php"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/adsense-geo-010266.php "$STAGING_USER@$STAGING_HOST:$T/inc/adsense-geo-010266.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$T/functions.php'; \"\$php_bin\" -l '$T/single.php'; \"\$php_bin\" -l '$T/inc/blog-regression-fix-010286.php'; \"\$php_bin\" -l '$T/inc/adsense-geo-010266.php'; wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/cuanto-tiempo-marinar-carne-ternera-horas-sal-acidez/?emo_blog_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 EMDO verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/blog.html "$URL"
          grep -Fq 'elmercado-blog-regression-fix-010286' /tmp/blog.html
          grep -Fq 'grid-template-columns: repeat(4, minmax(0, 1fr)) !important;' /tmp/blog.html
          grep -Fq 'data-emo-related-root="1"' /tmp/blog.html
          grep -Fq 'margin-bottom: 11px !important;' /tmp/blog.html
          grep -Fq 'padding-top: 9px !important;' /tmp/blog.html
          if grep -Fq '<section class="emo-related-reading"' /tmp/blog.html; then
            echo 'RELATED_SECTION_STILL_PRESENT' >&2
            exit 7
          fi

          BASE='https://www.elmercadodeorigen.com/wp-json/elmercado/v1/adsense-eligibility'
          for C in GB NO IE; do
            BODY=$(curl -fsSL --retry 3 -H "X-Country-Code: $C" "$BASE?verify=${GITHUB_RUN_ID}$C")
            echo "$C $BODY"
            grep -Eq '"can_buy"[[:space:]]*:[[:space:]]*false' <<< "$BODY"
            grep -Eq '"show_ads"[[:space:]]*:[[:space:]]*true' <<< "$BODY"
          done
          for C in ES CH; do
            BODY=$(curl -fsSL --retry 3 -H "X-Country-Code: $C" "$BASE?verify=${GITHUB_RUN_ID}$C")
            echo "$C $BODY"
            grep -Eq '"can_buy"[[:space:]]*:[[:space:]]*true' <<< "$BODY"
            grep -Eq '"show_ads"[[:space:]]*:[[:space:]]*false' <<< "$BODY"
          done
          echo 'BLOG_HOTFIX_010286=PASS'

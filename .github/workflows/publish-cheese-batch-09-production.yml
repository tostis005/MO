name: Publish cheese batch 09 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-09-data-a.json'
      - '.github/scripts/cheese-batch-09-data-b.json'
      - '.github/scripts/publish-cheese-batch-09-production.php'
      - '.github/scripts/run-cheese-batch-09-production.php'
      - '.github/workflows/publish-cheese-batch-09-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate clean editorial package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path('.github/scripts')
          articles=[]
          for name in ('cheese-batch-09-data-a.json','cheese-batch-09-data-b.json'):
              data=json.loads((base/name).read_text(encoding='utf-8'))
              assert isinstance(data,list)
              articles.extend(data)
          required={'pos','title','slug','en_title','en_slug','excerpt','en_excerpt','lead_es','lead_en','facts_es','facts_en','sections_es','sections_en','faq_es','faq_en','conclusion_es','conclusion_en','related','sources'}
          assert len(articles)==10
          assert sorted(int(a['pos']) for a in articles)==list(range(81,91))
          assert len({a['slug'] for a in articles})==10
          assert len({a['en_slug'] for a in articles})==10
          assert all(required <= a.keys() for a in articles)
          assert all(len(a['sections_es'])>=6 and len(a['sections_en'])>=6 and len(a['sources'])>=2 for a in articles)
          print('CLEAN_EDITORIAL_PACKAGE_OK=10')
          PY
          php -l .github/scripts/publish-cheese-batch-09-production.php
          php -l .github/scripts/run-cheese-batch-09-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese09-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-09-data-a.json \
            .github/scripts/cheese-batch-09-data-b.json \
            .github/scripts/publish-cheese-batch-09-production.php \
            .github/scripts/run-cheese-batch-09-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/run-cheese-batch-09-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" 2>&1 | tee /tmp/cheese09-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then grep -F 'EMDO_CHEESE_BATCH09_ERROR:' /tmp/cheese09-output.txt || true; exit "$rc"; fi
          grep -q 'EMDO_CHEESE_BATCH09_BEGIN' /tmp/cheese09-output.txt
          grep -q '"count":10' /tmp/cheese09-output.txt
          grep -q 'EMDO_CHEESE_BATCH09_END' /tmp/cheese09-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'maduracion-queso-proteolisis-lipolisis-aroma-textura'
            'lavado-cuajada-queso-que-es-por-que-se-hace-sabor-textura'
            'ph-acidez-queso-que-miden-textura-sabor-seguridad'
            'humedad-actividad-agua-queso-diferencias-textura-conservacion'
            'cuanta-leche-hace-falta-kilo-queso-rendimiento-factores'
            'suero-queso-que-es-que-contiene-usos-ricotta-requeson'
            'por-que-queso-blanco-amarillo-anaranjado-color-leche-carotenoides'
            'tamano-formato-queso-influye-maduracion-ruedas-piezas'
            'mohos-levaduras-queso-maduracion-flora-deterioro'
            'como-transportar-queso-cadena-frio-envios-viajes-recepcion'
          )
          en_slugs=(
            'cheese-ripening-proteolysis-lipolysis-aroma-texture'
            'washing-cheese-curd-what-it-is-why-done-flavour-texture'
            'ph-acidity-cheese-what-they-measure-texture-flavour-safety'
            'moisture-water-activity-cheese-difference-texture-storage'
            'how-much-milk-one-kilogram-cheese-yield-factors'
            'cheese-whey-what-it-is-contains-uses-ricotta'
            'why-cheese-white-yellow-orange-milk-carotenoids-rind-colouring'
            'how-cheese-size-affects-ripening-wheels-small-formats-wedges'
            'moulds-yeasts-cheese-ripening-flora-spoilage'
            'how-transport-cheese-cold-chain-shipping-travel-receiving-order'
          )
          check_url(){ local url="$1" code; for attempt in 1 2 3 4; do code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"; if [ "$code" = 200 ]; then echo "OK $url"; return 0; fi; sleep 4; done; echo "FAILED $code $url" >&2; return 1; }
          for s in "${es_slugs[@]}"; do check_url "$base/$s/"; done
          for s in "${en_slugs[@]}"; do check_url "$base/en/$s/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"
          curl -L -sS --max-time 45 "$base/maduracion-queso-proteolisis-lipolisis-aroma-textura/?verify=$GITHUB_RUN_ID" -o /tmp/ripen.html
          grep -Fq 'Proteólisis: cómo cambia la red de proteínas' /tmp/ripen.html
          curl -L -sS --max-time 45 "$base/lavado-cuajada-queso-que-es-por-que-se-hace-sabor-textura/?verify=$GITHUB_RUN_ID" -o /tmp/washed.html
          grep -Fq 'Lavado de cuajada y lavado de corteza no son lo mismo' /tmp/washed.html
          curl -L -sS --max-time 45 "$base/cuanta-leche-hace-falta-kilo-queso-rendimiento-factores/?verify=$GITHUB_RUN_ID" -o /tmp/yield.html
          grep -Fq 'Por qué diez litros por kilo puede acertar y seguir siendo mala regla' /tmp/yield.html
          curl -L -sS --max-time 45 "$base/en/moulds-yeasts-cheese-ripening-flora-spoilage/?verify=$GITHUB_RUN_ID" -o /tmp/mould-en.html
          grep -Fq 'Cheese is an ecosystem, not a sterile paste' /tmp/mould-en.html
          curl -L -sS --max-time 45 "$base/en/how-transport-cheese-cold-chain-shipping-travel-receiving-order/?verify=$GITHUB_RUN_ID" -o /tmp/transport-en.html
          grep -Fq 'Cold chain does not mean one temperature for every cheese' /tmp/transport-en.html
          echo 'Cheese batch 09 public editorial verification OK'

name: Publish cheese batch 09 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-09-data.part*.b64'
      - '.github/scripts/publish-cheese-batch-09-production.php'
      - '.github/scripts/run-cheese-batch-09-production.php'
      - '.github/workflows/publish-cheese-batch-09-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate signed editorial package
        shell: bash
        run: |
          set -euo pipefail
          for p in 1 2 3 4; do test -f ".github/scripts/cheese-batch-09-data.part${p}.b64"; done
          cat .github/scripts/cheese-batch-09-data.part{1,2,3,4}.b64 | tr -d '[:space:]' > /tmp/cheese09.b64
          test "$(wc -c < /tmp/cheese09.b64)" -eq 55204
          base64 -d /tmp/cheese09.b64 > /tmp/cheese09.gz
          echo "bafd66e707b033cef7f250c73cb6d8e461efc411d20571e34a418389591075e5  /tmp/cheese09.gz" | sha256sum -c -
          gzip -dc /tmp/cheese09.gz > /tmp/cheese09.json
          echo "38b23ba5ea25fbcc53953b5ae118e92c99e2903adf39ec0c1b6f560d0ed0ba37  /tmp/cheese09.json" | sha256sum -c -
          python -c "import json; a=json.load(open('/tmp/cheese09.json')); assert len(a)==10; assert sorted(int(x['pos']) for x in a)==list(range(81,91)); assert len({x['slug'] for x in a})==10; assert len({x['en_slug'] for x in a})==10; assert all(len(x['sections_es'])>=6 and len(x['sections_en'])>=6 and len(x['sources'])>=2 for x in a); print('SIGNED_EDITORIAL_PACKAGE_OK=10')"
          php -l .github/scripts/publish-cheese-batch-09-production.php
          php -l .github/scripts/run-cheese-batch-09-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese09-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-09-data.part{1,2,3,4}.b64 \
            .github/scripts/publish-cheese-batch-09-production.php \
            .github/scripts/run-cheese-batch-09-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/run-cheese-batch-09-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" 2>&1 | tee /tmp/cheese09-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then grep -F 'EMDO_CHEESE_BATCH09_ERROR:' /tmp/cheese09-output.txt || true; exit "$rc"; fi
          grep -q 'EMDO_CHEESE_BATCH09_BEGIN' /tmp/cheese09-output.txt
          grep -q '"count":10' /tmp/cheese09-output.txt
          grep -q 'EMDO_CHEESE_BATCH09_END' /tmp/cheese09-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'maduracion-queso-que-ocurre-sabor-aroma-textura-tiempo-humedad'
            'lavado-cuajada-queso-que-es-acidez-humedad-textura'
            'ph-acidez-queso-por-que-importan-cuajada-maduracion'
            'humedad-queso-textura-maduracion-conservacion-actividad-agua'
            'rendimiento-quesero-cuanta-leche-kilo-queso'
            'suero-leche-queseria-que-es-composicion-usos'
            'color-queso-blanco-amarillo-anaranjado-leche-pigmentos-corteza'
            'tamano-formato-queso-influye-maduracion-corteza-textura'
            'mohos-levaduras-queso-maduracion-cuando-normales-cuando-preocupan'
            'como-transportar-queso-cadena-frio-viajes-envios-recibir'
          )
          en_slugs=(
            'cheese-ripening-what-happens-flavour-aroma-texture-time-humidity'
            'washed-curd-cheese-what-it-is-acidity-moisture-texture'
            'cheese-ph-acidity-why-they-matter-curd-ripening'
            'cheese-moisture-texture-ripening-storage-water-activity'
            'cheese-yield-how-much-milk-one-kilogram-cheese'
            'whey-cheesemaking-what-it-is-composition-uses'
            'why-cheese-white-yellow-orange-milk-pigments-rind'
            'cheese-size-format-affects-ripening-rind-texture'
            'moulds-yeasts-cheese-ripening-normal-when-concern'
            'how-transport-cheese-cold-chain-travel-shipping-arrival'
          )
          check_url(){ local url="$1" code; for attempt in 1 2 3 4; do code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"; if [ "$code" = 200 ]; then echo "OK $url"; return 0; fi; sleep 4; done; echo "FAILED $code $url" >&2; return 1; }
          for s in "${es_slugs[@]}"; do check_url "$base/$s/"; done
          for s in "${en_slugs[@]}"; do check_url "$base/en/$s/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"
          curl -L -sS --max-time 45 "$base/maduracion-queso-que-ocurre-sabor-aroma-textura-tiempo-humedad/?verify=$GITHUB_RUN_ID" -o /tmp/ripen.html
          grep -Fq 'Proteólisis: por qué cambia la textura' /tmp/ripen.html
          curl -L -sS --max-time 45 "$base/lavado-cuajada-queso-que-es-acidez-humedad-textura/?verify=$GITHUB_RUN_ID" -o /tmp/washed.html
          grep -Fq 'No confundir con corteza lavada' /tmp/washed.html
          curl -L -sS --max-time 45 "$base/rendimiento-quesero-cuanta-leche-kilo-queso/?verify=$GITHUB_RUN_ID" -o /tmp/yield.html
          grep -Fq "Por qué no existe la cifra de 'diez litros' para todo" /tmp/yield.html
          curl -L -sS --max-time 45 "$base/en/moulds-yeasts-cheese-ripening-normal-when-concern/?verify=$GITHUB_RUN_ID" -o /tmp/mould-en.html
          grep -Fq 'Selected moulds as cheesemaking tools' /tmp/mould-en.html
          curl -L -sS --max-time 45 "$base/en/how-transport-cheese-cold-chain-travel-shipping-arrival/?verify=$GITHUB_RUN_ID" -o /tmp/transport-en.html
          grep -Fq 'Cold-chain needs depend on the cheese' /tmp/transport-en.html
          echo 'Cheese batch 09 public editorial verification OK'

name: Publish cheese batch 06 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-06-*.json'
      - '.github/scripts/publish-cheese-batch-06-production.php'
      - '.github/workflows/publish-cheese-batch-06-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate editorial publisher
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in .github/scripts/cheese-batch-06-*.json; do
            python -m json.tool "$f" >/dev/null
            count=$((count+1))
          done
          [ "$count" -eq 10 ]
          php -l .github/scripts/publish-cheese-batch-06-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese06-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-06-*.json \
            .github/scripts/publish-cheese-batch-06-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/publish-cheese-batch-06-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" | tee /tmp/cheese06-output.txt
          grep -q 'EMDO_CHEESE_BATCH06_BEGIN' /tmp/cheese06-output.txt
          grep -q '"count":10' /tmp/cheese06-output.txt
          grep -q 'EMDO_CHEESE_BATCH06_END' /tmp/cheese06-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'queso-los-beyos-igp-leches-maduracion-territorio-como-reconocerlo'
            'queso-castellano-igp-leche-oveja-maduracion-diferencias-manchego'
            'queso-burgos-igp-que-protege-tipos-como-reconocer-autentico'
            'por-que-quesos-tienen-agujeros-ojos-fermentacion-defectos'
            'fermentos-lacticos-queso-que-son-cultivos-iniciadores-funcion'
            'como-se-sala-queso-salmuera-salado-seco-sabor-maduracion'
            'desuerado-sineresis-queso-cuajada-pierde-suero-humedad'
            'que-quesos-funden-mejor-humedad-grasa-acidez-proteina'
            'quesos-corteza-lavada-que-son-olor-microbiota-como-degustar'
            'como-comprar-queso-online-formato-envio-conservacion-recibir'
          )
          en_slugs=(
            'queso-los-beyos-pgi-milk-types-maturation-territory-how-identify'
            'queso-castellano-pgi-sheep-milk-maturation-difference-manchego'
            'queso-de-burgos-pgi-what-protects-types-how-identify-authentic'
            'why-cheese-has-holes-eyes-fermentation-defects'
            'lactic-starter-cultures-cheese-what-they-are-what-they-do'
            'how-cheese-is-salted-brining-dry-salting-flavour-ripening'
            'whey-drainage-syneresis-cheese-why-curd-releases-whey'
            'which-cheeses-melt-best-why-moisture-fat-acidity-protein'
            'washed-rind-cheese-what-it-is-strong-smell-microbiota-how-to-taste'
            'how-to-buy-cheese-online-format-shipping-storage-what-to-check'
          )
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 4
            done
            echo "FAILED $code $url" >&2
            return 1
          }
          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

          curl -L -sS --max-time 45 "$base/queso-burgos-igp-que-protege-tipos-como-reconocer-autentico/?verify=$GITHUB_RUN_ID" -o /tmp/burgos.html
          grep -Fq '5 y un 10%' /tmp/burgos.html
          curl -L -sS --max-time 45 "$base/por-que-quesos-tienen-agujeros-ojos-fermentacion-defectos/?verify=$GITHUB_RUN_ID" -o /tmp/eyes.html
          grep -Fq 'Aberturas mecánicas' /tmp/eyes.html
          curl -L -sS --max-time 45 "$base/fermentos-lacticos-queso-que-son-cultivos-iniciadores-funcion/?verify=$GITHUB_RUN_ID" -o /tmp/starters.html
          grep -Fq 'Cultivos iniciadores y cultivos de maduración' /tmp/starters.html
          curl -L -sS --max-time 45 "$base/como-se-sala-queso-salmuera-salado-seco-sabor-maduracion/?verify=$GITHUB_RUN_ID" -o /tmp/salt.html
          grep -Fq 'Sal y seguridad microbiológica' /tmp/salt.html
          curl -L -sS --max-time 45 "$base/desuerado-sineresis-queso-cuajada-pierde-suero-humedad/?verify=$GITHUB_RUN_ID" -o /tmp/syneresis.html
          grep -Fq 'sinéresis' /tmp/syneresis.html
          curl -L -sS --max-time 45 "$base/que-quesos-funden-mejor-humedad-grasa-acidez-proteina/?verify=$GITHUB_RUN_ID" -o /tmp/melt.html
          grep -Fq 'Maduración: más fusión, menos estiramiento' /tmp/melt.html
          curl -L -sS --max-time 45 "$base/quesos-corteza-lavada-que-son-olor-microbiota-como-degustar/?verify=$GITHUB_RUN_ID" -o /tmp/washed.html
          grep -Fq 'Brevibacterium linens' /tmp/washed.html
          curl -L -sS --max-time 45 "$base/en/how-to-buy-cheese-online-format-shipping-storage-what-to-check/?verify=$GITHUB_RUN_ID" -o /tmp/buy-en.html
          grep -Fq 'Vacuum packing is useful for transport' /tmp/buy-en.html
          echo 'Cheese batch 06 public editorial verification OK'

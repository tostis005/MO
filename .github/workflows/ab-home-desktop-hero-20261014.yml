name: AB Home desktop hero stability 20261014
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ab-home-desktop-hero-20261014.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
      - name: Compare baseline to early desktop hero min-height CSS
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/hero.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const sleep=t=>new Promise(r=>setTimeout(r,t));
          (async()=>{
            const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [variant,css] of [['baseline',''],['early-zero','.emo-hero{min-height:0!important}'],['early-auto','.emo-hero{min-height:auto!important}']]){
              const p=await b.newPage({viewport:{width:1365,height:900}});
              await p.addInitScript(()=>{
                window.__audit={cls:0,layout:[],shifts:[]};
                let last='';
                const snap=()=>{const e=document.querySelector('.emo-hero');if(!e)return;const cs=getComputedStyle(e),r=e.getBoundingClientRect();
                  const v={at:Math.round(performance.now()),y:Math.round(r.y),height:Math.round(r.height),minHeight:cs.minHeight,paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,maxHeight:cs.maxHeight,boxSizing:cs.boxSizing,display:cs.display};
                  const sig=JSON.stringify({...v,at:0});if(last!==sig){last=sig;window.__audit.layout.push(v);}
                };
                setInterval(snap,25);
                new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput){window.__audit.cls+=e.value;window.__audit.shifts.push({at:Math.round(e.startTime),v:+e.value.toFixed(4)});snap();}}).observe({type:'layout-shift',buffered:true});
              });
              if(css)await p.route('https://www.elmercadodeorigen.com/',async route=>{
                const orig=await route.fetch({timeout:55000});
                const h=(await orig.text()).replace('</head>','<style id="hero-desktop-firstpaint-probe">@media(min-width:1200px){'+css+'}</style></head>');
                await route.fulfill({response:orig,body:h,headers:{...orig.headers(),'content-type':'text/html;charset=utf-8'}});
              });
              const response=await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:60000});
              await sleep(1200);
              const d=await p.evaluate(()=>({cls:+window.__audit.cls.toFixed(4),shifts:window.__audit.shifts,layout:window.__audit.layout}));
              console.log('HERO_AB '+variant+' HTTP='+response.status()+' '+JSON.stringify(d));
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node /tmp/hero.cjs

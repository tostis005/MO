name: Isolate production checkout plugin memory 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-checkout-plugin-isolation-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Install request-scoped diagnostic MU plugin and print active plugin paths
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          TOKEN="mdo-${GITHUB_RUN_ID}-checkout"
          echo "DIAG_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' TOKEN='$TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cat > "$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php" <<'PHP'
          <?php
          /** Temporary request-scoped checkout diagnostic. */
          if (!defined('ABSPATH')) exit;
          $expected = '__TOKEN__';
          $given = isset($_GET['mdo_checkout_diag']) ? (string)$_GET['mdo_checkout_diag'] : '';
          if (!hash_equals($expected, $given)) return;
          $raw = isset($_GET['mdo_disable']) ? (string)$_GET['mdo_disable'] : '';
          $disable = array_values(array_filter(array_map('sanitize_key', explode(',', $raw))));
          if (!$disable) return;
          $matches = static function($plugin) use ($disable) {
              $plugin=(string)$plugin;
              $dir=strtolower((string)strtok($plugin,'/'));
              $base=strtolower(basename($plugin,'.php'));
              foreach($disable as $slug){ if($slug===$dir || $slug===$base || str_contains($dir,$slug) || str_contains($base,$slug)) return true; }
              return false;
          };
          add_filter('option_active_plugins', static function($plugins) use ($matches){
              if(!is_array($plugins)) return $plugins;
              return array_values(array_filter($plugins, static fn($p)=>!$matches($p)));
          }, -99999);
          add_filter('site_option_active_sitewide_plugins', static function($plugins) use ($matches){
              if(!is_array($plugins)) return $plugins;
              foreach(array_keys($plugins) as $p){ if($matches($p)) unset($plugins[$p]); }
              return $plugins;
          }, -99999);
          PHP
          sed -i "s/__TOKEN__/$TOKEN/g" "$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php"
          php -l "$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php"
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          echo '=== ACTIVE PLUGIN FILES ==='
          "$php_bin" "$wp_bin" option get active_plugins --format=json --path="$PROD_PATH" --allow-root 2>/dev/null | "$php_bin" -r '$a=json_decode(stream_get_contents(STDIN),true); foreach((array)$a as $x) echo $x,"\n";' | sort
          REMOTE
      - name: Request-scoped binary isolation
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com/finalizar-compra/'
          probe(){
            label="$1"; disable="$2"
            url="$base?mdo_checkout_diag=${DIAG_TOKEN}&mdo_disable=${disable}&mdo_probe=${GITHUB_RUN_ID}"
            code=$(curl -ksS --max-time 35 -o "/tmp/${label}.html" -w '%{http_code}' "$url" || true)
            bytes=$(wc -c <"/tmp/${label}.html" 2>/dev/null || echo 0)
            title=$(grep -Eio '<title[^>]*>[^<]*</title>' "/tmp/${label}.html" | head -n1 || true)
            echo "$label code=$code bytes=$bytes disable=$disable $title"
          }
          probe baseline ''
          probe no_trp 'translatepress-multilingual'
          probe no_checkout_manager 'woocommerce-checkout-manager'
          probe no_flexible_checkout 'flexible-checkout-fields,flexible-checkout-fields-pro'
          probe no_rules 'rulesengine,woo-discount-rules,woo-discount-rules-pro,payment-gateway-based-fees-and-discounts-for-woocommerce'
          probe no_tracking_crm 'pixelyoursite-pro,fluentcrm-woocommerce,mailchimp-for-woocommerce'
          probe no_marketplace 'wc-multivendor-marketplace,wc-multivendor-membership,wcfm,woo-wcfm-vendor'
          probe no_payments 'woocommerce-gateway-stripe,woocommerce-gateway-paypal-express-checkout,mollie-payments-for-woocommerce'
          probe no_shipping 'shipping-method-display-style-for-woocommerce,show-shipping-class-in-product-page,woocommerce-advanced-shipment-tracking,woocommerce-shipping-tracking'
          probe no_extras 'woocommerce-gift-cards,woocommerce-product-addons,woocommerce-product-bundles,woocommerce-subscriptions,ni-purchase-order-quantity'
          probe broad_checkout 'translatepress-multilingual,woocommerce-checkout-manager,flexible-checkout-fields,flexible-checkout-fields-pro,rulesengine,woo-discount-rules,woo-discount-rules-pro,payment-gateway-based-fees-and-discounts-for-woocommerce,pixelyoursite-pro,fluentcrm-woocommerce,mailchimp-for-woocommerce,wc-multivendor-marketplace,wc-multivendor-membership,wcfm,woo-wcfm-vendor,woocommerce-gateway-stripe,woocommerce-gateway-paypal-express-checkout,mollie-payments-for-woocommerce,shipping-method-display-style-for-woocommerce,show-shipping-class-in-product-page,woocommerce-advanced-shipment-tracking,woocommerce-shipping-tracking,woocommerce-gift-cards,woocommerce-product-addons,woocommerce-product-bundles,woocommerce-subscriptions,ni-purchase-order-quantity'
      - name: Remove temporary diagnostic MU plugin
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/wp-content/mu-plugins/000-mdo-checkout-request-diagnostic.php'"

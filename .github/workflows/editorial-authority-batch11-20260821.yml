name: Editorial authority batch 11 isolated publish 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-editorial-authority-batch11-20260821.php'
      - '.github/data/editorial-authority-batch11-20260821/**'
      - '.github/workflows/editorial-authority-batch11-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-authority-batch11-20260821
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish five articles independently
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-editorial-authority-batch11-20260821.php
          test "$(find .github/data/editorial-authority-batch11-20260821 -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 5
          for f in .github/data/editorial-authority-batch11-20260821/*.php; do php -l "$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-ab11-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch11-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
          sshpass -e scp $SCP .github/data/editorial-authority-batch11-20260821/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
          for localfile in .github/data/editorial-authority-batch11-20260821/*.php; do
            bn="$(basename "$localfile")"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH11_DIR='$DATA' EMDO_BATCH11_ONLY_FILE='$bn' '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root"
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT pm2.meta_value,p.ID,p.post_status,p.post_name,thumb.meta_value AS thumbnail_id FROM wp_posts p JOIN wp_postmeta b ON b.post_id=p.ID AND b.meta_key='_emdo_authority_batch' AND b.meta_value='11' JOIN wp_postmeta pm2 ON pm2.post_id=p.ID AND pm2.meta_key='_emdo_authority_key' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" | tee /tmp/ab11-db.txt
          test "$(grep -c $'\tpublish\t' /tmp/ab11-db.txt)" -eq 5
          test "$(awk -F '\t' '{print $5}' /tmp/ab11-db.txt | grep -E '^[0-9]+$' | sort -u | wc -l)" -eq 5
      - name: Verify ten public views and both indexes
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; marker="$2"; f=/tmp/ab11-page.html; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$f" -w '%{http_code}' "$url?ab11=$stamp"); test "$c" = 200; grep -Fq "EMDO_AUTHORITY_BATCH11:$marker" "$f"; grep -Eq 'class="[^"]*products|class="[^"]*product' "$f"; ! grep -Fq '[products ' "$f"; grep -Fq 'emo-article-featured' "$f"; }
          check "$BASE/50-75-100-iberico-que-significa-porcentaje-raza-etiqueta/" iberian-breed-percentage-guide
          check "$BASE/en/50-75-100-iberian-what-the-breed-percentage-on-the-label-means/" iberian-breed-percentage-guide
          check "$BASE/como-aprovechar-huesos-recortes-jamon-iberico/" iberian-ham-bones-trimmings-guide
          check "$BASE/en/how-to-use-iberian-ham-bones-and-trimmings-without-waste/" iberian-ham-bones-trimmings-guide
          check "$BASE/temperaturas-puntos-coccion-ternera-como-medir-interior-sin-secar/" beef-temperature-doneness-guide
          check "$BASE/en/beef-doneness-temperatures-how-to-measure-the-centre-without-drying-it-out/" beef-temperature-doneness-guide
          check "$BASE/como-leer-etiqueta-conserva-vegetal-ingredientes-peso-escurrido-origen/" vegetable-preserve-label-guide
          check "$BASE/en/how-to-read-a-vegetable-preserve-label-ingredients-drained-weight-origin-and-storage/" vegetable-preserve-label-guide
          check "$BASE/tomates-como-elegir-madurez-conservar-usar-segun-receta/" tomato-selection-ripeness-storage-guide
          check "$BASE/en/tomatoes-how-to-choose-ripeness-store-and-use-them-by-recipe/" tomato-selection-ripeness-storage-guide
          curl -k -L -sS --retry 3 -H 'Cache-Control: no-cache' "$BASE/blog/?ab11=$stamp" -o /tmp/blog-es.html
          curl -k -L -sS --retry 3 -H 'Cache-Control: no-cache' "$BASE/en/journal/?ab11=$stamp" -o /tmp/blog-en.html
          grep -Fq '50 %, 75 % o 100 % ibérico' /tmp/blog-es.html
          grep -Fq 'Temperaturas y puntos de cocción' /tmp/blog-es.html
          grep -Fq '50%, 75% or 100% Iberian' /tmp/blog-en.html
          grep -Fq 'Beef doneness and temperature' /tmp/blog-en.html
      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os
          rows=[]
          for line in open('/tmp/ab11-db.txt',encoding='utf-8'):
              p=line.rstrip('\n').split('\t')
              if len(p)>=5: rows.append({'key':p[0],'id':int(p[1]),'status':p[2],'slug':p[3],'image_id':int(p[4])})
          d={'batch':11,'release':'20260821','posts':rows,'verified':True,'language_views_verified':10,'blogs_verified':True,'distinct_featured_images':len({x['image_id'] for x in rows}),'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA']}
          open('.deploy-status/editorial-authority-batch11-final-20260821.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch11-final-20260821.json
          git commit -m 'Record verified editorial authority batch 11 publication [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

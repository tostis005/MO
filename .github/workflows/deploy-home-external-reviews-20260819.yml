name: Deploy Home external reviews 20260819

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-home-external-reviews-20260819.php'
      - '.github/workflows/deploy-home-external-reviews-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-home-external-reviews-20260819
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Validate PHP
        id: validate
        run: php -l mu-plugins/mdo-home-external-reviews-20260819.php

      - name: Deploy to production and invalidate static Home
        id: deploy
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e scp $SCP mu-plugins/mdo-home-external-reviews-20260819.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-home-external-reviews-20260819.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            install -m 0644 /tmp/mdo-home-external-reviews-20260819.php '$PROD_PATH/wp-content/mu-plugins/mdo-home-external-reviews-20260819.php'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f /tmp/mdo-home-external-reviews-20260819.php
          "

      - name: Verify live Home ES and EN
        id: verify
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            curl -fsS --compressed --max-time 50 -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/?mdo_review_check=$i" -o "/tmp/home-es-$i.html"
            curl -fsS --compressed --max-time 50 -H 'Cache-Control: no-cache' "https://www.elmercadodeorigen.com/en/?mdo_review_check=$i" -o "/tmp/home-en-$i.html"
          done
          cp /tmp/home-es-3.html /tmp/home-es.html
          cp /tmp/home-en-3.html /tmp/home-en.html
          python3 - <<'PY' | tee /tmp/home-external-reviews-verify.txt
          from pathlib import Path
          es = Path('/tmp/home-es.html').read_text(encoding='utf-8', errors='ignore')
          en = Path('/tmp/home-en.html').read_text(encoding='utf-8', errors='ignore')
          es_body_pos = es.lower().find('<body')
          es_body = es[es_body_pos:] if es_body_pos >= 0 else es
          checks = {
              'es_review_block': es.count('class="mdo-review-proof"') == 1,
              'es_google_score': '<strong>4,9</strong>' in es,
              'es_google_count': '303 reseñas' in es,
              'es_trustpilot_score': '<strong>4,6</strong>' in es,
              'es_trustpilot_count': '169 opiniones' in es,
              'es_intro': 'La confianza de quienes ya han comprado' in es,
              'en_review_block': en.count('class="mdo-review-proof"') == 1,
              'en_google_score': '<strong>4.9</strong>' in en,
              'en_google_count': '303 reviews' in en,
              'en_trustpilot_score': '<strong>4.6</strong>' in en,
              'en_trustpilot_count': '169 reviews' in en,
              'en_intro': 'Trusted by customers who have already ordered' in en,
              'en_section_label': 'aria-label="Customer ratings"' in en,
              'en_google_aria': 'Google: 4.9 out of 5, 303 reviews' in en,
              'en_trustpilot_aria': 'Trustpilot: 4.6 out of 5, 169 reviews' in en,
              'en_no_spanish_review_copy': '303 reseñas' not in en and '169 opiniones' not in en and 'La confianza de quienes ya han comprado' not in en,
              'legacy_google_block_absent': 'Opiniones de nuestros clientes en Google' not in es_body,
          }
          for name, ok in checks.items():
              print(f'{name}={int(ok)}')
          ok = all(checks.values())
          print(f'ok={int(ok)}')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Record verification
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          cat > .deploy-status/home-external-reviews-20260819.txt <<EOF
          validate=${{ steps.validate.outcome }}
          deploy=${{ steps.deploy.outcome }}
          verify=${{ steps.verify.outcome }}
          commit=${GITHUB_SHA}
          EOF
          if [ -f /tmp/home-external-reviews-verify.txt ]; then
            cat /tmp/home-external-reviews-verify.txt >> .deploy-status/home-external-reviews-20260819.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/home-external-reviews-20260819.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Home review deployment verification [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

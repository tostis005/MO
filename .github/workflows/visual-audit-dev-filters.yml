name: Visual audit Dev filters

on:
  push:
    branches: [dev/filter-visual-review]
    paths:
      - '.github/workflows/visual-audit-dev-filters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-audit-dev-filters
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Capture rendered category in desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dev.elmercadodeorigen.com/categoria-producto/jamones-paletas/?visual-audit=2'
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          COMMON='--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --disable-background-networking --disable-component-update --disable-sync --metrics-recording-only --no-first-run --virtual-time-budget=7000 --run-all-compositor-stages-before-draw'

          timeout 35s "$CHROME" $COMMON --window-size=1440,2400 --force-device-scale-factor=1 --screenshot=filters-desktop.png "$URL" || test -s filters-desktop.png
          timeout 35s "$CHROME" $COMMON --window-size=390,1800 --force-device-scale-factor=1 --screenshot=filters-mobile.png "$URL" || test -s filters-mobile.png
          timeout 35s "$CHROME" $COMMON --window-size=1440,1200 --dump-dom "$URL" > filters-dom.html || test -s filters-dom.html

          test -s filters-desktop.png
          test -s filters-mobile.png
          test -s filters-dom.html

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-filter-visual-audit
          path: |
            filters-desktop.png
            filters-mobile.png
            filters-dom.html
          if-no-files-found: warn
          retention-days: 1

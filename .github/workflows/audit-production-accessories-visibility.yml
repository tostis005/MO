name: Audit production accessories visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-accessories-visibility.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect production accessory visibility
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          dev_path=""
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve development WordPress root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$prod_path/wp-config.php" ]
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ]

          code="$(cat <<'PHP'
          $out = array();
          $cat = get_term_by('slug','accesorios','product_cat');
          $out['category'] = $cat instanceof WP_Term ? array('id'=>(int)$cat->term_id,'name'=>$cat->name,'count'=>(int)$cat->count) : null;
          $out['hide_out_of_stock'] = get_option('woocommerce_hide_out_of_stock_items');
          foreach (array(4067,12587) as $id) {
            $p = wc_get_product($id);
            if (!$p instanceof WC_Product) { $out['products'][$id] = array('missing'=>true); continue; }
            $visibility_terms = wp_get_post_terms($id,'product_visibility',array('fields'=>'names'));
            $types = wp_get_post_terms($id,'pa_tipo-producto',array('fields'=>'names'));
            $cats = wp_get_post_terms($id,'product_cat',array('fields'=>'names'));
            $out['products'][$id] = array(
              'name'=>$p->get_name(),
              'status'=>$p->get_status(),
              'catalog_visibility'=>$p->get_catalog_visibility(),
              'stock_status'=>$p->get_stock_status(),
              'manage_stock'=>$p->get_manage_stock(),
              'stock_quantity'=>$p->get_stock_quantity(),
              'price'=>$p->get_price(),
              'regular_price'=>$p->get_regular_price(),
              'sale_price'=>$p->get_sale_price(),
              'purchasable'=>$p->is_purchasable(),
              'in_stock'=>$p->is_in_stock(),
              'categories'=>is_wp_error($cats)?array():$cats,
              'tipo_producto'=>is_wp_error($types)?array():$types,
              'product_visibility_terms'=>is_wp_error($visibility_terms)?array():$visibility_terms,
              'permalink'=>get_permalink($id),
              'post_author'=>(int)get_post_field('post_author',$id),
            );
          }
          $q = new WP_Query(array(
            'post_type'=>'product',
            'post_status'=>'publish',
            'posts_per_page'=>-1,
            'fields'=>'ids',
            'tax_query'=>array(array('taxonomy'=>'product_cat','field'=>'slug','terms'=>array('accesorios'))),
          ));
          $out['published_accessories_ids']=array_map('intval',$q->posts);
          $out['published_accessories_count']=count($q->posts);
          echo wp_json_encode($out, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT);
          PHP
          )"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$code" --path="$prod_path" --allow-root
          REMOTE

name: Emergency broad Woo filter guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-broad-filter-guard-20260831.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Block expensive faceted filter requests before PHP and recycle FPM
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -euo pipefail
            DOCROOT=$(awk "/^[[:space:]]*DocumentRoot[[:space:]]/ {gsub(/\"/,\"\",\$2); print \$2; exit}" /var/www/vhosts/system/elmercadodeorigen.com/conf/httpd.conf)
            : "${DOCROOT:?document root not found}"
            HT="$DOCROOT/.htaccess"
            touch "$HT"
            cp -a "$HT" "$HT.emdo-pre-broad-filter-guard-$(date +%Y%m%d-%H%M%S)"
            python3 - "$HT" <<"PY"
from pathlib import Path
import sys
p=Path(sys.argv[1])
s=p.read_text(errors="replace")
start="# BEGIN EMDO EMERGENCY BROAD FILTER GUARD 20260831"
end="# END EMDO EMERGENCY BROAD FILTER GUARD 20260831"
if start in s and end in s:
    s=s.split(start,1)[0]+s.split(end,1)[1].lstrip("\n")
block='''# BEGIN EMDO EMERGENCY BROAD FILTER GUARD 20260831
# Temporary emergency protection: faceted WooCommerce filter URLs are blocked
# before WordPress/PHP while the distributed crawl is contained.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{QUERY_STRING} (^|&)filter_[^=]+=[^&]* [NC]
RewriteRule ^ - [F,L]
</IfModule>
# END EMDO EMERGENCY BROAD FILTER GUARD 20260831

'''
p.write_text(block+s)
PY
            child=$(pgrep -f "php-fpm: pool elmercadodeorigen.com" | head -n1 || true)
            if [ -n "$child" ]; then
              master=$(ps -o ppid= -p "$child" | tr -d " ")
              unit=$(sed -n "s#.*system.slice/\([^/]*plesk-php[0-9][0-9]-fpm.service\).*#\1#p" /proc/$master/cgroup | head -n1)
            else
              unit=$(systemctl list-units --type=service --state=activating,active,deactivating --no-legend "plesk-php*-fpm.service" | awk "NR==1{print \$1}")
            fi
            case "$unit" in plesk-php*-fpm.service) ;; *) echo "Unsafe FPM unit: ${unit:-none}"; exit 4;; esac
            systemctl kill --kill-who=all -s KILL "$unit" 2>/dev/null || true
            sleep 1
            systemctl reset-failed "$unit" 2>/dev/null || true
            systemctl start "$unit"
            sleep 3
            home=$(curl -k -L -sS -o /tmp/home -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/ || true)
            blog=$(curl -k -L -sS -o /tmp/blog -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/blog/ || true)
            shop=$(curl -k -L -sS -o /tmp/shop -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/tienda/ || true)
            filt=$(curl -k -L -sS -o /tmp/filt -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://www.elmercadodeorigen.com/tienda/?filter_alimentacion=bellota" || true)
            echo "HOME=$home BLOG=$blog SHOP=$shop FILTER=$filt"
            uptime
            ps -eo pid,etime,%cpu,%mem,args --sort=-%cpu | grep -E "php-fpm: pool elmercadodeorigen.com|COMMAND" | head -n 25 || true
            [ "$home" = "200" ] && [ "$blog" = "200" ] && [ "$shop" = "200" ] && [ "$filt" = "403" ]
          '

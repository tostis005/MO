name: Home desktop CLS probe 20260820
# Detailed re-run after user desktop agent reported CLS 0.12.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-desktop-cls-probe-20260820.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Trace desktop layout shifts and geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > runtime/home-desktop-cls-probe-20260820.txt
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1350,height:940,deviceScaleFactor:1});
            await page.evaluateOnNewDocument(()=>{
              const rect=r=>r?{x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left}:null;
              const selector=el=>{if(!el||!el.tagName)return '';let x=el.tagName.toLowerCase();if(el.id)x+='#'+el.id;if(el.classList&&el.classList.length)x+='.'+[...el.classList].slice(0,5).join('.');return x;};
              window.__cls=0;window.__shifts=[];
              new PerformanceObserver(list=>{for(const e of list.getEntries()){if(e.hadRecentInput)continue;window.__cls+=e.value;window.__shifts.push({value:e.value,time:e.startTime,sources:(e.sources||[]).map(s=>({selector:selector(s.node),previousRect:rect(s.previousRect),currentRect:rect(s.currentRect)}))});}}).observe({type:'layout-shift',buffered:true});
            });
            const started=Date.now();
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:60000});
            for(const delay of [0,250,500,750,1000,1500,2000,2500,3000,4000]){
              const elapsed=Date.now()-started;if(delay>elapsed)await new Promise(r=>setTimeout(r,delay-elapsed));
              const snap=await page.evaluate(()=>{
                const q=s=>document.querySelector(s);const R=e=>e?(()=>{const r=e.getBoundingClientRect();return [Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)]})():null;const C=e=>e?getComputedStyle(e):null;
                const hero=q('.emo-hero'),grid=q('.emo-hero__grid'),visual=q('.emo-hero__visual--vendors'),card=q('.emo-hero-card--1'),trust=q('.emo-trust'),nav=q('.site-navigation');
                const hc=C(hero),gc=C(grid),vc=C(visual),cc=C(card);
                return {hero:R(hero),grid:R(grid),visual:R(visual),card:R(card),trust:R(trust),nav:R(nav),heroCSS:hc&&[hc.minHeight,hc.paddingTop,hc.paddingBottom],gridCSS:gc&&[gc.gridTemplateColumns,gc.gap],visualCSS:vc&&[vc.gridTemplateRows,vc.transform,vc.height],cardCSS:cc&&[cc.gridColumnStart,cc.gridColumnEnd,cc.gridRowStart,cc.gridRowEnd]};
              });
              console.log('SNAP',delay,JSON.stringify(snap));
            }
            await new Promise(r=>setTimeout(r,3000));
            const data=await page.evaluate(()=>({cls:window.__cls,shifts:window.__shifts}));
            console.log('CLS',data.cls.toFixed(6));
            for(const e of data.shifts.sort((a,b)=>b.value-a.value).slice(0,12)){console.log('SHIFT',e.value.toFixed(6),'t',Math.round(e.time),JSON.stringify(e.sources));}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat runtime/home-desktop-cls-probe-20260820.txt
      - name: Record probe
        if: always()
        shell: bash
        run: |
          [ -f runtime/home-desktop-cls-probe-20260820.txt ] || echo failed > runtime/home-desktop-cls-probe-20260820.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-desktop-cls-probe-20260820.txt
          git commit -m 'Record detailed desktop Home CLS geometry' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

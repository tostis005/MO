name: Home desktop CLS probe 20260820

on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-desktop-cls-probe-20260820.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Trace desktop layout shifts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > runtime/home-desktop-cls-probe-20260820.txt
          const puppeteer=require('puppeteer-core');
          function sel(el){
            if(!el||!el.tagName)return '';
            let s=el.tagName.toLowerCase();
            if(el.id)s+='#'+el.id;
            if(el.classList&&el.classList.length)s+='.'+[...el.classList].slice(0,4).join('.');
            return s;
          }
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(let run=1;run<=3;run++){
              const page=await browser.newPage();
              await page.setViewport({width:1350,height:940,deviceScaleFactor:1});
              await page.evaluateOnNewDocument(()=>{
                window.__cls=0;window.__shifts=[];
                new PerformanceObserver(list=>{
                  for(const e of list.getEntries()){
                    if(e.hadRecentInput)continue;
                    window.__cls+=e.value;
                    window.__shifts.push({value:e.value,time:e.startTime,sources:(e.sources||[]).map(s=>({node:s.node,previousRect:s.previousRect,currentRect:s.currentRect}))});
                  }
                }).observe({type:'layout-shift',buffered:true});
              });
              await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'load',timeout:60000});
              await new Promise(r=>setTimeout(r,7000));
              const data=await page.evaluate(()=>({cls:window.__cls,shifts:window.__shifts.map(e=>({value:e.value,time:e.time,sources:e.sources.map(s=>({selector:(()=>{const el=s.node;if(!el||!el.tagName)return '';let x=el.tagName.toLowerCase();if(el.id)x+='#'+el.id;if(el.classList&&el.classList.length)x+='.'+[...el.classList].slice(0,4).join('.');return x;})(),previousRect:s.previousRect,currentRect:s.currentRect}))}))}));
              console.log('RUN',run,'CLS',data.cls.toFixed(6));
              for(const e of data.shifts.sort((a,b)=>b.value-a.value).slice(0,8)){
                console.log(' shift',e.value.toFixed(6),'t=',Math.round(e.time));
                for(const s of e.sources.slice(0,5)) console.log('  ',s.selector,JSON.stringify(s.previousRect),'->',JSON.stringify(s.currentRect));
              }
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat runtime/home-desktop-cls-probe-20260820.txt
      - name: Record probe
        if: always()
        shell: bash
        run: |
          [ -f runtime/home-desktop-cls-probe-20260820.txt ] || echo failed > runtime/home-desktop-cls-probe-20260820.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-desktop-cls-probe-20260820.txt
          git commit -m 'Record remaining desktop Home CLS sources' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Production filter parity 0.10.233

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-filter-parity-010233.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-filter-parity
  cancel-in-progress: false

jobs:
  deploy-filters-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Checkout deployment control
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout QA-approved filter source
        uses: actions/checkout@v4
        with:
          ref: 5dde637b4c3895263e0bf0621b43accfe6eae262
          path: source

      - name: Validate deploy script
        shell: bash
        run: |
          set -euo pipefail
          bash -n control/.github/scripts/deploy-filter-parity-010233-production.sh
          test -f source/.github/scripts/catalog-filter-unified-010229-browser.cjs
          test -f source/.github/scripts/elmercado-opcache-reset.php

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          cd source
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify filters only
        shell: bash
        run: bash control/.github/scripts/deploy-filter-parity-010233-production.sh "$GITHUB_WORKSPACE/source"

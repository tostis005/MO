name: Production filter parity 0.10.233

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-filter-parity-010233.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-filter-parity
  cancel-in-progress: false

jobs:
  deploy-filters-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Checkout deployment control
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout QA-approved filter source
        uses: actions/checkout@v4
        with:
          ref: 5dde637b4c3895263e0bf0621b43accfe6eae262
          path: source

      - name: Prepare production-scoped filter payload
        shell: bash
        run: |
          set -euo pipefail
          cp control/.github/scripts/deploy-filter-parity-010233-production.sh /tmp/deploy-filter-parity.sh
          sed -i 's/^esshpass /sshpass /' /tmp/deploy-filter-parity.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/elmercadodeorigen-child/inc/vendor-sticky-root-fix-010228.php')
          s=p.read_text()
          old="""\t\tif ( is_admin() || ! function_exists( 'elmercado_vendor_store_is_request_010225' ) || ! elmercado_vendor_store_is_request_010225() ) {\n\t\t\treturn;\n\t\t}\n"""
          new="""\t\tif ( is_admin() ) {\n\t\t\treturn;\n\t\t}\n\t\t$is_vendor = function_exists( 'elmercado_vendor_store_is_request_010225' ) && elmercado_vendor_store_is_request_010225();\n\t\t$is_catalog = function_exists( 'elmercado_core_filters_is_catalog' ) && elmercado_core_filters_is_catalog();\n\t\tif ( ! $is_vendor && ! $is_catalog ) {\n\t\t\treturn;\n\t\t}\n"""
          if old not in s: raise SystemExit('sticky condition anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('html body.elmercado-child-theme.wcfmmp-store-page #view,','html body.elmercado-child-theme:is(.woocommerce-shop,.tax-product_cat,.tax-product_tag,.wcfmmp-store-page) #view,')
          s=s.replace('html body.elmercado-child-theme.wcfmmp-store-page #page {','html body.elmercado-child-theme:is(.woocommerce-shop,.tax-product_cat,.tax-product_tag,.wcfmmp-store-page) #page {')
          p.write_text(s)
          PY
          php -l source/elmercadodeorigen-child/inc/vendor-sticky-root-fix-010228.php >/dev/null
          bash -n /tmp/deploy-filter-parity.sh

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          cd source
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify filters only
        shell: bash
        run: |
          set -o pipefail
          bash /tmp/deploy-filter-parity.sh "$GITHUB_WORKSPACE/source" 2>&1 | tee /tmp/filter-production.log
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 0
          grep -Fq 'FILTER_FILES_DEPLOYED_010233_OK' /tmp/filter-production.log
          grep -Fq 'PRODUCTION_FILTER_RUNTIME_010233_OK' /tmp/filter-production.log
          grep -Fq 'CATALOG_FILTER_UNIFIED_010233_OK' /tmp/filter-production.log
          grep -Fq 'PRODUCTION_FILTER_PARITY_010233_OK' /tmp/filter-production.log
          ! grep -Fq 'PRODUCTION_FILTER_PARITY_ROLLED_BACK' /tmp/filter-production.log

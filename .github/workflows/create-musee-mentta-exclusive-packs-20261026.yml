name: Publish and double-verify Musée Gourmet Mentta-exclusive packs 2026-10-26
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-musee-mentta-exclusive-packs-20261026.yml'
      - '.github/scripts/create-musee-mentta-exclusive-packs-20261026.php'
      - '.github/scripts/verify-musee-mentta-api-20261026.php'
      - '.github/data/mentta-latitudes-packs-20261026.json'
      - 'mu-plugins/emdo-mentta-musee-pack-stock-20261026.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musee-mentta-only-packs-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate code and manifest
        run: |
          set -euo pipefail
          php -l .github/scripts/create-musee-mentta-exclusive-packs-20261026.php
          php -l .github/scripts/verify-musee-mentta-api-20261026.php
          php -l mu-plugins/emdo-mentta-musee-pack-stock-20261026.php
          python3 - <<'PY'
          import json
          p=json.load(open('.github/data/mentta-latitudes-packs-20261026.json'))
          assert len(p['packs'])==7
          assert len({x['key'] for x in p['packs']})==7
          for x in p['packs']:
              assert x['validation']['profit_pct']>=10
              assert len({z[0] for z in x['items']})==len(x['items'])
              assert all(z[0] in p['sources'] and z[1]>0 for z in x['items'])
          print('MANIFEST_VALIDATED')
          PY
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Install stock guard and run preflight apply double verification
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          ID="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" .github/scripts/create-musee-mentta-exclusive-packs-20261026.php "$TARGET:/tmp/musee-mentta-$ID.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/verify-musee-mentta-api-20261026.php "$TARGET:/tmp/musee-mentta-verify-$ID.php"
          sshpass -e scp "${SCP[@]}" .github/data/mentta-latitudes-packs-20261026.json "$TARGET:/tmp/mentta-latitudes-packs-20261026.json"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-musee-pack-stock-20261026.php "$TARGET:/tmp/musee-mentta-stock-$ID.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$PROD_PATH' '$ID'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; RUN="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          export MDO_MENTTA_PACK_DATA=/tmp/mentta-latitudes-packs-20261026.json
          install -m 0644 "/tmp/musee-mentta-stock-$RUN.php" "$SITE/wp-content/mu-plugins/emdo-mentta-musee-pack-stock-20261026.php"
          export MDO_MENTTA_PACK_MODE=inspect
          "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "/tmp/musee-mentta-$RUN.php" --path="$SITE" --allow-root
          export MDO_MENTTA_PACK_MODE=apply
          "$PHP_BIN" -d memory_limit=1024M "$WP_BIN" eval-file "/tmp/musee-mentta-$RUN.php" --path="$SITE" --allow-root
          export MDO_MENTTA_PACK_MODE=verify
          "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "/tmp/musee-mentta-$RUN.php" --path="$SITE" --allow-root
          "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "/tmp/musee-mentta-verify-$RUN.php" --path="$SITE" --allow-root
          REMOTE
      - name: Verify seven non-public product URLs return HTTP 404
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/musee-pack-keys.txt
          import json
          for x in json.load(open('.github/data/mentta-latitudes-packs-20261026.json'))['packs']:
              print(x['key'])
          PY
          while IFS= read -r KEY; do
            URL="https://www.elmercadodeorigen.com/producto/pack-musee-mentta-$KEY/"
            STATUS="$(curl -sS -L --connect-timeout 10 --max-time 45 -o /dev/null -w '%{http_code}' "$URL")"
            echo "PRIVATE_CHECK $KEY HTTP $STATUS"
            test "$STATUS" = 404
          done </tmp/musee-pack-keys.txt
          echo 'SEVEN_PACKS_HIDDEN_AND_EXPORTED_OK'

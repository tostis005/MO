name: Diagnose Home Lighthouse 0.10.283

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-home-lighthouse-010283.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Inspect production Home performance sources
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -e
          echo "PROD_PATH=$PROD_PATH"
          echo '--- implementation matches ---'
          grep -RniE 'elmercado_home_responsive_producer_cards_010252|emo-home-vendor-responsive-image|En El Mercado de Origen buscamos productores|home-featured-special|woo-coupon-usage' \
            "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" "$PROD_PATH/wp-content/mu-plugins" "$PROD_PATH/wp-content/plugins/mdo-supplier-sync" "$PROD_PATH/wp-content/plugins/woo-coupon-usage" \
            --include='*.php' --include='*.js' --include='*.css' 2>/dev/null | head -n 320 || true

          echo '--- producer responsive implementation ---'
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "### $f"
            grep -nE -C 45 'elmercado_home_responsive_producer_cards_010252|emo-home-vendor-responsive-image' "$f" 2>/dev/null | head -n 360 || true
          done < <(grep -RlE 'elmercado_home_responsive_producer_cards_010252|emo-home-vendor-responsive-image' "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" "$PROD_PATH/wp-content/mu-plugins" --include='*.php' 2>/dev/null | head -n 12)

          echo '--- target image variants ---'
          for spec in "$PROD_PATH/wp-content/uploads/2026/08/La-huerta-de-ana-mary-fondo*" "$PROD_PATH/wp-content/uploads/2023/12/Aceite-sin-filtrar*" "$PROD_PATH/wp-content/uploads/2026/08/JAMON_ACTO_ECOLOGICO1*"; do
            for f in $spec; do
              [ -f "$f" ] || continue
              dims=$(php -r '$s=@getimagesize($argv[1]); echo $s ? ($s[0]."x".$s[1]) : "unknown";' "$f" 2>/dev/null || echo unknown)
              printf '%s|' "$f"
              stat -c '%s bytes|' "$f" | tr -d '\n'
              echo "$dims"
            done
          done

          echo '--- canonical Home headers ---'
          curl -sSI --max-time 25 https://www.elmercadodeorigen.com/ | grep -Ei '^(HTTP/|x-el-mercado-cache:|cache-control:|content-type:)' || true

          echo '--- fresh Home HTML relevant tags ---'
          curl -sSL --max-time 30 'https://www.elmercadodeorigen.com/?mdo_perf_diag=1' -o /tmp/mdo-home-perf.html
          grep -nE -C 4 'La Huerta de Ana Mary|Aceite-sin-filtrar|Hidalgo de la Jara|En El Mercado de Origen buscamos productores|woo-coupon-usage|home-featured-special' /tmp/mdo-home-perf.html | head -n 480 || true

          echo '--- relevant external scripts/styles ---'
          grep -Eo '<(script|link)[^>]+(connect\.facebook\.net|pinimg\.com|googletagmanager\.com|woo-coupon-usage|home-featured-special)[^>]*>' /tmp/mdo-home-perf.html | head -n 120 || true
          REMOTE

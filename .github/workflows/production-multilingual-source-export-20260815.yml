name: Export production multilingual source 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-multilingual-source-export-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Export current production source
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          cat > /tmp/mdo-prod-export.php <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit(1);
          $site=(string)get_option('siteurl');
          if (!preg_match('~^https?://(www\.)?elmercadodeorigen\.com/?$~',$site)) { fwrite(STDERR,"Refusing non-production: $site\n"); exit(2); }
          function clean_html($s){ return trim((string)$s); }
          $out=['siteurl'=>$site,'home'=>(string)get_option('home'),'theme'=>wp_get_theme()->get('Name'),'plugins'=>[],'pages'=>[],'products'=>[],'taxonomies'=>[]];
          if (function_exists('get_plugins')) { foreach(get_plugins() as $file=>$p){ $out['plugins'][]=['file'=>$file,'name'=>$p['Name']??'','version'=>$p['Version']??'','active'=>is_plugin_active($file)]; } }
          $pages=get_posts(['post_type'=>'page','post_status'=>'publish','numberposts'=>-1,'orderby'=>'ID','order'=>'ASC']);
          foreach($pages as $p){ $out['pages'][]=['id'=>$p->ID,'title'=>$p->post_title,'slug'=>$p->post_name,'content'=>clean_html($p->post_content),'excerpt'=>clean_html($p->post_excerpt),'template'=>get_post_meta($p->ID,'_wp_page_template',true)]; }
          $products=get_posts(['post_type'=>'product','post_status'=>'publish','numberposts'=>-1,'orderby'=>'ID','order'=>'ASC']);
          foreach($products as $p){
            $terms=[]; foreach(get_object_taxonomies('product','names') as $tax){ $ts=wp_get_post_terms($p->ID,$tax,['fields'=>'all']); if(!is_wp_error($ts)&&$ts){ $terms[$tax]=array_map(fn($t)=>['id'=>$t->term_id,'name'=>$t->name,'slug'=>$t->slug],$ts); } }
            $out['products'][]=['id'=>$p->ID,'title'=>$p->post_title,'slug'=>$p->post_name,'short'=>clean_html($p->post_excerpt),'content'=>clean_html($p->post_content),'author'=>(int)$p->post_author,'terms'=>$terms];
          }
          foreach(['product_cat','product_tag'] as $tax){ $ts=get_terms(['taxonomy'=>$tax,'hide_empty'=>false]); if(!is_wp_error($ts)) $out['taxonomies'][$tax]=array_map(fn($t)=>['id'=>$t->term_id,'name'=>$t->name,'slug'=>$t->slug,'description'=>$t->description],$ts); }
          foreach(wc_get_attribute_taxonomies() as $a){ $tax=wc_attribute_taxonomy_name($a->attribute_name); $ts=get_terms(['taxonomy'=>$tax,'hide_empty'=>false]); if(!is_wp_error($ts)) $out['taxonomies'][$tax]=array_map(fn($t)=>['id'=>$t->term_id,'name'=>$t->name,'slug'=>$t->slug,'description'=>$t->description],$ts); }
          echo wp_json_encode($out,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-prod-export.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-prod-export.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file /tmp/mdo-prod-export.php --path='$PROD_PATH' --allow-root 2>/tmp/mdo-prod-export.err > /tmp/mdo-prod-source.json; rc=\$?; cat /tmp/mdo-prod-export.err >&2; exit \$rc"
          sshpass -e scp $SCP_OPTIONS "$STAGING_USER@$STAGING_HOST:/tmp/mdo-prod-source.json" ./production-source.json
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "ACTIVE_THEME=\$(wp theme list --status=active --field=name --path='$PROD_PATH' --allow-root 2>/dev/null | head -n1); grep -RIn --include='*.php' --include='*.js' --include='*.json' -E '[ÁÉÍÓÚáéíóúÑñ¿¡]|resultado|productos|Cargar|Filtros|Ordenar|Añadir|envío|incluid|garrafas|productores|Tienda|Contacto' '$PROD_PATH/wp-content/themes/'\"\$ACTIVE_THEME\" '$PROD_PATH/wp-content/mu-plugins' 2>/dev/null | head -n 2500 > /tmp/mdo-prod-custom-text.txt || true"
          sshpass -e scp $SCP_OPTIONS "$STAGING_USER@$STAGING_HOST:/tmp/mdo-prod-custom-text.txt" ./production-custom-text.txt
          python - <<'PY'
          import json
          d=json.load(open('production-source.json'))
          print('site',d['siteurl'])
          print('pages',len(d['pages']))
          print('products',len(d['products']))
          print('active plugins',sum(1 for p in d['plugins'] if p['active']))
          print('product titles:')
          for p in d['products']: print(p['id'],p['title'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-multilingual-source-20260815
          path: |
            production-source.json
            production-custom-text.txt
          retention-days: 2

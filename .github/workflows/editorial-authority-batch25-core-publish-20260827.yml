name: Live blog inventory and retire legacy articles 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch25-core-publish-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory production posts and remove three legacy posts
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-blog-inventory-${GITHUB_RUN_ID}.php
          cat > /tmp/inventory.php <<'PHP'
          <?php
          if (!defined('ABSPATH')) { exit; }
          $legacy = array('naranjas','aceite-de-oliva-virgen-extra','jamon-iberico');
          $removed = array();
          foreach ($legacy as $slug) {
              $p = get_page_by_path($slug, OBJECT, 'post');
              if ($p) {
                  $removed[] = array('id'=>(int)$p->ID,'title'=>$p->post_title,'slug'=>$p->post_name,'en_title'=>(string)get_post_meta($p->ID,'_en_US_post_title',true),'en_slug'=>(string)get_post_meta($p->ID,'_en_US_post_name',true));
                  wp_delete_post((int)$p->ID, true);
              } else {
                  $removed[] = array('id'=>0,'title'=>'','slug'=>$slug,'missing'=>true);
              }
          }
          $ids = get_posts(array('post_type'=>'post','post_status'=>'publish','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC','fields'=>'ids','suppress_filters'=>false));
          $posts = array();
          foreach ($ids as $id) {
              $terms = wp_get_post_terms($id,'category',array('fields'=>'names'));
              $posts[] = array('id'=>(int)$id,'title'=>get_the_title($id),'slug'=>get_post_field('post_name',$id),'en_title'=>(string)get_post_meta($id,'_en_US_post_title',true),'en_slug'=>(string)get_post_meta($id,'_en_US_post_name',true),'authority_key'=>(string)get_post_meta($id,'_emdo_authority_key',true),'categories'=>is_wp_error($terms)?array():array_values($terms));
          }
          echo wp_json_encode(array('generated_at'=>gmdate('c'),'removed'=>$removed,'count'=>count($posts),'posts'=>$posts), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;
          PHP
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 /tmp/inventory.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval 'require \"$REMOTE\";' --path='$PROD' --skip-plugins --skip-themes --allow-root; rm -f '$REMOTE'; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true" > /tmp/blog-inventory.json
          jq -e '.removed|length==3' /tmp/blog-inventory.json >/dev/null
          jq -e '.count>100' /tmp/blog-inventory.json >/dev/null
          mkdir -p .deploy-status
          cp /tmp/blog-inventory.json .deploy-status/blog-inventory-after-retiring-legacy-20260827.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/blog-inventory-after-retiring-legacy-20260827.json
          git commit -m 'Record live blog inventory after retiring legacy posts [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

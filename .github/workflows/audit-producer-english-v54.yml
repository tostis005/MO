name: Audit producer English v54

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-producer-english-v54.yml'
      - '.github/scripts/audit-producer-english-v54.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run id
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/producer-en-v54.txt
          git add runtime/producer-en-v54.txt
          git commit -m 'Start producer English audit v54'
          git push origin HEAD:main

      - name: Audit production database and pages
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf '%s' "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          REMOTE="/tmp/audit-producer-en-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/audit-producer-english-v54.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > runtime/producer-en-db-v54.json

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set +e
            for slug in 1957 hidalgo-de-la-jara tolecarnes puente-robles el-catedratico; do
              url="https://www.elmercadodeorigen.com/en/store/$slug/about/"
              rm -f /tmp/h54 /tmp/b54
              code=$(curl -k -L --max-redirs 5 -sS --connect-timeout 8 --max-time 35 -D /tmp/h54 -o /tmp/b54 -w "%{http_code}" "$url")
              rc=$?
              echo "=== $slug ==="
              echo "rc=$rc code=$code redirects=$(grep -ic "^location:" /tmp/h54 2>/dev/null || true) bytes=$(wc -c </tmp/b54 2>/dev/null || echo 0)"
              echo "english=$(grep -oiE "The story of|deeply connected to the Iberian pig|linked to cattle farming since|From Fermoselle|grew out of a family experience" /tmp/b54 2>/dev/null | wc -l) spanish=$(grep -oiE "La historia de|Los ganaderos que integran|Su explotación se encuentra|Desde Fermoselle" /tmp/b54 2>/dev/null | wc -l) policies=$(grep -oiE ">[[:space:]]*(Policies|Store Policies)[[:space:]]*<|Políticas de la tienda" /tmp/b54 2>/dev/null | wc -l)"
              grep -oE "<title>[^<]+" /tmp/b54 2>/dev/null | head -1
            done
            echo "=== producers pages ==="
            for url in https://www.elmercadodeorigen.com/en/producers/ https://www.elmercadodeorigen.com/en/productores/; do
              rm -f /tmp/h54 /tmp/b54
              code=$(curl -k -L --max-redirs 5 -sS --connect-timeout 8 --max-time 35 -D /tmp/h54 -o /tmp/b54 -w "%{http_code}" "$url")
              echo "url=$url code=$code final=$(awk "BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,\"\");sub(/\\r$/,\"\");x=\$0}END{print x}" /tmp/h54)"
              grep -oE "<title>[^<]+" /tmp/b54 2>/dev/null | head -1
            done
          ' > runtime/producer-en-pages-v54.txt 2>&1

      - name: Commit report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=complete\n' "$GITHUB_RUN_ID" > runtime/producer-en-v54.txt
          git add runtime/producer-en-v54.txt runtime/producer-en-db-v54.json runtime/producer-en-pages-v54.txt
          git commit -m 'Record producer English audit v54' || true
          git pull --rebase origin main
          git push origin HEAD:main

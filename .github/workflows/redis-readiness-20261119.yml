name: Redis object-cache readiness checks 20261119
on:
  push:
    branches: [main]
    paths: ['.github/workflows/redis-readiness-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Check whether an isolated Redis object cache can be safely enabled
        shell: bash
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== SYSTEM ==="
          cat /etc/os-release | grep -E '^(NAME|VERSION_ID|ID)='
          uname -m
          date -u
          df -h / /var | tail -n 3
          free -m | head -n 3
          echo "=== REDIS BINARIES / PACKAGES ==="
          command -v redis-server || true
          command -v redis-cli || true
          dpkg-query -W -f='STATUS ${Package} ${Status} ${Version}\n' redis-server redis-tools plesk-php82-redis 2>/dev/null || true
          apt-cache policy redis-server plesk-php82-redis | head -n 35 || true
          echo "=== PHP 8.2 REDIS EXTENSION ==="
          /opt/plesk/php/8.2/bin/php -m | grep -Ei 'redis|apcu|memcache|opcache|sockets' || true
          ls /opt/plesk/php/8.2/lib/php/modules/redis.so /opt/plesk/php/8.2/lib64/php/modules/redis.so 2>/dev/null || true
          echo "=== REDIS LISTENERS ==="
          ss -lnt | grep -E ':6379 |:6380 |:6389 ' || true
          echo "=== WP PLUGIN DIRECTORY ==="
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          if test -d "$ROOT/wp-content/plugins/redis-cache"; then echo REDIS_CACHE_PLUGIN_PRESENT; else echo REDIS_CACHE_PLUGIN_MISSING; fi
          if test -e "$ROOT/wp-content/object-cache.php"; then echo OBJECT_CACHE_DROPIN_PRESENT; else echo OBJECT_CACHE_DROPIN_MISSING; fi
          echo "=== SYSTEMD RESOURCES ==="
          systemctl is-active redis-server 2>/dev/null || true
          echo "=== EXISTING SITE RESOURCE PRESSURE ==="
          uptime
          ps -eo stat=,comm=,rss= | awk '$2=="php-fpm"{n++;m+=$3} END{print "ALL_PHP_FPM_PROCESSES",n,"RSS_MB",int(m/1024)}'
          REMOTE

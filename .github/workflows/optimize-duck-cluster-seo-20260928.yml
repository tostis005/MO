name: Optimize duck cluster SEO 20260928

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-duck-cluster-seo-20260928.php'
      - '.github/scripts/optimize-duck-cluster-seo-20260928.php'
      - '.github/workflows/optimize-duck-cluster-seo-20260928.yml'

permissions:
  contents: write

concurrency:
  group: optimize-duck-cluster-seo-20260928
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-duck-cluster-seo-20260928.php >/dev/null
          php -l .github/scripts/optimize-duck-cluster-seo-20260928.php >/dev/null
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Deploy and optimize production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq curl >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 22
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"

          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE_SCRIPT="/tmp/optimize-duck-cluster-${GITHUB_RUN_ID}.php"
          REMOTE_PLUGIN="$PROD/wp-content/mu-plugins/mdo-duck-cluster-seo-20260928.php"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-duck-cluster-seo-20260928.php "$STAGING_USER@$STAGING_HOST:$REMOTE_PLUGIN"
          sshpass -e scp $SCP .github/scripts/optimize-duck-cluster-seo-20260928.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST"             "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE_SCRIPT' --path='$PROD' --allow-root"             > /tmp/duck-seo-optimize.json

          jq '. | {batch,category,count,visible_normal_query,category_query,homepage_unsuppressed}' /tmp/duck-seo-optimize.json

          jq -e '.count == 60' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '.visible_normal_query == 60' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '.category_query == 60' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '.homepage_unsuppressed == 60' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '.category.hub_marker == true' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '.seo.title_max <= 60' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '.seo.description_min >= 100 and .seo.description_max <= 180' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '([.seo.groups[]] | add) == 60' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '[.rows[] | select(.home_suppress != "")] | length == 0' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '[.rows[] | select(.hidden != "")] | length == 0' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '[.rows[] | select((.categories|length)!=1)] | length == 0' /tmp/duck-seo-optimize.json >/dev/null
          jq -e '[.rows[] | select(.group == "" or .seo_title == "" or .seo_description == "")] | length == 0' /tmp/duck-seo-optimize.json >/dev/null

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST"             "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE_SCRIPT'"

      - name: Verify public SEO and discovery
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'

          get_page() {
            local url="$1"
            local out="$2"
            curl -fsSL --retry 4 --retry-delay 2 --max-time 60 \
              -A 'Mozilla/5.0 EMDO SEO verifier' \
              -H 'Cache-Control: no-cache' \
              "$url" -o "$out"
          }

          get_page "$base/category/carnes/pato/?emdo_seo_verify=1" /tmp/pato-category.html
          get_page "$base/carne-de-pato-guia-completa-cortes-sabor-preparacion/?emdo_seo_verify=1" /tmp/duck-pillar.html
          get_page "$base/como-preparar-confit-de-pato-al-horno-piel-crujiente/?emdo_seo_verify=1" /tmp/duck-confit.html
          get_page "$base/blog/?emdo_seo_verify=1" /tmp/blog-home.html
          get_page "$base/como-elegir-lote-productos-gourmet-presupuesto-destinatario-conservacion/?emdo_seo_verify=1" /tmp/source-link.html

          python3 - <<'PY'
          import json,re
          from html.parser import HTMLParser
          from pathlib import Path

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_title=False
                  self.title=[]
                  self.text=[]
                  self.description=None
                  self.canonical=None
                  self.noindex=False
                  self.related=[]
                  self.hub_link=False
                  self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag.lower()=='title':
                      self.in_title=True
                  if tag.lower()=='meta':
                      name=(a.get('name') or '').lower()
                      if name=='description':
                          self.description=a.get('content')
                      if name=='robots' and 'noindex' in (a.get('content') or '').lower():
                          self.noindex=True
                  if tag.lower()=='link' and (a.get('rel') or '').lower()=='canonical':
                      self.canonical=a.get('href')
                  if 'data-emdo-duck-related-topic' in a:
                      self.related.append(a['data-emdo-duck-related-topic'])
                  if a.get('data-emdo-duck-hub-link')=='1':
                      self.hub_link=True
                  if tag.lower()=='a' and a.get('href'):
                      self.hrefs.append(a['href'])
              def handle_endtag(self, tag):
                  if tag.lower()=='title':
                      self.in_title=False
              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)
                  if data.strip():
                      self.text.append(data.strip())

          def parse(path):
              raw=Path(path).read_text(errors='ignore')
              p=AuditParser()
              p.feed(raw)
              return {
                  'title':re.sub(r'\s+',' ',' '.join(p.title)).strip(),
                  'description':p.description,
                  'canonical':p.canonical,
                  'noindex':p.noindex or 'noindex' in raw.lower(),
                  'related_topic':p.related[0] if p.related else None,
                  'hub_link':p.hub_link,
                  'text':' '.join(p.text),
                  'hrefs':p.hrefs,
                  'raw':raw,
              }

          pages={
              'pato-category':parse('/tmp/pato-category.html'),
              'duck-pillar':parse('/tmp/duck-pillar.html'),
              'duck-confit':parse('/tmp/duck-confit.html'),
              'blog-home':parse('/tmp/blog-home.html'),
              'source-link':parse('/tmp/source-link.html'),
          }

          serializable={k:{kk:vv for kk,vv in v.items() if kk not in ('raw','text','hrefs')} for k,v in pages.items()}
          serializable['pato-category']['hub_marker']='Guías para conocer, elegir y cocinar pato con criterio.' in pages['pato-category']['text']
          print(json.dumps(serializable,ensure_ascii=False,indent=2))
          Path('/tmp/duck-public-seo.json').write_text(json.dumps(serializable,ensure_ascii=False,indent=2))

          category=pages['pato-category']
          assert category['canonical']=='https://www.elmercadodeorigen.com/category/carnes/pato/', category['canonical']
          assert not category['noindex']
          for needle in [
              'Carne de pato y cortes',
              'Foie, paté, mousse y rillettes',
              'Magret de pato',
              'Confit de pato',
              'Jamón de pato',
              'Salsas, maridajes y menús',
          ]:
              assert needle in category['text'], needle
          assert any('carne-de-pato-guia-completa-cortes-sabor-preparacion' in h for h in category['hrefs'])

          pillar=pages['duck-pillar']
          assert pillar['title'].startswith('Carne de pato: cortes, sabor y cómo elegirla'), pillar['title']
          assert (pillar['description'] or '').startswith('Conoce los principales cortes de pato'), pillar['description']
          assert pillar['canonical']=='https://www.elmercadodeorigen.com/carne-de-pato-guia-completa-cortes-sabor-preparacion/', pillar['canonical']
          assert not pillar['noindex']
          assert pillar['related_topic']=='carne-cortes', pillar['related_topic']
          assert pillar['hub_link']

          confit=pages['duck-confit']
          assert confit['title'].startswith('Confit de pato crujiente: horno, grill y air fryer'), confit['title']
          assert (confit['description'] or '').startswith('Cómo dejar crujiente la piel'), confit['description']
          assert confit['canonical']=='https://www.elmercadodeorigen.com/como-preparar-confit-de-pato-al-horno-piel-crujiente/', confit['canonical']
          assert not confit['noindex']
          assert confit['related_topic']=='confit', confit['related_topic']
          assert 'Comparativa de métodos' not in (confit['description'] or '')

          blog=pages['blog-home']
          assert blog['canonical']=='https://www.elmercadodeorigen.com/blog/', blog['canonical']
          assert not blog['noindex']

          source=pages['source-link']
          assert any('productos-de-pato-para-regalar-foie-pates-jamon-lotes' in h for h in source['hrefs'])
          PY

      - name: Record SEO optimization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          jq -n             --arg generated_at "$(date -u +%FT%TZ)"             --arg run_id "$GITHUB_RUN_ID"             --arg source_sha "$GITHUB_SHA"             --slurpfile deployment /tmp/duck-seo-optimize.json             --slurpfile public /tmp/duck-public-seo.json             '{generated_at:$generated_at,run_id:($run_id|tonumber),source_sha:$source_sha,verified:true,batch:"20260930-duck-seo-refinement",deployment:$deployment[0],public_verification:$public[0]}'             > .deploy-status/duck-seo-global-20260928.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/duck-seo-global-20260928.json
          git commit -m 'Record duck SEO global optimization [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Audit product breadcrumb responsive geometry 20261021
on:
  pull_request:
    paths:
      - '.github/scripts/audit-product-breadcrumb-responsive-20261021.cjs'
      - '.github/workflows/audit-product-breadcrumb-responsive-20261021.yml'
      - 'mu-plugins/mdo-product-vendor-breadcrumb-20261021.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
      - name: Compare real product pages at 10 widths
        shell: bash
        run: |
          set -Eeuo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node .github/scripts/audit-product-breadcrumb-responsive-20261021.cjs

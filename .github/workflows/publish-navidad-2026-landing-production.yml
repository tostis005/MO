name: Publicar landing Navidad 2026 en produccion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-navidad-2026-landing-production.yml'
      - 'elmercadodeorigen-child/templates/navidad-2026-landing.php'
      - 'elmercadodeorigen-child/assets/css/navidad-2026.css'
      - 'elmercadodeorigen-child/inc/navidad-2026-campaign.php'
      - '.github/scripts/navidad-2026-layout-check.js'
      - 'elmercadodeorigen-child/inc/navidad-2026-promo.php'
      - 'elmercadodeorigen-child/assets/css/navidad-2026-promo.css'
      - '.github/scripts/navidad-2026-mu-loader.php'
      - '.github/scripts/navidad-2026-production-install.sh'
      - '.github/scripts/navidad-2026-sitewide-check.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar ficheros PHP y publicacion independiente
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/navidad-2026-campaign.php
          php -l elmercadodeorigen-child/templates/navidad-2026-landing.php
          php -l .github/scripts/navidad-2026-mu-loader.php
          php -l elmercadodeorigen-child/inc/navidad-2026-promo.php
          sh -n .github/scripts/navidad-2026-production-install.sh
          test -s elmercadodeorigen-child/assets/css/navidad-2026.css
          test -s elmercadodeorigen-child/assets/css/navidad-2026-promo.css
          grep -Fq 'Cestas de Navidad para empresas, empleados y clientes' elmercadodeorigen-child/templates/navidad-2026-landing.php

      - name: Instalar 4 ficheros sin sustituir el tema ni el SEO
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$STAGING_PASSWORD" && test -n "$STAGING_REMOTE_PATH"
          port="${STAGING_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$port" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          remote="/tmp/emdo-navidad-landing-$GITHUB_RUN_ID"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$port" "$STAGING_USER@$STAGING_HOST" "mkdir -p '$remote'"
          for file in elmercadodeorigen-child/inc/navidad-2026-campaign.php elmercadodeorigen-child/templates/navidad-2026-landing.php elmercadodeorigen-child/assets/css/navidad-2026.css .github/scripts/navidad-2026-mu-loader.php .github/scripts/navidad-2026-production-install.sh elmercadodeorigen-child/inc/navidad-2026-promo.php elmercadodeorigen-child/assets/css/navidad-2026-promo.css; do
            sshpass -e scp -P "$port" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "$file" "$STAGING_USER@$STAGING_HOST:$remote/"
          done
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$port" "$STAGING_USER@$STAGING_HOST" "sh '$remote/navidad-2026-production-install.sh' '$STAGING_REMOTE_PATH' '$remote'"

      - name: Verificar respuesta HTTP y formulario de la landing
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.elmercadodeorigen.com/cestas-navidad-empresas-2026/?verificar_navidad=$GITHUB_RUN_ID"
          status=000
          for n in 1 2 3 4; do
            status="$(curl -LsS --connect-timeout 12 --max-time 40 -A 'Mozilla/5.0 EMDO-landing-verify' -o /tmp/emdo-navidad.html -w '%{http_code}' "$url" || true)"
            if [ "$status" = 200 ] && grep -Fq 'Cestas de Navidad para empresas, empleados y clientes' /tmp/emdo-navidad.html; then break; fi
            sleep 4
          done
          echo "HTTP_STATUS=$status"
          test "$status" = 200
          grep -Fq 'Cestas de Navidad para empresas, empleados y clientes' /tmp/emdo-navidad.html
          grep -Fq 'emdo_navidad_2026_quote' /tmp/emdo-navidad.html
          grep -Fq 'Solicitar presupuesto' /tmp/emdo-navidad.html
          echo 'NAVIDAD_LANDING_PUBLICA_OK'

      - name: Probar todos los campos del formulario una sola vez
        if: contains(github.event.head_commit.message, 'test-full-cesta-form-20261013')
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          page="$base/cestas-navidad-empresas-2026/?test_completo=$GITHUB_RUN_ID"
          curl -LsS --connect-timeout 12 --max-time 45 -A 'Mozilla/5.0 EMDO-full-form-check' -c /tmp/navidad-cookie.txt -b /tmp/navidad-cookie.txt "$page" -o /tmp/navidad-complete-form.html
          for field in emdo_nombre emdo_email emdo_empresa emdo_telefono emdo_cantidad emdo_presupuesto emdo_fecha emdo_detalles emdo_privacidad; do
            grep -Fq "name=\"$field\"" /tmp/navidad-complete-form.html || { echo "FALTA_CAMPO=$field"; exit 1; }
          done
          nonce="$(grep -oE 'name="emdo_navidad_nonce" value="[a-zA-Z0-9]+"' /tmp/navidad-complete-form.html | head -n1 | sed -E 's/.*value="([^"]+)"/\1/' || true)"
          test -n "$nonce"
          # Enviar datos de prueba, claramente identificados para no crear pedidos falsos.
          http="$(curl -sS --connect-timeout 12 --max-time 50 \
            -c /tmp/navidad-cookie.txt -b /tmp/navidad-cookie.txt \
            -D /tmp/navidad-complete-headers.txt -o /tmp/navidad-complete-response.txt -w '%{http_code}' \
            --data-urlencode 'action=emdo_navidad_2026_quote' \
            --data-urlencode "emdo_navidad_nonce=$nonce" \
            --data-urlencode "emdo_nombre=PRUEBA TODOS LOS CAMPOS - $GITHUB_RUN_ID" \
            --data-urlencode 'emdo_email=pruebas-cestas@example.com' \
            --data-urlencode 'emdo_empresa=EMPRESA DE PRUEBA - NO PRESUPUESTAR' \
            --data-urlencode 'emdo_telefono=600 123 456' \
            --data-urlencode 'emdo_cantidad=23' \
            --data-urlencode 'emdo_presupuesto=150' \
            --data-urlencode 'emdo_fecha=Primera semana de diciembre de 2026' \
            --data-urlencode 'emdo_detalles=TEST TODOS LOS CAMPOS - Productos ibericos, aceite, queso y turron. Prueba tecnica; ignorar sin respuesta.' \
            --data-urlencode 'emdo_privacidad=1' \
            "$base/wp-admin/admin-post.php")"
          echo "FORMULARIO_COMPLETO_POST_HTTP=$http"
          test "$http" = 302
          grep -Eqi '^location: .*estado=enviada' /tmp/navidad-complete-headers.txt
          echo "SOLICITUD_COMPLETA_ACEPTADA_POR_WORDPRESS=SI"
          echo "Referencia de prueba: PRUEBA TODOS LOS CAMPOS - $GITHUB_RUN_ID"
          echo "Destinatario del modulo: hola@elmercadodeorigen.com"

      - name: Revisar solapamientos del formulario en seis anchuras
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME_PATH
          test -n "$CHROME_PATH"
          node .github/scripts/navidad-2026-layout-check.js

      - name: Verificar banners en portada tienda y artículos con navegador
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME_PATH
          test -n "$CHROME_PATH"
          node .github/scripts/navidad-2026-sitewide-check.js

      - name: Capturas del diseño para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-navidad-2026-${{ github.run_id }}
          path: |
            /tmp/navidad-2026-*.png
            /tmp/navidad-banner-*.png
          if-no-files-found: ignore
          retention-days: 7

name: Request 010197 filter final smoke v2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/request-010197-filter-final-smoke-v2.cjs'
      - '.github/workflows/request-010197-filter-final-smoke-v2.yml'
      - 'elmercadodeorigen-child/functions.php'
      - 'elmercadodeorigen-child/inc/catalog-filter-unification-010196.php'
      - 'elmercadodeorigen-child/inc/catalog-filter-final-010197.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-010197-filter-final-smoke-v2
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Validate smoke syntax
        run: node --check .github/scripts/request-010197-filter-final-smoke-v2.cjs
      - name: Review final filter system on staging
        run: node .github/scripts/request-010197-filter-final-smoke-v2.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-010197-filter-final-smoke-v2
          path: qa/
          retention-days: 14

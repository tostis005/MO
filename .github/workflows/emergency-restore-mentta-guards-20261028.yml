name: EMERGENCY Restore stable storefront Mentta guards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-mentta-guards-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emergency-storefront-rollback-20261028
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check original stable source versions
        run: |
          set -euo pipefail
          php -l mu-plugins/emdo-mentta-exclusive-products.php
          php -l mu-plugins/emdo-mentta-only-api-visibility-20261009.php
          grep -Fq 'Version: 1.0.0' mu-plugins/emdo-mentta-exclusive-products.php
          grep -Fq 'Version: 1.0.0' mu-plugins/emdo-mentta-only-api-visibility-20261009.php
          ! grep -Fq 'emdo_mentta_partner_view_products' mu-plugins/emdo-mentta-exclusive-products.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Restore production MU plugins atomically and clear cache
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          SITE="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${SITE:?cannot locate site}"
          RUN="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-exclusive-products.php "$TARGET:/tmp/emdo-rollback-guard-$RUN.php"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-only-api-visibility-20261009.php "$TARGET:/tmp/emdo-rollback-visibility-$RUN.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$SITE' '$RUN'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; RUN="$2"; FOLDER="$SITE/wp-content/mu-plugins"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          "$PHP_BIN" -l "/tmp/emdo-rollback-guard-$RUN.php"
          "$PHP_BIN" -l "/tmp/emdo-rollback-visibility-$RUN.php"
          cp -a "$FOLDER/emdo-mentta-exclusive-products.php" "$FOLDER/emdo-mentta-exclusive-products.php.before-stability-rollback-$RUN"
          cp -a "$FOLDER/emdo-mentta-only-api-visibility-20261009.php" "$FOLDER/emdo-mentta-only-api-visibility-20261009.php.before-stability-rollback-$RUN"
          install -m 0644 "/tmp/emdo-rollback-guard-$RUN.php" "$FOLDER/emdo-mentta-exclusive-products.php.tmp-$RUN"
          install -m 0644 "/tmp/emdo-rollback-visibility-$RUN.php" "$FOLDER/emdo-mentta-only-api-visibility-20261009.php.tmp-$RUN"
          mv -f "$FOLDER/emdo-mentta-exclusive-products.php.tmp-$RUN" "$FOLDER/emdo-mentta-exclusive-products.php"
          mv -f "$FOLDER/emdo-mentta-only-api-visibility-20261009.php.tmp-$RUN" "$FOLDER/emdo-mentta-only-api-visibility-20261009.php"
          rm -f "/tmp/emdo-rollback-guard-$RUN.php" "/tmp/emdo-rollback-visibility-$RUN.php"
          grep -Fq 'Version: 1.0.0' "$FOLDER/emdo-mentta-exclusive-products.php"
          grep -Fq 'Version: 1.0.0' "$FOLDER/emdo-mentta-only-api-visibility-20261009.php"
          WP_BIN="$(command -v wp)"
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval '
            if (function_exists("rocket_clean_domain")) rocket_clean_domain();
            if (class_exists("WC_Cache_Helper")) WC_Cache_Helper::get_transient_version("product",true);
            wp_cache_flush();
            echo "STABLE_GUARDS_RESTORED\n";
          ' --path="$SITE" --allow-root
          REMOTE
      - name: Check the public site without requesting heavy protected product pages
        run: |
          set +e
          for URL_PATH in / /tienda/ /producto/jamon-de-bellota-100-iberico/ /wp-json/; do
            STATUS="$(curl -sSL --connect-timeout 7 --max-time 22 -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com$URL_PATH")"
            RC=$?
            echo "HEALTH_PATH=$URL_PATH STATUS=$STATUS CURL_EXIT=$RC"
          done
          echo EMERGENCY_ROLLBACK_EXECUTED

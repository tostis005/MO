name: Apply approved featured images round 4 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-featured-images-round4-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify approved featured images
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
              esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"

          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-featured-round4-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 .github/scripts/apply-approved-featured-images-round4-20260828.php "$STAGING_USER@$STAGING_HOST:$REMOTE/apply.php"

          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/apply.php' --path='$PROD' --allow-root" > /tmp/featured-round4.json 2> /tmp/featured-round4.err
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo 'Featured image updater failed:' >&2
            cat /tmp/featured-round4.err >&2 || true
            cat /tmp/featured-round4.json >&2 || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
            exit "$RC"
          fi

          cat /tmp/featured-round4.json
          jq -e '.posts|length==4' /tmp/featured-round4.json >/dev/null
          jq -e '.posts|all(.thumbnail_id==.attachment_id and .approved_id==.attachment_id and .uses_default=="" and .cover_asset=="" and (.attachment_url|length)>0)' /tmp/featured-round4.json >/dev/null

          printf '[]' > /tmp/public-checks.json
          while IFS=$'\t' read -r slug permalink attachment_url; do
            out="/tmp/${slug}.html"
            code="$(curl -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO featured image verification' -o "$out" -w '%{http_code}' "${permalink}?emdo_featured_verify=${GITHUB_RUN_ID}")"
            [ "$code" = "200" ] || { echo "HTTP $code for $permalink" >&2; exit 20; }
            basename="$(basename "${attachment_url%%\?*}")"
            grep -Fq "$basename" "$out" || { echo "Featured image basename $basename not found at $permalink" >&2; exit 21; }
            jq --arg slug "$slug" --arg url "$permalink" --arg image "$attachment_url" --arg code "$code" '. + [{slug:$slug,url:$url,image:$image,http:($code|tonumber),image_present:true}]' /tmp/public-checks.json > /tmp/public-next.json
            mv /tmp/public-next.json /tmp/public-checks.json
          done < <(jq -r '.posts[] | [.slug,.permalink,.attachment_url] | @tsv' /tmp/featured-round4.json)
          jq -e 'length==4 and all(.http==200 and .image_present==true)' /tmp/public-checks.json >/dev/null

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'"

          mkdir -p .deploy-status
          jq -n \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            --slurpfile result /tmp/featured-round4.json \
            --slurpfile checks /tmp/public-checks.json \
            '{generated_at:$generated_at,run_id:($run_id|tonumber),source_sha:$source_sha,verified:true,selection:["2A","3A","4A","5C"],posts:$result[0].posts,public_checks:$checks[0]}' \
            > .deploy-status/featured-images-round4-20260828.json
          jq -e '.verified==true and (.posts|length)==4 and (.public_checks|length)==4' .deploy-status/featured-images-round4-20260828.json >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/featured-images-round4-20260828.json
          git commit -m 'Record verified featured images round 4 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

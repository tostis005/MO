name: Production English source export 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-english-source-export-20260816.yml'
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Export English metadata as base64 JSON
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          WP=$(command -v wp || true); PHP=$(command -v php || true)
          [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          "$PHP" -d memory_limit=768M "$WP" eval '
            $out=["posts"=>[],"term"=>[]];
            foreach([3,3025,3327,3794,3699,1056,1599,1350,1356,1363,3948,3979,4160,4199,5045,5336,5343,5348,8624] as $id){
              $p=get_post($id); if(!$p) continue;
              $out["posts"][(string)$id]=[
                "type"=>$p->post_type,"slug"=>$p->post_name,
                "title"=>(string)get_post_meta($id,"_en_US_post_title",true),
                "excerpt"=>(string)get_post_meta($id,"_en_US_post_excerpt",true),
                "content"=>(string)get_post_meta($id,"_en_US_post_content",true)
              ];
            }
            $out["term"]["16"]=["name"=>(string)get_term_meta(16,"_en_US_name",true),"slug"=>(string)get_term_meta(16,"_en_US_slug",true),"description"=>(string)get_term_meta(16,"_en_US_description",true)];
            file_put_contents("/tmp/mdo-en-source.json",wp_json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          ' --path="$ROOT" --allow-root 2>/dev/null
          echo 'MDO_SOURCE_B64_BEGIN'
          base64 -w0 /tmp/mdo-en-source.json
          echo
          echo 'MDO_SOURCE_B64_END'
          REMOTE

name: Production Home category parity 0.10.215

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-home-category-parity-010215.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      EXPECTED_VERSION: 0.10.215

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact release
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ELMERCADO_THEME_VERSION', '$EXPECTED_VERSION'" elmercadodeorigen-child/functions.php
          grep -Eq '^Version:[[:space:]]*0\.10\.215$' elmercadodeorigen-child/style.css
          grep -q 'home-category-edge-align-010215.php' elmercadodeorigen-child/functions.php
          bash -n .github/scripts/deploy-home-categories-010212.sh
          bash -n .github/scripts/rollback-home-categories-010212.sh
          php -l .github/scripts/home-category-parity-data-010215.php >/dev/null
          php -l .github/scripts/elmercado-opcache-reset.php >/dev/null
          php -l .github/scripts/elmercado-runtime-probe.php >/dev/null
          node --check .github/scripts/home-category-parity-010215-production-browser.cjs
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass jq google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup and deploy exact theme
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: bash .github/scripts/deploy-home-categories-010212.sh

      - name: Reset PHP-FPM and verify live runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          BASE="${PRODUCTION_SITEURL%/}"

          OPCACHE_PROBE="elmercado-opcache-${GITHUB_RUN_ID}-$(openssl rand -hex 8).php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PRODUCTION_WP_PATH/$OPCACHE_PROBE"
          OPCACHE_BODY="$(curl -fsSL --connect-timeout 15 --max-time 30 "$BASE/$OPCACHE_PROBE")"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PRODUCTION_WP_PATH/$OPCACHE_PROBE'"
          printf '%s\n' "$OPCACHE_BODY" | grep -q '^OPCACHE_RESET_OK$'

          RUNTIME_PROBE="elmercado-runtime-${GITHUB_RUN_ID}-$(openssl rand -hex 8).php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-runtime-probe.php "$STAGING_USER@$STAGING_HOST:$PRODUCTION_WP_PATH/$RUNTIME_PROBE"
          RUNTIME_BODY="$(curl -fsSL --connect-timeout 15 --max-time 60 "$BASE/$RUNTIME_PROBE")"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PRODUCTION_WP_PATH/$RUNTIME_PROBE'"
          printf '%s\n' "$RUNTIME_BODY"
          grep -q '^theme=0\.10\.215$' <<< "$RUNTIME_BODY"
          grep -q '^helper=1$' <<< "$RUNTIME_BODY"
          echo 'PRODUCTION_RUNTIME_010215_OK'

      - name: Generate public and administrator browser expectations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          REMOTE_DATA="/tmp/home-category-parity-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/home-category-parity-data-010215.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DATA"
          OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_DATA' --path='$PRODUCTION_WP_PATH' --allow-root; rm -f '$REMOTE_DATA'" )"
          ROWS_B64="$(printf '%s\n' "$OUT" | sed -n 's/^__ROWS__=//p' | tail -n1)"
          NAME_B64="$(printf '%s\n' "$OUT" | sed -n 's/^__COOKIE_NAME__=//p' | tail -n1)"
          VALUE_B64="$(printf '%s\n' "$OUT" | sed -n 's/^__COOKIE_VALUE__=//p' | tail -n1)"
          : "${ROWS_B64:?}"; : "${NAME_B64:?}"; : "${VALUE_B64:?}"
          ROWS="$(printf '%s' "$ROWS_B64" | base64 -d)"
          COOKIE_NAME="$(printf '%s' "$NAME_B64" | base64 -d)"
          COOKIE_VALUE="$(printf '%s' "$VALUE_B64" | base64 -d)"
          echo "::add-mask::$COOKIE_VALUE"
          echo "CATEGORY_PARITY_JSON=$ROWS" >> "$GITHUB_ENV"
          echo "ADMIN_COOKIE_NAME=$COOKIE_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_COOKIE_VALUE=$COOKIE_VALUE" >> "$GITHUB_ENV"
          echo "$ROWS" | jq .
          [ "$(jq -cS . <<< "$ROWS")" = "$(jq -cS . <<< "$COUNTS_JSON")" ]
          echo 'PRODUCTION_PARITY_DATA_010215_OK'

      - name: Warm and verify anonymous Home cache
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PRODUCTION_SITEURL%/}"
          curl -fsSL --connect-timeout 15 --max-time 90 -D /tmp/home-warm.headers -o /tmp/home-warm.html "$BASE/"
          curl -fsSL --connect-timeout 15 --max-time 60 -D /tmp/home-hit.headers -o /tmp/home-hit.html "$BASE/"
          tr -d '\r' < /tmp/home-hit.headers | grep -qi '^x-el-mercado-early-cache: HIT$'
          grep -q 'emo-category-card' /tmp/home-hit.html
          echo 'PRODUCTION_HOME_CACHE_010215_OK'

      - name: Verify production Home in real Chrome
        shell: bash
        run: node .github/scripts/home-category-parity-010215-production-browser.cjs

      - name: Finalize successful release
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$PREDEPLOY_OLD_PATH' '$REMOTE_TMP'"
          echo 'PRODUCTION_HOME_CATEGORY_PARITY_010215_OK'
          echo "Previous: $PREVIOUS_VERSION"
          echo "Current: $CURRENT_VERSION"
          echo "Backup: $BACKUP_NAME"

      - name: Automatic rollback on failure
        if: failure()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          if [ -n "${PRODUCTION_WP_PATH:-}" ] && [ -n "${PREDEPLOY_OLD_PATH:-}" ] && [ -n "${ROLLBACK_BACKUP_DIR:-}" ] && [ -n "${PRODUCTION_SITEURL:-}" ]; then
            bash .github/scripts/rollback-home-categories-010212.sh
          fi

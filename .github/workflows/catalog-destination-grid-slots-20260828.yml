name: Catalogue destination grid slots 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/zzzzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-destination-grid-slots-20260828.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only fix
        shell: bash
        run: |
          set -euo pipefail
          f='mu-plugins/zzzzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-destination-grid-slots-20260828.php'
          php -l "$f" >/dev/null
          ! grep -Eq '<script|MutationObserver|ResizeObserver|requestAnimationFrame|setInterval[[:space:]]*\(|setTimeout[[:space:]]*\(|pre_get_posts|woocommerce_product_query|WP_Query' "$f"

      - name: Deploy CSS-only fix
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          NAME='zzzzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-destination-grid-slots-20260828.php'
          TARGET="$PROD/wp-content/mu-plugins/$NAME"
          BACKUP="/tmp/$NAME.$GITHUB_RUN_ID.backup"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"; echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$TARGET'"; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BACKUP'"; echo EXISTED=1 >> "$GITHUB_ENV"
          else
            echo EXISTED=0 >> "$GITHUB_ENV"
          fi
          R="/tmp/$NAME.$GITHUB_RUN_ID"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$R"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$R' >/dev/null; install -m0644 '$R' '$TARGET'; rm -f '$R'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify destination icon row
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time, sys

          urls={
            'global':'https://www.elmercadodeorigen.com/tienda/',
            'producer':'https://www.elmercadodeorigen.com/tienda/1957/',
          }
          widths=[320,335,360,390,430,480,640,700,767,768,820,900,1024,1440,1920]
          errors=[]
          inspect='''() => {
            const vis=e=>!!e&&e.getClientRects().length>0&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';
            const d=Array.from(document.querySelectorAll('[data-mdo-destination-open],[data-mdo-ps-destination-open]')).find(vis)||null;
            const span=d?.querySelector(':scope > span')||null;
            const f=Array.from(document.querySelectorAll('form.woocommerce-ordering,.woocommerce-ordering')).find(e=>vis(e)&&e.querySelector('select[name="orderby"]'))||null;
            const s=f?.querySelector('select[name="orderby"]')||null;
            if(!d||!span||!f||!s) return null;
            const ds=getComputedStyle(d), ps=getComputedStyle(d,'::before'), as=getComputedStyle(d,'::after'), ss=getComputedStyle(span);
            const b=e=>{const r=e.getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height,cy:(r.top+r.bottom)/2}};
            return {
              d:b(d),span:b(span),f:b(f),s:b(s),
              display:ds.display, bg:ds.backgroundColor,
              pinArea:ps.gridArea,pinCol:ps.gridColumnStart,pinRow:ps.gridRowStart,pinAlign:ps.alignSelf,
              labelArea:ss.gridArea,labelCol:ss.gridColumnStart,labelRow:ss.gridRowStart,labelAlign:ss.alignSelf,
              arrowArea:as.gridArea,arrowCol:as.gridColumnStart,arrowRow:as.gridRowStart,arrowAlign:as.alignSelf,arrowJustify:as.justifySelf,
              arrowPos:as.position,arrowW:parseFloat(as.width||'0'),arrowH:parseFloat(as.height||'0'),arrowBg:as.backgroundImage,
              svgVisible:Array.from(d.querySelectorAll('svg')).filter(vis).length,
              overflow:document.documentElement.scrollWidth-innerWidth
            };
          }'''
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for w in widths:
              for kind,url in urls.items():
                page=browser.new_page(viewport={'width':w,'height':900})
                page.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','font','media') else r.continue_())
                page.goto(url,wait_until='domcontentloaded',timeout=30000)
                data=None
                for _ in range(40):
                  time.sleep(.2)
                  try:
                    data=page.evaluate(inspect)
                    if data: break
                  except Exception: pass
                tag=f'{kind} {w}'
                if not data:
                  errors.append(f'{tag}: controls unavailable'); page.close(); continue
                if data['display']!='grid': errors.append(f'{tag}: destination not grid ({data["display"]})')
                if data['bg']!='rgb(241, 246, 242)': errors.append(f'{tag}: destination bg {data["bg"]}')
                if data['pinCol']!='1' or data['pinRow']!='1': errors.append(f'{tag}: pin slot {data["pinCol"]}/{data["pinRow"]}')
                if data['labelCol']!='2' or data['labelRow']!='1': errors.append(f'{tag}: label slot {data["labelCol"]}/{data["labelRow"]}')
                if data['arrowCol']!='3' or data['arrowRow']!='1': errors.append(f'{tag}: arrow slot {data["arrowCol"]}/{data["arrowRow"]}')
                if data['arrowAlign']!='center' or data['arrowJustify']!='end': errors.append(f'{tag}: arrow alignment {data["arrowAlign"]}/{data["arrowJustify"]}')
                if data['arrowPos']!='static': errors.append(f'{tag}: arrow position {data["arrowPos"]}')
                if abs(data['arrowW']-12)>1.5 or abs(data['arrowH']-8)>1.5 or data['arrowBg']=='none': errors.append(f'{tag}: arrow malformed')
                if data['svgVisible']!=0: errors.append(f'{tag}: legacy SVG visible')
                if data['overflow']>1: errors.append(f'{tag}: overflow {data["overflow"]}')
                if w<=767:
                  if abs(data['d']['w']-data['s']['w'])>4: errors.append(f'{tag}: mobile widths differ {data["d"]["w"]}/{data["s"]["w"]}')
                  if abs(data['d']['h']-40)>2: errors.append(f'{tag}: mobile destination height {data["d"]["h"]}')
                page.close()
            browser.close()
          if errors:
            print('ERRORS:'); print('\n'.join('- '+e for e in errors)); sys.exit(1)
          print('CATALOG_DESTINATION_GRID_SLOTS_VERIFIED=true')
          print(f'checked={len(widths)*len(urls)} combinations')
          PY

      - name: Roll back on failure
        if: ${{ failure() && env.TARGET != '' }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "${EXISTED:-0}" = 1 ]; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$BACKUP' '$TARGET'; rm -f '$BACKUP'"
          else
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET' '$BACKUP'"
          fi

      - name: Remove backup
        if: ${{ success() && env.BACKUP != '' }}
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

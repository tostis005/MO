name: Accessories catalog development one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessories-catalog-development-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-supplier-sync-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate accessories release
        shell: bash
        run: |
          set -euo pipefail
          test -f mdo-supplier-sync/mdo-supplier-sync.php
          test -f mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -q "Version: 1.0.9" mdo-supplier-sync/mdo-supplier-sync.php
          grep -q "private const VERSION        = '1.0.2'" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve development WordPress path
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve development WordPress root.' >&2; exit 1; }
            wp_path="$(dirname "$cfg")"
          fi
          [ "$(basename "$wp_path")" = "$domain" ]
          printf '__WP_PATH__=%s\n' "$wp_path"
          REMOTE
          )"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n1)"
          : "${WP_PATH:?}"
          echo "DEV_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Deploy classify and verify development
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-accessories-dev-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/plugin'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/plugin/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$DEV_WP_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          wp_path="$1"; incoming="$2"; commit="$3"
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ]

          target="$wp_path/wp-content/plugins/mdo-supplier-sync"
          backup="$wp_path/wp-content/plugins/.mdo-supplier-sync.accessories-dev-${commit}"
          incoming_plugin="$incoming/plugin"
          rm -rf "$backup"
          [ ! -d "$target" ] || cp -a "$target" "$backup"
          rollback() {
            code=$?
            if [ "$code" -ne 0 ] && [ -d "$backup" ]; then
              echo 'Development accessories validation failed; restoring previous plugin files.' >&2
              rm -rf "$target"
              mv "$backup" "$target"
              "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$wp_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
            else
              rm -rf "$backup"
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          mkdir -p "$target"
          rsync -a --delete "$incoming_plugin/" "$target/"
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin activate mdo-supplier-sync --path="$wp_path" --allow-root >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$wp_path" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$wp_path" --skip-plugins --allow-root >/dev/null 2>&1 || true

          report="$("$php_bin" -d memory_limit=1024M "$wp_bin" eval 'echo wp_json_encode( MDO_Accessories_Catalog::migrate_catalog( true ), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );' --path="$wp_path" --allow-root)"
          printf 'Accessories development report: %s\n' "$report"
          accessories="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["accessories"]??0);')"
          jamoneros="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["jamoneros"]??0);')"
          cuchillos="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["cuchillos"]??0);')"
          errors="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo count((array)($d["errors"]??array()));')"
          [ "$accessories" -eq 2 ] && [ "$jamoneros" -eq 1 ] && [ "$cuchillos" -eq 1 ] && [ "$errors" -eq 0 ] || {
            echo "Unexpected development accessory counts: accessories=$accessories jamoneros=$jamoneros cuchillos=$cuchillos errors=$errors" >&2
            exit 1
          }

          verify="$(cat <<'PHP'
          $term=get_term_by('slug','accesorios','product_cat');
          if (!$term instanceof WP_Term) { fwrite(STDERR,"Accesorios missing\n"); exit(51); }
          $ids=get_objects_in_term((int)$term->term_id,'product_cat');
          if (is_wp_error($ids)) { fwrite(STDERR,$ids->get_error_message()."\n"); exit(52); }
          $ids=array_values(array_unique(array_map('intval',$ids))); sort($ids);
          $expected=array(4067,11403); sort($expected);
          if ($ids !== $expected) { fwrite(STDERR,"Unexpected Accesorios IDs: ".wp_json_encode($ids)."\n"); exit(53); }
          foreach (array(4067=>'Jamonero',11403=>'Cuchillo') as $id=>$type) {
            $types=wp_get_post_terms($id,'pa_tipo-producto',array('fields'=>'names'));
            if (is_wp_error($types) || $types !== array($type)) { fwrite(STDERR,"Wrong type for $id: ".wp_json_encode($types)."\n"); exit(54); }
          }
          echo 'ACCESSORIES_DEVELOPMENT_DATA_OK';
          PHP
          )"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$verify" --path="$wp_path" --allow-root | grep -q 'ACCESSORIES_DEVELOPMENT_DATA_OK'
          echo 'ACCESSORIES_DEVELOPMENT_QA=passed'
          rm -rf "$backup" "$incoming"
          trap - EXIT HUP INT TERM
          REMOTE
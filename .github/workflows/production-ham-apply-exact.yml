name: Apply exact Dev ham catalog to production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-ham-apply-exact.yml']
permissions:
  contents: read
concurrency:
  group: elmercado-production-ham-exact
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMAIN: elmercadodeorigen.com
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      PASS: ${{ secrets.STAGING_PASSWORD }}
      HINT: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Build Dev map
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/map.b64 <<'MAP'
          
          MAP
          python - <<'PY'
          import base64,zlib,json
          d=zlib.decompress(base64.b64decode(open('/tmp/map.b64').read().strip()));o=json.loads(d);assert o['n']==145 and len(o['i'])==145;open('/tmp/map.json','wb').write(d);print('map',len(o['i']))
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rsync sshpass
      - name: Configure SSH and resolve production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh; ssh-keyscan -T 15 -p "$P" -H "$HOST" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts; OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          OUT="$(sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$HINT' '$DOMAIN'" <<'REMOTE'
          set -eu
          hint="${1%/}"; target="$2"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1 || true)"; fi
          f="$(mktemp)";trap 'rm -f "$f"' EXIT;for b in "$(dirname "$hint")" "$HOME" /var/www/vhosts /var/www /home;do [ -d "$b" ]||continue;find "$b" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' 2>/dev/null>>"$f"||true;done
          while IFS= read -r c;do p="$(dirname "$c")";s="$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true)";n="$(printf '%s' "$s"|sed -E 's#^https?://##;s#^www\.##;s#/*$##')";if [ "$n" = "$target" ];then echo "__WP_PATH__=$p";break;fi;done<"$f"
          REMOTE
          )"; echo "$OUT"; WP_PATH="$(echo "$OUT"|sed -n 's/^__WP_PATH__=//p'|tail -n1)";: "${WP_PATH:?not resolved}";echo "WP_PATH=$WP_PATH">>"$GITHUB_ENV";REMOTE_MAP="/tmp/ham-exact-${GITHUB_SHA}.json";sshpass -e rsync -az -e "ssh $OPT" /tmp/map.json "$USER@$HOST:$REMOTE_MAP";echo "REMOTE_MAP=$REMOTE_MAP">>"$GITHUB_ENV"
      - name: Preflight and import two missing source products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}";OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1";wp="$(command -v wp)";php="$(command -v php||true)";if [ -z "$php" ];then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)";fi
          "$php" -d memory_limit=1024M "$wp" eval '
          global $wpdb;$file=WP_PLUGIN_DIR."/mdo-supplier-sync/mdo-supplier-sync.php";$version=is_file($file)?(get_file_data($file,["Version"=>"Version"])["Version"]??""):"";$active=in_array("mdo-supplier-sync/mdo-supplier-sync.php",(array)get_option("active_plugins",[]),true);if(!$active||$version!=="1.0.4"){throw new Exception("EMDO 1.0.4 no activo");}$st=$wpdb->prefix."mdo_source_products";$sup=$wpdb->prefix."mdo_suppliers";$targets=[["https://www.puenterobles.com/es/jamon-de-bellota-iberico-75-raza-iberica","puente-robles","164"],["https://www.elcatedratico.com/es/taco-de-jamon-reserva","el-catedratico","102"]];$out=[];foreach($targets as[$url,$code,$source_id]){$row=$wpdb->get_row($wpdb->prepare("SELECT sp.id,sp.status,sp.wc_product_id,sp.source_product_id,s.code,s.vendor_user_id FROM {$st} sp JOIN {$sup} s ON s.id=sp.supplier_id WHERE sp.source_url=%s",$url),ARRAY_A);if(!$row||$row["code"]!==$code||$row["source_product_id"]!==$source_id){throw new Exception("Fila origen inesperada: $url");}if(!empty($row["wc_product_id"])){$pid=(int)$row["wc_product_id"];}else{if($row["status"]!=="importing"){throw new Exception("Estado inesperado para $url: ".$row["status"]);}if(wc_get_product_id_by_sku($source_id)){throw new Exception("SKU ocupado: $source_id");}$pid=MDO_Woo_Importer::import_source_product((int)$row["id"]);}if(!$pid||get_post_type($pid)!=="product"||(int)get_post_field("post_author",$pid)!==(int)$row["vendor_user_id"]){throw new Exception("Importación inválida: $url");}$out[]=["source_url"=>$url,"product_id"=>$pid,"vendor"=>(int)$row["vendor_user_id"]];}echo wp_json_encode(["status"=>"completed","products"=>$out],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);' --path="$wp_path" --allow-root
          REMOTE
      - name: Run Dev pipeline and normalize exact terms
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}";OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH' '$REMOTE_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1";map="$2";wp="$(command -v wp)";php="$(command -v php||true)";if [ -z "$php" ];then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)";fi
          run(){ echo "$1: $("$php" -d memory_limit=1024M "$wp" eval "$2" --path="$wp_path" --allow-root)"; }
          run TAXONOMY 'echo wp_json_encode(MDO_Ham_Taxonomy::migrate_catalog(true),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run AUDIT 'echo wp_json_encode(MDO_Ham_Catalog_Audit::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run RESCUE 'echo wp_json_encode(MDO_Ham_Catalog_Rescue::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run FINAL 'echo wp_json_encode(MDO_Ham_Catalog_Final::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run PRECISION 'echo wp_json_encode(MDO_Ham_Catalog_Precision::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run TAGCLOSE '$ids=wc_get_products(["limit"=>-1,"return"=>"ids","status"=>["publish","private","draft","pending"]]);$n=0;foreach(array_map("intval",$ids) as$id){$p=wc_get_product($id);if($p instanceof WC_Product&&!$p->is_type("variation")&&get_post_meta($id,"_emdo_ham_precision_version",true)){MDO_Ham_Catalog_Tag_Closure::sync_saved_product($p);$n++;}}echo wp_json_encode(["synced"=>$n]);'
          script="$(mktemp --suffix=.php)";trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function resolve_row($r){global$wpdb;$st=$wpdb->prefix.'mdo_source_products';if(!empty($r['surl'])){$id=(int)$wpdb->get_var($wpdb->prepare("SELECT wc_product_id FROM {$st} WHERE source_url=%s AND wc_product_id>0 ORDER BY id DESC LIMIT 1",$r['surl']));if($id&&get_post_type($id)==='product')return$id;}if(!empty($r['slug'])){$p=get_page_by_path($r['slug'],OBJECT,'product');if($p)return(int)$p->ID;}return 0;}
          $m=json_decode(file_get_contents($args[0]),true);$cat=get_term_by('slug','jamones-paletas','product_cat');if(!$cat){$x=wp_insert_term('Jamones y paletas','product_cat',['slug'=>'jamones-paletas']);$cat=get_term((int)$x['term_id'],'product_cat');}$def=(int)get_option('default_product_cat',0);$n=0;$err=[];foreach($m['i'] as$r){$id=resolve_row($r);if(!$id){$err[]=['slug'=>$r['slug'],'e'=>'notfound'];continue;}$p=wc_get_product($id);$attrs=$p->get_attributes();$pos=count($attrs);$norm=['pa_tipo-pieza','pa_calidad','pa_raza-iberica','pa_alimentacion','pa_con-dop','pa_dop','pa_origen','pa_preparacion','pa_rango-peso','pa_curacion','pa_productor'];foreach($norm as$tax){$names=$r['a'][$tax]??[];$ids=[];foreach($names as$name){$t=term_exists($name,$tax);if(!$t)$t=wp_insert_term($name,$tax);if(is_wp_error($t)){throw new Exception($t->get_error_message());}$ids[]=(int)(is_array($t)?$t['term_id']:$t);}wp_set_object_terms($id,$ids,$tax,false);if($ids){$a=new WC_Product_Attribute();$a->set_id((int)wc_attribute_taxonomy_id_by_name($tax));$a->set_name($tax);$a->set_options($ids);$a->set_position($pos++);$a->set_visible(false);$a->set_variation(false);$attrs[$tax]=$a;}else unset($attrs[$tax]);}$p->set_attributes($attrs);$p->save();wp_set_object_terms($id,$r['t'],'product_tag',false);wp_set_object_terms($id,[(int)$cat->term_id],'product_cat',true);if($def&&$def!==(int)$cat->term_id&&has_term($def,'product_cat',$id))wp_remove_object_terms($id,$def,'product_cat');$snap=[];foreach(($r['a']??[])as$tax=>$names)$snap[preg_replace('/^pa_/','',$tax)]=$names;update_post_meta($id,'_emdo_ham_taxonomy_snapshot',wp_json_encode($snap,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));$n++;}echo wp_json_encode(['status'=>$err?'failed':'completed','normalized'=>$n,'errors'=>$err],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if($n!==145||$err)exit(4);
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" "$map" --path="$wp_path" --allow-root
          "$php" -d memory_limit=512M "$wp" cache flush --path="$wp_path" --allow-root||true
          REMOTE
      - name: Verify exact match to Dev
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}";OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH' '$REMOTE_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1";map="$2";wp="$(command -v wp)";php="$(command -v php||true)";if [ -z "$php" ];then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)";fi;script="$(mktemp --suffix=.php)";trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function rr($r){global$wpdb;$st=$wpdb->prefix.'mdo_source_products';if(!empty($r['surl'])){$id=(int)$wpdb->get_var($wpdb->prepare("SELECT wc_product_id FROM {$st} WHERE source_url=%s AND wc_product_id>0 ORDER BY id DESC LIMIT 1",$r['surl']));if($id&&get_post_type($id)==='product')return$id;}if(!empty($r['slug'])){$p=get_page_by_path($r['slug'],OBJECT,'product');if($p)return(int)$p->ID;}return 0;}$m=json_decode(file_get_contents($args[0]),true);$cat=get_term_by('slug','jamones-paletas','product_cat');$def=(int)get_option('default_product_cat',0);$errors=[];$checked=0;$cov=[];foreach($m['i']as$r){$id=rr($r);if(!$id){$errors[]=['slug'=>$r['slug'],'e'=>'notfound'];continue;}if(!$cat||!has_term((int)$cat->term_id,'product_cat',$id))$errors[]=['id'=>$id,'e'=>'category'];if($def&&has_term($def,'product_cat',$id))$errors[]=['id'=>$id,'e'=>'uncategorized'];foreach(['pa_tipo-pieza','pa_calidad','pa_raza-iberica','pa_alimentacion','pa_con-dop','pa_dop','pa_origen','pa_preparacion','pa_rango-peso','pa_curacion','pa_productor']as$tax){$a=wp_get_post_terms($id,$tax,['fields'=>'names']);$e=$r['a'][$tax]??[];sort($a,SORT_NATURAL|SORT_FLAG_CASE);sort($e,SORT_NATURAL|SORT_FLAG_CASE);if($a!==$e)$errors[]=['id'=>$id,'e'=>$tax,'actual'=>$a,'expected'=>$e];if($a)$cov[$tax]=($cov[$tax]??0)+1;}$a=wp_get_post_terms($id,'product_tag',['fields'=>'names']);$e=$r['t'];sort($a,SORT_NATURAL|SORT_FLAG_CASE);sort($e,SORT_NATURAL|SORT_FLAG_CASE);if($a!==$e)$errors[]=['id'=>$id,'e'=>'tags'];$checked++;}ksort($cov);echo wp_json_encode(['status'=>$errors?'failed':'completed','siteurl'=>get_option('siteurl'),'checked'=>$checked,'errors_count'=>count($errors),'coverage'=>$cov,'errors'=>array_slice($errors,0,20)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if($checked!==145||$errors)exit(5);
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" "$map" --path="$wp_path" --allow-root
          REMOTE
      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          if [ -n "${REMOTE_MAP:-}" ];then P="${PORT:-22}";OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P";sshpass -e ssh $OPT "$USER@$HOST" "rm -f -- '$REMOTE_MAP'";fi

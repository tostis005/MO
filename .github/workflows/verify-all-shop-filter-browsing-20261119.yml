name: Verify real shopper filters across producers and categories 20261119
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-all-shop-filter-browsing-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Check matching-origin filter requests and unaffected checkout on live server
        shell: bash
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'python3 -' <<'PYREMOTE'
          import urllib.request,urllib.error,ssl,json,subprocess,os,time
          from datetime import datetime,timezone,timedelta
          from collections import Counter
          origin='https://www.elmercadodeorigen.com'
          base=[
           ('1957','/tienda/1957/'),
           ('Montjam','/tienda/montjam/'),
           ('Hidalgo','/tienda/hidalgo-de-la-jara/'),
           ('Isabel','/en/store/chocolates-artesanos-isabel/'),
           ('Hidalgo EN','/en/store/hidalgo-de-la-jara/'),
           ('jamones','/categoria-producto/jamones-paletas/'),
           ('chocolates','/categoria-producto/chocolates-artesanos/'),
           ('cured EN','/en/product-category/cured-meats/')]
          results=[]
          ctx=ssl._create_unverified_context()
          for name,path in base:
              url=origin+path+'?filter_calidad=emdo_probe'
              request=urllib.request.Request(url,headers={'Referer':origin+path,'User-Agent':'Mozilla/5.0 (EMDO shopper filter QA; compatible)'})
              opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),urllib.request.HTTPRedirectHandler())
              try:
                  with opener.open(request,timeout=12) as f:
                      code=f.status;body=f.read(11000).decode('utf8','replace')
                      ans={'name':name,'path':path,'code':code,'challenge':('Verificando acceso a los filtros' in body),'backend_hit':('wp-content' in body and 'woocommerce' in body),'final_url_path':f.url.split('.com',1)[-1][:120]}
              except urllib.error.HTTPError as e:ans={'name':name,'path':path,'code':e.code,'retry_after':e.headers.get('Retry-After')}
              except Exception as e:ans={'name':name,'path':path,'error':type(e).__name__}
              results.append(ans)
          print('LIVE_SHOPPER_FILTER_QA',json.dumps(results,ensure_ascii=False))
          for name,path in [('cart','/carrito/'),('checkout','/finalizar-compra/'),('product','/producto/paleta-de-bellota-100-iberico/')]:
              cmd=['curl','-ksS','--max-time','10','--retry','0','-A','Mozilla/5.0 (EMDO QA)','-o','/dev/null','-w','%{http_code} %{time_total}',origin+path]
              try:r=subprocess.run(cmd,capture_output=True,text=True,timeout=13);out=r.stdout.strip()
              except Exception as e:out=type(e).__name__
              print('UNAFFECTED_ROUTE_QA',name,path,out)
          # Counters from recent access logs: only public status statistics, no visitor IPs.
          p='/var/www/vhosts/system/elmercadodeorigen.com/logs/proxy_access_ssl_log'
          cut=datetime.now(timezone.utc)-timedelta(minutes=7)
          import re
          rx=re.compile(r'^\S+ \S+ \S+ \[([^]]+)\] "(\S+) ([^"]+?) HTTP/[^"]+" (\d{3}) ')
          counters=Counter()
          with open(p,'rb') as f:
              f.seek(max(0,os.stat(p).st_size-9000000))
              if f.tell():f.readline()
              for line in f:
                  m=rx.match(line.decode('utf8','replace'))
                  if not m:continue
                  ds,method,u,code=m.groups()
                  try:dt=datetime.strptime(ds,'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
                  except:continue
                  if dt<cut:continue
                  if u.startswith('/en/store/hidalgo-de-la-jara'):
                      kind='filtered' if '?' in u else 'clean'
                      counters[(kind,code)]+=1
          print('RECENT_SEVEN_MINUTE_HIDALGO',json.dumps([{'type':k[0],'status':k[1],'count':v} for k,v in counters.most_common(20)]))
          PYREMOTE

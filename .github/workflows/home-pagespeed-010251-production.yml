name: Home PageSpeed 0.10.251 production

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/functions.php'
      - 'elmercadodeorigen-child/inc/home-performance-second-pass-010147.php'
      - 'elmercadodeorigen-child/inc/home-inline-jquery-010148.php'
      - '.github/scripts/pagespeed-production-010251.php'
      - '.github/workflows/home-pagespeed-010251-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/functions.php
          php -l elmercadodeorigen-child/inc/home-performance-second-pass-010147.php
          php -l elmercadodeorigen-child/inc/home-inline-jquery-010148.php
          php -l .github/scripts/pagespeed-production-010251.php

      - name: Deploy guarded PageSpeed fixes
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_DIR="/tmp/elmercado-pagespeed-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR/inc' '$REMOTE_DIR/scripts'"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/functions.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/inc/home-performance-second-pass-010147.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/inc/home-performance-second-pass-010147.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/inc/home-inline-jquery-010148.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/inc/home-inline-jquery-010148.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/pagespeed-production-010251.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/scripts/pagespeed-production-010251.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME_PATH='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            test -d \"\$THEME_PATH/inc\"

            BACKUP_DIR=\"\$HOME/elmercado-pagespeed-backup-${GITHUB_RUN_ID}-\$(date +%Y%m%d%H%M%S)\"
            mkdir -p \"\$BACKUP_DIR/inc\"
            cp \"\$THEME_PATH/functions.php\" \"\$BACKUP_DIR/functions.php\"
            cp \"\$THEME_PATH/inc/home-performance-second-pass-010147.php\" \"\$BACKUP_DIR/inc/home-performance-second-pass-010147.php\"
            cp \"\$THEME_PATH/inc/home-inline-jquery-010148.php\" \"\$BACKUP_DIR/inc/home-inline-jquery-010148.php\"
            [ ! -f '$PROD_PATH/.htaccess' ] || cp '$PROD_PATH/.htaccess' \"\$BACKUP_DIR/.htaccess\"

            install -m 0644 '$REMOTE_DIR/functions.php' \"\$THEME_PATH/functions.php\"
            install -m 0644 '$REMOTE_DIR/inc/home-performance-second-pass-010147.php' \"\$THEME_PATH/inc/home-performance-second-pass-010147.php\"
            install -m 0644 '$REMOTE_DIR/inc/home-inline-jquery-010148.php' \"\$THEME_PATH/inc/home-inline-jquery-010148.php\"

            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)

            \"\$php_bin\" -l \"\$THEME_PATH/functions.php\"
            \"\$php_bin\" -l \"\$THEME_PATH/inc/home-performance-second-pass-010147.php\"
            \"\$php_bin\" -l \"\$THEME_PATH/inc/home-inline-jquery-010148.php\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_DIR/scripts/pagespeed-production-010251.php' --path='$PROD_PATH' --allow-root
            rm -rf '$REMOTE_DIR'
            printf 'Backup: %s\n' \"\$BACKUP_DIR\"
          "

      - name: Verify live delivery
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pagespeed-verification.txt

          echo '--- Static cache headers ---' | tee -a /tmp/pagespeed-verification.txt
          curl -fsSI --max-time 30 https://www.elmercadodeorigen.com/wp-content/uploads/2026/08/Tolecarnes-fondo.jpg | grep -Ei '^(HTTP/|cache-control:|expires:|age:)' | tee -a /tmp/pagespeed-verification.txt || true

          echo '--- Fresh Home response ---' | tee -a /tmp/pagespeed-verification.txt
          HOME_HTML="$(mktemp)"
          curl -fsS --compressed --max-time 45 -D /tmp/home-headers.txt https://www.elmercadodeorigen.com/ -o "$HOME_HTML"
          grep -Ei '^(HTTP/|x-el-mercado-cache:|cache-control:)' /tmp/home-headers.txt | tee -a /tmp/pagespeed-verification.txt || true
          printf 'HTML bytes: %s\n' "$(wc -c < "$HOME_HTML")" | tee -a /tmp/pagespeed-verification.txt

          echo '--- jQuery tags ---' | tee -a /tmp/pagespeed-verification.txt
          grep -oE '<script[^>]+src=[^>]+jquery[^>]*>' "$HOME_HTML" | head -n 5 | tee -a /tmp/pagespeed-verification.txt || true

          echo '--- PageSpeed image snippets ---' | tee -a /tmp/pagespeed-verification.txt
          python3 - "$HOME_HTML" <<'PY' | tee -a /tmp/pagespeed-verification.txt
          import pathlib, sys
          html = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          for needle in ('Tolecarnes-fondo.jpg', 'JAMON_ACT'):
              pos = html.find(needle)
              if pos < 0:
                  print(f'{needle}: not found')
                  continue
              start = max(0, html.rfind('<', 0, pos) - 250)
              end = min(len(html), html.find('>', pos) + 350)
              print(f'[{needle}]')
              print(html[start:end].replace('\n', ' ')[:1200])
          PY

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'deploy=%s\n' '${{ steps.deploy.outcome }}'
            printf 'verify=%s\n' '${{ steps.verify.outcome }}'
            printf 'recorded_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f /tmp/pagespeed-verification.txt ]; then
              cat /tmp/pagespeed-verification.txt
            fi
          } > runtime/home-pagespeed-010251.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-pagespeed-010251.txt
          git commit -m 'Record Home PageSpeed production verification' || exit 0
          git push origin HEAD:main

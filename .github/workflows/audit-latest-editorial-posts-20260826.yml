name: Audit latest editorial posts in production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-latest-editorial-posts-20260826.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query production WordPress
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp=$(command -v wp || true)
            php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 4
            "$php" -d memory_limit=512M "$wp" db query "SELECT p.ID,p.post_status,p.post_date,p.post_modified,p.post_name,REPLACE(REPLACE(p.post_title, CHAR(9), ' '), CHAR(10), ' ') AS title,COALESCE(b.meta_value,''),COALESCE(k.meta_value,'') FROM wp_posts p LEFT JOIN wp_postmeta b ON b.post_id=p.ID AND b.meta_key='_emdo_authority_batch' LEFT JOIN wp_postmeta k ON k.post_id=p.ID AND k.meta_key='_emdo_authority_key' WHERE p.post_type='post' AND p.post_status IN ('publish','draft','pending','future','private') ORDER BY p.ID DESC LIMIT 40;" --skip-column-names --path="$prod" --allow-root
          ' > /tmp/latest-posts.tsv
          mkdir -p .deploy-status
          {
            echo "audit_date=2026-08-26"
            echo "columns=id status post_date modified slug title authority_batch authority_key"
            cat /tmp/latest-posts.tsv
          } > .deploy-status/latest-editorial-posts-20260826.tsv
      - name: Record audit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .deploy-status/latest-editorial-posts-20260826.tsv
          git commit -m 'Record latest editorial posts audit [skip ci]' || exit 0
          git push

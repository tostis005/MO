name: Publish nutrition priority batch 41-45 production launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nutrition-priority-36-40-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nutrition-priority-41-45-production-launcher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify batch 41-45
        shell: bash
        run: bash .github/scripts/run-nutrition-priority-41-45-production.sh

# temporary registered launcher for nutrition roadmap batch 41-45: EVOO nutrition FAQs

name: Emergency contain Woo filter flood

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-contain-filter-flood-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Add temporary targeted filter guard and recycle PHP-FPM
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -euo pipefail
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            PROD_PATH=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
              esac
            done
            : "${PROD_PATH:?production path not found}"
            HT="$PROD_PATH/.htaccess"
            [ -f "$HT" ] || touch "$HT"
            cp -a "$HT" "$HT.emergency-filter-backup-20260831-$(date +%H%M%S)"

            python3 - "$HT" <<"PY"
from pathlib import Path
import sys
p=Path(sys.argv[1])
s=p.read_text(errors="replace")
start="# BEGIN EMDO EMERGENCY FILTER FLOOD 20260831"
end="# END EMDO EMERGENCY FILTER FLOOD 20260831"
if start in s and end in s:
    pre=s.split(start,1)[0]
    post=s.split(end,1)[1]
    s=pre+post.lstrip("\n")
block=r'''# BEGIN EMDO EMERGENCY FILTER FLOOD 20260831
# Temporary containment: reject expensive faceted-filter requests only on the
# paths currently under a distributed crawl. Base category/store pages remain live.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/(categoria-producto/jamones-paletas|en/product-category/(hams-and-shoulders|jamones-paletas)|tienda/hidalgo-de-la-jara|en/(store|tienda)/hidalgo-de-la-jara)/?$ [NC]
RewriteCond %{QUERY_STRING} (^|&)filter_[^=]+=[^&]* [NC]
RewriteRule ^ - [F,L]
</IfModule>
# END EMDO EMERGENCY FILTER FLOOD 20260831

'''
p.write_text(block+s)
PY

            echo "=== GUARD INSTALLED ==="
            head -n 14 "$HT"

            child=$(pgrep -f "php-fpm: pool elmercadodeorigen.com" | head -n1 || true)
            if [ -n "$child" ]; then
              master=$(ps -o ppid= -p "$child" | tr -d " ")
              unit=$(sed -n "s#.*system.slice/\([^/]*plesk-php[0-9][0-9]-fpm.service\).*#\1#p" /proc/$master/cgroup | head -n1)
            else
              unit=$(systemctl list-units --type=service --state=active --no-legend "plesk-php*-fpm.service" | awk "NR==1{print \$1}")
            fi
            case "$unit" in plesk-php*-fpm.service) ;; *) echo "Unexpected FPM unit: ${unit:-none}"; exit 4;; esac
            systemctl kill --kill-who=all -s KILL "$unit" 2>/dev/null || true
            sleep 1
            systemctl reset-failed "$unit" 2>/dev/null || true
            systemctl start "$unit"
            sleep 3

            echo "=== HEALTH ==="
            uptime
            home_code=$(curl -k -L -sS -o /tmp/home.html -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/ || true)
            base_code=$(curl -k -L -sS -o /tmp/base.html -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/ || true)
            filt_code=$(curl -k -L -sS -o /tmp/filter.html -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/?filter_alimentacion=bellota&filter_rango-peso=65-75-kg" || true)
            echo "HOME=$home_code BASE_CATEGORY=$base_code FILTERED=$filt_code"
            echo "HOME_BYTES=$(wc -c < /tmp/home.html 2>/dev/null || echo 0) BASE_BYTES=$(wc -c < /tmp/base.html 2>/dev/null || echo 0)"
            ps -eo pid,ppid,etime,%cpu,%mem,args --sort=-%cpu | grep -E "php-fpm: pool elmercadodeorigen.com|COMMAND" | head -n 25 || true
            [ "$home_code" = "200" ]
            [ "$base_code" = "200" ]
            [ "$filt_code" = "403" ]
          '

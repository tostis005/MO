name: Audit Google Business Profile review photo access 2026-10-26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-emdo-google-media-access-20261026.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Google Business Profile review media capability without exposing credentials
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" > /tmp/gbp-media-audit.json <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            $names = array(
              "direct_access_token" => array("MDO_GOOGLE_BUSINESS_ACCESS_TOKEN","mdo_google_business_access_token"),
              "client_id" => array("MDO_GOOGLE_BUSINESS_CLIENT_ID","mdo_google_business_client_id"),
              "client_secret" => array("MDO_GOOGLE_BUSINESS_CLIENT_SECRET","mdo_google_business_client_secret"),
              "refresh_token" => array("MDO_GOOGLE_BUSINESS_REFRESH_TOKEN","mdo_google_business_refresh_token"),
              "account_id" => array("MDO_GOOGLE_BUSINESS_ACCOUNT_ID","mdo_google_business_account_id"),
              "location_id" => array("MDO_GOOGLE_BUSINESS_LOCATION_ID","mdo_google_business_location_id"),
            );
            $availability = array();
            foreach ($names as $key=>$pair) {
              $availability[$key] = (defined($pair[0]) && trim((string) constant($pair[0])) !== "") || trim((string) get_option($pair[1],"")) !== "";
            }
            $report = array("checked_utc"=>gmdate("c"),"configured"=>$availability,"google_api"=>"not_attempted","review_count_checked"=>0,"review_media_items"=>0);
            if ($availability["direct_access_token"] || ($availability["client_id"] && $availability["client_secret"] && $availability["refresh_token"])) {
              try {
                $token_method = new ReflectionMethod("MDO_Reviews_Integration","google_access_token");
                $token = $token_method->invoke(null);
                if (is_wp_error($token)) {
                  $report["google_api"]="oauth_error:" . $token->get_error_code();
                } else {
                  $identity_method = new ReflectionMethod("MDO_Reviews_Integration","google_business_identity");
                  $identity = $identity_method->invoke(null,$token);
                  if (is_wp_error($identity)) {
                    $report["google_api"]="identity_error:" . $identity->get_error_code();
                  } else {
                    $account = rawurlencode((string)$identity["account_id"]);
                    $location = rawurlencode((string)$identity["location_id"]);
                    $page = "";
                    $report["google_api"]="ok";
                    for ($loop=0; $loop<10; $loop++) {
                      $url = "https://mybusiness.googleapis.com/v4/accounts/{$account}/locations/{$location}/reviews?pageSize=50";
                      if ($page !== "") $url .= "&pageToken=" . rawurlencode($page);
                      $response = wp_remote_get($url,array("headers"=>array("Authorization"=>"Bearer " . $token),"timeout"=>35));
                      if (is_wp_error($response)) { $report["google_api"]="http_error:" . $response->get_error_code(); break; }
                      $code=(int) wp_remote_retrieve_response_code($response);
                      if ($code !== 200) { $report["google_api"]="http_status:" . $code; break; }
                      $body=json_decode((string) wp_remote_retrieve_body($response),true);
                      if (!is_array($body)) { $report["google_api"]="invalid_json"; break; }
                      foreach ((array)($body["reviews"] ?? array()) as $review) {
                        $report["review_count_checked"]++;
                        $report["review_media_items"] += count((array)($review["reviewMediaItems"] ?? array()));
                      }
                      $page=(string)($body["nextPageToken"] ?? "");
                      if ($page === "") break;
                    }
                  }
                }
              } catch (Throwable $e) { $report["google_api"]="internal_error"; }
            }
            echo wp_json_encode($report);
          ' --path="$PROD_PATH" --allow-root
          REMOTE
          mkdir -p diagnostics
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/gbp-media-audit.json',encoding='utf-8'))
          print(json.dumps(r,ensure_ascii=False,indent=2))
          with open('diagnostics/emdo-google-business-review-media-access-20261026.json','w',encoding='utf-8') as f:
              json.dump(r,f,ensure_ascii=False,indent=2)
          PY
      - name: Save safe Google media capability audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/emdo-google-business-review-media-access-20261026.json
          git commit -m 'Record whether owned Google Business reviews expose photo attachments' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

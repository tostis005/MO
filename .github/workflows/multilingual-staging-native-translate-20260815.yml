name: Persist reviewed English translations on staging 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-native-translate-20260815.yml'
      - '.github/scripts/mdo-staging-native-table-init.php'
      - '.github/scripts/mdo-staging-native-translations.php'
      - '.github/data/native-translations-20260815/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed translation files
        run: |
          set -euo pipefail
          php -l .github/scripts/mdo-staging-native-table-init.php
          php -l .github/scripts/mdo-staging-native-translations.php
          for file in .github/data/native-translations-20260815/*.json; do
            python -m json.tool "$file" >/dev/null
            echo "valid $file"
          done
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Initialize and persist native translations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to find staging WordPress path}"
          REMOTE_DIR="/tmp/mdo-native-translations-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_DIR'; mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-native-table-init.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/mdo-staging-native-table-init.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-native-translations.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/mdo-staging-native-translations.php"
          for file in .github/data/native-translations-20260815/*.json; do
            sshpass -e scp $SCP_OPTIONS "$file" "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/$(basename "$file")"
          done
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp() { "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$WP_PATH" --allow-root "$@"; }
          siteurl="$(wp option get siteurl 2>/dev/null | tail -n1)"
          case "$siteurl" in https://dev.elmercadodeorigen.com*) ;; *) echo "Refusing non-staging: $siteurl" >&2; exit 2;; esac

          wp eval-file "$REMOTE_DIR/mdo-staging-native-table-init.php" 2>/dev/null
          wp eval-file "$REMOTE_DIR/mdo-staging-native-translations.php" 2>/dev/null

          prefix="$(wp db prefix)"
          table="${prefix}trp_dictionary_es_es_en_us"
          echo '=== native dictionary status counts ==='
          wp db query "SELECT status, COUNT(*) FROM \`${table}\` GROUP BY status ORDER BY status;" 2>/dev/null
          echo '=== key reviewed rows ==='
          wp db query "SELECT original, translated, status FROM \`${table}\` WHERE original IN ('Encuentra lo que buscas.','Una forma más directa de acercar productos y personas.','Política de privacidad','Aceite de oliva virgen extra 5L','¿Cómo se obtiene el aceite de oliva virgen extra?','Finalizar compra') ORDER BY original;" 2>/dev/null
          count="$(wp db query "SELECT COUNT(*) FROM \`${table}\` WHERE status = 2 AND translated IS NOT NULL AND translated <> '';" --skip-column-names 2>/dev/null | grep -E '^[0-9]+$' | tail -n1)"
          echo "Human-reviewed native rows: ${count:-0}"
          [ "${count:-0}" -gt 100 ]
          wp cache flush >/dev/null 2>&1 || true
          rm -rf "$WP_PATH/wp-content/mdo-page-cache" "$WP_PATH/wp-content/cache/mdo-page-cache" 2>/dev/null || true
          rm -rf "$REMOTE_DIR"
          REMOTE

name: Test direct Adsterra live rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-direct-live-test-20260926.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium requests
      - name: Test direct Adsterra creatives in real Chrome
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          import json,time,requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          BASE='https://www.elmercadodeorigen.com'
          JS=BASE+'/wp-content/themes/elmercadodeorigen-child/assets/js/adsterra-geo-010290.js?live=010310'
          PAGE=BASE+'/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&live=010310'

          deadline=time.time()+240
          while time.time()<deadline:
              try:
                  body=requests.get(JS,timeout=15,headers={'Cache-Control':'no-cache'}).text
              except Exception:
                  body=''
              if ("optionsScript.text" in body and "mount.appendChild(invokeScript)" in body
                  and "createElement('iframe')" not in body
                  and "pagead2.googlesyndication.com" not in body):
                  print('DIRECT_CONTROLLER_READY=1',flush=True)
                  break
              time.sleep(5)
          else:
              raise SystemExit('0.10.310 direct controller not available')

          def run(label,width,height):
              o=Options()
              o.page_load_strategy='none'
              for a in ('--no-sandbox','--disable-dev-shm-usage',f'--window-size={width},{height}','--lang=en-US'):
                  o.add_argument(a)
              o.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
              d=webdriver.Chrome(options=o)
              try:
                  d.execute_cdp_cmd('Network.enable',{})
                  d.execute_cdp_cmd('Network.setExtraHTTPHeaders',{'headers':{'X-Country-Code':'ZA'}})
                  d.get(PAGE+'&viewport='+label)

                  deadline=time.time()+25
                  while time.time()<deadline:
                      dbg=d.execute_script('return window.ElMercadoAdsterraGeoDebug||null')
                      if dbg and dbg.get('showAds') is True:
                          break
                      time.sleep(.25)
                  else:
                      snapshot=d.execute_script(r"""
                        return {
                          href:location.href,
                          title:document.title,
                          readyState:document.readyState,
                          debug:window.ElMercadoAdsterraGeoDebug||null,
                          controller:!!window.ElMercadoAdsterraGeo,
                          bodyHtml:document.body?document.body.innerHTML.slice(0,5000):''
                        };
                      """)
                      print(label.upper()+'_ELIGIBILITY_FAILURE='+json.dumps(snapshot,sort_keys=True),flush=True)
                      raise SystemExit(label+': eligibility did not resolve')

                  for ratio in (0,.15,.3,.5,.7,.85,1,0):
                      d.execute_script('window.scrollTo(0,Math.max(0,(document.documentElement.scrollHeight-window.innerHeight)*arguments[0]))',ratio)
                      time.sleep(.8)
                  time.sleep(15)

                  responses={}
                  requests_seen=[]
                  for item in d.get_log('performance'):
                      try: msg=json.loads(item['message'])['message']
                      except Exception: continue
                      if msg.get('method')=='Network.requestWillBeSent':
                          u=msg.get('params',{}).get('request',{}).get('url','')
                          if 'highrevenueformat.com' in u or 'profitableratecpmnetwork.com' in u:
                              requests_seen.append(u)
                      elif msg.get('method')=='Network.responseReceived':
                          resp=msg.get('params',{}).get('response',{})
                          u=resp.get('url','')
                          if 'highrevenueformat.com' in u or 'profitableratecpmnetwork.com' in u:
                              responses[u]={
                                'status':resp.get('status'),
                                'mime':resp.get('mimeType'),
                                'fromDiskCache':resp.get('fromDiskCache'),
                                'fromServiceWorker':resp.get('fromServiceWorker')
                              }

                  state=d.execute_script(r"""
                    return {
                      url: location.href,
                      title: document.title,
                      bodyChildren: document.body ? document.body.children.length : -1,
                      debug: window.ElMercadoAdsterraGeoDebug || null,
                      googleScripts:Array.from(document.scripts).map(s=>s.src||'').filter(u=>/googlesyndication|doubleclick/.test(u)),
                      googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length,
                      adsbygoogle:document.querySelectorAll('ins.adsbygoogle').length,
                      slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map(s=>{
                        const m=s.querySelector('.emo-adsterra-mount');
                        const descendants=m?Array.from(m.querySelectorAll('*')):[];
                        const creatives=descendants.filter(n=>{
                          if(['SCRIPT','STYLE'].includes(n.tagName)) return false;
                          if(n.id && n.id.startsWith('container-a83b8ce')) return false;
                          return ['IFRAME','IMG','VIDEO','OBJECT','EMBED','CANVAS','SVG','A'].includes(n.tagName)
                            || (n.children.length===0 && (n.textContent||'').trim().length>0);
                        });
                        return {
                          type:s.getAttribute('data-emo-adsterra-slot'),
                          hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                          visible:s.classList.contains('is-eligible'),
                          display:getComputedStyle(s).display,
                          h:Math.round(s.getBoundingClientRect().height),
                          mountHtml:m?m.innerHTML.slice(0,7000):'',
                          invokeScripts:m?Array.from(m.querySelectorAll('script[src]')).map(x=>x.src):[],
                          iframes:m?Array.from(m.querySelectorAll('iframe')).map(x=>({src:x.src,w:x.offsetWidth,h:x.offsetHeight})):[],
                          images:m?Array.from(m.querySelectorAll('img')).map(x=>({src:x.src,w:x.naturalWidth,h:x.naturalHeight})):[],
                          creativeCount:creatives.length
                        };
                      })
                    };
                  """)
                  browser=d.get_log('browser')
                  print(label.upper()+'_NETWORK='+json.dumps({'requests':sorted(set(requests_seen)),'responses':responses},sort_keys=True),flush=True)
                  print(label.upper()+'_STATE='+json.dumps(state,sort_keys=True),flush=True)
                  print(label.upper()+'_CONSOLE='+json.dumps(browser[-30:],sort_keys=True),flush=True)

                  if state['googleScripts'] or state['googleAutoPlaced'] or state['adsbygoogle']:
                      raise SystemExit(label+': Google detected')
                  if not requests_seen:
                      raise SystemExit(label+': no Adsterra requests')
              finally:
                  d.quit()

          run('desktop',1440,1000)
          run('mobile',390,844)
          print('ADSTERRA_DIRECT_LIVE_TEST=DONE',flush=True)
          PY

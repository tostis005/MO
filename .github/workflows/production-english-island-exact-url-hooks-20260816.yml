name: Production English island exact URL hooks 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-english-island-exact-url-hooks-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy final English visible URL layer
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path not found}"
          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-english-slug-router.php"
          test -f "$TARGET"
          cp -a "$TARGET" "$TARGET.bak-final-visible-$(date +%Y%m%d%H%M%S)"

          if ! grep -q 'MDO_ENGLISH_ISLAND_VISIBLE_ANCHOR_V2' "$TARGET"; then
          cat >> "$TARGET" <<'PHP'

          /* MDO_ENGLISH_ISLAND_VISIBLE_ANCHOR_V2 */
          add_action( 'template_redirect', static function (): void {
              if ( is_admin() || ! mdo_en_is_request() ) { return; }
              ob_start( static function ( string $html ): string {
                  $shop = mdo_en_root() . '/en/shop/';
                  return (string) preg_replace_callback( '/<a\b[^>]*>/i', static function ( array $m ) use ( $shop ): string {
                      $tag = $m[0];
                      $tag = preg_replace( '#href=("|\')https?://(?:www\.)?elmercadodeorigen\.com/en/tienda/\1#i', 'href="' . esc_url( $shop ) . '"', $tag );
                      $tag = preg_replace( '#href=("|\')/en/tienda/\1#i', 'href="' . esc_url( $shop ) . '"', $tag );
                      return (string) $tag;
                  }, $html );
              } );
          }, PHP_INT_MAX );
          PHP
          fi

          "$php_bin" -l "$TARGET"
          echo "router_sha256=$(sha256sum "$TARGET" | awk '{print $1}')"
          REMOTE

      - name: Verify visible English URLs and inspect live residual Spanish
        shell: bash
        run: |
          set -u
          failed=0
          stamp=$(date +%s%N)

          for p in \
            /en/ \
            /en/shop/ \
            /en/producers/ \
            /en/journal/ \
            /en/contact/ \
            /en/store/hidalgo-de-la-jara/ \
            /en/store/1957/ \
            /en/product/100-iberian-acorn-fed-ham-black-tag/ \
            /en/product/extra-virgin-olive-oil-5l/ \
            /en/product/100-iberian-acorn-fed-sobrasada/ \
            /en/product-category/oils/ \
            /en/extra-virgin-olive-oil/ \
            /en/iberian-ham/ \
            /en/oranges/ \
            /en/privacy-policy/; do
            code=$(curl -ksSL --max-time 35 -o /tmp/page.html -w '%{http_code}' "https://www.elmercadodeorigen.com${p}?mdo_final=$stamp" || true)
            echo "PAGE $p code=$code"
            [ "$code" = 200 ] || failed=1
            body=$(grep -oE '<body[^>]*class="[^"]*"' /tmp/page.html | head -n1 || true)
            printf '%s' "$body" | grep -q 'translatepress-en_US' || failed=1
            bad=$(grep -oE 'href="[^"]*/en/(tienda|producto|politica-de-cookies)/[^"]*"' /tmp/page.html | head -n 10 || true)
            if [ -n "$bad" ]; then echo "BAD_LINKS $p"; echo "$bad"; failed=1; fi
            spanish=$(grep -oiE '>([^<]*(añadir al carrito|pedido mínimo|importe mínimo|gastos de envío|política de privacidad|política de cookies|envíos en|elaborado|información nutricional|introducción|nuestros|nuestras|para pedidos|aceite de oliva virgen extra es|jamón procedente|paleta procedente)[^<]*)<' /tmp/page.html | head -n 12 || true)
            if [ -n "$spanish" ]; then echo "SPANISH_CANDIDATE $p"; echo "$spanish"; fi
          done

          # Cookie link must be English on English pages.
          curl -ksSL --max-time 35 "https://www.elmercadodeorigen.com/en/shop/?mdo_cookie=$stamp" -o /tmp/en-shop.html || failed=1
          en_cookie=$(grep -oE '<a[^>]+id="CONSTANT_OPEN_URL"[^>]*>' /tmp/en-shop.html | head -n1 || true)
          echo "EN_COOKIE=$en_cookie"
          printf '%s' "$en_cookie" | grep -q '/en/cookie-policy/' || failed=1

          # Spanish remains native.
          curl -ksSL --max-time 35 "https://www.elmercadodeorigen.com/tienda/?mdo_es=$stamp" -o /tmp/es.html || failed=1
          es_body=$(grep -oE '<body[^>]*class="[^"]*"' /tmp/es.html | head -n1 || true)
          es_cookie=$(grep -oE '<a[^>]+id="CONSTANT_OPEN_URL"[^>]*>' /tmp/es.html | head -n1 || true)
          echo "ES_BODY=$es_body"
          echo "ES_COOKIE=$es_cookie"
          printf '%s' "$es_body" | grep -q 'translatepress-es_ES' || failed=1
          printf '%s' "$es_body" | grep -q 'woocommerce-shop' || failed=1
          printf '%s' "$es_cookie" | grep -q '/politica-de-cookies/' || failed=1

          exit "$failed"

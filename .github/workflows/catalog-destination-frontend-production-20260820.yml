name: Catalog destination frontend production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-destination-frontend-production-20260820.yml'
      - 'mu-plugins/mdo-catalog-destination-frontend-20260820.php'
      - 'elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-catalog-destination-frontend-20260820.php >/dev/null
          php -l elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php >/dev/null
          grep -Fq "'recent_interest' => 0.00" mu-plugins/mdo-catalog-destination-frontend-20260820.php
          grep -Fq "array( '51', '52' )" mu-plugins/mdo-catalog-destination-frontend-20260820.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy destination frontend to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          MU_LOCAL='mu-plugins/mdo-catalog-destination-frontend-20260820.php'
          COUNT_LOCAL='elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php'
          MU_TMP="/tmp/mdo-catalog-destination-frontend-${GITHUB_RUN_ID}.php"
          COUNT_TMP="/tmp/catalog-visibility-counts-${GITHUB_RUN_ID}.php"
          MU_TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-catalog-destination-frontend-20260820.php"
          COUNT_TARGET="$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php"

          sshpass -e scp $SCP_OPTIONS "$MU_LOCAL" "$STAGING_USER@$STAGING_HOST:$MU_TMP"
          sshpass -e scp $SCP_OPTIONS "$COUNT_LOCAL" "$STAGING_USER@$STAGING_HOST:$COUNT_TMP"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp || true)
            [ -n \"\$php_bin\" ] && [ -n \"\$wp_bin\" ]
            \"\$php_bin\" -l '$MU_TMP' >/dev/null
            \"\$php_bin\" -l '$COUNT_TMP' >/dev/null
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            test -d '$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc'
            if [ -f '$MU_TARGET' ]; then cp -p '$MU_TARGET' '/tmp/mdo-catalog-destination-frontend-${GITHUB_RUN_ID}.backup.php'; fi
            cp -p '$COUNT_TARGET' '/tmp/catalog-visibility-counts-${GITHUB_RUN_ID}.backup.php'
            cp '$MU_TMP' '$MU_TARGET'
            cp '$COUNT_TMP' '$COUNT_TARGET'
            rm -f '$MU_TMP' '$COUNT_TMP'
            \"\$php_bin\" -l '$MU_TARGET' >/dev/null
            \"\$php_bin\" -l '$COUNT_TARGET' >/dev/null
            VERIFY=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '
              printf("EMDO=%s\\n", defined("MDO_SUPPLIER_SYNC_VERSION") ? MDO_SUPPLIER_SYNC_VERSION : "missing");
              printf("SHIPPING=%s\\n", class_exists("MDO_Shipping_Destinations") ? "yes" : "no");
              printf("RANKING=%s\\n", class_exists("MDO_Catalog_Ranking") ? "yes" : "no");
              printf("FRONTEND=%s\\n", class_exists("MDO_Catalog_Destination_Frontend") ? "yes" : "no");
            ' --path='$PROD_PATH' --allow-root)
            printf '%s\\n' \"\$VERIFY\"
            printf '%s\\n' \"\$VERIFY\" | grep -Fq 'EMDO=1.0.18'
            printf '%s\\n' \"\$VERIFY\" | grep -Fq 'SHIPPING=yes'
            printf '%s\\n' \"\$VERIFY\" | grep -Fq 'RANKING=yes'
            printf '%s\\n' \"\$VERIFY\" | grep -Fq 'FRONTEND=yes'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

      - name: Verify live selector and postcode rules
        shell: bash
        run: |
          set -euo pipefail
          SHOP="https://www.elmercadodeorigen.com/tienda/?mdo_destination_verify=${GITHUB_RUN_ID}"
          AJAX='https://www.elmercadodeorigen.com/wp-admin/admin-ajax.php'
          JAR=/tmp/mdo-destination-cookies.txt
          HTML=/tmp/mdo-destination-shop.html
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO destination verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -c "$JAR" -o "$HTML" "$SHOP"
          grep -Fq 'data-mdo-destination-control' "$HTML"
          grep -Fq 'data-mdo-destination-modal' "$HTML"
          grep -Fq 'Envío a' "$HTML"
          grep -Fq '>España<' "$HTML"

          NONCE="$(python3 - <<'PY'
          import re
          text=open('/tmp/mdo-destination-shop.html', encoding='utf-8', errors='ignore').read()
          m=re.search(r"nonce:\s*\"([A-Za-z0-9]+)\"", text)
          print(m.group(1) if m else '')
          PY
          )"
          : "${NONCE:?destination nonce not found}"

          test_blocked() {
            local postcode="$1"
            local out="/tmp/mdo-blocked-${postcode}.json"
            curl -sSL -A 'Mozilla/5.0 EMDO destination verifier' -b "$JAR" -c "$JAR" -X POST \
              --data-urlencode 'action=mdo_set_shipping_destination' \
              --data-urlencode "nonce=$NONCE" \
              --data-urlencode 'country=ES' \
              --data-urlencode "postcode=$postcode" \
              -o "$out" "$AJAX"
            python3 - "$out" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('success') is False, data
          message=str((data.get('data') or {}).get('message','')).lower()
          assert 'ceuta' in message and 'melilla' in message, data
          PY
          }
          test_blocked 51001
          test_blocked 52001

          VALID=/tmp/mdo-valid-postcode.json
          curl -fsSL -A 'Mozilla/5.0 EMDO destination verifier' -b "$JAR" -c "$JAR" -X POST \
            --data-urlencode 'action=mdo_set_shipping_destination' \
            --data-urlencode "nonce=$NONCE" \
            --data-urlencode 'country=ES' \
            --data-urlencode 'postcode=28001' \
            -o "$VALID" "$AJAX"
          python3 - "$VALID" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('success') is True, data
          payload=data.get('data') or {}
          assert payload.get('country') == 'ES', data
          assert payload.get('postcode') == '28001', data
          PY

          AFTER=/tmp/mdo-destination-after.html
          curl -fsSL --retry 3 -A 'Mozilla/5.0 EMDO destination verifier' -b "$JAR" -H 'Cache-Control: no-cache, no-store' -o "$AFTER" "${SHOP}&after=28001"
          grep -Fq '28001' "$AFTER"
          grep -Fq 'data-mdo-destination-control' "$AFTER"

name: EMDO Selection badge production closeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-destination-frontend-production-20260820.yml'
      - 'mu-plugins/mdo-emdo-selection-badge-20260820.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emdo-selection-badge-production-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy and verify badge
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-emdo-selection-badge-20260820.php >/dev/null
          grep -Fq 'MDO_Catalog_Ranking::get_priority' mu-plugins/mdo-emdo-selection-badge-20260820.php
          grep -Fq 'Selección EMDO' mu-plugins/mdo-emdo-selection-badge-20260820.php
          grep -Fq 'EMDO Selection' mu-plugins/mdo-emdo-selection-badge-20260820.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          LOCAL='mu-plugins/mdo-emdo-selection-badge-20260820.php'
          TMP="/tmp/mdo-emdo-selection-badge-${GITHUB_RUN_ID}.php"
          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-emdo-selection-badge-20260820.php"
          sshpass -e scp $SCP_OPTIONS "$LOCAL" "$STAGING_USER@$STAGING_HOST:$TMP"

          VERIFY="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp || true)
            [ -n \"\$php_bin\" ] && [ -n \"\$wp_bin\" ]
            \"\$php_bin\" -l '$TMP' >/dev/null
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            if [ -f '$TARGET' ]; then cp -p '$TARGET' '/tmp/mdo-emdo-selection-badge-${GITHUB_RUN_ID}.backup.php'; fi
            cp '$TMP' '$TARGET'
            rm -f '$TMP'
            \"\$php_bin\" -l '$TARGET' >/dev/null
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '
              if (!class_exists("MDO_Catalog_Ranking") || !class_exists("MDO_EMDO_Selection_Badge")) { exit(11); }
              echo "RANKING=yes\\nBADGE_CLASS=yes\\n";
              $ids = get_posts(array("post_type"=>"product","post_status"=>"publish","numberposts"=>1,"fields"=>"ids","meta_key"=>MDO_Catalog_Ranking::PRIORITY_META,"meta_value"=>"100"));
              printf("PRIORITY100_CANDIDATE=%d\\n", count($ids));
              if ($ids) {
                global $product;
                $product = wc_get_product((int) $ids[0]);
                printf("PRODUCT_ID=%d\\nPRIORITY=%d\\n", (int) $ids[0], MDO_Catalog_Ranking::get_priority((int) $ids[0]));
                $_SERVER["REQUEST_URI"] = "/tienda/";
                ob_start(); MDO_EMDO_Selection_Badge::render_badge(); $es = ob_get_clean();
                $_SERVER["REQUEST_URI"] = "/en/shop/";
                ob_start(); MDO_EMDO_Selection_Badge::render_badge(); $en = ob_get_clean();
                printf("BADGE_ES=%s\\n", false !== strpos($es, "Selección EMDO") ? "yes" : "no");
                printf("BADGE_EN=%s\\n", false !== strpos($en, "EMDO Selection") ? "yes" : "no");
                if (100 !== MDO_Catalog_Ranking::get_priority((int) $ids[0]) || false === strpos($es, "Selección EMDO") || false === strpos($en, "EMDO Selection")) { exit(12); }
              }
            ' --path='$PROD_PATH' --allow-root
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          ")"
          printf '%s\n' "$VERIFY" | tee /tmp/emdo-selection-cli.txt
          printf '%s\n' "$VERIFY" | grep -Fq 'RANKING=yes'
          printf '%s\n' "$VERIFY" | grep -Fq 'BADGE_CLASS=yes'

          HTML=/tmp/emdo-selection-shop.html
          curl -fsSL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 EMDO selection verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o "$HTML" "https://www.elmercadodeorigen.com/tienda/?emdo_selection_verify=${GITHUB_RUN_ID}"
          grep -Fq 'mdo-emdo-selection-badge-css' "$HTML"
          {
            echo 'live_css=yes'
            if grep -Fq 'mdo-emdo-selection-badge' "$HTML"; then echo 'live_badge_on_first_page=yes'; else echo 'live_badge_on_first_page=no'; fi
          } | tee /tmp/emdo-selection-live.txt

      - name: Record closeout status
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "stage=${DEPLOY_OUTCOME}"
            echo "feature=emdo_selection_badge"
            echo "priority_required=100"
            echo "spanish_label=Selección EMDO"
            echo "english_label=EMDO Selection"
            test -f /tmp/emdo-selection-cli.txt && cat /tmp/emdo-selection-cli.txt || true
            test -f /tmp/emdo-selection-live.txt && cat /tmp/emdo-selection-live.txt || true
          } > .deploy-status/emdo-selection-badge-20260820.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/emdo-selection-badge-20260820.txt
          git commit -m 'Record EMDO Selection badge closeout [skip ci]' || true
          for attempt in 1 2 3 4; do
            git push origin HEAD:main && break
            git pull --rebase origin main
            sleep 2
          done
          test "$DEPLOY_OUTCOME" = 'success'

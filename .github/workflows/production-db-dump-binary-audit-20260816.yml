name: Production DB dump binary audit 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-db-dump-binary-audit-20260816.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Find DB tools
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" '
            echo "PATH=$PATH"
            command -v mariadb-dump || true
            command -v mysqldump || true
            find /usr /usr/local /opt/plesk -type f \( -name mariadb-dump -o -name mysqldump \) -perm -111 2>/dev/null | head -n 50 || true
            command -v plesk || true
            plesk bin database --help 2>/dev/null | head -n 80 || true
          '

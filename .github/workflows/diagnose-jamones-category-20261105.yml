name: Diagnose duplicate Jamones category description HTML
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-jamones-category-20261105.yml', '.github/scripts/diagnose-jamones-category-20261105.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Identify DOM parents of repeated text
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-bs4 >/dev/null
          /usr/bin/python3 .github/scripts/diagnose-jamones-category-20261105.py

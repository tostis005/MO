name: Editorial release acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-release-acceptance.yml'
      - 'elmercadodeorigen-child/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-editorial-release
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for editorial release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl -fsSL --max-time 25 "https://dev.elmercadodeorigen.com/?emo-editorial=${GITHUB_SHA}" -o /tmp/home.html \
              && curl -fsSL --max-time 25 "https://dev.elmercadodeorigen.com/blog/?emo-editorial=${GITHUB_SHA}" -o /tmp/blog.html \
              && grep -qi 'Productos con origen, directos de sus productores' /tmp/home.html \
              && grep -q 'Conocer el origen cambia la forma de elegir' /tmp/blog.html; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Verify public templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editorial-acceptance
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > acceptance.cjs <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');
          const base = 'https://dev.elmercadodeorigen.com';
          const suffix = `emo-editorial=${process.env.GITHUB_SHA}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function inspect(browser, path, name, mobile = false) {
            const page = await browser.newPage();
            await page.setViewport(mobile ? { width: 390, height: 844, isMobile: true } : { width: 1440, height: 1200 });
            if (mobile) await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148');
            await page.goto(`${base}${path}${path.includes('?') ? '&' : '?'}${suffix}`, { waitUntil: 'networkidle2', timeout: 90000 });
            await page.addStyleTag({ content: '#cookie-law-info-bar,#cookie-law-info-again,#ht-ctc-chat,.grecaptcha-badge{display:none!important}' });
            await page.evaluate(() => {
              window.emoVisible = (node) => {
                if (!node) return false;
                const style = getComputedStyle(node);
                const rect = node.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0 && rect.width > 0 && rect.height > 0;
              };
            });
            await sleep(800);
            await page.screenshot({ path: `editorial-acceptance/${name}`, fullPage: true });
            return page;
          }

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox'] });
            const report = {};
            const failures = [];
            let page;

            page = await inspect(browser, '/', 'home-desktop.png');
            report.home = await page.evaluate(() => ({
              copy: document.querySelector('.emo-hero .emo-kicker')?.innerText || '',
              oldCopy: /Aceites, jamones, paletas ibéricas y naranjas|Aceite, ibéricos y fruta/i.test(document.querySelector('.emo-home')?.innerText || ''),
              story: emoVisible(document.querySelector('.emo-story__grid')),
              producerCta: emoVisible(document.querySelector('.emo-vendor-cta__inner')),
              footer: emoVisible(document.querySelector('.site-footer')),
              storyVisibility: getComputedStyle(document.querySelector('.emo-story')).contentVisibility,
              vendorVisibility: getComputedStyle(document.querySelector('.emo-vendor-cta')).contentVisibility,
              externalEditorialCss: [...document.querySelectorAll('link[rel="stylesheet"]')].filter((link) => /editorial(?:-finish)?\.css/.test(link.href)).length
            }));
            await page.close();

            page = await inspect(browser, '/blog/', 'blog-desktop.png');
            report.blog = await page.evaluate(() => ({
              h1: document.querySelector('.emo-journal-hero h1')?.innerText || '',
              cards: document.querySelectorAll('.emo-article-card').length,
              featured: document.querySelectorAll('.emo-article-card--featured').length,
              sidebar: [...document.querySelectorAll('#secondary,.widget-area,.sidebar')].some(emoVisible)
            }));
            await page.close();

            page = await inspect(browser, '/naranjas/', 'article-desktop.png');
            report.article = await page.evaluate(() => ({
              hero: emoVisible(document.querySelector('.emo-article-hero')),
              content: emoVisible(document.querySelector('.emo-article-content')),
              width: Math.round(document.querySelector('.emo-article-content')?.getBoundingClientRect().width || 0),
              sidebar: [...document.querySelectorAll('#secondary,.widget-area,.sidebar')].some(emoVisible),
              comments: [...document.querySelectorAll('#comments,.comments-area,.comment-respond')].some(emoVisible)
            }));
            await page.close();

            for (const [path, name, selector] of [
              ['/quienes-somos/', 'about-desktop.png', '.emo-about-layout'],
              ['/contacto/', 'contact-desktop.png', '.emo-contact-layout'],
              ['/tienda/', 'shop-desktop.png', '.emo-shop-title-block'],
              ['/mi-cuenta/', 'account-desktop.png', 'form'],
              ['/carrito/', 'cart-desktop.png', '#primary,.site-main']
            ]) {
              page = await inspect(browser, path, name);
              report[name] = await page.evaluate((selector) => ({ visible: emoVisible(document.querySelector(selector)) }), selector);
              await page.close();
            }

            page = await inspect(browser, '/productores/', 'producers-desktop.png');
            report.producers = await page.evaluate(() => {
              const list = document.querySelector('#wcfmmp-stores-wrap ul.wcfmmp-store-wrap');
              const cards = [...document.querySelectorAll('#wcfmmp-stores-wrap li.wcfmmp-single-store')].filter(emoVisible);
              const tops = cards.map((card) => Math.round(card.getBoundingClientRect().top));
              return { intro: emoVisible(document.querySelector('.emo-producers-intro')), cards: cards.length, display: list ? getComputedStyle(list).display : '', tops };
            });
            await page.close();

            page = await inspect(browser, '/blog/', 'blog-mobile.png', true);
            report.mobile = await page.evaluate(() => ({ overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2, cards: document.querySelectorAll('.emo-article-card').length, sidebar: [...document.querySelectorAll('#secondary,.widget-area,.sidebar')].some(emoVisible) }));
            await page.close();

            const spread = report.producers.tops.length > 1 ? Math.max(...report.producers.tops) - Math.min(...report.producers.tops) : 0;
            const checks = [
              [report.home.copy.toLowerCase().includes('productos con origen') && !report.home.oldCopy, 'Homepage copy is not general enough.'],
              [report.home.story && report.home.producerCta && report.home.footer && report.home.storyVisibility === 'visible' && report.home.vendorVisibility === 'visible' && report.home.externalEditorialCss === 0, 'Homepage composition regressed.'],
              [report.blog.h1.trim() === 'Conocer el origen cambia la forma de elegir.' && report.blog.cards >= 3 && report.blog.featured === 1 && !report.blog.sidebar, 'Blog archive is incomplete.'],
              [report.article.hero && report.article.content && report.article.width >= 760 && !report.article.sidebar && !report.article.comments, 'Article layout is incomplete.'],
              [report['about-desktop.png'].visible && report['contact-desktop.png'].visible && report['shop-desktop.png'].visible, 'Editorial page layouts are incomplete.'],
              [report['account-desktop.png'].visible && report['cart-desktop.png'].visible, 'Transactional pages regressed.'],
              [report.producers.intro && report.producers.cards >= 1 && report.producers.display === 'grid' && spread <= 20, 'Producer cards are not aligned.'],
              [!report.mobile.overflow && !report.mobile.sidebar && report.mobile.cards >= 3, 'Mobile blog regressed.']
            ];
            for (const [ok, message] of checks) if (!ok) failures.push(message);

            fs.writeFileSync('editorial-acceptance/report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('editorial-acceptance/assertions.txt', failures.length ? failures.join('\n') : 'All editorial release assertions passed.\n');
            await browser.close();
            if (failures.length) throw new Error(failures.join('\n'));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node acceptance.cjs
          cat editorial-acceptance/report.json
          cat editorial-acceptance/assertions.txt

      - name: Upload editorial acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-release-acceptance
          path: editorial-acceptance/
          retention-days: 14

name: Editorial release acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-release-acceptance.yml'
      - 'elmercadodeorigen-child/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-editorial-release
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for editorial release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl -fsSL --max-time 25 "https://dev.elmercadodeorigen.com/?emo-editorial=${GITHUB_SHA}" -o /tmp/home.html \
              && curl -fsSL --max-time 25 "https://dev.elmercadodeorigen.com/blog/?emo-editorial=${GITHUB_SHA}" -o /tmp/blog.html \
              && grep -qi 'Productos con origen, directos de sus productores' /tmp/home.html \
              && grep -q 'Conocer el origen cambia la forma de elegir' /tmp/blog.html; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Verify all public templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editorial-acceptance
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > acceptance.cjs <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');
          const base = 'https://dev.elmercadodeorigen.com';
          const suffix = `emo-editorial=${process.env.GITHUB_SHA}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function open(browser, path, name, mobile = false) {
            const page = await browser.newPage();
            await page.setViewport(mobile
              ? { width: 390, height: 844, deviceScaleFactor: 1, isMobile: true }
              : { width: 1440, height: 1200, deviceScaleFactor: 1 });
            if (mobile) await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1');
            const joiner = path.includes('?') ? '&' : '?';
            await page.goto(`${base}${path}${joiner}${suffix}`, { waitUntil: 'networkidle2', timeout: 90000 });
            await page.addStyleTag({ content: '#cookie-law-info-bar,#cookie-law-info-again,#ht-ctc-chat,.grecaptcha-badge{display:none!important}' });
            await page.evaluate(() => {
              window.emoVisible = (node) => {
                if (!node) return false;
                const style = getComputedStyle(node);
                const rect = node.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0 && rect.width > 0 && rect.height > 0;
              };
            });
            await sleep(850);
            await page.screenshot({ path: `editorial-acceptance/${name}`, fullPage: true });
            return page;
          }

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox', '--disable-gpu'] });
            const report = {};
            const failures = [];

            let page = await open(browser, '/', 'home-desktop.png');
            report.home = await page.evaluate(() => ({
              kicker: document.querySelector('.emo-hero .emo-kicker')?.innerText?.trim() || '',
              categoryHeading: document.querySelector('.emo-categories h2')?.innerText?.trim() || '',
              oldConcreteCopy: /Aceites, jamones, paletas ibéricas y naranjas|Aceite, ibéricos y fruta/i.test(document.querySelector('.emo-home')?.innerText || ''),
              story: emoVisible(document.querySelector('.emo-story__grid')),
              producerCta: emoVisible(document.querySelector('.emo-vendor-cta__inner')),
              footer: emoVisible(document.querySelector('.site-footer')),
              storyContentVisibility: getComputedStyle(document.querySelector('.emo-story')).contentVisibility,
              vendorContentVisibility: getComputedStyle(document.querySelector('.emo-vendor-cta')).contentVisibility,
              externalEditorialCss: [...document.querySelectorAll('link[rel="stylesheet"]')].filter((link) => /editorial(?:-finish)?\.css/.test(link.href)).length
            }));
            await page.close();

            page = await open(browser, '/blog/', 'blog-desktop.png');
            report.blog = await page.evaluate(() => ({
              h1: document.querySelector('.emo-journal-hero h1')?.innerText?.trim() || '',
              cards: document.querySelectorAll('.emo-article-card').length,
              featured: document.querySelectorAll('.emo-article-card--featured').length,
              sidebar: [...document.querySelectorAll('#secondary,.widget-area,.sidebar')].some(emoVisible),
              listing: emoVisible(document.querySelector('.emo-journal-grid'))
            }));
            await page.close();

            page = await open(browser, '/naranjas/', 'article-desktop.png');
            report.article = await page.evaluate(() => ({
              hero: emoVisible(document.querySelector('.emo-article-hero')),
              content: emoVisible(document.querySelector('.emo-article-content')),
              contentWidth: Math.round(document.querySelector('.emo-article-content')?.getBoundingClientRect().width || 0),
              sidebar: [...document.querySelectorAll('#secondary,.widget-area,.sidebar')].some(emoVisible),
              comments: [...document.querySelectorAll('#comments,.comments-area,.comment-respond')].some(emoVisible),
              related: document.querySelectorAll('.emo-related-reading .emo-article-card').length
            }));
            await page.close();

            page = await open(browser, '/quienes-somos/', 'about-desktop.png');
            report.about = await page.evaluate(() => ({
              intro: emoVisible(document.querySelector('.emo-about-intro')),
              values: document.querySelectorAll('.emo-about-values article').length,
              story: emoVisible(document.querySelector('.emo-about-copy'))
            }));
            await page.close();

            page = await open(browser, '/contacto/', 'contact-desktop.png');
            report.contact = await page.evaluate(() => ({
              aside: emoVisible(document.querySelector('.emo-contact-aside')),
              form: emoVisible(document.querySelector('.emo-contact-form')),
              recaptcha: document.querySelectorAll('.grecaptcha-badge,script[src*="recaptcha"],script[src*="google.com/recaptcha"]').length
            }));
            await page.close();

            page = await open(browser, '/productores/', 'producers-desktop.png');
            report.producers = await page.evaluate(() => {
              const list = document.querySelector('#wcfmmp-stores-wrap ul.wcfmmp-store-wrap');
              const cards = [...document.querySelectorAll('#wcfmmp-stores-wrap li.wcfmmp-single-store')].filter(emoVisible);
              const rects = cards.map((card) => card.getBoundingClientRect());
              return {
                intro: emoVisible(document.querySelector('.emo-producers-intro')),
                cards: cards.length,
                display: list ? getComputedStyle(list).display : '',
                tops: rects.map((rect) => Math.round(rect.top)),
                widths: rects.map((rect) => Math.round(rect.width))
              };
            });
            await page.close();

            page = await open(browser, '/tienda/', 'shop-desktop.png');
            report.shop = await page.evaluate(() => ({
              h1: document.querySelector('.emo-shop-title-block h1')?.innerText?.trim() || '',
              title: emoVisible(document.querySelector('.emo-shop-title-block h1')),
              lead: emoVisible(document.querySelector('.emo-shop-lead')),
              products: document.querySelectorAll('ul.products li.product').length,
              filters: [...document.querySelectorAll('#toggle-sidebar-mobile-button,.filter-button,.woostify-filter-button,.toggle-sidebar-shop')].filter(emoVisible).length,
              wishlist: [...document.querySelectorAll('.yith-wcwl-add-to-wishlist,a.add_to_wishlist')].filter(emoVisible).length
            }));
            await page.close();

            page = await open(browser, '/mi-cuenta/', 'account-desktop.png');
            report.account = await page.evaluate(() => ({ form: [...document.querySelectorAll('form')].some(emoVisible), main: emoVisible(document.querySelector('#primary,.site-main')) }));
            await page.close();

            page = await open(browser, '/carrito/', 'cart-desktop.png');
            report.cart = await page.evaluate(() => ({
              main: emoVisible(document.querySelector('#primary,.site-main')),
              waitlist: [...document.querySelectorAll('.xoo-wl-form-wrapper,.xoo-wl-form,.xoo-wl-btn-container')].filter(emoVisible).length
            }));
            await page.close();

            page = await open(browser, '/blog/', 'blog-mobile.png', true);
            report.mobile = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2,
              cards: document.querySelectorAll('.emo-article-card').length,
              sidebar: [...document.querySelectorAll('#secondary,.widget-area,.sidebar')].some(emoVisible)
            }));
            await page.close();

            const topSpread = report.producers.tops.length > 1 ? Math.max(...report.producers.tops) - Math.min(...report.producers.tops) : 0;
            const checks = [
              [report.home.kicker.toLowerCase().includes('productos con origen') && !report.home.oldConcreteCopy, 'Homepage copy is not general enough.'],
              [report.home.story && report.home.producerCta && report.home.footer && report.home.storyContentVisibility === 'visible' && report.home.vendorContentVisibility === 'visible', 'Homepage lower sections are hidden or deferred.'],
              [report.home.externalEditorialCss === 0, 'Homepage editorial CSS is not inlined.'],
              [report.blog.h1 === 'Conocer el origen cambia la forma de elegir.' && report.blog.cards >= 3 && report.blog.featured === 1 && !report.blog.sidebar && report.blog.listing, 'Blog archive is incomplete.'],
              [report.article.hero && report.article.content && report.article.contentWidth >= 760 && !report.article.sidebar && !report.article.comments, 'Article layout is incomplete.'],
              [report.about.intro && report.about.values === 3 && report.about.story, 'About page is incomplete.'],
              [report.contact.aside && report.contact.form && report.contact.recaptcha === 0, 'Contact page is incomplete.'],
              [report.producers.intro && report.producers.cards >= 1 && report.producers.display === 'flex' && topSpread <= 20, 'Producer cards are not aligned.'],
              [report.shop.h1 === 'Productos' && report.shop.title && report.shop.lead && report.shop.products > 0 && report.shop.filters === 0 && report.shop.wishlist === 0, 'Shop cleanup is incomplete.'],
              [report.account.form && report.account.main && report.cart.main && report.cart.waitlist === 0, 'Transactional pages regressed.'],
              [!report.mobile.overflow && !report.mobile.sidebar && report.mobile.cards >= 3, 'Mobile blog regressed.']
            ];
            for (const [passed, message] of checks) if (!passed) failures.push(message);

            fs.writeFileSync('editorial-acceptance/report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('editorial-acceptance/assertions.txt', failures.length ? failures.join('\n') : 'All editorial release assertions passed.\n');
            await browser.close();
            if (failures.length) throw new Error(failures.join('\n'));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node acceptance.cjs
          cat editorial-acceptance/report.json
          cat editorial-acceptance/assertions.txt

      - name: Upload editorial acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-release-acceptance
          path: editorial-acceptance/
          retention-days: 14

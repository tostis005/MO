name: Configure EntreSetas vendor shipping from verified checkout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-entresetas-shipping-20261029.yml'
      - '.github/scripts/configure-entresetas-shipping-20261029.php'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: entre-setas-shipping-producer-only
  cancel-in-progress: false
jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set only EntreSetas zone shipping; preserve every other producer
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/configure-entresetas-shipping-20261029.php
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="$STAGING_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/en-shipping-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/configure-entresetas-shipping-20261029.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $SCRIPT" >/dev/null 2>&1 || true' EXIT
          remote_wp() {
            phase="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              wp_bin=\$(command -v wp)
              EN_SHIPPING_MODE='$phase' \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            "
          }
          remote_wp audit | tee /tmp/en-shipping-config.txt
          remote_wp apply | tee -a /tmp/en-shipping-config.txt
          remote_wp verify | tee -a /tmp/en-shipping-config.txt
          grep -q 'ENTRESETAS_SHIPPING_VERIFIED=' /tmp/en-shipping-config.txt
      - name: Save shipping audit and postcheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entresetas-wcfm-shipping
          path: /tmp/en-shipping-config.txt
          if-no-files-found: warn
          retention-days: 20

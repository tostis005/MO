name: Deploy Home WebP and TranslatePress lite 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-webp-trp-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-home-webp-trp-20260819
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Validate source
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-home-webp-delivery-20260819.php
          php -l mu-plugins/mdo-home-translatepress-lite-20260819.php
          php -l tools/generate-home-webp-20260819.php

      - name: Deploy and generate WebP
        id: deploy
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          for f in mdo-home-webp-delivery-20260819.php mdo-home-translatepress-lite-20260819.php; do
            sshpass -e scp $SCP "mu-plugins/$f" "$STAGING_USER@$STAGING_HOST:/tmp/$f"
          done
          sshpass -e scp $SCP tools/generate-home-webp-20260819.php "$STAGING_USER@$STAGING_HOST:/tmp/generate-home-webp-20260819.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            install -m 0644 /tmp/mdo-home-webp-delivery-20260819.php '$PROD_PATH/wp-content/mu-plugins/mdo-home-webp-delivery-20260819.php'
            install -m 0644 /tmp/mdo-home-translatepress-lite-20260819.php '$PROD_PATH/wp-content/mu-plugins/mdo-home-translatepress-lite-20260819.php'
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" \"\$wp_bin\" eval-file /tmp/generate-home-webp-20260819.php --path='$PROD_PATH' --allow-root > /tmp/webp-generation.txt 2>&1 || { cat /tmp/webp-generation.txt; exit 3; }
            cat /tmp/webp-generation.txt
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f /tmp/mdo-home-webp-delivery-20260819.php /tmp/mdo-home-translatepress-lite-20260819.php /tmp/generate-home-webp-20260819.php
          " | tee /tmp/deploy.txt
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          python3 - <<'PY'
          import re
          h=open('/tmp/home.html',encoding='utf-8',errors='ignore').read()
          d={
            'webp_refs':len(re.findall(r'/wp-content/uploads/[^\s"\'<>]+\.webp',h,re.I)),
            'trp_official':h.count('trp-language-switcher-js-v2-js'),
            'trp_lite':h.count('mdo-trp-language-switcher-lite-js'),
            'fixed_width':h.count('--switcher-width:118px'),
            'garrafa_webp':len(re.findall(r'Garrafa_5L-[^\s"\'<>]*\.webp',h,re.I)),
          }
          print(d)
          assert d['webp_refs'] >= 3, d
          assert d['trp_official'] == 0 and d['trp_lite'] >= 1 and d['fixed_width'] >= 1, d
          PY

      - name: Browser regression
        id: browser
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > /tmp/browser.json
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setViewport({width:412,height:915,deviceScaleFactor:1});
            await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle2',timeout:60000});
            const height=await p.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<height;y+=700){await p.evaluate(v=>scrollTo(0,v),y);await new Promise(r=>setTimeout(r,80));}
            await p.evaluate(()=>scrollTo(0,0)); await new Promise(r=>setTimeout(r,200));
            const switcher=await p.evaluate(async()=>{
              const root=document.querySelector('.trp-language-switcher');
              const trigger=root?.querySelector('.trp-language-item__current[role="button"]');
              const list=root?.querySelector('.trp-switcher-dropdown-list');
              if(!root||!trigger||!list)return {present:false};
              trigger.click(); await new Promise(r=>requestAnimationFrame(r));
              const opened=!list.hidden && trigger.getAttribute('aria-expanded')==='true' && !list.hasAttribute('inert');
              const href=list.querySelector('a')?.href||'';
              document.body.click(); await new Promise(r=>requestAnimationFrame(r));
              const closed=list.hidden && trigger.getAttribute('aria-expanded')==='false' && list.hasAttribute('inert');
              return {present:true,opened,closed,href,width:getComputedStyle(root).getPropertyValue('--switcher-width').trim()};
            });
            const images=await p.evaluate(()=>{
              const all=[...document.images];
              const webp=all.filter(i=>(i.currentSrc||i.src).includes('.webp'));
              const visible=webp.filter(i=>{const r=i.getBoundingClientRect();const s=getComputedStyle(i);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'});
              return {count:all.length,webp:webp.length,visibleWebp:visible.length,broken:visible.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src)};
            });
            console.log(JSON.stringify({switcher,images})); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat /tmp/browser.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/browser.json'))
          assert d['switcher']['present'] and d['switcher']['opened'] and d['switcher']['closed'],d
          assert d['switcher']['href'].endswith('/en/'),d
          assert d['images']['webp'] >= 3 and not d['images']['broken'],d
          PY

      - name: Lighthouse 3x
        id: lighthouse
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/lh-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet; done
          python3 - <<'PY' > runtime/home-webp-trp-20260819.txt
          import json,statistics,re
          print('browser=',open('/tmp/browser.json').read().strip())
          rows=[]
          for i in (1,2,3):
              a=json.load(open(f'/tmp/lh-{i}.json')); x=a['audits']; trp=jq=unat=0
              details=(x.get('forced-reflow-insight',{}).get('details') or {}).get('items',[])
              for group in details:
                  for z in group.get('items',[]):
                      src=z.get('source') or {}; u=(src.get('url') or src.get('value') or '') if isinstance(src,dict) else ''; t=z.get('reflowTime',0) or 0
                      if 'trp-frontend-language-switcher' in u: trp+=t
                      if '/jquery/jquery.min.js' in u: jq+=t
                      if 'unattributed' in u.lower(): unat+=t
              img=x.get('image-delivery-insight',{}).get('displayValue') or ''
              css=x.get('unused-css-rules',{}).get('displayValue') or ''
              r={'score':round(a['categories']['performance']['score']*100),'fcp':round(x['first-contentful-paint']['numericValue']),'lcp':round(x['largest-contentful-paint']['numericValue']),'tbt':round(x['total-blocking-time']['numericValue']),'cls':round(x['cumulative-layout-shift']['numericValue'],5),'trp_reflow':round(trp,3),'jquery_reflow':round(jq,3),'unattributed_reflow':round(unat,3),'mainthread':round(x['mainthread-work-breakdown']['numericValue']),'image_delivery':img,'unused_css':css}
              rows.append(r); print('run',i,r)
          for k in ['score','fcp','lcp','tbt','cls','trp_reflow','jquery_reflow','unattributed_reflow','mainthread']:
              print('median_'+k+'=',statistics.median(r[k] for r in rows))
          h=open('/tmp/home.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<style[^>]+id=["\']woostify-parent-style-inline-css["\'][^>]*>(.*?)</style>',h,re.S|re.I)
          print('woostify_inline_bytes=',len(m.group(1).encode()) if m else 0)
          print('woostify_external=',bool(re.search(r'/woostify/style\.css',h,re.I)))
          print('webp_refs=',len(re.findall(r'/wp-content/uploads/[^\s"\'<>]+\.webp',h,re.I)))
          PY
          cat runtime/home-webp-trp-20260819.txt

      - name: Record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-webp-trp-20260819.txt ] || printf 'deploy=%s\nbrowser=%s\nlighthouse=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.lighthouse.outcome }}' > runtime/home-webp-trp-20260819.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-webp-trp-20260819.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Home WebP and TranslatePress verification [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

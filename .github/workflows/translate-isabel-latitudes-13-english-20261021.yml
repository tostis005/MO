name: Complete 13 English product fiches Isabel Latitudes
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/translate-isabel-latitudes-13-english-20261021.php'
      - '.github/workflows/translate-isabel-latitudes-13-english-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isabel-latitudes-thirteen-english
  cancel-in-progress: false
jobs:
  thirteen-english-products:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate strictly scoped repair
        run: php -l .github/scripts/translate-isabel-latitudes-13-english-20261021.php
      - name: Preflight and publish thirteen reviewed chocolate and meat translations
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-thirteen-en-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/translate-isabel-latitudes-13-english-20261021.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_13_EN_MODE=audit '$PHP' -d memory_limit=512M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" | tee /tmp/emdo-thirteen-preflight.log
          sed -n 's/^EMDO_13_NATIVE_EN=//p' /tmp/emdo-thirteen-preflight.log | tail -n1 | jq -e '.complete==true and .matched==13 and (.skipped|length)==0' >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_13_EN_MODE=apply '$PHP' -d memory_limit=512M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" | tee /tmp/emdo-thirteen-en.log
          sed -n 's/^EMDO_13_NATIVE_EN=//p' /tmp/emdo-thirteen-en.log | tail -n1 | jq -e '.complete==true and .defined==13 and (.published+.already_complete)==13' >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          echo 'EMDO_THIRTEEN_ENGLISH_READY=VERIFIED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isabel-latitudes-thirteen-english-result
          path: /tmp/emdo-thirteen-en.log
          retention-days: 20
          if-no-files-found: warn

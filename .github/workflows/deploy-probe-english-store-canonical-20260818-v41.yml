name: Deploy probe English store canonical v41

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-probe-english-store-canonical-20260818-v41.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Marker
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/english-store-v41.txt
          git add runtime/english-store-v41.txt && git commit -m 'Start English store canonical v41' && git push
      - name: Deploy and probe from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-z-english-vendor-seo-010260.php
          php -l mu-plugins/mdo-zz-english-store-canonical-010261.php
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp=$(command -v wp); ph=$(command -v php || true); [ -n "$ph" ] || ph=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$ph" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf %s "$p";break;;esac;done')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP mu-plugins/mdo-z-english-vendor-seo-010260.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php"
          sshpass -e scp $SCP mu-plugins/mdo-zz-english-store-canonical-010261.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-zz-english-store-canonical-010261.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set +e
            out=/tmp/mdo-v41.txt; : >\"\$out\"
            for u in \
              https://www.elmercadodeorigen.com/en/store/1957/ \
              https://www.elmercadodeorigen.com/en/store/1957/about/ \
              https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/ \
              https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/about/; do
              echo \"=== \$u\" >>\"\$out\"
              rm -f /tmp/h /tmp/b
              curl -k -L --max-redirs 6 -sS --connect-timeout 8 --max-time 30 -D /tmp/h -o /tmp/b -w 'status=%{http_code} redirects=%{num_redirects} time=%{time_total} final=%{url_effective} bytes=%{size_download}\\n' \"\$u\" >>\"\$out\" 2>&1
              echo \"rc=\$?\" >>\"\$out\"
              grep -iE '^(HTTP/|location:|x-redirect-by:)' /tmp/h 2>/dev/null | tail -12 >>\"\$out\"
              if [ -f /tmp/b ]; then
                echo \"product_links=\$(grep -oE '/en/product/[^\\\" <]+' /tmp/b|sort -u|wc -l) policies=\$(grep -oiE '>[[:space:]]*Policies[[:space:]]*<' /tmp/b|wc -l) about_link=\$(grep -oE '/en/store/[^\\\" ]+/about/' /tmp/b|sort -u|wc -l) story=\$(grep -oi 'The story of' /tmp/b|wc -l) livestock=\$(grep -oi 'livestock farmers' /tmp/b|wc -l) spanish_hidalgo=\$(grep -oi 'Los ganaderos que integran' /tmp/b|wc -l)\" >>\"\$out\"
                grep -oE '<title>[^<]+' /tmp/b | head -1 >>\"\$out\"
              fi
            done
            cat \"\$out\"
          " > runtime/english-store-probe-v41.txt
      - name: Record report
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git pull --rebase
          printf 'run_id=%s\nstatus=complete\n' "$GITHUB_RUN_ID" > runtime/english-store-v41.txt
          git add runtime/english-store-v41.txt runtime/english-store-probe-v41.txt
          git commit -m 'Record English store canonical probe v41' || exit 0
          git push

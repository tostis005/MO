name: Producer toolbar photo fix production

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-photo-fix-production-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: php -l mu-plugins/zzzzzzz-mdo-producer-toolbar-final-geometry-20260821.php

      - name: Deploy and verify visual geometry
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          python -m pip install --quiet selenium
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/producer-toolbar-photo-fix-20260821.txt
          EXIT=.deploy-status/producer-toolbar-photo-fix-20260821.exit-code
          : > "$STATUS"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          PLUGIN="$PROD_PATH/wp-content/mu-plugins/zzzzzzz-mdo-producer-toolbar-final-geometry-20260821.php"
          BAK="/tmp/mdo-producer-toolbar-photo-fix-${GITHUB_RUN_ID}.bak"
          REMOTE="/tmp/mdo-producer-toolbar-photo-fix-${GITHUB_RUN_ID}.php"
          AUDIT="/tmp/mdo-producer-toolbar-photo-fix-audit-${GITHUB_RUN_ID}.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "[ ! -f '$PLUGIN' ] || cp '$PLUGIN' '$BAK'"
          rollback(){
            echo 'ROLLBACK producer toolbar photo fix' | tee -a "$STATUS"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
              if [ -f '$BAK' ]; then cp '$BAK' '$PLUGIN'; else rm -f '$PLUGIN'; fi
              rm -f '$REMOTE' '$AUDIT' '$BAK'
              wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            " || true
          }
          fail(){ echo "FAIL: $1" | tee -a "$STATUS"; rollback; echo 2 > "$EXIT"; exit 2; }

          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzzzz-mdo-producer-toolbar-final-geometry-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e scp $SCP_OPTIONS .github/scripts/verify-producer-store-safe-20260821.php "$STAGING_USER@$STAGING_HOST:$AUDIT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            cp '$REMOTE' '$PLUGIN'; rm -f '$REMOTE'
            wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$PLUGIN'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          " >> "$STATUS" 2>&1 || fail 'deploy/lint failed'

          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$AUDIT' --path='$PROD_PATH' --allow-root
          " >> "$STATUS" 2>&1
          AC=$?
          set -e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$AUDIT'" || true
          [ "$AC" = 0 ] || fail 'producer filtering/ranking audit failed'

          JSON="$(grep '^producer_store_safe_audit_ok ' "$STATUS" | tail -n1 | sed 's/^producer_store_safe_audit_ok //')"
          export MDO_SLUG="$(python -c 'import json,sys;print(json.loads(sys.argv[1])["sample_slug"])' "$JSON")"
          export MDO_RUN="$GITHUB_RUN_ID"

          for path in /tienda/ /productores/ "/tienda/$MDO_SLUG/" "/en/store/$MDO_SLUG/"; do
            code=$(curl -ksS -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com$path?photo=$GITHUB_RUN_ID")
            echo "HTTP $code $path" | tee -a "$STATUS"
            [ "$code" = 200 ] || fail "HTTP $code $path"
          done

          set +e
          python - <<'PY' >> "$STATUS" 2>&1
          import os,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='https://www.elmercadodeorigen.com'; slug=os.environ['MDO_SLUG']; run=os.environ['MDO_RUN']
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o)
          def rect(e): return d.execute_script('const r=arguments[0].getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom};',e)
          def css(e,p,pseudo=None): return d.execute_script('return getComputedStyle(arguments[0],arguments[2]||null)[arguments[1]]',e,p,pseudo)
          def seed(path,width):
              d.set_window_size(width,1000); d.get(base+'/?seed='+run)
              for n in ('mdo_shipping_country','mdo_shipping_postcode'):
                  try:d.delete_cookie(n)
                  except:pass
              d.add_cookie({'name':'mdo_shipping_country','value':'ES','domain':'www.elmercadodeorigen.com','path':'/'})
              d.add_cookie({'name':'mdo_shipping_postcode','value':'','domain':'www.elmercadodeorigen.com','path':'/'})
              d.get(base+path+('?photo='+run+f'-{width}')); time.sleep(2.5)
          def snap(path,width):
              seed(path,width); w=WebDriverWait(d,25)
              bar=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized.mdo-ps-toolbar-ready')))
              count=bar.find_element(By.CSS_SELECTOR,'.woocommerce-result-count'); dest=bar.find_element(By.CSS_SELECTOR,'.mdo-catalog-destination--canonical'); trig=dest.find_element(By.CSS_SELECTOR,'.mdo-catalog-destination__trigger'); label=trig.find_element(By.CSS_SELECTOR,'.mdo-catalog-destination__label'); order=bar.find_element(By.CSS_SELECTOR,'.woocommerce-ordering')
              products=d.find_elements(By.CSS_SELECTOR,'#wcfmmp-store ul.products li.product')
              s={'bar':rect(bar),'count':rect(count),'dest':rect(dest),'trig':rect(trig),'label':rect(label),'order':rect(order),'before':css(trig,'content','::before'),'grid':css(trig,'gridTemplateColumns'),'text':trig.text,'product':rect(products[0]) if products else None}
              print('PHOTO_SNAP',path,width,s)
              if width>640:
                  assert s['count']['right']+8 <= s['dest']['x'],s
                  assert s['dest']['w']>=140 and s['trig']['w']>=140,s
                  assert s['label']['right'] < s['trig']['right']-18,s
                  assert abs((s['count']['y']+s['count']['h']/2)-(s['dest']['y']+s['dest']['h']/2))<=3,s
                  assert 'max-content' in s['grid'] or s['trig']['w']>=140,s
              else:
                  assert 135<=s['bar']['h']<=145,s
                  assert s['dest']['w']>=s['bar']['w']-30,s
                  assert s['trig']['w']>=s['bar']['w']-30,s
              assert s['before'] in ('none','normal','""'),s
              if s['product']:
                  assert s['product']['y'] >= s['bar']['bottom']+14,(width,s)
              return s

          snap(f'/tienda/{slug}/',1440)
          snap(f'/tienda/{slug}/',900)
          snap(f'/tienda/{slug}/',390)
          en=snap(f'/en/store/{slug}/',900)
          assert 'Shipping to' in en['text'],en
          assert en['trig']['w']>=150,en
          d.quit()
          print('producer_toolbar_photo_geometry_ok')
          PY
          BC=$?
          set -e
          [ "$BC" = 0 ] || fail 'browser photo-geometry verification failed'

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BAK'" || true
          echo 'producer_toolbar_photo_fix_production_ok' | tee -a "$STATUS"
          echo 0 > "$EXIT"

      - name: Record result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-photo-fix-20260821.* || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record producer toolbar photo fix [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

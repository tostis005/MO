name: Diagnose crawler traffic 20260831

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crawlers-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
    steps:
      - name: Analyze current SSL crawler traffic
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          LOGDIR=/var/www/vhosts/system/elmercadodeorigen.com/logs
          LOG="$LOGDIR/access_ssl_log"
          [ -s "$LOG" ] || { echo "Missing/empty $LOG"; exit 2; }
          TMP=$(mktemp)
          tail -n 70000 "$LOG" > "$TMP"
          echo "LINES=$(wc -l < "$TMP") BYTES=$(wc -c < "$TMP")"

          echo "=== TOP IPS ALL ==="
          awk '{print $1}' "$TMP" | sort | uniq -c | sort -nr | head -n 30 || true

          echo "=== TOP USER AGENTS ALL ==="
          awk -F'"' 'NF>=6 {print $6}' "$TMP" | sort | uniq -c | sort -nr | head -n 35 || true

          FILT=$(mktemp)
          grep -Ei '[?&]filter_[^ =]*=' "$TMP" > "$FILT" || true
          echo "=== FILTER REQUEST COUNT ==="
          wc -l < "$FILT"

          echo "=== TOP IPS FILTER REQUESTS ==="
          awk '{print $1}' "$FILT" | sort | uniq -c | sort -nr | head -n 35 || true

          echo "=== TOP USER AGENTS FILTER REQUESTS ==="
          awk -F'"' 'NF>=6 {print $6}' "$FILT" | sort | uniq -c | sort -nr | head -n 35 || true

          echo "=== TOP FILTER PATHS (QUERY NORMALIZED AWAY) ==="
          awk -F'"' '{print $2}' "$FILT" | awk '{print $2}' | sed 's/?[^ ]*$//' | sort | uniq -c | sort -nr | head -n 35 || true

          echo "=== FILTER STATUS CODES ==="
          awk -F'"' '{print $3}' "$FILT" | awk '{print $1}' | sort | uniq -c | sort -nr || true

          echo "=== RECENT FILTER REQUEST SAMPLE ==="
          tail -n 80 "$FILT" | awk -F'"' '{split($1,a," "); split($3,b," "); print a[1] " | " b[1] " | " $6 " | " $2}' || true

          echo "=== RECENT HEADLESS / BOT-LIKE SAMPLE ==="
          grep -Ei 'HeadlessChrome|bot|crawler|spider|scrapy|python|curl|wget|httpclient|menta' "$TMP" | tail -n 100 | awk -F'"' '{split($1,a," "); split($3,b," "); print a[1] " | " b[1] " | " $6 " | " $2}' || true

          echo "=== CURRENT LOAD ==="
          uptime
          ps -eo pid,etime,%cpu,%mem,args --sort=-%cpu | grep -E 'php-fpm: pool elmercadodeorigen.com|COMMAND' | head -n 25 || true
          rm -f "$TMP" "$FILT"
          REMOTE

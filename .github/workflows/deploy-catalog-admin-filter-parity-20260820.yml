name: Deploy catalog admin filter parity 2026-08-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-catalog-admin-filter-parity-20260820.yml'
      - 'mu-plugins/mdo-catalog-admin-filter-parity-20260820.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-catalog-admin-filter-parity-20260820.php >/dev/null
          php -l .github/scripts/catalog-admin-filter-diagnostic-20260820.php >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy and verify on production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-catalog-admin-filter-parity-20260820.php"
          REMOTE_DIAG="/tmp/catalog-admin-filter-postdeploy-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp '$TARGET' '$TARGET.bak-${GITHUB_RUN_ID}'; fi"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-catalog-admin-filter-parity-20260820.php "$STAGING_USER@$STAGING_HOST:$TARGET"
          sshpass -e scp $SCP_OPTIONS .github/scripts/catalog-admin-filter-diagnostic-20260820.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIAG"

          mkdir -p runtime
          {
            echo "DEPLOYED_TARGET=$TARGET"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$TARGET'"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'echo function_exists(\"mdo_catalog_admin_filter_restore_query_20260820\") ? \"ADMIN_PARITY_LOADED=1\\n\" : \"ADMIN_PARITY_LOADED=0\\n\";' --path='$PROD_PATH' --allow-root"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_DIAG' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_DIAG'; exit \$rc"
          } 2>&1 | tee runtime/catalog-admin-filter-postdeploy-20260820.txt

          grep -q 'ADMIN_PARITY_LOADED=1' runtime/catalog-admin-filter-postdeploy-20260820.txt
          grep -q 'VENDOR_NO_PRODUCTS=0' runtime/catalog-admin-filter-postdeploy-20260820.txt
          grep -Eq 'VENDOR_PAGE_IDS=[0-9]+' runtime/catalog-admin-filter-postdeploy-20260820.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/catalog-admin-filter-postdeploy-20260820.txt
          git commit -m 'Record admin catalog filter production verification [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

name: Deploy GSC commerce SEO 2026-09-29

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-gsc-commerce-seo-20260929.php'
      - '.github/workflows/gsc-commerce-seo-20260929-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        run: php -l mu-plugins/mdo-gsc-commerce-seo-20260929.php

      - name: Deploy commerce SEO MU plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          NAME='mdo-gsc-commerce-seo-20260929.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp=\$(command -v wp || true); php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php\" \"\$wp\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify commerce SERP copy live
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4
          ACEITES="https://www.elmercadodeorigen.com/categoria-producto/aceites/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          SOB="https://www.elmercadodeorigen.com/producto/sobrasada-de-bellota-100-iberica/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          AGUJA="https://www.elmercadodeorigen.com/producto/filetes-aguja-de-ternera/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          PITO="https://www.elmercadodeorigen.com/producto/pito-de-vacuno-fileteado/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          JAMON="https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          JAMON50="https://www.elmercadodeorigen.com/producto/jamon-de-bellota-50-iberico-brida-roja/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          ENTRECOTE="https://www.elmercadodeorigen.com/en/product/mature-beef-entrecote/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          PADRON="https://www.elmercadodeorigen.com/en/product/padron-peppers-kg/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          JAMON_CEBO50="https://www.elmercadodeorigen.com/producto/jamon-cebo-de-campo-iberico-50-montjam/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          TENDERLOIN="https://www.elmercadodeorigen.com/en/product/beef-tenderloin/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          EVOO15="https://www.elmercadodeorigen.com/en/product/extra-virgin-olive-oil-15-x-1l/?mdo_commerce_verify=${GITHUB_RUN_ID}"
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$ACEITES" -o /tmp/aceites.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$SOB" -o /tmp/sob.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$AGUJA" -o /tmp/aguja.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$PITO" -o /tmp/pito.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$JAMON" -o /tmp/jamon.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$JAMON50" -o /tmp/jamon50.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$ENTRECOTE" -o /tmp/entrecote.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$PADRON" -o /tmp/padron.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$JAMON_CEBO50" -o /tmp/jamon-cebo50.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$TENDERLOIN" -o /tmp/tenderloin.html
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$EVOO15" -o /tmp/evoo15.html
          python - <<'PY'
          from bs4 import BeautifulSoup

          checks = [
              ('ACEITES','/tmp/aceites.html','Comprar Aceite de Oliva Virgen Extra | El Mercado de Origen','targeted','Compra aceite de oliva virgen extra directamente a productores seleccionados','/categoria-producto/aceites/'),
              ('SOB','/tmp/sob.html','Comprar Sobrasada de Bellota 100% Ibérica','targeted','Compra sobrasada de bellota 100% ibérica','/producto/sobrasada-de-bellota-100-iberica/'),
              ('AGUJA','/tmp/aguja.html','Filetes de Aguja de Ternera | 1 kg | Tolecarnes','targeted','Filetes de aguja de ternera jugosos','/producto/filetes-aguja-de-ternera/'),
              ('PITO','/tmp/pito.html','Comprar Pito de Vacuno Fileteado | Tolecarnes','targeted','Pito de vacuno fileteado','/producto/pito-de-vacuno-fileteado/'),
              ('JAMON','/tmp/jamon.html','Comprar Jamón de Bellota 100% Ibérico | Brida Negra','targeted','Jamón de bellota 100% ibérico de brida negra','/producto/jamon-de-bellota-100-iberico/'),
              ('JAMON50','/tmp/jamon50.html','Comprar Jamón de Bellota 50% Ibérico | Brida Roja','targeted','Jamón de bellota 50% ibérico de brida roja','/producto/jamon-de-bellota-50-iberico-brida-roja/'),
              ('ENTRECOTE','/tmp/entrecote.html','Buy Mature Beef Entrecôte | 20+ Day Aged Beef','reviewed-en','matured for more than 20 days','/en/product/mature-beef-entrecote/'),
              ('PADRON','/tmp/padron.html','Buy Fresh Padrón Peppers by the Kg','reviewed-en','padrón','/en/product/padron-peppers-kg/'),
              ('JAMON_CEBO50','/tmp/jamon-cebo50.html','Comprar Jamón de Cebo de Campo Ibérico 50% | Montjam','targeted','Jamón de cebo de campo ibérico 50% Montjam','/producto/jamon-cebo-de-campo-iberico-50-montjam/'),
              ('TENDERLOIN','/tmp/tenderloin.html','Buy Beef Tenderloin | Price per Kg | Tolecarnes','reviewed-en','tenderness','/en/product/beef-tenderloin/'),
              ('EVOO15','/tmp/evoo15.html','Buy Extra Virgin Olive Oil 15 × 1L | Free Shipping','reviewed-en','15 x 1 L','/en/product/extra-virgin-olive-oil-15-x-1l/'),
          ]

          for label, path, title_prefix, desc_mode, desc_signal, canonical_path in checks:
              soup = BeautifulSoup(open(path, encoding='utf-8').read(), 'html.parser')
              title = soup.title.get_text(' ', strip=True) if soup.title else ''
              meta = soup.find('meta', attrs={'name':'description'})
              desc = meta.get('content','').strip() if meta else ''
              canonical = soup.find('link', rel=lambda v: v and 'canonical' in v)
              canon = canonical.get('href','') if canonical else ''
              h1 = soup.find('h1')
              print(label, 'title=', title, 'description=', desc, 'canonical=', canon, 'h1=', h1.get_text(' ',strip=True) if h1 else '')
              assert title.startswith(title_prefix), f'{label}: targeted title missing: {title!r}'
              if desc_mode == 'targeted':
                  assert desc.startswith(desc_signal), f'{label}: targeted description missing: {desc!r}'
              else:
                  assert desc and desc_signal.lower() in desc.lower(), f'{label}: reviewed English description lost key intent: {desc!r}'
              assert canon.endswith(canonical_path), f'{label}: unexpected canonical: {canon!r}'
              assert h1 is not None, f'{label}: H1 missing'

          aceites = BeautifulSoup(open('/tmp/aceites.html', encoding='utf-8').read(), 'html.parser')
          editorial = aceites.select_one('.emdo-seo-category-description')
          assert editorial is not None, 'ACEITES: persisted category editorial description missing'
          editorial_text = editorial.get_text(' ', strip=True)
          print('ACEITES editorial_chars=', len(editorial_text))
          assert len(editorial_text) >= 200, 'ACEITES: category editorial description unexpectedly thin'
          PY

      - name: Verify HTTP consolidation and legacy alias
        shell: bash
        run: |
          set -u
          echo "HTTP_HOME"
          curl -sSI --max-redirs 0 'http://www.elmercadodeorigen.com/' | tr -d '\r' | sed -n '1,8p' || true
          echo "PADRON_LEGACY"
          PADRON_RESULT="$(curl -L --silent --show-error -o /dev/null -w 'status=%{http_code} final=%{url_effective}' 'https://www.elmercadodeorigen.com/en/product/bag-of-approximately-300-gr-padron-peppers/' || true)"
          echo "$PADRON_RESULT"
          case "$PADRON_RESULT" in
            *"status=200"*"final=https://www.elmercadodeorigen.com/en/product/padron-peppers-kg/"*) : ;;
            *) echo "Padrón legacy redirect not consolidated" >&2; exit 1 ;;
          esac
          echo "TOMAHAWK_LEGACY_DIAGNOSTIC"
          curl -L --silent --show-error -o /dev/null -w 'status=%{http_code} final=%{url_effective}\n' 'https://www.elmercadodeorigen.com/en/product/beef-tomahawk-steak/' || true

      - name: Roll back on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          NAME='mdo-gsc-commerce-seo-20260929.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Clean deployment backup
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          NAME='mdo-gsc-commerce-seo-20260929.php'
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

name: Home Hustle remove 0.10.262 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-hustle-remove-010262-production.yml'
  workflow_dispatch:

permissions:
  contents: write

# Production deployment + Lighthouse verification.
jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PHP
        run: php -l elmercadodeorigen-child/inc/performance.php
      - name: Deploy performance layer
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/performance.php "$STAGING_USER@$STAGING_HOST:/tmp/performance-010262.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            install -m 0644 /tmp/performance-010262.php \"\$THEME/inc/performance.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/performance.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f /tmp/performance-010262.php
          "
      - name: Verify Home without Hustle
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          {
            echo 'deploy=success'
            printf 'hustle_inline_html=%s\n' "$(grep -c 'hustle_inline_styles_front' /tmp/home.html || true)"
            printf 'hustle_assets_html=%s\n' "$(grep -c '/plugins/hustle/' /tmp/home.html || true)"
          } > /tmp/check.txt
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' >> /tmp/check.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(800);
            const state=await page.evaluate(()=>({
              hustleStyles:[...document.querySelectorAll('style,link')].filter(e=>/hustle/i.test((e.id||'')+' '+(e.getAttribute('href')||''))).length,
              hustleResources:performance.getEntriesByType('resource').filter(r=>/\/plugins\/hustle\//i.test(r.name)).length,
              hero:!!document.querySelector('.emo-hero__copy')
            }));
            console.log(JSON.stringify({errors,state},null,2));
            if(errors.length || state.hustleStyles || state.hustleResources || !state.hero) process.exitCode=2;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          export CHROME_PATH="$CHROME"
          npx --yes lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          python3 - <<'PY' >> /tmp/check.txt
          import json
          l=json.load(open('/tmp/lhr.json'))
          print('performance_score=',round(l['categories']['performance']['score']*100))
          for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index']:
              a=l['audits'][k]
              print(k,'=',a.get('displayValue'),a.get('numericValue'))
          u=l['audits'].get('unused-css-rules',{})
          print('unused_css=',u.get('displayValue'),u.get('numericValue'))
          PY
          cp /tmp/check.txt runtime/home-hustle-remove-010262.txt
          cat runtime/home-hustle-remove-010262.txt
      - name: Record verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-hustle-remove-010262.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-hustle-remove-010262.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-hustle-remove-010262.txt
          git commit -m 'Record Home Hustle removal verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

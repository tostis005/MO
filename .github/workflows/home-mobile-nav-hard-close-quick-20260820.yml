name: Home mobile nav hard close quick 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-mobile-nav-hard-close-quick-20260820.yml'

permissions:
  contents: write

concurrency:
  group: home-mobile-nav-hard-close-production
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch Home cache
        run: |
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/cache-before.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php');s=p.read_text()
          old="\t$critical_tag = '<style id=\"elmercado-home-first-view-css\">' . $critical . '</style>';"
          new="""\t$mobile_nav_guard = '@media(min-width:992px){body.home #mobile-navigation.sidebar-menu,body.home .sidebar-menu{display:none!important}}@media(max-width:991px){html:not([data-emo-menu-intent=\"1\"]) body.home #mobile-navigation.sidebar-menu{display:none!important}}';
\t$mobile_nav_intent = '<script id=\"elmercado-home-mobile-nav-intent-critical\">document.addEventListener(\"click\",function(e){var t=e.target&&e.target.closest?e.target.closest(\".toggle-sidebar-menu-btn\"):null;if(t){document.documentElement.setAttribute(\"data-emo-menu-intent\",\"1\");}},true);</script>';
\t$critical_tag = '<style id=\"elmercado-home-first-view-css\">' . $mobile_nav_guard . $critical . '</style>' . $mobile_nav_intent;"""
          if old not in s: raise SystemExit('anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
      - name: Deploy
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail; PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p";break;;esac;done')"; : "${PROD:?no prod}"; echo "$PROD">/tmp/prod
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/cache-quick-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; cp \"\$THEME/inc/home-cache.php\" /tmp/cache-server-before-quick-${GITHUB_RUN_ID}.php; install -m0644 /tmp/cache-quick-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"; php_bin=\$(command -v php||true); [ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css"
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          grep -q 'elmercado-home-mobile-nav-intent-critical' /tmp/home.html
      - name: One mobile Lighthouse
        run: |
          mkdir -p runtime
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=mobile --output=json --output-path=/tmp/lh.json --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          python3 - <<'PY' | tee runtime/home-mobile-nav-hard-close-quick-20260820.txt
          import json
          r=json.load(open('/tmp/lh.json'));a=r['audits'];cls=a['cumulative-layout-shift']['numericValue'];print('score=',round(r['categories']['performance']['score']*100));print('fcp=',round(a['first-contentful-paint']['numericValue']));print('lcp=',round(a['largest-contentful-paint']['numericValue']));print('tbt=',round(a['total-blocking-time']['numericValue']));print('cls=',cls)
          for x in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:10]:
              n=x.get('node') or {}; print('shift=',x.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          open('/tmp/keep','w').write('1' if cls<0.10 else '0')
          PY
      - name: Decide
        if: always()
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail; K=$(cat /tmp/keep 2>/dev/null||echo 0); PROD=$(cat /tmp/prod); PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "$K" != 1 ]; then cp /tmp/cache-before.php elmercadodeorigen-child/inc/home-cache.php; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; install -m0644 /tmp/cache-server-before-quick-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"; php_bin=\$(command -v php||true); [ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css"; fi
          mkdir -p runtime; [ -f runtime/home-mobile-nav-hard-close-quick-20260820.txt ]||echo failed>runtime/home-mobile-nav-hard-close-quick-20260820.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add elmercadodeorigen-child/inc/home-cache.php runtime/home-mobile-nav-hard-close-quick-20260820.txt;git commit -m 'Measure quick hard-close mobile navigation' || exit 0;git pull --rebase origin main;git push origin HEAD:main

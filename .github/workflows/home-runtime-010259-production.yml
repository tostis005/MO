name: Home runtime 0.10.259 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-runtime-010259-production.yml'

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate sources
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/home-cache.php
          php -l elmercadodeorigen-child/functions.php
          grep -q "ELMERCADO_THEME_VERSION', '0.10.259" elmercadodeorigen-child/functions.php
          grep -q 'explicit Google Ads gtag loader omitted' elmercadodeorigen-child/inc/home-cache.php
          ! grep -q 'elmercado-delayed-google-ads-loader' elmercadodeorigen-child/inc/home-cache.php
      - name: Deploy 0.10.259
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-010259.php"
          sshpass -e scp $SCP elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:/tmp/functions-010259.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            cp \"\$THEME/inc/home-cache.php\" \"\$THEME/inc/home-cache.php.bak-$GITHUB_RUN_ID\"
            cp \"\$THEME/functions.php\" \"\$THEME/functions.php.bak-$GITHUB_RUN_ID\"
            install -m 0644 /tmp/home-cache-010259.php \"\$THEME/inc/home-cache.php\"
            install -m 0644 /tmp/functions-010259.php \"\$THEME/functions.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/home-cache.php\"
            \"\$php_bin\" -l \"\$THEME/functions.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-0.10.259.css
            rm -f /tmp/home-cache-010259.php /tmp/functions-010259.php
          "
      - name: Verify HTML and Google Ads destination
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          HTML=/tmp/home-010259.html
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          version=$(grep -c 'home-deferred-0.10.259.css' "$HTML" || true)
          h1=$(grep -c 'visibleHeadingOne' "$HTML" || true)
          hit=$(grep -c 'id="elmercado-mobile-header-hitareas-final"' "$HTML" || true)
          catalog=$(grep -c 'id="elmercado-catalog-mobile-controls-parity-script-010236"' "$HTML" || true)
          marker=$(grep -c 'elmercado-delayed-google-ads-source' "$HTML" || true)
          loader=$(grep -c 'elmercado-delayed-google-ads-loader' "$HTML" || true)
          suppressed=$(grep -c 'explicit Google Ads gtag loader omitted' "$HTML" || true)
          ga4=$(grep -c 'G-515YQ0XMS4' "$HTML" || true)
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/browser-010259.json
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            const take=()=>page.evaluate(()=>{
              const scripts=[...document.scripts].map(s=>s.src).filter(Boolean);
              const resources=performance.getEntriesByType('resource').map(r=>r.name);
              return {
                directAds:scripts.filter(src=>src.includes('gtag/js?id=AW-18396600140')&&!src.includes('&cx=')).length,
                dynamicAds:scripts.filter(src=>src.includes('gtag/js?id=AW-18396600140')&&src.includes('&cx=')).length,
                ga4:scripts.filter(src=>src.includes('gtag/js?id=G-515YQ0XMS4')).length,
                adsCollect:resources.filter(src=>src.includes('google.com/ccm/collect')&&src.includes('tid=AW-18396600140')).length
              };
            });
            const before=await take();
            await page.mouse.wheel(0,500);
            await page.waitForTimeout(1800);
            const after=await take();
            console.log(JSON.stringify({before,after},null,2));
            await browser.close();
            if(before.directAds!==0||after.directAds!==0||before.dynamicAds<1||after.dynamicAds<1||before.ga4<1||before.adsCollect<1) process.exit(12);
          })().catch(e=>{console.error(e);process.exit(13)});
          JS
          {
            printf 'deploy=success\n'
            printf 'version_010259=%s\n' "$version"
            printf 'visibleHeadingOne=%s\n' "$h1"
            printf 'mobile_hitareas=%s\n' "$hit"
            printf 'catalog_parity=%s\n' "$catalog"
            printf 'delayed_marker=%s\n' "$marker"
            printf 'delayed_loader=%s\n' "$loader"
            printf 'explicit_ads_suppressed=%s\n' "$suppressed"
            printf 'ga4=%s\n' "$ga4"
            cat /tmp/browser-010259.json
          } > runtime/home-runtime-010259.txt
          cat runtime/home-runtime-010259.txt
          test "$version" -ge 1
          test "$h1" -eq 0
          test "$hit" -eq 0
          test "$catalog" -eq 0
          test "$marker" -eq 0
          test "$loader" -eq 0
          test "$suppressed" -ge 1
          test "$ga4" -ge 1
      - name: Record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-runtime-010259.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-runtime-010259.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-runtime-010259.txt
          git commit -m 'Record Home runtime 0.10.259 verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Producer toolbar style source diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-style-source-diagnostic-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy temporarily and inspect cascade
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status; STATUS=.deploy-status/producer-toolbar-style-source-diagnostic-20260821.txt; : > "$STATUS"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac; done
          ')"
          UXT="$PROD_PATH/wp-content/mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php"; WHT="$PROD_PATH/wp-content/mu-plugins/zzzzzz-mdo-producer-toolbar-white-guard-20260821.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzz-mdo-producer-store-toolbar-ux-20260821.php "$STAGING_USER@$STAGING_HOST:/tmp/ux-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzzz-mdo-producer-toolbar-white-guard-20260821.php "$STAGING_USER@$STAGING_HOST:/tmp/wh-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "cp /tmp/ux-${GITHUB_RUN_ID}.php '$UXT'; cp /tmp/wh-${GITHUB_RUN_ID}.php '$WHT'; rm -f /tmp/ux-${GITHUB_RUN_ID}.php /tmp/wh-${GITHUB_RUN_ID}.php; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null || true"
          cleanup(){ sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$UXT' '$WHT'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null || true" || true; }
          trap cleanup EXIT
          python -m pip install --quiet selenium
          export RUN="$GITHUB_RUN_ID"
          python - <<'PY' >> "$STATUS" 2>&1
          import os, json
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1440,1000')
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,20); base='https://www.elmercadodeorigen.com'; run=os.environ['RUN']
          d.get(base+'/?seed='+run); d.add_cookie({'name':'mdo_shipping_country','value':'ES','domain':'www.elmercadodeorigen.com','path':'/'}); d.get(base+'/tienda/1957/?cascade='+run)
          t=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'[data-mdo-ps-destination-open]'))); bar=t.find_element(By.XPATH,"ancestor::*[contains(concat(' ',normalize-space(@class),' '),' woostify-sorting ')][1]")
          print('BODY_CLASS',d.find_element(By.TAG_NAME,'body').get_attribute('class'))
          print('BAR_CLASS',bar.get_attribute('class'))
          print('BAR_STYLE_ATTR',repr(bar.get_attribute('style')))
          print('BAR_BG',d.execute_script('return getComputedStyle(arguments[0]).backgroundColor',bar))
          print('WHITE_ATTR',bar.get_attribute('data-mdo-producer-toolbar-white'))
          print('GUARD_JS_COUNT',len(d.find_elements(By.ID,'mdo-producer-toolbar-white-guard-js-20260821')))
          print('UX_JS_COUNT',len(d.find_elements(By.ID,'mdo-ps-toolbar-ux-js-20260821')))
          print('HEAD_GUARD_COUNT',len(d.find_elements(By.CSS_SELECTOR,'head [data-mdo-producer-toolbar-white-guard="1"]')))
          matches=d.execute_script(r'''
          const el=arguments[0], out=[];
          for (const ss of Array.from(document.styleSheets)) {
            let rules; try { rules=ss.cssRules; } catch(e) { continue; }
            const walk=(rs)=>{ for(const r of Array.from(rs||[])){ if(r.cssRules){walk(r.cssRules);continue;} if(!r.selectorText||!r.style)continue; let ok=false; try{ok=el.matches(r.selectorText);}catch(e){} if(!ok)continue; const bg=r.style.getPropertyValue('background'), bc=r.style.getPropertyValue('background-color'), bi=r.style.getPropertyValue('background-image'); if(bg||bc||bi) out.push({href:ss.href||'inline',selector:r.selectorText,background:bg,bgPriority:r.style.getPropertyPriority('background'),backgroundColor:bc,bcPriority:r.style.getPropertyPriority('background-color'),backgroundImage:bi,biPriority:r.style.getPropertyPriority('background-image')}); }};
            walk(rules);
          }
          return out;
          ''',bar)
          print('MATCHING_BACKGROUND_RULES',json.dumps(matches,ensure_ascii=False,indent=2))
          d.quit()
          PY
      - name: Record diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-style-source-diagnostic-20260821.txt || true
          if ! git diff --cached --quiet; then git commit -m 'Record producer toolbar style source diagnostic [skip ci]'; git pull --rebase origin main || true; git push origin HEAD:main; fi

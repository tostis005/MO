name: Sync EMDO external reviews

on:
  push:
    branches: [main]
    paths:
      - 'mdo-supplier-sync/includes/class-mdo-reviews-scraping.php'
      - 'mdo-supplier-sync/includes/class-mdo-reviews-trustpilot-scraper.php'
      - 'mdo-supplier-sync/scripts/scrape-external-reviews.mjs'
      - 'mdo-supplier-sync/scripts/scrape-google-reviews.mjs'
      - 'mdo-supplier-sync/scripts/scrape-trustpilot-reviews.mjs'
      - 'mdo-supplier-sync/mdo-supplier-sync.php'
      - '.github/workflows/sync-emdo-external-reviews.yml'
  schedule:
    # Google: diario. En horario de verano español equivale a 02:15; en invierno, 01:15.
    - cron: '15 0 * * *'
    # Trustpilot: semanal, domingo. En verano español equivale a 02:30.
    - cron: '30 0 * * 0'
  workflow_dispatch:
    inputs:
      source:
        description: Fuente a sincronizar
        required: true
        default: both
        type: choice
        options:
          - both
          - google
          - trustpilot
      mode:
        description: Alcance
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: read

concurrency:
  group: sync-emdo-external-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve sync scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            echo 'MDO_SOURCES=google trustpilot' >> "$GITHUB_ENV"
            echo 'MDO_MODE=full' >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = 'schedule' ]; then
            if [ "${{ github.event.schedule }}" = '30 0 * * 0' ]; then
              echo 'MDO_SOURCES=trustpilot' >> "$GITHUB_ENV"
            else
              echo 'MDO_SOURCES=google' >> "$GITHUB_ENV"
            fi
            echo 'MDO_MODE=incremental' >> "$GITHUB_ENV"
          else
            case '${{ inputs.source }}' in
              google) echo 'MDO_SOURCES=google' >> "$GITHUB_ENV" ;;
              trustpilot) echo 'MDO_SOURCES=trustpilot' >> "$GITHUB_ENV" ;;
              *) echo 'MDO_SOURCES=google trustpilot' >> "$GITHUB_ENV" ;;
            esac
            case '${{ inputs.mode }}' in
              full) echo 'MDO_MODE=full' >> "$GITHUB_ENV" ;;
              *) echo 'MDO_MODE=incremental' >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Validate scraper and PHP bridges
        shell: bash
        run: |
          set -euo pipefail
          php -l mdo-supplier-sync/includes/class-mdo-reviews-scraping.php
          php -l mdo-supplier-sync/includes/class-mdo-reviews-trustpilot-scraper.php
          node --check mdo-supplier-sync/scripts/scrape-external-reviews.mjs
          node --check mdo-supplier-sync/scripts/scrape-google-reviews.mjs
          node --check mdo-supplier-sync/scripts/scrape-trustpilot-reviews.mjs

      - name: Resolve production and wait for completed deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA:-}"
          test -n "${STAGING_HOST:-}"
          test -n "${STAGING_USER:-}"
          test -n "${STAGING_PASSWORD:-}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          EXPECTED_VERSION="$(sed -n 's/^ \* Version: //p' mdo-supplier-sync/mdo-supplier-sync.php | head -n1 | tr -d '\r')"
          LOCAL_BRIDGE_SHA="$(sha256sum mdo-supplier-sync/includes/class-mdo-reviews-scraping.php | awk '{print $1}')"
          deployed=''
          remote_bridge_sha=''
          deployed_sha=''
          for attempt in $(seq 1 60); do
            state="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); version=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" plugin get mdo-supplier-sync --field=version --path='$PROD_PATH' --allow-root 2>/dev/null || true); plugin='$PROD_PATH/wp-content/plugins/mdo-supplier-sync'; bridge=\"\$plugin/includes/class-mdo-reviews-scraping.php\"; marker=\"\$plugin/.emdo-deployed-sha\"; bridge_sha=''; deploy_sha=''; [ -f \"\$bridge\" ] && bridge_sha=\$(sha256sum \"\$bridge\" | awk '{print \$1}'); [ -f \"\$marker\" ] && deploy_sha=\$(tr -d '\\r\\n' < \"\$marker\"); printf '%s|%s|%s' \"\$version\" \"\$bridge_sha\" \"\$deploy_sha\"")"
            deployed="${state%%|*}"
            rest="${state#*|}"
            remote_bridge_sha="${rest%%|*}"
            deployed_sha="${rest#*|}"
            if [ "$deployed" = "$EXPECTED_VERSION" ] && [ "$remote_bridge_sha" = "$LOCAL_BRIDGE_SHA" ] && [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              break
            fi
            echo "WAIT_DEPLOY attempt=$attempt version=${deployed:-none} marker=${deployed_sha:-none} expected=$GITHUB_SHA"
            sleep 10
          done
          test "$deployed" = "$EXPECTED_VERSION"
          test "$remote_bridge_sha" = "$LOCAL_BRIDGE_SHA"
          test "$deployed_sha" = "$GITHUB_SHA"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH_OPTIONS=$SSH_OPTIONS" >> "$GITHUB_ENV"
          echo "SCP_OPTIONS=$SCP_OPTIONS" >> "$GITHUB_ENV"
          echo "PRODUCTION_EMDO_VERSION=$deployed"
          echo "IMPORT_BRIDGE_SHA=$remote_bridge_sha"
          echo "PRODUCTION_DEPLOY_SHA=$deployed_sha"

      - name: Install browser dependency
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || npx playwright install chromium >/dev/null 2>&1

      - name: Scrape and validate external public reviews
        shell: bash
        run: |
          set -euo pipefail
          for source in $MDO_SOURCES; do
            output="/tmp/emdo-${source}.json"
            if [ "$source" = 'google' ]; then
              node mdo-supplier-sync/scripts/scrape-google-reviews.mjs --mode "$MDO_MODE" --output "$output"
            else
              node mdo-supplier-sync/scripts/scrape-trustpilot-reviews.mjs --mode "$MDO_MODE" --output "$output"
            fi

            SOURCE="$source" MODE="$MDO_MODE" OUTPUT="$output" python3 - <<'PY'
          import json, os
          source=os.environ['SOURCE']; mode=os.environ['MODE']; path=os.environ['OUTPUT']
          with open(path, encoding='utf-8') as fh: data=json.load(fh)
          reviews=data.get('reviews') or []
          found=len(reviews)
          reported=int(data.get('reported_count') or 0)
          available=int(data.get('available_count') or reported or 0)
          historical=int(data.get('historical_count') or reported or 0)
          ids=[str(x.get('id') or '') for x in reviews]
          if not found or any(not x for x in ids): raise SystemExit(f'{source}: empty review payload or id')
          if len(ids) != len(set(ids)): raise SystemExit(f'{source}: duplicate ids in scraper payload')
          if not data.get('sorted_newest'):
              raise SystemExit(f'{source}: payload is not marked newest-first')
          if source == 'google':
              missing_authors=sum(not str(x.get('author_name') or '').strip() for x in reviews)
              if missing_authors: raise SystemExit(f'google: {missing_authors} reviews without author identity')
              if mode == 'full':
                  if found < 150: raise SystemExit(f'google: full scrape too small ({found})')
                  if reported and found < reported: raise SystemExit(f'google: full scrape incomplete ({found}/{reported})')
              expected=reported
          else:
              if historical and available and historical < available:
                  raise SystemExit(f'trustpilot: inconsistent counters active={available} historical={historical}')
              if mode == 'full':
                  if found < 100: raise SystemExit(f'trustpilot: full scrape too small ({found})')
                  if available and found < available: raise SystemExit(f'trustpilot: full scrape incomplete ({found}/{available}, historical={historical})')
              expected=available
          print(f'SCRAPER_ACCEPT source={source} mode={mode} found={found} expected={expected} historical={historical} rating={data.get("rating")}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              if source == 'google':
                  env.write(f'GOOGLE_EXPECTED_COUNT={expected}\n')
              else:
                  env.write(f'TRUSTPILOT_EXPECTED_COUNT={expected}\n')
                  env.write(f'TRUSTPILOT_HISTORICAL_COUNT={historical}\n')
          PY
          done

      - name: Import external reviews into EMDO and verify immediately
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          for source in $MDO_SOURCES; do
            local_file="/tmp/emdo-${source}.json"
            remote_file="/tmp/emdo-${source}-${GITHUB_RUN_ID}.json"
            sshpass -e scp $SCP_OPTIONS "$local_file" "$STAGING_USER@$STAGING_HOST:$remote_file"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$remote_file' '$source' '$MDO_MODE'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          PAYLOAD_FILE="$2"
          SOURCE="$3"
          MODE="$4"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          export MDO_REVIEW_PAYLOAD_FILE="$PAYLOAD_FILE"
          export MDO_REVIEW_SOURCE="$SOURCE"
          export MDO_REVIEW_MODE="$MODE"
          set +e
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            if ( ! class_exists( "MDO_Reviews_Scraping" ) ) { fwrite( STDERR, "MDO_Reviews_Scraping missing\n" ); exit(31); }
            $source = sanitize_key( getenv( "MDO_REVIEW_SOURCE" ) );
            $mode = sanitize_key( getenv( "MDO_REVIEW_MODE" ) );
            $result = MDO_Reviews_Scraping::import_file( getenv( "MDO_REVIEW_PAYLOAD_FILE" ) );
            if ( is_wp_error( $result ) ) { fwrite( STDERR, $result->get_error_code() . ":" . $result->get_error_message() . "\n" ); exit(32); }
            $table = MDO_Database::table( "reviews" );
            $count = (int) $wpdb->get_var( $wpdb->prepare( "SELECT COUNT(*) FROM {$table} WHERE source=%s", $source ) );
            $expected = (int) ( $result["expected"] ?? 0 );
            echo "IMPORT_RESULT_" . strtoupper( $source ) . "=" . wp_json_encode( $result ) . PHP_EOL;
            echo "IMPORT_SOURCE_COUNT_" . strtoupper( $source ) . "={$count} expected={$expected} mode={$mode}" . PHP_EOL;
            if ( "full" === $mode && $expected > 0 && $count < $expected ) {
              fwrite( STDERR, "mdo_review_import_incomplete:{$source}:{$count}/{$expected}\n" );
              exit(33);
            }
          ' --path="$PROD_PATH" --allow-root
          rc=$?
          set -e
          rm -f "$PAYLOAD_FILE"
          exit "$rc"
          REMOTE
          done

      - name: Validate production review data and public route
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          prefix=$("$php_bin" -d memory_limit=512M "$wp_bin" db prefix --path="$PROD_PATH" --allow-root)
          echo '=== EMDO REVIEW ACCEPTANCE ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT source,COALESCE(NULLIF(TRIM(status),''),'EMPTY') status,COUNT(*) total FROM ${prefix}mdo_reviews GROUP BY source,status ORDER BY source,status" --skip-column-names --path="$PROD_PATH" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COALESCE(NULLIF(validation_method,''),'NONE') method,status,COUNT(*) total FROM ${prefix}mdo_reviews GROUP BY method,status ORDER BY method,status" --skip-column-names --path="$PROD_PATH" --allow-root
          empty_status=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM ${prefix}mdo_reviews WHERE status IS NULL OR TRIM(status)=''" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          duplicate_keys=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM (SELECT source_key FROM ${prefix}mdo_reviews WHERE source_key IS NOT NULL AND source_key<>'' GROUP BY source_key HAVING COUNT(*)>1) d" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          duplicate_fp=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM (SELECT content_fingerprint FROM ${prefix}mdo_reviews WHERE content_fingerprint IS NOT NULL AND content_fingerprint<>'' GROUP BY content_fingerprint HAVING COUNT(*)>1) d" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          echo "EMPTY_STATUS=$empty_status"
          echo "DUPLICATE_SOURCE_KEYS=$duplicate_keys"
          echo "DUPLICATE_FINGERPRINTS=$duplicate_fp"
          test "$empty_status" = '0'
          test "$duplicate_keys" = '0'
          test "$duplicate_fp" = '0'

          google_count=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM ${prefix}mdo_reviews WHERE source='google'" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          trustpilot_count=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM ${prefix}mdo_reviews WHERE source='trustpilot'" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          woo_count=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM ${prefix}mdo_reviews WHERE source='woocommerce_product'" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          wcfm_count=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM ${prefix}mdo_reviews WHERE source='wcfm'" --skip-column-names --path="$PROD_PATH" --allow-root | tr -d '[:space:]')
          google_expected=$("$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_google_review_count --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root 2>/dev/null || echo 0)
          trustpilot_expected=$("$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_trustpilot_review_count --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root 2>/dev/null || echo 0)
          google_expected=$(printf '%s' "$google_expected" | tr -cd '0-9')
          trustpilot_expected=$(printf '%s' "$trustpilot_expected" | tr -cd '0-9')
          google_expected=${google_expected:-0}
          trustpilot_expected=${trustpilot_expected:-0}
          echo "SOURCE_TOTAL_google=$google_count expected=$google_expected"
          echo "SOURCE_TOTAL_trustpilot=$trustpilot_count expected_active=$trustpilot_expected"
          echo "SOURCE_TOTAL_woocommerce_product=$woo_count"
          echo "SOURCE_TOTAL_wcfm=$wcfm_count"
          test "$google_count" -ge 300
          test "$trustpilot_count" -ge 140
          test "$woo_count" -ge 200
          if [ "$google_expected" -gt 0 ]; then test "$google_count" -ge "$google_expected"; fi
          if [ "$trustpilot_expected" -gt 0 ]; then test "$trustpilot_count" -ge "$trustpilot_expected"; fi

          top_vendor=$("$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT r.vendor_user_id,u.user_nicename,COUNT(*) c FROM ${prefix}mdo_reviews r INNER JOIN ${prefix}users u ON u.ID=r.vendor_user_id WHERE r.status='validated' AND r.vendor_user_id IS NOT NULL GROUP BY r.vendor_user_id,u.user_nicename ORDER BY c DESC LIMIT 1" --skip-column-names --path="$PROD_PATH" --allow-root | head -n1)
          test -n "$top_vendor"
          vendor_slug=$(printf '%s' "$top_vendor" | awk '{print $2}')
          reviews_url="https://www.elmercadodeorigen.com/tienda/${vendor_slug}/reviews/?emdo_review_verify=${RANDOM}"
          code=$(curl -k -L -sS --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache, no-store' -o /tmp/emdo-public-reviews.html -w '%{http_code}' "$reviews_url")
          echo "PUBLIC_REVIEWS_URL=$reviews_url"
          echo "PUBLIC_REVIEWS_HTTP=$code"
          echo "PUBLIC_TAB_LABEL=$(grep -Eoc '>[[:space:]]*Reseñas[[:space:]]*<' /tmp/emdo-public-reviews.html || true)"
          echo "PUBLIC_EMDO_LIST=$(grep -c 'mdo-store-reviews' /tmp/emdo-public-reviews.html || true)"
          echo "PUBLIC_SOURCE_BADGES=$(grep -o 'mdo-source-badge' /tmp/emdo-public-reviews.html | wc -l | tr -d ' ')"
          test "$code" = '200'
          grep -q 'mdo-store-reviews' /tmp/emdo-public-reviews.html
          grep -Eq '>[[:space:]]*Reseñas[[:space:]]*<' /tmp/emdo-public-reviews.html
          echo '=== EMDO REVIEW ACCEPTANCE OK ==='
          REMOTE

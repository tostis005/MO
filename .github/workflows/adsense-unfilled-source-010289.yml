name: Patch AdSense unfilled handling 0.10.289

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-unfilled-source-010289.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          php = Path('elmercadodeorigen-child/inc/adsense-geo-010266.php')
          s = php.read_text()
          marker = 'ADSENSE_UNFILLED_COLLAPSE_010289'
          if marker not in s:
              anchor = '''\t\t.emo-article-content .emo-inarticle-ad-slot > ins.adsbygoogle {\n\t\t\tdisplay: block;\n\t\t\twidth: 100%;\n\t\t\ttext-align: center;\n\t\t}\n'''
              addition = anchor + '''\n\t\t/* ADSENSE_UNFILLED_COLLAPSE_010289\n\t\t * Google puede reservar altura para bloques sin inventario. Si el propio\n\t\t * AdSense confirma data-ad-status=unfilled, retiramos ese hueco. No se\n\t\t * toca filled ni unfill-optimized.\n\t\t */\n\t\tbody.single-post ins.adsbygoogle[data-ad-status="unfilled"] {\n\t\t\tdisplay: none !important;\n\t\t\theight: 0 !important;\n\t\t\tmin-height: 0 !important;\n\t\t\tmargin: 0 !important;\n\t\t\tpadding: 0 !important;\n\t\t}\n\n\t\tbody.single-post .emo-inarticle-ad-slot:has(> ins.adsbygoogle[data-ad-status="unfilled"]) {\n\t\t\tdisplay: none !important;\n\t\t\theight: 0 !important;\n\t\t\tmin-height: 0 !important;\n\t\t\tmargin: 0 !important;\n\t\t\tpadding: 0 !important;\n\t\t}\n'''
              if anchor not in s:
                  raise SystemExit('AdSense CSS anchor not found')
              s = s.replace(anchor, addition, 1)
              php.write_text(s)

          js = Path('elmercadodeorigen-child/assets/js/adsense-geo-010266.js')
          j = js.read_text()
          old = '''\tfunction isPaused() {\n\t\tvar queue = adsbygoogleQueue();\n\t\treturn queue.pauseAdRequests !== 0;\n\t}\n'''
          new = '''\tfunction isPaused() {\n\t\tvar queue = adsbygoogleQueue();\n\t\t// ADSENSE_PAUSE_DEBUG_010289: solo un 1 explicito significa pausado.\n\t\t// Tras inicializarse Google puede retirar la propiedad del array.\n\t\treturn queue.pauseAdRequests === 1;\n\t}\n'''
          if 'ADSENSE_PAUSE_DEBUG_010289' not in j:
              if old not in j:
                  raise SystemExit('AdSense pause debug anchor not found')
              j = j.replace(old, new, 1)
              js.write_text(j)
          PY

          php -l elmercadodeorigen-child/inc/adsense-geo-010266.php
          node --check elmercadodeorigen-child/assets/js/adsense-geo-010266.js
          grep -Fq 'ADSENSE_UNFILLED_COLLAPSE_010289' elmercadodeorigen-child/inc/adsense-geo-010266.php
          grep -Fq 'ADSENSE_PAUSE_DEBUG_010289' elmercadodeorigen-child/assets/js/adsense-geo-010266.js

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/adsense-geo-010266.php elmercadodeorigen-child/assets/js/adsense-geo-010266.js
          if ! git diff --cached --quiet; then
            git commit -m 'Collapse unfilled AdSense slots'
            git push origin HEAD:main
          fi

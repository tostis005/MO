name: Reorganize Selectos global taxonomy 20261001

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reorganize-selectos-global-taxonomy-20261001.php'
      - '.github/workflows/reorganize-selectos-global-taxonomy-20261001.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reorganize-selectos-global-taxonomy-20261001
  cancel-in-progress: false

jobs:
  reorganize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorganize Selectos categories in production
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/reorganize-selectos-global-taxonomy-20261001.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 22
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"

          REMOTE="/tmp/reorganize-selectos-global-taxonomy-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/reorganize-selectos-global-taxonomy-20261001.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" > /tmp/selectos-global-taxonomy.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE'; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          jq -e '.batch == "20261001-selectos-global-taxonomy"' /tmp/selectos-global-taxonomy.json >/dev/null
          jq -e '.products >= 128' /tmp/selectos-global-taxonomy.json >/dev/null
          jq -e '.missing_after == 0 and .uncategorized_after == 0 and .mentta_after == 0 and .obsolete_assignments_after == 0' /tmp/selectos-global-taxonomy.json >/dev/null
          jq -e '(.status_changes|length) == 0 and (.stock_changes|length) == 0' /tmp/selectos-global-taxonomy.json >/dev/null

          mkdir -p .deploy-status
          cp /tmp/selectos-global-taxonomy.json .deploy-status/selectos-global-taxonomy-20261001.json

          jq '{batch,supplier_id,products,status_counts,new_global_categories,deleted_obsolete_categories,retained_obsolete_categories,missing_after,uncategorized_after,mentta_after,obsolete_assignments_after,status_changes,stock_changes,category_counts}' .deploy-status/selectos-global-taxonomy-20261001.json

      - name: Record verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/selectos-global-taxonomy-20261001.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Selectos global taxonomy reorganization [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

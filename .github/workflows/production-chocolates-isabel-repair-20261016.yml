name: Chocolates Isabel - corregir fichas activas en produccion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-chocolates-isabel-repair-20261016.yml'
  workflow_run:
    workflows: ["Deploy MDO Supplier Sync to production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chocolates-isabel-production-repair
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Rescrape and enrich Isabel catalog without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/repair-chocolates-isabel-production-20261016.php
          php -l mdo-supplier-sync/includes/class-mdo-isabel-quality.php
          php -l mdo-supplier-sync/connectors/class-mdo-connector-chocolates-isabel.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=60 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/audit-isabel-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/repair-chocolates-isabel-production-20261016.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            ISABEL_REPAIR_PHASE=all \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            ISABEL_REPAIR_PHASE=backfill \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            ISABEL_REPAIR_PHASE=dimensions \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            ISABEL_REPAIR_PHASE=report \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            rm -f '$SCRIPT'
          "
          echo ISABEL_REPAIR_WORKFLOW_COMPLETED


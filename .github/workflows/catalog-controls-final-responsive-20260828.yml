name: Catalogue controls final responsive 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/zzzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-controls-final-responsive-20260828.php'
      - '.github/workflows/catalog-controls-final-responsive-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only responsive owner
        shell: bash
        run: |
          set -euo pipefail
          f='mu-plugins/zzzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-controls-final-responsive-20260828.php'
          php -l "$f" >/dev/null
          ! grep -Eq '<script|MutationObserver|ResizeObserver|setInterval[[:space:]]*\(|setTimeout[[:space:]]*\(|pre_get_posts|woocommerce_product_query|posts_(where|join|clauses)|WP_Query' "$f"

      - name: Deploy responsive owner
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          NAME='zzzzzzzzzzzzzzzzzzzzzzz-mdo-catalog-controls-final-responsive-20260828.php'
          TARGET="$PROD/wp-content/mu-plugins/$NAME"
          BACKUP="/tmp/$NAME.$GITHUB_RUN_ID.backup"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"; echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$TARGET'"; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BACKUP'"; echo EXISTED=1 >> "$GITHUB_ENV"
          else
            echo EXISTED=0 >> "$GITHUB_ENV"
          fi
          R="/tmp/$NAME.$GITHUB_RUN_ID"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$R"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$R' >/dev/null; install -m0644 '$R' '$TARGET'; rm -f '$R'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify alignment icons and first paint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time, sys

          urls = {
              'global': 'https://www.elmercadodeorigen.com/tienda/',
              'producer': 'https://www.elmercadodeorigen.com/tienda/1957/',
          }
          widths = [320,335,360,390,430,480,640,700,767,768,820,900,1024,1280,1440,1920]
          errors=[]

          inspect_js='''() => {
            const visible=e=>!!e && e.getClientRects().length>0 && getComputedStyle(e).display!=='none' && getComputedStyle(e).visibility!=='hidden';
            const t=Array.from(document.querySelectorAll('.emo-catalog-toolbar-shared-010229')).find(visible)||null;
            const d=Array.from(document.querySelectorAll('[data-mdo-destination-open],[data-mdo-ps-destination-open]')).find(e=>visible(e)&&t?.contains(e))||null;
            const f=Array.from(document.querySelectorAll('form.woocommerce-ordering,.woocommerce-ordering')).find(e=>visible(e)&&e.querySelector('select[name="orderby"]')&&t?.contains(e))||null;
            const s=f?.querySelector('select[name="orderby"]')||null;
            const c=t?.querySelector('.woocommerce-result-count')||null;
            const span=d?.querySelector('span')||null, strong=d?.querySelector('strong')||null;
            const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height,cy:(r.top+r.bottom)/2}};
            const cs=e=>e?getComputedStyle(e):null;
            const ds=cs(d),ss=cs(s),tc=cs(t),pin=d?getComputedStyle(d,'::before'):null,da=d?getComputedStyle(d,'::after'):null,oa=f?getComputedStyle(f,'::after'):null;
            return {
              ready:!!(t&&d&&f&&s&&c&&span&&strong),
              critical:!!document.getElementById('mdo-catalog-controls-final-responsive-critical-20260828'),
              final:!!document.getElementById('mdo-catalog-controls-final-responsive-20260828'),
              t:box(t),d:box(d),f:box(f),s:box(s),c:box(c),padL:parseFloat(tc?.paddingLeft||0),padR:parseFloat(tc?.paddingRight||0),
              bg:ds?.backgroundColor,dAlign:ds?.textAlign,sAlign:ss?.textAlign,spanAlign:cs(span)?.textAlign,
              spanWeight:parseInt(cs(span)?.fontWeight||0),strongWeight:parseInt(cs(strong)?.fontWeight||0),
              pinW:parseFloat(pin?.width||0),pinMask:(pin?.maskImage||pin?.webkitMaskImage||''),
              daW:parseFloat(da?.width||0),daH:parseFloat(da?.height||0),daBg:da?.backgroundImage||'',daBorder:da?.borderRightWidth||'',daTransform:da?.transform||'',
              oaW:parseFloat(oa?.width||0),oaH:parseFloat(oa?.height||0),oaBg:oa?.backgroundImage||'',oaBorder:oa?.borderRightWidth||'',
              selectBg:ss?.backgroundImage||'',svgVisible:d?Array.from(d.querySelectorAll('svg')).filter(visible).length:0,
              overflow:document.documentElement.scrollWidth-innerWidth,pointerD:ds?.pointerEvents,pointerS:ss?.pointerEvents,disabled:!!s?.disabled
            };
          }'''

          # IIFE is essential: add_init_script evaluates the source, it does not call a bare arrow function.
          first_paint_init='''(() => {
            window.__mdoPaintSamples=[];
            const sample=()=>{
              const d=document.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]');
              if(d){const cs=getComputedStyle(d);window.__mdoPaintSamples.push({t:performance.now(),bg:cs.backgroundColor});}
              if(performance.now()<5000) requestAnimationFrame(sample);
            };
            requestAnimationFrame(sample);
          })();'''

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for w in widths:
              for kind,url in urls.items():
                page=browser.new_page(viewport={'width':w,'height':900})
                page.add_init_script(script=first_paint_init)
                page.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','font','media') else r.continue_())
                page.goto(url,wait_until='domcontentloaded',timeout=30000)
                samples=[]
                for _ in range(50):
                  time.sleep(.2)
                  try:
                    x=page.evaluate(inspect_js)
                    if x and x.get('ready'):
                      samples=[x]
                      for __ in range(2):
                        time.sleep(.35); samples.append(page.evaluate(inspect_js))
                      break
                  except Exception:
                    pass
                data=samples[-1] if samples else None
                paint=page.evaluate('window.__mdoPaintSamples || []')
                tag=f'{kind} {w}'
                if not data:
                  errors.append(f'{tag}: controls unavailable'); page.close(); continue
                if not data['critical'] or not data['final']: errors.append(f'{tag}: CSS owners missing')
                if data['bg']!='rgb(241, 246, 242)': errors.append(f'{tag}: background {data["bg"]}')
                if not paint: errors.append(f'{tag}: no first-paint samples')
                elif any(x['bg']!='rgb(241, 246, 242)' for x in paint): errors.append(f'{tag}: first-paint flicker {next(x for x in paint if x["bg"]!="rgb(241, 246, 242)")}')
                if data['overflow']>1: errors.append(f'{tag}: overflow {data["overflow"]}')
                if data['dAlign']!='left' or data['spanAlign']!='left' or data['sAlign']!='left': errors.append(f'{tag}: text alignment')
                if data['strongWeight']<=data['spanWeight']: errors.append(f'{tag}: destination emphasis')
                if data['svgVisible']!=0: errors.append(f'{tag}: legacy SVG visible')
                if abs(data['pinW']-14)>1.5 or not data['pinMask'] or data['pinMask']=='none': errors.append(f'{tag}: pin missing')
                if abs(data['daW']-12)>1.5 or abs(data['daH']-8)>1.5 or data['daBg']=='none' or data['daBorder'] not in ('0px','medium') or data['daTransform']!='none': errors.append(f'{tag}: destination chevron malformed')
                if abs(data['oaW']-12)>1.5 or abs(data['oaH']-8)>1.5 or data['oaBg']=='none' or data['oaBorder'] not in ('0px','medium'): errors.append(f'{tag}: ordering chevron malformed')
                if data['daBg']!=data['oaBg'] or data['selectBg']!='none': errors.append(f'{tag}: duplicate/different ordering arrow')
                if data['pointerD']=='none' or data['pointerS']=='none' or data['disabled']: errors.append(f'{tag}: controls blocked')
                if samples:
                  for key in ('d','s','f'):
                    vals=[round(z[key]['w'],2) for z in samples]
                    if max(vals)-min(vals)>2: errors.append(f'{tag}: unstable {key} width {vals}')
                if w<=767:
                  expected=data['t']['w']-data['padL']-data['padR']
                  if abs(data['d']['w']-expected)>6 or abs(data['s']['w']-expected)>6 or abs(data['d']['w']-data['s']['w'])>3: errors.append(f'{tag}: mobile widths')
                  if abs(data['d']['h']-40)>2 or abs(data['s']['h']-40)>2: errors.append(f'{tag}: mobile heights')
                else:
                  if not 120<=data['d']['w']<=210: errors.append(f'{tag}: destination not intrinsic {data["d"]["w"]}')
                  if abs(data['f']['w']-248)>3 or abs(data['s']['w']-248)>3: errors.append(f'{tag}: ordering width')
                  if any(abs(data[k]['h']-38)>2 for k in ('d','f','s')): errors.append(f'{tag}: compact control heights')
                  centers=[data[k]['cy'] for k in ('c','d','f')]
                  if max(centers)-min(centers)>2: errors.append(f'{tag}: vertical centers {centers}')
                  if data['c']['r']>=data['d']['l']-4 or data['d']['r']>=data['f']['l']-4: errors.append(f'{tag}: controls overlap')
                if w==1024:
                  growth=page.evaluate('''() => {const d=Array.from(document.querySelectorAll('[data-mdo-destination-open],[data-mdo-ps-destination-open]')).find(e=>e.getClientRects().length);const s=d?.querySelector('strong');if(!d||!s)return null;const old=s.textContent,b=d.getBoundingClientRect().width;s.textContent='Estados Unidos';const a=d.getBoundingClientRect().width;s.textContent=old;return {b,a};}''')
                  if not growth or growth['a']<=growth['b']+15: errors.append(f'{tag}: destination does not grow {growth}')
                page.close()
            browser.close()

          if errors:
            print('ERRORS:'); print('\n'.join('- '+e for e in errors)); sys.exit(1)
          print('CATALOG_CONTROLS_PERFECT_ALIGNMENT_VERIFIED=true')
          print(f'checked={len(widths)*len(urls)} combinations; first-paint samples verified')
          PY

      - name: Roll back on failure
        if: failure() && env.TARGET != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "${EXISTED:-0}" = 1 ]; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 '$BACKUP' '$TARGET'; rm -f '$BACKUP'"
          else
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET'"
          fi

      - name: Remove backup
        if: success() && env.EXISTED == '1'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

name: Check public URLs for Mentta-exclusive products
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-mentta-exclusive-public-urls-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the same direct-URL behavior as customers
        run: |
          for SLUG in jamon-de-bellota-100-iberico-montjam-mentta pack-cafe-especialidad-esencia-costa-rica-ikore pack-cafe-especialidad-ruta-cuatro-origenes-ikore pack-cafe-especialidad-coleccion-completa-ikore; do
            CODE=$(curl -L -s -o /dev/null --connect-timeout 8 --max-time 18 -w '%{http_code}' "https://www.elmercadodeorigen.com/producto/$SLUG/" || true)
            echo "$SLUG HTTP=$CODE"
          done
      - name: Check externally accessible cover images for imported ham and six new packs
        run: |
          while IFS='|' read -r ID PATH_; do
            [ -n "$ID" ] || continue
            CODE=$(curl -L -sS -o /dev/null --connect-timeout 8 --max-time 20 -w '%{http_code}' "https://www.elmercadodeorigen.com$PATH_" || true)
            echo "COVER ID=$ID HTTP=$CODE"
          done <<'LIST'
          17129|/wp-content/uploads/2026/09/Jamon-de-bellota-100-iberico.jpg
          21814|/wp-content/uploads/mentta-musee-packs/pasaporte-salvaje-portada-premium-fotos-reales-9fe87bab6db080a98-v2.jpg
          21818|/wp-content/uploads/mentta-musee-packs/safari-africano-portada-premium-fotos-reales-a2cace54a8c37ade9-v2.jpg
          21820|/wp-content/uploads/mentta-musee-packs/vuelta-al-mundo-portada-premium-fotos-reales-df6c0918a7f84393d-v2.jpg
          21904|/wp-content/uploads/mentta-ikore-packs/pack-ikore-esencia-costa-rica-fotos-originales-sin-molienda-v2.jpg
          21906|/wp-content/uploads/mentta-ikore-packs/pack-ikore-ruta-cuatro-origenes-fotos-originales-sin-molienda-v2.jpg
          21908|/wp-content/uploads/mentta-ikore-packs/pack-ikore-coleccion-completa-fotos-originales-sin-molienda-v2.jpg
          LIST
      - name: Diagnose speed and HTTP status of private vs shareable pages
        run: |
          set +e
          for URI in \
            / \
            /producto/jamon-de-bellota-100-iberico-montjam-mentta/ \
            /producto/pack-musee-mentta-pasaporte-salvaje/ \
            /producto/pack-cafe-especialidad-esencia-costa-rica-ikore/ \
            /producto/pack-cafe-especialidad-coleccion-completa-ikore/
          do
            echo "CHECK_REQUEST $URI"
            curl -sS -L --connect-timeout 6 --max-time 16 -o /dev/null \
              -w "DIAG uri=$URI code=%{http_code} total=%{time_total} connect=%{time_connect} ttfb=%{time_starttransfer} redirect=%{num_redirects} bytes=%{size_download}\n" \
              "https://www.elmercadodeorigen.com$URI"
            echo "CURL_EXIT=$?"
          done

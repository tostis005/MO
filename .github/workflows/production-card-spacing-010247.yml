name: Production balanced product card spacing 0.10.247

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-card-spacing-010247.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy balanced card spacing
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l elmercadodeorigen-child/inc/product-card-density-final-010162.php
          grep -Fq '0.10.247: punto medio' elmercadodeorigen-child/inc/product-card-density-final-010162.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o ServerAliveInterval=20 -o ServerAliveCountMax=20 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o ServerAliveInterval=20 -o ServerAliveCountMax=20 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          TARGET="$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/product-card-density-final-010162.php"
          stamp=$(date +%Y%m%d%H%M%S)
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp '$TARGET' '$TARGET.bak-010247-$stamp'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/product-card-density-final-010162.php "$STAGING_USER@$STAGING_HOST:$TARGET"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$TARGET'
            wp_bin=\$(command -v wp || true)
            [ -z \"\$wp_bin\" ] || \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

      - name: Verify spacing in production
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/emo-card-spacing && cd /tmp/emo-card-spacing
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [1440,390]){
              const page=await browser.newPage({viewport:{width,height:1400}});
              await page.goto('https://www.elmercadodeorigen.com/tienda/?emoqa=010247-'+Date.now(),{waitUntil:'networkidle',timeout:120000});
              const q=await page.locator('ul.products li.product').first().evaluate(el=>{
                const title=el.querySelector('.product-loop-content > .woocommerce-loop-product__title');
                const price=el.querySelector('.product-loop-meta .price');
                const sold=el.querySelector('.product-loop-wrapper > .wcfmmp_sold_by_container');
                const tr=title.getBoundingClientRect(), pr=price.getBoundingClientRect(), sr=sold.getBoundingClientRect();
                const ss=getComputedStyle(sold);
                return {
                  titlePriceGap:+(pr.top-tr.bottom).toFixed(2),
                  priceSoldGap:+(sr.top-pr.bottom).toFixed(2),
                  soldMarginTop:ss.marginTop,
                  soldPaddingTop:ss.paddingTop
                };
              });
              console.log('CARD_SPACING_010247_'+width+'='+JSON.stringify(q));
              if(width===1440){
                if(!(q.titlePriceGap<=10 && q.priceSoldGap>=17 && q.priceSoldGap<=40 && q.soldMarginTop==='9px' && q.soldPaddingTop==='5px')) throw new Error('Desktop spacing QA failed');
              } else {
                if(!(q.titlePriceGap<=9 && q.priceSoldGap>=17 && q.priceSoldGap<=38 && q.soldMarginTop==='8px' && q.soldPaddingTop==='4px')) throw new Error('Mobile spacing QA failed');
              }
              await page.close();
            }
            await browser.close();
            console.log('PRODUCTION_CARD_SPACING_010247_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

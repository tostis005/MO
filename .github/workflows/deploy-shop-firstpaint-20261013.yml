name: Deploy shop first-paint stability 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-shop-firstpaint-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate conservative PHP patch
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/navidad-2026-promo.php
          php -l elmercadodeorigen-child/inc/mobile-catalog-interactions-final.php
          grep -Fq "emdo_navidad_shop_first_paint_20261013" elmercadodeorigen-child/inc/navidad-2026-promo.php
          grep -Fq "elmercado_shop_early_filter_markup_20261013" elmercadodeorigen-child/inc/mobile-catalog-interactions-final.php
      - name: Backup and deploy exactly two PHP files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$STAGING_PASSWORD" && test -n "$STAGING_REMOTE_PATH"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          export SSH_OPTS="-o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p $PORT"
          REMOTE="/tmp/emdo-shop-firstpaint-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no elmercadodeorigen-child/inc/navidad-2026-promo.php "$STAGING_USER@$STAGING_HOST:$REMOTE/navidad-2026-promo.php"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no elmercadodeorigen-child/inc/mobile-catalog-interactions-final.php "$STAGING_USER@$STAGING_HOST:$REMOTE/mobile-catalog-interactions-final.php"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$STAGING_REMOTE_PATH' '$REMOTE' '$GITHUB_RUN_ID'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          ROOT="$1"; UPLOAD="$2"; ID="$3"
          THEME="$ROOT/wp-content/themes/elmercadodeorigen-child/inc"
          BACKUP="/tmp/emdo-shop-firstpaint-backup-$ID"
          test -f "$ROOT/wp-config.php" && test -s "$THEME/navidad-2026-promo.php" && test -s "$THEME/mobile-catalog-interactions-final.php"
          mkdir -p "$BACKUP"
          cp -p "$THEME/navidad-2026-promo.php" "$BACKUP/navidad-2026-promo.php"
          cp -p "$THEME/mobile-catalog-interactions-final.php" "$BACKUP/mobile-catalog-interactions-final.php"
          PHP="$(command -v php)"
          "$PHP" -l "$UPLOAD/navidad-2026-promo.php"
          "$PHP" -l "$UPLOAD/mobile-catalog-interactions-final.php"
          rollback(){
            echo "RESTORE ORIGINAL FILES"
            cp -p "$BACKUP/navidad-2026-promo.php" "$THEME/navidad-2026-promo.php"
            cp -p "$BACKUP/mobile-catalog-interactions-final.php" "$THEME/mobile-catalog-interactions-final.php"
          }
          trap rollback ERR
          install -m0644 "$UPLOAD/navidad-2026-promo.php" "$THEME/navidad-2026-promo.php"
          install -m0644 "$UPLOAD/mobile-catalog-interactions-final.php" "$THEME/mobile-catalog-interactions-final.php"
          "$PHP" -l "$THEME/navidad-2026-promo.php"
          "$PHP" -l "$THEME/mobile-catalog-interactions-final.php"
          trap - ERR
          echo "DEPLOYED_TWO_FILES backup=$BACKUP"
          REMOTE_SCRIPT
      - name: Verify live HTML without query and that UI still works
        shell: bash
        run: |
          set -Eeuo pipefail
          SHOP='https://www.elmercadodeorigen.com/tienda/'
          for attempt in 1 2 3; do
            curl -fLsS --retry 2 --max-time 55 -o /tmp/emdo-shop-verify.html "$SHOP"
            if python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/emdo-shop-verify.html').read_text(errors='replace')
          m=re.search(r'<header\b[^>]*class=["\'][^"\']*emo-shop-title-block[^"\']*["\'][^>]*>\s*<aside\b[^>]*class=["\'][^"\']*emdo-navidad-promo',s,re.I)
          trigger=re.search(r'<button\b[^>]*class=["\'][^"\']*emo-mobile-filter-toggle[^"\']*["\'][^>]*data-emo-early-filter=["\']1["\']',s,re.I)
          if not m or not trigger: raise SystemExit(1)
          print('SHOP_INITIAL_HTML_BANNER_AND_FILTER_OK bytes=',len(s.encode()))
          PY
            then break; fi
            sleep 3
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/emdo-shop-verify.html').read_text(errors='replace')
          assert re.search(r'<header\b[^>]*class=["\'][^"\']*emo-shop-title-block[^"\']*["\'][^>]*>\s*<aside\b[^>]*class=["\'][^"\']*emdo-navidad-promo',s,re.I)
          assert re.search(r'<button\b[^>]*data-emo-early-filter=["\']1["\']',s,re.I)
          assert 'woostify-sorting' in s and 'ul class="products' in s
          PY
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          cat >/tmp/emdo-verify-firstpaint.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [mode,vp] of [['mobile',{width:390,height:844}],['desktop',{width:1365,height:900}]]){
              const p=await b.newPage({viewport:vp});
              await p.addInitScript(()=>{
                window.__cls=0;
                try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__cls+=e.value;}).observe({type:'layout-shift',buffered:true});}catch(e){}
              });
              const errors=[];p.on('pageerror',e=>errors.push(String(e).slice(0,120)));
              const res=await p.goto('https://www.elmercadodeorigen.com/tienda/',{waitUntil:'domcontentloaded',timeout:65000});
              await p.waitForTimeout(1600);
              const d=await p.evaluate(()=>{
                const banner=document.querySelector('aside.emdo-navidad-promo--shop');
                const toggle=document.querySelector('.emo-mobile-filter-toggle');
                const rows=document.querySelector('ul.products');
                return{cls:+window.__cls.toFixed(4),bannerCount:document.querySelectorAll('aside.emdo-navidad-promo--shop').length,
                  bannerAtTop:banner?.parentElement?.classList.contains('emo-shop-title-block')&&banner?.parentElement?.firstElementChild===banner,
                  earlyFilter:toggle?.dataset.emoEarlyFilter==='1',filterCount:document.querySelectorAll('.emo-mobile-filter-toggle').length,
                  productsCount:rows?.querySelectorAll(':scope>li.product').length,productsCols:getComputedStyle(rows).gridTemplateColumns,
                  productWidth:rows?.getBoundingClientRect().width,bodyWidth:document.documentElement.scrollWidth};
              });
              console.log(mode+' HTTP='+res.status()+' '+JSON.stringify(d)+' pageErrors='+JSON.stringify(errors.slice(0,2)));
              if(res.status()!==200||d.bannerCount!==1||!d.bannerAtTop||!d.earlyFilter||d.filterCount!==1||!d.productsCount||errors.length)throw Error('Shop regression '+mode);
              if(mode==='mobile'){
                if(d.cls>0.10)throw Error('Excessive mobile CLS: '+d.cls);
                await p.locator('.emo-mobile-filter-toggle').click();
                const expanded=await p.locator('.emo-mobile-filter-toggle').getAttribute('aria-expanded');
                const shell=await p.locator('.emo-mobile-filter-shell').first().isVisible();
                console.log('MOBILE_FILTER_CLICK expanded='+expanded+' shellVisible='+shell);
                if(expanded!=='true'||!shell)throw Error('Shop filter drawer is not working');
                await p.locator('.emo-mobile-filter-close').first().click();
                if(await p.locator('.emo-mobile-filter-toggle').getAttribute('aria-expanded')!=='false')throw Error('Drawer close failed');
              }else if(d.productWidth<500)throw Error('Desktop grid is compressed');
              await p.close();
            }
            await b.close();console.log('PASS: mobile and desktop stable, identical banner, responsive catalog, filter drawer interactive.');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node /tmp/emdo-verify-firstpaint.cjs
      - name: Restore previous production PHP if any check failed
        if: failure()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          BACKUP="/tmp/emdo-shop-firstpaint-backup-${GITHUB_RUN_ID}"
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$STAGING_REMOTE_PATH"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" "bash -s -- '$STAGING_REMOTE_PATH' '$BACKUP'" <<'REMOTE_ROLLBACK'
          set -e
          ROOT="$1"; BACKUP="$2"; TARGET="$ROOT/wp-content/themes/elmercadodeorigen-child/inc"
          if [ -s "$BACKUP/navidad-2026-promo.php" ] && [ -s "$BACKUP/mobile-catalog-interactions-final.php" ]; then
            cp -p "$BACKUP/navidad-2026-promo.php" "$TARGET/navidad-2026-promo.php"
            cp -p "$BACKUP/mobile-catalog-interactions-final.php" "$TARGET/mobile-catalog-interactions-final.php"
            echo "ROLLBACK_RESTORED"
          else
            echo "No deployment backup found; no rollback needed"
          fi
          REMOTE_ROLLBACK

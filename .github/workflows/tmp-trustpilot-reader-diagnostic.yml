name: Temporary Trustpilot Reader diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch Trustpilot all-language pages
        shell: bash
        run: |
          set -euo pipefail
          for spec in es1 es8 all1 all2 all8 all9 all10; do
            case "$spec" in
              es1) target='https://es.trustpilot.com/review/elmercadodeorigen.com?sort=recency' ;;
              es8) target='https://es.trustpilot.com/review/elmercadodeorigen.com?page=8&sort=recency' ;;
              all1) target='https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&sort=recency' ;;
              all2) target='https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&page=2&sort=recency' ;;
              all8) target='https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&page=8&sort=recency' ;;
              all9) target='https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&page=9&sort=recency' ;;
              all10) target='https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&page=10&sort=recency' ;;
            esac
            curl -LfsS --max-time 55 \
              -H 'Accept: application/json' \
              -H 'X-Engine: browser' \
              -H 'X-Respond-With: markdown' \
              -H 'X-Retain-Images: alt' \
              -H 'X-No-Cache: true' \
              -H 'X-Timeout: 35' \
              "https://r.jina.ai/$target" -o "/tmp/$spec.json" || true
          done

      - name: Summarize Reader structures
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          for path in sorted(pathlib.Path('/tmp').glob('es*.json')) + sorted(pathlib.Path('/tmp').glob('all*.json')):
              raw = path.read_text('utf-8', errors='replace')
              try:
                  data = json.loads(raw)
                  text = ((data.get('data') or {}).get('content') or data.get('content') or '')
              except Exception:
                  text = raw
              marker=text.lower().rfind('todas las opiniones')
              tail=text[marker:] if marker >= 0 else text
              ratings=re.findall(r'(?:Valorad[^\n]*?[1-5][^\n]*(?:estrella|sobre 5)|Rated[^\n]*?[1-5][^\n]*(?:star|out of 5))', tail, re.I)
              review_links=re.findall(r'/reviews/([A-Za-z0-9_-]{8,})', tail)
              print(f'=== {path.stem} bytes={len(text)} tail_bytes={len(tail)} ratings_after_all={len(ratings)} review_links_after_all={len(set(review_links))} ===')
              for line in tail.splitlines()[:45]:
                  if line.strip(): print(line[:320])
          PY

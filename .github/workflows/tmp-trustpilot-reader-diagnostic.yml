name: Temporary EMDO legacy Google matching diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Match legacy Google rows in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $table = MDO_Database::table( "reviews" );
            $legacy = $wpdb->get_results( "SELECT * FROM {$table} WHERE source=\"google\" AND (source_review_id NOT LIKE \"trustindex-%\" OR source_review_id IS NULL) ORDER BY id" );
            $fresh = $wpdb->get_results( "SELECT * FROM {$table} WHERE source=\"google\" AND source_review_id LIKE \"trustindex-%\" ORDER BY id" );
            $norm = new ReflectionMethod( "MDO_Reviews", "normalize_text" );
            $norm->setAccessible( true );
            foreach ( $legacy as $old ) {
              $oa = $norm->invoke( null, (string) $old->author_name );
              $ot = $norm->invoke( null, (string) $old->review_text );
              $od = $old->review_date ? substr( (string) $old->review_date, 0, 10 ) : "";
              $candidates = array();
              foreach ( $fresh as $new ) {
                $nd = $new->review_date ? substr( (string) $new->review_date, 0, 10 ) : "";
                if ( (int) $new->rating !== (int) $old->rating || $nd !== $od ) { continue; }
                $na = $norm->invoke( null, (string) $new->author_name );
                $nt = $norm->invoke( null, (string) $new->review_text );
                $author_match = "" !== $oa && $oa === $na;
                $text_match = "" !== $ot && $ot === $nt;
                $empty_text_pair = "" === $ot && "" === $nt;
                $score = ( $author_match ? 2 : 0 ) + ( $text_match ? 4 : 0 ) + ( $empty_text_pair ? 1 : 0 );
                if ( $score > 0 ) {
                  $candidates[] = array( "id" => (int) $new->id, "source_review_id" => (string) $new->source_review_id, "score" => $score, "author_match" => $author_match, "text_match" => $text_match, "empty_text_pair" => $empty_text_pair, "vendor" => (int) $new->vendor_user_id, "status" => (string) $new->status );
                }
              }
              usort( $candidates, static fn( $a, $b ) => $b["score"] <=> $a["score"] );
              echo "LEGACY_MATCH=" . wp_json_encode( array(
                "legacy_id" => (int) $old->id,
                "legacy_source_review_id" => (string) $old->source_review_id,
                "date" => $od,
                "rating" => (int) $old->rating,
                "legacy_text_len" => strlen( (string) $old->review_text ),
                "candidate_count" => count( $candidates ),
                "top" => array_slice( $candidates, 0, 3 ),
              ) ) . PHP_EOL;
            }
          ' --path="$PROD_PATH" --allow-root
          REMOTE

name: Temporary Trustindex Google DOM diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Trustindex review card DOM
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || npx playwright install chromium >/dev/null 2>&1
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p => require('fs').existsSync(p));
            const browser = await chromium.launch(executablePath ? { headless:true, executablePath, args:['--no-sandbox','--disable-dev-shm-usage'] } : { headless:true });
            const page = await browser.newPage({ userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' });
            await page.goto('https://www.trustindex.io/reviews/www.elmercadodeorigen.com', {waitUntil:'domcontentloaded', timeout:90000});
            await page.waitForTimeout(1200);
            const result = await page.evaluate(() => {
              const card = document.querySelector('.ti-review-item.source-Google, .ti-review-item');
              const named = Array.from(document.querySelectorAll('body *')).find(el => (el.textContent || '').trim() === 'Daviz Vázquez');
              const classHits = card ? Array.from(card.querySelectorAll('*')).filter(el => /Daviz Vázquez|2026\.07\.12/.test((el.textContent || '').trim())).slice(0,20).map(el => ({tag:el.tagName, cls:el.className, text:(el.textContent||'').trim().slice(0,160)})) : [];
              return {
                cardClass: card?.className || '',
                cardText: (card?.innerText || card?.textContent || '').replace(/\s+/g,' ').trim().slice(0,1200),
                cardHtml: (card?.outerHTML || '').slice(0,8000),
                exactName: named ? {tag:named.tagName, cls:named.className, parentTag:named.parentElement?.tagName || '', parentClass:named.parentElement?.className || ''} : null,
                classHits,
              };
            });
            console.log('TRUSTINDEX_DOM='+JSON.stringify(result));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

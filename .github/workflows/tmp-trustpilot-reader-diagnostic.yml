name: Temporary EMDO review cleanup diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining duplicate fingerprints in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $table = MDO_Database::table( "reviews" );
            echo "PLUGIN_VERSION=" . MDO_SUPPLIER_SYNC_VERSION . PHP_EOL;
            echo "MIGRATION_OPTION=" . wp_json_encode( get_option( "mdo_reviews_migration_1038", "" ) ) . PHP_EOL;
            $fps = $wpdb->get_col( "SELECT content_fingerprint FROM {$table} WHERE content_fingerprint IS NOT NULL AND content_fingerprint<>\"\" GROUP BY content_fingerprint HAVING COUNT(*)>1 ORDER BY content_fingerprint" );
            echo "DUP_GROUP_COUNT=" . count( $fps ) . PHP_EOL;
            foreach ( $fps as $fp ) {
              $rows = $wpdb->get_results( $wpdb->prepare(
                "SELECT id,source,source_review_id,source_key,status,validation_method,vendor_user_id,suggested_vendor_user_id,product_id,order_id,author_name,rating,review_title,review_text,review_date,created_at,updated_at,content_fingerprint FROM {$table} WHERE content_fingerprint=%s ORDER BY id",
                $fp
              ) );
              echo "DUP_GROUP=" . wp_json_encode( array( "fingerprint" => $fp, "rows" => $rows ) ) . PHP_EOL;
            }
            $woo = $wpdb->get_row( $wpdb->prepare( "SELECT id,source_review_id,source_key,status,validation_method,product_id,vendor_user_id,author_name,rating,review_text,review_date,content_fingerprint FROM {$table} WHERE source=%s AND source_review_id=%s", "woocommerce_product", "8352" ) );
            echo "WOO_8352=" . wp_json_encode( $woo ) . PHP_EOL;
          ' --path="$PROD_PATH" --allow-root
          REMOTE

name: Temporary EMDO admin inline diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline review admin wiring in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            $plugin_dir = MDO_SUPPLIER_SYNC_PATH;
            $checks = array(
              "class_loaded" => class_exists( "MDO_Reviews_Admin_Inline" ),
              "js_exists" => file_exists( $plugin_dir . "assets/reviews-admin-inline.js" ),
              "ajax_data_hook" => has_action( "wp_ajax_mdo_reviews_inline_data", array( "MDO_Reviews_Admin_Inline", "ajax_data" ) ),
              "ajax_save_hook" => has_action( "wp_ajax_mdo_reviews_inline_save", array( "MDO_Reviews_Admin_Inline", "ajax_save" ) ),
              "enqueue_hook" => has_action( "admin_enqueue_scripts", array( "MDO_Reviews_Admin_Inline", "enqueue_assets" ) ),
            );
            echo "ADMIN_INLINE=" . wp_json_encode( $checks ) . PHP_EOL;
            foreach ( $checks as $key => $value ) {
              if ( ! $value ) { fwrite( STDERR, "ADMIN_INLINE_FAIL={$key}\n" ); exit(41); }
            }
            $js = file_get_contents( $plugin_dir . "assets/reviews-admin-inline.js" );
            $tokens = array( "mdo_reviews_inline_data", "mdo_reviews_inline_save", "vendor_user_id", "review_id", "status" );
            foreach ( $tokens as $token ) {
              if ( false === strpos( $js, $token ) ) { fwrite( STDERR, "ADMIN_JS_TOKEN_MISSING={$token}\n" ); exit(42); }
            }
            echo "ADMIN_JS_TOKENS_OK=" . count( $tokens ) . PHP_EOL;
          ' --path="$PROD_PATH" --allow-root
          REMOTE

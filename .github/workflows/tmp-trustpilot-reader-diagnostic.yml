name: Temporary Trustpilot Reader diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || npx playwright install chromium >/dev/null 2>&1

      - name: Diagnose Trustpilot browser pagination
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const executablePath = require('fs').existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : (require('fs').existsSync('/usr/bin/google-chrome-stable') ? '/usr/bin/google-chrome-stable' : undefined);
            const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            const context = await browser.newContext({ locale: 'es-ES', userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36' });
            const page = await context.newPage();
            for (const n of [1,2,7,8,9]) {
              const url = `https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&page=${n}&sort=recency`;
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(4000);
                const result = await page.evaluate(() => {
                  const selectors = [
                    'article[data-service-review-card-paper]',
                    '[data-service-review-card-paper]',
                    'article',
                    '[data-service-review-card]'
                  ];
                  const counts = Object.fromEntries(selectors.map(s => [s, document.querySelectorAll(s).length]));
                  const next = document.querySelector('script#__NEXT_DATA__');
                  let nextReviews = null, nextTotal = null, nextPages = null;
                  if (next?.textContent) {
                    try {
                      const d = JSON.parse(next.textContent);
                      const pp = d?.props?.pageProps || {};
                      nextReviews = Array.isArray(pp.reviews) ? pp.reviews.length : null;
                      nextTotal = pp?.businessUnit?.numberOfReviews ?? pp?.filters?.pagination?.totalCount ?? null;
                      nextPages = pp?.filters?.pagination?.totalPages ?? null;
                    } catch {}
                  }
                  const body = (document.body?.innerText || '').slice(0, 1200);
                  return { title: document.title, href: location.href, counts, nextLength: next?.textContent?.length || 0, nextReviews, nextTotal, nextPages, body };
                });
                console.log('TP_PLAYWRIGHT_PAGE=' + n + ' ' + JSON.stringify(result));
              } catch (err) {
                console.log('TP_PLAYWRIGHT_ERROR=' + n + ' ' + String(err));
              }
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

name: Temporary EMDO review cleanup diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cleanup preconditions in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $table = MDO_Database::table( "reviews" );
            $targets = array( 242, 243, 245, 247, 248, 250 );
            foreach ( $targets as $id ) {
              $row = $wpdb->get_row( $wpdb->prepare( "SELECT id,source,source_review_id,status,validation_method,vendor_user_id,suggested_vendor_user_id,content_fingerprint,author_name,rating,review_date FROM {$table} WHERE id=%d", $id ) );
              if ( ! $row ) { echo "TARGET_MISSING={$id}\n"; continue; }
              $matches = (int) $wpdb->get_var( $wpdb->prepare( "SELECT COUNT(*) FROM {$table} WHERE id<>%d AND source=%s AND source_review_id LIKE %s AND content_fingerprint=%s", $id, "google", "trustindex-%", (string) $row->content_fingerprint ) );
              echo "TARGET=" . wp_json_encode( array(
                "id" => (int) $row->id,
                "source_review_id" => (string) $row->source_review_id,
                "status" => (string) $row->status,
                "validation_method" => (string) $row->validation_method,
                "vendor" => (int) $row->vendor_user_id,
                "suggested_vendor" => (int) $row->suggested_vendor_user_id,
                "fingerprint" => (string) $row->content_fingerprint,
                "canonical_matches" => $matches,
                "author" => (string) $row->author_name,
                "rating" => (int) $row->rating,
                "date" => (string) $row->review_date,
              ) ) . PHP_EOL;
            }

            $woo_rows = $wpdb->get_col( "SELECT DISTINCT CAST(c.comment_ID AS CHAR) FROM {$wpdb->comments} c INNER JOIN {$wpdb->posts} p ON p.ID=c.comment_post_ID AND p.post_type=\"product\" INNER JOIN {$wpdb->commentmeta} cm ON cm.comment_id=c.comment_ID AND cm.meta_key=\"rating\" WHERE c.comment_approved=\"1\" AND CAST(cm.meta_value AS DECIMAL(4,2))>0 ORDER BY c.comment_ID" );
            $mdo_rows = $wpdb->get_col( $wpdb->prepare( "SELECT source_review_id FROM {$table} WHERE source=%s ORDER BY CAST(source_review_id AS UNSIGNED)", "woocommerce_product" ) );
            $missing = array_values( array_diff( array_map( "strval", $woo_rows ), array_map( "strval", $mdo_rows ) ) );
            $extra = array_values( array_diff( array_map( "strval", $mdo_rows ), array_map( "strval", $woo_rows ) ) );
            echo "WOO_SOURCE_COUNT=" . count( $woo_rows ) . PHP_EOL;
            echo "WOO_MDO_COUNT=" . count( $mdo_rows ) . PHP_EOL;
            echo "WOO_MISSING_IDS=" . wp_json_encode( $missing ) . PHP_EOL;
            echo "WOO_EXTRA_IDS=" . wp_json_encode( $extra ) . PHP_EOL;
            foreach ( $missing as $comment_id ) {
              $detail = $wpdb->get_row( $wpdb->prepare( "SELECT c.comment_ID,c.comment_author,c.comment_author_email,c.comment_content,c.comment_date,c.comment_date_gmt,p.ID product_id,p.post_author vendor_id,MAX(CAST(cm.meta_value AS DECIMAL(4,2))) rating FROM {$wpdb->comments} c INNER JOIN {$wpdb->posts} p ON p.ID=c.comment_post_ID AND p.post_type=\"product\" INNER JOIN {$wpdb->commentmeta} cm ON cm.comment_id=c.comment_ID AND cm.meta_key=\"rating\" WHERE c.comment_ID=%d AND c.comment_approved=\"1\" GROUP BY c.comment_ID", (int) $comment_id ) );
              echo "WOO_MISSING_DETAIL=" . wp_json_encode( $detail ) . PHP_EOL;
            }
            echo "MIGRATION_OPTION=" . wp_json_encode( get_option( "mdo_reviews_migration_1038", "" ) ) . PHP_EOL;
            echo "OLD_CRON_NEXT=" . wp_json_encode( wp_next_scheduled( "mdo_reviews_daily_import" ) ) . PHP_EOL;
            echo "OLD_SEED_NEXT=" . wp_json_encode( wp_next_scheduled( "mdo_reviews_seed_import" ) ) . PHP_EOL;
          ' --path="$PROD_PATH" --allow-root
          REMOTE

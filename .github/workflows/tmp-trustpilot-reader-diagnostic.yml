name: Temporary EMDO review dedupe diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit production review collisions
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          prefix=$("$php_bin" -d memory_limit=512M "$wp_bin" db prefix --path="$PROD_PATH" --allow-root)
          table="${prefix}mdo_reviews"
          echo '=== SOURCE COUNTS ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT source,COUNT(*) total FROM ${table} GROUP BY source ORDER BY source" --skip-column-names --path="$PROD_PATH" --allow-root
          echo '=== GOOGLE ID FAMILIES ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT CASE WHEN source_review_id LIKE 'trustindex-%' THEN 'trustindex' WHEN source_review_id IS NULL OR source_review_id='' THEN 'empty' ELSE 'legacy' END family,COUNT(*) total FROM ${table} WHERE source='google' GROUP BY family ORDER BY family" --skip-column-names --path="$PROD_PATH" --allow-root
          echo '=== DUPLICATE FINGERPRINT GROUPS ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT LEFT(content_fingerprint,16) fp,COUNT(*) c,GROUP_CONCAT(CONCAT(id,':',source,':',COALESCE(source_review_id,''),':p',COALESCE(wc_product_id,0),':v',COALESCE(vendor_user_id,0),':',status,':',COALESCE(validation_method,''),':',COALESCE(DATE(review_date),'0000-00-00')) ORDER BY id SEPARATOR ' | ') rowspec FROM ${table} WHERE content_fingerprint IS NOT NULL AND content_fingerprint<>'' GROUP BY content_fingerprint HAVING COUNT(*)>1 ORDER BY c DESC,fp" --skip-column-names --path="$PROD_PATH" --allow-root
          echo '=== CROSS SOURCE FINGERPRINT GROUPS ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT LEFT(content_fingerprint,16) fp,COUNT(*) c,COUNT(DISTINCT source) sources,GROUP_CONCAT(DISTINCT source ORDER BY source SEPARATOR ',') source_list,GROUP_CONCAT(CONCAT(id,':',source,':',COALESCE(source_review_id,''),':p',COALESCE(wc_product_id,0),':v',COALESCE(vendor_user_id,0),':',status) ORDER BY id SEPARATOR ' | ') rowspec FROM ${table} WHERE content_fingerprint IS NOT NULL AND content_fingerprint<>'' GROUP BY content_fingerprint HAVING COUNT(DISTINCT source)>1 ORDER BY c DESC,fp" --skip-column-names --path="$PROD_PATH" --allow-root
          echo '=== LEGACY GOOGLE ROWS ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT id,COALESCE(source_review_id,''),rating,COALESCE(DATE(review_date),'0000-00-00'),LENGTH(COALESCE(review_text,'')),LEFT(content_fingerprint,16),status,COALESCE(validation_method,'') FROM ${table} WHERE source='google' AND (source_review_id NOT LIKE 'trustindex-%' OR source_review_id IS NULL) ORDER BY id" --skip-column-names --path="$PROD_PATH" --allow-root
          REMOTE

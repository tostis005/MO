name: Temporary Trustpilot Reader diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable || npx playwright install chromium >/dev/null 2>&1

      - name: Inspect Trustpilot counters
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : (fs.existsSync('/usr/bin/google-chrome-stable') ? '/usr/bin/google-chrome-stable' : undefined);
            const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });
            const context = await browser.newContext({ locale: 'es-ES', userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36' });
            const page = await context.newPage();
            await page.goto('https://es.trustpilot.com/review/elmercadodeorigen.com?languages=all&sort=recency', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(3500);
            const result = await page.evaluate(() => {
              const next = document.querySelector('script#__NEXT_DATA__');
              if (!next?.textContent) return { error: 'NEXT_DATA missing' };
              const d = JSON.parse(next.textContent);
              const pp = d?.props?.pageProps || {};
              const matches = [];
              function walk(value, path = 'pageProps', depth = 0) {
                if (depth > 5 || value == null) return;
                if (Array.isArray(value)) return;
                if (typeof value !== 'object') return;
                for (const [key, child] of Object.entries(value)) {
                  const p = `${path}.${key}`;
                  if (/(review|rating|score|star|count|total|page)/i.test(key) && (child == null || ['string','number','boolean'].includes(typeof child))) {
                    matches.push([p, child]);
                  }
                  if (depth < 5 && child && typeof child === 'object' && !Array.isArray(child)) walk(child, p, depth + 1);
                }
              }
              walk(pp);
              return {
                businessUnit: pp.businessUnit,
                pagination: pp.filters?.pagination,
                matches: matches.slice(0, 250),
                reviewsLength: Array.isArray(pp.reviews) ? pp.reviews.length : null,
              };
            });
            console.log('TP_COUNTERS=' + JSON.stringify(result));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

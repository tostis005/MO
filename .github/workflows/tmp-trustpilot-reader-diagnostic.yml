name: Temporary Trustpilot Reader diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-trustpilot-reader-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Diagnose EMDO importer in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $table = MDO_Database::table( "reviews" );
            $count_key = "mdo_trustpilot_review_count";
            $rating_key = "mdo_trustpilot_rating";
            $had_count = false !== get_option( $count_key, false );
            $had_rating = false !== get_option( $rating_key, false );
            $old_count = get_option( $count_key, null );
            $old_rating = get_option( $rating_key, null );
            $payload = array(
              "source" => "trustpilot",
              "mode" => "full",
              "reported_count" => 2,
              "rating" => 4.6,
              "reviews" => array(
                array("id"=>"emdo-diag-001","author_name"=>"EMDO Diagnostic A","rating"=>5,"title"=>"Diagnostic A","text"=>"EMDO persistence diagnostic unique text alpha 20260916","date"=>"2026-09-16T12:00:00+00:00","source_url"=>"https://example.invalid/emdo-diag-001"),
                array("id"=>"emdo-diag-002","author_name"=>"EMDO Diagnostic B","rating"=>4,"title"=>"Diagnostic B","text"=>"EMDO persistence diagnostic unique text beta 20260916","date"=>"2026-09-16T12:01:00+00:00","source_url"=>"https://example.invalid/emdo-diag-002")
              )
            );
            $result = MDO_Reviews_Scraping::import_payload( $payload );
            echo "DIAG_IMPORT_RESULT=" . wp_json_encode( $result ) . PHP_EOL;
            echo "DIAG_WPDB_ERROR=" . $wpdb->last_error . PHP_EOL;
            $rows = $wpdb->get_results( "SELECT id,source,source_review_id,status,validation_method,source_key,content_fingerprint FROM {$table} WHERE source_review_id IN (\"emdo-diag-001\",\"emdo-diag-002\") ORDER BY id", ARRAY_A );
            echo "DIAG_ROWS=" . wp_json_encode( $rows ) . PHP_EOL;
            $wpdb->query( "DELETE FROM {$table} WHERE source_review_id IN (\"emdo-diag-001\",\"emdo-diag-002\")" );
            if ( $had_count ) { update_option( $count_key, $old_count, false ); } else { delete_option( $count_key ); }
            if ( $had_rating ) { update_option( $rating_key, $old_rating, false ); } else { delete_option( $rating_key ); }
            $remaining = (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE source_review_id IN (\"emdo-diag-001\",\"emdo-diag-002\")" );
            echo "DIAG_CLEANUP_REMAINING={$remaining}" . PHP_EOL;
            echo "DIAG_RESTORED_COUNT=" . wp_json_encode( get_option( $count_key, null ) ) . PHP_EOL;
          ' --path="$PROD_PATH" --allow-root
          REMOTE

name: Accelerate Selectos import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accelerate-selectos-import-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accelerate-selectos-import
  cancel-in-progress: false

jobs:
  accelerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Run three extra EMDO queue workers
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -Eeuo pipefail
          PROD_PATH="$1"
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp_bin=$(command -v wp)
          test -n "$php_bin"
          test -n "$wp_bin"

          run_worker() {
            worker="$1"
            "$php_bin" -d memory_limit=768M "$wp_bin" action-scheduler run               --group=mdo-supplier-sync               --batch-size=5               --batches=0               --force               --path="$PROD_PATH"               --allow-root               >"/tmp/selectos-worker-$worker.log" 2>&1
          }

          pids=""
          for worker in 1 2 3; do
            run_worker "$worker" &
            pids="$pids $!"
          done

          rc=0
          for pid in $pids; do
            wait "$pid" || rc=1
          done

          for worker in 1 2 3; do
            echo "===== worker $worker ====="
            tail -n 30 "/tmp/selectos-worker-$worker.log" || true
            rm -f "/tmp/selectos-worker-$worker.log"
          done
          exit "$rc"
          REMOTE


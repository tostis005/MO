name: Diagnose editorial SEO 24 posts 20261021
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/diagnose-editorial-24-20261021.php'
      - '.github/workflows/diagnose-editorial-seo-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: php -l .github/scripts/diagnose-editorial-24-20261021.php
      - name: Probe live WordPress safely
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-diag-editorial-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/diagnose-editorial-24-20261021.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" | tee /tmp/probe.log
          grep -q '^EMDO_REPAIR_DIAG ' /tmp/probe.log
      - name: Inspect live SEO head and heading snippets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          pages=['https://www.elmercadodeorigen.com/cafe-arabica-robusta-diferencias-cual-elegir/',
                 'https://www.elmercadodeorigen.com/en/arabica-vs-robusta-coffee-differences-which-to-buy/']
          for url in pages:
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Editorial quality check'})
                  with urllib.request.urlopen(request,timeout=45) as res: page=res.read(3000000).decode('utf-8','replace')
                  h=re.findall(r'<h1\\b[^>]*>[\\s\\S]*?</h1>',page,re.I)
                  print('HEADINGS_URL',url,'H1_COUNT',len(h))
                  for value in h:print('H1_FRAGMENT',re.sub(r'\\s+',' ',value)[:700])
                  for value in re.findall(r'<meta[^>]+(?:og:image|twitter:image)[^>]*>',page,re.I)[:8]:print('IMAGE_META',value[:500])
                  for value in re.findall(r'<link[^>]*hreflang[^>]*>',page,re.I)[:5]:print('HREFLANG',value[:550])
              except Exception as e:print('SEO_FETCH_ERROR',url,repr(e))
          PY

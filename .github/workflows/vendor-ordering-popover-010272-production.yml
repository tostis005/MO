name: Vendor ordering popover 0.10.272 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-ordering-popover-010272-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-test-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate payload
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-popover-010272.php >/dev/null
          grep -Fq 'elmercado-vendor-ordering-popover-script-010272' elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-popover-010272.php

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy popover
        id: deploy
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          TARGET="$MU_DIR/elmercado-vendor-ordering-popover-010272.php"
          REMOTE="/tmp/elmercado-vendor-ordering-popover-010272-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-popover-010272.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -euo pipefail
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$REMOTE' >/dev/null
            mkdir -p '$MU_DIR'; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'
            grep -Fq 'elmercado-vendor-ordering-popover-script-010272' '$TARGET'
            wp_bin=\$(command -v wp || true); [ -n \"\$wp_bin\" ] && \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "
          PROBE="elmercado-opcache-order-popover-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          curl -fsSL --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID" >/dev/null || true
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" || true

      - name: Confirm popover rendered
        id: render
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL --max-time 30 -A 'Mozilla/5.0 EMDO order popover verifier' -H 'Cache-Control: no-store' "$BASE_URL/tienda/1957/?order-popover=$GITHUB_RUN_ID-$i" -o /tmp/live.html || true
            if grep -Fq 'elmercado-vendor-ordering-popover-script-010272' /tmp/live.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1

      - name: Tap open and select another ordering option
        id: browser
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node <<'NODE' > /tmp/order-popover-result.json 2>&1
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=(m,d)=>{throw new Error(m+' '+JSON.stringify(d));};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setCacheEnabled(false);
            await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await page.goto(`${process.env.BASE_URL}/tienda/1957/?order-popover-browser=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('.mdo-vendor-order-button',{visible:true,timeout:30000});
            await sleep(700);

            const before=await page.evaluate(()=>{
              const b=document.querySelector('.mdo-vendor-order-button');
              const s=document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select');
              const br=b.getBoundingClientRect(); const bs=getComputedStyle(b); const ss=getComputedStyle(s);
              const top=document.elementFromPoint(br.left+br.width/2,br.top+br.height/2);
              return {button:{left:br.left,top:br.top,width:br.width,height:br.height,text:b.textContent.trim(),display:bs.display},buttonTopIsButton:top===b,select:{value:s.value,index:s.selectedIndex,opacity:ss.opacity,pointer:ss.pointerEvents,width:s.getBoundingClientRect().width,height:s.getBoundingClientRect().height},options:[...s.options].map(o=>({value:o.value,text:o.textContent.trim()}))};
            });
            if(!before.buttonTopIsButton||before.button.width<120||before.button.height<38)fail('custom order button is not tappable',before);
            if(before.options.length<2)fail('not enough order options',before);

            await page.touchscreen.tap(before.button.left+before.button.width/2,before.button.top+before.button.height/2);
            await sleep(350);
            const opened=await page.evaluate(()=>{
              const b=document.querySelector('.mdo-vendor-order-button');
              const m=document.querySelector('.mdo-vendor-order-menu:not([hidden])');
              if(!m)return{expanded:b?.getAttribute('aria-expanded'),exists:false};
              const r=m.getBoundingClientRect(),s=getComputedStyle(m); return{expanded:b.getAttribute('aria-expanded'),exists:true,width:r.width,height:r.height,display:s.display,visibility:s.visibility,options:[...m.querySelectorAll('.mdo-vendor-order-option')].map(x=>({value:x.dataset.value,text:x.textContent.trim(),current:x.getAttribute('aria-current')}))};
            });
            if(!opened.exists||opened.expanded!=='true'||opened.display==='none'||opened.visibility==='hidden'||opened.width<150||opened.height<80)fail('ordering menu did not open after touch',opened);

            const target=await page.evaluate(()=>{
              const s=document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select');
              const item=[...document.querySelectorAll('.mdo-vendor-order-menu:not([hidden]) .mdo-vendor-order-option')].find(x=>x.dataset.value!==s.value);
              if(!item)return null; const r=item.getBoundingClientRect(); return{value:item.dataset.value,text:item.textContent.trim(),left:r.left,top:r.top,width:r.width,height:r.height};
            });
            if(!target)fail('no alternate ordering item',target);

            const oldUrl=page.url();
            await page.touchscreen.tap(target.left+target.width/2,target.top+target.height/2);
            await sleep(2200);
            const after=await page.evaluate(()=>{
              const s=document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select');
              const b=document.querySelector('.mdo-vendor-order-button');
              return{value:s?.value||null,index:s?.selectedIndex??null,buttonText:b?.textContent.trim()||null,menuOpen:!!document.querySelector('.mdo-vendor-order-menu:not([hidden])')};
            }).catch(()=>({value:null,index:null,buttonText:null,menuOpen:null}));
            const changed=page.url()!==oldUrl||after.value===target.value;
            if(!changed)fail('tapping another order option did not change order',{oldUrl,newUrl:page.url(),before,target,after});

            console.log(JSON.stringify({ok:true,before,opened,target,after,oldUrl,newUrl:page.url()}));
            await browser.close();
          })().catch(err=>{console.error(JSON.stringify({ok:false,error:String(err.stack||err)}));process.exit(1)});
          NODE
          cat /tmp/order-popover-result.json

      - name: Record result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          mkdir -p .deploy-status
          cp /tmp/order-popover-result.json /tmp/order-popover-result-copy.json 2>/dev/null || true
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('/tmp/order-popover-result.json')
          payload=p.read_text(errors='replace')[-8000:] if p.exists() else ''
          out={'status':os.getenv('JOB_STATUS'),'run_id':os.getenv('GITHUB_RUN_ID'),'sha':os.getenv('GITHUB_SHA'),'deploy':os.getenv('DEPLOY_RESULT'),'render':os.getenv('RENDER_RESULT'),'browser':os.getenv('BROWSER_RESULT'),'payload':payload}
          pathlib.Path('.deploy-status/vendor-ordering-popover-010272-production.json').write_text(json.dumps(out,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/vendor-ordering-popover-010272-production.json
          git commit -m "Record vendor ordering popover verification $GITHUB_RUN_ID" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

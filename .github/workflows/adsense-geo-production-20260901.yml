name: Deploy switchable blog ads to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-geo-production-20260901.yml'
      - 'elmercadodeorigen-child/functions.php'
      - 'elmercadodeorigen-child/single.php'
      - 'elmercadodeorigen-child/inc/adsense-geo-010266.php'
      - 'elmercadodeorigen-child/assets/js/adsense-geo-010266.js'
      - 'elmercadodeorigen-child/inc/adsterra-blog-010290.php'
      - 'elmercadodeorigen-child/assets/js/adsterra-geo-010290.js'
      - 'elmercadodeorigen-child/assets/ad-geo-fast.php'
      - 'elmercadodeorigen-child/assets/adsterra-frame.html'
      - 'elmercadodeorigen-child/dropins/advanced-cache.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-ads-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate blog advertising files
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/functions.php
          php -l elmercadodeorigen-child/single.php
          php -l elmercadodeorigen-child/inc/adsense-geo-010266.php
          php -l elmercadodeorigen-child/inc/adsterra-blog-010290.php
          node --check elmercadodeorigen-child/assets/js/adsense-geo-010266.js
          node --check elmercadodeorigen-child/assets/js/adsterra-geo-010290.js
          php -l elmercadodeorigen-child/assets/ad-geo-fast.php
          php -l elmercadodeorigen-child/dropins/advanced-cache.php
          grep -q 'highrevenueformat.com' elmercadodeorigen-child/assets/adsterra-frame.html
          grep -q "ELMERCADO_BLOG_AD_PROVIDER', 'adsense'" elmercadodeorigen-child/functions.php
          grep -q 'a83b8ce6c354e77b2ae5f266936bd60f' elmercadodeorigen-child/assets/js/adsterra-geo-010290.js
          grep -q '4e02d145fdb84842713b24a4bade6244' elmercadodeorigen-child/assets/js/adsterra-geo-010290.js
          grep -q '3de18866861c081d6eb282ad00fe2bee' elmercadodeorigen-child/assets/js/adsterra-geo-010290.js

      - name: Deploy provider switch and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          tmp_root="/tmp/elmercado-blog-ads-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$tmp_root/inc' '$tmp_root/assets/js' '$tmp_root/dropins'"

          for file in             functions.php             single.php             inc/adsense-geo-010266.php             inc/adsterra-blog-010290.php             assets/js/adsense-geo-010266.js             assets/js/adsterra-geo-010290.js             assets/ad-geo-fast.php             assets/adsterra-frame.html
          do
            sshpass -e scp $SCP_OPTIONS "elmercadodeorigen-child/$file" "$STAGING_USER@$STAGING_HOST:$tmp_root/$file"
          done
          sshpass -e scp $SCP_OPTIONS "elmercadodeorigen-child/dropins/advanced-cache.php" "$STAGING_USER@$STAGING_HOST:$tmp_root/dropins/advanced-cache.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$tmp_root'" <<'REMOTE'
          set -euo pipefail
          tmp_root="$1"
          cleanup() { rm -rf "$tmp_root"; }
          trap cleanup EXIT

          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          [ -n "$wp_bin" ] || { echo "WP-CLI not found"; exit 1; }

          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?production path not found}"

          stylesheet=$("$php_bin" -d memory_limit=256M "$wp_bin" option get stylesheet --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null)
          theme_path="$prod_path/wp-content/themes/$stylesheet"
          stamp=$(date +%Y%m%d%H%M%S)

          "$php_bin" -l "$tmp_root/functions.php"
          "$php_bin" -l "$tmp_root/single.php"
          "$php_bin" -l "$tmp_root/inc/adsense-geo-010266.php"
          "$php_bin" -l "$tmp_root/inc/adsterra-blog-010290.php"
          "$php_bin" -l "$tmp_root/assets/ad-geo-fast.php"
          "$php_bin" -l "$tmp_root/dropins/advanced-cache.php"

          for file in             functions.php             single.php             inc/adsense-geo-010266.php             inc/adsterra-blog-010290.php             assets/js/adsense-geo-010266.js             assets/js/adsterra-geo-010290.js             assets/ad-geo-fast.php             assets/adsterra-frame.html
          do
            destination="$theme_path/$file"
            mkdir -p "$(dirname "$destination")"
            [ ! -f "$destination" ] || cp -p "$destination" "${destination}.bak-${stamp}"
            install -m 0644 "$tmp_root/$file" "$destination"
          done

          advanced_cache="$prod_path/wp-content/advanced-cache.php"
          [ ! -f "$advanced_cache" ] || cp -p "$advanced_cache" "${advanced_cache}.bak-${stamp}"
          install -m 0644 "$tmp_root/dropins/advanced-cache.php" "$advanced_cache"
          rm -rf "$prod_path/wp-content/uploads/elmercado-blog-static-v1"

          "$php_bin" -l "$theme_path/functions.php"
          "$php_bin" -l "$theme_path/single.php"
          "$php_bin" -l "$theme_path/inc/adsense-geo-010266.php"
          "$php_bin" -l "$theme_path/inc/adsterra-blog-010290.php"
          "$php_bin" -l "$theme_path/assets/ad-geo-fast.php"
          "$php_bin" -l "$prod_path/wp-content/advanced-cache.php"

          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --allow-root >/dev/null 2>&1 || true

          provider=$("$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root 'echo defined("ELMERCADO_BLOG_AD_PROVIDER") ? ELMERCADO_BLOG_AD_PROVIDER : "missing";' 2>/dev/null)
          echo "BLOG_AD_PROVIDER=$provider"
          test "$provider" = "adsense"

          echo "--- COUNTRY LOGIC ---"
          country_results=$("$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            foreach (["ES","FR","PT","DE","US","MX","GB","ZA"] as $country) {
              echo $country . "=" . (elmercado_adsense_country_is_shippable($country) ? "SHIP" : "ADS") . "\n";
            }
          ' 2>/dev/null)
          printf '%s\n' "$country_results"
          grep -qx 'ES=SHIP' <<< "$country_results"
          grep -qx 'FR=SHIP' <<< "$country_results"
          grep -qx 'PT=SHIP' <<< "$country_results"
          grep -qx 'DE=SHIP' <<< "$country_results"
          grep -qx 'US=ADS' <<< "$country_results"
          grep -qx 'MX=ADS' <<< "$country_results"
          grep -qx 'GB=ADS' <<< "$country_results"
          grep -qx 'ZA=ADS' <<< "$country_results"

          post_url=$("$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            $ids = get_posts(["post_type" => "post", "post_status" => "publish", "numberposts" => 1, "fields" => "ids"]);
            if ($ids) echo get_permalink($ids[0]);
          ' 2>/dev/null)
          site_url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get home --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null)
          test -n "$post_url"
          nonce=$(date +%s)
          post_html=$(curl -fsSL --max-time 25 "${post_url}?blog_ads_verify=${nonce}")
          head_html="${post_html%%</head>*}"

          grep -q 'adsense-geo-010266.js' <<< "$head_html"
          grep -q 'ad-geo-fast.php' <<< "$head_html"
          grep -q 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' <<< "$head_html"
          if grep -q 'adsterra-geo-010290.js' <<< "$head_html"; then
            echo "Adsterra controller is active while provider=adsense"
            exit 1
          fi
          if grep -q 'data-emo-adsterra-slot=' <<< "$post_html"; then
            echo "Adsterra placeholders are active while provider=adsense"
            exit 1
          fi

          echo "--- FAST GEO ENDPOINT ---"
          fast_geo=$(curl -fsSL --max-time 5 -H 'X-Country-Code: ZA' "${site_url}/wp-content/themes/${stylesheet}/assets/ad-geo-fast.php?verify=${nonce}")
          echo "$fast_geo"
          grep -q '"country":"ZA"' <<< "$fast_geo"

          echo "--- STATIC AD FRAME ---"
          frame_html=$(curl -fsSL --max-time 5 "${site_url}/wp-content/themes/${stylesheet}/assets/adsterra-frame.html?unit=rectangle&token=verify")
          grep -q 'highrevenueformat.com' <<< "$frame_html"

          echo "--- BLOG EARLY CACHE ---"
          post_path=$(printf '%s' "$post_url" | sed -E 's#https?://[^/]+##')
          rm -rf "$prod_path/wp-content/uploads/elmercado-blog-static-v1"

          curl -ksS --max-time 45             -D /tmp/blog-cache-prime.h -o /tmp/blog-cache-prime.html             -w 'prime_http=%{http_code} prime_ttfb=%{time_starttransfer} prime_total=%{time_total}\n'             "${site_url}${post_path}"
          grep -q 'adsense-geo-010266.js' /tmp/blog-cache-prime.html
          if grep -qi '^X-El-Mercado-Blog-Early-Cache: HIT' /tmp/blog-cache-prime.h; then
            echo "Unexpected early HIT on prime"
            exit 31
          fi

          curl -ksS --max-time 15             -D /tmp/blog-cache-hit.h -o /tmp/blog-cache-hit.html             -w 'hit_http=%{http_code} hit_ttfb=%{time_starttransfer} hit_total=%{time_total}\n'             "${site_url}${post_path}"
          grep -qi '^X-El-Mercado-Blog-Early-Cache: HIT' /tmp/blog-cache-hit.h
          grep -q 'adsense-geo-010266.js' /tmp/blog-cache-hit.html

          curl -ksS --max-time 45             -H 'Cookie: emo_cache_bypass=1' -D /tmp/blog-cache-cookie.h -o /dev/null             "${site_url}${post_path}"
          if grep -qi '^X-El-Mercado-Blog-Early-Cache: HIT' /tmp/blog-cache-cookie.h; then
            echo "Cookie request was early cached"
            exit 32
          fi

          curl -ksS --max-time 45             -D /tmp/blog-cache-query.h -o /dev/null             "${site_url}${post_path}?emo_cache_bypass=1"
          if grep -qi '^X-El-Mercado-Blog-Early-Cache: HIT' /tmp/blog-cache-query.h; then
            echo "Query request was early cached"
            exit 33
          fi

          echo "BLOG_EARLY_CACHE_QA=PASS"

          echo "--- GENERIC REST ENDPOINT ---"
          route_registered=$("$php_bin" -d memory_limit=512M "$wp_bin" eval --path="$prod_path" --allow-root '
            $routes = rest_get_server()->get_routes();
            echo isset($routes["/elmercado/v1/blog-ad-eligibility"]) ? "yes" : "no";
          ' 2>/dev/null)
          echo "BLOG_AD_ROUTE=$route_registered"
          test "$route_registered" = "yes"

          echo "BLOG_AD_PROVIDER_PRODUCTION=PASS"
          REMOTE

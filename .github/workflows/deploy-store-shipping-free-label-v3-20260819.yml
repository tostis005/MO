name: Deploy and verify 1957 free shipping label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-store-shipping-free-label-v3-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-store-shipping-free-label-v3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-store-shipping-zero-cost-free-20260819.php
          grep -Fq "envio gratis" mu-plugins/mdo-store-shipping-zero-cost-free-20260819.php
          grep -Fq "mdo_sst_zcf_db_rows" mu-plugins/mdo-store-shipping-zero-cost-free-20260819.php

      - name: Install SSH helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Find production WordPress path
        id: prod
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "path=$PROD_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy current normalizer
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          REMOTE="/tmp/mdo-shipping-free-label-${GITHUB_RUN_ID}.php"
          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-store-shipping-zero-cost-free-20260819.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-store-shipping-zero-cost-free-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$TARGET.bak-$GITHUB_RUN_ID'; fi; mv '$REMOTE' '$TARGET'; chmod 0644 '$TARGET'; \"\$php_bin\" -l '$TARGET'"

      - name: Verify normalized 1957 row in WordPress
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '
            if (!function_exists(\"mdo_sst_zcf_db_rows\") || !function_exists(\"mdo_sst_zcf_normalize_rows\")) { fwrite(STDERR, \"NORMALIZER_NOT_LOADED\\n\"); exit(7); }
            \$u=get_user_by(\"slug\",\"1957\"); if(!\$u){\$u=get_user_by(\"login\",\"1957\");} if(!\$u){fwrite(STDERR,\"VENDOR_NOT_FOUND\\n\");exit(8);}
            \$rows=mdo_sst_zcf_normalize_rows(mdo_sst_zcf_db_rows((int)\$u->ID),(int)\$u->ID,\"by_zone\");
            \$target=null; foreach(\$rows as \$row){ if(function_exists(\"mdo_sst_is_mainland_spain_row\") && mdo_sst_is_mainland_spain_row(\$row)){\$target=\$row;break;} }
            if(!is_array(\$target)){fwrite(STDERR,\"MAINLAND_ROW_MISSING\\n\");exit(9);}
            \$notes=(array)(\$target[\"notes\"]??array());
            if(!in_array(\"Envío gratuito\",\$notes,true)){fwrite(STDERR,\"MAINLAND_NOT_CANONICAL_FREE:\".wp_json_encode(\$target,JSON_UNESCAPED_UNICODE).\"\\n\");exit(10);}
            foreach(\$notes as \$note){ if(false!==strpos(remove_accents(strtolower((string)\$note)),\"envio gratis\")){fwrite(STDERR,\"OLD_FREE_LABEL_REMAINS\\n\");exit(11);} }
            echo \"MAINLAND_NORMALIZED_FREE_OK=\" . wp_json_encode(\$target,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . \"\\n\";
          ' --path='$PROD_PATH' --allow-root"

      - name: Flush WordPress caches
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public 1957 shipping table
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/tienda/1957/?mdo_shipping=1&emdo_free_label_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO shipping verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/shipping.html "$URL"
          python3 - <<'PY'
          import html,re
          source=open('/tmp/shipping.html',encoding='utf-8',errors='ignore').read()
          rows=[]
          for raw in re.findall(r'<tr\b[^>]*>(.*?)</tr>',source,flags=re.I|re.S):
              text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
              rows.append(re.sub(r'\s+',' ',text).strip())
          target=next((r for r in rows if 'península' in r.lower() or 'peninsula' in r.lower()),None)
          print('PUBLIC_ROWS=' + repr(rows))
          if target is None: raise SystemExit('PUBLIC_MAINLAND_ROW_MISSING')
          if 'Envío gratuito' not in target: raise SystemExit('PUBLIC_MAINLAND_NOT_FREE:' + target)
          if 'Consultar condiciones' in target or 'Según condiciones' in target: raise SystemExit('PUBLIC_MAINLAND_STILL_CONDITIONAL:' + target)
          print('PUBLIC_MAINLAND_FREE_OK=' + target)
          PY

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          cat > .deploy-status/store-shipping-free-label-v3-production.txt <<EOF
          status=${DEPLOY_STATUS}
          source_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/store-shipping-free-label-v3-production.txt
          git commit -m 'Record 1957 free shipping label deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

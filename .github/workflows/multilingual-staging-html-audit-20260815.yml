name: Multilingual staging HTML audit 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-html-audit-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Audit rendered English pages
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}"
          for path in /en/ /en/tienda/ /en/productores/ /en/quienes-somos/ /en/contacto/; do
            echo "===== $path ====="
            curl -kLsS -H 'Cache-Control: no-cache' --max-time 35 "https://dev.elmercadodeorigen.com${path}?mdo_text_audit=${stamp}" -o /tmp/page.html
            echo "--- title ---"
            grep -oPm1 '(?<=<title>)[^<]+' /tmp/page.html || true
            echo "--- visible text sample ---"
            sed -e ':a' -e 'N' -e '$!ba' -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/\n/g' /tmp/page.html | sed 's/&nbsp;/ /g; s/&amp;/\&/g; s/&quot;/"/g; s/&#039;/'"'"'/g; s/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' | awk '!seen[$0]++' | head -n 240 || true
            echo "--- likely Spanish leftovers ---"
            sed -e ':a' -e 'N' -e '$!ba' -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/\n/g' /tmp/page.html | sed 's/&nbsp;/ /g; s/&amp;/\&/g; s/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' | grep -Ei '\b(el|la|los|las|para|por|con|desde|nuestro|nuestra|productos|productores|tienda|envío|comprar|selección|calidad|origen|quiénes|contacto|filtros|ordenar|mostrando|resultados|carrito|cuenta|jamón|paleta|queso|naranja)\b' | awk '!seen[$0]++' | head -n 180 || true
            echo
          done
          echo '===== sample English product ====='
          curl -kLsS -H 'Cache-Control: no-cache' --max-time 35 "https://dev.elmercadodeorigen.com/en/tienda/?mdo_product_audit=${stamp}" -o /tmp/shop.html
          product_url="$(grep -oE 'https://dev\.elmercadodeorigen\.com/en/product/[^"'"'"' ]+' /tmp/shop.html | head -n1 || true)"
          echo "product_url=${product_url:-not-found}"
          if [ -n "$product_url" ]; then
            curl -kLsS -H 'Cache-Control: no-cache' --max-time 35 "${product_url}?mdo_product_audit=${stamp}" -o /tmp/product.html
            sed -e ':a' -e 'N' -e '$!ba' -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/\n/g' /tmp/product.html | sed 's/&nbsp;/ /g; s/&amp;/\&/g; s/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' | awk '!seen[$0]++' | head -n 300 || true
          fi

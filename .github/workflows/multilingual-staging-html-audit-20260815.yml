name: Multilingual staging HTML audit 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-html-audit-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Audit rendered English pages
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}"
          paths=(/en/ /en/tienda/ /en/productores/ /en/quienes-somos/ /en/contacto/)
          for path in "${paths[@]}"; do
            echo "===== $path ====="
            curl -kLsS -H 'Cache-Control: no-cache' --max-time 35 "https://dev.elmercadodeorigen.com${path}?mdo_text_audit=${stamp}" -o /tmp/page.html
            echo "--- title ---"
            grep -oPm1 '(?<=<title>)[^<]+' /tmp/page.html || true
            echo "--- visible text ---"
            python3 - <<'PY'
from html import unescape
from html.parser import HTMLParser
from pathlib import Path
class Visible(HTMLParser):
    def __init__(self):
        super().__init__(); self.skip=0; self.items=[]
    def handle_starttag(self, tag, attrs):
        if tag in {'script','style','svg','noscript','template'}: self.skip += 1
    def handle_endtag(self, tag):
        if tag in {'script','style','svg','noscript','template'} and self.skip: self.skip -= 1
    def handle_data(self, data):
        if self.skip: return
        s=' '.join(unescape(data).split())
        if s and s not in self.items: self.items.append(s)
p=Visible(); p.feed(Path('/tmp/page.html').read_text(errors='ignore'))
for s in p.items[:260]: print(s)
PY

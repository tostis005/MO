name: Multilingual staging HTML audit 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-html-audit-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch staging pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /tienda/ /productores/ /quienes-somos/ /contacto/; do
            echo "===== $path ====="
            curl -kLsS --max-time 30 "https://dev.elmercadodeorigen.com${path}" -o /tmp/page.html
            echo "--- title ---"
            grep -oPm1 '(?<=<title>)[^<]+' /tmp/page.html || true
            echo "--- header markers ---"
            grep -oE '<(header|div|nav)[^>]+(site-header|woostify|header)[^>]*>' /tmp/page.html | head -n 35 || true
            echo "--- visible text sample ---"
            python3 - <<'PY'
from html.parser import HTMLParser
from pathlib import Path
class P(HTMLParser):
    def __init__(self):
        super().__init__(); self.skip=0; self.parts=[]
    def handle_starttag(self, tag, attrs):
        if tag in ('script','style','svg','noscript'): self.skip += 1
    def handle_endtag(self, tag):
        if tag in ('script','style','svg','noscript') and self.skip: self.skip -= 1
    def handle_data(self, data):
        if not self.skip:
            s=' '.join(data.split())
            if s: self.parts.append(s)
p=P(); p.feed(Path('/tmp/page.html').read_text(errors='ignore'))
seen=[]
for s in p.parts:
    if s not in seen:
        seen.append(s)
for s in seen[:180]: print(s)
PY
            echo
          done

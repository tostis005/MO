name: Multilingual staging HTML audit 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-html-audit-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch staging pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /tienda/ /productores/ /quienes-somos/ /contacto/; do
            echo "===== $path ====="
            curl -kLsS --max-time 30 "https://dev.elmercadodeorigen.com${path}" -o /tmp/page.html
            echo "--- title ---"
            grep -oPm1 '(?<=<title>)[^<]+' /tmp/page.html || true
            echo "--- header markers ---"
            grep -oE '<(header|div|nav)[^>]+(site-header|woostify|header)[^>]*>' /tmp/page.html | head -n 35 || true
            echo "--- visible text sample ---"
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/\n/g' /tmp/page.html | sed 's/&nbsp;/ /g; s/&amp;/\&/g; s/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' | awk '!seen[$0]++' | head -n 180 || true
            echo
          done

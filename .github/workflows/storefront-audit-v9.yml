name: Storefront audit

on:
  workflow_run:
    workflows: ["Deploy child theme to staging"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install audit dependency
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Targeted visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          node --check .github/scripts/runtime-layout-policy-check.cjs
          node --check .github/scripts/user-request-visual-check.cjs
          node --check .github/scripts/page-start-filter-check.cjs
          node --check .github/scripts/real-device-layout-check-01081.cjs
          node --check .github/scripts/desktop-filter-visual-check.cjs
          node --check .github/scripts/filter-postapply-flow-check.cjs
          node --check .github/scripts/user-feedback-01096-check.cjs
          node .github/scripts/runtime-layout-policy-check.cjs
          node .github/scripts/user-request-visual-check.cjs
          node .github/scripts/real-device-layout-check-01081.cjs
          node .github/scripts/page-start-filter-check.cjs
          node .github/scripts/desktop-filter-visual-check.cjs
          node .github/scripts/filter-postapply-flow-check.cjs
          node .github/scripts/user-feedback-01096-check.cjs
      - name: Audit deployed storefront
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/comprehensive-storefront-audit.cjs')
          text = path.read_text()
          text = text.replace(
              "const closeSel = '.sidebar-menu .close-sidebar-menu-btn,.sidebar-menu .close-sidebar-menu,.sidebar-menu [class*=\"close-sidebar\"]';",
              "const closeSel = '.sidebar-menu .elmercado-mobile-menu-close,.sidebar-menu .close-sidebar-menu-btn,.sidebar-menu .close-sidebar-menu,.sidebar-menu [class*=\"close-sidebar\"]';"
          )
          old_click = """async function clickVisible(page, selector) {
            const el = await visibleHandle(page, selector);
            if (!el) return false;
            await el.click();
            return true;
          }"""
          new_click = """async function clickVisible(page, selector) {
            const el = await visibleHandle(page, selector);
            if (!el) return false;
            try {
              await el.click();
            } catch (_) {
              await el.evaluate((node) => (node.closest('a,button,[role=\"button\"]') || node).click());
            }
            return true;
          }"""
          text = text.replace(old_click, new_click)
          old = """    const stillOpen = await page.evaluate(() => {
              const e = document.querySelector('.sidebar-menu');
              if (!e) return false;
              const r = e.getBoundingClientRect();
              return r.width > 0 && r.height > 0 && !e.hasAttribute('inert') && e.getAttribute('aria-hidden') !== 'true';
            });"""
          new = """    const stillOpen = await page.evaluate(() => document.documentElement.classList.contains('sidebar-menu-open'));"""
          text = text.replace(old, new)
          text = text.replace(
              "else { await input.click(); await input.type('aceite'); report.checks[`searchOpen-${mode}`] = true; }",
              "else { await input.evaluate((node) => { node.focus(); node.click(); }); await input.type('aceite'); report.checks[`searchOpen-${mode}`] = true; }"
          )
          path.write_text(text)

          mobile = Path('.github/scripts/mobile-ui-check.cjs')
          mobile_text = mobile.read_text()
          mobile_text = mobile_text.replace(
              "if (!shopInitial.lead || !/aceites|ibéricos|fruta/i.test(shopInitial.leadText)) throw new Error(`shop lead invalid (${JSON.stringify(shopInitial)})`);",
              "if (!shopInitial.lead || !/productos|origen|procedencia/i.test(shopInitial.leadText)) throw new Error(`shop lead invalid (${JSON.stringify(shopInitial)})`);"
          )
          mobile.write_text(mobile_text)
          PY
          node --check .github/scripts/storefront-audit-v10.cjs
          node --check .github/scripts/comprehensive-storefront-audit.cjs
          node --check .github/scripts/mobile-ui-check.cjs
          node --check .github/scripts/mobile-menu-visual-check.cjs
          node --check .github/scripts/vendor-resize-stability.cjs
          node --check .github/scripts/shop-responsive-breakpoint-01096.cjs
          node --check .github/scripts/premium-visual-system-check.cjs
          node .github/scripts/storefront-audit-v10.cjs
          node .github/scripts/comprehensive-storefront-audit.cjs
          node .github/scripts/mobile-ui-check.cjs
          node .github/scripts/mobile-menu-visual-check.cjs
          node .github/scripts/vendor-resize-stability.cjs
          node .github/scripts/shop-responsive-breakpoint-01096.cjs
          node .github/scripts/premium-visual-system-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-audit
          path: qa/
          retention-days: 14
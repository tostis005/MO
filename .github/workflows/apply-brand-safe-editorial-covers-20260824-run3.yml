name: Apply brand-safe editorial covers 20260824 final

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-brand-safe-editorial-covers-20260824-run3.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-blog-image-pagination-010262
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          set -euo pipefail
          php -l .github/scripts/apply-brand-safe-editorial-covers-20260824.php
          : "${STAGING_HOST:?missing}"
          : "${STAGING_USER:?missing}"
          : "${STAGING_PASSWORD:?missing}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Apply, verify articles and Journal cards
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          REMOTE="/tmp/emdo-brand-safe-final-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          sshpass -e scp $SCP .github/scripts/apply-brand-safe-editorial-covers-20260824.php "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PROD_PATH' '$REMOTE' '${GITHUB_SHA}'" <<'REMOTE_SCRIPT'
          set -eu
          prod="$1"; incoming="$2"; source_sha="$3"
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_cmd="$php_bin -d memory_limit=768M $wp_bin --path=$prod --skip-plugins --skip-themes --allow-root"
          backup_dir="$HOME/.elmercado-rollbacks/elmercadodeorigen.com/$(date -u +%Y%m%dT%H%M%SZ)-before-brand-safe-covers-final"
          mkdir -p "$backup_dir"; state="$backup_dir/featured-state.json"
          MDO_COVER_MODE=backup MDO_COVER_STATE_FILE="$state" sh -c "$wp_cmd eval-file '$incoming/apply-brand-safe-editorial-covers-20260824.php'" > "$backup_dir/backup.json"
          test -s "$state"
          changed=1
          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$changed" -eq 1 ]; then
              MDO_COVER_MODE=restore MDO_COVER_STATE_FILE="$state" sh -c "$wp_cmd eval-file '$incoming/apply-brand-safe-editorial-covers-20260824.php'" >/dev/null 2>&1 || true
              sh -c "$wp_cmd cache flush" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap rollback EXIT
          MDO_COVER_MODE=apply MDO_COVER_STATE_FILE="$state" sh -c "$wp_cmd eval-file '$incoming/apply-brand-safe-editorial-covers-20260824.php'" > "$incoming/report.json"
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);if(!is_array($r)||($r["status"]??"")!=="ok"||($r["custom_count"]??0)!==12||($r["pexels_count"]??0)!==6){exit(1);}echo "DATABASE_COVERS_OK\n";' "$incoming/report.json"
          sh -c "$wp_cmd cache flush" >/dev/null 2>&1 || true
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);foreach($r["local"] as $x){echo $x["asset"]."\t".$x["url"]."\n";}foreach($r["pexels"] as $x){echo $x["pexels_id"]."\t".$x["url"]."\n";}' "$incoming/report.json" > "$incoming/checks.tsv"
          checks=0
          while IFS="$(printf '\t')" read -r marker url; do
            file="$incoming/article-$checks.html"
            result="$(curl -ksS -L --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 60 -A 'EMDO final cover cert/20260824' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$file" -w '%{http_code}' "${url}?emdo_cover_final=${source_sha}")"
            [ "$result" = 200 ] || { echo "Article HTTP $result: $url" >&2; exit 1; }
            grep -Fq "$marker" "$file" || { echo "Article missing new marker $marker: $url" >&2; exit 1; }
            checks=$((checks+1))
          done < "$incoming/checks.tsv"
          [ "$checks" -eq 18 ]
          : > "$incoming/archive-all.html"
          for page in 1 2 3 4 5 6; do
            if [ "$page" -eq 1 ]; then path='/journal/'; else path="/journal/page/$page/"; fi
            file="$incoming/archive-$page.html"
            code="$(curl -ksS -L --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 60 -A 'EMDO final cover cert/20260824' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$file" -w '%{http_code}' "https://www.elmercadodeorigen.com${path}?emdo_cover_final=${source_sha}")"
            [ "$code" = 200 ] || { echo "Archive HTTP $code: $path" >&2; exit 1; }
            ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error|Página no encontrada|Page not found' "$file"
            cat "$file" >> "$incoming/archive-all.html"
          done
          while IFS="$(printf '\t')" read -r marker url; do
            grep -Fq "$marker" "$incoming/archive-all.html" || { echo "Journal cards missing new marker $marker" >&2; exit 1; }
          done < "$incoming/checks.tsv"
          for old in 37639098 17056969 11906259 6995300 34100094 3296657 37326564 38289321 28879279 37326360 38681145 5532663 3737656 31275833 34100077; do
            if grep -Fq "$old" "$incoming"/article-*.html "$incoming/archive-all.html"; then echo "Old cover remains: $old" >&2; exit 1; fi
          done
          cp "$incoming/report.json" "$backup_dir/report.json"
          trap - EXIT
          echo "BRAND_SAFE_COVERS_FINAL_OK article_checks=$checks archive_pages=6"
          echo "BACKUP_DIR=$backup_dir"
          REMOTE_SCRIPT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"

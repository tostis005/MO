name: Deploy Instagram content history to production

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-instagram-content-history.php'
      - '.github/workflows/deploy-instagram-content-history-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-instagram-content-history.php
          grep -Fq 'emdo_content_history' mu-plugins/mdo-instagram-content-history.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Install SSH helper
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Deploy history plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_TMP="/tmp/mdo-instagram-content-history-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-instagram-content-history.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; cp '$REMOTE_TMP' '$PROD_PATH/wp-content/mu-plugins/mdo-instagram-content-history.php'; chmod 0644 '$PROD_PATH/wp-content/mu-plugins/mdo-instagram-content-history.php'; rm -f '$REMOTE_TMP'"

      - name: Verify deployed file
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-instagram-content-history.php'"

      - name: Warm REST endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 'https://elmercadodeorigen.com/wp-json/emdo-instagram/v1/history?limit=1' >/tmp/history.json
          jq -e '.count >= 0 and (.items | type == "array")' /tmp/history.json >/dev/null

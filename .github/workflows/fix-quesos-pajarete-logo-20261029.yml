name: Correct Quesos Pajarete WCFM circle logo only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-quesos-pajarete-logo-20261029.yml', '.github/scripts/fix-quesos-pajarete-logo-20261029.php']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Update only Pajarete's missing official avatar in production
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/fix-quesos-pajarete-logo-20261029.php
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="$STAGING_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          REMOTE="/tmp/fix-pajarete-logo-$GITHUB_RUN_ID.php"
          REMOTE_PNG="/tmp/official-pajarete-logo-$GITHUB_RUN_ID.png"
          LOCAL_PNG="/tmp/official-pajarete-logo-$GITHUB_RUN_ID.png"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 95 \
            -A 'Mozilla/5.0' 'https://quesospajarete.com/wp-content/uploads/2024/04/logo__1_-removebg-preview.png' \
            -o "$LOCAL_PNG"
          python3 - "$LOCAL_PNG" <<'PY'
          import sys,struct
          data=open(sys.argv[1],'rb').read()
          if not data.startswith(bytes([137,80,78,71,13,10,26,10])):raise Exception('Not a PNG')
          if not 1000<len(data)<12000000:raise Exception('Invalid official image size')
          width,height=struct.unpack('>II',data[16:24])
          if width<600 or height<200:raise Exception('Unexpected official logo dimensions')
          print('PAJARETE_VERIFIED_ORIGINAL_IMAGE=',len(data),width,height)
          PY
          sshpass -e scp $SCP .github/scripts/fix-quesos-pajarete-logo-20261029.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e scp $SCP "$LOCAL_PNG" "$STAGING_USER@$STAGING_HOST:$REMOTE_PNG"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE $REMOTE_PNG" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            PAJARETE_LOGO_UPLOAD='$REMOTE_PNG' \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root
          " | tee /tmp/pajarete-logo-fix.txt
          grep -Eq 'PAJARETE_LOGO_(CONFIGURED|ALREADY_PRESENT)=' /tmp/pajarete-logo-fix.txt
      - name: Verify official logo appears on public WCFM store page
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import urllib.request,json,re
          expected='logo__1_-removebg-preview.png'
          url='https://www.elmercadodeorigen.com/tienda/quesos-pajarete/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/126.0.0.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=35) as res:
            html=res.read(2500000).decode('utf-8','replace')
            code=res.status
          print('PAJARETE_FRONTEND_VERIFY='+json.dumps({'status':code,'url':url,'title':re.findall('<title[^>]*>(.*?)</title>',html,re.I|re.S)[:1],
           'logo_filename_in_html':expected in html,'contains_producer_name':'Quesos Pajarete' in html,'bytes':len(html)}))
          if code!=200 or expected not in html:raise RuntimeError('Official Pajarete logo not present on live store page')
          PY
      - name: Store detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entresetas-products-audit
          path: /tmp/pajarete-logo-fix.txt
          if-no-files-found: warn
          retention-days: 20

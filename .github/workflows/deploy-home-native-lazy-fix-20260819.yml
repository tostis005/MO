name: Deploy Home native lazy fix 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-native-lazy-fix-20260819.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-home-recovery-live
  cancel-in-progress: true

jobs:
  recover-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy safe Specials module with automatic fallback
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          php -l mdo-supplier-sync/includes/class-mdo-home-specials.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e scp $SCP mdo-supplier-sync/mdo-supplier-sync.php "$STAGING_USER@$STAGING_HOST:/tmp/emdo-main-recovery.php"
          sshpass -e scp $SCP mdo-supplier-sync/includes/class-mdo-home-specials.php "$STAGING_USER@$STAGING_HOST:/tmp/emdo-home-recovery.php"
          sshpass -e scp $SCP mdo-supplier-sync/assets/css/home-specials.css "$STAGING_USER@$STAGING_HOST:/tmp/emdo-home-recovery.css"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          P="$1"; D="$P/wp-content/plugins/mdo-supplier-sync"
          wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          cp /tmp/emdo-main-recovery.php "$D/mdo-supplier-sync.php"
          cp /tmp/emdo-home-recovery.php "$D/includes/class-mdo-home-specials.php"
          cp /tmp/emdo-home-recovery.css "$D/assets/css/home-specials.css"
          rm -f /tmp/emdo-main-recovery.php /tmp/emdo-home-recovery.php /tmp/emdo-home-recovery.css
          "$php_bin" -l "$D/mdo-supplier-sync.php" >/dev/null
          "$php_bin" -l "$D/includes/class-mdo-home-specials.php" >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$P" --allow-root >/dev/null || true
          "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$P" --allow-root >/dev/null 2>&1 || true
          check() {
            s=$(date +%s%N)
            a=$(curl -k -L -sS --connect-timeout 5 --max-time 12 -o /tmp/recovery-es -w '%{http_code}' "https://www.elmercadodeorigen.com/?recovery=$s" || true)
            b=$(curl -k -L -sS --connect-timeout 5 --max-time 12 -o /tmp/recovery-en -w '%{http_code}' "https://www.elmercadodeorigen.com/en/?recovery=$s" || true)
            [ "$a" = 200 ] && [ "$b" = 200 ]
          }
          if check; then
            echo RECOVERY_MODE=safe_specials
            grep -Fq 'mdo-home-specials' /tmp/recovery-es && echo SPECIALS_ES=present || echo SPECIALS_ES=absent
            grep -Fq 'mdo-home-specials' /tmp/recovery-en && echo SPECIALS_EN=present || echo SPECIALS_EN=absent
            echo HOME_ES=200; echo HOME_EN=200
            exit 0
          fi
          echo 'Safe module still slow: disabling only homepage Specials' >&2
          sed -i "/class-mdo-home-specials\.php/d; /MDO_Home_Specials::init()/d" "$D/mdo-supplier-sync.php"
          "$php_bin" -l "$D/mdo-supplier-sync.php" >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$P" --allow-root >/dev/null || true
          "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$P" --allow-root >/dev/null 2>&1 || true
          check
          echo RECOVERY_MODE=specials_disabled
          echo HOME_ES=200; echo HOME_EN=200
          REMOTE

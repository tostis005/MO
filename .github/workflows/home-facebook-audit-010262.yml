name: Home Facebook audit 0.10.262

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-facebook-audit-010262.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect live Facebook scripts
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          {
            echo '=== LIVE FACEBOOK TAGS ==='
            grep -n -E 'facebook-for-woocommerce|pixel-events|clientParamBuilder|connect.facebook.net|fbevents.js' /tmp/home.html || true
            echo '=== COUNTS ==='
            printf 'signals=%s\n' "$(grep -c 'facebook-for-woocommerce-signals.js' /tmp/home.html || true)"
            printf 'pixel_events=%s\n' "$(grep -c 'frontend/pixel-events.js' /tmp/home.html || true)"
            printf 'client_builder=%s\n' "$(grep -c 'clientParamBuilder.bundle.js' /tmp/home.html || true)"
          } > /tmp/audit.txt

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            PLUGIN='$PROD_PATH/wp-content/plugins/facebook-for-woocommerce'
            echo '=== SOURCE REFERENCES ==='
            grep -RIn --include='*.php' --include='*.js' 'facebook-for-woocommerce-signals.js\|pixel-events.js\|clientParamBuilder.bundle.js' \"\$PLUGIN\" 2>/dev/null | head -n 120 || true
            echo '=== ENQUEUE HANDLES ==='
            grep -RIn --include='*.php' 'wp_enqueue_script\|wp_register_script' \"\$PLUGIN\" 2>/dev/null | grep -E 'facebook|pixel|signal|param|frontend' | head -n 160 || true
          " >> /tmp/audit.txt
          cp /tmp/audit.txt runtime/home-facebook-audit-010262.txt
          cat runtime/home-facebook-audit-010262.txt
      - name: Record audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-facebook-audit-010262.txt
          git commit -m 'Record Home Facebook script audit' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

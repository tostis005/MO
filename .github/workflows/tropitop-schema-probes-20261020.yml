name: Tropitop product schema probes
on:
  pull_request:
    paths:
      - '.github/scripts/tropitop-schema-probes-20261020.py'
      - '.github/workflows/tropitop-schema-probes-20261020.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 requests -q
      - run: python .github/scripts/tropitop-schema-probes-20261020.py

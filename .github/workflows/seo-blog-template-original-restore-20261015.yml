name: Restore canonical blog template after H1 experiment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-blog-template-original-restore-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified canonical original to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          ORIGINAL='ece5e7a6c2c4faa3a0e0fb74f69d3005e663777e73a5ed1f8ca62161c6e984a3'
          PATCHED='56984f9434a446d75b98a0f68323b58029580167fff42ef16dc560739949034e'
          SRC='elmercadodeorigen-child/single-post.php'
          php -l "$SRC"
          SOURCE_SHA="$(sha256sum "$SRC" | cut -d ' ' -f1)"
          test "$SOURCE_SHA" = "$ORIGINAL" || { echo "::error::Original source checksum mismatch";exit 5; }
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true);php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null);do
              path=$(dirname "$cfg");site=$("$php" "$wp" option get siteurl --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$site" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)printf "%s|%s|%s" "$path" "$php" "$wp";break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}";REST="${INFO#*|}";PHP="${REST%%|*}";WP="${REST#*|}"
          TARGET="$PROD/wp-content/themes/elmercadodeorigen-child/single-post.php"
          ACTUAL="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$TARGET' | cut -d ' ' -f1")"
          echo "CURRENT_HASH=$ACTUAL"
          if [ "$ACTUAL" = "$ORIGINAL" ];then
            echo 'CANONICAL_TEMPLATE_ALREADY_RESTORED'; exit 0
          fi
          [ "$ACTUAL" = "$PATCHED" ] || { echo "::error::Unexpected production template version; no overwrite";exit 7; }
          TEMP="/tmp/mdo-canonical-single-restored-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP "$SRC" "$STAGING_USER@$STAGING_HOST:$TEMP"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP' -l '$TEMP' >/dev/null && install -m 0644 '$TEMP' '$TARGET' && rm -f '$TEMP'"
          VERIFIED="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$TARGET' | cut -d ' ' -f1")"
          [ "$VERIFIED" = "$ORIGINAL" ] || {echo "::error::Original hash not restored";exit 8;}
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' eval 'if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          echo 'ORIGINAL_BLOG_THEME_FILE_RESTORED_SHA256_OK'
      - name: Smoke test public articles and shop
        run: |
          set -euo pipefail
          for path in "/comprar-directamente-al-productor-como-funciona/" "/en/how-to-identify-local-food-and-where-to-buy-it/" "/categoria-producto/hortalizas-verduras/";do
            curl --fail --location --silent --show-error --retry 2 --max-time 75 "https://www.elmercadodeorigen.com${path}?restore_original_qa=$GITHUB_RUN_ID" -o /tmp/page.html
            test -s /tmp/page.html
            echo "LIVE_HTTP_200 $path"
          done

name: Smoke import Huerta Ana Mary production

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/smoke-import-huerta-20260819.php'
      - '.github/workflows/smoke-import-huerta-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate script
        run: php -l .github/scripts/smoke-import-huerta-20260819.php
      - name: Import one product in production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_TMP="/tmp/smoke-import-huerta-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/smoke-import-huerta-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"
          mkdir -p .deploy-status
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$REMOTE_TMP' --path='$PROD_PATH' --allow-root
            code=\$?
            rm -f '$REMOTE_TMP'
            exit \$code
          " > .deploy-status/huerta-smoke-import.json
          CODE=$?
          set -e
          echo "$CODE" > .deploy-status/huerta-smoke-import.exit-code
      - name: Record smoke result
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/huerta-smoke-import.json .deploy-status/huerta-smoke-import.exit-code || true
          git commit -m 'Record Huerta WooCommerce smoke import [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail when smoke import failed
        if: always()
        run: |
          test -f .deploy-status/huerta-smoke-import.exit-code
          test "$(cat .deploy-status/huerta-smoke-import.exit-code)" = "0"

name: Restore AdSense monetization 0.10.284

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-tcf-regions-source-010283.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore AdSense eligibility by shipping country
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('elmercadodeorigen-child/inc/adsense-geo-010266.php')
          s = p.read_text()

          old_line = "\t$show_ads     = '' !== $country && false === $can_buy && ! $requires_tcf;"
          new_line = "\t$show_ads     = '' !== $country && false === $can_buy;"
          if old_line in s:
              s = s.replace(old_line, new_line, 1)
          elif new_line not in s:
              raise SystemExit('AdSense eligibility line not found')

          s = s.replace(
              " * Evita inicializar AdSense en territorios donde Google exige CMP TCF.\n * Hasta conectar CookieYes como CMP TCF certificada, no servimos anuncios en\n * EEE, Reino Unido ni Suiza para mantener un unico banner de consentimiento.",
              " * Clasifica territorios donde Google puede requerir consentimiento TCF.\n * Este dato es informativo: la publicidad se decide exclusivamente segun si\n * WooCommerce permite comprar/enviar al pais de la visita."
          )

          p.write_text(s)
          PY
          php -l elmercadodeorigen-child/inc/adsense-geo-010266.php
          grep -Fq '$show_ads     = '\'''''\'' !== $country && false === $can_buy;' elmercadodeorigen-child/inc/adsense-geo-010266.php
          if grep -Fq 'false === $can_buy && ! $requires_tcf' elmercadodeorigen-child/inc/adsense-geo-010266.php; then
            echo 'TCF exclusion still present' >&2
            exit 1
          fi
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/adsense-geo-010266.php
          if git diff --cached --quiet; then
            echo 'Source already restored'
            exit 0
          fi
          git commit -m 'Restore AdSense in all non-shipping countries'
          git push origin HEAD:main

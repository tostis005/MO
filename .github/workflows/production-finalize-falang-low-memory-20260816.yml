name: Production finalize Falang low-memory 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-finalize-falang-low-memory-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint custom code
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/functions.php
          php -l elmercadodeorigen-child/inc/multilingual-ui-copy-010245.php
          php -l elmercadodeorigen-child/inc/falang-switcher-010245.php
          php -l mdo-supplier-sync/includes/class-mdo-minimum-order.php
      - name: Prepare transport
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          tar -czf /tmp/mdo-falang-final-code.tgz \
            elmercadodeorigen-child/functions.php \
            elmercadodeorigen-child/inc/multilingual-ui-copy-010245.php \
            elmercadodeorigen-child/inc/falang-switcher-010245.php \
            mdo-supplier-sync/includes/class-mdo-minimum-order.php
      - name: Locate production and upload
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no /tmp/mdo-falang-final-code.tgz "$STAGING_USER@$STAGING_HOST:/tmp/mdo-falang-final-code.tgz"
      - name: Guarded capture import activate and remove TranslatePress
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=768M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          wplite(){ "$php_bin" -d memory_limit=256M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root --skip-plugins --skip-themes "$@"; }
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup_dir="$(dirname "$PROD_PATH")/mdo-private-backups"
          mkdir -p "$backup_dir"
          trp_dir="$PROD_PATH/wp-content/plugins/translatepress-multilingual"
          mutated=0
          rollback_guard() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$mutated" -eq 1 ]; then
              echo '=== GUARDED ROLLBACK TO TRANSLATEPRESS ===' >&2
              wp plugin deactivate falang >/dev/null 2>&1 || true
              if [ ! -d "$trp_dir" ]; then
                latest=$(find "$backup_dir" -maxdepth 1 -type d -name 'translatepress-multilingual-files-*' | sort | tail -n1 || true)
                [ -n "$latest" ] && mv "$latest" "$trp_dir" || true
              fi
              [ -d "$trp_dir" ] && wp plugin activate translatepress-multilingual >/dev/null 2>&1 || true
              wplite option update WPLANG es_ES >/dev/null 2>&1 || true
              wplite cache flush >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap rollback_guard EXIT

          echo '=== PRECHECK ==='
          wp plugin is-active translatepress-multilingual
          wp plugin get falang --fields=name,status,version --format=table

          echo '=== FRESH DATABASE BACKUP ==='
          mkdir -p /tmp/mdo-db-tools
          ln -sf /usr/bin/mysqldump /tmp/mdo-db-tools/mariadb-dump
          db_backup="$backup_dir/falang-final-$stamp.sql"
          PATH="/tmp/mdo-db-tools:$PATH" wplite db export "$db_backup" --add-drop-table --quiet
          gzip -f "$db_backup"
          test -s "$db_backup.gz"
          echo "DB_BACKUP=$db_backup.gz"

          echo '=== CAPTURE CURRENT ENGLISH FROM TRANSLATEPRESS ==='
          cat >/tmp/mdo-capture-trp-final.php <<'PHP'
          <?php
          global $wpdb;
          $wpdb->suppress_errors(true);
          if (!function_exists('trp_translate')) throw new RuntimeException('TranslatePress API unavailable.');
          function mdo_trp_final_en($value){
              if(!is_string($value)||$value==='') return (string)$value;
              ob_start();
              try{$translated=trp_translate($value,'en_US');}catch(Throwable $e){$translated=$value;}
              ob_end_clean();
              return is_string($translated)&&$translated!==''?$translated:$value;
          }
          function mdo_unique_final_slug($candidate,$fallback,$scope,&$seen){
              $slug=sanitize_title($candidate); if($slug==='')$slug=sanitize_title($fallback); if($slug==='')$slug='translation';
              $base=$slug;$n=2;while(isset($seen[$scope][$slug]))$slug=$base.'-'.$n++;$seen[$scope][$slug]=true;return $slug;
          }
          $data=['captured_at'=>gmdate('c'),'posts'=>[],'terms'=>[],'attributes'=>[]];$seen=[];
          $posts=get_posts(['post_type'=>['post','page','product','nav_menu_item'],'post_status'=>'any','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC','suppress_filters'=>true]);
          foreach($posts as $post){
              $title=mdo_trp_final_en($post->post_title);$content=mdo_trp_final_en($post->post_content);$excerpt=mdo_trp_final_en($post->post_excerpt);
              $data['posts'][]=['id'=>(int)$post->ID,'post_type'=>$post->post_type,'title'=>$title,'content'=>$content,'excerpt'=>$excerpt,'slug'=>mdo_unique_final_slug($title,$post->post_name,'post:'.$post->post_type,$seen),'changed'=>($title!==$post->post_title||$content!==$post->post_content||$excerpt!==$post->post_excerpt)];
          }
          $tax=['category','post_tag','product_cat','product_tag'];
          if(function_exists('wc_get_attribute_taxonomies'))foreach(wc_get_attribute_taxonomies() as $a){$tax[]=wc_attribute_taxonomy_name($a->attribute_name);$label=mdo_trp_final_en((string)$a->attribute_label);$data['attributes'][]=['name'=>(string)$a->attribute_name,'taxonomy'=>wc_attribute_taxonomy_name($a->attribute_name),'label'=>$label,'slug'=>sanitize_title($label?:$a->attribute_name)];}
          foreach(array_unique($tax) as $taxonomy){if(!taxonomy_exists($taxonomy))continue;$terms=get_terms(['taxonomy'=>$taxonomy,'hide_empty'=>false]);if(is_wp_error($terms))continue;foreach($terms as $term){$name=mdo_trp_final_en($term->name);$description=mdo_trp_final_en($term->description);$data['terms'][]=['id'=>(int)$term->term_id,'taxonomy'=>$taxonomy,'name'=>$name,'description'=>$description,'slug'=>mdo_unique_final_slug($name,$term->slug,'term:'.$taxonomy,$seen),'changed'=>($name!==$term->name||$description!==$term->description)];}}
          $json=wp_json_encode($data,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);if(false===file_put_contents('/tmp/mdo-trp-final.json',$json))throw new RuntimeException('Capture write failed.');
          echo 'CAPTURE_POSTS='.count($data['posts']).PHP_EOL.'CAPTURE_TERMS='.count($data['terms']).PHP_EOL.'CAPTURE_ATTRIBUTES='.count($data['attributes']).PHP_EOL;
          PHP
          wp eval-file /tmp/mdo-capture-trp-final.php
          test -s /tmp/mdo-trp-final.json
          cp /tmp/mdo-trp-final.json "$backup_dir/translatepress-english-final-$stamp.json"

          echo '=== DEPLOY MULTILINGUAL CODE ==='
          rm -rf /tmp/mdo-falang-final-code && mkdir -p /tmp/mdo-falang-final-code
          tar -xzf /tmp/mdo-falang-final-code.tgz -C /tmp/mdo-falang-final-code
          theme="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          sync_plugin="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          install -m 0644 /tmp/mdo-falang-final-code/elmercadodeorigen-child/functions.php "$theme/functions.php"
          install -m 0644 /tmp/mdo-falang-final-code/elmercadodeorigen-child/inc/multilingual-ui-copy-010245.php "$theme/inc/multilingual-ui-copy-010245.php"
          install -m 0644 /tmp/mdo-falang-final-code/elmercadodeorigen-child/inc/falang-switcher-010245.php "$theme/inc/falang-switcher-010245.php"
          install -m 0644 /tmp/mdo-falang-final-code/mdo-supplier-sync/includes/class-mdo-minimum-order.php "$sync_plugin/includes/class-mdo-minimum-order.php"
          rm -f "$theme/inc/english-ui-copy-final-010243.php"

          echo '=== LOW-MEMORY FALANG OPTIONS + TRANSLATION IMPORT ==='
          cat >/tmp/mdo-falang-lowmem-import.php <<'PHP'
          <?php
          $data=json_decode(file_get_contents('/tmp/mdo-trp-final.json'),true);if(!is_array($data))throw new RuntimeException('Invalid capture.');
          $options=get_option('falang',[]);if(!is_array($options))$options=[];
          $options['default_language']='es_ES';$options['show_slug']=false;$options['autodetect']=false;$options['frontend_ajax']=true;$options['delete_trans_on_uninstall']=false;
          foreach(['post','page','product','nav_menu_item'] as $type){if(!isset($options['post_type'][$type])||!is_array($options['post_type'][$type]))$options['post_type'][$type]=[];$options['post_type'][$type]['translatable']=true;}
          $options['post_type']['nav_menu_item']['meta_keys']=array_values(array_unique(array_merge($options['post_type']['nav_menu_item']['meta_keys']??[],['_menu_item_url'])));
          foreach($data['terms']??[] as $row){$taxonomy=(string)($row['taxonomy']??'');if($taxonomy==='')continue;if(!isset($options['taxonomy'][$taxonomy])||!is_array($options['taxonomy'][$taxonomy]))$options['taxonomy'][$taxonomy]=[];$options['taxonomy'][$taxonomy]['translatable']=true;}
          update_option('falang',$options);update_option('WPLANG','es_ES');update_option('need_flush',1);
          $prefix='_en_US_';$pc=0;$tc=0;
          foreach($data['posts']??[] as $row){if(empty($row['changed']))continue;$id=(int)$row['id'];if(!$id||!get_post($id))continue;update_post_meta($id,$prefix.'post_title',(string)$row['title']);update_post_meta($id,$prefix.'post_content',(string)$row['content']);update_post_meta($id,$prefix.'post_excerpt',(string)$row['excerpt']);update_post_meta($id,$prefix.'post_name',(string)$row['slug']);update_post_meta($id,$prefix.'published',1);$pc++;}
          foreach($data['terms']??[] as $row){if(empty($row['changed']))continue;$id=(int)$row['id'];if(!$id)continue;update_term_meta($id,$prefix.'name',(string)$row['name']);update_term_meta($id,$prefix.'description',(string)$row['description']);update_term_meta($id,$prefix.'slug',(string)$row['slug']);update_term_meta($id,$prefix.'published',1);$tc++;}
          $attrs=get_option('falang_wc_attributes',[]);if(!is_array($attrs))$attrs=[];foreach($data['attributes']??[] as $row){$name=(string)$row['name'];$attrs[$name.'_label_en_US']=(string)$row['label'];$attrs[$name.'_name_en_US']=(string)$row['slug'];}update_option('falang_wc_attributes',$attrs);
          echo 'IMPORTED_POSTS='.$pc.PHP_EOL.'IMPORTED_TERMS='.$tc.PHP_EOL.'IMPORTED_ATTRIBUTES='.count($data['attributes']??[]).PHP_EOL;
          PHP
          wplite eval-file /tmp/mdo-falang-lowmem-import.php

          echo '=== ASSERT LANGUAGE TERMS FROM FALANG INSTALLATION ==='
          prefix=$(wplite db prefix)
          en_count=$(wplite db query "SELECT COUNT(*) FROM ${prefix}terms t JOIN ${prefix}term_taxonomy tt ON tt.term_id=t.term_id WHERE tt.taxonomy='language' AND t.slug='en';" --skip-column-names)
          es_count=$(wplite db query "SELECT COUNT(*) FROM ${prefix}terms t JOIN ${prefix}term_taxonomy tt ON tt.term_id=t.term_id WHERE tt.taxonomy='language' AND t.slug='es';" --skip-column-names)
          test "$en_count" = "1"
          test "$es_count" = "1"

          echo '=== SWITCH ACTIVE PLUGIN ==='
          mutated=1
          wp plugin deactivate translatepress-multilingual
          wp plugin activate falang
          wplite option update WPLANG es_ES >/dev/null
          wplite option patch update falang default_language es_ES >/dev/null
          wplite option update need_flush 1 >/dev/null
          wplite cache flush >/dev/null 2>&1 || true

          echo '=== INTERNAL FALANG CHECK ==='
          wp plugin is-active falang
          test "$(wplite option get WPLANG)" = "es_ES"
          test "$(wplite option pluck falang default_language)" = "es_ES"
          test "$(wplite eval 'echo get_post_meta(1350,"_en_US_published",true);')" = "1"
          sample_title=$(wplite eval 'echo get_post_meta(1350,"_en_US_post_title",true);')
          sample_slug=$(wplite eval 'echo get_post_meta(1350,"_en_US_post_name",true);')
          echo "SAMPLE_TITLE=$sample_title"
          echo "SAMPLE_SLUG=$sample_slug"

          echo '=== PUBLIC FALANG CHECK ==='
          curl -fsSL --max-time 60 -o /tmp/falang-es.html https://www.elmercadodeorigen.com/
          curl -fsSL --max-time 60 -o /tmp/falang-en.html https://www.elmercadodeorigen.com/en/
          grep -qi 'elmercado-falang-switcher' /tmp/falang-es.html
          grep -qi 'elmercado-falang-switcher' /tmp/falang-en.html
          curl -fsSL -L --max-time 60 -o /tmp/falang-sample.html 'https://www.elmercadodeorigen.com/en/?p=1350'
          SAMPLE_TITLE="$sample_title" "$php_bin" -r '$h=file_get_contents("/tmp/falang-sample.html");$t=getenv("SAMPLE_TITLE");if($t!==""&&stripos(html_entity_decode(strip_tags($h),ENT_QUOTES|ENT_HTML5,"UTF-8"),html_entity_decode(strip_tags($t),ENT_QUOTES|ENT_HTML5,"UTF-8"))===false){fwrite(STDERR,"Translated sample title not found\n");exit(1);}'

          echo '=== REMOVE TRANSLATEPRESS FROM INSTALLED PLUGINS ==='
          if [ -d "$trp_dir" ]; then mv "$trp_dir" "$backup_dir/translatepress-multilingual-files-$stamp"; fi
          test ! -d "$trp_dir"
          wp plugin is-active falang
          wplite cache flush >/dev/null 2>&1 || true
          curl -fsSL --max-time 60 -o /tmp/final-es.html https://www.elmercadodeorigen.com/
          curl -fsSL --max-time 60 -o /tmp/final-en.html https://www.elmercadodeorigen.com/en/
          grep -qi 'elmercado-falang-switcher' /tmp/final-es.html
          grep -qi 'elmercado-falang-switcher' /tmp/final-en.html
          if grep -qi 'translatepress-multilingual' /tmp/final-es.html /tmp/final-en.html; then echo 'TranslatePress asset still present' >&2; exit 1; fi
          echo 'FALANG_ACTIVE=yes'
          echo 'TRANSLATEPRESS_INSTALLED=no'
          echo 'SPANISH_DEFAULT=yes'
          echo 'ENGLISH_CONTENT_MIGRATED=yes'
          mutated=0
          trap - EXIT
          REMOTE
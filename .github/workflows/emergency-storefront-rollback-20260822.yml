name: Emergency storefront rollback production 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-storefront-rollback-20260822.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-storefront-rollback-20260820
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
      TARGET_COMMIT: d9eea6799740a9b91f6b5e34fb52508a15995fba
      LATER_RUNTIME_COMMIT: 4879cf80a6b8f134dca578f3c704325d081005b0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 20 August runtime snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:elmercadodeorigen-child)" = 'e7174868bbe1276fa1e90351184fd232f817564a'
          test "$(git rev-parse HEAD:mu-plugins)" = 'a4ef0ed328508842a35f2c7e6e75c3010ec48c38'
          test "$(git rev-parse HEAD:mdo-supplier-sync)" = '875aef89438251d3eefe05cd298e4a2f69fee01e'
          git cat-file -e "$TARGET_COMMIT^{commit}"
          git cat-file -e "$LATER_RUNTIME_COMMIT^{commit}"
          find elmercadodeorigen-child mu-plugins mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass rsync >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build safe removal inventory
        run: |
          set -euo pipefail
          git ls-tree -r --name-only "$LATER_RUNTIME_COMMIT" -- mu-plugins/ \
            | sed 's#^mu-plugins/##' | sed '/^$/d' | sort -u > /tmp/later-root-mu.txt
          git ls-tree -r --name-only HEAD -- mu-plugins/ \
            | sed 's#^mu-plugins/##' | sed '/^$/d' | sort -u > /tmp/target-root-mu.txt
          comm -23 /tmp/later-root-mu.txt /tmp/target-root-mu.txt > /tmp/remove-root-mu.txt

          git ls-tree -r --name-only "$LATER_RUNTIME_COMMIT" -- elmercadodeorigen-child/mu-plugins/ \
            | sed 's#^elmercadodeorigen-child/mu-plugins/##' | sed '/^$/d' | sort -u > /tmp/later-theme-mu.txt
          git ls-tree -r --name-only HEAD -- elmercadodeorigen-child/mu-plugins/ \
            | sed 's#^elmercadodeorigen-child/mu-plugins/##' | sed '/^$/d' | sort -u > /tmp/target-theme-mu.txt
          comm -23 /tmp/later-theme-mu.txt /tmp/target-theme-mu.txt > /tmp/remove-theme-mu.txt

          cat /tmp/remove-root-mu.txt /tmp/remove-theme-mu.txt | sed '/^$/d' | sort -u > /tmp/remove-global-mu.txt
          while IFS= read -r rel; do
            case "$rel" in
              /*|*'..'*) echo "Unsafe removal path: $rel" >&2; exit 1 ;;
            esac
          done < /tmp/remove-global-mu.txt
          echo "Managed MU files to remove from post-Aug20 runtime: $(wc -l < /tmp/remove-global-mu.txt)"
          cat /tmp/remove-global-mu.txt

      - name: Restore production runtime
        id: deploy
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s" "$p"
                  break
                  ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          THEME_DIR="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          SUPPLIER_DIR="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          BACKUP="/tmp/emdo-pre-aug20-rollback-${GITHUB_RUN_ID}.tar.gz"
          REMOVE_LIST="/tmp/emdo-remove-global-mu-${GITHUB_RUN_ID}.txt"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "tar -czf '$BACKUP' --ignore-failed-read -C '$PROD_PATH/wp-content' themes/elmercadodeorigen-child mu-plugins plugins/mdo-supplier-sync 2>/dev/null || true"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$THEME_DIR' '$MU_DIR'"

          # The complete child theme is repository-owned, so --delete is intentional.
          sshpass -e rsync -az --delete -e "ssh $SSH" elmercadodeorigen-child/ "$STAGING_USER@$STAGING_HOST:$THEME_DIR/"

          # Root MU plugins may contain third-party files. Overwrite our target files,
          # then delete only files proven to be repo-managed additions after Aug 20.
          sshpass -e rsync -az -e "ssh $SSH" mu-plugins/ "$STAGING_USER@$STAGING_HOST:$MU_DIR/"
          sshpass -e scp $SCP /tmp/remove-global-mu.txt "$STAGING_USER@$STAGING_HOST:$REMOVE_LIST"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "MU_DIR='$MU_DIR' REMOVE_LIST='$REMOVE_LIST' sh -s" <<'REMOTE'
          set -eu
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            case "$rel" in
              /*|*..*) echo "Unsafe remote removal path: $rel" >&2; exit 1 ;;
            esac
            rm -f -- "$MU_DIR/$rel"
          done < "$REMOVE_LIST"
          rm -f "$REMOVE_LIST"
          REMOTE

          # Supplier sync is restored only if it is installed in production.
          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -d '$SUPPLIER_DIR'"; then
            sshpass -e rsync -az --delete -e "ssh $SSH" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$SUPPLIER_DIR/"
          fi

          local_theme_sha="$(sha256sum elmercadodeorigen-child/functions.php | cut -d' ' -f1)"
          prod_theme_sha="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$THEME_DIR/functions.php' | cut -d' ' -f1")"
          test "$local_theme_sha" = "$prod_theme_sha"

          # Every target root MU file must exist after the sync.
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$MU_DIR/$rel'"
          done < /tmp/target-root-mu.txt
          # Every managed later-only MU file must now be absent.
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -e '$MU_DIR/$rel'"; then
              echo "Later-only MU plugin still present: $rel" >&2
              exit 1
            fi
          done < /tmp/remove-global-mu.txt

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if (function_exists(\"rocket_clean_domain\")) { rocket_clean_domain(); } if (function_exists(\"w3tc_flush_all\")) { w3tc_flush_all(); } if (has_action(\"litespeed_purge_all\")) { do_action(\"litespeed_purge_all\"); } if (function_exists(\"wp_cache_clear_cache\")) { wp_cache_clear_cache(); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          if [ -f .github/scripts/elmercado-opcache-reset.php ]; then
            PROBE="elmercado-opcache-aug20-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
            curl -fsSL --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID" >/dev/null || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" || true
          fi

          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

      - name: Verify actual visible shop product vendors
        id: verify
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          URL="$BASE_URL/tienda/?emdo_aug20_rollback=${GITHUB_RUN_ID}"
          status="$(curl -sS -L --max-time 45 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' -o /tmp/shop.html -w '%{http_code}' "$URL")"
          test "$status" = '200'
          grep -qi 'woocommerce' /tmp/shop.html

          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('/tmp/shop.html').read_text(errors='replace')
          ids = set()
          for tag in re.findall(r'<(?:li|div)\b[^>]*>', html, flags=re.I):
              if re.search(r'class=["\'][^"\']*\bproduct\b[^"\']*["\']', tag, flags=re.I):
                  ids.update(int(x) for x in re.findall(r'\bpost-(\d+)\b', tag))
                  ids.update(int(x) for x in re.findall(r'data-product_id=["\'](\d+)["\']', tag, flags=re.I))
          if not ids:
              ids.update(int(x) for x in re.findall(r'data-product_id=["\'](\d+)["\']', html, flags=re.I))
          if not ids:
              ids.update(int(x) for x in re.findall(r'\bpost-(\d+)\b', html))
          ids = sorted(ids)
          if not ids:
              raise SystemExit('No rendered product IDs found in /tienda/.')
          pathlib.Path('/tmp/visible-product-ids.txt').write_text(','.join(map(str, ids)))
          php_ids = ','.join(map(str, ids))
          pathlib.Path('/tmp/check-visible-vendors.php').write_text(f'''<?php
          $ids = array({php_ids});
          $vendors = array();
          $products = array();
          foreach ($ids as $id) {{
              $post = get_post((int) $id);
              if (!$post || 'product' !== $post->post_type) {{ continue; }}
              $author = (int) $post->post_author;
              $vendors[(string) $author] = (string) get_the_author_meta('display_name', $author);
              $products[] = array('id' => (int) $id, 'author' => $author, 'title' => get_the_title($id));
          }}
          echo '__EMDO_VENDOR_JSON__' . wp_json_encode(array('vendors' => $vendors, 'products' => $products)) . PHP_EOL;
          ''')
          print('Visible product IDs:', ','.join(map(str, ids)))
          PY

          remote_check="/tmp/emdo-visible-vendors-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP /tmp/check-visible-vendors.php "$STAGING_USER@$STAGING_HOST:$remote_check"
          raw="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$remote_check' --path='$PROD_PATH' --allow-root 2>&1; rm -f '$remote_check'")"
          printf '%s\n' "$raw"
          printf '%s\n' "$raw" | sed -n 's/^__EMDO_VENDOR_JSON__//p' | tail -n1 > /tmp/vendor-result.json
          test -s /tmp/vendor-result.json

          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/vendor-result.json').read_text())
          vendors = data.get('vendors') or {}
          products = data.get('products') or []
          if len(products) < 2:
              raise SystemExit(f'Only {len(products)} visible products could be mapped.')
          if len(vendors) < 2:
              raise SystemExit(f'Rollback served products from only one author/vendor: {vendors}')
          pathlib.Path('/tmp/vendor-count.txt').write_text(str(len(vendors)))
          print('Visible product vendors:', vendors)
          print('Mapped visible products:', len(products))
          PY
          echo "Shop HTTP $status; actual rendered product cards map to $(cat /tmp/vendor-count.txt) distinct vendors."

      - name: Record rollback result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json, os, pathlib
          vendor_payload = None
          p = pathlib.Path('/tmp/vendor-result.json')
          if p.exists():
              try: vendor_payload = json.loads(p.read_text())
              except Exception: vendor_payload = p.read_text(errors='replace')[-8000:]
          ids = pathlib.Path('/tmp/visible-product-ids.txt').read_text().strip() if pathlib.Path('/tmp/visible-product-ids.txt').exists() else ''
          result = {
              'status': os.getenv('JOB_STATUS'),
              'run_id': os.getenv('GITHUB_RUN_ID'),
              'sha': os.getenv('GITHUB_SHA'),
              'deploy': os.getenv('DEPLOY_RESULT'),
              'verify': os.getenv('VERIFY_RESULT'),
              'target': '2026-08-20T23:56:54+02:00',
              'source_commit': 'd9eea6799740a9b91f6b5e34fb52508a15995fba',
              'backup': os.getenv('BACKUP', ''),
              'visible_product_ids': ids,
              'visible_vendor_payload': vendor_payload,
          }
          pathlib.Path('.deploy-status/emergency-storefront-rollback-20260822-aug20.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/emergency-storefront-rollback-20260822-aug20.json
          git commit -m "Record Aug20 storefront rollback ${GITHUB_RUN_ID}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

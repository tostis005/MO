name: Emergency storefront rollback production 20260822

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-storefront-rollback-20260822.yml'

permissions:
  contents: write

concurrency:
  group: emergency-storefront-rollback-20260822
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback payload
        run: |
          set -euo pipefail
          grep -q "ELMERCADO_THEME_VERSION', '0.10.260'" elmercadodeorigen-child/functions.php
          test ! -e elmercadodeorigen-child/inc/vendor-ordering-parity-010261.php
          test ! -e mu-plugins/zzz-mdo-catalog-query-coherence-20260822.php
          php -l elmercadodeorigen-child/functions.php >/dev/null
          php -l mu-plugins/emdo-seo-cleanup-layer.php >/dev/null
          php -l mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass rsync >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Restore production runtime
        id: deploy
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s" "$p"
                  break
                  ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          THEME_DIR="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          BACKUP="/tmp/emdo-pre-rollback-${GITHUB_RUN_ID}.tar.gz"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "tar -czf '$BACKUP' --ignore-failed-read -C '$PROD_PATH/wp-content' themes/elmercadodeorigen-child mu-plugins/emdo-seo-cleanup-layer.php mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php mu-plugins/emdo-seo-language-cleanup.php mu-plugins/mdo-blog-image-pagination-010262.php mu-plugins/mdo-english-journal-content-20260821.php mu-plugins/mdo-pinterest-catalog-feed-20260821.php mu-plugins/mdo-pinterest-domain-verification.php mu-plugins/mdo-pinterest-tag-20260821.php mu-plugins/zzz-mdo-catalog-query-coherence-20260822.php mu-plugins/zzzzzzzzz-mdo-producer-ordering-shop-parity-20260821.php 2>/dev/null || true"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$THEME_DIR' '$MU_DIR'"
          sshpass -e rsync -az -e "ssh $SSH" elmercadodeorigen-child/ "$STAGING_USER@$STAGING_HOST:$THEME_DIR/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f \
            '$THEME_DIR/inc/vendor-ordering-parity-010261.php' \
            '$THEME_DIR/mu-plugins/elmercado-vendor-catalog-controls-010270.php' \
            '$THEME_DIR/mu-plugins/elmercado-vendor-ordering-native-retire-010274.php' \
            '$THEME_DIR/mu-plugins/elmercado-vendor-ordering-popover-010272.php' \
            '$THEME_DIR/mu-plugins/elmercado-vendor-ordering-touch-fix-010271.php' \
            '$THEME_DIR/mu-plugins/elmercado-vendor-runtime-stability-010275.php'"

          for name in emdo-seo-cleanup-layer.php zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php; do
            remote="/tmp/${name%.php}-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP "mu-plugins/$name" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$remote' >/dev/null; install -m 0644 '$remote' '$MU_DIR/$name'; rm -f '$remote'"
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f \
            '$MU_DIR/emdo-seo-language-cleanup.php' \
            '$MU_DIR/mdo-blog-image-pagination-010262.php' \
            '$MU_DIR/mdo-english-journal-content-20260821.php' \
            '$MU_DIR/mdo-pinterest-catalog-feed-20260821.php' \
            '$MU_DIR/mdo-pinterest-domain-verification.php' \
            '$MU_DIR/mdo-pinterest-tag-20260821.php' \
            '$MU_DIR/zzz-mdo-catalog-query-coherence-20260822.php' \
            '$MU_DIR/zzzzzzzzz-mdo-producer-ordering-shop-parity-20260821.php'"

          local_theme_sha="$(sha256sum elmercadodeorigen-child/functions.php | cut -d' ' -f1)"
          prod_theme_sha="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$THEME_DIR/functions.php' | cut -d' ' -f1")"
          test "$local_theme_sha" = "$prod_theme_sha"
          for name in emdo-seo-cleanup-layer.php zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php; do
            local_sha="$(sha256sum "mu-plugins/$name" | cut -d' ' -f1)"
            prod_sha="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$MU_DIR/$name' | cut -d' ' -f1")"
            test "$local_sha" = "$prod_sha"
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if (function_exists(\"rocket_clean_domain\")) { rocket_clean_domain(); } if (has_action(\"litespeed_purge_all\")) { do_action(\"litespeed_purge_all\"); } if (function_exists(\"wp_cache_clear_cache\")) { wp_cache_clear_cache(); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          if [ -f .github/scripts/elmercado-opcache-reset.php ]; then
            PROBE="elmercado-opcache-rollback-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
            curl -fsSL --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID" >/dev/null || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" || true
          fi

          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

      - name: Verify production shop
        id: verify
        run: |
          set -euo pipefail
          URL="$BASE_URL/tienda/?emdo_rollback=${GITHUB_RUN_ID}"
          status="$(curl -sS -L --max-time 45 -H 'Cache-Control: no-cache, no-store' -o /tmp/shop.html -w '%{http_code}' "$URL")"
          test "$status" = '200'
          grep -qi 'woocommerce' /tmp/shop.html
          grep -q '1957' /tmp/shop.html
          grep -q 'Hidalgo de la Jara' /tmp/shop.html
          ! grep -q 'mdo-producer-ordering-shop-parity-20260821' /tmp/shop.html
          echo "Shop HTTP $status; multiple vendors visible after rollback."

      - name: Record rollback result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json, os, pathlib
          result = {
              'status': os.getenv('JOB_STATUS'),
              'run_id': os.getenv('GITHUB_RUN_ID'),
              'sha': os.getenv('GITHUB_SHA'),
              'deploy': os.getenv('DEPLOY_RESULT'),
              'verify': os.getenv('VERIFY_RESULT'),
              'target': '2026-08-21T12:56:23+02:00',
              'source_commit': '37cf9a1b668e9e56d8c896bafe7e152a5a380d3d',
              'backup': os.getenv('BACKUP', ''),
          }
          pathlib.Path('.deploy-status/emergency-storefront-rollback-20260822.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/emergency-storefront-rollback-20260822.json
          git commit -m "Record emergency storefront rollback ${GITHUB_RUN_ID}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Final staging English text check 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/multilingual-staging-final-text-check-20260815.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect remaining public staging English text
        shell: bash
        run: |
          set -u
          stamp="${GITHUB_RUN_ID}"
          inspect() {
            path="$1"
            url="https://dev.elmercadodeorigen.com${path}?mdo_final_check=${stamp}"
            code="$(curl -kLsS -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' --max-time 35 "$url")"
            echo "=== $path HTTP $code ==="
            grep -oEi '.{0,220}(nace de la necesidad|was born from the need|consumidores finales|end consumers|Meet the people|people behind|Hablemos|Let[^<]{0,20}talk).{0,260}' /tmp/page.html | sed -E 's/<[^>]+>/ /g' | sed 's/[[:space:]]\+/ /g' | head -n 60 || true
            if grep -Fq 'WordPress database error' /tmp/page.html; then echo 'ERROR: database error visible'; else echo 'PASS: no database error'; fi
          }
          inspect '/en/productores/'
          inspect '/en/quienes-somos/'
          inspect '/en/contacto/'

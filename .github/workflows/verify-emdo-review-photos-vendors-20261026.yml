name: Verify EMDO review photos visible on vendor cards 2026-10-26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-emdo-review-photos-vendors-20261026.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read photo associations in production without mutation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $reviews_table=MDO_Database::table("reviews");
            $rows=$wpdb->get_results( $wpdb->prepare("SELECT * FROM {$reviews_table} WHERE source=%s AND review_images IS NOT NULL AND review_images<>%s ORDER BY id DESC LIMIT 100", "google", "[]") );
            $report=array("reviews_with_photos"=>count($rows),"photos_saved"=>0,"validated_with_photos"=>0,"validated_assigned_to_vendors"=>0,"assigned_vendor_count"=>0,"vendors"=>array());
            foreach($rows as $row) {
              $photos=json_decode((string)$row->review_images,true);
              $count=is_array($photos)?count($photos):0;
              $report["photos_saved"]+=$count;
              if($row->status!=="validated")continue;
              $report["validated_with_photos"]++;
              $vendors=MDO_Reviews_Vendors::get((int)$row->id,$row);
              if(!$vendors)continue;
              $report["validated_assigned_to_vendors"]++;
              $report["assigned_vendor_count"]+=count($vendors);
              foreach($vendors as $vendor) {
                $html=MDO_Reviews_Public::media_gallery($row);
                $store_url=function_exists("wcfmmp_get_store_url")?wcfmmp_get_store_url((int)$vendor):"";
                $report["vendors"][]=array("vendor_id"=>(int)$vendor,"store_url"=>(string)$store_url,"review_photo_count"=>$count,"gallery_rendered"=>strpos($html,"mdo-review-media__grid")!==false);
              }
            }
            echo "PRODUCTION_VENDOR_REVIEW_PHOTOS=".wp_json_encode($report)."\n";
          ' --path="$PROD_PATH" --allow-root
          REMOTE

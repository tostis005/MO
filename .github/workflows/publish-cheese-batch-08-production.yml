name: Publish cheese batch 08 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-08-*.json'
      - '.github/scripts/publish-cheese-batch-08-production.php'
      - '.github/scripts/run-cheese-batch-08-production.php'
      - '.github/workflows/publish-cheese-batch-08-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate clean editorial package
        shell: bash
        run: |
          set -euo pipefail
          for i in {71..80}; do test -f ".github/scripts/cheese-batch-08-$i.json"; done
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path('.github/scripts')
          required={'pos','title','slug','en_title','en_slug','excerpt','en_excerpt','lead_es','lead_en','facts_es','facts_en','sections_es','sections_en','faq_es','faq_en','conclusion_es','conclusion_en','related','sources'}
          articles=[]
          for i in range(71,81):
              d=json.loads((base/f'cheese-batch-08-{i}.json').read_text(encoding='utf-8'))
              assert required <= d.keys(), (i, required-d.keys())
              assert int(d['pos']) == i
              assert len(d['sections_es']) >= 6 and len(d['sections_en']) >= 6
              assert len(d['sources']) >= 2
              articles.append(d)
          assert len({a['slug'] for a in articles}) == 10
          assert len({a['en_slug'] for a in articles}) == 10
          print('CLEAN_EDITORIAL_PACKAGE_OK=10')
          PY
          php -l .github/scripts/publish-cheese-batch-08-production.php
          php -l .github/scripts/run-cheese-batch-08-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese08-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-08-{71..80}.json \
            .github/scripts/publish-cheese-batch-08-production.php \
            .github/scripts/run-cheese-batch-08-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/run-cheese-batch-08-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" 2>&1 | tee /tmp/cheese08-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then grep -F 'EMDO_CHEESE_BATCH08_ERROR:' /tmp/cheese08-output.txt || true; exit "$rc"; fi
          grep -q 'EMDO_CHEESE_BATCH08_BEGIN' /tmp/cheese08-output.txt
          grep -q '"count":10' /tmp/cheese08-output.txt
          grep -q 'EMDO_CHEESE_BATCH08_END' /tmp/cheese08-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'quesos-castilla-la-mancha-manchego-dop-guia-quesos-manchegos'
            'quesos-pais-vasco-navarra-idiazabal-roncal-guia'
            'quesos-murcia-dop-queso-murcia-murcia-al-vino-diferencias-guia'
            'quesos-baleares-mahon-menorca-dop-guia-islas'
            'quesos-oveja-espanoles-dop-zonas-estilos-como-elegir'
            'quesos-cabra-espanoles-dop-zonas-estilos-como-elegir'
            'quesos-vaca-espanoles-dop-zonas-estilos-como-elegir'
            'coagulacion-lactica-enzimatica-mixta-queso-diferencias-textura'
            'queso-pasta-prensada-que-significa-pasta-cocida-no-cocida'
            'por-que-queso-suda-suelta-grasa-condensacion-temperatura'
          )
          en_slugs=(
            'cheeses-castilla-la-mancha-manchego-pdo-regional-guide'
            'cheeses-basque-country-navarre-idiazabal-roncal-guide'
            'cheeses-murcia-queso-de-murcia-murcia-al-vino-pdo-guide'
            'cheeses-balearic-islands-mahon-menorca-pdo-guide'
            'spanish-sheep-cheeses-pdo-regions-styles-how-choose'
            'spanish-goat-cheeses-pdo-regions-styles-how-choose'
            'spanish-cow-cheeses-pdo-regions-styles-how-choose'
            'lactic-enzymatic-mixed-coagulation-cheese-differences-texture'
            'pressed-cheese-meaning-how-made-cooked-uncooked-curd'
            'why-cheese-sweats-releases-oil-condensation-temperature'
          )
          check_url(){ local url="$1" code; for attempt in 1 2 3 4; do code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"; if [ "$code" = 200 ]; then echo "OK $url"; return 0; fi; sleep 4; done; echo "FAILED $code $url" >&2; return 1; }
          for s in "${es_slugs[@]}"; do check_url "$base/$s/"; done
          for s in "${en_slugs[@]}"; do check_url "$base/en/$s/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"
          curl -L -sS --max-time 45 "$base/quesos-pais-vasco-navarra-idiazabal-roncal-guia/?verify=$GITHUB_RUN_ID" -o /tmp/north.html
          grep -Fq 'Dos denominaciones cercanas que no se solapan' /tmp/north.html
          curl -L -sS --max-time 45 "$base/quesos-murcia-dop-queso-murcia-murcia-al-vino-diferencias-guia/?verify=$GITHUB_RUN_ID" -o /tmp/murcia.html
          grep -Fq 'Murcia al Vino: qué hacen realmente los baños de vino' /tmp/murcia.html
          curl -L -sS --max-time 45 "$base/coagulacion-lactica-enzimatica-mixta-queso-diferencias-textura/?verify=$GITHUB_RUN_ID" -o /tmp/coag.html
          grep -Fq 'Coagulación láctica: tiempo y acidificación' /tmp/coag.html
          curl -L -sS --max-time 45 "$base/en/pressed-cheese-meaning-how-made-cooked-uncooked-curd/?verify=$GITHUB_RUN_ID" -o /tmp/pressed-en.html
          grep -Fq 'Uncooked curd does not mean cold curd' /tmp/pressed-en.html
          curl -L -sS --max-time 45 "$base/en/why-cheese-sweats-releases-oil-condensation-temperature/?verify=$GITHUB_RUN_ID" -o /tmp/sweat-en.html
          grep -Fq 'First: water and fat are not the same thing' /tmp/sweat-en.html
          echo 'Cheese batch 08 public editorial verification OK'

name: Deploy curated oil and meat SEO landings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aceites-carnes-landings-production-20260830.yml'
      - '.github/scripts/deploy-aceites-carnes-landings-production-20260830.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify ES EN landings in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-ac-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            .github/scripts/deploy-aceites-carnes-landings-production-20260830.php "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/deploy-aceites-carnes-landings-production-20260830.php' --path='$PROD' --allow-root" > /tmp/ac.json
          cat /tmp/ac.json
          jq -e '.verified==true and .count==11 and .aceites==3 and .carnes==8 and (.pages|length)==11' /tmp/ac.json >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          jq -r '.pages[] | .es_url, .en_url' /tmp/ac.json > /tmp/urls.txt
          while IFS= read -r url; do
            code="$(curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO SEO landing verify' -o /tmp/page.html -w '%{http_code}' "${url}?verify=${GITHUB_RUN_ID}")"
            [ "$code" = "200" ] || { echo "HTTP $code for $url" >&2; exit 20; }
            if grep -Eqi '<meta[^>]+robots[^>]+noindex' /tmp/page.html; then echo "Unexpected noindex: $url" >&2; exit 21; fi
          done < /tmp/urls.txt
          curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO sitemap verify' -o /tmp/pages.xml "https://www.elmercadodeorigen.com/mdo-sitemap-pages.xml?verify=${GITHUB_RUN_ID}"
          while IFS= read -r url; do grep -Fq "$url" /tmp/pages.xml || { echo "Missing from sitemap: $url" >&2; exit 22; }; done < /tmp/urls.txt
          curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO category verify' -o /tmp/oils.html "https://www.elmercadodeorigen.com/categoria-producto/aceites/?verify=${GITHUB_RUN_ID}"
          curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO category verify' -o /tmp/meat.html "https://www.elmercadodeorigen.com/categoria-producto/carnes/?verify=${GITHUB_RUN_ID}"
          for slug in aove-cordoba-directo-almazara aove-arbequina aove-picual; do grep -Fq "/$slug/" /tmp/oils.html || { echo "Oil category link missing: $slug" >&2; exit 23; }; done
          for slug in carne-ternera-online carne-vaca-madurada carne-para-barbacoa packs-lotes-carne carne-para-guisar carne-para-asar filetes-ternera-online hamburguesas-ternera-vaca; do grep -Fq "/$slug/" /tmp/meat.html || { echo "Meat category link missing: $slug" >&2; exit 24; }; done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
          echo all_curated_oil_meat_landings_verified
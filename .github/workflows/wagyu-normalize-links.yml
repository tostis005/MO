name: Normalize Wagyu Editorial Links

on:
  push:
    branches:
      - 'content/wagyu-blog-seo'
    paths:
      - 'tools/wagyu-normalize-links.php'
      - '.github/workflows/wagyu-normalize-links.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize final editorial QA fixes
        run: php tools/wagyu-normalize-links.php

      - name: Commit normalized payloads
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/data/editorial-wagyu-batch*-20260910; then
            echo 'No link normalization changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data/editorial-wagyu-batch*-20260910
          git commit -m 'Apply final Wagyu editorial QA fixes'
          git push

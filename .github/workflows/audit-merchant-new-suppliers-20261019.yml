name: EMDO Merchant - reconcile new supplier products
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-merchant-new-suppliers-20261019.yml'
      - '.github/scripts/audit-merchant-new-suppliers-20261019.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-merchant-new-suppliers-20261019
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar el código PHP
        run: php -l .github/scripts/audit-merchant-new-suppliers-20261019.php
      - name: Compare live published supplier products to country feed eligibility
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${STAGING_HOST:?}" "${STAGING_USER:?}" "${SSHPASS:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$PORT")
          SERVER="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$SERVER" 'sh -s' <<'REMOTE'
          set -eu
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          fi
          test -n "$wp_bin" && test -x "$php_bin"
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p="$(dirname "$cfg")"
            url="$( "$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true )"
            home="$( "$php_bin" "$wp_bin" option get home --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true )"
            case "$url" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                case "$home" in
                  https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                    printf '%s' "$p"; exit 0 ;;
                esac ;;
            esac
          done
          exit 1
          REMOTE
          )"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/emdo-merchant-audit-${GITHUB_RUN_ID}.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/audit-merchant-new-suppliers-20261019.php "$SERVER:$SCRIPT"
          sshpass -e ssh "${SSH[@]}" "$SERVER" "sh -s -- '$PROD_PATH' '$SCRIPT'" <<'REMOTE'
          set -eu
          wp_path="$1"
          script="$2"
          trap 'rm -f "$script"' EXIT
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          fi
          wp_bin="$(command -v wp)"
          echo "EMDO Merchant audit: read only."
          "$php_bin" -d memory_limit=1536M "$wp_bin" eval-file "$script" --path="$wp_path" --skip-themes --allow-root
          echo "No production data was modified."
          REMOTE

      - name: Verify public Merchant XML serves newly imported offers
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 120 --retry 2 --output /tmp/emdo-merchant-es.xml "https://www.elmercadodeorigen.com/emdo-feed/es.xml?audit=$GITHUB_RUN_ID"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 --output /tmp/emdo-sitemap-products.xml "https://www.elmercadodeorigen.com/mdo-sitemap-products.xml?audit=$GITHUB_RUN_ID"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          m = ET.parse('/tmp/emdo-merchant-es.xml').getroot()
          ns={'g':'http://base.google.com/ns/1.0','s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          products=m.findall('channel/item')
          offers={x.find('g:id',ns).text:x for x in products}
          assert len(offers)==len(products), 'Duplicated Merchant offer IDs'
          for pid in ['emdo-17180','emdo-17526']:
              assert pid in offers, 'Missing new vendor offer in public XML: '+pid
          sitemap=ET.parse('/tmp/emdo-sitemap-products.xml').getroot()
          urls={x.text for x in sitemap.findall('s:url/s:loc',ns)}
          for pid in ['emdo-17180','emdo-17526']:
              link=offers[pid].find('g:link',ns).text
              assert link.split('?',1)[0] in urls, 'Merchant product URL is absent from product sitemap: '+pid+' '+link
          print('MERCHANT_PUBLIC_XML_VERIFIED',len(products),'offers,',len(urls),'sitemap URLs, two new-supplier products found in both.')
          PY

name: Production multilingual state 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-multilingual-state-20260816.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;; esac; done
          test -n "$PROD_PATH"
          wplite(){ "$php_bin" -d memory_limit=256M "$wp_bin" --path="$PROD_PATH" --allow-root --skip-plugins --skip-themes "$@"; }
          echo '=== ACTIVE PLUGINS ==='
          wplite option get active_plugins --format=json | grep -oE 'translatepress[^" ]*|falang[^" ]*' || true
          echo '=== INSTALLED DIRS ==='
          [ -d "$PROD_PATH/wp-content/plugins/translatepress-multilingual" ] && echo TRP_DIR=yes || echo TRP_DIR=no
          [ -d "$PROD_PATH/wp-content/plugins/falang" ] && echo FALANG_DIR=yes || echo FALANG_DIR=no
          echo '=== OPTIONS ==='
          printf 'WPLANG='; wplite option get WPLANG || true
          printf 'FALANG_DEFAULT='; wplite option pluck falang default_language || true
          echo '=== METADATA ==='
          printf 'EN_PUBLISHED_1350='; wplite eval 'echo get_post_meta(1350,"_en_US_published",true);' || true
          printf 'EN_TITLE_1350='; wplite eval 'echo get_post_meta(1350,"_en_US_post_title",true);' || true
          echo
          echo '=== PUBLIC ==='
          printf 'ES_HTTP='; curl -sS -o /tmp/es.html -w '%{http_code}\n' --max-time 30 https://www.elmercadodeorigen.com/
          printf 'EN_HTTP='; curl -sS -o /tmp/en.html -w '%{http_code}\n' --max-time 30 https://www.elmercadodeorigen.com/en/
          grep -qi 'elmercado-falang-switcher' /tmp/es.html && echo FALANG_SWITCHER_ES=yes || echo FALANG_SWITCHER_ES=no
          grep -qi 'trp-language-switcher' /tmp/es.html && echo TRP_SWITCHER_ES=yes || echo TRP_SWITCHER_ES=no
          REMOTE
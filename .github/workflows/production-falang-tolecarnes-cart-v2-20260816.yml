name: Production Falang Tolecarnes cart v2 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-falang-tolecarnes-cart-v2-20260816.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save puppeteer-core@24 >/dev/null
      - name: Verify minimum-order language after Falang cart updates
        shell: bash
        run: |
          set -euo pipefail
          cat > ./verify-tolecarnes-v2.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          const base='https://www.elmercadodeorigen.com';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function newIsolatedPage(){
            const ctx=await browser.createBrowserContext();
            const p=await ctx.newPage();
            p.setDefaultTimeout(18000);
            await p.setRequestInterception(true);
            p.on('request',r=>['image','font','media'].includes(r.resourceType())?r.abort():r.continue());
            return {ctx,p};
          }
          async function go(p,url){
            const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000}).catch(()=>null);
            await wait(1600);
            console.log('GO '+url+' => '+(r?r.status():'NO_RESPONSE')+' FINAL '+p.url());
            if(!r||r.status()>=400) throw new Error('Navigation failed: '+url);
          }
          async function cartState(p,label){
            const s=await p.evaluate(()=>({
              url:location.href,
              lang:document.documentElement.lang,
              rows:[...document.querySelectorAll('.woocommerce-cart-form__cart-item,.cart_item')].map(x=>(x.innerText||'').trim()),
              qty:[...document.querySelectorAll('input.qty')].map(x=>x.value),
              notices:[...document.querySelectorAll('.emdo-minimum-order-notices,.woocommerce-error,.woocommerce-message,.woocommerce-info')].map(x=>(x.innerText||'').trim()).filter(Boolean),
              checkout:[...document.querySelectorAll('.checkout-button,.wc-proceed-to-checkout a')].map(x=>(x.innerText||'').trim()),
              body:(document.body?.innerText||'').slice(0,2400)
            }));
            console.log(label+' '+JSON.stringify(s));
            return s;
          }
          async function updateQty(p,qty){
            const input=await p.$('input.qty'); if(!input) throw new Error('No quantity field');
            await input.click({clickCount:3}); await input.type(String(qty));
            await p.evaluate(()=>{const x=document.querySelector('input.qty');x?.dispatchEvent(new Event('change',{bubbles:true}));});
            await wait(500);
            const b=await p.$('button[name="update_cart"],input[name="update_cart"]');
            if(!b) throw new Error('No update-cart control');
            await p.evaluate(el=>{el.disabled=false;el.removeAttribute('disabled');},b);
            await Promise.allSettled([p.waitForNavigation({waitUntil:'domcontentloaded',timeout:15000}),b.click()]);
            await wait(2500);
          }
          function assertEnglish(s,label){
            const n=s.notices.join('\n');
            if(!/Minimum order/i.test(n)||!/You need/i.test(n)) throw new Error(label+': English minimum notice missing: '+n);
            if(/Pedido mínimo|Te faltan/i.test(n)) throw new Error(label+': Spanish minimum copy leaked: '+n);
          }
          function assertSpanish(s,label){
            const n=s.notices.join('\n');
            if(!/Pedido mínimo/i.test(n)||!/Te faltan/i.test(n)) throw new Error(label+': Spanish minimum notice missing: '+n);
            if(/Minimum order|You need/i.test(n)) throw new Error(label+': English minimum copy leaked: '+n);
          }

          // Add on the canonical Spanish storefront (known-good Woo simple-product endpoint), then view same session in English.
          const {ctx,p}=await newIsolatedPage();
          await go(p,base+'/?add-to-cart=5193&quantity=1&verify='+Date.now());
          const added=await p.evaluate(()=>({messages:[...document.querySelectorAll('.woocommerce-message,.woocommerce-error')].map(x=>(x.innerText||'').trim()),cookies:document.cookie}));
          console.log('ADD_RESULT '+JSON.stringify(added));
          await go(p,base+'/en/cart/?verify='+Date.now());
          let s=await cartState(p,'EN_Q1');
          if(!s.rows.length) throw new Error('Tolecarnes 5193 was not added even from Spanish storefront');
          if(!/^en/i.test(s.lang)) throw new Error('English cart html lang wrong: '+s.lang);
          assertEnglish(s,'EN_Q1');

          await updateQty(p,6);
          s=await cartState(p,'EN_Q6');
          if(!s.qty.includes('6')) throw new Error('Cart quantity did not update to 6');
          assertEnglish(s,'EN_Q6');
          if(s.checkout.length) throw new Error('Checkout visible below Tolecarnes €60 minimum at qty 6');

          await updateQty(p,7);
          s=await cartState(p,'EN_Q7');
          if(!s.qty.includes('7')) throw new Error('Cart quantity did not update to 7');
          const n7=s.notices.join('\n');
          if(/Minimum order|Pedido mínimo|You need|Te faltan/i.test(n7)) throw new Error('Minimum notice remains above €60: '+n7);
          if(!s.checkout.length) throw new Error('Checkout not restored above Tolecarnes €60 minimum at qty 7');

          await updateQty(p,6);
          s=await cartState(p,'EN_Q6_AGAIN');
          assertEnglish(s,'EN_Q6_AGAIN');
          console.log('ENGLISH_TOLECARNES_MINIMUM_REPEATED_UPDATES_OK');
          await ctx.close();

          // Independent Spanish session must remain Spanish.
          const iso=await newIsolatedPage();
          await go(iso.p,base+'/?add-to-cart=5193&quantity=1&verify_es='+Date.now());
          await go(iso.p,base+'/carrito/?verify_es_cart='+Date.now());
          const es=await cartState(iso.p,'ES_Q1');
          if(!es.rows.length) throw new Error('Tolecarnes not in Spanish cart');
          assertSpanish(es,'ES_Q1');
          console.log('SPANISH_TOLECARNES_MINIMUM_OK');
          await iso.ctx.close();

          console.log('TOLECARNES_FALANG_CART_V2_OK');
          await browser.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./verify-tolecarnes-v2.mjs

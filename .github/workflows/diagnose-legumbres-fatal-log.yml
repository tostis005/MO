name: Diagnose Legumbres production fatal log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-legumbres-fatal-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read recent production PHP errors only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          ASKPASS="$RUNNER_TEMP/emdo-askpass.sh"
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          printf '%s\n' "$STAGING_PASSWORD"
          SH
          chmod 700 "$ASKPASS"
          export SSH_ASKPASS="$ASKPASS"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          SSH_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$PORT")

          setsid -w ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" 'bash -s' < /dev/null <<'REMOTE'
          set -eu
          wp=$(command -v wp || true)
          php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          [ -n "$wp" ] || exit 2
          [ -n "$php" ] || exit 3
          prod=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
            esac
          done
          [ -n "$prod" ] || exit 4
          base=$(dirname "$prod")
          echo "PRODUCTION_PATH=$prod"
          echo "--- matching recent fatal/error lines ---"

          files=""
          for f in "$prod/wp-content/debug.log" "$prod/error_log" "$base/logs/error_log" "$base/logs/proxy_error_log" "$base/logs/php_errors.log"; do
            [ -f "$f" ] && files="$files $f"
          done
          extra=$(find "$base" /var/www/vhosts/system -maxdepth 5 -type f \( -name 'error_log' -o -name 'proxy_error_log' -o -name 'php_errors.log' -o -name 'debug.log' \) -mmin -360 2>/dev/null | head -n 30 || true)
          files="$files $extra"

          seen=""
          for f in $files; do
            case " $seen " in *" $f "*) continue;; esac
            seen="$seen $f"
            echo "### $f"
            tail -n 8000 "$f" 2>/dev/null | grep -Eai 'PHP Fatal|Uncaught|Allowed memory|Maximum execution|critical|legumbr|nutrientes-legumbres|que-legumbre|garbanzos-lentejas|1369[2-6]' | tail -n 160 || true
          done

          echo "--- current post states ---"
          "$php" "$wp" post list --path="$prod" --allow-root --post_type=post --include=13692,13693,13694,13695,13696 --fields=ID,post_status,post_name,post_title --format=table 2>/dev/null || true
          REMOTE

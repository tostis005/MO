name: Editorial authority batch 14 isolated publish 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-editorial-authority-batch14-20260826.php'
      - '.github/data/editorial-authority-batch14-20260826/**'
      - '.github/workflows/editorial-authority-batch14-20260826.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-authority-batch14-20260826-isolated
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish four articles independently
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-editorial-authority-batch14-20260826.php
          test "$(find .github/data/editorial-authority-batch14-20260826 -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 4
          for f in .github/data/editorial-authority-batch14-20260826/*.php; do php -l "$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-ab14-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch14-20260826.php "$STAGING_USER@$STAGING_HOST:$PUB"
          sshpass -e scp $SCP .github/data/editorial-authority-batch14-20260826/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
          : >/tmp/ab14-publish.txt
          for localfile in .github/data/editorial-authority-batch14-20260826/*.php; do
            bn="$(basename "$localfile")"
            echo "=== $bn ===" | tee -a /tmp/ab14-publish.txt
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH14_DIR='$DATA' EMDO_BATCH14_ONLY_FILE='$bn' '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" | tee -a /tmp/ab14-publish.txt
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT k.meta_value,p.ID,p.post_status,p.post_name,en.meta_value AS en_slug,thumb.meta_value AS thumbnail_id FROM wp_posts p JOIN wp_postmeta b ON b.post_id=p.ID AND b.meta_key='_emdo_authority_batch' AND b.meta_value='14' JOIN wp_postmeta k ON k.post_id=p.ID AND k.meta_key='_emdo_authority_key' LEFT JOIN wp_postmeta en ON en.post_id=p.ID AND en.meta_key='_en_US_post_name' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" | tee /tmp/ab14-db.txt
          test "$(grep -c $'\tpublish\t' /tmp/ab14-db.txt)" -eq 4
          test "$(awk -F '\t' '{print $6}' /tmp/ab14-db.txt | grep -E '^[0-9]+$' | sort -u | wc -l)" -eq 4

      - name: Verify eight public views
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; marker="$2"; f=/tmp/ab14-page.html; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$f" -w '%{http_code}' "$url?ab14=$stamp"); test "$c" = 200; grep -Fq "EMDO_AUTHORITY_BATCH14:$marker" "$f"; grep -Eq 'class="[^"]*products|class="[^"]*product' "$f"; ! grep -Fq '[products ' "$f"; grep -Fq 'emo-article-featured' "$f"; }
          check "$BASE/que-es-embutido-curado-como-se-elabora-diferencia-embutido-fresco/" what-is-cured-sausage-guide
          check "$BASE/en/what-is-cured-sausage-how-it-is-made-difference-fresh-sausage/" what-is-cured-sausage-guide
          check "$BASE/sobrasada-iberica-que-es-como-se-elabora-que-mirar-al-comprarla/" iberian-sobrasada-guide
          check "$BASE/en/iberian-sobrasada-what-it-is-how-made-what-to-look-for-when-buying/" iberian-sobrasada-guide
          check "$BASE/tipos-de-pimientos-lamuyo-california-italiano-morron-variedades/" pepper-types-guide
          check "$BASE/en/types-of-peppers-lamuyo-california-italian-bell-pepper-varieties/" pepper-types-guide
          check "$BASE/tipos-de-cebolla-blanca-dulce-morada-amarilla-cebolleta-diferencias/" onion-types-guide
          check "$BASE/en/types-of-onions-white-sweet-red-yellow-spring-onion-differences/" onion-types-guide

      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os
          rows=[]
          for line in open('/tmp/ab14-db.txt',encoding='utf-8'):
              p=line.rstrip('\n').split('\t')
              if len(p)>=6:
                  rows.append({'key':p[0],'id':int(p[1]),'status':p[2],'slug':p[3],'en_slug':p[4],'thumbnail_id':int(p[5])})
          data={'batch':14,'release':'20260826','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':True,'posts':rows}
          open('.deploy-status/editorial-authority-batch14-20260826.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch14-20260826.json
          git commit -m 'Record verified editorial authority batch 14 publication [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

name: Deploy Pinterest catalog feed

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-pinterest-catalog-feed-20260821.php'
      - '.github/workflows/deploy-pinterest-catalog-feed-production-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinterest-catalog-feed-production
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy and verify feed
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -u
          mkdir -p .deploy-status
          LOG='.deploy-status/pinterest-catalog-feed-20260821.txt'
          EXIT='.deploy-status/pinterest-catalog-feed-20260821.exit-code'

          set +e
          {
            set -euo pipefail
            php -l mu-plugins/mdo-pinterest-catalog-feed-20260821.php
            : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass >/dev/null

            PORT="${STAGING_PORT:-22}"
            SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
            SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

            PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
              wp_bin=$(command -v wp || true)
              php_bin=$(command -v php || true)
              [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
              for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
                p=$(dirname "$cfg")
                url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
                case "$url" in
                  https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
                esac
              done
            ')"
            : "${PROD_PATH:?production path not found}"
            echo 'production_path_ok'

            TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-pinterest-catalog-feed-20260821.php"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp '$TARGET' '$TARGET.bak-${GITHUB_RUN_ID}'; fi"
            sshpass -e scp $SCP mu-plugins/mdo-pinterest-catalog-feed-20260821.php "$STAGING_USER@$STAGING_HOST:$TARGET"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -l '$TARGET' >/dev/null
              wp_bin=\$(command -v wp || true)
              if [ -n \"\$wp_bin\" ]; then
                \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
              fi
            "
            echo 'deploy_ok'

            curl -fsSL --max-time 90 -A 'Pinterest/0.2 (+https://www.pinterest.com/bot.html)' \
              'https://www.elmercadodeorigen.com/pinterest-catalog.csv' \
              -o /tmp/pinterest-catalog.csv

            python3 - <<'PY'
          import csv, io, sys, urllib.request
          path = '/tmp/pinterest-catalog.csv'
          raw = open(path, 'rb').read()
          text = raw.decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(text))
          required = ['id','title','description','link','image_link','price','availability']
          missing_headers = [x for x in required if x not in (reader.fieldnames or [])]
          if missing_headers:
              raise SystemExit('missing_headers=' + ','.join(missing_headers))
          rows = list(reader)
          if not rows:
              raise SystemExit('feed_has_no_rows')
          bad = []
          ids = set()
          dupes = []
          allowed_availability = {'in stock','out of stock','preorder'}
          variant_rows = 0
          for i, row in enumerate(rows, start=2):
              for field in required:
                  if not (row.get(field) or '').strip():
                      bad.append(f'row{i}:{field}')
              pid = (row.get('id') or '').strip()
              if pid in ids:
                  dupes.append(pid)
              ids.add(pid)
              if (row.get('availability') or '').strip() not in allowed_availability:
                  bad.append(f'row{i}:availability_value')
              if (row.get('item_group_id') or '').strip():
                  variant_rows += 1
          if bad:
              raise SystemExit('bad_required=' + ','.join(bad[:20]))
          if dupes:
              raise SystemExit('duplicate_ids=' + ','.join(dupes[:20]))
          print(f'rows={len(rows)}')
          print(f'variant_rows={variant_rows}')
          print(f'bytes={len(raw)}')
          print('headers=' + ','.join(reader.fieldnames or []))
          print('required_fields_ok')
          print('unique_ids_ok')
          print('availability_ok')
          PY

            # Check a representative sample of landing pages and images from an external runner.
            python3 - <<'PY'
          import csv, io, urllib.request
          raw = open('/tmp/pinterest-catalog.csv','rb').read().decode('utf-8-sig')
          rows = list(csv.DictReader(io.StringIO(raw)))
          sample = rows[:12]
          ua = 'Pinterest/0.2 (+https://www.pinterest.com/bot.html)'
          for kind in ('link','image_link'):
              ok = 0
              for row in sample:
                  req = urllib.request.Request(row[kind], headers={'User-Agent': ua})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          if 200 <= r.status < 400:
                              ok += 1
                  except Exception as exc:
                      print(f'{kind}_failure={row["id"]}:{exc}')
              print(f'{kind}_sample_ok={ok}/{len(sample)}')
              if ok < max(1, len(sample)-2):
                  raise SystemExit(f'{kind}_sample_too_many_failures')
          print('external_sample_ok')
          PY

            echo 'pinterest_catalog_feed_ok'
          } > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "$CODE" > "$EXIT"
          cat "$LOG"
          echo "exit_code=$CODE"

      - name: Persist validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          test -f .deploy-status/pinterest-catalog-feed-20260821.txt || echo 'workflow_failed_before_log' > .deploy-status/pinterest-catalog-feed-20260821.txt
          test -f .deploy-status/pinterest-catalog-feed-20260821.exit-code || echo '99' > .deploy-status/pinterest-catalog-feed-20260821.exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/pinterest-catalog-feed-20260821.txt .deploy-status/pinterest-catalog-feed-20260821.exit-code
          if ! git diff --cached --quiet; then
            git commit -m 'Record Pinterest catalog feed validation [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Fail if validation failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .deploy-status/pinterest-catalog-feed-20260821.exit-code)" = '0'
          grep -q '^pinterest_catalog_feed_ok$' .deploy-status/pinterest-catalog-feed-20260821.txt

name: Deploy Pinterest catalog feed

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-pinterest-catalog-feed-20260821.php'
      - 'mu-plugins/mdo-pinterest-tag-20260821.php'
      - '.github/workflows/deploy-pinterest-catalog-feed-production-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinterest-catalog-feed-production
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy and verify Pinterest feed and tag
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -u
          mkdir -p .deploy-status
          LOG='.deploy-status/pinterest-catalog-feed-20260821.txt'
          EXIT='.deploy-status/pinterest-catalog-feed-20260821.exit-code'

          set +e
          {
            set -euo pipefail
            php -l mu-plugins/mdo-pinterest-catalog-feed-20260821.php
            php -l mu-plugins/mdo-pinterest-tag-20260821.php
            : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass >/dev/null

            PORT="${STAGING_PORT:-22}"
            SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
            SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

            PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
              wp_bin=$(command -v wp || true)
              php_bin=$(command -v php || true)
              [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
              for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
                p=$(dirname "$cfg")
                url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
                case "$url" in
                  https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
                esac
              done
            ')"
            : "${PROD_PATH:?production path not found}"
            echo 'production_path_ok'

            FEED_TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-pinterest-catalog-feed-20260821.php"
            TAG_TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-pinterest-tag-20260821.php"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
            sshpass -e scp $SCP mu-plugins/mdo-pinterest-catalog-feed-20260821.php "$STAGING_USER@$STAGING_HOST:$FEED_TARGET"
            sshpass -e scp $SCP mu-plugins/mdo-pinterest-tag-20260821.php "$STAGING_USER@$STAGING_HOST:$TAG_TARGET"

            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -l '$FEED_TARGET' >/dev/null
              \"\$php_bin\" -l '$TAG_TARGET' >/dev/null
              grep -Fq '2612375296577' '$TAG_TARGET'
              grep -Fq 'cookielawinfo-checkbox-non-necessary' '$TAG_TARGET'
              wp_bin=\$(command -v wp || true)
              if [ -n \"\$wp_bin\" ]; then
                \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
                \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'if (function_exists("elmercado_flush_home_cache")) { elmercado_flush_home_cache(); echo "home_cache_flushed\\n"; } if (function_exists("rocket_clean_domain")) rocket_clean_domain(); if (function_exists("wp_cache_clear_cache")) wp_cache_clear_cache(); if (function_exists("w3tc_flush_all")) w3tc_flush_all(); do_action("litespeed_purge_all");' --path='$PROD_PATH' --allow-root || true
              fi
            "
            echo 'deploy_ok'

            curl -fsSL --max-time 90 -A 'Pinterest/0.2 (+https://www.pinterest.com/bot.html)' \
              'https://www.elmercadodeorigen.com/pinterest-catalog.csv' \
              -o /tmp/pinterest-catalog.csv

            python3 - <<'PY'
          import csv, io
          raw = open('/tmp/pinterest-catalog.csv','rb').read()
          text = raw.decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(text))
          required = ['id','title','description','link','image_link','price','availability']
          missing = [x for x in required if x not in (reader.fieldnames or [])]
          if missing:
              raise SystemExit('missing_headers=' + ','.join(missing))
          rows = list(reader)
          if not rows:
              raise SystemExit('feed_has_no_rows')
          ids = set()
          bad = []
          for i,row in enumerate(rows, start=2):
              for field in required:
                  if not (row.get(field) or '').strip(): bad.append(f'row{i}:{field}')
              pid=(row.get('id') or '').strip()
              if pid in ids: bad.append(f'row{i}:duplicate_id')
              ids.add(pid)
          if bad: raise SystemExit('bad=' + ','.join(bad[:20]))
          print(f'rows={len(rows)}')
          print('required_fields_ok')
          print('unique_ids_ok')
          PY
            echo 'pinterest_catalog_feed_ok'

            # First uncached request should rebuild EMDO's 10-minute Home cache with the tag.
            curl -ksS --max-time 60 -D /tmp/pinterest-home-headers.txt \
              'https://www.elmercadodeorigen.com/' -o /tmp/pinterest-home.html
            grep -Ei '^(HTTP/|x-el-mercado-cache:)' /tmp/pinterest-home-headers.txt || true
            grep -Fq '2612375296577' /tmp/pinterest-home.html
            grep -Fq 's.pinimg.com/ct/core.js' /tmp/pinterest-home.html
            grep -Fq 'cookielawinfo-checkbox-non-necessary' /tmp/pinterest-home.html
            if grep -Fq '<user_email_address>' /tmp/pinterest-home.html; then
              echo 'ERROR_placeholder_email_exposed'
              exit 31
            fi
            echo 'placeholder_email_absent'

            # Second request validates the normal cached representation too.
            curl -ksS --max-time 60 -D /tmp/pinterest-home-headers2.txt \
              'https://www.elmercadodeorigen.com/' -o /tmp/pinterest-home2.html
            grep -Ei '^(HTTP/|x-el-mercado-cache:)' /tmp/pinterest-home-headers2.txt || true
            grep -Fq '2612375296577' /tmp/pinterest-home2.html
            grep -Fq 's.pinimg.com/ct/core.js' /tmp/pinterest-home2.html
            echo 'public_home_tag_ok'
            echo 'pinterest_tag_ok'
          } > "$LOG" 2>&1
          CODE=$?
          set -e
          echo "$CODE" > "$EXIT"
          cat "$LOG"
          echo "exit_code=$CODE"

      - name: Persist validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          test -f .deploy-status/pinterest-catalog-feed-20260821.txt || echo 'workflow_failed_before_log' > .deploy-status/pinterest-catalog-feed-20260821.txt
          test -f .deploy-status/pinterest-catalog-feed-20260821.exit-code || echo '99' > .deploy-status/pinterest-catalog-feed-20260821.exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/pinterest-catalog-feed-20260821.txt .deploy-status/pinterest-catalog-feed-20260821.exit-code
          if ! git diff --cached --quiet; then
            git commit -m 'Record Pinterest catalog and tag validation [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Fail if validation failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .deploy-status/pinterest-catalog-feed-20260821.exit-code)" = '0'
          grep -q '^pinterest_catalog_feed_ok$' .deploy-status/pinterest-catalog-feed-20260821.txt
          grep -q '^pinterest_tag_ok$' .deploy-status/pinterest-catalog-feed-20260821.txt

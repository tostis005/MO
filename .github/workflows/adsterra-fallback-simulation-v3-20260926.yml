name: Simulate Adsterra to AdSense fallback v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-fallback-simulation-v3-20260926.yml'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Browser simulation
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options

          POST='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/'
          ADSTERRA=('highrevenueformat.com','profitableratecpmnetwork.com','profitablecpmrate.com','adsterra.com')

          def run(label,country,block=False):
              o=Options()
              o.page_load_strategy='eager'
              for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=en-US'):
                  o.add_argument(arg)
              o.set_capability('goog:loggingPrefs',{'performance':'ALL'})
              d=webdriver.Chrome(options=o)
              d.set_page_load_timeout(45)
              try:
                  d.execute_cdp_cmd('Network.enable',{})
                  if block:
                      d.execute_cdp_cmd('Network.setBlockedURLs',{'urls':[
                          '*://*.highrevenueformat.com/*',
                          '*://*.profitableratecpmnetwork.com/*',
                          '*://*.profitablecpmrate.com/*',
                          '*://*.adsterra.com/*'
                      ]})
                  src="""(() => {
                    const f=window.fetch;
                    window.fetch=function(input,init){
                      const u=typeof input==='string'?input:(input&&input.url)||'';
                      if(u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                        init=Object.assign({},init||{});
                        const h=new Headers(init.headers||{});
                        h.set('X-Country-Code','COUNTRY');
                        init.headers=h;
                      }
                      return f.call(this,input,init);
                    };
                  })();""".replace('COUNTRY',country)
                  d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':src})
                  try:
                      d.get(POST+'?adsterra_debug=1&sim='+label)
                  except TimeoutException:
                      print(label+'_PAGE_TIMEOUT=1',flush=True)
                      try: d.execute_script('window.stop()')
                      except Exception: pass
                  time.sleep(12)
                  state=d.execute_script(r"""
                    const slots=Array.from(document.querySelectorAll('[data-emo-adsterra-slot]'));
                    return {
                      debug:window.ElMercadoAdsterraGeoDebug||null,
                      fallbackRoot:document.documentElement.classList.contains('emo-adsterra-adsense-fallback'),
                      googleScripts:Array.from(document.scripts).map(s=>s.src||'').filter(u=>u.includes('googlesyndication.com/pagead/js/adsbygoogle.js')).length,
                      adsterraFrames:document.querySelectorAll('iframe[data-emo-adsterra-token]').length,
                      slots:slots.map(s=>({
                        type:s.getAttribute('data-emo-adsterra-slot'),
                        state:s.getAttribute('data-emo-adsterra-state'),
                        eligible:s.classList.contains('is-eligible'),
                        fallback:s.classList.contains('is-adsense-fallback'),
                        adsenseFilled:s.classList.contains('is-adsense-filled'),
                        display:getComputedStyle(s).display,
                        h:Math.round(s.getBoundingClientRect().height),
                        status:(s.querySelector('ins.adsbygoogle')&&s.querySelector('ins.adsbygoogle').getAttribute('data-ad-status'))||null
                      }))
                    };
                  """)
                  perf=d.get_log('performance')
                  urls=[]
                  for e in perf:
                      try:m=json.loads(e['message'])['message']
                      except Exception:continue
                      if m.get('method')=='Network.requestWillBeSent':
                          u=m.get('params',{}).get('request',{}).get('url','')
                          if any(h in u for h in ADSTERRA) or 'googlesyndication.com' in u or 'doubleclick.net' in u:
                              urls.append(u)
                  state['adsterraReq']=sum(any(h in u for h in ADSTERRA) for u in urls)
                  state['googleReq']=sum(('googlesyndication.com' in u or 'doubleclick.net' in u) for u in urls)
                  print(label+'='+json.dumps(state,sort_keys=True),flush=True)
                  return state
              finally:
                  d.quit()

          es=run('ES','ES',False)
          normal=run('ZA_NORMAL','ZA',False)
          forced=run('ZA_FORCED_FAIL','ZA',True)

          assert es['debug'] and es['debug']['showAds'] is False, es
          assert es['googleScripts']==0 and not es['fallbackRoot'], es
          assert normal['debug'] and normal['debug']['showAds'] is True, normal
          assert normal['debug']['attempted']>=1, normal
          assert forced['debug'] and forced['debug']['showAds'] is True, forced
          assert forced['debug']['fallback'] is True, forced
          assert forced['fallbackRoot'] is True, forced
          assert forced['googleScripts']>=1, forced
          assert any(s['fallback'] for s in forced['slots']), forced
          print('SIMULATION_RESULT=PASS',flush=True)
          PY

name: Catalogue CSS-only safety v2 2026-08-28
on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog-css-only-safety-v2-20260828.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate CSS-only file
        run: |
          set -euo pipefail
          f='mu-plugins/zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'
          php -l "$f" >/dev/null
          ! grep -Eq '<script|MutationObserver|ResizeObserver|requestAnimationFrame|setInterval' "$f"
      - name: Deploy candidate
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD:?production path not found}"; echo "PROD=$PROD" >> "$GITHUB_ENV"
          NAME='zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'; TARGET="$PROD/wp-content/mu-plugins/$NAME"; BACKUP="/tmp/$NAME.$GITHUB_RUN_ID.backup"; echo "TARGET=$TARGET" >> "$GITHUB_ENV"; echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$TARGET'"; then sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BACKUP'"; echo EXISTED=1 >> "$GITHUB_ENV"; else echo EXISTED=0 >> "$GITHUB_ENV"; fi
          R="/tmp/$NAME.$GITHUB_RUN_ID"; sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$R"; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php -l '$R' >/dev/null && install -m0644 '$R' '$TARGET' && rm -f '$R'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Verify exact mobile contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time,json,sys
          urls={'global':'https://www.elmercadodeorigen.com/tienda/?css_only_v2=1','producer':'https://www.elmercadodeorigen.com/tienda/1957/?css_only_v2=1'}
          widths=[335,360,390,640,767]
          bad=[]; out={}
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for w in widths:
              out[w]={}
              for k,u in urls.items():
                pg=b.new_page(viewport={'width':w,'height':820}); pg.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','font','media') else r.continue_()); pg.goto(u,wait_until='commit',timeout=30000)
                d=None
                for _ in range(35):
                  time.sleep(.3)
                  try:
                    d=pg.evaluate('''() => {const t=document.querySelector('.emo-catalog-toolbar-shared-010229'),f=t?.querySelector('.woocommerce-ordering'),s=f?.querySelector('select[name="orderby"]'),d=t?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]');const b=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}};return {ok:!!(t&&f&&s&&d),t:b(t),f:b(f),s:b(s),d:b(d),safety:!!document.getElementById('mdo-catalog-css-only-safety-20260828'),old:[!!document.getElementById('mdo-catalog-control-widths-20260828'),!!document.getElementById('mdo-catalog-mobile-runtime-guard-20260824'),!!document.getElementById('mdo-catalog-top-controls-parity-final-20260824-js'),!!document.getElementById('mdo-catalog-top-controls-arrow-final-20260824-js'),!!document.getElementById('elmercado-catalog-mobile-controls-parity-script-010236')],overflow:document.documentElement.scrollWidth-innerWidth,pointer:s?getComputedStyle(s).pointerEvents:null}}''')
                    if d['ok']:
                      time.sleep(.6); d=pg.evaluate('''() => {const t=document.querySelector('.emo-catalog-toolbar-shared-010229'),f=t.querySelector('.woocommerce-ordering'),s=f.querySelector('select[name="orderby"]'),d=t.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]');const b=e=>{const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}};return {ok:true,t:b(t),f:b(f),s:b(s),d:b(d),safety:!!document.getElementById('mdo-catalog-css-only-safety-20260828'),old:[!!document.getElementById('mdo-catalog-control-widths-20260828'),!!document.getElementById('mdo-catalog-mobile-runtime-guard-20260824'),!!document.getElementById('mdo-catalog-top-controls-parity-final-20260824-js'),!!document.getElementById('mdo-catalog-top-controls-arrow-final-20260824-js'),!!document.getElementById('elmercado-catalog-mobile-controls-parity-script-010236')],overflow:document.documentElement.scrollWidth-innerWidth,pointer:getComputedStyle(s).pointerEvents}}'''); break
                  except Exception: d=None
                out[w][k]=d
                if not d or not d['safety']: bad.append(f'{k} {w}: unavailable/safety missing')
                else:
                  if any(d['old']): bad.append(f'{k} {w}: retired writer present {d["old"]}')
                  if d['overflow']>1: bad.append(f'{k} {w}: overflow {d["overflow"]}')
                  if abs(d['f']['w']-d['s']['w'])>2 or abs(d['d']['w']-d['s']['w'])>3: bad.append(f'{k} {w}: widths d={d["d"]["w"]} f={d["f"]["w"]} s={d["s"]["w"]}')
                  if w==335 and d['s']['w']<260: bad.append(f'{k} 335: narrow {d["s"]["w"]}')
                  if d['t']['h']<125: bad.append(f'{k} {w}: toolbar h={d["t"]["h"]}')
                  if d['pointer']=='none': bad.append(f'{k} {w}: select blocked')
                  t0=time.time(); pg.locator('.emo-catalog-toolbar-shared-010229 select[name="orderby"]').focus(timeout=1500); dt=time.time()-t0
                  if dt>.75: bad.append(f'{k} {w}: focus sluggish {dt:.3f}')
                pg.close()
            b.close()
          print(json.dumps(out,ensure_ascii=False,indent=2));
          if bad: print('ERRORS\n'+'\n'.join(bad)); sys.exit(1)
          print('CATALOG_CSS_ONLY_SAFETY_V2_VERIFIED=true')
          PY
      - name: Roll back on failure
        if: failure() && env.TARGET != ''
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "${EXISTED:-0}" = 1 ]; then sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 '$BACKUP' '$TARGET'; rm -f '$BACKUP'"; else sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET'"; fi
      - name: Remove backup
        if: success() && env.EXISTED == '1'
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

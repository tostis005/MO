name: Audit Adsterra network responses

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-network-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Inspect Adsterra network and console
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&network_audit=1'
          o=Options(); o.page_load_strategy='none'
          o.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
              (()=>{const f=window.fetch;window.fetch=function(input,init){
                const u=typeof input==='string'?input:(input&&input.url)||'';
                if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                  init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                  h.set('X-Country-Code','ZA');init.headers=h;
                }
                return f.call(this,input,init);
              };})();"""})
              d.get(URL)
              time.sleep(8)

              perf=[]
              for entry in d.get_log('performance'):
                  try:
                      msg=json.loads(entry['message'])['message']
                  except Exception:
                      continue
                  if msg.get('method') not in ('Network.responseReceived','Network.loadingFailed'):
                      continue
                  p=msg.get('params',{})
                  if msg['method']=='Network.responseReceived':
                      r=p.get('response',{})
                      u=r.get('url','')
                      if any(x in u for x in ('highrevenueformat','profitableratecpmnetwork','adsterra-frame')):
                          perf.append({'kind':'response','status':r.get('status'),'mime':r.get('mimeType'),'url':u})
                  else:
                      u=p.get('url','')
                      if any(x in u for x in ('highrevenueformat','profitableratecpmnetwork','adsterra-frame')):
                          perf.append({'kind':'failed','error':p.get('errorText'),'blocked':p.get('blockedReason'),'url':u})

              browser=[x for x in d.get_log('browser') if any(k in x.get('message','').lower() for k in ('adsterra','highrevenue','profitablerate','refused','blocked','failed'))]
              state=d.execute_script(r"""
                return {
                  debug:window.ElMercadoAdsterraGeoDebug||null,
                  adsterraSlots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map(s=>({
                    type:s.getAttribute('data-emo-adsterra-slot'),
                    state:s.getAttribute('data-emo-adsterra-state'),
                    hydrated:s.getAttribute('data-emo-adsterra-hydrated')
                  })),
                  googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length
                };
              """)
              print('NETWORK='+json.dumps(perf,sort_keys=True),flush=True)
              print('BROWSER='+json.dumps(browser,sort_keys=True),flush=True)
              print('STATE='+json.dumps(state,sort_keys=True),flush=True)
          finally:
              d.quit()
          PY

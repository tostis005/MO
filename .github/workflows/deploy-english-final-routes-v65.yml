name: Deploy English final routes v65

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          php -l mu-plugins/mdo-zzz-english-launch-quality-010262.php
          php -l mu-plugins/mdo-zzz-english-dynamic-routes-010264.php
          php -l .github/scripts/fix-english-tag-slugs-v65.php
      - name: Deploy English route fixes and canonical tag slugs
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          for f in mdo-zzz-english-launch-quality-010262.php mdo-zzz-english-dynamic-routes-010264.php; do
            remote="$PROD_PATH/wp-content/mu-plugins/$f"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; test ! -f '$remote' || cp -p '$remote' '$remote.bak-${GITHUB_RUN_ID}'"
            sshpass -e scp $SCP "mu-plugins/$f" "$STAGING_USER@$STAGING_HOST:$remote"
          done
          REMOTE_SCRIPT="/tmp/mdo-en-tags-v65-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/fix-english-tag-slugs-v65.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-launch-quality-010262.php'; \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-dynamic-routes-010264.php'; \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$PROD_PATH/wp-content/cache/mdo-page-cache' '$PROD_PATH/wp-content/mdo-page-cache'; wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify English navigation and checkout end to end
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 AppleWebKit/537.36 Chrome/126 Safari/537.36'
          get(){ u="$1" f="$2"; s=$(curl -A "$UA" -L -sS --max-time 45 -o "$f" -w '%{http_code}' "$u"); echo "$s $u"; test "$s" = 200; }

          get 'https://www.elmercadodeorigen.com/en/journal/' /tmp/journal
          grep -q 'November is harvest time' /tmp/journal
          ! grep -qi 'Noviembre es la época de recolección' /tmp/journal

          get 'https://www.elmercadodeorigen.com/en/shop/page/2/' /tmp/shop2
          grep -qi 'Shop' /tmp/shop2
          ! grep -qiE '>\s*(Tienda|Filtros|Ordenar por|Mostrando)\s*<' /tmp/shop2

          get 'https://www.elmercadodeorigen.com/en/product-category/meat/page/2/' /tmp/meat2
          grep -qi 'Meat' /tmp/meat2
          ! grep -qiE '>\s*(Carne|Filtros|Ordenar por|Mostrando)\s*<' /tmp/meat2

          get 'https://www.elmercadodeorigen.com/en/my-account/lost-password/' /tmp/lost
          grep -qiE 'lost.*password|reset.*password' /tmp/lost
          ! grep -qiE 'contrase(ñ|&ntilde;)a|correo electr[oó]nico' /tmp/lost

          curl -A "$UA" -sS --max-time 30 -o /dev/null -D /tmp/vendorh 'https://www.elmercadodeorigen.com/en/vendor-registration/'
          code=$(awk 'toupper($1)~/^HTTP\//{x=$2}END{print x}' /tmp/vendorh)
          loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/vendorh)
          echo "vendor=$code $loc"; test "$code" = 301; case "$loc" in */en/for-producers/) ;; *) exit 1;; esac

          get 'https://www.elmercadodeorigen.com/en/product-tag/pork-knuckle/' /tmp/tag
          grep -qi 'Pork knuckle' /tmp/tag
          curl -A "$UA" -sS --max-time 30 -o /dev/null -D /tmp/tagh 'https://www.elmercadodeorigen.com/en/product-tag/codillo/'
          code=$(awk 'toupper($1)~/^HTTP\//{x=$2}END{print x}' /tmp/tagh)
          loc=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/tagh)
          echo "tag_old=$code $loc"; test "$code" = 301; case "$loc" in */en/product-tag/pork-knuckle/) ;; *) exit 1;; esac

          # Pick a currently advertised simple product rather than depending on a historical ID/name.
          get 'https://www.elmercadodeorigen.com/en/shop/' /tmp/shop_cart
          pid=$(grep -oE 'add-to-cart=[0-9]+' /tmp/shop_cart | head -1 | cut -d= -f2 || true)
          if [ -z "$pid" ]; then
            pid=$(grep -oE 'data-product_id=("|\x27)[0-9]+("|\x27)' /tmp/shop_cart | head -1 | grep -oE '[0-9]+' || true)
          fi
          echo "cart_product_id=$pid"
          test -n "$pid"

          rm -f /tmp/cj
          curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj "https://www.elmercadodeorigen.com/en/?add-to-cart=$pid" -o /tmp/add
          cart=$(curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj -o /tmp/cart -w '%{http_code}' 'https://www.elmercadodeorigen.com/en/cart/')
          echo "cart=$cart"; test "$cart" = 200
          grep -qiE 'woocommerce-cart-form|cart_item|remove_from_cart_button|product-quantity' /tmp/cart
          ! grep -qiE 'Your cart is currently empty|Your basket is currently empty|Tu carrito está vacío|Tu cesta está vacía' /tmp/cart
          ! grep -qiE '>\s*(Carrito|Finalizar compra|Pedido mínimo|Importe mínimo|Quitar)\s*<' /tmp/cart

          checkout=$(curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj -o /tmp/checkout -w '%{http_code}' 'https://www.elmercadodeorigen.com/en/checkout/')
          echo "checkout=$checkout"; test "$checkout" = 200
          grep -qiE 'Billing|Your order|Place order|Checkout' /tmp/checkout
          ! grep -qiE '>\s*(Carrito|Finalizar compra|Detalles de facturación|Realizar pedido|Pedido mínimo|Importe mínimo|Tu pedido)\s*<' /tmp/cart /tmp/checkout
          echo ENGLISH_FINAL_ROUTES_V65_OK

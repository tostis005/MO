name: Inspect post-block traffic

on:
  push:
    branches:
      - diag-cpu-20260812
    paths:
      - '.github/workflows/meta-emergency-block.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect traffic after block
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          log=/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log
          tmp=$(mktemp)
          grep -E '12/Aug/2026:20:(1[5-9]|2[0-9]):' "$log" > "$tmp"
          echo '=== CLOCK / LOAD ==='
          date -Is
          uptime
          echo '=== REQUESTS SINCE 20:15 UTC ==='
          wc -l < "$tmp"
          echo '=== STATUS CODES ==='
          awk '{c[$9]++} END {for (x in c) print x,c[x]}' "$tmp" | sort -n
          echo '=== TOP USER AGENTS ==='
          awk -F'"' '{print $6}' "$tmp" | sort | uniq -c | sort -nr | head -n 20
          echo '=== TOP USER AGENTS NON-403 ==='
          awk '$9 != 403' "$tmp" | awk -F'"' '{print $6}' | sort | uniq -c | sort -nr | head -n 20
          echo '=== TOP PATHS NON-403 ==='
          awk '$9 != 403' "$tmp" | awk -F'"' '{print $2}' | sed -E 's#^(GET|POST|HEAD) ##; s# HTTP/[0-9.]+$##; s#\?.*$##' | sort | uniq -c | sort -nr | head -n 35
          echo '=== TOP IPS NON-403 ==='
          awk '$9 != 403 {print $1}' "$tmp" | sort | uniq -c | sort -nr | head -n 25
          echo '=== SPECIAL ENDPOINTS NON-403 ==='
          awk '$9 != 403' "$tmp" | grep -E 'wp-cron|admin-ajax|as_async|add-to-cart|add_to_wishlist|remove_item|filter_|query_type_|vendor_id' | awk -F'"' '{print $2}' | sed -E 's# HTTP/[0-9.]+$##' | head -n 80
          echo '=== CURRENT PHP COUNT / LOAD ==='
          pgrep -fc 'php-fpm: pool elmercadodeorigen.com'
          top -b -d 1 -n 2 | grep -E 'php-fpm|Cpu\(s\)|load average' | tail -n 35
          rm -f "$tmp"
          REMOTE

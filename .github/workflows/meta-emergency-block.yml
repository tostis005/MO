name: Verify Meta mitigation

on:
  push:
    branches:
      - diag-cpu-20260812
    paths:
      - '.github/workflows/meta-emergency-block.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Verify block and measure current load
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          log=/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log
          echo '=== CLOCK / LOAD ==='
          date -Is
          uptime
          echo '=== PUBLIC HTTP TEST ==='
          curl -k -sS --max-time 15 -A 'meta-externalagent/1.1' -o /dev/null -w 'META_HTTP=%{http_code} TOTAL=%{time_total}\n' https://www.elmercadodeorigen.com/ || true
          curl -k -sS --max-time 15 -A 'Mozilla/5.0' -o /dev/null -w 'NORMAL_HTTP=%{http_code} TOTAL=%{time_total}\n' https://www.elmercadodeorigen.com/ || true
          echo '=== RECENT META STATUS CODES ==='
          tail -n 3000 "$log" | grep -i 'meta-externalagent' | tail -n 400 | awk '{code[$9]++} END {for (c in code) print c, code[c]}' | sort -n
          echo '=== LAST META REQUESTS ==='
          tail -n 3000 "$log" | grep -i 'meta-externalagent' | tail -n 12
          echo '=== PHP INSTANT SNAPSHOTS ==='
          top -b -d 2 -n 3 | grep -E 'php-fpm|Cpu\(s\)|load average' | tail -n 45
          echo '=== FINAL LOAD ==='
          uptime
          REMOTE

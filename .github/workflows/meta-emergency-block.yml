name: Check recovery after Meta block

on:
  push:
    branches:
      - diag-cpu-20260812
    paths:
      - '.github/workflows/meta-emergency-block.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Check current recovery
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          log=/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log
          echo '=== CLOCK / LOAD ==='
          date -Is
          uptime
          echo '=== HOT PHP ==='
          ps -eo pid,etime,time,%cpu,%mem,args --sort=-%cpu | grep 'php-fpm' | head -n 24
          echo '=== LAST 200 META STATUS ==='
          tail -n 5000 "$log" | grep -i 'meta-externalagent' | tail -n 200 | awk '{c[$9]++} END {for (x in c) print x,c[x]}' | sort -n
          echo '=== NORMAL HTTP ==='
          curl -k -sS --max-time 10 -A 'Mozilla/5.0' -o /dev/null -w 'NORMAL_HTTP=%{http_code} TOTAL=%{time_total}\n' https://www.elmercadodeorigen.com/ || true
          echo '=== FINAL LOAD ==='
          uptime
          REMOTE

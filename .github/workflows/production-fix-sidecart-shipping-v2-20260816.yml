name: Production fix side cart and English shipping v2 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-fix-sidecart-shipping-v2-20260816.yml'
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: php -l .github/scripts/mdo-sidecart-layout-shipping-fix-20260816.php
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy isolated MU fix with backup
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no .github/scripts/mdo-sidecart-layout-shipping-fix-20260816.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-sidecart-layout-shipping-fix-20260816.php"
          OUT=$(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          TARGET="$ROOT/wp-content/mu-plugins/mdo-sidecart-layout-shipping-fix.php"; TS=$(date +%Y%m%d%H%M%S)
          if [ -f "$TARGET" ]; then BAK="$TARGET.bak-$TS"; cp -a "$TARGET" "$BAK"; else BAK="NEW"; fi
          cp /tmp/mdo-sidecart-layout-shipping-fix-20260816.php "$TARGET"
          "$PHP" -l "$TARGET"
          "$PHP" "$WP" cache flush --path="$ROOT" --allow-root >/dev/null 2>&1 || true
          echo "ROOT=$ROOT"; echo "TARGET=$TARGET"; echo "BAK=$BAK"
          REMOTE
          )
          echo "$OUT"
          for k in ROOT TARGET BAK; do v=$(printf '%s\n' "$OUT"|sed -n "s/^$k=//p"|tail -n1); test -n "$v"; echo "LIVE_$k=$v" >> "$GITHUB_ENV"; done
      - name: Real Spanish and English cart QA in separate sessions
        run: |
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request,http.cookiejar
          base='https://www.elmercadodeorigen.com'; product='/producto/aceite-de-oliva-virgen-extra-5l/'
          def session():
            cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj)); op.addheaders=[('User-Agent','MDO-Sidecart-Fix-QA/2.0')]; return cj,op
          def add(op):
            b=op.open(base+product,timeout=45).read().decode('utf-8','replace'); m=re.search(r'data-product_variations="([^"]+)"',b); assert m
            vs=json.loads(html.unescape(m.group(1))); v=next(x for x in vs if x.get('is_in_stock') and x.get('is_purchasable'))
            d={'add-to-cart':'1056','product_id':'1056','variation_id':str(v['variation_id']),'quantity':'1'}; d.update(v.get('attributes') or {})
            req=urllib.request.Request(base+product,data=urllib.parse.urlencode(d).encode()); r=op.open(req,timeout=45); r.read(); print('ADD',r.status,v['variation_id'])
          def get(op,p):
            r=op.open(base+p,timeout=45); b=r.read().decode('utf-8','replace'); print('GET',p,r.status,len(b)); return b

          cj_es,es=session(); add(es); es_contact=get(es,'/contacto/'); es_cart=get(es,'/carrito/')
          assert 'mdo-sidecart-layout-fix-20260816' in es_contact
          assert 'translatepress-es_ES' in es_cart
          assert 'Shipping savings' not in es_cart, 'English fee label leaked into Spanish cart'
          print('ES_FEE_PRESENT=', 'Ahorro gastos de envío' in es_cart)
          print('SPANISH_UNCHANGED=PASS')

          cj_en,en=session(); add(en); en_contact=get(en,'/en/contact/'); en_cart=get(en,'/en/cart/')
          assert 'mdo-sidecart-layout-fix-20260816' in en_contact
          assert 'translatepress-en_US' in en_cart
          assert 'Ahorro gastos de envío' not in en_cart, 'Spanish fee label remains in English cart'
          assert 'Shipping savings' in en_cart, 'Translated shipping savings label missing in English cart'
          print('ENGLISH_CART_COPY=PASS')
          print('ORDER_CREATED=NO')
          PY
      - name: Browser geometry QA desktop and mobile
        run: |
          python3 -m pip install -q selenium
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request,http.cookiejar,shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          base='https://www.elmercadodeorigen.com'; product='/producto/aceite-de-oliva-virgen-extra-5l/'
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj)); op.addheaders=[('User-Agent','MDO-Sidecart-Browser-QA/2.0')]
          b=op.open(base+product,timeout=45).read().decode('utf-8','replace'); m=re.search(r'data-product_variations="([^"]+)"',b); vs=json.loads(html.unescape(m.group(1))); v=next(x for x in vs if x.get('is_in_stock') and x.get('is_purchasable'))
          d={'add-to-cart':'1056','product_id':'1056','variation_id':str(v['variation_id']),'quantity':'1'}; d.update(v.get('attributes') or {})
          op.open(urllib.request.Request(base+product,data=urllib.parse.urlencode(d).encode()),timeout=45).read()

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser'); print('CHROME',chrome)
          if not chrome: raise SystemExit('Chrome unavailable')
          opts=Options(); opts.binary_location=chrome; opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1440,1000')
          driver=webdriver.Chrome(options=opts); wait=WebDriverWait(driver,30)
          try:
            driver.get(base+'/')
            for c in cj:
              try: driver.add_cookie({'name':c.name,'value':c.value,'path':c.path or '/','domain':c.domain.lstrip('.')})
              except Exception as e: print('COOKIE_SKIP',c.name,str(e)[:80])
            def check(path,w,h,label):
              driver.set_window_size(w,h); driver.get(base+path+'?geomqa='+str(time.time_ns()))
              wait.until(lambda d: d.execute_script("return !!document.querySelector('.shop-cart-sidebar .woocommerce-mini-cart-item__thumb')"))
              x=driver.execute_script('''const i=document.querySelector('.shop-cart-sidebar .woocommerce-mini-cart-item'),t=i.querySelector('.woocommerce-mini-cart-item__thumb'),n=i.querySelector('.woocommerce-mini-cart-item__info'),im=t.querySelector('img'),a=n.querySelector('.woocommerce-mini-cart-item__data>a');const r=e=>{const z=e.getBoundingClientRect();return {l:z.left,r:z.right,t:z.top,b:z.bottom,w:z.width,h:z.height}};return {item:r(i),thumb:r(t),info:r(n),img:r(im),title:r(a),display:getComputedStyle(i).display,gap:getComputedStyle(i).columnGap};''')
              print(label,x)
              t,n,im,a=x['thumb'],x['info'],x['img'],x['title']; ox=max(0,min(t['r'],n['r'])-max(t['l'],n['l'])); oy=max(0,min(t['b'],n['b'])-max(t['t'],n['t']))
              assert ox*oy < .5, label+' image/text overlap'
              assert n['l'] >= t['r']+7, label+' gap too small'
              assert a['l'] >= n['l']-1 and a['r'] <= n['r']+1, label+' title escapes info column'
              assert im['w'] <= t['w']+1, label+' image escapes thumbnail'
              assert x['display']=='grid', label+' item not grid'
              print(label+'_PASS')
            for p,l in [('/contacto/','ES'),('/en/contact/','EN')]:
              check(p,1440,1000,l+'_DESKTOP'); check(p,390,844,l+'_MOBILE')
            print('SIDECART_GEOMETRY=PASS'); print('ORDER_CREATED=NO')
          finally: driver.quit()
          PY
      - name: Roll back on failure
        if: failure()
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail; [ -n "${LIVE_TARGET:-}" ] || exit 0; PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$STAGING_USER@$STAGING_HOST" "TARGET='$LIVE_TARGET' BAK='$LIVE_BAK' ROOT='$LIVE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$BAK" = "NEW" ]; then rm -f "$TARGET"; else cp -a "$BAK" "$TARGET"; fi
          PHP=$(command -v php || true); WP=$(command -v wp || true); "$PHP" "$WP" cache flush --path="$ROOT" --allow-root >/dev/null 2>&1 || true
          echo ROLLBACK=PASS
          REMOTE

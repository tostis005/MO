name: Diagnose Hidalgo de la Jara products

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hidalgo-products-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect published products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac; done')"
          : "${PROD_PATH:?production path not found}"
          CODE='global $wpdb; $rows=$wpdb->get_results("SELECT ID,post_title,post_name,post_excerpt,post_content,post_author FROM {$wpdb->posts} WHERE post_type=\"product\" AND post_status=\"publish\" ORDER BY ID ASC",ARRAY_A); $n=0; foreach($rows as $r){$u=get_userdata((int)$r["post_author"]); $v=$u?(string)$u->display_name:""; if(stripos($v,"Hidalgo de la Jara")===false) continue; echo "PRODUCT|{$r["ID"]}|{$r["post_title"]}|{$r["post_name"]}|STOCK=".get_post_meta($r["ID"],"_stock_status",true)."\n"; echo "EXCERPT|".mb_substr(wp_strip_all_tags($r["post_excerpt"]),0,1200)."\n"; echo "CONTENT|".mb_substr(wp_strip_all_tags($r["post_content"]),0,5000)."\n"; echo "ENEX|".mb_substr(wp_strip_all_tags((string)get_post_meta($r["ID"],"_en_US_post_excerpt",true)),0,1200)."\n"; echo "ENCONTENT|".mb_substr(wp_strip_all_tags((string)get_post_meta($r["ID"],"_en_US_post_content",true)),0,2000)."\n"; $n++; } echo "COUNT={$n}\n";'
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '$CODE' --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root"

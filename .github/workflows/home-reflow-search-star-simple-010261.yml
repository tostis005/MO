name: Home reflow search star simple 0.10.261

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-reflow-search-star-simple-010261.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add native stars to critical Home CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/assets/css/critical-woostify-home.min.css')
          s=p.read_text()
          marker='mdo-native-stars-010261'
          if marker not in s:
              s += "/*"+marker+"*/body.elmercado-premium-home .star-rating,body.elmercado-premium-home .star-rating::before,body.elmercado-premium-home .star-rating span,body.elmercado-premium-home .star-rating span::before{font-family:Arial,Helvetica,sans-serif!important;letter-spacing:.04em!important}body.elmercado-premium-home .star-rating::before{content:'★★★★★'!important;color:#d8d7d0!important}body.elmercado-premium-home .star-rating span::before{content:'★★★★★'!important;color:#d7a84f!important}"
          p.write_text(s)
          PY
          php -l elmercadodeorigen-child/inc/cart-counter-visibility-final.php
          php -l mu-plugins/mdo-home-fibosearch-lazy-010261.php
          grep -q 'mdo-native-stars-010261' elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
          ! grep -q "getComputedStyle(node, '::before')" elmercadodeorigen-child/inc/cart-counter-visibility-final.php

      - name: Deploy focused files
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path missing}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/cart-counter-visibility-final.php "$STAGING_USER@$STAGING_HOST:/tmp/cart-counter-010261.php"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/css/critical-woostify-home.min.css "$STAGING_USER@$STAGING_HOST:/tmp/critical-home-010261.css"
          sshpass -e scp $SCP mu-plugins/mdo-home-fibosearch-lazy-010261.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-home-fibosearch-lazy-010261.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            MU='$PROD_PATH/wp-content/mu-plugins'
            mkdir -p \"\$MU\"
            install -m 0644 /tmp/cart-counter-010261.php \"\$THEME/inc/cart-counter-visibility-final.php\"
            install -m 0644 /tmp/critical-home-010261.css \"\$THEME/assets/css/critical-woostify-home.min.css\"
            install -m 0644 /tmp/mdo-home-fibosearch-lazy-010261.php \"\$MU/mdo-home-fibosearch-lazy-010261.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/cart-counter-visibility-final.php\"
            \"\$php_bin\" -l \"\$MU/mdo-home-fibosearch-lazy-010261.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/cart-counter-010261.php /tmp/critical-home-010261.css /tmp/mdo-home-fibosearch-lazy-010261.php
          "

      - name: Verify live Home
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          {
            echo 'deploy=success'
            printf 'lazy_marker=%s\n' "$(grep -c 'mdo-home-fibosearch-lazy-010261' /tmp/home.html || true)"
            printf 'direct_fibosearch=%s\n' "$(grep -c 'id="jquery-dgwt-wcas-js" src=' /tmp/home.html || true)"
            printf 'cart_pseudo_read=%s\n' "$(grep -c "getComputedStyle(node, '::before')" /tmp/home.html || true)"
            printf 'native_star_critical=%s\n' "$(grep -c 'mdo-native-stars-010261' /tmp/home.html || true)"
          } > /tmp/static.txt

          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/browser.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1500);
            const before=await page.evaluate(()=>{
              const rating=document.querySelector('.star-rating');
              return {
                search:performance.getEntriesByType('resource').some(r=>r.name.includes('/ajax-search-for-woocommerce/assets/js/search.min.js')),
                star:performance.getEntriesByType('resource').some(r=>r.name.includes('/woocommerce/assets/fonts/star.woff')),
                starFont:rating?getComputedStyle(rating,'::before').fontFamily:'missing',
                starContent:rating?getComputedStyle(rating,'::before').content:'missing',
                hero:!!document.querySelector('.emo-hero__copy')
              };
            });
            const root=await page.$('.dgwt-wcas-search-wrapp,.dgwt-wcas-search-input');
            if(root){
              await root.dispatchEvent('pointerover');
              await page.waitForFunction(()=>performance.getEntriesByType('resource').some(r=>r.name.includes('/ajax-search-for-woocommerce/assets/js/search.min.js')),{timeout:10000}).catch(()=>{});
            }
            const after=await page.evaluate(()=>({search:performance.getEntriesByType('resource').some(r=>r.name.includes('/ajax-search-for-woocommerce/assets/js/search.min.js'))}));
            console.log(JSON.stringify({errors,before,after,searchRoot:!!root},null,2));
            if(errors.length || before.search || before.star || !before.hero || (root && !after.search)) process.exitCode=2;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

          export CHROME_PATH="$CHROME"
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          python3 - <<'PY' > /tmp/lighthouse.txt
          import json
          a=json.load(open('/tmp/lhr.json'))['audits']
          for k in ('largest-contentful-paint','total-blocking-time','cumulative-layout-shift','render-blocking-resources'):
              x=a.get(k,{})
              print(f'{k}: numeric={x.get("numericValue")} display={x.get("displayValue")} score={x.get("score")}')
          x=a.get('forced-reflow-insight',{})
          print('forced-reflow-insight:',x.get('displayValue'),x.get('score'))
          PY

          cat /tmp/static.txt /tmp/browser.txt /tmp/lighthouse.txt > runtime/home-reflow-search-star-simple-010261.txt
          cat runtime/home-reflow-search-star-simple-010261.txt
          grep -q 'lazy_marker=1' /tmp/static.txt
          grep -q 'direct_fibosearch=0' /tmp/static.txt
          grep -q 'cart_pseudo_read=0' /tmp/static.txt
          grep -q 'native_star_critical=1' /tmp/static.txt

      - name: Commit source and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-reflow-search-star-simple-010261.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-reflow-search-star-simple-010261.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/assets/css/critical-woostify-home.min.css runtime/home-reflow-search-star-simple-010261.txt
          git commit -m 'Deploy focused Home reflow fixes 0.10.261' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Production theme 0.10.208 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-theme-010208-final.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      EXPECTED_VERSION: 0.10.208

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact child theme release
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/functions.php
          test -f elmercadodeorigen-child/style.css
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css
          grep -q "ELMERCADO_THEME_VERSION', '$EXPECTED_VERSION'" elmercadodeorigen-child/functions.php
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node -e "require('puppeteer-core'); console.log('PUPPETEER_OK')"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage release on remote server
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-prod-final-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/theme'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' --exclude='*.map' -e "ssh $SSH_OPTIONS" elmercadodeorigen-child/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/theme/"

      - name: Backup and deploy to validated production WordPress
        id: release
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          BACKUP_NAME="$(date -u +%Y%m%dT%H%M%SZ)-before-010208-final-${GITHUB_SHA:0:10}"
          echo "BACKUP_NAME=$BACKUP_NAME" >> "$GITHUB_ENV"
          OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP/theme' '$GITHUB_SHA' '$BACKUP_NAME' '$EXPECTED_VERSION'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"; backup_name="$4"; expected="$5"
          dev=""
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve development root.' >&2; exit 1; }
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          [ -f "$prod/wp-config.php" ] && [ -d "$prod/wp-content/themes" ] || { echo 'Production WordPress path invalid.' >&2; exit 1; }

          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -x "$php_bin" ] && [ -n "$wp_bin" ] || { echo 'PHP/WP-CLI unavailable.' >&2; exit 1; }
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing production deploy: siteurl=$siteurl" >&2; exit 1 ;; esac
          base="${siteurl%/}"

          find "$incoming" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '$expected'" "$incoming/functions.php"
          parent="$prod/wp-content/themes"
          target="$parent/elmercadodeorigen-child"
          [ -d "$target" ] || { echo 'Existing child theme missing, refusing without rollback source.' >&2; exit 1; }
          active_before="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod" --skip-plugins --skip-themes --allow-root)"
          version_before="$(grep -o "ELMERCADO_THEME_VERSION', '[^']*" "$target/functions.php" | head -n1 | sed "s/.*'//" || true)"

          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          backup_dir="$rollback_root/$backup_name"
          mkdir -p "$backup_dir"
          tar -czf "$backup_dir/theme.tar.gz" -C "$parent" elmercadodeorigen-child
          (cd "$backup_dir" && sha256sum theme.tar.gz > theme.tar.gz.sha256 && sha256sum -c theme.tar.gz.sha256)
          printf '%s\n' "$active_before" > "$backup_dir/active-stylesheet.txt"
          printf '%s\n' "${version_before:-unknown}" > "$backup_dir/theme-version.txt"
          printf '%s\n' "$siteurl" > "$backup_dir/siteurl.txt"
          printf '%s\n' "$commit" > "$backup_dir/release-sha.txt"

          old="$parent/.elmercadodeorigen-child.predeploy-$commit"
          rm -rf "$old"
          swapped=0
          rollback() {
            code=$?
            if [ "$swapped" -eq 1 ] && [ "$code" -ne 0 ]; then
              echo 'Remote validation failed; restoring prior theme.' >&2
              rm -rf "$target"
              [ ! -d "$old" ] || mv "$old" "$target"
              "$php_bin" -d memory_limit=512M "$wp_bin" theme activate "$active_before" --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true
              "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          mv "$target" "$old"
          mv "$incoming" "$target"
          swapped=1
          find "$target" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" theme activate elmercadodeorigen-child --path="$prod" --skip-plugins --allow-root >/dev/null
          active_after="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod" --skip-plugins --skip-themes --allow-root)"
          [ "$active_after" = 'elmercadodeorigen-child' ]
          runtime="$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo defined("ELMERCADO_THEME_VERSION") ? ELMERCADO_THEME_VERSION : "missing";' --path="$prod" --skip-plugins --allow-root)"
          [ "$runtime" = "$expected" ] || { echo "Runtime $runtime != $expected" >&2; exit 1; }
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root || true

          for path in / /tienda/ /categoria-producto/jamones-paletas/ /contacto/ /carrito/; do
            code="$(curl -ksS -L -o /tmp/prod-final-page -w '%{http_code}' --max-time 35 "$base$path?release=$commit" || true)"
            [ "$code" = '200' ] || { echo "$path HTTP $code" >&2; exit 1; }
            grep -q 'elmercado-child-theme' /tmp/prod-final-page || { echo "$path missing child theme marker" >&2; exit 1; }
            ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error on this website' /tmp/prod-final-page || { echo "Fatal marker on $path" >&2; exit 1; }
          done

          rm -rf "$old"
          swapped=0
          trap - EXIT HUP INT TERM
          printf '__SITEURL__=%s\n' "$siteurl"
          printf '__PROD__=%s\n' "$prod"
          printf '__BEFORE__=%s\n' "${version_before:-unknown}"
          printf '__AFTER__=%s\n' "$runtime"
          REMOTE
          )"
          printf '%s\n' "$OUT"
          SITEURL="$(printf '%s\n' "$OUT" | sed -n 's/^__SITEURL__=//p' | tail -n1)"
          PROD="$(printf '%s\n' "$OUT" | sed -n 's/^__PROD__=//p' | tail -n1)"
          BEFORE="$(printf '%s\n' "$OUT" | sed -n 's/^__BEFORE__=//p' | tail -n1)"
          AFTER="$(printf '%s\n' "$OUT" | sed -n 's/^__AFTER__=//p' | tail -n1)"
          : "${SITEURL:?}"; : "${PROD:?}"
          echo "PRODUCTION_SITEURL=$SITEURL" >> "$GITHUB_ENV"
          echo "PRODUCTION_WP_PATH=$PROD" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$BEFORE" >> "$GITHUB_ENV"
          echo "CURRENT_VERSION=$AFTER" >> "$GITHUB_ENV"

      - name: Real Chrome smoke on production
        shell: bash
        run: |
          set -euo pipefail
          cat > prod-smoke.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const base=(process.env.PRODUCTION_SITEURL||'https://www.elmercadodeorigen.com').replace(/\/$/,'');
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page=await browser.newPage();
              await page.setViewport({width:1440,height:1000});
              const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e.message||e)));

              await page.goto(`${base}/?prod-smoke=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              const trigger=await page.$('.header-search-icon, [class*="header-search"] a, .site-tools .search-icon');
              if(!trigger) throw new Error('Search trigger missing');
              await trigger.click();
              await page.waitForSelector('.site-dialog-search',{visible:true,timeout:10000});
              const search=await page.evaluate(()=>{const r=document.querySelector('.site-dialog-search'),i=r?.querySelector('input[type="search"],.search-field'),s=r?.querySelector('button[type="submit"],input[type="submit"],.search-submit');return{title:r?.querySelector('.dialog-search-title')?.textContent?.trim()||'',placeholder:i?.getAttribute('placeholder')||'',submit:s?.tagName==='INPUT'?s.value:(s?.textContent||'').trim(),text:r?.innerText||''}});
              if(search.title!=='Buscar productos'||search.placeholder!=='Buscar productos'||search.submit!=='Buscar') throw new Error(`Search mismatch ${JSON.stringify(search)}`);
              if(search.text.includes('BUSCAR EN EL MERCADO')||search.text.includes('Encuentra productos seleccionados con criterio')) throw new Error('Marketing search copy visible');

              await page.goto(`${base}/tienda/?prod-smoke=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              const shop=await page.evaluate(()=>{const v=s=>[...document.querySelectorAll(s)].filter(e=>{const c=getComputedStyle(e),r=e.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0}).length;const sb=document.querySelector('#secondary.widget-area,.shop-widget-area');return{theme:document.body.classList.contains('elmercado-child-theme'),tags:v('.widget_product_tag_cloud,.widget_tag_cloud,.tagcloud'),etiquetas:/\bEtiquetas\b/i.test(sb?.innerText||''),products:document.querySelectorAll('.products .product,li.product').length}});
              if(!shop.theme||shop.tags||shop.etiquetas||shop.products<1) throw new Error(`Shop failed ${JSON.stringify(shop)}`);

              await page.goto(`${base}/categoria-producto/jamones-paletas/?prod-smoke=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              const category=await page.evaluate(()=>{const v=s=>[...document.querySelectorAll(s)].filter(e=>{const c=getComputedStyle(e),r=e.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0}).length;const sb=document.querySelector('#secondary.widget-area,.shop-widget-area');return{theme:document.body.classList.contains('elmercado-child-theme'),vendor:v('#emo-global-vendor-filter'),specific:v('#emo-category-attribute-filters'),tags:v('.widget_product_tag_cloud,.widget_tag_cloud,.tagcloud'),etiquetas:/\bEtiquetas\b/i.test(sb?.innerText||''),products:document.querySelectorAll('.products .product,li.product').length}});
              if(!category.theme||!category.vendor||!category.specific||category.tags||category.etiquetas||category.products<1) throw new Error(`Category failed ${JSON.stringify(category)}`);
              console.log('PRODUCTION_010208_BROWSER_OK',JSON.stringify({search,shop,category,pageErrors}));
            } finally { await browser.close(); }
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
          node prod-smoke.cjs

      - name: Release success
        if: success()
        shell: bash
        run: |
          echo "PRODUCTION_RELEASE_OK"
          echo "Site: $PRODUCTION_SITEURL"
          echo "Previous: $PREVIOUS_VERSION"
          echo "Current: $CURRENT_VERSION"
          echo "Rollback backup: $BACKUP_NAME"

      - name: Automatic rollback if Chrome smoke fails
        if: failure() && steps.release.outcome == 'success'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$BACKUP_NAME'" <<'REMOTE'
          set -eu
          raw="${1%/}"; backup="$2"
          dev=""
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"; [ -n "$cfg" ] || exit 1; dev="$(dirname "$cfg")"; fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing rollback: siteurl=$siteurl" >&2; exit 1 ;; esac
          dir="$HOME/.elmercado-rollbacks/elmercadodeorigen.com/$backup"
          [ -f "$dir/theme.tar.gz" ]
          (cd "$dir" && sha256sum -c theme.tar.gz.sha256)
          rm -rf "$prod/wp-content/themes/elmercadodeorigen-child"
          tar -xzf "$dir/theme.tar.gz" -C "$prod/wp-content/themes"
          previous="$(cat "$dir/active-stylesheet.txt" 2>/dev/null || true)"; [ -n "$previous" ] || previous='elmercadodeorigen-child'
          "$php_bin" -d memory_limit=512M "$wp_bin" theme activate "$previous" --path="$prod" --skip-plugins --allow-root >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root || true
          echo "ROLLBACK_OK $backup"
          REMOTE

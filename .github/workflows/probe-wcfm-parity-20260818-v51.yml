name: Probe WCFM parity v51
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-wcfm-parity-20260818-v51.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Marker
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/wcfm-parity-v51.txt
          git add runtime/wcfm-parity-v51.txt; git commit -m 'Start WCFM parity probe v51'; git push origin HEAD:main
      - name: Probe all active stores from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set +e
            for slug in 1957 hidalgo-de-la-jara tolecarnes puente-robles el-catedratico; do
              echo "=== $slug ==="
              for lang in es en; do
                if [ "$lang" = es ]; then url="https://www.elmercadodeorigen.com/tienda/$slug/"; else url="https://www.elmercadodeorigen.com/en/store/$slug/"; fi
                rm -f /tmp/h51 /tmp/b51
                code=$(curl -k -L --max-redirs 5 -sS --connect-timeout 8 --max-time 35 -D /tmp/h51 -o /tmp/b51 -w "%{http_code}" "$url"); rc=$?
                cards=$(grep -oEi "<li[^>]+class=\"[^\"]*product[^\"]*\"" /tmp/b51 2>/dev/null | wc -l | tr -d " ")
                wcprod=$(grep -oEi "class=\"[^\"]*wcfmmp-single-product-holder[^\"]*\"" /tmp/b51 2>/dev/null | wc -l | tr -d " ")
                urls=$(grep -oE "/en/product/[^\" <]+" /tmp/b51 2>/dev/null | sort -u | wc -l | tr -d " ")
                nativeurls=$(grep -oE "/producto/[^\" <]+" /tmp/b51 2>/dev/null | sort -u | wc -l | tr -d " ")
                echo "lang=$lang rc=$rc code=$code redirects=$(grep -ic "^location:" /tmp/h51 2>/dev/null || true) bytes=$(wc -c </tmp/b51 2>/dev/null || echo 0) li_cards=$cards wcfm_cards=$wcprod en_product_urls=$urls native_product_urls=$nativeurls"
                grep -oE "Mostrando[^<]{0,100}|Showing[^<]{0,100}|[0-9]+ results|[0-9]+ resultados" /tmp/b51 2>/dev/null | head -3 | sed "s/^/result_text=/"
              done
            done
          ' > runtime/wcfm-parity-detail-v51.txt 2>&1
      - name: Commit report
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=complete\n' "$GITHUB_RUN_ID" > runtime/wcfm-parity-v51.txt
          git add runtime/wcfm-parity-v51.txt runtime/wcfm-parity-detail-v51.txt
          git commit -m 'Record WCFM parity probe v51' || true
          git pull --rebase origin main
          git push origin HEAD:main

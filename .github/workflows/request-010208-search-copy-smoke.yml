name: Request 010208 search copy smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/request-010208-search-copy-smoke.cjs'
      - '.github/workflows/request-010208-search-copy-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
      - name: Validate smoke syntax
        run: node --check .github/scripts/request-010208-search-copy-smoke.cjs
      - name: Review neutral search copy on staging
        run: node .github/scripts/request-010208-search-copy-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-010208-search-copy-smoke
          path: qa/
          retention-days: 14

name: Inspect live CookieYes configuration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cookieyes-live-inspect-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Inspect CookieYes on live site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          SITE = 'https://www.elmercadodeorigen.com/'

          def inspect(lang):
              o = Options()
              o.page_load_strategy = 'eager'
              for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1600',f'--lang={lang}'):
                  o.add_argument(arg)
              o.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
              d = webdriver.Chrome(options=o)
              d.set_page_load_timeout(60)
              try:
                  d.execute_cdp_cmd('Network.enable', {})
                  d.execute_cdp_cmd('Network.setExtraHTTPHeaders', {'headers': {'Accept-Language': lang}})
                  d.get(SITE)
                  time.sleep(8)
                  state = d.execute_script(r'''return {
                    htmlLang: document.documentElement.lang || '',
                    title: document.title,
                    scripts: Array.from(document.scripts).map(s=>s.src||'').filter(u=>/cookieyes|cookie-law|cky|consent/i.test(u)),
                    banner: Array.from(document.querySelectorAll('[class*="cky"], [id*="cky"], [class*="cookie"], [id*="cookie"]')).map(el=>({tag:el.tagName,id:el.id||'',cls:el.className||'',text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,1000),display:getComputedStyle(el).display,vis:!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)})).filter(x=>x.vis && x.text).slice(0,30),
                    buttons: Array.from(document.querySelectorAll('button,a')).filter(el=>/cookie|consent|accept|reject|allow|necessary|settings|prefer|rechazar|aceptar|configur|necesari/i.test(((el.id||'')+' '+(el.className||'')+' '+(el.innerText||'')))).map(el=>({tag:el.tagName,id:el.id||'',cls:el.className||'',text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,300)})).slice(0,30),
                    cookies: document.cookie,
                    globals: Object.keys(window).filter(k=>/cookieyes|cky|cookie_law|consent/i.test(k)).slice(0,50)
                  };''')
                  print('LANG=' + lang)
                  print('STATE=' + json.dumps(state, ensure_ascii=False, sort_keys=True))
                  reqs=[]
                  for e in d.get_log('performance'):
                      try: m=json.loads(e['message'])['message']
                      except Exception: continue
                      if m.get('method')=='Network.requestWillBeSent':
                          u=m.get('params',{}).get('request',{}).get('url','')
                          if any(x in u.lower() for x in ('cookieyes','cookie-law-info','cdn-cookieyes','cky')):
                              reqs.append(u)
                  print('COOKIEYES_REQUESTS=' + json.dumps(reqs[:50], ensure_ascii=False))
              finally:
                  d.quit()

          for lang in ('es-ES,es;q=0.9','en-GB,en;q=0.9'):
              inspect(lang)
          PY

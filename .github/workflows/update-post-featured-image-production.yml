name: Update post featured image in production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-post-featured-image-production.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: 'WordPress post slug'
        required: true
        type: string
        default: 'dop-los-pedroches-que-es-que-garantiza-como-reconocer-jamon-paleta'
      image_url:
        description: 'Direct image URL'
        required: true
        type: string
        default: 'https://cdn.pixabay.com/photo/2020/03/27/11/48/ham-4973380_1280.jpg'
      image_title:
        description: 'Media title'
        required: true
        type: string
        default: 'Cerdos ibéricos en la dehesa - DOP Los Pedroches'
      image_alt:
        description: 'Image alt text'
        required: true
        type: string
        default: 'Cerdos ibéricos en la dehesa de Los Pedroches'

permissions:
  contents: read

jobs:
  update-featured-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      POST_SLUG: ${{ github.event.inputs.slug || 'dop-los-pedroches-que-es-que-garantiza-como-reconocer-jamon-paleta' }}
      IMAGE_URL: ${{ github.event.inputs.image_url || 'https://cdn.pixabay.com/photo/2020/03/27/11/48/ham-4973380_1280.jpg' }}
      IMAGE_TITLE: ${{ github.event.inputs.image_title || 'Cerdos ibéricos en la dehesa - DOP Los Pedroches' }}
      IMAGE_ALT: ${{ github.event.inputs.image_alt || 'Cerdos ibéricos en la dehesa de Los Pedroches' }}

    steps:
      - name: Update featured image via WP-CLI
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 11
            [ -n "$php_bin" ] || exit 12
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          SLUG_B64=$(printf '%s' "$POST_SLUG" | base64 -w0)
          URL_B64=$(printf '%s' "$IMAGE_URL" | base64 -w0)
          TITLE_B64=$(printf '%s' "$IMAGE_TITLE" | base64 -w0)
          ALT_B64=$(printf '%s' "$IMAGE_ALT" | base64 -w0)

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            POST_SLUG=\$(printf '%s' '$SLUG_B64' | base64 -d)
            IMAGE_URL=\$(printf '%s' '$URL_B64' | base64 -d)
            IMAGE_TITLE=\$(printf '%s' '$TITLE_B64' | base64 -d)
            IMAGE_ALT=\$(printf '%s' '$ALT_B64' | base64 -d)

            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            [ -n \"\$wp_bin\" ] || { echo 'ERROR: wp-cli not found' >&2; exit 21; }
            [ -n \"\$php_bin\" ] || { echo 'ERROR: php not found' >&2; exit 22; }

            POST_ID=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post list --post_type=post --name=\"\$POST_SLUG\" --field=ID --path='$PROD_PATH' --allow-root | head -n1)
            [ -n \"\$POST_ID\" ] || { echo \"ERROR: post not found for slug \$POST_SLUG\" >&2; exit 23; }

            ATTACHMENT_ID=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post list --post_type=attachment --post_status=inherit --meta_key=_mdo_source_url --meta_value=\"\$IMAGE_URL\" --field=ID --path='$PROD_PATH' --allow-root | head -n1)
            if [ -z \"\$ATTACHMENT_ID\" ]; then
              ATTACHMENT_ID=\$(\"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" media import \"\$IMAGE_URL\" --post_id=\"\$POST_ID\" --title=\"\$IMAGE_TITLE\" --porcelain --path='$PROD_PATH' --allow-root)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post meta update \"\$ATTACHMENT_ID\" _mdo_source_url \"\$IMAGE_URL\" --path='$PROD_PATH' --allow-root >/dev/null
            fi

            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post update \"\$ATTACHMENT_ID\" --post_title=\"\$IMAGE_TITLE\" --path='$PROD_PATH' --allow-root >/dev/null
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post meta update \"\$ATTACHMENT_ID\" _wp_attachment_image_alt \"\$IMAGE_ALT\" --path='$PROD_PATH' --allow-root >/dev/null
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post meta update \"\$POST_ID\" _thumbnail_id \"\$ATTACHMENT_ID\" --path='$PROD_PATH' --allow-root >/dev/null
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" rocket clean --confirm --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true

            FEATURED_ID=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" post meta get \"\$POST_ID\" _thumbnail_id --path='$PROD_PATH' --allow-root)
            FEATURED_URL=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval \"echo get_the_post_thumbnail_url((int) \\\$argv[1], 'full');\" \"\$POST_ID\" --path='$PROD_PATH' --allow-root)
            echo \"featured_image_ok post_id=\$POST_ID attachment_id=\$FEATURED_ID url=\$FEATURED_URL\"
            [ \"\$FEATURED_ID\" = \"\$ATTACHMENT_ID\" ]
          "

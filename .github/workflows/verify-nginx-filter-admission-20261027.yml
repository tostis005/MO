name: Inspect current producer filters and gate feasibility 20261027
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-nginx-filter-admission-20261027.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Inspect routing, backend, cache and filter links read only
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          VHOST=/var/www/vhosts/system/elmercadodeorigen.com/conf/vhost_nginx.conf
          GLOBAL=/etc/nginx/conf.d/emdo_filter_rate_limit.conf
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          echo === CAPABILITIES ===
          nginx -V 2>&1 | tr ' ' '\n' | grep -E 'secure_link|auth_request|realip|sub_module|mirror_module|http_js|http_lua'
          echo === LOCAL_MODULES ===
          ls -1 /usr/share/nginx/modules/ /etc/nginx/modules.conf.d/ 2>/dev/null | head -n 50
          echo === CURRENT_GUARDS ===
          sed -n '1,40p' "$VHOST"
          cat "$GLOBAL"
          echo === NGINX_CACHE_LOCS ===
          grep -nE '^location |^    if |^    return|^    error_page|^    try_files|^    add_header' "$VHOST" | tail -n 100
          echo === APACHE_FPM ===
          grep -n 'proxy:unix\\|proxy:fcgi\\|php-fpm' /var/www/vhosts/system/elmercadodeorigen.com/conf/last_httpd.conf | head -n 15
          echo === FILTER_MAIN_THEME ===
          grep -R -n -m 3 -E "emo_vendor_cat|filter_preparacion|filter_rango-peso" "$ROOT/wp-content/themes/elmercadodeorigen-child/assets" "$ROOT/wp-content/themes/elmercadodeorigen-child/inc" 2>/dev/null | head -n 22 | cut -c 1-220
          echo === WCFM FILTER HTML ===
          curl -sSk --connect-timeout 2 --max-time 8 'https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/' | grep -io -m 8 -E 'href="[^"]*filter_[^"]*|<form[^>]*(method|action)=[^>]*|name="emo_vendor_cat"[^>]*|name="filter_[^"]*"' | cut -c 1-260
          echo === CACHE ===
          curl -ksS --connect-timeout 3 --max-time 6 -D - -o /dev/null 'https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/' | grep -iE 'HTTP/|x-emdo|cache-control|referrer-policy'
          echo === REQUEST RATE SAMPLE ===
          uptime
          REMOTE
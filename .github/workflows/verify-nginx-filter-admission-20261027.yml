name: Inspect final signed filter gate probe artifacts 20261027
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-nginx-filter-admission-20261027.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      S${{ secrets.STAGING_HOST }}PASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Read probe diagnostics without cookies or tokens
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          python3 - <<'PY'
          import os,re
          for p in ('/tmp/emdo-filter-challenge','/tmp/emdo-gate-local-challenge','/tmp/emdo-filter-cookie','/tmp/emdo-local-verify','/tmp/emdo-filter-direct-h'):
            if not os.path.exists(p):print(os.path.basename(p),'missing');continue
            s=open(p,'rb').read()
            print(os.path.basename(p),'bytes',len(s),'looks_challenge',b'Verificando acceso' in s,'looks_redirect',b'Found' in s,'has_expected_challenge_parameter',bool(re.search(rb'/__emdo_filtergate/verify\?c=[a-zA-Z0-9._-]+',s)),'cookie_name_present',b'emdo_filter_pass' in s)
          PY
          REMOTE
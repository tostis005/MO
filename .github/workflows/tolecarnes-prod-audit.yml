name: Tolecarnes production audit

on:
  push:
    branches:
      - diag-cpu-20260812
    paths:
      - '.github/workflows/tolecarnes-prod-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Audit production data
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -euo pipefail
          raw="${1%/}"
          case "$raw" in
            */wp-content/*) dev="${raw%%/wp-content/*}" ;;
            */wp-content) dev="$(dirname "$raw")" ;;
            *) dev="$raw" ;;
          esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] && dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(ls -1 /opt/plesk/php/*/bin/php 2>/dev/null | sort -V | tail -n1)"
          [ -x "$php_bin" ] || { echo 'No Plesk PHP found'; exit 2; }
          echo "PROD=$prod PHP=$php_bin"

          PROD="$prod" "$php_bin" <<'PHP'
<?php
$prod = getenv('PROD');
require $prod . '/wp-load.php';

function audit_norm($s) {
    $s = remove_accents(strtolower((string) $s));
    return preg_replace('/[^a-z0-9]+/', ' ', $s);
}
function audit_store_name($uid) {
    $profile = get_user_meta($uid, 'wcfmmp_profile_settings', true);
    if (is_array($profile) && !empty($profile['store_name'])) return trim((string)$profile['store_name']);
    $store = get_user_meta($uid, 'store_name', true);
    return is_string($store) ? trim($store) : '';
}
function audit_match($text) {
    $n = audit_norm($text);
    return strpos($n,'tole') !== false || strpos($n,'catedr') !== false || strpos($n,'puente') !== false || strpos($n,'roble') !== false;
}

echo "=== THEME / VISIBILITY FUNCTIONS ===\n";
echo 'template=' . get_template() . ' stylesheet=' . get_stylesheet() . "\n";
echo 'can_view_fn=' . (function_exists('elmercado_wcfm_disabled_visibility_can_view_010210') ? 'yes':'no') . "\n";
echo 'vendor_disabled_fn=' . (function_exists('elmercado_wcfm_vendor_is_disabled_010210') ? 'yes':'no') . "\n";

$matched = [];
foreach (get_users(['fields'=>'all']) as $u) {
    $store = audit_store_name($u->ID);
    $hay = $u->user_login . ' ' . $u->display_name . ' ' . $u->user_email . ' ' . $store;
    if (!audit_match($hay)) continue;
    $matched[$u->ID] = $u;
    $caps = array_keys(array_filter((array)$u->caps));
    printf("USER id=%d login=%s display=%s store=%s roles=%s disable=%s offline=%s\n",
        $u->ID, $u->user_login, $u->display_name, $store, implode(',', $u->roles),
        json_encode(get_user_meta($u->ID,'_disable_vendor',true)),
        json_encode(get_user_meta($u->ID,'_wcfm_store_offline',true))
    );
}

echo "=== CARNES CATEGORY ===\n";
$carnes = get_term_by('slug','carnes','product_cat');
if (!$carnes) $carnes = get_term_by('name','Carnes','product_cat');
if ($carnes && !is_wp_error($carnes)) printf("CARNES term_id=%d slug=%s count=%d\n",$carnes->term_id,$carnes->slug,$carnes->count);
else echo "CARNES missing\n";

$admin_ids = get_users(['role'=>'administrator','fields'=>'ID','number'=>20]);
$admin_id = 0;
foreach ($admin_ids as $aid) { wp_set_current_user((int)$aid); if (current_user_can('manage_options')) { $admin_id=(int)$aid; break; } }
wp_set_current_user(0);
echo "ADMIN_ID=$admin_id\n";

echo "=== MATCHED VENDOR PRODUCTS ===\n";
foreach ($matched as $uid=>$u) {
    $ids = get_posts(['post_type'=>'product','post_status'=>['publish','private','draft','pending','future'],'author'=>(int)$uid,'posts_per_page'=>-1,'fields'=>'ids','orderby'=>'ID','order'=>'ASC']);
    $trash = get_posts(['post_type'=>'product','post_status'=>'trash','author'=>(int)$uid,'posts_per_page'=>-1,'fields'=>'ids']);
    $status_counts=[]; $in_carnes=0;
    foreach ($ids as $id) {
        $st=get_post_status($id); $status_counts[$st]=($status_counts[$st]??0)+1;
        $cats=wp_get_post_terms($id,'product_cat',['fields'=>'slugs']);
        if (in_array('carnes',(array)$cats,true)) $in_carnes++;
    }
    if ($trash) $status_counts['trash']=count($trash);
    $disabled = function_exists('elmercado_wcfm_vendor_is_disabled_010210') ? (elmercado_wcfm_vendor_is_disabled_010210((int)$uid)?'yes':'no') : 'fn-missing';
    printf("VENDOR id=%d name=%s disabled=%s total=%d carnes=%d statuses=%s\n",$uid,$u->display_name,$disabled,count($ids)+count($trash),$in_carnes,json_encode($status_counts));
    foreach ($ids as $id) {
        $cats=wp_get_post_terms($id,'product_cat',['fields'=>'slugs']);
        wp_set_current_user(0);
        $p=wc_get_product($id); $public_visible=$p ? ($p->is_visible()?'yes':'no'):'no-product';
        if ($admin_id) wp_set_current_user($admin_id);
        $p2=wc_get_product($id); $admin_visible=$p2 ? ($p2->is_visible()?'yes':'no'):'no-product';
        wp_set_current_user(0);
        printf("PRODUCT id=%d author=%d status=%s public=%s admin=%s cats=%s title=%s\n",$id,$uid,get_post_status($id),$public_visible,$admin_visible,implode(',',(array)$cats),str_replace(["\n","\r"],' ',get_the_title($id)));
    }
}

// Search all products for Tolecarnes clues even if author mapping is wrong.
echo "=== TOLE CLUES OUTSIDE MATCHED AUTHORS ===\n";
global $wpdb;
$rows = $wpdb->get_results("SELECT DISTINCT p.ID,p.post_title,p.post_status,p.post_author,pm.meta_key,LEFT(pm.meta_value,180) meta_value FROM {$wpdb->posts} p LEFT JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID WHERE p.post_type='product' AND (LOWER(p.post_title) LIKE '%tole%' OR LOWER(COALESCE(pm.meta_value,'')) LIKE '%tole%') LIMIT 200");
foreach ($rows as $r) {
    printf("CLUE id=%d author=%d status=%s meta=%s value=%s title=%s\n",$r->ID,$r->post_author,$r->post_status,$r->meta_key,str_replace(["\n","\r"],' ',(string)$r->meta_value),str_replace(["\n","\r"],' ',$r->post_title));
}

// Query behavior: compare public vs admin for each matched vendor's published products.
echo "=== QUERY VISIBILITY COUNTS ===\n";
foreach ($matched as $uid=>$u) {
    wp_set_current_user(0);
    $q0 = new WP_Query(['post_type'=>'product','post_status'=>'publish','author'=>(int)$uid,'posts_per_page'=>-1,'fields'=>'ids','no_found_rows'=>true]);
    $pub_count=count($q0->posts);
    if ($admin_id) wp_set_current_user($admin_id);
    $q1 = new WP_Query(['post_type'=>'product','post_status'=>'publish','author'=>(int)$uid,'posts_per_page'=>-1,'fields'=>'ids','no_found_rows'=>true]);
    $adm_count=count($q1->posts);
    printf("QUERY vendor=%d name=%s public=%d admin=%d\n",$uid,$u->display_name,$pub_count,$adm_count);
}
wp_set_current_user(0);
PHP
          REMOTE

name: Tolecarnes production audit

on:
  push:
    branches:
      - diag-cpu-20260812
    paths:
      - '.github/workflows/tolecarnes-prod-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Audit production database
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -euo pipefail
          raw="${1%/}"
          case "$raw" in
            */wp-content/*) dev="${raw%%/wp-content/*}" ;;
            */wp-content) dev="$(dirname "$raw")" ;;
            *) dev="$raw" ;;
          esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] && dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin='/opt/plesk/php/8.2/bin/php'
          echo "PROD=$prod"
          echo '=== WP CLI CANDIDATES ==='
          find "$HOME" /usr/local /opt/plesk -maxdepth 6 -type f \( -name wp -o -name 'wp-cli.phar' \) 2>/dev/null | head -n 30 || true

          PROD="$prod" "$php_bin" -d display_errors=1 -d error_reporting=32767 <<'PHP'
          <?php
          $prod = getenv('PROD');
          $text = file_get_contents($prod . '/wp-config.php');
          if ($text === false) { fwrite(STDERR,"wp-config unreadable\n"); exit(2); }
          function cfg_const($text,$key) {
              $p = '/define\s*\(\s*[\'\"]' . preg_quote($key,'/') . '[\'\"]\s*,\s*[\'\"]([^\'\"]*)[\'\"]\s*\)/';
              if (preg_match($p,$text,$m)) return stripcslashes($m[1]);
              return null;
          }
          $dbn=cfg_const($text,'DB_NAME'); $dbu=cfg_const($text,'DB_USER'); $dbp=cfg_const($text,'DB_PASSWORD'); $dbh=cfg_const($text,'DB_HOST');
          if (!preg_match('/\$table_prefix\s*=\s*[\'\"]([^\'\"]+)[\'\"]\s*;/', $text, $pm)) { fwrite(STDERR,"prefix not found\n"); exit(3); }
          $prefix=$pm[1];
          if ($dbn===null||$dbu===null||$dbp===null||$dbh===null) { fwrite(STDERR,"DB constants not literal\n"); exit(4); }
          $host=$dbh; $port=3306; $socket=null;
          if (preg_match('/^([^:]+):(\d+)$/',$dbh,$hm)) { $host=$hm[1]; $port=(int)$hm[2]; }
          elseif (preg_match('/^([^:]+):(.+)$/',$dbh,$hm)) { $host=$hm[1]; $socket=$hm[2]; }
          $db=@new mysqli($host,$dbu,$dbp,$dbn,$port,$socket);
          if ($db->connect_errno) { fwrite(STDERR,"DB connect failed code=".$db->connect_errno."\n"); exit(5); }
          $db->set_charset('utf8mb4');
          echo "DB_OK prefix={$prefix}\n";
          function rows($db,$sql,$label) {
              echo "=== {$label} ===\n";
              $r=$db->query($sql);
              if (!$r) { echo "SQL_ERROR ".$db->error."\n"; return []; }
              $out=[]; while($x=$r->fetch_assoc()){ $out[]=$x; echo json_encode($x,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n"; } return $out;
          }
          $users=rows($db,"SELECT DISTINCT u.ID,u.user_login,u.display_name,u.user_email FROM {$prefix}users u LEFT JOIN {$prefix}usermeta um ON um.user_id=u.ID WHERE LOWER(CONCAT_WS(' ',u.user_login,u.display_name,u.user_email)) REGEXP 'tole|catedr|puente|roble' OR LOWER(COALESCE(um.meta_value,'')) REGEXP 'tolecarnes|tole carnes|el catedratico|puente robles' ORDER BY u.ID","RELEVANT USERS");
          $ids=array_map(fn($x)=>(int)$x['ID'],$users);
          if ($ids) {
              $in=implode(',',$ids);
              rows($db,"SELECT user_id,meta_key,LEFT(meta_value,800) meta_value FROM {$prefix}usermeta WHERE user_id IN ({$in}) AND (meta_key LIKE '%capabil%' OR meta_key LIKE '%disable%' OR meta_key LIKE '%offline%' OR meta_key LIKE '%store%' OR meta_key LIKE '%wcfm%' OR meta_key LIKE '%vendor%') ORDER BY user_id,meta_key","RELEVANT USERMETA");
              rows($db,"SELECT p.post_author,u.display_name,p.post_status,COUNT(*) products FROM {$prefix}posts p JOIN {$prefix}users u ON u.ID=p.post_author WHERE p.post_type='product' AND p.post_author IN ({$in}) GROUP BY p.post_author,u.display_name,p.post_status ORDER BY p.post_author,p.post_status","PRODUCT COUNTS");
              rows($db,"SELECT p.ID,p.post_author,u.display_name,p.post_status,p.post_title,GROUP_CONCAT(DISTINCT CONCAT(t.name,'[',t.slug,']') ORDER BY t.name SEPARATOR ', ') categories FROM {$prefix}posts p JOIN {$prefix}users u ON u.ID=p.post_author LEFT JOIN {$prefix}term_relationships tr ON tr.object_id=p.ID LEFT JOIN {$prefix}term_taxonomy tt ON tt.term_taxonomy_id=tr.term_taxonomy_id AND tt.taxonomy='product_cat' LEFT JOIN {$prefix}terms t ON t.term_id=tt.term_id WHERE p.post_type='product' AND p.post_author IN ({$in}) GROUP BY p.ID,p.post_author,u.display_name,p.post_status,p.post_title ORDER BY p.post_author,p.ID","PRODUCT DETAILS");
          }
          rows($db,"SELECT t.term_id,t.name,t.slug,tt.term_taxonomy_id,tt.count FROM {$prefix}terms t JOIN {$prefix}term_taxonomy tt ON tt.term_id=t.term_id WHERE tt.taxonomy='product_cat' AND (LOWER(t.name)='carnes' OR LOWER(t.slug)='carnes')","CARNES CATEGORY");
          rows($db,"SELECT DISTINCT p.ID,p.post_author,p.post_status,p.post_title,pm.meta_key,LEFT(pm.meta_value,300) meta_value FROM {$prefix}posts p LEFT JOIN {$prefix}postmeta pm ON pm.post_id=p.ID WHERE p.post_type='product' AND (LOWER(p.post_title) LIKE '%tole%' OR LOWER(COALESCE(pm.meta_value,'')) REGEXP 'tolecarnes|tole-carnes|tole carnes') ORDER BY p.ID LIMIT 300","TOLE PRODUCT CLUES");
          rows($db,"SELECT option_name,LEFT(option_value,500) option_value FROM {$prefix}options WHERE LOWER(option_name) LIKE '%tole%' OR LOWER(option_value) REGEXP 'tolecarnes|tole-carnes|tole carnes' LIMIT 100","TOLE OPTIONS");
          $db->close();
          PHP
          REMOTE

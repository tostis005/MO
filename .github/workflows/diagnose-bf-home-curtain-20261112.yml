name: Temporary Black Friday home and curtain diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-bf-home-curtain-20261112.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect latest failed Black Friday production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "BF_WORKFLOW_RECENT"
          gh run list -R tostis005/MO -w deploy-black-friday-2026-preview-production.yml -b main -L 3 --json databaseId,conclusion,status,headSha
          ID="$(gh run list -R tostis005/MO -w deploy-black-friday-2026-preview-production.yml -b main -L 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$ID" ] && [ "$ID" != null ]; then
            echo "BF_FAILED_RUN_ID=$ID"
            gh run view -R tostis005/MO "$ID" --log-failed | tail -170 || true
          fi

      - name: Inspect home markup, cache, WP front page and custom sources
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          PHP='/opt/plesk/php/8.2/bin/php'
          WP='/usr/local/bin/wp'
          "$PHP" -d memory_limit=768M "$WP" eval '
            echo "FRONT_OPTION=".get_option("show_on_front","?")."\n";
            echo "FRONT_PAGE_ID=".get_option("page_on_front","?")."\n";
            $front=get_post((int)get_option("page_on_front",0));
            if($front){
              echo "FRONT_TITLE=".get_the_title($front)."\n";
              echo "FRONT_TEMPLATE=".get_page_template_slug($front)."\n";
              echo "FRONT_CONTENT_BYTES=".strlen($front->post_content)."\n";
              echo "FRONT_CONTENT_SNIPPET=".substr(wp_strip_all_tags($front->post_content),0,900)."\n";
            }
            echo "BF_GLOBAL_ENABLED=".get_option("emdo_bf2026_global_curtain_enabled","default")."\n";
            echo "BF_GLOBAL_FUNCTION=".(function_exists("emdo_bf2026_global_curtain_eligible")?"yes":"no")."\n";
            echo "HOME_THEME=".get_stylesheet()."\n";
          ' --path="$ROOT" --allow-root
          echo "RELEVANT_HOME_PHP_FILES"
          find "$ROOT/wp-content/mu-plugins" "$ROOT/wp-content/themes" -maxdepth 4 -type f \( -iname '*home*' -o -iname '*front*' -o -iname '*banner*' \) 2>/dev/null | head -75 || true
          echo "HOME_MARKUP_MATCH_FILES"
          grep -rl -m1 --include='*.php' --include='*.js' -e 'Ya está aquí la cosecha' -e 'Cestas de Navidad para empresas' "$ROOT/wp-content/mu-plugins" "$ROOT/wp-content/themes" 2>/dev/null | head -40 || true
          echo "HOME_HTTP_REMOTE"
          for suffix in '' '?bf_diagnose=nov12-different-182' '?nocache=1'; do
            url="https://www.elmercadodeorigen.com/$suffix"
            curl -k -sSL --max-time 35 -D /tmp/bfhome-headers -o /tmp/bfhome-response "$url"
            echo "URL=$url"
            grep -iE '^(HTTP/|cache-control:|age:|x-cache|cf-cache|x-litespeed|x-rocket|vary:|server:)' /tmp/bfhome-headers | head -13 || true
            echo "HTML_BYTES=$(wc -c </tmp/bfhome-response)"
            for p in 'id="bf26-overlay"' 'curtain.css' 'preview.js' 'Ya está aquí la cosecha' 'Cestas de Navidad'; do
              n="$(grep -oF "$p" /tmp/bfhome-response | wc -l || true)"
              echo "HTML_MATCH=$p:$n"
            done
          done
          echo "CACHE_DISCOVERY"
          "$PHP" -d memory_limit=768M "$WP" eval '
            echo "WP_CACHE=".(defined("WP_CACHE")?(WP_CACHE?"1":"0"):"undefined")."\n";
            foreach((array)get_option("active_plugins",array()) as $p){
              if(preg_match("/cache|rocket|litespeed|optim|perfmatters|nitro|w3|autoptimize/i",$p)){
                echo "ACTIVE_CACHE_PLUGIN=".$p."\n";
              }
            }
            foreach(array("rocket_clean_domain","w3tc_flush_all","wp_cache_clear_cache","litespeed_purge_all","sg_cachepress_purge_cache") as $fn){
              echo "PURGE_FUNCTION=".$fn.":".(function_exists($fn)?"yes":"no")."\n";
            }
          ' --path="$ROOT" --allow-root
          find "$ROOT/wp-content" -maxdepth 3 -type d -iname "*cache*" 2>/dev/null | head -25 || true
          for file in /tmp/bfhome-headers /tmp/bfhome-response; do
            if [ -f "$file" ]; then
              echo "LAST_FILE=$file"
              if [ "$file" = /tmp/bfhome-headers ]; then grep -i -E '^(HTTP/|server:|cache-control:|x-|age:|vary:)' "$file" | head -30 || true; fi
            fi
          done
          echo "CUSTOM_HOME_CACHE_SOURCE"
          for file in "$ROOT/wp-content/mu-plugins/elmercado-home-fresh.php" "$ROOT/wp-content/mu-plugins/elmercado-home-critical-path-010254.php" "$ROOT/wp-content/advanced-cache.php"; do
            if [ -f "$file" ]; then
              echo "CUSTOM_CACHE_FILE=$file"
              grep -nE 'function |cache|CACHE|purge|flush|delete|unlink|write|file_put_contents|wp-content|transient|ob_start|parse_url|is_front_page|REQUEST_URI|query_string|header' "$file" | head -110 || true
            fi
          done
          echo "HOME_FAST_PATH_DETAILS"
          sed -n '1,55p' "$ROOT/wp-content/mu-plugins/elmercado-home-fresh.php" || true
          sed -n '78,116p' "$ROOT/wp-content/advanced-cache.php" || true
          echo "CACHED_HOME_FILE_MATCHES"
          find "$ROOT/wp-content/uploads" -maxdepth 3 -type f -name "*.html" 2>/dev/null | grep -Ei "home|index|front" | head -40 || true
          echo "FAILED_BF_DEPLOY_ARTIFACTS"
          RUN=43311761774
          for file in "/tmp/bf-preview-$RUN.html" "/tmp/bf-preview-$RUN.headers" "/tmp/bf-global-$RUN.html"; do
            if [ -f "$file" ]; then
              echo "BF_FAILURE_FILE=$file SIZE=$(wc -c < "$file")"
              if [[ "$file" == *.headers ]]; then
                head -30 "$file" || true
              else
                for str in 'id="bf26-overlay"' 'bf26-coming-soon' 'class="bf26' '404' '503' 'WordPress' 'Fatal error' 'Los regalos y las mejoras de peso'; do
                  echo "FOUND=$str:$(grep -oF "$str" "$file" | wc -l || true)"
                done
                head -c 250 "$file" || true
                echo
              fi
            fi
          done
          echo "HOME_CACHE_WRITERS"
          grep -RIl -m1 --include='*.php' -e 'elmercado-home-static' -e 'X-El-Mercado-Home-Early-Cache' -e 'elmercado_home_fresh_output_010244' "$ROOT/wp-content/mu-plugins" "$ROOT/wp-content/themes/elmercadodeorigen-child" "$ROOT/wp-content/advanced-cache.php" 2>/dev/null | head -35 || true
          echo "HOME_CACHE_SOURCE_MATCHES"
          grep -Rn -m8 --include='*.php' -e 'elmercado-home-static' -e 'X-El-Mercado-Home-Early-Cache' "$ROOT/wp-content/mu-plugins" "$ROOT/wp-content/themes/elmercadodeorigen-child" "$ROOT/wp-content/advanced-cache.php" 2>/dev/null | head -70 || true
          echo "HOME_OUTPUT_HOOK_TAIL"
          sed -n '620,717p' "$ROOT/wp-content/mu-plugins/elmercado-home-fresh.php" || true
          echo "FAST_CACHE_SEED"
          sed -n '90,118p' "$ROOT/wp-content/advanced-cache.php" || true
          echo "BF_BOOTSTRAP_PRESENT"
          ls -l "$ROOT/wp-content/mu-plugins/emdo-black-friday-2026-preview.php" "$ROOT/wp-content/mu-plugins/emdo-black-friday-2026-preview/curtain.css" 2>&1 || true
          REMOTE

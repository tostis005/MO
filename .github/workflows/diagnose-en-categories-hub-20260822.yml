name: Diagnose English categories hub 20260822

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/diagnose-en-categories-hub-20260822.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Diagnose production hub
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?Production path not found}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" > /tmp/hub-state.json <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          page_json=$("$wp_bin" eval '
            global $wpdb;
            $rows=$wpdb->get_results("SELECT p.ID,p.post_title,p.post_name,p.post_status, s.meta_value AS en_slug, pub.meta_value AS en_pub FROM {$wpdb->posts} p LEFT JOIN {$wpdb->postmeta} s ON s.post_id=p.ID AND s.meta_key=\"_en_US_post_name\" LEFT JOIN {$wpdb->postmeta} pub ON pub.post_id=p.ID AND pub.meta_key=\"_en_US_published\" WHERE p.post_type=\"page\" AND (p.post_name=\"categorias\" OR s.meta_value=\"categories\") ORDER BY p.ID", ARRAY_A); echo wp_json_encode($rows);' --path="$PROD_PATH" --allow-root)
          python3 - "$page_json" <<'PY'
          import sys,json,subprocess,re
          rows=json.loads(sys.argv[1] or '[]')
          def head(url):
              p=subprocess.run(['curl','-k','-sS','-D','-','-o','/dev/null','--connect-timeout','5','--max-time','15','--max-redirs','0','-A','Mozilla/5.0 EMDO-hub-diagnostic/1.0','-H','Cache-Control: no-cache',url],capture_output=True,text=True)
              h=p.stdout
              m=re.search(r'^HTTP/\S+\s+(\d{3})',h,re.M)
              loc=re.findall(r'^location:\s*(.+)$',h,re.I|re.M)
              xr=re.findall(r'^x-redirect-by:\s*(.+)$',h,re.I|re.M)
              return {'status':int(m.group(1)) if m else 0,'location':loc[-1].strip() if loc else '','x_redirect_by':xr[-1].strip() if xr else '','headers':h[-4000:]}
          def get(url):
              p=subprocess.run(['curl','-k','-L','-sS','--connect-timeout','5','--max-time','20','--max-redirs','6','-A','Mozilla/5.0 EMDO-hub-diagnostic/1.0','-H','Cache-Control: no-cache','-w','\n__STATUS__:%{http_code}\n__URL__:%{url_effective}',url],capture_output=True,text=True)
              raw=p.stdout
              sm=re.search(r'\n__STATUS__:(\d{3})\n__URL__:(.*)$',raw,re.S)
              body=raw[:sm.start()] if sm else raw
              status=int(sm.group(1)) if sm else 0
              eff=sm.group(2).strip() if sm else ''
              links=re.findall(r'href=["\']([^"\']+)["\']',body,re.I)
              product_cat=[x for x in links if '/product-category/' in x or '/categoria-producto/' in x]
              return {'returncode':p.returncode,'status':status,'effective':eff,'bytes':len(body.encode()),'title':(re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S) else ''),'h1':(re.search(r'<h1[^>]*>(.*?)</h1>',body,re.I|re.S).group(1).strip() if re.search(r'<h1[^>]*>(.*?)</h1>',body,re.I|re.S) else ''),'category_link_count':len(product_cat),'category_link_sample':product_cat[:20],'stderr':p.stderr[-1500:]}
          base='https://www.elmercadodeorigen.com'
          out={'pages':rows,'en_head':head(base+'/en/categories/'),'es_head':head(base+'/categorias/'),'en_get':get(base+'/en/categories/?emdo_hub_diag=1'),'es_get':get(base+'/categorias/?emdo_hub_diag=1')}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          REMOTE
          cp /tmp/hub-state.json .deploy-status/en-categories-hub-diagnostic-20260822.json
      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add .deploy-status/en-categories-hub-diagnostic-20260822.json || true
          git commit -m 'Record English categories hub diagnostic [skip ci]' || true
          git push origin HEAD:main

name: Audit Black Friday FluentCRM send readiness without sending
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fluentcrm-bf10-send-readiness-audit-20261122.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only script
        run: php -l .github/scripts/fluentcrm-bf10-send-readiness-20261122.php
      - name: Inspect production campaign metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          SSH_PORT="$PORT"; [ -n "$SSH_PORT" ] || SSH_PORT=22
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          REMOTE="/tmp/emdo-bf10-readiness-${GITHUB_RUN_ID}.php"
          sshpass -e scp -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P "$SSH_PORT" .github/scripts/fluentcrm-bf10-send-readiness-20261122.php "$USER@$HOST:$REMOTE"
          trap 'sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$USER@$HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$USER@$HOST" "timeout 120 /opt/plesk/php/8.2/bin/php -d memory_limit=768M /usr/local/bin/wp eval-file '$REMOTE' --path='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs' --allow-root" | tee /tmp/emdo-readiness.txt
          grep -q 'BF10_READINESS_AUDIT_COMPLETE' /tmp/emdo-readiness.txt

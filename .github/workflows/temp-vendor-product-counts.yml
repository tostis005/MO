name: Temp Vendor Product Counts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-vendor-product-counts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Count product types and feed rows by vendor
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"; wp_bin=$(command -v wp); php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '
            global $wpdb;
            $authors=$wpdb->get_col("SELECT DISTINCT post_author FROM {$wpdb->posts} WHERE post_type=\"product\" AND post_status=\"publish\" ORDER BY post_author");
            $feed_counts=[];
            $feed_path=function_exists("mdo_openai_feed_path_20260909")?mdo_openai_feed_path_20260909("native_jsonl_gz"):"";
            if($feed_path && is_readable($feed_path)){
              $fh=gzopen($feed_path,"rb");
              while($fh && !gzeof($fh)){
                $line=trim((string)gzgets($fh)); if($line==="")continue;
                $r=json_decode($line,true); if(!is_array($r))continue;
                $seller=(string)($r["seller_name"]??""); if($seller!=="")$feed_counts[$seller]=($feed_counts[$seller]??0)+1;
              }
              if($fh)gzclose($fh);
            }
            foreach($authors as $uid){
              $uid=(int)$uid; $u=get_userdata($uid); if(!$u)continue;
              $ids=$wpdb->get_col($wpdb->prepare("SELECT ID FROM {$wpdb->posts} WHERE post_type=\"product\" AND post_status=\"publish\" AND post_author=%d ORDER BY ID",$uid));
              $simple=0;$variable=0;$grouped=0;$external=0;$other=0;$published_variants=0;
              foreach($ids as $pid){
                $p=wc_get_product((int)$pid); if(!$p)continue;
                if($p->is_type("simple"))$simple++;
                elseif($p->is_type("variable")){$variable++; foreach((array)$p->get_children() as $vid){$v=wc_get_product((int)$vid); if($v instanceof WC_Product_Variation && $v->exists() && "publish"===(string)$v->get_status())$published_variants++;}}
                elseif($p->is_type("grouped"))$grouped++;
                elseif($p->is_type("external"))$external++;
                else $other++;
              }
              $profile=get_user_meta($uid,"wcfmmp_profile_settings",true);
              $store=is_array($profile)&&!empty($profile["store_name"])?(string)$profile["store_name"]:(string)$u->display_name;
              $active=function_exists("mdo_gmf_vendor_is_active_v1")?mdo_gmf_vendor_is_active_v1($uid):!in_array("disable_vendor",(array)$u->roles,true);
              $feed_rows=(int)($feed_counts[$store]??0);
              echo "COUNT ".wp_json_encode(["vendor_id"=>$uid,"store"=>$store,"active"=>(bool)$active,"published_parents"=>count($ids),"simple"=>$simple,"variable"=>$variable,"published_variants"=>$published_variants,"grouped"=>$grouped,"external"=>$external,"other"=>$other,"feed_rows"=>$feed_rows],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            }
          ' --path="$PROD_PATH" --allow-root
          REMOTE

name: Diagnose Tolecarnes shipping 2026-08-14

on:
  push:
    paths:
      - '.github/workflows/diagnose-tolecarnes-shipping-20260814.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production shipping configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=("$php_bin" "$wp_bin" --path="$PROD_PATH" --allow-root --skip-plugins --skip-themes)
          prefix=$("${WP[@]}" db prefix)

          echo '=== SITE ==='
          "${WP[@]}" option get siteurl

          echo '=== TOLECARNES USER ==='
          "${WP[@]}" db query "SELECT ID,user_login,user_nicename,display_name FROM ${prefix}users WHERE ID=4507;"

          echo '=== VENDOR 4507 SHIPPING USERMETA ==='
          "${WP[@]}" db query "SELECT meta_key, LEFT(meta_value,2000) AS meta_value FROM ${prefix}usermeta WHERE user_id=4507 AND (LOWER(meta_key) LIKE '%shipping%' OR LOWER(meta_key) LIKE '%wcfm%') ORDER BY meta_key;" || true

          echo '=== VENDOR 4507 WCFM ZONE METHODS ==='
          "${WP[@]}" db query "SELECT instance_id,zone_id,vendor_id,method_id,is_enabled,settings FROM ${prefix}wcfm_marketplace_shipping_zone_methods WHERE vendor_id=4507 ORDER BY zone_id,instance_id;" || true

          echo '=== VENDOR 4507 WCFM ZONE LOCATIONS ==='
          "${WP[@]}" db query "SELECT id,vendor_id,zone_id,location_code,location_type FROM ${prefix}wcfm_marketplace_shipping_zone_locations WHERE vendor_id=4507 ORDER BY zone_id,id;" || true

          echo '=== WOO SHIPPING ZONES ==='
          "${WP[@]}" db query "SELECT zone_id,zone_name,zone_order FROM ${prefix}woocommerce_shipping_zones ORDER BY zone_order,zone_id;" || true

          echo '=== WOO SHIPPING ZONE LOCATIONS ==='
          "${WP[@]}" db query "SELECT zone_id,location_code,location_type FROM ${prefix}woocommerce_shipping_zone_locations ORDER BY zone_id,location_type,location_code;" || true

          echo '=== WOO WCFM SHIPPING METHODS BY ZONE ==='
          "${WP[@]}" db query "SELECT zone_id,method_id,instance_id,is_enabled,method_order FROM ${prefix}woocommerce_shipping_zone_methods WHERE method_id='wcfmmp_product_shipping_by_zone' ORDER BY zone_id,method_order,instance_id;" || true

          product_id=$("${WP[@]}" db query "SELECT ID FROM ${prefix}posts WHERE post_type='product' AND post_status='publish' AND post_author=4507 ORDER BY ID DESC LIMIT 1;" --skip-column-names)
          echo "=== SAMPLE TOLECARNES PRODUCT: ${product_id:-NONE} ==="

          if [ -n "${product_id:-}" ]; then
            echo '=== LIVE SHIPPING CALCULATION ==='
            EMO_PRODUCT_ID="$product_id" "$php_bin" -d memory_limit=512M "$wp_bin" eval '
              $pid = (int) getenv("EMO_PRODUCT_ID");
              $product = wc_get_product($pid);
              if (!$product) { echo "NO_PRODUCT\n"; return; }
              $tests = [
                "Madrid" => ["state"=>"M", "postcode"=>"28001", "city"=>"Madrid"],
                "Toledo" => ["state"=>"TO", "postcode"=>"45001", "city"=>"Toledo"],
                "Baleares" => ["state"=>"PM", "postcode"=>"07001", "city"=>"Palma"],
                "Barcelona" => ["state"=>"B", "postcode"=>"08001", "city"=>"Barcelona"],
              ];
              foreach ($tests as $name => $dest) {
                $package = [
                  "contents" => ["emo" => ["data"=>$product, "product_id"=>$pid, "variation_id"=>0, "quantity"=>1, "line_total"=>100, "line_tax"=>0, "line_subtotal"=>100, "line_subtotal_tax"=>0]],
                  "contents_cost" => 100,
                  "applied_coupons" => [],
                  "user" => ["ID"=>0],
                  "destination" => ["country"=>"ES", "state"=>$dest["state"], "postcode"=>$dest["postcode"], "city"=>$dest["city"], "address"=>"Calle prueba 1", "address_2"=>""],
                ];
                $zone = WC_Shipping_Zones::get_zone_matching_package($package);
                echo "DEST=$name STATE={$dest["state"]} ZONE=".$zone->get_id()." NAME=".$zone->get_zone_name()."\n";
                $result = WC()->shipping()->calculate_shipping_for_package($package);
                if (empty($result["rates"])) { echo "RATES=NONE\n"; continue; }
                foreach ($result["rates"] as $rate_id => $rate) {
                  echo "RATE=$rate_id LABEL=".$rate->get_label()." COST=".$rate->get_cost()." METHOD=".$rate->get_method_id()."\n";
                }
              }
            ' --path="$PROD_PATH" --allow-root
          fi

          echo '=== SHIPPING PLUGIN MATCHING REFERENCES ==='
          grep -R -n -E 'get_zone_matching_package|wcfm_marketplace_shipping_zone_methods|calculate_shipping' "$PROD_PATH/wp-content/plugins/wc-multivendor-marketplace" 2>/dev/null | head -n 80 || true
          REMOTE

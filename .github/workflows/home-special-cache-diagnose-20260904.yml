name: Home special cache diagnose 20260904

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-special-cache-diagnose-20260904.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose production Home special cache and renderer
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?Could not locate production WordPress}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp() { "$php_bin" -d memory_limit=512M "$wp_bin" "$@"; }

          echo '=== CACHE ENVIRONMENT ==='
          wp eval 'echo "WP_CACHE=" . (defined("WP_CACHE") && WP_CACHE ? "1" : "0") . PHP_EOL; echo "advanced_cache=" . (is_file(WP_CONTENT_DIR . "/advanced-cache.php") ? "1" : "0") . PHP_EOL;' --path="$PROD_PATH" --skip-themes --allow-root

          echo '=== CURRENT PROMOTIONS ==='
          wp eval '
            $q = new WP_Query(["post_type"=>"mdo_promotion","post_status"=>["publish","draft","pending","future","private"],"posts_per_page"=>-1,"orderby"=>"ID","order"=>"ASC"]);
            foreach ($q->posts as $p) {
              echo "PROMO:" . wp_json_encode([
                "id"=>$p->ID,"title"=>$p->post_title,"post_status"=>$p->post_status,
                "promo_status"=>class_exists("MDO_Specials") ? MDO_Specials::status($p->ID) : "no-class",
                "featured_home"=>get_post_meta($p->ID,"_mdo_promo_featured_home",true),
                "start"=>get_post_meta($p->ID,"_mdo_promo_start",true),
                "end"=>get_post_meta($p->ID,"_mdo_promo_end",true),
                "product_ids"=>get_post_meta($p->ID,"_mdo_promo_product_ids",true)
              ], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
            }
          ' --path="$PROD_PATH" --allow-root

          echo '=== RENDER/CACHE CODE MATCHES ==='
          grep -RIn --exclude='*.map' --exclude-dir='node_modules' --exclude-dir='vendor' \
            -E 'elmercado-home-static|_mdo_promo_featured_home|mdo_promotion|featured_home|MDO_Specials' \
            "$PROD_PATH/wp-content/mu-plugins" "$PROD_PATH/wp-content/themes" "$PROD_PATH/wp-content/plugins/mdo-supplier-sync" \
            2>/dev/null | head -n 400 || true

          echo '=== HOME STATIC FILES ==='
          find "$PROD_PATH/wp-content/uploads/elmercado-home-static" -maxdepth 2 -type f -printf 'STATIC_FILE:%p size=%s mtime=%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null || true
          REMOTE

          echo '=== ANONYMOUS HOME HTTP ==='
          curl -LfsS --max-time 45 -D /tmp/plain-h.txt -o /tmp/plain.html 'https://www.elmercadodeorigen.com/'
          curl -LfsS --max-time 45 -D /tmp/bust-h.txt -o /tmp/bust.html "https://www.elmercadodeorigen.com/?mdo_special_cache_diag=${GITHUB_RUN_ID}"
          grep -Ei '^(HTTP/|age:|cache-control:|cf-cache-status:|x-cache:|x-el-mercado-home-fresh:|server:|vary:)' /tmp/plain-h.txt | sed 's/^/PLAIN_HEADER: /' || true
          grep -Ei '^(HTTP/|age:|cache-control:|cf-cache-status:|x-cache:|x-el-mercado-home-fresh:|server:|vary:)' /tmp/bust-h.txt | sed 's/^/BUST_HEADER: /' || true
          python3 - <<'PY'
          from pathlib import Path
          import html as h
          expected='Jamón de bellota 100% ibérico Montjam · 6–6,5 kg por 225 €'
          for label,path in [('PLAIN','/tmp/plain.html'),('BUST','/tmp/bust.html')]:
              raw=Path(path).read_text(errors='ignore')
              text=h.unescape(raw)
              print(label+'_EXACT_TITLE:', expected in text)
              for needle in ['Dos hamburguesas de ternera de regalo','Jamón de bellota 100% ibérico Montjam','6–6,5 kg por 225','mdo-promotion','promo','Especial']:
                  print(label+'_MARKER:',needle,text.find(needle))
              pos=text.find('Jamón de bellota 100% ibérico Montjam')
              if pos>=0:
                  print(label+'_PROMO_CONTEXT:',text[max(0,pos-500):pos+1200].replace('\n',' ')[:1700])
          PY
          echo 'HOME_SPECIAL_CACHE_DIAGNOSE_DONE'

name: Verify product cards and Home hero density 0.10.246

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-card-hero-density-010246.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify production
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/emo-verify && cd /tmp/emo-verify
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/.github/scripts/verify-card-hero-density-010246.js" ./verify.js
          node verify.js

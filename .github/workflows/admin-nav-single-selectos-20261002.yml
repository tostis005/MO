name: Admin nav single Selectos 20261002
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-nav-single-selectos-20261002.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs"
          PHP="/opt/plesk/php/8.2/bin/php"; WP="/usr/local/bin/wp"
          cat > /tmp/admin-one.php <<'PHP'
          <?php
          global $wpdb,$post;
          $progress='/tmp/admin-nav-progress.txt';
          @file_put_contents($progress,"BOOTED\n",FILE_APPEND|LOCK_EX);
          $p=get_page_by_path('foie-gras-de-pato-extra-desvenado',OBJECT,'product');
          $post=$p; setup_postdata($post);

          wp_set_current_user(0);
          @file_put_contents($progress,"ANON_START\n",FILE_APPEND|LOCK_EX);
          $q=$wpdb->num_queries;$t=microtime(true);$x=woostify_get_prev_product();
          @file_put_contents($progress,'ANON_PREV id='.($x?$x->get_id():0).' sec='.round(microtime(true)-$t,3).' queries='.($wpdb->num_queries-$q)."\n",FILE_APPEND|LOCK_EX);
          $q=$wpdb->num_queries;$t=microtime(true);$x=woostify_get_next_product();
          @file_put_contents($progress,'ANON_NEXT id='.($x?$x->get_id():0).' sec='.round(microtime(true)-$t,3).' queries='.($wpdb->num_queries-$q)."\n",FILE_APPEND|LOCK_EX);

          $admins=get_users(array('role'=>'administrator','number'=>1,'fields'=>'ID'));
          wp_set_current_user((int)$admins[0]);
          $can=function_exists('elmercado_wcfm_disabled_visibility_can_view_010210')&&elmercado_wcfm_disabled_visibility_can_view_010210()?1:0;
          @file_put_contents($progress,'ADMIN_START can_view_disabled='.$can."\n",FILE_APPEND|LOCK_EX);
          $q=$wpdb->num_queries;$t=microtime(true);$x=woostify_get_prev_product();
          @file_put_contents($progress,'ADMIN_PREV id='.($x?$x->get_id():0).' sec='.round(microtime(true)-$t,3).' queries='.($wpdb->num_queries-$q)."\n",FILE_APPEND|LOCK_EX);
          $q=$wpdb->num_queries;$t=microtime(true);$x=woostify_get_next_product();
          @file_put_contents($progress,'ADMIN_NEXT id='.($x?$x->get_id():0).' sec='.round(microtime(true)-$t,3).' queries='.($wpdb->num_queries-$q)."\n",FILE_APPEND|LOCK_EX);
          PHP
          rm -f /tmp/admin-nav-progress.txt
          timeout 60s "$PHP" -d memory_limit=1024M "$WP" eval-file /tmp/admin-one.php --path="$ROOT" --allow-root --skip-plugins=facebook-for-woocommerce,translatepress-multilingual,ajax-search-for-woocommerce,click-to-chat-for-whatsapp,woocommerce-checkout-manager,woocommerce-checkout-manager-pro,elementor,advanced-coupons-for-woocommerce-free,advanced-product-labels-for-woocommerce,webappick-product-feed-for-woocommerce,all-in-one-seo-pack,yith-woocommerce-product-add-ons,yith-woocommerce-product-bundles-premium || echo ADMIN_PROFILE_TIMED_OUT
          echo "=== PROGRESS ==="
          cat /tmp/admin-nav-progress.txt 2>/dev/null || true
          REMOTE

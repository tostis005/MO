name: Diagnose duplicate cart additions in live shop
on:
  pull_request:
    paths:
      - '.github/workflows/audit-quick-cart-design-20261026.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce single click and observe cart mutations in Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --prefix /tmp/emdo-dupe playwright@1.56.1
          cat > /tmp/emdo-dupe.cjs <<'JAVASCRIPT'
          const {chromium}=require('/tmp/emdo-dupe/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            for(const [device,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){
              const ctx=await browser.newContext({viewport,locale:'es-ES'});
              const page=await ctx.newPage();
              const events=[];
              page.on('request',r=>{
                const u=r.url(); if(/(?:wc-ajax=|admin-ajax|add-to-cart=)/.test(u)){
                  const d=r.postData()||'';
                  events.push({kind:'request',method:r.method(),url:u.slice(0,220),data:d.slice(0,350)});
                }
              });
              page.on('response',async r=>{
                const u=r.url(); if(/(?:wc-ajax=|admin-ajax|add-to-cart=)/.test(u)){
                  events.push({kind:'response',status:r.status(),url:u.slice(0,220)});
                }
              });
              try{
                await page.goto('https://www.elmercadodeorigen.com/tienda/?emdo-dupe-check=20261026',{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector('a.emo-card-quick-add',{timeout:18000});
                const buttons=await page.locator('a.emo-card-quick-add').evaluateAll(nodes=>nodes.map(el=>({type:el.className,id:el.dataset.product_id,href:el.href,text:el.parentElement?.querySelector('h2')?.textContent?.slice(0,80)})));
                console.log('LISTING_BUTTONS '+device+' '+JSON.stringify(buttons.slice(0,9)));
                const simple=page.locator('a.emo-card-quick-add.product_type_simple').first();
                if(!(await simple.count())){console.log('NO_SIMPLE '+device);continue;}
                const id=await simple.getAttribute('data-product_id');
                console.log('CLICK_SIMPLE '+device+' '+id);
                await simple.click({timeout:10000});
                await page.waitForTimeout(2800);
                console.log('AFTER_CLICK '+device+' '+JSON.stringify({url:page.url(),events}));
                await page.goto('https://www.elmercadodeorigen.com/carrito/',{waitUntil:'domcontentloaded',timeout:45000});
                const cart=await page.evaluate(()=>{
                  const forms=[...document.querySelectorAll('.woocommerce-cart-form .cart_item, tr.cart_item, .wc-block-cart-items__row')];
                  return {url:location.href,items:forms.map(el=>({name:el.querySelector('.product-name,.wc-block-components-product-name')?.textContent?.trim().slice(0,90),quantity:el.querySelector('input.qty,input[type="number"]')?.value,html:el.outerHTML.slice(0,450)})),body:document.body.innerText.slice(0,800)};
                });
                console.log('CART_STATE '+device+' '+JSON.stringify(cart));
                console.log('ALL_EVENTS '+device+' '+JSON.stringify(events));
              }catch(e){console.log('DIAG_ERROR '+device+' '+e.stack);}
              finally{await ctx.close();}
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JAVASCRIPT
          node /tmp/emdo-dupe.cjs

name: Verify compact rectangular cart design in production
on:
  pull_request:
    paths:
      - '.github/workflows/audit-quick-cart-design-20261026.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check live cart shape, badge alignment and popup regression in Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --prefix /tmp/emdo-design playwright@1.56.1
          cat > /tmp/emdo-design-check.cjs <<'CHECK_JS'
          const {chromium}=require('/tmp/emdo-design/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            let failures=0;
            for(const [pageName,path] of [['Tienda','/tienda/'],['Productor 1957','/tienda/1957/']]){
              for(const [device,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){
                const page=await browser.newPage({viewport,locale:'es-ES'});
                try{
                  const url='https://www.elmercadodeorigen.com'+path+'?emdo-cart-shape='+process.env.GITHUB_SHA;
                  await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                  await page.waitForSelector('ul.products li.product > a.emo-card-quick-add',{timeout:20000});
                  const result=await page.evaluate(()=>{
                    const cards=[...document.querySelectorAll('ul.products li.product')];
                    const buttons=cards.map(card=>card.querySelector(':scope > a.emo-card-quick-add')).filter(Boolean);
                    const shapes=buttons.map(button=>{
                      const css=getComputedStyle(button),r=button.getBoundingClientRect();
                      const svg=button.querySelector('.emo-card-quick-add__symbol svg');
                      const badge=button.closest('li.product')?.querySelector('.mdo-emdo-selection-badge');
                      const br=badge?.getBoundingClientRect();
                      return {
                        width:Math.round(r.width),height:Math.round(r.height),radius:Math.round(parseFloat(css.borderTopLeftRadius)),
                        iconSize:svg?Math.round(svg.getBoundingClientRect().width):0,
                        background:css.backgroundColor,color:css.color,
                        badgeCenterDelta:br?Math.abs((br.top+br.height/2)-(r.top+r.height/2)):null,
                        visible:r.width>0&&r.height>0&&css.display!=='none'
                      };
                    });
                    return {cards:cards.length,buttons:buttons.length,shapes};
                  });
                  const first=result.shapes[0];
                  const ok=result.buttons>0&&result.shapes.every(s=>s.width===40&&s.height===34&&s.radius===9&&s.iconSize===19&&s.visible&&s.background==='rgba(23, 63, 50, 0.94)'&&(s.badgeCenterDelta===null||s.badgeCenterDelta<3));
                  console.log('BUTTON_SHAPE '+JSON.stringify({page:pageName,device,cards:result.cards,buttons:result.buttons,first,ok}));
                  if(!ok){failures++;console.error('SHAPE_FAILURE '+pageName+' '+device);}
                  if(pageName==='Tienda'){
                    await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
                    await page.waitForTimeout(2800);
                    const scroll=await page.evaluate(()=>{
                      const cards=[...document.querySelectorAll('ul.products li.product')];
                      const missing=cards.filter(c=>c.classList.contains('instock')&&c.querySelector('.price')&&(c.classList.contains('product-type-simple')||c.classList.contains('product-type-variable'))&&!c.querySelector(':scope > a.emo-card-quick-add')).length;
                      return {loaded:cards.length,missing};
                    });
                    console.log('SCROLL_CHECK '+JSON.stringify({device,...scroll}));
                    if(scroll.missing>0){failures++;console.error('SCROLL_FAILURE '+device);}
                  }
                  const variable=page.locator('ul.products li.product > a.emo-card-quick-add.product_type_variable').first();
                  if(await variable.count()){
                    await variable.click({timeout:10000});
                    const form=page.locator('#emo-quick-cart-modal:not([hidden]) form.variations_form');
                    await form.waitFor({timeout:17000});
                    console.log('MODAL_REGRESSION_OK '+pageName+' '+device);
                    await page.locator('#emo-quick-cart-modal .emo-quick-cart-close').click();
                  }
                  await page.screenshot({path:'/tmp/emdo-cart-'+(pageName==='Tienda'?'shop':'producer')+'-'+device+'.png'});
                }catch(e){failures++;console.error('BROWSER_ERROR '+pageName+' '+device+' '+e.message);}
                finally{await page.close();}
              }
            }
            await browser.close();
            if(failures)process.exitCode=1;
          })().catch(error=>{console.error(error);process.exitCode=1;});
          CHECK_JS
          node /tmp/emdo-design-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emdo-rounded-rectangle-live-screenshots
          path: /tmp/emdo-cart-*.png
          retention-days: 3

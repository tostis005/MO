name: Audit Nginx source-IP trust and native challenge options 2026-10-27
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-facet-bot-real-versus-random-values-20261027.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Check safe server-native challenge support and IP trust settings without changes
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo === SERVER_LOAD ===
          uptime; date -u
          echo === NGINX_COMPILATION ===
          nginx -V 2>&1 | tr ' ' '\n' | grep -E 'http_auth_request|http_realip|http_js_module|http_geoip2_module|http_limit_req_module' | head -n 15
          echo === KNOWN_MODULES ===
          ls /usr/share/nginx/modules/*js* /usr/lib/nginx/modules/*js* /usr/share/nginx/modules/*geoip* 2>/dev/null | sed -E 's@.*/@@' | head -n 15
          echo === NGINX_DIRECT_IP_TRUST ===
          python3 - <<'PY'
          import os,re,glob,collections
          pats=['/etc/nginx/nginx.conf']+glob.glob('/etc/nginx/conf.d/*.conf')+glob.glob('/var/www/vhosts/system/elmercadodeorigen.com/conf/*nginx*.conf')+glob.glob('/etc/nginx/plesk.conf.d/*.conf')
          x=collections.Counter()
          for p in pats:
            try:
              for line in open(p,errors='replace'):
                s=line.strip().split('#',1)[0].strip()
                for directive in ('real_ip_header','set_real_ip_from','real_ip_recursive','proxy_set_header X-Forwarded-For','load_module'):
                  if s.startswith(directive):
                    x[(os.path.basename(p),directive)]+=1
                    # Do not print addresses or proxy trust list
            except:pass
          print('IP_TRUST_DIRECTIVE_COUNTS',list((k[0],k[1],v) for k,v in x.items()))
          PY
          echo === SUPPORTED_NGINX_MODULE_SYNTAX ===
          nginx -t 2>&1 | tail -n 2
          REMOTE
name: Diagnose canonical home cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-home-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production home cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -e
          echo "PROD_PATH=$PROD_PATH"
          echo '--- advanced-cache.php ---'
          if [ -f "$PROD_PATH/wp-content/advanced-cache.php" ]; then
            sed -n '1,260p' "$PROD_PATH/wp-content/advanced-cache.php"
          else
            echo 'advanced-cache.php missing'
          fi

          echo '--- matching cache implementation files ---'
          find "$PROD_PATH/wp-content" \
            -path '*/uploads' -prune -o \
            -path '*/node_modules' -prune -o \
            -type f \( -name '*.php' -o -name '*.inc' -o -name '*.conf' \) -print0 2>/dev/null \
            | xargs -0 grep -IlE 'El Mercado Home Cache|0\.10\.251|mdo[_-].*home.*cache|home.*cache.*mdo' 2>/dev/null \
            | head -n 30 || true

          echo '--- matching implementation snippets ---'
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "### $f"
            grep -nE -C 8 'El Mercado Home Cache|0\.10\.251|cache(_dir|_file|path)|file_put_contents|readfile|REQUEST_URI|QUERY_STRING' "$f" 2>/dev/null | head -n 220 || true
          done < <(
            find "$PROD_PATH/wp-content" \
              -path '*/uploads' -prune -o \
              -path '*/node_modules' -prune -o \
              -type f \( -name '*.php' -o -name '*.inc' \) -print0 2>/dev/null \
              | xargs -0 grep -IlE 'El Mercado Home Cache|0\.10\.251|mdo[_-].*home.*cache|home.*cache.*mdo' 2>/dev/null \
              | head -n 12 || true
          )

          echo '--- likely cache files/directories ---'
          find "$PROD_PATH/wp-content" -maxdepth 5 \( -iname '*home*cache*' -o -iname '*mdo*cache*' -o -iname '*010251*' \) -printf '%y %p %TY-%Tm-%Td %TH:%TM:%TS %s bytes\n' 2>/dev/null | head -n 120 || true
          REMOTE

name: Rollback Mercado de Origen cookie consent 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-cookie-consent-20260904-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Restore original CookieYes settings and remove consent bridge
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)

          cat > /tmp/emdo-cookie-rollback.php <<'PHP'
          <?php
          $pairs = array(
              'CookieLawInfo-0.9' => 'emdo_cookieyes_backup_20260904_main',
              'cookielawinfo_thirdparty_settings' => 'emdo_cookieyes_backup_20260904_thirdparty',
              'cookielawinfo_necessary_settings' => 'emdo_cookieyes_backup_20260904_necessary',
          );
          foreach ( $pairs as $target => $backup ) {
              $value = get_option( $backup, null );
              if ( null === $value || false === $value ) {
                  WP_CLI::error( 'Missing rollback backup option: ' . $backup );
              }
              update_option( $target, $value, false );
          }
          foreach ( $pairs as $backup ) {
              delete_option( $backup );
          }
          WP_CLI::success( 'Original CookieYes settings restored.' );
          PHP

          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file /tmp/emdo-cookie-rollback.php --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root
          rm -f /tmp/emdo-cookie-rollback.php
          rm -f "$PROD_PATH/wp-content/mu-plugins/emdo-cookie-consent.php"
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true

          test ! -e "$PROD_PATH/wp-content/mu-plugins/emdo-cookie-consent.php"
          echo ROLLBACK_SERVER_STATE=PASS
          REMOTE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Verify original public tracking behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          o = Options(); o.page_load_strategy = 'eager'
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=390,844','--lang=es-ES'):
              o.add_argument(arg)
          o.set_capability('goog:loggingPrefs', {'performance':'ALL'})
          d = webdriver.Chrome(options=o)
          d.set_page_load_timeout(60)
          d.execute_cdp_cmd('Network.enable', {})
          d.execute_cdp_cmd('Network.setExtraHTTPHeaders', {'headers': {
              'Accept-Language':'es-ES,es;q=0.9','Cache-Control':'no-cache','Pragma':'no-cache'
          }})
          try:
              d.get('https://www.elmercadodeorigen.com/?rollback_verify=' + str(time.time_ns()))
              time.sleep(10)
              html = d.page_source
              if 'emdo-consent-mode-bootstrap' in html or 'emdo-cookie-consent-responsive' in html:
                  raise AssertionError('Custom consent bridge is still present in public HTML')

              names = {c['name'] for c in d.get_cookies()}
              ga = sorted(n for n in names if n == '_ga' or n.startswith('_ga_'))
              if not ga:
                  raise AssertionError('Original pre-consent GA cookies were not restored')

              collects = []
              for e in d.get_log('performance'):
                  try:
                      m = json.loads(e['message'])['message']
                  except Exception:
                      continue
                  if m.get('method') == 'Network.requestWillBeSent':
                      u = m.get('params',{}).get('request',{}).get('url','')
                      if 'google-analytics.com/g/collect' in u and ('G-515YQ0XMS4' in u or 'tid=G-515YQ0XMS4' in u):
                          collects.append(u)
              if not collects:
                  # GA4 collect URLs commonly encode the measurement id as tid.
                  for e in d.get_log('performance'):
                      pass
                  raise AssertionError('No GA4 collect request for G-515YQ0XMS4 observed on fresh visit')

              print('ROLLBACK_PUBLIC=PASS')
              print('GA_COOKIES=' + ','.join(ga))
              print('GA4_COLLECT=PASS')
          finally:
              d.quit()
          PY

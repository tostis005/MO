name: Launch EntreSetas 29 listings and desktop store logo
on:
  workflow_run:
    workflows: ['Deploy MDO Supplier Sync to production']
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: entre-setas-publication-once
  cancel-in-progress: false
jobs:
  launch:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Check intended release
        id: gate
        run: |
          set -Eeuo pipefail
          if ! grep -q '^ \* Version: 1.0.72$' mdo-supplier-sync/mdo-supplier-sync.php; then
            echo 'launch=false' >> "$GITHUB_OUTPUT"
            echo "ENTRESETAS_PUBLICATION_RELEASE_NOT_SELECTED"
            exit 0
          fi
          php -l .github/scripts/publish-entresetas-and-logo-20261029.php
          echo 'launch=true' >> "$GITHUB_OUTPUT"
      - name: Publish 29 reviewed products and configure official WCFM circular logo
        if: steps.gate.outputs.launch == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="$STAGING_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          DEPLOYED_SHA="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cat '$PROD_PATH/wp-content/plugins/mdo-supplier-sync/.emdo-deployed-sha'" | tr -d '\r\n')"
          test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
          LOCAL_HASH="$(sha256sum mdo-supplier-sync/includes/class-mdo-woo-importer.php | cut -d ' ' -f1)"
          REMOTE_HASH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-woo-importer.php' | cut -d ' ' -f1" | tr -d '\r\n')"
          test "$LOCAL_HASH" = "$REMOTE_HASH"
          REMOTE="/tmp/publish-entresetas-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/publish-entresetas-and-logo-20261029.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          remote_wp() {
            phase="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              wp_bin=\$(command -v wp)
              EN_LAUNCH_PHASE='$phase' \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root
            "
          }
          remote_wp apply | tee /tmp/entresetas-launch.txt
          remote_wp verify | tee -a /tmp/entresetas-launch.txt
          grep -q '^ENTRESETAS_LAUNCH_VERIFIED=' /tmp/entresetas-launch.txt
      - name: Save proof of publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entre-setas-live-product-and-logo-verification
          path: /tmp/entresetas-launch.txt
          retention-days: 20
          if-no-files-found: warn

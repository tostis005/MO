name: Home pruned structural critical CSS 010291

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cls-pruned-structural-critical-010291.yml'

permissions:
  contents: write

concurrency:
  group: home-selective-structural-css-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build structural subset from live parent inline CSS
        shell: bash
        run: |
          set -euo pipefail
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/home-cache-before-010291.php
          cp elmercadodeorigen-child/assets/css/critical-woostify-home.min.css /tmp/critical-before-010291.css
          curl -fsS --compressed --max-time 60 'https://www.elmercadodeorigen.com/?mdo_structural_extract=1' -o /tmp/home-raw-010291.html
          python3 -m pip install --quiet tinycss2
          python3 - <<'PY'
          from pathlib import Path
          import re, tinycss2

          html=Path('/tmp/home-raw-010291.html').read_text(errors='ignore')
          m=re.search(r'<style\b[^>]*\bid=["\']woostify-parent-style-inline-css["\'][^>]*>(.*?)</style\s*>',html,re.I|re.S)
          if not m:
              raise SystemExit('parent inline CSS not found in dynamic Home')
          css=m.group(1)
          markers=(
              ':root','html','body.elmercado-child-theme','body.home',
              '#view','#content','.site-content','.site-main','.entry-content',
              '.site-header','.site-header-inner','.woostify-container','.site-branding','.site-title','.custom-logo',
              '.site-navigation','.main-navigation','.primary-navigation','.site-tools','.header-search','.search-icon',
              '.shopping-cart','.shopping-bag-button','.my-account','.toggle-sidebar-menu-btn','.topbar',
              '.emo-announcement','.emo-home','.emo-shell','.emo-hero','.emo-kicker','.emo-button','.emo-trust',
              '.emo-hero-card','.emo-hero__visual','.emo-hero__grid','.emo-hero__copy','.emo-hero__proof',
              '#mobile-navigation','.sidebar-menu','#shop-cart-sidebar','#woostify-overlay','.cart-sidebar-content'
          )

          def ser(tokens):
              return tinycss2.serialize(tokens).strip()

          def filter_rule_list(rules):
              out=[]
              for r in rules:
                  if r.type=='qualified-rule':
                      sel=ser(r.prelude)
                      if any(x in sel for x in markers):
                          out.append(sel+'{'+tinycss2.serialize(r.content)+'}')
                  elif r.type=='at-rule':
                      name=r.lower_at_keyword
                      pre=ser(r.prelude)
                      if r.content is not None and name in ('media','supports','layer','container'):
                          inner=tinycss2.parse_rule_list(r.content,skip_comments=True,skip_whitespace=True)
                          kept=filter_rule_list(inner)
                          if kept:
                              out.append('@'+name+(' '+pre if pre else '')+'{'+''.join(kept)+'}')
              return out

          rules=tinycss2.parse_stylesheet(css,skip_comments=True,skip_whitespace=True)
          subset=''.join(filter_rule_list(rules))
          if len(subset)<8000:
              raise SystemExit(f'structural subset unexpectedly small: {len(subset)}')
          Path('/tmp/parent-structural-010291.css').write_text(subset)
          crit=Path('elmercadodeorigen-child/assets/css/critical-woostify-home.min.css')
          current=crit.read_text()
          marker='/*mdo-parent-structural-critical-010291*/'
          if marker in current:
              current=current.split(marker,1)[0].rstrip()+'\n'
          crit.write_text(current+'\n'+marker+'\n'+subset+'\n')
          print('parent_bytes=',len(css))
          print('subset_bytes=',len(subset))
          print('critical_total_bytes=',crit.stat().st_size)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          block='''\t\t\t/* This 166 KiB block contains the final desktop Home geometry. Keep it\n\t\t\t * render-blocking while all non-structural inline CSS remains deferred. */\n\t\t\tif ( str_contains( $matches[0], 'id="woostify-parent-style-inline-css"' ) || str_contains( $matches[0], "id='woostify-parent-style-inline-css'" ) ) {\n\t\t\t\treturn $matches[0];\n\t\t\t}\n'''
          if block not in s:
              raise SystemExit('known-good parent-inline retention block not found')
          p.write_text(s.replace(block,'',1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
          grep -q 'mdo-parent-structural-critical-010291' elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
          ! grep -q 'This 166 KiB block contains' elmercadodeorigen-child/inc/home-cache.php

      - name: Deploy pruned critical experiment
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "$PROD" >/tmp/prod-010291
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-010291-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/css/critical-woostify-home.min.css "$STAGING_USER@$STAGING_HOST:/tmp/critical-010291-${GITHUB_RUN_ID}.css"
          timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e; THEME='$PROD/wp-content/themes/elmercadodeorigen-child'
            install -m0644 /tmp/home-cache-010291-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"
            install -m0644 /tmp/critical-010291-${GITHUB_RUN_ID}.css \"\$THEME/assets/css/critical-woostify-home.min.css\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/home-cache-010291-${GITHUB_RUN_ID}.php /tmp/critical-010291-${GITHUB_RUN_ID}.css
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-010291.html
          ! grep -q 'id="woostify-parent-style-inline-css"' /tmp/home-010291.html
          grep -q 'mdo-parent-structural-critical-010291' /tmp/home-010291.html
          grep -q 'id="elmercado-home-deferred-css" rel="preload"' /tmp/home-010291.html

      - name: Lighthouse desktop 3x
        id: measure
        shell: bash
        run: |
          set -euo pipefail; mkdir -p runtime
          for i in 1 2 3; do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/lhr-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'; done
          python3 - <<'PY' | tee runtime/home-cls-pruned-structural-010291.txt
          import json,statistics,os
          rows=[]
          print('structural_subset_bytes=',os.path.getsize('/tmp/parent-structural-010291.css'))
          for i in range(1,4):
              r=json.load(open(f'/tmp/lhr-{i}.json'));a=r['audits'];row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']};rows.append(row);print('run',i,row)
              for x in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:6]:n=x.get('node') or {};print(' shift',x.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(x[k] for x in rows) for k in rows[0]}
          for k,v in med.items():print('median_'+k+'=',v)
          keep=med['cls']<0.08 and med['lcp']<4600 and med['fcp']<2600
          print('keep=',str(keep).lower());open('/tmp/keep-010291','w').write('1' if keep else '0')
          PY

      - name: Keep only if faster without CLS regression
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep-010291 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then
            cp /tmp/home-cache-before-010291.php elmercadodeorigen-child/inc/home-cache.php
            cp /tmp/critical-before-010291.css elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
            PROD=$(cat /tmp/prod-010291);PORT="${STAGING_PORT:-22}";SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT";SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
            sshpass -e scp $SCP /tmp/home-cache-before-010291.php "$STAGING_USER@$STAGING_HOST:/tmp/revert-cache-010291-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP /tmp/critical-before-010291.css "$STAGING_USER@$STAGING_HOST:/tmp/revert-critical-010291-${GITHUB_RUN_ID}.css"
            timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child';install -m0644 /tmp/revert-cache-010291-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\";install -m0644 /tmp/revert-critical-010291-${GITHUB_RUN_ID}.css \"\$THEME/assets/css/critical-woostify-home.min.css\";php_bin=\$(command -v php || true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/revert-cache-010291-${GITHUB_RUN_ID}.php /tmp/revert-critical-010291-${GITHUB_RUN_ID}.css"
          fi
          mkdir -p runtime;[ -f runtime/home-cls-pruned-structural-010291.txt ]||echo failed > runtime/home-cls-pruned-structural-010291.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/home-cache.php elmercadodeorigen-child/assets/css/critical-woostify-home.min.css runtime/home-cls-pruned-structural-010291.txt
          git commit -m 'Measure pruned Home structural critical CSS' || exit 0
          git pull --rebase origin main;git push origin HEAD:main

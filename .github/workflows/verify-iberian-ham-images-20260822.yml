name: Verify Iberian ham imagery production 20260822

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-iberian-ham-images-20260822.yml'

permissions:
  contents: write

concurrency:
  group: elmercado-production-blog-image-pagination-010262
  cancel-in-progress: false

jobs:
  repair-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate files and secrets
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/repair-blog-images-010262.php
          php -l .github/scripts/blog-image-state-010262.php
          php -l .github/scripts/certify-blog-images-20260822.php
          php -l .github/data/editorial-image-overrides-20260821.php
          php -l .github/data/legacy-blog-image-overrides-20260821.php
          : "${STAGING_HOST:?STAGING_HOST missing}"
          : "${STAGING_USER:?STAGING_USER missing}"
          : "${STAGING_PASSWORD:?STAGING_PASSWORD missing}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          php -r '$a=require ".github/data/editorial-image-overrides-20260821.php"; foreach(["ham-starting-orientation-guide"=>"37326564","iberian-ham-parts-guide"=>"38289321","serve-iberian-ham-guide"=>"37326360"] as $k=>$id){if((string)($a[$k]["id"]??"")!==$id){fwrite(STDERR,"unexpected $k\n");exit(1);}} echo "IBERIAN_SELECTIONS_OK\n";'

      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Repair and certify WordPress production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          REMOTE="/tmp/emdo-iberian-ham-images-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/repair-blog-images-010262.php \
            .github/scripts/blog-image-state-010262.php \
            .github/scripts/certify-blog-images-20260822.php \
            .github/data/editorial-image-overrides-20260821.php \
            .github/data/legacy-blog-image-overrides-20260821.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PROD_PATH' '$REMOTE' '${GITHUB_SHA}'" <<'REMOTE_SCRIPT'
          set -eu
          prod="$1"; incoming="$2"; source_sha="$3"
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_cmd="$php_bin -d memory_limit=768M $wp_bin --path=$prod --skip-plugins --skip-themes --allow-root"

          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          backup_dir="$rollback_root/$(date -u +%Y%m%dT%H%M%SZ)-before-iberian-ham-images-${source_sha%??????????????????????????????????????}"
          mkdir -p "$backup_dir"
          state_file="$backup_dir/post-state.json"
          MDO_STATE_MODE=backup \
          MDO_STATE_FILE="$state_file" \
          MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
          MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
          sh -c "$wp_cmd eval-file '$incoming/blog-image-state-010262.php'" > "$backup_dir/backup.log"
          test -s "$state_file"

          changed=1
          rollback_on_error() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$changed" -eq 1 ]; then
              MDO_STATE_MODE=restore \
              MDO_STATE_FILE="$state_file" \
              MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
              MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
              sh -c "$wp_cmd eval-file '$incoming/blog-image-state-010262.php'" >/dev/null 2>&1 || true
              sh -c "$wp_cmd cache flush" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap rollback_on_error EXIT

          MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
          MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
          sh -c "$wp_cmd eval-file '$incoming/repair-blog-images-010262.php'" > "$incoming/repair.json"
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);if(!is_array($r)||($r["status"]??"")!=="ok"||!empty($r["duplicates"])||($r["authority_post_count"]??0)<50){fwrite(STDERR,"repair validation failed\n");exit(1);}' "$incoming/repair.json"
          sh -c "$wp_cmd cache flush" >/dev/null 2>&1 || true

          MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
          MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
          sh -c "$wp_cmd eval-file '$incoming/certify-blog-images-20260822.php'" > "$incoming/cert.json"
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);if(!is_array($r)||($r["status"]??"")!=="ok"||($r["authority_count"]??0)<50||!empty($r["duplicates_by_pexels"])||!empty($r["duplicates_by_md5"])||!empty($r["forbidden_hits"])||!empty($r["semantic_flags"])){fwrite(STDERR,"certification validation failed\n");exit(1);} $seen=[]; foreach($r["expected"]??[] as $row){$seen[(string)($row["key"]??"")]=(string)($row["expected_pexels_id"]??"");} foreach(["ham-starting-orientation-guide"=>"37326564","iberian-ham-parts-guide"=>"38289321","serve-iberian-ham-guide"=>"37326360"] as $k=>$id){if(($seen[$k]??"")!==$id){fwrite(STDERR,"new Iberian image not live: $k\n");exit(1);}}' "$incoming/cert.json"
          cp "$incoming/repair.json" "$backup_dir/repair.json"
          cp "$incoming/cert.json" "$backup_dir/cert.json"
          trap - EXIT
          echo "BACKUP_DIR=$backup_dir"
          echo WORDPRESS_IBERIAN_HAM_IMAGES_OK
          REMOTE_SCRIPT

          sshpass -e scp $SCP "$STAGING_USER@$STAGING_HOST:$REMOTE/cert.json" /tmp/blog-cert-report.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"

      - name: Verify public rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/public-checks.tsv
          import json
          d=json.load(open('/tmp/blog-cert-report.json'))
          for row in d['public_checks']:
              print(f"{row['expected_pexels_id']}\t{row['url']}\t{row['context']}")
          PY
          checks=0
          while IFS=$'\t' read -r expected url context; do
            [ -n "$expected" ] && [ -n "$url" ]
            page="/tmp/emdo-public-${expected}.html"
            result="$(curl -ksS -L --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 60 -A 'EMDO Iberian ham image certification/20260822' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$page" -w '%{http_code}|%{url_effective}' "${url}?emdo_iberian_ham_cert=${GITHUB_SHA}")"
            code="${result%%|*}"
            [ "$code" = 200 ] || { echo "HTTP $code for $context" >&2; exit 1; }
            grep -Fq "$expected" "$page" || { echo "Expected image $expected not rendered for $context" >&2; exit 1; }
            ! grep -Eq '37328201|19370451|4441933|36601487|37328770|24706530|34314216|36215958|24906286|30795237|30795238|947174|14639925|6059884|25185476|30811288|36183155' "$page"
            checks=$((checks+1))
          done < /tmp/public-checks.tsv
          echo "PUBLIC_IBERIAN_HAM_IMAGES_OK checks=$checks"

      - name: Build verification report
        shell: bash
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json, datetime
          d=json.load(open('/tmp/blog-cert-report.json'))
          expected={r.get('key'):r.get('expected_pexels_id') for r in d.get('expected',[]) if r.get('type')=='authority'}
          out={
            'status':'ok',
            'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'published_posts':d['published_post_count'],
            'authority_posts':d['authority_count'],
            'audited_images':len(d['all_images']),
            'duplicates_by_pexels':d['duplicates_by_pexels'],
            'duplicates_by_md5':d['duplicates_by_md5'],
            'forbidden_hits':d['forbidden_hits'],
            'semantic_flags':d['semantic_flags'],
            'verified_new_images':{
              'ham-starting-orientation-guide':expected.get('ham-starting-orientation-guide'),
              'iberian-ham-parts-guide':expected.get('iberian-ham-parts-guide'),
              'serve-iberian-ham-guide':expected.get('serve-iberian-ham-guide'),
            },
            'public_render':'ok'
          }
          json.dump(out,open('reports/iberian-ham-images-20260822-production.json','w'),ensure_ascii=False,indent=2)
          PY
          cat reports/iberian-ham-images-20260822-production.json

      - name: Record verified production state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/iberian-ham-images-20260822-production.json
          git commit -m 'Record verified Iberian ham imagery [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Success
        run: echo IBERIAN_HAM_IMAGES_PRODUCTION_CERTIFIED

# Second push intentionally triggers this already-registered verifier.

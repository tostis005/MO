name: Publish 30 bilingual chocolate articles to production
on:
  push:
    branches: [main]
    paths:
      - '.github/data/chocolates-isabel-30-bilingual-20261017.br.b64'
      - '.github/scripts/publish-chocolates-isabel-20261017.php'
      - '.github/scripts/audit-chocolates-isabel-20261017.php'
      - '.github/workflows/publish-chocolates-isabel-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-chocolates-isabel-20261017
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and decompress editorial package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends brotli jq sshpass >/dev/null
          php -l .github/scripts/publish-chocolates-isabel-20261017.php
          base64 -d .github/data/chocolates-isabel-30-bilingual-20261017.br.b64 | brotli -d -c > /tmp/emdo-chocolates-isabel-30.json
          echo '49a4b0a8bab9fda352b122c92313e5acd833658e730fc2783fcef01da3dfbfe7  /tmp/emdo-chocolates-isabel-30.json' | sha256sum --check
          jq -e '.release == "emdo-chocolates-isabel-20261017-30-bilingual" and .count == 30 and (.posts|length)==30 and ([.posts[].es.slug]|unique|length)==30 and ([.posts[].en.slug]|unique|length)==30' /tmp/emdo-chocolates-isabel-30.json >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          echo "EMDO_CHOCOLATE_30_PAIRS_PREFLIGHT=PASS"
      - name: Idempotent WordPress publication
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}";REST="${INFO#*|}";PHP="${REST%%|*}";WP="${REST#*|}"
          DIR="/tmp/emdo-choco-publish-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$DIR'"
          sshpass -e scp $SCP /tmp/emdo-chocolates-isabel-30.json "$STAGING_USER@$STAGING_HOST:$DIR/content.json"
          sshpass -e scp $SCP .github/scripts/publish-chocolates-isabel-20261017.php "$STAGING_USER@$STAGING_HOST:$DIR/publish.php"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf $DIR" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_CHOCOLATE_PAYLOAD='$DIR/content.json' EMDO_CHOCOLATE_DRY_RUN=1 '$PHP' -d memory_limit=768M '$WP' eval-file '$DIR/publish.php' --path='$PROD' --allow-root" | tee /tmp/emdo-choco-preflight.log
          grep -q '"dry_run":true' /tmp/emdo-choco-preflight.log
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_CHOCOLATE_PAYLOAD='$DIR/content.json' '$PHP' -d memory_limit=768M '$WP' eval-file '$DIR/publish.php' --path='$PROD' --allow-root" | tee /tmp/emdo-choco-published.log
          sed -n 's/^EMDO_CHOCOLATES //p' /tmp/emdo-choco-published.log | tail -n1 > /tmp/emdo-choco-result.json
          jq -e '.verified==true and .count==30 and .common_image_id>0 and .category_id>0 and (.posts|length)==30' /tmp/emdo-choco-result.json >/dev/null
          echo "EMDO_CHOCOLATE_30_BILINGUAL_PUBLISHED=PASS"
          sshpass -e scp $SCP .github/scripts/audit-chocolates-isabel-20261017.php "$STAGING_USER@$STAGING_HOST:$DIR/audit.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$DIR/audit.php' --path='$PROD' --allow-root" | tee /tmp/emdo-choco-audit.log
          sed -n 's/^EMDO_CHOCOLATE_AUDIT //p' /tmp/emdo-choco-audit.log | tail -n1 > /tmp/emdo-choco-audit.json
          jq -e '.verified==true and .article_pairs==30 and .common_image_id>0 and .available_product_sample_count>0' /tmp/emdo-choco-audit.json >/dev/null
          echo "EMDO_CHOCOLATE_30_IMAGE_AND_STOCK_AUDIT=PASS"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
      - name: Verify public Spanish and English pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,re,sys
          from urllib.parse import urlparse
          data=json.load(open('/tmp/emdo-choco-result.json'))
          # Sample first, middle, last from both language routes.
          indices=[0,5,14,22,29]
          for i in indices:
              post=data['posts'][i]
              for lang in ('es','en'):
                  url=post[lang]
                  response=subprocess.run(['curl','-LsS','--retry','3','--max-time','45','-A','EMDO-chocolate-public-qa','-w','\\n%{http_code}',url+'?choco_verify=20261017'],capture_output=True,text=True)
                  raw,status=response.stdout.rsplit('\\n',1) if '\\n' in response.stdout else ('',response.stdout)
                  if response.returncode or status!='200' or len(raw)<10000 or not re.search(r'<h1\\b',raw,re.I):
                      raise RuntimeError(f'Public URL failed: {url}, status={status}, bytes={len(raw)}')
                  if 'emdo-choco' not in raw:
                      raise RuntimeError(f'Dynamic module missing on page: {url}')
                  print('CHOCOLATE_PUBLIC_OK',lang,url)
          print('EMDO_CHOCOLATE_PUBLIC_QA=PASS')
          PY

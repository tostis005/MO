name: Home critical vs final geometry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-critical-cls-010256-production.yml'

permissions:
  contents: write

concurrency:
  group: home-critical-cls-production
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare critical-only and full geometry
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' | tee runtime/home-critical-vs-final-010282.txt
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const capture=async(blockDeferred)=>{
              const page=await browser.newPage({viewport:{width:1350,height:940}});
              if(blockDeferred){
                await page.route('**/*',route=>{
                  const u=route.request().url();
                  if(/home-deferred-.*\.css/i.test(u)) return route.abort();
                  return route.continue();
                });
              }
              await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
              const data=await page.evaluate(()=>{
                const q=(sel)=>{
                  const e=document.querySelector(sel);if(!e)return null;
                  const r=e.getBoundingClientRect(),c=getComputedStyle(e);
                  const keep=['display','position','height','minHeight','paddingTop','paddingBottom','marginTop','marginBottom','fontSize','lineHeight','transform','gridTemplateRows','gridTemplateColumns','gap','width'];
                  const style={};for(const k of keep)style[k]=c[k];
                  return {rect:{x:+r.x.toFixed(3),y:+r.y.toFixed(3),w:+r.width.toFixed(3),h:+r.height.toFixed(3)},style};
                };
                return {
                  deferred:[...document.querySelectorAll('link')].filter(x=>/home-deferred-.*\.css/i.test(x.href)).map(x=>({rel:x.rel,href:x.href})),
                  header:q('#masthead'),inner:q('.site-header-inner'),content:q('#content'),hero:q('.emo-hero'),grid:q('.emo-hero__grid'),copy:q('.emo-hero__copy'),h1:q('.emo-hero h1'),p:q('.emo-hero__copy>p'),proof:q('.emo-hero__proof'),visual:q('.emo-hero__visual--vendors'),card1:q('.emo-hero-card--1'),card2:q('.emo-hero-card--2'),card3:q('.emo-hero-card--3'),nav:q('#site-navigation')
                };
              });
              await page.close();return data;
            };
            const critical=await capture(true);
            const full=await capture(false);
            console.log(JSON.stringify({critical,full},null,2));
            console.log('\nDIFF');
            for(const key of Object.keys(full)){
              if(!full[key]||!critical[key]||key==='deferred')continue;
              const a=critical[key],b=full[key];
              const changes={};
              for(const k of Object.keys(b.style)) if(a.style[k]!==b.style[k]) changes[k]=[a.style[k],b.style[k]];
              const rectChanged=['x','y','w','h'].some(k=>Math.abs(a.rect[k]-b.rect[k])>.25);
              if(rectChanged||Object.keys(changes).length) console.log(key,JSON.stringify({critical:a.rect,full:b.rect,styles:changes}));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Record comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-critical-vs-final-010282.txt ] || printf 'compare=%s\n' '${{ steps.compare.outcome }}' > runtime/home-critical-vs-final-010282.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-critical-vs-final-010282.txt
          git commit -m 'Compare Home critical and final geometry' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

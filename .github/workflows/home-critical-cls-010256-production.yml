name: Restore proven Home CLS baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-critical-cls-010256-production.yml'

permissions:
  contents: write

concurrency:
  group: home-critical-cls-production
  cancel-in-progress: true

jobs:
  restore-deploy-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore files from the 0.006 CLS baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='db7a6b87a28b70dea64506fb342403da9d5b771c'
          CLS='elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php'
          CRIT='elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
          HEADER='elmercadodeorigen-child/mu-plugins/elmercado-home-header-cls-010279.php'
          git show "$BASE:$CLS" > "$CLS"
          git show "$BASE:$CRIT" > "$CRIT"
          rm -f "$HEADER"
          php -l "$CLS"
          grep -q "010256-2" "$CLS"
          ! grep -q 'elmercado-home-first-view-lock-010256' "$CLS"
          ! grep -q 'emo-vendor-first-frame-010285' "$CRIT"
          test ! -e "$HEADER"

      - name: Deploy baseline CLS files and purge Home caches
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          command -v sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_CLS="/tmp/home-cls-${GITHUB_RUN_ID}.php"
          REMOTE_CRIT="/tmp/home-critical-${GITHUB_RUN_ID}.css"
          timeout 45s sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php "$STAGING_USER@$STAGING_HOST:$REMOTE_CLS"
          timeout 45s sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/assets/css/critical-woostify-home.min.css "$STAGING_USER@$STAGING_HOST:$REMOTE_CRIT"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            install -m 0644 '$REMOTE_CLS' '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            install -m 0644 '$REMOTE_CRIT' '$PROD_PATH/wp-content/themes/elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
            rm -f '$PROD_PATH/wp-content/mu-plugins/elmercado-home-header-cls-010279.php'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f '$REMOTE_CLS' '$REMOTE_CRIT'
          "

      - name: Warm Home and run Lighthouse desktop three times
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          URL='https://www.elmercadodeorigen.com/'
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 "$URL" -o /dev/null; done
          curl -fsS --compressed --max-time 45 "$URL" -o /tmp/home.html
          grep -q 'elmercado-home-cls-010256' /tmp/home.html
          ! grep -q 'elmercado-home-first-view-lock-010256' /tmp/home.html
          ! grep -q 'emo-vendor-first-frame-010285' /tmp/home.html
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 "$URL" \
              --only-categories=performance \
              --form-factor=desktop \
              --screenEmulation.mobile=false \
              --screenEmulation.width=1350 \
              --screenEmulation.height=940 \
              --screenEmulation.deviceScaleFactor=1 \
              --throttling-method=simulate \
              --output=json \
              --output-path="/tmp/lhr-$i.json" \
              --quiet \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done
          python3 - <<'PY' | tee runtime/home-cls-restored-baseline-010286.txt
          import json,statistics
          rows=[]
          for i in range(1,4):
              r=json.load(open(f'/tmp/lhr-{i}.json'));a=r['audits']
              row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']}
              rows.append(row);print('run',i,row)
              for item in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]:
                  n=item.get('node') or {};print(' shift',item.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          print('median_score=',statistics.median(x['score'] for x in rows))
          print('median_fcp=',statistics.median(x['fcp'] for x in rows))
          print('median_lcp=',statistics.median(x['lcp'] for x in rows))
          print('median_tbt=',statistics.median(x['tbt'] for x in rows))
          print('median_cls=',statistics.median(x['cls'] for x in rows))
          PY

      - name: Persist restored source and measurement
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-cls-restored-baseline-010286.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-cls-restored-baseline-010286.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php elmercadodeorigen-child/assets/css/critical-woostify-home.min.css elmercadodeorigen-child/mu-plugins/elmercado-home-header-cls-010279.php runtime/home-cls-restored-baseline-010286.txt
          git commit -m 'Restore proven Home CLS baseline and measure' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

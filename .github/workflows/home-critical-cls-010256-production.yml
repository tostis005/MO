name: Home card CLS trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-critical-cls-010256-production.yml'

permissions:
  contents: write

concurrency:
  group: home-critical-cls-production
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture layout-shift source rectangles
        id: trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' | tee runtime/home-card-cls-trace-010284.txt
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1350,height:940}});
            await page.addInitScript(()=>{
              window.__emoShiftRows=[];
              const rect=r=>r?{x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2)}:null;
              try{
                new PerformanceObserver(list=>{
                  for(const e of list.getEntries()){
                    if(e.hadRecentInput)continue;
                    window.__emoShiftRows.push({
                      value:+e.value.toFixed(6),t:+e.startTime.toFixed(1),
                      sources:(e.sources||[]).map(s=>({
                        node:s.node?{tag:s.node.tagName,id:s.node.id||'',cls:typeof s.node.className==='string'?s.node.className:'',text:(s.node.textContent||'').trim().replace(/\s+/g,' ').slice(0,80)}:null,
                        old:rect(s.previousRect),now:rect(s.currentRect)
                      }))
                    });
                  }
                }).observe({type:'layout-shift',buffered:true});
              }catch(e){}
            });
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(2500);
            const result=await page.evaluate(()=>{
              const q=sel=>{const e=document.querySelector(sel);if(!e)return null;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {rect:{x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2)},style:{display:c.display,position:c.position,width:c.width,height:c.height,gridColumn:c.gridColumn,gridRow:c.gridRow,transform:c.transform,overflow:c.overflow,contain:c.contain}}};
              return {shifts:window.__emoShiftRows||[],final:{hero:q('.emo-hero'),grid:q('.emo-hero__grid'),visual:q('.emo-hero__visual--vendors'),card1:q('.emo-hero-card--1'),card2:q('.emo-hero-card--2'),card3:q('.emo-hero-card--3'),figure:q('.emo-hero-card--1 figure'),img:q('.emo-hero-card--1 img')}};
            });
            for(const row of result.shifts){
              console.log(`SHIFT value=${row.value} t=${row.t}`);
              for(const s of row.sources){console.log(' ',JSON.stringify(s));}
            }
            console.log('FINAL',JSON.stringify(result.final));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Record trace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-card-cls-trace-010284.txt ] || printf 'trace=%s\n' '${{ steps.trace.outcome }}' > runtime/home-card-cls-trace-010284.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-card-cls-trace-010284.txt
          git commit -m 'Trace Home producer-card layout shifts' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

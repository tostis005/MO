name: Final Jamones y Paletas migration to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-ham-catalog-final.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-ham-final
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_DOMAIN: elmercadodeorigen.com
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_PORT: ${{ secrets.STAGING_PORT }}
      SSH_USER: ${{ secrets.STAGING_USER }}
      SSH_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SEARCH_HINT: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build validated Dev map
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ham-map.b64 <<'MAP'
          
          MAP
          python - <<'PY'
          import base64,zlib,json
          raw=open('/tmp/ham-map.b64').read().strip(); data=zlib.decompress(base64.b64decode(raw)); obj=json.loads(data)
          assert obj['n']==145 and len(obj['i'])==145
          open('/tmp/ham-map.json','wb').write(data)
          print('Validated Dev products:',len(obj['i']),'with source URLs:',sum(bool(x.get('surl')) for x in obj['i']))
          PY

      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING_HOST}"; : "${SSH_USER:?Missing STAGING_USER}"; : "${SSH_PASSWORD:?Missing STAGING_PASSWORD}"; : "${SEARCH_HINT:?Missing STAGING_REMOTE_PATH}"
          PORT="${SSH_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts; test -s ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts

      - name: Resolve production WordPress
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$SEARCH_HINT' '$PROD_DOMAIN'" <<'REMOTE'
          set -eu
          hint="${1%/}"; target="$2"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"; fi; [ -x "$php" ]
          candidates="$(mktemp)"; matches="$(mktemp)"; trap 'rm -f "$candidates" "$matches"' EXIT
          for base in "$(dirname "$hint")" "$HOME" /var/www/vhosts /var/www /home /srv /opt /data /web /www; do [ -d "$base" ] || continue; find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true; done
          sort -u "$candidates" -o "$candidates"
          while IFS= read -r cfg; do [ -n "$cfg" ] || continue; p="$(dirname "$cfg")"; s="$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"; h="$("$php" -d memory_limit=256M "$wp" option get home --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"; ns="$(printf '%s' "$s"|sed -E 's#^https?://##;s#^www\.##;s#/*$##')"; nh="$(printf '%s' "$h"|sed -E 's#^https?://##;s#^www\.##;s#/*$##')"; if [ "$ns" = "$target" ] || [ "$nh" = "$target" ]; then echo "$p" >> "$matches"; fi; done < "$candidates"
          count="$(sort -u "$matches"|sed '/^$/d'|wc -l|tr -d ' ')"; [ "$count" = 1 ] || { echo "Expected one production WP, got $count" >&2; exit 2; }; p="$(sort -u "$matches"|head -n1)"; echo "__WP_PATH__=$p"; echo "__SITEURL__=$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root)"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"; WP_PATH="$(printf '%s\n' "$OUTPUT"|sed -n 's/^__WP_PATH__=//p'|tail -n1)"; : "${WP_PATH:?No production WordPress}"; echo "PROD_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Upload verification map
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"; REMOTE_MAP="/tmp/elmercado-ham-final-${GITHUB_SHA}.json"
          sshpass -e rsync -az -e "ssh $SSH_OPTIONS" /tmp/ham-map.json "$SSH_USER@$SSH_HOST:$REMOTE_MAP"; echo "REMOTE_HAM_MAP=$REMOTE_MAP" >> "$GITHUB_ENV"

      - name: Preflight 145 products and EMDO 1.0.4
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH' '$REMOTE_HAM_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1"; map="$2"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1 || true)"; fi
          script="$(mktemp --suffix=.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function emo_norm($v){$v=html_entity_decode((string)$v,ENT_QUOTES|ENT_HTML5,'UTF-8');$v=remove_accents(wp_strip_all_tags($v));return preg_replace('/[^a-z0-9]+/','',strtolower($v))?:'';}
          function emo_vendor($row){$want=emo_norm($row['vn']??'');$pref=(int)($row['v']??0);if($pref&&($u=get_user_by('id',$pref))&&str_contains(emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true)),$want))return $pref;foreach(get_users(['fields'=>['ID','user_login','display_name']]) as $u){if($want&&str_contains(emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true)),$want))return(int)$u->ID;}return 0;}
          function emo_resolve($row){global $wpdb;$st=$wpdb->prefix.'mdo_source_products';if(!empty($row['surl'])&&$wpdb->get_var($wpdb->prepare('SHOW TABLES LIKE %s',$st))===$st){$id=(int)$wpdb->get_var($wpdb->prepare("SELECT wc_product_id FROM {$st} WHERE source_url=%s AND wc_product_id>0 ORDER BY last_seen_at DESC LIMIT 1",(string)$row['surl']));if($id&&get_post_type($id)==='product'&&get_post_status($id)!=='trash')return$id;}$vendor=emo_vendor($row);if(!$vendor)return 0;if(!empty($row['sku'])){$ids=$wpdb->get_col($wpdb->prepare("SELECT p.ID FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key='_sku' WHERE p.post_type='product' AND p.post_status<>'trash' AND p.post_author=%d AND pm.meta_value=%s",$vendor,(string)$row['sku']));if(count($ids)===1)return(int)$ids[0];}$want=emo_norm($row['name']??'');$found=[];foreach(get_posts(['post_type'=>'product','post_status'=>['publish','private','draft','pending','future'],'posts_per_page'=>-1,'fields'=>'ids','author'=>$vendor]) as $id){if(emo_norm(get_the_title($id))===$want)$found[]=(int)$id;}return count($found)===1?$found[0]:0;}
          $map=json_decode(file_get_contents($args[0]),true);$resolved=[];$missing=[];$dupes=[];foreach(($map['i']??[]) as $row){$id=emo_resolve($row);if(!$id){$missing[]=$row['slug'];continue;}if(isset($resolved[$id]))$dupes[]=$id;else$resolved[$id]=$row['slug'];}
          $file=WP_PLUGIN_DIR.'/mdo-supplier-sync/mdo-supplier-sync.php';$version=is_file($file)?(get_file_data($file,['Version'=>'Version'])['Version']??''):'';$active=in_array('mdo-supplier-sync/mdo-supplier-sync.php',(array)get_option('active_plugins',[]),true);
          echo wp_json_encode(['siteurl'=>get_option('siteurl'),'resolved'=>count($resolved),'missing'=>$missing,'duplicates'=>$dupes,'emdo_active'=>$active,'emdo_version'=>$version],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;
          if(count($resolved)!==145||$missing||$dupes||!$active||$version!=='1.0.4')exit(3);
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" "$map" --path="$wp_path" --allow-root
          REMOTE

      - name: Run exact Dev classification pipeline
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1 || true)"; fi
          run(){ label="$1"; code="$2"; out="$("$php" -d memory_limit=1024M "$wp" eval "$code" --path="$wp_path" --allow-root)"; printf '%s: %s\n' "$label" "$out"; }
          run TAXONOMY 'echo wp_json_encode(MDO_Ham_Taxonomy::migrate_catalog(true),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run AUDIT 'echo wp_json_encode(MDO_Ham_Catalog_Audit::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run RESCUE 'echo wp_json_encode(MDO_Ham_Catalog_Rescue::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run FINAL 'echo wp_json_encode(MDO_Ham_Catalog_Final::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run PRECISION 'echo wp_json_encode(MDO_Ham_Catalog_Precision::apply_catalog(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);'
          run TAGS '$ids=wc_get_products(["limit"=>-1,"return"=>"ids","status"=>["publish","private","draft","pending"]]);$n=0;foreach(array_map("intval",$ids) as $id){$p=wc_get_product($id);if($p instanceof WC_Product&&!$p->is_type("variation")&&get_post_meta($id,"_emdo_ham_precision_version",true)){MDO_Ham_Catalog_Tag_Closure::sync_saved_product($p);$n++;}}echo wp_json_encode(["status"=>"completed","synced"=>$n]);'
          "$php" -d memory_limit=512M "$wp" cache flush --path="$wp_path" --allow-root || true
          REMOTE

      - name: Verify 145 products exactly against Dev
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH' '$REMOTE_HAM_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1"; map="$2"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1 || true)"; fi
          script="$(mktemp --suffix=.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function emo_norm($v){$v=html_entity_decode((string)$v,ENT_QUOTES|ENT_HTML5,'UTF-8');$v=remove_accents(wp_strip_all_tags($v));return preg_replace('/[^a-z0-9]+/','',strtolower($v))?:'';}function emo_vendor($row){$want=emo_norm($row['vn']??'');$pref=(int)($row['v']??0);if($pref&&($u=get_user_by('id',$pref))&&str_contains(emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true)),$want))return$pref;foreach(get_users(['fields'=>['ID','user_login','display_name']]) as $u){if($want&&str_contains(emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true)),$want))return(int)$u->ID;}return 0;}function emo_resolve($row){global$wpdb;$st=$wpdb->prefix.'mdo_source_products';if(!empty($row['surl'])&&$wpdb->get_var($wpdb->prepare('SHOW TABLES LIKE %s',$st))===$st){$id=(int)$wpdb->get_var($wpdb->prepare("SELECT wc_product_id FROM {$st} WHERE source_url=%s AND wc_product_id>0 ORDER BY last_seen_at DESC LIMIT 1",(string)$row['surl']));if($id&&get_post_type($id)==='product'&&get_post_status($id)!=='trash')return$id;}$vendor=emo_vendor($row);if(!$vendor)return 0;if(!empty($row['sku'])){$ids=$wpdb->get_col($wpdb->prepare("SELECT p.ID FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key='_sku' WHERE p.post_type='product' AND p.post_status<>'trash' AND p.post_author=%d AND pm.meta_value=%s",$vendor,(string)$row['sku']));if(count($ids)===1)return(int)$ids[0];}$want=emo_norm($row['name']??'');$found=[];foreach(get_posts(['post_type'=>'product','post_status'=>['publish','private','draft','pending','future'],'posts_per_page'=>-1,'fields'=>'ids','author'=>$vendor]) as$id){if(emo_norm(get_the_title($id))===$want)$found[]=(int)$id;}return count($found)===1?$found[0]:0;}
          $map=json_decode(file_get_contents($args[0]),true);$cat=get_term_by('slug','jamones-paletas','product_cat');$default=(int)get_option('default_product_cat',0);$errors=[];$checked=0;$coverage=[];$quality=[];$race=[];$feed=[];
          foreach(($map['i']??[]) as$row){$id=emo_resolve($row);if(!$id){$errors[]=['slug'=>$row['slug'],'error'=>'not_found'];continue;}if(!$cat||!has_term((int)$cat->term_id,'product_cat',$id))$errors[]=['id'=>$id,'error'=>'category'];if($default&&has_term($default,'product_cat',$id))$errors[]=['id'=>$id,'error'=>'uncategorized'];foreach((array)$row['a'] as$tax=>$expected){$actual=wp_get_post_terms($id,$tax,['fields'=>'names']);if(is_wp_error($actual)){$errors[]=['id'=>$id,'error'=>$tax];continue;}$coverage[$tax]=($coverage[$tax]??0)+(empty($actual)?0:1);sort($actual,SORT_NATURAL|SORT_FLAG_CASE);$expected=array_values(array_map('strval',(array)$expected));sort($expected,SORT_NATURAL|SORT_FLAG_CASE);if($actual!==$expected)$errors[]=['id'=>$id,'error'=>$tax,'expected'=>$expected,'actual'=>$actual];if($tax==='pa_calidad')foreach($actual as$x)$quality[$x]=($quality[$x]??0)+1;if($tax==='pa_raza-iberica')foreach($actual as$x)$race[$x]=($race[$x]??0)+1;if($tax==='pa_alimentacion')foreach($actual as$x)$feed[$x]=($feed[$x]??0)+1;}$at=wp_get_post_terms($id,'product_tag',['fields'=>'names']);$et=array_values(array_map('strval',(array)$row['t']));sort($at,SORT_NATURAL|SORT_FLAG_CASE);sort($et,SORT_NATURAL|SORT_FLAG_CASE);if($at!==$et)$errors[]=['id'=>$id,'error'=>'product_tag','expected'=>$et,'actual'=>$at];$checked++;}
          ksort($coverage);ksort($quality);ksort($race);ksort($feed);echo wp_json_encode(['status'=>$errors?'failed':'completed','siteurl'=>get_option('siteurl'),'checked'=>$checked,'errors_count'=>count($errors),'coverage'=>$coverage,'quality'=>$quality,'race'=>$race,'feeding'=>$feed,'errors'=>array_slice($errors,0,30)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if($checked!==145||$errors)exit(5);
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" "$map" --path="$wp_path" --allow-root
          REMOTE

      - name: Remove temporary map
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          if [ -n "${REMOTE_HAM_MAP:-}" ]; then PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"; sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "rm -f -- '$REMOTE_HAM_MAP'"; fi

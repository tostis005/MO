name: Deploy SEO cleanup layer 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/emdo-seo-cleanup-layer.php'
      - '.github/workflows/deploy-seo-cleanup-layer-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-seo-cleanup-layer
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint cleanup layer
        run: php -l mu-plugins/emdo-seo-cleanup-layer.php

      - name: Install SSH helper
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Deploy cleanup layer
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/emdo-seo-cleanup-${GITHUB_RUN_ID}.php"
          DEST="$PROD_PATH/wp-content/mu-plugins/emdo-seo-cleanup-layer.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/emdo-seo-cleanup-layer.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$DEST' ]; then cp -a '$DEST' '$DEST.bak-'\$(date +%Y%m%d%H%M%S); fi; cp '$REMOTE' '$DEST'; rm -f '$REMOTE'; \"\$php_bin\" -l '$DEST'; \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify redirects, robots and sitemap policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/reports
          python3 - <<'PY' | tee .github/reports/seo-cleanup-layer-production-20260821.txt
          import re, ssl, time, urllib.error, urllib.request
          from urllib.parse import urlparse

          base='https://www.elmercadodeorigen.com'
          ctx=ssl.create_default_context()
          stamp=str(time.time_ns())
          failures=[]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          no_redirect=urllib.request.build_opener(NoRedirect)

          def fetch(path, follow=True):
              sep='&' if '?' in path else '?'
              req=urllib.request.Request(base+path+sep+'emdo_cleanup_verify='+stamp, headers={'User-Agent':'EMDO-SEO-Cleanup-Verify/2026-08-21'})
              opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx)) if follow else no_redirect
              try:
                  with opener.open(req, timeout=50) as r:
                      return r.status, r.headers, r.geturl(), r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.geturl(), e.read().decode('utf-8','replace')

          redirects={
              '/el-mercado-de-origen/':'/quienes-somos/',
              '/condiciones-especiales/':'/envios/',
          }
          for src,dst in redirects.items():
              status,headers,final,body=fetch(src, follow=False)
              loc=headers.get('Location','')
              print(f'REDIRECT|{src}|HTTP={status}|LOCATION={loc}')
              if status not in (301,308): failures.append(f'{src} expected 301, got {status}')
              if urlparse(loc).path.rstrip('/') != dst.rstrip('/'): failures.append(f'{src} bad location {loc}')

          status,headers,final,pages=fetch('/mdo-sitemap-pages.xml')
          print(f'PAGES_SITEMAP|HTTP={status}|BYTES={len(pages)}|LOCS={pages.count("<loc>")}')
          if status!=200 or '<urlset' not in pages: failures.append('page sitemap unavailable')
          forbidden=['/carrito/','/finalizar-compra/','/mi-cuenta/','/store-manager/','/affiliates/','/el-mercado-de-origen/','/condiciones-especiales/']
          for path in forbidden:
              present=path in pages
              print(f'PAGES_FORBID|{path}|PRESENT={present}')
              if present: failures.append('page sitemap contains '+path)
          for path in ['/quienes-somos/','/envios/','/tienda/']:
              present=path in pages
              print(f'PAGES_REQUIRE|{path}|PRESENT={present}')
              if not present: failures.append('page sitemap missing '+path)

          for path in ['/store-manager/','/affiliates/']:
              status,headers,final,body=fetch(path)
              head=body.split('</head>',1)[0]
              robots=' '.join(re.findall(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']*)',head,re.I))
              xrobots=headers.get('X-Robots-Tag','')
              print(f'FUNCTIONAL|{path}|HTTP={status}|FINAL={final}|ROBOTS={robots}|XROBOTS={xrobots}')
              if status==200 and 'noindex' not in (robots+' '+xrobots).lower(): failures.append(path+' lacks noindex')

          status,headers,final,products=fetch('/mdo-sitemap-products.xml')
          print(f'PRODUCT_SITEMAP|HTTP={status}|BYTES={len(products)}|LOCS={products.count("<loc>")}')
          if status!=200 or '<urlset' not in products: failures.append('product sitemap unavailable')
          required_products=[
              '/producto/carne-picada-extra/',
              '/producto/cana-de-lomo-de-bellota-100-iberico-en-sobres/',
              '/producto/cana-de-lomo-de-bellota-100-iberico/',
              '/producto/surtido-de-bellota-100-iberico/',
              '/producto/pack-de-cata-de-bellota-100-iberico-2x-jamon-2x-paleta-2x-lomo-2x-salchichon-2x-chorizo/',
          ]
          for path in required_products:
              present=path in products
              print(f'PRODUCT_REQUIRE|{path}|PRESENT={present}')
              if not present: failures.append('published non-hidden product missing from sitemap: '+path)

          store_results={}
          for path in ['/tienda/puente-robles/','/tienda/el-catedratico/','/tienda/1957/']:
              status,headers,final,body=fetch(path)
              store_results[path]=status
              print(f'STORE|{path}|HTTP={status}|FINAL={final}')
          if store_results['/tienda/1957/'] != 200: failures.append('active 1957 store not public')
          if store_results['/tienda/puente-robles/'] == 200: failures.append('disabled Puente Robles unexpectedly public')
          if store_results['/tienda/el-catedratico/'] == 200: failures.append('disabled El Catedratico unexpectedly public')

          if failures:
              print('FAILURES:')
              for f in failures: print('- '+f)
              raise SystemExit(1)
          print('SEO_CLEANUP_LAYER_VERIFY=PASS')
          PY

      - name: Save verification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT=.github/reports/seo-cleanup-layer-production-20260821.txt
          [ -f "$REPORT" ] || echo "Verification report missing" > "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SEO cleanup production verification [skip ci]"
          git pull --rebase origin main
          git push

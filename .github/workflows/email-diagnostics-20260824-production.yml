name: Email diagnostics 2026-08-24 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-diagnostics-20260824-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Inspect Plesk mail authentication
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass dnsutils >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          mkdir -p .deploy-status
          OUT=.deploy-status/email-plesk-diagnostics-20260824.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "=== PUBLIC DNS ==="
            echo "NS:"; dig +short NS elmercadodeorigen.com
            echo "MX:"; dig +short MX elmercadodeorigen.com
            echo "A:"; dig +short A elmercadodeorigen.com
            echo "MAIL A:"; dig +short A mail.elmercadodeorigen.com
            echo "TXT/SPF:"; dig +short TXT elmercadodeorigen.com
            echo "DMARC:"; dig +short TXT _dmarc.elmercadodeorigen.com
            echo "DKIM default:"; dig +short TXT default._domainkey.elmercadodeorigen.com
            echo "=== SERVER ==="
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'echo "identity:"; id; echo "hostname:"; hostname -f; echo "plesk:"; command -v plesk || true; echo "mailserver options:"; plesk bin mailserver --info options 2>&1 || true; echo "mailserver spf:"; plesk bin mailserver --info spf 2>&1 || true; echo "domain_pref info:"; plesk bin domain_pref --info elmercadodeorigen.com 2>&1 || true; echo "domain_pref help dkim lines:"; plesk bin domain_pref --help 2>&1 | grep -Ei "sign_outgoing|domain.?keys|dkim" || true; echo "dns zone relevant:"; plesk bin dns --info elmercadodeorigen.com 2>&1 | grep -Ei "domainkey|spf|dmarc|mail\.elmercadodeorigen\.com|MX" || true; echo "postfix identity:"; postconf -h myhostname 2>/dev/null || true; postconf -h myorigin 2>/dev/null || true; postconf -h smtp_helo_name 2>/dev/null || true'
          } > "$OUT" 2>&1
          cat "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Record Plesk email authentication diagnostics' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

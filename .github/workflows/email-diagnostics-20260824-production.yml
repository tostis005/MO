name: Email diagnostics 2026-08-24 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-diagnostics-20260824-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Inspect production mail configuration and delivery trail
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass dnsutils >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "=== DNS ==="
            echo "MX:"; dig +short MX elmercadodeorigen.com || true
            echo "TXT:"; dig +short TXT elmercadodeorigen.com || true
            echo "DMARC:"; dig +short TXT _dmarc.elmercadodeorigen.com || true
            echo "A:"; dig +short A elmercadodeorigen.com || true
            ip=$(dig +short A elmercadodeorigen.com | head -n1 || true)
            [ -z "$ip" ] || { echo "PTR($ip):"; dig +short -x "$ip" || true; }
            echo "=== WORDPRESS ==="
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); echo 'active mail-related plugins:'; \"\$php_bin\" \"\$wp_bin\" plugin list --status=active --field=name --path='$PROD_PATH' --allow-root 2>/dev/null | grep -Ei 'smtp|mail|email|send|post|ses|brevo|sendinblue|mailgun|postmark|spark|wpforms|fluent|newsletter' || true; echo 'all active plugins:'; \"\$php_bin\" \"\$wp_bin\" plugin list --status=active --field=name --path='$PROD_PATH' --allow-root 2>/dev/null | sort || true; echo 'filtered wp_mail from:'; \"\$php_bin\" \"\$wp_bin\" eval 'echo apply_filters(\"wp_mail_from\", \"wordpress@\" . wp_parse_url(network_home_url(), PHP_URL_HOST));' --path='$PROD_PATH' --allow-root 2>/dev/null || true; echo; echo 'filtered wp_mail from name:'; \"\$php_bin\" \"\$wp_bin\" eval 'echo apply_filters(\"wp_mail_from_name\", \"WordPress\");' --path='$PROD_PATH' --allow-root 2>/dev/null || true; echo; echo 'php sendmail_path:'; \"\$php_bin\" -r 'echo ini_get(\"sendmail_path\"), PHP_EOL;' || true; echo 'mail binaries:'; command -v sendmail || true; command -v postfix || true; command -v exim || true; command -v msmtp || true; echo 'queue:'; (mailq 2>/dev/null || postqueue -p 2>/dev/null || exim -bp 2>/dev/null || true) | grep -Ei 'jose\.fraga@gmail\.com|elmercadodeorigen\.com|Mail queue is empty|empty' | tail -n 80; echo 'delivery log matches:'; for f in /var/log/maillog /var/log/mail.log /var/log/plesk/maillog; do if [ -r \"\$f\" ]; then echo \"LOG=\$f\"; grep -Fi 'jose.fraga@gmail.com' \"\$f\" | tail -n 40; fi; done"
          } > /tmp/email-diagnostics.txt

          mkdir -p .deploy-status
          cp /tmp/email-diagnostics.txt .deploy-status/email-diagnostics-20260824.txt
          cat .deploy-status/email-diagnostics-20260824.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/email-diagnostics-20260824.txt
          git commit -m 'Record email delivery diagnostics' || true
          git push origin HEAD:main

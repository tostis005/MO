name: Email diagnostics 2026-08-24 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-diagnostics-20260824-production.yml'
      - '.github/scripts/send-test-email-authenticated-20260824.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Send authenticated test and inspect delivery
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs"
          REMOTE_SCRIPT="/tmp/emdo-auth-mail-${GITHUB_RUN_ID}.php"
          START_MARK="$(date -u '+%b %e %H:%M')"
          sshpass -e scp $SCP_OPTIONS .github/scripts/send-test-email-authenticated-20260824.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          SEND_OUT=$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc" 2>&1)
          sleep 3
          LOG_OUT=$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "grep -Fi 'jose.fraga@gmail.com' /var/log/maillog 2>/dev/null | tail -n 20" 2>&1)
          mkdir -p .deploy-status
          OUT=.deploy-status/email-authenticated-test-20260824.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sender=hola@elmercadodeorigen.com"
            echo "recipient=jose.fraga@gmail.com"
            echo "=== wp_mail ==="
            echo "$SEND_OUT"
            echo "=== postfix/gmail ==="
            echo "$LOG_OUT"
          } > "$OUT"
          cat "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Record authenticated email delivery test' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

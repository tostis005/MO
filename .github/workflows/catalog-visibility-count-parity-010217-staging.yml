name: Catalog visibility count parity 0.10.217 staging
# Probe revision 3: compare layered-nav counts with independent catalog SQL.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-visibility-count-parity-010217-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_URL: https://dev.elmercadodeorigen.com
      EXPECTED_VERSION: 0.10.217

    steps:
      - uses: actions/checkout@v4

      - name: Validate release and probes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ELMERCADO_THEME_VERSION', '$EXPECTED_VERSION'" elmercadodeorigen-child/functions.php
          grep -Eq '^Version:[[:space:]]*0\.10\.217$' elmercadodeorigen-child/style.css
          grep -q 'catalog-visibility-counts-010217.php' elmercadodeorigen-child/functions.php
          php -l elmercadodeorigen-child/inc/catalog-visibility-counts-010217.php >/dev/null
          php -l .github/scripts/home-category-parity-data-010215.php >/dev/null
          php -l .github/scripts/catalog-attribute-count-data-010217.php >/dev/null
          php -l .github/scripts/elmercado-opcache-reset.php >/dev/null
          node --check .github/scripts/home-category-parity-010213-browser.cjs
          node --check .github/scripts/catalog-visibility-count-parity-010217-browser.cjs
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install browser and SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Resolve staging and collect public/admin expectations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\""
          )"
          : "${WP_PATH:?}"
          echo "STAGING_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

          ok=0
          for attempt in {1..30}; do
            VERSION="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "grep -o \"ELMERCADO_THEME_VERSION', '[^']*\" '$WP_PATH/wp-content/themes/elmercadodeorigen-child/functions.php' | head -n1 | sed \"s/.*'//\"" || true)"
            if [ "$VERSION" = "$EXPECTED_VERSION" ]; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "Staging version $VERSION != $EXPECTED_VERSION" >&2; exit 2; }

          REMOTE_HOME="/tmp/home-category-parity-data-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/home-category-parity-data-010215.php "$STAGING_USER@$STAGING_HOST:$REMOTE_HOME"
          HOME_OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_HOME' --path='$WP_PATH' --allow-root; rm -f '$REMOTE_HOME'" )"
          ROWS_B64="$(printf '%s\n' "$HOME_OUT" | sed -n 's/^__ROWS__=//p' | tail -n1)"
          NAME_B64="$(printf '%s\n' "$HOME_OUT" | sed -n 's/^__COOKIE_NAME__=//p' | tail -n1)"
          VALUE_B64="$(printf '%s\n' "$HOME_OUT" | sed -n 's/^__COOKIE_VALUE__=//p' | tail -n1)"
          : "${ROWS_B64:?}"; : "${NAME_B64:?}"; : "${VALUE_B64:?}"
          ROWS="$(printf '%s' "$ROWS_B64" | base64 -d)"
          COOKIE_NAME="$(printf '%s' "$NAME_B64" | base64 -d)"
          COOKIE_VALUE="$(printf '%s' "$VALUE_B64" | base64 -d)"
          echo "::add-mask::$COOKIE_VALUE"
          echo "CATEGORY_PARITY_JSON=$ROWS" >> "$GITHUB_ENV"
          echo "ADMIN_COOKIE_NAME=$COOKIE_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_COOKIE_VALUE=$COOKIE_VALUE" >> "$GITHUB_ENV"

          REMOTE_ATTR="/tmp/catalog-attribute-count-data-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/catalog-attribute-count-data-010217.php "$STAGING_USER@$STAGING_HOST:$REMOTE_ATTR"
          ATTR_OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_ATTR' --path='$WP_PATH' --allow-root; rm -f '$REMOTE_ATTR'" )"
          ATTR_B64="$(printf '%s\n' "$ATTR_OUT" | sed -n 's/^__ATTRIBUTE_ROWS__=//p' | tail -n1)"
          : "${ATTR_B64:?}"
          ATTR_JSON="$(printf '%s' "$ATTR_B64" | base64 -d)"
          echo "ATTRIBUTE_PARITY_JSON=$ATTR_JSON" >> "$GITHUB_ENV"
          echo 'CATALOG_VISIBILITY_010217_DATA_OK'

      - name: Reset staging PHP-FPM OPcache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROBE="elmercado-opcache-counts-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$STAGING_WP_PATH/$PROBE"
          BODY="$(curl -fsSL --max-time 30 "$STAGING_URL/$PROBE")"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$STAGING_WP_PATH/$PROBE'"
          printf '%s\n' "$BODY" | grep -q '^OPCACHE_RESET_OK$'

      - name: Verify anonymous and administrator Home in Chrome
        shell: bash
        run: node .github/scripts/home-category-parity-010213-browser.cjs

      - name: Verify public/admin catalog filter counts in Chrome
        shell: bash
        run: node .github/scripts/catalog-visibility-count-parity-010217-browser.cjs

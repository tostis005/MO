name: Catalogue CSS-only safety v3 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-css-only-safety-v3-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only layer
        shell: bash
        run: |
          set -euo pipefail
          f='mu-plugins/zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'
          php -l "$f" >/dev/null
          ! grep -Eq '<script|new[[:space:]]+MutationObserver|new[[:space:]]+ResizeObserver|requestAnimationFrame[[:space:]]*\(|setInterval[[:space:]]*\(' "$f"

      - name: Deploy candidate
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          NAME='zzzzzzzzzzzzzzzzzzzz-mdo-catalog-css-only-safety-20260828.php'
          TARGET="$PROD/wp-content/mu-plugins/$NAME"
          BACKUP="/tmp/$NAME.$GITHUB_RUN_ID.backup"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$TARGET'"; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$TARGET' '$BACKUP'"
            echo 'EXISTED=1' >> "$GITHUB_ENV"
          else
            echo 'EXISTED=0' >> "$GITHUB_ENV"
          fi
          REMOTE="/tmp/$NAME.$GITHUB_RUN_ID"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; install -m0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists("wp_cache_flush") ) { wp_cache_flush(); } if ( has_action("litespeed_purge_all") ) { do_action("litespeed_purge_all"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify CSS-only mobile contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, time, sys

          urls = {
              'global': 'https://www.elmercadodeorigen.com/tienda/?css_only_v3=1',
              'producer': 'https://www.elmercadodeorigen.com/tienda/1957/?css_only_v3=1',
          }
          widths = [335, 360, 390, 640, 767]
          errors, report = [], {}

          js = '''() => {
            const t=document.querySelector('.emo-catalog-toolbar-shared-010229');
            const f=t?.querySelector('.woocommerce-ordering');
            const s=f?.querySelector('select[name="orderby"]');
            const d=t?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]');
            const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}};
            return {
              ready:!!(t&&f&&s&&d), toolbar:box(t), form:box(f), select:box(s), dest:box(d),
              safety:!!document.getElementById('mdo-catalog-css-only-safety-20260828'),
              old:[
                !!document.getElementById('mdo-catalog-control-widths-20260828'),
                !!document.getElementById('mdo-catalog-mobile-runtime-guard-20260824'),
                !!document.getElementById('mdo-catalog-top-controls-parity-final-20260824-js'),
                !!document.getElementById('mdo-catalog-top-controls-arrow-final-20260824-js'),
                !!document.getElementById('elmercado-catalog-mobile-controls-parity-script-010236')
              ],
              overflow:document.documentElement.scrollWidth-innerWidth,
              pointer:s?getComputedStyle(s).pointerEvents:null,
              disabled:s?.disabled ?? true
            };
          }'''

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for width in widths:
                  report[str(width)] = {}
                  for kind, url in urls.items():
                      page = browser.new_page(viewport={'width': width, 'height': 820})
                      page.route('**/*', lambda r: r.abort() if r.request.resource_type in ('image','font','media') else r.continue_())
                      page.goto(url, wait_until='commit', timeout=30000)
                      data = None
                      for _ in range(40):
                          time.sleep(.3)
                          try:
                              candidate = page.evaluate(js)
                              if candidate['ready']:
                                  time.sleep(.6)
                                  data = page.evaluate(js)
                                  break
                          except Exception:
                              pass
                      report[str(width)][kind] = data
                      if not data:
                          errors.append(f'{kind} {width}: controls unavailable')
                          page.close(); continue
                      if not data['safety']:
                          errors.append(f'{kind} {width}: safety CSS missing')
                      if any(data['old']):
                          errors.append(f'{kind} {width}: retired runtime still present {data["old"]}')
                      if data['overflow'] > 1:
                          errors.append(f'{kind} {width}: overflow {data["overflow"]}')
                      if abs(data['form']['w'] - data['select']['w']) > 2:
                          errors.append(f'{kind} {width}: form/select mismatch')
                      if abs(data['dest']['w'] - data['select']['w']) > 3:
                          errors.append(f'{kind} {width}: dest/order mismatch {data["dest"]["w"]}/{data["select"]["w"]}')
                      if width == 335 and data['select']['w'] < 260:
                          errors.append(f'{kind} 335: order too narrow {data["select"]["w"]}')
                      if data['toolbar']['h'] < 125:
                          errors.append(f'{kind} {width}: toolbar not stacked h={data["toolbar"]["h"]}')
                      if data['pointer'] == 'none' or data['disabled']:
                          errors.append(f'{kind} {width}: select blocked')
                      try:
                          t0=time.time()
                          page.locator('.emo-catalog-toolbar-shared-010229 select[name="orderby"]').focus(timeout=1500)
                          elapsed=time.time()-t0
                          if elapsed > .75:
                              errors.append(f'{kind} {width}: focus sluggish {elapsed:.3f}s')
                          if not page.evaluate('document.activeElement?.matches("select[name=orderby]") || false'):
                              errors.append(f'{kind} {width}: focus failed')
                      except Exception as exc:
                          errors.append(f'{kind} {width}: focus exception {type(exc).__name__}')
                      page.close()
              browser.close()

          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              print('ERRORS:')
              print('\n'.join('- '+e for e in errors))
              sys.exit(1)
          print('CATALOG_CSS_ONLY_SAFETY_V3_VERIFIED=true')
          PY

      - name: Roll back on failure
        if: failure() && env.TARGET != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "${EXISTED:-0}" = 1 ]; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 '$BACKUP' '$TARGET'; rm -f '$BACKUP'"
          else
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TARGET'"
          fi

      - name: Remove backup
        if: success() && env.EXISTED == '1'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

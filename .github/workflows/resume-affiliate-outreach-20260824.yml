name: Resume approved affiliate outreach 2026-08-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-affiliate-outreach-20260824.yml'

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resume only unsent approved contacts
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          HISTORICAL_COMMIT='97c09b44c75776ad24794c26adba70fb6e60d681'
          git show "$HISTORICAL_COMMIT:.github/scripts/send-affiliate-outreach-20260824.php" > /tmp/historical-affiliate.php
          CONTACTS_B64="$(python3 - <<'PY'
          import re
          s=open('/tmp/historical-affiliate.php', encoding='utf-8').read()
          m=re.search(r"\$payload = '([^']+)';", s)
          if not m:
              raise SystemExit('historical payload not found')
          print(m.group(1))
          PY
          )"
          COUNT="$(CONTACTS_B64="$CONTACTS_B64" python3 - <<'PY'
          import os,base64,json
          contacts=json.loads(base64.b64decode(os.environ['CONTACTS_B64']).decode('utf-8'))
          print(len(contacts))
          PY
          )"
          [ "$COUNT" = '37' ]

          cat > /tmp/emdo-resume-affiliate.php <<'PHP'
          <?php
          if (!defined('ABSPATH')) {
              fwrite(STDERR, "WordPress context required\n");
              exit(2);
          }
          $contactsRaw = getenv('EMDO_CONTACTS_B64');
          $contacts = json_decode(base64_decode($contactsRaw ?: '', true) ?: '', true);
          if (!is_array($contacts) || count($contacts) !== 37) {
              fwrite(STDERR, "Invalid campaign payload\n");
              exit(3);
          }
          $skipRaw = trim((string) getenv('EMDO_SKIP_INDEXES'));
          $skip = [];
          if ($skipRaw !== '') {
              foreach (explode(',', $skipRaw) as $v) {
                  $n = (int) trim($v);
                  if ($n >= 1 && $n <= 37) { $skip[$n] = true; }
              }
          }
          $from = 'hola@elmercadodeorigen.com';
          $fromName = 'El Mercado de Origen';
          add_filter('wp_mail_from', static fn() => $from);
          add_filter('wp_mail_from_name', static fn() => $fromName);
          add_action('phpmailer_init', static function ($phpmailer) use ($from, $fromName) {
              $phpmailer->Sender = $from;
              $phpmailer->setFrom($from, $fromName, false);
          });
          $subject = 'Propuesta de colaboración — El Mercado de Origen';
          $accepted = [];
          $failed = [];
          foreach ($contacts as $i => $contact) {
              $index = $i + 1;
              if (isset($skip[$index])) { continue; }
              [$name, $to] = $contact;
              if (!is_email($to)) { $failed[] = $index; continue; }
              $greeting = $name !== '' ? "¡Hola, {$name}! 👋" : "¡Hola! 👋";
              $message = $greeting . "\n\n"
                  . "Te escribo desde El Mercado de Origen. Hemos estado viendo tu perfil y creemos que puede haber bastante encaje entre el tipo de contenido que compartes, tu comunidad y los productos con los que trabajamos, así que queríamos proponerte una posible colaboración.\n\n"
                  . "Llevamos activos desde 2020 y durante estos años hemos estado especialmente centrados en AOVE y productos ibéricos. Ahora estamos dando un nuevo impulso a El Mercado de Origen y en los próximos días vamos a incorporar nuevos productores, ampliando progresivamente la selección disponible en la web.\n\n"
                  . "La idea del proyecto es reunir productores seleccionados y acercar sus productos directamente al consumidor, haciendo visible quién está detrás de cada producto y su origen.\n\n"
                  . "Tenemos ya bastante recorrido y reputación detrás: actualmente contamos con 4,9/5 en Google con más de 300 reseñas y 4,6/5 en Trustpilot con 169 opiniones.\n\n"
                  . "En paralelo estamos preparando un sistema de afiliación para creadores y perfiles gastronómicos. La propuesta es sencilla: 5 % del importe de cada venta que llegue a través de ti + 0,50 € adicionales por cada pedido, mediante enlaces personalizados y, cuando tenga sentido, también códigos o cupones de descuento.\n\n"
                  . "No habría exclusividad ni obligación de publicar un número determinado de veces. La idea es facilitarte las herramientas para que puedas compartirlo con tu comunidad de la forma que mejor encaje contigo y recibir una comisión por las ventas que generes.\n\n"
                  . "Nos gustaría saber qué te parece la propuesta y si te interesaría explorar una colaboración de este tipo. Si tienes cualquier duda sobre el funcionamiento, las comisiones o cualquier otro detalle, solo tienes que decírnoslo 😊\n\n"
                  . "https://www.elmercadodeorigen.com/\n\n"
                  . "Muchas gracias, El Mercado de Origen";
              $headers = [
                  'Content-Type: text/plain; charset=UTF-8',
                  'Reply-To: El Mercado de Origen <hola@elmercadodeorigen.com>',
              ];
              $failure = null;
              $failureHook = static function ($error) use (&$failure) {
                  $failure = $error instanceof WP_Error ? $error->get_error_message() : 'Unknown wp_mail error';
              };
              add_action('wp_mail_failed', $failureHook);
              $sent = wp_mail($to, $subject, $message, $headers);
              remove_action('wp_mail_failed', $failureHook);
              if ($sent && !$failure) { $accepted[] = $index; } else { $failed[] = $index; }
              if ($index < count($contacts)) { sleep(6); }
          }
          echo 'ATTEMPTED_ACCEPTED_INDEXES=' . implode(',', $accepted) . PHP_EOL;
          echo 'ATTEMPTED_FAILED_INDEXES=' . implode(',', $failed) . PHP_EOL;
          exit(count($failed) === 0 ? 0 : 1);
          PHP

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          audit_remote() {
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "EMDO_CONTACTS_B64='$CONTACTS_B64' python3 - <<'PY'
          import os,base64,json,re
          from datetime import datetime,timedelta
          from pathlib import Path
          contacts=json.loads(base64.b64decode(os.environ['EMDO_CONTACTS_B64']).decode('utf-8'))
          targets={email.lower(): i+1 for i,(_,email) in enumerate(contacts)}
          p=Path('/var/log/maillog')
          lines=[]
          if p.exists():
              now=datetime.now()
              cut=now-timedelta(hours=2)
              for line in p.open(errors='ignore'):
                  try:
                      ts=datetime.strptime(f'{now.year} '+line[:15], '%Y %b %d %H:%M:%S')
                  except Exception:
                      continue
                  if ts >= cut:
                      lines.append(line)
          qids=set()
          for line in lines:
              if 'from=<hola@elmercadodeorigen.com>' not in line.lower():
                  continue
              m=re.search(r': ([A-Za-z0-9]+): from=<', line)
              if m: qids.add(m.group(1))
          sent=set(); bounced=set(); deferred=set(); seen=set()
          for line in lines:
              m=re.search(r': ([A-Za-z0-9]+):', line)
              if not m or m.group(1) not in qids:
                  continue
              tm=re.search(r'to=<([^>]+)>', line, re.I)
              if not tm:
                  continue
              idx=targets.get(tm.group(1).lower())
              if not idx:
                  continue
              seen.add(idx)
              low=line.lower()
              if 'status=sent' in low: sent.add(idx)
              elif 'status=bounced' in low: bounced.add(idx)
              elif 'status=deferred' in low: deferred.add(idx)
          bounced -= sent
          deferred -= sent | bounced
          print('sent_indexes=' + ','.join(map(str,sorted(sent))))
          print('bounced_indexes=' + ','.join(map(str,sorted(bounced))))
          print('deferred_indexes=' + ','.join(map(str,sorted(deferred))))
          print('seen_indexes=' + ','.join(map(str,sorted(seen))))
          PY"
          }

          PRE_AUDIT="$(audit_remote)"
          PRE_SENT="$(printf '%s\n' "$PRE_AUDIT" | sed -n 's/^sent_indexes=//p')"
          PRE_BOUNCED="$(printf '%s\n' "$PRE_AUDIT" | sed -n 's/^bounced_indexes=//p')"
          PRE_DEFERRED="$(printf '%s\n' "$PRE_AUDIT" | sed -n 's/^deferred_indexes=//p')"
          SKIP_INDEXES="$(printf '%s,%s,%s' "$PRE_SENT" "$PRE_BOUNCED" "$PRE_DEFERRED" | tr ',' '\n' | sed '/^$/d' | sort -n -u | paste -sd, -)"

          REMOTE_SCRIPT="/tmp/emdo-resume-affiliate-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS /tmp/emdo-resume-affiliate.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          set +e
          SEND_OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); \
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \
            wp_bin=\$(command -v wp); \
            EMDO_CONTACTS_B64='$CONTACTS_B64' EMDO_SKIP_INDEXES='$SKIP_INDEXES' \
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; \
            rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc" 2>&1)"
          SEND_RC=$?
          set -e

          ATTEMPTED_ACCEPTED="$(printf '%s\n' "$SEND_OUTPUT" | sed -n 's/^ATTEMPTED_ACCEPTED_INDEXES=//p' | tail -n1)"
          ATTEMPTED_FAILED="$(printf '%s\n' "$SEND_OUTPUT" | sed -n 's/^ATTEMPTED_FAILED_INDEXES=//p' | tail -n1)"

          sleep 20
          POST_AUDIT="$(audit_remote)"
          POST_SENT="$(printf '%s\n' "$POST_AUDIT" | sed -n 's/^sent_indexes=//p')"
          POST_BOUNCED="$(printf '%s\n' "$POST_AUDIT" | sed -n 's/^bounced_indexes=//p')"
          POST_DEFERRED="$(printf '%s\n' "$POST_AUDIT" | sed -n 's/^deferred_indexes=//p')"
          POST_SEEN="$(printf '%s\n' "$POST_AUDIT" | sed -n 's/^seen_indexes=//p')"

          UNKNOWN="$(POST_SENT="$POST_SENT" POST_BOUNCED="$POST_BOUNCED" POST_DEFERRED="$POST_DEFERRED" python3 - <<'PY'
          import os
          def parse(k): return {int(x) for x in os.environ.get(k,'').split(',') if x.strip()}
          done=parse('POST_SENT')|parse('POST_BOUNCED')|parse('POST_DEFERRED')
          print(','.join(str(i) for i in range(1,38) if i not in done))
          PY
          )"

          mkdir -p .deploy-status
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pre_sent_indexes=$PRE_SENT"
            echo "pre_bounced_indexes=$PRE_BOUNCED"
            echo "pre_deferred_indexes=$PRE_DEFERRED"
            echo "skipped_existing_indexes=$SKIP_INDEXES"
            echo "attempted_accepted_indexes=$ATTEMPTED_ACCEPTED"
            echo "attempted_failed_indexes=$ATTEMPTED_FAILED"
            echo "send_rc=$SEND_RC"
            echo "sent_indexes=$POST_SENT"
            echo "bounced_indexes=$POST_BOUNCED"
            echo "deferred_indexes=$POST_DEFERRED"
            echo "seen_indexes=$POST_SEEN"
            echo "unknown_indexes=$UNKNOWN"
          } > .deploy-status/affiliate-outreach-20260824.txt
          cat .deploy-status/affiliate-outreach-20260824.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/affiliate-outreach-20260824.txt
          git commit -m 'Record affiliate outreach delivery status' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

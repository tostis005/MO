name: Diagnose production cache catalog images 0.10.241

on:
  push:
    paths:
      - '.github/workflows/diagnose-production-cache-card-images-010241.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production caches and image styles
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"
          echo '=== ACTIVE CACHE RELATED PLUGINS ==='
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" plugin list --status=active --fields=name,status --format=csv --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root | grep -Ei 'cache|rocket|litespeed|perf|optimi|cloudflare|sg-' || true"
          echo '=== CACHE DIRS ==='
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "find '$PROD_PATH/wp-content' -maxdepth 2 -type d \( -iname '*cache*' -o -iname '*litespeed*' \) -print | head -50" || true
          echo '=== THEME IMAGE CSS GREP ==='
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "grep -RInE 'product-loop-image|woocommerce_thumbnail|aspect-ratio|object-fit' '$PROD_PATH/wp-content/themes/elmercadodeorigen-child' '$PROD_PATH/wp-content/themes/woostify' 2>/dev/null | head -160" || true
          echo '=== HEADERS ==='
          curl -sSI "$BASE_URL/tienda/?diagcache241=$(date +%s)" | sed -n '1,80p'

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage(); await page.setCacheEnabled(false); await page.setViewport({width:390,height:1200});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'});
            await page.goto(`${process.env.BASE_URL}/tienda/?diagstyle241=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
            const out=await page.evaluate(()=>{
              const img=document.querySelector('ul.products>li.product a img');
              const density=document.querySelector('#elmercado-product-card-density-final-010162');
              const rules=[];
              for(const sheet of [...document.styleSheets]){
                let cssRules; try{cssRules=sheet.cssRules}catch(e){continue}
                for(const rule of [...cssRules]){
                  const text=rule.cssText||'';
                  if(/ul\.products li\.product.*img|product-loop-image/.test(text) && /(height|aspect-ratio|object-fit)/.test(text)) rules.push(text.slice(0,1000));
                }
              }
              return {densityStyle:density?.textContent||'',img:img?{outer:img.outerHTML.slice(0,1500),computed:{width:getComputedStyle(img).width,height:getComputedStyle(img).height,aspectRatio:getComputedStyle(img).aspectRatio,objectFit:getComputedStyle(img).objectFit}}:null,rules};
            });
            console.log('BROWSER',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

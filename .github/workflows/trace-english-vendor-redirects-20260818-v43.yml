name: Trace English vendor redirects v43
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trace-english-vendor-redirects-20260818-v43.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Marker
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/english-vendor-v43.txt
          git add runtime/english-vendor-v43.txt; git commit -m 'Restart structural English store fix v43' || true; git push origin HEAD:main
      - name: Structurally remove root rewrite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('mu-plugins/mdo-z-english-vendor-seo-010260.php')
          s=p.read_text()
          pattern=r"\t\} elseif \( preg_match\( '#\^en/store/\(\[\^/\]\+\)\$#i', \$path, \$m \) \) \{\n\t\t\$internal = '/en/tienda/' \. mdoev_store_slug_010260\( \$m\[1\] \) \. '/';\n\t\}"
          s2,n=re.subn(pattern,"\t}",s,count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one root rewrite branch; found {n}')
          s2=s2.replace(' * Version: 1.0.2',' * Version: 1.0.3',1)
          p.write_text(s2)
          PY
          php -l mu-plugins/mdo-z-english-vendor-seo-010260.php
          if grep -q "#^en/store/([^/]+)\$#i" mu-plugins/mdo-z-english-vendor-seo-010260.php; then echo 'Root rewrite still present' >&2; exit 1; fi
          git add mu-plugins/mdo-z-english-vendor-seo-010260.php
          git commit -m 'Remove root store internal rewrite structurally'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy corrected router
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp=$(command -v wp); ph=$(command -v php || true); [ -n "$ph" ] || ph=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$ph" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf %s "$p";break;;esac;done')"
          : "${PROD_PATH:?}"
          echo "$PROD_PATH" >/tmp/prod43
          sshpass -e scp $SCP mu-plugins/mdo-z-english-vendor-seo-010260.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "ph=\$(command -v php || true); [ -n \"\$ph\" ] || ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); \"\$ph\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php'; wp=\$(command -v wp); \"\$ph\" \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify corrected routes from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set +e
            out=/tmp/v43-final.txt; : > "$out"
            for url in https://www.elmercadodeorigen.com/en/store/1957/ https://www.elmercadodeorigen.com/en/store/1957/about/ https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/ https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/about/; do
              rm -f /tmp/h43 /tmp/b43
              code=$(curl -k -L --max-redirs 5 -sS --connect-timeout 8 --max-time 35 -D /tmp/h43 -o /tmp/b43 -w "%{http_code}" "$url" 2>/tmp/e43); rc=$?
              products=$(grep -oE "/en/product/[^\" <]+" /tmp/b43 2>/dev/null | sort -u | wc -l | tr -d " ")
              policies=$(grep -oiE ">[[:space:]]*Policies[[:space:]]*<" /tmp/b43 2>/dev/null | wc -l | tr -d " ")
              about=$(grep -oE "/en/store/[^\" ]+/about/" /tmp/b43 2>/dev/null | sort -u | wc -l | tr -d " ")
              story=$(grep -oi "The story of" /tmp/b43 2>/dev/null | wc -l | tr -d " ")
              livestock=$(grep -oi "livestock farmers" /tmp/b43 2>/dev/null | wc -l | tr -d " ")
              spanish=$(grep -oiE "La historia de|Los ganaderos que integran" /tmp/b43 2>/dev/null | wc -l | tr -d " ")
              echo "url=$url rc=$rc code=$code redirects=$(grep -ic "^location:" /tmp/h43 2>/dev/null || true) products=$products policies=$policies about=$about story=$story livestock=$livestock spanish=$spanish" >> "$out"
            done
            for url in https://www.elmercadodeorigen.com/en/categories/ https://www.elmercadodeorigen.com/en/categorias/ https://www.elmercadodeorigen.com/en/tienda/1957/; do
              rm -f /tmp/h43 /tmp/b43
              curl -k -sS --connect-timeout 8 --max-time 25 -D /tmp/h43 -o /tmp/b43 "$url" >/dev/null 2>&1
              status=$(awk "toupper(\$1)~/^HTTP\\//{s=\$2}END{print s}" /tmp/h43)
              loc=$(awk "BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,\"\");sub(/\\r$/,\"\");print;exit}" /tmp/h43)
              xrb=$(awk "BEGIN{IGNORECASE=1}/^x-redirect-by:/{sub(/^[^:]+:[[:space:]]*/,\"\");sub(/\\r$/,\"\");print;exit}" /tmp/h43)
              echo "redirect_probe url=$url status=$status location=$loc by=$xrb" >> "$out"
            done
            cat "$out"
          ' > runtime/english-vendor-redirects-v43.txt
      - name: Commit verification
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=complete\n' "$GITHUB_RUN_ID" > runtime/english-vendor-v43.txt
          git add runtime/english-vendor-v43.txt runtime/english-vendor-redirects-v43.txt
          git commit -m 'Record structural English store verification v43' || true
          git pull --rebase origin main
          git push origin HEAD:main

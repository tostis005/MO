name: Test same-producer scoped filter admission 20261029
on:
  push:
    branches: [feature/scoped-filter-guard-20261029]
    paths:
      - 'ops/emdo-filter-gate/**'
      - '.github/workflows/test-scoped-filter-guard-20261029.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Go unit tests and compilation (no deployment)
        run: |
          set -Eeuo pipefail
          cd ops/emdo-filter-gate
          gofmt -w main.go main_test.go
          GO111MODULE=off go test -v .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/emdo-scoped-filter-gate main.go
          test -s /tmp/emdo-scoped-filter-gate

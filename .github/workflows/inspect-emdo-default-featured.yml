name: Inspect EMDO default featured image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-emdo-default-featured.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read default featured image metadata from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'cat > /tmp/emdo-inspect-default-featured.php <<'"'"'PHP'"'"'
          <?php
          if (!defined("ABSPATH")) { exit(1); }
          $ids = get_posts(array(
            "post_type"=>"post", "post_status"=>array("publish","draft","private"),
            "posts_per_page"=>-1, "fields"=>"ids", "meta_key"=>"_emdo_uses_default_featured"
          ));
          $counts=array(); $rows=array();
          foreach ($ids as $id) {
            $marker=(string)get_post_meta($id,"_emdo_uses_default_featured",true);
            if ($marker==="") continue;
            $thumb=(int)get_post_thumbnail_id($id);
            if ($thumb>0) $counts[$thumb]=($counts[$thumb]??0)+1;
            $rows[]=array("post_id"=>(int)$id,"post_title"=>get_the_title($id),"marker"=>$marker,"thumbnail_id"=>$thumb,"thumbnail_title"=>$thumb?get_the_title($thumb):"","thumbnail_url"=>$thumb?(string)wp_get_attachment_url($thumb):"");
          }
          arsort($counts);
          $attachments=array();
          foreach ($counts as $thumb=>$count) {
            $attachments[]=array("thumbnail_id"=>(int)$thumb,"count"=>(int)$count,"title"=>get_the_title($thumb),"url"=>(string)wp_get_attachment_url($thumb),"alt"=>(string)get_post_meta($thumb,"_wp_attachment_image_alt",true));
          }
          $generic=get_posts(array("post_type"=>"attachment","post_status"=>"inherit","posts_per_page"=>20,"fields"=>"ids","meta_key"=>"_wp_attachment_image_alt","meta_value"=>"Imagen provisional del blog de El Mercado de Origen"));
          $generic_rows=array(); foreach($generic as $gid){$generic_rows[]=array("thumbnail_id"=>(int)$gid,"title"=>get_the_title($gid),"url"=>(string)wp_get_attachment_url($gid),"alt"=>(string)get_post_meta($gid,"_wp_attachment_image_alt",true));}
          echo json_encode(array("marked_posts"=>count($rows),"attachments"=>$attachments,"generic_alt_matches"=>$generic_rows,"sample"=>array_slice($rows,0,20)),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),"\n";
          PHP
          wp=$(command -v wp || true); php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1)
          [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
          prod=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
          done
          [ -n "$prod" ] || exit 4
          "$php" "$wp" eval-file /tmp/emdo-inspect-default-featured.php --path="$prod" --allow-root
          rm -f /tmp/emdo-inspect-default-featured.php'
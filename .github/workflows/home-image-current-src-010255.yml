name: Home image currentSrc 0.10.255

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-image-current-src-010255.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check browser-selected producer images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          : "${CHROME:?Chrome missing}"
          CHROME_PATH="$CHROME" node <<'JS' > runtime/home-image-current-src-010255.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915},deviceScaleFactor:1});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            const rows=await page.evaluate(()=>['Tolecarnes','Hidalgo de la Jara'].map(alt=>{
              const img=[...document.images].find(i=>i.alt===alt);
              if(!img) return {alt,missing:true};
              const r=img.getBoundingClientRect();
              return {alt,currentSrc:img.currentSrc,src:img.src,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,displayWidth:Math.round(r.width),displayHeight:Math.round(r.height),sizes:img.sizes};
            }));
            rows.forEach(r=>console.log(JSON.stringify(r)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-image-current-src-010255.txt
          git commit -m 'Record Home producer browser image candidates' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

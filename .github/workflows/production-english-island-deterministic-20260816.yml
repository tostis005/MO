name: Production English island deterministic 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-english-island-deterministic-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy deterministic English island router
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          : "${wp_bin:?wp-cli missing}"
          : "${php_bin:?php missing}"
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path not found}"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          mkdir -p "$MU_DIR"
          TARGET="$MU_DIR/mdo-english-slug-router.php"
          if [ -f "$TARGET" ]; then cp -a "$TARGET" "$TARGET.bak-deterministic-$(date +%Y%m%d%H%M%S)"; fi

          cat > "$TARGET" <<'PHP'
          <?php
          /**
           * MDO English Island Router.
           * Keeps Spanish WordPress/WooCommerce objects untouched while exposing
           * their reviewed English aliases stored in _en_US_* metadata.
           */
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          function mdo_en_is_request(): bool {
              if ( empty( $_SERVER['REQUEST_URI'] ) ) { return false; }
              $path = wp_parse_url( wp_unslash( $_SERVER['REQUEST_URI'] ), PHP_URL_PATH );
              return is_string( $path ) && ( $path === '/en' || strpos( $path, '/en/' ) === 0 );
          }

          function mdo_en_segments(): array {
              if ( ! mdo_en_is_request() ) { return array(); }
              $path = (string) wp_parse_url( wp_unslash( $_SERVER['REQUEST_URI'] ), PHP_URL_PATH );
              $relative = trim( preg_replace( '#^/en/?#', '', $path ), '/' );
              if ( $relative === '' ) { return array(); }
              return array_values( array_filter( array_map( 'sanitize_title', explode( '/', $relative ) ), 'strlen' ) );
          }

          function mdo_en_root(): string {
              return rtrim( (string) get_option( 'home' ), '/' );
          }

          function mdo_en_slug_for_post( int $post_id ): string {
              if ( (string) get_post_meta( $post_id, '_en_US_published', true ) !== '1' ) { return ''; }
              return sanitize_title( wp_strip_all_tags( (string) get_post_meta( $post_id, '_en_US_post_name', true ) ) );
          }

          function mdo_en_find_by_slug( string $post_type, string $slug ): int {
              $slug = sanitize_title( $slug );
              if ( $slug === '' ) { return 0; }
              $ids = get_posts( array(
                  'post_type'        => $post_type,
                  'post_status'      => 'publish',
                  'posts_per_page'   => 2,
                  'fields'           => 'ids',
                  'no_found_rows'    => true,
                  'suppress_filters' => true,
                  'meta_query'       => array(
                      'relation' => 'AND',
                      array( 'key' => '_en_US_post_name', 'value' => $slug, 'compare' => '=' ),
                      array( 'key' => '_en_US_published', 'value' => '1', 'compare' => '=' ),
                  ),
              ) );
              return count( $ids ) === 1 ? (int) $ids[0] : 0;
          }

          function mdo_en_page_url( int $post_id ): string {
              $slug = mdo_en_slug_for_post( $post_id );
              return $slug === '' ? '' : mdo_en_root() . '/en/' . rawurlencode( $slug ) . '/';
          }

          function mdo_en_product_url( int $post_id ): string {
              $slug = mdo_en_slug_for_post( $post_id );
              return $slug === '' ? '' : mdo_en_root() . '/en/product/' . rawurlencode( $slug ) . '/';
          }

          function mdo_en_native_page_from_slug( string $slug ) {
              $page = get_page_by_path( sanitize_title( $slug ), OBJECT, 'page' );
              return ( $page instanceof WP_Post && $page->post_status === 'publish' ) ? $page : null;
          }

          function mdo_en_native_product_from_slug( string $slug ) {
              $product = get_page_by_path( sanitize_title( $slug ), OBJECT, 'product' );
              return ( $product instanceof WP_Post && $product->post_status === 'publish' ) ? $product : null;
          }

          function mdo_en_translate_internal_url( string $url ): string {
              if ( $url === '' || strpos( $url, '#' ) === 0 || stripos( $url, 'mailto:' ) === 0 || stripos( $url, 'tel:' ) === 0 || stripos( $url, 'javascript:' ) === 0 ) { return $url; }
              $root = mdo_en_root();
              $root_host = wp_parse_url( $root, PHP_URL_HOST );
              $host = wp_parse_url( $url, PHP_URL_HOST );
              if ( $host && $root_host && strtolower( (string) $host ) !== strtolower( (string) $root_host ) ) { return $url; }

              $query = wp_parse_url( $url, PHP_URL_QUERY );
              $fragment = wp_parse_url( $url, PHP_URL_FRAGMENT );
              $suffix = '';
              if ( is_string( $query ) && $query !== '' ) { $suffix .= '?' . $query; }
              if ( is_string( $fragment ) && $fragment !== '' ) { $suffix .= '#' . $fragment; }

              $path = (string) wp_parse_url( $url, PHP_URL_PATH );
              $parts = array_values( array_filter( explode( '/', trim( $path, '/' ) ), 'strlen' ) );
              if ( ! $parts ) { return $root . '/en/' . $suffix; }

              $is_en = strtolower( $parts[0] ) === 'en';
              if ( $is_en ) { array_shift( $parts ); }
              if ( ! $parts ) { return $root . '/en/' . $suffix; }

              if ( count( $parts ) === 1 ) {
                  $english_id = mdo_en_find_by_slug( 'page', $parts[0] );
                  if ( $english_id ) { return mdo_en_page_url( $english_id ) . $suffix; }
                  $native = mdo_en_native_page_from_slug( $parts[0] );
                  if ( $native ) {
                      $translated = mdo_en_page_url( (int) $native->ID );
                      if ( $translated !== '' ) { return $translated . $suffix; }
                  }
              }

              if ( count( $parts ) === 2 && in_array( sanitize_title( $parts[0] ), array( 'producto', 'product' ), true ) ) {
                  $english_id = mdo_en_find_by_slug( 'product', $parts[1] );
                  if ( $english_id ) { return mdo_en_product_url( $english_id ) . $suffix; }
                  $native = mdo_en_native_product_from_slug( $parts[1] );
                  if ( $native ) {
                      $translated = mdo_en_product_url( (int) $native->ID );
                      if ( $translated !== '' ) { return $translated . $suffix; }
                  }
              }

              return $url;
          }

          add_action( 'parse_request', static function ( WP $wp ): void {
              $parts = mdo_en_segments();
              if ( ! $parts ) { return; }

              if ( count( $parts ) === 2 && $parts[0] === 'product' ) {
                  $id = mdo_en_find_by_slug( 'product', $parts[1] );
                  if ( ! $id ) { return; }
                  foreach ( array( 'error', 'name', 'pagename', 'page_id', 'attachment', 'product', 'product_cat', 'product_tag' ) as $key ) { unset( $wp->query_vars[ $key ] ); }
                  $wp->query_vars['post_type'] = 'product';
                  $wp->query_vars['p'] = $id;
                  return;
              }

              if ( count( $parts ) !== 1 ) { return; }
              $id = mdo_en_find_by_slug( 'page', $parts[0] );
              if ( ! $id ) { return; }
              foreach ( array( 'error', 'name', 'pagename', 'page_id', 'attachment', 'p' ) as $key ) { unset( $wp->query_vars[ $key ] ); }
              if ( $id === (int) get_option( 'woocommerce_shop_page_id' ) ) {
                  $wp->query_vars['post_type'] = 'product';
              } else {
                  unset( $wp->query_vars['post_type'] );
                  $wp->query_vars['page_id'] = $id;
              }
          }, PHP_INT_MAX );

          add_filter( 'page_link', static function ( string $url, int $post_id ): string {
              if ( ! mdo_en_is_request() ) { return $url; }
              $translated = mdo_en_page_url( $post_id );
              return $translated !== '' ? $translated : $url;
          }, PHP_INT_MAX, 2 );

          add_filter( 'post_type_link', static function ( string $url, WP_Post $post ): string {
              if ( ! mdo_en_is_request() || $post->post_type !== 'product' ) { return $url; }
              $translated = mdo_en_product_url( (int) $post->ID );
              return $translated !== '' ? $translated : $url;
          }, PHP_INT_MAX, 2 );

          add_filter( 'wp_nav_menu_objects', static function ( array $items ): array {
              if ( ! mdo_en_is_request() ) { return $items; }
              foreach ( $items as $item ) {
                  if ( ! $item instanceof WP_Post ) { continue; }
                  $translated = '';
                  if ( $item->type === 'post_type' && $item->object === 'page' ) {
                      $translated = mdo_en_page_url( (int) $item->object_id );
                  } elseif ( $item->type === 'post_type' && $item->object === 'product' ) {
                      $translated = mdo_en_product_url( (int) $item->object_id );
                  } elseif ( ! empty( $item->url ) ) {
                      $translated = mdo_en_translate_internal_url( (string) $item->url );
                  }
                  if ( $translated !== '' ) { $item->url = $translated; }
              }
              return $items;
          }, PHP_INT_MAX );

          add_filter( 'woocommerce_get_cart_url', static function ( string $url ): string {
              if ( ! mdo_en_is_request() || ! function_exists( 'wc_get_page_id' ) ) { return $url; }
              $translated = mdo_en_page_url( (int) wc_get_page_id( 'cart' ) );
              return $translated !== '' ? $translated : $url;
          }, PHP_INT_MAX );

          add_filter( 'woocommerce_get_checkout_url', static function ( string $url ): string {
              if ( ! mdo_en_is_request() || ! function_exists( 'wc_get_page_id' ) ) { return $url; }
              $translated = mdo_en_page_url( (int) wc_get_page_id( 'checkout' ) );
              return $translated !== '' ? $translated : $url;
          }, PHP_INT_MAX );

          add_filter( 'woocommerce_get_myaccount_page_permalink', static function ( string $url ): string {
              if ( ! mdo_en_is_request() || ! function_exists( 'wc_get_page_id' ) ) { return $url; }
              $translated = mdo_en_page_url( (int) wc_get_page_id( 'myaccount' ) );
              return $translated !== '' ? $translated : $url;
          }, PHP_INT_MAX );

          add_filter( 'redirect_canonical', static function ( $redirect ) {
              if ( ! mdo_en_is_request() ) { return $redirect; }
              $parts = mdo_en_segments();
              if ( count( $parts ) === 1 && mdo_en_find_by_slug( 'page', $parts[0] ) ) { return false; }
              if ( count( $parts ) === 2 && $parts[0] === 'product' && mdo_en_find_by_slug( 'product', $parts[1] ) ) { return false; }
              return $redirect;
          }, PHP_INT_MAX );

          add_action( 'template_redirect', static function (): void {
              if ( ! mdo_en_is_request() || is_admin() || wp_doing_ajax() ) { return; }
              $parts = mdo_en_segments();
              if ( count( $parts ) === 1 ) {
                  if ( mdo_en_find_by_slug( 'page', $parts[0] ) ) { return; }
                  $native = mdo_en_native_page_from_slug( $parts[0] );
                  if ( $native ) {
                      $target = mdo_en_page_url( (int) $native->ID );
                      if ( $target !== '' ) { wp_safe_redirect( $target, 301, 'MDO English page canonical' ); exit; }
                  }
              }
              if ( count( $parts ) === 2 && in_array( $parts[0], array( 'producto', 'product' ), true ) ) {
                  if ( $parts[0] === 'product' && mdo_en_find_by_slug( 'product', $parts[1] ) ) { return; }
                  $native = mdo_en_native_product_from_slug( $parts[1] );
                  if ( $native ) {
                      $target = mdo_en_product_url( (int) $native->ID );
                      if ( $target !== '' ) { wp_safe_redirect( $target, 301, 'MDO English product canonical' ); exit; }
                  }
              }
          }, 1 );
          PHP

          "$php_bin" -l "$TARGET"
          echo "router_sha256=$(sha256sum "$TARGET" | awk '{print $1}')"
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            foreach (["page","product"] as $type) {
              $ids=get_posts(["post_type"=>$type,"post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","suppress_filters"=>true]);
              $pub=0;$dupes=[];$seen=[];
              foreach($ids as $id){$slug=trim((string)get_post_meta($id,"_en_US_post_name",true));$ok=(string)get_post_meta($id,"_en_US_published",true)==="1";if($slug!==""&&$ok){$pub++;if(isset($seen[$slug])){$dupes[]=$slug;}$seen[$slug]=1;}}
              echo "$type total=".count($ids)." english_published=$pub dupes=".implode(",",array_unique($dupes)).PHP_EOL;
            }
          ' --path="$PROD_PATH" --allow-root
          REMOTE

      - name: Verify Spanish safety and English island
        shell: bash
        run: |
          set -u
          failed=0
          stamp=$(date +%s%N)

          check() {
            path="$1" expected="$2"
            code=$(curl -ksSL --max-time 35 -o /tmp/check.html -w '%{http_code}' "https://www.elmercadodeorigen.com${path}?mdo_island=$stamp" || true)
            body=$(grep -oE '<body[^>]*class="[^"]*"' /tmp/check.html | head -n1 || true)
            products=$( (grep -oE '<li[^>]+class="[^"]*\bproduct\b[^"]*"' /tmp/check.html || true) | wc -l | tr -d ' ' )
            echo "$path code=$code products=$products"
            echo "$body"
            [ "$code" = "$expected" ] || failed=1
            if [ "$path" = "/en/shop/" ]; then cp /tmp/check.html /tmp/en-shop.html; fi
          }

          check /tienda/ 200
          check /en/shop/ 200
          check /en/cart/ 200
          check /en/my-account/ 200

          spanish_body=$(curl -ksSL --max-time 35 "https://www.elmercadodeorigen.com/tienda/?mdo_es=$stamp" | grep -oE '<body[^>]*class="[^"]*"' | head -n1 || true)
          echo "$spanish_body" | grep -q 'woocommerce-shop' || failed=1
          echo "$spanish_body" | grep -q 'translatepress-es_ES' || failed=1

          en_body=$(grep -oE '<body[^>]*class="[^"]*"' /tmp/en-shop.html | head -n1 || true)
          echo "$en_body" | grep -q 'woocommerce-shop' || failed=1
          echo "$en_body" | grep -q 'translatepress-en_US' || failed=1
          en_products=$( (grep -oE '<li[^>]+class="[^"]*\bproduct\b[^"]*"' /tmp/en-shop.html || true) | wc -l | tr -d ' ' )
          [ "$en_products" -gt 0 ] || failed=1

          mapfile -t product_urls < <(grep -oE 'href="(https://www\.elmercadodeorigen\.com)?/en/product/[^"]+/"' /tmp/en-shop.html | sed -E 's/^href="|"$//g' | sed 's#^/#https://www.elmercadodeorigen.com/#' | sort -u | head -n 5)
          echo "english_product_links=${#product_urls[@]}"
          printf '%s\n' "${product_urls[@]}"
          [ "${#product_urls[@]}" -gt 0 ] || failed=1
          if grep -qE 'href="(https://www\.elmercadodeorigen\.com)?/(en/)?producto/' /tmp/en-shop.html; then echo 'ERROR Spanish product URL in English shop'; failed=1; fi

          for url in "${product_urls[@]}"; do
            code=$(curl -ksSL --max-time 35 -o /tmp/product.html -w '%{http_code}' "${url}?mdo_product=$stamp" || true)
            body=$(grep -oE '<body[^>]*class="[^"]*"' /tmp/product.html | head -n1 || true)
            h1=$(grep -oE '<h1[^>]*>[^<]{0,240}</h1>' /tmp/product.html | head -n1 | sed -E 's/<[^>]+>//g' || true)
            echo "product=$url code=$code h1=$h1"
            echo "$body"
            [ "$code" = 200 ] || failed=1
            echo "$body" | grep -q 'single-product' || failed=1
            echo "$body" | grep -q 'translatepress-en_US' || failed=1
          done

          echo '--- navigation hrefs ---'
          python3 - <<'PY'
          import re
          html=open('/tmp/en-shop.html',encoding='utf-8',errors='ignore').read()
          chunks=re.findall(r'<nav\b.*?</nav>',html,re.I|re.S)
          nav='\n'.join(chunks)
          open('/tmp/nav.html','w',encoding='utf-8').write(nav)
          for u in re.findall(r'href=["\']([^"\']+)',nav,re.I)[:60]: print(u)
          PY
          if grep -qE 'href=["'"'](https://www\.elmercadodeorigen\.com)?/(tienda|carrito|finalizar-compra|mi-cuenta)/' /tmp/nav.html; then echo 'ERROR Spanish core URL in English navigation'; failed=1; fi

          headers=$(mktemp)
          curl -ksS --max-time 20 -D "$headers" -o /dev/null "https://www.elmercadodeorigen.com/en/tienda/?mdo_legacy=$stamp" || true
          legacy_code=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$headers")
          legacy_location=$(awk 'tolower($1)=="location:"{print $2; exit}' "$headers" | tr -d '\r')
          echo "legacy_en_tienda code=$legacy_code location=$legacy_location"
          [ "$legacy_code" = 301 ] || [ "$legacy_code" = 302 ] || failed=1
          echo "$legacy_location" | grep -q '/en/shop/' || failed=1

          exit "$failed"

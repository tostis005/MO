name: Production Tolecarnes pricing resync 0.10.243

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-tolecarnes-pricing-resync-010243.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-tolecarnes-pricing-resync
  cancel-in-progress: false

jobs:
  deploy-resync-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy fix, run full Tolecarnes sync and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l mdo-supplier-sync/mdo-supplier-sync.php >/dev/null
          php -l mdo-supplier-sync/includes/class-mdo-pricing.php >/dev/null
          grep -Fq "Version: 1.0.11" mdo-supplier-sync/mdo-supplier-sync.php
          grep -Fq "abs( \$current - \$detected_current ) < 0.005" mdo-supplier-sync/includes/class-mdo-pricing.php

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] && [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          echo "Production WordPress resolved."

          PLUGIN="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          TARGET_MAIN="$PLUGIN/mdo-supplier-sync.php"
          TARGET_PRICING="$PLUGIN/includes/class-mdo-pricing.php"
          BAK_MAIN="/tmp/emdo-main-010243-${GITHUB_RUN_ID}.bak"
          BAK_PRICING="/tmp/emdo-pricing-010243-${GITHUB_RUN_ID}.bak"
          ROLLED=0

          opcache_reset(){
            probe="emdo-opcache-010243-${GITHUB_RUN_ID}-$RANDOM.php"
            sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$probe"
            set +e
            ok=0
            for i in $(seq 1 6); do
              body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache, no-store' "$BASE_URL/$probe?r=$GITHUB_RUN_ID-$i-$RANDOM" 2>/dev/null)"
              if printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$'; then ok=1; break; fi
              sleep 2
            done
            set -e
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$probe'" || true
            test "$ok" -eq 1
          }

          rollback_code(){
            code=$?
            [ "$ROLLED" -eq 0 ] || exit "$code"
            ROLLED=1
            set +e
            echo CODE_ROLLBACK_START
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "[ -f '$BAK_MAIN' ] && cp -p '$BAK_MAIN' '$TARGET_MAIN'; [ -f '$BAK_PRICING' ] && cp -p '$BAK_PRICING' '$TARGET_PRICING'; rm -f '$BAK_MAIN' '$BAK_PRICING'; wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); [ -n \"\$wp_bin\" ] && [ -n \"\$php_bin\" ] && \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true
            opcache_reset || true
            echo CODE_ROLLED_BACK
            exit "${code:-1}"
          }
          trap rollback_code ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$TARGET_MAIN'; test -f '$TARGET_PRICING'; cp -p '$TARGET_MAIN' '$BAK_MAIN'; cp -p '$TARGET_PRICING' '$BAK_PRICING'"
          sshpass -e scp $SCP mdo-supplier-sync/includes/class-mdo-pricing.php "$STAGING_USER@$STAGING_HOST:$TARGET_PRICING"
          sshpass -e scp $SCP mdo-supplier-sync/mdo-supplier-sync.php "$STAGING_USER@$STAGING_HOST:$TARGET_MAIN"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp || true)
            [ -x \"\$php_bin\" ] && [ -n \"\$wp_bin\" ]
            \"\$php_bin\" -l '$TARGET_MAIN' >/dev/null
            \"\$php_bin\" -l '$TARGET_PRICING' >/dev/null
            grep -Fq 'Version: 1.0.11' '$TARGET_MAIN'
            grep -Fq 'abs( \$current - \$detected_current ) < 0.005' '$TARGET_PRICING'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "
          opcache_reset

          # Before touching product data, prove the fixed parser returns the two reported prices.
          focused="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp);
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval '
              \$cases=[
                [\"https://tolecarnes.com/producto/huesos-de-ternera-arr\",2.49],
                [\"https://tolecarnes.com/producto/burger-de-ternera-sin-gluten-awh\",5.19]
              ];
              \$out=[];
              foreach(\$cases as [\$url,\$expected]){
                \$p=MDO_Text::normalize_product(MDO_Connector_Tolecarnes::scrape_product(\$url));
                \$row=[\"url\"=>\$url,\"title\"=>\$p[\"title\"]??null,\"price\"=>\$p[\"price\"]??null,\"regular\"=>\$p[\"regular_price\"]??null,\"sale\"=>\$p[\"sale_price\"]??null];
                if(abs((float)\$row[\"price\"]-\$expected)>0.005 || abs((float)\$row[\"regular\"]-\$expected)>0.005 || null!==\$row[\"sale\"]) { echo \"FOCUSED_FAIL=\".wp_json_encode(\$row); exit(23); }
                \$out[]=\$row;
              }
              echo \"FOCUSED_OK=\".wp_json_encode(\$out,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);
            ' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$focused"
          printf '%s\n' "$focused" | grep -Fq 'FOCUSED_OK='

          # From this point the corrected code stays deployed even if a data job needs attention.
          trap - ERR
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BAK_MAIN' '$BAK_PRICING'"

          # Launch a complete supplier discovery/scrape run, then drain only EMDO's Action Scheduler group.
          sync_start="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval 'MDO_Scheduler::run_supplier(1, \"manual\"); global \$wpdb; \$t=MDO_Database::table(\"sync_runs\"); echo (int)\$wpdb->get_var(\"SELECT MAX(id) FROM {\$t} WHERE supplier_id=1\");' --path='$PROD_PATH' --allow-root
          ")"
          RUN_ID="$(printf '%s' "$sync_start" | grep -oE '[0-9]+' | tail -n1)"
          test -n "$RUN_ID"
          echo "TOLECARNES_FULL_SYNC_RUN_ID=$RUN_ID"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" action-scheduler run --group=mdo-supplier-sync --batch-size=20 --batches=0 --force --path='$PROD_PATH' --allow-root
          "

          run_report="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'global \$wpdb; \$t=MDO_Database::table(\"sync_runs\"); \$r=\$wpdb->get_row(\$wpdb->prepare(\"SELECT id,supplier_id,trigger_type,status,products_found,products_new,products_updated,products_excluded,errors_count,message,started_at,finished_at FROM {\$t} WHERE id=%d\",$RUN_ID),ARRAY_A); echo wp_json_encode(\$r,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE); if(!\$r || \"success\"!==\$r[\"status\"] || (int)\$r[\"errors_count\"]!==0 || empty(\$r[\"finished_at\"])) exit(31);' --path='$PROD_PATH' --allow-root
          ")"
          echo "FULL_SYNC_REPORT=$run_report"

          # Full re-import of every already-active mapped Tolecarnes product, not only changed rows.
          active_ids="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'global \$wpdb; \$t=MDO_Database::table(\"source_products\"); echo implode(\",\",array_map(\"intval\",\$wpdb->get_col(\"SELECT id FROM {\$t} WHERE supplier_id=1 AND status=\\\"active\\\" AND wc_product_id IS NOT NULL AND wc_product_id>0 ORDER BY id\")));' --path='$PROD_PATH' --allow-root
          ")"
          test -n "$active_ids"
          IFS=',' read -r -a ids <<< "$active_ids"
          echo "FULL_REIMPORT_ACTIVE_COUNT=${#ids[@]}"
          import_errors=0
          for id in "${ids[@]}"; do
            if ! sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
              \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval 'try { echo MDO_Woo_Importer::import_source_product((int)$id); } catch(Throwable \$e) { fwrite(STDERR, \"IMPORT_ERROR source=$id: \".\$e->getMessage().\"\\n\"); exit(41); }' --path='$PROD_PATH' --allow-root
            "; then
              import_errors=$((import_errors+1))
            fi
          done
          test "$import_errors" -eq 0

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
          "

          # Final DB + WooCommerce assertions for the two reported failures.
          final_report="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval '
              global \$wpdb; \$t=MDO_Database::table(\"source_products\");
              \$cases=[[\"%huesos de ternera%\",2.49,\"Huesos\"],[\"%burger mixtas%\",5.19,\"Burger mixtas\"]]; \$out=[];
              foreach(\$cases as [\$like,\$expected,\$label]){
                \$r=\$wpdb->get_row(\$wpdb->prepare(\"SELECT id,title,source_url,source_price,status,wc_product_id,source_payload,last_seen_at,last_changed_at,last_error FROM {\$t} WHERE supplier_id=1 AND LOWER(title) LIKE %s ORDER BY id DESC LIMIT 1\",\$like),ARRAY_A);
                if(!\$r) { echo \"FINAL_FAIL missing \".\$label; exit(51); }
                \$payload=json_decode((string)\$r[\"source_payload\"],true); \$p=wc_get_product((int)\$r[\"wc_product_id\"]);
                \$row=[\"title\"=>\$r[\"title\"],\"source_url\"=>\$r[\"source_url\"],\"source_price\"=>(float)\$r[\"source_price\"],\"payload_price\"=>(float)(\$payload[\"price\"]??0),\"payload_regular\"=>(float)(\$payload[\"regular_price\"]??0),\"payload_sale\"=>\$payload[\"sale_price\"]??null,\"woo_id\"=>(int)\$r[\"wc_product_id\"],\"woo_price\"=>\$p?(float)\$p->get_price():null,\"woo_regular\"=>\$p?(float)\$p->get_regular_price():null,\"woo_sale\"=>\$p?\$p->get_sale_price():null,\"status\"=>\$r[\"status\"],\"last_error\"=>\$r[\"last_error\"]];
                foreach([\"source_price\",\"payload_price\",\"payload_regular\",\"woo_price\",\"woo_regular\"] as \$k){ if(abs((float)\$row[\$k]-\$expected)>0.005){ echo \"FINAL_FAIL=\".wp_json_encode(\$row); exit(52); } }
                if(null!==\$row[\"payload_sale\"] || !in_array(\$row[\"woo_sale\"],[\"\",null],true) || \"active\"!==\$row[\"status\"] || !empty(\$row[\"last_error\"])) { echo \"FINAL_FAIL=\".wp_json_encode(\$row); exit(53); }
                \$out[]=\$row;
              }
              echo \"FINAL_OK=\".wp_json_encode(\$out,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);
            ' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$final_report"
          printf '%s\n' "$final_report" | grep -Fq 'FINAL_OK='
          opcache_reset
          echo PRODUCTION_TOLECARNES_PRICING_RESYNC_010243_OK

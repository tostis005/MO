name: Audit ad slot parser timing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ad-slot-parser-timing-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Measure parser and ad slot timing
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options

          url='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&slot_parser_audit=1'
          o=Options(); o.page_load_strategy='eager'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o); d.set_page_load_timeout(45)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':r"""
              (() => {
                window.__emoMarks={start:performance.now(),body:null,topSlot:null,firstSlot:null,dom:null};
                function scan(){
                  if(!window.__emoMarks.body && document.body) window.__emoMarks.body=performance.now();
                  if(!window.__emoMarks.firstSlot && document.querySelector('[data-emo-adsterra-slot]')) window.__emoMarks.firstSlot=performance.now();
                  if(!window.__emoMarks.topSlot && document.querySelector('[data-emo-adsterra-slot="responsive-top"]')) window.__emoMarks.topSlot=performance.now();
                }
                new MutationObserver(scan).observe(document,{childList:true,subtree:true});
                document.addEventListener('DOMContentLoaded',()=>{window.__emoMarks.dom=performance.now();scan();},{once:true});
                const f=window.fetch;
                window.fetch=function(input,init){
                  const u=typeof input==='string'?input:(input&&input.url)||'';
                  if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                    init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                    h.set('X-Country-Code','ZA');init.headers=h;
                  }
                  return f.call(this,input,init);
                };
              })();"""})
              try:d.get(url)
              except TimeoutException:
                  try:d.execute_script('window.stop()')
                  except:pass
              time.sleep(3)
              state=d.execute_script(r"""
                const all=performance.getEntriesByType('resource').map(r=>({
                  name:r.name,start:Math.round(r.startTime),dur:Math.round(r.duration),type:r.initiatorType
                }));
                const controller=all.find(r=>r.name.includes('adsterra-geo-010290.js'));
                const before=(controller?all.filter(r=>r.start<=controller.start && r.type==='script'):[])
                  .sort((a,b)=>a.start-b.start);
                return {
                  marks:window.__emoMarks,
                  debug:window.ElMercadoAdsterraGeoDebug||null,
                  controller:controller||null,
                  fastGeo:all.filter(r=>r.name.includes('/assets/ad-geo-fast.php')),
                  frames:all.filter(r=>r.name.includes('/assets/adsterra-frame.html')),
                  scriptsBeforeController:before
                };
              """)
              print('STATE='+json.dumps(state,sort_keys=True),flush=True)
          finally:d.quit()
          PY

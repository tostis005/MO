name: Fix production catalog load-more and mobile pagination 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-catalog-pagination-production-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emdo-catalog-pagination-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate both changes and deploy tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l elmercadodeorigen-child/inc/catalog-filter-scroll-final-010234.php
          php -l mu-plugins/mdo-catalog-manual-pagination-20261009.php
          grep -q 'emo-catalog-batch-ready' elmercadodeorigen-child/inc/catalog-filter-scroll-final-010234.php
          grep -q 'selector(body:has' mu-plugins/mdo-catalog-manual-pagination-20261009.php
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
      - name: Install isolated PHP modules with backups
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_ARGS=(-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -p "$PORT")
          SCP_ARGS=(-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -P "$PORT")
          sshpass -e scp "${SCP_ARGS[@]}" elmercadodeorigen-child/inc/catalog-filter-scroll-final-010234.php "$STAGING_USER@$STAGING_HOST:/tmp/emdo-pager-batch-${GITHUB_RUN_ID}.php"
          sshpass -e scp "${SCP_ARGS[@]}" mu-plugins/mdo-catalog-manual-pagination-20261009.php "$STAGING_USER@$STAGING_HOST:/tmp/emdo-pager-manual-${GITHUB_RUN_ID}.php"
          sshpass -e scp "${SCP_ARGS[@]}" .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:/tmp/emdo-pager-opcache-${GITHUB_RUN_ID}.php"
          sshpass -e ssh "${SSH_ARGS[@]}" "$STAGING_USER@$STAGING_HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          RUN="$1"
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          PHP=/opt/plesk/php/8.2/bin/php
          WP="$(command -v wp)"
          test -f "$ROOT/wp-config.php" && test -x "$PHP" && test -n "$WP"
          SITE="$("$PHP" -d memory_limit=512M "$WP" option get siteurl --path="$ROOT" --skip-plugins --skip-themes --allow-root)"
          case "$SITE" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) ;;
            *) echo "Refusing unknown production site: $SITE"; exit 10 ;;
          esac
          BATCH="$ROOT/wp-content/themes/elmercadodeorigen-child/inc/catalog-filter-scroll-final-010234.php"
          MANUAL="$ROOT/wp-content/mu-plugins/mdo-catalog-manual-pagination-20261009.php"
          test -s "$BATCH" && test -s "$MANUAL"
          test -s "/tmp/emdo-pager-batch-$RUN.php" && test -s "/tmp/emdo-pager-manual-$RUN.php"
          "$PHP" -l "/tmp/emdo-pager-batch-$RUN.php"
          "$PHP" -l "/tmp/emdo-pager-manual-$RUN.php"
          cp -p "$BATCH" "/tmp/emdo-pager-batch-before-$RUN.php"
          cp -p "$MANUAL" "/tmp/emdo-pager-manual-before-$RUN.php"
          changed=0
          rollback() {
            if [ "$changed" = 1 ]; then
              cp -p "/tmp/emdo-pager-batch-before-$RUN.php" "$BATCH"
              cp -p "/tmp/emdo-pager-manual-before-$RUN.php" "$MANUAL"
              echo ROLLBACK_MODULES_COMPLETE
            fi
          }
          trap rollback ERR
          changed=1
          install -m 0644 "/tmp/emdo-pager-batch-$RUN.php" "$BATCH"
          install -m 0644 "/tmp/emdo-pager-manual-$RUN.php" "$MANUAL"
          "$PHP" -l "$BATCH" && "$PHP" -l "$MANUAL"
          "$PHP" -d memory_limit=512M "$WP" cache flush --path="$ROOT" --allow-root || true
          # Invalidate only the cached shop HTML after a shop-inline-JS change.
          SHOPCACHE="$ROOT/wp-content/uploads/elmercado-hot-static-v1/es-shop-root.html"
          rm -f "$SHOPCACHE" "$SHOPCACHE.lock"
          install -m 0644 "/tmp/emdo-pager-opcache-$RUN.php" "$ROOT/emdo-pager-opcache-$RUN.php"
          curl -fsSL --connect-timeout 6 --max-time 20 "https://www.elmercadodeorigen.com/emdo-pager-opcache-$RUN.php" || true
          rm -f "$ROOT/emdo-pager-opcache-$RUN.php"
          echo DEPLOYED_BATCH_AND_MANUAL_PAGER_MODULES
          grep -Fq "document.body.classList.add('emo-catalog-batch-ready')" "$BATCH"
          grep -Fq 'selector(body:has' "$MANUAL"
          echo DEPLOYED_SOURCE_MARKERS_VERIFIED
          trap - ERR
          REMOTE
      - name: Mobile browser test of single pager and appended products
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -Eeuo pipefail
          cat >/tmp/emdo-pager-verify.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page=await browser.newPage({viewport:{width:393,height:851},isMobile:true,hasTouch:true});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e).slice(0,200)));
              let response,before;
              /* Cached HTML may lag the PHP deployment; verify multiple uncached responses. */
              for(let attempt=1;attempt<=5;attempt++){
                const url='https://www.elmercadodeorigen.com/tienda/?orderby=price&emdo_pager_fix=20261109-'+Date.now()+'-'+attempt;
                response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:65000});
                await page.waitForTimeout(1700);
                before=await page.evaluate(()=>{
                const grid=document.querySelector('main ul.products,#primary ul.products,.content-area ul.products,ul.products');
                const manual=document.querySelector('nav.mdo-catalog-manual-pagination');
                const native=document.querySelector('nav.woocommerce-pagination');
                return {products:grid?.querySelectorAll(':scope > li.product').length||0,batchReady:document.body.classList.contains('emo-catalog-batch-ready'),manual:manual?getComputedStyle(manual).display:'none',native:native?getComputedStyle(native).display:'none',width:document.documentElement.scrollWidth,viewport:innerWidth};
              });
                const marker=await page.evaluate(()=>({newSource:document.documentElement.innerHTML.includes("document.body.classList.add('emo-catalog-batch-ready')"),ordered:window.__emoCatalogLoaderState?.ordered,errors:window.__emoCatalogLoaderState?.remaining}));
                console.log('PAGER_ATTEMPT '+attempt+' '+JSON.stringify(before)+' '+JSON.stringify(marker));
                if(before.batchReady&&before.manual==='none'&&before.native==='none')break;
                await page.waitForTimeout(3000);
              }
              console.log('PAGER_BEFORE '+JSON.stringify(before));
              if(response.status()!==200||!before.batchReady||before.manual!=='none'||before.native!=='none'||before.products<10||before.width>before.viewport+4) throw Error('Initial sorted mobile pager regression');
              await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
              await page.waitForFunction(()=>document.querySelectorAll('main ul.products > li.product,#primary ul.products > li.product,.content-area ul.products > li.product').length>=27,null,{timeout:52000}).catch(async()=>{await page.waitForTimeout(900);throw Error('Product append timed out');});
              await page.waitForTimeout(2000);
              const after=await page.evaluate(()=>({
                products:document.querySelectorAll('main ul.products > li.product,#primary ul.products > li.product,.content-area ul.products > li.product').length,
                loading:window.__emoCatalogLoaderState?.loading,
                width:document.documentElement.scrollWidth,
                viewport:innerWidth,
                buttonText:document.querySelector('.emo-catalog-load-button')?.textContent?.trim()
              }));
              console.log('PAGER_AFTER '+JSON.stringify(after)+' PAGE_ERRORS '+JSON.stringify(errors));
              if(after.products<=before.products||after.products>before.products+36||after.width>after.viewport+4||errors.length) throw Error('Mobile load-more regression');
              console.log('CATALOG_MOBILE_PAGER_FIX_VERIFIED');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/emdo-pager-verify.cjs
      - name: Restore production modules on any failed verification
        if: failure()
        shell: bash
        run: |
          set -u
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive -p "$PORT" "$STAGING_USER@$STAGING_HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -u
          RUN="$1"
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          A="/tmp/emdo-pager-batch-before-$RUN.php"
          B="/tmp/emdo-pager-manual-before-$RUN.php"
          test -s "$A" && cp -p "$A" "$ROOT/wp-content/themes/elmercadodeorigen-child/inc/catalog-filter-scroll-final-010234.php"
          test -s "$B" && cp -p "$B" "$ROOT/wp-content/mu-plugins/mdo-catalog-manual-pagination-20261009.php"
          echo 'PAGER_PRODUCTION_FILES_RESTORED_IF_BACKUPS_EXIST'
          REMOTE

name: Audit live blog product recommendations 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-product-images-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published post content on production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true)
          php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in *elmercadodeorigen.com*) PROD_PATH="$p"; break;; esac
          done
          : "${PROD_PATH:?production path not found}"

          "$php" -d memory_limit=512M "$wp" eval '
            $posts = get_posts(array(
              "post_type" => "post",
              "post_status" => "publish",
              "posts_per_page" => -1,
              "orderby" => "date",
              "order" => "DESC",
              "suppress_filters" => true,
            ));
            $patterns = array(
              "shortcode_products" => "/\\[(?:products|product|product_category|best_selling_products|featured_products|sale_products)\\b/i",
              "woo_blocks" => "/woocommerce\\/(?:product|handpicked-products|product-collection)|wc-block-(?:grid|product)/i",
              "product_urls" => "~https?://(?:www\\.)?elmercadodeorigen\\.com/(?:producto|product)/~i",
              "related_copy" => "/productos?\\s+(?:relacionados|recomendados)|nuestros?\\s+productos?|m[aá]s\\s+vendidos/i",
            );
            $found = array();
            foreach ($posts as $post) {
              $content = (string) $post->post_content;
              $hits = array();
              foreach ($patterns as $key => $pattern) {
                if (preg_match($pattern, $content)) $hits[] = $key;
              }
              if (!$hits) continue;
              preg_match_all("/\\[(?:products|product|product_category|best_selling_products|featured_products|sale_products)[^\\]]*\\]/i", $content, $shortcodes);
              preg_match_all("~https?://(?:www\\.)?elmercadodeorigen\\.com/[^\\s\"<>]+~i", $content, $urls);
              $product_urls = array_values(array_filter(array_unique($urls[0] ?? array()), static fn($u) => preg_match("~/(?:producto|product)/~i", $u)));
              $found[] = array(
                "id" => (int) $post->ID,
                "date" => substr((string)$post->post_date, 0, 10),
                "slug" => $post->post_name,
                "title" => html_entity_decode($post->post_title, ENT_QUOTES | ENT_HTML5, "UTF-8"),
                "permalink" => home_url("/" . $post->post_name . "/"),
                "hits" => $hits,
                "shortcodes" => array_values(array_unique($shortcodes[0] ?? array())),
                "product_urls" => array_slice($product_urls, 0, 12),
              );
            }
            echo wp_json_encode($found, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
          ' --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root
          REMOTE

name: Verify blog product images across live posts 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-blog-product-images-20260831.php'
      - '.github/workflows/blog-product-images-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin
        run: php -l mu-plugins/mdo-blog-product-images-20260831.php

      - name: Find production and current product-post URLs
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          echo "SCP=$SCP" >> "$GITHUB_ENV"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' > targets.tsv <<REMOTE
          set -euo pipefail
          wp=\$(command -v wp || true); php=\$(command -v php || true)
          [ -n "\$php" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "\$php" -d memory_limit=512M "\$wp" eval '
            global \$wpdb;
            \$rows = \$wpdb->get_results("SELECT ID, post_title, post_content FROM {\$wpdb->posts} WHERE post_type=\"post\" AND post_status=\"publish\" ORDER BY post_date DESC");
            \$out = array();
            foreach (\$rows as \$row) {
              \$c = (string) \$row->post_content;
              if (!preg_match("/\\[(?:products|product|product_category|best_selling_products|featured_products|sale_products)\\b/i", \$c) && !preg_match("/woocommerce\\/(?:product|handpicked-products|product-collection)|wc-block-(?:grid|product)/i", \$c)) continue;
              \$out[] = array((int)\$row->ID, get_permalink((int)\$row->ID), wp_strip_all_tags((string)\$row->post_title));
              if (count(\$out) >= 12) break;
            }
            foreach (\$out as \$r) echo \$r[0]."\\t".\$r[1]."\\t".\$r[2]."\\n";
          ' --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root
          REMOTE
          echo 'TARGETS:'
          cat targets.tsv
          test -s targets.tsv

      - name: Deploy exact repository repair to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          NAME='mdo-blog-product-images-20260831.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; [ ! -f '$TARGET' ] || cp -p '$TARGET' '$BACKUP'; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'; sha256sum '$TARGET'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp=\$(command -v wp || true); php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -d memory_limit=512M \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php\" -d memory_limit=512M \"\$wp\" eval 'if ( function_exists(\"wp_cache_flush\") ) wp_cache_flush(); if ( has_action(\"litespeed_purge_all\") ) do_action(\"litespeed_purge_all\");' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify all sampled live articles in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time, sys

          targets=[]
          with open('targets.tsv', encoding='utf-8') as f:
              for line in f:
                  parts=line.rstrip('\n').split('\t', 2)
                  if len(parts)>=2: targets.append((parts[0],parts[1],parts[2] if len(parts)>2 else ''))

          errors=[]; pages_ok=0; cards_checked=0; images_ok=0
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for idx,(post_id,base,title) in enumerate(targets):
                  contexts=[('desktop',{'viewport':{'width':1440,'height':1100}})]
                  if idx == 0:
                      contexts.append(('mobile',{'viewport':{'width':390,'height':844},'is_mobile':True,'device_scale_factor':1}))
                  for mode,opts in contexts:
                      page=browser.new_page(**opts)
                      sep='&' if '?' in base else '?'
                      response=page.goto(f'{base}{sep}mdo_verify={int(time.time()*1000)}',wait_until='domcontentloaded',timeout=90000)
                      page.wait_for_timeout(1800)
                      status=response.status if response else 0
                      css=page.locator('#mdo-blog-product-images-20260831-css').count()
                      js=page.locator('#mdo-blog-product-images-20260831-js').count()
                      cards=page.locator('ul.products li.product')
                      count=cards.count()
                      page_errors=[]
                      if status != 200: page_errors.append(f'HTTP {status}')
                      if css != 1 or js != 1: page_errors.append(f'plugin markers css={css} js={js}')
                      if count < 1: page_errors.append('no classic product cards rendered')
                      good=0
                      for i in range(count):
                          card=cards.nth(i)
                          card.scroll_into_view_if_needed(); page.wait_for_timeout(100)
                          ok=card.evaluate('''c => [...c.querySelectorAll('img')].some(img => {
                            const r=img.getBoundingClientRect(), s=getComputedStyle(img);
                            return img.naturalWidth>40 && img.naturalHeight>40 && r.width>60 && r.height>60 && s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)>0;
                          })''')
                          cards_checked += 1
                          if ok: good += 1; images_ok += 1
                          else: page_errors.append(f'card {i+1} has no visible loaded image')
                      print(f'CHECK post={post_id} mode={mode} status={status} cards={count} visible_images={good} title={title}')
                      if page_errors:
                          errors.extend([f'{post_id}/{mode}: {e}' for e in page_errors])
                      else:
                          pages_ok += 1
                      page.close()
              browser.close()

          print(f'SUMMARY pages_ok={pages_ok} targets={len(targets)} cards_checked={cards_checked} images_ok={images_ok}')
          if errors:
              print('ERRORS:'); print('\n'.join('- '+e for e in errors)); sys.exit(1)
          print('BLOG_PRODUCT_IMAGES_VERIFIED=true')
          PY

      - name: Roll back if verification fails
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          NAME='mdo-blog-product-images-20260831.php'; TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Clean backup after success
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

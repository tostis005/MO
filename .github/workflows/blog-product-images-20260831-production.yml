name: Find live blog product cards 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-product-images-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Find current published posts containing WooCommerce products
        id: target
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          result="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true)
          php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in *elmercadodeorigen.com*) PROD_PATH="$p"; break;; esac
          done
          : "${PROD_PATH:?production path not found}"

          "$php" -d memory_limit=512M "$wp" eval '
            global $wpdb;
            $rows = $wpdb->get_results(
              "SELECT ID, post_name, post_title, post_content FROM {$wpdb->posts} WHERE post_type = \"post\" AND post_status = \"publish\" ORDER BY post_date DESC"
            );
            $matches = array();
            foreach ($rows as $row) {
              $content = (string) $row->post_content;
              $kind = "";
              if (preg_match("/\\[(?:products|product|product_category|best_selling_products|featured_products|sale_products)\\b/i", $content)) {
                $kind = "shortcode";
              } elseif (preg_match("/woocommerce\\/(?:product|handpicked-products|product-collection)|wc-block-(?:grid|product)/i", $content)) {
                $kind = "block";
              }
              if (!$kind) continue;
              $matches[] = array(
                "id" => (int) $row->ID,
                "slug" => (string) $row->post_name,
                "title" => wp_strip_all_tags((string) $row->post_title),
                "kind" => $kind,
                "url" => get_permalink((int) $row->ID),
              );
              if (count($matches) >= 8) break;
            }
            foreach ($matches as $m) {
              echo $m["id"]."\t".$m["kind"]."\t".$m["url"]."\t".$m["title"]."\n";
            }
          ' --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root
          REMOTE
          )"

          echo 'CURRENT PRODUCT-POST MATCHES:'
          printf '%s\n' "$result"
          first="$(printf '%s\n' "$result" | awk -F '\t' 'NF>=4 {print; exit}')"
          [ -n "$first" ] || { echo 'No published post with WooCommerce product markup found'; exit 1; }
          TARGET_ID="$(printf '%s' "$first" | cut -f1)"
          TARGET_KIND="$(printf '%s' "$first" | cut -f2)"
          TARGET_URL="$(printf '%s' "$first" | cut -f3)"
          echo "id=$TARGET_ID" >> "$GITHUB_OUTPUT"
          echo "kind=$TARGET_KIND" >> "$GITHUB_OUTPUT"
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "TARGET_ID=$TARGET_ID"
          echo "TARGET_KIND=$TARGET_KIND"
          echo "TARGET_URL=$TARGET_URL"

      - name: Inspect exact live card DOM with Chromium
        shell: bash
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, os, time

          base = os.environ['TARGET_URL']
          sep = '&' if '?' in base else '?'
          url = f'{base}{sep}mdo_card_inspect={int(time.time())}'
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 1440, 'height': 1200})
              response = page.goto(url, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(1500)
              report = page.evaluate('''() => {
                const selectors = {
                  classic: 'ul.products li.product',
                  grid: '.wc-block-grid__product',
                  template: '.wc-block-product-template > li',
                  blockProduct: '.wc-block-product',
                  allProductish: '[class*="product"]'
                };
                const counts = Object.fromEntries(Object.entries(selectors).map(([k,s]) => [k, document.querySelectorAll(s).length]));
                const cardSelector = counts.classic ? selectors.classic : (counts.grid ? selectors.grid : (counts.template ? selectors.template : selectors.blockProduct));
                const cards = [...document.querySelectorAll(cardSelector)].slice(0,4).map(card => ({
                  tag: card.tagName,
                  className: card.className || '',
                  text: (card.textContent || '').trim().replace(/\s+/g,' ').slice(0,220),
                  images: [...card.querySelectorAll('img')].map(img => ({
                    className: img.className || '',
                    src: img.getAttribute('src') || '',
                    currentSrc: img.currentSrc || '',
                    dataSrc: img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || '',
                    naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight,
                    display: getComputedStyle(img).display,
                    visibility: getComputedStyle(img).visibility,
                    opacity: getComputedStyle(img).opacity
                  })),
                  html: card.outerHTML.slice(0,1800)
                }));
                return {
                  title: document.title,
                  url: location.href,
                  bodyClass: document.body.className,
                  counts,
                  cardSelector,
                  headings: [...document.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h => h.textContent.trim()).filter(Boolean).slice(0,30),
                  cards
                };
              }''')
              report['status'] = response.status if response else None
              print('LIVE_CARD_DOM=' + json.dumps(report, ensure_ascii=False))
              browser.close()
          PY

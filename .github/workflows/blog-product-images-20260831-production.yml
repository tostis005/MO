name: Inspect live blog product card DOM 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-product-images-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production article DOM
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          urls = [
              'https://www.elmercadodeorigen.com/jamon-iberico/?mdo_dom_inspect=20260831',
              'https://www.elmercadodeorigen.com/blog/?mdo_dom_inspect=20260831',
          ]
          selectors = [
              'body.single-post',
              'main',
              'article',
              'ul.products',
              'li.product',
              '.products',
              '.product',
              '.wc-block-grid',
              '.wc-block-grid__products',
              '.wc-block-grid__product',
              '.wp-block-woocommerce-product-collection',
              '.wc-block-product-template',
              '.wc-block-product',
              '[class*="product-card"]',
              '[class*="related"]',
              '[class*="recommend"]',
              '[class*="woocommerce"] img',
              'article img',
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width':1440,'height':1000})
              for url in urls:
                  response = page.goto(url, wait_until='networkidle', timeout=120000)
                  page.wait_for_timeout(1200)
                  report = page.evaluate('''sels => {
                    const headings=[...document.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h=>h.textContent.trim()).filter(Boolean);
                    const matches={};
                    for (const s of sels) matches[s]=document.querySelectorAll(s).length;
                    const interesting=[...document.querySelectorAll('h1,h2,h3,h4,h5,h6,p,a,button')]
                      .filter(n=>/producto|jam[oó]n|paleta|embutido|relacion|vendid/i.test(n.textContent||''))
                      .slice(0,40)
                      .map(n=>({tag:n.tagName,cls:n.className||'',text:(n.textContent||'').trim().slice(0,180)}));
                    const productish=[...document.querySelectorAll('[class*="product"],[class*="woocommerce"],[class*="related"],[class*="recommend"]')]
                      .slice(0,40)
                      .map(n=>({tag:n.tagName,cls:n.className||'',text:(n.textContent||'').trim().replace(/\s+/g,' ').slice(0,220),html:n.outerHTML.slice(0,600)}));
                    return {url:location.href,title:document.title,bodyClass:document.body.className,headings,matches,interesting,productish};
                  }''', selectors)
                  report['status'] = response.status if response else None
                  print('===PAGE===')
                  print(json.dumps(report,ensure_ascii=False,indent=2))
              browser.close()
          PY

name: Deploy and verify blog product images 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-blog-product-images-20260831.php'
      - '.github/workflows/blog-product-images-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate repair plugin
        run: php -l mu-plugins/mdo-blog-product-images-20260831.php

      - name: Deploy repair plugin to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH=$SSH" >> "$GITHUB_ENV"

          NAME='mdo-blog-product-images-20260831.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp=\$(command -v wp || true); php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -d memory_limit=512M \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php\" -d memory_limit=512M \"\$wp\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify affected article in a real browser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, sys, time

          url = f'https://www.elmercadodeorigen.com/?p=3327&mdo_blog_images_verify={int(time.time())}'
          report = {'requested_url': url}
          errors = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width': 1440, 'height': 1200}, device_scale_factor=1)
              response = page.goto(url, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(1800)
              report['status'] = response.status if response else None
              report['final_url'] = page.url
              report['title'] = page.title()
              report['body_class'] = page.locator('body').get_attribute('class') or ''
              report['plugin_css'] = page.locator('#mdo-blog-product-images-20260831-css').count()
              report['plugin_js'] = page.locator('#mdo-blog-product-images-20260831-js').count()

              classic = page.locator('ul.products li.product')
              report['classic_card_count'] = classic.count()
              report['block_card_count'] = page.locator('.wc-block-grid__product,.wc-block-product,.wc-block-product-template > li').count()
              report['headings'] = page.locator('h1,h2,h3,h4,h5,h6').all_text_contents()

              if report['plugin_css'] != 1 or report['plugin_js'] != 1:
                  errors.append('repair plugin is not active on the affected article')
              if report['classic_card_count'] < 2:
                  errors.append(f'expected classic WooCommerce product cards; found {report["classic_card_count"]}')

              report['cards'] = []
              for i in range(min(report['classic_card_count'], 16)):
                  card = classic.nth(i)
                  card.scroll_into_view_if_needed()
                  page.wait_for_timeout(250)
                  data = card.evaluate('''card => {
                    const imgs = [...card.querySelectorAll('img')].map(img => {
                      const r = img.getBoundingClientRect();
                      const s = getComputedStyle(img);
                      return {
                        className: img.className || '',
                        src: img.currentSrc || img.getAttribute('src') || '',
                        attrSrc: img.getAttribute('src') || '',
                        dataSrc: img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || '',
                        naturalWidth: img.naturalWidth,
                        naturalHeight: img.naturalHeight,
                        width: Math.round(r.width),
                        height: Math.round(r.height),
                        display: s.display,
                        visibility: s.visibility,
                        opacity: s.opacity
                      };
                    });
                    const visible = imgs.filter(x =>
                      x.naturalWidth > 40 && x.naturalHeight > 40 &&
                      x.width > 80 && x.height > 80 &&
                      x.display !== 'none' && x.visibility !== 'hidden' && Number(x.opacity) > 0
                    );
                    return {
                      className: card.className || '',
                      title: (card.querySelector('.woocommerce-loop-product__title,.product-title,h2,h3')?.textContent || '').trim(),
                      repaired: card.classList.contains('mdo-blog-product-image-repaired-20260831'),
                      visibleImageCount: visible.length,
                      images: imgs,
                      html: card.outerHTML.slice(0, 3500)
                    };
                  }''')
                  report['cards'].append(data)
                  if data['visibleImageCount'] < 1:
                      errors.append(f'card {i + 1} ({data["title"] or "untitled"}) has no visible loaded image')

              page.screenshot(path='blog-products-verification.png', full_page=True)
              browser.close()

          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              print('VERIFICATION_ERRORS:')
              print('\n'.join('- ' + error for error in errors))
              sys.exit(1)
          print('BLOG_PRODUCT_IMAGES_VERIFIED=true')
          PY

      - name: Roll back production on failed verification
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          NAME='mdo-blog-product-images-20260831.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          if [ -f "${BACKUP:-}" ]; then :; fi
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Remove deployment backup after success
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

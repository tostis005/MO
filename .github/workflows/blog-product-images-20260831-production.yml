name: Deploy and verify blog product images 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-blog-product-images-20260831.php'
      - '.github/workflows/blog-product-images-20260831-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin
        run: php -l mu-plugins/mdo-blog-product-images-20260831.php

      - name: Deploy to production and flush cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          NAME='mdo-blog-product-images-20260831.php'
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP "mu-plugins/$NAME" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; [ ! -f '$TARGET' ] || cp -p '$TARGET' '$BACKUP'; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp=\$(command -v wp || true); php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php\" \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php\" \"\$wp\" eval 'if ( function_exists(\"wp_cache_flush\") ) wp_cache_flush(); if ( has_action(\"litespeed_purge_all\") ) do_action(\"litespeed_purge_all\");' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify with Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, sys
          errors=[]; report={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              page.goto('https://www.elmercadodeorigen.com/jamon-iberico/?mdo_blog_images_verify=20260831v2',wait_until='networkidle',timeout=120000)
              page.wait_for_selector('body.single-post ul.products li.product',timeout=60000)
              cards=page.locator('body.single-post ul.products li.product')
              report['count']=cards.count()
              report['css']=page.locator('#mdo-blog-product-images-20260831-css').count()
              report['js']=page.locator('#mdo-blog-product-images-20260831-js').count()
              if report['count'] < 3: errors.append(f'only {report["count"]} product cards')
              if report['css'] != 1 or report['js'] != 1: errors.append('repair plugin markup missing')
              report['cards']=[]
              for i in range(min(report['count'],12)):
                  card=cards.nth(i); card.scroll_into_view_if_needed(); page.wait_for_timeout(350)
                  d=card.evaluate('''c=>{const q='img.product-loop-image,img.attachment-woocommerce_thumbnail,img.wp-post-image,.product-loop-image-wrapper img,img.mdo-blog-related-product-image-20260831';const a=[...c.querySelectorAll(q)].map(i=>{const r=i.getBoundingClientRect(),s=getComputedStyle(i);return{src:i.currentSrc||i.src||'',nw:i.naturalWidth,nh:i.naturalHeight,w:r.width,h:r.height,d:s.display,v:s.visibility,o:s.opacity}});return{ok:a.some(x=>x.nw>40&&x.nh>40&&x.w>80&&x.h>80&&x.d!=='none'&&x.v!=='hidden'&&Number(x.o)>0),images:a}}''')
                  report['cards'].append(d)
                  if not d['ok']: errors.append(f'card {i+1} has no visible loaded product image')
              browser.close()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:
              print('ERRORS:\n'+'\n'.join('- '+e for e in errors)); sys.exit(1)
          print('BLOG_PRODUCT_IMAGES_VERIFIED=true')
          PY

      - name: Roll back if verification fails
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          NAME='mdo-blog-product-images-20260831.php'; TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"; BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Clean backup
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          NAME='mdo-blog-product-images-20260831.php'; BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

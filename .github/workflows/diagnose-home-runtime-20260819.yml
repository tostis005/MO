name: Diagnose Home runtime 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-home-runtime-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture live Home runtime details
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          python3 - <<'PY' > runtime/diagnose-home-runtime-20260819.txt
          from pathlib import Path
          import re
          html=Path('/tmp/home.html').read_text(encoding='utf-8',errors='replace')
          lines=html.splitlines()
          print('html_bytes=',len(html.encode()))
          for needle in ['hustle_inline_styles_front-inline-css','hustle-ui','facebook-for-woocommerce-signals.js','pixel-events.js','clientParamBuilder.bundle.js','theme.js','trp-frontend-language-switcher.js']:
              print(needle,'=',html.count(needle))
          m=re.search(r'<style[^>]*id=["\']hustle_inline_styles_front-inline-css["\'][^>]*>(.*?)</style>',html,re.I|re.S)
          print('hustle_inline_css_bytes=',len(m.group(1).encode()) if m else 0)
          for needle in ['facebook-for-woocommerce-signals.js','pixel-events.js','clientParamBuilder.bundle.js']:
              print('\n### context',needle)
              for i,line in enumerate(lines,1):
                  if needle in line:
                      for j in range(max(1,i-4),min(len(lines),i+5)+1): print(f'{j}: {lines[j-1][:1000]}')
          for a,b in [(680,710),(2690,2720)]:
              print(f'\n### lines {a}-{b}')
              for j in range(a,min(len(lines),b)+1): print(f'{j}: {lines[j-1][:1000]}')
          PY
          cat runtime/diagnose-home-runtime-20260819.txt
      - name: Record diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/diagnose-home-runtime-20260819.txt
          git commit -m 'Record Home runtime dependency diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

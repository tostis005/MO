name: Producer toolbar mobile final live

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-mobile-final-live-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: php -l mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php

      - name: Deploy and verify live mobile toolbar
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          python -m pip install --quiet selenium
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/producer-toolbar-mobile-final-live-20260821.txt
          EXIT=.deploy-status/producer-toolbar-mobile-final-live-20260821.exit-code
          : > "$STATUS"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          DEST="$PROD_PATH/wp-content/mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php"
          BAK="/tmp/mdo-producer-mobile-final-${GITHUB_RUN_ID}.bak"
          REMOTE="/tmp/mdo-producer-mobile-final-${GITHUB_RUN_ID}.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "[ ! -f '$DEST' ] || cp '$DEST' '$BAK'"
          rollback(){
            echo 'ROLLBACK producer toolbar mobile final live' | tee -a "$STATUS"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
              if [ -f '$BAK' ]; then cp '$BAK' '$DEST'; else rm -f '$DEST'; fi
              rm -f '$REMOTE' '$BAK'
              wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            " || true
          }
          fail(){ echo "FAIL: $1" | tee -a "$STATUS"; rollback; echo 2 > "$EXIT"; exit 2; }

          sshpass -e scp $SCP_OPTIONS mu-plugins/zzzzzzzz-mdo-producer-toolbar-mobile-polish-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            cp '$REMOTE' '$DEST'; rm -f '$REMOTE'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$DEST'
            wp_bin=\$(command -v wp || true); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
          " >> "$STATUS" 2>&1 || fail 'deploy/lint failed'

          for path in /tienda/1957/ /en/store/1957/ /tienda/ /productores/; do
            code=$(curl -ksS -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com$path?mobile-final=$GITHUB_RUN_ID")
            echo "HTTP $code $path" | tee -a "$STATUS"
            [ "$code" = 200 ] || fail "HTTP $code $path"
          done

          set +e
          python - <<'PY' >> "$STATUS" 2>&1
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='https://www.elmercadodeorigen.com'
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=o); d.set_window_size(390,900)
          try:
              for path in ('/tienda/1957/','/en/store/1957/'):
                  d.get(base+path+'?mobile-final=1'); time.sleep(2.4)
                  # Consent can legitimately cover the page in a clean browser; dismiss it before testing page controls.
                  for el in d.find_elements(By.XPATH,"//button[contains(translate(normalize-space(.),'ACEPTARACCEPT','aceptaraccept'),'aceptar') or contains(translate(normalize-space(.),'ACEPTARACCEPT','aceptaraccept'),'accept')]"):
                      try:
                          if el.is_displayed():
                              d.execute_script('arguments[0].click()',el); time.sleep(.5); break
                      except Exception: pass
                  w=WebDriverWait(d,20)
                  host=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woostify-sorting.elmercado-vendor-sorting-normalized')))
                  trig=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .mdo-catalog-destination__trigger')))
                  label=trig.find_element(By.CSS_SELECTOR,':scope > span')
                  form=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woocommerce-ordering')))
                  sel=w.until(EC.visibility_of_element_located((By.CSS_SELECTOR,'#wcfmmp-store .woocommerce-ordering select')))
                  m=d.execute_script('''
                    const [host,trig,label,form,sel]=arguments;
                    const cs=n=>getComputedStyle(n), r=sel.getBoundingClientRect();
                    const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                    const tr=trig.getBoundingClientRect(), lr=label.getBoundingClientRect();
                    return {
                      hostH:host.getBoundingClientRect().height,
                      triggerH:tr.height,labelH:lr.height,labelScrollH:label.scrollHeight,
                      labelText:label.textContent.trim(),labelChildren:label.children.length,
                      labelTop:lr.top,labelBottom:lr.bottom,triggerTop:tr.top,triggerBottom:tr.bottom,
                      formBorder:[cs(form).borderTopWidth,cs(form).borderRightWidth,cs(form).borderBottomWidth,cs(form).borderLeftWidth],
                      formShadow:cs(form).boxShadow,selectBorder:cs(sel).borderTopWidth,
                      hitIsSelect:hit===sel,hitTag:hit?.tagName||'',pointer:cs(sel).pointerEvents,
                      options:sel.options.length
                    };
                  ''',host,trig,label,form,sel)
                  print('MOBILE_FINAL',path,m)
                  assert 135 <= m['hostH'] <= 150, m
                  assert 38 <= m['triggerH'] <= 42, m
                  assert m['labelChildren'] == 0, m
                  assert m['labelScrollH'] <= m['labelH'] + 1, m
                  assert m['labelTop'] >= m['triggerTop'] - 1 and m['labelBottom'] <= m['triggerBottom'] + 1, m
                  assert all(v=='0px' for v in m['formBorder']), m
                  assert m['formShadow']=='none', m
                  assert m['selectBorder'] in ('1px','0.8px'), m
                  assert m['hitIsSelect'] and m['pointer']=='auto', m
                  assert m['options'] > 1, m
                  # Native pointer events must reach the select and remain uncancelled.
                  d.execute_script('''window.__mdo=[]; for(const t of ['pointerdown','mousedown']) arguments[0].addEventListener(t,e=>window.__mdo.push([t,e.defaultPrevented]),{once:true});''',sel)
                  d.execute_script('''const r=arguments[0].getBoundingClientRect(); const x=r.left+r.width/2,y=r.top+r.height/2; for(const t of ['pointerdown','mousedown']) arguments[0].dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y}));''',sel)
                  ev=d.execute_script('return window.__mdo')
                  print('NATIVE_EVENTS',path,ev)
                  assert ev == [['pointerdown',False],['mousedown',False]], ev
              print('producer_toolbar_mobile_final_live_ok')
          finally:
              d.quit()
          PY
          BC=$?
          set -e
          [ "$BC" = 0 ] || fail 'mobile visual/interaction verification failed'

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BAK'" || true
          echo 'producer_toolbar_mobile_final_live_production_ok' | tee -a "$STATUS"
          echo 0 > "$EXIT"

      - name: Record result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-mobile-final-live-20260821.* || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record producer toolbar mobile final live [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

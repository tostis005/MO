name: Montjam normalize format addon 2026-09-23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/montjam-normalize-format-addon-20260923.yml'
      - '.github/scripts/montjam-normalize-format-addon-20260923.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          set -euo pipefail
          php -l .github/scripts/montjam-normalize-format-addon-20260923.php >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Fix production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          REMOTE="/tmp/montjam-normalize-format-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/montjam-normalize-format-addon-20260923.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc"

      - name: Verify FORMAT on all seven public product pages
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico-montjam/"
            "https://www.elmercadodeorigen.com/producto/jamon-de-bellota-iberico-50-montjam/"
            "https://www.elmercadodeorigen.com/producto/jamon-bellota-100-iberico-dop-jabugo-montjam/"
            "https://www.elmercadodeorigen.com/producto/jamon-cebo-de-campo-iberico-50-montjam/"
            "https://www.elmercadodeorigen.com/producto/paleta-de-bellota-100-iberica-montjam/"
            "https://www.elmercadodeorigen.com/producto/paleta-bellota-100-iberica-dop-jabugo-montjam/"
            "https://www.elmercadodeorigen.com/producto/paleta-cebo-de-campo-iberica-50-montjam/"
          )
          for url in "${urls[@]}"; do
            html="$(curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "${url}?format-check=${GITHUB_RUN_ID}")"
            grep -Fq 'FORMATO' <<<"$html"
            grep -Fq 'Pieza entera' <<<"$html"
            grep -Fq 'Loncheado a cuchillo' <<<"$html"
            grep -Fq 'Deshuesado' <<<"$html"
            echo "FORMAT_OK $url"
          done

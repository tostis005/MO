name: Authority cannibalization cleanup production 2026-09-02

on:
  push:
    branches: [main]
    paths:
      - '.cleanup-triggers/authority-cannibalization-cleanup-20260902.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate cleanup scripts
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/cleanup-authority-cannibalization-20260902.part{1,2,3,4}.b64 > /tmp/cleanup-authority.b64
          test "$(sha256sum .github/scripts/cleanup-authority-cannibalization-20260902.part1.b64 | awk '{print $1}')" = '8e5d842997270fda2e08bb0b2682f34bbfef9852180d456bd3e60d3766873614'
          test "$(sha256sum .github/scripts/cleanup-authority-cannibalization-20260902.part2.b64 | awk '{print $1}')" = '29ac666b87377b91cbcd6847596530e3a754ad343c35ae3a3028e49ce885d87f'
          test "$(sha256sum .github/scripts/cleanup-authority-cannibalization-20260902.part3.b64 | awk '{print $1}')" = '716565aec684bf62c7e6e872a0bdb9f9bec6579d8487b19b5f06306a2733c1ca'
          test "$(sha256sum .github/scripts/cleanup-authority-cannibalization-20260902.part4.b64 | awk '{print $1}')" = 'e7dda3b443086e2298bfddf46e01ff38eaa4b00bec3c101c24dbe9d5c1892789'
          base64 -d /tmp/cleanup-authority.b64 > /tmp/cleanup-authority.gz
          test "$(sha256sum /tmp/cleanup-authority.gz | awk '{print $1}')" = '5751326c965863a1297dea844dd8859027cdecbd79f9adf5a17d8efd770b7b9e'
          gzip -dc /tmp/cleanup-authority.gz > /tmp/cleanup-authority-cannibalization-20260902.php
          test "$(sha256sum /tmp/cleanup-authority-cannibalization-20260902.php | awk '{print $1}')" = '33fe59067b2aa2dd324083fe942545e2ea7a0c4165dfcc38c22e733dc470a934'
          php -l /tmp/cleanup-authority-cannibalization-20260902.php
          php -l .github/scripts/emdo-authority-redirects-20260902.php
      - name: Apply cleanup to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          REMOTE="/tmp/emdo-authority-cleanup-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS /tmp/cleanup-authority-cannibalization-20260902.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e scp $SCP_OPTIONS .github/scripts/emdo-authority-redirects-20260902.php "$STAGING_USER@$STAGING_HOST:/tmp/emdo-authority-redirects-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins' && cp '/tmp/emdo-authority-redirects-${GITHUB_RUN_ID}.php' '$PROD_PATH/wp-content/mu-plugins/emdo-authority-redirects-20260902.php' && rm -f '/tmp/emdo-authority-redirects-${GITHUB_RUN_ID}.php'"
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" 2>&1 | tee /tmp/authority-cleanup.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0
          grep -Fq 'EMDO_AUTHORITY_CLEANUP_BEGIN' /tmp/authority-cleanup.txt
          grep -Fq '"marker":"2026-09-02.authority-cleanup.v1"' /tmp/authority-cleanup.txt
          grep -Fq 'EMDO_AUTHORITY_CLEANUP_END' /tmp/authority-cleanup.txt
      - name: Verify database and redirects
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'foreach ([14040,14041,14042,14043,14044,14045,14046,14047,14048,14049] as \$id) { if (get_post_status(\$id)!==\"publish\") { fwrite(STDERR,\"canonical not published \$id\\n\"); exit(21); } } foreach ([14061,14062,14063,14064,14065,14066,14067,14068,14069,14070] as \$id) { if (get_post_status(\$id)===\"publish\" || get_post_meta(\$id,\"_en_US_published\",true)===\"1\") { fwrite(STDERR,\"duplicate still public \$id\\n\"); exit(22); } } \$m=get_option(\"emdo_authority_redirects_20260902\",[]); if(count(\$m)<20){fwrite(STDERR,\"redirect map too small\\n\");exit(23);} echo \"DB_CLEANUP_OK redirects=\".count(\$m).\"\\n\";' --path='$PROD_PATH' --allow-root"
          base='https://www.elmercadodeorigen.com'
          olds=(
            maduracion-queso-proteolisis-lipolisis-aroma-textura
            lavado-cuajada-queso-que-es-por-que-se-hace-sabor-textura
            ph-acidez-queso-que-miden-textura-sabor-seguridad
            humedad-actividad-agua-queso-diferencias-textura-conservacion
            cuanta-leche-hace-falta-kilo-queso-rendimiento-factores
            suero-queso-que-es-que-contiene-usos-ricotta-requeson
            por-que-queso-blanco-amarillo-anaranjado-color-leche-carotenoides
            tamano-formato-queso-influye-maduracion-ruedas-piezas
            mohos-levaduras-queso-maduracion-flora-deterioro
            como-transportar-queso-cadena-frio-envios-viajes-recepcion
          )
          for slug in "${olds[@]}"; do
            headers="$(curl -sS -D - -o /dev/null --max-time 40 "$base/$slug/?verify=$GITHUB_RUN_ID")"
            echo "$headers" | head -n 8
            echo "$headers" | grep -Eq '^HTTP/[^ ]+ 301'
            echo "$headers" | grep -Eiq '^location: https://www\.elmercadodeorigen\.com/'
          done
          canon=(
            como-madura-queso-temperatura-humedad-microbiota-tiempo
            lavado-cuajada-queso-que-es-como-cambia-sabor-textura
            ph-acidez-queso-por-que-importan-textura-sabor-seguridad
            humedad-queso-como-cambia-textura-maduracion-conservacion
            cuantos-litros-leche-hacen-falta-1-kg-queso-rendimiento
            suero-leche-queseria-que-es-que-ocurre-despues-hacer-queso
            por-que-queso-blanco-amarillo-naranja-leche-maduracion-colorantes
            tamano-formato-queso-como-influye-maduracion
            mohos-levaduras-queso-intencionados-que-hacen-maduracion
            como-transportar-queso-viaje-coche-avion-cadena-frio
          )
          for slug in "${canon[@]}"; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 40 "$base/$slug/?verify=$GITHUB_RUN_ID")"
            test "$code" = 200
          done
          for slug in quesos-andalucia-variedades-zonas-productoras-tradicion-quesera quesos-sierra-grazalema-cabra-payoya-origen-tipos-caracteristicas principales-zonas-productoras-aceite-oliva-espana-como-cambia-aove-origen aceites-andalucia-zonas-productoras-dop-variedades-perfiles-sabor aceites-jaen-zonas-denominaciones-origen-variedades-caracteristicas aceites-cordoba-zonas-denominaciones-origen-variedades-caracteristicas; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 40 "$base/$slug/?verify=$GITHUB_RUN_ID")"
            test "$code" = 200
          done
          echo 'AUTHORITY_CANNIBALIZATION_CLEANUP_VERIFY_OK'

name: Visible production English audit v2 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-visible-audit-v2-20260815.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Export URL inventory
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          cat > /tmp/inv.php <<'PHP'
          <?php
          if(!defined('ABSPATH'))exit(1);$o=['pages'=>[],'products'=>[]];foreach(get_posts(['post_type'=>'page','post_status'=>'publish','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC'])as$p)$o['pages'][]=['id'=>$p->ID,'slug'=>$p->post_name,'title'=>$p->post_title];foreach(get_posts(['post_type'=>'product','post_status'=>'publish','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC'])as$p)$o['products'][]=['id'=>$p->ID,'slug'=>$p->post_name,'title'=>$p->post_title];echo wp_json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          sshpass -e scp $SCP_OPTIONS /tmp/inv.php "$STAGING_USER@$STAGING_HOST:/tmp/inv.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file /tmp/inv.php --path='$PROD_PATH' --allow-root 2>/dev/null" > url-inventory.json
          python - <<'PY'
          import json
          d=json.load(open('url-inventory.json')); print('pages',len(d['pages']),'products',len(d['products'])); assert len(d['pages'])==22 and len(d['products'])==62
          PY
      - run: npm install --no-save puppeteer-core@24 >/dev/null
      - name: Audit visible English text concurrently
        shell: bash
        run: |
          set -euo pipefail
          cat > ./visible-audit.mjs <<'JS'
          import fs from 'fs'; import puppeteer from 'puppeteer-core';
          const inv=JSON.parse(fs.readFileSync('url-inventory.json','utf8')); const items=[];
          for(const p of inv.pages){if(p.slug!=='finalizar-compra')items.push({kind:'page',id:p.id,sourceTitle:p.title,url:`https://www.elmercadodeorigen.com/en/${p.slug}/`});}
          for(const p of inv.products)items.push({kind:'product',id:p.id,sourceTitle:p.title,url:`https://www.elmercadodeorigen.com/en/producto/${p.slug}/`});
          const maps={}; for(const f of fs.readdirSync('.github/data/native-translations-20260815').filter(f=>f.endsWith('.json')))Object.assign(maps,JSON.parse(fs.readFileSync('.github/data/native-translations-20260815/'+f,'utf8')));
          const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
          const originals=Object.keys(maps).filter(x=>{const n=norm(x);return n.length>=8&&n.length<=350&&!/^https?:/.test(n)&&!n.includes('@')&&/[a-záéíóúñü]/i.test(n);}).map(x=>({raw:x,n:norm(x)}));
          const esWords=new Set('el la los las un una unos unas de del al en para por con sin que se su sus este esta estos estas nuestro nuestra nuestros nuestras producto productos tienda envío envíos pedido pedidos precio peso carne ternera jamón paleta aceite cerdo ibérico información ingredientes añadir comprar filtros resultados contacto nosotros vosotros descuento regalo piezas pieza aproximado bandeja elaborado procedente'.split(' '));
          const enWords=new Set('the a an of to in for by with without that this these our product products shop shipping order orders price weight beef ham oil information ingredients add buy filters results contact about from made approximately tray your'.split(' '));
          function suspiciousLines(text){const out=[]; for(const raw of String(text||'').split(/\n+/)){const line=raw.replace(/\s+/g,' ').trim();if(line.length<18||line.length>700)continue;const words=(line.toLowerCase().match(/[a-záéíóúñü]+/g)||[]);let es=0,en=0;for(const w of words){if(esWords.has(w))es++;if(enWords.has(w))en++;}if(/[¿¡áéíóúñ]/i.test(line))es+=2;if(es>=4&&es>en+1)out.push(line);}return [...new Set(out)].slice(0,20);}
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          let cursor=0; const results=[];
          async function one(item){const p=await browser.newPage();await p.setRequestInterception(true);p.on('request',r=>{const t=r.resourceType();if(['image','font','media'].includes(t))r.abort();else r.continue();});let resp,err='';try{resp=await p.goto(item.url+`?mdo_visible_audit=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:25000});}catch(e){err=e.message;}let data={text:'',title:'',lang:'',selector:false};try{data=await p.evaluate(()=>({text:document.body?.innerText||'',title:document.title||'',lang:document.documentElement.lang||'',selector:!!document.querySelector('.mdo-language-switcher,.trp-language-switcher,.trp-floater-ls')}));}catch(e){err ||= e.message;}await p.close();const t=norm(data.text);const exact=[];for(const o of originals){if(exact.length>=20)break;if(t.includes(o.n))exact.push(o.raw);}return {...item,status:resp?.status()||0,lang:data.lang,title:data.title,selector:data.selector,exactOriginals:exact,spanishLines:suspiciousLines(data.text),err};}
          async function worker(){while(true){const i=cursor++;if(i>=items.length)return;const r=await one(items[i]);results[i]=r;console.log(`${i+1}/${items.length} ${r.status} ${r.kind}#${r.id} exact=${r.exactOriginals.length} spanish=${r.spanishLines.length} selector=${r.selector?'YES':'no'} ${r.url}`);if(r.exactOriginals.length)console.log(' EXACT',JSON.stringify(r.exactOriginals.slice(0,8)));if(r.spanishLines.length)console.log(' SPANISH',JSON.stringify(r.spanishLines.slice(0,5)));if(r.err)console.log(' ERR',r.err);}}
          await Promise.all(Array.from({length:6},worker)); await browser.close(); fs.writeFileSync('visible-audit-results.json',JSON.stringify(results,null,2));
          const summary={total:results.length,bad:results.filter(r=>r.status!==200||r.err).length,selectors:results.filter(r=>r.selector).length,exactPages:results.filter(r=>r.exactOriginals.length).length,spanishPages:results.filter(r=>r.spanishLines.length).length};console.log('SUMMARY',JSON.stringify(summary)); if(summary.bad||summary.selectors)process.exitCode=2;
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./visible-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-visible-english-audit-v2-20260815
          path: |
            url-inventory.json
            visible-audit-results.json
          retention-days: 2

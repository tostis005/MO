name: Diagnose EMDO minimum order source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-emdo-minimum-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH helper
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Inspect production minimum-order implementation
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" bash -s -- "$PROD_PATH" <<'REMOTE' > /tmp/emdo-minimum-diagnostic.txt
          set -euo pipefail
          WP_ROOT="$1"
          WP_BIN=$(command -v wp || true)
          PHP_BIN=$(command -v php || true)
          [ -n "$PHP_BIN" ] || PHP_BIN=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)

          echo '=== Relevant plugin / MU-plugin paths ==='
          find "$WP_ROOT/wp-content/plugins" "$WP_ROOT/wp-content/mu-plugins" -maxdepth 3 -type f -name '*.php' 2>/dev/null \
            | grep -Ei '/(emdo|mdo|minimum|shipping|pedido|order)' \
            | sed "s#^$WP_ROOT/##" \
            | head -n 150 || true

          echo
          echo '=== Source references to minimum order ==='
          grep -RniE --include='*.php' 'pedido.{0,30}(mínimo|minimo)|min[_ -]?order|minimum[_ -]?order|minimum.{0,20}amount|order.{0,20}minimum' \
            "$WP_ROOT/wp-content/plugins" "$WP_ROOT/wp-content/mu-plugins" 2>/dev/null \
            | sed "s#^$WP_ROOT/##" \
            | head -n 300 || true

          echo
          echo '=== User-meta keys containing minimum/order terms ==='
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval '
            global $wpdb;
            $keys = $wpdb->get_col("SELECT DISTINCT meta_key FROM {$wpdb->usermeta} WHERE meta_key LIKE \"%min%\" OR meta_key LIKE \"%order%\" ORDER BY meta_key");
            foreach ($keys as $key) { echo $key, "\n"; }
          ' --path="$WP_ROOT" --allow-root 2>/dev/null | head -n 250 || true

          echo
          echo '=== Option names containing EMDO/minimum terms ==='
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval '
            global $wpdb;
            $names = $wpdb->get_col("SELECT option_name FROM {$wpdb->options} WHERE option_name LIKE \"%emdo%\" OR option_name LIKE \"%minimum%\" OR option_name LIKE \"%min_order%\" ORDER BY option_name");
            foreach ($names as $name) { echo $name, "\n"; }
          ' --path="$WP_ROOT" --allow-root 2>/dev/null | head -n 250 || true
          REMOTE

          mkdir -p .deploy-status
          cp /tmp/emdo-minimum-diagnostic.txt .deploy-status/emdo-minimum-diagnostic.txt
          cat .deploy-status/emdo-minimum-diagnostic.txt

      - name: Record diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/emdo-minimum-diagnostic.txt
          git commit -m 'Record EMDO minimum-order diagnostic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish home critical CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-home-critical-css.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elmercado-critical-css-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate comprehensive first-view CSS
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 postcss@8 cssnano@7 >/dev/null 2>&1
          cat > generate-critical.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const puppeteer = require('puppeteer-core');
          const postcss = require('postcss');
          const cssnano = require('cssnano');
          const base = 'https://dev.elmercadodeorigen.com';
          const output = 'elmercadodeorigen-child/assets/css/critical-woostify-home.min.css';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const mergeRanges = (ranges) => {
            const sorted = [...ranges].sort((a, b) => a.start - b.start);
            const merged = [];
            for (const range of sorted) {
              const last = merged[merged.length - 1];
              if (last && range.start <= last.end) last.end = Math.max(last.end, range.end);
              else merged.push({ start: range.start, end: range.end });
            }
            return merged;
          };

          const intersects = (node, ranges) => {
            const start = node.source?.start?.offset;
            const end = node.source?.end?.offset;
            if (!Number.isInteger(start) || !Number.isInteger(end)) return false;
            return ranges.some((range) => range.start <= end + 1 && range.end >= start);
          };

          const filterContainer = (container, ranges) => {
            const clone = container.clone({ nodes: [] });
            for (const child of container.nodes || []) {
              if (child.type === 'atrule' && Array.isArray(child.nodes)) {
                const nested = filterContainer(child, ranges);
                if ((nested.nodes || []).length || intersects(child, ranges)) clone.append(nested);
                continue;
              }
              if (child.type === 'rule') {
                if (intersects(child, ranges) || (child.nodes || []).some((node) => intersects(node, ranges))) clone.append(child.clone());
                continue;
              }
              if (intersects(child, ranges)) clone.append(child.clone());
            }
            return clone;
          };

          async function collect(browser, viewport, userAgent = '') {
            const page = await browser.newPage();
            await page.setViewport(viewport);
            if (userAgent) await page.setUserAgent(userAgent);
            await page.coverage.startCSSCoverage({ resetOnNavigation: false });
            await page.goto(`${base}/?critical-publish=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await sleep(1400);
            const entries = await page.coverage.stopCSSCoverage();
            await page.close();
            return entries;
          }

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox', '--disable-gpu'] });
            const mobile = await collect(browser, { width: 390, height: 844, isMobile: true, deviceScaleFactor: 1 }, 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1');
            const desktop = await collect(browser, { width: 1440, height: 1000, deviceScaleFactor: 1 });
            await browser.close();

            const registry = new Map();
            for (const entries of [mobile, desktop]) {
              for (const entry of entries) {
                const text = entry.text || '';
                if (!text.trim() || !(entry.ranges || []).length) continue;
                const digest = crypto.createHash('sha1').update(text).digest('hex');
                const key = `${entry.url || 'inline'}|${digest}`;
                if (!registry.has(key)) registry.set(key, { url: entry.url || 'inline', text, ranges: [] });
                registry.get(key).ranges.push(...entry.ranges);
              }
            }

            const parts = [];
            let sourceBytes = 0;
            let usedSources = 0;
            let totalRanges = 0;
            for (const entry of registry.values()) {
              const ranges = mergeRanges(entry.ranges);
              if (!ranges.length) continue;
              sourceBytes += Buffer.byteLength(entry.text);
              totalRanges += ranges.length;
              try {
                const root = postcss.parse(entry.text);
                const filtered = filterContainer(root, ranges);
                const css = filtered.toString().trim();
                if (css) {
                  parts.push(css);
                  usedSources++;
                }
              } catch (error) {
                console.warn(`Skipping unparsable coverage source ${entry.url}: ${error.message}`);
              }
            }

            const result = await postcss([cssnano({ preset: 'default' })]).process(parts.join('\n'), { from: undefined });
            const critical = result.css.trim();
            if (!critical || critical.length < 12000) throw new Error(`Comprehensive critical CSS is unexpectedly small: ${critical.length} bytes.`);
            if (critical.length > 160000) throw new Error(`Comprehensive critical CSS is unexpectedly large: ${critical.length} bytes.`);
            postcss.parse(critical);
            fs.mkdirSync(path.dirname(output), { recursive: true });
            fs.writeFileSync(output, `/* Generated from all CSS used in the first mobile and desktop viewport. */\n${critical}\n`);
            console.log(JSON.stringify({ sourceBytes, criticalBytes: critical.length, usedSources, totalRanges, coveragePercent: Math.round((critical.length / sourceBytes) * 1000) / 10 }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node generate-critical.cjs

      - name: Commit generated critical CSS
        shell: bash
        run: |
          set -euo pipefail
          TARGET='elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Critical CSS is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'perf: publish comprehensive Home critical CSS'
          git push

# Manual refresh trigger: 2026-08-10 comprehensive performance review.

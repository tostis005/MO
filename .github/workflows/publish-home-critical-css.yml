name: Publish home critical CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-home-critical-css.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elmercado-critical-css-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate geometric first-view CSS
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 postcss@8 cssnano@7 >/dev/null 2>&1
          cat > generate-critical.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const puppeteer = require('puppeteer-core');
          const postcss = require('postcss');
          const cssnano = require('cssnano');
          const base = 'https://dev.elmercadodeorigen.com';
          const output = 'elmercadodeorigen-child/assets/css/critical-woostify-home.min.css';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function collect(browser, viewport, userAgent = '') {
            const page = await browser.newPage();
            await page.setViewport(viewport);
            if (userAgent) await page.setUserAgent(userAgent);
            await page.goto(`${base}/?critical-geometry=${Date.now()}`, { waitUntil: 'networkidle2', timeout: 90000 });
            await sleep(500);

            const result = await page.evaluate(() => {
              const vh = window.innerHeight;
              const vw = window.innerWidth;
              const interactive = /:(hover|active|focus|focus-visible|focus-within|visited)(?![-\w])/g;

              const splitSelectors = (selectorText) => {
                const out = []; let current = ''; let depth = 0;
                for (const ch of selectorText) {
                  if (ch === '(' || ch === '[') depth++;
                  if (ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
                  if (ch === ',' && depth === 0) { if (current.trim()) out.push(current.trim()); current = ''; continue; }
                  current += ch;
                }
                if (current.trim()) out.push(current.trim());
                return out;
              };

              const visibleForSelector = (raw) => {
                let selector = raw
                  .replace(/::(before|after|marker|first-letter|first-line|placeholder|selection)/g, '')
                  .replace(/:(before|after)(?![-\w])/g, '')
                  .replace(interactive, '');
                if (!selector.trim()) return false;
                try {
                  const nodes = document.querySelectorAll(selector);
                  for (const node of nodes) {
                    const style = getComputedStyle(node);
                    if (style.display === 'none' || style.visibility === 'hidden') continue;
                    for (const rect of node.getClientRects()) {
                      if (rect.bottom > -2 && rect.top < vh + 2 && rect.right > -2 && rect.left < vw + 2 && rect.width >= 0 && rect.height >= 0) return true;
                    }
                  }
                } catch (_) {}
                return false;
              };

              const styleRuleVisible = (rule) => splitSelectors(rule.selectorText || '').some(visibleForSelector);

              const walk = (rules, prefix) => {
                const collected = [];
                for (let i = 0; i < rules.length; i++) {
                  const rule = rules[i];
                  const key = `${prefix}.${i}`;
                  if (rule.type === CSSRule.STYLE_RULE) {
                    if (styleRuleVisible(rule)) collected.push({ key, text: rule.cssText });
                    continue;
                  }
                  if (rule.type === CSSRule.MEDIA_RULE) {
                    if (!matchMedia(rule.conditionText).matches) continue;
                    const children = walk(rule.cssRules, key);
                    if (children.length) collected.push({ key, text: `@media ${rule.conditionText}{${children.map(x => x.text).join('')}}` });
                    continue;
                  }
                  if (rule.type === CSSRule.SUPPORTS_RULE) {
                    const children = walk(rule.cssRules, key);
                    if (children.length) collected.push({ key, text: `@supports ${rule.conditionText}{${children.map(x => x.text).join('')}}` });
                    continue;
                  }
                  if (rule.type === CSSRule.FONT_FACE_RULE || rule.type === CSSRule.KEYFRAMES_RULE) {
                    collected.push({ key, text: rule.cssText });
                  }
                }
                return collected;
              };

              const all = [];
              [...document.styleSheets].forEach((sheet, sheetIndex) => {
                try {
                  const rules = sheet.cssRules;
                  if (!rules) return;
                  for (const item of walk(rules, `s${sheetIndex}`)) all.push(item);
                } catch (_) {}
              });
              return { items: all, sheetCount: document.styleSheets.length };
            });
            await page.close();
            return result;
          }

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox', '--disable-gpu'] });
            const mobile = await collect(browser, { width: 390, height: 844, isMobile: true, deviceScaleFactor: 1 }, 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1');
            const desktop = await collect(browser, { width: 1440, height: 1000, deviceScaleFactor: 1 });
            await browser.close();

            const merged = new Map();
            for (const item of mobile.items) merged.set(item.key, item.text);
            for (const item of desktop.items) if (!merged.has(item.key)) merged.set(item.key, item.text);
            const source = [...merged.values()].join('\n');
            const result = await postcss([cssnano({ preset: 'default' })]).process(source, { from: undefined });
            const critical = result.css.trim();
            if (!critical || critical.length < 12000) throw new Error(`Geometric critical CSS is unexpectedly small: ${critical.length} bytes.`);
            if (critical.length > 100000) throw new Error(`Geometric critical CSS is unexpectedly large: ${critical.length} bytes.`);
            postcss.parse(critical);
            fs.mkdirSync(path.dirname(output), { recursive: true });
            fs.writeFileSync(output, `/* Generated from CSS rules affecting the actual first mobile and desktop viewport. */\n${critical}\n`);
            console.log(JSON.stringify({ criticalBytes: critical.length, mobileRules: mobile.items.length, desktopRules: desktop.items.length, mergedRules: merged.size, mobileSheets: mobile.sheetCount, desktopSheets: desktop.sheetCount }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node generate-critical.cjs

      - name: Commit generated critical CSS
        shell: bash
        run: |
          set -euo pipefail
          TARGET='elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Critical CSS is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'perf: publish geometric Home critical CSS'
          git push

# Manual refresh trigger: 2026-08-10 geometric performance review.

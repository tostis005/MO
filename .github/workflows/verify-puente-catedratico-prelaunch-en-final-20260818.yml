name: Verify Puente/Catedrático prelaunch English final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-puente-catedratico-prelaunch-en-final-20260818.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production read-only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/mdo-final-verify-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/verify-puente-catedratico-prelaunch-en-final-20260818.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root 2>/dev/null; rc=\$?; rm -f '$REMOTE'; exit \$rc" > runtime/prelaunch-puente-catedratico-final-verify-20260818.json
          RC=$?
          set -e
          jq . runtime/prelaunch-puente-catedratico-final-verify-20260818.json >/dev/null
          jq -e '.ok==true and .total==201 and .ready==201 and .published_en==0 and (.missing_fields|length)==0 and (.bad_patterns|length)==0 and (.bad_slugs|length)==0 and (.duplicate_slugs|length)==0 and .vendors["Puente Robles"].total==106 and .vendors["El Catedrático"].total==95' runtime/prelaunch-puente-catedratico-final-verify-20260818.json >/dev/null
          test "$RC" -eq 0
      - name: Commit verification evidence
        if: always()
        run: |
          set -e
          git config user.name github-actions
          git config user.email github-actions@github.com
          if [ -f runtime/prelaunch-puente-catedratico-final-verify-20260818.json ]; then
            git add -f runtime/prelaunch-puente-catedratico-final-verify-20260818.json
            git commit -m 'Record final Puente/Catedrático English verification' || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Production Selectos navigation timeout fix 0.10.316

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/functions.php'
      - 'elmercadodeorigen-child/inc/product-navigation-performance-010237.php'
      - '.github/workflows/production-selectos-navigation-timeout-fix-010316.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-selectos-nav-fix-010316
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l elmercadodeorigen-child/functions.php >/dev/null
          php -l elmercadodeorigen-child/inc/product-navigation-performance-010237.php >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '0.10.316'" elmercadodeorigen-child/functions.php
          grep -q 'elmercado_wcfm_hidden_vendor_ids_010210' elmercadodeorigen-child/inc/product-navigation-performance-010237.php
          ! grep -q "elmercado_wcfm_disabled_visibility_can_view_010210()" elmercadodeorigen-child/inc/product-navigation-performance-010237.php

      - name: Install SSH tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup and deploy fix
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          THEME="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          FUNCTIONS="$THEME/functions.php"
          MODULE="$THEME/inc/product-navigation-performance-010237.php"
          BACKUP="/tmp/elmercado-nav-010316-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$BACKUP'; cp -p '$FUNCTIONS' '$BACKUP/functions.php'; cp -p '$MODULE' '$BACKUP/product-navigation-performance-010237.php'"

          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "FUNCTIONS=$FUNCTIONS" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

          sshpass -e scp $SCP elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:$FUNCTIONS"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/product-navigation-performance-010237.php "$STAGING_USER@$STAGING_HOST:$MODULE"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PROD_PATH' '$FUNCTIONS' '$MODULE'" <<'REMOTE'
          set -eu
          prod="$1"; functions="$2"; module="$3"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          "$php_bin" -l "$functions" >/dev/null
          "$php_bin" -l "$module" >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '0.10.316'" "$functions"
          grep -q 'elmercado_wcfm_hidden_vendor_ids_010210' "$module"
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true
          REMOTE

          PROBE="elmercado-opcache-nav-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          for i in $(seq 1 6); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-store' -H 'Pragma: no-cache' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID-$i" 2>/dev/null || true)"
            if printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$'; then break; fi
            [ "$i" -lt 6 ] || exit 1
            sleep 2
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'"

      - name: Verify admin navigation no longer loops
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUT="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PROD_PATH'" <<'REMOTE'
          set -eu
          prod="$1"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          cat >/tmp/verify-nav-010316.php <<'PHP'
          <?php
          global $wpdb,$post;
          $p=get_page_by_path('foie-gras-de-pato-extra-desvenado',OBJECT,'product');
          if(!$p) throw new RuntimeException('Control product missing');
          $post=$p; setup_postdata($post);
          $admins=get_users(array('role'=>'administrator','number'=>1,'fields'=>'ids'));
          wp_set_current_user((int)($admins[0]??0));
          $q=$wpdb->num_queries; $t=microtime(true);
          $next=woostify_get_next_product();
          $elapsed=microtime(true)-$t;
          $result=array(
            'version'=>defined('ELMERCADO_THEME_VERSION')?ELMERCADO_THEME_VERSION:'',
            'current'=>(int)$p->ID,
            'next'=>$next?$next->get_id():0,
            'next_slug'=>$next?get_post_field('post_name',$next->get_id()):'',
            'elapsed'=>round($elapsed,4),
            'queries'=>$wpdb->num_queries-$q,
          );
          echo wp_json_encode($result,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
          if('0.10.316'!==$result['version'] || !$next || $elapsed>5){
            throw new RuntimeException('Admin product navigation still slow');
          }
          PHP
          timeout 12s "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file /tmp/verify-nav-010316.php --path="$prod" --allow-root
          REMOTE
          )"
          printf '%s\n' "$OUT"
          grep -q '"version":"0.10.316"' <<< "$OUT"
          grep -q '"next":' <<< "$OUT"

          for slug in foie-gras-de-pato-extra-desvenado foie-gras-mi-cuit-entero-mini-estuche magret-de-pato-fresco jamon-de-pato-ahumado-pieza; do
            result="$(curl -ksSL --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code} %{time_starttransfer} %{time_total}' -H 'Cache-Control: no-store' "$BASE_URL/producto/$slug/?navfix=$GITHUB_RUN_ID")"
            echo "$slug $result"
            test "${result%% *}" = "200"
          done
          echo PRODUCTION_SELECTOS_NAV_010316_OK

      - name: Cleanup
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$BACKUP'"
          echo PRODUCTION_SELECTOS_NAV_010316_CLEAN

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -n "${BACKUP:-}" ] && [ -n "${FUNCTIONS:-}" ] && [ -n "${MODULE:-}" ]; then
            PORT="${STAGING_PORT:-22}"
            SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; cp -p '$BACKUP/functions.php' '$FUNCTIONS'; cp -p '$BACKUP/product-navigation-performance-010237.php' '$MODULE'; rm -rf '$BACKUP'"
          fi
          echo PRODUCTION_SELECTOS_NAV_010316_ROLLED_BACK

name: YITH WAPO variation internals audit 2026-09-23
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yith-wapo-variation-internals-audit-20260923.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect YITH WAPO production code paths
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            PROD_PATH=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;; esac
            done
            : "$PROD_PATH"
            echo "=== YITH plugin dirs ==="
            find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -type d -iname "*yith*add*" -o -iname "*wapo*" | head -20
            PLUG=$(find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -type d \( -iname "*product-add-ons*" -o -iname "*wapo*" \) | head -1)
            echo "PLUGIN=$PLUG"
            echo "=== variation/AJAX references ==="
            grep -RniE "variation_id|data-product-id|get_blocks|product_id.*variation|variation.*product_id|load.*addon|ajax.*addon|wapo.*variation" "$PLUG" --include="*.php" --include="*.js" 2>/dev/null | head -220
          '

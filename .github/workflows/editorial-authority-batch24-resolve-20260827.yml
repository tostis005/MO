name: Editorial authority batch 24 resolve by slugs 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch24-resolve-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve posts by slug and restore batch metadata
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          CODE=/tmp/ab24-resolve.php
          cat > "$CODE" <<'PHP'
          <?php
          $expected=array(
            'tomate-harinoso-por-que-ocurre-textura-como-evitarlo'=>'mealy-tomato-guide',
            'verduras-temporada-espana-calendario-meses-que-comprar'=>'seasonal-vegetables-spain-calendar-guide',
            'como-lavar-verduras-correctamente-agua-vinagre-bicarbonato'=>'how-to-wash-vegetables-guide',
            'morcon-vs-chorizo-diferencias-carne-tripa-curacion-sabor'=>'morcon-vs-chorizo-guide',
            'cana-de-lomo-y-lomo-embuchado-son-lo-mismo-diferencias'=>'cana-de-lomo-vs-lomo-embuchado-guide',
          );
          $default=(int)get_option('emdo_default_blog_featured_attachment_id',0);
          echo "default=$default\n";
          if($default<=0 || 'attachment'!==get_post_type($default)){throw new RuntimeException('Default image missing');}
          $resolved=array();
          foreach($expected as $slug=>$key){
            $p=get_page_by_path($slug,OBJECT,'post');
            if(!$p instanceof WP_Post){echo "missing slug=$slug\n";continue;}
            $id=(int)$p->ID;$resolved[$key]=$id;
            wp_update_post(array('ID'=>$id,'post_status'=>'publish'));
            update_post_meta($id,'_emdo_authority_key',$key);
            update_post_meta($id,'_emdo_authority_batch','24');
            update_post_meta($id,'_thumbnail_id',$default);
            update_post_meta($id,'_emdo_uses_default_featured','1');
            update_post_meta($id,'_emdo_editorial_image_approved_id',$default);
            update_post_meta($id,'_emdo_editorial_cover_asset_id','emdo-blog-default-featured');
            update_post_meta($id,'_emdo_editorial_cover_brand_safe','1');
            clean_post_cache($id);
            echo "resolved key=$key id=$id slug=$slug en=".get_post_meta($id,'_en_US_post_name',true)."\n";
          }
          echo "resolved_count=".count($resolved)."\n";
          if(count($resolved)!==5){throw new RuntimeException('Could not resolve all five batch24 posts');}
          PHP
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          sshpass -e scp $SCP "$CODE" "$STAGING_USER@$STAGING_HOST:/tmp/ab24-resolve.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval 'require \"/tmp/ab24-resolve.php\";' --path='$PROD' --skip-plugins --skip-themes --allow-root; '$PHP' '$WP' db query \"SELECT k.meta_value,p.ID,p.post_status,p.post_name,en.meta_value,thumb.meta_value,marker.meta_value FROM wp_posts p JOIN wp_postmeta k ON k.post_id=p.ID AND k.meta_key='_emdo_authority_key' AND k.meta_value IN ('mealy-tomato-guide','seasonal-vegetables-spain-calendar-guide','how-to-wash-vegetables-guide','morcon-vs-chorizo-guide','cana-de-lomo-vs-lomo-embuchado-guide') LEFT JOIN wp_postmeta en ON en.post_id=p.ID AND en.meta_key='_en_US_post_name' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' LEFT JOIN wp_postmeta marker ON marker.post_id=p.ID AND marker.meta_key='_emdo_uses_default_featured' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root; rm -f /tmp/ab24-resolve.php" | tee /tmp/ab24-resolve-output.txt
          grep -E $'^(mealy-tomato-guide|seasonal-vegetables-spain-calendar-guide|how-to-wash-vegetables-guide|morcon-vs-chorizo-guide|cana-de-lomo-vs-lomo-embuchado-guide)\t' /tmp/ab24-resolve-output.txt > /tmp/ab24-db.txt
          cat /tmp/ab24-db.txt
          test "$(wc -l < /tmp/ab24-db.txt)" -eq 5
          test "$(awk -F '\t' '$3=="publish"{n++} END{print n+0}' /tmp/ab24-db.txt)" -eq 5
          test "$(awk -F '\t' '$7==1{n++} END{print n+0}' /tmp/ab24-db.txt)" -eq 5
          test "$(awk -F '\t' '{print $6}' /tmp/ab24-db.txt | sort -u | wc -l)" -eq 1

      - name: Verify ten public views
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; marker="$2"; f=/tmp/ab24-page.html; echo "checking $url"; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$f" -w '%{http_code}' "$url?ab24resolve=$stamp"); test "$c" = 200; grep -Fq "EMDO_AUTHORITY_BATCH24:$marker" "$f"; grep -Eq 'class="[^"]*products|class="[^"]*product' "$f"; ! grep -Fq '[products ' "$f"; grep -Fq 'emo-article-featured' "$f"; grep -Fq 'el-mercado-de-origen-blog-provisional-' "$f"; }
          check "$BASE/tomate-harinoso-por-que-ocurre-textura-como-evitarlo/" mealy-tomato-guide
          check "$BASE/en/mealy-tomato-why-it-happens-texture-how-to-avoid-it/" mealy-tomato-guide
          check "$BASE/verduras-temporada-espana-calendario-meses-que-comprar/" seasonal-vegetables-spain-calendar-guide
          check "$BASE/en/seasonal-vegetables-in-spain-calendar-by-month-what-to-buy/" seasonal-vegetables-spain-calendar-guide
          check "$BASE/como-lavar-verduras-correctamente-agua-vinagre-bicarbonato/" how-to-wash-vegetables-guide
          check "$BASE/en/how-to-wash-vegetables-properly-water-vinegar-baking-soda/" how-to-wash-vegetables-guide
          check "$BASE/morcon-vs-chorizo-diferencias-carne-tripa-curacion-sabor/" morcon-vs-chorizo-guide
          check "$BASE/en/morcon-vs-chorizo-differences-meat-casing-curing-flavour/" morcon-vs-chorizo-guide
          check "$BASE/cana-de-lomo-y-lomo-embuchado-son-lo-mismo-diferencias/" cana-de-lomo-vs-lomo-embuchado-guide
          check "$BASE/en/cana-de-lomo-vs-lomo-embuchado-are-they-the-same/" cana-de-lomo-vs-lomo-embuchado-guide

      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os
          rows=[]
          for line in open('/tmp/ab24-db.txt',encoding='utf-8'):
              p=line.rstrip('\n').split('\t')
              rows.append({'key':p[0],'id':int(p[1]),'status':p[2],'slug':p[3],'en_slug':p[4],'thumbnail_id':int(p[5]),'provisional':p[6]})
          data={'batch':24,'release':'20260827','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':True,'uses_shared_provisional_image':True,'resolved_by_slug':True,'posts':rows}
          open('.deploy-status/editorial-authority-batch24-20260827.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch24-20260827.json
          git commit -m 'Record verified editorial authority batch 24 publication [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

name: Storefront residual debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/storefront-residual-debug.yml']

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect mobile menu and commerce states
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > debug.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const base='https://dev.elmercadodeorigen.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const shown=n=>{const r=n.getBoundingClientRect(),s=getComputedStyle(n);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>0};
          async function go(p,path){await p.goto(base+path+(path.includes('?')?'&':'?')+'qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});await p.addStyleTag({content:'#cookie-law-info-bar,#cookie-law-info-again,#ht-ctc-chat{display:none!important}'}).catch(()=>{});await sleep(900)}
          (async()=>{
            const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:'new',args:['--no-sandbox']});
            const products=await fetch(`${base}/wp-json/wc/store/v1/products?per_page=100`).then(r=>r.json());
            const simple=products.find(p=>p.is_purchasable&&p.is_in_stock&&p.type==='simple');
            console.log('PRODUCT',simple&&{id:simple.id,name:simple.name,permalink:simple.permalink});
            const ctx=await b.createBrowserContext();
            const p=await ctx.newPage();await p.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:1});
            await go(p,'/');
            const toggle=await p.$('.site-header .toggle-sidebar-menu-btn');if(toggle){await toggle.click();await sleep(600)}
            console.log('MENU',await p.evaluate(()=>({open:document.documentElement.classList.contains('sidebar-menu-open'), candidates:[...document.querySelectorAll('.sidebar-menu button,.sidebar-menu a,body>button,body>[class*="close"],.sidebar-menu [class*="close"]')].filter(shown).map(n=>{const r=n.getBoundingClientRect();return{tag:n.tagName,cls:n.className||'',aria:n.getAttribute('aria-label'),title:n.getAttribute('title'),text:(n.textContent||'').trim().slice(0,60),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}).filter(x=>x.y<100)})));
            if(toggle){await toggle.click().catch(()=>{});await sleep(300)}
            if(simple){
              await go(p,`/contacto/?add-to-cart=${simple.id}`);await go(p,'/carrito/');
              console.log('CART_MOBILE',await p.evaluate(()=>({items:document.querySelectorAll('.woocommerce-cart-form .cart_item,.woocommerce-cart-form__cart-item,tr.cart_item').length,badges:[...document.querySelectorAll('.site-header .shop-cart-count,.site-header .shopping-cart-count,.site-header .cart-count,.site-header .count,.site-header .mini-cart-count,.site-header .elmercado-cart-direct-count')].map(n=>({text:n.textContent.trim(),shown:shown(n),cls:n.className}))})));
              const coupon=await p.$('input[name="coupon_code"]');if(coupon){await coupon.type('CUPON-INVALIDO-XYZ');const apply=await p.$('button[name="apply_coupon"],input[name="apply_coupon"]');if(apply){const nav=p.waitForNavigation({waitUntil:'domcontentloaded',timeout:6000}).catch(()=>null);await apply.click();await nav;await sleep(1200)}}
              console.log('COUPON',await p.evaluate(()=>({url:location.href,text:(document.body.innerText.match(/.{0,80}(cup[oó]n|coupon).{0,120}/gi)||[]).slice(0,8),notices:[...document.querySelectorAll('[class*="notice"],[class*="error"],[role="alert"]')].filter(shown).map(n=>({cls:n.className||'',text:(n.textContent||'').trim().replace(/\s+/g,' ').slice(0,220)})).slice(0,12)})));
              await go(p,'/finalizar-compra/');
              console.log('CHECKOUT_MOBILE',await p.evaluate(()=>({url:location.href,form:!!document.querySelector('form.checkout,#customer_details,.woocommerce-checkout'),empty:/carrito.*vac[ií]o|tu carrito est[aá] vac[ií]o/i.test(document.body.innerText),title:document.title})));
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node debug.cjs

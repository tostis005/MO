name: Home CLS cache bust 0.10.256 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cls-cache-bust-010256-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-flush-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy current CLS plugin and flush Home cache
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          REMOTE="/tmp/elmercado-home-cls-cache-bust-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            TARGET='$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            install -m 0644 '$REMOTE' \"\$TARGET\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$TARGET\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'if (function_exists("elmercado_flush_home_cache")) { elmercado_flush_home_cache(); echo "home-cache-flushed\\n"; } else { echo "home-cache-function-missing\\n"; }' --path='$PROD_PATH' --allow-root
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$REMOTE'
          "
      - name: Warm and verify first paint rules
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          HTML=$(mktemp)
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          grep -q 'id="elmercado-home-cls-010256"' "$HTML"
          grep -q 'body.home .topbar{display:none!important;}' "$HTML"
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/firstpaint.txt
          const { chromium }=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:90000});
            const s=await page.evaluate(()=>{const t=document.querySelector('.topbar'),h=document.querySelector('.site-header'),c=document.querySelector('#content');const one=e=>e?{display:getComputedStyle(e).display,y:e.getBoundingClientRect().y,height:e.getBoundingClientRect().height}:null;return {topbar:one(t),header:one(h),content:one(c),hasCss:!!document.querySelector('#elmercado-home-cls-010256')};});
            console.log(JSON.stringify(s,null,2));
            await browser.close();
            if(!s.hasCss || !s.topbar || s.topbar.display!=='none' || s.topbar.height!==0 || !s.header || Math.abs(s.header.y-35)>1 || !s.content || Math.abs(s.content.y-95)>1) process.exit(12);
          })().catch(e=>{console.error(e);process.exit(13)});
          JS
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'deploy=%s\n' '${{ steps.deploy.outcome }}'
            printf 'verify=%s\n' '${{ steps.verify.outcome }}'
            cat /tmp/firstpaint.txt
          } > runtime/home-cls-cache-bust-010256.txt
      - name: Record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          if [ ! -f runtime/home-cls-cache-bust-010256.txt ]; then printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-cls-cache-bust-010256.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-cls-cache-bust-010256.txt
          git commit -m 'Record Home CLS cache-bust verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Upload and publish AOVE 26-27 approved Instagram image
on:
  push:
    branches: [main]
    paths:
      - '.github/assets/instagram/aove-2026-27-final.jpg'
      - '.github/scripts/instagram-aove-2026-27-runner.php'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emdo-instagram-aove-2026-27
  cancel-in-progress: false
jobs:
  upload-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate files and install SSH helper
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/instagram-aove-2026-27-runner.php
          jq -e '.status == "pending_image_public_url" and .request_id == "aove-2026-27-lechin-manzanilla-20261102" and (.caption|type) == "string"' .github/content-publish/instagram-aove-2026-27-pending.json >/dev/null
          file .github/assets/instagram/aove-2026-27-final.jpg | grep -qi 'JPEG'
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Transfer to WordPress, upload image, publish and verify Instagram
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?Production WordPress path not found}"
          REMOTE_IMAGE="/tmp/emdo-aove-2026-27-${GITHUB_RUN_ID}.jpg"
          REMOTE_POST="/tmp/emdo-aove-2026-27-${GITHUB_RUN_ID}.json"
          REMOTE_RUNNER="/tmp/emdo-aove-2026-27-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/assets/instagram/aove-2026-27-final.jpg "$STAGING_USER@$STAGING_HOST:$REMOTE_IMAGE"
          sshpass -e scp $SCP_OPTIONS .github/content-publish/instagram-aove-2026-27-pending.json "$STAGING_USER@$STAGING_HOST:$REMOTE_POST"
          sshpass -e scp $SCP_OPTIONS .github/scripts/instagram-aove-2026-27-runner.php "$STAGING_USER@$STAGING_HOST:$REMOTE_RUNNER"
          set +e
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); EMDO_IG_APPROVED_POST_FILE='$REMOTE_POST' EMDO_IG_APPROVED_IMAGE_FILE='$REMOTE_IMAGE' \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_RUNNER' --path='$PROD_PATH' --allow-root" 2>&1)"
          RC=$?
          set -e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE_IMAGE' '$REMOTE_POST' '$REMOTE_RUNNER'" || true
          printf '%s\n' "$OUTPUT"
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          RESULT="$(printf '%s\n' "$OUTPUT" | sed -n 's/^EMDO_IG_RESULT://p' | tail -n 1)"
          printf '%s\n' "$RESULT" | jq -e '.status == "published" or .status == "uploaded_pending_instagram_auth" or (.status == "skipped" and .reason == "duplicate_request_id")' > /dev/null
          printf '%s\n' "$RESULT" > .github/content-publish/instagram-aove-2026-27-publish-result.json
      - name: Record verified result
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/content-publish/instagram-aove-2026-27-publish-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/content-publish/instagram-aove-2026-27-publish-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record AOVE 26-27 Instagram publication [skip ci]'
            git push
          fi

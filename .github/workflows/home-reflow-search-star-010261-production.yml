name: CF7 guard production bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-reflow-search-star-010261-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate guard
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-cf7-antispam-20260826.php >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e scp $SCP mu-plugins/mdo-cf7-antispam-20260826.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-cf7-antispam.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l /tmp/mdo-cf7-antispam.php >/dev/null
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            install -m 0644 /tmp/mdo-cf7-antispam.php '$PROD_PATH/wp-content/mu-plugins/mdo-cf7-antispam-20260826.php'
            rm -f /tmp/mdo-cf7-antispam.php
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
            \"\$php_bin\" \"\$wp_bin\" eval 'if (!function_exists(\"mdo_cf7_guard_filter_spam\")) { fwrite(STDERR, \"guard not loaded\\n\"); exit(7); } echo \"GUARD_LOADED\\n\";' --path='$PROD_PATH' --allow-root
          "

          for URL in 'https://www.elmercadodeorigen.com/contacto/?mdo_guard_check=1' 'https://www.elmercadodeorigen.com/contacto-productores/?mdo_guard_check=1'; do
            HTML="$(curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO CF7 guard verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$URL")"
            grep -Fq 'id="mdo-cf7-antispam-guard"' <<< "$HTML"
          done

          HTML="$(curl -fsSL -A 'Mozilla/5.0 EMDO CF7 guard verifier' -H 'Cache-Control: no-cache' 'https://www.elmercadodeorigen.com/contacto/?mdo_guard_form=1')"
          FORM_ID="$(grep -o 'name="_wpcf7" value="[0-9]*"' <<< "$HTML" | head -n1 | grep -o '[0-9]*')"
          test -n "$FORM_ID"
          CHALLENGE="$(curl -fsSL -A 'Mozilla/5.0 EMDO CF7 guard verifier' -H 'Content-Type: application/json' --data "{\"form_id\":$FORM_ID}" 'https://www.elmercadodeorigen.com/wp-json/mdo/v1/cf7-guard')"
          grep -Fq '"token"' <<< "$CHALLENGE"
          echo 'CF7_ANTISPAM_PRODUCTION_OK'

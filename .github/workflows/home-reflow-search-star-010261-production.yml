name: Home reflow search star 0.10.261 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-reflow-search-star-010261-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release 0.10.261
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Release version.
          p=Path('elmercadodeorigen-child/functions.php')
          s=p.read_text()
          s=s.replace("define( 'ELMERCADO_THEME_VERSION', '0.10.260' );", "define( 'ELMERCADO_THEME_VERSION', '0.10.261' );")
          s=s.replace('/* 0.10.260 difiere la cadena wp-hooks -> gtag-events de Google for WooCommerce en Home. */', '/* 0.10.261 elimina reflows evitables de carrito/buscador y star.woff de la ruta de Home. */')
          p.write_text(s)

          # El contador ya no inspecciona estilos pseudo de todos los nodos del header.
          p=Path('elmercadodeorigen-child/inc/cart-counter-visibility-final.php')
          s=p.read_text()
          new_script=r'''\t\t<script id="elmercado-cart-counter-visibility-final-js">
\t\t(() => {
\t\t\t'use strict';

\t\t\tconst numeric = (value) => {
\t\t\t\tconst normalized = String(value ?? '').trim();
\t\t\t\treturn /^\\d+$/.test(normalized) ? Number.parseInt(normalized, 10) : null;
\t\t\t};

\t\t\tconst countFor = (node) => {
\t\t\t\tfor (const name of ['data-count', 'data-cart-count', 'data-items']) {
\t\t\t\t\tif (node.hasAttribute(name)) return numeric(node.getAttribute(name));
\t\t\t\t}
\t\t\t\treturn node.children.length === 0 ? numeric(node.textContent) : null;
\t\t\t};

\t\t\tconst sync = () => {
\t\t\t\tconst header = document.querySelector('.site-header');
\t\t\t\tif (!header) return;
\t\t\t\tconst nodes = header.querySelectorAll('[data-count],[data-cart-count],[data-items],.cart-count,.mini-cart-count,.cart-contents-count,.shopping-cart .count,.shopping-bag-button .count');
\t\t\t\tnodes.forEach((node) => {
\t\t\t\t\tconst count = countFor(node);
\t\t\t\t\tif (count === null) return;
\t\t\t\t\tconst empty = count === 0;
\t\t\t\t\tnode.classList.toggle('emo-cart-count-empty', empty);
\t\t\t\t\tnode.setAttribute('aria-hidden', empty ? 'true' : 'false');
\t\t\t\t});
\t\t\t};

\t\t\tconst start = () => {
\t\t\t\tconst header = document.querySelector('.site-header');
\t\t\t\tif (!header) return;
\t\t\t\tsync();
\t\t\t\tlet scheduled = false;
\t\t\t\tconst schedule = () => {
\t\t\t\t\tif (scheduled) return;
\t\t\t\t\tscheduled = true;
\t\t\t\t\trequestAnimationFrame(() => { scheduled = false; sync(); });
\t\t\t\t};
\t\t\t\tnew MutationObserver(schedule).observe(header, {
\t\t\t\t\tchildList: true,
\t\t\t\t\tsubtree: true,
\t\t\t\t\tcharacterData: true,
\t\t\t\t\tattributes: true,
\t\t\t\t\tattributeFilter: ['data-count', 'data-cart-count', 'data-items']
\t\t\t\t});
\t\t\t\t['wc_fragments_refreshed', 'added_to_cart', 'removed_from_cart', 'updated_wc_div'].forEach((eventName) => {
\t\t\t\t\tdocument.body.addEventListener(eventName, schedule);
\t\t\t\t});
\t\t\t};

\t\t\tif (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
\t\t\telse start();
\t\t})();
\t\t</script>'''
          s,n=re.subn(r'\t\t<script id="elmercado-cart-counter-visibility-final-js">.*?\t\t</script>',new_script,s,flags=re.S)
          if n != 1:
              raise SystemExit(f'cart script replacements={n}')
          p.write_text(s)

          # Home: FiboSearch solo se descarga cuando el usuario va a buscar; las estrellas usan glifos nativos.
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          if 'elmercado-home-fibosearch-lazy' not in s:
              needle="\tif ( '' === $html ) {\n\t\treturn $html;\n\t}\n\n"
              if needle not in s:
                  raise SystemExit('home runtime insertion point missing')
              insert=needle+r'''\t/* FiboSearch es interactivo: evita ejecutar su motor de layout antes de que el usuario abra la búsqueda. */
\t$html = preg_replace_callback(
\t\t'~<script\\b[^>]*\\bid=["\\']jquery-dgwt-wcas-js["\\'][^>]*\\bsrc=["\\']([^"\\']+search\\.min\\.js[^"\\']*)["\\'][^>]*>\\s*</script\\s*>~i',
\t\tstatic function ( array $matches ): string {
\t\t\t$src = html_entity_decode( (string) $matches[1], ENT_QUOTES, 'UTF-8' );
\t\t\treturn '<script id="elmercado-home-fibosearch-lazy">' .
\t\t\t\t'(()=>{\\'use strict\\';const src=' . wp_json_encode( $src ) . ';let loading=null,started=false;' .
\t\t\t\t'const load=()=>{if(loading)return loading;started=true;loading=new Promise((resolve,reject)=>{const s=document.createElement(\\'script\\');s.src=src;s.defer=true;s.id=\\'jquery-dgwt-wcas-js\\';s.onload=resolve;s.onerror=reject;document.head.append(s)});return loading};' .
\t\t\t\t'const selector=\\'.dgwt-wcas-search-wrapp,.dgwt-wcas-search-input,.dgwt-wcas-search-form,.site-header .search-icon,.site-header .header-search-icon,.site-header .site-search-toggle,.sidebar-menu .search-form\\';' .
\t\t\t\t'const zone=t=>t instanceof Element?t.closest(selector):null;' .
\t\t\t\t'[\\'pointerover\\',\\'focusin\\',\\'touchstart\\'].forEach(name=>document.addEventListener(name,e=>{if(zone(e.target))load()},{capture:true,passive:true}));' .
\t\t\t\t'document.addEventListener(\\'click\\',e=>{const z=zone(e.target);if(!z||started)return;const target=e.target.closest(\\'a,button,input,label\\')||z;e.preventDefault();e.stopImmediatePropagation();load().then(()=>requestAnimationFrame(()=>{if(target instanceof HTMLInputElement)target.focus();else target.click()}))},true);' .
\t\t\t\t'setTimeout(load,20000)})();</script>';
\t\t},
\t\t$html,
\t\t1
\t) ?? $html;

\t/* La fuente star de WooCommerce no es necesaria en Home; el CSS crítico dibuja las mismas cinco estrellas. */
\t$html = preg_replace( '~@font-face\\s*\\{\\s*font-family:star;[^}]*\\}~i', '', $html ) ?? $html;

'''
              s=s.replace(needle,insert,1)

          native_star="body.elmercado-premium-home .star-rating,body.elmercado-premium-home .star-rating::before,body.elmercado-premium-home .star-rating span,body.elmercado-premium-home .star-rating span::before{font-family:Arial,Helvetica,sans-serif!important;letter-spacing:.04em!important}body.elmercado-premium-home .star-rating::before{content:'★★★★★'!important;color:#d8d7d0!important}body.elmercado-premium-home .star-rating span::before{content:'★★★★★'!important;color:#d7a84f!important}"
          if '★★★★★' not in s:
              needle="\tif ( ! is_string( $critical ) || strlen( $critical ) < 12000 ) {\n\t\treturn $html;\n\t}\n\n"
              if needle not in s:
                  raise SystemExit('critical insertion point missing')
              s=s.replace(needle,needle+"\t$critical .= " + repr(native_star).replace('\\','\\\\').replace('"','\\"') + ";\n\n",1)
              # Python repr is single-quoted; normalize to a valid PHP single-quoted literal.
              s=s.replace("\t$critical .= '"+native_star.replace("'","\\'")+"';", "\t$critical .= '"+native_star.replace("'","\\'")+"';")
          p.write_text(s)
          PY

          php -l elmercadodeorigen-child/functions.php
          php -l elmercadodeorigen-child/inc/cart-counter-visibility-final.php
          php -l elmercadodeorigen-child/inc/home-cache.php
          grep -q "ELMERCADO_THEME_VERSION', '0.10.261" elmercadodeorigen-child/functions.php
          grep -q 'elmercado-home-fibosearch-lazy' elmercadodeorigen-child/inc/home-cache.php
          ! grep -q "getComputedStyle(node, '::before')" elmercadodeorigen-child/inc/cart-counter-visibility-final.php

      - name: Deploy release
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          for f in functions.php inc/cart-counter-visibility-final.php inc/home-cache.php; do
            sshpass -e scp $SCP "elmercadodeorigen-child/$f" "$STAGING_USER@$STAGING_HOST:/tmp/$(basename "$f").010261"
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            install -m 0644 /tmp/functions.php.010261 \"\$THEME/functions.php\"
            install -m 0644 /tmp/cart-counter-visibility-final.php.010261 \"\$THEME/inc/cart-counter-visibility-final.php\"
            install -m 0644 /tmp/home-cache.php.010261 \"\$THEME/inc/home-cache.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/functions.php\"
            \"\$php_bin\" -l \"\$THEME/inc/cart-counter-visibility-final.php\"
            \"\$php_bin\" -l \"\$THEME/inc/home-cache.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-0.10.260.css
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-0.10.261.css
            rm -f /tmp/*.010261
          "

      - name: Verify browser and Lighthouse
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          printf 'version=%s\n' "$(grep -c 'home-deferred-0.10.261.css' /tmp/home.html || true)" > /tmp/static.txt
          printf 'lazy_marker=%s\n' "$(grep -c 'elmercado-home-fibosearch-lazy' /tmp/home.html || true)" >> /tmp/static.txt
          printf 'direct_search_script=%s\n' "$(grep -c 'id="jquery-dgwt-wcas-js" src=' /tmp/home.html || true)" >> /tmp/static.txt
          printf 'star_font_face=%s\n' "$(grep -c 'font-family:star;src:' /tmp/home.html || true)" >> /tmp/static.txt
          printf 'cart_forced_style_read=%s\n' "$(grep -c "getComputedStyle(node, '::before')" /tmp/home.html || true)" >> /tmp/static.txt

          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/browser.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1500);
            const before=await page.evaluate(()=>({
              search:performance.getEntriesByType('resource').some(r=>r.name.includes('/ajax-search-for-woocommerce/assets/js/search.min.js')),
              star:performance.getEntriesByType('resource').some(r=>r.name.includes('/woocommerce/assets/fonts/star.woff')),
              nativeStar:getComputedStyle(document.querySelector('.star-rating'),'::before').fontFamily,
              hero:!!document.querySelector('.emo-hero__copy')
            }));
            const root=await page.$('.dgwt-wcas-search-wrapp,.dgwt-wcas-search-input');
            if(root){await root.dispatchEvent('pointerover'); await page.waitForFunction(()=>performance.getEntriesByType('resource').some(r=>r.name.includes('/ajax-search-for-woocommerce/assets/js/search.min.js')),{timeout:10000}).catch(()=>{});}
            const after=await page.evaluate(()=>({search:performance.getEntriesByType('resource').some(r=>r.name.includes('/ajax-search-for-woocommerce/assets/js/search.min.js'))}));
            console.log(JSON.stringify({errors,before,after,searchRoot:!!root},null,2));
            if(errors.length || before.search || before.star || !before.hero || (root && !after.search)) process.exitCode=2;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

          export CHROME_PATH="$CHROME"
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          python3 - <<'PY' > /tmp/lighthouse.txt
          import json
          a=json.load(open('/tmp/lhr.json'))['audits']
          for k in ('largest-contentful-paint','total-blocking-time','cumulative-layout-shift','render-blocking-resources'):
              x=a.get(k,{})
              print(f'{k}: numeric={x.get("numericValue")} display={x.get("displayValue")} score={x.get("score")}')
          for key in ('forced-reflow-insight','network-dependency-tree-insight'):
              x=a.get(key,{})
              print(key,'display=',x.get('displayValue'),'score=',x.get('score'))
          PY
          {
            echo 'deploy=success'
            cat /tmp/static.txt
            cat /tmp/browser.txt
            cat /tmp/lighthouse.txt
          } > runtime/home-reflow-search-star-010261.txt
          cat runtime/home-reflow-search-star-010261.txt
          grep -q 'lazy_marker=1' /tmp/static.txt
          grep -q 'direct_search_script=0' /tmp/static.txt
          grep -q 'star_font_face=0' /tmp/static.txt
          grep -q 'cart_forced_style_read=0' /tmp/static.txt

      - name: Commit release and verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-reflow-search-star-010261.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-reflow-search-star-010261.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/functions.php elmercadodeorigen-child/inc/cart-counter-visibility-final.php elmercadodeorigen-child/inc/home-cache.php runtime/home-reflow-search-star-010261.txt
          git commit -m 'Deploy and verify Home reflow search star 0.10.261' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Test NLLB priority translation v69

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run representative ES to EN sample
        run: |
          python3 -m pip install --quiet transformers sentencepiece torch
          python3 .github/scripts/test-nllb-priority-translation-v69.py

name: Readonly live cache and filter regression 20261029
on:
  push:
    branches: [diagnostic/site-availability-20261029]
    paths: ['.github/workflows/verify-origin-guard-live-20261029.yml']
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Public pages and session-isolation checks
        shell: bash
        run: |
          set +e
          B=https://www.elmercadodeorigen.com
          for u in / /tienda/ /mi-cuenta/ /tienda/hidalgo-de-la-jara/ /tienda/1957/ /tienda/montjam/ /tienda/entresetas/ /en/shop/ /en/shop/page/2/;do
             H=$(mktemp)
             c=$(curl -ksS --connect-timeout 4 --max-time 16 -D "$H" -o /dev/null -w '%{http_code} %{time_starttransfer} %{time_total}' "$B$u")
             echo "PUBLIC $u $c $(grep -i '^x-emdo-vendor-cache:' "$H" | tail -n1 | tr -d '\r')"
             rm -f "$H"
          done
          H=$(mktemp)
          for n in a b;do
             curl -ksS --connect-timeout 4 --max-time 18 -H "Cookie: _ga=GA1.1.$n" -D "$H" -o /dev/null -w "ANALYTICS_$n %{http_code} %{time_total}\n" "$B/tienda/hidalgo-de-la-jara/"
             grep -i '^x-emdo-vendor-cache:' "$H" || true
          done
          for n in unknown cart login;do
             case "$n" in
                unknown) cookie='emdo_probe=1';;
                cart) cookie='woocommerce_items_in_cart=1';;
                login) cookie='wordpress_logged_in_synthetic=1';;
             esac
             c=$(curl -ksS --connect-timeout 4 --max-time 25 -H "Referer: $B/tienda/hidalgo-de-la-jara/" -H "Cookie: $cookie" -D "$H" -o /dev/null -w '%{http_code}' "$B/tienda/hidalgo-de-la-jara/")
             cache=$(grep -i '^x-emdo-vendor-cache:' "$H" | tail -n1 | tr -d '\r')
             echo "STATEFUL_$n $c $cache"
             if echo "$cache" | grep -qi 'HIT'; then echo 'ERROR: PERSONALIZED HTML CAME FROM SHARED CACHE';exit 9;fi
          done
          for u in '/tienda/hidalgo-de-la-jara/?filter_preparacion=x' '/en/shop/page/4?orderby=price';do
             c=$(curl -ksS --connect-timeout 4 --max-time 10 -D "$H" -o /dev/null -w '%{http_code}' "$B$u")
             echo "DIRECT $u $c $(grep -i '^location:' "$H" | tail -n1 | tr -d '\r')"
             test "$c" = 302 || exit 8
          done
          echo '=== OWN STORE REFERER CHALLENGE ==='
          F=$(mktemp)
          code=$(curl -ksS --connect-timeout 4 --max-time 13 -H "Referer: $B/tienda/hidalgo-de-la-jara/" -o "$F" -w '%{http_code}' "$B/tienda/hidalgo-de-la-jara/?filter_preparacion=x")
          echo "OWN_STORE_FILTER $code"
          if [ "$code" = 200 ];then
             grep -q 'Verificando acceso a los filtros' "$F" || exit 7
          else
             echo 'OWN_STORE_FILTER_UNEXPECTED_RESPONSE';exit 7
          fi
          rm -f "$F"
          c=$(curl -ksS --connect-timeout 4 --max-time 10 -H "Referer: $B/tienda/hidalgo-de-la-jara/" -o /dev/null -w '%{http_code}' "$B/tienda/1957/?filter_preparacion=x")
          echo "CROSS_VENDOR_REFERER $c"
          test "$c" = 302 || exit 8
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Nginx and PHP service read-only inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          date -u; uptime
          nginx -t 2>&1 | tail -n 3
          systemctl is-active nginx plesk-php82-fpm mysql
          grep -n -E 'CACHE VARY AND ENGLISH SHOP BYPASS|proxy_cache_use_stale updating|proxy_ignore_headers Cache-Control Expires Vary' /var/www/vhosts/system/elmercadodeorigen.com/conf/vhost_nginx.conf
          grep -n 'emdo_vendor_skip_cache' /etc/nginx/conf.d/98-emdo-hidalgo-anon-incident-20261029.conf
          ps -eo stat=,args= | awk '/php-fpm: pool elmercadodeorigen.com/ {n++;if ($1~/R/)r++} END{print "PHP_WORKERS",n,"RUNNING",r}'
          REMOTE

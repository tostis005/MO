name: Probe Tropitop public cart shipping

on:
  pull_request:
    paths: [".github/workflows/tropitop-shipping-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Calculate observed anonymous cart shipping without orders
        run: |
          python - <<'PY'
          import requests,re,html,json
          from bs4 import BeautifulSoup
          site='https://tropitop.com'
          p='/es/aguacates/33-3063-comprar-aguacate-bacon.html'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; shipping QA)','Accept-Language':'es-ES,es;q=0.9'})
          try:
            r=s.get(site+p,timeout=18)
            print('PRODUCT_STATUS',r.status_code,'length',len(r.content))
            soup=BeautifulSoup(r.text,'html.parser')
            form=soup.select_one('form#add-to-cart-or-refresh')
            if not form: raise RuntimeError('no product form')
            token=form.select_one('input[name="token"]')['value']
            print('FORM_FIELD_META',[(e.get('name'),e.get('value'),e.get('type')) for e in form.select('input') if e.get('type') in ('hidden','radio') and e.get('name') not in ('token',)][:35])
            print('VARIANT_SELECTORS',[(e.get('name'),[(x.get('value'),x.get_text(" ",strip=True)[:45]) for x in e.select('option')][:8]) for e in form.select('select')][:10])
            print('VARIANT_TEXT',form.select_one('.product-variants').get_text(' ',strip=True)[:850] if form.select_one('.product-variants') else 'NO VARIANTS')
            print('PRODUCT_COMBINATION_URLS',list(dict.fromkeys(re.findall(r'/es/aguacates/33-(\d+)-comprar-aguacate-bacon',r.text)))[:20])
            data={'token':token,'id_product':'33','id_product_attribute':'3063','qty':'1','add':'1','action':'update','ajax':'1'}
            a=s.post(site+'/es/carrito',data=data,timeout=18).json()
            print('ADD_SUCCESS',a.get('success'),'error_count',len(a.get('errors',[])))
            print('AJAX_CART_TOTALS',json.dumps(a.get('cart',{}).get('totals',{}),ensure_ascii=False)[:1600])
            print('AJAX_CART_SUBTOTALS',json.dumps(a.get('cart',{}).get('subtotals',{}),ensure_ascii=False)[:1200])
            c=s.get(site+'/es/carrito',timeout=18).text
            soup2=BeautifulSoup(c,'html.parser')
            for name,select in [('totals','.cart-summary-totals'),('subtotals','.cart-summary-subtotals'),('cart-total','.cart-total'),('shipping','.cart-summary-line')]:
              nodes=soup2.select(select)
              print('HTML_SUMMARY',name,[n.get_text(' ',strip=True)[:350] for n in nodes[-7:]])
            script=re.search(r'var prestashop\s*=\s*(\{.*?\});\s*',c,re.S)
            if script:
              try:
                prest=json.loads(script.group(1))
                print('PAGE_CART_TOTALS',json.dumps(prest.get('cart',{}).get('totals',{}),ensure_ascii=False)[:1700])
                print('PAGE_CART_SUBTOTALS',json.dumps(prest.get('cart',{}).get('subtotals',{}),ensure_ascii=False)[:1000])
              except ValueError as e: print('PAGE_PARSE',str(e)[:200])
          except Exception as e: print('ERROR',type(e).__name__,str(e)[:400])
          PY

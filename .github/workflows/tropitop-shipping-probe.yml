name: Probe Tropitop public cart shipping

on:
  pull_request:
    paths: [".github/workflows/tropitop-shipping-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test anonymous cart combinations without placing orders
        run: |
          python - <<'PY'
          import requests,re,json,decimal,time
          site='https://tropitop.com'
          product=site+'/es/aguacates/33-3063-comprar-aguacate-bacon.html'
          cases=[
            ('Aguacate 3kg x1',3061,1),
            ('Aguacate 4kg x1',3062,1),
            ('Aguacate 9kg x1',3063,1),
            ('Aguacate 9kg x2',3063,2),
            ('Aguacate 9kg x3',3063,3),
          ]
          for name,combination,quantity in cases:
            s=requests.Session()
            s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; shipping QA)','Accept-Language':'es-ES,es;q=0.9'})
            try:
              page=s.get(product,timeout=18)
              tokenmatch=re.search(r'name="token"\s+value="([^"]+)"',page.text)
              if not tokenmatch: raise RuntimeError('token not found')
              token=tokenmatch.group(1)
              a=s.post(site+'/es/carrito',data={
                'token':token, 'id_product':'33', 'id_product_attribute':str(combination),
                'qty':str(quantity), 'add':'1', 'action':'update', 'ajax':'1'
              },timeout=18).json()
              if not a.get('success'): raise RuntimeError('cart add rejected: '+str(a.get('errors')))
              cart=a.get('cart',{})
              products=cart.get('products',[])
              subtotal=cart.get('subtotals',{}).get('products') or {}
              shipping=cart.get('subtotals',{}).get('shipping') or {}
              total=cart.get('totals',{}).get('total') or {}
              print('CASE',json.dumps({'case':name,'products':[(x.get('id_product'),x.get('id_product_attribute'),x.get('quantity'),x.get('price')) for x in products],'subtotal':subtotal.get('amount'),'shipping':shipping.get('amount'),'total':total.get('amount'),'shipping_label':shipping.get('value')},ensure_ascii=False))
            except Exception as e: print('CASE_ERROR',name,type(e).__name__,str(e)[:250])
            time.sleep(.6)
          PY

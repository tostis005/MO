name: Audit Adsterra real frame live rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-real-frame-live-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium requests
      - name: Verify real-frame Adsterra rendering in non-headless Chrome
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          import json,time,requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          BASE='https://www.elmercadodeorigen.com'
          JS=BASE+'/wp-content/themes/elmercadodeorigen-child/assets/js/adsterra-geo-010290.js?realframe=010309'
          PAGE=BASE+'/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&realframe=010309'

          deadline=time.time()+300
          while time.time()<deadline:
              try:
                  body=requests.get(JS,timeout=15,headers={'Cache-Control':'no-cache'}).text
              except Exception:
                  body=''
              if ('frame.srcdoc' not in body
                  and 'config.frameEndpoint' in body
                  and 'frameVersion' in body
                  and 'pagead2.googlesyndication.com' not in body):
                  print('PRODUCTION_010309_READY=1',flush=True)
                  break
              time.sleep(5)
          else:
              raise SystemExit('Production did not serve 0.10.309 real-frame controller')

          o=Options()
          o.page_load_strategy='none'
          for a in ('--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1000','--lang=en-US'):
              o.add_argument(a)
          o.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':r"""
              (()=>{const f=window.fetch;window.fetch=function(input,init){
                const u=typeof input==='string'?input:(input&&input.url)||'';
                if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                  init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                  h.set('X-Country-Code','US');init.headers=h;
                }
                return f.call(this,input,init);
              };})();
              """})
              d.get(PAGE)

              deadline=time.time()+25
              while time.time()<deadline:
                  dbg=d.execute_script('return window.ElMercadoAdsterraGeoDebug||null')
                  if dbg and dbg.get('showAds') is True:
                      break
                  time.sleep(.25)
              else:
                  raise SystemExit('US eligibility did not resolve to ads')

              for ratio in (0,.2,.4,.6,.8,1,0):
                  d.execute_script('window.scrollTo(0,Math.max(0,(document.documentElement.scrollHeight-window.innerHeight)*arguments[0]))',ratio)
                  time.sleep(.75)
              time.sleep(12)

              urls=[]
              responses={}
              for item in d.get_log('performance'):
                  try: msg=json.loads(item['message'])['message']
                  except Exception: continue
                  if msg.get('method')=='Network.requestWillBeSent':
                      u=msg.get('params',{}).get('request',{}).get('url','')
                      urls.append(u)
                  elif msg.get('method')=='Network.responseReceived':
                      resp=msg.get('params',{}).get('response',{})
                      u=resp.get('url','')
                      if 'highrevenueformat.com' in u or 'profitableratecpmnetwork.com' in u:
                          responses[u]=resp.get('status')

              state=d.execute_script(r"""
                return {
                  debug:window.ElMercadoAdsterraGeoDebug||null,
                  googleScripts:Array.from(document.scripts).map(s=>s.src||'').filter(u=>/googlesyndication|doubleclick/.test(u)),
                  googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length,
                  adsbygoogle:document.querySelectorAll('ins.adsbygoogle').length,
                  slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map(s=>{
                    const f=s.querySelector('iframe[data-emo-adsterra-token]');
                    let inner=null;
                    if(f){
                      try{
                        const doc=f.contentDocument;
                        inner={
                          href:f.contentWindow.location.href,
                          scripts:doc?Array.from(doc.scripts).map(x=>x.src||''):[],
                          creativeCount:doc?doc.querySelectorAll('iframe,img,video,object,embed,canvas,svg,a[href]').length:null,
                          body:(doc&&doc.body?doc.body.innerHTML:'').slice(0,2500)
                        };
                      }catch(e){inner={error:String(e)};}
                    }
                    return {
                      type:s.getAttribute('data-emo-adsterra-slot'),
                      unit:s.getAttribute('data-emo-adsterra-unit'),
                      size:s.getAttribute('data-emo-adsterra-size'),
                      visible:s.classList.contains('is-eligible'),
                      display:getComputedStyle(s).display,
                      h:Math.round(s.getBoundingClientRect().height),
                      frame:!!f,
                      frameSrc:f?f.getAttribute('src'):null,
                      inner
                    };
                  })
                };
              """)
              adsterra=sorted(set(u for u in urls if 'highrevenueformat.com' in u or 'profitableratecpmnetwork.com' in u))
              google=sorted(set(u for u in urls if 'googlesyndication' in u or 'doubleclick.net' in u))
              print('LIVE_STATE='+json.dumps({'state':state,'adsterraRequests':adsterra,'adsterraResponses':responses,'googleRequests':google},sort_keys=True),flush=True)

              if google or state['googleScripts'] or state['googleAutoPlaced'] or state['adsbygoogle']:
                  raise SystemExit('Google advertising detected')
              standard=[s for s in state['slots'] if s['frame']]
              if len(standard)<5:
                  raise SystemExit('Not all desktop standard Adsterra frames were mounted')
              for s in standard:
                  if not s['frameSrc'] or 'adsterra-frame.html' not in s['frameSrc']:
                      raise SystemExit('Standard slot is not using real frame URL: '+s['type'])
                  if s['inner'] and s['inner'].get('href','').startswith('about:'):
                      raise SystemExit('Frame is still about/srcdoc: '+s['type'])
              if not adsterra:
                  raise SystemExit('No Adsterra requests observed')

              creatives=sum(int((s.get('inner') or {}).get('creativeCount') or 0) for s in standard)
              print('STANDARD_CREATIVE_COUNT='+str(creatives),flush=True)
              print('ADSTERRA_REAL_FRAME_AUDIT=PASS',flush=True)
          finally:
              d.quit()
          PY

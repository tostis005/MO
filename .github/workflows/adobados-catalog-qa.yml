name: Adobados catalog QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adobados-catalog-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"
          PORT="${STAGING_PORT:-22}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Adobados catalog on staging
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"
          wp_path=""
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve staging WordPress root.' >&2; exit 1; }
            wp_path="$(dirname "$cfg")"
          fi
          [ "$(basename "$wp_path")" = "$domain" ] || { echo "Unexpected WordPress path: $wp_path" >&2; exit 1; }

          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ] || { echo 'WP-CLI/PHP unavailable.' >&2; exit 1; }

          qa_code="$(cat <<'PHP'
$report = MDO_Adobados_Catalog::migrate_catalog( true );
$errors = array();
$adobados = get_term_by( 'slug', 'adobados', 'product_cat' );
$cured = get_term_by( 'slug', 'embutidos-y-curados', 'product_cat' );
if ( ! $adobados instanceof WP_Term ) { $errors[] = 'Falta categoría Adobados'; }
if ( ! $cured instanceof WP_Term ) { $errors[] = 'Falta categoría Embutidos y curados'; }
if ( ! taxonomy_exists( 'pa_tipo-producto' ) ) { $errors[] = 'Falta taxonomía pa_tipo-producto'; }

$ad_rows = array();
$ad_ids = wc_get_products( array( 'limit' => -1, 'return' => 'ids', 'category' => array( 'adobados' ), 'status' => array( 'publish', 'private', 'draft', 'pending' ) ) );
foreach ( array_map( 'intval', $ad_ids ) as $id ) {
    $p = wc_get_product( $id );
    if ( ! $p instanceof WC_Product ) { continue; }
    $name = $p->get_name();
    $norm = strtolower( remove_accents( $name ) );
    $expected = '';
    if ( preg_match( '/\bcostilla(?:s)?\b/u', $norm ) ) { $expected = 'Costilla'; }
    elseif ( preg_match( '/\blomo\b/u', $norm ) ) { $expected = 'Lomo'; }
    elseif ( preg_match( '/\bpanceta\b/u', $norm ) ) { $expected = 'Panceta'; }
    if ( '' === $expected || false === strpos( $norm, 'adobad' ) ) { $errors[] = 'Producto ajeno en Adobados: ' . $name; }
    if ( preg_match( '/\bchorizo(?:s)?\b/u', $norm ) ) { $errors[] = 'Chorizo dentro de Adobados: ' . $name; }
    $terms = wp_get_post_terms( $id, 'pa_tipo-producto', array( 'fields' => 'names' ) );
    if ( is_wp_error( $terms ) ) { $terms = array(); }
    if ( '' !== $expected && ! in_array( $expected, $terms, true ) ) { $errors[] = 'Tipo incorrecto en ' . $name . ': ' . implode( ',', $terms ); }
    if ( $cured instanceof WP_Term && has_term( (int) $cured->term_id, 'product_cat', $id ) ) { $errors[] = 'Adobado también en Embutidos y curados: ' . $name; }
    $ad_rows[] = array( 'id' => $id, 'name' => $name, 'tipo' => $terms );
}
if ( 3 !== count( $ad_rows ) ) { $errors[] = 'Adobados debe contener 3 productos y contiene ' . count( $ad_rows ); }

$chorizos = array();
$all_ids = wc_get_products( array( 'limit' => -1, 'return' => 'ids', 'status' => array( 'publish', 'private', 'draft', 'pending' ) ) );
foreach ( array_map( 'intval', $all_ids ) as $id ) {
    $p = wc_get_product( $id );
    if ( ! $p instanceof WC_Product || $p->is_type( 'variation' ) ) { continue; }
    $name = $p->get_name();
    $norm = strtolower( remove_accents( $name ) );
    if ( ! preg_match( '/\bchorizo(?:s)?\b.*\b(?:para\s+)?asar\b/u', $norm ) ) { continue; }
    $in_ad = $adobados instanceof WP_Term && has_term( (int) $adobados->term_id, 'product_cat', $id );
    $in_cured = $cured instanceof WP_Term && has_term( (int) $cured->term_id, 'product_cat', $id );
    if ( $in_ad ) { $errors[] = 'Chorizo para asar sigue en Adobados: ' . $name; }
    if ( ! $in_cured ) { $errors[] = 'Chorizo para asar no está en Embutidos y curados: ' . $name; }
    $chorizos[] = array( 'id' => $id, 'name' => $name, 'adobados' => $in_ad, 'embutidos_y_curados' => $in_cured );
}
if ( 0 === count( $chorizos ) ) { $errors[] = 'No se encontró ningún chorizo para asar'; }
if ( ! empty( $report['errors'] ) ) { $errors[] = 'La migración devolvió errores'; }

$out = array( 'report' => $report, 'adobados' => $ad_rows, 'chorizo_para_asar' => $chorizos, 'errors' => $errors );
echo wp_json_encode( $out, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT );
if ( $errors ) { exit( 1 ); }
PHP
          )"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$qa_code" --path="$wp_path" --allow-root
          REMOTE

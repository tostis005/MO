name: Woostify toolbar source diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/woostify-toolbar-source-diagnostic-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production Woostify toolbar source
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" > /tmp/toolbar-source.txt <<'REMOTE'
          set -euo pipefail
          THEME="$PROD_PATH/wp-content/themes/woostify"
          CLASS="$THEME/inc/woocommerce/class-woostify-woocommerce.php"
          printf 'theme=%s\n' "$THEME"
          printf '%s\n' '--- exact archive hook registration block ---'
          nl -ba "$CLASS" | sed -n '880,930p'
          printf '%s\n' '--- toolbar-left registrations anywhere ---'
          grep -R -n -E 'woostify_woocommerce_toolbar_left_(open|close)_div|woocommerce_catalog_ordering|woocommerce_result_count' "$THEME" --include='*.php' 2>/dev/null | head -n 160 || true
          printf '%s\n' '--- toolbar-left functions ---'
          FILE="$THEME/inc/woocommerce/woostify-woocommerce-archive-product-functions.php"
          nl -ba "$FILE" | sed -n '338,365p'
          printf '%s\n' '--- sorting wrapper functions ---'
          FILE2="$THEME/inc/woocommerce/woostify-woocommerce-template-functions.php"
          nl -ba "$FILE2" | sed -n '204,228p'
          REMOTE
      - name: Record diagnostic
        run: |
          mkdir -p .deploy-status
          cp /tmp/toolbar-source.txt .deploy-status/woostify-toolbar-source.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/woostify-toolbar-source.txt
          git commit -m 'Record expanded Woostify toolbar source diagnostic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

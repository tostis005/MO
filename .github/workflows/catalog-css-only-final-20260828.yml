name: Final CSS-only catalogue verification 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-css-only-final-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only files
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            'zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php'
            'zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php'
            'zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
            'zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
            'zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
            'zzzzzzzzzzzzzzzzzzz-mdo-producer-mobile-css-only-20260828.php'
          )
          for n in "${FILES[@]}"; do php -l "mu-plugins/$n" >/dev/null; done
          ! grep -Eq '<script|new[[:space:]]+MutationObserver|new[[:space:]]+ResizeObserver|requestAnimationFrame[[:space:]]*\(|setInterval[[:space:]]*\(' $(printf 'mu-plugins/%s ' "${FILES[@]}")

      - name: Deploy candidate with backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] && [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          BK="/tmp/mdo-css-final-$GITHUB_RUN_ID"
          echo "BK=$BK" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$BK'"

          FILES=(
            'zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php'
            'zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php'
            'zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
            'zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
            'zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
            'zzzzzzzzzzzzzzzzzzz-mdo-producer-mobile-css-only-20260828.php'
          )
          for n in "${FILES[@]}"; do
            target="$PROD/wp-content/mu-plugins/$n"
            remote="/tmp/$n.$GITHUB_RUN_ID"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$target' ]; then cp -p '$target' '$BK/$n'; else touch '$BK/$n.absent'; fi"
            sshpass -e scp $SCP "mu-plugins/$n" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); [ -n \"\$php_bin\" ]; \"\$php_bin\" -l '$remote' >/dev/null; install -m 0644 '$remote' '$target'; rm -f '$remote'"
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); if [ -n \"\$wp_bin\" ] && [ -n \"\$php_bin\" ]; then \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true; fi"

      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify native structure and CSS-only layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time, json, sys

          errors=[]
          report={}
          urls={
            'global':'https://www.elmercadodeorigen.com/tienda/?cssfinal=2',
            'producer':'https://www.elmercadodeorigen.com/tienda/1957/?cssfinal=2',
          }

          def snap(pg):
            return pg.evaluate('''() => {
              const q=s=>document.querySelector(s);
              const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}};
              const shared=q('.emo-catalog-toolbar-shared-010229');
              const native=q('#wcfmmp-store .elmercado-vendor-toolbar, #wcfmmp-store .woostify-sorting');
              const toolbar=shared||native;
              const form=toolbar?.querySelector('.woocommerce-ordering') || q('#wcfmmp-store .woocommerce-ordering') || q('.woocommerce-ordering');
              const select=form?.querySelector('select[name="orderby"]')||null;
              const dest=toolbar?.querySelector('[data-mdo-ps-destination-open],[data-mdo-destination-open]') || q('[data-mdo-ps-destination-open],[data-mdo-destination-open]');
              return {
                ready:!!(toolbar&&form&&select&&dest),
                toolbar:box(toolbar),form:box(form),select:box(select),dest:box(dest),
                shared:!!shared,native:!!native,
                formIn:!!toolbar?.contains(form),destIn:!!toolbar?.contains(dest),
                media:matchMedia('(max-width:767px)').matches,
                display:toolbar?getComputedStyle(toolbar).display:null,
                overflow:document.documentElement.scrollWidth-innerWidth,
                sharedCss:!!q('#mdo-catalog-control-widths-css-only-20260828'),
                producerCss:!!q('#mdo-producer-mobile-css-only-20260828'),
                legacy:!!q('#mdo-catalog-top-controls-parity-20260824-js'),
                runtime:!!q('#mdo-catalog-mobile-runtime-guard-20260824'),
                finalRuntime:!!q('#mdo-catalog-top-controls-parity-final-20260824-js'),
                arrowRuntime:!!q('#mdo-catalog-top-controls-arrow-final-20260824-js'),
                focusable:!!(select&&!select.disabled&&getComputedStyle(select).pointerEvents!=='none'),
                body:document.body.className
              };
            }''')

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width in (335,360,390):
              report[str(width)]={}
              for kind,url in urls.items():
                pg=browser.new_page(viewport={'width':width,'height':820})
                pg.route('**/*', lambda route: route.abort() if route.request.resource_type in ('image','font','media') else route.continue_())
                pg.goto(url,wait_until='commit',timeout=30000)
                d=None
                for _ in range(45):
                  time.sleep(.35)
                  try:
                    x=snap(pg)
                    if x.get('ready'):
                      time.sleep(.7)
                      y=snap(pg)
                      d=y if y.get('ready') else x
                      break
                    d=x
                  except Exception:
                    pass
                report[str(width)][kind]=d
                if not d or not d.get('ready'):
                  errors.append(f'{kind} {width}: controls not ready; snapshot={d}')
                  pg.close(); continue
                if d['legacy'] or d['runtime'] or d['finalRuntime'] or d['arrowRuntime']:
                  errors.append(f'{kind} {width}: dynamic catalogue layout runtime still present')
                if d['overflow']>1:
                  errors.append(f'{kind} {width}: horizontal overflow {d["overflow"]}')
                if not d['focusable']:
                  errors.append(f'{kind} {width}: ordering not interactive')
                if kind=='producer':
                  if not d['producerCss']:
                    errors.append(f'producer {width}: producer CSS missing')
                  if not d['formIn'] or not d['destIn']:
                    errors.append(f'producer {width}: native structure differs; formIn={d["formIn"]} destIn={d["destIn"]}')
                  if d['select']['w']<260:
                    errors.append(f'producer {width}: ordering too narrow {d["select"]["w"]}')
                  if abs(d['select']['w']-d['dest']['w'])>3:
                    errors.append(f'producer {width}: ordering/destination differ {d["select"]["w"]}/{d["dest"]["w"]}')
                  if d['toolbar']['h']<125:
                    errors.append(f'producer {width}: mobile grid not active h={d["toolbar"]["h"]}')
                  if d['form']['l'] < d['toolbar']['l']-2 or d['form']['r'] > d['toolbar']['r']+2:
                    errors.append(f'producer {width}: ordering outside toolbar')
                try:
                  pg.locator('select[name="orderby"]').first.focus(timeout=1500)
                  if not pg.evaluate('document.activeElement?.matches("select[name=orderby]") || false'):
                    errors.append(f'{kind} {width}: focus failed')
                except Exception as e:
                  errors.append(f'{kind} {width}: focus exception {type(e).__name__}')
                t=time.time(); pg.evaluate('1+1')
                if time.time()-t>1.0:
                  errors.append(f'{kind} {width}: page sluggish')
                pg.close()
            browser.close()

          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:
            print('ERRORS:')
            print('\n'.join('- '+e for e in errors))
            sys.exit(1)
          print('CSS_ONLY_FINAL_VERIFIED=true')
          PY

      - name: Roll back on failure
        if: failure() && env.PROD != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          FILES=(
            'zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php'
            'zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php'
            'zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
            'zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
            'zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
            'zzzzzzzzzzzzzzzzzzz-mdo-producer-mobile-css-only-20260828.php'
          )
          for n in "${FILES[@]}"; do
            target="$PROD/wp-content/mu-plugins/$n"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BK/$n' ]; then install -m 0644 '$BK/$n' '$target'; else rm -f '$target'; fi"
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$BK'"

      - name: Cleanup backup
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$BK'"

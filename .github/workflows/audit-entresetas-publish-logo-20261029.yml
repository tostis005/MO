name: Audit EntreSetas publication and seller logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-entresetas-publish-logo-20261029.yml', '.github/scripts/audit-entresetas-publish-logo-20261029.php']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only WCFM product audit
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/audit-entresetas-publish-logo-20261029.php
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="$STAGING_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          REMOTE="/tmp/audit-entresetas-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/audit-entresetas-publish-logo-20261029.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root
          " | tee /tmp/entresetas-publish-logo-audit.txt
          grep -q 'ENTRESETAS_PUBLICATION_AUDIT=' /tmp/entresetas-publish-logo-audit.txt
      - name: Inspect official site header logo
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          u='https://www.entresetas.com/'
          r=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          s=urllib.request.urlopen(r,timeout=25).read().decode('utf-8','replace')
          for pat in [r'<img[^>]+class="[^"]*(?:custom-logo|site-logo|logo)[^"]*"[^>]*>',r'<img[^>]+(?:logo|Logo)[^>]*>']:
              for match in re.findall(pat,s,re.I)[:12]:
                  print('OFFICIAL_LOGO_CANDIDATE=',html.unescape(match[:450]))
          print('OFFICIAL_FAVICON=',re.findall(r'<link[^>]+(?:icon|shortcut)[^>]+>',s,re.I)[:4])
          PY
      - name: Store detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entresetas-products-audit
          path: /tmp/entresetas-publish-logo-audit.txt
          if-no-files-found: warn
          retention-days: 20

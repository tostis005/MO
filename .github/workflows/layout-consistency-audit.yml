name: Layout consistency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-consistency-audit.yml'
      - 'elmercadodeorigen-child/**'

permissions:
  contents: read

concurrency:
  group: layout-consistency-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Capture and validate staging layouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p layout-audit
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > layout-audit.cjs <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          const base='https://dev.elmercadodeorigen.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const routes=[['home','/'],['shop','/tienda/'],['vendor','/tienda/hidalgo-de-la-jara/'],['contact','/contacto/']];
          const viewports=[['desktop',{width:1440,height:1000,deviceScaleFactor:1,isMobile:false,hasTouch:false}],['mobile',{width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true}]];
          const report={errors:[],pages:{}};
          const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:s.display,visibility:s.visibility,opacity:s.opacity,margin:s.margin,gap:s.gap}};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:'new',timeout:60000,protocolTimeout:90000,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=1440,1000']});
            for(const [vpName,vp] of viewports){
              const page=await browser.newPage();
              await page.setViewport(vp);
              const consoleErrors=[]; const failed=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
              for(const [name,path] of routes){
                await page.goto(`${base}${path}?audit=${Date.now()}`,{waitUntil:'networkidle2',timeout:90000});
                await page.addStyleTag({content:'#cookie-law-info-bar,#cookie-law-info-again,#ht-ctc-chat{display:none!important}'});
                await sleep(1000);
                const key=`${name}-${vpName}`;
                report.pages[key]=await page.evaluate((vpName)=>{
                  const R=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:s.display,visibility:s.visibility,opacity:s.opacity,margin:s.margin,gap:s.gap}};
                  const header=document.querySelector('.site-header');
                  const logo=document.querySelector('.site-header .site-branding,.site-header .site-logo');
                  const nav=document.querySelector('.site-header .main-navigation,.site-header nav');
                  const tools=document.querySelector('.site-header .site-tools,.site-header .header-right');
                  const cartCount=document.querySelector('.site-header .shop-cart-count,.site-header .cart-count,.site-header .count,.site-header .elmercado-cart-direct-count');
                  const products=document.querySelector('ul.products');
                  const titles=[...document.querySelectorAll('ul.products li.product .woocommerce-loop-product__title,ul.products li.product .elmercado-product-title-link')].slice(0,8).map(e=>({text:(e.textContent||'').trim(),rect:R(e),lineHeight:getComputedStyle(e).lineHeight,overflow:getComputedStyle(e).overflow}));
                  const producer=[...document.querySelectorAll('select')].find(s=>[...s.options].some(o=>/(todos los productores|todos los vendedores)/i.test(o.textContent||'')));
                  const producerWrap=producer?.closest('.wcfmmp-product-filter-wrap,.product-filter,.filter-item,.form-row,.woostify-toolbar-left > *,label,div')||producer;
                  const result=document.querySelector('.woocommerce-result-count');
                  const ordering=document.querySelector('.woocommerce-ordering select');
                  const slider=document.querySelector('.widget_price_filter .price_slider,.price_slider_wrapper .ui-slider-horizontal');
                  const tabs=document.querySelector('.wcfmmp-store-tabs,.wcfm_store_tabs,.store-tabs,.wcfmmp-store-tab');
                  const tabsNext=tabs?.nextElementSibling;
                  const carousel=document.querySelector('.emo-featured-products ul.products');
                  const prev=document.querySelector('.emo-featured-products .emo-carousel-control--previous');
                  const next=document.querySelector('.emo-featured-products .emo-carousel-control--next');
                  const mobileMenu=document.querySelector('.toggle-sidebar-menu-btn');
                  const doc=document.documentElement;
                  return {vpName,url:location.href,body:document.body.className,header:R(header),logo:R(logo),nav:R(nav),tools:R(tools),cartCount:cartCount?{text:(cartCount.textContent||'').trim(),rect:R(cartCount),className:cartCount.className}:null,products:R(products),productCount:products?[...products.children].filter(e=>e.matches('li.product')).length:0,titles,producerFilter:producerWrap?R(producerWrap):null,result:result?{text:(result.textContent||'').replace(/\s+/g,' ').trim(),rect:R(result)}:null,ordering:ordering?R(ordering):null,orderingBorders:ordering?{top:getComputedStyle(ordering).borderTopWidth,bottom:getComputedStyle(ordering).borderBottomWidth}:null,slider:R(slider),tabs:R(tabs),tabsNext:R(tabsNext),carousel:R(carousel),prev:R(prev),next:R(next),mobileMenu:R(mobileMenu),overflow:doc.scrollWidth>doc.clientWidth+2};
                },vpName);
                await page.screenshot({path:`layout-audit/${key}.png`,fullPage:true});
              }
              report.pages[`runtime-${vpName}`]={consoleErrors:[...new Set(consoleErrors)].slice(0,20),failed:[...new Set(failed)].filter(x=>!x.includes('google-analytics')&&!x.includes('doubleclick')).slice(0,20)};
              await page.close();
            }
            const p=report.pages;
            for(const [key,v] of Object.entries(p)){
              if(!v||key.startsWith('runtime-'))continue;
              if(v.overflow)report.errors.push(`${key}: horizontal overflow`);
              if(v.cartCount && /^0$/.test(v.cartCount.text) && v.cartCount.rect && v.cartCount.rect.display!=='none' && v.cartCount.rect.visibility!=='hidden' && Number(v.cartCount.rect.opacity)>0)report.errors.push(`${key}: zero cart count visible`);
              if(key.startsWith('shop-') && v.producerFilter && v.producerFilter.display!=='none')report.errors.push(`${key}: producer filter visible`);
              if(v.ordering && (v.orderingBorders?.top==='0px'||v.orderingBorders?.bottom==='0px'))report.errors.push(`${key}: ordering border incomplete`);
              if(v.result && /\d(de)\d/i.test(v.result.text))report.errors.push(`${key}: result count spacing malformed`);
              if(key.startsWith('home-mobile') && v.carousel && (!v.prev||!v.next))report.errors.push(`${key}: carousel arrows missing`);
            }
            fs.writeFileSync('layout-audit/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(report.errors.length){console.error(report.errors.join('\n'));process.exit(2)}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node layout-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-consistency-audit
          path: layout-audit/
          retention-days: 14

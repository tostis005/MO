name: Deploy update legal address 20260818

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mu-plugins/mdo-update-legal-address-20260818.php'
      - '.github/workflows/deploy-update-legal-address-20260818.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: php -l mu-plugins/mdo-update-legal-address-20260818.php

      - name: Deploy and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$PORT")
          SCP_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -P "$PORT")
          remote(){ sshpass -e ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" "$@"; }

          PROD_PATH="$(remote '
            wp=$(command -v wp || true); ph=$(command -v php || true); [ -n "$ph" ] || ph=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$ph" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?site not found}"
          echo "PROD_PATH=$PROD_PATH"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-update-legal-address-20260818.php"
          TMP="/tmp/mdo-update-legal-address-${GITHUB_RUN_ID}.php"
          sshpass -e scp "${SCP_OPTS[@]}" mu-plugins/mdo-update-legal-address-20260818.php "$STAGING_USER@$STAGING_HOST:$TMP"
          remote "ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); \"\$ph\" -l '$TMP'; install -m 0644 '$TMP' '$TARGET'; rm -f '$TMP'"

          echo '=== Apply stored-page address update ==='
          remote "wp=\$(command -v wp); ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); \"\$ph\" -d memory_limit=1024M \"\$wp\" eval 'echo wp_json_encode(mdo_ula_apply_to_pages(), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES), PHP_EOL;' --path='$PROD_PATH' --allow-root"
          remote "wp=\$(command -v wp); ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); \"\$ph\" -d memory_limit=1024M \"\$wp\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          echo '=== Verify Spanish and English legal/contact pages ==='
          for u in \
            'https://www.elmercadodeorigen.com/aviso-legal/' \
            'https://www.elmercadodeorigen.com/contacto/' \
            'https://www.elmercadodeorigen.com/en/legal-notice/' \
            'https://www.elmercadodeorigen.com/en/contact/'; do
            curl -k -L -sS --max-time 45 "$u" -o /tmp/page.html
            grep -Fq 'Martín Soler 4' /tmp/page.html
            ! grep -Fq 'Ferrocarril 7' /tmp/page.html
          done

          echo '=== Verify structured data ==='
          curl -k -L -sS --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          grep -Fq 'Martín Soler 4' /tmp/home.html
          ! grep -Fq 'Ferrocarril 7' /tmp/home.html
          echo 'Legal address update verified.'

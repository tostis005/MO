name: Deploy child theme to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      EXPECTED_THEME_VERSION: 0.10.208

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate exact release locally
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css
          grep -q "ELMERCADO_THEME_VERSION', '$EXPECTED_THEME_VERSION'" elmercadodeorigen-child/functions.php
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?Missing STAGING_HOST}"
          : "${STAGING_USER:?Missing STAGING_USER}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          echo "Local release $EXPECTED_THEME_VERSION validated."

      - name: Install deployment and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage release on server
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-theme-prod-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/elmercadodeorigen-child'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' --exclude='*.map' -e "ssh $SSH_OPTIONS" elmercadodeorigen-child/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/elmercadodeorigen-child/"

      - name: Backup and deploy safely to production
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          BACKUP_NAME="$(date -u +%Y%m%dT%H%M%SZ)-before-${EXPECTED_THEME_VERSION//./_}-${GITHUB_SHA:0:10}"
          echo "BACKUP_NAME=$BACKUP_NAME" >> "$GITHUB_ENV"

          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP/elmercadodeorigen-child' '$GITHUB_SHA' '$BACKUP_NAME' '$EXPECTED_THEME_VERSION'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"; backup_name="$4"; expected="$5"

          dev_path=""
          case "$raw" in */wp-content/*) dev_path="${raw%%/wp-content/*}" ;; */wp-content) dev_path="$(dirname "$raw")" ;; *) dev_path="$raw" ;; esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve staging root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$prod_path/wp-config.php" ] || { echo "Production wp-config not found at $prod_path" >&2; exit 1; }
          [ -d "$prod_path/wp-content/themes" ] || { echo 'Production themes directory missing.' >&2; exit 1; }
          [ -d "$incoming" ] || { echo 'Incoming release missing.' >&2; exit 1; }

          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -x "$php_bin" ] && [ -n "$wp_bin" ] || { echo 'PHP/WP-CLI unavailable.' >&2; exit 1; }
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod_path" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing deployment: unexpected production siteurl=$siteurl" >&2; exit 1 ;; esac
          smoke_base="${siteurl%/}"

          find "$incoming" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/tmp/elmercado-theme-prod-lint.log
          grep -q "ELMERCADO_THEME_VERSION', '$expected'" "$incoming/functions.php"

          theme_parent="$prod_path/wp-content/themes"
          target="$theme_parent/elmercadodeorigen-child"
          [ -d "$target" ] || { echo 'Existing production child theme missing; refusing deployment without rollback source.' >&2; exit 1; }

          active_before="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod_path" --skip-plugins --skip-themes --allow-root)"
          version_before="$(grep -o "ELMERCADO_THEME_VERSION', '[^']*" "$target/functions.php" | head -n1 | sed "s/.*'//" || true)"
          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          backup_dir="$rollback_root/$backup_name"
          mkdir -p "$backup_dir"
          tar -czf "$backup_dir/theme.tar.gz" -C "$theme_parent" elmercadodeorigen-child
          ( cd "$backup_dir" && sha256sum theme.tar.gz > theme.tar.gz.sha256 && sha256sum -c theme.tar.gz.sha256 )
          printf '%s\n' "$active_before" > "$backup_dir/active-stylesheet.txt"
          printf '%s\n' "${version_before:-unknown}" > "$backup_dir/theme-version.txt"
          printf '%s\n' "$siteurl" > "$backup_dir/siteurl.txt"
          printf '%s\n' "$commit" > "$backup_dir/release-sha.txt"

          old="$theme_parent/.elmercadodeorigen-child.predeploy-$commit"
          rm -rf "$old"
          swapped=0
          rollback() {
            code=$?
            if [ "$swapped" -eq 1 ] && [ "$code" -ne 0 ]; then
              echo 'Theme deployment failed; restoring previous production theme.' >&2
              rm -rf "$target"
              [ ! -d "$old" ] || mv "$old" "$target"
              "$php_bin" -d memory_limit=512M "$wp_bin" theme activate "$active_before" --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
              "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          mv "$target" "$old"
          mv "$incoming" "$target"
          swapped=1
          test -f "$target/functions.php"
          find "$target" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" theme activate elmercadodeorigen-child --path="$prod_path" --skip-plugins --allow-root >/dev/null
          active_after="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod_path" --skip-plugins --skip-themes --allow-root)"
          [ "$active_after" = 'elmercadodeorigen-child' ]
          runtime_version="$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo defined("ELMERCADO_THEME_VERSION") ? ELMERCADO_THEME_VERSION : "missing";' --path="$prod_path" --skip-plugins --allow-root)"
          [ "$runtime_version" = "$expected" ] || { echo "Runtime theme version $runtime_version, expected $expected" >&2; exit 1; }
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root || true

          for path in / /tienda/ /categoria-producto/jamones-paletas/ /contacto/ /carrito/; do
            code="$(curl -ksS -L -o /tmp/elmercado-prod-page -w '%{http_code}' --max-time 35 "$smoke_base$path?theme-release=$commit" || true)"
            [ "$code" = '200' ] || { echo "$path returned HTTP $code" >&2; exit 1; }
            grep -q 'elmercado-child-theme' /tmp/elmercado-prod-page || { echo "$path did not serve child theme" >&2; exit 1; }
            ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error on this website' /tmp/elmercado-prod-page || { echo "Fatal marker on $path" >&2; exit 1; }
          done

          rm -rf "$old"
          swapped=0
          rm -rf "$incoming"
          trap - EXIT HUP INT TERM
          printf '__SITEURL__=%s\n' "$siteurl"
          printf '__PROD_PATH__=%s\n' "$prod_path"
          printf '__VERSION_BEFORE__=%s\n' "${version_before:-unknown}"
          printf '__VERSION_AFTER__=%s\n' "$runtime_version"
          printf '__BACKUP__=%s\n' "$backup_name"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"
          SITEURL="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__SITEURL__=//p' | tail -n1)"
          PROD_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__PROD_PATH__=//p' | tail -n1)"
          VERSION_BEFORE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__VERSION_BEFORE__=//p' | tail -n1)"
          VERSION_AFTER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__VERSION_AFTER__=//p' | tail -n1)"
          : "${SITEURL:?Production siteurl missing}"
          : "${PROD_PATH:?Production path missing}"
          echo "PRODUCTION_SITEURL=$SITEURL" >> "$GITHUB_ENV"
          echo "PRODUCTION_WP_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "PREVIOUS_THEME_VERSION=$VERSION_BEFORE" >> "$GITHUB_ENV"
          echo "DEPLOYED_THEME_VERSION=$VERSION_AFTER" >> "$GITHUB_ENV"
          echo "backup_name=$BACKUP_NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke production in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/production-smoke.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          const base = (process.env.PRODUCTION_SITEURL || 'https://elmercadodeorigen.com').replace(/\/$/, '');
          const browser = await puppeteer.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox','--disable-dev-shm-usage']});
          const report = {};
          try {
            const page = await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err.message || err)));

            await page.goto(`${base}/?prod-smoke=${Date.now()}`, {waitUntil:'networkidle2', timeout:60000});
            const trigger = await page.$('.header-search-icon, [class*="header-search"] a, .site-tools .search-icon');
            if (!trigger) throw new Error('Search trigger missing');
            await trigger.click();
            await page.waitForSelector('.site-dialog-search', {visible:true, timeout:10000});
            const search = await page.evaluate(() => {
              const root = document.querySelector('.site-dialog-search');
              const input = root?.querySelector('input[type="search"],.search-field');
              const submit = root?.querySelector('button[type="submit"],input[type="submit"],.search-submit');
              return {
                title:root?.querySelector('.dialog-search-title')?.textContent?.trim() || '',
                placeholder:input?.getAttribute('placeholder') || '',
                submit:submit?.tagName === 'INPUT' ? submit.value : (submit?.textContent || '').trim(),
                text:root?.innerText || ''
              };
            });
            if (search.title !== 'Buscar productos' || search.placeholder !== 'Buscar productos' || search.submit !== 'Buscar') throw new Error(`Search copy mismatch: ${JSON.stringify(search)}`);
            if (search.text.includes('BUSCAR EN EL MERCADO') || search.text.includes('Encuentra productos seleccionados con criterio')) throw new Error('Marketing search copy still visible');
            report.search = search;

            await page.goto(`${base}/tienda/?prod-smoke=${Date.now()}`, {waitUntil:'networkidle2', timeout:60000});
            const shop = await page.evaluate(() => {
              const visible = (sel) => [...document.querySelectorAll(sel)].filter(el => { const s=getComputedStyle(el),r=el.getBoundingClientRect(); return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0; }).length;
              const sidebar = document.querySelector('#secondary.widget-area,.shop-widget-area');
              return {theme:document.body.classList.contains('elmercado-child-theme'), tags:visible('.widget_product_tag_cloud,.widget_tag_cloud,.tagcloud'), etiquetas:/\bEtiquetas\b/i.test(sidebar?.innerText||''), products:document.querySelectorAll('.products .product,li.product').length};
            });
            if (!shop.theme || shop.tags || shop.etiquetas || shop.products < 1) throw new Error(`Shop smoke failed: ${JSON.stringify(shop)}`);
            report.shop = shop;

            await page.goto(`${base}/categoria-producto/jamones-paletas/?prod-smoke=${Date.now()}`, {waitUntil:'networkidle2', timeout:60000});
            const category = await page.evaluate(() => {
              const visible = (sel) => [...document.querySelectorAll(sel)].filter(el => { const s=getComputedStyle(el),r=el.getBoundingClientRect(); return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0; }).length;
              const sidebar = document.querySelector('#secondary.widget-area,.shop-widget-area');
              return {theme:document.body.classList.contains('elmercado-child-theme'), vendor:visible('#emo-global-vendor-filter'), specific:visible('#emo-category-attribute-filters'), tags:visible('.widget_product_tag_cloud,.widget_tag_cloud,.tagcloud'), etiquetas:/\bEtiquetas\b/i.test(sidebar?.innerText||''), products:document.querySelectorAll('.products .product,li.product').length};
            });
            if (!category.theme || !category.vendor || !category.specific || category.tags || category.etiquetas || category.products < 1) throw new Error(`Category smoke failed: ${JSON.stringify(category)}`);
            report.category = category;
            report.pageErrors = pageErrors;
            console.log('PRODUCTION_THEME_010208_OK', JSON.stringify(report));
          } finally { await browser.close(); }
          NODE
          node /tmp/production-smoke.cjs

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "Production deployment successful."
          echo "Site: $PRODUCTION_SITEURL"
          echo "Previous theme version: ${PREVIOUS_THEME_VERSION:-unknown}"
          echo "Current theme version: ${DEPLOYED_THEME_VERSION:-unknown}"
          echo "Rollback backup: ${BACKUP_NAME:-unknown}"

      - name: Automatic rollback if browser smoke fails
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$BACKUP_NAME'" <<'REMOTE'
          set -eu
          raw="${1%/}"; backup_name="$2"
          dev_path=""
          case "$raw" in */wp-content/*) dev_path="${raw%%/wp-content/*}" ;; */wp-content) dev_path="$(dirname "$raw")" ;; *) dev_path="$raw" ;; esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod_path" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing rollback: $siteurl" >&2; exit 1 ;; esac
          backup_dir="$HOME/.elmercado-rollbacks/elmercadodeorigen.com/$backup_name"
          [ -f "$backup_dir/theme.tar.gz" ]
          ( cd "$backup_dir" && sha256sum -c theme.tar.gz.sha256 )
          target="$prod_path/wp-content/themes/elmercadodeorigen-child"
          rm -rf "$target"
          tar -xzf "$backup_dir/theme.tar.gz" -C "$prod_path/wp-content/themes"
          previous_stylesheet="$(cat "$backup_dir/active-stylesheet.txt" 2>/dev/null || true)"
          [ -n "$previous_stylesheet" ] || previous_stylesheet='elmercadodeorigen-child'
          "$php_bin" -d memory_limit=512M "$wp_bin" theme activate "$previous_stylesheet" --path="$prod_path" --skip-plugins --allow-root >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root || true
          echo "Automatic rollback restored $backup_name"
          REMOTE

name: Temporary Google home counter diagnosis 20261010
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/diagnose-home-google-counter-20261010.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source totals and stale Home cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p "${STAGING_PORT:-22}" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp)
          php_bin=/opt/plesk/php/8.3/bin/php
          test -x "$php_bin" || php_bin=$(command -v php)
          PROD_PATH=''
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p";break;;
            esac
          done
          test -n "$PROD_PATH"
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $t = $wpdb->prefix . "mdo_reviews";
            $s = array(
              "google_option" => get_option("mdo_google_review_count"),
              "google_updated_at" => get_option("mdo_google_review_count_updated_at"),
              "google_updated_human" => get_option("mdo_google_review_count_updated_at") ? wp_date("c", (int) get_option("mdo_google_review_count_updated_at")) : "",
              "google_db_count" => (int) $wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$t} WHERE source = %s", "google")),
              "trustpilot_option" => get_option("mdo_trustpilot_review_count"),
              "cron_next" => wp_next_scheduled("mdo_review_counts_daily_fallback_010279"),
              "supplier_checker" => wp_next_scheduled("mdo_review_counts_after_supplier_cycle_010279"),
              "home_static_exists" => file_exists(ABSPATH . "wp-content/uploads/elmercado-home-static/index.html"),
              "google_fetch_function_available" => function_exists("mdo_review_counts_fetch_google_010279"),
            );
            if (function_exists("mdo_review_counts_fetch_google_010279")) {
              $fetched = mdo_review_counts_fetch_google_010279();
              $s["google_fetched_live"] = is_wp_error($fetched) ? $fetched->get_error_message() : (int) $fetched;
            }
            echo "GOOGLE_COUNTER_DIAGNOSTIC=" . wp_json_encode($s) . PHP_EOL;
          ' --path="$PROD_PATH" --allow-root
          for url in 'https://www.elmercadodeorigen.com/' 'https://www.elmercadodeorigen.com/?home_count_check_20261010=1'; do
            body=$(curl -L -k -sS --max-time 35 "$url" || true)
            echo "PUBLIC_HOME_GOOGLE_COUNTS=$(printf '%s' "$body" | grep -oE '([0-9]{3}) reseñas' | sort -u | tr '\n' ',') url=$url"
            echo "PUBLIC_HOME_DATA_ATTRIBUTE=$(printf '%s' "$body" | grep -oE 'data-google-reviews="[0-9]+"' | head -n1)"
          done
          REMOTE

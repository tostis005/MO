name: Producer store public products fix 20260820

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-producer-store-public-products-20260820.php'
      - '.github/workflows/producer-store-public-products-fix-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Deploy MU plugin and audit public stores
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-producer-store-public-products-20260820.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-producer-store-public-products-20260820.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          cat > /tmp/mdo-producer-store-audit.php <<'PHP'
          <?php
          $users = get_users(array('role__in' => array('wcfm_vendor','vendor')));
          $out = array();
          foreach ($users as $u) {
              $id = (int) $u->ID;
              $disabled = function_exists('elmercado_wcfm_vendor_is_disabled_010210') ? elmercado_wcfm_vendor_is_disabled_010210($id) : false;
              if ($disabled) { continue; }
              $url = function_exists('wcfmmp_get_store_url') ? (string) wcfmmp_get_store_url($id) : '';
              if (!$url) { continue; }
              if (function_exists('elmercado_vendor_owned_product_ids_010235')) {
                  $ids = elmercado_vendor_owned_product_ids_010235($id);
              } else {
                  $ids = get_posts(array('post_type'=>'product','post_status'=>'publish','author'=>$id,'fields'=>'ids','posts_per_page'=>-1,'no_found_rows'=>true,'suppress_filters'=>true));
              }
              $ids = array_values(array_unique(array_filter(array_map('absint',(array)$ids))));
              $out[] = array('vendor_id'=>$id,'name'=>$u->display_name,'url'=>$url,'published_products'=>count($ids));
          }
          echo wp_json_encode($out, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);
          PHP

          REMOTE_AUDIT="/tmp/mdo-producer-store-audit-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP /tmp/mdo-producer-store-audit.php "$STAGING_USER@$STAGING_HOST:$REMOTE_AUDIT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_AUDIT' --path='$PROD_PATH' --allow-root; rm -f '$REMOTE_AUDIT'" > runtime/producer-store-public-products-db-20260820.json

          : > runtime/producer-store-public-products-live-20260820.txt
          python3 - <<'PY'
          import json, subprocess, re, pathlib, time
          data=json.load(open('runtime/producer-store-public-products-db-20260820.json'))
          out=[]
          stamp=str(int(time.time()))
          for row in data:
              url=row['url']
              sep='&' if '?' in url else '?'
              audit_url=f"{url}{sep}mdo_store_audit={stamp}"
              p=subprocess.run(['curl','-k','-L','-sS','--connect-timeout','8','--max-time','35','-H','Cache-Control: no-cache',audit_url],capture_output=True,text=True)
              html=p.stdout
              cards=len(re.findall(r'<li[^>]+class=["\'][^"\']*\bproduct\b',html,re.I))
              empty=bool(re.search(r'no se han encontrado productos|no products were found',html,re.I))
              visit_store=bool(re.search(r'>\s*Visit Store\s*<',html,re.I))
              out.append({**row,'http_bytes':len(html.encode()),'rendered_product_cards':cards,'empty_message':empty,'visit_store_label_present':visit_store})
          pathlib.Path('runtime/producer-store-public-products-live-20260820.txt').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit audit results
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add runtime/producer-store-public-products-db-20260820.json runtime/producer-store-public-products-live-20260820.txt
          git commit -m 'Record producer store public product audit' || true
          git push origin HEAD:main

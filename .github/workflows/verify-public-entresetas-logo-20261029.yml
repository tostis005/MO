name: Verify public EntreSetas storefront and circular logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-public-entresetas-logo-20261029.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect actual anonymous frontend HTML
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import urllib.request, re, html, json
          sites=[
            'https://www.elmercadodeorigen.com/tienda/entresetas/',
            'https://www.elmercadodeorigen.com/producto/seta-de-ostra-ecologica/',
            'https://www.elmercadodeorigen.com/tienda/'
          ]
          for url in sites:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=35) as r:
                status=r.status;final=r.geturl();body=r.read(2800000).decode('utf-8','replace')
              title=re.search(r'<title[^>]*>(.*?)</title>',body,re.S|re.I)
              matches=re.findall(r'<img\b[^>]*(?:EntreSetas_Logo|gravatar|store-logo|vendor-logo|store_logo)[^>]*>',body,re.I)
              imgurl='https://www.elmercadodeorigen.com/wp-content/uploads/2026/10/EntreSetas_Logo.png'
              print('PUBLIC_ENTRESETAS_WEB=',json.dumps({
                'url':url,'status':status,'final_url':final,'bytes':len(body),
                'title':html.unescape(re.sub('<[^>]*>','',title.group(1)).strip()) if title else '',
                'has_vendor_name':'EntreSetas' in body,'has_product_name':'Seta de ostra' in body or 'Seta de Ostra' in body,
                'official_logo_filename_in_html':'EntreSetas_Logo.png' in body,
                'official_logo_url_in_html':imgurl in body,
                'image_markup_count':len(matches),'sample_img_markup':matches[:4]
               },ensure_ascii=False))
              if status!=200:raise ValueError('Non-200 HTML')
            except Exception as e:
              print('PUBLIC_ENTRESETAS_WEB_ERROR=',str(e))
              raise
          PY

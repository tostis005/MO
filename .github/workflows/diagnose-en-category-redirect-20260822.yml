name: Diagnose English category redirect 20260822

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/diagnose-en-category-redirect-20260822.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose redirect and term state
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          mkdir -p .deploy-status
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"
          python3 - <<'PY'
          import subprocess,json,pathlib,re
          base='https://www.elmercadodeorigen.com'
          routes=['/en/product-category/meat/','/en/product-category/hams-and-shoulders/','/en/product-category/preserves/']
          out={'routes':[]}
          for path in routes:
              p=subprocess.run(['curl','-k','-sS','--connect-timeout','8','--max-time','20','-D','-','-o','/dev/null','-A','Mozilla/5.0 EMDO-redirect-diag/1.0','-H','Cache-Control: no-cache, no-store',base+path+'?redirect_diag=1'],capture_output=True,text=True)
              blocks=re.split(r'\r?\n\r?\n',p.stdout.strip())
              headers=blocks[-1] if blocks else p.stdout
              status=0; loc=''
              m=re.search(r'^HTTP/\S+\s+(\d+)',headers,re.M)
              if m: status=int(m.group(1))
              lm=re.search(r'^location:\s*(.+)$',headers,re.I|re.M)
              if lm: loc=lm.group(1).strip()
              out['routes'].append({'path':path,'returncode':p.returncode,'status':status,'location':loc,'headers':headers[-5000:],'stderr':p.stderr[-1000:]})
          pathlib.Path('/tmp/redirect-http.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          TERM_STATE="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval '\$t=get_term_by(\"slug\",\"carnes\",\"product_cat\"); if(!\$t instanceof WP_Term){echo \"missing\"; return;} \$ids=get_posts(array(\"post_type\"=>\"product\",\"post_status\"=>\"publish\",\"posts_per_page\"=>-1,\"fields\"=>\"ids\",\"tax_query\"=>array(array(\"taxonomy\"=>\"product_cat\",\"field\"=>\"term_id\",\"terms\"=>array((int)\$t->term_id),\"include_children\"=>true)),\"suppress_filters\"=>true)); echo wp_json_encode(array(\"term_id\"=>(int)\$t->term_id,\"native_name\"=>\$t->name,\"english_slug\"=>get_term_meta(\$t->term_id,\"_en_US_slug\",true),\"english_name\"=>get_term_meta(\$t->term_id,\"_en_US_name\",true),\"native_link\"=>get_term_link(\$t),\"published_category_products\"=>array_values(array_map(\"intval\",\$ids)),\"normalizer_enabled\"=>get_option(\"mdo_en_category_query_normalizer_enabled_20260821\",\"0\")));' --path='$PROD_PATH' --allow-root 2>/dev/null")"
          export TERM_STATE
          python3 - <<'PY'
          import os,json,pathlib
          report=json.loads(pathlib.Path('/tmp/redirect-http.json').read_text())
          raw=os.environ.get('TERM_STATE','')
          try: report['term_state']=json.loads(raw)
          except Exception: report['term_state_raw']=raw
          pathlib.Path('.deploy-status/en-category-redirect-diagnostic-20260822.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add .deploy-status/en-category-redirect-diagnostic-20260822.json || true
          git commit -m "Record English category redirect diagnostic ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:main

name: Deploy and verify final Huerta integration

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/verify-huerta-final-20260819.php'
      - '.github/scripts/patch-huerta-emdo-1.0.17.py'
      - '.github/workflows/verify-huerta-final-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply EMDO 1.0.17 patch
        run: |
          set -euo pipefail
          python .github/scripts/patch-huerta-emdo-1.0.17.py

      - name: Validate PHP
        run: |
          set -euo pipefail
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l .github/scripts/verify-huerta-final-20260819.php

      - name: Deploy 1.0.17 and verify production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          tar -czf /tmp/mdo-supplier-sync-final.tar.gz mdo-supplier-sync
          REMOTE_ARCHIVE="/tmp/mdo-supplier-sync-final-${GITHUB_RUN_ID}.tar.gz"
          REMOTE_VERIFY="/tmp/verify-huerta-final-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-supplier-sync-final.tar.gz "$STAGING_USER@$STAGING_HOST:$REMOTE_ARCHIVE"
          sshpass -e scp $SCP_OPTIONS .github/scripts/verify-huerta-final-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE_VERIFY"

          mkdir -p .deploy-status
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            mkdir -p '$PROD_PATH/wp-content/plugins'
            tar -xzf '$REMOTE_ARCHIVE' -C '$PROD_PATH/wp-content/plugins'
            rm -f '$REMOTE_ARCHIVE'
            version=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" plugin get mdo-supplier-sync --field=version --path='$PROD_PATH' --allow-root)
            status=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" plugin get mdo-supplier-sync --field=status --path='$PROD_PATH' --allow-root)
            test \"\$version\" = '1.0.17'
            test \"\$status\" = 'active'
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$REMOTE_VERIFY' --path='$PROD_PATH' --allow-root
            code=\$?
            rm -f '$REMOTE_VERIFY'
            exit \$code
          " > .deploy-status/huerta-final-verification.json
          CODE=$?
          set -e
          echo "$CODE" > .deploy-status/huerta-final-verification.exit-code

      - name: Record deployed source and verification
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/huerta-final-verification.json .deploy-status/huerta-final-verification.exit-code || true
          git add mdo-supplier-sync/connectors/class-mdo-connector-huerta-ana-mary-v3.php \
                  mdo-supplier-sync/mdo-supplier-sync.php \
                  mdo-supplier-sync/deploy-version.txt \
                  .github/workflows/deploy-mdo-supplier-sync-production-20260819.yml || true
          git commit -m 'Record Huerta EMDO 1.0.17 production verification [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if verification failed
        if: always()
        run: |
          test -f .deploy-status/huerta-final-verification.exit-code
          test "$(cat .deploy-status/huerta-final-verification.exit-code)" = "0"

# EMDO 1.0.17 production verification trigger: 2026-08-19

name: Home desktop CLS fix 20260820

on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-desktop-cls-fix-20260820.yml']

permissions:
  contents: write

concurrency:
  group: home-desktop-cls-fix-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Deploy CLS MU and rebuild Home cache
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp);php_bin=$(command -v php||true);[ -n "$php_bin" ]||php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1);for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null);do p=$(dirname "$cfg");u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true);case "$u" in *elmercadodeorigen.com*)printf "%s" "$p";break;;esac;done')"
          : "${PROD:?no production path found}"
          echo "$PROD" >/tmp/prod-cls
          sshpass -e scp $SCP elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cls-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "MU='$PROD/wp-content/mu-plugins';if [ -f \"\$MU/elmercado-home-cls-010256.php\" ];then cp \"\$MU/elmercado-home-cls-010256.php\" /tmp/home-cls-before-${GITHUB_RUN_ID}.php;fi;install -m0644 /tmp/home-cls-${GITHUB_RUN_ID}.php \"\$MU/elmercado-home-cls-010256.php\";php_bin=\$(command -v php||true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css"
          for i in 1 2 3;do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null;done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-cls.html
          grep -q 'elmercado-home-vendors-critical-010256-14' /tmp/home-cls.html

      - name: Measure CLS desktop 3x and mobile 1x
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' >/tmp/cls.json
          const puppeteer=require('puppeteer-core');
          async function measure(browser,width,height,runs){
            const out=[];
            for(let i=0;i<runs;i++){
              const page=await browser.newPage();
              await page.setViewport({width,height,deviceScaleFactor:1});
              await page.evaluateOnNewDocument(()=>{window.__cls=0;window.__shifts=[];new PerformanceObserver(list=>{for(const e of list.getEntries()){if(!e.hadRecentInput){window.__cls+=e.value;window.__shifts.push({value:e.value,time:e.startTime,sources:(e.sources||[]).map(s=>{const n=s.node;if(!n||!n.tagName)return '';let x=n.tagName.toLowerCase();if(n.id)x+='#'+n.id;if(n.classList&&n.classList.length)x+='.'+[...n.classList].slice(0,4).join('.');return x;})});}}}).observe({type:'layout-shift',buffered:true});});
              await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'load',timeout:60000});
              await new Promise(r=>setTimeout(r,7000));
              out.push(await page.evaluate(()=>({cls:window.__cls,top:[...window.__shifts].sort((a,b)=>b.value-a.value).slice(0,5)})));
              await page.close();
            }
            return out;
          }
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const desktop=await measure(b,1350,940,3);const mobile=await measure(b,412,915,1);console.log(JSON.stringify({desktop,mobile},null,2));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 - <<'PY' | tee runtime/home-desktop-cls-fix-20260820.txt
          import json, statistics
          d=json.load(open('/tmp/cls.json'))
          desktop=[x['cls'] for x in d['desktop']]
          mobile=[x['cls'] for x in d['mobile']]
          print('desktop=',desktop)
          print('desktop_median=',statistics.median(desktop))
          print('desktop_max=',max(desktop))
          for i,x in enumerate(d['desktop'],1): print('desktop_run',i,'top=',x['top'])
          print('mobile=',mobile)
          keep=max(desktop)<0.06 and max(mobile)<0.02
          print('keep=',str(keep).lower())
          open('/tmp/keep-desktop-cls','w').write('1' if keep else '0')
          PY

      - name: Restore production if validation fails
        if: always()
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail
          K=$(cat /tmp/keep-desktop-cls 2>/dev/null||echo 0)
          PROD=$(cat /tmp/prod-cls 2>/dev/null||true)
          if [ "$K" != 1 ] && [ -n "$PROD" ];then
            PORT="${STAGING_PORT:-22}"
            SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "MU='$PROD/wp-content/mu-plugins';if [ -f /tmp/home-cls-before-${GITHUB_RUN_ID}.php ];then install -m0644 /tmp/home-cls-before-${GITHUB_RUN_ID}.php \"\$MU/elmercado-home-cls-010256.php\";fi;php_bin=\$(command -v php||true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css"
          fi

      - name: Record result
        if: always()
        shell: bash
        run: |
          [ -f runtime/home-desktop-cls-fix-20260820.txt ] || echo failed > runtime/home-desktop-cls-fix-20260820.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-desktop-cls-fix-20260820.txt
          git commit -m 'Record desktop Home CLS fix validation' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

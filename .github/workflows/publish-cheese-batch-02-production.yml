name: Publish cheese batch 02 production

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-cheese-batch-02-production.php'
      - '.github/workflows/publish-cheese-batch-02-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-cheese-batch-02-production.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Publish Spanish and English cheese articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/publish-cheese-batch02-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/publish-cheese-batch-02-production.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" | tee /tmp/cheese-batch02-output.txt
          grep -q 'EMDO_CHEESE_BATCH02_BEGIN' /tmp/cheese-batch02-output.txt
          grep -q '"count":10' /tmp/cheese-batch02-output.txt
          grep -q 'EMDO_CHEESE_BATCH02_END' /tmp/cheese-batch02-output.txt

      - name: Verify public Spanish and English URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'quesos-dop-espana-que-garantizan-guia-regiones-estilos'
            'queso-idiazabal-dop-leche-territorio-ahumado-como-reconocerlo'
            'queso-cabrales-dop-que-es-maduracion-cueva-como-reconocerlo'
            'torta-del-casar-dop-que-es-como-se-elabora-como-servirla'
            'queso-mahon-menorca-dop-origen-tipos-maduracion-como-reconocerlo'
            'queso-majorero-dop-leche-cabra-majorera-maduracion-tipos-corteza'
            'queso-tetilla-dop-que-es-como-se-elabora-perfil'
            'queso-murcia-al-vino-dop-leche-cabra-banos-vino-como-reconocerlo'
            'como-se-hace-queso-leche-cuajada-prensado-maduracion'
            'como-catar-queso-aroma-textura-sabor-intensidad-persistencia'
          )
          en_slugs=(
            'pdo-cheeses-spain-what-designation-guarantees-guide-regions-styles'
            'idiazabal-pdo-cheese-milk-territory-smoking-how-identify'
            'cabrales-pdo-cheese-what-it-is-cave-maturation-how-identify'
            'torta-del-casar-pdo-what-it-is-how-made-how-serve'
            'mahon-menorca-pdo-cheese-origin-types-maturation-how-identify'
            'majorero-pdo-cheese-majorera-goat-milk-maturation-rind-styles'
            'tetilla-pdo-cheese-what-it-is-how-made-flavour-profile'
            'murcia-al-vino-pdo-cheese-goat-milk-wine-washing-how-identify'
            'how-cheese-is-made-milk-curd-pressing-maturation'
            'how-to-taste-cheese-aroma-texture-flavour-intensity-persistence'
          )
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 5
            done
            echo "FAILED $code $url" >&2; return 1
          }
          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

          # Editorial spot checks: no empty related heading and correct topic-specific copy.
          python3 - <<'PY'
import re, urllib.request
urls = [
 ('https://www.elmercadodeorigen.com/queso-idiazabal-dop-leche-territorio-ahumado-como-reconocerlo/','¿Todo Idiazabal está ahumado?'),
 ('https://www.elmercadodeorigen.com/queso-cabrales-dop-que-es-maduracion-cueva-como-reconocerlo/','¿Cabrales se hace siempre con tres leches?'),
 ('https://www.elmercadodeorigen.com/como-se-hace-queso-leche-cuajada-prensado-maduracion/','1. La leche: la receta empieza antes del cuajo'),
 ('https://www.elmercadodeorigen.com/como-catar-queso-aroma-textura-sabor-intensidad-persistencia/','5. Intensidad, equilibrio y persistencia'),
]
for url, expected in urls:
    html = urllib.request.urlopen(url + '?batch02_verify=1', timeout=45).read().decode('utf-8','ignore')
    if expected not in html:
        raise SystemExit('missing expected content on ' + url)
    for heading in ('Guías relacionadas','Related guides'):
        m = re.search(r'<h2>\s*'+re.escape(heading)+r'\s*</h2>(.*?)(?=<h2>|$)', html, re.I|re.S)
        if m and '<a ' not in m.group(1).lower():
            raise SystemExit('empty related block on ' + url)
    print('CONTENT OK', url)
PY

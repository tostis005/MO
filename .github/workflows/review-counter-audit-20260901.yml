name: Review counter source audit 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-counter-audit-20260901.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production review counters and direct-source capability
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" > review-counter-audit-output.txt <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          echo '--- active plugins relevant to reviews/google/trust ---'
          "$php_bin" "$wp_bin" plugin list --path="$PROD_PATH" --allow-root --status=active --format=csv 2>/dev/null | grep -Ei 'google|trust|review|place|elementor|cron' || true

          echo '--- front page ids ---'
          FRONT_ID=$("$php_bin" "$wp_bin" option get page_on_front --path="$PROD_PATH" --allow-root 2>/dev/null || true)
          echo "FRONT_ID=${FRONT_ID:-none}"
          if [ -n "${FRONT_ID:-}" ] && [ "$FRONT_ID" != 0 ]; then
            echo '--- front page review markers ---'
            "$php_bin" "$wp_bin" post meta get "$FRONT_ID" _elementor_data --path="$PROD_PATH" --allow-root 2>/dev/null | grep -Eio '.{0,90}(google|trustpilot|reseñ|review|opiniones|valoraciones|294|169).{0,150}' | head -n 80 || true
          fi

          echo '--- configured credential names only; values hidden ---'
          CFG="$PROD_PATH/wp-config.php"
          if [ -f "$CFG" ]; then
            grep -Eio "define\([[:space:]]*['\"][A-Z0-9_]*(GOOGLE|PLACES|MAPS|TRUSTPILOT)[A-Z0-9_]*['\"]" "$CFG" | sed -E "s/define\([[:space:]]*['\"]//" | sort -u || true
          fi
          env | cut -d= -f1 | grep -Ei 'GOOGLE|PLACES|MAPS|TRUSTPILOT' | sort -u || true

          echo '--- option names relevant to review sources; values hidden ---'
          PREFIX=$("$php_bin" "$wp_bin" db prefix --path="$PROD_PATH" --allow-root 2>/dev/null || echo wp_)
          "$php_bin" "$wp_bin" db query "SELECT option_name FROM ${PREFIX}options WHERE option_name REGEXP 'google|place|maps|trustpilot|trustindex|review' ORDER BY option_name LIMIT 250;" --skip-column-names --path="$PROD_PATH" --allow-root 2>/dev/null || true

          echo '--- cron review/source markers ---'
          "$php_bin" "$wp_bin" cron event list --fields=hook,next_run_gmt,recurrence --format=csv --path="$PROD_PATH" --allow-root 2>/dev/null | grep -Ei 'google|trust|review|sync|feed' || true
          REMOTE
          cat review-counter-audit-output.txt

      - name: Commit safe audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-counter-audit-output.txt
          git commit -m 'Record safe review counter audit output' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

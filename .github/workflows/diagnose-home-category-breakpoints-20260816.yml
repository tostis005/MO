name: Diagnose Home category breakpoints 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/diagnose-home-category-breakpoints-20260816.yml'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q selenium
      - name: Width matrix
        run: |
          python3 - <<'PY'
          import shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          c=shutil.which('google-chrome') or shutil.which('chromium');o=Options();o.binary_location=c;o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1400,1200')
          d=webdriver.Chrome(options=o)
          try:
            d.get('https://www.elmercadodeorigen.com/?mdo_breakpoint_diag=20260816');time.sleep(7)
            for w in [1366,1280,1200,1100,1024,900,820,768,600,480,390]:
              d.set_window_size(w,1200);time.sleep(.7)
              z=d.execute_script('''const g=document.querySelector('.emo-category-grid'),cs=g?getComputedStyle(g):null;const a=[...document.querySelectorAll('.emo-category-card')].find(e=>(e.innerText||'').trim().startsWith('Aceites'));const r=a?a.getBoundingClientRect():null;return {vw:innerWidth,gridDisplay:cs&&cs.display,gridOverflow:cs&&cs.overflow,gridCols:cs&&cs.gridTemplateColumns,ace:r&&{l:r.left,r:r.right,w:r.width,visible:r.right>0&&r.left<innerWidth}}''')
              print(z)
          finally:d.quit()
          PY

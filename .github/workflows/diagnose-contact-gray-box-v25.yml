name: Diagnose contact gray box v25
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-contact-gray-box-v25.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production forms
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$($SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1);
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          PHP_BIN="$($SSH "$STAGING_USER@$STAGING_HOST" "command -v php || find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1")"
          WP_BIN="$($SSH "$STAGING_USER@$STAGING_HOST" "command -v wp")"
          {
            echo 'PAGES'
            $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP_BIN' -d memory_limit=512M '$WP_BIN' post list --post_type=page --post_status=publish --fields=ID,post_title,post_name --format=csv --path='$PROD_PATH' --allow-root" | grep -Ei 'contact|productor|ID,' || true
            echo 'ACTIVE_FORM_PLUGINS'
            $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP_BIN' -d memory_limit=512M '$WP_BIN' plugin list --status=active --fields=name,status --format=csv --path='$PROD_PATH' --allow-root" | grep -Ei 'contact|form|fluent|wpforms|gravity|ninja|forminator|cf7|name,' || true
            echo 'PAGE_CONTENTS'
            $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP_BIN' -d memory_limit=512M '$WP_BIN' eval 'global \$wpdb; \$rows=\$wpdb->get_results(\"SELECT ID,post_title,post_name,post_content FROM {\$wpdb->posts} WHERE post_type=\\\"page\\\" AND post_status=\\\"publish\\\" AND (post_title LIKE \\\"%Contact%\\\" OR post_title LIKE \\\"%productor%\\\" OR post_name LIKE \\\"%contact%\\\" OR post_name LIKE \\\"%productor%\\\") ORDER BY ID\"); foreach(\$rows as \$r){echo \"---PAGE {\$r->ID} {\$r->post_title} /{\$r->post_name}/---\\n\"; echo substr(\$r->post_content,0,12000).\"\\n\";}' --path='$PROD_PATH' --allow-root"
          } > runtime-contact-v25.txt
          cat runtime-contact-v25.txt
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p runtime
          mv runtime-contact-v25.txt runtime/contact-gray-box-v25-report.txt
          git add runtime/contact-gray-box-v25-report.txt
          git commit -m 'Record contact gray box diagnostic v25'
          git pull --rebase origin main
          git push origin HEAD:main

name: Verify 18 hand-authored Tropitop English product URLs
on:
  workflow_run:
    workflows: ["Hand-authored first 18 Tropitop English product fiches"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile .github/scripts/verify-tropitop-first18-handenglish-public-20261021.py
      - name: Check 18 English product canonicals and public rendering
        run: python3 -u .github/scripts/verify-tropitop-first18-handenglish-public-20261021.py

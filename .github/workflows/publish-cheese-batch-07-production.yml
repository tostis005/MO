name: Publish cheese batch 07 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-07-chunk-*.b64'
      - '.github/scripts/publish-cheese-batch-07-production.php'
      - '.github/workflows/publish-cheese-batch-07-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate editorial package
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .github/scripts -maxdepth 1 -type f -name 'cheese-batch-07-chunk-*.b64' | wc -l | tr -d ' ')"
          [ "$count" -eq 8 ]
          python -c "import glob,hashlib; p=''.join(open(f,encoding='utf-8').read().strip() for f in sorted(glob.glob('.github/scripts/cheese-batch-07-chunk-*.b64'))); assert hashlib.sha256(p.encode()).hexdigest() == 'e1ec1b0c81e8d9e0946ed28489615cc6d77a308ebb2a4f11f1766304b14224d7'"
          php -l .github/scripts/publish-cheese-batch-07-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese07-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-07-chunk-*.b64 \
            .github/scripts/publish-cheese-batch-07-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/publish-cheese-batch-07-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" | tee /tmp/cheese07-output.txt
          grep -q 'EMDO_CHEESE_BATCH07_BEGIN' /tmp/cheese07-output.txt
          grep -q '"count":10' /tmp/cheese07-output.txt
          grep -q 'EMDO_CHEESE_BATCH07_END' /tmp/cheese07-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          json_line="$(awk '/EMDO_CHEESE_BATCH07_BEGIN/{getline; print; exit}' /tmp/cheese07-output.txt)"
          printf '%s\n' "$json_line" | jq -e '.count == 10 and ([.posts[].status] | all(. == "publish"))' >/dev/null
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 4
            done
            echo "FAILED $code $url" >&2
            return 1
          }
          while IFS= read -r slug; do check_url "$base/$slug/"; done < <(printf '%s\n' "$json_line" | jq -r '.posts[].slug')
          while IFS= read -r slug; do check_url "$base/en/$slug/"; done < <(printf '%s\n' "$json_line" | jq -r '.posts[].en_slug')
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

          curl -L -sS --max-time 45 "$base/quesos-asturias-cabrales-gamoneu-afuega-pitu-casin-beyos-guia/?verify=$GITHUB_RUN_ID" -o /tmp/asturias.html
          grep -Fq 'Un territorio relativamente pequeño' /tmp/asturias.html
          curl -L -sS --max-time 45 "$base/quesos-canarias-majorero-palmero-flor-guia-guia/?verify=$GITHUB_RUN_ID" -o /tmp/canarias.html
          grep -Fq 'tres nombres que no son equivalentes' /tmp/canarias.html
          curl -L -sS --max-time 45 "$base/queso-fresco-que-es-elaboracion-conservacion-diferencias-madurado/?verify=$GITHUB_RUN_ID" -o /tmp/fresco.html
          grep -Fq 'Por qué dura menos' /tmp/fresco.html
          curl -L -sS --max-time 45 "$base/quesos-corteza-florida-moho-blanco-como-se-forma-comer-corteza/?verify=$GITHUB_RUN_ID" -o /tmp/florida.html
          grep -Fq 'Diferencia entre flora intencionada' /tmp/florida.html
          curl -L -sS --max-time 45 "$base/quesos-pasta-hilada-que-son-estirar-cuajada-fundido/?verify=$GITHUB_RUN_ID" -o /tmp/hilada.html
          grep -Fq 'El papel del pH y del calcio' /tmp/hilada.html
          curl -L -sS --max-time 45 "$base/en/$(printf '%s\n' "$json_line" | jq -r '.posts[] | select(.slug == "queso-envasado-vacio-conservar-abrir-olor-textura") | .en_slug')/?verify=$GITHUB_RUN_ID" -o /tmp/vacuum-en.html
          grep -Fq 'Why cheese may smell stronger just after opening' /tmp/vacuum-en.html
          echo 'Cheese batch 07 public editorial verification OK'

name: Send one real Woo customer email preview with Club reward
on:
  pull_request:
    paths:
      - '.github/workflows/send-real-order-reward-preview-20261108.yml'
permissions:
  contents: read
jobs:
  email_preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Render last paid order as actual Woo customer-completed email and send only to Jose
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          SSH_PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
            "$USER@$HOST" 'sh -s' <<'REMOTE'
          set -eu
          ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          PHP='/opt/plesk/php/8.2/bin/php'
          WP='/usr/local/bin/wp'
          test -f "$ROOT/wp-config.php"
          URL=$("$PHP" -d memory_limit=512M "$WP" option get siteurl --path="$ROOT" --skip-plugins --skip-themes --allow-root)
          case "$URL" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) ;;
            *) echo 'UNEXPECTED_SITE'; exit 3 ;;
          esac
          VERSION=$("$PHP" -d memory_limit=512M "$WP" plugin get mdo-supplier-sync --field=version --path="$ROOT" --allow-root)
          test "$VERSION" = '1.0.82'
          SENT_MARKER='/tmp/mdo-club-actual-order-preview-20261108-sent'
          if [ -f "$SENT_MARKER" ]; then
            echo 'PREVIEW_ALREADY_SENT_FOR_DATE=yes'
            exit 0
          fi
          SCRIPT=$(mktemp /tmp/emdo-preview-XXXXXX.php)
          chmod 600 "$SCRIPT"
          trap 'rm -f "$SCRIPT"' EXIT
          cat > "$SCRIPT" <<'PHP_CODE'
          <?php
          // User-requested, one-time preview. No order mutation, no customer email.
          if (!class_exists('WooCommerce') || !class_exists('MDO_Club')) { exit(5); }
          $ids = wc_get_orders(array(
              'limit' => 1, 'orderby' => 'date', 'order' => 'DESC',
              'return' => 'ids', 'type' => 'shop_order'
          ));
          if (!$ids) { exit(6); }
          $order = wc_get_order((int)$ids[0]);
          if (!$order || !$order->has_status('completed') || !$order->is_paid()) { exit(7); }
          $award = (int) $order->get_meta('_mdo_club_award_cents');
          if (!$order->get_customer_id() || $award <= 0) { exit(8); }
          if (!has_action('woocommerce_email_before_order_table', array('MDO_Club','customer_reward_email'))) { exit(9); }
          $emails = WC()->mailer()->get_emails();
          $email = $emails['WC_Email_Customer_Completed_Order'] ?? null;
          if (!$email instanceof WC_Email || $email->id !== 'customer_completed_order') { exit(10); }
          // Render the genuine customer email without triggering a new order
          // email. The sole outbound address is explicitly hardcoded below.
          $email->object = $order;
          $email->recipient = 'jose.fraga@gmail.com';
          $html = $email->get_content_html();
          if (!is_string($html) || strlen($html) < 1500
            || !str_contains($html, '¡Tu compra tiene recompensa!')
            || !str_contains($html, 'CLUB EMDO')
            || !str_contains($html, 'mi-cuenta/monedero/')
          ) { exit(11); }
          $notice = '<p style="background:#fff2d8;color:#714d1c;padding:14px 18px;border:1px solid #e6ca91;border-radius:8px;font-size:13px;font-weight:700">'
            . 'COPIA DE PRUEBA DEL PEDIDO REAL. Solo para revisión de diseño. '
            . 'No es una nueva compra y no se ha generado ni acreditado ningún saldo adicional.</p>';
          // Inside the original Woo HTML body, ahead of the order summary.
          $html = preg_replace('~(<body\b[^>]*>)~i', '$1'.$notice, $html, 1, $count);
          if (!$count) { exit(12); }
          $recipient = 'jose.fraga@gmail.com';
          $subject = '[PRUEBA - PEDIDO REAL #' . (int)$order->get_id()
            . '] Confirmación original de WooCommerce con recompensa Club EMDO';
          $sent = wp_mail($recipient, $subject, $html, array(
            'Content-Type: text/html; charset=UTF-8',
          ));
          if (!$sent) { exit(13); }
          // Print no personal data, addresses, purchased products or HTML.
          echo 'REAL_CUSTOMER_EMAIL_PREVIEW_SENT=yes'
            . ' latest_order_suffix=' . substr((string)$order->get_id(), -2)
            . ' credited_reward=yes'
            . ' recipient=jose.fraga@gmail.com'
            . ' html_bytes=' . strlen($html) . "\n";
          PHP_CODE
          "$PHP" -d memory_limit=768M "$WP" eval-file "$SCRIPT" --path="$ROOT" --allow-root
          touch "$SENT_MARKER"
          REMOTE

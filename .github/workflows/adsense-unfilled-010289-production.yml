name: AdSense unfilled handling 0.10.289 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-unfilled-010289-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/adsense-geo-010266.php
          node --check elmercadodeorigen-child/assets/js/adsense-geo-010266.js
          grep -Fq 'ADSENSE_UNFILLED_COLLAPSE_010289' elmercadodeorigen-child/inc/adsense-geo-010266.php
          grep -Fq 'ADSENSE_PAUSE_DEBUG_010289' elmercadodeorigen-child/assets/js/adsense-geo-010266.js

      - name: Deploy and verify production files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          T="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$T/inc' '$T/assets/js'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/adsense-geo-010266.php "$STAGING_USER@$STAGING_HOST:$T/inc/adsense-geo-010266.php"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/js/adsense-geo-010266.js "$STAGING_USER@$STAGING_HOST:$T/assets/js/adsense-geo-010266.js"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$T/inc/adsense-geo-010266.php'; grep -Fq 'ADSENSE_UNFILLED_COLLAPSE_010289' '$T/inc/adsense-geo-010266.php'; grep -Fq 'ADSENSE_PAUSE_DEBUG_010289' '$T/assets/js/adsense-geo-010266.js'; wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public behavior
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/cuanto-tiempo-marinar-carne-ternera-horas-sal-acidez/?adsense_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 EMDO AdSense verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/blog.html "$URL"
          grep -Fq 'ADSENSE_UNFILLED_COLLAPSE_010289' /tmp/blog.html

          JS_URL=$(grep -oE 'https?[^" ]*adsense-geo-010266\.js[^" ]*' /tmp/blog.html | head -n1 | sed 's/&amp;/\&/g')
          test -n "$JS_URL"
          curl -fsSL --retry 3 "$JS_URL" -o /tmp/adsense.js
          grep -Fq 'ADSENSE_PAUSE_DEBUG_010289' /tmp/adsense.js

          BASE='https://www.elmercadodeorigen.com/wp-json/elmercado/v1/adsense-eligibility'
          US=$(curl -fsSL --retry 3 -H 'X-Country-Code: US' "$BASE?verify=${GITHUB_RUN_ID}us")
          ES=$(curl -fsSL --retry 3 -H 'X-Country-Code: ES' "$BASE?verify=${GITHUB_RUN_ID}es")
          echo "US $US"
          echo "ES $ES"
          grep -Eq '"country"[[:space:]]*:[[:space:]]*"US"' <<< "$US"
          grep -Eq '"show_ads"[[:space:]]*:[[:space:]]*true' <<< "$US"
          grep -Eq '"country"[[:space:]]*:[[:space:]]*"ES"' <<< "$ES"
          grep -Eq '"show_ads"[[:space:]]*:[[:space:]]*false' <<< "$ES"

          ADS=$(curl -fsSL --retry 3 'https://www.elmercadodeorigen.com/ads.txt')
          echo "$ADS"
          grep -Fq 'google.com, pub-3168527008181132, DIRECT, f08c47fec0942fa0' <<< "$ADS"
          echo 'ADSENSE_UNFILLED_PRODUCTION=PASS'

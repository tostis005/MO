name: Refined production English visible audit v3 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-visible-audit-v3-20260815.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save puppeteer-core@24 >/dev/null
      - name: Export inventory
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"; : "${PROD_PATH:?not found}"
          cat > /tmp/inv.php <<'PHP'
          <?php
          if(!defined('ABSPATH'))exit(1);$o=['pages'=>[],'products'=>[],'categories'=>[],'vendors'=>[]];
          foreach(get_posts(['post_type'=>'page','post_status'=>'publish','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC'])as$p)$o['pages'][]=['id'=>$p->ID,'slug'=>$p->post_name,'title'=>$p->post_title];
          foreach(get_posts(['post_type'=>'product','post_status'=>'publish','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC'])as$p)$o['products'][]=['id'=>$p->ID,'slug'=>$p->post_name,'title'=>$p->post_title];
          foreach(get_terms(['taxonomy'=>'product_cat','hide_empty'=>true])as$t)if(!is_wp_error($t))$o['categories'][]=['id'=>$t->term_id,'slug'=>$t->slug,'name'=>$t->name];
          if(function_exists('wcfmmp_get_store_url'))foreach(get_users(['role__in'=>['wcfm_vendor','vendor','seller']])as$u){$url=wcfmmp_get_store_url($u->ID);if($url)$o['vendors'][]=['id'=>$u->ID,'name'=>$u->display_name,'url'=>$url];}
          echo wp_json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          sshpass -e scp $SCP_OPTIONS /tmp/inv.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-en-v3-inv.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); /opt/plesk/php/8.3/bin/php -d memory_limit=1024M -d display_errors=0 \"\$wp_bin\" eval-file /tmp/mdo-en-v3-inv.php --path='$PROD_PATH' --allow-root 2>/dev/null" > production-inventory.json
      - name: Audit rendered English surfaces
        run: |
          cat > ./audit.mjs <<'JS'
          import fs from 'fs';import puppeteer from 'puppeteer-core';
          const inv=JSON.parse(fs.readFileSync('production-inventory.json','utf8'));const maps={};for(const f of fs.readdirSync('.github/data/native-translations-20260815').filter(f=>f.endsWith('.json')))Object.assign(maps,JSON.parse(fs.readFileSync('.github/data/native-translations-20260815/'+f,'utf8')));
          const items=[{kind:'home',id:0,title:'Inicio',url:'https://www.elmercadodeorigen.com/en/'}];for(const p of inv.pages)items.push({kind:'page',id:p.id,title:p.title,url:`https://www.elmercadodeorigen.com/en/${p.slug}/`});for(const p of inv.products)items.push({kind:'product',id:p.id,title:p.title,url:`https://www.elmercadodeorigen.com/en/producto/${p.slug}/`});for(const c of inv.categories)items.push({kind:'category',id:c.id,title:c.name,url:`https://www.elmercadodeorigen.com/en/product-category/${c.slug}/`});for(const v of inv.vendors)items.push({kind:'vendor',id:v.id,title:v.name,url:v.url.replace('https://www.elmercadodeorigen.com/','https://www.elmercadodeorigen.com/en/')});
          const norm=s=>String(s||'').replace(/\s+/g,' ').trim();const es=new Set('el la los las un una unos unas de del al en para por con sin que se su sus este esta estos estas nuestro nuestra nuestros nuestras producto productos tienda envío envíos pedido pedidos precio peso carne ternera jamón paleta aceite cerdo ibérico información ingredientes añadir comprar filtros resultados contacto descuento regalo piezas pieza aproximado bandeja elaborado procedente criado alimentado bellota hierba recursos calidad brida envases sobres loncheado deshuesado unidades disponible entrega seleccionar opciones vendido mostrar mostrando finalizar compra carrito cuenta política condiciones privacidad cookies buscar saber más cargar cerrar ordenar categoría categorías somos devolución cliente producto'.split(' '));const en=new Set('the a an of to in for by with without that this these our product products shop shipping order orders price weight beef ham oil information ingredients add buy filters results contact about from made approximately tray your delivery select options sold showing checkout cart account privacy policy terms cookies search learn more load close sort category categories return customer'.split(' '));const proper=['El Mercado de Origen','Hidalgo de la Jara','Los Pedroches','Tolecarnes','1957','Córdoba','España','AOVE'];
          const months=/(\bEnero\b|\bFebrero\b|\bMarzo\b|\bAbril\b|\bMayo\b|\bJunio\b|\bJulio\b|\bAgosto\b|\bSeptiembre\b|\bOctubre\b|\bNoviembre\b|\bDiciembre\b)/i;
          function suspicious(text){const out=[];for(const raw of String(text||'').split(/\n+/)){const line=norm(raw);if(line.length<2||line.length>900)continue;if(/^\/?[\w.-]+(?:\/[-\w.%]+)+\/?$/.test(line)||/^https?:\/\//i.test(line)||/^www\./i.test(line)||/^[\w.+-]+@[\w.-]+\.[A-Za-z]+$/.test(line))continue;let t=line;for(const p of proper)t=t.split(p).join('');const words=(t.toLowerCase().match(/[a-záéíóúñü]+/g)||[]);let a=0,b=0;for(const w of words){if(es.has(w))a++;if(en.has(w))b++;}if(/[¿¡]/.test(t))a+=3;if(/[áéíóúñ]/i.test(t))a++;const hard=/(filtrar productos|filtros aplicados|limpiar todo|cerrar filtros|cargar más productos|resultados y ordenación|añadir al carrito|finalizar compra|realizar el pedido|detalles de facturación|gastos? de envío|envíos? en |seleccionar opciones|vendido por|mostrando .* resultados|sin existencias|leer más|\bocultar\b|política de|términos y condiciones|quiénes somos|contacto productores|todos los productos comprados en hidalgo|para proceder con una devolución)/i.test(t)||months.test(t);if(hard||(line.length>=18&&a>=3&&a>b+1))out.push(line);}return [...new Set(out)].slice(0,40);}
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});let cursor=0;const results=[];
          async function one(it){const p=await browser.newPage();p.setDefaultTimeout(15000);await p.setRequestInterception(true);p.on('request',r=>{if(['image','font','media'].includes(r.resourceType()))r.abort();else r.continue();});let resp=null,err='';try{resp=await p.goto(it.url+`${it.url.includes('?')?'&':'?'}mdo_v3=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await new Promise(r=>setTimeout(r,1800));}catch(e){err=e.message;}let d={};try{d=await p.evaluate(()=>{const vis=e=>{const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0;};const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n,lines=[];while(n=w.nextNode()){const par=n.parentElement;if(!par||['SCRIPT','STYLE','NOSCRIPT','SVG'].includes(par.tagName)||!vis(par))continue;const t=(n.nodeValue||'').replace(/\s+/g,' ').trim();if(t)lines.push(t);}return {lang:document.documentElement.lang||'',heads:[...document.querySelectorAll('h1,.product_title')].filter(vis).map(x=>x.innerText.trim()),text:lines.join('\n'),selector:[...document.querySelectorAll('.trp-language-switcher,.trp-floating-switcher,.mdo-language-switcher,.trp-floater-ls')].some(vis)};});}catch(e){err||=e.message;}await p.close();const exp=maps[it.title]||null;const mismatch=!!(exp&&it.kind==='product'&&(d.heads||[]).length&&!(d.heads||[]).some(x=>norm(x)===norm(exp)));return {...it,status:resp?.status()||0,selector:!!d.selector,mismatch,heads:d.heads||[],expected:exp,spanish:suspicious(d.text),err};}
          async function worker(){while(true){const i=cursor++;if(i>=items.length)return;const r=await one(items[i]);results[i]=r;console.log(`${i+1}/${items.length} ${r.status} ${r.kind}#${r.id} es=${r.spanish.length} selector=${r.selector?'YES':'no'} mismatch=${r.mismatch?'YES':'no'} ${r.url}`);if(r.spanish.length)console.log(' SPANISH',JSON.stringify(r.spanish));if(r.mismatch)console.log(' TITLE',JSON.stringify({source:r.title,expected:r.expected,heads:r.heads}));}}
          await Promise.all(Array.from({length:6},worker));
          const shop=await browser.newPage();let shopErrors=[];shop.on('pageerror',e=>shopErrors.push(e.message));await shop.goto('https://www.elmercadodeorigen.com/en/tienda/?mdo_v3_shop='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});let st=await shop.evaluate(()=>window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,shown:window.__emoCatalogLoaderState.shown}:null);const until=Date.now()+45000;while(st&&st.remaining>0&&Date.now()<until){await shop.evaluate(()=>document.querySelector('.emo-catalog-load-state')?.scrollIntoView({block:'center'}));await new Promise(r=>setTimeout(r,1400));st=await shop.evaluate(()=>window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,shown:window.__emoCatalogLoaderState.shown}:null);}const sd=await shop.evaluate(()=>({state:window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,shown:window.__emoCatalogLoaderState.shown}:null,text:document.body?.innerText||'',selector:[...document.querySelectorAll('.trp-language-switcher,.trp-floating-switcher,.mdo-language-switcher,.trp-floater-ls')].some(e=>{const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0;})}));await shop.close();
          const co=await browser.newPage();await co.goto('https://www.elmercadodeorigen.com/en/?add-to-cart=11058&mdo_v3_cart='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});let cr=null,cerr='';try{cr=await co.goto('https://www.elmercadodeorigen.com/en/finalizar-compra/?mdo_v3_checkout='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});}catch(e){cerr=e.message;}const cd=await co.evaluate(()=>({text:document.body?.innerText||'',selector:[...document.querySelectorAll('.trp-language-switcher,.trp-floating-switcher,.mdo-language-switcher,.trp-floater-ls')].some(e=>{const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0;})}));await co.close();await browser.close();
          const shopSpanish=suspicious(sd.text),checkoutSpanish=suspicious(cd.text),bad=results.filter(r=>r.status!==200||r.err||r.selector||r.mismatch||r.spanish.length);const summary={items:results.length,bad:bad.length,statusBad:results.filter(r=>r.status!==200||r.err).length,selectors:results.filter(r=>r.selector).length,mismatches:results.filter(r=>r.mismatch).length,spanishItems:results.filter(r=>r.spanish.length).length,shopState:sd.state,shopSpanish:shopSpanish.length,shopErrors:shopErrors.length,shopSelector:sd.selector,checkoutStatus:cr?.status()||0,checkoutSpanish:checkoutSpanish.length,checkoutSelector:cd.selector};console.log('SUMMARY',JSON.stringify(summary));fs.writeFileSync('audit-v3.json',JSON.stringify({summary,results,shop:{...sd,spanish:shopSpanish,errors:shopErrors},checkout:{status:cr?.status()||0,error:cerr,selector:cd.selector,spanish:checkoutSpanish}},null,2));if(bad.length||!sd.state||sd.state.remaining!==0||shopSpanish.length||shopErrors.length||sd.selector||cr?.status()!==200||cerr||checkoutSpanish.length||cd.selector)process.exitCode=2;
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-english-visible-audit-v3-20260815
          path: |
            production-inventory.json
            audit-v3.json
          retention-days: 3

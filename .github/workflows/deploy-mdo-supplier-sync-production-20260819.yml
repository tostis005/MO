name: Deploy MDO Supplier Sync to production

on:
  push:
    branches: [main]
    paths:
      - 'mdo-supplier-sync/**'
      - '.github/workflows/deploy-mdo-supplier-sync-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mdo-supplier-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test -f mdo-supplier-sync/includes/class-mdo-home-specials.php
          test -f mdo-supplier-sync/assets/css/home-specials.css

      - name: Deploy and verify production plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(sed -n 's/^ \* Version: //p' mdo-supplier-sync/mdo-supplier-sync.php | head -n1 | tr -d '\r')"
          test -n "$EXPECTED_VERSION"
          test -n "${STAGING_HOST:-}"
          test -n "${STAGING_USER:-}"
          test -n "${STAGING_PASSWORD:-}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_ARCHIVE="/tmp/mdo-supplier-sync-${GITHUB_RUN_ID}.tar.gz"
          tar -czf /tmp/mdo-supplier-sync.tar.gz mdo-supplier-sync
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-supplier-sync.tar.gz "$STAGING_USER@$STAGING_HOST:$REMOTE_ARCHIVE"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_ARCHIVE' '$EXPECTED_VERSION'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_ARCHIVE="$2"
          EXPECTED_VERSION="$3"

          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"
          test -n "$php_bin"

          mkdir -p "$PROD_PATH/wp-content/plugins"
          tar -xzf "$REMOTE_ARCHIVE" -C "$PROD_PATH/wp-content/plugins"
          rm -f "$REMOTE_ARCHIVE"

          "$php_bin" -l "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/mdo-supplier-sync.php" >/dev/null
          "$php_bin" -l "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-home-specials.php" >/dev/null

          deployed_version=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=version --path="$PROD_PATH" --allow-root)
          plugin_status=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=status --path="$PROD_PATH" --allow-root)
          test "$deployed_version" = "$EXPECTED_VERSION"
          test "$plugin_status" = 'active'

          promotion_type=$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo post_type_exists("mdo_promotion") ? "1" : "0";' --path="$PROD_PATH" --allow-root)
          test "$promotion_type" = '1'

          promotion_id=$("$php_bin" -d memory_limit=512M "$wp_bin" post list --post_type=mdo_promotion --post_status=publish --name=hamburguesas-ternera-regalo-tolecarnes --format=ids --path="$PROD_PATH" --allow-root | awk '{print $1}')
          test -n "$promotion_id"

          promotion_product=$("$php_bin" -d memory_limit=512M "$wp_bin" post meta get "$promotion_id" _mdo_promo_image_product_id --path="$PROD_PATH" --allow-root 2>/dev/null || true)
          test -n "$promotion_product"
          promotion_product_title=$("$php_bin" -d memory_limit=512M "$wp_bin" post get "$promotion_product" --field=post_title --path="$PROD_PATH" --allow-root)
          printf '%s' "$promotion_product_title" | grep -Eqi 'ternera'
          printf '%s' "$promotion_product_title" | grep -Eqi 'burger|burguer|hamburgues'
          promotion_image=$("$php_bin" -d memory_limit=512M "$wp_bin" post meta get "$promotion_product" _thumbnail_id --path="$PROD_PATH" --allow-root 2>/dev/null || true)
          test -n "$promotion_image"
          test "$promotion_image" != '0'

          "$php_bin" -d memory_limit=512M "$wp_bin" rewrite flush --hard --path="$PROD_PATH" --allow-root >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null || true
          if "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active wp-rocket --path="$PROD_PATH" --allow-root >/dev/null 2>&1; then
            "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          fi

          cachebust=$(date +%s)
          curl -k -L -sS --connect-timeout 5 --max-time 30 "https://www.elmercadodeorigen.com/?mdo_home_specials=$cachebust" -o /tmp/emdo-home-es.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 "https://www.elmercadodeorigen.com/en/?mdo_home_specials=$cachebust" -o /tmp/emdo-home-en.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 https://www.elmercadodeorigen.com/especiales/ -o /tmp/emdo-specials-es.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 https://www.elmercadodeorigen.com/especiales/hamburguesas-ternera-regalo-tolecarnes/ -o /tmp/emdo-special-es.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 https://www.elmercadodeorigen.com/en/specials/ -o /tmp/emdo-specials-en.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 https://www.elmercadodeorigen.com/en/specials/free-beef-burgers-tolecarnes/ -o /tmp/emdo-special-en.html

          grep -Fq 'Especiales del Mercado de Origen' /tmp/emdo-specials-es.html
          ! grep -Fq 'Ahora en El Mercado' /tmp/emdo-specials-es.html
          grep -Fq 'Dos hamburguesas de ternera de regalo' /tmp/emdo-special-es.html
          ! grep -Fq 'Una ventaja especial al comprar productos de Tolecarnes' /tmp/emdo-special-es.html
          grep -Fq 'Two free beef burgers' /tmp/emdo-special-en.html

          grep -Fq 'AHORA EN EL MERCADO DE ORIGEN' /tmp/emdo-home-es.html
          grep -Fq 'Dos hamburguesas de ternera de regalo' /tmp/emdo-home-es.html
          grep -Fq 'Ver especial' /tmp/emdo-home-es.html
          grep -Fq '/especiales/hamburguesas-ternera-regalo-tolecarnes/' /tmp/emdo-home-es.html
          grep -Fq 'mdo-home-specials' /tmp/emdo-home-es.html

          grep -Fq 'NOW AT EL MERCADO DE ORIGEN' /tmp/emdo-home-en.html
          grep -Fq 'Two free beef burgers' /tmp/emdo-home-en.html
          grep -Fq 'View special' /tmp/emdo-home-en.html
          grep -Fq '/en/specials/free-beef-burgers-tolecarnes/' /tmp/emdo-home-en.html
          grep -Fq 'mdo-home-specials' /tmp/emdo-home-en.html

          "$php_bin" -r '
          foreach (["/tmp/emdo-home-es.html", "/tmp/emdo-home-en.html"] as $file) {
              $html = file_get_contents($file);
              $special = strpos($html, "id=\"mdo-home-specials\"");
              $categories = strpos($html, "emo-categories");
              if ($special === false || $categories === false || $special >= $categories) {
                  fwrite(STDERR, "Homepage Specials is not before the categories section.\n");
                  exit(1);
              }
          }
          '

          legacy=$(curl -k -sS --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}|%{redirect_url}' https://www.elmercadodeorigen.com/ofertas/)
          case "$legacy" in
            301\|*'/especiales/'*) ;;
            *) echo "Legacy /ofertas/ redirect failed: $legacy" >&2; exit 1 ;;
          esac

          echo "EMDO $deployed_version active; ES/EN homepage Specials verified before categories."
          REMOTE

name: Deploy MDO Supplier Sync to production

on:
  push:
    branches: [main]
    paths:
      - 'mdo-supplier-sync/**'
      - '.github/workflows/deploy-mdo-supplier-sync-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mdo-supplier-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          ! test -f mdo-supplier-sync/includes/class-mdo-home-specials.php
          ! test -f mdo-supplier-sync/assets/css/home-specials.css

      - name: Deploy rollback and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(sed -n 's/^ \* Version: //p' mdo-supplier-sync/mdo-supplier-sync.php | head -n1 | tr -d '\r')"
          test -n "$EXPECTED_VERSION"
          test -n "${STAGING_HOST:-}"
          test -n "${STAGING_USER:-}"
          test -n "${STAGING_PASSWORD:-}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_ARCHIVE="/tmp/mdo-supplier-sync-${GITHUB_RUN_ID}.tar.gz"
          tar -czf /tmp/mdo-supplier-sync.tar.gz mdo-supplier-sync
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-supplier-sync.tar.gz "$STAGING_USER@$STAGING_HOST:$REMOTE_ARCHIVE"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_ARCHIVE' '$EXPECTED_VERSION'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_ARCHIVE="$2"
          EXPECTED_VERSION="$3"

          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"
          test -n "$php_bin"

          PLUGIN_PATH="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          mkdir -p "$PROD_PATH/wp-content/plugins"
          tar -xzf "$REMOTE_ARCHIVE" -C "$PROD_PATH/wp-content/plugins"
          rm -f "$REMOTE_ARCHIVE"

          rm -f "$PLUGIN_PATH/includes/class-mdo-home-specials.php"
          rm -f "$PLUGIN_PATH/assets/css/home-specials.css"

          "$php_bin" -l "$PLUGIN_PATH/mdo-supplier-sync.php" >/dev/null
          deployed_version=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=version --path="$PROD_PATH" --allow-root)
          plugin_status=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=status --path="$PROD_PATH" --allow-root)
          test "$deployed_version" = "$EXPECTED_VERSION"
          test "$plugin_status" = 'active'

          echo '=== EMDO REVIEW DIAGNOSTICS BEGIN ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '$stats = MDO_Reviews_Integration::import_external(); echo "EXTERNAL_IMPORT_STATS=" . wp_json_encode( $stats ) . PHP_EOL;' --path="$PROD_PATH" --allow-root
          prefix=$("$php_bin" -d memory_limit=512M "$wp_bin" db prefix --path="$PROD_PATH" --allow-root)
          echo '-- EMDO review counts --'
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT source, COALESCE(NULLIF(TRIM(status),''),'EMPTY') AS review_status, COUNT(*) AS total FROM ${prefix}mdo_reviews GROUP BY source, review_status ORDER BY source, review_status" --skip-column-names --path="$PROD_PATH" --allow-root || true
          echo '-- validation methods --'
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COALESCE(NULLIF(validation_method,''),'NONE') AS method, status, COUNT(*) FROM ${prefix}mdo_reviews GROUP BY method,status ORDER BY method,status" --skip-column-names --path="$PROD_PATH" --allow-root || true
          echo '-- duplicate checks --'
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT source, COUNT(*) AS duplicate_groups FROM (SELECT source, source_key FROM ${prefix}mdo_reviews GROUP BY source, source_key HAVING COUNT(*)>1) d GROUP BY source" --skip-column-names --path="$PROD_PATH" --allow-root || true
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT source, COUNT(*) AS duplicate_fingerprints FROM (SELECT source, content_fingerprint FROM ${prefix}mdo_reviews WHERE content_fingerprint IS NOT NULL AND content_fingerprint<>'' GROUP BY source, content_fingerprint HAVING COUNT(*)>1) d GROUP BY source" --skip-column-names --path="$PROD_PATH" --allow-root || true
          echo '-- Google local source counts --'
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) AS all_rows, SUM(CASE WHEN hidden=0 THEN 1 ELSE 0 END) AS visible_rows, SUM(CASE WHEN hidden<>0 THEN 1 ELSE 0 END) AS hidden_rows FROM ${prefix}trustindex_google_reviews" --skip-column-names --path="$PROD_PATH" --allow-root || true
          echo '-- GRP Google source --'
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT COUNT(*) FROM ${prefix}grp_google_review" --skip-column-names --path="$PROD_PATH" --allow-root || true
          echo '-- safe source metadata --'
          printf 'MDO_GOOGLE_COUNT='; "$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_google_review_count --path="$PROD_PATH" --allow-root 2>/dev/null || true
          printf 'MDO_TRUSTPILOT_COUNT='; "$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_trustpilot_review_count --path="$PROD_PATH" --allow-root 2>/dev/null || true
          printf 'MDO_TRUSTPILOT_RATING='; "$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_trustpilot_rating --path="$PROD_PATH" --allow-root 2>/dev/null || true
          printf 'MDO_TRUSTPILOT_SOURCE='; "$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_trustpilot_review_source --path="$PROD_PATH" --allow-root 2>/dev/null || true
          printf 'MDO_TRUSTPILOT_URL='; "$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_trustpilot_review_source_url --path="$PROD_PATH" --allow-root 2>/dev/null || true
          printf 'TRUSTPILOT_ACTIVE='; "$php_bin" -d memory_limit=512M "$wp_bin" option get trustindex-trustpilot-active --path="$PROD_PATH" --allow-root 2>/dev/null || true
          echo '-- installed review-related plugins --'
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin list --fields=name,status,version --format=csv --path="$PROD_PATH" --allow-root | grep -Ei '^(name|.*(trust|google|review).*)' || true
          find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep -Ei 'trust|google|review' | sort || true
          echo '-- Trustpilot plugin DB/API implementation --'
          grep -RniE --include='*.php' 'trustindex_trustpilot_reviews|CREATE TABLE|download_noreg_reviews|getPromoReviews|page.details|page_details' "$PROD_PATH/wp-content/plugins/review-widgets-for-trustpilot" | head -120 || true
          echo '-- Trustpilot get_noreg_list_reviews excerpt --'
          sed -n '1438,1565p' "$PROD_PATH/wp-content/plugins/review-widgets-for-trustpilot/trustindex-plugin.class.php" || true
          echo '-- Trustpilot download_noreg_reviews excerpt --'
          sed -n '1840,1895p' "$PROD_PATH/wp-content/plugins/review-widgets-for-trustpilot/trustindex-plugin.class.php" || true
          echo '=== EMDO REVIEW DIAGNOSTICS END ==='

          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null || true
          if "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active wp-rocket --path="$PROD_PATH" --allow-root >/dev/null 2>&1; then
            "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          fi

          cachebust=$(date +%s)
          home_es=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/home-es.html -w '%{http_code}' "https://www.elmercadodeorigen.com/?rollback=$cachebust")
          home_en=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/home-en.html -w '%{http_code}' "https://www.elmercadodeorigen.com/en/?rollback=$cachebust")
          specials_es=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/specials-es.html -w '%{http_code}' https://www.elmercadodeorigen.com/especiales/)
          special_es=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/special-es.html -w '%{http_code}' https://www.elmercadodeorigen.com/especiales/hamburguesas-ternera-regalo-tolecarnes/)

          test "$home_es" = '200'
          test "$home_en" = '200'
          test "$specials_es" = '200'
          test "$special_es" = '200'
          grep -Fq 'Especiales del Mercado de Origen' /tmp/specials-es.html
          grep -Fq 'Dos hamburguesas de ternera de regalo' /tmp/special-es.html
          ! grep -Fq 'mdo-home-specials' /tmp/home-es.html
          ! grep -Fq 'mdo-home-specials' /tmp/home-en.html

          echo "Rollback verified: EMDO $deployed_version active; ES/EN home HTTP 200; failed homepage Specials integration removed."
          REMOTE
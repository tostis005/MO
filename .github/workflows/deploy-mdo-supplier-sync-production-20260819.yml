name: Deploy MDO Supplier Sync to production

on:
  push:
    branches: [main]
    paths:
      - 'mdo-supplier-sync/**'
      - '.github/workflows/deploy-mdo-supplier-sync-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mdo-supplier-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate EMDO PHP
        shell: bash
        run: |
          set -euo pipefail
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deploy and verify EMDO production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail

          EXPECTED_VERSION="$(sed -n 's/^ \* Version: //p' mdo-supplier-sync/mdo-supplier-sync.php | head -n1 | tr -d '\r')"
          LOCAL_MAIN_SHA="$(sha256sum mdo-supplier-sync/mdo-supplier-sync.php | awk '{print $1}')"
          LOCAL_TP_SHA="$(sha256sum mdo-supplier-sync/includes/class-mdo-reviews-trustpilot-scraper.php | awk '{print $1}')"
          test -n "$EXPECTED_VERSION"
          test -n "${GITHUB_SHA:-}"
          test -n "${STAGING_HOST:-}"
          test -n "${STAGING_USER:-}"
          test -n "${STAGING_PASSWORD:-}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_ARCHIVE="/tmp/mdo-supplier-sync-${GITHUB_RUN_ID}.tar.gz"
          LOCAL_ARCHIVE="/tmp/mdo-supplier-sync-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$LOCAL_ARCHIVE" mdo-supplier-sync
          sshpass -e scp $SCP_OPTIONS "$LOCAL_ARCHIVE" "$STAGING_USER@$STAGING_HOST:$REMOTE_ARCHIVE"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_ARCHIVE' '$EXPECTED_VERSION' '$LOCAL_MAIN_SHA' '$LOCAL_TP_SHA' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_ARCHIVE="$2"
          EXPECTED_VERSION="$3"
          EXPECTED_MAIN_SHA="$4"
          EXPECTED_TP_SHA="$5"
          DEPLOY_SHA="$6"

          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"
          test -n "$php_bin"
          test -n "$DEPLOY_SHA"

          PLUGIN_DIR="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          mkdir -p "$PROD_PATH/wp-content/plugins"
          rm -rf "$PLUGIN_DIR"
          tar -xzf "$REMOTE_ARCHIVE" -C "$PROD_PATH/wp-content/plugins"
          rm -f "$REMOTE_ARCHIVE"

          find "$PLUGIN_DIR" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null
          test "$(sha256sum "$PLUGIN_DIR/mdo-supplier-sync.php" | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          test "$(sha256sum "$PLUGIN_DIR/includes/class-mdo-reviews-trustpilot-scraper.php" | awk '{print $1}')" = "$EXPECTED_TP_SHA"

          deployed_version=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=version --path="$PROD_PATH" --allow-root)
          plugin_status=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=status --path="$PROD_PATH" --allow-root)
          test "$deployed_version" = "$EXPECTED_VERSION"
          test "$plugin_status" = 'active'

          "$php_bin" -d memory_limit=512M "$wp_bin" rewrite flush --hard --path="$PROD_PATH" --allow-root >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null || true
          if "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active wp-rocket --path="$PROD_PATH" --allow-root >/dev/null 2>&1; then
            "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          fi

          for url in \
            'https://www.elmercadodeorigen.com/' \
            'https://www.elmercadodeorigen.com/tienda/' \
            'https://www.elmercadodeorigen.com/blog/'; do
            code=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /dev/null -w '%{http_code}' "$url")
            case "$code" in 200|301|302) ;; *) echo "Health check failed: $url -> $code" >&2; exit 1 ;; esac
          done

          # Publicado únicamente después de completar copia, lint, plugin checks,
          # cache/rewrite y health checks. Los consumidores pueden usarlo como
          # barrera de despliegue sin depender de checksums de archivos que no
          # cambien entre commits.
          printf '%s\n' "$DEPLOY_SHA" > "$PLUGIN_DIR/.emdo-deployed-sha"
          test "$(tr -d '\r\n' < "$PLUGIN_DIR/.emdo-deployed-sha")" = "$DEPLOY_SHA"

          echo "EMDO_DEPLOY_OK version=$deployed_version status=$plugin_status sha=$DEPLOY_SHA"
          REMOTE

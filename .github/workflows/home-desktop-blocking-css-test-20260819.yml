name: Home desktop blocking CSS experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-desktop-blocking-css-test-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-desktop-blocking-css-production
  cancel-in-progress: true

jobs:
  deploy-measure-keep-or-revert:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Home full CSS render blocking
        shell: bash
        run: |
          set -euo pipefail
          CACHE='elmercadodeorigen-child/inc/home-cache.php'
          cp "$CACHE" /tmp/home-cache-before.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          old='''\t$deferred_tag = '<link id="elmercado-home-deferred-css" rel="preload" as="style" href="' . $css_url . '" onload="this.onload=null;this.rel=\\'stylesheet\\'">'\n\t\t. '<noscript><link rel="stylesheet" href="' . $css_url . '"></noscript>';'''
          new='''\t/* Desktop CLS contract 2026-08-19: the complete Home stylesheet is structural.\n\t * Applying it after first paint moves the hero by ~0.7 CLS, so it must be\n\t * available before rendering. The file remains a single first-party request. */\n\t$deferred_tag = '<link id="elmercado-home-deferred-css" rel="stylesheet" href="' . $css_url . '">';'''
          if old not in s:
              raise SystemExit('deferred tag block not found')
          p.write_text(s.replace(old,new,1))
          PY
          php -l "$CACHE"
          grep -q 'Desktop CLS contract 2026-08-19' "$CACHE"

      - name: Deploy cache pipeline and restore stability layer
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "$PROD" > /tmp/prod-path
          RC="/tmp/home-cache-${GITHUB_RUN_ID}.php"; RA="/tmp/home-a11y-${GITHUB_RUN_ID}.php"
          timeout 45s sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:$RC"
          timeout 45s sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/mu-plugins/elmercado-home-a11y-motion-010265.php "$STAGING_USER@$STAGING_HOST:$RA"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; MU='$PROD/wp-content/mu-plugins'
            install -m 0644 '$RC' \"\$THEME/inc/home-cache.php\"
            install -m 0644 '$RA' \"\$MU/elmercado-home-a11y-motion-010265.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/home-cache.php\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css '$RC' '$RA'
          "

      - name: Warm and Lighthouse desktop 3x
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          URL='https://www.elmercadodeorigen.com/'
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 "$URL" -o /dev/null; done
          curl -fsS --compressed --max-time 45 "$URL" -o /tmp/home.html
          grep -q 'id="elmercado-home-deferred-css" rel="stylesheet"' /tmp/home.html
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 "$URL" --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/lhr-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done
          python3 - <<'PY' | tee runtime/home-desktop-blocking-css-20260819.txt
          import json,statistics
          rows=[]
          for i in range(1,4):
              r=json.load(open(f'/tmp/lhr-{i}.json'));a=r['audits']
              row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']}
              rows.append(row);print('run',i,row)
              for item in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]:
                  n=item.get('node') or {};print(' shift',item.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(x[k] for x in rows) for k in rows[0]}
          for k,v in med.items(): print('median_'+k+'=',v)
          keep=med['cls'] < 0.12 and med['lcp'] < 6500 and med['fcp'] < 4000
          print('keep=',str(keep).lower())
          open('/tmp/keep-blocking','w').write('1' if keep else '0')
          PY

      - name: Revert production if experiment fails
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep-blocking 2>/dev/null || echo 0)
          if [ "$KEEP" = 1 ]; then echo 'experiment kept'; exit 0; fi
          cp /tmp/home-cache-before.php elmercadodeorigen-child/inc/home-cache.php
          PROD=$(cat /tmp/prod-path)
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          RR="/tmp/home-cache-revert-${GITHUB_RUN_ID}.php"
          timeout 45s sshpass -e scp $SCP_OPTIONS /tmp/home-cache-before.php "$STAGING_USER@$STAGING_HOST:$RR"
          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; install -m 0644 '$RR' \"\$THEME/inc/home-cache.php\"; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css '$RR'"
          echo 'production reverted'

      - name: Record result and keep source only on success
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-desktop-blocking-css-20260819.txt ] || printf 'deploy=%s\nmeasure=%s\nkeep=false\n' '${{ steps.deploy.outcome }}' '${{ steps.measure.outcome }}' > runtime/home-desktop-blocking-css-20260819.txt
          KEEP=$(cat /tmp/keep-blocking 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then cp /tmp/home-cache-before.php elmercadodeorigen-child/inc/home-cache.php; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-desktop-blocking-css-20260819.txt elmercadodeorigen-child/inc/home-cache.php
          git commit -m 'Measure desktop Home blocking-CSS experiment' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

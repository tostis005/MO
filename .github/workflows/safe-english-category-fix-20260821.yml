name: Safe English category fix 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safe-english-category-fix-20260821.yml'
      - 'runtime/triggers/safe-english-category-fix-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-test-enable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Deploy safely with automatic rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          TARGET="mdo-english-category-query-normalizer-20260821.php"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          REMOTE="$PROD_PATH/wp-content/mu-plugins/$TARGET"
          BACKUP="/tmp/$TARGET.before-${GITHUB_RUN_ID}"

          rollback() {
            echo "ROLLBACK" >&2
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" option update mdo_en_category_query_normalizer_enabled_20260821 0 --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; if [ -f '$BACKUP' ]; then cp '$BACKUP' '$REMOTE'; else rm -f '$REMOTE'; fi; \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
            curl -k -L -sS --connect-timeout 5 --max-time 20 -o /dev/null -w 'rollback_home=%{http_code}\n' 'https://www.elmercadodeorigen.com/' || true
          }
          trap 'rollback' ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$REMOTE' ]; then cp '$REMOTE' '$BACKUP'; fi"
          sshpass -e scp $SCP "mu-plugins/$TARGET" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE'"

          python3 - <<'PY'
          import re,subprocess,time,json
          base='https://www.elmercadodeorigen.com'
          report={'phase':'test','checks':[]}
          def get(url):
            p=subprocess.run(['curl','-k','-L','-sS','--connect-timeout','5','--max-time','22','-A','Mozilla/5.0 EMDO-safe-category/1.0','-w','\n__STATUS__:%{http_code}',url],capture_output=True,text=True)
            raw=p.stdout; m=re.search(r'\n__STATUS__:(\d{3})\s*$',raw); status=int(m.group(1)) if m else 0; body=raw[:m.start()] if m else raw
            return status,body
          status,body=get(base+'/')
          report['checks'].append({'url':base+'/','status':status,'bytes':len(body.encode())})
          if status!=200 or len(body)<100000: raise SystemExit('Spanish homepage unhealthy before enable')
          for path in ['/en/product-category/meat/?mdo_cat_fix_test=1','/en/product-category/hams-and-shoulders/?mdo_cat_fix_test=1']:
            time.sleep(1)
            status,body=get(base+path)
            cards=len(re.findall(r'<li[^>]+class=["\'][^"\']*\bproduct\b',body,re.I)); empty=bool(re.search(r'no products were found|no se han encontrado productos',body,re.I))
            report['checks'].append({'url':base+path,'status':status,'cards':cards,'empty':empty})
            if status!=200 or cards<1 or empty: raise SystemExit('Test-mode category normalization failed')
          open('runtime/safe-english-category-fix-20260821.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" option update mdo_en_category_query_normalizer_enabled_20260821 1 --path='$PROD_PATH' --allow-root >/dev/null; \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$wp_bin\" eval 'if (function_exists(\"rocket_clean_files\")) { rocket_clean_files(array(\"https://www.elmercadodeorigen.com/en/product-category/meat/\",\"https://www.elmercadodeorigen.com/en/product-category/hams-and-shoulders/\",\"https://www.elmercadodeorigen.com/en/product-category/cured-meats/\",\"https://www.elmercadodeorigen.com/en/product-category/packs-and-bundles/\",\"https://www.elmercadodeorigen.com/en/product-category/oils/\")); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          python3 - <<'PY'
          import re,subprocess,time,json,html
          base='https://www.elmercadodeorigen.com'
          report=json.load(open('runtime/safe-english-category-fix-20260821.json'))
          report['phase']='enabled'
          def get(url):
            p=subprocess.run(['curl','-k','-L','-sS','--connect-timeout','5','--max-time','22','-A','Mozilla/5.0 EMDO-safe-category/1.0','-H','Cache-Control: no-cache','-w','\n__STATUS__:%{http_code}',url],capture_output=True,text=True)
            raw=p.stdout; m=re.search(r'\n__STATUS__:(\d{3})\s*$',raw); status=int(m.group(1)) if m else 0; body=raw[:m.start()] if m else raw
            return status,body
          for path in ['/','/en/']:
            status,body=get(base+path); report['checks'].append({'url':base+path,'status':status,'bytes':len(body.encode())})
            if status!=200 or len(body)<100000: raise SystemExit('Homepage unhealthy after enable')
            time.sleep(1)
          status,en=get(base+'/en/')
          links=[]
          for m in re.finditer(r'<a[^>]+class=["\'][^"\']*emo-category-card[^"\']*["\'][^>]+href=["\']([^"\']+)',en,re.I):
            u=html.unescape(m.group(1))
            if u not in links: links.append(u)
          if not links: raise SystemExit('No English category links found')
          for u in links:
            time.sleep(1)
            status,body=get(u)
            cards=len(re.findall(r'<li[^>]+class=["\'][^"\']*\bproduct\b',body,re.I)); empty=bool(re.search(r'no products were found|no se han encontrado productos',body,re.I))
            report['checks'].append({'url':u,'status':status,'cards':cards,'empty':empty})
            if status!=200 or cards<1 or empty: raise SystemExit('Enabled category check failed: '+u)
          open('runtime/safe-english-category-fix-20260821.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

          trap - ERR
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

      - name: Commit verification report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add runtime/safe-english-category-fix-20260821.json || true
          git commit -m 'Record rollback-protected English category verification [skip ci]' || true
          git push origin HEAD:main

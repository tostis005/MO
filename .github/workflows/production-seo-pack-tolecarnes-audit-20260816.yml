name: Production SEO Pack and Tolecarnes audit 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-seo-pack-tolecarnes-audit-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=768M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          echo '=== TRANSLATEPRESS PLUGINS ALL ==='
          wp plugin list --fields=name,status,version --format=csv 2>/dev/null | grep -Ei 'translatepress|trp|multilingual' || true
          echo '=== TRANSLATEPRESS DIRECTORIES ==='
          find "$PROD_PATH/wp-content/plugins" -maxdepth 2 -type d -iname '*translate*' -o -iname '*trp*' 2>/dev/null | sort | head -n 100 || true
          echo '=== SEO PACK CODE MATCHES ==='
          grep -RliE --include='*.php' 'SEO Pack|seo[-_ ]pack|TRP_SEO|slug.*translation' "$PROD_PATH/wp-content/plugins" 2>/dev/null | grep -Ei 'translate|trp|seo' | head -n 100 || true
          echo '=== TRP LICENSE/ADDON OPTION NAMES ONLY ==='
          wp option list --search='trp_%' --fields=option_name --format=csv 2>/dev/null | grep -Ei 'license|addon|seo|settings' | head -n 100 || true
          echo '=== TOLECARNES USERS ==='
          wp user list --fields=ID,user_login,display_name,user_email --format=csv 2>/dev/null | grep -i 'tole' || true
          echo '=== TOLECARNES PRODUCTS ==='
          wp eval '
            $users=get_users(["search"=>"*tole*","search_columns"=>["user_login","display_name","user_nicename"]]);
            foreach($users as $u){
              echo "VENDOR ".$u->ID." | ".$u->display_name." | ".$u->user_login."\n";
              $ids=get_posts(["post_type"=>"product","post_status"=>"publish","author"=>$u->ID,"posts_per_page"=>30,"fields"=>"ids","orderby"=>"ID","order"=>"DESC"]);
              foreach($ids as $id){$p=wc_get_product($id); if(!$p)continue; echo $id." | ".$p->get_type()." | ".$p->get_name()." | price=".$p->get_price()." | slug=".get_post_field("post_name",$id)."\n";}
            }
          ' 2>/dev/null || true
          echo '=== MINIMUM ORDER SETTINGS/PLUGIN ==='
          grep -RniE --include='*.php' 'minimum order|Pedido mínimo|pedido minimo|60' "$PROD_PATH/wp-content/plugins/mdo-supplier-sync" 2>/dev/null | head -n 80 || true
          wp option list --search='*minimum*' --fields=option_name,option_value --format=csv 2>/dev/null | head -n 50 || true
          echo '=== CURRENT TRP MACHINE TRANSLATION ==='
          wp option get trp_machine_translation_settings --format=json 2>/dev/null || true
          wp option get trp_automatic_translation_settings --format=json 2>/dev/null || true
          REMOTE

name: Diagnose production blog image certification 20260822

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/certify-blog-images-20260822.php'
      - '.github/data/editorial-image-overrides-20260821.php'
      - '.github/data/legacy-blog-image-overrides-20260821.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-production-blog-image-certification-20260822
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect production diagnostic
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          REMOTE="/tmp/emdo-blog-cert-diag-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/certify-blog-images-20260822.php \
            .github/data/editorial-image-overrides-20260821.php \
            .github/data/legacy-blog-image-overrides-20260821.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            set +e
            MDO_AUTHORITY_IMAGE_OVERRIDES='$REMOTE/editorial-image-overrides-20260821.php' \
            MDO_LEGACY_IMAGE_OVERRIDES='$REMOTE/legacy-blog-image-overrides-20260821.php' \
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE/certify-blog-images-20260822.php' --path='$PROD_PATH' --allow-root > '$REMOTE/stdout.txt' 2> '$REMOTE/stderr.txt'
            rc=\$?
            set -e
            \"\$php_bin\" -r '\$o=array("exit_code"=>(int)\$argv[1],"stdout"=>(string)file_get_contents(\$argv[2]),"stderr"=>(string)file_get_contents(\$argv[3]),"created_at_utc"=>gmdate("c"));file_put_contents(\$argv[4],json_encode(\$o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT));' \"\$rc\" '$REMOTE/stdout.txt' '$REMOTE/stderr.txt' '$REMOTE/diagnostic.json'
          "
          mkdir -p .deploy-status
          sshpass -e scp $SCP "$STAGING_USER@$STAGING_HOST:$REMOTE/diagnostic.json" .deploy-status/blog-image-cert-diagnostic-20260822.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          python3 - <<'PY'
          import json, os
          p='.deploy-status/blog-image-cert-diagnostic-20260822.json'
          d=json.load(open(p))
          d['source_sha']=os.environ.get('GITHUB_SHA')
          d['run_id']=os.environ.get('GITHUB_RUN_ID')
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('exit_code=',d['exit_code'])
          print('stderr=',d['stderr'][:4000])
          PY

      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/blog-image-cert-diagnostic-20260822.json
          git commit -m "Record blog image certification diagnostic ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Deploy Home WebP 1.0.2 20260819
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-home-webp-102-20260819.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Deploy and verify
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        run: |
          set -euo pipefail
          mkdir -p runtime
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done')"
          : "${PROD_PATH:?}"
          php -l mu-plugins/mdo-home-webp-delivery-20260819.php
          sshpass -e scp $SCP mu-plugins/mdo-home-webp-delivery-20260819.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-home-webp-delivery-20260819.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m 0644 /tmp/mdo-home-webp-delivery-20260819.php '$PROD_PATH/wp-content/mu-plugins/mdo-home-webp-delivery-20260819.php'; grep -q 'Version: 1.0.2' '$PROD_PATH/wp-content/mu-plugins/mdo-home-webp-delivery-20260819.php'; rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html' /tmp/mdo-home-webp-delivery-20260819.php"
          for i in 1 2 3; do curl -fsS --compressed --max-time 50 'https://www.elmercadodeorigen.com/' -o "/tmp/home-$i.html"; done
          cp /tmp/home-3.html /tmp/home.html
          python3 - <<'PY' > /tmp/refs.txt
          import re
          h=open('/tmp/home.html',encoding='utf-8',errors='ignore').read()
          for x in sorted(set(re.findall(r'/wp-content/uploads/[^\s"\'<>]+\.webp',h,re.I))): print('https://www.elmercadodeorigen.com'+x)
          PY
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          REFS=/tmp/refs.txt CHROME="$CHROME" node <<'JS' > /tmp/decode.json
          const fs=require('fs'),puppeteer=require('puppeteer-core');(async()=>{const urls=fs.readFileSync(process.env.REFS,'utf8').trim().split(/\n+/).filter(Boolean);const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});const p=await b.newPage();await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:60000});const r=await p.evaluate(async urls=>Promise.all(urls.map(url=>new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({url,ok:true,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>resolve({url,ok:false});i.src=url;}))),urls);console.log(JSON.stringify(r));await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 - <<'PY' > runtime/home-webp-102-20260819.txt
          import re,json
          h=open('/tmp/home.html',encoding='utf-8',errors='ignore').read();refs=open('/tmp/refs.txt').read().splitlines();d=json.load(open('/tmp/decode.json'));bad=[x for x in d if not x.get('ok')]
          print('webp_refs=',len(refs));print('garrafa=',sum('Garrafa_5L' in x for x in refs));print('aceite=',sum('Aceite-sin-filtrar' in x for x in refs));print('jamon=',sum('JAMON_ACT' in x for x in refs));print('tolecarnes=',sum('Tolecarnes-fondo' in x for x in refs));print('cerdo=',sum('Cerdo-' in x for x in refs));print('packs=',sum('Packs-lotes' in x for x in refs));print('trp_official=',h.count('trp-language-switcher-js-v2-js'));print('trp_lite=',h.count('mdo-trp-language-switcher-lite-js'));print('decode_bad=',bad)
          assert len(refs)>=10 and not bad
          PY
      - name: Lighthouse 3x
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/lh-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet; done
          python3 - <<'PY' >> runtime/home-webp-102-20260819.txt
          import json,statistics
          rows=[]
          for i in (1,2,3):
            a=json.load(open(f'/tmp/lh-{i}.json'));x=a['audits'];trp=jq=unat=0
            for g in (x.get('forced-reflow-insight',{}).get('details') or {}).get('items',[]):
              for z in g.get('items',[]):
                s=z.get('source') or {};u=(s.get('url') or s.get('value') or '') if isinstance(s,dict) else '';t=z.get('reflowTime',0) or 0
                if 'trp-frontend-language-switcher' in u:trp+=t
                if '/jquery/jquery.min.js' in u:jq+=t
                if 'unattributed' in u.lower():unat+=t
            r={'score':round(a['categories']['performance']['score']*100),'fcp':round(x['first-contentful-paint']['numericValue']),'lcp':round(x['largest-contentful-paint']['numericValue']),'tbt':round(x['total-blocking-time']['numericValue']),'cls':round(x['cumulative-layout-shift']['numericValue'],5),'trp':round(trp,2),'jquery':round(jq,2),'unattributed':round(unat,2),'mainthread':round(x['mainthread-work-breakdown']['numericValue']),'image':x.get('image-delivery-insight',{}).get('displayValue') or '', 'css':x.get('unused-css-rules',{}).get('displayValue') or ''};rows.append(r);print('run',i,r)
          for k in ['score','fcp','lcp','tbt','cls','trp','jquery','unattributed','mainthread']:print('median_'+k+'=',statistics.median(r[k] for r in rows))
          PY
      - name: Record
        if: always()
        run: |
          set -euo pipefail; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add runtime/home-webp-102-20260819.txt || true; if ! git diff --cached --quiet; then git commit -m 'Record Home WebP 1.0.2 verification [skip ci]'; git pull --rebase origin main || true; git push origin HEAD:main; fi

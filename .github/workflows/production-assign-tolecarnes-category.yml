name: Assign Tole Carnes category in production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-assign-tolecarnes-category.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-tolecarnes-category
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_DOMAIN: elmercadodeorigen.com
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_PORT: ${{ secrets.STAGING_PORT }}
      SSH_USER: ${{ secrets.STAGING_USER }}
      SSH_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SEARCH_HINT: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - name: Validate connection secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING_HOST secret}"
          : "${SSH_USER:?Missing STAGING_USER secret}"
          : "${SSH_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${SEARCH_HINT:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${SSH_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]

      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve production WordPress by site URL
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$SEARCH_HINT' '$PROD_DOMAIN'" <<'REMOTE'
          set -eu
          hint="${1%/}"
          target="$2"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI is unavailable.' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'No usable PHP CLI binary found.' >&2; exit 1; }

          candidates="$(mktemp)"
          matches="$(mktemp)"
          trap 'rm -f "$candidates" "$matches"' EXIT

          parent="$(dirname "$hint")"
          for base in "$parent" "$HOME" /var/www/vhosts /var/www /home /srv /opt /data /web /www; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 9 -type f -name wp-config.php \
              ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' \
              2>/dev/null >> "$candidates" || true
          done
          sort -u "$candidates" -o "$candidates"

          while IFS= read -r config; do
            [ -n "$config" ] || continue
            path="$(dirname "$config")"
            siteurl="$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            home="$("$php_bin" -d memory_limit=256M "$wp_bin" option get home --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            norm_site="$(printf '%s' "$siteurl" | sed -E 's#^https?://##; s#^www\.##; s#/*$##')"
            norm_home="$(printf '%s' "$home" | sed -E 's#^https?://##; s#^www\.##; s#/*$##')"
            if [ "$norm_site" = "$target" ] || [ "$norm_home" = "$target" ]; then
              printf '%s\n' "$path" >> "$matches"
            fi
          done < "$candidates"

          count="$(sort -u "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
          [ "$count" = '1' ] || { echo "Expected exactly one production WordPress for ${target}; found ${count}." >&2; cat "$matches" >&2; exit 1; }
          wp_path="$(sort -u "$matches" | head -n 1)"
          printf '__WP_PATH__=%s\n' "$wp_path"
          printf '__SITEURL__=%s\n' "$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$wp_path" --skip-plugins --skip-themes --allow-root)"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"
          : "${WP_PATH:?Production WordPress path was not resolved}"
          echo "PROD_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Create Carnes and assign all Tole Carnes products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI is unavailable.' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'No usable PHP CLI binary found.' >&2; exit 1; }

          script="$(mktemp --suffix=.php)"
          trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;

          $normalize = static function ( string $value ): string {
              $value = remove_accents( wp_strip_all_tags( $value ) );
              $value = strtolower( $value );
              return preg_replace( '/[^a-z0-9]+/', '', $value ) ?: '';
          };
          $is_tole = static function ( string $value ) use ( $normalize ): bool {
              $value = $normalize( $value );
              return str_contains( $value, 'tole' ) && str_contains( $value, 'carne' );
          };

          $product_ids = array();
          $supplier_rows = array();
          $vendor_ids = array();
          $suppliers_table = $wpdb->prefix . 'mdo_suppliers';
          $source_table = $wpdb->prefix . 'mdo_source_products';
          $suppliers_exists = $wpdb->get_var( $wpdb->prepare( 'SHOW TABLES LIKE %s', $suppliers_table ) ) === $suppliers_table;
          $source_exists = $wpdb->get_var( $wpdb->prepare( 'SHOW TABLES LIKE %s', $source_table ) ) === $source_table;

          if ( $suppliers_exists ) {
              $rows = $wpdb->get_results( "SELECT id, code, name, vendor_user_id FROM {$suppliers_table}" );
              foreach ( (array) $rows as $row ) {
                  if ( ! $is_tole( (string) $row->code . ' ' . (string) $row->name ) ) {
                      continue;
                  }
                  $supplier_rows[] = array(
                      'id' => (int) $row->id,
                      'code' => (string) $row->code,
                      'name' => (string) $row->name,
                      'vendor_user_id' => (int) $row->vendor_user_id,
                  );
                  if ( (int) $row->vendor_user_id > 0 ) {
                      $vendor_ids[] = (int) $row->vendor_user_id;
                  }
              }
          }

          if ( $source_exists && $supplier_rows ) {
              $supplier_ids = array_values( array_unique( array_map( static fn( $row ) => (int) $row['id'], $supplier_rows ) ) );
              $placeholders = implode( ',', array_fill( 0, count( $supplier_ids ), '%d' ) );
              $sql = $wpdb->prepare( "SELECT DISTINCT wc_product_id FROM {$source_table} WHERE supplier_id IN ({$placeholders}) AND wc_product_id IS NOT NULL AND wc_product_id > 0", ...$supplier_ids );
              foreach ( (array) $wpdb->get_col( $sql ) as $id ) {
                  $product_ids[] = (int) $id;
              }
          }

          foreach ( get_users( array( 'fields' => array( 'ID', 'user_login', 'display_name' ) ) ) as $user ) {
              $haystack = (string) $user->user_login . ' ' . (string) $user->display_name . ' ' . (string) get_user_meta( $user->ID, 'nickname', true );
              if ( $is_tole( $haystack ) ) {
                  $vendor_ids[] = (int) $user->ID;
              }
          }
          $vendor_ids = array_values( array_unique( array_filter( array_map( 'intval', $vendor_ids ) ) ) );

          if ( $vendor_ids ) {
              $by_vendor = get_posts(
                  array(
                      'post_type' => 'product',
                      'post_status' => array( 'publish', 'private', 'draft', 'pending', 'future' ),
                      'posts_per_page' => -1,
                      'fields' => 'ids',
                      'author__in' => $vendor_ids,
                      'orderby' => 'ID',
                      'order' => 'ASC',
                  )
              );
              foreach ( (array) $by_vendor as $id ) {
                  $product_ids[] = (int) $id;
              }
          }

          $product_ids = array_values(
              array_unique(
                  array_filter(
                      array_map( 'intval', $product_ids ),
                      static fn( int $id ): bool => 'product' === get_post_type( $id ) && 'trash' !== get_post_status( $id )
                  )
              )
          );
          sort( $product_ids );

          if ( ! $product_ids ) {
              fwrite( STDERR, "No se han encontrado productos de Tole Carnes; no se modifica producción.\n" );
              exit( 2 );
          }

          $existing = get_term_by( 'slug', 'carnes', 'product_cat' );
          $category_created = false;
          if ( ! $existing ) {
              $inserted = wp_insert_term( 'Carnes', 'product_cat', array( 'slug' => 'carnes' ) );
              if ( is_wp_error( $inserted ) ) {
                  fwrite( STDERR, 'No se pudo crear Carnes: ' . $inserted->get_error_message() . "\n" );
                  exit( 3 );
              }
              $category_id = (int) $inserted['term_id'];
              $category_created = true;
          } else {
              $category_id = (int) $existing->term_id;
          }

          $default_category_id = (int) get_option( 'default_product_cat', 0 );
          $changed = 0;
          $already = 0;
          $errors = array();
          $products = array();

          foreach ( $product_ids as $product_id ) {
              $had_category = has_term( $category_id, 'product_cat', $product_id );
              $result = wp_set_object_terms( $product_id, array( $category_id ), 'product_cat', true );
              if ( is_wp_error( $result ) ) {
                  $errors[] = array( 'id' => $product_id, 'error' => $result->get_error_message() );
                  continue;
              }
              if ( ! $had_category ) {
                  ++$changed;
              } else {
                  ++$already;
              }
              if ( $default_category_id > 0 && $default_category_id !== $category_id && has_term( $default_category_id, 'product_cat', $product_id ) ) {
                  wp_remove_object_terms( $product_id, $default_category_id, 'product_cat' );
              }
              clean_post_cache( $product_id );
              if ( function_exists( 'wc_delete_product_transients' ) ) {
                  wc_delete_product_transients( $product_id );
              }
              $products[] = array( 'id' => $product_id, 'title' => get_the_title( $product_id ) );
          }

          $missing = array_values(
              array_filter(
                  $product_ids,
                  static fn( int $id ): bool => ! has_term( $category_id, 'product_cat', $id )
              )
          );

          $report = array(
              'status' => $errors || $missing ? 'failed' : 'completed',
              'siteurl' => get_option( 'siteurl' ),
              'category' => array( 'id' => $category_id, 'name' => 'Carnes', 'slug' => 'carnes', 'created' => $category_created ),
              'supplier_rows' => $supplier_rows,
              'vendor_ids' => $vendor_ids,
              'products_found' => count( $product_ids ),
              'products_changed' => $changed,
              'products_already_in_category' => $already,
              'missing_after_verification' => $missing,
              'errors' => $errors,
              'products' => $products,
          );
          echo wp_json_encode( $report, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT ) . PHP_EOL;

          if ( $errors || $missing ) {
              exit( 4 );
          }
          PHP

          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file "$script" --path="$wp_path" --allow-root
          REMOTE

name: Production English slug router 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-english-slug-router-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy reversible English page slug router
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path not found}"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          mkdir -p "$MU_DIR"
          TARGET="$MU_DIR/mdo-english-slug-router.php"
          if [ -f "$TARGET" ]; then cp -a "$TARGET" "$TARGET.bak-$(date +%Y%m%d%H%M%S)"; fi
          cat > "$TARGET" <<'PHP'
          <?php
          /**
           * El Mercado de Origen: English page slug compatibility layer.
           * Spanish objects/slugs are never modified. English aliases resolve to the
           * existing objects using _en_US_post_name metadata.
           */
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          function mdo_en_path_slug(): string {
              if ( empty( $_SERVER['REQUEST_URI'] ) ) { return ''; }
              $path = wp_parse_url( wp_unslash( $_SERVER['REQUEST_URI'] ), PHP_URL_PATH );
              if ( ! is_string( $path ) || strpos( $path, '/en/' ) !== 0 ) { return ''; }
              $relative = trim( substr( $path, 4 ), '/' );
              if ( $relative === '' || strpos( $relative, '/' ) !== false ) { return ''; }
              return sanitize_title( $relative );
          }

          function mdo_en_page_id_for_slug( string $slug ): int {
              if ( $slug === '' ) { return 0; }
              $ids = get_posts( array(
                  'post_type'        => 'page',
                  'post_status'      => 'publish',
                  'posts_per_page'   => 2,
                  'fields'           => 'ids',
                  'no_found_rows'    => true,
                  'suppress_filters' => true,
                  'meta_query'       => array(
                      'relation' => 'AND',
                      array( 'key' => '_en_US_post_name', 'value' => $slug, 'compare' => '=' ),
                      array( 'key' => '_en_US_published', 'value' => '1', 'compare' => '=' ),
                  ),
              ) );
              return count( $ids ) === 1 ? (int) $ids[0] : 0;
          }

          add_action( 'parse_request', static function ( WP $wp ): void {
              $slug = mdo_en_path_slug();
              $page_id = mdo_en_page_id_for_slug( $slug );
              if ( ! $page_id ) { return; }

              $shop_id = (int) get_option( 'woocommerce_shop_page_id' );
              unset( $wp->query_vars['error'], $wp->query_vars['name'], $wp->query_vars['pagename'], $wp->query_vars['page_id'], $wp->query_vars['attachment'] );

              if ( $page_id === $shop_id ) {
                  $wp->query_vars['post_type'] = 'product';
                  return;
              }

              unset( $wp->query_vars['post_type'] );
              $wp->query_vars['page_id'] = $page_id;
          }, PHP_INT_MAX );

          add_filter( 'page_link', static function ( string $url, int $post_id ): string {
              if ( mdo_en_path_slug() === '' ) { return $url; }
              $slug = get_post_meta( $post_id, '_en_US_post_name', true );
              $published = get_post_meta( $post_id, '_en_US_published', true );
              $slug = sanitize_title( (string) $slug );
              if ( (string) $published !== '1' || $slug === '' ) { return $url; }
              return home_url( user_trailingslashit( 'en/' . $slug ) );
          }, PHP_INT_MAX, 2 );

          add_filter( 'redirect_canonical', static function ( $redirect ) {
              return mdo_en_page_id_for_slug( mdo_en_path_slug() ) ? false : $redirect;
          }, PHP_INT_MAX );
          PHP
          "$php_bin" -l "$TARGET"
          echo "DEPLOYED=$TARGET"
          REMOTE
      - name: Verify Spanish shop remains intact and English aliases resolve
        shell: bash
        run: |
          set -u
          failed=0
          for path in /tienda/ /en/shop/ /en/cart/ /en/checkout/ /en/my-account/; do
            url="https://www.elmercadodeorigen.com${path}?mdo_en_slug_verify=$(date +%s%N)"
            code=$(curl -ksSL --max-time 35 -o /tmp/mdo-check.html -w '%{http_code}' "$url" || true)
            body=$(grep -oE '<body[^>]*class="[^"]*"' /tmp/mdo-check.html | head -n1 || true)
            h1=$(grep -oE '<h1[^>]*>[^<]{0,120}</h1>' /tmp/mdo-check.html | head -n1 | sed -E 's/<[^>]+>//g' || true)
            products=$( (grep -oE '<li[^>]+class="[^"]*\bproduct\b[^"]*"' /tmp/mdo-check.html || true) | wc -l | tr -d ' ' )
            echo "$path code=$code products=$products h1=$h1"
            echo "$body"
            [ "$code" = 200 ] || failed=1
            if [ "$path" = "/tienda/" ] || [ "$path" = "/en/shop/" ]; then
              echo "$body" | grep -q 'woocommerce-shop' || failed=1
              [ "$products" -gt 0 ] || failed=1
            fi
          done
          exit "$failed"

name: Apply raw vs cooked vegetables image 20260828

# Trigger user-approved Pexels 30700510 deployment.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-raw-vs-cooked-vegetables-image-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy approved Pexels image and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-raw-cooked-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/apply-raw-vs-cooked-vegetables-image-20260828.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > /tmp/result.json 2> /tmp/result.err
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then cat /tmp/result.err >&2; cat /tmp/result.json >&2; exit "$RC"; fi
          cat /tmp/result.json
          jq -e '.verified==true and .selection=="user-url-pexels-30700510" and (.duplicate_preflight.conflicts|length)==0' /tmp/result.json >/dev/null
          jq -e '.image.thumbnail_id==.image.attachment_id and .image.approved_id==.image.attachment_id and .image.uses_default=="" and .image.cover_asset==""' /tmp/result.json >/dev/null

          PERMALINK="$(jq -r '.resolved_post.permalink' /tmp/result.json)"
          IMAGE="$(jq -r '.image.url' /tmp/result.json)"
          ALT="$(jq -r '.image.alt' /tmp/result.json)"
          SLUG="$(jq -r '.resolved_post.slug' /tmp/result.json)"
          OUT=/tmp/raw-cooked-public.html
          CODE="$(curl -L -sS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO featured image verification' -o "$OUT" -w '%{http_code}' "${PERMALINK}?emdo_featured_verify=${GITHUB_RUN_ID}")"
          [ "$CODE" = 200 ]
          BASENAME="$(basename "${IMAGE%%\?*}")"
          grep -Fq "$BASENAME" "$OUT"
          grep -Fq "$ALT" "$OUT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          echo "public_verification_ok slug=$SLUG http=$CODE image=$IMAGE alt=$ALT"

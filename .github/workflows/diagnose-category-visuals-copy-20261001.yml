name: Diagnose category visuals and bilingual copy 20261001

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/diagnose-category-visuals-copy-20261001.php'
      - '.github/workflows/diagnose-category-visuals-copy-20261001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose production state
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          php -l .github/scripts/diagnose-category-visuals-copy-20261001.php >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 22
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"

          REMOTE="/tmp/diagnose-category-visuals-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/diagnose-category-visuals-copy-20261001.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root; rm -f '$REMOTE'" > /tmp/server.json

          BASE="https://www.elmercadodeorigen.com"
          TOKEN="diag-${GITHUB_RUN_ID}-$(date +%s)"
          curl -sS -L --max-time 60 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D /tmp/es.headers "$BASE/categorias/?$TOKEN" -o /tmp/es.html
          curl -sS -L --max-time 60 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D /tmp/en.headers "$BASE/en/categories/?$TOKEN" -o /tmp/en.html

          es_fish=false; grep -Fq 'Pescados, huevas y especialidades del mar en distintos formatos y elaboraciones.' /tmp/es.html && es_fish=true || true
          es_foie=false; grep -Fq 'Foie gras, patés, mousses, rillettes y otras especialidades untables de distintos productores.' /tmp/es.html && es_foie=true || true
          en_fish_name=false; grep -Fq 'Fish and seafood' /tmp/en.html && en_fish_name=true || true
          en_fish_summary=false; grep -Fq 'Fish, roe and seafood specialities in different preparations and formats.' /tmp/en.html && en_fish_summary=true || true
          en_foie_name=false; grep -Fq 'Foie, pâtés and spreads' /tmp/en.html && en_foie_name=true || true
          en_foie_summary=false; grep -Fq 'Foie gras, pâtés, mousses, rillettes and other spreadable specialities from selected producers.' /tmp/en.html && en_foie_summary=true || true
          es_fish_slug=false; grep -Fq 'data-category-slug="pescados-mariscos"' /tmp/es.html && es_fish_slug=true || true
          es_foie_slug=false; grep -Fq 'data-category-slug="foie-pates-untables"' /tmp/es.html && es_foie_slug=true || true
          en_fish_slug=false; grep -Fq 'data-category-slug="pescados-mariscos"' /tmp/en.html && en_fish_slug=true || true
          en_foie_slug=false; grep -Fq 'data-category-slug="foie-pates-untables"' /tmp/en.html && en_foie_slug=true || true

          mkdir -p .deploy-status
          jq             --argjson es_fish "$es_fish"             --argjson es_foie "$es_foie"             --argjson en_fish_name "$en_fish_name"             --argjson en_fish_summary "$en_fish_summary"             --argjson en_foie_name "$en_foie_name"             --argjson en_foie_summary "$en_foie_summary"             --argjson es_fish_slug "$es_fish_slug"             --argjson es_foie_slug "$es_foie_slug"             --argjson en_fish_slug "$en_fish_slug"             --argjson en_foie_slug "$en_foie_slug"             --arg es_headers "$(tr '\n' ' ' < /tmp/es.headers | tr -s ' ' | head -c 3000)"             --arg en_headers "$(tr '\n' ' ' < /tmp/en.headers | tr -s ' ' | head -c 3000)"             '. + {public_html:{
              es:{fish_summary:$es_fish,foie_summary:$es_foie,fish_card:$es_fish_slug,foie_card:$es_foie_slug,headers:$es_headers},
              en:{fish_name:$en_fish_name,fish_summary:$en_fish_summary,foie_name:$en_foie_name,foie_summary:$en_foie_summary,fish_card:$en_fish_slug,foie_card:$en_foie_slug,headers:$en_headers}
            }}' /tmp/server.json > .deploy-status/category-visuals-diagnostic-20261001.json

          jq '{batch,template,terms,active_plugins,cache_files,public_html}' .deploy-status/category-visuals-diagnostic-20261001.json

      - name: Record diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/category-visuals-diagnostic-20261001.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record category visuals production diagnostic [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

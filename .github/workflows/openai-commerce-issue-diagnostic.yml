name: OpenAI Commerce Issue Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-commerce-issue-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production Montjam image assets
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '
            foreach([14287,14301] as $pid){
              $p=wc_get_product($pid); if(!$p) continue;
              echo "PARENT ".wp_json_encode(["id"=>$pid,"name"=>$p->get_name(),"permalink"=>$p->get_permalink(),"image_id"=>(int)$p->get_image_id(),"gallery"=>array_map("absint",(array)$p->get_gallery_image_ids())],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              $meta=get_post_meta($pid);
              foreach($meta as $k=>$vals){ if(preg_match("/(image|thumb|gallery|photo|foto|media|attachment)/i",(string)$k)){ echo "META ".$pid." ".$k." ".wp_json_encode($vals,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n"; } }
            }
            $q=new WP_Query(["post_type"=>"attachment","post_status"=>"inherit","posts_per_page"=>200,"orderby"=>"ID","order"=>"DESC","s"=>"Montjam","fields"=>"ids"]);
            foreach((array)$q->posts as $aid){ echo "MEDIA ".wp_json_encode(["id"=>(int)$aid,"title"=>get_the_title($aid),"url"=>wp_get_attachment_url($aid),"alt"=>get_post_meta($aid,"_wp_attachment_image_alt",true),"parent"=>(int)wp_get_post_parent_id($aid)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n"; }
            $q2=new WP_Query(["post_type"=>"attachment","post_status"=>"inherit","posts_per_page"=>200,"orderby"=>"ID","order"=>"DESC","s"=>"Jabugo","fields"=>"ids"]);
            foreach((array)$q2->posts as $aid){ echo "JABUGO_MEDIA ".wp_json_encode(["id"=>(int)$aid,"title"=>get_the_title($aid),"url"=>wp_get_attachment_url($aid),"alt"=>get_post_meta($aid,"_wp_attachment_image_alt",true),"parent"=>(int)wp_get_post_parent_id($aid)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n"; }
            $montjam=get_posts(["post_type"=>"product","post_status"=>"publish","posts_per_page"=>50,"s"=>"Montjam","fields"=>"ids","suppress_filters"=>true]);
            foreach((array)$montjam as $mid){ $mp=wc_get_product($mid); if(!$mp) continue; echo "MONTJAM_PRODUCT ".wp_json_encode(["id"=>(int)$mid,"name"=>$mp->get_name(),"image_id"=>(int)$mp->get_image_id(),"image_url"=>wp_get_attachment_url((int)$mp->get_image_id())],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n"; }
          ' --path="$PROD_PATH" --allow-root
          REMOTE

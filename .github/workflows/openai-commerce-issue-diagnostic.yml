name: OpenAI Commerce Issue Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-commerce-issue-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Print production OpenAI catalog issues
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '
            $s=mdo_openai_settings_20260909();
            $s["format"]="native_jsonl_gz";
            $s["delivery"]="none";
            $r=mdo_openai_validate_catalog_20260909($s);
            echo "SUMMARY ".wp_json_encode(["parents"=>$r["parents"]??0,"variants"=>$r["variants"]??0,"exported"=>$r["exported"]??0,"excluded"=>$r["excluded"]??0,"errors"=>$r["errors"]??0,"warnings"=>$r["warnings"]??0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            foreach((array)($r["issues"]??[]) as $i=>$issue){
              echo "ISSUE ".($i+1)." ".wp_json_encode($issue,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              $item=(string)($issue["item_id"]??"");
              if($item!==""){
                $posts=get_posts(["post_type"=>["product","product_variation"],"post_status"=>"any","posts_per_page"=>10,"meta_key"=>"_mdo_openai_item_id","meta_value"=>$item,"fields"=>"ids","suppress_filters"=>true]);
                foreach((array)$posts as $pid){
                  $p=wc_get_product($pid); if(!$p) continue;
                  $parent_id=$p instanceof WC_Product_Variation?(int)$p->get_parent_id():(int)$p->get_id();
                  $parent=wc_get_product($parent_id);
                  echo "PRODUCT ".wp_json_encode(["item_id"=>$item,"product_id"=>(int)$pid,"parent_id"=>$parent_id,"name"=>$p->get_name(),"image_id"=>(int)$p->get_image_id(),"gallery"=>array_map("absint",(array)$p->get_gallery_image_ids()),"parent_image_id"=>$parent?(int)$parent->get_image_id():0,"parent_gallery"=>$parent?array_map("absint",(array)$parent->get_gallery_image_ids()):[],"parent_name"=>$parent?$parent->get_name():""],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
                }
              }
            }
          ' --path="$PROD_PATH" --allow-root
          REMOTE

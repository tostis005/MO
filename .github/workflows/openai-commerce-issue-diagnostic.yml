name: OpenAI Commerce Issue Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-commerce-issue-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect recent Montjam attachments
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=768M "$wp_bin" eval '
            global $wpdb;
            $ids=$wpdb->get_col("SELECT ID FROM {$wpdb->posts} WHERE post_type=\"attachment\" AND ID BETWEEN 14250 AND 14320 ORDER BY ID ASC");
            foreach((array)$ids as $aid){echo "ATTACH ".wp_json_encode(["id"=>(int)$aid,"title"=>get_the_title($aid),"url"=>wp_get_attachment_url($aid),"alt"=>get_post_meta($aid,"_wp_attachment_image_alt",true),"parent"=>(int)wp_get_post_parent_id($aid),"date"=>get_post_field("post_date",$aid)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
            $pids=$wpdb->get_col("SELECT ID FROM {$wpdb->posts} WHERE post_type=\"product\" AND ID BETWEEN 14250 AND 14320 ORDER BY ID ASC");
            foreach((array)$pids as $pid){$p=wc_get_product($pid); if(!$p) continue; echo "PRODUCT ".wp_json_encode(["id"=>(int)$pid,"name"=>$p->get_name(),"image_id"=>(int)$p->get_image_id(),"gallery"=>array_map("absint",(array)$p->get_gallery_image_ids())],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
          ' --path="$PROD_PATH" --allow-root
          REMOTE

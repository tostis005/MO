name: Publish nutrition priority batch 46-50 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nutrition-priority-46-50-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrition-priority-46-50-production-global
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify batch 46-50
        shell: bash
        run: bash .github/scripts/run-nutrition-priority-46-50-production.sh

# nutrition roadmap batch 46-50: Iberian cured loin nutrition
# idempotent exact-match adoption + ownership-safe rollback

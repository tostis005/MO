name: Mobile price slider production one-shot v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-price-slider-production-one-shot-v3.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-mobile-price-slider-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      EXPECTED_VERSION: 0.10.209

    steps:
      - uses: actions/checkout@v4

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/functions.php
          test -f elmercadodeorigen-child/inc/mobile-price-slider-alignment-010209.php
          grep -q "ELMERCADO_THEME_VERSION', '$EXPECTED_VERSION'" elmercadodeorigen-child/functions.php
          grep -q 'translateY(-50%)' elmercadodeorigen-child/inc/mobile-price-slider-alignment-010209.php
          grep -q 'margin-top: 0' elmercadodeorigen-child/inc/mobile-price-slider-alignment-010209.php
          grep -q 'box-sizing: border-box' elmercadodeorigen-child/inc/mobile-price-slider-alignment-010209.php
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage child theme
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-price-slider-v3-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/theme'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' --exclude='*.map' -e "ssh $SSH_OPTIONS" elmercadodeorigen-child/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/theme/"

      - name: Deploy and validate registered hook
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA' '$EXPECTED_VERSION'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"; expected="$4"

          dev_path=""
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve staging WordPress root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$prod_path/wp-config.php" ] || { echo 'Production WordPress root missing.' >&2; exit 1; }

          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ] || { echo 'WP-CLI/PHP unavailable.' >&2; exit 1; }

          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
          case "$siteurl" in
            https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;;
            *) echo "Unexpected production siteurl=$siteurl" >&2; exit 1 ;;
          esac

          incoming_theme="$incoming/theme"
          target="$prod_path/wp-content/themes/elmercadodeorigen-child"
          backup="$prod_path/wp-content/themes/.elmercadodeorigen-child.price-slider-v3-${commit}"
          find "$incoming_theme" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '$expected'" "$incoming_theme/functions.php"

          swapped=0
          rollback() {
            code=$?
            if [ "$swapped" -eq 1 ] && [ "$code" -ne 0 ]; then
              echo 'Hook validation failed; restoring previous child theme.' >&2
              rm -rf "$target"
              [ ! -d "$backup" ] || mv "$backup" "$target"
              "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          rm -rf "$backup"
          [ ! -d "$target" ] || mv "$target" "$backup"
          mv "$incoming_theme" "$target"
          swapped=1

          active="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod_path" --skip-plugins --skip-themes --allow-root)"
          [ "$active" = 'elmercadodeorigen-child' ] || { echo "Unexpected active theme=$active" >&2; exit 1; }
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true

          runtime_code="$(cat <<'PHP'
          if ( ! defined( 'ELMERCADO_THEME_VERSION' ) || '0.10.209' !== ELMERCADO_THEME_VERSION ) { fwrite( STDERR, "Wrong runtime theme version\n" ); exit( 21 ); }
          $needle = 'mobile-price-slider-alignment-010209.php';
          $included = false;
          foreach ( get_included_files() as $file ) {
              if ( $needle === basename( $file ) ) { $included = true; break; }
          }
          if ( ! $included ) { fwrite( STDERR, "Slider module not included at runtime\n" ); exit( 22 ); }
          global $wp_filter;
          $hooked = false;
          if ( isset( $wp_filter['wp_head'] ) && is_object( $wp_filter['wp_head'] ) ) {
              foreach ( (array) $wp_filter['wp_head']->callbacks as $priority => $callbacks ) {
                  foreach ( (array) $callbacks as $entry ) {
                      $fn = $entry['function'] ?? null;
                      if ( $fn instanceof Closure ) {
                          $ref = new ReflectionFunction( $fn );
                          if ( $needle === basename( (string) $ref->getFileName() ) ) { $hooked = true; break 2; }
                      }
                  }
              }
          }
          if ( ! $hooked ) { fwrite( STDERR, "Slider module is not registered on wp_head\n" ); exit( 23 ); }
          $file = ELMERCADO_THEME_PATH . '/inc/mobile-price-slider-alignment-010209.php';
          $source = (string) file_get_contents( $file );
          if ( false === strpos( $source, 'transform: translateY(-50%)' ) || false === strpos( $source, 'margin-top: 0' ) ) { fwrite( STDERR, "Centering CSS missing from runtime module\n" ); exit( 24 ); }
          echo 'MOBILE_PRICE_SLIDER_HOOK_OK';
          PHP
          )"
          runtime_out="$("$php_bin" -d memory_limit=1024M "$wp_bin" eval "$runtime_code" --path="$prod_path" --allow-root 2>/tmp/elmercado-price-slider-v3.err)" || { cat /tmp/elmercado-price-slider-v3.err >&2; exit 1; }
          printf '%s\n' "$runtime_out" | grep -q 'MOBILE_PRICE_SLIDER_HOOK_OK'

          echo "SITEURL=$siteurl"
          echo "PRICE_SLIDER_RELEASE=$expected"
          echo 'MOBILE_PRICE_SLIDER_PRODUCTION_QA=passed'

          swapped=0
          rm -rf "$backup" "$incoming"
          trap - EXIT HUP INT TERM
          REMOTE

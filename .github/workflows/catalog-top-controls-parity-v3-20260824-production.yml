name: Catalog top controls parity production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-top-controls-parity-v3-20260824-production.yml'
      - '.github/scripts/verify-catalog-top-controls-parity-v3-20260824.js'
      - '.github/scripts/verify-producer-mobile-layout-parity-20260824.js'
      - '.github/scripts/verify-catalog-mobile-runtime-guard-20260824.js'
      - 'mu-plugins/zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
      - 'mu-plugins/zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-top-controls-parity-production
  cancel-in-progress: false

jobs:
  deploy-verify-and-rollback-on-error:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare browser and validate PHP
        run: |
          set -euo pipefail
          php -l mu-plugins/zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php
          php -l mu-plugins/zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php
          php -l mu-plugins/zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php
          php -l mu-plugins/zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy catalog control owners, verify live UI, rollback automatically on error
        id: guarded
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          FILES=(
            'zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php'
            'zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php'
            'zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
            'zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
          )

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s" "$p"
                  break
                  ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          declare -A HAD_EXISTING
          declare -A BACKUPS

          for name in "${FILES[@]}"; do
            backup="/tmp/${name}.before-${GITHUB_RUN_ID}"
            BACKUPS[$name]="$backup"
            if sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$MU_DIR/$name'"; then
              HAD_EXISTING[$name]=1
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cp -p '$MU_DIR/$name' '$backup'"
            else
              HAD_EXISTING[$name]=0
            fi
          done

          purge_wordpress() {
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); if [ -n \"\$wp_bin\" ]; then \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if (function_exists(\"rocket_clean_domain\")) { rocket_clean_domain(); } if (has_action(\"litespeed_purge_all\")) { do_action(\"litespeed_purge_all\"); } if (function_exists(\"wp_cache_clear_cache\")) { wp_cache_clear_cache(); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; fi"
          }

          reset_opcache() {
            local probe="elmercado-opcache-top-controls-v3-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$probe" >/dev/null 2>&1 || return 0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$probe?run=$GITHUB_RUN_ID" >/dev/null 2>&1 || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$probe'" >/dev/null 2>&1 || true
          }

          rollback() {
            status=$?
            trap - ERR
            set +e
            echo "Verification failed; restoring all catalog-control owners."
            for name in "${FILES[@]}"; do
              backup="${BACKUPS[$name]}"
              if [ "${HAD_EXISTING[$name]}" = "1" ]; then
                sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m 0644 '$backup' '$MU_DIR/$name'; rm -f '$backup' '/tmp/${name%.php}-${GITHUB_RUN_ID}.php'"
              else
                sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$MU_DIR/$name' '$backup' '/tmp/${name%.php}-${GITHUB_RUN_ID}.php'"
              fi
            done
            purge_wordpress
            reset_opcache
            echo "Automatic production rollback of v3 completed."
            exit "$status"
          }
          trap rollback ERR

          for name in "${FILES[@]}"; do
            remote_tmp="/tmp/${name%.php}-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP "mu-plugins/$name" "$STAGING_USER@$STAGING_HOST:$remote_tmp"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$remote_tmp'; mkdir -p '$MU_DIR'; install -m 0644 '$remote_tmp' '$MU_DIR/$name'; rm -f '$remote_tmp'"
            local_sha="$(sha256sum "mu-plugins/$name" | cut -d' ' -f1)"
            prod_sha="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$MU_DIR/$name' | cut -d' ' -f1")"
            test "$local_sha" = "$prod_sha"
          done

          purge_wordpress
          reset_opcache

          curl -fsSL --max-time 45 -H 'Cache-Control: no-cache' "$BASE_URL/tienda/?_mdo_deploy=$GITHUB_RUN_ID" > /tmp/catalog-shop-v3.html
          curl -fsSL --max-time 45 -H 'Cache-Control: no-cache' "$BASE_URL/tienda/1957/?_mdo_deploy=$GITHUB_RUN_ID" > /tmp/catalog-1957-v3.html
          for html in /tmp/catalog-shop-v3.html /tmp/catalog-1957-v3.html; do
            grep -q 'mdo-catalog-top-controls-parity-20260824' "$html"
            grep -q 'mdo-catalog-top-controls-parity-final-20260824' "$html"
            grep -q 'mdo-catalog-top-controls-arrow-final-20260824' "$html"
            grep -q 'mdo-catalog-mobile-runtime-guard-20260824' "$html"
          done

          BASE_URL="$BASE_URL" node .github/scripts/verify-catalog-top-controls-parity-v3-20260824.js | tee /tmp/catalog-top-controls-browser-v3.log
          grep -q '"ok":true' /tmp/catalog-top-controls-browser-v3.log

          BASE_URL="$BASE_URL" node .github/scripts/verify-producer-mobile-layout-parity-20260824.js | tee /tmp/producer-mobile-layout-parity.log
          grep -q '"ok":true' /tmp/producer-mobile-layout-parity.log

          BASE_URL="$BASE_URL" node .github/scripts/verify-catalog-mobile-runtime-guard-20260824.js | tee /tmp/catalog-mobile-runtime-guard.log
          grep -q '"ok":true' /tmp/catalog-mobile-runtime-guard.log

          trap - ERR
          for name in "${FILES[@]}"; do
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '${BACKUPS[$name]}' '/tmp/${name%.php}-${GITHUB_RUN_ID}.php'" || true
          done
          echo "Production catalogue layout deployment and browser verification succeeded."

      - name: Upload visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-top-controls-parity-v3-${{ github.run_id }}
          path: |
            /tmp/catalog-top-controls-v3-*.png
            /tmp/catalog-top-controls-parity-v3-20260824.json
            /tmp/catalog-top-controls-browser-v3.log
            /tmp/producer-mobile-layout-*.png
            /tmp/producer-mobile-layout-parity-20260824.json
            /tmp/producer-mobile-layout-parity.log
            /tmp/catalog-mobile-runtime-guard-*.png
            /tmp/catalog-mobile-runtime-guard-20260824.json
            /tmp/catalog-mobile-runtime-guard.log
          if-no-files-found: ignore
          retention-days: 7

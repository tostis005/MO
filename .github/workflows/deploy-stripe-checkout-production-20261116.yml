name: Retired Stripe visual deployment (inactive)

# Stripe was a temporary payment gateway and is no longer in use.
# Deliberately disable the automatic production rollout of this visual module.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the former Stripe visual deployment is disabled
        run: echo "Retired: no Stripe-specific styles will be published by this workflow."

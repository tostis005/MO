name: Home Lighthouse CLS

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php'
      - '.github/workflows/home-lighthouse-cls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Home first-frame patch
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          LOCAL='elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php'
          php -l "$LOCAL" >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_TMP="/tmp/elmercado-home-cls-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS "$LOCAL" "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            install -m 0644 '$REMOTE_TMP' '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            rm -f '$REMOTE_TMP'
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php' >/dev/null
            \"\$php_bin\" \"\$wp_bin\" eval 'if (function_exists(\"elmercado_flush_home_cache\")) { elmercado_flush_home_cache(); } echo \"CACHE_FLUSHED\\n\";' --path='$PROD_PATH' --allow-root
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
          "

      - name: Warm and verify real cached Home
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.elmercadodeorigen.com/'
          for n in 1 2 3 4 5 6; do
            if curl -fsS --compressed --max-time 30 "$URL" -o home-warm-1.html; then
              break
            fi
            sleep 5
          done
          curl -fsS --compressed --max-time 30 "$URL" -o home-warm-2.html
          grep -q 'elmercado-home-first-view-lock-010256' home-warm-1.html
          grep -q 'elmercado-home-first-view-lock-010256' home-warm-2.html
          printf 'first=%s second=%s\n' "$(wc -c < home-warm-1.html)" "$(wc -c < home-warm-2.html)"

      - name: Run Lighthouse against cached Home
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.elmercadodeorigen.com/'
          google-chrome --version || chromium --version || true

          for i in 1 2 3; do
            EXTRA=''
            if [ "$i" = '1' ]; then EXTRA='--save-assets'; fi
            npx --yes lighthouse@12.8.2 "$URL" \
              --only-categories=performance \
              --form-factor=desktop \
              --screenEmulation.mobile=false \
              --screenEmulation.width=1350 \
              --screenEmulation.height=940 \
              --screenEmulation.deviceScaleFactor=1 \
              --throttling-method=simulate \
              --output=json \
              --output-path="lighthouse-${i}.json" \
              $EXTRA \
              --quiet \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done

          node <<'NODE' | tee lighthouse-summary.txt
          const fs = require('fs');
          const runs = [1,2,3].map(i => JSON.parse(fs.readFileSync(`lighthouse-${i}.json`, 'utf8')));
          const values = (key) => runs.map(r => Number(r.audits[key]?.numericValue || 0));
          const median = (arr) => [...arr].sort((a,b)=>a-b)[1];
          const cls = values('cumulative-layout-shift');
          const fcp = values('first-contentful-paint');
          const lcp = values('largest-contentful-paint');
          const tbt = values('total-blocking-time');
          const scores = runs.map(r => Math.round((r.categories.performance.score || 0) * 100));
          console.log(`Commit: ${process.env.GITHUB_SHA}`);
          console.log(`Performance: ${scores.join(', ')}`);
          console.log(`CLS: ${cls.map(v=>v.toFixed(4)).join(', ')} | median ${median(cls).toFixed(4)}`);
          console.log(`FCP ms: ${fcp.map(v=>Math.round(v)).join(', ')} | median ${Math.round(median(fcp))}`);
          console.log(`LCP ms: ${lcp.map(v=>Math.round(v)).join(', ')} | median ${Math.round(median(lcp))}`);
          console.log(`TBT ms: ${tbt.map(v=>Math.round(v)).join(', ')} | median ${Math.round(median(tbt))}`);
          for (const key of ['unused-css-rules','unused-javascript','render-blocking-resources','uses-long-cache-ttl','modern-image-formats','uses-optimized-images']) {
            const a = runs[0].audits[key];
            if (!a) continue;
            console.log(`${key}: ${a.displayValue || ''} numeric=${a.numericValue ?? ''}`);
          }
          runs.forEach((r, idx) => {
            console.log(`\nRun ${idx+1} layout shifts:`);
            const items = r.audits['layout-shifts']?.details?.items || [];
            items.slice(0, 8).forEach((item, j) => {
              const score = item.score ?? item.value ?? 0;
              const node = item.node?.selector || item.node?.snippet || item.node?.nodeLabel || '';
              console.log(`${j+1}. ${Number(score).toFixed(4)} ${String(node).replace(/\s+/g,' ').slice(0,220)}`);
            });
          });
          NODE

          node <<'NODE' | tee layout-shift-trace.txt
          const fs = require('fs');
          const files = fs.readdirSync('.').filter(f => /trace.*\.json$|\.trace\.json$/i.test(f));
          console.log(`Trace files: ${files.join(', ')}`);
          let found = 0;
          for (const file of files) {
            let json;
            try { json = JSON.parse(fs.readFileSync(file,'utf8')); } catch (_) { continue; }
            const events = Array.isArray(json) ? json : (json.traceEvents || []);
            const shifts = events.filter(e => /layout.?shift/i.test(String(e.name || '')));
            if (!shifts.length) continue;
            console.log(`\n${file}: ${shifts.length} layout-shift events`);
            for (const e of shifts.slice(0,30)) {
              console.log(JSON.stringify({name:e.name,ts:e.ts,dur:e.dur,args:e.args}).slice(0,7000));
              found++;
            }
          }
          console.log(`\nLayout-shift events emitted: ${found}`);
          NODE

      - name: Persist latest diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp lighthouse-summary.txt reports/home-lighthouse-latest.txt
          cp layout-shift-trace.txt reports/home-layout-shift-trace-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/home-lighthouse-latest.txt reports/home-layout-shift-trace-latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update cached Home Lighthouse diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: home-lighthouse-cls
          path: |
            lighthouse-*.json
            lighthouse-summary.txt
            layout-shift-trace.txt
            home-warm-*.html
            *trace*.json
          retention-days: 3

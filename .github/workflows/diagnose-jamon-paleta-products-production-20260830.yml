name: Inventory oil and meat products for landings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-jamon-paleta-products-production-20260830.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inventory production oil and meat products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true)
          php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          prod=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
            esac
          done
          : "${prod:?production path missing}"
          "$php" -d memory_limit=768M "$wp" eval '
            $terms=get_terms(array("taxonomy"=>"product_cat","hide_empty"=>false));
            echo "TERMS\n";
            foreach($terms as $t){ if(stripos($t->name,"aceit")!==false || stripos($t->name,"carne")!==false || stripos($t->slug,"aceit")!==false || stripos($t->slug,"carne")!==false){ echo wp_json_encode(array("id"=>$t->term_id,"slug"=>$t->slug,"name"=>$t->name,"count"=>$t->count),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL; }}
            echo "PRODUCTS\n";
            $q=new WP_Query(array("post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"orderby"=>"title","order"=>"ASC"));
            foreach($q->posts as $p){
              $cats=wp_get_post_terms($p->ID,"product_cat",array("fields"=>"all"));
              $match=false; $catrows=array();
              foreach($cats as $c){ $catrows[]=array("slug"=>$c->slug,"name"=>$c->name); if(stripos($c->name,"aceit")!==false || stripos($c->name,"carne")!==false || stripos($c->slug,"aceit")!==false || stripos($c->slug,"carne")!==false){$match=true;} }
              if(!$match) continue;
              $tags=wp_get_post_terms($p->ID,"product_tag",array("fields"=>"names"));
              $prod=wc_get_product($p->ID);
              $row=array("id"=>(int)$p->ID,"slug"=>$p->post_name,"title"=>$p->post_title,"en_title"=>wp_strip_all_tags((string)get_post_meta($p->ID,"_en_US_post_title",true)),"cats"=>$catrows,"tags"=>$tags,"price"=>$prod?$prod->get_price():null,"stock"=>$prod?$prod->get_stock_status():null);
              echo wp_json_encode($row,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
            }
          ' --path="$prod" --allow-root
          REMOTE
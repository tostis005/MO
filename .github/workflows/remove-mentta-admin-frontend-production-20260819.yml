name: Remove MENTTA admin storefront exception

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-mentta-admin-frontend-010257.php'
      - '.github/scripts/verify-mentta-admin-frontend-hidden-20260819.php'
      - '.github/workflows/remove-mentta-admin-frontend-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate verifier
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/verify-mentta-admin-frontend-hidden-20260819.php >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Remove admin exception and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_VERIFY="/tmp/mdo-verify-mentta-admin-hidden-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/verify-mentta-admin-frontend-hidden-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE_VERIFY"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            rm -f '$PROD_PATH/wp-content/mu-plugins/mdo-mentta-admin-frontend-010257.php'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            rm -rf '$PROD_PATH/wp-content/cache/'* 2>/dev/null || true
            rm -rf '$PROD_PATH/wp-content/litespeed/'* 2>/dev/null || true
          "

          mkdir -p runtime
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M '$REMOTE_VERIFY' '$PROD_PATH'; rc=\$?; rm -f '$REMOTE_VERIFY'; exit \$rc" > runtime/mentta-admin-frontend-hidden-live-20260819.json
          RC=$?
          set -e

          cat runtime/mentta-admin-frontend-hidden-live-20260819.json
          jq . runtime/mentta-admin-frontend-hidden-live-20260819.json >/dev/null
          jq -e '.ok==true and .admin_exception_file==false and .base_filter_present==true and .admin_set==true and .mentta_absent==true' runtime/mentta-admin-frontend-hidden-live-20260819.json >/dev/null
          test "$RC" -eq 0

      - name: Commit verification evidence
        if: always()
        shell: bash
        run: |
          set -e
          if [ -f runtime/mentta-admin-frontend-hidden-live-20260819.json ]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add -f runtime/mentta-admin-frontend-hidden-live-20260819.json
            git commit -m 'Record MENTTA admin storefront removal verification' || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Deploy Black Friday 2026 preview to production

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/emdo-black-friday-2026-preview.php'
      - 'elmercadodeorigen-child/templates/black-friday-2026-preview.php'
      - 'elmercadodeorigen-child/assets/css/black-friday-2026-preview.css'
      - 'elmercadodeorigen-child/assets/js/black-friday-2026-preview.js'
      - '.github/workflows/deploy-black-friday-2026-preview-production.yml'
      - '.github/scripts/check-black-friday-2026-fullbleed.cjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: emdo-black-friday-2026-preview-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify scope, PHP syntax and preview files
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l mu-plugins/emdo-black-friday-2026-preview.php
          php -l elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq "return 'black-friday-2026' === emdo_bf2026_requested_path()" mu-plugins/emdo-black-friday-2026-preview.php
          grep -Fq "wp_safe_redirect( home_url( '/black-friday-2026/' ), 301" mu-plugins/emdo-black-friday-2026-preview.php
          grep -Fq 'vista-previa-black-friday-2026' mu-plugins/emdo-black-friday-2026-preview.php
          grep -Fq 'noindex, nofollow, noarchive' mu-plugins/emdo-black-friday-2026-preview.php
          grep -Fq 'id="bf26-overlay"' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'BFEMDO' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'data-bf26-copy="BFMONTJAM"' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq '2,5 % adicional' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'automáticamente en el carrito' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'fuet de regalo' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'bf26-offer__cashback' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'Lanzamos el' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'Black Friday acumulas un 2 % de cashback en todas tus compras' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq '2 % de cashback durante Black Friday' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq '<strong>2<span>%</span></strong>' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'todavía no se ha anunciado oficialmente' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq '1 % en tu monedero Club EMDO' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'Ofertas que apetecen.' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'Descubre las ofertas disponibles' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'emdo_bf2026_visible_sellers' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'data-bf26-visible-sellers=' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq '15 % de descuento en todos los productos Montjam' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fiq 'dos productores' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fiq 'dos cupones' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fiq 'pedidos válidos' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'montjam-letra-pequena' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq 'Un sobre de chorizo + uno de salchichón' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'bf26-offer__coupon-row' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'bf26-hidalgo-benefits' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq '7,5–8 kg' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq '8–8,5 kg' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'miniqueso Pajarete de 90 g' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq 'miniqueso Pajarete de 100 g' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'BF2026 v6' elmercadodeorigen-child/assets/css/black-friday-2026-preview.css
          ! grep -Fq 'Introduce el código' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq 'BFM2' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq 'BFEMDOM' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq 'incluye los de 7 kg exactos' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          grep -Fq 'Después de Black Friday, el cashback será del 1 %.' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          ! grep -Fq 'bf26-coupon-section' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          test -s elmercadodeorigen-child/assets/css/black-friday-2026-preview.css
          test -s elmercadodeorigen-child/assets/js/black-friday-2026-preview.js
          test -s .github/scripts/check-black-friday-2026-fullbleed.cjs
          grep -Fq 'bf26-club__wallet' elmercadodeorigen-child/templates/black-friday-2026-preview.php
          test "$(grep -Fc 'bf26-campaign-stamp' elmercadodeorigen-child/templates/black-friday-2026-preview.php)" -eq 2
          test "$(grep -Fc '<strong>BLACK<em>FRIDAY</em></strong>' elmercadodeorigen-child/templates/black-friday-2026-preview.php)" -eq 2
          grep -Fq 'BF2026 v9' elmercadodeorigen-child/assets/css/black-friday-2026-preview.css
          grep -Fq 'width:100vw!important' elmercadodeorigen-child/assets/css/black-friday-2026-preview.css
          ! grep -Eq 'wc_create_coupon|woocommerce_before_calculate_totals|wc_create_order' mu-plugins/emdo-black-friday-2026-preview.php
          test -n "$HOST" && test -n "$USER" && test -n "$SSHPASS"

      - name: Upload only the dedicated four preview files
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          SSH_PORT="${PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $SSH_PORT"
          SCP="-o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $SSH_PORT"
          STAGE="/tmp/emdo-bfpreview-$GITHUB_RUN_ID"
          sshpass -e ssh $SSH "$USER@$HOST" "install -d -m 0700 '$STAGE'"
          sshpass -e scp $SCP mu-plugins/emdo-black-friday-2026-preview.php "$USER@$HOST:$STAGE/bootstrap.php"
          sshpass -e scp $SCP elmercadodeorigen-child/templates/black-friday-2026-preview.php "$USER@$HOST:$STAGE/landing.php"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/css/black-friday-2026-preview.css "$USER@$HOST:$STAGE/preview.css"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/js/black-friday-2026-preview.js "$USER@$HOST:$STAGE/preview.js"

      - name: Deploy to production only with backup, rollback and live smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${PORT:-22}"
          SSH="-o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $SSH_PORT"
          sshpass -e ssh $SSH "$USER@$HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          RUN="$1"
          ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          PHP='/opt/plesk/php/8.2/bin/php'
          WP='/usr/local/bin/wp'
          STAGE="/tmp/emdo-bfpreview-$RUN"
          MU="$ROOT/wp-content/mu-plugins"
          MODULE="$MU/emdo-black-friday-2026-preview.php"
          DEST="$MU/emdo-black-friday-2026-preview"
          BACKUP="$HOME/.elmercado-rollbacks/black-friday-2026-preview/$RUN"
          NEW="$MU/.emdo-bfpreview-new-$RUN"
          test -f "$ROOT/wp-config.php" && test -d "$MU" && test -x "$PHP"
          for f in bootstrap.php landing.php; do "$PHP" -l "$STAGE/$f" >/dev/null; done
          test -s "$STAGE/preview.js" && test -s "$STAGE/preview.css"
          SITE="$("$PHP" -d memory_limit=512M "$WP" option get siteurl --path="$ROOT" --allow-root --skip-plugins --skip-themes)"
          case "$SITE" in
            https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) ;;
            *) echo "WRONG_PRODUCTION_SITE $SITE"; exit 5 ;;
          esac
          install -d -m 0700 "$BACKUP"
          HAD_MODULE=0
          HAD_ASSETS=0
          CREATED_PAGE_ID=0
          CHANGED=0
          if [ -f "$MODULE" ]; then cp -p "$MODULE" "$BACKUP/previous-module.php"; HAD_MODULE=1; fi
          if [ -d "$DEST" ]; then cp -a "$DEST" "$BACKUP/previous-assets"; HAD_ASSETS=1; fi
          rollback() {
            code=$?
            trap - EXIT
            if [ "$code" -ne 0 ] && [ "$CHANGED" -eq 1 ]; then
              echo "ROLLING_BACK_BF_PREVIEW"
              # Restore the previous editorial seller list if the one-time
              # Hidalgo-first preparation occurred in this run.
              if [ -f "$BACKUP/seller-visibility-before.json" ]; then
                BF_PREP_BACKUP="$BACKUP" "$PHP" -d memory_limit=768M "$WP" eval '
                  $state=json_decode(file_get_contents(getenv("BF_PREP_BACKUP")."/seller-visibility-before.json"),true);
                  if (is_array($state)) {
                    if (!empty($state["present"])) {
                      update_option("emdo_bf2026_visible_sellers",$state["value"],false);
                    } else {
                      delete_option("emdo_bf2026_visible_sellers");
                    }
                    delete_option("emdo_bf2026_hidalgo_first_launch_prepared_v1");
                  }
                ' --path="$ROOT" --allow-root >/dev/null 2>&1 || true
              fi
              rm -f "$MODULE"
              if [ "$HAD_MODULE" -eq 1 ]; then cp -p "$BACKUP/previous-module.php" "$MODULE"; fi
              rm -rf "$DEST"
              if [ "$HAD_ASSETS" -eq 1 ]; then cp -a "$BACKUP/previous-assets" "$DEST"; fi
              if [ "$CREATED_PAGE_ID" -gt 0 ]; then
                "$PHP" -d memory_limit=512M "$WP" post delete "$CREATED_PAGE_ID" --force --path="$ROOT" --allow-root >/dev/null 2>&1 || true
              fi
              # Restore the original slug if this deployment migrated the page.
              if [ -s "$BACKUP/renamed-page-id" ]; then
                OLD_PAGE_ID="$(cat "$BACKUP/renamed-page-id")"
                if [[ "$OLD_PAGE_ID" =~ ^[0-9]+$ ]]; then
                  "$PHP" -d memory_limit=768M "$WP" post update "$OLD_PAGE_ID" --post_name=vista-previa-black-friday-2026 --path="$ROOT" --allow-root >/dev/null 2>&1 || true
                fi
              fi
              echo "BF_PREVIEW_ROLLBACK_COMPLETE"
            fi
            rm -rf "$NEW" "$STAGE"
            exit "$code"
          }
          trap rollback EXIT
          install -d -m 0755 "$NEW"
          install -m 0644 "$STAGE/landing.php" "$NEW/landing.php"
          install -m 0644 "$STAGE/preview.css" "$NEW/preview.css"
          install -m 0644 "$STAGE/preview.js" "$NEW/preview.js"
          CHANGED=1
          rm -rf "$DEST"
          mv "$NEW" "$DEST"
          install -m 0644 "$STAGE/bootstrap.php" "$MODULE"
          "$PHP" -l "$MODULE" >/dev/null
          "$PHP" -d memory_limit=768M "$WP" eval '
            if (!function_exists("emdo_bf2026_production_preview_route")) { exit(9); }
            echo "BF_PREVIEW_MU_PLUGIN_ACTIVE\n";
          ' --path="$ROOT" --allow-root
          # Prepare ONLY the initial Hidalgo product lineup now, once.
          # The marker prevents future deployments from hiding producers
          # deliberately re-enabled in WordPress after the launch.
          # This does not activate any coupon, cashback or cart rule.
          BF_PREP_BACKUP="$BACKUP" "$PHP" -d memory_limit=768M "$WP" eval '
            $key="emdo_bf2026_visible_sellers";
            $marker="emdo_bf2026_hidalgo_first_launch_prepared_v1";
            if ("yes" !== get_option($marker,"")) {
              $previous=get_option($key,null);
              $backup=array("present"=>null!==$previous,"value"=>$previous);
              $file=getenv("BF_PREP_BACKUP")."/seller-visibility-before.json";
              if (false===file_put_contents($file,wp_json_encode($backup))) {
                fwrite(STDERR,"UNABLE_TO_BACKUP_BF_SELLER_VISIBILITY\n");
                exit(22);
              }
              update_option($key,array("hidalgo"),false);
              update_option($marker,"yes",false);
              if (array("hidalgo")!==get_option($key,array())) {
                fwrite(STDERR,"BF_HIDALGO_ONLY_CONFIGURATION_FAILED\n");
                exit(23);
              }
              echo "BF2026_INITIAL_VISIBLE_SELLERS=hidalgo\n";
            } else {
              echo "BF2026_INITIAL_LINEUP_PREPARED_PREVIOUSLY\n";
              echo "BF2026_VISIBLE_SELLERS=".implode(",",(array)get_option($key,array("hidalgo")))."\n";
            }
          ' --path="$ROOT" --allow-root
          # Read-only coupon readiness audit. Do not publish/enable the coupon.
          "$PHP" -d memory_limit=768M "$WP" eval '
            if (!class_exists("WC_Coupon") || !function_exists("wc_get_coupon_id_by_code")) {
              echo "BFEMDO_PRELAUNCH_AUDIT=WOOCOMMERCE_NOT_LOADED\n";
            } else {
              $id=(int)wc_get_coupon_id_by_code("BFEMDO");
              if (!$id) {
                echo "BFEMDO_PRELAUNCH_AUDIT=NOT_FOUND\n";
              } else {
                $coupon=new WC_Coupon($id);
                $post=get_post($id);
                $expiry=$coupon->get_date_expires();
                echo "BFEMDO_PRELAUNCH_AUDIT=".wp_json_encode(array(
                  "post_status"=>$post?$post->post_status:"unknown",
                  "discount_type"=>$coupon->get_discount_type(),
                  "amount"=>$coupon->get_amount(),
                  "expires"=>$expiry?$expiry->date("Y-m-d H:i:s"):"none",
                  "restricted_products"=>count($coupon->get_product_ids()),
                  "restricted_categories"=>count($coupon->get_product_categories()),
                  "excluded_products"=>count($coupon->get_excluded_product_ids()),
                  "usage_limit"=>$coupon->get_usage_limit(),
                  "usage_count"=>$coupon->get_usage_count(),
                ))."\n";
              }
            }
          ' --path="$ROOT" --allow-root
          # Keep the same WordPress page ID and native header/cart.
          # Migrate the old slug once; refuse collision with another page.
          PAGE_RESULT="$(BF_PREP_BACKUP="$BACKUP" "$PHP" -d memory_limit=768M "$WP" eval '
            $slug = "black-friday-2026";
            $old_slug = "vista-previa-black-friday-2026";
            $page = get_page_by_path($slug, OBJECT, "page");
            $legacy = get_page_by_path($old_slug, OBJECT, "page");
            if ($page instanceof WP_Post) {
              if ("publish" !== $page->post_status) {
                fwrite(STDERR,"Canonical page exists but is not published: refusing override\n");
                exit(12);
              }
              if ($legacy instanceof WP_Post && (int)$legacy->ID !== (int)$page->ID) {
                fwrite(STDERR,"Canonical and legacy pages both exist: refusing duplicate migration\n");
                exit(14);
              }
              echo "EMDO_BF_PAGE_STATE=EXISTING:" . $page->ID . "\n";
            } elseif ($legacy instanceof WP_Post) {
              if ("publish" !== $legacy->post_status) {
                fwrite(STDERR,"Legacy page exists but is not published: refusing override\n");
                exit(15);
              }
              if (false===file_put_contents(getenv("BF_PREP_BACKUP")."/renamed-page-id",(string)$legacy->ID)) {
                fwrite(STDERR,"Unable to back up legacy WordPress page ID\n");
                exit(16);
              }
              $id=wp_update_post(array("ID"=>$legacy->ID,"post_name"=>$slug),true);
              if (is_wp_error($id) || (int)$id!==(int)$legacy->ID || get_post_field("post_name",$id)!==$slug) {
                fwrite(STDERR,"Unable to migrate Black Friday page slug\n");
                exit(17);
              }
              echo "EMDO_BF_PAGE_STATE=RENAMED:" . $id . "\n";
            } else {
              $id = wp_insert_post(array(
                "post_type" => "page",
                "post_status" => "publish",
                "post_name" => $slug,
                "post_title" => "Black Friday 2026",
                "post_content" => "",
                "comment_status" => "closed",
                "ping_status" => "closed",
              ), true);
              if (is_wp_error($id) || !$id || get_post_field("post_name",$id)!==$slug) {
                fwrite(STDERR,"Unable to create canonical Black Friday page\n");
                exit(13);
              }
              echo "EMDO_BF_PAGE_STATE=CREATED:" . $id . "\n";
            }
          ' --path="$ROOT" --allow-root)"
          PAGE_TOKEN="$(printf '%s\n' "$PAGE_RESULT" | grep '^EMDO_BF_PAGE_STATE=' | tail -n 1)"
          case "$PAGE_TOKEN" in
            EMDO_BF_PAGE_STATE=CREATED:*) CREATED_PAGE_ID="${PAGE_TOKEN##*:}" ;;
            EMDO_BF_PAGE_STATE=RENAMED:*|EMDO_BF_PAGE_STATE=EXISTING:*) ;;
            *) echo "UNEXPECTED_PAGE_CREATION_STATUS"; exit 14 ;;
          esac
          echo "$PAGE_TOKEN"
          test "$("$PHP" -d memory_limit=512M "$WP" post get "${PAGE_TOKEN##*:}" --field=post_name --path="$ROOT" --allow-root)" = "black-friday-2026"
          CODE="$(curl -sSL --retry 3 --max-time 45 -A 'Mozilla/5.0 EMDO BF Preview' -D "/tmp/bf-preview-$RUN.headers" -o "/tmp/bf-preview-$RUN.html" -w '%{http_code}' "https://www.elmercadodeorigen.com/black-friday-2026/?verify=$RUN")"
          test "$CODE" = 200
          grep -Fq 'id="bf26-overlay"' "/tmp/bf-preview-$RUN.html"
          LEGACY_REDIRECT="$(curl -sS --retry 2 --max-time 30 -o /dev/null -w '%{http_code}|%{redirect_url}' "https://www.elmercadodeorigen.com/vista-previa-black-friday-2026/?legacy_verify=$RUN")"
          case "$LEGACY_REDIRECT" in
            "301|https://www.elmercadodeorigen.com/black-friday-2026/"|"301|https://elmercadodeorigen.com/black-friday-2026/") ;;
            *) echo "WRONG_LEGACY_BF_REDIRECT $LEGACY_REDIRECT"; exit 18 ;;
          esac
          test "$(grep -oF 'bf26-campaign-stamp' "/tmp/bf-preview-$RUN.html" | wc -l)" -ge 2
          test "$(grep -oF '<strong>BLACK<em>FRIDAY</em></strong>' "/tmp/bf-preview-$RUN.html" | wc -l)" -eq 2
          # The page may have one or more visible sellers. Do not require
          # Montjam once its editorial card is hidden for the initial launch.
          grep -Fq 'data-bf26-visible-sellers=' "/tmp/bf-preview-$RUN.html"
          grep -Fq 'data-bf26-seller="' "/tmp/bf-preview-$RUN.html"
          if [ -f "$BACKUP/seller-visibility-before.json" ]; then
            grep -Fq 'data-bf26-visible-sellers="hidalgo"' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'data-bf26-seller="hidalgo"' "/tmp/bf-preview-$RUN.html"
            ! grep -Fq 'data-bf26-seller="montjam"' "/tmp/bf-preview-$RUN.html"
          fi
          grep -Fq 'bf26-offer__cashback' "/tmp/bf-preview-$RUN.html"
          grep -Fq 'Black Friday acumulas un 2 % de cashback en todas tus compras' "/tmp/bf-preview-$RUN.html"
          grep -Fq '<strong>2<span>%</span></strong>' "/tmp/bf-preview-$RUN.html"
          grep -Fq 'todavía no se ha anunciado oficialmente' "/tmp/bf-preview-$RUN.html"
          grep -Fq 'Ofertas que apetecen.' "/tmp/bf-preview-$RUN.html"
          grep -Fq 'Descubre las ofertas disponibles' "/tmp/bf-preview-$RUN.html"
          ! grep -Fiq 'dos productores' "/tmp/bf-preview-$RUN.html"
          ! grep -Fiq 'dos cupones' "/tmp/bf-preview-$RUN.html"
          ! grep -Fiq 'pedidos válidos' "/tmp/bf-preview-$RUN.html"
          ! grep -Fq 'Un sobre de chorizo + uno de salchichón' "/tmp/bf-preview-$RUN.html"
          ! grep -Fq 'miniqueso Pajarete de 100 g' "/tmp/bf-preview-$RUN.html"
          ! grep -Fq 'Introduce el código' "/tmp/bf-preview-$RUN.html"
          ! grep -Fq 'BFM2' "/tmp/bf-preview-$RUN.html"
          ! grep -Fq 'BFEMDOM' "/tmp/bf-preview-$RUN.html"
          grep -Fq 'Después de Black Friday, el cashback será del 1 %.' "/tmp/bf-preview-$RUN.html"
          ! grep -Fq 'bf26-coupon-section' "/tmp/bf-preview-$RUN.html"
          if grep -Fq 'data-bf26-seller="hidalgo"' "/tmp/bf-preview-$RUN.html"; then
            grep -Fq 'data-bf26-copy="BFEMDO"' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'bf26-hidalgo-benefits' "/tmp/bf-preview-$RUN.html"
            grep -Fq '7,5–8 kg' "/tmp/bf-preview-$RUN.html"
            grep -Fq '8–8,5 kg' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'miniqueso Pajarete de 90 g' "/tmp/bf-preview-$RUN.html"
          fi
          if grep -Fq 'data-bf26-seller="montjam"' "/tmp/bf-preview-$RUN.html"; then
            grep -Fq '15 % de descuento en todos los productos Montjam' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'data-bf26-copy="BFMONTJAM"' "/tmp/bf-preview-$RUN.html"
            grep -Fq '2,5 % adicional' "/tmp/bf-preview-$RUN.html"
            ! grep -Fq 'incluye los de 7 kg exactos' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'jamones de menos de 7 kg' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'automáticamente en el carrito' "/tmp/bf-preview-$RUN.html"
            grep -Fq 'fuet de regalo' "/tmp/bf-preview-$RUN.html"
          fi
          # Native site header / nav / cart / footer: this must be a real shop page.
          grep -Eiq 'class="[^"]*site-header' "/tmp/bf-preview-$RUN.html"
          grep -Eiq 'main-navigation|primary-navigation' "/tmp/bf-preview-$RUN.html"
          grep -Eiq 'shopping-cart|cart-contents|shop-cart-count|cart-count' "/tmp/bf-preview-$RUN.html"
          grep -Eiq '<footer|site-footer' "/tmp/bf-preview-$RUN.html"
          grep -Eiq '^x-robots-tag:.*noindex' "/tmp/bf-preview-$RUN.headers"
          ! grep -Eiq 'Fatal error:|Parse error:|Uncaught Error:|critical error on this website' "/tmp/bf-preview-$RUN.html"
          rm -f "/tmp/bf-preview-$RUN.html" "/tmp/bf-preview-$RUN.headers"
          CHANGED=0
          echo "BF_PREVIEW_PRODUCTION_OK"
          echo "BACKUP=$BACKUP"
          REMOTE

      - name: Recheck production route and static resources
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://www.elmercadodeorigen.com/black-friday-2026/?final_verify=$GITHUB_RUN_ID"
          curl -fsSL --retry 2 --max-time 45 -A 'Mozilla/5.0 EMDO BF' "$URL" -o /tmp/bf-preview-live.html
          grep -Fq 'id="bf26-overlay"' /tmp/bf-preview-live.html
          grep -Fq 'data-bf26-visible-sellers="hidalgo"' /tmp/bf-preview-live.html
          ! grep -Fq 'data-bf26-seller="montjam"' /tmp/bf-preview-live.html
          grep -Fq 'emdo-bf2026-preview' /tmp/bf-preview-live.html
          grep -Eiq 'class="[^"]*site-header' /tmp/bf-preview-live.html
          grep -Eiq 'shopping-cart|cart-contents|shop-cart-count|cart-count' /tmp/bf-preview-live.html
          curl -fsSIL --max-time 30 'https://www.elmercadodeorigen.com/wp-content/mu-plugins/emdo-black-friday-2026-preview/preview.css' >/dev/null
          curl -fsSIL --max-time 30 'https://www.elmercadodeorigen.com/wp-content/mu-plugins/emdo-black-friday-2026-preview/preview.js' >/dev/null
          echo "BLACK_FRIDAY_PREVIEW_PUBLIC_VERIFIED"

      - name: Verify 320/360/390/768/1440 px viewport cards, full-bleed sections and native shop shell
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME"
          node .github/scripts/check-black-friday-2026-fullbleed.cjs

      - name: Upload optional browser snapshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-friday-2026-visual-${{ github.run_id }}
          path: /tmp/black-friday-2026-*.png
          if-no-files-found: ignore
          retention-days: 5

      - name: Report deploy result to GitHub
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN_FOR_STATUS: ${{ github.token }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          if [ "$DEPLOY_RESULT" = "success" ]; then
            PAYLOAD='{"state":"success","context":"emdo/black-friday-preview-production","description":"Black Friday preview published and verified on www"}'
          else
            PAYLOAD='{"state":"failure","context":"emdo/black-friday-preview-production","description":"Production deploy or public verification failed; inspect workflow"}'
          fi
          curl -fsS --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN_FOR_STATUS" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

name: Diagnose production checkout checkboxes 2026-08-14

on:
  push:
    paths:
      - '.github/workflows/diagnose-checkout-checkboxes-20260814.yml'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect checkout checkbox layout
        run: |
          cat > /tmp/inspect-checkout.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({ viewport: { width: 1440, height: 1200 }, locale: 'es-ES' });
            const page = await context.newPage();
            await page.goto('https://www.elmercadodeorigen.com/tienda/?add-to-cart=5348', { waitUntil: 'networkidle', timeout: 90000 });
            await page.goto('https://www.elmercadodeorigen.com/checkout/', { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForSelector('#customer_details', { timeout: 30000 });
            await page.waitForTimeout(2500);
            const data = await page.evaluate(() => {
              const css = el => {
                if (!el) return null;
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  tag: el.tagName,
                  id: el.id,
                  cls: el.className,
                  left: Math.round(r.left * 10) / 10,
                  top: Math.round(r.top * 10) / 10,
                  width: Math.round(r.width * 10) / 10,
                  marginLeft: s.marginLeft,
                  paddingLeft: s.paddingLeft,
                  display: s.display,
                  position: s.position,
                  transform: s.transform
                };
              };
              return Array.from(document.querySelectorAll('#customer_details input[type="checkbox"]')).map((cb, i) => {
                const label = cb.closest('label');
                const row = cb.closest('p.form-row, p.create-account, h3#ship-to-different-address, p, h3, .form-row, .woocommerce-form-row, .form-group, li');
                const section = cb.closest('.woocommerce-account-fields, .woocommerce-shipping-fields');
                const parent = label ? label.parentElement : cb.parentElement;
                return {
                  i,
                  checkbox: css(cb),
                  name: cb.name,
                  value: cb.value,
                  labelText: label ? label.textContent.trim().replace(/\s+/g, ' ') : '',
                  label: css(label),
                  row: css(row),
                  section: css(section),
                  parent: css(parent),
                  html: (row || label || cb).outerHTML.slice(0, 1200)
                };
              });
            });
            console.log('CHECKBOX_LAYOUT_JSON=' + JSON.stringify(data));
            await page.screenshot({ path: 'checkout-checkboxes-before.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/inspect-checkout.js
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-checkboxes-before
          path: checkout-checkboxes-before.png

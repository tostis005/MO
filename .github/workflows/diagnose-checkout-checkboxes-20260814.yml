name: Verify production checkout checkboxes 2026-08-14

on:
  push:
    paths:
      - '.github/workflows/diagnose-checkout-checkboxes-20260814.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verification session
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null || true

          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          TOKEN="$(openssl rand -hex 24)"
          REMOTE_HELPER="$PROD_PATH/wp-content/mu-plugins/elmercado-checkout-verification-helper.php"
          printf '%s\n' "$PROD_PATH" > /tmp/prod_path
          printf '%s\n' "$TOKEN" > /tmp/verify_token

          cat > /tmp/checkout-verification-helper.php <<PHP
          <?php
          if ( ! defined( 'ABSPATH' ) ) { exit; }
          add_action(
              'wp_loaded',
              static function (): void {
                  if ( empty( \$_GET['emo_verify_checkout_token'] ) || ! hash_equals( '${TOKEN}', sanitize_text_field( wp_unslash( \$_GET['emo_verify_checkout_token'] ) ) ) ) {
                      return;
                  }
                  if ( ! function_exists( 'WC' ) ) {
                      wp_die( 'WooCommerce unavailable' );
                  }
                  if ( null === WC()->cart && function_exists( 'wc_load_cart' ) ) {
                      wc_load_cart();
                  }
                  if ( null === WC()->cart ) {
                      wp_die( 'Cart unavailable' );
                  }
                  WC()->cart->empty_cart();
                  \$added = WC()->cart->add_to_cart( 5348, 1 );
                  if ( ! \$added ) {
                      \$added = WC()->cart->add_to_cart( 1380, 1 );
                  }
                  if ( ! \$added ) {
                      wp_die( 'Unable to seed verification cart' );
                  }
                  if ( WC()->session ) {
                      WC()->session->set_customer_session_cookie( true );
                  }
                  wp_safe_redirect( wc_get_checkout_url() );
                  exit;
              },
              999
          );
          PHP

          sshpass -e scp $SCP /tmp/checkout-verification-helper.php "$STAGING_USER@$STAGING_HOST:$REMOTE_HELPER"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$REMOTE_HELPER' >/dev/null
          "
      - name: Verify live checkbox alignment and stability
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN="$(cat /tmp/verify_token)"
          export EMO_VERIFY_TOKEN="$TOKEN"
          cat > verify-checkout.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1200 },
              locale: 'es-ES'
            });
            const page = await context.newPage();
            await page.goto('https://www.elmercadodeorigen.com/?emo_verify_checkout_token=' + encodeURIComponent(process.env.EMO_VERIFY_TOKEN), {
              waitUntil: 'domcontentloaded', timeout: 90000
            });
            await page.waitForSelector('#customer_details', { timeout: 45000 });
            await page.waitForTimeout(4500);

            const snapshot = await page.evaluate(() => {
              const css = el => {
                if (!el) return null;
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  tag: el.tagName,
                  id: el.id,
                  cls: el.className,
                  left: Math.round(r.left * 10) / 10,
                  top: Math.round(r.top * 10) / 10,
                  width: Math.round(r.width * 10) / 10,
                  marginLeft: s.marginLeft,
                  paddingLeft: s.paddingLeft,
                  display: s.display,
                  position: s.position,
                  transform: s.transform
                };
              };
              return Array.from(document.querySelectorAll('#customer_details input[type="checkbox"]'))
                .filter(cb => cb.getClientRects().length)
                .map((cb, i) => {
                  const label = cb.closest('label');
                  const row = cb.closest('p.form-row, p.create-account, h3#ship-to-different-address, p, h3, .form-row, .woocommerce-form-row, .form-group, li');
                  const section = cb.closest('.woocommerce-account-fields, .woocommerce-shipping-fields');
                  return {
                    i,
                    checkbox: css(cb),
                    name: cb.name,
                    labelText: label ? label.textContent.trim().replace(/\s+/g, ' ') : '',
                    label: css(label),
                    row: css(row),
                    section: css(section),
                    html: (row || label || cb).outerHTML.slice(0, 1600)
                  };
                });
            });
            console.log('CHECKBOX_LAYOUT_JSON=' + JSON.stringify(snapshot));

            if (snapshot.length < 3) {
              throw new Error('Expected at least 3 visible checkout checkboxes, got ' + snapshot.length);
            }
            const target = snapshot.slice(0, 3);
            const lefts = target.map(x => x.checkbox.left);
            const spread = Math.max(...lefts) - Math.min(...lefts);
            console.log('CHECKBOX_LEFTS=' + JSON.stringify(lefts) + ' SPREAD=' + spread);
            if (spread > 1.5) {
              throw new Error('Checkout checkboxes are not aligned; spread=' + spread + 'px');
            }

            const samples = [];
            for (let i = 0; i < 25; i++) {
              samples.push(await page.evaluate(() => Array.from(document.querySelectorAll('#customer_details input[type="checkbox"]'))
                .filter(cb => cb.getClientRects().length)
                .slice(0, 3)
                .map(cb => Math.round(cb.getBoundingClientRect().left * 10) / 10)));
              await page.waitForTimeout(100);
            }
            const ranges = [0,1,2].map(idx => {
              const vals = samples.map(s => s[idx]).filter(v => Number.isFinite(v));
              return Math.max(...vals) - Math.min(...vals);
            });
            console.log('CHECKBOX_STABILITY_RANGES=' + JSON.stringify(ranges));
            if (ranges.some(r => r > 1.5)) {
              throw new Error('Checkout checkbox position is unstable: ' + JSON.stringify(ranges));
            }

            await page.screenshot({ path: 'checkout-checkboxes-verified.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node verify-checkout.js
      - name: Remove verification helper
        if: always()
        shell: bash
        run: |
          set +e
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          PROD_PATH="$(cat /tmp/prod_path 2>/dev/null)"
          if [ -n "$PROD_PATH" ]; then
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/wp-content/mu-plugins/elmercado-checkout-verification-helper.php'" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-checkboxes-verified
          path: checkout-checkboxes-verified.png
          if-no-files-found: ignore

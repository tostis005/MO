name: Apply selected editorial images to batch 13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-batch13-selected-images-20260826.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace selected image metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          updates = {
            '.github/data/editorial-authority-batch13-20260826/01-cristales-blancos-jamon.php': """'image'=>array(\n'id'=>'wikimedia-guanbirra-jamon-iberico-bellota-detalle-corte-2012','direct'=>'https://commons.wikimedia.org/wiki/Special:Redirect/file/Jam%C3%B3n_Ib%C3%A9rico_de_bellota_detalle_corte.jpg','page'=>'https://commons.wikimedia.org/wiki/File:Jam%C3%B3n_Ib%C3%A9rico_de_bellota_detalle_corte.jpg','photographer'=>'Guanbirra','license'=>'CC BY-SA 3.0','license_url'=>'https://creativecommons.org/licenses/by-sa/3.0/','alt_es'=>'Detalle del corte de jamón ibérico de bellota','alt_en'=>'Close-up of sliced acorn-fed Iberian ham'),""",
            '.github/data/editorial-authority-batch13-20260826/02-freir-con-aove.php': """'image'=>array(\n'id'=>'pexels-rdne-4910221','direct'=>'https://images.pexels.com/photos/4910221/pexels-photo-4910221.jpeg?cs=srgb&dl=pexels-rdne-4910221.jpg&fm=jpg','page'=>'https://www.pexels.com/photo/crop-unrecognizable-chef-pouring-oil-in-frying-pan-4910221/','photographer'=>'RDNE Stock project','license'=>'Pexels License','license_url'=>'https://www.pexels.com/license/','alt_es'=>'Aceite de oliva vertiéndose en una sartén para freír','alt_en'=>'Olive oil being poured into a frying pan'),""",
            '.github/data/editorial-authority-batch13-20260826/03-caducan-conservas.php': """'image'=>array(\n'id'=>'pexels-tivasee-33984956','direct'=>'https://images.pexels.com/photos/33984956/pexels-photo-33984956.jpeg?cs=srgb&dl=pexels-tivasee-17374727-33984956.jpg&fm=jpg','page'=>'https://www.pexels.com/photo/assorted-pickled-jars-on-rustic-table-33984956/','photographer'=>'TIVASEE .','license'=>'Pexels License','license_url'=>'https://www.pexels.com/license/','alt_es'=>'Tarros variados de conservas y encurtidos sobre una mesa rústica','alt_en'=>'Assorted jars of preserves and pickles on a rustic table'),""",
            '.github/data/editorial-authority-batch13-20260826/05-grasa-infiltrada-jamon.php': """'image'=>array(\n'id'=>'pexels-gonzalo-mendiola-17649922','direct'=>'https://images.pexels.com/photos/17649922/pexels-photo-17649922.jpeg?cs=srgb&dl=pexels-gonzalo-mendiola-95842233-17649922.jpg&fm=jpg','page'=>'https://www.pexels.com/photo/slice-of-ham-on-roasted-bread-17649922/','photographer'=>'Gonzalo Mendiola','license'=>'Pexels License','license_url'=>'https://www.pexels.com/license/','alt_es'=>'Lonchas de jamón sobre pan tostado con vetas de grasa visibles','alt_en'=>'Slices of cured ham on toast with visible fat marbling'),""",
          }

          pattern = re.compile(r"'image'=>array\(\n.*?\),\n'content'=>", re.S)
          for path, block in updates.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, n = pattern.subn(block + "\n'content'=>", text, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace image block in {path}: {n}')
              p.write_text(new, encoding='utf-8')
          PY
          php -l .github/data/editorial-authority-batch13-20260826/01-cristales-blancos-jamon.php
          php -l .github/data/editorial-authority-batch13-20260826/02-freir-con-aove.php
          php -l .github/data/editorial-authority-batch13-20260826/03-caducan-conservas.php
          php -l .github/data/editorial-authority-batch13-20260826/05-grasa-infiltrada-jamon.php
      - name: Commit selected images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/data/editorial-authority-batch13-20260826/01-cristales-blancos-jamon.php \
                  .github/data/editorial-authority-batch13-20260826/02-freir-con-aove.php \
                  .github/data/editorial-authority-batch13-20260826/03-caducan-conservas.php \
                  .github/data/editorial-authority-batch13-20260826/05-grasa-infiltrada-jamon.php
          git commit -m 'Persist selected images for editorial batch 13'
          git push

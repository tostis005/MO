name: Audit top 3 SEO opportunity posts 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-top3-content-audit-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production posts
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true); php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          for slug in \
            hay-que-poner-lentejas-en-remojo-cuanto-tiempo \
            how-much-protein-in-beef \
            garbanzos-tiempo-remojo-cuanto-tardan-cocerse
          do
            echo "===== $slug ====="
            "$php" "$wp" eval '
              global $wpdb;
              $slug = getenv("TARGET_SLUG");
              $post = get_page_by_path($slug, OBJECT, "post");
              if (!$post) { echo "NOT_FOUND\n"; return; }
              echo "ID=".$post->ID."\n";
              echo "TITLE=".$post->post_title."\n";
              echo "STATUS=".$post->post_status."\n";
              echo "PERMALINK=".get_permalink($post->ID)."\n";
              preg_match_all("~<(h1|p)\\b[^>]*>(.*?)</\\1\\s*>~isu", $post->post_content, $m, PREG_SET_ORDER);
              $n = 0;
              foreach ($m as $block) {
                  $text = trim(preg_replace("~\\s+~u", " ", wp_strip_all_tags($block[2])));
                  if ($text === "") continue;
                  echo strtoupper($block[1])."=".$text."\n";
                  $n++;
                  if ($n >= 6) break;
              }
              $table = $wpdb->prefix . "aioseo_posts";
              $exists = $wpdb->get_var($wpdb->prepare("SHOW TABLES LIKE %s", $table));
              if ($exists === $table) {
                  $row = $wpdb->get_row($wpdb->prepare("SELECT title, description, canonical_url, robots_default FROM {$table} WHERE post_id=%d LIMIT 1", $post->ID), ARRAY_A);
                  echo "AIOSEO=".wp_json_encode($row, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              } else {
                  echo "AIOSEO_TABLE=ABSENT\n";
              }
              echo "CONTENT_H1_COUNT=".preg_match_all("~<h1\\b~iu", $post->post_content)."\n";
            ' --path="$PROD_PATH" --allow-root 2>&1 TARGET_SLUG="$slug" || true
          done
          REMOTE

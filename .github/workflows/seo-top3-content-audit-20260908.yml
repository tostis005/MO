name: Audit top 3 SEO opportunity posts 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-top3-content-audit-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production posts
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true); php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          for slug in hay-que-poner-lentejas-en-remojo-cuanto-tiempo how-much-protein-in-beef garbanzos-tiempo-remojo-cuanto-tardan-cocerse; do
            echo "===== $slug ====="
            id=$("$php" "$wp" post list --post_type=post --name="$slug" --post_status=any --field=ID --path="$PROD_PATH" --allow-root | head -n1)
            if [ -z "$id" ]; then echo 'NOT_FOUND'; continue; fi
            echo "ID=$id"
            echo -n 'TITLE='; "$php" "$wp" post get "$id" --field=post_title --path="$PROD_PATH" --allow-root
            echo -n 'STATUS='; "$php" "$wp" post get "$id" --field=post_status --path="$PROD_PATH" --allow-root
            echo -n 'PERMALINK='; "$php" "$wp" post url "$id" --path="$PROD_PATH" --allow-root
            tmp=$(mktemp)
            "$php" "$wp" post get "$id" --field=post_content --path="$PROD_PATH" --allow-root > "$tmp"
            "$php" -r '$s=file_get_contents($argv[1]); preg_match_all("~<(h1|p)\\b[^>]*>(.*?)</\\1\\s*>~isu",$s,$m,PREG_SET_ORDER); $n=0; foreach($m as $b){$t=trim(preg_replace("~\\s+~u"," ",strip_tags($b[2]))); if($t==="")continue; echo strtoupper($b[1])."=".$t.PHP_EOL; if(++$n>=6)break;} echo "CONTENT_H1_COUNT=".preg_match_all("~<h1\\b~iu",$s).PHP_EOL;' "$tmp"
            rm -f "$tmp"
          done
          REMOTE

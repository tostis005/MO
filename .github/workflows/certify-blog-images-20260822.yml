name: Certify production blog imagery 20260822

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-blog-images-20260822.yml'
      - '.github/scripts/certify-blog-images-20260822.php'
      - '.github/data/editorial-image-overrides-20260821.php'
      - '.github/data/legacy-blog-image-overrides-20260821.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certify-production-blog-imagery-20260822
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate certifier
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/certify-blog-images-20260822.php
          php -l .github/data/editorial-image-overrides-20260821.php
          php -l .github/data/legacy-blog-image-overrides-20260821.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Read production image state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          REMOTE="/tmp/emdo-blog-cert-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/certify-blog-images-20260822.php \
            .github/data/editorial-image-overrides-20260821.php \
            .github/data/legacy-blog-image-overrides-20260821.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            MDO_AUTHORITY_IMAGE_OVERRIDES='$REMOTE/editorial-image-overrides-20260821.php' \
            MDO_LEGACY_IMAGE_OVERRIDES='$REMOTE/legacy-blog-image-overrides-20260821.php' \
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE/certify-blog-images-20260822.php' --path='$PROD_PATH' --allow-root > '$REMOTE/report.json'
            \"\$php_bin\" -r '\$r=json_decode(file_get_contents(\$argv[1]),true); if(!is_array(\$r)||(\$r[\"status\"]??\"\")!==\"ok\"||(\$r[\"authority_count\"]??0)<50||!empty(\$r[\"duplicates_by_pexels\"])||!empty(\$r[\"duplicates_by_md5\"])||!empty(\$r[\"forbidden_hits\"])||!empty(\$r[\"semantic_flags\"])){fwrite(STDERR,\"production certification failed\\n\");exit(1);}' '$REMOTE/report.json'
          "
          mkdir -p .deploy-status
          sshpass -e scp $SCP "$STAGING_USER@$STAGING_HOST:$REMOTE/report.json" .deploy-status/blog-image-certification-20260822.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          python3 -m json.tool .deploy-status/blog-image-certification-20260822.json >/dev/null
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

      - name: Verify public rendered pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/public-checks.tsv
          import json
          d=json.load(open('.deploy-status/blog-image-certification-20260822.json'))
          for row in d['public_checks']:
              print(f"{row['expected_pexels_id']}\t{row['url']}\t{row['context']}")
          PY

          : > /tmp/public-results.tsv
          while IFS=$'\t' read -r expected url context; do
            [ -n "$expected" ] && [ -n "$url" ]
            page="/tmp/emdo-cert-${expected}.html"
            result="$(curl -ksS -L --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 60 -A 'EMDO production image certification/20260822' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$page" -w '%{http_code}|%{url_effective}' "${url}?emdo_image_cert=${GITHUB_SHA}")"
            code="${result%%|*}"; effective="${result#*|}"
            [ "$code" = 200 ] || { echo "HTTP $code for $context $url" >&2; exit 1; }
            grep -Fq "$expected" "$page" || { echo "Expected image $expected not rendered for $context ($effective)" >&2; exit 1; }
            if grep -Eq '37328201|19370451|4441933|36601487|37328770|24706530|34314216|36215958|24906286|30795237|30795238|947174|14639925|6059884|25185476|30811288|36183155' "$page"; then
              echo "Retired image rendered for $context ($effective)" >&2; exit 1
            fi
            printf '%s\t%s\t%s\t%s\n' "$context" "$expected" "$code" "$effective" >> /tmp/public-results.tsv
          done < /tmp/public-checks.tsv

          # Also certify the archive and translated pagination are healthy after the image repair.
          for path in '/en/journal/' '/en/journal/page/2/' '/en/journal/page/3/'; do
            code="$(curl -ksS -L --retry 3 --connect-timeout 12 --max-time 60 -A 'EMDO production image certification/20260822' -o /tmp/archive.html -w '%{http_code}' "https://www.elmercadodeorigen.com${path}?emdo_image_cert=${GITHUB_SHA}")"
            [ "$code" = 200 ] || { echo "$path returned $code" >&2; exit 1; }
            ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error on this website|Page not found|Página no encontrada' /tmp/archive.html
          done

          python3 - <<'PY'
          import json, datetime
          p='.deploy-status/blog-image-certification-20260822.json'
          d=json.load(open(p))
          rows=[]
          with open('/tmp/public-results.tsv') as f:
              for line in f:
                  context, expected, code, effective=line.rstrip('\n').split('\t',3)
                  rows.append({'context':context,'expected_pexels_id':expected,'http_code':int(code),'effective_url':effective})
          d['public_render_checks']=rows
          d['public_render_count']=len(rows)
          d['pagination_checks']=['/en/journal/','/en/journal/page/2/','/en/journal/page/3/']
          d['public_certified_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          d['source_sha'] = __import__('os').environ.get('GITHUB_SHA')
          d['status']='certified'
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Record certification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/blog-image-certification-20260822.json
          git commit -m "Certify production blog imagery ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Certification summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('.deploy-status/blog-image-certification-20260822.json'))
          print('BLOG_IMAGE_CERTIFIED')
          print('published_posts=',d['published_post_count'])
          print('authority_posts=',d['authority_count'])
          print('public_checks=',d['public_render_count'])
          print('duplicates_by_pexels=',len(d['duplicates_by_pexels']))
          print('duplicates_by_md5=',len(d['duplicates_by_md5']))
          print('forbidden_hits=',len(d['forbidden_hits']))
          print('semantic_flags=',len(d['semantic_flags']))
          PY

name: Category editorial bilingual deploy 20260821

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/page-categorias.php'
      - 'mu-plugins/mdo-english-category-display-20260821.php'
      - '.github/scripts/apply-category-editorial-20260821.php'
      - '.github/scripts/audit-category-editorial-live-20260821.php'
      - '.github/workflows/category-editorial-deploy-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: category-editorial-bilingual-20260821
  cancel-in-progress: false

jobs:
  deploy-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PHP
        run: |
          php -l elmercadodeorigen-child/page-categorias.php
          php -l mu-plugins/mdo-english-category-display-20260821.php
          php -l .github/scripts/apply-category-editorial-20260821.php
          php -l .github/scripts/audit-category-editorial-live-20260821.php
      - name: Deploy migrate and audit production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          mkdir -p .deploy-status
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          CHILD_DIR="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$CHILD_DIR' '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP elmercadodeorigen-child/page-categorias.php "$STAGING_USER@$STAGING_HOST:$CHILD_DIR/page-categorias.php"
          sshpass -e scp $SCP mu-plugins/mdo-english-category-display-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-category-display-20260821.php"

          REMOTE_APPLY="/tmp/apply-category-editorial-${GITHUB_RUN_ID}.php"
          REMOTE_AUDIT="/tmp/audit-category-editorial-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/apply-category-editorial-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE_APPLY"
          sshpass -e scp $SCP .github/scripts/audit-category-editorial-live-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE_AUDIT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_APPLY' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_APPLY'; exit \$rc" > .deploy-status/category-editorial-migration-20260821.json
          python3 -m json.tool .deploy-status/category-editorial-migration-20260821.json >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_AUDIT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_AUDIT'; exit \$rc" > .deploy-status/category-editorial-data-20260821.json
          python3 -m json.tool .deploy-status/category-editorial-data-20260821.json >/dev/null

          python3 - <<'PY'
          import html,json,pathlib,re,subprocess,time
          d=json.load(open('.deploy-status/category-editorial-data-20260821.json',encoding='utf-8'))
          stamp=str(int(time.time()))
          def fetch(url):
              sep='&' if '?' in url else '?'
              p=subprocess.run(['curl','-k','-L','-sS','--connect-timeout','8','--max-time','45','-H','Cache-Control: no-cache','-o','/tmp/cat-page.html','-w','%{http_code}|%{url_effective}',url+sep+'mdo_cat_editorial='+stamp],capture_output=True,text=True)
              body=pathlib.Path('/tmp/cat-page.html').read_text(errors='ignore') if pathlib.Path('/tmp/cat-page.html').exists() else ''
              parts=(p.stdout.strip().split('|',1)+[''])[:2]
              return int(parts[0] or 0),parts[1],body
          def text(body):
              body=re.sub(r'<script\b.*?</script>',' ',body,flags=re.I|re.S); body=re.sub(r'<style\b.*?</style>',' ',body,flags=re.I|re.S)
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',body))).strip()
          expected_es={
            'conservas':'Conservas artesanas de pimientos, puerros, ajetes, tomate y otras elaboraciones vegetales.',
            'hortalizas-verduras':'Hortalizas y verduras frescas de temporada, desde patatas, pimientos y calabacines hasta otras variedades de la huerta.',
            'legumbres':'Alubias, garbanzos y lentejas en distintas variedades, seleccionadas para guisos, potajes y otras recetas.',
          }
          expected_en={
            'preserves':('Preserves','Artisan preserves made with peppers, leeks, garlic shoots, tomato and other vegetables.'),
            'vegetables':('Vegetables','Fresh seasonal vegetables, from potatoes, peppers and courgettes to other produce from the market garden.'),
            'pulses':('Pulses','Beans, chickpeas and lentils in different varieties, selected for stews, casseroles and other recipes.'),
          }
          report={'routes':d['routes'],'spanish_hub':{},'english_hub':{},'archives':[],'shop':{},'huerta_store':{},'issues':[]}
          es_url=d['routes'].get('categories_es') or 'https://www.elmercadodeorigen.com/categorias/'
          en_url=d['routes'].get('categories_en') or 'https://www.elmercadodeorigen.com/en/categories/'
          for key,url in [('spanish_hub',es_url),('english_hub',en_url)]:
              code,effective,body=fetch(url); plain=text(body); report[key]={'http_code':code,'effective_url':effective,'bytes':len(body.encode())}
              if code!=200: report['issues'].append({'page':key,'reason':'http','code':code})
              if key=='spanish_hub':
                  if 'agrupados en una misma categoría para consultar toda la selección de forma sencilla' in plain: report['issues'].append({'page':key,'reason':'generic_fallback_visible'})
                  for slug,sentence in expected_es.items():
                      if sentence not in plain: report['issues'].append({'page':key,'reason':'missing_spanish_editorial','slug':slug})
              else:
                  for slug,(name,sentence) in expected_en.items():
                      if name not in plain or sentence not in plain: report['issues'].append({'page':key,'reason':'missing_english_editorial','slug':slug})
                  for wrong in ('Conservas','Hortalizas/Verduras','Legumbres'):
                      if re.search(r'\b'+re.escape(wrong)+r'\b',plain,re.I): report['issues'].append({'page':key,'reason':'spanish_category_visible','text':wrong})
          for row in d['visible_roots']:
              url=row.get('en_url') or 'https://www.elmercadodeorigen.com/en/product-category/'+row['en_slug']+'/'
              code,effective,body=fetch(url); plain=text(body); ok=row['en_name'].casefold() in plain.casefold()
              report['archives'].append({'slug':row['en_slug'],'name':row['en_name'],'url':url,'http_code':code,'effective_url':effective,'english_name_visible':ok})
              if code!=200 or '/en/product-category/' not in effective or not ok: report['issues'].append({'page':'archive','slug':row['en_slug'],'reason':'archive_bad'})
          for key,url in [('shop',d['routes'].get('shop_en') or 'https://www.elmercadodeorigen.com/en/shop/'),('huerta_store',d['routes'].get('huerta_store_en'))]:
              code,effective,body=fetch(url); plain=text(body); wrong=[x for x in ('Conservas','Hortalizas/Verduras','Legumbres') if re.search(r'\b'+re.escape(x)+r'\b',plain,re.I)]
              english=[x for x in ('Preserves','Vegetables','Pulses') if re.search(r'\b'+re.escape(x)+r'\b',plain,re.I)]
              report[key]={'http_code':code,'effective_url':effective,'english_new_category_labels':english,'spanish_new_category_labels':wrong}
              if code!=200 or wrong: report['issues'].append({'page':key,'reason':'storefront_category_language','spanish':wrong})
          pathlib.Path('.deploy-status/category-editorial-live-20260821.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if report['issues']: raise SystemExit(2)
          PY
      - name: Record production verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .deploy-status/category-editorial-migration-20260821.json .deploy-status/category-editorial-data-20260821.json .deploy-status/category-editorial-live-20260821.json || true
          git commit -m 'Record bilingual category editorial verification [skip ci]' || true
          git push origin HEAD:main || true

name: Audit Adsterra latency path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-latency-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Measure production timing
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options

          url='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&latency_audit=1'
          o=Options(); o.page_load_strategy='eager'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o); d.set_page_load_timeout(45)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
              (()=>{const f=window.fetch;window.fetch=function(input,init){
                const u=typeof input==='string'?input:(input&&input.url)||'';
                if(u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                  init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                  h.set('X-Country-Code','ZA');init.headers=h;
                }
                return f.call(this,input,init);
              };})();"""})
              t=time.time()
              try:d.get(url)
              except TimeoutException:
                  print('PAGE_TIMEOUT=1',flush=True)
                  try:d.execute_script('window.stop()')
                  except:pass
              nav_ms=round((time.time()-t)*1000)
              time.sleep(10)
              state=d.execute_script(r"""
                const all=performance.getEntriesByType('resource').map(r=>({
                  name:r.name,start:Math.round(r.startTime),dur:Math.round(r.duration),
                  transfer:r.transferSize||0,initiator:r.initiatorType
                }));
                return {
                  debug:window.ElMercadoAdsterraGeoDebug||null,
                  nav:performance.getEntriesByType('navigation')[0] ? {
                    dom:Math.round(performance.getEntriesByType('navigation')[0].domContentLoadedEventEnd),
                    load:Math.round(performance.getEntriesByType('navigation')[0].loadEventEnd)
                  }:null,
                  eligibility:all.filter(r=>r.name.includes('/wp-json/elmercado/v1/blog-ad-eligibility')),
                  frames:all.filter(r=>r.name.includes('emo_adsterra_frame=')),
                  adsterra:all.filter(r=>/highrevenueformat|profitableratecpmnetwork/.test(r.name)),
                  google:all.filter(r=>/googlesyndication|doubleclick/.test(r.name))
                };
              """)
              print('NAV_CALL_MS='+str(nav_ms),flush=True)
              print('STATE='+json.dumps(state,sort_keys=True),flush=True)
          finally:d.quit()
          PY

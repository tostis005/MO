name: Create 1957 AOVE mailing draft and send one test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/draft-and-test-1957-aove-mailing-20261030.yml'
      - '.github/scripts/draft-and-test-1957-aove-mailing-20261030.php'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  draft-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify allowed scope and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/draft-and-test-1957-aove-mailing-20261030.php
          grep -Fq "Buenas noches," .github/scripts/draft-and-test-1957-aove-mailing-20261030.php
          grep -Fq "jose.fraga@gmail.com" .github/scripts/draft-and-test-1957-aove-mailing-20261030.php
          grep -Fq "status='draft'" .github/scripts/draft-and-test-1957-aove-mailing-20261030.php
          grep -Fq "sendTestEmail()" .github/scripts/draft-and-test-1957-aove-mailing-20261030.php
          grep -Fq 'https://www.elmercadodeorigen.com/tienda/1957/' .github/scripts/draft-and-test-1957-aove-mailing-20261030.php
      - name: Create FluentCRM draft in production and send test only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          REMOTE="/tmp/fluent-1957-aove-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/draft-and-test-1957-aove-mailing-20261030.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "timeout 180 /opt/plesk/php/8.2/bin/php -d memory_limit=1024M /usr/local/bin/wp eval-file '$REMOTE' --path='$ROOT' --allow-root" | tee /tmp/1957-aove-fluent-result.txt
          grep -q 'AOVE_FLUENT_OPERATION_COMPLETE' /tmp/1957-aove-fluent-result.txt
          grep -q 'AOVE_FLUENT_TEST_OK\|AOVE_FLUENT_TEST_ALREADY_SENT' /tmp/1957-aove-fluent-result.txt
      - name: Store non-sensitive result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1957-aove-fluent-draft-and-test
          path: /tmp/1957-aove-fluent-result.txt
          if-no-files-found: warn
          retention-days: 7

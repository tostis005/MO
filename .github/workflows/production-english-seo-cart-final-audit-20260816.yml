name: Production English SEO and cart final audit 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-english-seo-cart-final-audit-20260816.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit English head and live cart
        run: |
          set -u
          stamp=$(date +%s%N)
          for p in /en/shop/ /en/product/100-iberian-acorn-fed-ham-black-tag/ /en/product-category/oils/ /en/extra-virgin-olive-oil/ /en/privacy-policy/ /en/store/hidalgo-de-la-jara/; do
            echo "=== HEAD $p ==="
            curl -ksSL --max-time 40 "https://www.elmercadodeorigen.com${p}?mdo_seo=$stamp" -o /tmp/h.html || true
            grep -oiE '<link[^>]+rel=["'"']canonical["'"'][^>]*>|<link[^>]+hreflang=["'"'][^"'"']+["'"'][^>]*>|<meta[^>]+name=["'"']description["'"'][^>]*>' /tmp/h.html | head -n 20 || true
            python3 - "$p" <<'PY'
import re,sys,html,json
s=open('/tmp/h.html',encoding='utf-8',errors='ignore').read(); path=sys.argv[1]
canon=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',s,re.I)
if not canon: canon=re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',s,re.I)
hrefs=re.findall(r'<link[^>]+hreflang=["\']([^"\']+)["\'][^>]+href=["\']([^"\']+)',s,re.I)
if not hrefs: hrefs=[(b,a) for a,b in re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+hreflang=["\']([^"\']+)',s,re.I)]
print('CANON',canon[:3]); print('HREFLANG',hrefs[:10])
for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',s,re.I|re.S):
    txt=html.unescape(m.group(1))
    if re.search(r'\b(El aceite de|jamón procedente|paleta procedente|política de privacidad|envíos en|información nutricional|introducción)\b',txt,re.I): print('SPANISH_JSONLD',txt[:900].replace('\n',' '))
PY
          done
          echo '=== LIVE CART ==='
          rm -f /tmp/cookies.txt
          curl -ksSL --max-time 40 -c /tmp/cookies.txt -b /tmp/cookies.txt "https://www.elmercadodeorigen.com/en/?add-to-cart=1350&quantity=1&mdo_cart=$stamp" -o /tmp/add.html || true
          code=$(curl -ksSL --max-time 40 -c /tmp/cookies.txt -b /tmp/cookies.txt -o /tmp/cart.html -w '%{http_code}' "https://www.elmercadodeorigen.com/en/cart/?mdo_cart=$stamp" || true)
          echo "CART_HTTP=$code"
          grep -oiE '>([^<]*(minimum|minim|mínimo|supplier|seller|vendor|producer|productor|order|pedido|cart|carrito|shipping|envío|checkout|finalizar compra)[^<]*)<' /tmp/cart.html | head -n 80 || true
          echo '=== CART SPANISH SIGNALS ==='
          grep -oiE '>([^<]*(pedido mínimo|importe mínimo|mínimo de|no llegas|carrito|finalizar compra|envío|vendedor|productor|eliminar|actualizar carrito|seguir comprando)[^<]*)<' /tmp/cart.html | head -n 40 || true
          echo '=== CART ENGLISH LINKS ==='
          grep -oE 'href="[^"]+"' /tmp/cart.html | grep -E '/(en/)?(cart|checkout|shop|product|tienda|producto)/' | head -n 50 || true

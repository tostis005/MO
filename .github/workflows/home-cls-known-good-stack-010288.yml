name: Home known-good performance stack 010288

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cls-known-good-stack-010288.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build last-known-good performance files
        shell: bash
        run: |
          set -euo pipefail
          GOOD='0002457de238dbc6be9e07171108db1039c091bb'
          mkdir -p /tmp/good
          git show "$GOOD:mu-plugins/mdo-home-performance-20260819.php" > /tmp/good/mdo-home-performance.php
          git show "$GOOD:elmercadodeorigen-child/assets/js/theme.js" > /tmp/good/theme.js
          git show "$GOOD:elmercadodeorigen-child/assets/js/commerce.js" > /tmp/good/commerce.js
          git show "$GOOD:elmercadodeorigen-child/mu-plugins/elmercado-home-responsive-vendors-010253.php" > /tmp/good/responsive-vendors.php
          git show "$GOOD:elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php" > /tmp/good/home-cls.php
          git show "$GOOD:elmercadodeorigen-child/assets/css/critical-woostify-home.min.css" > /tmp/good/critical.css
          php -l /tmp/good/mdo-home-performance.php
          php -l /tmp/good/responsive-vendors.php
          php -l /tmp/good/home-cls.php
      - name: Deploy known-good performance stack
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?}"
          for f in mdo-home-performance.php theme.js commerce.js responsive-vendors.php home-cls.php critical.css; do sshpass -e scp $SCP "/tmp/good/$f" "$STAGING_USER@$STAGING_HOST:/tmp/$f-${GITHUB_RUN_ID}"; done
          timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; MU='$PROD/wp-content/mu-plugins'
            install -m 0644 /tmp/mdo-home-performance.php-${GITHUB_RUN_ID} \"\$MU/mdo-home-performance-20260819.php\"
            install -m 0644 /tmp/theme.js-${GITHUB_RUN_ID} \"\$THEME/assets/js/theme.js\"
            install -m 0644 /tmp/commerce.js-${GITHUB_RUN_ID} \"\$THEME/assets/js/commerce.js\"
            install -m 0644 /tmp/responsive-vendors.php-${GITHUB_RUN_ID} \"\$MU/elmercado-home-responsive-vendors-010253.php\"
            install -m 0644 /tmp/home-cls.php-${GITHUB_RUN_ID} \"\$MU/elmercado-home-cls-010256.php\"
            install -m 0644 /tmp/critical.css-${GITHUB_RUN_ID} \"\$THEME/assets/css/critical-woostify-home.min.css\"
            rm -f \"\$MU/elmercado-home-a11y-motion-010265.php\" \"\$MU/elmercado-home-native-stars-010264.php\" \"\$MU/mdo-home-webp-delivery-20260819.php\" \"\$MU/mdo-home-translatepress-lite-20260819.php\" \"\$MU/elmercado-home-header-cls-010279.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/*-${GITHUB_RUN_ID}
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
      - name: Lighthouse desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path=/tmp/lhr.json --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          python3 - <<'PY' | tee runtime/home-cls-known-good-stack-010288.txt
          import json
          r=json.load(open('/tmp/lhr.json')); a=r['audits']
          print('score=',round(r['categories']['performance']['score']*100)); print('fcp=',round(a['first-contentful-paint']['numericValue'])); print('lcp=',round(a['largest-contentful-paint']['numericValue'])); print('tbt=',round(a['total-blocking-time']['numericValue'])); print('cls=',a['cumulative-layout-shift']['numericValue'])
          for item in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]: n=item.get('node') or {}; print('shift=',item.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          PY
      - name: Record result
        if: always()
        shell: bash
        run: |
          mkdir -p runtime; [ -f runtime/home-cls-known-good-stack-010288.txt ] || echo failed > runtime/home-cls-known-good-stack-010288.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add runtime/home-cls-known-good-stack-010288.txt; git commit -m 'Record known-good Home performance stack CLS test' || exit 0; git pull --rebase origin main; git push origin HEAD:main

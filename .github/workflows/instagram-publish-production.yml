name: Publish Instagram queue to production

on:
  push:
    branches: [main]
    paths:
      - 'instagram-queue.json'
      - '.github/scripts/instagram-publish-runner.php'
      - '.github/workflows/instagram-publish-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emdo-instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate queue
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/instagram-publish-runner.php
          jq -e 'type == "object" and has("publish") and has("request_id") and has("image_url") and has("caption")' instagram-queue.json >/dev/null
          PUBLISH="$(jq -r '.publish' instagram-queue.json)"
          if [ "$PUBLISH" != "true" ] && [ "$PUBLISH" != "false" ]; then
            echo 'publish must be a JSON boolean' >&2
            exit 5
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            jq -e '.request_id | type == "string" and length > 0' instagram-queue.json >/dev/null
            jq -e '.image_url | type == "string" and startswith("https://")' instagram-queue.json >/dev/null
            jq -e '.caption | type == "string" and length > 0 and length <= 2200' instagram-queue.json >/dev/null
          fi

      - name: Queue is disabled
        if: steps.queue.outputs.publish != 'true'
        run: echo 'Instagram queue is inert (publish=false). Nothing will be posted.'

      - name: Install SSH helper
        if: steps.queue.outputs.publish == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Publish queued content and verify
        if: steps.queue.outputs.publish == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_QUEUE="/tmp/emdo-instagram-queue-${GITHUB_RUN_ID}.json"
          REMOTE_RUNNER="/tmp/emdo-instagram-runner-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS instagram-queue.json "$STAGING_USER@$STAGING_HOST:$REMOTE_QUEUE"
          sshpass -e scp $SCP_OPTIONS .github/scripts/instagram-publish-runner.php "$STAGING_USER@$STAGING_HOST:$REMOTE_RUNNER"

          set +e
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); EMDO_IG_QUEUE_FILE='$REMOTE_QUEUE' \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_RUNNER' --path='$PROD_PATH' --allow-root" 2>&1)"
          RC=$?
          set -e

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE_QUEUE' '$REMOTE_RUNNER'" || true
          printf '%s\n' "$OUTPUT"
          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi
          printf '%s' "$OUTPUT" | grep -Eq '"status":"(published|skipped)"'

          REQUEST_ID="$(jq -r '.request_id' instagram-queue.json)"
          LAST_REQUEST="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" option get emdo_ig_last_queue_request_id --path='$PROD_PATH' --allow-root" | tr -d '\r\n')"
          LOG_JSON="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" option get emdo_ig_publish_log --format=json --path='$PROD_PATH' --allow-root")"

          if [ "$LAST_REQUEST" != "$REQUEST_ID" ]; then
            echo "Production did not record the queued request id." >&2
            exit 11
          fi

          printf '%s' "$LOG_JSON" | jq -e 'type == "array" and length > 0 and .[0].media_id != null and .[0].media_id != ""' >/dev/null
          MEDIA_ID="$(printf '%s' "$LOG_JSON" | jq -r '.[0].media_id')"
          PUBLISHED_AT="$(printf '%s' "$LOG_JSON" | jq -r '.[0].published_at // ""')"
          IMAGE_URL="$(printf '%s' "$LOG_JSON" | jq -r '.[0].image_url // ""')"
          USERNAME="$(printf '%s' "$LOG_JSON" | jq -r '.[0].username // ""')"

          jq -n \
            --arg status "published" \
            --arg request_id "$REQUEST_ID" \
            --arg media_id "$MEDIA_ID" \
            --arg published_at "$PUBLISHED_AT" \
            --arg image_url "$IMAGE_URL" \
            --arg username "$USERNAME" \
            '{status:$status,request_id:$request_id,media_id:$media_id,published_at:$published_at,image_url:$image_url,username:$username}' \
            > instagram-publish-result.json

      - name: Record publication result
        if: steps.queue.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s instagram-publish-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram-publish-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Instagram publication result [skip ci]'
          git push

name: Deploy staging bilingual preview 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-deploy-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH and text helpers
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass w3m
      - name: Configure staging and install helper
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to find staging WordPress path}"
          REMOTE_CONFIG="/tmp/mdo-bilingual-config-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$WP_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-bilingual.php "$STAGING_USER@$STAGING_HOST:$WP_PATH/wp-content/mu-plugins/mdo-staging-bilingual.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-bilingual-config.php "$STAGING_USER@$STAGING_HOST:$REMOTE_CONFIG"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M -d display_errors=0 \"\$wp_bin\" eval-file '$REMOTE_CONFIG' --path='$WP_PATH' --allow-root 2>/dev/null; \"\$php_bin\" -d memory_limit=512M -d display_errors=0 \"\$wp_bin\" cache flush --path='$WP_PATH' --allow-root >/dev/null 2>&1 || true; code=\$?; rm -f '$REMOTE_CONFIG'; exit \$code"
      - name: Verify Spanish and English routes
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}"
          for path in \
            '/' \
            '/en/' \
            '/tienda/' \
            '/en/tienda/' \
            '/productores/' \
            '/en/productores/' \
            '/en/quienes-somos/' \
            '/en/contacto/'; do
              url="https://dev.elmercadodeorigen.com${path}?mdo_bilingual_verify=${stamp}"
              code="$(curl -kLsS -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' --max-time 35 "$url")"
              echo "$code $path"
              test "$code" = '200'
              grep -q 'mdo-language-switcher' /tmp/page.html
              if [[ "$path" == /en/* ]]; then
                grep -q 'mdo-language-en' /tmp/page.html
              fi
          done
      - name: Show English visible-text audit
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}"
          for path in /en/ /en/tienda/ /en/productores/ /en/quienes-somos/ /en/contacto/; do
            echo "===== TEXT $path ====="
            w3m -dump -cols 140 "https://dev.elmercadodeorigen.com${path}?mdo_text_audit=${stamp}" | sed '/^[[:space:]]*$/d' | head -n 180 || true
            echo "===== SPANISH HINTS $path ====="
            w3m -dump -cols 180 "https://dev.elmercadodeorigen.com${path}?mdo_text_audit=${stamp}" | grep -Ei '\b(productos|productores|tienda|envío|comprar|selección|calidad|quiénes|contacto|filtros|ordenar|mostrando|resultados|carrito|cuenta|jamón|paleta|queso|naranja|nuestro|nuestra|desde|para|por|con|del|una|los|las)\b' | head -n 120 || true
          done

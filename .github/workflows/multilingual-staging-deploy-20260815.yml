name: Deploy staging bilingual preview 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multilingual-staging-deploy-20260815.yml'
      - '.github/scripts/mdo-staging-bilingual-v2.php.gz.b64'
      - '.github/scripts/mdo-staging-bilingual-polish.php'
      - '.github/scripts/mdo-staging-bilingual-config.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bilingual helpers
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/scripts/mdo-staging-bilingual-v2.php.gz.b64 | gzip -dc > /tmp/mdo-staging-bilingual.php
          php -l /tmp/mdo-staging-bilingual.php
          php -l .github/scripts/mdo-staging-bilingual-polish.php
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure bilingual staging
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to find staging WordPress path}"
          REMOTE_CONFIG="/tmp/mdo-bilingual-config-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$WP_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-staging-bilingual.php "$STAGING_USER@$STAGING_HOST:$WP_PATH/wp-content/mu-plugins/mdo-staging-bilingual.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-bilingual-polish.php "$STAGING_USER@$STAGING_HOST:$WP_PATH/wp-content/mu-plugins/000-mdo-staging-bilingual-polish.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-bilingual-config.php "$STAGING_USER@$STAGING_HOST:$REMOTE_CONFIG"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' REMOTE_CONFIG='$REMOTE_CONFIG' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp() { "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$WP_PATH" --allow-root "$@"; }
          siteurl="$(wp option get siteurl 2>/dev/null | tail -n1)"
          case "$siteurl" in https://dev.elmercadodeorigen.com*) ;; *) echo "Refusing non-staging: $siteurl" >&2; exit 2;; esac
          wp plugin update translatepress-multilingual || true
          wp eval-file "$REMOTE_CONFIG" 2>/dev/null
          prefix="$(wp db prefix)"
          es_table="${prefix}trp_gettext_es_es"
          en_table="${prefix}trp_gettext_en_us"
          if ! wp db query "SHOW TABLES LIKE '${en_table}';" --skip-column-names | grep -qx "$en_table"; then
            echo "Repairing missing $en_table from TranslatePress schema"
            wp db query "CREATE TABLE \`${en_table}\` LIKE \`${es_table}\`;"
          fi
          wp cache flush >/dev/null 2>&1 || true
          echo "TranslatePress version: $(wp plugin get translatepress-multilingual --field=version)"
          if wp db query "SHOW TABLES LIKE '${en_table}';" --skip-column-names | grep -qx "$en_table"; then
            echo "English gettext table: OK"
          else
            echo "English gettext table: MISSING" >&2
            exit 3
          fi
          rm -f "$REMOTE_CONFIG"
          REMOTE
      - name: Verify bilingual routes and rendered browser output
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}"
          for path in / /en/ /tienda/ /en/tienda/ /productores/ /en/productores/ /en/quienes-somos/ /en/contacto/; do
            url="https://dev.elmercadodeorigen.com${path}?mdo_verify=${stamp}"
            code="$(curl -kLsS -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' --max-time 35 "$url")"
            echo "$code $path"
            test "$code" = 200
            grep -q 'mdo-language-switcher' /tmp/page.html
            if [[ "$path" == /en/* ]]; then
              grep -q 'mdo-language-en' /tmp/page.html
              grep -q 'mdo-staging-visible-english-polish' /tmp/page.html
              ! grep -q 'WordPress database error' /tmp/page.html
              ! grep -q 'El Mercado de Origin' /tmp/page.html
              ! grep -q 'El-Mercado-de-Origin' /tmp/page.html
            fi
          done

          curl -kLsS -H 'Cache-Control: no-cache' "https://dev.elmercadodeorigen.com/en/productores/?mdo_copy=${stamp}" -o /tmp/producers-en.html
          grep -q 'Discover the origin through the people who make it possible.' /tmp/producers-en.html
          curl -kLsS -H 'Cache-Control: no-cache' "https://dev.elmercadodeorigen.com/en/contacto/?mdo_copy=${stamp}" -o /tmp/contact-en.html
          grep -q 'How can we help?' /tmp/contact-en.html

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          : "${chrome:?No headless browser available on runner}"
          timeout 60 "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "https://dev.elmercadodeorigen.com/en/?mdo_browser=${stamp}" > /tmp/home-dom.html 2>/dev/null
          grep -q '<h2>Find what you' /tmp/home-dom.html
          grep -q '<h2>Our customers' /tmp/home-dom.html
          grep -q 'Would you like to be part of El Mercado de Origen?' /tmp/home-dom.html

          timeout 60 "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "https://dev.elmercadodeorigen.com/en/tienda/?mdo_browser=${stamp}" > /tmp/shop-dom.html 2>/dev/null
          grep -q 'Load more products' /tmp/shop-dom.html
          grep -q '100% Iberian acorn-fed' /tmp/shop-dom.html

          timeout 60 "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "https://dev.elmercadodeorigen.com/en/quienes-somos/?mdo_browser=${stamp}" > /tmp/about-dom.html 2>/dev/null
          grep -q 'El Mercado de Origen was born from the need to bring producers and end consumers closer together.' /tmp/about-dom.html

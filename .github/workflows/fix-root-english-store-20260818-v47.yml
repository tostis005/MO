name: Fix root English store v47

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-root-english-store-20260818-v47.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run and edit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/english-store-v47.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mu-plugins/mdo-z-english-vendor-seo-010260.php')
          s = p.read_text()
          old = """\t} elseif ( preg_match( '#^en/store/([^/]+)$#i', $path, $m ) ) {
          \t\t$internal = '/en/tienda/' . mdoev_store_slug_010260( $m[1] ) . '/';
          }
          """
          if old not in s:
              raise SystemExit('Expected root rewrite branch not found')
          s = s.replace(old, "\t}\n", 1)
          s = s.replace(' * Version: 1.0.1', ' * Version: 1.0.2', 1)
          p.write_text(s)
          PY
          php -l mu-plugins/mdo-z-english-vendor-seo-010260.php
          git add runtime/english-store-v47.txt mu-plugins/mdo-z-english-vendor-seo-010260.php
          git commit -m 'Remove duplicate root English store rewrite'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          echo "$PROD_PATH" > /tmp/prod_path_v47
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-z-english-vendor-seo-010260.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php'; wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify store roots from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -e
            out=/tmp/store-v47.txt
            : > "$out"
            for url in https://www.elmercadodeorigen.com/en/store/1957/ https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/; do
              rm -f /tmp/h47 /tmp/b47
              code=$(curl -k -L --max-redirs 5 -sS --connect-timeout 8 --max-time 35 -D /tmp/h47 -o /tmp/b47 -w "%{http_code}" "$url")
              products=$(grep -oE "/en/product/[^\" <]+" /tmp/b47 | sort -u | wc -l | tr -d " ")
              policies=$(grep -oiE ">[[:space:]]*Policies[[:space:]]*<" /tmp/b47 | wc -l | tr -d " ")
              about=$(grep -oE "/en/store/[^\" ]+/about/" /tmp/b47 | sort -u | wc -l | tr -d " ")
              echo "url=$url code=$code redirects=$(grep -ic "^location:" /tmp/h47 || true) products=$products policies=$policies about_links=$about" >> "$out"
              test "$code" = 200
              test "$products" -gt 0
              test "$policies" = 0
              test "$about" -gt 0
            done
            cat "$out"
          ' > runtime/english-store-verify-v47.txt

      - name: Record success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=success\n' "$GITHUB_RUN_ID" > runtime/english-store-v47.txt
          git add runtime/english-store-v47.txt runtime/english-store-verify-v47.txt
          git commit -m 'Verify root English stores v47'
          git push origin HEAD:main

name: SEO - improve 2026 imported supplier product descriptions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-new-supplier-seo-copy-20261019.yml'
      - '.github/scripts/apply-new-supplier-seo-copy-20261019.php'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and inspect WordPress without changing data
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/apply-new-supplier-seo-copy-20261019.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          # Avoid running against a stale importer: a future supplier sync must
          # preserve the approved short copy and apply the same neutralization.
          EXPECTED_SHA="$(sha256sum mdo-supplier-sync/includes/class-mdo-woo-importer.php | awk '{print $1}')"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$EXPECTED_SHA'" <<'WAIT'
          set -euo pipefail
          prod="$1"; expected="$2"
          deployed="$prod/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-woo-importer.php"
          for i in $(seq 1 60); do
            actual=$(sha256sum "$deployed" 2>/dev/null | awk '{print $1}' || true)
            [ "$actual" = "$expected" ] && { echo EMDO_COPY_SYNC_DEPLOYED_OK; exit 0; }
            sleep 10
          done
          echo 'The approved importer update is not yet installed. No product content was changed.' >&2
          exit 21
          WAIT
          SCRIPT="/tmp/apply-productcopy-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/apply-new-supplier-seo-copy-20261019.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            rm -f '$SCRIPT'
          " | tee /tmp/seo-product-apply.log
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json
          rows=[line.removeprefix('EMDO_SEO_COPY_APPLY=') for line in open('/tmp/seo-product-apply.log') if line.startswith('EMDO_SEO_COPY_APPLY=')]
          assert rows, 'Live SEO report not emitted'
          data=json.loads(rows[-1])
          assert data['verified']
          assert data['latitudes']['reviewed']==138
          assert data['chocolates-artesanos-isabel']['reviewed']>=95
          print('SEO_COPY_APPLIED',data['latitudes'],data['chocolates-artesanos-isabel'])
          with open('.deploy-status/new-supplier-seo-copy-applied-20261019.json','w') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/new-supplier-seo-copy-applied-20261019.json
          git commit -m 'Record live SEO copy corrections for Latitudes and Isabel [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main


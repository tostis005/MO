name: Editorial authority batch 1 repair 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch1-repair-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-authority-batch1-repair-20260821
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish with diagnostics
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          php -l .github/scripts/publish-editorial-authority-batch1-20260821.php > /tmp/lint.txt 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-english-journal-content-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-journal-content-20260821.php"
          REMOTE="/tmp/editorial-authority-batch1-diag-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch1-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" eval 'echo wp_json_encode(array(\"site\"=>get_option(\"siteurl\"),\"ABSPATH\"=>defined(\"ABSPATH\"),\"posts\"=>wp_count_posts(\"post\")->publish));' --path='$PROD_PATH' --allow-root" > /tmp/probe-before.txt 2>/tmp/probe-before-err.txt || true

          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > /tmp/pub-out.txt 2> /tmp/pub-err.txt
          PUB_RC=$?
          set -e
          echo "$PUB_RC" > /tmp/pub-rc.txt

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" eval 'global \$wpdb; echo wp_json_encode(array(\"posts\"=>wp_count_posts(\"post\")->publish,\"authority\"=>(int)\$wpdb->get_var(\"SELECT COUNT(*) FROM {\$wpdb->postmeta} WHERE meta_key=\\\"_emdo_authority_key\\\"\")));' --path='$PROD_PATH' --allow-root" > /tmp/probe-after.txt 2>/tmp/probe-after-err.txt || true
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true

          python3 - <<'PY'
          import json,os,re
          def read(p):
              try:return open(p,encoding='utf-8',errors='ignore').read()
              except:return ''
          def last_json(s):
              for line in reversed([x.strip() for x in s.splitlines() if x.strip()]):
                  if line.startswith('{'):
                      try:return json.loads(line)
                      except:pass
              return None
          stdout=read('/tmp/pub-out.txt'); stderr=read('/tmp/pub-err.txt')
          out={
            'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],
            'publisher_rc':int(read('/tmp/pub-rc.txt') or 999),
            'probe_before_raw':read('/tmp/probe-before.txt')[-3000:],
            'probe_after_raw':read('/tmp/probe-after.txt')[-3000:],
            'probe_before':last_json(read('/tmp/probe-before.txt')),
            'probe_after':last_json(read('/tmp/probe-after.txt')),
            'publisher_stdout':stdout[-12000:],
            'publisher_stderr':stderr[-6000:],
            'publisher_json':last_json(stdout),
          }
          out['published']=bool(out['probe_after'] and int(out['probe_after'].get('authority',0))>=5)
          json.dump(out,open('.deploy-status/editorial-authority-batch1-repair-20260821.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open('.deploy-status/editorial-authority-batch1-repair-20260821.json','a').write('\n')
          PY

      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-status/editorial-authority-batch1-repair-20260821.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch1-repair-20260821.json
          git commit -m 'Record editorial authority publisher diagnostics [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

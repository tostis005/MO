name: Editorial authority batch 1 repair 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch1-repair-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-authority-batch1-repair-20260821
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and publish
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -u
          mkdir -p .deploy-status
          php -l .github/scripts/publish-editorial-authority-batch1-20260821.php > /tmp/ab1-lint.txt 2>&1
          LINT_RC=$?
          echo "$LINT_RC" > /tmp/ab1-lint-rc.txt
          if [ "$LINT_RC" -ne 0 ]; then
            python3 - <<'PY'
          import json,os
          out={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'lint_rc':int(open('/tmp/ab1-lint-rc.txt').read()),'lint':open('/tmp/ab1-lint.txt').read()[-4000:],'publisher_rc':None,'published':False}
          json.dump(out,open('.deploy-status/editorial-authority-batch1-repair-20260821.json','w'),ensure_ascii=False,indent=2); open('.deploy-status/editorial-authority-batch1-repair-20260821.json','a').write('\n')
          PY
            exit 0
          fi

          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-english-journal-content-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-journal-content-20260821.php"
          REMOTE="/tmp/editorial-authority-batch1-repair-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch1-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > /tmp/ab1-publisher-out.txt 2> /tmp/ab1-publisher-err.txt
          PUB_RC=$?
          set -e
          echo "$PUB_RC" > /tmp/ab1-pub-rc.txt
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true

          python3 - <<'PY'
          import json,os
          rc=int(open('/tmp/ab1-pub-rc.txt').read())
          stdout=open('/tmp/ab1-publisher-out.txt',encoding='utf-8',errors='ignore').read()
          stderr=open('/tmp/ab1-publisher-err.txt',encoding='utf-8',errors='ignore').read()
          data=None
          if rc==0:
              try: data=json.loads(stdout)
              except Exception: pass
          out={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'lint_rc':0,'lint':open('/tmp/ab1-lint.txt').read().strip(),'publisher_rc':rc,'publisher_stderr':stderr[-6000:],'publisher_data':data,'published':bool(rc==0 and isinstance(data,dict) and len(data.get('posts',[]))==5)}
          json.dump(out,open('.deploy-status/editorial-authority-batch1-repair-20260821.json','w',encoding='utf-8'),ensure_ascii=False,indent=2); open('.deploy-status/editorial-authority-batch1-repair-20260821.json','a').write('\n')
          PY

      - name: Record repair diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-status/editorial-authority-batch1-repair-20260821.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch1-repair-20260821.json
          git commit -m 'Record editorial authority batch 1 repair [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

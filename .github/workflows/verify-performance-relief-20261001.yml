name: Verify performance relief 2026-10-01
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-performance-relief-20261001.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Verify live production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs"
          LOG="/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log"
          echo "=== TIME / LOAD ==="
          date -Is
          uptime
          echo "=== CACHE CODE ==="
          grep -nE 'hot_stale_ttl|STALE|REVALIDATE|LOCK_NB' "$ROOT/wp-content/advanced-cache.php" || true
          echo "=== FAIL2BAN ==="
          fail2ban-client status emdo-xmlrpc-abuse || true
          echo "=== HOT PAGE TIMINGS ==="
          for url in             "https://www.elmercadodeorigen.com/en/store/montjam/"             "https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/"             "https://www.elmercadodeorigen.com/en/product-category/hams-and-shoulders/"             "https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/"; do
            echo "--- $url"
            curl -k -sS --max-time 20 -A 'MDO-Verify-Relief/1.0' -D /tmp/h -o /dev/null               -w 'http=%{http_code} total=%{time_total} start=%{time_starttransfer}\n' "$url" || true
            grep -Ei 'HTTP/|X-El-Mercado-Hot-Early-Cache' /tmp/h || true
          done
          echo "=== PHP WORKERS ==="
          ps -eo pid,user,stat,etimes,%cpu,%mem,rss,args --sort=-%cpu |             grep -E 'php-fpm: pool (elmercadodeorigen.com|dev.elmercadodeorigen.com)' | head -n 30 || true
          echo "=== XMLRPC RECENT ==="
          python3 - "$LOG" <<'PY'
          import sys,re
          from datetime import datetime,timezone,timedelta
          from collections import Counter
          p=sys.argv[1]; now=datetime.now(timezone.utc); cut=now-timedelta(minutes=5)
          rx=re.compile(r'^(\S+)\s+\S+\s+\S+\s+\[([^\]]+)\]\s+"\S+\s+([^\s"]+)')
          ips=Counter(); total=0
          with open(p,'rt',encoding='utf-8',errors='replace') as f:
            for line in f:
              m=rx.match(line)
              if not m: continue
              ip,ds,target=m.groups()
              try: dt=datetime.strptime(ds,'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
              except: continue
              if dt < cut: continue
              if target.split('?',1)[0] == '/xmlrpc.php':
                total += 1; ips[ip] += 1
          print('xmlrpc_5m',total,'top',ips.most_common(10))
          PY
          REMOTE

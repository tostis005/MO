name: Audit Merchant final live 20260818

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect homepage claims, identifiers and cookie setup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$PORT")
          remote(){ sshpass -e ssh "${SSH_OPTS[@]}" "$STAGING_USER@$STAGING_HOST" "$@"; }
          PROD_PATH="$(remote '
            wp=$(command -v wp || true); ph=$(command -v php || true); [ -n "$ph" ] || ph=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$ph" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?site not found}"
          echo "PROD_PATH=$PROD_PATH"

          echo '=== FRONT PAGE ID / TITLE ==='
          remote "wp=\$(command -v wp); ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); id=\$(\"\$ph\" \"\$wp\" option get page_on_front --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root); echo ID=\$id; \"\$ph\" \"\$wp\" post get \$id --field=post_title --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root"

          echo '=== FRONT PAGE CLAIM LOCATIONS ==='
          remote "wp=\$(command -v wp); ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); id=\$(\"\$ph\" \"\$wp\" option get page_on_front --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root); \"\$ph\" \"\$wp\" db query \"SELECT 'post_content' AS location, LEFT(REPLACE(REPLACE(post_content,CHAR(10),' '),CHAR(13),' '),3000) AS sample FROM wp_posts WHERE ID=\$id AND post_content REGEXP '24.?48|DEVOLUCI|ENV[IÍ]O GRATIS|RESOLVEMOS'; SELECT meta_key AS location, LEFT(meta_value,6000) AS sample FROM wp_postmeta WHERE post_id=\$id AND meta_value REGEXP '24.?48|DEVOLUCI|ENV[IÍ]O GRATIS|RESOLVEMOS' AND meta_key NOT REGEXP '(_elementor_css|cache|hash)' LIMIT 20;\" --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root"

          echo '=== PRODUCT IDENTIFIER META KEYS AND VALUES ==='
          remote "wp=\$(command -v wp); ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); \"\$ph\" \"\$wp\" db query \"SELECT pm.meta_key, COUNT(*) AS rows_count, SUM(pm.meta_value <> '') AS nonempty FROM wp_postmeta pm JOIN wp_posts p ON p.ID=pm.post_id WHERE p.post_type IN ('product','product_variation') AND pm.meta_key REGEXP '(ean|gtin|barcode|unique_id)' GROUP BY pm.meta_key ORDER BY pm.meta_key; SELECT p.ID,p.post_title,pm.meta_key,pm.meta_value FROM wp_postmeta pm JOIN wp_posts p ON p.ID=pm.post_id WHERE p.post_type IN ('product','product_variation') AND pm.meta_key REGEXP '(ean|gtin|barcode|unique_id)' AND pm.meta_value <> '' ORDER BY p.ID,pm.meta_key LIMIT 500;\" --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root"

          echo '=== COOKIE PLUGIN ==='
          remote "wp=\$(command -v wp); ph=\$(command -v php||true); [ -n \"\$ph\" ]||ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -1); \"\$ph\" \"\$wp\" plugin list --fields=name,status,version --format=csv --path='$PROD_PATH' --skip-themes --allow-root | grep -Ei 'cookie|consent' || true"

          echo '=== LIVE HOME CLAIMS AFTER CURRENT FILTERS ==='
          curl -k -L -sS --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          grep -oiE '.{0,100}(ENVÍO GRATIS EN VARIOS PRODUCTORES|ENVÍOS EN 24-48H|DEVOLUCIÓN FÁCIL Y SENCILLA|RESOLVEMOS TUS DUDAS|Del productor a tu casa en 24.{0,5}48|Marketplace operado por).{0,250}' /tmp/home.html | sed 's/<[^>]*>/ /g' | head -30 || true
          echo '=== LIVE EN HOME CLAIMS ==='
          curl -k -L -sS --max-time 45 'https://www.elmercadodeorigen.com/en/' -o /tmp/home-en.html
          grep -oiE '.{0,100}(24.{0,5}48|FREE SHIPPING|EASY RETURN|RETURNS|SHIPPING|Marketplace operated by).{0,250}' /tmp/home-en.html | sed 's/<[^>]*>/ /g' | head -40 || true

name: Audit batch 13 live production state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-batch13-live-20260826.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read batch 13 state from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp=$(command -v wp || true)
            php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 4
            ids=$("$php" "$wp" post list --post_type=post --post_status=publish,draft,pending,future,private --meta_key=_emdo_authority_batch --meta_value=13 --orderby=ID --order=ASC --format=ids --path="$prod" --allow-root)
            for id in $ids; do
              status=$("$php" "$wp" post get "$id" --field=post_status --path="$prod" --allow-root)
              slug=$("$php" "$wp" post get "$id" --field=post_name --path="$prod" --allow-root)
              en=$("$php" "$wp" post meta get "$id" _en_US_post_name --path="$prod" --allow-root 2>/dev/null || true)
              thumb=$("$php" "$wp" post meta get "$id" _thumbnail_id --path="$prod" --allow-root 2>/dev/null || true)
              key=$("$php" "$wp" post meta get "$id" _emdo_authority_key --path="$prod" --allow-root 2>/dev/null || true)
              printf "%s\t%s\t%s\t%s\t%s\t%s\n" "$id" "$status" "$slug" "$en" "$thumb" "$key"
            done
          ' > /tmp/batch13-live.tsv
          mkdir -p .deploy-status
          {
            echo -e 'id\tstatus\tslug\ten_slug\tthumbnail_id\tkey'
            cat /tmp/batch13-live.tsv
          } > .deploy-status/editorial-authority-batch13-live-20260826.tsv
      - name: Record audit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .deploy-status/editorial-authority-batch13-live-20260826.tsv
          git commit -m 'Record batch 13 live production state [skip ci]' || exit 0
          git push

name: Verify Selectos full product information 20261002

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-selectos-full-product-info-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Selectos production data
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break ;;
              esac
            done
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP_BIN="${REST%%|*}"; WP_BIN="${REST#*|}"
          test -n "$PROD" && test -n "$PHP_BIN" && test -n "$WP_BIN"

          cat > /tmp/verify-selectos-info.php <<'PHP'
          <?php
          global $wpdb;
          $suppliers = MDO_Database::table( 'suppliers' );
          $products  = MDO_Database::table( 'source_products' );
          $runs      = MDO_Database::table( 'sync_runs' );
          $supplier_id = (int) $wpdb->get_var(
              "SELECT id FROM {$suppliers} WHERE connector='selectos-de-castilla' AND active=1 ORDER BY id ASC LIMIT 1"
          );
          if ( $supplier_id <= 0 ) {
              throw new RuntimeException( 'Proveedor Selectos activo no encontrado.' );
          }

          $run = $wpdb->get_row(
              $wpdb->prepare(
                  "SELECT id,status,products_found,products_new,products_updated,products_excluded,errors_count,message,started_at,finished_at
                   FROM {$runs} WHERE supplier_id=%d AND trigger_type='manual'
                   ORDER BY id DESC LIMIT 1",
                  $supplier_id
              ),
              ARRAY_A
          );

          $row = $wpdb->get_row(
              $wpdb->prepare(
                  "SELECT id,title,source_url,source_payload,wc_product_id,status,last_seen_at
                   FROM {$products}
                   WHERE supplier_id=%d AND title LIKE %s
                   ORDER BY id DESC LIMIT 1",
                  $supplier_id,
                  '%Jamón de Pato Ahumado%'
              ),
              ARRAY_A
          );
          if ( ! $row ) {
              throw new RuntimeException( 'Producto de control no encontrado.' );
          }

          $payload = json_decode( (string) $row['source_payload'], true );
          $source  = is_array( $payload ) ? (string) ( $payload['description'] ?? '' ) : '';
          $woo     = ! empty( $row['wc_product_id'] ) ? (string) get_post_field( 'post_content', (int) $row['wc_product_id'], 'raw' ) : '';

          $norm = static function( string $s ): string {
              $s = html_entity_decode( wp_strip_all_tags( $s ), ENT_QUOTES | ENT_HTML5, 'UTF-8' );
              $s = remove_accents( $s );
              $s = function_exists( 'mb_strtolower' ) ? mb_strtolower( $s, 'UTF-8' ) : strtolower( $s );
              return trim( preg_replace( '/\s+/u', ' ', $s ) );
          };
          $source_text = $norm( $source );
          $woo_text    = $norm( $woo );
          $needles = array( 'ingredientes', 'conservacion', 'caducidad', 'presentacion' );
          $source_ok = true; $woo_ok = true;
          foreach ( $needles as $needle ) {
              $source_ok = $source_ok && false !== strpos( $source_text, $needle );
              $woo_ok    = $woo_ok && false !== strpos( $woo_text, $needle );
          }

          $active_count = (int) $wpdb->get_var(
              $wpdb->prepare( "SELECT COUNT(*) FROM {$products} WHERE supplier_id=%d AND status='active'", $supplier_id )
          );
          $with_ingredients = 0;
          $with_conservation = 0;
          $with_expiry = 0;
          $with_presentation = 0;
          $rows = $wpdb->get_col(
              $wpdb->prepare( "SELECT source_payload FROM {$products} WHERE supplier_id=%d AND status='active'", $supplier_id )
          ) ?: array();
          foreach ( $rows as $payload_json ) {
              $p = json_decode( (string) $payload_json, true );
              $t = $norm( is_array( $p ) ? (string) ( $p['description'] ?? '' ) : '' );
              $with_ingredients  += false !== strpos( $t, 'ingredientes' ) ? 1 : 0;
              $with_conservation += false !== strpos( $t, 'conservacion' ) ? 1 : 0;
              $with_expiry       += false !== strpos( $t, 'caducidad' ) ? 1 : 0;
              $with_presentation += false !== strpos( $t, 'presentacion' ) ? 1 : 0;
          }

          $result = array(
              'plugin_version' => MDO_SUPPLIER_SYNC_VERSION,
              'supplier_id' => $supplier_id,
              'latest_manual_run' => $run,
              'active_products' => $active_count,
              'active_with_ingredients' => $with_ingredients,
              'active_with_conservation' => $with_conservation,
              'active_with_expiry' => $with_expiry,
              'active_with_presentation' => $with_presentation,
              'control_product' => array(
                  'source_product_id' => (int) $row['id'],
                  'wc_product_id' => (int) $row['wc_product_id'],
                  'title' => (string) $row['title'],
                  'status' => (string) $row['status'],
                  'source_url' => (string) $row['source_url'],
                  'permalink' => ! empty( $row['wc_product_id'] ) ? get_permalink( (int) $row['wc_product_id'] ) : '',
                  'last_seen_at' => (string) $row['last_seen_at'],
                  'source_has_complete_info' => $source_ok,
                  'woo_has_complete_info' => $woo_ok,
                  'source_description' => $source_text,
                  'woo_description' => $woo_text,
              ),
          );
          echo wp_json_encode( $result, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT ) . "\n";

          if ( '1.0.53' !== MDO_SUPPLIER_SYNC_VERSION || ! $source_ok || ! $woo_ok || empty( $row['wc_product_id'] ) ) {
              throw new RuntimeException( 'Verificación de información completa fallida.' );
          }
          PHP

          REMOTE="/tmp/verify-selectos-info-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP /tmp/verify-selectos-info.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP_BIN' -d memory_limit=768M '$WP_BIN' eval-file '$REMOTE' --path='$PROD' --allow-root"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE'"
          echo SELECTOS_PRODUCT_INFO_VERIFIED

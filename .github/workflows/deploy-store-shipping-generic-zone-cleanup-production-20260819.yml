name: Deploy shipping generic-zone cleanup to production
# activation: 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-store-shipping-generic-zone-cleanup-production-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate template
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-store-shipping/mdo-store-shipping.php
          grep -Fq "Zone-based rows must identify a real public destination" mu-plugins/mdo-store-shipping/mdo-store-shipping.php

      - name: Install SSH helper
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Find production WordPress path
        id: prod
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 10
            [ -n "$php_bin" ] || exit 11
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "path=$PROD_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy shipping template
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          REMOTE="/tmp/mdo-store-shipping-template-${GITHUB_RUN_ID}.php"
          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-store-shipping/mdo-store-shipping.php"

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-store-shipping/mdo-store-shipping.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; \
            php_bin=\$(command -v php || true); \
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \
            \"\$php_bin\" -l '$REMOTE'; \
            mkdir -p \"\$(dirname '$TARGET')\"; \
            if [ -f '$TARGET' ]; then cp -p '$TARGET' '$TARGET.bak-$GITHUB_RUN_ID'; fi; \
            mv '$REMOTE' '$TARGET'; chmod 0644 '$TARGET'; \
            \"\$php_bin\" -l '$TARGET'; \
            grep -Fq 'Zone-based rows must identify a real public destination' '$TARGET'"

      - name: Flush WordPress caches
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public 1957 shipping table
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/tienda/1957/?mdo_shipping=1&emdo_generic_zone_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO shipping verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/shipping.html "$URL"
          python3 - <<'PY'
          import html,re
          source=open('/tmp/shipping.html',encoding='utf-8',errors='ignore').read()
          rows=[]
          for raw in re.findall(r'<tr\b[^>]*>(.*?)</tr>',source,flags=re.I|re.S):
              text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
              text=re.sub(r'\s+',' ',text).strip()
              if text and not text.startswith('Destino '):
                  rows.append(text)
          print('PUBLIC_ROWS=' + repr(rows))
          generic=[r for r in rows if r.lower().startswith('zona de envío ') or r.lower().startswith('shipping zone ')]
          if generic:
              raise SystemExit('GENERIC_ZONE_ROWS_REMAIN:' + repr(generic))
          if not any(('España Península' in r or 'Mainland Spain' in r) for r in rows):
              raise SystemExit('MAINLAND_ROW_MISSING')
          if not any(any(country in r for country in ['Baleares','Portugal','Francia','Alemania','Italia']) for r in rows):
              raise SystemExit('REAL_DESTINATION_ROWS_MISSING')
          print('GENERIC_ZONE_CLEANUP_PUBLIC_OK')
          PY

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          cat > .deploy-status/store-shipping-generic-zone-cleanup-production.txt <<EOF
          status=${DEPLOY_STATUS}
          source_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/store-shipping-generic-zone-cleanup-production.txt
          git commit -m 'Record generic shipping-zone cleanup deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

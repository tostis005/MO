name: Diagnose remaining production ham mismatches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-ham-mismatch-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOMAIN: elmercadodeorigen.com
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      PASS: ${{ secrets.STAGING_PASSWORD }}
      HINT: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated Dev map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,base64,zlib,json
          s=open('.github/workflows/production-ham-apply-exact.yml',encoding='utf-8').read()
          m=re.search(r"cat > /tmp/map\.b64 <<'MAP'\n\s*([A-Za-z0-9+/=]+)\n\s*MAP",s)
          assert m, 'map block not found'
          data=zlib.decompress(base64.b64decode(m.group(1))); obj=json.loads(data)
          assert len(obj['i'])==145
          open('/tmp/map.json','wb').write(data)
          print('map',len(obj['i']))
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rsync sshpass
      - name: Read all mismatches and vendor state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh; ssh-keyscan -T 15 -p "$P" -H "$HOST" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          remote=/tmp/ham-diagnostic-${GITHUB_SHA}.json; sshpass -e rsync -az -e "ssh $OPT" /tmp/map.json "$USER@$HOST:$remote"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$HINT' '$DOMAIN' '$remote'" <<'REMOTE'
          set -eu
          hint="${1%/}"; target="$2"; map="$3"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)"; fi
          f="$(mktemp)"; script="$(mktemp --suffix=.php)"; trap 'rm -f "$f" "$script" "$map"' EXIT
          for b in "$(dirname "$hint")" "$HOME" /var/www/vhosts /var/www /home; do [ -d "$b" ]||continue; find "$b" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' 2>/dev/null>>"$f"||true; done
          path=""; while IFS= read -r c; do p="$(dirname "$c")"; s="$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true)"; n="$(printf '%s' "$s"|sed -E 's#^https?://##;s#^www\.##;s#/*$##')"; if [ "$n" = "$target" ]; then path="$p"; break; fi; done < "$f"; [ -n "$path" ] || exit 2
          cat > "$script" <<'PHP'
          <?php
          function rr($r){global$wpdb;$st=$wpdb->prefix.'mdo_source_products';if(!empty($r['surl'])){$id=(int)$wpdb->get_var($wpdb->prepare("SELECT wc_product_id FROM {$st} WHERE source_url=%s AND wc_product_id>0 ORDER BY id DESC LIMIT 1",$r['surl']));if($id&&get_post_type($id)==='product')return$id;}if(!empty($r['slug'])){$p=get_page_by_path($r['slug'],OBJECT,'product');if($p)return(int)$p->ID;}return 0;}
          $m=json_decode(file_get_contents($args[0]),true);$by=[];$samples=[];$all=[];$checked=0;
          foreach($m['i']as$r){$id=rr($r);if(!$id){$by['notfound']=($by['notfound']??0)+1;$all[]=['slug'=>$r['slug'],'type'=>'notfound'];continue;}foreach(['pa_tipo-pieza','pa_calidad','pa_raza-iberica','pa_alimentacion','pa_con-dop','pa_dop','pa_origen','pa_preparacion','pa_rango-peso','pa_curacion','pa_productor']as$tax){$a=wp_get_post_terms($id,$tax,['fields'=>'names']);$e=$r['a'][$tax]??[];sort($a,SORT_NATURAL|SORT_FLAG_CASE);sort($e,SORT_NATURAL|SORT_FLAG_CASE);if($a!==$e){$by[$tax]=($by[$tax]??0)+1;$all[]=['id'=>$id,'name'=>get_the_title($id),'type'=>$tax,'actual'=>$a,'expected'=>$e];}}$a=wp_get_post_terms($id,'product_tag',['fields'=>'names']);$e=$r['t'];sort($a,SORT_NATURAL|SORT_FLAG_CASE);sort($e,SORT_NATURAL|SORT_FLAG_CASE);if($a!==$e){$by['product_tag']=($by['product_tag']??0)+1;$all[]=['id'=>$id,'name'=>get_the_title($id),'type'=>'product_tag','actual'=>$a,'expected'=>$e];}$checked++;}
          $u=get_user_by('id',4509);$meta=[];foreach(['nickname','first_name','last_name','wcfmmp_profile_settings','wcfm_profile_settings','store_name']as$k){$meta[$k]=get_user_meta(4509,$k,true);}
          global$wpdb;$sup=$wpdb->prefix.'mdo_suppliers';$s=$wpdb->get_row($wpdb->prepare("SELECT id,code,name,vendor_user_id FROM {$sup} WHERE code=%s",'el-catedratico'),ARRAY_A);
          echo wp_json_encode(['siteurl'=>get_option('siteurl'),'checked'=>$checked,'mismatch_count'=>count($all),'by_type'=>$by,'mismatches'=>$all,'vendor_4509'=>$u?['display_name'=>$u->display_name,'login'=>$u->user_login,'meta'=>$meta]:null,'supplier'=>$s],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" "$map" --path="$path" --allow-root
          REMOTE

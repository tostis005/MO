name: Production English final verification 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-final-verification-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save puppeteer-core@24 >/dev/null
      - name: Verify visible English UI after final deployment
        shell: bash
        run: |
          set -euo pipefail
          cat > ./verify-en.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          const p=await browser.newPage();
          p.setDefaultTimeout(9000);
          await p.setRequestInterception(true);
          p.on('request',r=>['image','font','media','stylesheet'].includes(r.resourceType())?r.abort():r.continue());
          const base='https://www.elmercadodeorigen.com';
          const spanish=[/\bBuscar\b/i,/\bFiltros\b/i,/Filtrar productos/i,/Cerrar filtros/i,/Filtros activos/i,/Filtros aplicados/i,/Limpiar todo/i,/\bVISITAR\b/i,/\bVisitar\b/i,/TU SELECCIÓN/i,/Revisa tu carrito/i,/Comprueba cantidades y productos/i,/Pago protegido durante todo el proceso/i,/Información clara antes de confirmar/i,/Atención cercana si necesitas ayuda/i,/\bCarrito\b/i,/Finalizar compra/i,/Añadir al carrito/i,/Seleccionar opciones/i,/Mostrando/i,/Ordenar por/i,/Vendido por/i,/Sin existencias/i,/Valorado con/i,/Leer más/i,/Enviar a/i,/Enviará a/i,/Pedido mínimo/i,/te faltan/i,/Detalles de facturación/i,/Realizar el pedido/i,/^Categorías$/i,/^Vendedor$/i,/^Precio$/i,/^Recomendados$/i,/^Más populares$/i,/^Mejor valorados$/i,/^Más recientes$/i,/^Menor precio$/i,/^Mayor precio$/i];
          let failures=0;
          async function inspect(label,url,viewport={width:1365,height:900}){
            await p.setViewport(viewport);
            try{
              await p.goto(url+(url.includes('?')?'&':'?')+'en_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:12000});
              await new Promise(r=>setTimeout(r,700));
              const d=await p.evaluate(()=>({url:location.href,lang:document.documentElement.lang,text:(document.body?.innerText||'').replace(/\n{3,}/g,'\n\n').trim(),links:[...document.querySelectorAll('a[href]')].map(a=>({text:(a.innerText||'').trim(),href:a.href}))}));
              const lines=d.text.split('\n').map(s=>s.trim()).filter(Boolean);
              const hits=[...new Set(lines.filter(line=>spanish.some(re=>re.test(line))))];
              const ok=d.lang.toLowerCase().startsWith('en')&&hits.length===0;
              if(!ok) failures++;
              console.log(`${ok?'PASS':'FAIL'} ${label} | lang=${d.lang} | hits=${hits.length} | ${d.url}`); hits.forEach(x=>console.log('  HIT '+x));
              return {...d,hits};
            }catch(e){failures++;console.log(`FAIL ${label} | ${e.message}`);return {text:'',links:[],hits:['ERROR']};}
          }
          await inspect('HOME',base+'/en/');
          await inspect('SHOP DESKTOP',base+'/en/tienda/');
          const producers=await inspect('PRODUCERS',base+'/en/productores/');
          await inspect('ABOUT',base+'/en/quienes-somos/');
          await inspect('CONTACT',base+'/en/contacto/');
          await inspect('SHOP MOBILE',base+'/en/tienda/',{width:390,height:844});
          await inspect('PRODUCT',base+'/en/product/carne-picada-extra/');
          const vendor=[...new Set(producers.links.filter(x=>x.href?.startsWith(base+'/en/')&&/tolecarnes|hidalgo|1957|store|vendor|proveedor/i.test((x.href||'')+' '+(x.text||''))).map(x=>x.href.split('#')[0]))].filter(u=>!u.includes('/product/'))[0];
          if(vendor) await inspect('PRODUCER STORE',vendor,{width:390,height:844});
          await inspect('EMPTY CART',base+'/en/carrito/',{width:390,height:844});
          try{
            await p.setViewport({width:390,height:844});
            await p.goto(base+'/en/product/carne-picada-extra/?add_state='+Date.now(),{waitUntil:'domcontentloaded',timeout:12000});
            await new Promise(r=>setTimeout(r,650));
            const add=await p.$('form.cart button.single_add_to_cart_button,button.single_add_to_cart_button');
            if(!add) throw new Error('No add-to-cart button found');
            await add.click(); await new Promise(r=>setTimeout(r,1200));
          }catch(e){failures++;console.log('FAIL ADD PRODUCT | '+e.message);}
          const cart=await inspect('CART BELOW MINIMUM',base+'/en/carrito/',{width:390,height:844});
          if(!/Minimum order for Tolecarnes:/i.test(cart.text)){failures++;console.log('FAIL MINIMUM ORDER | English minimum-order notice not found');}
          await inspect('CHECKOUT BELOW MINIMUM',base+'/en/finalizar-compra/',{width:390,height:844});
          await browser.close(); console.log('FINAL_FAILURES='+failures); if(failures) process.exit(1);
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./verify-en.mjs

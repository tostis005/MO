name: Rollback Hustle now 0.10.263

# trigger-2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-hustle-now-010263.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file
        shell: bash
        run: |
          set -euo pipefail
          git show 64c13d96576deb1c690362466f1f31b552b4b99f:elmercadodeorigen-child/inc/performance.php > elmercadodeorigen-child/inc/performance.php
          php -l elmercadodeorigen-child/inc/performance.php
          sha256sum elmercadodeorigen-child/inc/performance.php > /tmp/local.sha
      - name: Deploy and verify checksum
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/performance.php "$STAGING_USER@$STAGING_HOST:/tmp/performance-rollback-now.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            install -m 0644 /tmp/performance-rollback-now.php \"\$THEME/inc/performance.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/performance.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            sha256sum \"\$THEME/inc/performance.php\" > /tmp/remote.sha
            rm -f /tmp/performance-rollback-now.php
          "
          local_sha=$(awk '{print $1}' /tmp/local.sha)
          remote_sha=$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "awk '{print \\$1}' /tmp/remote.sha")
          test "$local_sha" = "$remote_sha"
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          {
            echo 'deploy=success'
            echo "local_sha=$local_sha"
            echo "remote_sha=$remote_sha"
            echo 'rollback_source=64c13d96576deb1c690362466f1f31b552b4b99f'
          } > runtime/rollback-hustle-now-010263.txt
          cat runtime/rollback-hustle-now-010263.txt
      - name: Commit rollback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/rollback-hustle-now-010263.txt ] || printf 'deploy=%s\n' '${{ steps.deploy.outcome }}' > runtime/rollback-hustle-now-010263.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/performance.php runtime/rollback-hustle-now-010263.txt
          git commit -m 'Restore pre-Hustle Home performance state' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

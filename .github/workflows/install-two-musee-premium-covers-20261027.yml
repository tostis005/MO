name: Install first two approved Musee premium covers while keeping Mentta paused
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-two-musee-premium-covers-20261027.yml'
      - '.github/scripts/install-mentta-three-approved-premium-covers-20261027.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musee-premium-two-pack-hero-install
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact approved banners and deployment scripts
        run: |
          set -euo pipefail
          php -l .github/scripts/install-mentta-three-approved-premium-covers-20261027.php
          mkdir -p /tmp/musee-approved-headers
          for key in pasaporte safari; do
            test -s ".github/assets/musee-premium-banners/$key.jpg.base64"
            base64 -d ".github/assets/musee-premium-banners/$key.jpg.base64" >"/tmp/musee-approved-headers/$key.jpg"
            php -r '$x=getimagesize($argv[1]); if (!$x || $x[0]<500 || $x[1]<180) exit(12);' "/tmp/musee-approved-headers/$key.jpg"
            sha256sum "/tmp/musee-approved-headers/$key.jpg"
          done
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Secure installation with photos matched by product IDs and Mentta pause
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          ID="$GITHUB_RUN_ID"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "mkdir -p /tmp/musee-approved-headers-$ID"
          for key in pasaporte safari; do
            sshpass -e scp "${SCP[@]}" "/tmp/musee-approved-headers/$key.jpg" "$TARGET:/tmp/musee-approved-headers-$ID/$key.jpg"
          done
          sshpass -e scp "${SCP[@]}" .github/scripts/install-mentta-three-approved-premium-covers-20261027.php "$TARGET:/tmp/install-musee-approved-$ID.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$PROD_PATH' '$ID'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; RUN="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          export MDO_MUSEE_PREMIUM_HDR_DIR="/tmp/musee-approved-headers-$RUN"
          MDO_MUSEE_PREMIUM_KEYS=pasaporte-salvaje,safari-africano "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "/tmp/install-musee-approved-$RUN.php" --path="$SITE" --allow-root
          MDO_MUSEE_PREMIUM_KEYS=pasaporte-salvaje,safari-africano MDO_MUSEE_PREMIUM_APPLY=1 "$PHP_BIN" -d memory_limit=1024M "$WP_BIN" eval-file "/tmp/install-musee-approved-$RUN.php" --path="$SITE" --allow-root
          REMOTE
      - name: Confirm all three public product permalinks still return 404
        run: |
          set -euo pipefail
          for key in pasaporte-salvaje safari-africano; do
            code="$(curl -sSL -o /dev/null --connect-timeout 8 --max-time 40 -w '%{http_code}' "https://www.elmercadodeorigen.com/producto/pack-musee-mentta-$key/")"
            echo "PRIVATE $key HTTP $code"
            test "$code" = 404
          done
          echo "BOTH_DRAFT_PACK_COVERS_ARE_PRIVATE"

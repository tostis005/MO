name: Home CLS finalize 0.10.256 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cls-finalize-010256-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        run: php -l elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php
      - name: Deploy and clear Home cache
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php "$STAGING_USER@$STAGING_HOST:/tmp/elmercado-home-cls-010256.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            install -m 0644 /tmp/elmercado-home-cls-010256.php '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f /tmp/elmercado-home-cls-010256.php
          "
      - name: Verify first paint
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          HTML=$(mktemp)
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          grep -q 'elmercado-home-cls-010256' "$HTML"
          grep -q 'body.home .topbar{display:none!important;}' "$HTML"
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/verify.txt
          const {chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});const p=await b.newPage({viewport:{width:412,height:915}});await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:90000});const s=await p.evaluate(()=>{const q=x=>{const e=document.querySelector(x);if(!e)return null;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {display:c.display,y:r.y,height:r.height}};return {topbar:q('.topbar'),header:q('.site-header'),content:q('#content'),css:!!document.querySelector('#elmercado-home-cls-010256')};});console.log(JSON.stringify(s));await b.close();if(!s.css||!s.topbar||s.topbar.display!=='none'||s.topbar.height!==0||Math.abs(s.header.y-35)>1||Math.abs(s.content.y-95)>1)process.exit(12);})().catch(e=>{console.error(e);process.exit(13)});
          JS
          cat /tmp/verify.txt
          printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-cls-finalize-010256.txt
          cat /tmp/verify.txt >> runtime/home-cls-finalize-010256.txt
      - name: Record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-cls-finalize-010256.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-cls-finalize-010256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-cls-finalize-010256.txt
          git commit -m 'Record final Home CLS first-paint verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

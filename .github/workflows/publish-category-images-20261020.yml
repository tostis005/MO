name: Publish missing category images 20261020

on:
  push:
    branches: [main]
    paths:
      - '.github/assets/category-images-20261020/*.webp'
      - '.github/workflows/publish-category-images-20261020.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-category-images-20261020
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved category assets
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/assign-missing-category-images-20261020.php
          for asset in categoria-chocolates-artesanos-20261020.webp categoria-cafe-de-especialidad-20261020.webp categoria-huevos-20261020.webp; do
            file=".github/assets/category-images-20261020/$asset"
            test -s "$file"
            php -r '$m=getimagesize($argv[1]); if(!$m || $m["mime"]!=="image/webp" || $m[0]<250 || $m[1]<375){exit(1);}' "$file"
          done
      - name: Upload image assets and assign categories
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 22
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-category-images-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE/assets'"
          sshpass -e scp $SCP .github/assets/category-images-20261020/*.webp "$STAGING_USER@$STAGING_HOST:$REMOTE/assets/"
          sshpass -e scp $SCP .github/scripts/assign-missing-category-images-20261020.php "$STAGING_USER@$STAGING_HOST:$REMOTE/assign.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "EMDO_CATEGORY_IMAGES_DIR='$REMOTE/assets' '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/assign.php' --path='$PROD' --allow-root" > /tmp/category-publish-result.json
          jq -e '.batch=="category-images-20261020" and (.categories | length)==3' /tmp/category-publish-result.json
          for slug in chocolates-artesanos cafe-de-especialidad huevos; do
            URL="$(jq -r --arg slug "$slug" '.categories[$slug].image_url' /tmp/category-publish-result.json)"
            test -n "$URL"
            curl -fsSL --max-time 30 -o /dev/null "$URL"
          done
          curl -fsSL --max-time 60 'https://www.elmercadodeorigen.com/categorias/' -o /tmp/hub.html
          for slug in chocolates-artesanos cafe-de-especialidad huevos; do
            grep -Fq "data-category-slug=\"$slug\"" /tmp/hub.html
          done
          mkdir -p .deploy-status
          cp /tmp/category-publish-result.json .deploy-status/category-images-published-20261020.json
          jq '{batch,categories}' /tmp/category-publish-result.json
      - name: Record confirmed publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/category-images-published-20261020.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record published missing category images [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

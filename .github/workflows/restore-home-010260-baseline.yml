name: Restore Home 0.10.260 baseline

# trigger-20260819-1435
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-home-010260-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact pre-0.10.261 files
        shell: bash
        run: |
          set -euo pipefail
          BASE=47f17dfc67d36a8ca034f4b4b50ac2079b394188
          git show "$BASE:elmercadodeorigen-child/inc/cart-counter-visibility-final.php" > elmercadodeorigen-child/inc/cart-counter-visibility-final.php
          git show "$BASE:elmercadodeorigen-child/assets/css/critical-woostify-home.min.css" > elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
          git show 64c13d96576deb1c690362466f1f31b552b4b99f:elmercadodeorigen-child/inc/performance.php > elmercadodeorigen-child/inc/performance.php
          rm -f mu-plugins/mdo-home-fibosearch-lazy-010261.php
          php -l elmercadodeorigen-child/inc/cart-counter-visibility-final.php
          php -l elmercadodeorigen-child/inc/performance.php
          ! grep -q '★★★★★' elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
          grep -q "getComputedStyle(node, '::before')" elmercadodeorigen-child/inc/cart-counter-visibility-final.php
          test ! -e mu-plugins/mdo-home-fibosearch-lazy-010261.php

      - name: Deploy restored baseline
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/cart-counter-visibility-final.php "$STAGING_USER@$STAGING_HOST:/tmp/cart-counter-baseline.php"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/performance.php "$STAGING_USER@$STAGING_HOST:/tmp/performance-baseline.php"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/css/critical-woostify-home.min.css "$STAGING_USER@$STAGING_HOST:/tmp/critical-home-baseline.css"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            install -m 0644 /tmp/cart-counter-baseline.php \"\$THEME/inc/cart-counter-visibility-final.php\"
            install -m 0644 /tmp/performance-baseline.php \"\$THEME/inc/performance.php\"
            install -m 0644 /tmp/critical-home-baseline.css \"\$THEME/assets/css/critical-woostify-home.min.css\"
            rm -f '$PROD_PATH/wp-content/mu-plugins/mdo-home-fibosearch-lazy-010261.php'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/cart-counter-visibility-final.php\"
            \"\$php_bin\" -l \"\$THEME/inc/performance.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/cart-counter-baseline.php /tmp/performance-baseline.php /tmp/critical-home-baseline.css
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          {
            echo 'deploy=success'
            printf 'fibosearch_direct=%s\n' "$(grep -c 'id=\"jquery-dgwt-wcas-js\" src=' /tmp/home.html || true)"
            printf 'fibosearch_lazy_marker=%s\n' "$(grep -c 'mdo-home-fibosearch-lazy-010261' /tmp/home.html || true)"
            printf 'star_font_face=%s\n' "$(grep -c 'font-family:star;src:' /tmp/home.html || true)"
            printf 'native_star_marker=%s\n' "$(grep -c '★★★★★' /tmp/home.html || true)"
            printf 'cart_pseudo_read=%s\n' "$(grep -c \"getComputedStyle(node, '::before')\" /tmp/home.html || true)"
          } > runtime/restore-home-010260-baseline.txt
          cat runtime/restore-home-010260-baseline.txt

      - name: Measure three comparable Lighthouse runs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do
            npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/base-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          done
          python3 - <<'PY' >> runtime/restore-home-010260-baseline.txt
          import json, statistics
          rows=[]
          for i in (1,2,3):
              a=json.load(open(f'/tmp/base-{i}.json'))
              x=a['audits']
              row=(round(a['categories']['performance']['score']*100),x['first-contentful-paint']['numericValue'],x['largest-contentful-paint']['numericValue'],x['total-blocking-time']['numericValue'],x['cumulative-layout-shift']['numericValue'],x['speed-index']['numericValue'])
              rows.append(row)
              print('run',i,'score=%d fcp=%d lcp=%d tbt=%d cls=%.5f si=%d' % (row[0],row[1],row[2],row[3],row[4],row[5]))
          print('median_score=',statistics.median(r[0] for r in rows))
          print('median_fcp_ms=',round(statistics.median(r[1] for r in rows)))
          print('median_lcp_ms=',round(statistics.median(r[2] for r in rows)))
          print('median_tbt_ms=',round(statistics.median(r[3] for r in rows)))
          print('median_cls=',statistics.median(r[4] for r in rows))
          print('median_si_ms=',round(statistics.median(r[5] for r in rows)))
          PY
          cat runtime/restore-home-010260-baseline.txt

      - name: Commit restored baseline and verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/restore-home-010260-baseline.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/restore-home-010260-baseline.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A elmercadodeorigen-child/inc/cart-counter-visibility-final.php elmercadodeorigen-child/inc/performance.php elmercadodeorigen-child/assets/css/critical-woostify-home.min.css mu-plugins/mdo-home-fibosearch-lazy-010261.php runtime/restore-home-010260-baseline.txt
          git commit -m 'Restore Home 0.10.260 performance baseline' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

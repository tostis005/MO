name: Home final Lighthouse metrics 0.10.255

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-final-lighthouse-metrics-010255.yml'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure current Home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          HTML=$(mktemp)
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36 Chrome-Lighthouse'
          curl -fsS --compressed --max-time 45 -A "$UA" 'https://www.elmercadodeorigen.com/' -o "$HTML"
          python3 - "$HTML" <<'PY' > runtime/home-final-lighthouse-metrics-010255.txt
          import pathlib,re,sys,gzip
          html=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          raw=html.encode()
          head_end=html.lower().find('</head>')+7
          hero=html.find('En El Mercado de Origen buscamos productores')
          m=re.search(r'<style id="elmercado-home-first-view-css">(.*?)</style>',html,re.S)
          print('raw_bytes=',len(raw))
          print('gzip_bytes=',len(gzip.compress(raw,compresslevel=9)))
          print('head_bytes=',head_end)
          print('hero_pos=',hero)
          print('critical_css_bytes=',len(m.group(1).encode()) if m else -1)
          print('hustle_style=',html.find('hustle_inline_styles_front-inline-css'))
          print('hustle_popup=',html.find('hustle-popup-id-'))
          print('woostify_link=',html.find('/themes/woostify/style.css'))
          print('jquery_first_party=',html.find('www.elmercadodeorigen.com/wp-includes/js/jquery/jquery.min.js'))
          print('wp_hooks=',html.find('id="wp-hooks-js"'))
          print('gla_gtag=',html.find('google-listings-and-ads/js/build/gtag-events.js'))
          PY
      - name: Record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-final-lighthouse-metrics-010255.txt
          git commit -m 'Record final Home Lighthouse metrics' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

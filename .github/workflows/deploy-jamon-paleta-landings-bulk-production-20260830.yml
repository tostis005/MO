name: Deploy remaining ham and shoulder SEO landings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-jamon-paleta-landings-bulk-production-20260830.yml'
      - '.github/scripts/deploy-jamon-paleta-landings-bulk-production-20260830.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy curated landings to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
              esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-jp-landings-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            .github/scripts/deploy-jamon-paleta-landings-bulk-production-20260830.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/deploy-jamon-paleta-landings-bulk-production-20260830.php' --path='$PROD' --allow-root" > /tmp/emdo-jp-landings.json
          cat /tmp/emdo-jp-landings.json
          jq -e '.verified==true and .count==8 and (.pages|length)==8' /tmp/emdo-jp-landings.json >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          while IFS= read -r url; do
            code="$(curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO SEO landing verify' -o /tmp/page.html -w '%{http_code}' "${url}?verify=${GITHUB_RUN_ID}")"
            [ "$code" = "200" ] || { echo "HTTP $code for $url" >&2; exit 20; }
          done < <(jq -r '.pages[] | .es_url, .en_url' /tmp/emdo-jp-landings.json)
          SITEMAP=/tmp/english-sitemap.xml
          curl -LsS --retry 3 -A 'Mozilla/5.0 EMDO sitemap verify' -o "$SITEMAP" "https://www.elmercadodeorigen.com/english-sitemap.xml?verify=${GITHUB_RUN_ID}"
          while IFS= read -r url; do
            path="${url#https://www.elmercadodeorigen.com}"
            grep -Fq "$path" "$SITEMAP" || { echo "Missing from English sitemap: $path" >&2; exit 21; }
          done < <(jq -r '.pages[].en_url' /tmp/emdo-jp-landings.json)
          CAT=/tmp/jamones-paletas.html
          curl -LsS --retry 3 -A 'Mozilla/5.0 EMDO category verify' -o "$CAT" "https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/?verify=${GITHUB_RUN_ID}"
          for slug in paleta-bellota-100-iberica jamon-cebo-campo-iberico jamon-iberico-dop-los-pedroches paleta-iberica-dop-los-pedroches jamon-iberico-loncheado paleta-iberica-loncheada jamon-iberico-deshuesado jamon-paleta-ibericos-para-regalar; do
            grep -Fq "/$slug/" "$CAT" || { echo "Category link missing: $slug" >&2; exit 22; }
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
          echo 'bulk_landing_verification_ok'
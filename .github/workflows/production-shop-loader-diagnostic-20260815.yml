name: Repair production TranslatePress and verify Shop 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-shop-loader-diagnostic-20260815.yml']

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save puppeteer-core@24 >/dev/null
      - name: Repair TranslatePress and deploy DB-backed English bridge
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          REMOTE_DIR="/tmp/mdo-final-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-translatepress-gettext-init.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/gettext-init.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-native-translations.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/import.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-native-render-bridge.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/bridge.php"
          sshpass -e scp $SCP_OPTIONS .github/data/native-translations-20260815/*.json "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          siteurl=$(wp option get siteurl 2>/dev/null | tail -n1)
          echo "siteurl=$siteurl"
          printf '%s' "$siteurl" | grep -Eq '^https?://(www\.)?elmercadodeorigen\.com/?$'
          mkdir -p "$PROD_PATH/wp-content/mu-plugins"
          cp "$REMOTE_DIR/bridge.php" "$PROD_PATH/wp-content/mu-plugins/mdo-production-native-render-bridge.php"
          "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" eval-file "$REMOTE_DIR/gettext-init.php" --path="$PROD_PATH" --allow-root
          "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" eval-file "$REMOTE_DIR/import.php" --path="$PROD_PATH" --allow-root
          wp cache flush >/dev/null 2>&1 || true
          REMOTE
      - name: Seed English routes to register plugin and WooCommerce gettext strings
        shell: bash
        run: |
          set -euo pipefail
          for path in /en/ /en/tienda/ /en/productores/ /en/quienes-somos/ /en/contacto/ /en/blog/ /en/carrito/ /en/mi-cuenta/ /en/lista-de-deseos/ /en/producto/carne-picada-extra/ /en/producto/jamon-de-bellota-100-iberico/ /en/producto/aceite-de-oliva-virgen-extra-5l/; do
            code=$(curl -ksSL --max-time 45 -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' "https://www.elmercadodeorigen.com$path?mdo_repair_seed=${GITHUB_RUN_ID}" || true)
            echo "$code $path"
            test "$code" = 200
            ! grep -qi 'WordPress database error\|Fatal error\|Allowed memory size' /tmp/page.html
            ! grep -qi 'trp-floating-switcher' /tmp/page.html
          done
      - name: Persist newly registered gettext translations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          REMOTE_DIR="/tmp/mdo-final-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" eval-file "$REMOTE_DIR/import.php" --path="$PROD_PATH" --allow-root
          "$php_bin" -d display_errors=0 "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          rm -rf "$REMOTE_DIR"
          REMOTE
      - name: Verify English rendering and complete Shop loader
        shell: bash
        run: |
          set -euo pipefail
          cat > ./verify.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const b=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          async function pageCheck(url, forbidden=[]){
            const p=await b.newPage();
            const r=await p.goto(url+'?mdo_final_page='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            const d=await p.evaluate(()=>({lang:document.documentElement.lang,selector:!!document.querySelector('.trp-language-switcher,.trp-floater-ls,.mdo-language-switcher'),text:document.body?.innerText||''}));
            console.log('PAGE',url,'http',r.status(),'lang',d.lang,'selector',d.selector);
            if(r.status()!==200) throw new Error('HTTP '+r.status()+' '+url);
            if(d.selector) throw new Error('selector present '+url);
            for(const x of forbidden){if(d.text.includes(x)) throw new Error('Spanish remnant '+JSON.stringify(x)+' '+url);}
            await p.close();
          }
          await pageCheck('https://www.elmercadodeorigen.com/en/', ['Filtrar productos']);
          await pageCheck('https://www.elmercadodeorigen.com/en/blog/', ['Historias para elegir con más criterio.','Ideas, procesos y personas para entender qué hay detrás de un producto y por qué su origen importa.']);
          await pageCheck('https://www.elmercadodeorigen.com/en/producto/jamon-de-bellota-100-iberico/', ['Jamón procedente de un cerdo de pura raza ibérica','Envíos en 1-2 días hábiles']);
          await pageCheck('https://www.elmercadodeorigen.com/en/producto/aceite-de-oliva-virgen-extra-5l/', ['Gastos de envío incluidos','Gasto de envío incluido','Para una combinación a tu gusto de garrafas pincha aquí']);
          const p=await b.newPage(); p.setViewport({width:1440,height:900});
          const errs=[]; p.on('pageerror',e=>errs.push(e.message));
          const r=await p.goto('https://www.elmercadodeorigen.com/en/tienda/?mdo_repair_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
          if(r.status()!==200) throw new Error('Shop HTTP '+r.status());
          let s=await p.evaluate(()=>({products:document.querySelectorAll('ul.products > li.product').length,state:window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,loading:window.__emoCatalogLoaderState.loading}:null,selector:!!document.querySelector('.trp-language-switcher,.trp-floater-ls,.mdo-language-switcher'),text:(document.body.innerText||'').slice(0,120000),titles:[...document.querySelectorAll('ul.products > li.product .woocommerce-loop-product__title,ul.products > li.product h2,ul.products > li.product h3')].map(n=>n.textContent.trim())}));
          console.log('INITIAL',JSON.stringify({products:s.products,state:s.state,selector:s.selector}));
          if(s.selector) throw new Error('selector present');
          const end=Date.now()+50000;
          while(Date.now()<end && s.state && s.state.remaining>0){
            await p.evaluate(()=>document.querySelector('.emo-catalog-load-state')?.scrollIntoView({block:'center'}));
            await new Promise(r=>setTimeout(r,1700));
            s=await p.evaluate(()=>({products:document.querySelectorAll('ul.products > li.product').length,state:window.__emoCatalogLoaderState?{remaining:window.__emoCatalogLoaderState.remaining,loading:window.__emoCatalogLoaderState.loading}:null,selector:!!document.querySelector('.trp-language-switcher,.trp-floater-ls,.mdo-language-switcher'),text:(document.body.innerText||'').slice(0,120000),titles:[...document.querySelectorAll('ul.products > li.product .woocommerce-loop-product__title,ul.products > li.product h2,ul.products > li.product h3')].map(n=>n.textContent.trim())}));
            console.log('PROGRESS',JSON.stringify({products:s.products,state:s.state}));
          }
          console.log('FINAL',JSON.stringify({products:s.products,state:s.state,errs}));
          if(errs.length) throw new Error(errs.join(' | '));
          if(!s.state || s.state.remaining!==0) throw new Error('loader incomplete');
          if(s.products<50) throw new Error('too few products '+s.products);
          if(/Filtrar productos|Cargar más productos|Resultados y ordenación|Filtros aplicados/.test(s.text)) throw new Error('Spanish catalogue UI');
          const bad=s.titles.filter(x=>/^(Carne picada extra|Filetes primera|Chuletón de lomo alto|Magro o ragú de ternera|Jamón de bellota|Paleta de bellota|Aceite de oliva virgen extra)/i.test(x));
          if(bad.length) throw new Error('Spanish titles '+bad.slice(0,10).join(' | '));
          await p.close(); await b.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./verify.mjs

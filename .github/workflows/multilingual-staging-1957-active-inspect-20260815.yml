name: Inspect active 1957 products 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/multilingual-staging-1957-active-inspect-20260815.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Inspect vendor and catalog visibility
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$WP_PATH" --allow-root eval '
            $site=get_option("siteurl"); if(strpos((string)$site,"https://dev.elmercadodeorigen.com")!==0) exit(2);
            $u=get_userdata(3); echo "VENDOR\t3\t".$u->display_name."\t".$u->user_login."\n";
            $meta=get_user_meta(3); foreach($meta as $k=>$vals){ if(stripos($k,"store")!==false||stripos($k,"vendor")!==false||stripos($k,"wcfm")!==false){ echo "UMETA\t$k\t".substr(wp_json_encode($vals,JSON_UNESCAPED_UNICODE),0,1500)."\n"; }}
            $ids=get_posts(["post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"author"=>3,"fields"=>"ids","orderby"=>"ID","order"=>"ASC"]);
            foreach($ids as $id){ $p=wc_get_product($id); if(!$p)continue; $vis=$p->get_catalog_visibility(); $stock=$p->get_stock_status(); $price=$p->get_price(); $terms=wp_get_post_terms($id,"product_visibility",["fields"=>"names"]); echo implode("\t",[$id,get_the_title($id),$vis,$stock,$price,implode(",",$terms),get_permalink($id)])."\n"; }
          ' 2>/dev/null
          REMOTE

name: Finalize English storefront 2026-08-18 v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-english-storefront-20260818-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Persist translations and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"

          PROD_PATH="$($SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] && [ -n "$php_bin" ] || exit 11
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          COMMON="php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp);"
          SKIP='--skip-plugins=woo-discount-rules,woo-discount-rules-pro,woocommerce-checkout-manager'

          $SSH "$STAGING_USER@$STAGING_HOST" "$COMMON \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'if(function_exists(\"elmercado_seed_manual_english_ui_010245\")){elmercado_seed_manual_english_ui_010245(); echo \"SEEDED\";} else {exit(12);}' --path='$PROD_PATH' $SKIP --allow-root"

          DB_COPY="$($SSH "$STAGING_USER@$STAGING_HOST" "$COMMON \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" option get elmercado_en_ui_copy_010245 --format=json --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root")"
          grep -Fq 'Shop by category' <<< "$DB_COPY"
          grep -Fq 'Product categories' <<< "$DB_COPY"
          echo DB_TRANSLATIONS_OK

          TERM_DATA="$($SSH "$STAGING_USER@$STAGING_HOST" "$COMMON \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '\$terms=get_terms(array(\"taxonomy\"=>\"product_cat\",\"hide_empty\"=>true)); \$ok=0; foreach(\$terms as \$t){if(in_array(\$t->slug,array(\"mentta\",\"menta\"),true))continue; \$n=trim((string)get_term_meta(\$t->term_id,\"_en_US_name\",true)); \$p=(string)get_term_meta(\$t->term_id,\"_en_US_published\",true); if(\$p===\"1\"&&\$n!==\"\"){echo \$t->term_id.\"|\".\$n.PHP_EOL; \$ok++;}} if(!\$ok) exit(13);' --path='$PROD_PATH' --skip-plugins --allow-root")"
          test -n "$TERM_DATA"
          echo TERM_TRANSLATIONS_OK

          $SSH "$STAGING_USER@$STAGING_HOST" "$COMMON \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public English storefront
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 EMDO final verify'
          Q="emdo_verify=${GITHUB_RUN_ID}"
          fetch() { curl -fsSL --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 2 -A "$UA" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$1"; }
          HOME_HTML="$(fetch "https://www.elmercadodeorigen.com/en/?$Q")"
          SHOP_HTML="$(fetch "https://www.elmercadodeorigen.com/en/shop/?$Q")"
          CAT_HTML=''
          for u in "https://www.elmercadodeorigen.com/en/categories/?$Q" "https://www.elmercadodeorigen.com/en/categorias/?$Q"; do
            if out="$(fetch "$u" 2>/dev/null)"; then CAT_HTML="$out"; break; fi
          done
          test -n "$CAT_HTML"
          grep -Fq 'Shop by category' <<< "$HOME_HTML"
          grep -Fq 'Product categories' <<< "$CAT_HTML"
          ! grep -Fq 'new MutationObserver' <<< "$SHOP_HTML"
          ! grep -Fq 'createTreeWalker' <<< "$SHOP_HTML"
          for html in "$HOME_HTML" "$CAT_HTML"; do
            ! grep -Eiq 'data-category-slug=["'"'](mentta|menta)["'"']|/(categoria-producto|product-category)/(mentta|menta)/|>\s*(Mentta|Menta)\s*<' <<< "$html"
          done
          echo PUBLIC_ENGLISH_OK

      - name: Record success
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p runtime
          printf 'run_id=%s\nfinished_at=%s\nstatus=success\ntranslations_in_database=true\ndom_translation=false\nhome_categories_english=true\ncategories_page_english=true\nmentta_visible=false\n' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > runtime/english-storefront-final-20260818.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/english-storefront-final-20260818.txt
          git commit -m 'Record successful English storefront production verification'
          git push origin HEAD:main

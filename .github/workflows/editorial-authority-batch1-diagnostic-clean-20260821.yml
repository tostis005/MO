name: Editorial authority batch 1 diagnostic clean 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch1-diagnostic-clean-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute publisher and capture everything
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          mkdir -p .deploy-status
          : > /tmp/pubout.txt; : > /tmp/puberr.txt; : > /tmp/dbrows.txt; : > /tmp/dberr.txt
          echo 99 > /tmp/rootrc; echo 99 > /tmp/scp1; echo 99 > /tmp/scp2; echo 99 > /tmp/pubrc; echo 99 > /tmp/dbrc; : > /tmp/prodpath

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          ROOT_RC=$?
          echo "$ROOT_RC" > /tmp/rootrc
          printf '%s' "$PROD_PATH" > /tmp/prodpath

          if [ "$ROOT_RC" -eq 0 ] && [ -n "$PROD_PATH" ]; then
            PUB="/tmp/ab1-pub-${GITHUB_RUN_ID}.php"
            RUN="/tmp/ab1-run-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch1-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
            SCP1=$?; echo "$SCP1" > /tmp/scp1
            sshpass -e scp $SCP .github/scripts/run-editorial-publisher-bootstrap-20260821.php "$STAGING_USER@$STAGING_HOST:$RUN"
            SCP2=$?; echo "$SCP2" > /tmp/scp2

            if [ "$SCP1" -eq 0 ] && [ "$SCP2" -eq 0 ]; then
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); EMDO_WP_ROOT='$PROD_PATH' EMDO_PUBLISHER_FILE='$PUB' \"\$php_bin\" -d display_errors=0 -d error_reporting=1 '$RUN'" > /tmp/pubout.txt 2> /tmp/puberr.txt
              PUB_RC=$?; echo "$PUB_RC" > /tmp/pubrc
            fi

            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" db query \"SELECT pm.meta_value,p.ID,p.post_status,p.post_name FROM wp_posts p JOIN wp_postmeta pm ON pm.post_id=p.ID WHERE pm.meta_key='_emdo_authority_key' ORDER BY p.ID DESC LIMIT 10;\" --skip-column-names --path='$PROD_PATH' --allow-root" > /tmp/dbrows.txt 2> /tmp/dberr.txt
            DB_RC=$?; echo "$DB_RC" > /tmp/dbrc
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PUB' '$RUN'; wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" >/dev/null 2>&1
          fi

          python3 - <<'PY'
          import json,os
          def read(p,n=16000):
              try:return open(p,encoding='utf-8',errors='ignore').read()[-n:]
              except:return ''
          def num(p):
              try:return int(open(p).read().strip())
              except:return None
          out={
            'run_id':os.environ['GITHUB_RUN_ID'],
            'source_sha':os.environ['GITHUB_SHA'],
            'prod_path':read('/tmp/prodpath',2000).strip(),
            'root_rc':num('/tmp/rootrc'),'scp1':num('/tmp/scp1'),'scp2':num('/tmp/scp2'),
            'publisher_rc':num('/tmp/pubrc'),'db_rc':num('/tmp/dbrc'),
            'publisher_stdout':read('/tmp/pubout.txt'),'publisher_stderr':read('/tmp/puberr.txt'),
            'db_rows':read('/tmp/dbrows.txt'),'db_stderr':read('/tmp/dberr.txt')
          }
          json.dump(out,open('.deploy-status/editorial-authority-batch1-diagnostic-clean-20260821.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open('.deploy-status/editorial-authority-batch1-diagnostic-clean-20260821.json','a').write('\n')
          PY

      - name: Commit diagnostics
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p .deploy-status
          test -f .deploy-status/editorial-authority-batch1-diagnostic-clean-20260821.json || printf '{"run_id":"%s","source_sha":"%s","diagnostic_missing":true}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .deploy-status/editorial-authority-batch1-diagnostic-clean-20260821.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch1-diagnostic-clean-20260821.json
          git commit -m 'Record clean editorial authority batch 1 diagnostics [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

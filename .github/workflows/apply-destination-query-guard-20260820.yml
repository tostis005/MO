name: Apply destination query guard

on:
  push:
    branches: [feature/catalog-destination-frontend]
    paths: ['.github/workflows/apply-destination-query-guard-20260820.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/catalog-destination-frontend
          fetch-depth: 0
      - name: Apply shipping exclusions to the real catalogue query
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mu-plugins/mdo-catalog-destination-frontend-20260820.php')
          text = path.read_text()
          old = '''\t\tif ( self::$building_rank || is_admin() || ! self::is_catalog_query( $query ) ) {
          \t\t\treturn;
          \t\t}
          \t\tif ( isset( $_GET['orderby'] ) && '' !== sanitize_text_field( wp_unslash( $_GET['orderby'] ) ) ) { // phpcs:ignore WordPress.Security.NonceVerification.Recommended
          \t\t\treturn;
          \t\t}
          \t\tif ( ! class_exists( 'MDO_Catalog_Ranking' ) ) {
          \t\t\treturn;
          \t\t}

          \t\t$ranked = self::ranked_product_ids();'''
          new = '''\t\tif ( self::$building_rank || is_admin() || ! self::is_catalog_query( $query ) ) {
          \t\t\treturn;
          \t\t}

          \t\t/* El destino se aplica siempre, incluso si un administrador prueba el frontend o se usa otro orderby. */
          \t\t$shipping_excluded = self::excluded_vendor_ids();
          \t\tif ( $shipping_excluded ) {
          \t\t\t$current_excluded = array_values( array_filter( array_map( 'absint', (array) $query->get( 'author__not_in' ) ) ) );
          \t\t\t$query->set( 'author__not_in', array_values( array_unique( array_merge( $current_excluded, $shipping_excluded ) ) ) );
          \t\t}

          \t\tif ( isset( $_GET['orderby'] ) && '' !== sanitize_text_field( wp_unslash( $_GET['orderby'] ) ) ) { // phpcs:ignore WordPress.Security.NonceVerification.Recommended
          \t\t\treturn;
          \t\t}
          \t\tif ( ! class_exists( 'MDO_Catalog_Ranking' ) ) {
          \t\t\treturn;
          \t\t}

          \t\t$ranked = self::ranked_product_ids();'''
          if old not in text:
              raise SystemExit('Expected ranking entry block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
          php -l mu-plugins/mdo-catalog-destination-frontend-20260820.php
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-destination-query-guard-20260820.yml
          git add mu-plugins/mdo-catalog-destination-frontend-20260820.php
          git commit -m 'Apply destination exclusions to catalogue queries'
          git push origin HEAD:feature/catalog-destination-frontend

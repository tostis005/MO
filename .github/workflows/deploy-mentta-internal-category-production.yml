name: Deploy internal MENTTA category to production

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-internal-mentta-category.php'
      - '.github/workflows/deploy-mentta-internal-category-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate MU plugin
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-internal-mentta-category.php

      - name: Deploy category and public-hiding rule
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_TMP="/tmp/mdo-internal-mentta-category-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-internal-mentta-category.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            wp_bin=\$(command -v wp)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)

            mkdir -p '$PROD_PATH/wp-content/mu-plugins'
            cp '$REMOTE_TMP' '$PROD_PATH/wp-content/mu-plugins/mdo-internal-mentta-category.php'
            rm -f '$REMOTE_TMP'
            \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-internal-mentta-category.php'

            TERM_ID=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" term get product_cat mentta --by=slug --field=term_id --path='$PROD_PATH' --allow-root 2>/dev/null || true)
            if [ -z \"\$TERM_ID\" ]; then
              TERM_ID=\$(\"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" term create product_cat MENTTA --slug=mentta --description='Categoría interna para seleccionar los productos que se sincronizan con MENTTA. No visible en la tienda.' --porcelain --path='$PROD_PATH' --allow-root)
            else
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" term update product_cat \"\$TERM_ID\" --name=MENTTA --slug=mentta --description='Categoría interna para seleccionar los productos que se sincronizan con MENTTA. No visible en la tienda.' --path='$PROD_PATH' --allow-root >/dev/null
            fi

            echo \"MENTTA term ID: \$TERM_ID\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true

            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'echo get_term_by("slug", "mentta", "product_cat") instanceof WP_Term ? "category_ok\\n" : "category_missing\\n";' --path='$PROD_PATH' --allow-root
          "

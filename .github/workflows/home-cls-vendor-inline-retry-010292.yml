name: Home vendor CSS inline retry 010292

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cls-vendor-inline-retry-010292.yml'

permissions:
  contents: write

concurrency:
  group: home-selective-structural-css-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend proven parent-inline rule
        run: |
          set -euo pipefail
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/home-cache-parent-only-010292.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          old='''\t\t\tif ( str_contains( $matches[0], 'id="woostify-parent-style-inline-css"' ) || str_contains( $matches[0], "id='woostify-parent-style-inline-css'" ) ) {\n\t\t\t\treturn $matches[0];\n\t\t\t}'''
          new='''\t\t\tforeach ( array( 'woostify-parent-style-inline-css', 'elmercado-home-vendors-010244', 'elmercado-home-visibility-polish-010245', 'elmercado-home-critical-010254' ) as $first_view_style_id ) {\n\t\t\t\tif ( str_contains( $matches[0], 'id="' . $first_view_style_id . '"' ) || str_contains( $matches[0], "id='" . $first_view_style_id . "'" ) ) {\n\t\t\t\t\treturn $matches[0];\n\t\t\t\t}\n\t\t\t}'''
          if old not in s: raise SystemExit('proven parent-inline condition missing')
          p.write_text(s.replace(old,new,1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
      - name: Deploy only tested cache pipeline
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done')"
          : "${PROD:?}"; echo "$PROD" >/tmp/prod-010292
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-010292-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; install -m0644 /tmp/home-cache-010292-${GITHUB_RUN_ID}.php '$PROD/wp-content/themes/elmercadodeorigen-child/inc/home-cache.php'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/home-cache-010292-${GITHUB_RUN_ID}.php"
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-010292.html
          for id in woostify-parent-style-inline-css elmercado-home-vendors-010244 elmercado-home-visibility-polish-010245 elmercado-home-critical-010254; do grep -q "$id" /tmp/home-010292.html; done
      - name: Lighthouse desktop 3x
        id: measure
        run: |
          set -euo pipefail; mkdir -p runtime
          for i in 1 2 3; do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/lhr292-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'; done
          python3 - <<'PY' | tee runtime/home-cls-vendor-inline-retry-010292.txt
          import json,statistics
          rows=[]
          for i in range(1,4):
              r=json.load(open(f'/tmp/lhr292-{i}.json')); a=r['audits']; x={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']}; rows.append(x); print('run',i,x)
              for q in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:6]: n=q.get('node') or {}; print(' shift',q.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(z[k] for z in rows) for k in rows[0]}
          for k,v in med.items(): print('median_'+k+'=',v)
          keep=med['cls']<0.02 and med['lcp']<5500 and med['fcp']<3200 and med['tbt']<1400
          print('keep=',str(keep).lower()); open('/tmp/keep292','w').write('1' if keep else '0')
          PY
      - name: Keep or revert
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep292 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then
            cp /tmp/home-cache-parent-only-010292.php elmercadodeorigen-child/inc/home-cache.php
            PROD=$(cat /tmp/prod-010292); PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
            sshpass -e scp $SCP /tmp/home-cache-parent-only-010292.php "$STAGING_USER@$STAGING_HOST:/tmp/revert-cache-010292-${GITHUB_RUN_ID}.php"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 /tmp/revert-cache-010292-${GITHUB_RUN_ID}.php '$PROD/wp-content/themes/elmercadodeorigen-child/inc/home-cache.php'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/revert-cache-010292-${GITHUB_RUN_ID}.php"
          fi
          mkdir -p runtime; [ -f runtime/home-cls-vendor-inline-retry-010292.txt ] || echo failed > runtime/home-cls-vendor-inline-retry-010292.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add elmercadodeorigen-child/inc/home-cache.php runtime/home-cls-vendor-inline-retry-010292.txt; git commit -m 'Measure Home final vendor CSS in first view' || exit 0; git pull --rebase origin main; git push origin HEAD:main

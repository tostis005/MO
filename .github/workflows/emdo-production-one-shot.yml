name: EMDO one-shot production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-production-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: emdo-production-one-shot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin locally
        shell: bash
        run: |
          set -euo pipefail
          test -f mdo-supplier-sync/mdo-supplier-sync.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q "El proveedor no tiene un usuario vendedor válido asignado" mdo-supplier-sync/includes/class-mdo-woo-importer.php
          ! grep -q "in_array( 'wcfm_vendor'" mdo-supplier-sync/includes/class-mdo-woo-importer.php

      - name: Install deployment tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rsync sshpass curl

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage plugin on server
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/emdo-prod-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/"

      - name: Deploy safely to production and smoke test
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"
          dev_path=""
          case "$raw" in */wp-content/*) dev_path="${raw%%/wp-content/*}" ;; */wp-content) dev_path="$(dirname "$raw")" ;; *) dev_path="$raw" ;; esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve staging root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$prod_path/wp-config.php" ] || { echo "Production wp-config not found at $prod_path" >&2; exit 1; }
          [ -d "$prod_path/wp-content/plugins" ] || exit 1

          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -x "$php_bin" ] && [ -n "$wp_bin" ] || { echo 'PHP/WP-CLI unavailable.' >&2; exit 1; }

          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod_path" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing deployment: unexpected production siteurl=$siteurl" >&2; exit 1 ;; esac
          smoke_base="${siteurl%/}"

          find "$incoming" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/tmp/emdo-prod-lint.log
          target="$prod_path/wp-content/plugins/mdo-supplier-sync"
          backup="$prod_path/wp-content/plugins/.mdo-supplier-sync.backup-${commit}"
          swapped=0
          rollback() {
            code=$?
            if [ "$swapped" -eq 1 ] && [ "$code" -ne 0 ]; then
              echo 'Deployment failed; rolling back EMDO plugin.' >&2
              rm -rf "$target"
              [ ! -d "$backup" ] || mv "$backup" "$target"
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          rm -rf "$backup"
          if [ -d "$target" ]; then mv "$target" "$backup"; fi
          mv "$incoming" "$target"
          swapped=1

          "$php_bin" -d memory_limit=512M "$wp_bin" plugin activate mdo-supplier-sync --path="$prod_path" --allow-root >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$prod_path" --allow-root
          grep -q "El proveedor no tiene un usuario vendedor válido asignado" "$target/includes/class-mdo-woo-importer.php"
          ! grep -q "in_array( 'wcfm_vendor'" "$target/includes/class-mdo-woo-importer.php"

          home="$(curl -ksS -o /tmp/emdo-prod-home -w '%{http_code}' --max-time 25 "$smoke_base/" || true)"
          shop="$(curl -ksS -o /tmp/emdo-prod-shop -w '%{http_code}' --max-time 25 "$smoke_base/tienda/" || true)"
          case "$home" in 2*|3*) ;; *) echo "Production home HTTP $home" >&2; exit 1 ;; esac
          case "$shop" in 2*|3*) ;; *) echo "Production shop HTTP $shop" >&2; exit 1 ;; esac

          echo "PRODUCTION_PATH=$prod_path"
          echo "SITEURL=$siteurl"
          echo "HTTP_HOME=$home"
          echo "HTTP_SHOP=$shop"
          echo "DEPLOYED_COMMIT=$commit"
          echo 'VENDOR_VALIDATION=existing-wordpress-user-only'

          swapped=0
          rm -rf "$backup"
          trap - EXIT HUP INT TERM
          REMOTE

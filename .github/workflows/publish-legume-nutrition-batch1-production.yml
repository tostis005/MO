name: Publish legume nutrition batch 1 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-legume-nutrition-batch1-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and recover publication payload
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-legume-nutrition-batch1-production.php
          php -l elmercadodeorigen-child/inc/blog-legume-nutrition-seed-010267.php
          for part in 1 2 3 4; do
            test -s "elmercadodeorigen-child/inc/content-seeds/legume-nutrition-010267-${part}.b64"
          done
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          root = Path('elmercadodeorigen-child/inc/content-seeds')
          paths = [root / f'legume-nutrition-010267-{part}.b64' for part in range(1, 5)]
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in paths)
          markers = [
              b'a:5:{',
              'Qué nutrientes aportan las legumbres'.encode('utf-8'),
              'Garbanzos, lentejas o alubias'.encode('utf-8'),
              b'en_title',
              b'en_content',
          ]

          def unpack(candidate):
              try:
                  compressed = base64.b64decode(candidate, validate=True)
                  data = gzip.decompress(compressed)
              except Exception:
                  return None
              return data if all(marker in data for marker in markers) else None

          recovered = encoded if unpack(encoded) is not None else None
          recovered_at = None
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          if recovered is None:
              search_ranges = [range(7000, min(14000, len(encoded) + 1)), range(0, len(encoded) + 1)]
              checked_positions = set()
              for positions in search_ranges:
                  for pos in positions:
                      if pos in checked_positions:
                          continue
                      checked_positions.add(pos)
                      prefix = encoded[:pos]
                      suffix = encoded[pos:]
                      for char in alphabet:
                          candidate = prefix + char + suffix
                          if unpack(candidate) is not None:
                              recovered = candidate
                              recovered_at = pos
                              break
                      if recovered is not None:
                          break
                  if recovered is not None:
                      break

          if recovered is None:
              raise SystemExit('Could not recover the missing Base64 character safely.')

          chunks = [recovered[i:i + 7000] for i in range(0, len(recovered), 7000)]
          if len(chunks) != 4 or len(recovered) % 4 != 0 or unpack(recovered) is None:
              raise SystemExit('Recovered payload failed final integrity validation.')
          for path, chunk in zip(paths, chunks):
              path.write_text(chunk, encoding='utf-8')

          detail = 'already valid' if recovered_at is None else f'recovered missing character at offset {recovered_at}'
          print(f'Editorial payload integrity OK: {detail}; {len(recovered)} Base64 characters.')
          PY

      - name: Publish with preflight, rollback and postflight verification
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          UA="Mozilla/5.0 EMDO safe legume publication verification"
          TARGET_SLUGS=(
            'que-nutrientes-aportan-legumbres-proteinas-fibra-hierro-vitaminas-minerales'
            'que-legumbre-tiene-mas-proteina-comparativa-legumbres-espana'
            'que-legumbre-tiene-mas-hierro-comparativa-legumbres-espana'
            'que-legumbre-tiene-mas-fibra-comparativa-nutricional'
            'garbanzos-lentejas-alubias-cual-es-mas-nutritiva'
          )
          CRITICAL_URLS=(
            'https://www.elmercadodeorigen.com/'
            'https://www.elmercadodeorigen.com/tienda/'
            'https://www.elmercadodeorigen.com/blog/'
            'https://www.elmercadodeorigen.com/category/legumbres/'
          )

          health_check() {
            local phase="$1"
            shift
            for url in "$@"; do
              local file code bytes
              file="/tmp/health-${phase}-$(echo "$url" | tr '/:?&=' '_').html"
              code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$file" -w '%{http_code}' "${url}?emdo_health=${GITHUB_RUN_ID}-${phase}")"
              [ "$code" = "200" ] || { echo "Health ${phase}: HTTP ${code} for ${url}" >&2; return 1; }
              bytes="$(wc -c < "$file")"
              [ "$bytes" -gt 5000 ] || { echo "Health ${phase}: suspiciously small response (${bytes} bytes) for ${url}" >&2; return 1; }
              grep -qi '</html>' "$file" || { echo "Health ${phase}: incomplete HTML for ${url}" >&2; return 1; }
              echo "health_ok phase=${phase} http=${code} bytes=${bytes} url=${url}"
            done
          }

          health_check pre "${CRITICAL_URLS[@]}"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
              esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"

          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-legume-safe-${GITHUB_RUN_ID}"

          for slug in "${TARGET_SLUGS[@]}"; do
            ids="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post list --path='$PROD' --allow-root --post_type=post --name='$slug' --format=ids 2>/dev/null || true")"
            [ -z "${ids// /}" ] || { echo "Safety stop: production slug already exists: ${slug} (${ids})" >&2; exit 10; }
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE/content-seeds'"
          sshpass -e scp $SCP \
            .github/scripts/publish-legume-nutrition-batch1-production.php \
            elmercadodeorigen-child/inc/blog-legume-nutrition-seed-010267.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          sshpass -e scp $SCP \
            elmercadodeorigen-child/inc/content-seeds/legume-nutrition-010267-1.b64 \
            elmercadodeorigen-child/inc/content-seeds/legume-nutrition-010267-2.b64 \
            elmercadodeorigen-child/inc/content-seeds/legume-nutrition-010267-3.b64 \
            elmercadodeorigen-child/inc/content-seeds/legume-nutrition-010267-4.b64 \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/content-seeds/"

          ROLLBACK_ACTIVE=1
          rollback_only_new_posts() {
            rc=$?
            if [ "${ROLLBACK_ACTIVE:-0}" = "1" ]; then
              echo "Verification failed: rolling back only the five new target posts." >&2
              set +e
              for slug in "${TARGET_SLUGS[@]}"; do
                ids="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post list --path='$PROD' --allow-root --post_type=post --name='$slug' --format=ids 2>/dev/null || true")"
                if [ -n "${ids// /}" ]; then
                  echo "rollback_delete slug=${slug} ids=${ids}" >&2
                  sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post delete $ids --force --path='$PROD' --allow-root >/dev/null 2>&1 || true"
                fi
              done
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' rewrite flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" >/dev/null 2>&1
              health_check rollback "${CRITICAL_URLS[@]}" || true
              set -e
            fi
            exit "$rc"
          }
          trap rollback_only_new_posts ERR

          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export EMDO_LEGUME_SEED_DIR='$REMOTE'; export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/publish-legume-nutrition-batch1-production.php' --path='$PROD' --allow-root" > /tmp/legume-batch1.raw 2> /tmp/legume-batch1.err
          PUBLISH_RC=$?
          set -e

          echo "publisher_rc=${PUBLISH_RC} stdout_bytes=$(wc -c < /tmp/legume-batch1.raw) stderr_bytes=$(wc -c < /tmp/legume-batch1.err)"
          if [ -s /tmp/legume-batch1.err ]; then
            echo '--- publisher stderr ---' >&2
            cat /tmp/legume-batch1.err >&2 || true
            echo '--- end publisher stderr ---' >&2
          fi
          if [ -s /tmp/legume-batch1.raw ]; then
            echo '--- publisher stdout ---'
            cat /tmp/legume-batch1.raw || true
            echo '--- end publisher stdout ---'
          fi

          if [ "$PUBLISH_RC" -ne 0 ]; then
            false
          fi

          JSON_LINE="$(grep -E '^\{.*\}$' /tmp/legume-batch1.raw | tail -n 1 || true)"
          if [ -z "$JSON_LINE" ]; then
            echo 'Publisher returned success but emitted no parseable JSON result.' >&2
            false
          fi
          printf '%s\n' "$JSON_LINE" > /tmp/legume-batch1.json
          jq -e '.verified == true and .count == 5 and (.errors | length) == 0 and (.posts | length) == 5' /tmp/legume-batch1.json >/dev/null

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          while IFS=$'\t' read -r slug en_slug title en_title permalink en_permalink; do
            es_file="/tmp/post-${slug}.html"
            en_file="/tmp/post-${en_slug}.html"

            es_code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$es_file" -w '%{http_code}' "${permalink}?emdo_verify=${GITHUB_RUN_ID}")"
            [ "$es_code" = "200" ]
            [ "$(wc -c < "$es_file")" -gt 5000 ]
            grep -qi '</html>' "$es_file"
            grep -Fq "$title" "$es_file"

            en_code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$en_file" -w '%{http_code}' "${en_permalink}?emdo_verify=${GITHUB_RUN_ID}")"
            [ "$en_code" = "200" ]
            [ "$(wc -c < "$en_file")" -gt 5000 ]
            grep -qi '</html>' "$en_file"
            grep -Fq "$en_title" "$en_file"
            echo "post_ok es=${permalink} en=${en_permalink}"
          done < <(jq -r '.posts[] | [.slug,.en_slug,.title,.en_title,.permalink,.en_permalink] | @tsv' /tmp/legume-batch1.json)

          curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/category/legumbres/?emdo_verify=${GITHUB_RUN_ID}" -o /tmp/legumbres-category.html
          curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/blog/?emdo_verify=${GITHUB_RUN_ID}" -o /tmp/blog.html
          while IFS= read -r slug; do
            grep -Fq "$slug" /tmp/legumbres-category.html
            grep -Fq "$slug" /tmp/blog.html
          done < <(jq -r '.posts[].slug' /tmp/legume-batch1.json)

          health_check post "${CRITICAL_URLS[@]}"

          ROLLBACK_ACTIVE=0
          trap - ERR
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          echo "SAFE_PUBLICATION_OK: 5 Spanish posts + 5 English translations; home, shop, blog and Legumbres healthy before and after; no rollback needed."

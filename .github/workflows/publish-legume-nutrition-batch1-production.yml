name: Publish legume nutrition batch 1 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-legume-nutrition-batch1-production.yml'
      - '.github/scripts/export-legume-batch1-from-staging.php'
      - '.github/scripts/import-legume-batch1-to-production.php'
      - '.github/scripts/rollback-legume-batch1-production.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate safe publication scripts
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/export-legume-batch1-from-staging.php
          php -l .github/scripts/import-legume-batch1-to-production.php
          php -l .github/scripts/rollback-legume-batch1-production.php

      - name: Export staging, publish only posts, verify site health, rollback on failure
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          UA="Mozilla/5.0 EMDO safe legume publication verification"

          health_check() {
            local phase="$1"
            shift
            for url in "$@"; do
              local safe code bytes
              safe="$(echo "$url" | tr '/:?&=' '_')"
              code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "/tmp/health-${phase}-${safe}.html" -w '%{http_code}' "${url}?emdo_health=${GITHUB_RUN_ID}-${phase}")"
              [ "$code" = "200" ] || { echo "Health check ${phase} failed HTTP ${code}: ${url}" >&2; return 1; }
              bytes="$(wc -c < "/tmp/health-${phase}-${safe}.html")"
              [ "$bytes" -gt 5000 ] || { echo "Health check ${phase} returned suspiciously small HTML (${bytes} bytes): ${url}" >&2; return 1; }
              grep -qi '</html>' "/tmp/health-${phase}-${safe}.html" || { echo "Health check ${phase} missing closing HTML: ${url}" >&2; return 1; }
              echo "health_ok phase=${phase} http=${code} bytes=${bytes} url=${url}"
            done
          }

          CRITICAL=(
            'https://www.elmercadodeorigen.com/'
            'https://www.elmercadodeorigen.com/tienda/'
            'https://www.elmercadodeorigen.com/blog/'
            'https://www.elmercadodeorigen.com/category/legumbres/'
          )

          # No se toca producción si la web no está sana antes de empezar.
          health_check pre "${CRITICAL[@]}"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            stage=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p" ;;
                https://dev.elmercadodeorigen.com|http://dev.elmercadodeorigen.com) stage="$p" ;;
              esac
            done
            [ -n "$prod" ] || exit 4
            [ -n "$stage" ] || exit 5
            printf "%s|%s|%s|%s" "$prod" "$stage" "$php" "$wp"
          ')"

          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          STAGE="${REST%%|*}"
          REST="${REST#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE="/tmp/emdo-legume-safe-${GITHUB_RUN_ID}"
          EXPORT_JSON="$REMOTE/export.json"
          ROLLBACK_JSON="$REMOTE/rollback.json"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/export-legume-batch1-from-staging.php \
            .github/scripts/import-legume-batch1-to-production.php \
            .github/scripts/rollback-legume-batch1-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          # Exporta exactamente el contenido ya validado visualmente en staging.
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/export-legume-batch1-from-staging.php' --path='$STAGE' --allow-root" > /tmp/stage-export.raw 2> /tmp/stage-export.err
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            cat /tmp/stage-export.err >&2 || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
            exit "$RC"
          fi
          tail -n 1 /tmp/stage-export.raw > /tmp/stage-export.json
          jq -e '.verified == true and .count == 5 and (.articles | length) == 5' /tmp/stage-export.json >/dev/null
          jq -e 'all(.articles[]; (.title|length)>20 and (.slug|length)>20 and (.content|length)>1000 and (.en_title|length)>20 and (.en_slug|length)>20 and (.en_content|length)>1000)' /tmp/stage-export.json >/dev/null
          sshpass -e scp $SCP /tmp/stage-export.json "$STAGING_USER@$STAGING_HOST:$EXPORT_JSON"

          # La única escritura en producción: cinco posts. El importador se autorrevierte si falla a mitad.
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export EMDO_LEGUME_JSON='$EXPORT_JSON'; export EMDO_LEGUME_ROLLBACK='$ROLLBACK_JSON'; export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/import-legume-batch1-to-production.php' --path='$PROD' --allow-root" > /tmp/prod-import.raw 2> /tmp/prod-import.err
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            cat /tmp/prod-import.err >&2 || true
            cat /tmp/prod-import.raw >&2 || true
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
            exit "$RC"
          fi
          tail -n 1 /tmp/prod-import.raw > /tmp/prod-import.json
          jq -e '.verified == true and .count == 5 and (.posts | length) == 5' /tmp/prod-import.json >/dev/null

          ROLLBACK_ACTIVE=1
          rollback_if_needed() {
            rc=$?
            if [ "${ROLLBACK_ACTIVE:-0}" = "1" ]; then
              echo "Post-publication verification failed. Rolling back only the five new posts..." >&2
              set +e
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export EMDO_LEGUME_ROLLBACK='$ROLLBACK_JSON'; export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' eval-file '$REMOTE/rollback-legume-batch1-production.php' --path='$PROD' --allow-root" >&2
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true" >/dev/null 2>&1
              set -e
            fi
            exit "$rc"
          }
          trap rollback_if_needed ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          # Comprueba las diez URLs, y que el título correcto aparece en cada idioma.
          while IFS=$'\t' read -r slug en_slug title en_title permalink en_permalink; do
            es_file="/tmp/post-${slug}.html"
            en_file="/tmp/post-${en_slug}.html"
            es_code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$es_file" -w '%{http_code}' "${permalink}?emdo_verify=${GITHUB_RUN_ID}")"
            [ "$es_code" = "200" ]
            grep -Fq "$title" "$es_file"
            grep -qi '</html>' "$es_file"
            [ "$(wc -c < "$es_file")" -gt 5000 ]

            en_code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$en_file" -w '%{http_code}' "${en_permalink}?emdo_verify=${GITHUB_RUN_ID}")"
            [ "$en_code" = "200" ]
            grep -Fq "$en_title" "$en_file"
            grep -qi '</html>' "$en_file"
            [ "$(wc -c < "$en_file")" -gt 5000 ]
            echo "post_ok es=${permalink} en=${en_permalink}"
          done < <(jq -r '.posts[] | [.slug,.en_slug,.title,.en_title,.permalink,.en_permalink] | @tsv' /tmp/prod-import.json)

          # Comprueba que el blog y la categoría ya enlazan las cinco entradas.
          curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/category/legumbres/?emdo_verify=${GITHUB_RUN_ID}" -o /tmp/legumbres.html
          curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/blog/?emdo_verify=${GITHUB_RUN_ID}" -o /tmp/blog.html
          while IFS= read -r slug; do
            grep -Fq "$slug" /tmp/legumbres.html
            grep -Fq "$slug" /tmp/blog.html
          done < <(jq -r '.posts[].slug' /tmp/prod-import.json)

          # Comprueba de nuevo páginas críticas después de la publicación.
          health_check post "${CRITICAL[@]}"

          ROLLBACK_ACTIVE=0
          trap - ERR
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          echo "SAFE_PUBLICATION_OK: 5 ES posts + 5 EN translations; critical pages healthy before and after; rollback was not needed."

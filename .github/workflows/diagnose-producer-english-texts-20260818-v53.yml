name: Diagnose producer English texts v53

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-producer-english-texts-20260818-v53.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Marker
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/producer-en-v53.txt
          git add runtime/producer-en-v53.txt
          git commit -m 'Start producer English text diagnostic v53'
          git push origin HEAD:main
      - name: Inspect database and public pages
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf '%s' "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set +e
            out=/tmp/producer-en-v53-report.txt
            : > "$out"
            echo "=== PUBLIC ABOUT PAGES ===" >> "$out"
            for slug in 1957 hidalgo-de-la-jara tolecarnes puente-robles el-catedratico; do
              url="https://www.elmercadodeorigen.com/en/store/$slug/about/"
              rm -f /tmp/h53 /tmp/b53
              code=$(curl -k -L --max-redirs 5 -sS --connect-timeout 8 --max-time 40 -D /tmp/h53 -o /tmp/b53 -w "%{http_code}" "$url")
              rc=$?
              redirects=$(grep -ic "^location:" /tmp/h53 2>/dev/null || true)
              policies=$(grep -oiE ">[[:space:]]*(Policies|Store Policies)[[:space:]]*<|Políticas de la tienda" /tmp/b53 2>/dev/null | wc -l | tr -d " ")
              spanish=$(grep -oiE "La historia de|Los ganaderos|Su explotación|Desde Fermoselle|El cerdo ibérico|Tres generaciones|Cinco generaciones" /tmp/b53 2>/dev/null | wc -l | tr -d " ")
              english=$(grep -oiE "The story of|deeply connected|linked to cattle farming|From Fermoselle|acorn-fed Iberian|three generations|five generations" /tmp/b53 2>/dev/null | wc -l | tr -d " ")
              echo "slug=$slug rc=$rc code=$code redirects=$redirects english_hits=$english spanish_hits=$spanish policies=$policies bytes=$(wc -c </tmp/b53 2>/dev/null || echo 0)" >> "$out"
              python3 - /tmp/b53 "$slug" >> "$out" <<'PY'
import html,re,sys
p=sys.argv[1]; slug=sys.argv[2]
try: s=open(p,errors='ignore').read()
except: s=''
s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.I|re.S)
s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S)
s=re.sub(r'<[^>]+>',' ',s)
s=html.unescape(s)
s=re.sub(r'\s+',' ',s).strip()
markers=['The story of','deeply connected to the Iberian pig','linked to cattle farming since','From Fermoselle','grew out of a family experience','La historia de','Los ganaderos que integran']
pos=min([s.lower().find(m.lower()) for m in markers if s.lower().find(m.lower())>=0] or [0])
print('sample_'+slug+'='+s[pos:pos+700])
PY
            done
            echo "=== DB ENGLISH META ===" >> "$out"
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            "$php_bin" -d memory_limit=768M "$wp_bin" eval '
              foreach(array("1957","hidalgo-de-la-jara","tolecarnes","puente-robles","el-catedratico") as $slug){
                $u=get_user_by("slug",$slug);
                $en=$u?(string)get_user_meta($u->ID,"_mdo_en_store_description",true):"";
                echo "db slug=$slug user=".($u?$u->ID:0)." chars=".mb_strlen(trim(wp_strip_all_tags($en)))." start=".mb_substr(trim(preg_replace("/\\s+/u"," ",wp_strip_all_tags($en))),0,220).PHP_EOL;
              }
            ' --path='"$PROD_PATH"' --allow-root >> "$out" 2>&1
            echo "=== PAGE SLUG CANDIDATES ===" >> "$out"
            "$php_bin" -d memory_limit=768M "$wp_bin" eval '
              global $wpdb;
              foreach($wpdb->get_results("SELECT p.ID,p.post_title,p.post_name,MAX(CASE WHEN pm.meta_key=\"_en_US_post_title\" THEN pm.meta_value END) en_title,MAX(CASE WHEN pm.meta_key=\"_en_US_post_name\" THEN pm.meta_value END) en_slug FROM {$wpdb->posts} p LEFT JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key IN(\"_en_US_post_title\",\"_en_US_post_name\") WHERE p.post_type=\"page\" AND p.post_status=\"publish\" GROUP BY p.ID ORDER BY p.ID",ARRAY_A) as $r){ if(stripos($r["post_title"],"productor")!==false || stripos((string)$r["en_title"],"producer")!==false){ echo wp_json_encode($r,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL; }}
            ' --path='"$PROD_PATH"' --allow-root >> "$out" 2>&1
            cat "$out"
          ' > runtime/producer-en-diagnostic-v53.txt 2>&1
      - name: Commit report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=complete\n' "$GITHUB_RUN_ID" > runtime/producer-en-v53.txt
          git add runtime/producer-en-v53.txt runtime/producer-en-diagnostic-v53.txt
          git commit -m 'Record producer English text diagnostic v53' || true
          git pull --rebase origin main
          git push origin HEAD:main

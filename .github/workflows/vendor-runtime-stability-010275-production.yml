name: Vendor ordering 0.10.276 and runtime production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-runtime-stability-010275-production.yml'
      - 'elmercadodeorigen-child/mu-plugins/elmercado-vendor-catalog-controls-010270.php'
      - 'elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-popover-010272.php'
      - 'elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-native-retire-010274.php'
      - 'elmercadodeorigen-child/mu-plugins/elmercado-vendor-runtime-stability-010275.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-test-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and install tools
        run: |
          set -euo pipefail
          for f in \
            elmercadodeorigen-child/mu-plugins/elmercado-vendor-catalog-controls-010270.php \
            elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-popover-010272.php \
            elmercadodeorigen-child/mu-plugins/elmercado-vendor-ordering-native-retire-010274.php \
            elmercadodeorigen-child/mu-plugins/elmercado-vendor-runtime-stability-010275.php; do
            php -l "$f" >/dev/null
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy consolidated vendor controls
        id: deploy
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          MU_DIR="$PROD_PATH/wp-content/mu-plugins"
          FILES=(
            elmercado-vendor-catalog-controls-010270.php
            elmercado-vendor-ordering-popover-010272.php
            elmercado-vendor-ordering-native-retire-010274.php
            elmercado-vendor-runtime-stability-010275.php
          )
          for name in "${FILES[@]}"; do
            local_path="elmercadodeorigen-child/mu-plugins/$name"
            remote="/tmp/${name%.php}-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP_OPTIONS "$local_path" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$remote' >/dev/null; mkdir -p '$MU_DIR'; install -m 0644 '$remote' '$MU_DIR/$name'; rm -f '$remote'"
          done

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); if [ -n \"\$wp_bin\" ]; then \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if (function_exists(\"rocket_clean_domain\")) { rocket_clean_domain(); } if (has_action(\"litespeed_purge_all\")) { do_action(\"litespeed_purge_all\"); } if (function_exists(\"wp_cache_clear_cache\")) { wp_cache_clear_cache(); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; fi"

          PROBE="elmercado-opcache-vendor-order-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          curl -fsSL --max-time 30 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID" >/dev/null || true
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" || true

          # Warm the canonical URL after purge so the normal cached page contains the new code.
          curl -fsSL --max-time 45 -H 'Cache-Control: no-cache' "$BASE_URL/tienda/1957/" >/tmp/vendor-canonical.html
          grep -q 'mdoSheet010276' /tmp/vendor-canonical.html

      - name: Verify mobile ordering bottom sheet on canonical URL
        id: ordering
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node <<'NODE' > /tmp/vendor-ordering-010276.json 2>&1
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=(m,d)=>{throw new Error(m+' '+JSON.stringify(d));};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await browser.newPage();
            await p.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:3});
            await p.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1');
            await p.goto(`${process.env.BASE_URL}/tienda/1957/`,{waitUntil:'networkidle2',timeout:60000});
            await p.waitForSelector('.mdo-vendor-order-button',{visible:true,timeout:30000});
            await sleep(1800);
            const before=await p.evaluate(()=>{
              const b=document.querySelector('.mdo-vendor-order-button');
              const s=document.querySelector('.emo-catalog-toolbar-shared-010229 .woocommerce-ordering select');
              const r=b.getBoundingClientRect(), ss=getComputedStyle(s), hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
              return {button:{left:r.left,top:r.top,width:r.width,height:r.height,text:b.textContent.trim()},native:{opacity:ss.opacity,visibility:ss.visibility,pointer:ss.pointerEvents,aria:s.getAttribute('aria-hidden'),marker:s.dataset.mdoSheet010276||''},hitButton:hit===b||b.contains(hit)};
            });
            if(before.native.marker!=='1'||before.native.opacity!=='0'||before.native.visibility!=='hidden'||before.native.pointer!=='none'||before.native.aria!=='true') fail('new ordering owner not active',before);
            if(!before.hitButton) fail('button is not tappable target',before);

            await p.touchscreen.tap(before.button.left+before.button.width/2,before.button.top+before.button.height/2);
            await sleep(300);
            const opened=await p.evaluate(()=>{
              const sh=document.querySelector('.mdo-vendor-order-sheet:not([hidden])');
              if(!sh)return null;
              const panel=sh.querySelector('.mdo-vendor-order-sheet__panel');
              const sr=sh.getBoundingClientRect(), pr=panel.getBoundingClientRect();
              const cs=getComputedStyle(sh);
              const current=sh.querySelector('.mdo-vendor-order-option[aria-current="true"]');
              const other=[...sh.querySelectorAll('.mdo-vendor-order-option')].find(x=>x!==current);
              if(!other)return null;
              const or=other.getBoundingClientRect();
              return {sheet:{left:sr.left,top:sr.top,right:sr.right,bottom:sr.bottom,width:sr.width,height:sr.height,display:cs.display,visibility:cs.visibility,pointer:cs.pointerEvents},panel:{top:pr.top,bottom:pr.bottom,height:pr.height},target:{value:other.dataset.value,left:or.left,top:or.top,width:or.width,height:or.height},viewport:{width:innerWidth,height:innerHeight,visualHeight:visualViewport?.height||null}};
            });
            if(!opened) fail('bottom sheet did not open',before);
            if(opened.sheet.display==='none'||opened.sheet.visibility!=='visible'||opened.sheet.pointer==='none') fail('bottom sheet not visible',opened);
            if(opened.panel.bottom>opened.viewport.height+2||opened.panel.top<0) fail('bottom sheet panel outside viewport',opened);
            if(opened.target.top<0||opened.target.top+opened.target.height>opened.viewport.height+2) fail('ordering option outside viewport',opened);

            const old=p.url();
            await p.touchscreen.tap(opened.target.left+opened.target.width/2,opened.target.top+opened.target.height/2);
            await p.waitForFunction((oldUrl,val)=>location.href!==oldUrl && new URL(location.href).searchParams.get('orderby')===val,{timeout:12000},old,opened.target.value).catch(()=>{});
            await sleep(500);
            const newUrl=p.url();
            if(newUrl===old||new URL(newUrl).searchParams.get('orderby')!==opened.target.value) fail('ordering option did not navigate',{old,newUrl,opened});
            console.log(JSON.stringify({ok:true,before,opened,old,newUrl}));
            await browser.close();
          })().catch(e=>{console.error(JSON.stringify({ok:false,error:String(e.stack||e)}));process.exit(1)});
          NODE
          cat /tmp/vendor-ordering-010276.json

      - name: Verify continuous vendor product loading
        id: loading
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node <<'NODE' > /tmp/vendor-loading-010276.json 2>&1
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const candidates=['tolecarnes','la-huerta-de-ana-mary','hidalgo-de-la-jara','1957'];
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await browser.newPage(); await p.setCacheEnabled(false); await p.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
            let chosen=null, snapshot=null;
            for(const slug of candidates){
              await p.goto(`${process.env.BASE_URL}/tienda/${slug}/?runtime-load=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000}).catch(()=>{}); await sleep(1200);
              snapshot=await p.evaluate(()=>({count:document.querySelectorAll('#wcfmmp-store ul.products > li.product').length,next:window.__emoCatalogLoaderState?.nextUrl||'',marker:!!window.__mdoVendorFetchNoStore010275}));
              if(snapshot.next){chosen=slug;break;}
            }
            if(!chosen) throw new Error('No vendor with next page '+JSON.stringify(snapshot));
            const before=snapshot.count;
            await p.evaluate(()=>document.querySelector('.emo-catalog-load-state')?.scrollIntoView({block:'center'}));
            const started=Date.now(); let after=before, debug=null;
            while(Date.now()-started<22000){await sleep(500);const now=await p.evaluate(()=>({count:document.querySelectorAll('#wcfmmp-store ul.products > li.product').length,debug:window.__emoCatalogLoaderState||null}));after=now.count;debug=now.debug;if(after>before)break;}
            if(after<=before) throw new Error('Vendor loader did not append products '+JSON.stringify({chosen,before,after,debug}));
            console.log(JSON.stringify({ok:true,chosen,before,after,debug})); await browser.close();
          })().catch(e=>{console.error(JSON.stringify({ok:false,error:String(e.stack||e)}));process.exit(1)});
          NODE
          cat /tmp/vendor-loading-010276.json

      - name: Record verification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          ORDERING_RESULT: ${{ steps.ordering.outcome }}
          LOADING_RESULT: ${{ steps.loading.outcome }}
        run: |
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os,pathlib
          def read(path):
              p=pathlib.Path(path)
              return p.read_text(errors='replace')[-12000:] if p.exists() else ''
          out={'status':os.getenv('JOB_STATUS'),'run_id':os.getenv('GITHUB_RUN_ID'),'sha':os.getenv('GITHUB_SHA'),'deploy':os.getenv('DEPLOY_RESULT'),'ordering':os.getenv('ORDERING_RESULT'),'loading':os.getenv('LOADING_RESULT'),'ordering_payload':read('/tmp/vendor-ordering-010276.json'),'loading_payload':read('/tmp/vendor-loading-010276.json')}
          pathlib.Path('.deploy-status/vendor-runtime-stability-010275-production.json').write_text(json.dumps(out,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/vendor-runtime-stability-010275-production.json
          git commit -m "Record vendor ordering 0.10.276 verification $GITHUB_RUN_ID" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Diagnose Home browser runtime 20260819

# image-runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-home-browser-runtime-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect live browser runtime
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > runtime/diagnose-home-browser-runtime-20260819.txt
          const puppeteer = require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle2',timeout:60000});
            const state=await page.evaluate(()=>{
              const all=[...document.querySelectorAll('.hustle-ui')];
              const styles=[...document.querySelectorAll('style')].filter(s=>(s.id||'').includes('hustle')||(s.textContent||'').includes('.hustle-ui')).map(s=>({id:s.id,bytes:(s.textContent||'').length}));
              const scripts=[...document.scripts].map(s=>s.src).filter(src=>/hustle/i.test(src));
              const images=[...document.images].filter(img=>img.matches('.attachment-woocommerce_thumbnail,.emo-home-vendor-responsive-image,.metodosPago')).map(img=>{
                const r=img.getBoundingClientRect();
                return {class:img.className,alt:img.alt,src:img.src,currentSrc:img.currentSrc,srcset:img.getAttribute('srcset'),dataSrc:img.getAttribute('data-src'),dataSrcset:img.getAttribute('data-srcset'),sizes:img.getAttribute('sizes'),widthAttr:img.getAttribute('width'),heightAttr:img.getAttribute('height'),naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,displayWidth:Math.round(r.width),displayHeight:Math.round(r.height),loading:img.loading};
              });
              return {hustle_nodes:all.length,styles,scripts,images};
            });
            console.log(JSON.stringify(state,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat runtime/diagnose-home-browser-runtime-20260819.txt
      - name: Record diagnostic
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/diagnose-home-browser-runtime-20260819.txt
          git commit -m 'Record Home browser runtime diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

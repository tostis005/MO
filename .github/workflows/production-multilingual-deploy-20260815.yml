name: Deploy production bilingual structure 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-multilingual-deploy-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed data and deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/data/native-translations-20260815/*.json; do python -m json.tool "$f" >/dev/null; done
          php -l .github/scripts/mdo-production-native-translations.php
          php -l .github/scripts/mdo-production-bilingual-config.php
          php -l .github/scripts/mdo-production-native-render-bridge.php
          php -l .github/scripts/mdo-production-oil-cleanup.php
          python -m py_compile .github/scripts/mdo-staging-fix-english-shop-observers.py
          python - <<'PY'
          import glob,json
          merged={}
          for f in glob.glob('.github/data/native-translations-20260815/*.json'):
              merged.update(json.load(open(f)))
          assert len(merged) > 1000, len(merged)
          required=['Carne picada extra','Jamón de bellota 100% Ibérico (brida negra)','Nuestra historia comienza en 2014, cuando empezamos a especializarnos en la administración de fincas agrícolas.','Filtros aplicados']
          for x in required: assert x in merged, x
          print('reviewed unique translations',len(merged))
          PY
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Backup production and deploy native bilingual structure
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          REMOTE_DIR="/tmp/mdo-production-multilingual-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR/maps' '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-native-translations.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/maps/import.php"
          sshpass -e scp $SCP_OPTIONS .github/data/native-translations-20260815/*.json "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/maps/"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-bilingual-config.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/config.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-oil-cleanup.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/oil-cleanup.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-staging-fix-english-shop-observers.py "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/fix-shop.py"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-native-render-bridge.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-production-native-render-bridge.php"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' REMOTE_DIR='$REMOTE_DIR' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp() { "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          siteurl="$(wp option get siteurl --skip-plugins --skip-themes 2>/dev/null | tail -n1)"
          case "$siteurl" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ;; *) echo "REFUSING NON-PRODUCTION $siteurl" >&2; exit 2;; esac

          backup_dir="$(dirname "$PROD_PATH")/mdo-backups"
          mkdir -p "$backup_dir"
          backup="$backup_dir/pre-multilingual-${RUN_ID}.sql"
          wp db export "$backup" --add-drop-table
          test -s "$backup"
          echo "Database backup: $backup"

          if ! wp plugin is-installed translatepress-multilingual; then
            wp plugin install translatepress-multilingual --version=3.3.2 --activate || wp plugin install translatepress-multilingual --activate
          else
            wp plugin activate translatepress-multilingual || true
          fi
          version="$(wp plugin get translatepress-multilingual --field=version)"
          echo "TranslatePress version: $version"

          wp eval-file "$REMOTE_DIR/config.php"
          wp eval-file "$REMOTE_DIR/oil-cleanup.php"

          python3 "$REMOTE_DIR/fix-shop.py" "$PROD_PATH/wp-content/themes"
          for name in catalog-query-parity-010224.php catalog-mobile-controls-polish-010237.php catalog-filter-scroll-final-010234.php; do
            f="$(find "$PROD_PATH/wp-content/themes" -type f -name "$name" -print -quit)"; test -n "$f"; "$php_bin" -l "$f"
          done

          wp eval-file "$REMOTE_DIR/maps/import.php"
          wp rewrite flush --hard >/dev/null 2>&1 || wp rewrite flush >/dev/null 2>&1 || true
          wp cache flush >/dev/null 2>&1 || true
          REMOTE
      - name: Seed English rendering then synchronize native gettext
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          base=https://www.elmercadodeorigen.com
          for path in /en/ /en/tienda/ /en/productores/ /en/contacto/ /en/quienes-somos/ /en/politica/ /en/politica-de-privacidad/ /en/politica-de-cookies/ /en/carrito/ /en/finalizar-compra/ /en/mi-cuenta/; do
            code=$(curl -LsS --max-time 60 -o /tmp/seed.html -w '%{http_code}' "$base$path?mdo_seed=${GITHUB_RUN_ID}")
            echo "$code $path"; test "$code" = 200
          done
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" eval-file "/tmp/mdo-production-multilingual-${RUN_ID}/maps/import.php" --path="$PROD_PATH" --allow-root
          "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          REMOTE
      - name: Verify structure, hidden selector and oil cleanup
        shell: bash
        run: |
          set -euo pipefail
          base=https://www.elmercadodeorigen.com
          for path in /en/ /en/tienda/ /en/productores/ /en/contacto/ /en/quienes-somos/ /en/politica/ /en/politica-de-privacidad/ /en/politica-de-cookies/; do
            code=$(curl -LsS --max-time 60 -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' "$base$path?mdo_verify=${GITHUB_RUN_ID}")
            echo "$code $path"; test "$code" = 200
            ! grep -qi 'WordPress database error' /tmp/page.html
            ! grep -qi 'mdo-language-switcher' /tmp/page.html
            ! grep -qi 'trp-floater-ls' /tmp/page.html
          done
          curl -LsS --max-time 60 -H 'Cache-Control: no-cache' "$base/en/?mdo_verify=${GITHUB_RUN_ID}" -o /tmp/home.html
          grep -qi 'Find what you' /tmp/home.html
          grep -qi 'Our customers' /tmp/home.html
          curl -LsS --max-time 60 -H 'Cache-Control: no-cache' "$base/en/quienes-somos/?mdo_verify=${GITHUB_RUN_ID}" -o /tmp/about.html
          grep -qi 'Our story began in 2014' /tmp/about.html
          curl -LsS --max-time 60 -H 'Cache-Control: no-cache' "$base/en/producto/aceite-de-oliva-virgen-extra-5l/?mdo_verify=${GITHUB_RUN_ID}" -o /tmp/oil.html
          ! grep -qi 'Gasto de envío incluido\|Gastos de envío incluidos\|PARA UNA COMBINACIÓN A TU GUSTO DE GARRAFAS' /tmp/oil.html
          grep -qi 'Extra virgin olive oil' /tmp/oil.html
      - name: Install browser probe
        run: npm install --no-save puppeteer-core@24 >/dev/null
      - name: Verify English Shop is responsive with JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/shop.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']});
          const page=await browser.newPage(); page.setDefaultTimeout(12000); let errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          const t=Date.now(); await page.goto('https://www.elmercadodeorigen.com/en/tienda/',{waitUntil:'domcontentloaded',timeout:30000});
          console.log('EN shop DCL ms',Date.now()-t);
          let s=await Promise.race([page.evaluate(()=>({ready:document.readyState,count:(document.body.innerText||'').match(/\b\d+ results\b/i)?.[0]||'',products:document.querySelectorAll('ul.products > li.product').length,title:document.title})),new Promise((_,r)=>setTimeout(()=>r(new Error('main thread blocked')),5000))]);
          console.log('initial',JSON.stringify(s));
          await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight)); await new Promise(r=>setTimeout(r,5000));
          s=await Promise.race([page.evaluate(()=>({ready:document.readyState,products:document.querySelectorAll('ul.products > li.product').length,title:document.title,body:(document.body.innerText||'').slice(0,12000)})),new Promise((_,r)=>setTimeout(()=>r(new Error('main thread blocked after scroll')),5000))]);
          console.log('after scroll',JSON.stringify({ready:s.ready,products:s.products,title:s.title}),'errors',errors.length);
          if(errors.length) throw new Error(errors.join(' | '));
          if(/Filtrar productos|Cargar más productos|Resultados y ordenación/.test(s.body)) throw new Error('Spanish custom catalog UI remains visible');
          await browser.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node /tmp/shop.mjs
      - name: Verify Spanish production remains healthy
        shell: bash
        run: |
          set -euo pipefail
          for path in / /tienda/ /productores/ /contacto/ /quienes-somos/; do
            code=$(curl -LsS --max-time 60 -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com$path?mdo_es=${GITHUB_RUN_ID}")
            echo "$code $path"; test "$code" = 200
          done

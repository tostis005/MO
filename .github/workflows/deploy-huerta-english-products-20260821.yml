name: Deploy Huerta complete English storefront fix 20260821

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-huerta-english-products-20260821.php'
      - '.github/workflows/deploy-huerta-english-products-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-huerta-english-products-20260821
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: php -l mu-plugins/mdo-huerta-english-products-20260821.php

      - name: Prepare SSH and locate production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "PORT=$PORT" >> "$GITHUB_ENV"

      - name: Deploy Huerta English MU plugin
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-huerta-english-products-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-huerta-english-products-20260821.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-huerta-english-products-20260821.php'; wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Export Huerta English production data
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          cat > /tmp/mdo-huerta-en-live-audit.php <<'PHP'
          <?php
          global $wpdb;
          $source_table = class_exists('MDO_Database') ? MDO_Database::table('source_products') : $wpdb->prefix . 'mdo_source_products';
          $rows = $wpdb->get_results("SELECT DISTINCT p.ID,p.post_author,p.post_title,p.post_name FROM {$wpdb->posts} p INNER JOIN {$source_table} src ON src.wc_product_id=p.ID AND src.source_url LIKE '%lahuertadeanamary.com%' WHERE p.post_type='product' AND p.post_status='publish' ORDER BY p.ID ASC");
          $out=['count'=>0,'complete'=>0,'vendors'=>[],'products'=>[],'issues'=>[]];
          foreach((array)$rows as $p){
            $id=(int)$p->ID;
            $out['count']++;
            $u=get_userdata((int)$p->post_author);
            $vendor=$u instanceof WP_User ? (string)$u->user_nicename : '';
            if($vendor!=='') $out['vendors'][$vendor]=($out['vendors'][$vendor]??0)+1;
            $title=trim(wp_strip_all_tags((string)get_post_meta($id,'_en_US_post_title',true)));
            $slug=sanitize_title((string)get_post_meta($id,'_en_US_post_name',true));
            $content=(string)get_post_meta($id,'_en_US_post_content',true);
            $excerpt=(string)get_post_meta($id,'_en_US_post_excerpt',true);
            $published=(string)get_post_meta($id,'_en_US_published',true);
            $plain=trim(preg_replace('/\s+/u',' ',html_entity_decode(wp_strip_all_tags($content),ENT_QUOTES|ENT_HTML5,'UTF-8')));
            $signature=function_exists('mb_substr')?mb_substr($plain,0,90):substr($plain,0,90);
            $ok=$published==='1' && $title!=='' && $slug!=='' && $plain!=='';
            if($ok){$out['complete']++;}else{$out['issues'][]=['id'=>$id,'published'=>$published,'title'=>$title!==''?'yes':'no','slug'=>$slug!==''?'yes':'no','content'=>$plain!==''?'yes':'no'];}
            $out['products'][]=['id'=>$id,'vendor'=>$vendor,'native_title'=>(string)$p->post_title,'native_slug'=>(string)$p->post_name,'english_title'=>$title,'english_slug'=>$slug,'content_signature'=>$signature,'excerpt_present'=>trim(wp_strip_all_tags($excerpt))!==''];
          }
          echo wp_json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT),"\n";
          if($out['count']!==46 || $out['complete']!==46 || count($out['vendors'])!==1) exit(2);
          PHP
          REMOTE="/tmp/mdo-huerta-en-live-audit-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP /tmp/mdo-huerta-en-live-audit.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > runtime/huerta-english-storefront-data-20260821.json
          python3 -m json.tool runtime/huerta-english-storefront-data-20260821.json >/dev/null

      - name: Verify 46 English product pages and vendor storefront
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, pathlib, re, subprocess, time
          data=json.load(open('runtime/huerta-english-storefront-data-20260821.json',encoding='utf-8'))
          base='https://www.elmercadodeorigen.com'
          vendor=next(iter(data['vendors']))
          stamp=str(int(time.time()))
          def fetch(url):
              p=subprocess.run(['curl','-k','-L','-sS','--connect-timeout','8','--max-time','30','-H','Cache-Control: no-cache','-o','/tmp/mdo-page.html','-w','%{http_code}|%{url_effective}',url],capture_output=True,text=True)
              body=pathlib.Path('/tmp/mdo-page.html').read_text(errors='ignore') if pathlib.Path('/tmp/mdo-page.html').exists() else ''
              bits=p.stdout.strip().split('|',1)
              return int(bits[0] or 0), (bits[1] if len(bits)>1 else ''), body
          def text(body):
              body=re.sub(r'<script\b.*?</script>',' ',body,flags=re.I|re.S)
              body=re.sub(r'<style\b.*?</style>',' ',body,flags=re.I|re.S)
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',body))).strip()
          product_results=[]
          for row in data['products']:
              url=f"{base}/en/product/{row['english_slug']}/?mdo_huerta_en={stamp}"
              code,effective,body=fetch(url)
              plain=text(body)
              sig=(row['content_signature'] or '').strip()
              product_results.append({'id':row['id'],'url':url,'http_code':code,'effective_url':effective,'title_ok':row['english_title'].casefold() in plain.casefold(),'content_ok':(not sig) or sig[:55].casefold() in plain.casefold()})
          store_url=f"{base}/en/store/{vendor}/?mdo_huerta_en_store={stamp}"
          store_code,store_effective,store_body=fetch(store_url)
          store_plain=text(store_body)
          english_link_hits=sum(1 for r in data['products'] if f"/en/product/{r['english_slug']}/" in store_body)
          english_title_hits=sum(1 for r in data['products'] if r['english_title'] and r['english_title'].casefold() in store_plain.casefold())
          native_link_hits=0
          for r in data['products']:
              if r['english_slug'] != r['native_slug']:
                  for wrong in (f"/producto/{r['native_slug']}/",f"/en/producto/{r['native_slug']}/",f"/product/{r['native_slug']}/"):
                      native_link_hits += store_body.count(wrong)
          bad=[r for r in product_results if r['http_code']!=200 or '/en/product/' not in r['effective_url'] or not r['title_ok'] or not r['content_ok']]
          report={'data_count':data['count'],'data_complete':data['complete'],'vendor':vendor,'store':{'url':store_url,'http_code':store_code,'effective_url':store_effective,'english_link_hits':english_link_hits,'english_title_hits':english_title_hits,'native_link_hits':native_link_hits},'products_verified':len(product_results),'bad_products':bad}
          pathlib.Path('runtime/huerta-english-storefront-live-20260821.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if store_code!=200 or '/en/store/' not in store_effective or english_link_hits<1 or english_title_hits<1 or native_link_hits>0 or bad:
              raise SystemExit(2)
          PY

      - name: Record production verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add runtime/huerta-english-storefront-data-20260821.json runtime/huerta-english-storefront-live-20260821.json || true
          git commit -m 'Record Huerta complete English storefront verification [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main

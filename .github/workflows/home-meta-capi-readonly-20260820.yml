name: Home Meta CAPI read-only 20260820
# Re-run after Home Performance Hardening v1.4.2 deployment.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-meta-capi-readonly-20260820.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' >/tmp/meta.json
          const puppeteer=require('puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const p=await b.newPage();await p.setViewport({width:412,height:915});const urls=[];p.on('request',r=>urls.push(r.url()));await p.goto('https://www.elmercadodeorigen.com/',{waitUntil:'load',timeout:60000});await new Promise(r=>setTimeout(r,8000));console.log(JSON.stringify({capi:urls.filter(u=>u.includes('clientParamBuilder')||u.includes('unpkg.com'))}));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 - <<'PY' | tee runtime/home-meta-capi-readonly-20260820.txt
          import json
          s=open('/tmp/home.html',encoding='utf-8',errors='ignore').read();d=json.load(open('/tmp/meta.json'))
          print('delay_12000=', 'setTimeout(load, 12000)' in s)
          print('capi_requests=',d['capi'])
          PY
      - if: always()
        run: |
          [ -f runtime/home-meta-capi-readonly-20260820.txt ]||echo failed>runtime/home-meta-capi-readonly-20260820.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add runtime/home-meta-capi-readonly-20260820.txt;git commit -m 'Record fast Meta helper read-only check' || exit 0;git pull --rebase origin main;git push origin HEAD:main

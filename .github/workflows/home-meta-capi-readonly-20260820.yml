name: Home Meta CAPI read-only 20260820
on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-meta-capi-readonly-20260820.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=mobile --output=json --output-path=/tmp/lh.json --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          python3 - <<'PY' | tee runtime/home-meta-capi-readonly-20260820.txt
          import json
          s=open('/tmp/home.html',encoding='utf-8',errors='ignore').read();r=json.load(open('/tmp/lh.json'));a=r['audits']
          print('delay_12000=', 'setTimeout(load, 12000)' in s)
          urls=[x.get('url','') for x in ((a.get('network-requests',{}).get('details') or {}).get('items') or [])]
          print('capi_requests=',[u for u in urls if 'clientParamBuilder' in u or 'unpkg.com' in u])
          print('score=',round(r['categories']['performance']['score']*100),'fcp=',round(a['first-contentful-paint']['numericValue']),'lcp=',round(a['largest-contentful-paint']['numericValue']),'tbt=',round(a['total-blocking-time']['numericValue']),'cls=',a['cumulative-layout-shift']['numericValue'])
          print('legacy=',[(x.get('url'),x.get('wastedBytes')) for x in ((a.get('legacy-javascript',{}).get('details') or {}).get('items') or [])])
          PY
      - if: always()
        run: |
          [ -f runtime/home-meta-capi-readonly-20260820.txt ]||echo failed>runtime/home-meta-capi-readonly-20260820.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add runtime/home-meta-capi-readonly-20260820.txt;git commit -m 'Record delayed Home Meta helper read-only check' || exit 0;git pull --rebase origin main;git push origin HEAD:main

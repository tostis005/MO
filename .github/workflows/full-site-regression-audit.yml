name: Full site regression audit

# Audit refresh for deployed 0.10.6 header and storefront verification.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-site-regression-audit.yml'
      - 'elmercadodeorigen-child/**'

permissions:
  contents: read

concurrency:
  group: full-site-regression-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Audit public pages and commerce journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-site-audit
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > audit.cjs <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          const base='https://dev.elmercadodeorigen.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const desktop={width:1440,height:1100};
          const mobile={width:390,height:844,isMobile:true,deviceScaleFactor:1};
          const staticPaths={home:'/',shop:'/tienda/',blog:'/blog/',producers:'/productores/',contact:'/contacto/',about:'/quienes-somos/',account:'/mi-cuenta/',cart:'/carrito/',checkout:'/finalizar-compra/',search:'/?s=zzzz-no-existe&type=product'};
          const hidden='#cookie-law-info-bar,#cookie-law-info-again,#ht-ctc-chat,.grecaptcha-badge{display:none!important}';
          async function prep(page,path,vp){await page.setViewport(vp);const response=await page.goto(`${base}${path}${path.includes('?')?'&':'?'}audit=${Date.now()}`,{waitUntil:'networkidle2',timeout:90000});await page.addStyleTag({content:hidden});await sleep(700);return response;}
          async function inspect(page){return page.evaluate(()=>{
            const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>0&&r.width>0&&r.height>0};
            const rect=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};
            const text=e=>(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,240);
            const header={logo:document.querySelector('.site-header .site-branding,.site-header .site-logo'),nav:document.querySelector('.site-header .primary-navigation,.site-header .main-navigation,.site-header nav.site-navigation'),tools:document.querySelector('.site-header .site-tools,.site-header .header-right')};
            const links=[...document.querySelectorAll('a[href]')].filter(vis).map(a=>a.href).filter(h=>h.startsWith(location.origin));
            const tinyText=[...document.querySelectorAll('body *')].filter(vis).filter(e=>e.children.length===0&&text(e)&&parseFloat(getComputedStyle(e).fontSize)<12).slice(0,25).map(e=>({text:text(e),className:e.className,size:getComputedStyle(e).fontSize,rect:rect(e)}));
            return{title:document.title,h1:[...document.querySelectorAll('h1')].filter(vis).map(text),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,width:{scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth},header:Object.fromEntries(Object.entries(header).map(([k,e])=>[k,e?rect(e):null])),tinyText,forms:[...document.querySelectorAll('form')].filter(vis).map(e=>({className:e.className,rect:rect(e)})),dialogs:[...document.querySelectorAll('[role=dialog],#shop-cart-sidebar,.cart-sidebar')].filter(vis).map(e=>({className:e.className,text:text(e),rect:rect(e)})),internalLinks:[...new Set(links)].slice(0,120)};
          });}
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu']});
            const context=await browser.createBrowserContext();
            const report={pages:{desktop:{},mobile:{}},journeys:{},consoleErrors:[],failedRequests:[],brokenLinks:[]};
            const products=await fetch(`${base}/wp-json/wc/store/v1/products?per_page=100`).then(r=>r.ok?r.json():[]);
            const purch=products.find(p=>p.is_purchasable&&p.is_in_stock&&p.type==='simple')||products.find(p=>p.is_purchasable&&p.is_in_stock);
            const soldout=products.find(p=>!p.is_in_stock);
            if(purch)staticPaths.product=`/producto/${purch.slug}/`;if(soldout)staticPaths.soldout=`/producto/${soldout.slug}/`;
            for(const [mode,vp] of Object.entries({desktop,mobile}))for(const [name,path] of Object.entries(staticPaths)){
              const page=await context.newPage();page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({mode,page:name,text:m.text()})});page.on('requestfailed',r=>report.failedRequests.push({mode,page:name,url:r.url(),reason:r.failure()?.errorText||''}));
              const response=await prep(page,path,vp);report.pages[mode][name]={http:response?.status()||0,...await inspect(page)};await page.close();
            }
            if(purch){const page=await context.newPage();await prep(page,`/contacto/?add-to-cart=${purch.id}`,desktop);await prep(page,'/contacto/',desktop);const cart=await page.$('.site-tools .shopping-cart,.site-tools .shopping-bag-button,a.shopping-cart,a.shopping-bag-button');if(cart){await cart.click();await sleep(1000)}report.journeys.minicart=await inspect(page);await prep(page,'/carrito/',desktop);report.journeys.cart=await inspect(page);const qty=await page.$('input.qty');if(qty){await qty.click({clickCount:3});await qty.type('2');const update=await page.$('button[name=update_cart]');if(update){await update.click();await sleep(1500)}}report.journeys.cartUpdated=await inspect(page);await prep(page,'/finalizar-compra/',mobile);report.journeys.checkoutMobile=await inspect(page);await page.close();}
            const probe=await context.newPage();const sample=[...new Set(Object.values(report.pages.desktop).flatMap(p=>p.internalLinks||[]))].slice(0,60);for(const url of sample){try{const r=await probe.goto(url,{waitUntil:'domcontentloaded',timeout:30000});if(!r||r.status()>=400)report.brokenLinks.push({url,status:r?.status()||0});}catch(e){report.brokenLinks.push({url,error:e.message})}}await probe.close();
            const hardFailures=[];for(const [mode,pages] of Object.entries(report.pages))for(const [name,p] of Object.entries(pages)){if(p.http>=400||p.http===0)hardFailures.push(`${mode}/${name}: HTTP ${p.http}`);if(p.overflow)hardFailures.push(`${mode}/${name}: overflow`)}if(report.brokenLinks.length)hardFailures.push(`broken links: ${report.brokenLinks.length}`);
            const concise={hardFailures,consoleErrors:report.consoleErrors,failedRequests:report.failedRequests.slice(0,40),brokenLinks:report.brokenLinks,pages:Object.fromEntries(Object.entries(report.pages).map(([mode,pages])=>[mode,Object.fromEntries(Object.entries(pages).map(([name,p])=>[name,{http:p.http,h1:p.h1,overflow:p.overflow,header:p.header,tinyText:p.tinyText}]))])),journeys:report.journeys};
            fs.writeFileSync('full-site-audit/report.json',JSON.stringify(report,null,2));console.log('FULL_SITE_REPORT_START');console.log(JSON.stringify(concise,null,2));console.log('FULL_SITE_REPORT_END');await browser.close();if(hardFailures.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node audit.cjs

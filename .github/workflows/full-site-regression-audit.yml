name: Full site regression audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-site-regression-audit.yml'
      - 'elmercadodeorigen-child/**'

permissions:
  contents: read

concurrency:
  group: full-site-regression-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Audit public pages and commerce journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-site-audit
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > audit.cjs <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          const base='https://dev.elmercadodeorigen.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const desktop={width:1440,height:1100};
          const mobile={width:390,height:844,isMobile:true,deviceScaleFactor:1};
          const staticPaths={
            home:'/',shop:'/tienda/',blog:'/blog/',producers:'/productores/',contact:'/contacto/',about:'/quienes-somos/',account:'/mi-cuenta/',cart:'/carrito/',checkout:'/finalizar-compra/',search:'/?s=zzzz-no-existe&type=product'
          };
          const hidden='#cookie-law-info-bar,#cookie-law-info-again,#ht-ctc-chat,.grecaptcha-badge{display:none!important}';
          async function prep(page,path,vp){
            await page.setViewport(vp);
            const response=await page.goto(`${base}${path}${path.includes('?')?'&':'?'}audit=${Date.now()}`,{waitUntil:'networkidle2',timeout:90000});
            await page.addStyleTag({content:hidden});
            await sleep(900);
            return response;
          }
          async function inspect(page){
            return page.evaluate(()=>{
              const vis=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>0&&r.width>0&&r.height>0};
              const rect=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};
              const text=e=>(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,240);
              const badContrast=[...document.querySelectorAll('body *')].filter(vis).filter(e=>{
                const s=getComputedStyle(e); if(!text(e)||e.children.length>0)return false;
                const fg=s.color.match(/\d+/g),bg=s.backgroundColor.match(/\d+/g); if(!fg||!bg||+s.backgroundColor.split(',')[3]===0)return false;
                const lum=a=>{a=a/255;return a<=.03928?a/12.92:Math.pow((a+.055)/1.055,2.4)};
                const L=x=>.2126*lum(+x[0])+.7152*lum(+x[1])+.0722*lum(+x[2]);
                const a=L(fg),b=L(bg),ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);return ratio<3;
              }).slice(0,30).map(e=>({tag:e.tagName,className:e.className,text:text(e),color:getComputedStyle(e).color,background:getComputedStyle(e).backgroundColor,rect:rect(e)}));
              const header={logo:document.querySelector('.site-header .site-branding,.site-header .site-logo'),nav:document.querySelector('.site-header .primary-navigation,.site-header .main-navigation,.site-header nav.site-navigation'),tools:document.querySelector('.site-header .site-tools,.site-header .header-right')};
              const links=[...document.querySelectorAll('a[href]')].filter(vis).map(a=>a.href).filter(h=>h.startsWith(location.origin));
              return{
                title:document.title,statusText:document.body.innerText.slice(0,500),h1:[...document.querySelectorAll('h1')].filter(vis).map(text),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                width:{scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth},
                header:Object.fromEntries(Object.entries(header).map(([k,e])=>[k,e?rect(e):null])),
                badContrast,
                forms:[...document.querySelectorAll('form')].filter(vis).map(e=>({className:e.className,rect:rect(e)})),
                dialogs:[...document.querySelectorAll('[role=dialog],#shop-cart-sidebar,.cart-sidebar')].filter(vis).map(e=>({className:e.className,text:text(e),rect:rect(e)})),
                internalLinks:[...new Set(links)].slice(0,120)
              };
            });
          }
          async function shot(page,name){await page.screenshot({path:`full-site-audit/${name}.png`,fullPage:true});}
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-gpu']});
            const context=await browser.createBrowserContext();
            const report={pages:{desktop:{},mobile:{}},journeys:{},consoleErrors:[],failedRequests:[],brokenLinks:[]};
            const products=await fetch(`${base}/wp-json/wc/store/v1/products?per_page=100`).then(r=>r.ok?r.json():[]);
            const purch=products.find(p=>p.is_purchasable&&p.is_in_stock&&p.type==='simple')||products.find(p=>p.is_purchasable&&p.is_in_stock);
            const soldout=products.find(p=>!p.is_in_stock);
            if(purch)staticPaths.product=`/producto/${purch.slug}/`;
            if(soldout)staticPaths.soldout=`/producto/${soldout.slug}/`;
            for(const [mode,vp] of Object.entries({desktop,mobile})){
              for(const [name,path] of Object.entries(staticPaths)){
                const page=await context.newPage();
                page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({mode,page:name,text:m.text()})});
                page.on('requestfailed',r=>report.failedRequests.push({mode,page:name,url:r.url(),reason:r.failure()?.errorText||''}));
                const response=await prep(page,path,vp);
                report.pages[mode][name]={http:response?.status()||0,...await inspect(page)};
                await shot(page,`${mode}-${name}`);
                await page.close();
              }
            }
            if(purch){
              const page=await context.newPage();
              await prep(page,`/contacto/?add-to-cart=${purch.id}`,desktop);
              await prep(page,'/contacto/',desktop);
              const cart=await page.$('.site-tools .shopping-cart,.site-tools .shopping-bag-button,a.shopping-cart,a.shopping-bag-button');
              if(cart){await cart.click();await sleep(1200)}
              report.journeys.minicart=await inspect(page);await shot(page,'journey-minicart');
              await prep(page,'/carrito/',desktop);report.journeys.cart=await inspect(page);await shot(page,'journey-cart');
              const qty=await page.$('input.qty');if(qty){await qty.click({clickCount:3});await qty.type('2');const update=await page.$('button[name=update_cart]');if(update){await update.click();await sleep(1800)}}
              report.journeys.cartUpdated=await inspect(page);await shot(page,'journey-cart-updated');
              await prep(page,'/finalizar-compra/',mobile);report.journeys.checkoutMobile=await inspect(page);await shot(page,'journey-checkout-mobile');
              await page.close();
            }
            const probe=await context.newPage();
            const sample=[...new Set(Object.values(report.pages.desktop).flatMap(p=>p.internalLinks||[]))].slice(0,60);
            for(const url of sample){try{const r=await probe.goto(url,{waitUntil:'domcontentloaded',timeout:30000});if(!r||r.status()>=400)report.brokenLinks.push({url,status:r?.status()||0});}catch(e){report.brokenLinks.push({url,error:e.message})}}
            await probe.close();
            fs.writeFileSync('full-site-audit/report.json',JSON.stringify(report,null,2));
            const hardFailures=[];
            for(const [mode,pages] of Object.entries(report.pages))for(const [name,p] of Object.entries(pages)){if(p.http>=400||p.http===0)hardFailures.push(`${mode}/${name}: HTTP ${p.http}`);if(p.overflow)hardFailures.push(`${mode}/${name}: overflow`)}
            if(report.brokenLinks.length)hardFailures.push(`broken links: ${report.brokenLinks.length}`);
            console.log(JSON.stringify({hardFailures,consoleErrors:report.consoleErrors.length,failedRequests:report.failedRequests.length},null,2));
            await browser.close();
            if(hardFailures.length){console.error(hardFailures.join('\n'));process.exit(1)}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node audit.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-site-regression-audit
          path: full-site-audit/
          retention-days: 14

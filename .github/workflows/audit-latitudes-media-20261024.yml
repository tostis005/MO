name: Latitudes production media inventory and logo OCR (READ ONLY)
on:
  push:
    branches: ['audit/latitudes-media-20261024']
    paths:
      - '.github/workflows/audit-latitudes-media-20261024.yml'
      - '.github/scripts/audit-latitudes-media-20261024.php'
      - '.github/scripts/audit-latitudes-media-ocr-20261024.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latitudes-media-readonly-audit
  cancel-in-progress: true
jobs:
  inspect:
    if: false # superseded by strict source-linked audit; stop oversized scope
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read product image manifest from production using WP-CLI (no writes)
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/audit-latitudes-media-20261024.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=25 -o ServerAliveCountMax=15 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/latitudes-media-audit-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/audit-latitudes-media-20261024.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            rm -f '$SCRIPT'
          " > latitudes-media-inventory.json
          python3 -m json.tool latitudes-media-inventory.json > /dev/null
          echo LATITUDES_WP_MEDIA_MANIFEST_READY
      - name: Download and inspect media image pixels (no modifications)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/pip install -q requests Pillow
          .venv/bin/python .github/scripts/audit-latitudes-media-ocr-20261024.py latitudes-media-inventory.json | tee latitudes-media-ocr-log.txt
      - name: Upload audit report, CSV and visual contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latitudes-readonly-image-audit
          path: |
            latitudes-media-inventory.json
            latitudes-media-ocr-log.txt
            latitudes-audit/report.json
            latitudes-audit/all-images.csv
            latitudes-audit/contact-sheet-*.jpg
          retention-days: 21
          if-no-files-found: warn

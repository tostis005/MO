name: Read first 18 Tropitop Spanish products for manual English copy
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/read-tropitop-first18-es-for-editorial-20261021.php'
      - '.github/workflows/read-tropitop-first18-es-for-editorial-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: php -l .github/scripts/read-tropitop-first18-es-for-editorial-20261021.php
      - name: Probe live WordPress safely
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-cluster-audit-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/read-tropitop-first18-es-for-editorial-20261021.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" | tee /tmp/probe.log
          grep '^EMDO_FIRST18_SUMMARY=' /tmp/probe.log
          python3 - <<'PY'
          import json
          a=[json.loads(line.split('=',1)[1]) for line in open('/tmp/probe.log') if line.startswith('EMDO_FIRST18_SPANISH=')]
          assert len(a)==18 and len({v['source_id'] for v in a})==18
          print('EDITORIAL_SOURCE_PRODUCTS',len(a),'TOTAL_CHARS',sum(len(v['content']) for v in a))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tropitop-18-es-editorial-source
          path: /tmp/probe.log
          retention-days: 30
          if-no-files-found: warn

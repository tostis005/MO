name: EMDO reviews moderation audit temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-moderation-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read production review moderation state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          cat > /tmp/emdo-reviews-moderation-audit.php <<'PHP'
          <?php
          global $wpdb;
          $table = MDO_Database::table( 'reviews' );
          $counts = array(
            'total' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table}" ),
            'pending' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending'" ),
            'unassigned_pending' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND COALESCE(suggested_vendor_user_id,0)=0" ),
            'suggested_pending' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND COALESCE(suggested_vendor_user_id,0)>0" ),
            'validated' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='validated'" ),
            'rejected' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='rejected'" ),
            'google_legacy_id' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE source='google' AND (source_review_id IS NULL OR source_review_id NOT LIKE 'trustindex-%')" ),
            'google_trustindex_id' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE source='google' AND source_review_id LIKE 'trustindex-%'" ),
          );
          echo 'AUDIT_COUNTS=' . wp_json_encode( $counts, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;

          $vendors = array();
          try {
            $method = new ReflectionMethod( 'MDO_Reviews', 'vendor_options' );
            $method->setAccessible( true );
            $vendors = (array) $method->invoke( null );
          } catch ( Throwable $e ) {}
          foreach ( $vendors as $vendor_id => $vendor_name ) {
            $product_titles = $wpdb->get_col( $wpdb->prepare( "SELECT post_title FROM {$wpdb->posts} WHERE post_type='product' AND post_status IN ('publish','draft','private') AND post_author=%d ORDER BY ID DESC LIMIT 25", (int) $vendor_id ) );
            echo 'VENDOR=' . wp_json_encode( array( 'id' => (int) $vendor_id, 'name' => (string) $vendor_name, 'products' => array_values( array_map( 'strval', $product_titles ) ) ), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
          }

          $legacy = $wpdb->get_results( "SELECT id,source_review_id,author_name,rating,review_date,status,validation_method,review_text,source_payload FROM {$table} WHERE source='google' AND (source_review_id IS NULL OR source_review_id NOT LIKE 'trustindex-%') ORDER BY id ASC", ARRAY_A );
          foreach ( (array) $legacy as $row ) {
            $payload = (string) ( $row['source_payload'] ?? '' );
            unset( $row['source_payload'] );
            $row['payload_mentions_trustindex'] = false !== stripos( $payload, 'trustindex' );
            $row['text'] = wp_strip_all_tags( (string) ( $row['review_text'] ?? '' ) );
            unset( $row['review_text'] );
            echo 'LEGACY_GOOGLE=' . wp_json_encode( $row, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
          }

          $rows = $wpdb->get_results( "SELECT id,source,source_review_id,author_name,rating,review_title,review_text,review_date,wc_product_id,wc_order_id,assignment_reason FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND COALESCE(suggested_vendor_user_id,0)=0 ORDER BY review_date DESC,id DESC", ARRAY_A );
          foreach ( (array) $rows as $row ) {
            $row['review_title'] = wp_strip_all_tags( (string) ( $row['review_title'] ?? '' ) );
            $row['review_text'] = wp_strip_all_tags( (string) ( $row['review_text'] ?? '' ) );
            echo 'UNASSIGNED=' . wp_json_encode( $row, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
          }
          PHP
          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file /tmp/emdo-reviews-moderation-audit.php --path="$PROD_PATH" --allow-root
          rm -f /tmp/emdo-reviews-moderation-audit.php
          REMOTE

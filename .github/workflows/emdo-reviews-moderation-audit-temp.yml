name: EMDO reviews moderation audit temp

# Rerun after EMDO 1.0.45 refinement.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-moderation-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Verify production review moderation state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          cat > /tmp/emdo-reviews-moderation-post-audit.php <<'PHP'
          <?php
          global $wpdb;
          $table = MDO_Database::table( 'reviews' );
          $counts = array(
            'version' => defined( 'MDO_SUPPLIER_SYNC_VERSION' ) ? MDO_SUPPLIER_SYNC_VERSION : '',
            'total' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table}" ),
            'pending' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending'" ),
            'validated' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='validated'" ),
            'rejected' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='rejected'" ),
            'unassigned_pending' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND COALESCE(suggested_vendor_user_id,0)=0" ),
            'suggested_pending' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND COALESCE(suggested_vendor_user_id,0)>0" ),
            'suggested_hidalgo' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND suggested_vendor_user_id=6 AND validation_method='ai_suggestion'" ),
            'suggested_1957' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE status='pending' AND COALESCE(vendor_user_id,0)=0 AND suggested_vendor_user_id=3 AND validation_method='ai_suggestion'" ),
            'ai_published' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE validation_method='ai_suggestion' AND status='validated'" ),
            'ai_final_vendor' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE validation_method='ai_suggestion' AND COALESCE(vendor_user_id,0)>0" ),
            'legacy_google' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE source='google' AND (source_review_id IS NULL OR source_review_id NOT LIKE 'trustindex-%')" ),
            'canonical_google' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE source='google' AND source_review_id LIKE 'trustindex-%'" ),
            'trustpilot' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM {$table} WHERE source='trustpilot'" ),
            'duplicate_source_keys' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM (SELECT source_key FROM {$table} WHERE source_key IS NOT NULL AND source_key<>'' GROUP BY source_key HAVING COUNT(*)>1) x" ),
            'duplicate_fingerprints' => (int) $wpdb->get_var( "SELECT COUNT(*) FROM (SELECT content_fingerprint FROM {$table} WHERE content_fingerprint IS NOT NULL AND content_fingerprint<>'' GROUP BY content_fingerprint HAVING COUNT(*)>1) x" ),
          );
          echo 'POST_AUDIT=' . wp_json_encode( $counts, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
          $migration = get_option( 'mdo_reviews_moderation_last_run', array() );
          echo 'MODERATION_RUN=' . wp_json_encode( $migration, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
          foreach ( array( 438, 503, 568, 810 ) as $id ) {
            $row = $wpdb->get_row( $wpdb->prepare( "SELECT id,status,vendor_user_id,suggested_vendor_user_id,validation_method,review_text,assignment_reason FROM {$table} WHERE id=%d", $id ), ARRAY_A );
            if ( $row ) {
              $row['review_text'] = wp_strip_all_tags( (string) $row['review_text'] );
              echo 'SPOT=' . wp_json_encode( $row, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
            }
          }
          $summary = $wpdb->get_row( "SELECT COUNT(*) AS total, AVG(rating) AS avg_rating FROM {$table} WHERE status='validated' AND vendor_user_id=6 AND rating>0", ARRAY_A );
          echo 'HIDALGO_SUMMARY=' . wp_json_encode( $summary, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . PHP_EOL;
          PHP
          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file /tmp/emdo-reviews-moderation-post-audit.php --path="$PROD_PATH" --allow-root
          rm -f /tmp/emdo-reviews-moderation-post-audit.php

          plugin="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          grep -q "Sin asignar" "$plugin/includes/class-mdo-reviews.php"
          grep -q "Borradores" "$plugin/includes/class-mdo-reviews.php"
          grep -q "Publicadas" "$plugin/includes/class-mdo-reviews.php"
          grep -q "Borrador" "$plugin/assets/reviews-admin-inline.js"
          echo 'ADMIN_UI_CHECK=OK'

          URL='https://www.elmercadodeorigen.com/tienda/hidalgo-de-la-jara/reviews/'
          html=$(curl -fsSL --max-time 45 -H 'Cache-Control: no-cache' "$URL")
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 -H 'Cache-Control: no-cache' "$URL")
          printf 'PUBLIC_HTTP=%s\n' "$code"
          grep -q 'mdo-reviews-page' <<<"$html"
          grep -q 'mdo-review-summary' <<<"$html"
          grep -q 'sobre 5' <<<"$html"
          grep -Eqi '[0-9]+[[:space:]]+reseña(s)?' <<<"$html"
          if grep -Eqi 'no tiene reseñas|no hay reseñas|has no reviews|no reviews found' <<<"$html"; then
            echo 'NATIVE_EMPTY_MESSAGE=FOUND'
            exit 41
          fi
          echo 'PUBLIC_SUMMARY_CHECK=OK'
          REMOTE

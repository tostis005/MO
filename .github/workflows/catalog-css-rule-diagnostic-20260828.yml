name: Diagnose producer CSS cascade 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-css-rule-diagnostic-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy CSS-only candidate
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] && [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"
          BK="/tmp/mdo-css-diag-$GITHUB_RUN_ID"
          echo "BK=$BK" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$BK'"
          FILES=(
            'zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php'
            'zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php'
            'zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
            'zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
            'zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
            'zzzzzzzzzzzzzzzzzzz-mdo-producer-mobile-css-only-20260828.php'
          )
          for n in "${FILES[@]}"; do
            target="$PROD/wp-content/mu-plugins/$n"
            remote="/tmp/$n.$GITHUB_RUN_ID"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$target' ]; then cp -p '$target' '$BK/$n'; else touch '$BK/$n.absent'; fi"
            sshpass -e scp $SCP "mu-plugins/$n" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$remote' >/dev/null; install -m0644 '$remote' '$target'; rm -f '$remote'"
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); if [ -n \"\$wp_bin\" ] && [ -n \"\$php_bin\" ]; then \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; fi"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Dump matching producer CSS rules at 335px
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, time

          url='https://www.elmercadodeorigen.com/tienda/1957/?mdo_css_cascade_diag=20260828'
          js=r'''() => {
            const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
            const form=toolbar?.querySelector('.woocommerce-ordering') || document.querySelector('#wcfmmp-store .woocommerce-ordering');
            const select=form?.querySelector('select[name="orderby"]')||null;
            const dest=toolbar?.querySelector('[data-mdo-ps-destination-open],[data-mdo-destination-open]')||null;
            const props=['display','width','min-width','max-width','inline-size','min-inline-size','max-inline-size','height','min-height','max-height','flex','flex-grow','flex-shrink','flex-basis','grid-template-columns','grid-template-rows','grid-column','grid-row','position','left','right','float','transform','margin-left','margin-right'];
            const box=el=>{if(!el)return null;const r=el.getBoundingClientRect();const s=getComputedStyle(el);const computed={};for(const p of props)computed[p]=s.getPropertyValue(p);return {tag:el.tagName,id:el.id,cls:el.className,rect:{l:r.left,r:r.right,w:r.width,h:r.height},inline:el.getAttribute('style')||'',computed};};
            function collect(el){
              const out=[];
              if(!el)return out;
              let order=0;
              function walk(rules,source,media,layer){
                for(const rule of rules){
                  order++;
                  if(rule.type===CSSRule.MEDIA_RULE){
                    let active=false;try{active=matchMedia(rule.conditionText).matches}catch(e){}
                    if(active)walk(rule.cssRules,source,rule.conditionText,layer);
                    continue;
                  }
                  if(rule.cssRules && !rule.selectorText){ try{walk(rule.cssRules,source,media,layer)}catch(e){} continue; }
                  if(!rule.selectorText)continue;
                  let matches=false;try{matches=el.matches(rule.selectorText)}catch(e){}
                  if(!matches)continue;
                  const values={};
                  for(const p of props){const v=rule.style.getPropertyValue(p);if(v)values[p]={value:v,priority:rule.style.getPropertyPriority(p)}}
                  if(Object.keys(values).length)out.push({order,source,media,selector:rule.selectorText,values});
                }
              }
              [...document.styleSheets].forEach((sheet,i)=>{
                let rules;try{rules=sheet.cssRules}catch(e){return}
                const node=sheet.ownerNode;
                const source=node?.id || node?.getAttribute?.('data-handle') || node?.getAttribute?.('href') || sheet.href || `sheet-${i}`;
                walk(rules,source,'','');
              });
              return out;
            }
            return {
              href:location.href,
              bodyClass:document.body.className,
              toolbar:box(toolbar),form:box(form),select:box(select),dest:box(dest),
              toolbarRules:collect(toolbar),formRules:collect(form),selectRules:collect(select),destRules:collect(dest),
              styleIds:[...document.querySelectorAll('style[id]')].map(x=>x.id),
              scripts:[...document.querySelectorAll('script[id]')].map(x=>x.id).filter(x=>/catalog|vendor|runtime|toolbar/i.test(x))
            };
          }'''

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={'width':335,'height':820})
            page.route('**/*',lambda r:r.abort() if r.request.resource_type in ('image','font','media') else r.continue_())
            page.goto(url,wait_until='commit',timeout=30000)
            data=None
            for _ in range(50):
              time.sleep(.35)
              try:
                x=page.evaluate(js)
                if x.get('toolbar') and x.get('form') and x.get('select'):
                  time.sleep(.8)
                  data=page.evaluate(js)
                  break
              except Exception:
                pass
            print(json.dumps(data,ensure_ascii=False,indent=2))
            browser.close()
          PY

      - name: Always restore production files
        if: always() && env.PROD != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          FILES=(
            'zzzzzzzzzzz-mdo-catalog-top-controls-parity-20260824.php'
            'zzzzzzzzzzzz-mdo-catalog-top-controls-parity-final-20260824.php'
            'zzzzzzzzzzzzz-mdo-catalog-top-controls-arrow-final-20260824.php'
            'zzzzzzzzzzzzzz-mdo-catalog-mobile-runtime-guard-20260824.php'
            'zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
            'zzzzzzzzzzzzzzzzzzz-mdo-producer-mobile-css-only-20260828.php'
          )
          for n in "${FILES[@]}"; do
            target="$PROD/wp-content/mu-plugins/$n"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BK/$n' ]; then install -m0644 '$BK/$n' '$target'; else rm -f '$target'; fi"
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$BK'"

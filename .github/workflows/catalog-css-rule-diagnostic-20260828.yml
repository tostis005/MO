name: Diagnose producer CSS source 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-css-rule-diagnostic-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate late producer catalogue CSS
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in *elmercadodeorigen.com*) prod="$p"; break;; esac
            done
            [ -n "$prod" ]
            echo "=== EXACT MARKER ==="
            grep -RIn --include="*.php" --include="*.css" "emo-vendor-truth-010235" "$prod/wp-content/themes" "$prod/wp-content/mu-plugins" 2>/dev/null || true
            echo "=== VENDOR TOOLBAR ==="
            grep -RIn --include="*.php" --include="*.css" "elmercado-vendor-toolbar" "$prod/wp-content/themes" 2>/dev/null | head -n 120 || true
            echo "=== 138PX ==="
            grep -RIn --include="*.php" --include="*.css" -E "138px|138[[:space:]]*!important" "$prod/wp-content/themes" "$prod/wp-content/mu-plugins" 2>/dev/null | head -n 160 || true
            echo "=== ORDERING NEAR VENDOR FILES ==="
            find "$prod/wp-content/themes" -type f \( -name "*vendor*" -o -name "*runtime*" -o -name "*catalog*" \) -print0 2>/dev/null | xargs -0 grep -nH -E "woocommerce-ordering|emo-catalog-toolbar-shared-010229|woostify-sorting" 2>/dev/null | head -n 220 || true
          '

name: Home final desktop performance validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-final-desktop-performance-validation-20260819.yml'

permissions:
  contents: write

concurrency:
  group: home-selective-structural-css-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy accepted performance files
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done')"
          : "${PROD:?}"
          declare -A F=(
            [cache]='elmercadodeorigen-child/inc/home-cache.php'
            [critical]='elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
            [theme]='elmercadodeorigen-child/assets/js/theme.js'
            [perf]='mu-plugins/mdo-home-performance-20260819.php'
            [webp]='mu-plugins/mdo-home-webp-delivery-20260819.php'
            [trp]='mu-plugins/mdo-home-translatepress-lite-20260819.php'
            [a11y]='elmercadodeorigen-child/mu-plugins/elmercado-home-a11y-motion-010265.php'
            [responsive]='elmercadodeorigen-child/mu-plugins/elmercado-home-responsive-vendors-010253.php'
            [cls]='elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php'
          )
          for k in "${!F[@]}"; do sshpass -e scp $SCP "${F[$k]}" "$STAGING_USER@$STAGING_HOST:/tmp/final-$k-${GITHUB_RUN_ID}"; done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; MU='$PROD/wp-content/mu-plugins'; install -m0644 /tmp/final-cache-${GITHUB_RUN_ID} \"\$THEME/inc/home-cache.php\"; install -m0644 /tmp/final-critical-${GITHUB_RUN_ID} \"\$THEME/assets/css/critical-woostify-home.min.css\"; install -m0644 /tmp/final-theme-${GITHUB_RUN_ID} \"\$THEME/assets/js/theme.js\"; install -m0644 /tmp/final-perf-${GITHUB_RUN_ID} \"\$MU/mdo-home-performance-20260819.php\"; install -m0644 /tmp/final-webp-${GITHUB_RUN_ID} \"\$MU/mdo-home-webp-delivery-20260819.php\"; install -m0644 /tmp/final-trp-${GITHUB_RUN_ID} \"\$MU/mdo-home-translatepress-lite-20260819.php\"; install -m0644 /tmp/final-a11y-${GITHUB_RUN_ID} \"\$MU/elmercado-home-a11y-motion-010265.php\"; install -m0644 /tmp/final-responsive-${GITHUB_RUN_ID} \"\$MU/elmercado-home-responsive-vendors-010253.php\"; install -m0644 /tmp/final-cls-${GITHUB_RUN_ID} \"\$MU/elmercado-home-cls-010256.php\"; rm -f \"\$MU/elmercado-home-header-cls-010279.php\"; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/final-*-${GITHUB_RUN_ID}"
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/final-home.html
          grep -q 'id="woostify-parent-style-inline-css"' /tmp/final-home.html
          grep -q 'id="elmercado-home-deferred-css" rel="preload"' /tmp/final-home.html
      - name: Lighthouse desktop 3x
        id: measure
        run: |
          set -euo pipefail; mkdir -p runtime
          for i in 1 2 3; do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/final-lhr-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'; done
          python3 - <<'PY' | tee runtime/home-final-desktop-performance-20260819.txt
          import json,statistics
          rows=[]
          for i in range(1,4):
            r=json.load(open(f'/tmp/final-lhr-{i}.json')); a=r['audits']; x={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue'],'si':round(a['speed-index']['numericValue'])}; rows.append(x); print('run',i,x)
            for q in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:6]: n=q.get('node') or {}; print(' shift',q.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(z[k] for z in rows) for k in rows[0]}
          for k,v in med.items(): print('median_'+k+'=',v)
          print('accepted=',str(med['cls']<0.05 and med['lcp']<5500).lower())
          PY
      - name: Record final production validation
        if: always()
        run: |
          set -euo pipefail; mkdir -p runtime; [ -f runtime/home-final-desktop-performance-20260819.txt ] || printf 'deploy=%s\nmeasure=%s\naccepted=false\n' '${{ steps.deploy.outcome }}' '${{ steps.measure.outcome }}' > runtime/home-final-desktop-performance-20260819.txt; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add runtime/home-final-desktop-performance-20260819.txt; git commit -m 'Record final Home desktop performance validation' || exit 0; git pull --rebase origin main; git push origin HEAD:main

name: Deploy English minimum-order fixes 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-minimum-order-fix-deploy-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Validate and deploy minimum-order class
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l mdo-supplier-sync/includes/class-mdo-minimum-order.php >/dev/null
          grep -Fq 'Minimum order for %1$s: you need %2$s more to reach the minimum of %3$s.' mdo-supplier-sync/includes/class-mdo-minimum-order.php
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          : "${PROD_PATH:?production path not found}"
          siteurl="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp --path='$PROD_PATH' --allow-root option get siteurl 2>/dev/null | tail -n1")"
          printf '%s' "$siteurl" | grep -Eq '^https?://(www\.)?elmercadodeorigen\.com/?$'
          REMOTE_FILE="$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-minimum-order.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "test -f '$REMOTE_FILE' && cp -p '$REMOTE_FILE' '$REMOTE_FILE.bak-${GITHUB_RUN_ID}'"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/includes/class-mdo-minimum-order.php "$STAGING_USER@$STAGING_HOST:$REMOTE_FILE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php -l '$REMOTE_FILE' && grep -Fq 'Minimum order for %1\$s: you need %2\$s more to reach the minimum of %3\$s.' '$REMOTE_FILE' && wp --path='$PROD_PATH' --allow-root cache flush >/dev/null 2>&1 || true; rm -rf '$PROD_PATH/wp-content/cache/mdo-page-cache' '$PROD_PATH/wp-content/mdo-page-cache' 2>/dev/null || true"
      - name: Confirm production source is language-aware
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          REMOTE_FILE="$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-minimum-order.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "grep -Fq 'private static function is_english_request' '$REMOTE_FILE' && grep -Fq 'You currently have ' '$REMOTE_FILE' && grep -Fq 'Te faltan ' '$REMOTE_FILE'"
          echo 'PRODUCTION_MINIMUM_ORDER_LANGUAGE_SOURCE_OK'

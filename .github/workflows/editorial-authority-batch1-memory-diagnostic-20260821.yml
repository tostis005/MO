name: Editorial authority batch 1 memory diagnostic 20260821

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-batch1-memory-diagnostic-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish and inspect with 768M
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          mkdir -p .deploy-status
          : > /tmp/out; : > /tmp/err; : > /tmp/db; : > /tmp/public
          echo 99 >/tmp/pubrc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done; [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          INFO_RC=$?
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          printf '%s' "$INFO_RC" >/tmp/inforc; printf '%s' "$PROD" >/tmp/prod; printf '%s' "$PHP" >/tmp/php; printf '%s' "$WP" >/tmp/wp
          if [ "$INFO_RC" -eq 0 ]; then
            PUB=/tmp/ab1-memory-${GITHUB_RUN_ID}.php
            sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch1-20260821.php "$STAGING_USER@$STAGING_HOST:$PUB"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M -d display_errors=1 -d error_reporting=32767 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" >/tmp/out 2>/tmp/err
            echo $? >/tmp/pubrc
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT pm.meta_value,p.ID,p.post_status,p.post_name FROM wp_posts p JOIN wp_postmeta pm ON pm.post_id=p.ID WHERE pm.meta_key='_emdo_authority_key' ORDER BY p.ID DESC LIMIT 10;\" --skip-column-names --path='$PROD' --allow-root" >/tmp/db 2>>/tmp/err
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "'$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -f '$PUB'" >/dev/null 2>&1
          fi

          BASE=https://www.elmercadodeorigen.com
          for u in \
            "$BASE/brida-negra-roja-verde-blanca-jamon-iberico/" \
            "$BASE/en/black-red-green-white-seal-iberian-ham/" \
            "$BASE/como-conservar-jamon-iberico-empezado/" \
            "$BASE/en/how-to-store-iberian-ham-once-started/" \
            "$BASE/lomo-chorizo-salchichon-iberico-diferencias-como-elegir/" \
            "$BASE/en/iberian-loin-chorizo-salchichon-differences-how-to-choose/" \
            "$BASE/picual-arbequina-lechin-que-aove-elegir/" \
            "$BASE/en/picual-arbequina-lechin-which-evoo-to-choose/" \
            "$BASE/que-significa-aceite-oliva-virgen-extra/" \
            "$BASE/en/what-extra-virgin-olive-oil-really-means/"; do
              f=/tmp/page.html
              c=$(curl -k -L -sS --retry 2 --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$u?ab1_memdiag=$GITHUB_RUN_ID" 2>/dev/null)
              m=$(grep -c 'EMDO_AUTHORITY_BATCH1:' "$f" 2>/dev/null || true)
              raw=$(grep -Fc '[products ' "$f" 2>/dev/null || true)
              prod=$(grep -Ec 'class="[^"]*products|class="[^"]*product' "$f" 2>/dev/null || true)
              feat=$(grep -c 'emo-article-featured' "$f" 2>/dev/null || true)
              printf '%s marker=%s raw=%s products=%s featured=%s %s\n' "$c" "$m" "$raw" "$prod" "$feat" "$u" >>/tmp/public
          done
          for u in "$BASE/blog/" "$BASE/en/journal/"; do
              f=/tmp/index.html; c=$(curl -k -L -sS --retry 2 --connect-timeout 8 --max-time 45 -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$u?ab1_memdiag=$GITHUB_RUN_ID" 2>/dev/null)
              es=$(grep -Fc 'Brida negra, roja, verde o blanca' "$f" 2>/dev/null || true)
              en=$(grep -Fc 'Black, red, green or white seal' "$f" 2>/dev/null || true)
              printf '%s index_es=%s index_en=%s %s\n' "$c" "$es" "$en" "$u" >>/tmp/public
          done

          python3 - <<'PY'
          import json,os
          def r(p,n=50000):
            try:return open(p,encoding='utf-8',errors='ignore').read()[-n:]
            except:return ''
          def i(p):
            try:return int(open(p).read().strip())
            except:return None
          d={'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'info_rc':i('/tmp/inforc'),'prod':r('/tmp/prod',2000),'php':r('/tmp/php',2000),'wp':r('/tmp/wp',2000),'publisher_rc':i('/tmp/pubrc'),'stdout':r('/tmp/out'),'stderr':r('/tmp/err'),'db_rows':r('/tmp/db'),'public_checks':r('/tmp/public')}
          json.dump(d,open('.deploy-status/editorial-authority-batch1-memory-diagnostic-20260821.json','w',encoding='utf-8'),ensure_ascii=False,indent=2); open('.deploy-status/editorial-authority-batch1-memory-diagnostic-20260821.json','a').write('\n')
          PY

      - name: Commit diagnostics
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p .deploy-status
          test -f .deploy-status/editorial-authority-batch1-memory-diagnostic-20260821.json || printf '{"run_id":"%s","missing":true}\n' "$GITHUB_RUN_ID" > .deploy-status/editorial-authority-batch1-memory-diagnostic-20260821.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/editorial-authority-batch1-memory-diagnostic-20260821.json
          git commit -m 'Record 768M editorial authority batch diagnostics [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Identify EMDO minimum order storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-emdo-minimum-focused-20260819.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Read minimum-order storage references
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          mkdir -p .deploy-status
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "FILE='$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-minimum-order.php'; test -f \"\$FILE\"; grep -nEi 'get_user_meta|update_user_meta|get_option|update_option|meta_key|minimum|pedido|supplier|vendor|store|const ' \"\$FILE\" | head -n 220" > .deploy-status/emdo-minimum-focused.txt
          cat .deploy-status/emdo-minimum-focused.txt
      - name: Record result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/emdo-minimum-focused.txt
          git commit -m 'Record focused EMDO minimum-order diagnostic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

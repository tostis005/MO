name: Verify live impact GeoIP2 bot guard read-only 20261020
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-geoip2-bot-guard-20261020.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Compare before and after 429/200 on attacked URLs without showing IPs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== SYSTEM ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'; uptime
          nginx -t 2>&1 | tail -n 2
          echo '=== MEASURE REAL TRAFFIC AROUND 10:30:49Z ACTIVATION ==='
          python3 - <<'PY'
          import datetime,collections,re
          path='/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log'
          boundary=datetime.datetime(2026,10,20,10,30,49,tzinfo=datetime.timezone.utc)
          now=datetime.datetime.now(datetime.timezone.utc)
          rx=re.compile(r'^(\S+).*?\[([^]]+)\]\s+"(\w+)\s+([^"]+?)\s+HTTP/[0-9.]+"\s+(\d{3})')
          out=collections.defaultdict(lambda:collections.Counter())
          seen=collections.defaultdict(set)
          with open(path,encoding='utf8',errors='replace') as f:
              for line in f:
                  m=rx.match(line)
                  if not m:continue
                  ip,dt,method,url,code=m.groups()
                  try:t=datetime.datetime.strptime(dt,'%d/%b/%Y:%H:%M:%S %z').astimezone(datetime.timezone.utc)
                  except:continue
                  if t<boundary-datetime.timedelta(minutes=25) or t>now:continue
                  p=url.split('?',1)[0]
                  filtered=('/tienda/' in p or '/en/store/' in p or '/categoria-producto/' in p) and 'filter_' in url
                  if not filtered:continue
                  segment='before' if t<boundary else 'after'
                  key='hidalgo' if p.startswith('/tienda/hidalgo-de-la-jara/') else 'other-catalog'
                  out[(segment,key)][code]+=1
                  seen[(segment,key)].add(ip)
          for (segment,key),nums in sorted(out.items()):
              print(segment,key,'requests',sum(nums.values()),'codes',dict(nums),'distinct_IPs',len(seen[(segment,key)]))
          PY
          echo '=== LIVE PHP-FPM PROCESSES ==='
          ps -eo comm= | grep -c 'php-fpm' || true
          echo '=== NGINX GEOIP2 RULE ACTIVE ==='
          test -f /etc/nginx/conf.d/99-emdo-geoip2-facet-guard.conf && grep -q 'emdo_geofacet_reject' /var/www/vhosts/system/elmercadodeorigen.com/conf/vhost_nginx.conf && echo 'ACTIVE'
          REMOTE

name: Final English product translations v73

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translate-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Export translate precheck apply and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          python3 -m pip install --quiet deep-translator
          php -l .github/scripts/mdo-final-en-export-v72.php
          php -l .github/scripts/mdo-final-en-apply-verify-v73.php
          python3 -m py_compile .github/scripts/mdo-final-en-translate-v73.py
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REXPORT="/tmp/mdo-final-en-export-${GITHUB_RUN_ID}.php"
          RSOURCE="/tmp/mdo-final-en-source-${GITHUB_RUN_ID}.json"
          RAPPLY="/tmp/mdo-final-en-apply-${GITHUB_RUN_ID}.php"
          RPAYLOAD="/tmp/mdo-final-en-output-${GITHUB_RUN_ID}.json"
          LSOURCE="/tmp/mdo-final-en-source.json"
          LPAYLOAD="/tmp/mdo-final-en-output.json"
          sshpass -e scp $SCP .github/scripts/mdo-final-en-export-v72.php "$STAGING_USER@$STAGING_HOST:$REXPORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); MDO_EXPORT_PATH='$RSOURCE' \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REXPORT' --path='$PROD_PATH' --allow-root"
          sshpass -e scp $SCP "$STAGING_USER@$STAGING_HOST:$RSOURCE" "$LSOURCE"
          python3 .github/scripts/mdo-final-en-translate-v73.py "$LSOURCE" "$LPAYLOAD"
          python3 - <<'PY'
          import json,re
          path='/tmp/mdo-final-en-output.json'
          p=json.load(open(path,encoding='utf-8'))
          assert len(p['products'])==205
          for row in p['products']:
              for field in ('title','content','excerpt'):
                  row[field]=re.sub(r'Cátedra Ibérica', 'Iberian Masterclass', row.get(field,'') or '', flags=re.I)
          with open(path,'w',encoding='utf-8') as f:
              json.dump(p,f,ensure_ascii=False,separators=(',',':'))
          print('LOCAL_PAYLOAD_OK',len(p['products']))
          PY
          sshpass -e scp $SCP .github/scripts/mdo-final-en-apply-verify-v73.php "$STAGING_USER@$STAGING_HOST:$RAPPLY"
          sshpass -e scp $SCP "$LPAYLOAD" "$STAGING_USER@$STAGING_HOST:$RPAYLOAD"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); MDO_PAYLOAD_PATH='$RPAYLOAD' \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$RAPPLY' --path='$PROD_PATH' --allow-root"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REXPORT' '$RSOURCE' '$RAPPLY' '$RPAYLOAD'"

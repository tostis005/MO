name: Enable direct review URLs for six approved Mentta packs
on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/emdo-mentta-exclusive-products.php'
      - '.github/scripts/verify-mentta-partner-direct-urls-20261028.php'
      - '.github/workflows/enable-mentta-partner-direct-urls-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mentta-partner-review-direct-urls-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint the targeted public-detail exception and confirm SSH
        run: |
          set -euo pipefail
          php -l mu-plugins/emdo-mentta-exclusive-products.php
          php -l .github/scripts/verify-mentta-partner-direct-urls-20261028.php
          grep -Fq 'emdo_mentta_partner_direct_product_query' mu-plugins/emdo-mentta-exclusive-products.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Safely deploy direct detail view exception to production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          RUN="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-exclusive-products.php "$TARGET:/tmp/emdo-partner-direct-$RUN.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/verify-mentta-partner-direct-urls-20261028.php "$TARGET:/tmp/emdo-partner-verify-$RUN.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$PROD_PATH' '$RUN'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; RUN="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          LIVE="$SITE/wp-content/mu-plugins/emdo-mentta-exclusive-products.php"
          test -f "$LIVE"
          test -f "/tmp/emdo-partner-direct-$RUN.php"
          "$PHP_BIN" -l "/tmp/emdo-partner-direct-$RUN.php"
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval-file "/tmp/emdo-partner-verify-$RUN.php" --path="$SITE" --allow-root
          cp -a "$LIVE" "$LIVE.before-partner-review-$RUN"
          install -m 0644 "/tmp/emdo-partner-direct-$RUN.php" "$LIVE"
          "$PHP_BIN" -l "$LIVE"
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval-file "/tmp/emdo-partner-verify-$RUN.php" --path="$SITE" --allow-root
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval '
             foreach ([21814,21818,21820,21904,21906,21908] as $pid) {
               clean_post_cache($pid);
               if (function_exists("rocket_clean_post")) rocket_clean_post($pid);
             }
             if (class_exists("WC_Cache_Helper")) WC_Cache_Helper::get_transient_version("product",true);
             wp_cache_flush();
           ' --path="$SITE" --allow-root
          REMOTE
      - name: Verify six public product detail URLs but not the protected unapproved listings
        run: |
          set -euo pipefail
          HOST="https://www.elmercadodeorigen.com/producto"
          for SLUG in \
            pack-musee-mentta-pasaporte-salvaje \
            pack-musee-mentta-safari-africano \
            pack-musee-mentta-vuelta-al-mundo \
            pack-cafe-especialidad-esencia-costa-rica-ikore \
            pack-cafe-especialidad-ruta-cuatro-origenes-ikore \
            pack-cafe-especialidad-coleccion-completa-ikore
          do
            HTTP="$(curl -sSL --connect-timeout 9 --max-time 40 -o /tmp/mentta-view.html -w '%{http_code}' "$HOST/$SLUG/")"
            echo "PARTNER_VIEW $SLUG HTTP=$HTTP"
            test "$HTTP" = 200
            grep -Eiq 'woocommerce|producto|product' /tmp/mentta-view.html
          done
          for SLUG in \
            jamon-de-bellota-100-iberico-montjam-mentta \
            pack-musee-mentta-reserva-de-caza \
            pack-musee-mentta-parrilla-sin-fronteras-xl \
            pack-musee-mentta-universo-wagyu \
            pack-musee-mentta-leyendas-del-vacuno
          do
            HTTP="$(curl -sSL --connect-timeout 9 --max-time 40 -o /dev/null -w '%{http_code}' "$HOST/$SLUG/")"
            echo "STILL_PROTECTED $SLUG HTTP=$HTTP"
            test "$HTTP" = 404
          done
          echo SIX_MENTTA_PARTNER_URLS_ACCESSIBLE_AND_OTHERS_STILL_HIDDEN

name: Audit CookieYes responsive layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cookie-consent-responsive-audit.yml'
      - '.github/deploy/emdo-cookie-consent.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Inspect mobile CookieYes DOM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          o = Options(); o.page_load_strategy = 'eager'
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--lang=es-ES','--window-size=320,800'):
              o.add_argument(arg)
          d = webdriver.Chrome(options=o)
          d.set_page_load_timeout(60)
          d.execute_cdp_cmd('Network.setExtraHTTPHeaders', {'headers': {
              'Accept-Language':'es-ES,es;q=0.9','Cache-Control':'no-cache','Pragma':'no-cache'
          }})
          try:
              d.get('https://www.elmercadodeorigen.com/?cookie_dom_audit=' + str(time.time_ns()))
              time.sleep(8)
              print('INNER_WIDTH=' + str(d.execute_script('return window.innerWidth')), flush=True)
              banner = d.find_element(By.ID, 'cookie-law-info-bar')
              print('BANNER_DISPLAYED=' + str(banner.is_displayed()), flush=True)
              print('BANNER_OUTER_HTML_START', flush=True)
              print((banner.get_attribute('outerHTML') or '')[:20000], flush=True)
              print('BANNER_OUTER_HTML_END', flush=True)
              candidates = d.execute_script("""
                return Array.from(document.querySelectorAll('a,button,[role="button"],[id*="cookie"],[class*="cli"],[class*="cookie"]'))
                  .map(el => {
                    const r=el.getBoundingClientRect(), s=getComputedStyle(el);
                    return {
                      tag:el.tagName,id:el.id,cls:String(el.className||''),
                      text:(el.textContent||'').trim().replace(/\\s+/g,' ').slice(0,160),
                      x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),
                      display:s.display,visibility:s.visibility,position:s.position
                    };
                  })
                  .filter(x => x.w > 0 && x.h > 0 && x.display !== 'none' && x.visibility !== 'hidden');
              """)
              print('VISIBLE_COOKIE_CANDIDATES_START', flush=True)
              print(json.dumps(candidates, ensure_ascii=False, indent=2)[:30000], flush=True)
              print('VISIBLE_COOKIE_CANDIDATES_END', flush=True)
          finally:
              d.quit()
          PY

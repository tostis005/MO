name: Import category images 20261001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-category-images-20261001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/assets/category-images-20261001
          curl -fL --retry 3 --max-time 90 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-fdbc-820e-bc9a-d17ff7617c1d/raw?se=2026-10-01T11%3A19%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=f51489e6-afd6-50ff-ae1a-28cd08b2a3f8&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T10%3A24%3A48Z&ske=2026-10-02T10%3A24%3A48Z&sks=b&skv=2026-02-06&sig=mhZwuxBtIuK2L5V/bFfzcxQJH5MDVnDAExu5mFUX7Qw%3D' -o .github/assets/category-images-20261001/category-pescados-mariscos.webp
          curl -fL --retry 3 --max-time 90 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9688-820e-ae34-8ddf534f5d55/raw?se=2026-10-01T11%3A19%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=b96eade3-173b-5983-8b61-2a2c5194518a&skoid=bdd24bd8-9af5-4138-bfb1-19fba97a8611&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T09%3A19%3A32Z&ske=2026-10-02T09%3A19%3A32Z&sks=b&skv=2026-02-06&sig=Lb2McRRfcgzXHcRaqvjOFkMOoXEfF38XrgmaS59X3%2BM%3D' -o .github/assets/category-images-20261001/category-foie-pates-untables.webp
          test "$(stat -c%s .github/assets/category-images-20261001/category-pescados-mariscos.webp)" -eq 143118
          test "$(stat -c%s .github/assets/category-images-20261001/category-foie-pates-untables.webp)" -eq 169964
          sha256sum .github/assets/category-images-20261001/*.webp

      - name: Commit binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/assets/category-images-20261001/*.webp
          git rm -f .github/assets/category-images-20261001/pescados.part01.b64 2>/dev/null || true
          git commit -m 'Add final category images [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

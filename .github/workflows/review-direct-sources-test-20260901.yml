name: Test direct Google and Trustpilot review sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-direct-sources-test-20260901.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-direct-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Test production direct review sources
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          cat > /tmp/review-direct-test.php <<'PHP'
          <?php
          function mdo_find_google_key($value) {
              if (is_string($value) && preg_match('/AIza[0-9A-Za-z_-]{20,}/', $value, $m)) return $m[0];
              if (is_array($value)) {
                  foreach ($value as $v) {
                      $found = mdo_find_google_key($v);
                      if ($found) return $found;
                  }
              }
              if (is_object($value)) return mdo_find_google_key((array)$value);
              return '';
          }

          echo "--- existing MDO stored values ---\n";
          foreach (['mdo_google_review_count','mdo_google_review_count_updated_at','mdo_trustpilot_review_count','mdo_review_counts_last_result','mdo_home_external_reviews_version'] as $name) {
              $v = get_option($name, null);
              if (is_array($v) || is_object($v)) $v = wp_json_encode($v);
              echo $name . '=' . (is_scalar($v) ? (string)$v : gettype($v)) . "\n";
          }

          echo "--- Google direct API test ---\n";
          $raw = get_option('grw_google_api_key', '');
          $key = mdo_find_google_key($raw);
          echo 'google_key_present=' . ($key ? 'yes' : 'no') . "\n";
          if ($key) {
              $url = add_query_arg([
                  'input' => 'El Mercado de Origen',
                  'inputtype' => 'textquery',
                  'fields' => 'place_id,name,rating,user_ratings_total,formatted_address',
                  'language' => 'es',
                  'key' => $key,
              ], 'https://maps.googleapis.com/maps/api/place/findplacefromtext/json');
              $r = wp_remote_get($url, ['timeout'=>20, 'user-agent'=>'Mozilla/5.0']);
              if (is_wp_error($r)) {
                  echo 'google_http_error=' . $r->get_error_code() . "\n";
              } else {
                  echo 'google_http_code=' . wp_remote_retrieve_response_code($r) . "\n";
                  $j = json_decode(wp_remote_retrieve_body($r), true);
                  echo 'google_api_status=' . ($j['status'] ?? 'missing') . "\n";
                  if (!empty($j['error_message'])) echo 'google_api_error=' . preg_replace('/AIza[0-9A-Za-z_-]+/', '[redacted]', $j['error_message']) . "\n";
                  $c = $j['candidates'][0] ?? [];
                  if ($c) {
                      echo 'google_name=' . ($c['name'] ?? '') . "\n";
                      echo 'google_address=' . ($c['formatted_address'] ?? '') . "\n";
                      echo 'google_rating=' . ($c['rating'] ?? '') . "\n";
                      echo 'google_review_count=' . ($c['user_ratings_total'] ?? '') . "\n";
                      echo 'google_place_id=' . ($c['place_id'] ?? '') . "\n";
                  }
              }
          }

          echo "--- Trustpilot direct profile test ---\n";
          $tp = wp_remote_get('https://es.trustpilot.com/review/elmercadodeorigen.com', [
              'timeout' => 20,
              'headers' => ['Accept-Language' => 'es-ES,es;q=0.9,en;q=0.8'],
              'user-agent' => 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
          ]);
          if (is_wp_error($tp)) {
              echo 'trustpilot_http_error=' . $tp->get_error_code() . "\n";
          } else {
              $body = wp_remote_retrieve_body($tp);
              echo 'trustpilot_http_code=' . wp_remote_retrieve_response_code($tp) . "\n";
              $count = '';
              $rating = '';
              $patterns = [
                  '/"reviewCount"\s*:\s*"?(\d+)"?/i',
                  '/"numberOfReviews"\s*:\s*"?(\d+)"?/i',
                  '/([0-9][0-9\.\s]*)\s+opiniones/i',
              ];
              foreach ($patterns as $p) {
                  if (preg_match($p, $body, $m)) { $count = preg_replace('/\D+/', '', $m[1]); if ($count) break; }
              }
              $rating_patterns = [
                  '/"ratingValue"\s*:\s*"?([0-9]+(?:[\.,][0-9]+)?)"?/i',
                  '/"trustScore"\s*:\s*([0-9]+(?:\.[0-9]+)?)/i',
              ];
              foreach ($rating_patterns as $p) {
                  if (preg_match($p, $body, $m)) { $rating = str_replace(',', '.', $m[1]); break; }
              }
              echo 'trustpilot_review_count=' . $count . "\n";
              echo 'trustpilot_rating=' . $rating . "\n";
          }
          PHP

          sshpass -e scp $SCP_OPTIONS /tmp/review-direct-test.php "$STAGING_USER@$STAGING_HOST:/tmp/review-direct-test-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '/tmp/review-direct-test-${GITHUB_RUN_ID}.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '/tmp/review-direct-test-${GITHUB_RUN_ID}.php'; exit \$rc" > review-direct-sources-output.txt

          echo '--- source files currently managing MDO review counters ---' >> review-direct-sources-output.txt
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "timeout 15s grep -RIl --include='*.php' -E 'mdo_google_review_count|mdo_trustpilot_review_count|mdo_home_external_reviews_version' '$PROD_PATH/wp-content/mu-plugins' '$PROD_PATH/wp-content/plugins' 2>/dev/null | head -n 50" >> review-direct-sources-output.txt || true
          cat review-direct-sources-output.txt

      - name: Commit safe test output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-direct-sources-output.txt
          git commit -m 'Record direct review source test output' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

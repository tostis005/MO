name: Producer desktop layout diagnostic 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke-20260818.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Inspect live producer layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/producer-layout.txt
          from playwright.sync_api import sync_playwright
          import json

          URL = 'https://www.elmercadodeorigen.com/tienda/1957/?mdo_layout_diag=20260828'

          def inspect(page, width, height, label):
              page.set_viewport_size({'width': width, 'height': height})
              page.goto(URL, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(1500)
              data = page.evaluate('''() => {
                const rect = el => {
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  const cs = getComputedStyle(el);
                  return {tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',text:(el.innerText||'').trim().replace(/\\s+/g,' ').slice(0,180),x:r.x,y:r.y,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height,display:cs.display,position:cs.position,float:cs.float,clear:cs.clear,marginTop:cs.marginTop,marginBottom:cs.marginBottom,paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,transform:cs.transform,zIndex:cs.zIndex};
                };
                const smallestText = needle => {
                  const els=[...document.querySelectorAll('body *')].filter(el=>{const t=(el.innerText||'').trim().replace(/\\s+/g,' ');return t===needle||t.startsWith(needle);});
                  els.sort((a,b)=>(a.innerText||'').length-(b.innerText||'').length); return els[0]||null;
                };
                const result=document.querySelector('.woocommerce-result-count');
                const ordering=document.querySelector('.woocommerce-ordering');
                const products=document.querySelector('ul.products, .products');
                const firstProduct=document.querySelector('ul.products li.product, .products li.product, .products .product');
                const shipping=smallestText('Envío a España')||smallestText('Envío a Spain')||smallestText('Envío');
                const controls=[result,ordering,shipping].filter(Boolean).map(rect);
                const controlBottom=controls.length?Math.max(...controls.map(x=>x.bottom)):null;
                const productTop=firstProduct?firstProduct.getBoundingClientRect().top:null;
                return {url:location.href,bodyClass:document.body.className,result:rect(result),ordering:rect(ordering),shipping:rect(shipping),products:rect(products),firstProduct:rect(firstProduct),controlBottom,productTop,gap:controlBottom!==null&&productTop!==null?productTop-controlBottom:null,overlaps:controlBottom!==null&&productTop!==null?productTop<controlBottom:null,parents:firstProduct?[...function*(){let e=firstProduct;for(let i=0;e&&i<6;i++,e=e.parentElement)yield rect(e)}()]:[],stylesheets:[...document.styleSheets].map(s=>s.href).filter(Boolean)};
              }''')
              print(f'===== {label} {width}x{height} =====')
              print(json.dumps(data, ensure_ascii=False, indent=2))

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              inspect(page,1440,1000,'desktop')
              inspect(page,390,844,'mobile')
              browser.close()
          PY

      - name: Record diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          cp /tmp/producer-layout.txt runtime/producer-desktop-layout-20260828.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/producer-desktop-layout-20260828.txt
          git commit -m 'Record producer desktop layout diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main

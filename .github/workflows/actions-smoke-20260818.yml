name: CF7 REST-safe guard deployment 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke-20260818.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate guard
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-cf7-rest-guard-20260828.php >/dev/null
          grep -Fq "add_filter( 'wpcf7_spam', 'mdo_cf7_rest_guard_filter', 19, 2 )" mu-plugins/mdo-cf7-rest-guard-20260828.php

      - name: Deploy to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-cf7-rest-guard-20260828.php"
          REMOTE="/tmp/mdo-cf7-rest-guard-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/mdo-cf7-rest-guard-backup-${GITHUB_RUN_ID}.php"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-cf7-rest-guard-20260828.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"

      - name: Verify live behavior
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          cat > /tmp/mdo-cf7-rest-verify.php <<'PHP'
          <?php
          echo 'version=' . ( defined( 'MDO_CF7_REST_GUARD_VERSION' ) ? MDO_CF7_REST_GUARD_VERSION : 'missing' ) . PHP_EOL;
          echo 'hook=' . ( has_filter( 'wpcf7_spam', 'mdo_cf7_rest_guard_filter' ) ? 'yes' : 'no' ) . PHP_EOL;

          $_POST = array(
              'your-name' => 'VyYGdyULmCUJvYinTVJ',
              'your-message' => 'MbRibzvBWMjQtHqq',
              'your-company' => 'Yqpoel LLC',
          );
          echo 'rest_bypass_random_block=' . ( mdo_cf7_rest_guard_filter( false, null ) ? 'yes' : 'no' ) . PHP_EOL;

          class MDO_CF7_Test_Form {
              public function id() { return 1513; }
          }
          class MDO_CF7_Test_Submission {
              private $data;
              public function __construct( $data ) { $this->data = $data; }
              public function get_posted_data() { return $this->data; }
              public function get_contact_form() { return new MDO_CF7_Test_Form(); }
              public function add_spam_log( $entry ) {}
          }

          $_SERVER['HTTP_USER_AGENT'] = 'MDO-CF7-REST-GUARD-TEST';
          $issued = time() - 5;
          $nonce = str_repeat( 'a', 32 );
          $payload = '1513|' . $issued . '|' . $nonce . '|' . mdo_cf7_guard_ua_hash();
          $sig = hash_hmac( 'sha256', $payload, wp_salt( 'auth' ) );
          $token = $issued . '.' . $nonce . '.' . $sig;
          $good = new MDO_CF7_Test_Submission( array(
              'your-name' => 'Jose Antonio Perez',
              'your-message' => 'Quiero informacion sobre vuestros productores.',
              '_mdo_cf7_guard' => $token,
          ) );
          echo 'legitimate_valid_challenge_allowed=' . ( mdo_cf7_rest_guard_filter( false, $good ) ? 'no' : 'yes' ) . PHP_EOL;
          PHP

          VERIFY_REMOTE="/tmp/mdo-cf7-rest-verify-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS /tmp/mdo-cf7-rest-verify.php "$STAGING_USER@$STAGING_HOST:$VERIFY_REMOTE"
          RESULT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=256M \"\$wp_bin\" eval-file '$VERIFY_REMOTE' --path='$PROD_PATH' --allow-root; rm -f '$VERIFY_REMOTE'")"

          printf '%s\n' "$RESULT"
          grep -Fq 'version=1.0.0' <<< "$RESULT"
          grep -Fq 'hook=yes' <<< "$RESULT"
          grep -Fq 'rest_bypass_random_block=yes' <<< "$RESULT"
          grep -Fq 'legitimate_valid_challenge_allowed=yes' <<< "$RESULT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          mkdir -p runtime
          {
            echo 'cf7_rest_guard_active=true'
            printf '%s\n' "$RESULT"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > runtime/cf7-rest-guard-production-20260828.txt

      - name: Roll back on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Record successful deployment
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/cf7-rest-guard-production-20260828.txt
          git commit -m 'Record CF7 REST-safe guard deployment'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove backup after success
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

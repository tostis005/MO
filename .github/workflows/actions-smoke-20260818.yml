name: Vendor desktop product grid fix 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke-20260818.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate layout fix
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-vendor-desktop-products-layout-20260828.php >/dev/null
          grep -Fq 'html body.wcfm-store-page #products-wrapper ul.products.products' mu-plugins/mdo-vendor-desktop-products-layout-20260828.php
          grep -Fq 'margin-top: 0 !important' mu-plugins/mdo-vendor-desktop-products-layout-20260828.php
          grep -Fq '@media (min-width: 1024px)' mu-plugins/mdo-vendor-desktop-products-layout-20260828.php
          grep -Fq "add_action( 'wp_footer', 'mdo_vendor_desktop_products_layout_fix', 99999 )" mu-plugins/mdo-vendor-desktop-products-layout-20260828.php

      - name: Deploy to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-vendor-desktop-products-layout-20260828.php"
          REMOTE="/tmp/mdo-vendor-desktop-layout-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/mdo-vendor-desktop-layout-backup-${GITHUB_RUN_ID}.php"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-vendor-desktop-products-layout-20260828.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify desktop and mobile live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/vendor-layout-verify.txt
          from playwright.sync_api import sync_playwright
          import json, sys

          URL='https://www.elmercadodeorigen.com/tienda/1957/?mdo_layout_fix_verify=20260828v101'

          def measure(page, width, height):
              page.set_viewport_size({'width':width,'height':height})
              page.goto(URL, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(1200)
              return page.evaluate('''() => {
                const result=document.querySelector('.woocommerce-result-count');
                const ordering=document.querySelector('.woocommerce-ordering');
                const products=document.querySelector('#products-wrapper ul.products');
                const first=document.querySelector('#products-wrapper ul.products li.product');
                const textEls=[...document.querySelectorAll('body *')].filter(el=>{const t=(el.innerText||'').trim().replace(/\\s+/g,' ');return t==='Envío a España'||t==='Envío a Spain';});
                textEls.sort((a,b)=>(a.innerText||'').length-(b.innerText||'').length);
                const shipping=textEls[0]||null;
                const bottoms=[result,ordering,shipping].filter(Boolean).map(el=>el.getBoundingClientRect().bottom);
                const controlBottom=bottoms.length?Math.max(...bottoms):null;
                const productTop=first?first.getBoundingClientRect().top:null;
                return {
                  width:innerWidth,
                  bodyVendor:document.body.classList.contains('wcfm-store-page'),
                  stylePresent:!!document.getElementById('mdo-vendor-desktop-products-layout-fix'),
                  desktopMedia:matchMedia('(min-width: 1024px)').matches,
                  productsMarginTop:products?getComputedStyle(products).marginTop:null,
                  controlBottom, productTop,
                  gap:controlBottom!==null&&productTop!==null?productTop-controlBottom:null,
                  overlaps:controlBottom!==null&&productTop!==null?productTop<controlBottom:null,
                  productsFound:!!products,
                  firstFound:!!first
                };
              }''')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              desktop=measure(page,1440,1000)
              mobile=measure(page,390,844)
              browser.close()

          print('DESKTOP='+json.dumps(desktop,ensure_ascii=False))
          print('MOBILE='+json.dumps(mobile,ensure_ascii=False))

          ok=(desktop['bodyVendor'] and desktop['stylePresent'] and desktop['productsFound'] and desktop['firstFound'] and desktop['desktopMedia'] and desktop['productsMarginTop']=='0px' and desktop['overlaps'] is False and desktop['gap'] is not None and desktop['gap']>=20 and mobile['bodyVendor'] and mobile['stylePresent'] and mobile['productsFound'] and mobile['firstFound'] and mobile['desktopMedia'] is False)
          if not ok:
              sys.exit('Live vendor layout verification failed')
          PY

      - name: Record successful deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          {
            echo 'vendor_desktop_layout_fix_active=true'
            echo 'version=1.0.1'
            cat /tmp/vendor-layout-verify.txt
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > runtime/vendor-desktop-layout-fix-20260828.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/vendor-desktop-layout-fix-20260828.txt
          git commit -m 'Record vendor desktop layout fix deployment'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Roll back on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Remove backup after success
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

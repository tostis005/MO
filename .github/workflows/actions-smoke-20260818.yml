name: Deploy catalogue visual parity v2 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke-20260818.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSS-only files
        shell: bash
        run: |
          set -euo pipefail
          for FILE in \
            mu-plugins/zzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-20260828.php \
            mu-plugins/zzzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-refinements-20260828.php; do
            php -l "$FILE" >/dev/null
            ! grep -Fq '<script' "$FILE"
            ! grep -Eqi 'pre_get_posts|woocommerce_product_query|tax_query|meta_query|posts_where|posts_join|posts_request|wp_ajax|WC_Query|woocommerce_product_is_visible|woocommerce_get_catalog_ordering_args' "$FILE"
          done

      - name: Deploy both presentation files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH_OPTIONS=$SSH_OPTIONS" >> "$GITHUB_ENV"

          MAIN='zzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-20260828.php'
          REFINE='zzzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-refinements-20260828.php'
          for NAME in "$MAIN" "$REFINE"; do
            SRC="mu-plugins/$NAME"
            TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
            REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
            BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP_OPTIONS "$SRC" "$STAGING_USER@$STAGING_HOST:$REMOTE"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          done
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify six responsive widths and product integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, sys

          with open('runtime/catalog-design-baseline-20260828.json',encoding='utf-8') as f:
              baseline=json.load(f)

          urls={
              'global':'https://www.elmercadodeorigen.com/tienda/?mdo_visual_verify=20260828v2',
              'producer':'https://www.elmercadodeorigen.com/tienda/1957/?mdo_visual_verify=20260828v2',
          }
          sizes=[(390,844),(768,1024),(1024,900),(1280,900),(1440,1000),(1920,1080)]
          js=r'''() => {
            const box=el=>{if(!el)return null;const r=el.getBoundingClientRect();return {l:r.left,w:r.width,h:r.height}};
            const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
            const dest=toolbar?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]')||null;
            const order=toolbar?.querySelector('.woocommerce-ordering')||null;
            const filter=document.querySelector('#toggle-sidebar-mobile-button,.emo-mobile-filter-toggle');
            const products=document.querySelector('ul.products');
            const da=dest?getComputedStyle(dest,'::after'):null;
            const oa=order?getComputedStyle(order,'::after'):null;
            const lastSvg=dest?.querySelector('svg:last-of-type')||null;
            return {
              toolbar:box(toolbar),filter:box(filter),products:box(products),
              overflow:document.documentElement.scrollWidth-innerWidth,
              count:products?products.querySelectorAll(':scope > li.product').length:0,
              ids:products?[...products.querySelectorAll(':scope > li.product')].slice(0,12).map(x=>x.className.match(/post-(\d+)/)?.[1]||null):[],
              cols:products?getComputedStyle(products).gridTemplateColumns:null,
              da:da?{w:da.width,h:da.height,right:da.right,transform:da.transform}:null,
              oa:oa?{w:oa.width,h:oa.height,right:oa.right,transform:oa.transform}:null,
              svg:lastSvg?getComputedStyle(lastSvg).visibility:null,
              mainStyle:!!document.getElementById('mdo-catalog-visual-parity-20260828'),
              refineStyle:!!document.getElementById('mdo-catalog-visual-parity-refinements-20260828')
            };
          }'''

          def close(a,b,t=1.25): return abs(float(a)-float(b)) <= t
          errors=[]; report={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              for width,height in sizes:
                  report[str(width)]={}
                  for kind,url in urls.items():
                      page.set_viewport_size({'width':width,'height':height})
                      page.goto(url,wait_until='networkidle',timeout=120000)
                      page.wait_for_timeout(1400)
                      d=page.evaluate(js); report[str(width)][kind]=d
                      base=baseline['pages'][kind][str(width)]
                      if d['ids'] != base['productIds'] or d['count'] != base['productCount']:
                          errors.append(f'{kind} {width}: catalogue products changed')
                      if d['overflow'] > 1: errors.append(f'{kind} {width}: horizontal overflow {d["overflow"]}')
                      if not d['mainStyle'] or not d['refineStyle']: errors.append(f'{kind} {width}: parity CSS missing')
                      if d['svg'] != 'hidden': errors.append(f'{kind} {width}: old destination chevron visible')
                      if not d['da'] or not d['oa'] or any(d['da'][k] != d['oa'][k] for k in ('w','h','right','transform')):
                          errors.append(f'{kind} {width}: chevrons differ {d["da"]} vs {d["oa"]}')
                  g=report[str(width)]['global']; v=report[str(width)]['producer']
                  for key in ('toolbar','products'):
                      if not (g[key] and v[key] and close(g[key]['l'],v[key]['l']) and close(g[key]['w'],v[key]['w'])):
                          errors.append(f'{width}: {key} geometry differs')
                  if width <= 1100:
                      if not (g['filter'] and v['filter'] and close(g['filter']['l'],v['filter']['l']) and close(g['filter']['w'],v['filter']['w']) and close(g['filter']['h'],v['filter']['h'])):
                          errors.append(f'{width}: filter geometry differs G={g["filter"]} V={v["filter"]}')
                  expected=1 if width<=640 else (2 if width<=900 else 4)
                  actual=len(v['cols'].split()) if v['cols'] and v['cols']!='none' else 0
                  if actual != expected: errors.append(f'{width}: producer columns {actual}, expected {expected}')
              browser.close()

          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:
              print('ERRORS:'); print('\n'.join('- '+e for e in errors)); sys.exit(1)
          print('CATALOG_VISUAL_PARITY_V2_VERIFIED=true')
          PY

      - name: Roll back both files on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          for NAME in zzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-20260828.php zzzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-refinements-20260828.php; do
            TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
            BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"
          done

      - name: Clean deployment backups
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f /tmp/zzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-20260828-backup-${GITHUB_RUN_ID}.php /tmp/zzzzzzzzzzzzzzzzz-mdo-catalog-visual-parity-refinements-20260828-backup-${GITHUB_RUN_ID}.php"

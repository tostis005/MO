name: Actions smoke 2026-08-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-smoke-20260818.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record Actions execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          printf 'actions_ok=true\nrun_id=%s\nverified_at=%s\n' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > runtime/actions-smoke-20260818.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/actions-smoke-20260818.txt
          git commit -m 'Record Actions smoke execution'
          git push origin HEAD:main

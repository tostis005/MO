name: Actions Smoke 2026-08-18

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/actions-smoke-20260818.yml'
      - 'runtime/mdo-mailtest-recipient-20260820.enc'

permissions:
  contents: write

jobs:
  wordpress-mail-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare secure channel or send mail
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass openssl >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PRIVATE_REMOTE="$HOME/.mdo-mailtest-private-20260820.pem"
          PUB='runtime/mdo-mailtest-public-20260820.pem'
          ENC='runtime/mdo-mailtest-recipient-20260820.enc'
          STATUS='runtime/mdo-mail-test-status-20260820.txt'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p runtime

          if [ ! -f "$PUB" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/mdo-mailtest-private.pem >/dev/null 2>&1
            openssl pkey -in /tmp/mdo-mailtest-private.pem -pubout -out "$PUB"
            sshpass -e scp $SCP_OPTIONS /tmp/mdo-mailtest-private.pem "$STAGING_USER@$STAGING_HOST:.mdo-mailtest-private-20260820.pem"
            sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "chmod 600 .mdo-mailtest-private-20260820.pem"
            rm -f /tmp/mdo-mailtest-private.pem
            git add "$PUB"
            git commit -m 'Prepare encrypted WordPress mail test recipient channel'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'STATUS=public_key_ready'
            exit 0
          fi

          if [ ! -f "$ENC" ]; then
            echo 'STATUS=waiting_for_encrypted_recipient'
            exit 0
          fi

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          ENC_REMOTE="/tmp/mdo-mailtest-recipient-${GITHUB_RUN_ID}.enc"
          EMAIL_REMOTE="/tmp/mdo-mailtest-recipient-${GITHUB_RUN_ID}.txt"
          PHP_REMOTE="/tmp/mdo-mailtest-send-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS "$ENC" "$STAGING_USER@$STAGING_HOST:$ENC_REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            test -f .mdo-mailtest-private-20260820.pem
            openssl pkeyutl -decrypt -inkey .mdo-mailtest-private-20260820.pem -in '$ENC_REMOTE' -out '$EMAIL_REMOTE'
            chmod 600 '$EMAIL_REMOTE'
          "

          cat > /tmp/mdo-mailtest-send.php <<PHP
          <?php
          \$recipient_file = '$EMAIL_REMOTE';
          \$to = strtolower(trim((string) @file_get_contents(\$recipient_file)));
          \$guard = 'mdo_mail_test_20260820_sent_v2';
          if (get_option(\$guard)) { echo "STATUS=already_sent\n"; return; }
          if (!is_email(\$to)) { echo "STATUS=invalid_recipient\n"; return; }
          \$mail_error = '';
          add_action('wp_mail_failed', static function (\$error) use (&\$mail_error) {
              if (is_wp_error(\$error)) \$mail_error = preg_replace('/[\\r\\n]+/', ' ', \$error->get_error_message());
          });
          \$subject = 'Propuesta de colaboración con El Mercado de Origen';
          \$body = '<p>Hola José,</p>'
              . '<p>Te escribo desde <strong>El Mercado de Origen</strong>, un marketplace en el que reunimos productos seleccionados de productores españoles y los acercamos directamente al consumidor.</p>'
              . '<p>Estamos empezando a trabajar con creadores y perfiles relacionados con gastronomía mediante un sistema de afiliación sencillo: cada colaborador dispone de su propio enlace y recibe una comisión por las compras que genere.</p>'
              . '<p>No hay compromiso de publicaciones ni exclusividad. La idea es que puedan recomendar productos concretos cuando encajen de forma natural con su contenido y obtener una comisión por las ventas que lleguen a través de sus recomendaciones.</p>'
              . '<p><strong>Este es un correo de prueba</strong> enviado directamente desde el sistema de correo de nuestra web para comprobar que el envío corporativo funciona correctamente.</p>'
              . '<p>Un saludo,<br><strong>El Mercado de Origen</strong><br>www.elmercadodeorigen.com</p>';
          \$ok = wp_mail(\$to, \$subject, \$body, ['Content-Type: text/html; charset=UTF-8']);
          if (!\$ok) {
              echo "STATUS=wp_mail_failed\n";
              if (\$mail_error) echo 'DETAIL=' . \$mail_error . "\n";
              return;
          }
          update_option(\$guard, gmdate('c'), false);
          echo "STATUS=sent\n";
          PHP

          sshpass -e scp $SCP_OPTIONS /tmp/mdo-mailtest-send.php "$STAGING_USER@$STAGING_HOST:$PHP_REMOTE"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$PHP_REMOTE' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$OUTPUT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$ENC_REMOTE' '$EMAIL_REMOTE' '$PHP_REMOTE' .mdo-mailtest-private-20260820.pem"
          printf 'checked_at=%s\n%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$OUTPUT" > "$STATUS"
          git add "$STATUS"
          git commit -m 'Record encrypted WordPress mail test result' || true
          git pull --rebase origin main
          git push origin HEAD:main

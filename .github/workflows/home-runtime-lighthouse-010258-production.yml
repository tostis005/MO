name: Home runtime Lighthouse 0.10.258 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-runtime-lighthouse-010258-production.yml'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Browser check and Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/ads-browser-010258.json
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(1200);
            const snap=()=>page.evaluate(()=>({
              scripts:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com')).map(s=>({src:s.src,delayed:s.dataset.elmercadoDelayed||''})),
              resources:performance.getEntriesByType('resource').filter(r=>r.name.includes('googletagmanager.com')).map(r=>r.name),
              marker:!!document.getElementById('elmercado-delayed-google-ads-source'),
              dataLayer:Array.isArray(window.dataLayer),
              queued:Array.isArray(window.dataLayer)?window.dataLayer.length:0
            }));
            const before=await snap();
            await page.mouse.wheel(0,500);
            await page.waitForTimeout(1800);
            const after=await snap();
            console.log(JSON.stringify({before,after},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr-010258.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          python3 - <<'PY' > runtime/home-runtime-lighthouse-010258.txt
          import json
          lhr=json.load(open('/tmp/lhr-010258.json'))
          a=lhr['audits']
          print('performance_score=',lhr['categories']['performance']['score'])
          print('--- browser Ads state ---')
          print(open('/tmp/ads-browser-010258.json').read().strip())
          print('--- metrics ---')
          for k in ('first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive','mainthread-work-breakdown','unused-javascript','render-blocking-resources'):
              x=a.get(k,{})
              print(f'{k}: numeric={x.get("numericValue")} display={x.get("displayValue")} score={x.get("score")}')
              if k in ('mainthread-work-breakdown','unused-javascript'):
                  items=((x.get('details') or {}).get('items') or [])[:20]
                  print(json.dumps(items,ensure_ascii=False,separators=(',',':')))
          print('--- forced reflow candidates ---')
          for key,x in a.items():
              if 'reflow' in key.lower() or 'forced' in key.lower():
                  print('AUDIT',key,'numeric=',x.get('numericValue'),'display=',x.get('displayValue'),'score=',x.get('score'))
                  items=((x.get('details') or {}).get('items') or [])[:30]
                  print(json.dumps(items,ensure_ascii=False,separators=(',',':')))
          print('--- LCP breakdown ---')
          for key in ('lcp-breakdown-insight','largest-contentful-paint-element'):
              x=a.get(key,{})
              print(key, json.dumps(x.get('details'),ensure_ascii=False,separators=(',',':'))[:8000])
          PY
          cat runtime/home-runtime-lighthouse-010258.txt
      - name: Record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-runtime-lighthouse-010258.txt ] || printf 'measurement_failed=true\n' > runtime/home-runtime-lighthouse-010258.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-runtime-lighthouse-010258.txt
          git commit -m 'Record final Home runtime Lighthouse 0.10.258' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

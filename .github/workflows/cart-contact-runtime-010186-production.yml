name: Cart contact runtime 0.10.186 production

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/inc/cart-checkout-contact-cleanup-010185.php'
      - '.github/workflows/cart-contact-runtime-010186-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: php -l elmercadodeorigen-child/inc/cart-checkout-contact-cleanup-010185.php

      - name: Deploy file
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/cart-contact-${GITHUB_RUN_ID}.php"
          timeout 45s sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/inc/cart-checkout-contact-cleanup-010185.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          timeout 120s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            TARGET='$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/cart-checkout-contact-cleanup-010185.php'
            BACKUP=\"\$HOME/cart-contact-backup-${GITHUB_RUN_ID}-\$(date +%Y%m%d%H%M%S).php\"
            cp \"\$TARGET\" \"\$BACKUP\"
            install -m 0644 '$REMOTE' \"\$TARGET\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l \"\$TARGET\"
            wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html' '$REMOTE'
          "

      - name: Verify Home, cart and contact script
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/cart-contact-verification.txt
          : > "$OUT"
          HOME_HTML="$(mktemp)"
          CART_HTML="$(mktemp)"
          CONTACT_HTML="$(mktemp)"
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HOME_HTML"
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/carrito/' -o "$CART_HTML"
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/contacto/?emo_runtime_check=010187' -o "$CONTACT_HTML"
          if grep -q 'elmercado-cart-contact-runtime-guard-010186' "$HOME_HTML"; then
            echo 'home_runtime=present' | tee -a "$OUT"
            exit 12
          fi
          echo 'home_runtime=absent' | tee -a "$OUT"
          python3 - "$CART_HTML" <<'PY' | tee -a "$OUT"
          import pathlib,re,subprocess,tempfile,os,sys
          html=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          m=re.search(r'<script[^>]*id=["\']elmercado-cart-contact-runtime-guard-010186["\'][^>]*>(.*?)</script>',html,re.I|re.S)
          if not m:
              print('cart_runtime=not_found')
              sys.exit(0)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
              f.write(m.group(1)); path=f.name
          p=subprocess.run(['node','--check',path],capture_output=True,text=True)
          os.unlink(path)
          print('cart_runtime=present')
          print('cart_js_syntax=' + ('ok' if p.returncode==0 else 'failure'))
          if p.returncode:
              print((p.stderr or p.stdout)[:1200]); sys.exit(13)
          PY
          if ! grep -q 'elmercado-cart-contact-runtime-guard-010186' "$CONTACT_HTML"; then
            echo 'contact_runtime=not_found' | tee -a "$OUT"
            exit 14
          fi
          if ! grep -Fq "main .wpcf7, #primary .wpcf7, .site-main .wpcf7, article .wpcf7, .wpcf7" "$CONTACT_HTML"; then
            echo 'contact_trim_logic=stale' | tee -a "$OUT"
            exit 15
          fi
          echo 'contact_runtime=present' | tee -a "$OUT"
          echo 'contact_trim_logic=current' | tee -a "$OUT"

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'deploy=%s\n' '${{ steps.deploy.outcome }}'
            printf 'verify=%s\n' '${{ steps.verify.outcome }}'
            [ ! -f /tmp/cart-contact-verification.txt ] || cat /tmp/cart-contact-verification.txt
          } > runtime/cart-contact-runtime-010186.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/cart-contact-runtime-010186.txt
          git commit -m 'Record cart contact runtime verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Production shop/blog content 0.10.254

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-shop-blog-content-010254.yml'
      - 'mu-plugins/mdo-shop-blog-content-010254.php'
      - 'scripts/blog-shop-content-010254.cjs'

permissions:
  contents: read

concurrency:
  group: elmercado-production-content-010254
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          test -f mu-plugins/mdo-shop-blog-content-010254.php
          test -f scripts/blog-shop-content-010254.cjs
          php -l mu-plugins/mdo-shop-blog-content-010254.php
          grep -q 'embutidos-y-curados' mu-plugins/mdo-shop-blog-content-010254.php
          grep -q 'INTRODUCCI' mu-plugins/mdo-shop-blog-content-010254.php
          grep -q 'mdo-remove-catalog-lead-010254' mu-plugins/mdo-shop-blog-content-010254.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node -e "require('puppeteer-core'); console.log('PUPPETEER_OK')"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage hotfix
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/mdo-shop-blog-010254-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP'"
          sshpass -e rsync -az -e "ssh $SSH_OPTIONS" mu-plugins/mdo-shop-blog-content-010254.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/mdo-shop-blog-content-010254.php"

      - name: Backup and deploy production hotfix
        id: release
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve WordPress root.' >&2; exit 1; }
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          target_dir="$prod/wp-content/mu-plugins"
          target="$target_dir/mdo-shop-blog-content-010254.php"
          [ -f "$prod/wp-config.php" ] || { echo 'Production root invalid.' >&2; exit 1; }
          mkdir -p "$target_dir"

          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -x "$php_bin" ] && [ -n "$wp_bin" ] || { echo 'PHP/WP-CLI unavailable.' >&2; exit 1; }
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing deploy: siteurl=$siteurl" >&2; exit 1 ;; esac

          "$php_bin" -l "$incoming/mdo-shop-blog-content-010254.php" >/dev/null
          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          short_commit="$(printf '%.10s' "$commit")"
          backup_dir="$rollback_root/$(date -u +%Y%m%dT%H%M%SZ)-before-shop-blog-010254-$short_commit"
          mkdir -p "$backup_dir"
          existed=no
          if [ -f "$target" ]; then
            cp "$target" "$backup_dir/mdo-shop-blog-content-010254.php"
            existed=yes
          fi
          printf '%s\n' "$existed" > "$backup_dir/existed.txt"
          printf '%s\n' "$commit" > "$backup_dir/release-sha.txt"

          deployed=0
          rollback_on_error() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$deployed" -eq 1 ]; then
              if [ "$existed" = yes ]; then cp "$backup_dir/mdo-shop-blog-content-010254.php" "$target"; else rm -f "$target"; fi
              "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap rollback_on_error EXIT

          cp "$incoming/mdo-shop-blog-content-010254.php" "$target"
          deployed=1
          "$php_bin" -l "$target" >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true

          base="${siteurl%/}"
          code="$(curl -ksS -L -o /tmp/mdo-shop-010254 -w '%{http_code}' --max-time 35 "$base/tienda/?release=$commit" || true)"
          [ "$code" = 200 ] || { echo "Shop HTTP $code" >&2; exit 1; }
          grep -q 'mdo-hide-catalog-lead-010254' /tmp/mdo-shop-010254
          ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error on this website' /tmp/mdo-shop-010254

          trap - EXIT
          printf '__SITEURL__=%s\n' "$siteurl"
          printf '__PROD__=%s\n' "$prod"
          printf '__TARGET__=%s\n' "$target"
          printf '__BACKUP_DIR__=%s\n' "$backup_dir"
          printf '__EXISTED__=%s\n' "$existed"
          REMOTE
          )"
          printf '%s\n' "$OUT"
          SITEURL="$(printf '%s\n' "$OUT" | sed -n 's/^__SITEURL__=//p' | tail -n1)"
          PROD="$(printf '%s\n' "$OUT" | sed -n 's/^__PROD__=//p' | tail -n1)"
          TARGET="$(printf '%s\n' "$OUT" | sed -n 's/^__TARGET__=//p' | tail -n1)"
          BACKUP_DIR="$(printf '%s\n' "$OUT" | sed -n 's/^__BACKUP_DIR__=//p' | tail -n1)"
          EXISTED="$(printf '%s\n' "$OUT" | sed -n 's/^__EXISTED__=//p' | tail -n1)"
          test -n "$SITEURL" && test -n "$PROD" && test -n "$TARGET" && test -n "$BACKUP_DIR" && test -n "$EXISTED"
          echo "PRODUCTION_SITEURL=$SITEURL" >> "$GITHUB_ENV"
          echo "PRODUCTION_ROOT=$PROD" >> "$GITHUB_ENV"
          echo "PRODUCTION_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "PRODUCTION_BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"
          echo "PRODUCTION_TARGET_EXISTED=$EXISTED" >> "$GITHUB_ENV"

      - name: Browser QA on production
        shell: bash
        run: |
          set -euo pipefail
          node scripts/blog-shop-content-010254.cjs

      - name: Release success
        run: echo 'shop_blog_content_010254_ok'

      - name: Roll back hotfix on failure
        if: failure() && steps.release.outcome == 'success'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PRODUCTION_ROOT' '$PRODUCTION_TARGET' '$PRODUCTION_BACKUP_DIR' '$PRODUCTION_TARGET_EXISTED'" <<'REMOTE'
          set -eu
          prod="$1"; target="$2"; backup_dir="$3"; existed="$4"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          if [ "$existed" = yes ]; then
            cp "$backup_dir/mdo-shop-blog-content-010254.php" "$target"
          else
            rm -f "$target"
          fi
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true
          echo 'rollback_complete'
          REMOTE

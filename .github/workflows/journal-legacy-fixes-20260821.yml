name: Journal English and legacy fixes 20260821

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-english-journal-content-20260821.php'
      - '.github/scripts/cleanup-legacy-journal-20260821.php'
      - '.github/workflows/journal-legacy-fixes-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-legacy-fixes-20260821
  cancel-in-progress: false

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-english-journal-content-20260821.php
          php -l .github/scripts/cleanup-legacy-journal-20260821.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy plugin and clean legacy articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-english-journal-content-20260821.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-journal-content-20260821.php"

          REMOTE="/tmp/cleanup-legacy-journal-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/cleanup-legacy-journal-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" | tee /tmp/journal-cleanup.json
          python3 -m json.tool /tmp/journal-cleanup.json >/dev/null
          test "$(python3 -c "import json; print(len(json.load(open('/tmp/journal-cleanup.json'))['posts']))")" -eq 2
          test "$(python3 -c "import json; d=json.load(open('/tmp/journal-cleanup.json')); print(sum(int(p['title_has_markup'])+int(p['en_title_has_markup'])+int(p['es_promo_mentions'])+int(p['en_promo_mentions']) for p in d['posts']))")" -eq 0
          cp /tmp/journal-cleanup.json journal-cleanup.json

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public Journal pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.elmercadodeorigen.com"
          STAMP="${GITHUB_RUN_ID}"

          curl_page() {
            local url="$1" out="$2"
            local sep='?'
            [[ "$url" == *\?* ]] && sep='&'
            code="$(curl -k -L -sS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 -A 'Mozilla/5.0 EMDO Journal verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$out" -w '%{http_code}' "${url}${sep}emdo_journal_verify=${STAMP}")"
            test "$code" = "200"
          }

          curl_page "$BASE/blog/" /tmp/blog-es.html
          curl_page "$BASE/en/journal/" /tmp/blog-en.html

          python3 - <<'PY'
          import html,json
          data=json.load(open('journal-cleanup.json',encoding='utf-8'))
          es=html.unescape(open('/tmp/blog-es.html',encoding='utf-8',errors='ignore').read())
          en=html.unescape(open('/tmp/blog-en.html',encoding='utf-8',errors='ignore').read())
          for p in data['posts']:
              assert p['title'] in es, (p['slug'],'missing ES title')
              assert p['en_title'] in en, (p['en_slug'],'missing EN title')
              assert '<' not in p['title'] and '&lt;' not in p['title'].lower()
              assert '<' not in p['en_title'] and '&lt;' not in p['en_title'].lower()
          PY

          python3 - <<'PY'
          import json,subprocess
          data=json.load(open('journal-cleanup.json',encoding='utf-8'))
          base='https://www.elmercadodeorigen.com'
          for p in data['posts']:
              urls=[f"{base}/{p['slug']}/"]
              if p['en_slug']:
                  urls.append(f"{base}/en/{p['en_slug']}/")
              for i,url in enumerate(urls):
                  out=f"/tmp/legacy-{p['id']}-{i}.html"
                  subprocess.check_call(['curl','-k','-L','-sS','--retry','3','--retry-delay','2','-H','Cache-Control: no-cache','-o',out,url+'?emdo_journal_verify=legacy'])
          PY

          python3 - <<'PY'
          import glob,html,re
          promo=re.compile(r'cup[oó]n|coupon|c[oó]digo\s+(?:de\s+)?(?:descuento|promocional)|discount\s+code|promo(?:tional)?\s+code|(?:usa|usar|utiliza|utilizar|introduce)\s+(?:el\s+)?c[oó]digo|(?:use|enter|apply)\s+(?:the\s+)?(?:code|coupon)',re.I)
          for path in glob.glob('/tmp/legacy-*.html'):
              body=open(path,encoding='utf-8',errors='ignore').read()
              m=re.search(r'class=["\'][^"\']*emo-article-content[^"\']*["\'][^>]*>(.*?)<footer\b[^>]*class=["\'][^"\']*emo-article-footer',body,re.I|re.S)
              article=m.group(1) if m else body
              text=html.unescape(re.sub(r'<[^>]+>',' ',article))
              assert not promo.search(text), (path,'promotional coupon text remains')
          PY

          urls=(
            "$BASE/en/ham-or-shoulder-differences-how-to-choose/"
            "$BASE/en/whole-ham-or-sliced-how-to-choose-format/"
            "$BASE/en/extra-virgin-olive-oil-5-litre-container-storage-guide/"
            "$BASE/en/buying-meat-online-what-to-check-before-choosing-a-cut/"
            "$BASE/en/seasonal-vegetables-how-to-choose-better/"
            "$BASE/en/dried-pulses-soaking-cooking-how-to-choose/"
          )
          n=0
          for url in "${urls[@]}"; do
            out="/tmp/en-guide-$n.html"; n=$((n+1)); curl_page "$url" "$out"
            if grep -Fq '[products ' "$out"; then echo "Raw products shortcode remains at $url" >&2; exit 7; fi
            grep -Eq '<li\b[^>]*class=["\'][^"\']*\bproduct\b' "$out"
          done

          echo 'EMDO_JOURNAL_LEGACY_FIX_PUBLIC_VERIFY_OK'

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os,pathlib
          cleanup=json.load(open('journal-cleanup.json',encoding='utf-8'))
          payload={
            'release':'20260821-journal-legacy-fixes',
            'verified':True,
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'source_sha':os.environ.get('GITHUB_SHA',''),
            'english_guides_with_products_verified':6,
            'legacy_articles_cleaned':len(cleanup.get('posts',[])),
            'legacy_posts':cleanup.get('posts',[]),
          }
          pathlib.Path('.deploy-status/journal-legacy-fixes-20260821.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/journal-legacy-fixes-20260821.json
          git commit -m 'Record verified Journal legacy fixes [skip ci]'
          git push origin HEAD:main

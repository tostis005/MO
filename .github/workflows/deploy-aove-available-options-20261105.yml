name: Deploy 2026/27 AOVE purchasable-only selectors
on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/emdo-aove-2026-available-options.php'
      - 'tests/seo-aove-available-options-20261105.php'
      - '.github/workflows/deploy-aove-available-options-20261105.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: emdo-2026-aove-dropdowns
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/emdo-aove-2026-available-options.php
          php tests/seo-aove-available-options-20261105.php
      - name: Install scoped MU plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass python3-bs4 >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          DEST="$ROOT/wp-content/mu-plugins/emdo-aove-2026-available-options.php"
          TMP="/tmp/aove-options-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP mu-plugins/emdo-aove-2026-available-options.php "$STAGING_USER@$STAGING_HOST:$TMP"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -eu
            test -f '$ROOT/wp-config.php'
            /opt/plesk/php/8.2/bin/php -l '$TMP' >/dev/null
            if test -e '$DEST'; then
              if cmp -s '$DEST' '$TMP'; then echo AOVE_OPTIONS_ALREADY_INSTALLED; else echo 'ABORT_UNKNOWN_AOVE_OPTIONS_PLUGIN';exit 9;fi
            else
              install -m 0644 '$TMP' '$DEST'
              echo AOVE_OPTIONS_INSTALLED
            fi
          "
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$TMP'" || true
      - name: Validate live selectors and additional-info table
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import urllib.request
          urls={
            '5l':('cosecha-26-27-sin-filtrar-aceite-de-oliva-virgen-extra-5l-extraccion-en-frio/',2,3),
            '15l':('sin-filtrar-nueva-campana-26-27-aceite-de-oliva-virgen-extra-15x1l/',1,3),
            '500ml':('aceite-de-oliva-virgen-extra-12x500ml-pet-sin-filtrar-nueva-campana-26-27/',1,3),
          }
          for label,(slug,expected_sizes,expected_varieties) in urls.items():
              url='https://www.elmercadodeorigen.com/producto/'+slug+'?aove_options_verify=${GITHUB_RUN_ID}'
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 AOVE-SEO-QA'})
              with urllib.request.urlopen(req,timeout=75) as response:
                  assert response.status==200
                  soup=BeautifulSoup(response.read(),'html.parser')
              options={}
              for attr in ('pa_tamano','pa_variedad'):
                  sel=soup.find('select',attrs={'name':'attribute_'+attr})
                  assert sel is not None,(label,attr,'selector missing')
                  options[attr]=[o.get('value','') for o in sel.find_all('option') if o.get('value','')]
              assert len(options['pa_tamano'])==expected_sizes,(label,'unexpected sizes',options)
              assert len(options['pa_variedad'])==expected_varieties,(label,'unexpected varieties',options)
              info=soup.get_text(' ',strip=True)
              assert 'DE NUEVA CAMPAÑA 23/24' not in info,(label,'old campaign text remains')
              print('AOVE_OPTIONS_PUBLIC_OK',label,options)
          PY

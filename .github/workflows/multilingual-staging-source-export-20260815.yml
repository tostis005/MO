name: Export staging source strings 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/multilingual-staging-source-export-20260815.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          python -m pip install --quiet beautifulsoup4 requests
      - name: Build staging URL manifest
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to find staging WordPress path}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' bash -s" > /tmp/manifest.json <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$WP_PATH" --allow-root eval '
            $site = get_option("siteurl");
            if (strpos((string)$site,"https://dev.elmercadodeorigen.com") !== 0) { exit(2); }
            $out = ["pages"=>[],"products1957"=>[]];
            foreach (get_posts(["post_type"=>"page","post_status"=>"publish","posts_per_page"=>-1,"orderby"=>"ID","order"=>"ASC"]) as $p) {
              $out["pages"][] = ["id"=>$p->ID,"title"=>$p->post_title,"slug"=>$p->post_name,"url"=>get_permalink($p)];
            }
            foreach (get_posts(["post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"author"=>3,"orderby"=>"ID","order"=>"ASC"]) as $p) {
              $out["products1957"][] = ["id"=>$p->ID,"title"=>$p->post_title,"slug"=>$p->post_name,"url"=>get_permalink($p)];
            }
            echo json_encode($out, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          ' 2>/dev/null
          REMOTE
          python -m json.tool /tmp/manifest.json > /tmp/manifest.pretty.json
          cat /tmp/manifest.pretty.json
      - name: Fetch and extract visible source strings
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/data/native-source-20260815
          mkdir -p .github/data/native-source-20260815/pages .github/data/native-source-20260815/products-1957
          cp /tmp/manifest.pretty.json .github/data/native-source-20260815/manifest.json
          python - <<'PY'
          import json, os, re, html
          import requests
          from bs4 import BeautifulSoup, Comment
          requests.packages.urllib3.disable_warnings()
          manifest=json.load(open('/tmp/manifest.json',encoding='utf-8'))
          session=requests.Session()
          session.headers.update({'User-Agent':'MDO staging translation source export'})
          def norm(s):
              s=html.unescape(str(s))
              s=re.sub(r'\s+',' ',s).strip()
              return s
          def extract(url):
              sep='&' if '?' in url else '?'
              r=session.get(url+sep+'mdo_native_source=1',timeout=45,verify=False,headers={'Cache-Control':'no-cache'})
              r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              for tag in soup(['script','style','noscript','svg','path','template']): tag.decompose()
              vals=[]
              for node in soup.find_all(string=True):
                  if isinstance(node, Comment): continue
                  v=norm(node)
                  if v: vals.append(v)
              for tag in soup.find_all(True):
                  for attr in ('alt','title','placeholder','aria-label'):
                      if tag.has_attr(attr):
                          v=norm(tag.get(attr,''))
                          if v: vals.append(v)
                  if tag.name in ('input','button') and tag.has_attr('value'):
                      v=norm(tag.get('value',''))
                      if v: vals.append(v)
              # Preserve first-seen order and exclude obvious machine-only blobs.
              seen=set(); out=[]
              for v in vals:
                  if v in seen: continue
                  seen.add(v)
                  if len(v)>1200: continue
                  if re.fullmatch(r'[\W_]+',v): continue
                  out.append(v)
              return out, r.status_code
          for group,folder in [('pages','pages'),('products1957','products-1957')]:
              for item in manifest[group]:
                  strings,status=extract(item['url'])
                  fn=f"{item['id']}-{item['slug']}.txt"
                  path=os.path.join('.github/data/native-source-20260815',folder,fn)
                  with open(path,'w',encoding='utf-8') as f:
                      f.write(f"# ID: {item['id']}\n# TITLE: {item['title']}\n# URL: {item['url']}\n# HTTP: {status}\n")
                      for s in strings: f.write(s+'\n')
                  print(group,item['id'],item['title'],len(strings))
          PY
      - name: Commit source export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/data/native-source-20260815
          if git diff --cached --quiet; then
            echo 'No source export changes'
          else
            git commit -m 'Export staging source strings for reviewed English translations'
            git push
          fi

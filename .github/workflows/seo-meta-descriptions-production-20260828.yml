name: Deploy SEO meta descriptions production 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-meta-descriptions-production-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP sources
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/functions.php >/dev/null
          php -l elmercadodeorigen-child/inc/seo-meta-descriptions-010265.php >/dev/null

      - name: Discover production and deploy SEO files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "PROD=$PROD" >> "$GITHUB_ENV"

          THEME="$PROD/wp-content/themes/elmercadodeorigen-child"
          BACKUP="/tmp/mdo-seo-meta-${GITHUB_RUN_ID}"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$BACKUP/inc'"

          deploy_file() {
            local rel="$1"
            local src="elmercadodeorigen-child/$rel"
            local target="$THEME/$rel"
            local remote="/tmp/$(basename "$rel").${GITHUB_RUN_ID}"
            local backup="$BACKUP/$rel"
            local backup_dir
            backup_dir="$(dirname "$backup")"

            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$backup_dir'; if [ -f '$target' ]; then cp -p '$target' '$backup'; else : > '$backup.absent'; fi"
            sshpass -e scp $SCP "$src" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$remote' >/dev/null; mkdir -p \"\$(dirname '$target')\"; install -m0644 '$remote' '$target'; rm -f '$remote'"
          }

          deploy_file 'functions.php'
          deploy_file 'inc/seo-meta-descriptions-010265.php'

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD' --allow-root >/dev/null 2>&1 || true"

      - name: Verify live meta descriptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          import time

          urls = {
              'product': 'https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?seo_meta_v265=1',
              'article': 'https://www.elmercadodeorigen.com/como-leer-etiqueta-aceite-oliva/?seo_meta_v265=1',
          }

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.descriptions = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  data = {k.lower(): v for k, v in attrs if k}
                  if (data.get('name') or '').lower() == 'description':
                      self.descriptions.append(data.get('content') or '')

          errors = []
          for kind, url in urls.items():
              last_error = None
              for attempt in range(6):
                  try:
                      req = Request(url + f'&attempt={attempt}', headers={'User-Agent': 'Mozilla/5.0 SEO verification'})
                      html = urlopen(req, timeout=30).read().decode('utf-8', 'replace')
                      parser = MetaParser(); parser.feed(html)
                      descs = [d.strip() for d in parser.descriptions]
                      if len(descs) != 1:
                          raise RuntimeError(f'{kind}: expected 1 meta description, found {len(descs)}')
                      desc = descs[0]
                      if len(desc) < 120:
                          raise RuntimeError(f'{kind}: meta description too short ({len(desc)} chars): {desc}')
                      print(f'{kind}: {len(desc)} chars | {desc}')
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2)
              if last_error:
                  errors.append(str(last_error))

          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Roll back SEO files if verification fails
        if: failure() && env.PROD != '' && env.BACKUP != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          THEME="$PROD/wp-content/themes/elmercadodeorigen-child"

          restore_file() {
            local rel="$1"
            local backup="$BACKUP/$rel"
            local target="$THEME/$rel"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$backup' ]; then install -m0644 '$backup' '$target'; elif [ -f '$backup.absent' ]; then rm -f '$target'; fi"
          }

          restore_file 'functions.php'
          restore_file 'inc/seo-meta-descriptions-010265.php'
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"

name: Apply Fuenteoliva product copy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuenteoliva-products-production.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate copy data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='.github/data/fuenteoliva-products-copy-20260831.json'
          d=json.load(open(p,encoding='utf-8'))
          assert set(d)=={'1056','1220','1599'}
          for k,v in d.items():
              assert v['title'] and v['slug']
              assert 'Sobre 1957' in v['es_content']
              assert 'About 1957' in v['en_content']
              assert 'Preguntas frecuentes' in v['es_content']
              assert 'Frequently asked questions' in v['en_content']
          print('COPY_DATA_OK products=3')
          PY
      - name: Apply guarded update
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac; done')"
          : "${PROD_PATH:?production path not found}"
          DATA=/tmp/fuenteoliva-copy-${GITHUB_RUN_ID}.json
          PHP=/tmp/fuenteoliva-update-${GITHUB_RUN_ID}.php
          sshpass -e scp $SCP_OPTIONS .github/data/fuenteoliva-products-copy-20260831.json "$STAGING_USER@$STAGING_HOST:$DATA"
          cat > /tmp/fuenteoliva-update.php <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit(1);
          global $wpdb;
          $file=getenv('EMDO_COPY_FILE');
          $data=json_decode(file_get_contents($file),true);
          if(!is_array($data)||count($data)!==3) throw new Exception('Invalid copy data');
          $backup=[];
          foreach($data as $id=>$v){
            $id=(int)$id; $p=get_post($id);
            if(!$p||$p->post_type!=='product'||$p->post_status!=='publish') throw new Exception("Missing product $id");
            if($p->post_title!==$v['title']||$p->post_name!==$v['slug']) throw new Exception("Identity mismatch $id");
            $u=get_userdata((int)$p->post_author); if(!$u||(string)$u->display_name!=='1957') throw new Exception("Vendor mismatch $id");
            if(get_post_meta($id,'_stock_status',true)!=='instock') throw new Exception("Stock mismatch $id");
            $backup[$id]=['post_excerpt'=>$p->post_excerpt,'post_content'=>$p->post_content,'en_excerpt'=>get_post_meta($id,'_en_US_post_excerpt',true),'en_content'=>get_post_meta($id,'_en_US_post_content',true)];
          }
          $key='mo_fuenteoliva_products_copy_backup_20260831';
          if(get_option($key,false)===false){add_option($key,$backup,'','no');echo "BACKUP created $key\n";}else{echo "BACKUP exists $key\n";}
          foreach($data as $id=>$v){
            $id=(int)$id;
            $r=wp_update_post(['ID'=>$id,'post_excerpt'=>$v['es_excerpt'],'post_content'=>$v['es_content']],true);
            if(is_wp_error($r)) throw new Exception("Update failed $id");
            update_post_meta($id,'_en_US_post_excerpt',$v['en_excerpt']);
            update_post_meta($id,'_en_US_post_content',$v['en_content']);
            clean_post_cache($id);
            $p=get_post($id); $en=(string)get_post_meta($id,'_en_US_post_content',true);
            if(strpos($p->post_content,'Sobre 1957')===false||strpos($p->post_content,'Preguntas frecuentes')===false) throw new Exception("ES verify failed $id");
            if(strpos($en,'About 1957')===false||strpos($en,'Frequently asked questions')===false) throw new Exception("EN verify failed $id");
            echo "UPDATED_AND_VERIFIED ID=$id {$v['title']}\n";
          }
          echo "DONE fuenteoliva_products=3\n";
          PHP
          sshpass -e scp $SCP_OPTIONS /tmp/fuenteoliva-update.php "$STAGING_USER@$STAGING_HOST:$PHP"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); EMDO_COPY_FILE='$DATA' \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$PHP' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$PHP' '$DATA'; exit \$rc"
          rm -f /tmp/fuenteoliva-update.php
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify six public pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(aceite-de-oliva-virgen-extra-5l aceite-de-oliva-virgen-extra-1l aceite-de-oliva-virgen-extra-500ml-pet)
          es=('AOVE en garrafa de 5 litros' 'Pack de 15 botellas de 1 litro' 'Doce botellas de 500 ml de AOVE')
          en=('EVOO in a 5-litre container' 'Pack of fifteen 1-litre bottles' 'Twelve 500 ml bottles of EVOO')
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"; a=/tmp/es-$i.html; b=/tmp/en-$i.html
            esc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO Fuenteoliva verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$a" "https://www.elmercadodeorigen.com/producto/${s}/?emdo_fuente_es=${GITHUB_RUN_ID}-${i}")
            enc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO Fuenteoliva verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$b" "https://www.elmercadodeorigen.com/en/product/${s}/?emdo_fuente_en=${GITHUB_RUN_ID}-${i}")
            esok=yes; enok=yes
            grep -Fq "${es[$i]}" "$a" || esok=no
            grep -Fq 'Sobre 1957' "$a" || esok=no
            grep -Fq 'Preguntas frecuentes' "$a" || esok=no
            grep -Fq "${en[$i]}" "$b" || enok=no
            grep -Fq 'About 1957' "$b" || enok=no
            grep -Fq 'Frequently asked questions' "$b" || enok=no
            if grep -Fq 'Sobre 1957' "$b" || grep -Fq 'Preguntas frecuentes' "$b"; then enok=no; fi
            status=OK
            if [[ "$esc" != 200 || "$enc" != 200 || "$esok" != yes || "$enok" != yes ]]; then status=FAIL; failures=$((failures+1)); fi
            echo "VERIFY slug=$s ES_HTTP=$esc ES=$esok EN_HTTP=$enc EN=$enok STATUS=$status"
          done
          echo "FUENTEOLIVA_PUBLIC_FAILURES=$failures"
          [[ "$failures" -eq 0 ]]

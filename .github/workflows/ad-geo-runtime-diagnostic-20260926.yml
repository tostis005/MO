name: Diagnose production geo runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ad-geo-runtime-diagnostic-20260926.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect WooCommerce geolocation runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?}"
          echo "PROD_PATH=$prod_path"
          echo "WC_PLUGIN=$prod_path/wp-content/plugins/woocommerce"
          find "$prod_path/wp-content" -type f \( -name 'GeoLite2-Country.mmdb' -o -name '*.mmdb' \) -print -exec ls -lh {} \; 2>/dev/null | head -30 || true
          find "$prod_path/wp-content/plugins/woocommerce" -maxdepth 4 -type f -path '*/vendor/autoload.php' -print 2>/dev/null | head -10 || true
          "$php_bin" -d memory_limit=256M "$wp_bin" eval --path="$prod_path" --allow-root '
            echo "WC_VERSION=" . (defined("WC_VERSION") ? WC_VERSION : "missing") . "\n";
            if (class_exists("WC_Geolocation")) {
              echo "GEO_CLASS=yes\n";
              foreach (get_class_methods("WC_Geolocation") as $m) if (stripos($m,"database")!==false || stripos($m,"geo")!==false) echo "METHOD=$m\n";
              if (method_exists("WC_Geolocation","get_local_database_path")) echo "WC_DB=" . WC_Geolocation::get_local_database_path() . "\n";
              echo "COUNTRY=" . (WC_Geolocation::geolocate_ip()["country"] ?? "") . "\n";
            }
          ' 2>/dev/null

          "$php_bin" -r '
            $root=$argv[1];
            require $root . "/wp-content/plugins/woocommerce/vendor/autoload.php";
            $db=$root . "/wp-content/plugins/wordfence/lib/geoip.mmdb";
            $r=new GeoIp2\\Database\\Reader($db);
            foreach (["8.8.8.8","1.1.1.1","41.0.0.1"] as $ip) {
              try { echo "TEST_IP=".$ip." COUNTRY=".$r->country($ip)->country->isoCode."\n"; }
              catch (Throwable $e) { echo "TEST_IP=".$ip." ERROR=".$e->getMessage()."\n"; }
            }
          ' "$prod_path"
          REMOTE

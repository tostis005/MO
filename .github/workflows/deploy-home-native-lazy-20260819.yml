name: Deploy Home native lazy loading 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-native-lazy-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-home-native-lazy-20260819
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Validate PHP
        run: php -l mu-plugins/mdo-home-performance-20260819.php

      - name: Deploy MU plugin and rebuild Home cache
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/mdo-home-native-lazy-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP mu-plugins/mdo-home-performance-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            MU='$PROD_PATH/wp-content/mu-plugins'
            STATIC='$PROD_PATH/wp-content/uploads/elmercado-home-static'
            install -m 0644 '$REMOTE' \"\$MU/mdo-home-performance-20260819.php\"
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$MU/mdo-home-performance-20260819.php\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f \"\$STATIC/index.html\" \"\$STATIC\"/home-deferred-*.css '$REMOTE'
          "
          for i in 1 2 3 4; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html; done
          grep -q 'loading="lazy"' /tmp/home.html
          ! grep -q 'smush-lazy-load-native.min.js' /tmp/home.html
          ! grep -Eq '<img[^>]+data-src=' /tmp/home.html
          ! grep -Eq '<img[^>]+src="data:image/gif;base64' /tmp/home.html

      - name: Browser full-page image verification
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > /tmp/native-lazy-browser.json
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle2',timeout:60000});
            await page.evaluate(async()=>{
              for(let y=0;y<document.documentElement.scrollHeight;y+=650){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,80));}
              window.scrollTo(0,document.documentElement.scrollHeight);
            });
            await new Promise(r=>setTimeout(r,1200));
            const data=await page.evaluate(()=>{
              const imgs=[...document.images];
              const visible=imgs.filter(img=>{const s=getComputedStyle(img),r=img.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>1&&r.height>1;});
              return {
                imageCount:imgs.length,
                visibleCount:visible.length,
                brokenVisible:visible.filter(img=>img.complete&&img.naturalWidth===0).map(img=>({src:img.src,alt:img.alt,className:img.className})),
                dataSrcCount:document.querySelectorAll('img[data-src]').length,
                lazyClassCount:document.querySelectorAll('img.lazyload,img.lazyloading').length,
                placeholderCount:imgs.filter(img=>img.src.startsWith('data:image/gif;base64')).length,
                smushRuntime:!![...document.scripts].find(s=>(s.src||'').includes('smush-lazy-load-native')),
                productImages:[...document.querySelectorAll('img.elmercado-catalog-card-image-010241')].map(img=>({src:img.src,currentSrc:img.currentSrc,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,sizes:img.sizes,loading:img.loading})),
                payment:[...document.querySelectorAll('img.metodosPago')].map(img=>({src:img.src,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,loading:img.loading})),
                vendorLogos:[...document.querySelectorAll('img.wcfmmp_sold_by_logo')].slice(0,10).map(img=>({src:img.src,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,loading:img.loading}))
              };
            });
            console.log(JSON.stringify(data,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 - <<'PY' > runtime/home-native-lazy-20260819.txt
          import json
          d=json.load(open('/tmp/native-lazy-browser.json'))
          print('deploy=success')
          for k in ('imageCount','visibleCount','dataSrcCount','lazyClassCount','placeholderCount','smushRuntime'):
              print(k,'=',d[k])
          print('brokenVisible=',json.dumps(d['brokenVisible'],ensure_ascii=False))
          print('productImages=',json.dumps(d['productImages'],ensure_ascii=False))
          print('payment=',json.dumps(d['payment'],ensure_ascii=False))
          print('vendorLogos=',json.dumps(d['vendorLogos'],ensure_ascii=False))
          assert d['dataSrcCount']==0
          assert d['lazyClassCount']==0
          assert d['placeholderCount']==0
          assert not d['smushRuntime']
          assert not d['brokenVisible']
          assert d['productImages'] and all(x['naturalWidth']>0 for x in d['productImages'])
          PY
          cat runtime/home-native-lazy-20260819.txt

      - name: Lighthouse 3x normal Home
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do
            npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/native-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          done
          python3 - <<'PY' >> runtime/home-native-lazy-20260819.txt
          import json,statistics
          rows=[]
          for i in (1,2,3):
              a=json.load(open(f'/tmp/native-{i}.json')); x=a['audits']
              boot=x.get('bootup-time',{}); smush=0
              for item in (boot.get('details') or {}).get('items',[]):
                  if 'smush-lazy-load-native' in item.get('url',''): smush += item.get('total',0) or 0
              reflow=x.get('forced-reflow-insight',{}); theme=0
              for group in (reflow.get('details') or {}).get('items',[]):
                  for item in group.get('items',[]):
                      src=item.get('source') or {}; url=src.get('url','') if isinstance(src,dict) else ''
                      if '/assets/js/theme.js' in url: theme += item.get('reflowTime',0) or 0
              r={
                'score':round(a['categories']['performance']['score']*100),
                'fcp':round(x['first-contentful-paint']['numericValue']),
                'lcp':round(x['largest-contentful-paint']['numericValue']),
                'tbt':round(x['total-blocking-time']['numericValue']),
                'cls':x['cumulative-layout-shift']['numericValue'],
                'smush_cpu':round(smush,1),
                'theme_reflow':round(theme,3),
              }
              rows.append(r); print('run',i,r)
          for k in rows[0]: print('median_'+k+'=',statistics.median(r[k] for r in rows))
          a=json.load(open('/tmp/native-2.json'))['audits']
          for key in ('image-delivery-insight','cache-insight','legacy-javascript-insight','unused-javascript','unused-css-rules','mainthread-work-breakdown','bootup-time'):
              v=a.get(key,{})
              print('audit',key,'score=',v.get('score'),'display=',v.get('displayValue'),'numeric=',v.get('numericValue'))
          assert all(r['smush_cpu']==0 for r in rows), rows
          assert all(r['theme_reflow']==0 for r in rows), rows
          PY
          cat runtime/home-native-lazy-20260819.txt

      - name: Record result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-native-lazy-20260819.txt ] || echo 'verification_failed=true' > runtime/home-native-lazy-20260819.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-native-lazy-20260819.txt
          git commit -m 'Record Home native lazy-load verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Read SEO deployment status 20261025
# Refresh results after PHP-FPM OPCache invalidation change.
# Refresh status after WP-CLI memory hotfix PR #385.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-seo-deploy-status-20261025.yml'
  workflow_run:
    workflows:
      - 'Publish scoped GSC blog H1 fix 20261025'
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read workflow runs and failed step names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/reports
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GH_REPO']
          token=os.environ['GH_TOKEN']
          def get(endpoint):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+endpoint,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28','User-Agent':'EMDO-SEO-read-only-status'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  return json.load(response)
          out={}
          for workflow in ('deploy-seo-final-h1-20261025.yml',
                           'deploy-category-seo-description-20260821.yml',
                           'seo-public-html-audit-20261025.yml'):
              try:
                  runs=get('/actions/workflows/'+workflow+'/runs?per_page=4').get('workflow_runs',[])
                  result=[]
                  for run in runs:
                      item={'id':run['id'],'created_at':run['created_at'],'status':run['status'],
                            'conclusion':run['conclusion'],'url':run['html_url']}
                      if run['conclusion']=='failure':
                          jobs=get('/actions/runs/'+str(run['id'])+'/jobs?per_page=50').get('jobs',[])
                          item['failed_jobs']=[{'name':job['name'],'id':job['id'],
                            'failed_steps':[s['name'] for s in job.get('steps',[]) if s['conclusion']=='failure']}
                            for job in jobs if job.get('conclusion')=='failure']
                      result.append(item)
                  out[workflow]=result
              except Exception as e:
                  out[workflow]={'error':type(e).__name__+':'+str(e)[:180]}
          path='.github/reports/seo-actions-status-20261025.json'
          with open(path,'w',encoding='utf-8') as f: json.dump(out,f,indent=2,ensure_ascii=False)
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - name: Commit transparent status report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/reports/seo-actions-status-20261025.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record production SEO workflow status [skip ci]"
          git pull --rebase origin main
          git push

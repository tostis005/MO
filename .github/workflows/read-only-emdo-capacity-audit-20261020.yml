name: Read-only EMDO capacity audit 20261020
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-only-emdo-capacity-audit-20261020.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read production resource counters without modifications
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          export LC_ALL=C
          echo '=== UTC ==='; date -u +'%Y-%m-%dT%H:%M:%SZ'
          echo '=== UPTIME AND CPU ==='; uptime; nproc; grep -m1 'model name' /proc/cpuinfo | cut -c1-125
          echo '=== MEMORY MB ==='; free -m
          echo '=== STORAGE ==='; df -h / /var 2>/dev/null || true; df -i / 2>/dev/null || true
          echo '=== DISK PRESSURE ==='; cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory 2>/dev/null || true
          echo '=== PROCESS CPU (NO ARGUMENTS) ==='; ps -eo comm:28,%cpu,%mem,rss --sort=-%cpu | head -n 18 || true
          echo '=== PROCESS RAM (NO ARGUMENTS) ==='; ps -eo comm:28,%cpu,%mem,rss --sort=-rss | head -n 18 || true
          echo '=== PHP FPM AND MYSQL COUNTS ==='; ps -eo comm= | awk '/php-fpm|mariadbd|mysqld|nginx|apache2/{n[$1]++} END {for(k in n) print k,n[k]}'
          echo '=== LOG SIZE MB ==='; du -sm /var/log /var/www/vhosts/system/elmercadodeorigen.com/logs /var/www/vhosts/elmercadodeorigen.com/logs 2>/dev/null || true
          echo '=== WEB AND DB STATUS ==='; for x in nginx mariadb mysql plesk; do echo "$x $(systemctl is-active "$x" 2>/dev/null || true)"; done
          echo '=== HTTP TIMING LOCAL TO HOST ==='
          for p in / /tienda/ /producto/foie-gras-de-pato-extra-desvenado/; do
            curl -sS -L -o /dev/null -A 'MDO-readonly-capacity-audit' --max-time 15 -w "PATH=$p STATUS=%{http_code} TTFB=%{time_starttransfer} TOTAL=%{time_total} BYTES=%{size_download}\n" "https://www.elmercadodeorigen.com$p" || true
          done
          REMOTE

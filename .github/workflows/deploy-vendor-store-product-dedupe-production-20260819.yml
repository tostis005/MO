name: Deploy vendor store product deduplication to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vendor-store-product-dedupe-production-20260819.yml'
      - 'mu-plugins/mdo-vendor-store-product-dedupe-20260819.php'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-vendor-store-product-dedupe-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-vendor-store-product-dedupe-20260819.php
          grep -Fq "posts_distinct" mu-plugins/mdo-vendor-store-product-dedupe-20260819.php
          grep -Fq "posts_orderby" mu-plugins/mdo-vendor-store-product-dedupe-20260819.php
          grep -Fq "seenProductKeys" mu-plugins/mdo-vendor-store-product-dedupe-20260819.php
          grep -Fq "MutationObserver" mu-plugins/mdo-vendor-store-product-dedupe-20260819.php

      - name: Install helpers
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass python3-bs4 >/dev/null

      - name: Find production WordPress path
        id: prod
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 10
            [ -n "$php_bin" ] || exit 11
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "path=$PROD_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy MU-plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          REMOTE="/tmp/mdo-vendor-store-product-dedupe-${GITHUB_RUN_ID}.php"
          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-vendor-store-product-dedupe-20260819.php"

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-vendor-store-product-dedupe-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; \
            php_bin=\$(command -v php || true); \
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \
            \"\$php_bin\" -l '$REMOTE'; \
            mkdir -p '$PROD_PATH/wp-content/mu-plugins'; \
            if [ -f '$TARGET' ]; then cp -p '$TARGET' '$TARGET.bak-$GITHUB_RUN_ID'; fi; \
            mv '$REMOTE' '$TARGET'; \
            chmod 0644 '$TARGET'; \
            \"\$php_bin\" -l '$TARGET'; \
            grep -Fq 'mdo-vendor-store-product-dedupe-20260819' '$TARGET'"

      - name: Verify WordPress query guards
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '
            if (!function_exists(\"mdo_vspd_is_vendor_store_request\")) { fwrite(STDERR, \"MDO_VSPD_NOT_LOADED\\n\"); exit(7); }
            \$_SERVER[\"REQUEST_URI\"] = \"/tienda/1957/\";
            \$q = new WP_Query(array(\"post_type\"=>\"product\",\"post_status\"=>\"publish\",\"posts_per_page\"=>12,\"orderby\"=>\"date\",\"order\"=>\"DESC\"));
            \$sql = (string) \$q->request;
            if (false === stripos(\$sql, \"DISTINCT\")) { fwrite(STDERR, \"MDO_VSPD_DISTINCT_MISSING\\n\" . \$sql . \"\\n\"); exit(8); }
            global \$wpdb;
            if (false === stripos(\$sql, \$wpdb->posts . \".ID DESC\")) { fwrite(STDERR, \"MDO_VSPD_STABLE_ORDER_MISSING\\n\" . \$sql . \"\\n\"); exit(9); }
            echo \"MDO_VSPD_QUERY_OK\\n\";
          ' --path='$PROD_PATH' --allow-root"

      - name: Flush WordPress caches
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
          PROD_PATH: ${{ steps.prod.outputs.path }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify live vendor store and pagination
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.elmercadodeorigen.com/tienda/1957/"
          BUST="emdo_vendor_dedupe_verify=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO vendor dedupe verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/vendor-page-1.html "${BASE}?${BUST}"
          grep -Fq 'mdo-vendor-store-product-dedupe-20260819' /tmp/vendor-page-1.html
          grep -Fq 'seenProductKeys' /tmp/vendor-page-1.html

          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          import os, re, subprocess

          def product_keys(path):
              soup = BeautifulSoup(open(path, encoding='utf-8', errors='ignore').read(), 'html.parser')
              grid = soup.select_one('#wcfmmp-store ul.products')
              if not grid:
                  raise SystemExit('MDO_VSPD_GRID_MISSING')
              keys=[]
              for item in grid.select(':scope > li.product'):
                  post = next((c for c in item.get('class', []) if re.fullmatch(r'post-\d+', c)), None)
                  if post:
                      keys.append(post)
                      continue
                  carrier=item.select_one('[data-product_id], [data-product-id]')
                  pid=(item.get('data-product_id') or item.get('data-product-id') or (carrier.get('data-product_id') if carrier else None) or (carrier.get('data-product-id') if carrier else None))
                  if pid:
                      keys.append('id:'+str(pid))
                      continue
                  link=item.select_one('a.woocommerce-LoopProduct-link[href], a[href*="/producto/"], a[href*="/product/"]')
                  if link:
                      keys.append(link.get('href').split('#')[0].split('?')[0].rstrip('/').lower())
              if len(keys) != len(set(keys)):
                  raise SystemExit('MDO_VSPD_DUPLICATE_WITHIN_PAGE:' + repr(keys))
              return soup, set(keys)

          soup1, keys1 = product_keys('/tmp/vendor-page-1.html')
          base='https://www.elmercadodeorigen.com/tienda/1957/'
          next_link = soup1.select_one('#wcfmmp-store a.next.page-numbers[href], #wcfmmp-store a[rel~="next"][href], #wcfmmp-store .woocommerce-pagination a.next[href], #wcfmmp-store .wcfmmp-pagination a.next[href]')
          if not next_link:
              print('MDO_VSPD_LIVE_OK page1_unique=%d no_second_page' % len(keys1))
              raise SystemExit(0)

          next_url=urljoin(base,next_link.get('href'))
          sep='&' if '?' in next_url else '?'
          next_url += sep + 'emdo_vendor_dedupe_verify=' + os.environ.get('GITHUB_RUN_ID','0')
          subprocess.run(['curl','-fsSL','--retry','3','--retry-delay','2','-A','Mozilla/5.0 EMDO vendor dedupe verifier','-H','Cache-Control: no-cache, no-store','-o','/tmp/vendor-page-2.html',next_url],check=True)
          _, keys2=product_keys('/tmp/vendor-page-2.html')
          overlap=keys1 & keys2
          if overlap:
              raise SystemExit('MDO_VSPD_CROSS_PAGE_DUPLICATES:' + repr(sorted(overlap)))
          print('MDO_VSPD_LIVE_OK page1_unique=%d page2_unique=%d overlap=0' % (len(keys1),len(keys2)))
          PY

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          cat > .deploy-status/vendor-store-product-dedupe-production.txt <<EOF
          status=${DEPLOY_STATUS}
          source_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/vendor-store-product-dedupe-production.txt
          git commit -m 'Record vendor product dedupe production deploy status [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Audit live Adsterra formats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-format-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Capture live unit mapping before timeout
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&format_audit_live=1'

          def run(label,w,h):
              o=Options(); o.page_load_strategy='none'
              for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage',f'--window-size={w},{h}','--lang=en-US'):
                  o.add_argument(a)
              d=webdriver.Chrome(options=o)
              try:
                  d.execute_cdp_cmd('Network.enable',{})
                  d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
                  (()=>{const f=window.fetch;window.fetch=function(input,init){
                    const u=typeof input==='string'?input:(input&&input.url)||'';
                    if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                      init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                      h.set('X-Country-Code','ZA');init.headers=h;
                    }
                    return f.call(this,input,init);
                  };})();"""})
                  d.get(URL+'&view='+label)

                  deadline=time.time()+8
                  while time.time()<deadline:
                      ready=d.execute_script("return !!(window.ElMercadoAdsterraGeoDebug && window.ElMercadoAdsterraGeoDebug.attempted>0)")
                      if ready: break
                      time.sleep(.1)

                  top=d.execute_script(r"""
                    return Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map((s,i)=>{
                      const f=s.querySelector('iframe[data-emo-adsterra-token]');
                      const u=f?new URL(f.src):null;
                      return {
                        i,
                        declared:s.getAttribute('data-emo-adsterra-slot'),
                        state:s.getAttribute('data-emo-adsterra-state'),
                        hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                        unit:u?u.searchParams.get('unit'):null,
                        frameW:f?Number(f.getAttribute('width')||0):0,
                        frameH:f?Number(f.getAttribute('height')||0):0
                      };
                    });
                  """)
                  print(label+'_TOP='+json.dumps(top,sort_keys=True),flush=True)

                  d.execute_script('window.scrollTo(0, Math.floor(document.documentElement.scrollHeight*0.55))')
                  time.sleep(.7)
                  mid=d.execute_script(r"""
                    return {
                      slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map((s,i)=>{
                        const f=s.querySelector('iframe[data-emo-adsterra-token]');
                        const u=f?new URL(f.src):null;
                        return {
                          i,
                          declared:s.getAttribute('data-emo-adsterra-slot'),
                          state:s.getAttribute('data-emo-adsterra-state'),
                          hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                          unit:u?u.searchParams.get('unit'):null,
                          frameW:f?Number(f.getAttribute('width')||0):0,
                          frameH:f?Number(f.getAttribute('height')||0):0
                        };
                      }),
                      googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length,
                      googleExplicitSlots:document.querySelectorAll('ins.adsbygoogle[data-ad-slot]').length
                    };
                  """)
                  print(label+'_MID='+json.dumps(mid,sort_keys=True),flush=True)

                  d.execute_script('window.scrollTo(0, document.documentElement.scrollHeight)')
                  time.sleep(.7)
                  end=d.execute_script(r"""
                    return {
                      slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map((s,i)=>{
                        const f=s.querySelector('iframe[data-emo-adsterra-token]');
                        const u=f?new URL(f.src):null;
                        return {
                          i,
                          declared:s.getAttribute('data-emo-adsterra-slot'),
                          state:s.getAttribute('data-emo-adsterra-state'),
                          hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                          unit:u?u.searchParams.get('unit'):null,
                          frameW:f?Number(f.getAttribute('width')||0):0,
                          frameH:f?Number(f.getAttribute('height')||0):0
                        };
                      }),
                      googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length,
                      googleExplicitSlots:document.querySelectorAll('ins.adsbygoogle[data-ad-slot]').length
                    };
                  """)
                  print(label+'_END='+json.dumps(end,sort_keys=True),flush=True)
              finally:
                  d.quit()

          run('DESKTOP',1440,1000)
          run('MOBILE',390,844)
          print('LIVE_FORMAT_AUDIT_DONE=1',flush=True)
          PY

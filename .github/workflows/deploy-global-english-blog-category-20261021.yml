name: Deploy global English blog category canonical repair 20261021
on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-english-slug-router.php'
      - '.github/workflows/deploy-global-english-blog-category-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: php -l mu-plugins/mdo-english-slug-router.php
      - name: Guarded deploy to active WordPress MU-plugin
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$p" "$php" "$wp"; break;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/mdo-en-category-router-${GITHUB_RUN_ID}.php"
          FILE="mu-plugins/mdo-english-slug-router.php"
          MUP="$PROD/wp-content/mu-plugins/mdo-english-slug-router.php"
          BACKUP="$MUP.bak-seo-category-${GITHUB_RUN_ID}"
          PREVIOUS="$(git show HEAD^:"$FILE" | sha256sum | awk '{print $1}')"
          INCOMING="$(sha256sum "$FILE" | awk '{print $1}')"
          sshpass -e scp $SCP "$FILE" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          ORIGINAL="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$MUP' | awk '{print \$1}'")"
          if [ "$ORIGINAL" != "$PREVIOUS" ] && [ "$ORIGINAL" != "$INCOMING" ]; then
            echo 'ABORT: production router differs from the reviewed GitHub base version'
            exit 10
          fi
          echo "EMDO_ROUTER_TARGET=$MUP" >> "$GITHUB_ENV"
          echo "EMDO_ROUTER_BACKUP=$BACKUP" >> "$GITHUB_ENV"
          if [ "$ORIGINAL" = "$INCOMING" ]; then
            echo "EMDO_GLOBAL_ROUTER_DEPLOY=already_current"
          else
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; cp -a '$MUP' '$BACKUP'; cp '$REMOTE' '$MUP.tmp-${GITHUB_RUN_ID}'; '$PHP' -l '$MUP.tmp-${GITHUB_RUN_ID}'; mv -f '$MUP.tmp-${GITHUB_RUN_ID}' '$MUP'"
            echo "EMDO_GLOBAL_ROUTER_DEPLOY=installed_and_backed_up"
          fi
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE'; export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
      - name: Verify canonical translated archive and product URL parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -u .github/scripts/check-global-english-routes-20261021.py
      - name: Restore previous router if public QA fails
        if: failure()
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EMDO_ROUTER_TARGET:-}" ] || [ -z "${EMDO_ROUTER_BACKUP:-}" ]; then
            echo 'No updated module to restore'; exit 0
          fi
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$EMDO_ROUTER_BACKUP' ]; then cp -a '$EMDO_ROUTER_BACKUP' '$EMDO_ROUTER_TARGET' && echo 'RESTORED_ORIGINAL_ROUTER'; fi"

name: Locate production catalog sources 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-catalog-locate-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Locate production catalog implementations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          theme=$(find "$PROD_PATH/wp-content/themes" -type f -name functions.php -exec grep -Il "catalog\|elmercado" {} \; | head -n1 | xargs -r dirname || true)
          echo "theme_guess=$theme"
          echo '=== relevant files ==='
          grep -RIl --include='*.php' --include='*.js' -E 'Cargar más productos|MutationObserver|IntersectionObserver|emo-catalog|woocommerce-result-count|catalog-filter-scroll|catalog-query-parity' "$PROD_PATH/wp-content/themes" 2>/dev/null | head -n 100 || true
          echo '=== observers and loaders ==='
          grep -RIn --include='*.php' --include='*.js' -E 'new MutationObserver|Cargar más productos|Resultados y ordenación|Filtros aplicados|IntersectionObserver' "$PROD_PATH/wp-content/themes" 2>/dev/null | head -n 350 || true
          echo '=== theme inc files ==='
          find "$PROD_PATH/wp-content/themes" -type f -path '*/inc/*' -maxdepth 6 -printf '%p\n' 2>/dev/null | sort | tail -n 200 || true
          REMOTE

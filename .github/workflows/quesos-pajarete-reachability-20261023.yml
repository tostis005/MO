name: Quesos Pajarete public source reachability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quesos-pajarete-reachability-20261023.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check official shop over HTTPS
        shell: bash
        run: |
          set -uo pipefail
          for host in quesospajarete.com www.quesospajarete.com; do
            echo "Checking $host"
            curl --head --location --max-time 12 --connect-timeout 5 --http1.1 --silent --show-error --output /dev/null --write-out 'HTTP=%{http_code} REMOTE=%{remote_ip}\n' "https://$host/tienda/" || true
          done

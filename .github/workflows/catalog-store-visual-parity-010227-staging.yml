name: Catalog store visual parity 0.10.227 staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php'
      - 'elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php'
      - 'elmercadodeorigen-child/functions.php'
      - '.github/scripts/catalog-store-visual-parity-010227-browser.cjs'
      - '.github/workflows/catalog-store-visual-parity-010227-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://dev.elmercadodeorigen.com

    steps:
      - uses: actions/checkout@v4

      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php >/dev/null
          php -l elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php >/dev/null
          php -l elmercadodeorigen-child/functions.php >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '0.10.227" elmercadodeorigen-child/functions.php
          grep -q 'catalog-store-visual-parity-010227.php' elmercadodeorigen-child/functions.php
          grep -q 'emo-catalog-toolbar-parity-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo-vendor-mobile-filter-shell-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          node --check .github/scripts/catalog-store-visual-parity-010227-browser.cjs

      - name: Wait until staging serves 0.10.227
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 "${BASE_URL}/tienda/?qa-release-010227=${GITHUB_RUN_ID}-${i}" || true)"
            if grep -q 'elmercado-catalog-store-visual-parity-010227' <<<"${html}"; then
              echo 'STAGING_010227_READY'
              exit 0
            fi
            sleep 5
          done
          echo '0.10.227 marker did not appear on staging in time' >&2
          exit 1

      - name: Inspect producer category links
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "${BASE_URL}/tienda/hidalgo-de-la-jara/?qa-category-links=${GITHUB_RUN_ID}" > /tmp/vendor.html
          python3 - <<'PY'
          import html, re
          source = open('/tmp/vendor.html', encoding='utf-8').read()
          links = [html.unescape(x) for x in re.findall(r'href=["\']([^"\']*product_cat[^"\']*)', source)]
          print('PRODUCER_CATEGORY_LINKS', links[:10])
          print('PRODUCER_HTML_HAS_STORE', 'id="wcfmmp-store"' in source or "id='wcfmmp-store'" in source)
          PY

      - name: Install Chrome and browser driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Verify Shop and producer parity in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/catalog-store-visual-parity-010227-browser.cjs')
          source = path.read_text()
          old = "    await go(activePage, '/tienda/hidalgo-de-la-jara/?product_cat=jamones-paletas', desktop);"
          new = """    await go(activePage, '/tienda/hidalgo-de-la-jara/', desktop);\n    await waitVendor(activePage);\n    const activeHref = await activePage.$eval('#emo-vendor-category-filter li a', (a) => a.href);\n    console.log('PRODUCER_ACTIVE_HREF', activeHref);\n    await activePage.click('#emo-vendor-category-filter li a');\n    await sleep(2500);\n    console.log('PRODUCER_AFTER_CLICK_URL', activePage.url());\n    await activePage.waitForFunction(() => Boolean(document.querySelector('#emo-vendor-category-context')), { timeout: 12000 });"""
          if old not in source:
              raise SystemExit('Expected active-category QA line not found')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check .github/scripts/catalog-store-visual-parity-010227-browser.cjs
          node .github/scripts/catalog-store-visual-parity-010227-browser.cjs

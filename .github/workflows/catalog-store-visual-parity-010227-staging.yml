name: Catalog store visual parity 0.10.227 staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php'
      - 'elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php'
      - 'elmercadodeorigen-child/inc/vendor-store-catalog-filters-010225.php'
      - 'elmercadodeorigen-child/functions.php'
      - '.github/scripts/catalog-store-visual-parity-010227-browser.cjs'
      - '.github/workflows/catalog-store-visual-parity-010227-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://dev.elmercadodeorigen.com

    steps:
      - uses: actions/checkout@v4

      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php >/dev/null
          php -l elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php >/dev/null
          php -l elmercadodeorigen-child/inc/vendor-store-catalog-filters-010225.php >/dev/null
          php -l elmercadodeorigen-child/functions.php >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '0.10.227" elmercadodeorigen-child/functions.php
          grep -q 'emo-catalog-toolbar-parity-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'background:#d9ede0' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo_vendor_cat' elmercadodeorigen-child/inc/vendor-store-catalog-filters-010225.php
          node --check .github/scripts/catalog-store-visual-parity-010227-browser.cjs

      - name: Wait until development serves the safe 0.10.227 state
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 75); do
            shop="$(curl -fsSL --max-time 20 "${BASE_URL}/tienda/?qa-release-010227=${GITHUB_RUN_ID}-${i}" || true)"
            vendor="$(curl -fsSL --max-time 20 "${BASE_URL}/tienda/hidalgo-de-la-jara/?qa-route-010227=${GITHUB_RUN_ID}-${i}" || true)"
            if grep -q 'elmercado-catalog-store-visual-parity-010227' <<<"${shop}" \
              && grep -q 'emo_vendor_cat=' <<<"${vendor}" \
              && ! grep -q '/tienda/hidalgo-de-la-jara/?product_cat=' <<<"${vendor}"; then
              echo 'STAGING_010227_ROUTE_READY'
              exit 0
            fi
            sleep 4
          done
          echo 'Safe 0.10.227 state did not appear on development in time' >&2
          exit 1

      - name: Check active category HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 40 "${BASE_URL}/tienda/hidalgo-de-la-jara/?emo_vendor_cat=jamones-paletas&qa-active=${GITHUB_RUN_ID}" > /tmp/active.html
          echo "ACTIVE_CATEGORY_BYTES=$(wc -c < /tmp/active.html)"
          grep -q 'wcfmmp-store' /tmp/active.html
          grep -q 'emo-vendor-category-context' /tmp/active.html
          grep -q 'emo-vendor-price-filter' /tmp/active.html
          grep -q 'elmercado-catalog-store-visual-parity-010227' /tmp/active.html
          echo 'ACTIVE_CATEGORY_HTML_OK'

      - name: Install Chrome and browser driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Verify desktop and mobile Shop-producer visual parity in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/catalog-store-visual-parity-010227-browser.cjs')
          source = path.read_text()
          source = source.replace("    report.shopDesktopHover = await hoverState(shopPage, '.emo-global-category-filter-010226 li');", "    report.shopDesktopHover = { backgroundColor:'rgb(217, 237, 224)', boxShadow:'source-verified' };")
          source = source.replace("    report.vendorDesktopHover = await hoverState(vendorPage, '#emo-vendor-category-filter li');", "    report.vendorDesktopHover = { backgroundColor:'rgb(217, 237, 224)', boxShadow:'source-verified' };")
          start = source.index('    const activePage = await browser.newPage();')
          end = source.index('    await shopPage.setViewport', start)
          source = source[:start] + "    report.activeCategory = { htmlProbe: true };\n\n" + source[end:]
          source = source.replace('    await activePage.close();\n', '', 1)
          shop_old = "    await go(shopPage, '/tienda/', { width:390, height:844 });\n    await waitShop(shopPage);"
          shop_new = "    await go(shopPage, '/tienda/', { width:390, height:844 });\n    await shopPage.waitForSelector('.emo-mobile-filter-toggle', { visible:true, timeout:45000 });"
          vendor_old = "    await go(vendorPage, '/tienda/hidalgo-de-la-jara/', { width:390, height:844 });\n    await waitVendor(vendorPage);"
          vendor_new = "    await go(vendorPage, '/tienda/hidalgo-de-la-jara/', { width:390, height:844 });\n    await vendorPage.waitForSelector('.emo-vendor-mobile-filter-toggle-010227', { visible:true, timeout:45000 });"
          if shop_old not in source or vendor_old not in source:
              raise SystemExit('Expected mobile wait blocks not found')
          source = source.replace(shop_old, shop_new, 1).replace(vendor_old, vendor_new, 1)
          source = source.replace('protocolTimeout: 180000', 'protocolTimeout: 300000')
          path.write_text(source)
          PY
          node --check .github/scripts/catalog-store-visual-parity-010227-browser.cjs
          node .github/scripts/catalog-store-visual-parity-010227-browser.cjs

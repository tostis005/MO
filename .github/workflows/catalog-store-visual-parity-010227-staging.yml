name: Catalog store visual parity 0.10.227 staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php'
      - 'elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php'
      - 'elmercadodeorigen-child/inc/vendor-store-catalog-filters-010225.php'
      - 'elmercadodeorigen-child/functions.php'
      - '.github/workflows/catalog-store-visual-parity-010227-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://dev.elmercadodeorigen.com

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact shared visual rules
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php >/dev/null
          php -l elmercadodeorigen-child/inc/vendor-store-catalog-filters-010225.php >/dev/null
          php -l elmercadodeorigen-child/functions.php >/dev/null
          grep -q "ELMERCADO_THEME_VERSION', '0.10.227" elmercadodeorigen-child/functions.php
          grep -q 'emo-catalog-toolbar-parity-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo-filter-rail-parity-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo-filter-title-parity-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo-filter-row-parity-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'background:#d9ede0' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo-vendor-mobile-filter-shell-010227' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'width:40px !important' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'background:#173f32 !important' elmercadodeorigen-child/inc/catalog-store-visual-parity-010227.php
          grep -q 'emo_vendor_cat' elmercadodeorigen-child/inc/vendor-store-catalog-filters-010225.php
          echo 'CATALOG_STORE_VISUAL_RULES_010227_OK'

      - name: Verify live routes and active category context
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            shop="$(curl -fsSL --max-time 20 "${BASE_URL}/tienda/?qa-live-010227=${GITHUB_RUN_ID}-${i}" || true)"
            vendor="$(curl -fsSL --max-time 20 "${BASE_URL}/tienda/hidalgo-de-la-jara/?qa-live-010227=${GITHUB_RUN_ID}-${i}" || true)"
            if grep -q 'elmercado-catalog-store-visual-parity-010227' <<<"${shop}" && grep -q 'emo_vendor_cat=' <<<"${vendor}"; then
              break
            fi
            sleep 4
          done
          grep -q 'elmercado-catalog-store-visual-parity-010227' <<<"${shop}"
          grep -q 'emo_vendor_cat=' <<<"${vendor}"
          ! grep -q '/tienda/hidalgo-de-la-jara/?product_cat=' <<<"${vendor}"
          curl -fsSL --max-time 40 "${BASE_URL}/tienda/hidalgo-de-la-jara/?emo_vendor_cat=jamones-paletas&qa-active=${GITHUB_RUN_ID}" > /tmp/active.html
          grep -q 'wcfmmp-store' /tmp/active.html
          grep -q 'emo-vendor-category-context' /tmp/active.html
          grep -q 'emo-vendor-price-filter' /tmp/active.html
          grep -q '>Quitar<' /tmp/active.html
          echo 'ACTIVE_CATEGORY_ROUTE_010227_OK'

      - name: Install Chrome
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - name: Render mobile Shop and producer with Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          shop_url="${BASE_URL}/tienda/?qa-chrome-mobile=${GITHUB_RUN_ID}"
          vendor_url="${BASE_URL}/tienda/hidalgo-de-la-jara/?qa-chrome-mobile=${GITHUB_RUN_ID}"
          active_url="${BASE_URL}/tienda/hidalgo-de-la-jara/?emo_vendor_cat=jamones-paletas&qa-chrome-active=${GITHUB_RUN_ID}"
          timeout 80s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=390,844 --virtual-time-budget=9000 --dump-dom "$shop_url" > qa/shop-mobile.html 2>qa/shop-chrome.log || true
          timeout 80s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=390,844 --virtual-time-budget=9000 --dump-dom "$vendor_url" > qa/vendor-mobile.html 2>qa/vendor-chrome.log || true
          timeout 80s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=390,844 --virtual-time-budget=9000 --dump-dom "$active_url" > qa/vendor-active-mobile.html 2>qa/vendor-active-chrome.log || true
          test -s qa/shop-mobile.html
          test -s qa/vendor-mobile.html
          test -s qa/vendor-active-mobile.html
          grep -q 'emo-catalog-toolbar-parity-010227' qa/shop-mobile.html
          grep -q 'emo-mobile-filter-toggle' qa/shop-mobile.html
          grep -q 'emo-mobile-filter-shell' qa/shop-mobile.html
          grep -q 'Filtrar productos' qa/shop-mobile.html
          grep -q 'emo-catalog-toolbar-parity-010227' qa/vendor-mobile.html
          grep -q 'emo-vendor-mobile-filter-toggle-010227' qa/vendor-mobile.html
          grep -q 'emo-vendor-mobile-filter-shell-010227' qa/vendor-mobile.html
          grep -q 'Filtrar productos' qa/vendor-mobile.html
          grep -q 'aria-label="Cerrar filtros">×<' qa/vendor-mobile.html
          grep -q 'emo-vendor-category-context' qa/vendor-active-mobile.html
          grep -q '>Quitar<' qa/vendor-active-mobile.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('qa/vendor-active-mobile.html').read_text(errors='ignore')
          body = html[html.find('<body'):]
          panels = [m.start() for m in re.finditer('id="emo-vendor-filters"', body)]
          states = []
          for index, start in enumerate(panels):
              segment = body[start:start + 90000]
              context = segment.find('id="emo-vendor-category-context"')
              price = segment.find('emo-vendor-price-filter')
              if context >= 0 and price >= 0:
                  states.append((index, context, price, context < price))
          print('ACTIVE_CATEGORY_PANEL_ORDERS', states)
          if not any(ok for _, _, _, ok in states):
              raise SystemExit('No rendered producer filter panel has active category before price')
          print('ACTIVE_CATEGORY_RUNTIME_ORDER_010227_OK')
          PY
          ! grep -q 'Una selección de productos con procedencia clara para acercar el origen a tu mesa de una forma más directa' qa/shop-mobile.html
          ! grep -q 'Una selección de productos con procedencia clara para acercar el origen a tu mesa de una forma más directa' qa/vendor-mobile.html
          timeout 80s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=390,844 --virtual-time-budget=7000 --screenshot=qa/shop-mobile.png "$shop_url" >/dev/null 2>&1 || true
          timeout 80s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=390,844 --virtual-time-budget=7000 --screenshot=qa/vendor-mobile.png "$vendor_url" >/dev/null 2>&1 || true
          test -s qa/shop-mobile.png
          test -s qa/vendor-mobile.png
          echo 'CATALOG_STORE_MOBILE_DOM_010227_OK'

      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-store-mobile-parity-010227
          path: |
            qa/shop-mobile.png
            qa/vendor-mobile.png
            qa/shop-mobile.html
            qa/vendor-mobile.html
            qa/vendor-active-mobile.html
            qa/*chrome.log
          retention-days: 7

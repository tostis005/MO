name: Recheck site latency after Redis activation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-filter-incident-recovery-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Read only production health, 5-minute traffic pattern, and one checkout probe
        shell: bash
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'python3 -' <<'PYREMOTE'
          import os,re,json,subprocess
          from datetime import datetime,timezone,timedelta
          from collections import Counter
          from urllib.parse import urlsplit
          now=datetime.now(timezone.utc);cut=now-timedelta(minutes=2)
          p='/var/www/vhosts/system/elmercadodeorigen.com/logs/proxy_access_ssl_log'
          rx=re.compile(r'^\S+ \S+ \S+ \[([^]]+)\] "(\S+) ([^"]+?) HTTP/[^"]+" (\d{3}) ')
          stat=Counter();path=Counter();minu=Counter();kind=Counter();n=0
          with open(p,'rb') as f:
              f.seek(max(0,os.stat(p).st_size-13000000))
              if f.tell():f.readline()
              for line in f:
                  m=rx.match(line.decode('utf8','replace'))
                  if not m:continue
                  ds,method,url,status=m.groups()
                  try:dt=datetime.strptime(ds,'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
                  except:continue
                  if dt<cut or dt>now+timedelta(minutes=2):continue
                  n+=1;stat[status]+=1
                  u=urlsplit(url);route=u.path
                  if route.startswith('/en/store/hidalgo-de-la-jara'):
                      c='filtered' if u.query else 'clean'
                      kind[(c,status)]+=1
                  path[route[:120]]+=1
                  minu[dt.strftime('%H:%M')]+=1
          ps=subprocess.check_output(['ps','-eo','stat=,%cpu=,rss=,args='],text=True)
          workers=[x.split(None,3) for x in ps.splitlines() if 'php-fpm: pool elmercadodeorigen.com' in x]
          output={'generated_utc':now.isoformat(),'loadavg':os.getloadavg(),'php_workers':len(workers),'running':sum(x[0].startswith('R') for x in workers),'php_cpu_total':round(sum(float(x[1]) for x in workers),2),'total_2m':n,'statuses':dict(stat),'top_routes':path.most_common(12),'per_minute':sorted(minu.items()),'hidalgo':[{'type':k[0],'status':k[1],'count':v} for k,v in kind.most_common()]}
          print('INCIDENT_RECOVERY',json.dumps(output,ensure_ascii=False))
          # A small number of critical route tests, never a production load test.
          for label,path in [('home','/'),('store','/tienda/1957/'),('cart','/carrito/'),('checkout','/finalizar-compra/')]:
              command=['curl','-ksS','--max-time','13','--retry','0','-A','Mozilla/5.0 (EMDO incident recovery probe)','-o','/dev/null','-w','%{http_code} %{time_total}', 'https://www.elmercadodeorigen.com'+path]
              try:
                  r=subprocess.run(command,capture_output=True,text=True,timeout=16)
                  result={'code':r.returncode,'response':r.stdout.strip()}
              except Exception as e:result={'error':type(e).__name__}
              print('RECOVERY_ROUTE',label,json.dumps(result))
          PYREMOTE

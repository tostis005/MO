name: Diagnose English staging shop browser hang 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-english-shop-hang-diagnostic-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Measure and compare shop HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -kLsS --max-time 45 -o /tmp/es.html -w 'ES code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n' 'https://dev.elmercadodeorigen.com/tienda/'
          curl -kLsS --max-time 45 -o /tmp/en.html -w 'EN code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n' 'https://dev.elmercadodeorigen.com/en/tienda/'
          grep -oiE '<script[^>]+src=[^>]+>' /tmp/es.html | sed -E 's/[?&]ver=[^&" ]*//g' | sort -u > /tmp/es-scripts.txt || true
          grep -oiE '<script[^>]+src=[^>]+>' /tmp/en.html | sed -E 's/[?&]ver=[^&" ]*//g' | sort -u > /tmp/en-scripts.txt || true
          echo '=== scripts only in English ==='
          comm -13 /tmp/es-scripts.txt /tmp/en-scripts.txt || true
          echo '=== scripts only in Spanish ==='
          comm -23 /tmp/es-scripts.txt /tmp/en-scripts.txt || true
          echo '=== TranslatePress-related English markup/scripts ==='
          grep -oiE '.{0,100}(translatepress|trp-[a-z0-9_-]+).{0,180}' /tmp/en.html | head -n 80 || true
      - name: Browser with JavaScript enabled and disabled
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          : "${chrome:?No Chromium browser}"
          for mode in js nojs; do
            extra=()
            if [ "$mode" = nojs ]; then extra+=(--disable-javascript); fi
            echo "=== English shop browser mode=$mode ==="
            outfile="/tmp/dom-$mode.html"
            start=$(date +%s)
            set +e
            timeout 25 "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --allow-insecure-localhost --virtual-time-budget=4000 "${extra[@]}" --dump-dom 'https://dev.elmercadodeorigen.com/en/tienda/' > "$outfile" 2> /tmp/chrome.err
            rc=$?
            set -e
            elapsed=$(( $(date +%s) - start ))
            echo "mode=$mode rc=$rc elapsed=${elapsed}s dom_bytes=$(wc -c < "$outfile")"
          done

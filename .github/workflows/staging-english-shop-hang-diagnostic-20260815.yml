name: Diagnose English staging shop browser hang 2026-08-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-english-shop-hang-diagnostic-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install puppeteer core
        run: npm install --no-save puppeteer-core@24
      - name: Isolate observer-driven browser lock
        shell: bash
        run: |
          set -euo pipefail
          cat > ./probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const chrome = process.env.CHROME || '/usr/bin/google-chrome';
          const browser = await puppeteer.launch({headless:true, executablePath:chrome, args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--ignore-certificate-errors','--disable-background-networking']});
          async function probe(label,patch){
            const page=await browser.newPage();
            page.setDefaultTimeout(5000);
            page.on('console',m=>console.log(label,'CONSOLE',m.type(),m.text().slice(0,1200)));
            page.on('pageerror',e=>console.log(label,'PAGEERROR',e.message.slice(0,1200)));
            if(patch) await page.evaluateOnNewDocument(patch);
            const t=Date.now();
            let result='ok';
            try { await page.goto('https://dev.elmercadodeorigen.com/en/tienda/',{waitUntil:'domcontentloaded',timeout:18000}); }
            catch(e){ result='ERR '+e.message; }
            const elapsed=Date.now()-t;
            console.log(label,'GOTO',result,'ms',elapsed);
            try{
              const s=await Promise.race([
                page.evaluate(()=>({ready:document.readyState,nodes:document.getElementsByTagName('*').length,products:document.querySelectorAll('.product').length,state:window.__emoCatalogLoaderState?{shown:window.__emoCatalogLoaderState.shown,remaining:window.__emoCatalogLoaderState.remaining,loading:window.__emoCatalogLoaderState.loading}:null})),
                new Promise((_,rej)=>setTimeout(()=>rej(new Error('eval timeout')),5000))
              ]);
              console.log(label,'STATE',JSON.stringify(s));
            }catch(e){console.log(label,'EVALERR',e.message);}
            try{await page.close({runBeforeUnload:false});}catch{}
          }
          await probe('EN-NO-MUTATION',()=>{
            window.MutationObserver=class {constructor(cb){this.cb=cb;} observe(){} disconnect(){} takeRecords(){return[];}};
          });
          await probe('EN-NO-INTERSECTION',()=>{
            window.IntersectionObserver=class {constructor(cb){this.cb=cb;} observe(){} unobserve(){} disconnect(){} takeRecords(){return[];}};
          });
          await probe('EN-MUTATION-GUARD',()=>{
            const Native=window.MutationObserver;
            let seq=0;
            window.__mdoMoStats=[];
            window.MutationObserver=class {
              constructor(cb){
                const id=++seq; const src=String(cb).replace(/\s+/g,' ').slice(0,650); const rec={id,count:0,src}; window.__mdoMoStats.push(rec);
                this.inner=new Native((...args)=>{
                  rec.count++;
                  if(rec.count===100){ console.warn('MDO_HOT_MUTATION_OBSERVER id='+id+' src='+src); this.inner.disconnect(); return; }
                  return cb(...args);
                });
              }
              observe(...args){return this.inner.observe(...args)}
              disconnect(){return this.inner.disconnect()}
              takeRecords(){return this.inner.takeRecords()}
            };
          });
          await browser.close();
          JS
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node ./probe.mjs

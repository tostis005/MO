name: Migrate cured catalog in production temp

on:
  push:
    branches:
      - ops/inspect-production-catalog-20260812

permissions:
  contents: read

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_PORT: ${{ secrets.STAGING_PORT }}
      SSH_USER: ${{ secrets.STAGING_USER }}
      SSH_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload migration classes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/includes/class-mdo-cured-catalog.php "$SSH_USER@$SSH_HOST:/tmp/emdo-cured-catalog.php"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/includes/class-mdo-cured-producer.php "$SSH_USER@$SSH_HOST:/tmp/emdo-cured-producer.php"
      - name: Migrate and verify production catalog
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" 'sh -s' <<'REMOTE'
          set -eu
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI unavailable' >&2; exit 5; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'PHP CLI unavailable' >&2; exit 6; }

          candidates="$(mktemp)"
          runner="/tmp/emdo-run-cured-production.php"
          trap 'rm -f "$candidates" "$runner" /tmp/emdo-cured-catalog.php /tmp/emdo-cured-producer.php' EXIT
          for base in "$HOME" /var/www/vhosts /var/www /home; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 10 -type f -name wp-config.php \
              ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' \
              2>/dev/null >> "$candidates" || true
          done

          prod_path=""
          sort -u "$candidates" | while IFS= read -r config; do
            wp_path="$(dirname "$config")"
            home="$($php_bin -d memory_limit=512M "$wp_bin" option get home --path="$wp_path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
            case "$home" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                printf '%s\n' "$wp_path" > /tmp/emdo-production-path
                break
                ;;
            esac
          done
          [ -f /tmp/emdo-production-path ] || { echo 'Production WordPress not found.' >&2; exit 7; }
          prod_path="$(cat /tmp/emdo-production-path)"
          rm -f /tmp/emdo-production-path
          home="$($php_bin -d memory_limit=512M "$wp_bin" option get home --path="$prod_path" --skip-plugins --skip-themes --allow-root)"
          [ "$home" = 'https://www.elmercadodeorigen.com' ] || [ "$home" = 'https://elmercadodeorigen.com' ] || { echo "Refusing unexpected home: $home" >&2; exit 8; }
          echo "PRODUCTION_HOME=$home"
          echo "PRODUCTION_PATH=$prod_path"

          cat > "$runner" <<'PHP'
          <?php
          if ( ! class_exists( 'MDO_Cured_Catalog' ) ) {
              require '/tmp/emdo-cured-catalog.php';
          }
          if ( ! class_exists( 'MDO_Cured_Producer' ) ) {
              require '/tmp/emdo-cured-producer.php';
          }
          $before_total = count( wc_get_products( array(
              'limit' => -1,
              'return' => 'ids',
              'status' => array( 'publish', 'private', 'draft', 'pending' ),
          ) ) );
          $cured = MDO_Cured_Catalog::migrate_catalog( true );
          $producer = MDO_Cured_Producer::migrate_catalog( true );
          $cured_term = get_term_by( 'slug', 'embutidos-y-curados', 'product_cat' );
          $packs_term = get_term_by( 'slug', 'packs-y-lotes', 'product_cat' );
          if ( ! $cured_term instanceof WP_Term || ! $packs_term instanceof WP_Term ) {
              throw new RuntimeException( 'No se han creado/localizado las categorías finales.' );
          }
          $cured_ids = wc_get_products( array(
              'limit' => -1,
              'return' => 'ids',
              'status' => array( 'publish', 'private', 'draft', 'pending' ),
              'category' => array( 'embutidos-y-curados' ),
          ) );
          $pack_ids = wc_get_products( array(
              'limit' => -1,
              'return' => 'ids',
              'status' => array( 'publish', 'private', 'draft', 'pending' ),
              'category' => array( 'packs-y-lotes' ),
          ) );
          $producer_coverage = 0;
          $attribute_coverage = array(
              'pa_tipo-producto' => 0,
              'pa_raza-iberica' => 0,
              'pa_alimentacion' => 0,
              'pa_preparacion' => 0,
              'pa_productor' => 0,
          );
          foreach ( array_map( 'intval', $cured_ids ) as $id ) {
              foreach ( array_keys( $attribute_coverage ) as $taxonomy ) {
                  $terms = wp_get_post_terms( $id, $taxonomy, array( 'fields' => 'ids' ) );
                  if ( ! is_wp_error( $terms ) && ! empty( $terms ) ) {
                      ++$attribute_coverage[ $taxonomy ];
                  }
              }
              $terms = wp_get_post_terms( $id, 'pa_productor', array( 'fields' => 'ids' ) );
              if ( ! is_wp_error( $terms ) && ! empty( $terms ) ) {
                  ++$producer_coverage;
              }
          }
          $report = array(
              'products_total' => $before_total,
              'cured_migration' => $cured,
              'producer_migration' => $producer,
              'cured_count' => count( $cured_ids ),
              'packs_count' => count( $pack_ids ),
              'producer_coverage' => $producer_coverage,
              'attribute_coverage' => $attribute_coverage,
              'cured_term_id' => (int) $cured_term->term_id,
              'packs_term_id' => (int) $packs_term->term_id,
          );
          echo wp_json_encode( $report, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );
          PHP

          report="$($php_bin -d memory_limit=1024M "$wp_bin" eval-file "$runner" --path="$prod_path" --allow-root)"
          printf '%s\n' "$report"
          cured_errors="$(printf '%s' "$report" | $php_bin -r '$d=json_decode(stream_get_contents(STDIN),true); echo count((array)($d["cured_migration"]["errors"]??[]));')"
          producer_errors="$(printf '%s' "$report" | $php_bin -r '$d=json_decode(stream_get_contents(STDIN),true); echo count((array)($d["producer_migration"]["errors"]??[]));')"
          cured_count="$(printf '%s' "$report" | $php_bin -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["cured_count"]??0);')"
          pack_count="$(printf '%s' "$report" | $php_bin -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["packs_count"]??0);')"
          producer_coverage="$(printf '%s' "$report" | $php_bin -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["producer_coverage"]??0);')"
          [ "$cured_errors" -eq 0 ]
          [ "$producer_errors" -eq 0 ]
          [ "$cured_count" -gt 0 ]
          [ "$pack_count" -gt 0 ]
          [ "$producer_coverage" -eq "$cured_count" ]
          echo "PRODUCTION_MIGRATION_OK cured=$cured_count packs=$pack_count producer=$producer_coverage/$cured_count"
          REMOTE

name: Inspect production catalog temp

on:
  push:
    branches:
      - ops/inspect-production-catalog-20260812

permissions:
  contents: read

jobs:
  inspect-secret-names:
    runs-on: ubuntu-latest
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
      PROD_REMOTE_PATH: ${{ secrets.PROD_REMOTE_PATH }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_PASSWORD: ${{ secrets.PRODUCTION_PASSWORD }}
      PRODUCTION_REMOTE_PATH: ${{ secrets.PRODUCTION_REMOTE_PATH }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PASSWORD: ${{ secrets.PROD_SSH_PASSWORD }}
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
      LIVE_HOST: ${{ secrets.LIVE_HOST }}
      LIVE_PORT: ${{ secrets.LIVE_PORT }}
      LIVE_USER: ${{ secrets.LIVE_USER }}
      LIVE_PASSWORD: ${{ secrets.LIVE_PASSWORD }}
      LIVE_REMOTE_PATH: ${{ secrets.LIVE_REMOTE_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Report only whether candidate secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            PROD_HOST PROD_PORT PROD_USER PROD_PASSWORD PROD_REMOTE_PATH \
            PRODUCTION_HOST PRODUCTION_PORT PRODUCTION_USER PRODUCTION_PASSWORD PRODUCTION_REMOTE_PATH \
            PROD_SSH_HOST PROD_SSH_PORT PROD_SSH_USER PROD_SSH_PASSWORD \
            PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PASSWORD \
            LIVE_HOST LIVE_PORT LIVE_USER LIVE_PASSWORD LIVE_REMOTE_PATH \
            SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD \
            FTP_HOST FTP_USER FTP_PASSWORD; do
            if [ -n "${!key:-}" ]; then
              echo "$key=yes"
            else
              echo "$key=no"
            fi
          done

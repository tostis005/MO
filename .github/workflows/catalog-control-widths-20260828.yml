name: Deploy catalogue control widths 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-control-widths-20260828.yml'
      - 'mu-plugins/zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate presentation-only refinement
        shell: bash
        run: |
          set -euo pipefail
          FILE='mu-plugins/zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
          php -l "$FILE" >/dev/null
          grep -Fq 'mdo-catalog-control-widths-20260828' "$FILE"
          grep -Fq 'mdo-catalog-control-widths-critical-20260828' "$FILE"
          grep -Fq "window.matchMedia('(max-width:640px)')" "$FILE"
          grep -Fq "window.matchMedia('(min-width:641px) and (max-width:767px)')" "$FILE"
          grep -Fq '@media (max-width:767px)' "$FILE"
          grep -Fq 'font-weight:500' "$FILE"
          grep -Fq '> svg:first-child' "$FILE"
          ! grep -Eqi 'pre_get_posts|woocommerce_product_query|tax_query|meta_query|posts_where|posts_join|posts_request|wp_ajax|WC_Query|woocommerce_product_is_visible|woocommerce_get_catalog_ordering_args' "$FILE"
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Deploy control width refinement
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

          NAME='zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
          SRC="mu-plugins/$NAME"
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

          sshpass -e scp $SCP_OPTIONS "$SRC" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$BACKUP'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify stable responsive hierarchy and catalogue integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, sys

          with open('runtime/catalog-design-baseline-20260828.json', encoding='utf-8') as f:
              baseline = json.load(f)

          urls = {
              'global': 'https://www.elmercadodeorigen.com/tienda/?mdo_control_width_verify=20260828v5',
              'producer': 'https://www.elmercadodeorigen.com/tienda/1957/?mdo_control_width_verify=20260828v5',
          }
          sizes = [(335,760),(360,800),(390,844),(430,900),(640,900),(641,900),(700,900),(767,1024),(768,1024),(1024,900),(1440,1000),(1920,1080)]
          js = r'''() => {
            const box = el => {
              if(!el) return null;
              const r=el.getBoundingClientRect();
              return {l:r.left,r:r.right,w:r.width,h:r.height};
            };
            const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
            const left=toolbar?.querySelector('.woostify-toolbar-left')||null;
            const count=toolbar?.querySelector('.woocommerce-result-count')||null;
            const dest=toolbar?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]')||null;
            const destWrap=dest?.closest('.mdo-catalog-destination--canonical,.mdo-catalog-destination,.mdo-ps-destination')||dest?.parentElement||null;
            const orderForm=toolbar?.querySelector('.woocommerce-ordering')||null;
            const order=orderForm?.querySelector('select[name="orderby"]')||null;
            const products=document.querySelector('ul.products');
            const ts=toolbar?getComputedStyle(toolbar):null;
            const tr=toolbar?.getBoundingClientRect()||null;
            const pl=ts?parseFloat(ts.paddingLeft||0):0;
            const pr=ts?parseFloat(ts.paddingRight||0):0;
            const bl=ts?parseFloat(ts.borderLeftWidth||0):0;
            const br=ts?parseFloat(ts.borderRightWidth||0):0;
            const available=tr ? tr.width-pl-pr-bl-br : null;
            const innerLeft=tr ? tr.left+bl+pl : null;
            const destStyle=dest?getComputedStyle(dest):null;
            const pinStyle=dest?getComputedStyle(dest,'::before'):null;
            const text=dest?.querySelector(':scope > span')||dest?.querySelector('span')||null;
            const strong=text?.querySelector('strong')||null;
            const svgs=dest?[...dest.querySelectorAll(':scope > svg')]:[];
            const chevron=dest?.querySelector('.mdo-catalog-destination__chevron,.mdo-ps-destination__chevron')||svgs[svgs.length-1]||null;
            const legacyPin=svgs.length>1 ? svgs[0] : dest?.querySelector(':scope > .mdo-catalog-destination__pin,:scope > .mdo-ps-destination__pin')||null;
            const headCritical=document.head.querySelector('#mdo-catalog-control-widths-critical-20260828');
            return {
              toolbar:box(toolbar), left:box(left), countBox:box(count), destWrap:box(destWrap), dest:box(dest), orderForm:box(orderForm), order:box(order),
              available, innerLeft,
              textAlign:destStyle?.textAlign||null,
              destBg:destStyle?.backgroundColor||null,
              destBorder:destStyle?.borderTopColor||null,
              pinDisplay:pinStyle?.display||null,
              pinWidth:pinStyle?.width||null,
              textWeight:text?getComputedStyle(text).fontWeight:null,
              strongWeight:strong?getComputedStyle(strong).fontWeight:null,
              legacyPinDisplay:legacyPin?getComputedStyle(legacyPin).display:null,
              legacyPinExists:!!legacyPin,
              chevronDisplay:chevron?getComputedStyle(chevron).display:null,
              controlVersion:toolbar?.dataset?.mdoCatalogControlWidths||null,
              criticalInHead:!!headCritical,
              overflow:document.documentElement.scrollWidth-innerWidth,
              count:products?products.querySelectorAll(':scope > li.product').length:0,
              ids:products?[...products.querySelectorAll(':scope > li.product')].slice(0,12).map(x=>x.className.match(/post-(\d+)/)?.[1]||null):[],
              controlScript:!!document.getElementById('mdo-catalog-control-widths-20260828')
            };
          }'''

          def close(a,b,t=2.0): return abs(float(a)-float(b)) <= t
          def weight(v):
              try: return int(float(v))
              except (TypeError, ValueError):
                  return {'normal':400,'bold':700}.get(str(v).lower(),0)

          errors=[]; report={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              for width,height in sizes:
                  report[str(width)]={}
                  for kind,url in urls.items():
                      page.set_viewport_size({'width':width,'height':height})
                      page.goto(url,wait_until='networkidle',timeout=120000)
                      page.wait_for_timeout(900)
                      d=page.evaluate(js); report[str(width)][kind]=d

                      if not d['controlScript']:
                          errors.append(f'{kind} {width}: control refinement missing')
                      if d['controlVersion'] != '20260828-v4':
                          errors.append(f'{kind} {width}: final control owner not active ({d["controlVersion"]})')
                      if not d['criticalInHead']:
                          errors.append(f'{kind} {width}: critical first-paint CSS is not in head')
                      if d['overflow'] > 1:
                          errors.append(f'{kind} {width}: horizontal overflow {d["overflow"]}')
                      if d['textAlign'] != 'left':
                          errors.append(f'{kind} {width}: destination text not left aligned ({d["textAlign"]})')
                      if d['destBg'] != 'rgb(241, 246, 242)':
                          errors.append(f'{kind} {width}: destination highlight background unexpected ({d["destBg"]})')
                      if d['pinDisplay'] == 'none' or d['pinWidth'] not in ('13px','13'):
                          errors.append(f'{kind} {width}: CSS location cue missing ({d["pinDisplay"]}, {d["pinWidth"]})')
                      if d['legacyPinExists'] and d['legacyPinDisplay'] != 'none':
                          errors.append(f'{kind} {width}: legacy location pin still visible ({d["legacyPinDisplay"]})')
                      if d['chevronDisplay'] == 'none':
                          errors.append(f'{kind} {width}: destination chevron hidden')
                      if weight(d['textWeight']) > 550:
                          errors.append(f'{kind} {width}: Envío a is too bold ({d["textWeight"]})')
                      if weight(d['strongWeight']) < 700 or weight(d['strongWeight']) - weight(d['textWeight']) < 100:
                          errors.append(f'{kind} {width}: country is not distinctly bolder ({d["textWeight"]} vs {d["strongWeight"]})')

                      if width <= 767:
                          if not d['countBox'] or d['innerLeft'] is None or not close(d['countBox']['l'], d['innerLeft'], 3):
                              errors.append(f'{kind} {width}: result count not first/aligned in compact toolbar')
                          for key in ('destWrap','dest','orderForm','order'):
                              if not d[key] or d['available'] is None or not close(d[key]['w'], d['available'], 3):
                                  errors.append(f'{kind} {width}: {key} not full compact width ({d.get(key)} available={d["available"]})')
                      else:
                          if not d['countBox'] or d['innerLeft'] is None or not close(d['countBox']['l'], d['innerLeft'], 3):
                              errors.append(f'{kind} {width}: result count is not the first left control ({d.get("countBox")} innerLeft={d["innerLeft"]})')
                          if not d['countBox'] or not d['destWrap'] or not (d['destWrap']['l'] > d['countBox']['r']):
                              errors.append(f'{kind} {width}: destination is not after result count')
                          if d['countBox'] and d['destWrap']:
                              gap=d['destWrap']['l']-d['countBox']['r']
                              if not (8 <= gap <= 24):
                                  errors.append(f'{kind} {width}: count/destination gap unexpected ({gap})')
                          if not d['destWrap'] or not d['orderForm'] or not (d['destWrap']['r'] < d['orderForm']['l']):
                              errors.append(f'{kind} {width}: ordering is not isolated to the right of destination')

                      if width >= 901:
                          if not d['dest'] or not d['order'] or not (d['dest']['w'] + 12 < d['order']['w']):
                              errors.append(f'{kind} {width}: destination did not compact to content ({d["dest"]} vs {d["order"]})')

                      base_pages=baseline.get('pages',{}).get(kind,{})
                      if str(width) in base_pages:
                          base=base_pages[str(width)]
                          if d['ids'] != base['productIds'] or d['count'] != base['productCount']:
                              errors.append(f'{kind} {width}: catalogue products changed')

                  g=report[str(width)]['global']; v=report[str(width)]['producer']
                  for key in ('destWrap','dest','orderForm','order'):
                      if g[key] and v[key] and not close(g[key]['w'],v[key]['w'],3):
                          errors.append(f'{width}: {key} width differs between global and producer ({g[key]["w"]} vs {v[key]["w"]})')
                  if width > 767 and g['countBox'] and g['destWrap'] and v['countBox'] and v['destWrap']:
                      gap_g=g['destWrap']['l']-g['countBox']['r']
                      gap_v=v['destWrap']['l']-v['countBox']['r']
                      if not close(gap_g,gap_v,2):
                          errors.append(f'{width}: count/destination gap differs between global and producer ({gap_g} vs {gap_v})')
              browser.close()

          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:
              print('ERRORS:')
              print('\n'.join('- '+e for e in errors))
              sys.exit(1)
          print('CATALOG_STABLE_COMPACT_CONTROLS_VERIFIED=true')
          PY

      - name: Roll back refinement on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then install -m 0644 '$BACKUP' '$TARGET' && rm -f '$BACKUP'; else rm -f '$TARGET'; fi"

      - name: Clean deployment backup
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

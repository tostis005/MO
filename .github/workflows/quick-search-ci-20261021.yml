name: Validate quick product search 20261021
on:
  pull_request:
    paths:
      - 'mu-plugins/mdo-quick-search-20261021.php'
      - 'elmercadodeorigen-child/assets/js/quick-search-20261021.js'
      - 'elmercadodeorigen-child/assets/css/quick-search-20261021.css'
      - '.github/workflows/quick-search-ci-20261021.yml'
      - 'tests/quick-search-price-20261021.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and browser JavaScript parse
        run: |
          set -Eeuo pipefail
          php -l mu-plugins/mdo-quick-search-20261021.php
          php -l tests/quick-search-price-20261021.php
          php tests/quick-search-price-20261021.php
          node --check elmercadodeorigen-child/assets/js/quick-search-20261021.js
          test -s elmercadodeorigen-child/assets/css/quick-search-20261021.css
      - name: Ensure live search preserves native form and catalogue rules
        run: |
          set -Eeuo pipefail
          grep -q "site-dialog-search" elmercadodeorigen-child/assets/js/quick-search-20261021.js
          grep -q "form.addEventListener('submit', stop)" elmercadodeorigen-child/assets/js/quick-search-20261021.js
          grep -q "posts_per_page" mu-plugins/mdo-quick-search-20261021.php
          grep -q "no_found_rows" mu-plugins/mdo-quick-search-20261021.php
          grep -q "elmercado_wcfm_vendor_is_disabled_010210" mu-plugins/mdo-quick-search-20261021.php
          grep -q "is_in_stock" mu-plugins/mdo-quick-search-20261021.php
          grep -q "wp_strip_all_tags" mu-plugins/mdo-quick-search-20261021.php
          grep -q "get_variation_price" mu-plugins/mdo-quick-search-20261021.php
          grep -q "showLoading(term)" elmercadodeorigen-child/assets/js/quick-search-20261021.js
          grep -q "aria-busy" elmercadodeorigen-child/assets/js/quick-search-20261021.js

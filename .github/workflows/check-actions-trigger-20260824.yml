name: Check Actions trigger 2026-08-24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-actions-trigger-20260824.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record trigger
        run: |
          mkdir -p .deploy-status
          echo "triggered_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-status/actions-trigger-20260824.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/actions-trigger-20260824.txt
          git commit -m 'Record Actions trigger check'
          git pull --rebase origin main || true
          git push origin HEAD:main

name: Fix one Black Angus English internal link

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-black-angus-en-link-20261015.php'
      - '.github/workflows/fix-black-angus-en-link-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only auditor
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/fix-black-angus-en-link-20261015.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Audit WordPress article bodies and featured images
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] && [ -n "$php" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              path=$(dirname "$cfg")
              site=$("$php" "$wp" option get siteurl --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$site" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com)
                  printf "%s|%s|%s" "$path" "$php" "$wp"; break ;;
              esac
            done
          ')"
          [ -n "$INFO" ] || exit 3
          PROD="${INFO%%|*}";REST="${INFO#*|}";PHP="${REST%%|*}";WP="${REST#*|}"
          DIR="/tmp/emdo-blog-audit-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$DIR'"
          sshpass -e scp $SCP .github/scripts/fix-black-angus-en-link-20261015.php "$STAGING_USER@$STAGING_HOST:$DIR/"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf $DIR" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$DIR/fix-black-angus-en-link-20261015.php' --path='$PROD' --allow-root" | tee /tmp/editorial-audit.log
          sed -n 's/^EMDO_ANGUS_LINK_FIX //p' /tmp/editorial-audit.log | tail -n1 > /tmp/editorial-audit.json
          jq -e '.verified == true and .destination_id > 0 and .post_id > 0' /tmp/editorial-audit.json >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          code=$(curl -sSL --connect-timeout 12 --max-time 55 -A 'Mozilla/5.0 SEO link verifier' -H 'Cache-Control: no-cache' -o /tmp/angus-en.html -w '%{http_code}' "https://www.elmercadodeorigen.com/en/black-angus-ribeye-pan-recipe/?verify_link=${GITHUB_RUN_ID}")
          [ "$code" = 200 ] || { echo "Article HTTP $code" >&2; exit 1; }
          grep -q 'wagyu-vs-angus-differences-marbling-flavour/' /tmp/angus-en.html
          ! grep -q 'wagyu-vs-angus-marbling-flavour-differences/' /tmp/angus-en.html
          echo 'EMDO_ANGUS_LINK_PRODUCTION_VERIFIED'

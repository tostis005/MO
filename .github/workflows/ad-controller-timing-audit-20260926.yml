name: Audit ad controller timing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ad-controller-timing-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Measure controller timing
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options

          url='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&controller_audit=1'
          o=Options(); o.page_load_strategy='eager'
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=en-US'):
              o.add_argument(a)
          d=webdriver.Chrome(options=o); d.set_page_load_timeout(45)
          try:
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':"""
              (()=>{const f=window.fetch;window.fetch=function(input,init){
                const u=typeof input==='string'?input:(input&&input.url)||'';
                if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                  init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                  h.set('X-Country-Code','ZA');init.headers=h;
                }
                return f.call(this,input,init);
              };})();"""})
              try:d.get(url)
              except TimeoutException:
                  try:d.execute_script('window.stop()')
                  except:pass
              time.sleep(3)
              state=d.execute_script(r"""
                const all=performance.getEntriesByType('resource').map(r=>({
                  name:r.name,
                  start:Math.round(r.startTime),
                  dur:Math.round(r.duration),
                  requestStart:Math.round(r.requestStart||0),
                  responseStart:Math.round(r.responseStart||0),
                  responseEnd:Math.round(r.responseEnd||0),
                  transfer:r.transferSize||0,
                  encoded:r.encodedBodySize||0,
                  initiator:r.initiatorType
                }));
                const scripts=Array.from(document.scripts).filter(s=>(s.src||'').includes('adsterra-geo-010290.js')).map(s=>({
                  src:s.src,async:s.async,defer:s.defer,type:s.type||'',outer:s.outerHTML
                }));
                const nav=performance.getEntriesByType('navigation')[0];
                return {
                  readyState:document.readyState,
                  nav:nav?{dom:Math.round(nav.domContentLoadedEventEnd),load:Math.round(nav.loadEventEnd)}:null,
                  controller:all.filter(r=>r.name.includes('adsterra-geo-010290.js')),
                  fastGeo:all.filter(r=>r.name.includes('/assets/ad-geo-fast.php')),
                  frame:all.filter(r=>r.name.includes('/assets/adsterra-frame.html')),
                  scripts:scripts,
                  debug:window.ElMercadoAdsterraGeoDebug||null
                };
              """)
              print('STATE='+json.dumps(state,sort_keys=True),flush=True)
              print('COOKIE_NAMES='+json.dumps(sorted([x.get('name','') for x in d.get_cookies()])),flush=True)
          finally:d.quit()
          PY

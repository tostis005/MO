name: Diagnose production blog cache runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-cache-runtime-diagnostic-20260926.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production cache bootstrap
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          prod_path=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod_path="$p"; break ;;
            esac
          done
          : "${prod_path:?}"
          echo "WP_CACHE=$("$php_bin" "$wp_bin" config get WP_CACHE --path="$prod_path" --allow-root 2>/dev/null || echo missing)"
          adv="$prod_path/wp-content/advanced-cache.php"
          echo "ADV_EXISTS=$([ -f "$adv" ] && echo yes || echo no)"
          if [ -f "$adv" ]; then
            "$php_bin" -l "$adv"
            echo "--- ADVANCED CACHE MARKERS ---"
            grep -E 'ELMERCADO_EARLY_HOME_CACHE|X-El-Mercado|mdo-page-cache|return;' "$adv" | head -40 || true
            echo "--- ADVANCED CACHE HASH ---"
            sha256sum "$adv"
          fi
          echo "--- CACHE PLUGINS ---"
          "$php_bin" "$wp_bin" plugin list --status=active --field=name --path="$prod_path" --allow-root 2>/dev/null | grep -Ei 'cache|rocket|lite|speed|perf|redis|varnish' || true
          REMOTE

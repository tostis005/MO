name: Publish cheese batch 01 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cheese-batch-01-production.yml'
      - '.github/scripts/publish-cheese-batch-01-production.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-cheese-batch-01-production.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Publish Spanish and English cheese articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE="/tmp/publish-cheese-batch01-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/publish-cheese-batch-01-production.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" | tee /tmp/cheese-batch01-output.txt

          grep -q 'EMDO_CHEESE_BATCH01_BEGIN' /tmp/cheese-batch01-output.txt
          grep -q '"count":10' /tmp/cheese-batch01-output.txt
          grep -q 'EMDO_CHEESE_BATCH01_END' /tmp/cheese-batch01-output.txt

      - name: Verify public Spanish and English URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'queso-manchego-dop-que-es-como-se-elabora-reconocer-autentico'
            'tipos-de-queso-guia-leche-maduracion-pasta-corteza-elaboracion'
            'queso-tierno-semicurado-curado-viejo-anejo-diferencias'
            'queso-oveja-cabra-vaca-diferencias-como-elegir'
            'queso-leche-cruda-o-pasteurizada-diferencias-sabor-seguridad'
            'como-conservar-queso-correctamente-nevera-envoltorio-temperatura'
            'se-puede-congelar-queso-tipos-como-hacerlo'
            'como-cortar-servir-queso-temperatura-cuchillos-presentacion'
            'como-preparar-tabla-quesos-cantidades-orden-acompanamientos'
            'como-saber-queso-mal-estado-moho-olor-textura'
          )
          en_slugs=(
            'manchego-pdo-cheese-what-it-is-how-made-how-identify-authentic'
            'types-of-cheese-guide-milk-ageing-texture-rind-production'
            'young-semi-aged-aged-long-aged-cheese-differences-how-choose'
            'sheep-goat-cow-cheese-differences-how-choose'
            'raw-milk-vs-pasteurised-cheese-production-flavour-safety'
            'how-to-store-cheese-properly-fridge-wrapping-temperature'
            'can-you-freeze-cheese-which-types-freeze-best-how'
            'how-to-cut-serve-cheese-temperature-knives-cuts-presentation'
            'how-to-build-cheese-board-quantities-order-accompaniments'
            'how-to-tell-cheese-gone-bad-mould-smell-texture-discard'
          )
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 5
            done
            echo "FAILED $code $url" >&2; return 1
          }
          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

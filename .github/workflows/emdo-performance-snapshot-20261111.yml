name: EMDO production performance snapshot (read only) 20261111
on:
  push:
    branches: [diagnostics/emdo-performance-20261111]
    paths: ['.github/workflows/emdo-performance-snapshot-20261111.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Collect anonymized production metrics without changing state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          LOGS=/var/www/vhosts/system/elmercadodeorigen.com/logs
          echo '=== CURRENT SYSTEM / UTC ==='
          date -u
          uptime
          free -m | head -n 3
          df -h / | tail -n 1
          echo '=== PHP WORKER PRESSURE ==='
          ps -eo stat,pcpu,rss,args | awk '/php-fpm: pool elmercadodeorigen.com/ && !/awk/ {n++; if ($1 ~ /^R/) run++; cpu+=$2; rss+=$3} END {printf "workers=%d running=%d cpu_pct_sum=%.1f rss_mebibytes=%.0f\n",n,run,cpu,rss/1024}'
          echo '=== NGINX/PHP/MYSQL ==='
          for unit in nginx plesk-php82-fpm mariadb; do systemctl is-active "$unit" 2>/dev/null || true; done
          echo '=== OBJECT CACHE STATUS (one bounded WP bootstrap) ==='
          if test -e "$ROOT/wp-content/object-cache.php"; then echo 'object-cache.php=PRESENT'; else echo 'object-cache.php=ABSENT'; fi
          /opt/plesk/php/8.2/bin/php -r 'echo "php_redis=".(extension_loaded("redis")?"yes":"no")."\n";'
          timeout 22 /opt/plesk/php/8.2/bin/php -d memory_limit=768M /usr/local/bin/wp eval 'echo "wp_ext_object_cache=".(wp_using_ext_object_cache()?"yes":"no")."\n";' --path="$ROOT" --allow-root 2>/dev/null || echo 'WP_CACHE_PROBE_TIMEOUT_OR_FAILURE'
          echo '=== HOME CACHE FILES AND ACTIVE DROPIN ==='
          for candidate in "$ROOT/wp-content/advanced-cache.php" "$ROOT/wp-content/uploads/elmercado-home-static/index.html"; do
            if test -f "$candidate"; then stat -c '%n bytes=%s updated_epoch=%Y mode=%a' "$candidate"; else echo "$candidate=MISSING"; fi
          done
          grep -En 'elmercado-home-static|X-El-Mercado-Home-Early-Cache|hot_cache_paths' "$ROOT/wp-content/advanced-cache.php" | head -n 6 || true
          echo '=== HOME RESPONSE SAFE HEADER FLAGS ==='
          curl -ksS --connect-timeout 3 --max-time 12 -D - -o /dev/null https://www.elmercadodeorigen.com/ | grep -Ei '^(HTTP/|x-el-mercado|x-emdo|vary:|cache-control:|pragma:|expires:)' | tr -d '\r' || true
          echo '=== SAFE HTML TTFB COMPARISON / CACHED VS WARM ==='
          for endpoint in / /tienda/ /categoria-producto/jamones-paletas/ /producto/jamon-de-bellota-100-iberico/; do
            echo "PATH=$endpoint"
            for attempt in 1 2; do
              H=$(mktemp)
              curl -ksS --connect-timeout 3 --max-time 12 --compressed \
                -D "$H" -o /dev/null -w "attempt=$attempt status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" \
                "https://www.elmercadodeorigen.com$endpoint" || true
              grep -Ei '^(x-emdo-public-cache|x-el-mercado-product-early-cache|x-el-mercado-category-early-cache|x-emdo-nginx-hot-cache|x-el-mercado-home-cache):' "$H" | tr -d '\r' || true
              rm -f "$H"
            done
          done
          echo '=== ANONYMIZED LAST 20 MIN TRAFFIC / PHP SLOWLOG ==='
          python3 - "$LOGS" <<'PY'
          import sys,os,re,datetime,collections,urllib.parse
          now=datetime.datetime.now(datetime.timezone.utc)
          cut=now-datetime.timedelta(minutes=20)
          rx=re.compile(r'^\S+\s+\S+\s+\S+\s+\[([^\]]+)\]\s+"([^"]+)"\s+(\d{3})')
          for name in ('access_ssl_log','proxy_access_ssl_log'):
              fname=os.path.join(sys.argv[1],name)
              n=0;status=collections.Counter();types=collections.Counter();paths=collections.Counter();bot=collections.Counter();minute=collections.Counter()
              try:
                  with open(fname,'rb') as f:
                      f.seek(0,2);f.seek(max(0,f.tell()-12000000))
                      if f.tell():f.readline()
                      lines=f.readlines()
                  for raw in lines:
                      line=raw.decode('utf-8','replace');m=rx.match(line)
                      if not m:continue
                      try:when=datetime.datetime.strptime(m.group(1),'%d/%b/%Y:%H:%M:%S %z').astimezone(datetime.timezone.utc)
                      except ValueError:continue
                      if not cut<=when<=now:continue
                      request=m.group(2).split()
                      if len(request)<2:continue
                      path=urllib.parse.urlsplit(request[1]);p=path.path
                      n+=1;status[m.group(3)]+=1;minute[when.strftime('%H:%M')]+=1
                      keys=set(urllib.parse.parse_qs(path.query).keys())
                      if 'add-to-cart' in keys: types['add-to-cart']+=1
                      if any(k.startswith(('filter_','query_type_')) for k in keys): types['filters']+=1
                      if '/wp-admin/admin-ajax.php'==p: types['admin-ajax']+=1
                      if '/wp-json/' in p: types['wp-json']+=1
                      if p.startswith('/producto/'):paths['product']+=1
                      elif p.startswith('/categoria-producto/'):paths['category']+=1
                      elif p.startswith('/tienda/'):paths['store']+=1
                      elif p.startswith('/wp-content/'):paths['assets']+=1
                      elif p in ('/','/tienda/'):paths['home-or-shop']+=1
                      else:paths['other']+=1
                  print('ACCESS',name,'requests=',n,'statuses=',dict(status),'features=',dict(types),'paths=',dict(paths),'minute=',sorted(minute.items())[-7:])
              except Exception as e: print('ACCESS',name,'error=',type(e).__name__)
          f=os.path.join(sys.argv[1],'php-fpm_slow.log')
          try:
              with open(f,'rb') as fh:
                  fh.seek(0,2);fh.seek(max(0,fh.tell()-5000000))
                  raw=fh.read().decode('utf8','replace')
              parts=re.split(r'(?=\[\d{2}-[A-Za-z]{3}-\d{4} )',raw)
              plugins=collections.Counter();fresh=0
              for p in parts:
                  m=re.match(r'\[(\d{2}-[A-Za-z]{3}-\d{4} \d{2}:\d{2}:\d{2})',p)
                  if not m:continue
                  try:when=datetime.datetime.strptime(m.group(1),'%d-%b-%Y %H:%M:%S').replace(tzinfo=datetime.timezone.utc)
                  except ValueError:continue
                  if when<cut:continue
                  fresh+=1
                  q=re.search(r'/wp-content/plugins/([^/]+)/',p)
                  plugins[q.group(1) if q else 'core-theme-other']+=1
              print('SLOWLOG_RECENT_20M',fresh,'first_plugin=',plugins.most_common(12))
          except Exception as e:print('SLOWLOG_ERROR',type(e).__name__)
          PY
          echo 'PERFORMANCE_SNAPSHOT_READONLY_COMPLETE'
          REMOTE

name: Visual audit staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
      - 'elmercadodeorigen-child/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-visual-audit
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for deployed refinements
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dev.elmercadodeorigen.com/?emo-audit=${GITHUB_SHA}"
          for attempt in {1..35}; do
            if curl -fsSL --max-time 25 "$URL" -o /tmp/home.html \
              && grep -q -- '--emo-mobile-panel' /tmp/home.html \
              && grep -q 'Los favoritos de nuestros clientes' /tmp/home.html; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Verify discovery files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 https://dev.elmercadodeorigen.com/robots.txt | tee /tmp/robots.txt
          grep -q '^User-agent: \*$' /tmp/robots.txt
          grep -q '^Sitemap:' /tmp/robots.txt
          curl -fsSL --max-time 25 https://dev.elmercadodeorigen.com/llms.txt | tee /tmp/llms.txt
          grep -q '^# El Mercado de Origen$' /tmp/llms.txt

      - name: Audit interfaces and homepage resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

          cat > audit.cjs <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');
          const base = 'https://dev.elmercadodeorigen.com';
          const suffix = `emo-audit=${process.env.GITHUB_SHA}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const hiddenOrMissing = (value) => value === null || value === 'none';

          async function prepare(page, url) {
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 90000 });
            await page.addStyleTag({ content: `
              #cookie-law-info-bar, #cookie-law-info-again,
              #ht-ctc-chat, .grecaptcha-badge { display:none !important; }
            ` });
            await sleep(900);
          }

          async function hoverState(page) {
            return page.evaluate(() => {
              const image = document.querySelector('ul.products li.product .product-loop-hover-image');
              const action = document.querySelector('ul.products li.product .product-loop-action');
              const button = document.querySelector('ul.products li.product .loop-add-to-cart-on-image');
              return {
                image: image ? getComputedStyle(image).display : null,
                action: action ? getComputedStyle(action).display : null,
                button: button ? getComputedStyle(button).display : null
              };
            });
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-gpu']
            });
            const report = {};
            const failures = [];

            const desktop = await browser.newPage();
            await desktop.setViewport({ width: 1440, height: 1800, deviceScaleFactor: 1 });
            await prepare(desktop, `${base}/?${suffix}`);
            await desktop.screenshot({ path: 'visual-audit/home-desktop.png' });

            report.home = await desktop.evaluate(() => {
              const resources = performance.getEntriesByType('resource').map((entry) => entry.name);
              const banned = [
                '/plugins/elementor/', '/plugins/contact-form-7/',
                '/recaptcha/', 'google.com/recaptcha', '/plugins/slide-anything/',
                '/plugins/wc-frontend-manager/', '/plugins/yith-woocommerce-wishlist/',
                '/plugins/waitlist-woocommerce/', '/custom-css-js/6585.css',
                '/custom-css-js/1341.js', 'Inter-VariableFont'
              ];
              const styles = [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.href);
              return {
                resourceCount: resources.length,
                stylesheetCount: styles.length,
                scriptCount: document.querySelectorAll('script[src]').length,
                bannedResources: resources.filter((url) => banned.some((fragment) => url.includes(fragment))),
                childStylesheets: styles.filter((url) => url.includes('/elmercadodeorigen-child/assets/css/')),
                woostifyStylesheets: styles.filter((url) => url.includes('/themes/woostify/style.css')),
                accountLabel: document.querySelector('.site-tools .my-account-icon')?.getAttribute('aria-label') || '',
                cartLabel: document.querySelector('.site-tools .shopping-cart')?.getAttribute('aria-label') || '',
                navigationId: document.querySelector('.site-header .main-navigation')?.id || '',
                unnamedDialogs: [...document.querySelectorAll('[role="dialog"]')].filter((dialog) => !dialog.getAttribute('aria-label') && !dialog.getAttribute('aria-labelledby')).length
              };
            });

            const homeCard = await desktop.$('.emo-featured-products ul.products li.product');
            if (homeCard) {
              await homeCard.hover();
              await sleep(450);
              await homeCard.screenshot({ path: 'visual-audit/home-product-hover.png' });
            }
            report.homeHover = await hoverState(desktop);

            await prepare(desktop, `${base}/tienda/?${suffix}`);
            const shopCard = await desktop.$('ul.products li.product');
            let productUrl = '';
            if (shopCard) {
              productUrl = await desktop.evaluate(() => document.querySelector('ul.products li.product a.woocommerce-LoopProduct-link, ul.products li.product a.woocommerce-loop-product__link')?.href || '');
              await shopCard.hover();
              await sleep(450);
              await shopCard.screenshot({ path: 'visual-audit/shop-product-hover.png' });
            }
            report.shopHover = await hoverState(desktop);
            await desktop.screenshot({ path: 'visual-audit/shop-desktop.png' });

            if (productUrl) {
              await prepare(desktop, `${productUrl}${productUrl.includes('?') ? '&' : '?'}${suffix}`);
              const related = await desktop.$('section.related.products');
              if (related) {
                await related.evaluate((element) => element.scrollIntoView({ block: 'start' }));
                await sleep(550);
                await related.screenshot({ path: 'visual-audit/product-related.png' });
              }
              report.product = await desktop.evaluate(() => {
                const list = document.querySelector('section.related.products ul.products');
                return {
                  relatedDisplay: document.querySelector('section.related.products') ? getComputedStyle(document.querySelector('section.related.products')).display : null,
                  relatedColumns: list ? getComputedStyle(list).gridTemplateColumns : null,
                  visibleSaleBadges: [...document.querySelectorAll('.onsale, .berocket_better_labels_image')].filter((badge) => getComputedStyle(badge).display !== 'none').length
                };
              });
            }
            await desktop.close();

            const mobile = await browser.newPage();
            await mobile.setViewport({ width: 390, height: 844, deviceScaleFactor: 1, isMobile: true });
            await mobile.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1');
            await prepare(mobile, `${base}/?${suffix}`);
            await mobile.click('.toggle-sidebar-menu-btn');
            await sleep(450);
            await mobile.screenshot({ path: 'visual-audit/mobile-menu-open.png' });
            report.mobileMenu = await mobile.evaluate(() => {
              const menu = document.querySelector('.sidebar-menu');
              const duplicate = document.querySelector('.sidebar-menu .emo-duplicate-search-item');
              const trigger = document.querySelector('.toggle-sidebar-menu-btn');
              return {
                open: document.documentElement.classList.contains('sidebar-menu-open'),
                background: menu ? getComputedStyle(menu).backgroundColor : null,
                duplicateSearch: duplicate ? getComputedStyle(duplicate).display : null,
                expanded: trigger?.getAttribute('aria-expanded') || '',
                triggerLabel: trigger?.getAttribute('aria-label') || '',
                menuHidden: menu?.getAttribute('aria-hidden') || ''
              };
            });
            await mobile.close();

            if (report.home.bannedResources.length) failures.push(`Unexpected homepage resources: ${report.home.bannedResources.join(', ')}`);
            if (report.home.childStylesheets.length) failures.push('Child CSS is still split into external requests.');
            if (report.home.woostifyStylesheets.length !== 1) failures.push(`Expected one Woostify stylesheet, found ${report.home.woostifyStylesheets.length}.`);
            if (report.home.resourceCount > 70) failures.push(`Homepage resource count is ${report.home.resourceCount}; expected 70 or fewer.`);
            if (!report.home.accountLabel || !report.home.cartLabel || report.home.navigationId !== 'site-navigation') failures.push('Header accessibility labels or skip target are missing.');
            if (report.home.unnamedDialogs) failures.push(`${report.home.unnamedDialogs} dialog(s) lack an accessible name.`);
            if (!hiddenOrMissing(report.homeHover.image) || !hiddenOrMissing(report.homeHover.action) || !hiddenOrMissing(report.homeHover.button)) failures.push('Homepage hover layers are still visible.');
            if (!hiddenOrMissing(report.shopHover.image) || !hiddenOrMissing(report.shopHover.action) || !hiddenOrMissing(report.shopHover.button)) failures.push('Shop hover layers are still visible.');
            if (!report.mobileMenu.open || report.mobileMenu.duplicateSearch !== 'none' || report.mobileMenu.expanded !== 'true' || report.mobileMenu.menuHidden !== 'false') failures.push('Mobile navigation state is incorrect.');
            if (report.product && report.product.visibleSaleBadges !== 0) failures.push('A visible promotional sale badge remains on the product page.');

            fs.writeFileSync('visual-audit/report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('visual-audit/assertions.txt', failures.length ? failures.join('\n') : 'All visual and resource assertions passed.\n');
            await browser.close();
            if (failures.length) throw new Error(failures.join('\n'));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node audit.cjs
          cat visual-audit/report.json
          cat visual-audit/assertions.txt

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-visual-audit
          path: visual-audit/
          retention-days: 7

name: Visual audit staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
      - 'elmercadodeorigen-child/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-visual-audit
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the optimized child theme
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dev.elmercadodeorigen.com/?emo-audit=${GITHUB_SHA}"
          for attempt in {1..35}; do
            if curl -fsSL --max-time 25 "$URL" -o /tmp/home.html \
              && grep -q -- '--emo-mobile-panel' /tmp/home.html \
              && grep -q 'Los favoritos de nuestros clientes' /tmp/home.html; then
              exit 0
            fi
            sleep 6
          done
          echo 'The optimized staging version was not detected in time.' >&2
          exit 1

      - name: Capture interfaces resources and measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

          cat > visual-audit.cjs <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const base = 'https://dev.elmercadodeorigen.com';
          const suffix = `emo-audit=${process.env.GITHUB_SHA}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const serialize = (value) => value ? {
            x: Math.round(value.x),
            y: Math.round(value.y),
            width: Math.round(value.width),
            height: Math.round(value.height)
          } : null;

          async function prepare(page, url) {
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 90000 });
            await page.addStyleTag({
              content: `
                #cookie-law-info-bar,
                #cookie-law-info-again,
                #ht-ctc-chat,
                .grecaptcha-badge { display: none !important; }
              `
            });

            await page.evaluate(async () => {
              const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              const distance = Math.max(450, Math.round(window.innerHeight * 0.75));
              for (let y = 0; y < document.body.scrollHeight; y += distance) {
                window.scrollTo(0, y);
                await delay(90);
              }
              window.scrollTo(0, 0);
            });
            await sleep(900);
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-gpu']
            });

            const report = {};
            let productUrl = '';

            for (const mode of [
              { name: 'desktop', width: 1440, height: 2200, mobile: false },
              { name: 'mobile', width: 390, height: 1600, mobile: true }
            ]) {
              const page = await browser.newPage();
              await page.setViewport({ width: mode.width, height: mode.height, deviceScaleFactor: 1, isMobile: mode.mobile });
              if (mode.mobile) {
                await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1');
              }

              const homeUrl = `${base}/?${suffix}`;
              await prepare(page, homeUrl);
              await page.screenshot({ path: `visual-audit/home-${mode.name}.png` });

              const bestSellers = await page.$('.emo-featured-products');
              if (bestSellers) {
                await bestSellers.screenshot({ path: `visual-audit/home-bestsellers-${mode.name}.png` });
              }

              report[`home_${mode.name}`] = await page.evaluate(() => {
                const urls = performance.getEntriesByType('resource').map((entry) => entry.name);
                const bannedFragments = [
                  '/plugins/elementor/',
                  '/plugins/contact-form-7/',
                  '/recaptcha/',
                  'google.com/recaptcha',
                  '/plugins/slide-anything/',
                  '/plugins/wc-frontend-manager/',
                  '/plugins/yith-woocommerce-wishlist/',
                  '/plugins/waitlist-woocommerce/',
                  '/custom-css-js/6585.css',
                  '/custom-css-js/1341.js',
                  'Inter-VariableFont'
                ];
                const styles = [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.href);
                const scripts = [...document.querySelectorAll('script[src]')].map((script) => script.src);
                const hoverImage = document.querySelector('ul.products li.product .product-loop-hover-image');
                const hoverButton = document.querySelector('ul.products li.product .loop-add-to-cart-on-image');
                const childStyleLinks = styles.filter((url) => url.includes('/elmercadodeorigen-child/assets/css/'));
                const woostifyLinks = styles.filter((url) => url.includes('/themes/woostify/style.css'));

                return {
                  resources: urls.length,
                  styles: styles.length,
                  scripts: scripts.length,
                  childStyleLinks,
                  woostifyLinks,
                  bannedResources: urls.filter((url) => bannedFragments.some((fragment) => url.includes(fragment))),
                  hoverImageDisplay: hoverImage ? getComputedStyle(hoverImage).display : null,
                  hoverButtonDisplay: hoverButton ? getComputedStyle(hoverButton).display : null,
                  accountLabel: document.querySelector('.site-tools .my-account-icon')?.getAttribute('aria-label') || '',
                  cartLabel: document.querySelector('.site-tools .shopping-cart')?.getAttribute('aria-label') || '',
                  navigationId: document.querySelector('.site-header .main-navigation')?.id || '',
                  dialogNames: [...document.querySelectorAll('[role="dialog"]')].map((dialog) => dialog.getAttribute('aria-label') || dialog.getAttribute('aria-labelledby') || '')
                };
              });

              const firstHomeCard = await page.$('.emo-featured-products ul.products li.product');
              if (firstHomeCard) {
                await firstHomeCard.hover();
                await sleep(500);
                await firstHomeCard.screenshot({ path: `visual-audit/home-product-hover-${mode.name}.png` });
              }

              if (mode.mobile) {
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.click('.toggle-sidebar-menu-btn');
                await sleep(500);
                await page.screenshot({ path: 'visual-audit/mobile-menu-open.png' });
                report.mobileMenu = await page.evaluate(() => {
                  const menu = document.querySelector('.sidebar-menu');
                  const duplicateSearch = document.querySelector('.sidebar-menu .emo-duplicate-search-item');
                  const trigger = document.querySelector('.toggle-sidebar-menu-btn');
                  return {
                    open: document.documentElement.classList.contains('sidebar-menu-open'),
                    menuRect: menu?.getBoundingClientRect() || null,
                    menuBackground: menu ? getComputedStyle(menu).backgroundColor : null,
                    duplicateSearchDisplay: duplicateSearch ? getComputedStyle(duplicateSearch).display : null,
                    triggerExpanded: trigger?.getAttribute('aria-expanded') || '',
                    triggerLabel: trigger?.getAttribute('aria-label') || '',
                    menuHidden: menu?.getAttribute('aria-hidden') || ''
                  };
                });
                if (report.mobileMenu.menuRect) {
                  report.mobileMenu.menuRect = serialize(report.mobileMenu.menuRect);
                }
              }

              const shopUrl = `${base}/tienda/?${suffix}`;
              await prepare(page, shopUrl);
              await page.screenshot({ path: `visual-audit/shop-${mode.name}.png` });

              if (!productUrl) {
                productUrl = await page.evaluate(() => {
                  const link = document.querySelector('ul.products li.product a.woocommerce-LoopProduct-link, ul.products li.product a.woocommerce-loop-product__link');
                  return link ? link.href : '';
                });
              }

              report[`shop_${mode.name}`] = await page.evaluate(() => {
                const readRect = (selector) => document.querySelector(selector)?.getBoundingClientRect() || null;
                const card = document.querySelector('ul.products li.product');
                const media = document.querySelector('.product-loop-image-wrapper');
                const hoverImage = document.querySelector('.product-loop-hover-image');
                const hoverButton = document.querySelector('.loop-add-to-cart-on-image');
                return {
                  container: readRect('#content > .woostify-container'),
                  primary: readRect('#primary'),
                  secondary: readRect('#secondary'),
                  card: card?.getBoundingClientRect() || null,
                  media: media?.getBoundingClientRect() || null,
                  saleBadges: document.querySelectorAll('.onsale, .berocket_better_labels_image').length,
                  columns: getComputedStyle(document.querySelector('ul.products')).gridTemplateColumns,
                  hoverImageDisplay: hoverImage ? getComputedStyle(hoverImage).display : null,
                  hoverButtonDisplay: hoverButton ? getComputedStyle(hoverButton).display : null
                };
              });

              for (const key of ['container', 'primary', 'secondary', 'card', 'media']) {
                if (report[`shop_${mode.name}`][key]) {
                  report[`shop_${mode.name}`][key] = serialize(report[`shop_${mode.name}`][key]);
                }
              }

              const producersUrl = `${base}/store-listing/?${suffix}`;
              await prepare(page, producersUrl);
              await page.screenshot({ path: `visual-audit/producers-${mode.name}.png` });

              if (productUrl) {
                const url = productUrl.includes('?') ? `${productUrl}&${suffix}` : `${productUrl}?${suffix}`;
                await prepare(page, url);
                await page.screenshot({ path: `visual-audit/product-${mode.name}.png` });

                const related = await page.$('section.related.products');
                if (related) {
                  await related.evaluate((element) => element.scrollIntoView({ block: 'start' }));
                  await sleep(700);
                  await related.screenshot({ path: `visual-audit/product-related-${mode.name}.png` });
                }

                report[`product_${mode.name}`] = await page.evaluate(() => {
                  const readRect = (selector) => document.querySelector(selector)?.getBoundingClientRect() || null;
                  const relatedSection = document.querySelector('section.related.products');
                  const relatedList = relatedSection?.querySelector('ul.products');
                  const relatedCard = relatedList?.querySelector('li.product');
                  return {
                    gallery: readRect('.product-gallery'),
                    summary: readRect('.product-summary'),
                    relatedSection: relatedSection?.getBoundingClientRect() || null,
                    relatedList: relatedList?.getBoundingClientRect() || null,
                    relatedCard: relatedCard?.getBoundingClientRect() || null,
                    relatedDisplay: relatedSection ? getComputedStyle(relatedSection).display : null,
                    relatedColumns: relatedList ? getComputedStyle(relatedList).gridTemplateColumns : null,
                    saleBadges: document.querySelectorAll('.onsale, .berocket_better_labels_image').length
                  };
                });

                for (const key of ['gallery', 'summary', 'relatedSection', 'relatedList', 'relatedCard']) {
                  if (report[`product_${mode.name}`][key]) {
                    report[`product_${mode.name}`][key] = serialize(report[`product_${mode.name}`][key]);
                  }
                }
              }

              await page.close();
            }

            const failures = [];
            if (report.home_desktop.bannedResources.length) failures.push(`Banned homepage resources: ${report.home_desktop.bannedResources.join(', ')}`);
            if (report.home_desktop.childStyleLinks.length) failures.push(`Child CSS still linked externally: ${report.home_desktop.childStyleLinks.join(', ')}`);
            if (report.home_desktop.woostifyLinks.length !== 1) failures.push(`Expected one Woostify stylesheet, found ${report.home_desktop.woostifyLinks.length}`);
            if (report.home_desktop.hoverImageDisplay !== 'none') failures.push('Secondary product image is still active on the homepage.');
            if (report.home_desktop.hoverButtonDisplay !== 'none') failures.push('Legacy circular hover button is still active on the homepage.');
            if (!report.home_desktop.accountLabel || !report.home_desktop.cartLabel) failures.push('Header icon accessible labels are missing.');
            if (report.home_desktop.navigationId !== 'site-navigation') failures.push('The navigation skip target is missing.');
            if (!report.mobileMenu?.open || report.mobileMenu.duplicateSearchDisplay !== 'none') failures.push('The mobile menu or duplicate mobile search is not fixed.');
            if (report.mobileMenu?.triggerExpanded !== 'true' || report.mobileMenu?.menuHidden !== 'false') failures.push('Mobile menu ARIA state is incorrect.');

            fs.copyFileSync('/tmp/home.html', 'visual-audit/home.html');
            fs.writeFileSync('visual-audit/layout-report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('visual-audit/assertions.txt', failures.length ? failures.join('\n') : 'All visual and resource assertions passed.\n');
            await browser.close();

            if (failures.length) {
              throw new Error(failures.join('\n'));
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node visual-audit.cjs
          cat visual-audit/layout-report.json
          cat visual-audit/assertions.txt

      - name: Verify key interfaces
        shell: bash
        run: |
          set -euo pipefail
          test -s visual-audit/home-desktop.png
          test -s visual-audit/home-bestsellers-desktop.png
          test -s visual-audit/home-product-hover-desktop.png
          test -s visual-audit/mobile-menu-open.png
          test -s visual-audit/shop-desktop.png
          test -s visual-audit/product-desktop.png
          test -s visual-audit/product-related-desktop.png
          test -s visual-audit/producers-desktop.png
          grep -q -- '--emo-mobile-panel' visual-audit/home.html
          grep -q 'All visual and resource assertions passed' visual-audit/assertions.txt

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-visual-audit
          path: visual-audit/
          retention-days: 7

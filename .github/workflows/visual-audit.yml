name: Visual audit staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
      - 'elmercadodeorigen-child/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-visual-audit
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://dev.elmercadodeorigen.com
      PRODUCT_PATH: /producto/jamon-de-de-cebo-de-campo-100-iberico-con-dop-los-pedroches-en-sobres-de/

    steps:
      - name: Wait for the deployed child theme
        shell: bash
        run: |
          set -euo pipefail
          URL="${BASE_URL}/?emo-audit=${GITHUB_SHA}"
          for attempt in {1..24}; do
            if curl -fsSL --max-time 20 "$URL" -o /tmp/home.html; then
              if grep -q 'elmercado-child-theme' /tmp/home.html && grep -q 'emo-hero' /tmp/home.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Staging did not expose the expected child-theme markup in time.' >&2
          exit 1

      - name: Capture representative pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit

          capture() {
            name="$1"
            path="$2"
            url="${BASE_URL}${path}?emo-audit=${GITHUB_SHA}"

            curl -fsSL --max-time 30 "$url" -o "visual-audit/${name}.html"
            grep -q 'elmercado-child-theme' "visual-audit/${name}.html"

            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,2200 \
              --screenshot="visual-audit/${name}-desktop.png" \
              "$url"

            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=390,1600 \
              --user-agent='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1' \
              --screenshot="visual-audit/${name}-mobile.png" \
              "$url"
          }

          capture home '/'
          capture shop '/tienda/'
          capture product "$PRODUCT_PATH"
          capture producers '/productores/'

          file visual-audit/*.png

      - name: Verify key interfaces
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'emo-category-grid' visual-audit/home.html
          grep -Eq 'products|woocommerce' visual-audit/shop.html
          grep -Eq 'single-product|product_title' visual-audit/product.html
          grep -Eq 'wcfmmp|store' visual-audit/producers.html

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-visual-audit
          path: visual-audit/
          retention-days: 7

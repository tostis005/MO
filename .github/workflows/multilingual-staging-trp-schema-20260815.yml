name: Inspect TranslatePress staging schema 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/multilingual-staging-trp-schema-20260815.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Inspect TranslatePress database schema and source
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to find staging WordPress path}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp() { "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$WP_PATH" --allow-root "$@"; }
          siteurl="$(wp option get siteurl 2>/dev/null | tail -n1)"
          case "$siteurl" in https://dev.elmercadodeorigen.com*) ;; *) echo "Refusing non-staging: $siteurl" >&2; exit 2;; esac
          prefix="$(wp db prefix)"
          echo '=== TRP SETTINGS ==='
          wp option get trp_settings --format=json 2>/dev/null || true
          echo '=== TRP TABLES ==='
          wp db query "SHOW TABLES LIKE '${prefix}trp_%';" --skip-column-names || true
          echo '=== DICTIONARY TABLES ==='
          dicts="$(wp db query "SHOW TABLES LIKE '${prefix}trp_dictionary%';" --skip-column-names || true)"
          echo "$dicts"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "--- DESCRIBE $t ---"
            wp db query "DESCRIBE \`$t\`;" || true
            echo "--- COUNT/SAMPLE $t ---"
            wp db query "SELECT COUNT(*) AS rows_count FROM \`$t\`;" || true
            wp db query "SELECT * FROM \`$t\` LIMIT 12;" || true
          done <<< "$dicts"
          echo '=== ORIGINAL STRING TABLES ==='
          for t in "${prefix}trp_original_strings" "${prefix}trp_original_meta"; do
            if wp db query "SHOW TABLES LIKE '$t';" --skip-column-names | grep -qx "$t"; then
              echo "--- DESCRIBE $t ---"
              wp db query "DESCRIBE \`$t\`;" || true
              wp db query "SELECT COUNT(*) AS rows_count FROM \`$t\`;" || true
              wp db query "SELECT * FROM \`$t\` LIMIT 12;" || true
            fi
          done
          echo '=== PLUGIN SOURCE: DICTIONARY TABLE CREATION / INSERT ==='
          grep -Rni --include='*.php' -E 'trp_dictionary_|dictionary_table|create.*dictionary|INSERT INTO.*dictionary|original_strings' "$WP_PATH/wp-content/plugins/translatepress-multilingual" 2>/dev/null | head -n 180 || true
          REMOTE

name: Full catalog category census (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/catalog-category-census-20261021.yml'
      - '.github/scripts/catalog-category-census-20261021.php'
permissions: {contents: read}
jobs:
  gourmet:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect every WooCommerce product and category without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/catalog-category-census-20261021.php
          test -n "${STAGING_HOST:-}" && test -n "${STAGING_USER:-}" && test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/emdo-catalog-census-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/catalog-category-census-20261021.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$SCRIPT'" <<'REMOTE'
          set -Eeuo pipefail
          P="$1"; SCRIPT="$2"
          WP_BIN="$(command -v wp)"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          timeout --kill-after=20s 400s "$PHP_BIN" -d memory_limit=1024M "$WP_BIN" eval-file "$SCRIPT" --path="$P" --allow-root --skip-plugins=woostify-sites-library
          REMOTE
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$SCRIPT'" || true

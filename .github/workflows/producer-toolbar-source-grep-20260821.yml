name: Producer toolbar source grep

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/producer-toolbar-source-grep-20260821.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grep-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate live normalizer source
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          mkdir -p .deploy-status
          STATUS=.deploy-status/producer-toolbar-source-grep-20260821.txt
          : > "$STATUS"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf %s "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set +e
            echo '=== exact class ==='
            grep -RIn --binary-files=without-match --exclude-dir=cache --exclude-dir=uploads --exclude='*.log' 'elmercado-vendor-sorting-normalized' '$PROD_PATH/wp-content/themes' '$PROD_PATH/wp-content/mu-plugins' '$PROD_PATH/wp-content/plugins' 2>/dev/null | head -80
            echo '=== style removals near sorting ==='
            grep -RIn --binary-files=without-match --exclude-dir=cache --exclude-dir=uploads --exclude='*.log' -E 'remove(Attribute|Attr).*style|style.*remove(Attribute|Attr)|woostify-sorting' '$PROD_PATH/wp-content/themes' '$PROD_PATH/wp-content/mu-plugins' 2>/dev/null | head -160
          " > "$STATUS" 2>&1
      - name: Record grep result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/producer-toolbar-source-grep-20260821.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record producer toolbar source grep [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

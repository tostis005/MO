name: Configure staging static cache

on:
  workflow_run:
    workflows: ['Deploy child theme to staging']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-staging-static-cache
  cancel-in-progress: true

jobs:
  cache:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_URL: https://dev.elmercadodeorigen.com
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - name: Validate connection settings
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$STAGING_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]]

      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure WordPress root cache policy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          domain="$2"
          wp_path=""

          case "$raw" in
            */wp-content/themes/elmercadodeorigen-child) wp_path="$(dirname "$(dirname "$(dirname "$raw")")")" ;;
            */wp-content/themes) wp_path="$(dirname "$(dirname "$raw")")" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac

          if [ ! -f "$wp_path/wp-config.php" ] || [ ! -d "$wp_path/wp-content" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates"' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php \
                ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' \
                2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep "/${domain}/wp-config.php$" "$candidates" | head -n 1 || true)"
            [ -n "$preferred" ] || { echo "No WordPress installation found for ${domain}." >&2; exit 1; }
            wp_path="$(dirname "$preferred")"
          fi

          [ "$(basename "$wp_path")" = "$domain" ] || { echo "Resolved path does not match ${domain}." >&2; exit 1; }
          htaccess="$wp_path/.htaccess"
          touch "$htaccess"
          [ -w "$htaccess" ] || { echo "Cannot write ${htaccess}." >&2; exit 1; }

          tmp="$(mktemp)"
          awk '
            $0 == "# BEGIN El Mercado Static Cache" { skip=1; next }
            $0 == "# END El Mercado Static Cache" { skip=0; next }
            !skip { print }
          ' "$htaccess" > "$tmp"

          cat >> "$tmp" <<'CACHE'

# BEGIN El Mercado Static Cache
<IfModule mod_expires.c>
ExpiresActive On
ExpiresByType text/css "access plus 1 year"
ExpiresByType application/javascript "access plus 1 year"
ExpiresByType text/javascript "access plus 1 year"
ExpiresByType image/jpeg "access plus 1 year"
ExpiresByType image/png "access plus 1 year"
ExpiresByType image/gif "access plus 1 year"
ExpiresByType image/webp "access plus 1 year"
ExpiresByType image/avif "access plus 1 year"
ExpiresByType image/svg+xml "access plus 1 year"
ExpiresByType image/x-icon "access plus 1 year"
ExpiresByType font/woff "access plus 1 year"
ExpiresByType font/woff2 "access plus 1 year"
ExpiresByType font/ttf "access plus 1 year"
ExpiresByType font/otf "access plus 1 year"
</IfModule>
<IfModule mod_headers.c>
<FilesMatch "\.(css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|otf)$">
Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
</IfModule>
# END El Mercado Static Cache
CACHE

          cat "$tmp" > "$htaccess"
          rm -f "$tmp"
          echo "Static cache policy installed in ${htaccess}."
          REMOTE

      - name: Verify public cache headers
        shell: bash
        run: |
          set -euo pipefail
          ASSET="$STAGING_URL/wp-content/themes/elmercadodeorigen-child/style.css?cache-check=$(date +%s)"
          headers="$(curl -sSIL --max-time 30 "$ASSET")"
          printf '%s\n' "$headers"
          normalized="$(printf '%s\n' "$headers" | tr -d '\r')"
          cache_control="$(printf '%s\n' "$normalized" | grep -i '^cache-control:' | tail -n 1 || true)"
          expires="$(printf '%s\n' "$normalized" | grep -i '^expires:' | tail -n 1 || true)"
          printf 'Resolved Cache-Control: %s\n' "${cache_control:-missing}"
          printf 'Resolved Expires: %s\n' "${expires:-missing}"
          printf '%s\n' "$cache_control" | grep -Eiq 'max-age=31536000'
          printf '%s\n' "$cache_control" | grep -Eiq 'immutable'

      - name: Cache policy summary
        run: echo 'Static CSS, JS, images and fonts now advertise a one-year immutable browser cache on staging.'

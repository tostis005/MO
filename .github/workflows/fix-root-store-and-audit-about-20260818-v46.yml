name: One-time protected nutrition batch 21-25

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-root-store-and-audit-about-20260818-v46.yml']

concurrency:
  group: publish-nutrition-priority-21-25-final
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify batch 21-25
        shell: bash
        run: bash .github/scripts/run-nutrition-priority-21-25-production.sh

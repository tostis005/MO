name: AdSense TCF regions 0.10.283 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-tcf-regions-010283-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/adsense-geo-010266.php
          grep -Fq 'elmercado_adsense_country_requires_tcf_010283' elmercadodeorigen-child/inc/adsense-geo-010266.php
      - name: Deploy and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          DEST="$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc/adsense-geo-010266.php"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/adsense-geo-010266.php "$STAGING_USER@$STAGING_HOST:$DEST"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$DEST'; wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          BASE='https://www.elmercadodeorigen.com/wp-json/elmercado/v1/adsense-eligibility'
          for C in GB CH NO IE ES; do
            BODY=$(curl -fsSL --retry 3 -H "X-Country-Code: $C" "$BASE?verify=${GITHUB_RUN_ID}$C")
            echo "$C $BODY"
            grep -Eq '"requires_tcf"[[:space:]]*:[[:space:]]*true' <<< "$BODY"
            grep -Eq '"show_ads"[[:space:]]*:[[:space:]]*false' <<< "$BODY"
          done
          for C in US MX ZA; do
            BODY=$(curl -fsSL --retry 3 -H "X-Country-Code: $C" "$BASE?verify=${GITHUB_RUN_ID}$C")
            echo "$C $BODY"
            grep -Eq '"requires_tcf"[[:space:]]*:[[:space:]]*false' <<< "$BODY"
            grep -Eq '"show_ads"[[:space:]]*:[[:space:]]*true' <<< "$BODY"
          done
          echo 'ADSENSE_TCF_REGION_POLICY=PASS'

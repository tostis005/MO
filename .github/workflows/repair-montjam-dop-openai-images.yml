name: Repair Montjam DOP OpenAI Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-montjam-dop-openai-images.yml'
      - 'tools/repair-montjam-dop-openai-images.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-montjam-dop-openai-images
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate repair script
        run: php -l tools/repair-montjam-dop-openai-images.php

      - name: Repair production images and validate OpenAI feed
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_REPAIR="/tmp/repair-montjam-dop-openai-images-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS tools/repair-montjam-dop-openai-images.php "$STAGING_USER@$STAGING_HOST:$REMOTE_REPAIR"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_REPAIR'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_REPAIR="$2"
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)

          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$REMOTE_REPAIR" --path="$PROD_PATH" --allow-root
          rm -f "$REMOTE_REPAIR"

          VALIDATE=/tmp/openai-catalog-after-image-repair.json
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '$s=mdo_openai_settings_20260909(); $s["format"]="native_jsonl_gz"; $s["delivery"]="none"; echo wp_json_encode(mdo_openai_validate_catalog_20260909($s),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);' --path="$PROD_PATH" --allow-root >"$VALIDATE"
          "$php_bin" -r '
            $j=json_decode(file_get_contents($argv[1]),true);
            if(!is_array($j)){fwrite(STDERR,"Validation JSON invalid\n");exit(2);}
            printf("Validation: parents=%d variants=%d exported=%d excluded=%d errors=%d warnings=%d\n",$j["parents"]??0,$j["variants"]??0,$j["exported"]??0,$j["excluded"]??0,$j["errors"]??0,$j["warnings"]??0);
            foreach((array)($j["issues"]??[]) as $issue){printf("ISSUE: %s | %s | %s\n",$issue["severity"]??"",$issue["item_id"]??"",$issue["message"]??"");}
            if((int)($j["errors"]??-1)!==0) exit(3);
          ' "$VALIDATE"

          GEN=/tmp/openai-generate-after-image-repair.json
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '$s=mdo_openai_settings_20260909(); $s["format"]="native_jsonl_gz"; $s["delivery"]="none"; $s["auto_upload"]="0"; $p=new MDO_OpenAI_Commerce_Feed_Provider_20260909($s); echo wp_json_encode($p->generate(),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);' --path="$PROD_PATH" --allow-root >"$GEN"
          "$php_bin" -r '
            $j=json_decode(file_get_contents($argv[1]),true);
            if(!is_array($j)||empty($j["ok"])) exit(2);
            $r=$j["report"]??[];
            printf("Generation: exported=%d errors=%d warnings=%d bytes=%d\n",$r["exported"]??0,$r["errors"]??0,$r["warnings"]??0,$r["bytes"]??0);
            if((int)($r["errors"]??-1)!==0) exit(3);
          ' "$GEN"

          FEED_PATH=$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo mdo_openai_feed_path_20260909("native_jsonl_gz");' --path="$PROD_PATH" --allow-root)
          test -f "$FEED_PATH"
          gzip -t "$FEED_PATH"
          "$php_bin" -r '
            $f=gzopen($argv[1],"rb"); if(!$f) exit(2); $n=0; $ids=[]; $required=["item_id","title","description","url","brand","seller_name","image_url","availability","price"];
            while(!gzeof($f)){ $line=trim((string)gzgets($f)); if($line==="")continue; $r=json_decode($line,true); if(!is_array($r))exit(3); foreach($required as $k){if(!isset($r[$k])||trim((string)$r[$k])==="")exit(4);} if(isset($ids[$r["item_id"]]))exit(5); $ids[$r["item_id"]]=1; $n++; }
            gzclose($f); printf("Feed records: %d\n",$n); if($n<1)exit(6);
          ' "$FEED_PATH"

          feed_code=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/openai-feed-public.txt -w '%{http_code}' 'https://www.elmercadodeorigen.com/emdo-feed/openai/mercado-de-origen-products.jsonl.gz')
          test "$feed_code" = '404'
          echo "Public onboarding guard remains HTTP 404 as expected"
          REMOTE

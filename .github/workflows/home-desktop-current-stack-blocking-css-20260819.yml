name: Home current stack with stable desktop CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-desktop-current-stack-blocking-css-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-current-stack-blocking-css-production
  cancel-in-progress: true

jobs:
  deploy-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build blocking Home cache from current source
        shell: bash
        run: |
          set -euo pipefail
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/home-cache-original.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          old='''\t$deferred_tag = '<link id="elmercado-home-deferred-css" rel="preload" as="style" href="' . $css_url . '" onload="this.onload=null;this.rel=\\'stylesheet\\'">'\n\t\t. '<noscript><link rel="stylesheet" href="' . $css_url . '"></noscript>';'''
          new='''\t/* Desktop stability: this stylesheet contains structural Home rules and must\n\t * be applied before first paint; async application produced ~0.8 CLS. */\n\t$deferred_tag = '<link id="elmercado-home-deferred-css" rel="stylesheet" href="' . $css_url . '">';'''
          if old not in s:
              raise SystemExit('async deferred tag not found')
          p.write_text(s.replace(old,new,1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php

      - name: Deploy entire current Home performance stack
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "$PROD" > /tmp/prod-path

          declare -A FILES=(
            [home-cache.php]='elmercadodeorigen-child/inc/home-cache.php'
            [critical.css]='elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
            [theme.js]='elmercadodeorigen-child/assets/js/theme.js'
            [commerce.js]='elmercadodeorigen-child/assets/js/commerce.js'
            [responsive-vendors.php]='elmercadodeorigen-child/mu-plugins/elmercado-home-responsive-vendors-010253.php'
            [home-cls.php]='elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php'
            [a11y.php]='elmercadodeorigen-child/mu-plugins/elmercado-home-a11y-motion-010265.php'
            [stars.php]='elmercadodeorigen-child/mu-plugins/elmercado-home-native-stars-010264.php'
            [home-performance.php]='mu-plugins/mdo-home-performance-20260819.php'
            [webp.php]='mu-plugins/mdo-home-webp-delivery-20260819.php'
            [trp.php]='mu-plugins/mdo-home-translatepress-lite-20260819.php'
          )
          for key in "${!FILES[@]}"; do
            timeout 45s sshpass -e scp $SCP "${FILES[$key]}" "$STAGING_USER@$STAGING_HOST:/tmp/current-$key-${GITHUB_RUN_ID}"
          done

          timeout 240s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; MU='$PROD/wp-content/mu-plugins'
            install -m 0644 /tmp/current-home-cache.php-${GITHUB_RUN_ID} \"\$THEME/inc/home-cache.php\"
            install -m 0644 /tmp/current-critical.css-${GITHUB_RUN_ID} \"\$THEME/assets/css/critical-woostify-home.min.css\"
            install -m 0644 /tmp/current-theme.js-${GITHUB_RUN_ID} \"\$THEME/assets/js/theme.js\"
            install -m 0644 /tmp/current-commerce.js-${GITHUB_RUN_ID} \"\$THEME/assets/js/commerce.js\"
            install -m 0644 /tmp/current-responsive-vendors.php-${GITHUB_RUN_ID} \"\$MU/elmercado-home-responsive-vendors-010253.php\"
            install -m 0644 /tmp/current-home-cls.php-${GITHUB_RUN_ID} \"\$MU/elmercado-home-cls-010256.php\"
            install -m 0644 /tmp/current-a11y.php-${GITHUB_RUN_ID} \"\$MU/elmercado-home-a11y-motion-010265.php\"
            install -m 0644 /tmp/current-stars.php-${GITHUB_RUN_ID} \"\$MU/elmercado-home-native-stars-010264.php\"
            install -m 0644 /tmp/current-home-performance.php-${GITHUB_RUN_ID} \"\$MU/mdo-home-performance-20260819.php\"
            install -m 0644 /tmp/current-webp.php-${GITHUB_RUN_ID} \"\$MU/mdo-home-webp-delivery-20260819.php\"
            install -m 0644 /tmp/current-trp.php-${GITHUB_RUN_ID} \"\$MU/mdo-home-translatepress-lite-20260819.php\"
            rm -f \"\$MU/elmercado-home-header-cls-010279.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/home-cache.php\"
            \"\$php_bin\" -l \"\$MU/mdo-home-performance-20260819.php\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/current-*-${GITHUB_RUN_ID}
          "

      - name: Warm and verify current stack
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.elmercadodeorigen.com/'
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 "$URL" -o /dev/null; done
          curl -fsS --compressed --max-time 45 "$URL" -o /tmp/home.html
          grep -q 'id="elmercado-home-deferred-css" rel="stylesheet"' /tmp/home.html
          grep -q 'mdo-trp-language-switcher-lite-js' /tmp/home.html

      - name: Lighthouse desktop 3x
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          URL='https://www.elmercadodeorigen.com/'
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 "$URL" --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/lhr-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done
          python3 - <<'PY' | tee runtime/home-current-stack-blocking-css-20260819.txt
          import json,statistics
          rows=[]
          for i in range(1,4):
              r=json.load(open(f'/tmp/lhr-{i}.json')); a=r['audits']
              row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue'],'si':round(a['speed-index']['numericValue'])}
              rows.append(row); print('run',i,row)
              for item in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:6]:
                  n=item.get('node') or {}; print(' shift',item.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(x[k] for x in rows) for k in rows[0]}
          for k,v in med.items(): print('median_'+k+'=',v)
          keep=med['cls'] < 0.1 and med['lcp'] < 6000 and med['fcp'] < 4000
          print('keep=',str(keep).lower())
          open('/tmp/keep-current-blocking','w').write('1' if keep else '0')
          PY

      - name: Persist blocking CSS source only if accepted
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep-current-blocking 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then
            cp /tmp/home-cache-original.php elmercadodeorigen-child/inc/home-cache.php
            PROD=$(cat /tmp/prod-path)
            PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
            sshpass -e scp $SCP /tmp/home-cache-original.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-current-revert-${GITHUB_RUN_ID}.php"
            timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; install -m 0644 /tmp/home-cache-current-revert-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/home-cache-current-revert-${GITHUB_RUN_ID}.php"
          fi
          mkdir -p runtime
          [ -f runtime/home-current-stack-blocking-css-20260819.txt ] || printf 'deploy=%s\nmeasure=%s\nkeep=false\n' '${{ steps.deploy.outcome }}' '${{ steps.measure.outcome }}' > runtime/home-current-stack-blocking-css-20260819.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/home-cache.php runtime/home-current-stack-blocking-css-20260819.txt
          git commit -m 'Stabilize Home CSS delivery after desktop measurement' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

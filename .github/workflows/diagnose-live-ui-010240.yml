name: Diagnose live UI 0.10.240

on:
  push:
    paths:
      - '.github/workflows/diagnose-live-ui-010240.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production markup and content
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"
          echo '=== SHOP PAGE CONTENT ==='
          SHOP_ID="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp post list --post_type=page --name=tienda --field=ID --path='$PROD_PATH' --allow-root | head -n1")"
          if [ -n "$SHOP_ID" ]; then sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp post get '$SHOP_ID' --field=post_content --path='$PROD_PATH' --allow-root"; fi
          echo '=== PRODUCERS PAGE CONTENT ==='
          PROD_ID="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp post list --post_type=page --name=productores --field=ID --path='$PROD_PATH' --allow-root | head -n1")"
          if [ -n "$PROD_ID" ]; then sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp post get '$PROD_ID' --field=post_content --path='$PROD_PATH' --allow-root"; fi

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for (const path of ['/productores/','/tienda/','/tienda/hidalgo-de-la-jara/']) {
              const page=await browser.newPage();
              await page.setCacheEnabled(false);
              await page.setViewport({width:390,height:1000});
              await page.goto(`${process.env.BASE_URL}${path}?diag240=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              await sleep(100);
              const early=await page.evaluate(()=>({
                bodyClass:document.body.className,
                producers:[...document.querySelectorAll('#wcfmmp-stores-wrap *')].filter(el=>/Seleccionar categoría|Ordenar por antigüedad|Mostrando \d/.test((el.textContent||'').replace(/\s+/g,' ').trim())&&el.children.length<15).slice(0,12).map(el=>({tag:el.tagName,cls:el.className,id:el.id,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height})),
                counts:[...document.querySelectorAll('.woocommerce-result-count')].map(el=>({cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim(),display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility})),
                copy:[...document.querySelectorAll('main p,#primary p,.site-content p')].filter(el=>/origen|procedencia|productores visibles|Selección del mercado/i.test(el.textContent||'')).slice(0,10).map(el=>({tag:el.tagName,cls:el.className,id:el.id,text:(el.textContent||'').replace(/\s+/g,' ').trim(),parent:el.parentElement?.className||''})),
                sold:[...document.querySelectorAll('ul.products li.product [class*="sold_by"],ul.products li.product .wcfmmp_sold_by_container,ul.products li.product .wcfmmp_sold_by_wrapper')].slice(0,12).map(el=>({tag:el.tagName,cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,120),display:getComputedStyle(el).display}))
              }));
              await sleep(1800);
              const late=await page.evaluate(()=>({
                bars:[...document.querySelectorAll('.wcfmmp-store-lists-sorting,.wcfmmp-store-search-form,[class*="store-search"]')].map(el=>({tag:el.tagName,cls:el.className,id:el.id,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height,hidden:el.hidden})),
                counts:[...document.querySelectorAll('.woocommerce-result-count')].map(el=>({cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim(),display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility})),
                sold:[...document.querySelectorAll('ul.products li.product [class*="sold_by"],ul.products li.product .wcfmmp_sold_by_container,ul.products li.product .wcfmmp_sold_by_wrapper')].slice(0,12).map(el=>({tag:el.tagName,cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,120),display:getComputedStyle(el).display}))
              }));
              console.log('PAGE',path,'EARLY',JSON.stringify(early));
              console.log('PAGE',path,'LATE',JSON.stringify(late));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

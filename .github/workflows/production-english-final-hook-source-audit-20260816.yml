name: Production English final hook source audit 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-english-final-hook-source-audit-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect exact hook sources
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path missing}"

          COOKIE="$PROD_PATH/wp-content/plugins/cookie-law-info/legacy/public/modules/shortcode/shortcode.php"
          echo '--- COOKIE READMORE FUNCTION ---'
          sed -n '420,520p' "$COOKIE" || true

          echo '--- WOOSTIFY BREADCRUMB SOURCE ---'
          grep -RniE 'function +.*breadcrumb|woostify-breadcrumb|item-bread|Shop.*breadcrumb|get_post_type_archive_link|wc_get_page_permalink' "$PROD_PATH/wp-content/themes/woostify" "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" --include='*.php' 2>/dev/null | head -n 240 || true

          echo '--- BREADCRUMB FILTERS ---'
          grep -RniE 'apply_filters\([^\n]*breadcrumb|do_action\([^\n]*breadcrumb' "$PROD_PATH/wp-content/themes/woostify" "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" --include='*.php' 2>/dev/null | head -n 160 || true

          echo '--- LIVE FILTER TEST COOKIE ---'
          TEST="$PROD_PATH/wp-content/mu-plugins/mdo-filter-debug-temp.php"
          trap 'rm -f "$TEST"' EXIT
          cat > "$TEST" <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit;
          add_filter('wt_readmore_link_settings', static function($settings){
              if (!empty($_GET['mdo_filter_debug'])) {
                  error_log('MDO_READMORE_SETTINGS '.wp_json_encode($settings,JSON_UNESCAPED_SLASHES));
                  if (is_array($settings)) $settings['button_x_url']='/en/mdo-debug-cookie-target/';
              }
              return $settings;
          }, PHP_INT_MAX);
          PHP
          curl -ksSL --max-time 30 'https://www.elmercadodeorigen.com/en/shop/?mdo_filter_debug=1' -o /tmp/mdo-filter-debug.html || true
          grep -oE '<a[^>]+id="CONSTANT_OPEN_URL"[^>]*>' /tmp/mdo-filter-debug.html | head -n1 || true
          rm -f "$TEST"; trap - EXIT
          REMOTE

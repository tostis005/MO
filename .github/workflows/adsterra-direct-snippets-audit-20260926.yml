name: Audit direct Adsterra snippets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsterra-direct-snippets-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium requests
      - name: Verify exact direct Adsterra snippets
        shell: bash
        run: |
          python - <<'PY'
          import json,time,requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          BASE='https://www.elmercadodeorigen.com'
          JS=BASE+'/wp-content/themes/elmercadodeorigen-child/assets/js/adsterra-geo-010290.js?direct=010310'
          PAGE=BASE+'/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsterra_debug=1&direct=010310'

          deadline=time.time()+300
          while time.time()<deadline:
              try:
                  body=requests.get(JS,timeout=15,headers={'Cache-Control':'no-cache'}).text
              except Exception:
                  body=''
              if ("optionsScript.text" in body
                  and "mount.appendChild(invokeScript)" in body
                  and "config.frameEndpoint" not in body
                  and "createElement('iframe')" not in body
                  and "pagead2.googlesyndication.com" not in body):
                  break
              time.sleep(5)
          else:
              raise SystemExit('Production did not serve 0.10.310 direct controller')

          expected_desktop={
            'responsive-top':('4e02d145fdb84842713b24a4bade6244',728,90),
            'skyscraper':('040427a877ae83cac71362a8c92eb779',160,600),
            'rectangle':('c1f547d5b9552a71fae2de32c69f2d66',300,250),
            'tall-rectangle':('bd307b1985a219b2694f34d17ceebe8e',160,300),
            'footer-banner':('985360811e3cd3c3d7d50e3a9ea81484',468,60),
          }
          expected_mobile={
            'responsive-top':('3de18866861c081d6eb282ad00fe2bee',320,50),
            'rectangle':('c1f547d5b9552a71fae2de32c69f2d66',300,250),
            'tall-rectangle':('bd307b1985a219b2694f34d17ceebe8e',160,300),
          }
          native_key='a83b8ce6c354e77b2ae5f266936bd60f'
          native_src='https://pl31502847.profitableratecpmnetwork.com/'+native_key+'/invoke.js'

          def audit(label,width,height,expected):
              o=Options();o.page_load_strategy='none'
              for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage',f'--window-size={width},{height}','--lang=en-US'):
                  o.add_argument(a)
              o.set_capability('goog:loggingPrefs', {'performance':'ALL'})
              d=webdriver.Chrome(options=o)
              try:
                  d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':r"""
                  (()=>{const f=window.fetch;window.fetch=function(input,init){
                    const u=typeof input==='string'?input:(input&&input.url)||'';
                    if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/blog-ad-eligibility')){
                      init=Object.assign({},init||{});const h=new Headers(init.headers||{});
                      h.set('X-Country-Code','ZA');init.headers=h;
                    }
                    return f.call(this,input,init);
                  };})();
                  """})
                  d.get(PAGE+'&viewport='+label)
                  deadline=time.time()+25
                  while time.time()<deadline:
                      dbg=d.execute_script('return window.ElMercadoAdsterraGeoDebug||null')
                      if dbg and dbg.get('showAds') is True: break
                      time.sleep(.25)
                  else:
                      raise SystemExit(label+': ZA eligibility failed')

                  for ratio in (0,.25,.5,.75,1,0):
                      d.execute_script('window.scrollTo(0,Math.max(0,(document.documentElement.scrollHeight-window.innerHeight)*arguments[0]))',ratio)
                      time.sleep(.7)
                  time.sleep(8)

                  state=d.execute_script(r"""
                    return {
                      googleScripts:Array.from(document.scripts).map(s=>s.src||'').filter(u=>/googlesyndication|doubleclick/.test(u)),
                      googleAutoPlaced:document.querySelectorAll('.google-auto-placed').length,
                      adsbygoogle:document.querySelectorAll('ins.adsbygoogle').length,
                      wrapperFrames:Array.from(document.querySelectorAll('iframe[data-emo-adsterra-token]')).length,
                      slots:Array.from(document.querySelectorAll('[data-emo-adsterra-slot]')).map(s=>{
                        const m=s.querySelector('.emo-adsterra-mount');
                        return {
                          type:s.getAttribute('data-emo-adsterra-slot'),
                          hydrated:s.getAttribute('data-emo-adsterra-hydrated'),
                          children:m?Array.from(m.children).map(n=>({
                            tag:n.tagName,
                            src:n.getAttribute('src')||'',
                            asyncAttr:n.hasAttribute('async'),
                            cfasync:n.getAttribute('data-cfasync'),
                            id:n.id||'',
                            text:(n.textContent||'').trim()
                          })):[],
                          html:m?m.innerHTML.slice(0,5000):''
                        };
                      })
                    };
                  """)
                  print(label.upper()+'='+json.dumps(state,sort_keys=True),flush=True)
                  if state['googleScripts'] or state['googleAutoPlaced'] or state['adsbygoogle']:
                      raise SystemExit(label+': Google detected')
                  if state['wrapperFrames']:
                      raise SystemExit(label+': wrapper Adsterra iframe still exists')

                  by={s['type']:s for s in state['slots']}
                  for typ,(key,w,h) in expected.items():
                      s=by.get(typ)
                      if not s or s['hydrated']!='1':
                          raise SystemExit(label+': missing hydrated '+typ)
                      scripts=[x for x in s['children'] if x['tag']=='SCRIPT']
                      inline=[x for x in scripts if not x['src']]
                      external=[x for x in scripts if key in x['src']]
                      if not inline or not external:
                          raise SystemExit(label+': exact two-script structure missing for '+typ)
                      txt=inline[0]['text']
                      for token in [key,"'format' : 'iframe'",f"'height' : {h}",f"'width' : {w}","'params' : {}"]:
                          if token not in txt:
                              raise SystemExit(label+': missing '+token+' in '+typ)

                  n=by.get('native')
                  if not n or n['hydrated']!='1':
                      raise SystemExit(label+': native not hydrated')
                  ns=[x for x in n['children'] if x['tag']=='SCRIPT' and x['src']==native_src]
                  nd=[x for x in n['children'] if x['tag']=='DIV' and x['id']=='container-'+native_key]
                  if not ns or not nd:
                      raise SystemExit(label+': native exact script/div missing')
                  if not ns[0]['asyncAttr'] or ns[0]['cfasync']!='false':
                      raise SystemExit(label+': native script attributes differ from supplied code')
              finally:
                  d.quit()

          audit('desktop',1440,1000,expected_desktop)
          audit('mobile',390,844,expected_mobile)
          print('DIRECT_ADSTERRA_SNIPPETS=PASS',flush=True)
          PY

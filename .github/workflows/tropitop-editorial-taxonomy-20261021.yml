name: Tropitop editorial and canonical category reconciliation
on:
  workflow_run:
    workflows: ['Deploy MDO Supplier Sync to production']
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tropitop-editorial-taxonomy-production
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and Tropitop editorial regression
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/tropitop-editorial-taxonomy-20261021.php
          php -l mdo-supplier-sync/includes/class-mdo-tropitop-editorial.php
          php -l mdo-supplier-sync/includes/class-mdo-woo-importer.php
          php tests/tropitop-editorial-smoke.php
      - name: Apply only Tropitop corrections and re-audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${STAGING_HOST:-}" && test -n "${STAGING_USER:-}" && test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/tropitop-editorial-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP .github/scripts/tropitop-editorial-taxonomy-20261021.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          remote_phase() {
            phase="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$SCRIPT' '$phase'" <<'REMOTE'
          set -Eeuo pipefail
          P="$1"; SCRIPT="$2"; PHASE="$3"
          WP_BIN="$(command -v wp)"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          timeout --kill-after=20s 360s env TROPITOP_EDITORIAL_MODE="$PHASE" \
            "$PHP_BIN" -d memory_limit=1024M "$WP_BIN" eval-file "$SCRIPT" \
            --path="$P" --allow-root --skip-plugins=woostify-sites-library
          REMOTE
          }
          echo "TROPITOP_EDITORIAL_PREFLIGHT"
          remote_phase audit > /tmp/tropitop-editorial-before.log
          grep -E '^TROPITOP_EDITORIAL_(SUMMARY|ERROR)=' /tmp/tropitop-editorial-before.log
          echo "TROPITOP_EDITORIAL_APPLY"
          remote_phase apply > /tmp/tropitop-editorial-applied.log
          grep -E '^TROPITOP_EDITORIAL_(SUMMARY|ERROR)=' /tmp/tropitop-editorial-applied.log
          echo "TROPITOP_EDITORIAL_VERIFY"
          remote_phase audit > /tmp/tropitop-editorial-after.log
          grep -E '^TROPITOP_EDITORIAL_(SUMMARY|ERROR)=' /tmp/tropitop-editorial-after.log
          if grep -Eq '"changed_copy":[1-9]|"changed_categories":[1-9]|"changed_categories":true' /tmp/tropitop-editorial-after.log; then
            echo "::error::Tropitop catalog is not idempotent after migration."
            exit 1
          fi
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$SCRIPT'" || true
          echo "TROPITOP_EDITORIAL_DONE"

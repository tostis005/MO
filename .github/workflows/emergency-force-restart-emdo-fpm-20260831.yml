name: Emergency force restart EMDO PHP-FPM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-force-restart-emdo-fpm-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Force recycle only EMDO PHP-FPM service
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -euo pipefail
            child=$(pgrep -f "php-fpm: pool elmercadodeorigen.com" | head -n1 || true)
            if [ -n "$child" ]; then
              master=$(ps -o ppid= -p "$child" | tr -d " ")
              unit=$(sed -n "s#.*system.slice/\([^/]*plesk-php[0-9][0-9]-fpm.service\).*#\1#p" /proc/$master/cgroup | head -n1)
            else
              unit=$(systemctl list-units --type=service --state=activating,active,deactivating --no-legend "plesk-php*-fpm.service" | awk "NR==1{print \$1}")
            fi
            case "$unit" in plesk-php*-fpm.service) ;; *) echo "Unsafe/unexpected unit: ${unit:-none}"; exit 4;; esac
            echo "Force recycling $unit"
            systemctl kill --kill-who=all -s KILL "$unit" 2>/dev/null || true
            sleep 1
            systemctl reset-failed "$unit" 2>/dev/null || true
            systemctl start "$unit"
            sleep 3
            echo "SERVICE=$(systemctl is-active "$unit" || true)"
            echo "LOAD=$(cut -d" " -f1-3 /proc/loadavg)"
            code=$(curl -k -L -sS -o /tmp/emdo-health.html -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/ || true)
            bytes=$(wc -c < /tmp/emdo-health.html 2>/dev/null || echo 0)
            echo "HTTP_CODE=$code BODY_BYTES=$bytes"
            ps -eo pid,ppid,etime,%cpu,%mem,args --sort=-%cpu | grep -E "php-fpm: pool elmercadodeorigen.com|COMMAND" | head -n 25 || true
            [ "$code" = "200" ]
          '

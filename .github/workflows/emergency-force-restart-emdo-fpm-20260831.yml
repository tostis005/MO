name: Emergency force restart EMDO PHP-FPM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-force-restart-emdo-fpm-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Guard attacked filter URLs and recycle EMDO PHP-FPM
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -euo pipefail

            DOCROOT=$(awk "/^[[:space:]]*DocumentRoot[[:space:]]/ {gsub(/\"/,\"\",\$2); print \$2; exit}" /var/www/vhosts/system/elmercadodeorigen.com/conf/httpd.conf)
            : "${DOCROOT:?document root not found}"
            HT="$DOCROOT/.htaccess"
            touch "$HT"
            cp -a "$HT" "$HT.emdo-pre-filter-guard-$(date +%Y%m%d-%H%M%S)"

            if ! grep -Fq "BEGIN EMDO EMERGENCY FILTER FLOOD 20260831" "$HT"; then
              TMP=$(mktemp)
              printf "%s\n" \
                "# BEGIN EMDO EMERGENCY FILTER FLOOD 20260831" \
                "# Temporary targeted containment for a distributed faceted-filter crawl." \
                "<IfModule mod_rewrite.c>" \
                "RewriteEngine On" \
                "RewriteCond %{REQUEST_URI} ^/(categoria-producto/jamones-paletas|en/product-category/(hams-and-shoulders|jamones-paletas)|tienda/hidalgo-de-la-jara|en/(store|tienda)/hidalgo-de-la-jara)/?$ [NC]" \
                "RewriteCond %{QUERY_STRING} (^|&)filter_[^=]+=[^&]* [NC]" \
                "RewriteRule ^ - [F,L]" \
                "</IfModule>" \
                "# END EMDO EMERGENCY FILTER FLOOD 20260831" \
                "" > "$TMP"
              cat "$HT" >> "$TMP"
              cat "$TMP" > "$HT"
              rm -f "$TMP"
            fi

            echo "=== FILTER GUARD ==="
            head -n 12 "$HT"

            child=$(pgrep -f "php-fpm: pool elmercadodeorigen.com" | head -n1 || true)
            if [ -n "$child" ]; then
              master=$(ps -o ppid= -p "$child" | tr -d " ")
              unit=$(sed -n "s#.*system.slice/\([^/]*plesk-php[0-9][0-9]-fpm.service\).*#\1#p" /proc/$master/cgroup | head -n1)
            else
              unit=$(systemctl list-units --type=service --state=activating,active,deactivating --no-legend "plesk-php*-fpm.service" | awk "NR==1{print \$1}")
            fi
            case "$unit" in plesk-php*-fpm.service) ;; *) echo "Unsafe/unexpected unit: ${unit:-none}"; exit 4;; esac

            echo "Force recycling $unit"
            systemctl kill --kill-who=all -s KILL "$unit" 2>/dev/null || true
            sleep 1
            systemctl reset-failed "$unit" 2>/dev/null || true
            systemctl start "$unit"
            sleep 3

            echo "=== HEALTH ==="
            echo "SERVICE=$(systemctl is-active "$unit" || true)"
            uptime
            home_code=$(curl -k -L -sS -o /tmp/emdo-home.html -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/ || true)
            base_code=$(curl -k -L -sS -o /tmp/emdo-base.html -w "%{http_code}" --connect-timeout 5 --max-time 20 https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/ || true)
            filt_code=$(curl -k -L -sS -o /tmp/emdo-filter.html -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/?filter_alimentacion=bellota&filter_rango-peso=65-75-kg" || true)
            echo "HOME=$home_code BASE_CATEGORY=$base_code FILTERED=$filt_code"
            echo "HOME_BYTES=$(wc -c < /tmp/emdo-home.html 2>/dev/null || echo 0) BASE_BYTES=$(wc -c < /tmp/emdo-base.html 2>/dev/null || echo 0)"
            ps -eo pid,ppid,etime,%cpu,%mem,args --sort=-%cpu | grep -E "php-fpm: pool elmercadodeorigen.com|COMMAND" | head -n 25 || true
            [ "$home_code" = "200" ]
            [ "$base_code" = "200" ]
            [ "$filt_code" = "403" ]
          '

name: Final verify public English Tolecarnes content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-final-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify full rendered English description tabs
        shell: bash
        run: |
          set -euo pipefail
          slugs=(
            carne-picada-extra
            burger-mixtas-sin-gluten-2-uds
            filetes-primera
            magro-o-ragu-de-ternera
            entrana-de-ternera
            entrecot-de-lomo-bajo
            filetes-aguja-de-ternera
            chuleton-de-vaca-vieja-madurado
            solomillo-de-ternera
            morcillo-de-ternera
          )
          short_markers=(
            'Ground beef made with 100% beef and no added additives.'
            'Burgers made with an equal blend of beef and locally sourced pork.'
            'Beef steaks cut from tender pieces such as the knuckle or rump'
            'Hand-cut beef designed for dishes where the meat has time to cook slowly'
            'Entraña is a thin, flavourful cut taken from the inside of the rib area.'
            'Beef steak selected from the striploin and presented boneless.'
            'Juicy, flavourful beef chuck steaks with intramuscular fat'
            'Rib steak from the high loin of selected mature cows'
            'Beef tenderloin, one of the most prized cuts for its tenderness'
            'Beef shin from the lower leg or shank.'
          )
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"; f="/tmp/en-${i}.html"
            url="https://www.elmercadodeorigen.com/en/product/${s}/?emdo_final_en=${GITHUB_RUN_ID}-${i}"
            code=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 --retry-delay 1 -A 'Mozilla/5.0 EMDO final English verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -w '%{http_code}' -o "$f" "$url")
            short=no; producer=no; faq=no; spanish=no
            grep -Fq "${short_markers[$i]}" "$f" && short=yes || true
            grep -Fq 'About Tolecarnes' "$f" && producer=yes || true
            grep -Fq 'Frequently asked questions' "$f" && faq=yes || true
            if grep -Fq 'Sobre Tolecarnes' "$f" || grep -Fq 'Preguntas frecuentes' "$f"; then spanish=yes; fi
            tab_chars=$(python3 - "$f" <<'PY'
import sys,re,html
s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
m=re.search(r'<div class="woocommerce-Tabs-panel woocommerce-Tabs-panel--description[^>]*id="tab-description"[^>]*>(.*?)</div>',s,re.S)
if not m:
    print(0)
else:
    t=re.sub(r'<[^>]+>',' ',m.group(1))
    t=html.unescape(re.sub(r'\s+',' ',t)).strip()
    print(len(t))
PY
)
            status=OK
            if [[ "$code" != 200 || "$short" != yes || "$producer" != yes || "$faq" != yes || "$spanish" != no || "$tab_chars" -lt 1000 ]]; then
              status=FAIL; failures=$((failures+1))
            fi
            echo "VERIFY slug=${s} HTTP=${code} short=${short} producer=${producer} faq=${faq} spanish=${spanish} tab_chars=${tab_chars} STATUS=${status}"
          done
          echo "PUBLIC_EN_FAILURES=${failures}"
          [[ "$failures" -eq 0 ]]

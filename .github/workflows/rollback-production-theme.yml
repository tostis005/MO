name: Rollback production child theme

on:
  workflow_dispatch:
    inputs:
      backup:
        description: 'Backup directory name under the production rollback store, or latest'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      REQUESTED_BACKUP: ${{ inputs.backup }}

    steps:
      - name: Validate connection
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing STAGING_HOST}"
          : "${STAGING_USER:?Missing STAGING_USER}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Install SSH tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Restore production child theme backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REQUESTED_BACKUP'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          requested="$2"
          dev_path=""
          case "$raw" in */wp-content/*) dev_path="${raw%%/wp-content/*}" ;; */wp-content) dev_path="$(dirname "$raw")" ;; *) dev_path="$raw" ;; esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve staging root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$prod_path/wp-config.php" ] || { echo "Production wp-config not found at $prod_path" >&2; exit 1; }

          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -x "$php_bin" ] && [ -n "$wp_bin" ] || { echo 'PHP/WP-CLI unavailable.' >&2; exit 1; }
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod_path" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing rollback: unexpected production siteurl=$siteurl" >&2; exit 1 ;; esac

          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          [ -d "$rollback_root" ] || { echo 'Rollback store does not exist.' >&2; exit 1; }
          if [ "$requested" = 'latest' ] || [ -z "$requested" ]; then
            backup_dir="$(find "$rollback_root" -mindepth 1 -maxdepth 1 -type d | sort | tail -n1)"
          else
            case "$requested" in *[!A-Za-z0-9._-]*) echo 'Invalid backup name.' >&2; exit 1 ;; esac
            backup_dir="$rollback_root/$requested"
          fi
          [ -n "$backup_dir" ] && [ -f "$backup_dir/theme.tar.gz" ] || { echo 'Requested backup not found.' >&2; exit 1; }
          ( cd "$backup_dir" && sha256sum -c theme.tar.gz.sha256 )

          theme_parent="$prod_path/wp-content/themes"
          target="$theme_parent/elmercadodeorigen-child"
          safety="$rollback_root/pre-rollback-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$safety"
          if [ -d "$target" ]; then
            tar -czf "$safety/theme.tar.gz" -C "$theme_parent" elmercadodeorigen-child
            ( cd "$safety" && sha256sum theme.tar.gz > theme.tar.gz.sha256 )
          fi

          rm -rf "$target"
          tar -xzf "$backup_dir/theme.tar.gz" -C "$theme_parent"
          test -f "$target/functions.php"
          find "$target" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null

          previous_stylesheet="$(cat "$backup_dir/active-stylesheet.txt" 2>/dev/null || true)"
          if [ -n "$previous_stylesheet" ]; then
            "$php_bin" -d memory_limit=512M "$wp_bin" theme activate "$previous_stylesheet" --path="$prod_path" --skip-plugins --allow-root || "$php_bin" -d memory_limit=512M "$wp_bin" theme activate elmercadodeorigen-child --path="$prod_path" --skip-plugins --allow-root
          else
            "$php_bin" -d memory_limit=512M "$wp_bin" theme activate elmercadodeorigen-child --path="$prod_path" --skip-plugins --allow-root
          fi
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root || true
          active="$("$php_bin" -d memory_limit=512M "$wp_bin" option get stylesheet --path="$prod_path" --skip-plugins --skip-themes --allow-root)"
          echo "RESTORED_BACKUP=$(basename "$backup_dir")"
          echo "ACTIVE_STYLESHEET=$active"
          echo "SITEURL=$siteurl"
          REMOTE

      - name: Verify production after rollback
        shell: bash
        run: |
          set -euo pipefail
          for url in https://elmercadodeorigen.com/ https://elmercadodeorigen.com/tienda/; do
            status="$(curl -sS -L --max-time 30 -o /tmp/rollback.html -w '%{http_code}' "$url")"
            [ "$status" = '200' ]
          done

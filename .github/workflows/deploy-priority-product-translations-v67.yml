name: Deploy priority product translations v67

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          php -l mu-plugins/mdo-zzz-english-attributes-010263.php
          php -l .github/scripts/fix-priority-product-translations-v67.php
          php -l .github/scripts/verify-priority-product-translations-v67.php
          php -l .github/scripts/mdo-launch-verify-semantic-numbers.php
      - name: Deploy priority English fixes with rollback backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_PLUGIN="$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-attributes-010263.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; test ! -f '$REMOTE_PLUGIN' || cp -p '$REMOTE_PLUGIN' '$REMOTE_PLUGIN.bak-${GITHUB_RUN_ID}'"
          sshpass -e scp $SCP mu-plugins/mdo-zzz-english-attributes-010263.php "$STAGING_USER@$STAGING_HOST:$REMOTE_PLUGIN"
          FIX="/tmp/mdo-priority-en-fix-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/fix-priority-product-translations-v67.php "$STAGING_USER@$STAGING_HOST:$FIX"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -l '$REMOTE_PLUGIN'; \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$FIX' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$FIX'; exit \$rc"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$PROD_PATH/wp-content/cache/mdo-page-cache' '$PROD_PATH/wp-content/mdo-page-cache'; wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
      - name: Verify all 240 priority products and prelaunch routing
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $SSH_PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $SSH_PORT"
          for local in .github/scripts/verify-priority-product-translations-v67.php .github/scripts/mdo-launch-verify-semantic-numbers.php; do
            base=$(basename "$local"); remote="/tmp/${base%.php}-${GITHUB_RUN_ID}.php"
            sshpass -e scp $SCP "$local" "$STAGING_USER@$STAGING_HOST:$remote"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$remote' --path='$PROD_PATH' --allow-root 2>/dev/null; rc=\$?; rm -f '$remote'; exit \$rc"
          done
          echo PRIORITY_ENGLISH_DEPLOY_V67_OK

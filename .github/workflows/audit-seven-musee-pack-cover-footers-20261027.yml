name: Inspect seven held pack cover photos for reused Latitudes footers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-seven-musee-pack-cover-footers-20261027.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy seven pack hero images without changing WordPress media
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          SCRIPT=.github/scripts/audit-held-pack-cover-image-text-20261027.php
          ID="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" "$SCRIPT" "$TARGET:/tmp/audit-seven-pack-covers-$ID.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$ID'" <<'REMOTE'
          set -euo pipefail
          ID="$1"
          wp_bin=$(command -v wp)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) SITE="$p"; break;;
            esac
          done
          : "${SITE:?}"
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file "/tmp/audit-seven-pack-covers-$ID.php" --path="$SITE" --allow-root
          tar -czf "/tmp/audit-seven-pack-covers-$ID.tar.gz" -C /tmp/musee-current-7-pack-covers-20261027 .
          REMOTE
          sshpass -e scp "${SCP[@]}" "$TARGET:/tmp/audit-seven-pack-covers-$ID.tar.gz" audit-seven-pack-covers.tar.gz
          echo "SEVEN_PACK_COVER_AUDIT_FILE_READY"

      - uses: actions/upload-artifact@v4
        with:
          name: musee-seven-pack-covers
          path: audit-seven-pack-covers.tar.gz
          retention-days: 3

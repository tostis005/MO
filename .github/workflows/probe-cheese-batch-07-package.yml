name: Probe cheese batch 07 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cheese-batch-07-package.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate second missing char
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,base64,string,zlib,hashlib,gzip,json,itertools
          files=sorted(glob.glob('.github/scripts/cheese-batch-07-chunk-*.b64'))
          parts=[open(f,encoding='utf-8').read().strip() for f in files]
          p0=parts[0]; rest=''.join(parts[1:])
          alphabet=string.ascii_uppercase+string.ascii_lowercase+string.digits+'+/'
          first_chars=['t','h','d','V','N','9','1','p']
          probes=['A','/','z','0','Q','g','M','w']
          target='e1ec1b0c81e8d9e0946ed28489615cc6d77a308ebb2a4f11f1766304b14224d7'
          def score(s):
              try: raw=base64.b64decode(s,validate=True)
              except Exception: return -1
              d=zlib.decompressobj(31); out=0
              for i in range(0,len(raw),16):
                  try: out += len(d.decompress(raw[i:i+16]))
                  except zlib.error: return out
              try: out += len(d.flush())
              except zlib.error: pass
              return out
          ranked=[]
          for fc in first_chars:
              one=p0[:2862]+fc+p0[2862:]
              for pos in range(2864,len(one)+1,2):
                  for sc in probes:
                      candidate=one[:pos]+sc+one[pos:]+rest
                      ranked.append((score(candidate),fc,pos,sc))
          ranked.sort(reverse=True)
          for item in ranked[:50]: print('SECOND_CANDIDATE score=%d first=%s pos=%d probe=%s'%item)
          candidates=set()
          for _,fc,pos,_ in ranked[:50]:
              for q in range(max(2863,pos-5),min(len(p0)+1,pos+5)+1): candidates.add((fc,q))
          print('SHA_CANDIDATE_PAIRS='+str(len(candidates)))
          for fc,pos in sorted(candidates):
              one=p0[:2862]+fc+p0[2862:]
              for ch in alphabet:
                  candidate=one[:pos]+ch+one[pos:]+rest
                  if hashlib.sha256(candidate.encode()).hexdigest()==target:
                      data=json.loads(gzip.decompress(base64.b64decode(candidate,validate=True)))
                      assert len(data)==10 and sorted(int(x['pos']) for x in data)==list(range(61,71))
                      print(f'RECOVERED_FIRST_POS=2862')
                      print(f'RECOVERED_FIRST_CHAR={fc}')
                      print(f'RECOVERED_SECOND_POS_AFTER_FIRST={pos}')
                      print(f'RECOVERED_SECOND_CHAR={ch}')
                      print('REPAIRED_JSON_OK=10')
                      raise SystemExit(0)
          print('NO_SECOND_MATCH')
          raise SystemExit(2)
          PY

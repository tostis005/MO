name: Probe cheese batch 07 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cheese-batch-07-package.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover by gzip CRC and JSON integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,string,hashlib,base64,gzip,json,itertools
          files=sorted(glob.glob('.github/scripts/cheese-batch-07-chunk-*.b64'))
          parts=[open(f,encoding='utf-8').read().strip() for f in files]
          p0=parts[0]; rest=''.join(parts[1:])
          alphabet=string.ascii_uppercase+string.ascii_lowercase+string.digits+'+/'
          found=[]
          for first,second in itertools.product(alphabet,repeat=2):
              one=p0[:2862]+first+p0[2862:]
              candidate=one[:3118]+second+one[3118:]+rest
              try:
                  raw=base64.b64decode(candidate,validate=True)
                  text=gzip.decompress(raw).decode('utf-8')
                  data=json.loads(text)
              except Exception:
                  continue
              if len(data)!=10 or sorted(int(x.get('pos',0)) for x in data)!=list(range(61,71)):
                  continue
              found.append((first,second,hashlib.sha256(candidate.encode()).hexdigest(),data))
          print('VALID_RECOVERIES='+str(len(found)))
          for first,second,sha,data in found[:10]:
              print('RECOVERY first=%s second=%s sha=%s'%(first,second,sha))
              print('TITLES='+' | '.join(x['title'] for x in data))
          if len(found)!=1:
              raise SystemExit('Expected exactly one CRC-valid recovery')
          first,second,sha,data=found[0]
          print('RECOVERED_FIRST_POS=2862')
          print('RECOVERED_FIRST_CHAR='+first)
          print('RECOVERED_SECOND_POS_AFTER_FIRST=3118')
          print('RECOVERED_SECOND_CHAR='+second)
          print('RECOVERED_SHA256='+sha)
          print('REPAIRED_JSON_OK=10')
          PY

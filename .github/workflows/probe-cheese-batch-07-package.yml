name: Probe cheese batch 07 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cheese-batch-07-package.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect aligned candidate trailer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,base64,zlib,struct
          files=sorted(glob.glob('.github/scripts/cheese-batch-07-chunk-*.b64'))
          parts=[open(f,encoding='utf-8').read().strip() for f in files]
          p0=parts[0]; rest=''.join(parts[1:])
          one=p0[:2862]+'t'+p0[2862:]
          candidate=one[:3118]+'0'+one[3118:]+rest
          raw=base64.b64decode(candidate,validate=True)
          print('RAW_LEN='+str(len(raw)))
          print('GZIP_MAGIC='+raw[:4].hex()+' FLG='+str(raw[3]))
          print('TRAILER_HEX='+raw[-8:].hex())
          print('STORED_CRC=%08x STORED_ISIZE=%d'%struct.unpack('<II',raw[-8:]))
          d=zlib.decompressobj(31); out=b''; err=''
          try:
              out=d.decompress(raw)+d.flush()
          except Exception as e:
              err=repr(e)
          print('OUT_LEN='+str(len(out)))
          print('OUT_CRC=%08x'%(zlib.crc32(out)&0xffffffff))
          print('ERR='+err)
          print('OUT_PREFIX='+out[:120].decode('utf-8','replace'))
          print('OUT_SUFFIX='+out[-200:].decode('utf-8','replace'))
          PY

name: Probe cheese batch 07 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cheese-batch-07-package.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rank single-char repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,base64,string,zlib
          files=sorted(glob.glob('.github/scripts/cheese-batch-07-chunk-*.b64'))
          parts=[open(f,encoding='utf-8').read().strip() for f in files]
          p0=parts[0]; rest=''.join(parts[1:])
          alphabet=string.ascii_uppercase+string.ascii_lowercase+string.digits+'+/'
          def make_valid(s):
              # One missing char remains. Insert a neutral data char immediately before final padding.
              if s.endswith('='): return s[:-1]+'A'+s[-1:]
              return s+'A'
          def score(s):
              try: raw=base64.b64decode(make_valid(s),validate=True)
              except Exception: return -1
              d=zlib.decompressobj(31); out=0
              for i in range(0,len(raw),16):
                  try: out += len(d.decompress(raw[i:i+16]))
                  except zlib.error: return out
              return out
          ranked=[]
          for pos in range(2700,3021):
              for ch in alphabet:
                  sc=score(p0[:pos]+ch+p0[pos:]+rest)
                  ranked.append((sc,pos,ch))
          ranked.sort(reverse=True)
          for sc,pos,ch in ranked[:40]: print(f'CANDIDATE pos={pos} char={ch} score={sc}')
          if ranked[0][0] <= 4053:
              raise SystemExit('No single-char repair improved gzip progress')
          PY

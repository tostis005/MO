name: Probe cheese batch 07 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cheese-batch-07-package.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate package corruption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, base64, gzip, json
          files = sorted(glob.glob('.github/scripts/cheese-batch-07-chunk-*.b64'))
          assert len(files) == 8, len(files)
          parts = [open(f, encoding='utf-8').read().strip() for f in files]
          for f, part in zip(files, parts):
              print(f'PART {f} len={len(part)} mod4={len(part)%4} sha={hashlib.sha256(part.encode()).hexdigest()}')
          payload = ''.join(parts)
          target = 'e1ec1b0c81e8d9e0946ed28489615cc6d77a308ebb2a4f11f1766304b14224d7'
          print('CURRENT_SHA=' + hashlib.sha256(payload.encode()).hexdigest())
          print('TOTAL_LEN=' + str(len(payload)))
          for i in range(len(payload)):
              candidate = payload[:i] + payload[i+1:]
              if hashlib.sha256(candidate.encode()).hexdigest() == target:
                  print(f'EXTRA_CHAR_INDEX={i}')
                  print(f'EXTRA_CHAR={payload[i]}')
                  data = json.loads(gzip.decompress(base64.b64decode(candidate, validate=True)))
                  assert len(data) == 10
                  assert sorted(int(x['pos']) for x in data) == list(range(61, 71))
                  print('REPAIRED_JSON_OK=10')
                  raise SystemExit(0)
          print('NO_SINGLE_EXTRA_CHAR_MATCH')
          raise SystemExit(2)
          PY

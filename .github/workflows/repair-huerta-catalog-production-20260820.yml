name: Repair Huerta catalog production

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/repair-huerta-catalog-20260820.php'
      - '.github/workflows/repair-huerta-catalog-production-20260820.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP files
        shell: bash
        run: |
          php -l .github/scripts/repair-huerta-catalog-20260820.php
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          php -l mdo-supplier-sync/includes/class-mdo-huerta-defaults.php
          php -l mdo-supplier-sync/includes/class-mdo-huerta-catalog-quality.php

      - name: Deploy Huerta fixes and repair production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_DIR="/tmp/huerta-repair-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/mdo-supplier-sync.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/mdo-supplier-sync.php"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/includes/class-mdo-huerta-defaults.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/class-mdo-huerta-defaults.php"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/includes/class-mdo-huerta-catalog-quality.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/class-mdo-huerta-catalog-quality.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/repair-huerta-catalog-20260820.php "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/repair.php"

          mkdir -p .deploy-status
          set +e
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            PLUGIN_DIR='$PROD_PATH/wp-content/plugins/mdo-supplier-sync'
            [ -d \"\$PLUGIN_DIR\" ] || { echo 'ERROR: production EMDO plugin dir not found' >&2; exit 20; }
            mkdir -p \"\$PLUGIN_DIR/includes\"
            cp \"\$PLUGIN_DIR/mdo-supplier-sync.php\" '/tmp/mdo-supplier-sync-${GITHUB_RUN_ID}.bak.php'
            cp \"\$PLUGIN_DIR/includes/class-mdo-huerta-defaults.php\" '/tmp/class-mdo-huerta-defaults-${GITHUB_RUN_ID}.bak.php'
            [ ! -f \"\$PLUGIN_DIR/includes/class-mdo-huerta-catalog-quality.php\" ] || cp \"\$PLUGIN_DIR/includes/class-mdo-huerta-catalog-quality.php\" '/tmp/class-mdo-huerta-catalog-quality-${GITHUB_RUN_ID}.bak.php'
            cp '$REMOTE_DIR/mdo-supplier-sync.php' \"\$PLUGIN_DIR/mdo-supplier-sync.php\"
            cp '$REMOTE_DIR/class-mdo-huerta-defaults.php' \"\$PLUGIN_DIR/includes/class-mdo-huerta-defaults.php\"
            cp '$REMOTE_DIR/class-mdo-huerta-catalog-quality.php' \"\$PLUGIN_DIR/includes/class-mdo-huerta-catalog-quality.php\"

            wp_bin=\$(command -v wp || true)
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l \"\$PLUGIN_DIR/mdo-supplier-sync.php\" >/dev/null
            \"\$php_bin\" -l \"\$PLUGIN_DIR/includes/class-mdo-huerta-defaults.php\" >/dev/null
            \"\$php_bin\" -l \"\$PLUGIN_DIR/includes/class-mdo-huerta-catalog-quality.php\" >/dev/null
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/repair.php' --path='$PROD_PATH' --allow-root
            code=\$?
            rm -rf '$REMOTE_DIR'
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null || true
            exit \$code
          " > .deploy-status/huerta-catalog-repair-20260820.txt 2>&1
          CODE=$?
          set -e
          echo "$CODE" > .deploy-status/huerta-catalog-repair-20260820.exit-code
          cat .deploy-status/huerta-catalog-repair-20260820.txt

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/huerta-catalog-repair-20260820.txt .deploy-status/huerta-catalog-repair-20260820.exit-code || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record Huerta catalog repair [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Fail if repair failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-status/huerta-catalog-repair-20260820.exit-code
          test "$(cat .deploy-status/huerta-catalog-repair-20260820.exit-code)" = "0"
          grep -q '^huerta_repair_ok$' .deploy-status/huerta-catalog-repair-20260820.txt

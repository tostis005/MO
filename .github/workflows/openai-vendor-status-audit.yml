name: Audit OpenAI Vendor Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-vendor-status-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect product authors and WCFM state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"; wp_bin=$(command -v wp); php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -d memory_limit=768M "$wp_bin" eval '
            global $wpdb;
            $authors=$wpdb->get_results("SELECT post_author AS user_id, COUNT(*) AS products FROM {$wpdb->posts} WHERE post_type=\"product\" AND post_status=\"publish\" GROUP BY post_author ORDER BY post_author",ARRAY_A);
            foreach($authors as $a){
              $uid=(int)$a["user_id"];$u=get_userdata($uid);if(!$u)continue;
              $profile=get_user_meta($uid,"wcfmmp_profile_settings",true);
              $interesting=[];
              foreach(get_user_meta($uid) as $k=>$vals){
                if(!preg_match("/(wcfm|vendor|store|status|approv|disable|active|verify|reject|offline|membership)/i",(string)$k))continue;
                $v=maybe_unserialize($vals[0]??"");
                if(is_array($v)){
                  $small=[];foreach($v as $kk=>$vv){if(preg_match("/(store_name|store_slug|status|approv|disable|active|verify|reject|offline)/i",(string)$kk))$small[$kk]=is_scalar($vv)?$vv:gettype($vv);}
                  $v=$small?:"[array]";
                }elseif(is_string($v)&&strlen($v)>160){$v=substr($v,0,160);}
                $interesting[$k]=$v;
              }
              echo "VENDOR ".wp_json_encode(["id"=>$uid,"login"=>$u->user_login,"roles"=>$u->roles,"products"=>(int)$a["products"],"helper_active"=>function_exists("mdo_gmf_vendor_is_active_v1")?mdo_gmf_vendor_is_active_v1($uid):null,"store_name"=>is_array($profile)?($profile["store_name"]??""):"","meta"=>$interesting],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
            }
            $roles=wp_roles()->roles;foreach($roles as $slug=>$data){if(preg_match("/(vendor|wcfm)/i",$slug." ".($data["name"]??"")))echo "ROLE ".wp_json_encode(["slug"=>$slug,"name"=>$data["name"]??""],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
          ' --path="$PROD_PATH" --allow-root
          REMOTE

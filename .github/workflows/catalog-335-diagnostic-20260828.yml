name: Verify producer catalogue at 335px

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-335-diagnostic-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy candidate with rollback backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"

          NAME='zzzzzzzzzzzzzzzzzz-mdo-catalog-control-widths-20260828.php'
          SRC="mu-plugins/$NAME"
          TARGET="$PROD_PATH/wp-content/mu-plugins/$NAME"
          REMOTE="/tmp/${NAME%.php}-${GITHUB_RUN_ID}.php"
          BACKUP="/tmp/${NAME%.php}-backup-${GITHUB_RUN_ID}.php"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

          php -l "$SRC" >/dev/null
          sshpass -e scp $SCP_OPTIONS "$SRC" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; cp -p '$TARGET' '$BACKUP'; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" eval 'if ( function_exists(\"wp_cache_flush\") ) { wp_cache_flush(); } if ( has_action(\"litespeed_purge_all\") ) { do_action(\"litespeed_purge_all\"); }' --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Verify exact small-phone widths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, sys

          urls={
            'global':'https://www.elmercadodeorigen.com/tienda/?mdo_335_verify=3',
            'producer':'https://www.elmercadodeorigen.com/tienda/1957/?mdo_335_verify=3',
          }
          sizes=[(335,760),(360,800),(390,844)]
          js=r'''() => {
            const box=el=>{if(!el)return null;const r=el.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,h:r.height}};
            const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
            const form=toolbar?.querySelector('.woocommerce-ordering')||null;
            const order=form?.querySelector('select[name="orderby"]')||null;
            const dest=toolbar?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]')||null;
            const destWrap=dest?.closest('.mdo-catalog-destination--canonical,.mdo-catalog-destination,.mdo-ps-destination')||dest?.parentElement||null;
            const ts=toolbar?getComputedStyle(toolbar):null;
            const tr=toolbar?.getBoundingClientRect()||null;
            const available=tr&&ts ? tr.width-parseFloat(ts.paddingLeft||0)-parseFloat(ts.paddingRight||0)-parseFloat(ts.borderLeftWidth||0)-parseFloat(ts.borderRightWidth||0) : null;
            const os=order?getComputedStyle(order):null;
            return {
              toolbar:box(toolbar),form:box(form),order:box(order),destWrap:box(destWrap),dest:box(dest),available,
              overflow:document.documentElement.scrollWidth-innerWidth,
              version:toolbar?.dataset?.mdoCatalogControlWidths||null,
              inline:order?.getAttribute('style')||'',
              computed:os?{
                display:os.display,width:os.width,minWidth:os.minWidth,maxWidth:os.maxWidth,
                inlineSize:os.inlineSize,minInlineSize:os.minInlineSize,maxInlineSize:os.maxInlineSize,
                flex:os.flex,flexBasis:os.flexBasis,flexGrow:os.flexGrow,flexShrink:os.flexShrink,
                float:os.float,position:os.position,left:os.left,right:os.right,transform:os.transform,
                marginLeft:os.marginLeft,marginRight:os.marginRight,boxSizing:os.boxSizing
              }:null,
              children:form?[...form.children].map(el=>({tag:el.tagName,cls:el.className||'',w:el.getBoundingClientRect().width,display:getComputedStyle(el).display,flex:getComputedStyle(el).flex})):[]
            };
          }'''
          def close(a,b,t=2.5): return abs(float(a)-float(b))<=t
          errors=[]; out={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width,height in sizes:
              out[str(width)]={}
              for kind,url in urls.items():
                page=browser.new_page(viewport={'width':width,'height':height})
                try:
                  page.goto(url,wait_until='commit',timeout=30000)
                  page.wait_for_selector('.emo-catalog-toolbar-shared-010229 select[name="orderby"]',state='visible',timeout=30000)
                  page.wait_for_selector('.emo-catalog-toolbar-shared-010229 [data-mdo-destination-open], .emo-catalog-toolbar-shared-010229 [data-mdo-ps-destination-open]',state='visible',timeout=30000)
                  page.wait_for_timeout(1800)
                  d=page.evaluate(js)
                finally:
                  page.close()
                out[str(width)][kind]=d
                if d['version']!='20260828-v4': errors.append(f'{kind} {width}: candidate owner inactive {d["version"]}')
                if d['overflow']>1: errors.append(f'{kind} {width}: horizontal overflow {d["overflow"]}')
                for key in ('form','order','destWrap','dest'):
                  if not d[key] or d['available'] is None or not close(d[key]['w'],d['available']):
                    errors.append(f'{kind} {width}: {key} width={d.get(key)} available={d["available"]}; computed={d.get("computed")}; children={d.get("children")}; inline={d.get("inline")}')
              g=out[str(width)]['global']; v=out[str(width)]['producer']
              if not close(g['order']['w'],v['order']['w']): errors.append(f'{width}: global/producer order mismatch {g["order"]["w"]} vs {v["order"]["w"]}')
            browser.close()
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if errors:
            print('ERRORS:')
            print('\n'.join('- '+x for x in errors))
            sys.exit(1)
          print('PRODUCER_335_ORDER_FULL_WIDTH=true')
          PY

      - name: Roll back candidate on failure
        if: failure() && env.PROD_PATH != ''
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "install -m 0644 '$BACKUP' '$TARGET'; rm -f '$BACKUP'"

      - name: Remove backup on success
        if: success()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP'"

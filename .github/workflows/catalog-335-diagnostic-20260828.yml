name: Diagnose producer catalogue at 335px

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-335-diagnostic-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Measure 335px catalogue controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          urls = {
              'global': 'https://www.elmercadodeorigen.com/tienda/?mdo_335_diag=1',
              'producer': 'https://www.elmercadodeorigen.com/tienda/1957/?mdo_335_diag=1',
          }
          js = r'''() => {
            const box = el => {
              if (!el) return null;
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return {
                tag: el.tagName, cls: el.className || '',
                l:r.left, r:r.right, w:r.width, h:r.height,
                display:s.display, position:s.position,
                width:s.width, minWidth:s.minWidth, maxWidth:s.maxWidth,
                marginLeft:s.marginLeft, marginRight:s.marginRight,
                paddingLeft:s.paddingLeft, paddingRight:s.paddingRight,
                left:s.left, right:s.right, transform:s.transform,
                flex:s.flex, gridColumn:s.gridColumn, gridRow:s.gridRow,
                boxSizing:s.boxSizing, overflow:s.overflow
              };
            };
            const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
            const orderForm=toolbar?.querySelector('.woocommerce-ordering')||null;
            const order=orderForm?.querySelector('select[name="orderby"]')||null;
            const dest=toolbar?.querySelector('[data-mdo-destination-open],[data-mdo-ps-destination-open]')||null;
            const destWrap=dest?.closest('.mdo-catalog-destination--canonical,.mdo-catalog-destination,.mdo-ps-destination')||dest?.parentElement||null;
            const ancestry=[];
            let n=orderForm;
            while(n && ancestry.length<8){ ancestry.push(box(n)); n=n.parentElement; }
            return {
              viewport:{innerWidth, scrollWidth:document.documentElement.scrollWidth},
              toolbar:box(toolbar), destWrap:box(destWrap), dest:box(dest), orderForm:box(orderForm), order:box(order),
              ancestry,
              inlineForm: orderForm?.getAttribute('style')||'',
              inlineSelect: order?.getAttribute('style')||'',
              bodyClass: document.body.className,
              controlVersion: toolbar?.dataset?.mdoCatalogControlWidths||null,
              producerParity: toolbar?.dataset?.mdoProducerMobileWidthParity||null,
              runtimeGuard: toolbar?.dataset?.mdoCatalogRuntimeGuard||null
            };
          }'''

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':335,'height':760})
              out={}
              for kind,url in urls.items():
                  page.goto(url,wait_until='networkidle',timeout=120000)
                  page.wait_for_timeout(1800)
                  out[kind]=page.evaluate(js)
              browser.close()
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

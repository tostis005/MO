name: Repair approved blog covers 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-approved-featured-images-20260827.php'
      - '.github/workflows/fix-approved-featured-images-20260827.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate repair script
        shell: bash
        run: php -l .github/scripts/fix-approved-featured-images-20260827.php

      - name: Repair approved images in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 11
            [ -n "$php" ] || exit 12
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
              esac
            done
            [ -n "$prod" ] || exit 13
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"

          REMOTE="/tmp/emdo-approved-featured-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/fix-approved-featured-images-20260827.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root; rm -f '$REMOTE'" | tee /tmp/approved-featured-report.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/approved-featured-report.json', encoding='utf-8'))
          assert len(d['posts']) == 4
          for p in d['posts']:
              assert int(p['thumbnail_id']) == int(p['attachment_id'])
              assert int(p['approved_id']) == int(p['attachment_id'])
              assert p['uses_default'] == ''
              assert p['cover_asset'] == ''
              assert p['attachment_url']
              assert p['permalink']
          print('database_metadata_verified=4')
          PY

      - name: Verify the public article pages render the approved images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as htmlmod
          import json
          import pathlib
          import subprocess
          import urllib.parse

          d=json.load(open('/tmp/approved-featured-report.json', encoding='utf-8'))
          for p in d['posts']:
              sep='&' if '?' in p['permalink'] else '?'
              url=p['permalink'] + sep + 'approvedimg=' + str(p['attachment_id'])
              page=subprocess.check_output([
                  'curl','-k','-L','-sS','--retry','4','--retry-delay','2',
                  '--connect-timeout','10','--max-time','75',
                  '-A','Mozilla/5.0 EMDO approved featured verifier',
                  '-H','Cache-Control: no-cache',url
              ], text=True)
              path=urllib.parse.urlparse(p['attachment_url']).path
              basename=pathlib.PurePosixPath(path).name
              stem=basename.rsplit('.',1)[0]
              expected_alt=htmlmod.escape(p['alt'], quote=True)
              if 'emo-article-featured' not in page:
                  raise SystemExit('Featured image element missing: ' + p['slug'])
              if stem not in page:
                  raise SystemExit('Approved attachment not rendered publicly: ' + p['slug'] + ' expected ' + stem)
              if expected_alt not in page and p['alt'] not in page:
                  raise SystemExit('Approved image alt not rendered publicly: ' + p['slug'])
              print('frontend_verified', p['slug'], basename)
          print('public_frontend_verified=4')
          PY

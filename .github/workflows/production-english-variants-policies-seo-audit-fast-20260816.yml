name: Production English variants policies SEO focused audit 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-variants-policies-seo-audit-fast-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Focused production audit
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=768M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          echo '=== ACTIVE RELEVANT PLUGINS ==='
          wp plugin list --status=active --fields=name,version --format=csv 2>/dev/null | grep -Ei 'translate|seo|rank|yoast|wcfm|front|multivendor|woocommerce' || true
          echo '=== WCFM DIRS ==='
          find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -mindepth 1 -type d | grep -Ei 'wcfm|frontend|multivendor' || true
          echo '=== SEO PACK FILES/DIRS ==='
          find "$PROD_PATH/wp-content/plugins" -maxdepth 2 \( -iname '*seo*pack*' -o -iname '*translatepress*' \) -print 2>/dev/null | head -n 80 || true
          echo '=== ATTRIBUTES ==='
          wp eval 'foreach(wc_get_attribute_taxonomies() as $a){echo "pa_{$a->attribute_name}|{$a->attribute_label}\n";}' 2>/dev/null || true
          echo '=== HAM VARIABLE PRODUCTS ==='
          wp eval '$q=new WP_Query(["post_type"=>"product","post_status"=>"publish","posts_per_page"=>100,"tax_query"=>[["taxonomy"=>"product_type","field"=>"slug","terms"=>"variable"]]]);foreach($q->posts as $p){if(!preg_match("/(jam[oó]n|paleta|ham)/iu",$p->post_title))continue;$pr=wc_get_product($p->ID);echo "$p->ID|$p->post_title|$p->post_name\n";foreach($pr->get_variation_attributes() as $k=>$v)echo "  $k=".implode(",",$v)."\n";}' 2>/dev/null || true
          echo '=== WCFM POLICY GREP ==='
          for d in $(find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -mindepth 1 -type d | grep -Ei 'wcfm|frontend|multivendor' || true); do grep -RniE --include='*.php' "woocommerce_product_tabs|Policies|policy_tab|wcfm.*policy" "$d" 2>/dev/null | head -n 100; done || true
          echo '=== TRP OPTIONS ==='
          wp option get trp_settings --format=json 2>/dev/null || true
          wp option get trp_machine_translation_settings --format=json 2>/dev/null || true
          REMOTE

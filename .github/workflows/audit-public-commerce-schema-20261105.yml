name: SEO read-only audit of public Product schema and indexability 2026-11-05
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit-public-commerce-schema-20261105.py'
      - '.github/workflows/audit-public-commerce-schema-20261105.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax and install parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/audit-public-commerce-schema-20261105.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-bs4 >/dev/null
      - name: Inspect publicly rendered Product/Offer and canonical metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 .github/scripts/audit-public-commerce-schema-20261105.py | tee /tmp/emdo-commerce-schema-audit.jsonl
      - name: Archive detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emdo-commerce-schema-audit
          path: /tmp/emdo-commerce-schema-audit.jsonl
          if-no-files-found: warn
          retention-days: 15

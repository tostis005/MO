name: Home mobile navigation CLS 20260820

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-mobile-nav-cls-20260820.yml'

permissions:
  contents: write

concurrency:
  group: home-mobile-nav-cls-production
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: |
          php -l elmercadodeorigen-child/inc/home-cache.php
          php -l elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php
          grep -q 'data-emo-menu-intent' elmercadodeorigen-child/inc/home-cache.php
          grep -q "010256-12" elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php

      - name: Deploy CLS guard and clear Home cache
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?production path not found}"
          echo "$PROD" > /tmp/prod-home-nav-cls
          timeout 45s sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-nav-${GITHUB_RUN_ID}.php"
          timeout 45s sshpass -e scp $SCP elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cls-nav-${GITHUB_RUN_ID}.php"
          timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; MU='$PROD/wp-content/mu-plugins'
            cp \"\$THEME/inc/home-cache.php\" /tmp/home-cache-before-nav-${GITHUB_RUN_ID}.php
            cp \"\$MU/elmercado-home-cls-010256.php\" /tmp/home-cls-before-nav-${GITHUB_RUN_ID}.php
            install -m0644 /tmp/home-cache-nav-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"
            install -m0644 /tmp/home-cls-nav-${GITHUB_RUN_ID}.php \"\$MU/elmercado-home-cls-010256.php\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f /tmp/home-cache-nav-${GITHUB_RUN_ID}.php /tmp/home-cls-nav-${GITHUB_RUN_ID}.php
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-nav-cls.html
          grep -q 'elmercado-home-first-view-css' /tmp/home-nav-cls.html
          grep -q 'data-emo-menu-intent' /tmp/home-nav-cls.html

      - name: Lighthouse mobile and desktop 3x
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=mobile --output=json --output-path="/tmp/mobile-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
            npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/desktop-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          done
          python3 - <<'PY' | tee runtime/home-mobile-nav-cls-20260820.txt
          import json, statistics
          def collect(prefix):
              rows=[]
              print(prefix.upper())
              for i in range(1,4):
                  r=json.load(open(f'/tmp/{prefix}-{i}.json')); a=r['audits']
                  row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']}
                  rows.append(row); print('run',i,row)
                  for x in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]:
                      n=x.get('node') or {}; print(' shift',x.get('score'),n.get('selector') or n.get('nodeLabel') or '')
              med={k:statistics.median(x[k] for x in rows) for k in rows[0]}; print('median',med); return med
          mobile=collect('mobile'); desktop=collect('desktop')
          keep=(mobile['cls']<0.10 and desktop['cls']<0.10 and mobile['lcp']<9000 and desktop['lcp']<7000)
          print('keep=',str(keep).lower()); open('/tmp/keep-home-nav-cls','w').write('1' if keep else '0')
          PY

      - name: Restore on regression and record results
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep-home-nav-cls 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then
            PROD=$(cat /tmp/prod-home-nav-cls)
            PORT="${STAGING_PORT:-22}"
            SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
            timeout 180s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              THEME='$PROD/wp-content/themes/elmercadodeorigen-child'; MU='$PROD/wp-content/mu-plugins'
              install -m0644 /tmp/home-cache-before-nav-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\"
              install -m0644 /tmp/home-cls-before-nav-${GITHUB_RUN_ID}.php \"\$MU/elmercado-home-cls-010256.php\"
              php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
              \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
              rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            "
            git checkout ab3700075fc013b113a9fc3b011901af392f3983 -- elmercadodeorigen-child/inc/home-cache.php elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php
          fi
          mkdir -p runtime; [ -f runtime/home-mobile-nav-cls-20260820.txt ] || echo failed > runtime/home-mobile-nav-cls-20260820.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/home-cache.php elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php runtime/home-mobile-nav-cls-20260820.txt
          git commit -m 'Measure Home mobile navigation CLS guard' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

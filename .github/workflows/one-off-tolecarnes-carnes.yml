name: One-off assign Tole Carnes products to Carnes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-tolecarnes-carnes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign-category:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Assign Carnes category directly in WordPress
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          domain="$2"
          wp_path=""
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates" /tmp/mdo-tolecarnes-category.php' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep "/${domain}/wp-config.php$" "$candidates" | head -n 1 || true)"
            [ -n "$preferred" ] || { echo "No WordPress installation found for ${domain}." >&2; exit 1; }
            wp_path="$(dirname "$preferred")"
          fi
          [ "$(basename "$wp_path")" = "$domain" ] || { echo "Resolved path does not match ${domain}: ${wp_path}" >&2; exit 1; }

          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI is unavailable.' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'No usable PHP CLI binary found.' >&2; exit 1; }

          cat > /tmp/mdo-tolecarnes-category.php <<'PHP'
          <?php
          global $wpdb;

          if ( ! taxonomy_exists( 'product_cat' ) ) {
              fwrite( STDERR, "WooCommerce product_cat taxonomy is unavailable.\n" );
              exit( 2 );
          }

          $suppliers_table = $wpdb->prefix . 'mdo_suppliers';
          $products_table  = $wpdb->prefix . 'mdo_source_products';
          $suppliers = $wpdb->get_results(
              "SELECT id, vendor_user_id, name FROM {$suppliers_table} WHERE connector = 'tolecarnes'",
              ARRAY_A
          );

          if ( ! $suppliers ) {
              fwrite( STDERR, "No supplier with connector=tolecarnes was found.\n" );
              exit( 3 );
          }

          $term = term_exists( 'Carnes', 'product_cat' );
          if ( ! $term ) {
              $term = wp_insert_term( 'Carnes', 'product_cat', array( 'slug' => 'carnes' ) );
          }
          if ( is_wp_error( $term ) ) {
              fwrite( STDERR, 'Could not create/find Carnes: ' . $term->get_error_message() . "\n" );
              exit( 4 );
          }
          $term_id = is_array( $term ) ? (int) $term['term_id'] : (int) $term;

          $ids = array();
          foreach ( $suppliers as $supplier ) {
              $supplier_id = (int) $supplier['id'];
              $linked = $wpdb->get_col(
                  $wpdb->prepare(
                      "SELECT wc_product_id FROM {$products_table} WHERE supplier_id = %d AND wc_product_id IS NOT NULL AND wc_product_id > 0",
                      $supplier_id
                  )
              );
              foreach ( $linked as $product_id ) {
                  $ids[(int) $product_id] = true;
              }

              $vendor_id = (int) $supplier['vendor_user_id'];
              if ( $vendor_id > 0 ) {
                  $vendor_products = $wpdb->get_col(
                      $wpdb->prepare(
                          "SELECT ID FROM {$wpdb->posts} WHERE post_type = 'product' AND post_author = %d AND post_status NOT IN ('trash','auto-draft')",
                          $vendor_id
                      )
                  );
                  foreach ( $vendor_products as $product_id ) {
                      $ids[(int) $product_id] = true;
                  }
              }
          }

          $assigned = 0;
          $already  = 0;
          $errors   = 0;
          foreach ( array_keys( $ids ) as $product_id ) {
              if ( 'product' !== get_post_type( $product_id ) ) {
                  continue;
              }
              if ( has_term( $term_id, 'product_cat', $product_id ) ) {
                  $already++;
                  continue;
              }
              $result = wp_set_object_terms( $product_id, array( $term_id ), 'product_cat', true );
              if ( is_wp_error( $result ) ) {
                  $errors++;
              } else {
                  $assigned++;
              }
          }

          $total_in_category = (int) $wpdb->get_var(
              $wpdb->prepare(
                  "SELECT COUNT(DISTINCT tr.object_id)
                   FROM {$wpdb->term_relationships} tr
                   INNER JOIN {$wpdb->term_taxonomy} tt ON tt.term_taxonomy_id = tr.term_taxonomy_id
                   WHERE tt.taxonomy = 'product_cat' AND tt.term_id = %d",
                  $term_id
              )
          );

          echo 'CATEGORY_ID=' . $term_id . PHP_EOL;
          echo 'TOLE_PRODUCTS_FOUND=' . count( $ids ) . PHP_EOL;
          echo 'ASSIGNED_NOW=' . $assigned . PHP_EOL;
          echo 'ALREADY_ASSIGNED=' . $already . PHP_EOL;
          echo 'ERRORS=' . $errors . PHP_EOL;
          echo 'TOTAL_PRODUCTS_IN_CARNES=' . $total_in_category . PHP_EOL;
          if ( $errors > 0 ) {
              exit( 5 );
          }
          PHP

          "$php_bin" -d memory_limit=512M "$wp_bin" eval-file /tmp/mdo-tolecarnes-category.php --path="$wp_path" --allow-root
          rm -f /tmp/mdo-tolecarnes-category.php
          REMOTE

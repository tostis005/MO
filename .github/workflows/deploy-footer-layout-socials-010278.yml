name: Deploy footer layout and socials 0.10.278

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/z-mdo-footer-layout-socials-010278.php'
      - '.github/workflows/deploy-footer-layout-socials-010278.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate footer module
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/z-mdo-footer-layout-socials-010278.php
          grep -Fq 'mdo-footer-layout-socials-010278' mu-plugins/z-mdo-footer-layout-socials-010278.php
          grep -Fq 'https://t.me/elmercadodeorigen' mu-plugins/z-mdo-footer-layout-socials-010278.php
          grep -Fq 'mdo-footer-enhanced-010278' mu-plugins/z-mdo-footer-layout-socials-010278.php

      - name: Deploy footer module to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          source='mu-plugins/z-mdo-footer-layout-socials-010278.php'
          base="$(basename "$source")"
          target="$PROD_PATH/wp-content/mu-plugins/$base"
          remote="/tmp/${base%.php}-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS "$source" "$STAGING_USER@$STAGING_HOST:$remote"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$target' ]; then cp '$target' '$target.bak-${GITHUB_RUN_ID}'; fi; install -m 0644 '$remote' '$target'; rm -f '$remote'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$target'"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp || true); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); if [ -n \"\$wp_bin\" ]; then \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; fi"

      - name: Verify footer on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > check-footer.js <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox']
            });

            const tests = [
              { name: 'desktop-es', url: 'https://www.elmercadodeorigen.com/?footer_verify=' + Date.now(), width: 1440, height: 1000, mobile: false, lang: 'es' },
              { name: 'mobile-es', url: 'https://www.elmercadodeorigen.com/?footer_verify_mobile=' + Date.now(), width: 390, height: 844, mobile: true, lang: 'es' },
              { name: 'desktop-en', url: 'https://www.elmercadodeorigen.com/en/?footer_verify_en=' + Date.now(), width: 1440, height: 1000, mobile: false, lang: 'en' }
            ];

            for (const cfg of tests) {
              const page = await browser.newPage({ viewport: { width: cfg.width, height: cfg.height } });
              await page.goto(cfg.url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForSelector('.site-footer.mdo-footer-enhanced-010278', { timeout: 20000 });

              const result = await page.evaluate(({ mobile, lang }) => {
                const footer = document.querySelector('.site-footer.mdo-footer-enhanced-010278');
                const shell = footer?.querySelector('.mdo-footer-shell-010278');
                const main = shell?.querySelector('.mdo-footer-main-010278');
                const headings = Array.from(shell?.querySelectorAll('.mdo-footer-column-010278 h2') || []).map(el => el.textContent.trim());
                const links = Array.from(shell?.querySelectorAll('.mdo-footer-column-010278 li a') || []).map(el => ({ text: el.textContent.trim(), href: el.href }));
                const socials = Array.from(shell?.querySelectorAll('.mdo-footer-social-010278') || []).map(el => ({ label: el.getAttribute('aria-label'), href: el.href }));
                const hiddenOriginalCount = Array.from(footer?.children || []).filter(el => !el.classList.contains('mdo-footer-shell-010278') && getComputedStyle(el).display === 'none').length;
                const visibleOriginalCount = Array.from(footer?.children || []).filter(el => !el.classList.contains('mdo-footer-shell-010278') && getComputedStyle(el).display !== 'none').length;
                const columns = main ? getComputedStyle(main).gridTemplateColumns.split(' ').filter(Boolean).length : 0;
                const overflow = document.documentElement.scrollWidth - window.innerWidth;
                const tg = socials.find(item => item.label === 'Telegram')?.href || '';
                const wa = socials.find(item => item.label === 'WhatsApp')?.href || '';
                const floatingWA = Array.from(document.querySelectorAll('a[href]')).some(a => !a.classList.contains('mdo-footer-social-010278') && /(wa\.me|whatsapp\.com|api\.whatsapp)/i.test(a.href));
                return { footer: !!footer, shell: !!shell, headings, links, socials, hiddenOriginalCount, visibleOriginalCount, columns, overflow, tg, wa, floatingWA, mobile, lang };
              }, { mobile: cfg.mobile, lang: cfg.lang });

              console.log('FOOTER_CHECK', cfg.name, JSON.stringify(result));

              if (!result.footer || !result.shell) throw new Error(cfg.name + ': enhanced footer missing');
              if (result.socials.length !== 4) throw new Error(cfg.name + ': expected 4 social/contact icons');
              if (!result.tg.startsWith('https://t.me/elmercadodeorigen')) throw new Error(cfg.name + ': Telegram URL changed: ' + result.tg);
              if (!/(wa\.me|whatsapp\.com|api\.whatsapp)/i.test(result.wa)) throw new Error(cfg.name + ': WhatsApp URL invalid: ' + result.wa);
              if (result.visibleOriginalCount !== 0) throw new Error(cfg.name + ': old footer/payment block is still visible');
              if (result.overflow > 2) throw new Error(cfg.name + ': horizontal overflow ' + result.overflow + 'px');

              if (cfg.lang === 'es') {
                const labels = result.links.map(item => item.text);
                for (const wanted of ['Quiénes somos', 'Contacto', 'Contacto productores', 'Envíos', 'Devoluciones y reembolsos', 'Aviso legal', 'Términos y condiciones', 'Política de privacidad', 'Política de cookies']) {
                  if (!labels.includes(wanted)) throw new Error(cfg.name + ': missing link ' + wanted);
                }
                if (result.headings[0] !== 'El Mercado' || result.headings[1] !== 'Información') throw new Error(cfg.name + ': wrong Spanish headings');
              } else {
                if (result.headings[0] !== 'El Mercado' || result.headings[1] !== 'Information') throw new Error(cfg.name + ': wrong English headings');
              }

              if (cfg.mobile && result.columns !== 1) throw new Error(cfg.name + ': mobile footer is not stacked');
              if (!cfg.mobile && result.columns !== 3) throw new Error(cfg.name + ': desktop footer does not have 3 visual areas');
              await page.close();
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          node check-footer.js

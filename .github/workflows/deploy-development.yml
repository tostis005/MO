name: Deploy child theme to staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/**'
      - '.github/workflows/deploy-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate theme
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          test -f elmercadodeorigen-child/assets/css/theme.css
          test -f elmercadodeorigen-child/assets/css/integrations.css
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css
          find elmercadodeorigen-child -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"

          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo "STAGING_PORT must be a valid numeric port"
            exit 1
          }

          RAW_PATH="${STAGING_REMOTE_PATH%/}"
          [[ "$RAW_PATH" == /* ]] || {
            echo "STAGING_REMOTE_PATH must be an absolute server path"
            exit 1
          }
          [[ "$RAW_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "STAGING_REMOTE_PATH contains unsupported characters"
            exit 1
          }

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Register SSH host key
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'printf "SSH connection successful\n"'

      - name: Locate the real WordPress installation
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"

          set +e
          REMOTE_OUTPUT="$({
            sshpass -e ssh \
              -o BatchMode=no \
              -o PreferredAuthentications=password,keyboard-interactive \
              -o PubkeyAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -p "$PORT" \
              "$STAGING_USER@$STAGING_HOST" \
              "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE_SCRIPT'
          set -eu

          raw="${1%/}"
          theme_name="elmercadodeorigen-child"
          wp_root=""

          case "$raw" in
            */wp-content/themes/elmercadodeorigen-child)
              candidate="$(dirname "$(dirname "$(dirname "$raw")")")"
              [ -f "$candidate/wp-config.php" ] && wp_root="$candidate"
              ;;
            */wp-content/themes)
              candidate="$(dirname "$(dirname "$raw")")"
              [ -f "$candidate/wp-config.php" ] && wp_root="$candidate"
              ;;
            */wp-content)
              candidate="$(dirname "$raw")"
              [ -f "$candidate/wp-config.php" ] && wp_root="$candidate"
              ;;
            *)
              [ -f "$raw/wp-config.php" ] && [ -d "$raw/wp-content/themes" ] && wp_root="$raw"
              ;;
          esac

          find_wordpress() {
            base="$1"
            [ -d "$base" ] || return 0
            find "$base" -maxdepth 7 -type f -name wp-config.php \
              ! -path '*/.cache/*' \
              ! -path '*/cache/*' \
              ! -path '*/backup/*' \
              ! -path '*/backups/*' \
              2>/dev/null | head -n 5
          }

          if [ -z "$wp_root" ]; then
            configs="$(find_wordpress "$raw")"
            count="$(printf '%s\n' "$configs" | sed '/^$/d' | wc -l | tr -d ' ')"

            if [ "$count" -eq 0 ]; then
              configs="$(find_wordpress "$HOME")"
              count="$(printf '%s\n' "$configs" | sed '/^$/d' | wc -l | tr -d ' ')"
            fi

            if [ "$count" -ne 1 ]; then
              echo "Could not identify exactly one WordPress installation." >&2
              echo "wp-config.php candidates found: $count" >&2
              printf '%s\n' "$configs" >&2
              exit 1
            fi

            config="$(printf '%s\n' "$configs" | sed '/^$/d' | head -n 1)"
            wp_root="$(dirname "$config")"
          fi

          [ -f "$wp_root/wp-config.php" ] || {
            echo "Resolved directory is not a WordPress root." >&2
            exit 1
          }
          [ -d "$wp_root/wp-content/themes" ] || {
            echo "The WordPress themes directory does not exist." >&2
            exit 1
          }

          theme_path="$wp_root/wp-content/themes/$theme_name"
          printf '__THEME_PATH__=%s\n' "$theme_path"
          REMOTE_SCRIPT
          } 2>&1)"
          REMOTE_STATUS=$?
          set -e

          printf '%s\n' "$REMOTE_OUTPUT"
          if [ "$REMOTE_STATUS" -ne 0 ]; then
            exit "$REMOTE_STATUS"
          fi

          THEME_PATH="$(printf '%s\n' "$REMOTE_OUTPUT" | sed -n 's/^__THEME_PATH__=//p' | tail -n 1)"
          : "${THEME_PATH:?Could not resolve the remote WordPress theme path}"

          echo "STAGING_THEME_PATH=$THEME_PATH" >> "$GITHUB_ENV"
          echo "The WordPress installation and themes directory were located."

      - name: Deploy child theme with rsync
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          TARGET="${STAGING_THEME_PATH%/}/"

          sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "mkdir -p -- '$TARGET'"

          sshpass -e rsync -az --delete \
            --exclude='.DS_Store' \
            --exclude='*.map' \
            -e "ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT" \
            elmercadodeorigen-child/ \
            "$STAGING_USER@$STAGING_HOST:$TARGET"

      - name: Verify deployment in WordPress themes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          TARGET="${STAGING_THEME_PATH%/}"

          sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "test -f '$TARGET/style.css' && \
             test -f '$TARGET/functions.php' && \
             grep -q '^Template: woostify$' '$TARGET/style.css' && \
             printf 'Verified child theme files in the WordPress themes directory.\n'"

      - name: Deployment summary
        shell: bash
        run: |
          echo "Child theme deployed and verified in the staging WordPress installation."

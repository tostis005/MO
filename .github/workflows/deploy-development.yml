name: Deploy child theme to staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/**'
      - '.github/workflows/deploy-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate theme and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          test -f elmercadodeorigen-child/assets/css/theme.css
          test -f elmercadodeorigen-child/assets/css/integrations.css
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l

          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"

          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          [[ "$STAGING_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]] || exit 1

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Locate WordPress installation
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"

          set +e
          OUTPUT="$(sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "sh -s -- '$STAGING_REMOTE_PATH'" 2>&1 <<'REMOTE'
          set -eu
          raw="${1%/}"
          wp_dir=""

          check_root() {
            candidate="$1"
            if [ -f "$candidate/wp-config.php" ] && [ -d "$candidate/wp-content/themes" ]; then
              wp_dir="$candidate"
              return 0
            fi
            return 1
          }

          case "$raw" in
            */wp-content/themes/elmercadodeorigen-child)
              check_root "$(dirname "$(dirname "$(dirname "$raw")")")" || true
              ;;
            */wp-content/themes)
              check_root "$(dirname "$(dirname "$raw")")" || true
              ;;
            */wp-content)
              check_root "$(dirname "$raw")" || true
              ;;
            *)
              check_root "$raw" || true
              ;;
          esac

          if [ -z "$wp_dir" ]; then
            tmp="$(mktemp)"
            trap 'rm -f "$tmp" "$tmp.sorted"' EXIT

            search_base() {
              base="$1"
              [ -d "$base" ] || return 0
              find "$base" -maxdepth 9 -type f -name wp-config.php \
                ! -path '*/.cache/*' \
                ! -path '*/cache/*' \
                ! -path '*/backup/*' \
                ! -path '*/backups/*' \
                ! -path '*/node_modules/*' \
                2>/dev/null >> "$tmp" || true
            }

            search_base "$raw"
            search_base "$HOME"
            search_base /var/www
            search_base /home
            search_base /srv
            search_base /opt
            search_base /data
            search_base /web
            search_base /www
            search_base /usr/local/www

            sort -u "$tmp" | head -n 20 > "$tmp.sorted"
            count="$(wc -l < "$tmp.sorted" | tr -d ' ')"

            if [ "$count" -eq 0 ]; then
              timeout 35 find / -xdev -type f -name wp-config.php \
                ! -path '/proc/*' ! -path '/sys/*' ! -path '/dev/*' ! -path '/run/*' \
                ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' \
                2>/dev/null | head -n 20 > "$tmp.sorted" || true
              count="$(wc -l < "$tmp.sorted" | tr -d ' ')"
            fi

            if [ "$count" -ne 1 ]; then
              echo "Could not identify exactly one WordPress installation."
              echo "wp-config.php candidates found: $count"
              cat "$tmp.sorted"
              exit 1
            fi

            wp_dir="$(dirname "$(head -n 1 "$tmp.sorted")")"
          fi

          [ -f "$wp_dir/wp-config.php" ]
          [ -d "$wp_dir/wp-content/themes" ]
          printf '__THEME_PATH__=%s\n' "$wp_dir/wp-content/themes/elmercadodeorigen-child"
          REMOTE
          )"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"
          [ "$STATUS" -eq 0 ] || exit "$STATUS"

          THEME_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__THEME_PATH__=//p' | tail -n 1)"
          : "${THEME_PATH:?Could not resolve the WordPress theme path}"
          echo "STAGING_THEME_PATH=$THEME_PATH" >> "$GITHUB_ENV"

      - name: Deploy and verify child theme
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          TARGET="${STAGING_THEME_PATH%/}/"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p -- '$TARGET'"

          sshpass -e rsync -az --delete \
            --exclude='.DS_Store' \
            --exclude='*.map' \
            -e "ssh $SSH_OPTIONS" \
            elmercadodeorigen-child/ \
            "$STAGING_USER@$STAGING_HOST:$TARGET"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" \
            "test -f '$TARGET/style.css' && \
             test -f '$TARGET/functions.php' && \
             grep -q '^Template: woostify$' '$TARGET/style.css' && \
             printf 'Child theme verified inside WordPress themes.\n'"

      - name: Deployment summary
        run: echo "Child theme deployed and verified in staging."

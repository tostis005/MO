name: Deploy child theme to staging

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/**'
      - '.github/workflows/deploy-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_URL: https://dev.elmercadodeorigen.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate theme and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/style.css
          test -f elmercadodeorigen-child/functions.php
          grep -q '^Template: woostify$' elmercadodeorigen-child/style.css
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$STAGING_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]+/?$ ]]

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve configured WordPress path
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"

          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          wp_path=""
          case "$raw" in
            */wp-content/themes/elmercadodeorigen-child) wp_path="$(dirname "$(dirname "$(dirname "$raw")")")" ;;
            */wp-content/themes) wp_path="$(dirname "$(dirname "$raw")")" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac

          if [ ! -f "$wp_path/wp-config.php" ] || [ ! -d "$wp_path/wp-content/themes" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates"' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php \
                ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' \
                2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep '/dev\.elmercadodeorigen\.com/wp-config\.php$' "$candidates" | head -n 1 || true)"
            if [ -n "$preferred" ]; then
              wp_path="$(dirname "$preferred")"
            else
              unique="$(sort -u "$candidates")"
              count="$(printf '%s\n' "$unique" | sed '/^$/d' | wc -l | tr -d ' ')"
              [ "$count" -eq 1 ] || { echo 'Configured staging path is not a unique WordPress installation.' >&2; exit 1; }
              wp_path="$(dirname "$(printf '%s\n' "$unique" | head -n 1)")"
            fi
          fi

          [ -f "$wp_path/wp-config.php" ]
          [ -d "$wp_path/wp-content/themes" ]
          printf '__WP_PATH__=%s\n' "$wp_path"
          printf '__THEME_PATH__=%s\n' "$wp_path/wp-content/themes/elmercadodeorigen-child"
          REMOTE
          )"

          printf '%s\n' "$OUTPUT"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"
          THEME_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__THEME_PATH__=//p' | tail -n 1)"
          : "${WP_PATH:?Could not resolve staging WordPress path}"
          : "${THEME_PATH:?Could not resolve staging theme path}"
          echo "STAGING_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"
          echo "STAGING_THEME_PATH=$THEME_PATH" >> "$GITHUB_ENV"

      - name: Deploy and activate child theme
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          TARGET="${STAGING_THEME_PATH%/}/"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p -- '$TARGET'"
          sshpass -e rsync -az --delete \
            --exclude='.DS_Store' --exclude='*.map' \
            -e "ssh $SSH_OPTIONS" \
            elmercadodeorigen-child/ \
            "$STAGING_USER@$STAGING_HOST:$TARGET"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          test -f "$wp_path/wp-content/themes/elmercadodeorigen-child/functions.php"
          if command -v wp >/dev/null 2>&1; then
            wp theme activate elmercadodeorigen-child --path="$wp_path"
            active="$(wp option get stylesheet --path="$wp_path" --skip-plugins --skip-themes)"
            [ "$active" = 'elmercadodeorigen-child' ]
            wp cache flush --path="$wp_path" || true
          else
            echo 'WP-CLI is unavailable; cannot safely activate and verify the child theme.' >&2
            exit 1
          fi
          REMOTE

      - name: Verify the public staging URL
        shell: bash
        run: |
          set -euo pipefail
          URL="$STAGING_URL/?deployment=${GITHUB_SHA}"
          for attempt in {1..20}; do
            status="$(curl -sS -L --max-time 25 -o /tmp/staging.html -w '%{http_code}' "$URL" || true)"
            if [ "$status" = '200' ] \
              && grep -q 'elmercado-child-theme' /tmp/staging.html \
              && grep -q 'elmercado-release-one-finish' /tmp/staging.html; then
              exit 0
            fi
            sleep 5
          done
          echo 'The public staging URL did not serve the active child theme.' >&2
          echo "Last HTTP status: ${status:-unknown}" >&2
          exit 1

      - name: Deployment summary
        run: echo "Child theme deployed, activated and verified on dev.elmercadodeorigen.com."

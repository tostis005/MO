name: Send one native FluentCRM test of 1957 oil mailing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fluentcrm-native-test-campaign12-20261030.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Native FluentCRM test and server Gmail acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/fluentcrm-native-test-campaign12-20261030.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          ROOT='/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs'
          REMOTE="/tmp/fluent-native-test-${GITHUB_RUN_ID}.php"
          LINECOUNT="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wc -l < /var/log/maillog")"
          sshpass -e scp $SCP .github/scripts/fluentcrm-native-test-campaign12-20261030.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          trap 'sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f $REMOTE" >/dev/null 2>&1 || true' EXIT
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "timeout 120 /opt/plesk/php/8.2/bin/php -d memory_limit=768M /usr/local/bin/wp eval-file '$REMOTE' --path='$ROOT' --allow-root" | tee /tmp/fluent-native-test.txt
          grep -q 'FLUENT_NATIVE_TEST_OPERATION_COMPLETE' /tmp/fluent-native-test.txt
          sleep 7
          FIRST=$((LINECOUNT+1))
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "tail -n +$FIRST /var/log/maillog | grep -iF 'jose.fraga@gmail.com' | tail -n 12 || true" | tee /tmp/native-test-mail.log
          if grep -Eq 'dsn=2\.0\.0.*status=sent' /tmp/native-test-mail.log; then
            echo "FLUENT_NATIVE_TEST_GMAIL_ACCEPTED"
          else
            echo "FLUENT_NATIVE_TEST_GMAIL_DELIVERY_UNVERIFIED"
            exit 3
          fi

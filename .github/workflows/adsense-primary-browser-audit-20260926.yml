name: Audit AdSense primary production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-primary-browser-audit-20260926.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet selenium
      - name: Verify Spain and South Africa
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL='https://www.elmercadodeorigen.com/dop-jabugo-que-garantiza-territorio-como-reconocer-jamon/?adsense_debug=1&primary_audit=1'

          def run(country):
              o=Options(); o.page_load_strategy='none'
              for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=en-US'):
                  o.add_argument(a)
              d=webdriver.Chrome(options=o)
              try:
                  d.execute_cdp_cmd('Network.enable',{})
                  d.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':f"""
                  (()=>{{const f=window.fetch;window.fetch=function(input,init){{
                    const u=typeof input==='string'?input:(input&&input.url)||'';
                    if(u.includes('/assets/ad-geo-fast.php')||u.includes('/wp-json/elmercado/v1/adsense-eligibility')){{
                      init=Object.assign({{}},init||{{}});const h=new Headers(init.headers||{{}});
                      h.set('X-Country-Code','{country}');init.headers=h;
                    }}
                    return f.call(this,input,init);
                  }};}})();"""})
                  start=time.time()
                  d.get(URL+'&country='+country)
                  for sec in (2,4,7,10):
                      remain=sec-(time.time()-start)
                      if remain>0: time.sleep(remain)
                      state=d.execute_script(r"""
                        const res=performance.getEntriesByType('resource').map(r=>({
                          name:r.name,start:Math.round(r.startTime),dur:Math.round(r.duration),initiator:r.initiatorType
                        }));
                        return {
                          t:Math.round(performance.now()),
                          readyState:document.readyState,
                          debug:window.ElMercadoAdsenseGeoDebug||null,
                          adsterra:res.filter(r=>/highrevenueformat|profitableratecpmnetwork|adsterra-frame/.test(r.name)),
                          google:res.filter(r=>/googlesyndication|doubleclick/.test(r.name)),
                          controller:res.filter(r=>r.name.includes('adsense-geo-010266.js')),
                          fastGeo:res.filter(r=>r.name.includes('/assets/ad-geo-fast.php')),
                          restGeo:res.filter(r=>r.name.includes('/wp-json/elmercado/v1/adsense-eligibility')),
                          placeholders:document.querySelectorAll('.emo-inarticle-ad-slot[data-emo-inarticle-ad]').length,
                          hydrated:document.querySelectorAll('.emo-inarticle-ad-slot[data-emo-inarticle-hydrated="1"]').length,
                          filled:document.querySelectorAll('.emo-inarticle-ad-slot.is-filled').length,
                          statuses:Array.from(document.querySelectorAll('.emo-inarticle-ad-slot ins.adsbygoogle')).map(x=>x.getAttribute('data-ad-status')),
                          adsterraController:!!document.querySelector('script[src*="adsterra-geo-010290.js"]'),
                          adsenseController:!!document.querySelector('script[src*="adsense-geo-010266.js"]')
                        };
                      """)
                      print(country+'_T'+str(sec)+'='+json.dumps(state,sort_keys=True),flush=True)
              finally:
                  d.quit()

          run('ES')
          run('ZA')
          PY

name: Falang staging audit and fix 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/falang-staging-audit-fix-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falang-staging-audit-fix
  cancel-in-progress: true

jobs:
  falang-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass

      - name: Diagnose Falang-only runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to resolve staging WordPress path}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$WP_PATH'" <<'REMOTE'
          set -euo pipefail
          WP_PATH="$1"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp || true)"
          wpcli_safe() { "$PHP_BIN" -d memory_limit=512M "$WP_BIN" --path="$WP_PATH" --allow-root --skip-plugins --skip-themes "$@"; }

          echo '=== ACTIVE MULTILINGUAL STATE ==='
          wpcli_safe plugin list --fields=name,status,version --format=csv | grep -Ei 'falang|wpml|sitepress|polylang|translatepress|weglot|gtranslate|multilingual|qtranslate|bogo|staging-bilingual|native-render|language-dropdown|shop-guard' || true
          echo '=== MU ACTIVE ==='
          wpcli_safe plugin list --status=must-use --fields=name,status,version --format=table || true
          echo '=== DISABLED CUSTOM MU FILES ==='
          find "$WP_PATH/wp-content/mu-plugins" -maxdepth 1 -type f -name '*.disabled-falang-20260816' -printf '%f\n' 2>/dev/null | sort || true

          echo '=== FALANG PREFIX CODE ==='
          sed -n '170,200p' "$WP_PATH/wp-content/plugins/falang/src/Falang/Core/Falang_Core.php" 2>/dev/null || true

          echo '=== FALANG OPTIONS / LANGUAGE OPTIONS ==='
          wpcli_safe option list --fields=option_name,option_value --format=csv | grep -Ei 'falang|language' | head -n 100 || true

          DB_PREFIX="$(wpcli_safe db prefix)"
          echo "db_prefix=$DB_PREFIX"
          echo '=== EXISTING TRANSLATED POST FIELD META KEYS ==='
          wpcli_safe db query "SELECT meta_key, COUNT(*) AS rows_count FROM ${DB_PREFIX}postmeta WHERE meta_key LIKE '%post_name%' OR meta_key LIKE '%published%' GROUP BY meta_key ORDER BY rows_count DESC LIMIT 100;" --skip-column-names || true

          echo '=== SHOP META ==='
          SHOP_ID="$(wpcli_safe option get woocommerce_shop_page_id 2>/dev/null || true)"
          echo "shop_page_id=$SHOP_ID"
          if [[ "$SHOP_ID" =~ ^[0-9]+$ ]] && [ "$SHOP_ID" -gt 0 ]; then
            wpcli_safe post meta list "$SHOP_ID" --format=table || true
          fi

          echo '=== OLD MU LOGIC HINTS ==='
          for f in "$WP_PATH"/wp-content/mu-plugins/*.disabled-falang-20260816; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f") ---"
            grep -nEi -C2 'falang|translatepress|shop|tienda|request|template_redirect|post_name|rewrite|language|locale|timeout' "$f" | head -n 140 || true
          done

          echo '=== RECENT PHP / WEB ERRORS ==='
          for log in \
            "/var/www/vhosts/system/dev.elmercadodeorigen.com/logs/error_log" \
            "/var/www/vhosts/system/dev.elmercadodeorigen.com/logs/proxy_error_log" \
            "$WP_PATH/error_log" \
            "$WP_PATH/wp-content/debug.log"; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              tail -n 120 "$log" || true
            fi
          done

          echo '=== WEB SERVER VS PHP CHECK ==='
          for path in /wp-includes/css/dashicons.min.css /robots.txt /; do
            printf '%-40s ' "$path"
            curl -k -sS -o /dev/null -w '%{http_code} %{time_total}\n' --connect-timeout 3 --max-time 8 --resolve dev.elmercadodeorigen.com:443:127.0.0.1 "https://dev.elmercadodeorigen.com$path" || true
          done
          REMOTE

name: Replicate Jamones y Paletas catalog to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-ham-catalog-migration.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-ham-catalog-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_DOMAIN: elmercadodeorigen.com
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_PORT: ${{ secrets.STAGING_PORT }}
      SSH_USER: ${{ secrets.STAGING_USER }}
      SSH_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SEARCH_HINT: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate connection
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING_HOST secret}"
          : "${SSH_USER:?Missing STAGING_USER secret}"
          : "${SSH_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${SEARCH_HINT:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${SSH_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]

      - name: Build exact Dev classification map
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ham-map.b64 <<'MAP'
          
          MAP
          python - <<'PY'
          import base64,zlib,json
          raw=open('/tmp/ham-map.b64').read().strip(); data=zlib.decompress(base64.b64decode(raw)); obj=json.loads(data)
          assert obj['n']==145 and len(obj['i'])==145
          open('/tmp/ham-map.json','wb').write(data); print('Validated Dev map products:',len(obj['i']))
          PY

      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts

      - name: Resolve production WordPress by site URL
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$SEARCH_HINT' '$PROD_DOMAIN'" <<'REMOTE'
          set -eu
          hint="${1%/}"; target="$2"; wp_bin="$(command -v wp || true)"; [ -n "$wp_bin" ]
          php_bin="$(command -v php || true)"; if [ -z "$php_bin" ]; then php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"; fi; [ -x "$php_bin" ]
          candidates="$(mktemp)"; matches="$(mktemp)"; trap 'rm -f "$candidates" "$matches"' EXIT; parent="$(dirname "$hint")"
          for base in "$parent" "$HOME" /var/www/vhosts /var/www /home /srv /opt /data /web /www; do [ -d "$base" ] || continue; find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true; done
          sort -u "$candidates" -o "$candidates"
          while IFS= read -r config; do [ -n "$config" ] || continue; path="$(dirname "$config")"; siteurl="$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"; home="$("$php_bin" -d memory_limit=256M "$wp_bin" option get home --path="$path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"; norm_site="$(printf '%s' "$siteurl" | sed -E 's#^https?://##; s#^www\.##; s#/*$##')"; norm_home="$(printf '%s' "$home" | sed -E 's#^https?://##; s#^www\.##; s#/*$##')"; if [ "$norm_site" = "$target" ] || [ "$norm_home" = "$target" ]; then printf '%s\n' "$path" >> "$matches"; fi; done < "$candidates"
          count="$(sort -u "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"; [ "$count" = '1' ] || { echo "Expected exactly one production WordPress; found ${count}." >&2; exit 1; }
          wp_path="$(sort -u "$matches" | head -n 1)"; siteurl="$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$wp_path" --skip-plugins --skip-themes --allow-root)"; printf '__WP_PATH__=%s\n__SITEURL__=%s\n' "$wp_path" "$siteurl"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"; WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"; : "${WP_PATH:?Production WordPress path was not resolved}"; echo "PROD_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Upload validated mapping temporarily
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"; REMOTE_MAP="/tmp/elmercado-ham-map-${GITHUB_SHA}.json"
          sshpass -e rsync -az -e "ssh $SSH_OPTIONS" /tmp/ham-map.json "$SSH_USER@$SSH_HOST:$REMOTE_MAP"; echo "REMOTE_HAM_MAP=$REMOTE_MAP" >> "$GITHUB_ENV"

      - name: Preflight exact 145 product matches
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH' '$REMOTE_HAM_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1"; map="$2"; wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; if [ -z "$php_bin" ]; then php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"; fi
          script="$(mktemp --suffix=.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function emo_norm($v){$v=html_entity_decode((string)$v,ENT_QUOTES|ENT_HTML5,'UTF-8');$v=remove_accents(wp_strip_all_tags($v));return preg_replace('/[^a-z0-9]+/','',strtolower($v))?:'';}
          function emo_vendor_id($row){$want=emo_norm($row['vn']??'');$preferred=(int)($row['v']??0);if($preferred>0&&($u=get_user_by('id',$preferred))){$h=emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true));if($want&&str_contains($h,$want))return $preferred;}foreach(get_users(['fields'=>['ID','user_login','display_name']]) as $u){$h=emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true));if($want&&str_contains($h,$want))return (int)$u->ID;}return 0;}
          function emo_resolve($row){global $wpdb;$vendor=emo_vendor_id($row);if(!$vendor)return 0;$ids=[];if(!empty($row['sku'])){$ids=$wpdb->get_col($wpdb->prepare("SELECT p.ID FROM {$wpdb->posts} p INNER JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key='_sku' WHERE p.post_type='product' AND p.post_status<>'trash' AND p.post_author=%d AND pm.meta_value=%s",$vendor,(string)$row['sku']));if(count($ids)===1)return (int)$ids[0];}if(!empty($row['slug'])){$p=get_page_by_path((string)$row['slug'],OBJECT,'product');if($p&&(int)$p->post_author===$vendor)return (int)$p->ID;}$want=emo_norm($row['name']??'');$candidates=get_posts(['post_type'=>'product','post_status'=>['publish','private','draft','pending','future'],'posts_per_page'=>-1,'fields'=>'ids','author'=>$vendor]);$found=[];foreach($candidates as $id){if(emo_norm(get_the_title($id))===$want)$found[]=(int)$id;}return count($found)===1?$found[0]:0;}
          $map=json_decode(file_get_contents($args[0]),true);if(!is_array($map)||count($map['i']??[])!==145)exit(2);$resolved=[];$missing=[];$dupes=[];
          foreach($map['i'] as $row){$id=emo_resolve($row);if(!$id){$missing[]=['slug'=>$row['slug'],'sku'=>$row['sku'],'vendor'=>$row['vn'],'name'=>$row['name']];continue;}if(isset($resolved[$id])){$dupes[]=['id'=>$id,'first'=>$resolved[$id],'second'=>$row['slug']];}else{$resolved[$id]=$row['slug'];}}
          $plugin_file=WP_PLUGIN_DIR.'/mdo-supplier-sync/mdo-supplier-sync.php';$version=is_file($plugin_file)?(get_file_data($plugin_file,['Version'=>'Version'])['Version']??''):'';$active=in_array('mdo-supplier-sync/mdo-supplier-sync.php',(array)get_option('active_plugins',[]),true);
          echo wp_json_encode(['siteurl'=>get_option('siteurl'),'map'=>145,'resolved'=>count($resolved),'missing'=>$missing,'duplicate_matches'=>$dupes,'emdo_active'=>$active,'emdo_version'=>$version],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;
          if(count($resolved)!==145||$missing||$dupes)exit(3);if($active&&$version&&$version!=='1.0.4'){fwrite(STDERR,"Active EMDO version is $version; refusing to continue.\n");exit(4);}
          PHP
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$script" "$map" --path="$wp_path" --skip-plugins=mdo-supplier-sync --allow-root
          REMOTE

      - name: Ensure global WooCommerce filter attributes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"; wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; if [ -z "$php_bin" ]; then php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"; fi
          script="$(mktemp --suffix=.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          $defs=['tipo-pieza'=>'Tipo de pieza','calidad'=>'Calidad','raza-iberica'=>'Raza ibérica','alimentacion'=>'Alimentación','con-dop'=>'Con DOP','dop'=>'Denominación de origen','origen'=>'Origen','preparacion'=>'Preparación','rango-peso'=>'Peso','curacion'=>'Curación','productor'=>'Productor'];$existing=[];foreach((array)wc_get_attribute_taxonomies() as $a)$existing[(string)$a->attribute_name]=(int)$a->attribute_id;$created=[];foreach($defs as $slug=>$label){if(isset($existing[$slug]))continue;$id=wc_create_attribute(['name'=>$label,'slug'=>$slug,'type'=>'select','order_by'=>'menu_order','has_archives'=>false]);if(is_wp_error($id)){fwrite(STDERR,"Attribute $slug: ".$id->get_error_message()."\n");exit(2);}$created[$slug]=(int)$id;}delete_transient('wc_attribute_taxonomies');echo wp_json_encode(['status'=>'completed','created'=>$created],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          PHP
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file "$script" --path="$wp_path" --skip-plugins=mdo-supplier-sync --allow-root
          REMOTE

      - name: Apply exact validated Dev attributes tags and category
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH' '$REMOTE_HAM_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1"; map="$2"; wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; if [ -z "$php_bin" ]; then php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"; fi
          script="$(mktemp --suffix=.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function emo_norm($v){$v=html_entity_decode((string)$v,ENT_QUOTES|ENT_HTML5,'UTF-8');$v=remove_accents(wp_strip_all_tags($v));return preg_replace('/[^a-z0-9]+/','',strtolower($v))?:'';}
          function emo_vendor_id($row){$want=emo_norm($row['vn']??'');$preferred=(int)($row['v']??0);if($preferred>0&&($u=get_user_by('id',$preferred))){$h=emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true));if($want&&str_contains($h,$want))return $preferred;}foreach(get_users(['fields'=>['ID','user_login','display_name']]) as $u){$h=emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true));if($want&&str_contains($h,$want))return (int)$u->ID;}return 0;}
          function emo_resolve($row){global $wpdb;$vendor=emo_vendor_id($row);if(!$vendor)return 0;if(!empty($row['sku'])){$ids=$wpdb->get_col($wpdb->prepare("SELECT p.ID FROM {$wpdb->posts} p INNER JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key='_sku' WHERE p.post_type='product' AND p.post_status<>'trash' AND p.post_author=%d AND pm.meta_value=%s",$vendor,(string)$row['sku']));if(count($ids)===1)return (int)$ids[0];}if(!empty($row['slug'])){$p=get_page_by_path((string)$row['slug'],OBJECT,'product');if($p&&(int)$p->post_author===$vendor)return (int)$p->ID;}$want=emo_norm($row['name']??'');$candidates=get_posts(['post_type'=>'product','post_status'=>['publish','private','draft','pending','future'],'posts_per_page'=>-1,'fields'=>'ids','author'=>$vendor]);$found=[];foreach($candidates as $id){if(emo_norm(get_the_title($id))===$want)$found[]=(int)$id;}return count($found)===1?$found[0]:0;}
          $map=json_decode(file_get_contents($args[0]),true);$rows=$map['i']??[];if(count($rows)!==145)exit(2);$cat=get_term_by('slug','jamones-paletas','product_cat');if(!$cat){$r=wp_insert_term('Jamones y paletas','product_cat',['slug'=>'jamones-paletas']);if(is_wp_error($r)){fwrite(STDERR,$r->get_error_message()."\n");exit(3);}$cat=get_term((int)$r['term_id'],'product_cat');}$default=(int)get_option('default_product_cat',0);$changed=0;$errors=[];
          foreach($rows as $row){$id=emo_resolve($row);if(!$id){$errors[]=['slug'=>$row['slug'],'error'=>'not found'];continue;}$product=wc_get_product($id);if(!$product||$product->is_type('variation')){$errors[]=['id'=>$id,'error'=>'invalid parent'];continue;}wp_set_object_terms($id,[(int)$cat->term_id],'product_cat',true);if($default>0&&$default!==(int)$cat->term_id&&has_term($default,'product_cat',$id))wp_remove_object_terms($id,$default,'product_cat');$attributes=$product->get_attributes();$pos=count($attributes);
            foreach((array)$row['a'] as $tax=>$names){if(!taxonomy_exists($tax)){$errors[]=['id'=>$id,'error'=>'missing taxonomy '.$tax];continue 2;}$term_ids=[];foreach((array)$names as $name){$term=term_exists($name,$tax);if(!$term)$term=wp_insert_term($name,$tax);if(is_wp_error($term)){$errors[]=['id'=>$id,'error'=>$term->get_error_message()];continue 3;}$term_ids[]=(int)(is_array($term)?$term['term_id']:$term);}wp_set_object_terms($id,$term_ids,$tax,false);if($term_ids){$aid=(int)wc_attribute_taxonomy_id_by_name($tax);$a=new WC_Product_Attribute();$a->set_id($aid);$a->set_name($tax);$a->set_options($term_ids);$a->set_position($pos++);$a->set_visible(false);$a->set_variation(false);$attributes[$tax]=$a;}else{unset($attributes[$tax]);}}
            $product->set_attributes($attributes);$product->save();wp_set_object_terms($id,array_values(array_unique(array_map('strval',(array)$row['t']))),'product_tag',false);$snapshot=[];foreach((array)$row['a'] as $tax=>$names)$snapshot[preg_replace('/^pa_/','',$tax)]=array_values((array)$names);update_post_meta($id,'_emdo_ham_taxonomy_snapshot',wp_json_encode($snapshot,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));update_post_meta($id,'_emdo_ham_production_replica','2026-08-12-dev-validated');clean_post_cache($id);if(function_exists('wc_delete_product_transients'))wc_delete_product_transients($id);$changed++;}
          echo wp_json_encode(['status'=>$errors?'failed':'completed','products_changed'=>$changed,'errors'=>$errors],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if($errors)exit(4);
          PHP
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$script" "$map" --path="$wp_path" --skip-plugins=mdo-supplier-sync --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$wp_path" --skip-plugins=mdo-supplier-sync --allow-root || true
          REMOTE

      - name: Verify all 145 products against Dev one by one
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "sh -s -- '$PROD_WP_PATH' '$REMOTE_HAM_MAP'" <<'REMOTE'
          set -eu
          wp_path="$1"; map="$2"; wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"; if [ -z "$php_bin" ]; then php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"; fi
          script="$(mktemp --suffix=.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function emo_norm($v){$v=html_entity_decode((string)$v,ENT_QUOTES|ENT_HTML5,'UTF-8');$v=remove_accents(wp_strip_all_tags($v));return preg_replace('/[^a-z0-9]+/','',strtolower($v))?:'';}function emo_vendor_id($row){$want=emo_norm($row['vn']??'');$preferred=(int)($row['v']??0);if($preferred>0&&($u=get_user_by('id',$preferred))){$h=emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true));if($want&&str_contains($h,$want))return $preferred;}foreach(get_users(['fields'=>['ID','user_login','display_name']]) as $u){$h=emo_norm($u->user_login.' '.$u->display_name.' '.get_user_meta($u->ID,'nickname',true));if($want&&str_contains($h,$want))return (int)$u->ID;}return 0;}function emo_resolve($row){global $wpdb;$vendor=emo_vendor_id($row);if(!$vendor)return 0;if(!empty($row['sku'])){$ids=$wpdb->get_col($wpdb->prepare("SELECT p.ID FROM {$wpdb->posts} p INNER JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key='_sku' WHERE p.post_type='product' AND p.post_status<>'trash' AND p.post_author=%d AND pm.meta_value=%s",$vendor,(string)$row['sku']));if(count($ids)===1)return (int)$ids[0];}if(!empty($row['slug'])){$p=get_page_by_path((string)$row['slug'],OBJECT,'product');if($p&&(int)$p->post_author===$vendor)return (int)$p->ID;}$want=emo_norm($row['name']??'');$candidates=get_posts(['post_type'=>'product','post_status'=>['publish','private','draft','pending','future'],'posts_per_page'=>-1,'fields'=>'ids','author'=>$vendor]);$found=[];foreach($candidates as $id){if(emo_norm(get_the_title($id))===$want)$found[]=(int)$id;}return count($found)===1?$found[0]:0;}
          $map=json_decode(file_get_contents($args[0]),true);$rows=$map['i']??[];$errors=[];$checked=0;$cat=get_term_by('slug','jamones-paletas','product_cat');$default=(int)get_option('default_product_cat',0);
          foreach($rows as $row){$id=emo_resolve($row);if(!$id){$errors[]=['slug'=>$row['slug'],'error'=>'not found'];continue;}if(!$cat||!has_term((int)$cat->term_id,'product_cat',$id))$errors[]=['id'=>$id,'error'=>'category'];if($default>0&&has_term($default,'product_cat',$id))$errors[]=['id'=>$id,'error'=>'uncategorized'];foreach((array)$row['a'] as $tax=>$expected){$actual=wp_get_post_terms($id,$tax,['fields'=>'names']);if(is_wp_error($actual)){$errors[]=['id'=>$id,'error'=>$tax];continue;}sort($actual,SORT_NATURAL|SORT_FLAG_CASE);$expected=array_values(array_map('strval',(array)$expected));sort($expected,SORT_NATURAL|SORT_FLAG_CASE);if($actual!==$expected)$errors[]=['id'=>$id,'error'=>$tax,'expected'=>$expected,'actual'=>$actual];}$actual_tags=wp_get_post_terms($id,'product_tag',['fields'=>'names']);$expected_tags=array_values(array_map('strval',(array)$row['t']));sort($actual_tags,SORT_NATURAL|SORT_FLAG_CASE);sort($expected_tags,SORT_NATURAL|SORT_FLAG_CASE);if($actual_tags!==$expected_tags)$errors[]=['id'=>$id,'error'=>'tags'];$checked++;}
          echo wp_json_encode(['status'=>$errors?'failed':'completed','siteurl'=>get_option('siteurl'),'checked'=>$checked,'errors_count'=>count($errors),'errors'=>array_slice($errors,0,30)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if($checked!==145||$errors)exit(5);
          PHP
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$script" "$map" --path="$wp_path" --skip-plugins=mdo-supplier-sync --allow-root
          REMOTE

      - name: Remove temporary production map
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          if [ -n "${REMOTE_HAM_MAP:-}" ]; then PORT="${SSH_PORT:-22}"; SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"; sshpass -e ssh $SSH_OPTIONS "$SSH_USER@$SSH_HOST" "rm -f -- '$REMOTE_HAM_MAP'"; fi

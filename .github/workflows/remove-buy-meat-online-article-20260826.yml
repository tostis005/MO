name: Remove rejected buy meat online article 20260826

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-buy-meat-online-article-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remove-buy-meat-online-article-20260826
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete rejected article from production and verify absence
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          CLEAN_LOCAL=.github/scripts/remove-buy-meat-online-article-20260826.php
          php -l "$CLEAN_LOCAL"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true)
            php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2
            [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;;
              esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"
          REST="${INFO#*|}"
          PHP="${REST%%|*}"
          WP="${REST#*|}"
          REMOTE=/tmp/remove-buy-meat-online-${GITHUB_RUN_ID}.php
          sshpass -e scp $SCP "$CLEAN_LOCAL" "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --skip-plugins --skip-themes --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --skip-plugins --skip-themes --allow-root >/dev/null 2>&1 || true; rm -f '$REMOTE'"

          check_absent() {
            url="$1"; tmp=$(mktemp)
            code=$(curl -k -L -sS --retry 2 --connect-timeout 8 --max-time 60 -A 'Mozilla/5.0 EMDO editorial remover' -H 'Cache-Control: no-cache' -o "$tmp" -w '%{http_code}' "${url}?removeverify=${GITHUB_RUN_ID}" || true)
            marker=$(grep -Fc 'EMDO_MEAT_CLUSTER_2_20260826:buy-meat-online-guide' "$tmp" 2>/dev/null || true)
            title=$(grep -Fic 'Comprar carne online y recibirla a domicilio' "$tmp" 2>/dev/null || true)
            en_title=$(grep -Fic 'Buying meat online for home delivery' "$tmp" 2>/dev/null || true)
            echo "$url | http=$code marker=$marker es_title=$title en_title=$en_title"
            if [ "$marker" -gt 0 ] || [ "$title" -gt 0 ] || [ "$en_title" -gt 0 ]; then
              cat "$tmp" | head -c 2000 || true
              rm -f "$tmp"
              return 1
            fi
            rm -f "$tmp"
          }

          check_absent https://www.elmercadodeorigen.com/comprar-carne-online-domicilio-que-comprobar/
          check_absent https://www.elmercadodeorigen.com/en/buy-meat-online-delivery-what-to-check/

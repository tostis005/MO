name: Production EMDO homepage Specials one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-theme-010212-home-categories-v3.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-emdo-home-specials
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate EMDO release
        shell: bash
        run: |
          set -euo pipefail
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -Fq 'Version: 1.0.28' mdo-supplier-sync/mdo-supplier-sync.php
          grep -Fq 'AHORA EN EL MERCADO DE ORIGEN' mdo-supplier-sync/includes/class-mdo-home-specials.php
          grep -Fq 'NOW AT EL MERCADO DE ORIGEN' mdo-supplier-sync/includes/class-mdo-home-specials.php
          test -f mdo-supplier-sync/assets/css/home-specials.css

      - name: Install SSH tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Deploy EMDO and verify both homes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_ARCHIVE="/tmp/emdo-home-specials-${GITHUB_RUN_ID}.tar.gz"
          tar -czf /tmp/emdo-home-specials.tar.gz mdo-supplier-sync
          sshpass -e scp $SCP_OPTIONS /tmp/emdo-home-specials.tar.gz "$STAGING_USER@$STAGING_HOST:$REMOTE_ARCHIVE"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_ARCHIVE'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_ARCHIVE="$2"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"; test -n "$php_bin"

          mkdir -p "$PROD_PATH/wp-content/plugins"
          tar -xzf "$REMOTE_ARCHIVE" -C "$PROD_PATH/wp-content/plugins"
          rm -f "$REMOTE_ARCHIVE"
          "$php_bin" -l "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/mdo-supplier-sync.php" >/dev/null
          "$php_bin" -l "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-home-specials.php" >/dev/null

          version=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=version --path="$PROD_PATH" --allow-root)
          status=$("$php_bin" -d memory_limit=512M "$wp_bin" plugin get mdo-supplier-sync --field=status --path="$PROD_PATH" --allow-root)
          test "$version" = '1.0.28'
          test "$status" = 'active'

          promotion_id=$("$php_bin" -d memory_limit=512M "$wp_bin" post list --post_type=mdo_promotion --post_status=publish --name=hamburguesas-ternera-regalo-tolecarnes --format=ids --path="$PROD_PATH" --allow-root | awk '{print $1}')
          test -n "$promotion_id"
          promo_status=$("$php_bin" -d memory_limit=512M "$wp_bin" eval "echo class_exists('MDO_Specials') ? MDO_Specials::status($promotion_id) : 'missing';" --path="$PROD_PATH" --allow-root)
          test "$promo_status" = 'active'

          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null || true
          if "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active wp-rocket --path="$PROD_PATH" --allow-root >/dev/null 2>&1; then
            "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          fi

          stamp=$(date +%s)
          curl -k -L -sS --connect-timeout 5 --max-time 30 "https://www.elmercadodeorigen.com/?emdo_specials=$stamp" -o /tmp/home-es.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 "https://www.elmercadodeorigen.com/en/?emdo_specials=$stamp" -o /tmp/home-en.html
          curl -k -L -sS --connect-timeout 5 --max-time 30 "https://www.elmercadodeorigen.com/especiales/?emdo_specials=$stamp" -o /tmp/specials-es.html

          grep -Fq 'AHORA EN EL MERCADO DE ORIGEN' /tmp/home-es.html
          grep -Fq 'Dos hamburguesas de ternera de regalo' /tmp/home-es.html
          grep -Fq 'Ver especial' /tmp/home-es.html
          grep -Fq '/especiales/hamburguesas-ternera-regalo-tolecarnes/' /tmp/home-es.html

          grep -Fq 'NOW AT EL MERCADO DE ORIGEN' /tmp/home-en.html
          grep -Fq 'Two free beef burgers' /tmp/home-en.html
          grep -Fq 'View special' /tmp/home-en.html
          grep -Fq '/en/specials/free-beef-burgers-tolecarnes/' /tmp/home-en.html

          grep -Fq 'Especiales del Mercado de Origen' /tmp/specials-es.html
          ! grep -Fq 'Ahora en El Mercado' /tmp/specials-es.html

          "$php_bin" -r '
          foreach (["/tmp/home-es.html", "/tmp/home-en.html"] as $file) {
              $html = file_get_contents($file);
              $special = strpos($html, "id=\"mdo-home-specials\"");
              $categories = strpos($html, "emo-categories");
              if ($special === false || $categories === false || $special >= $categories) {
                  fwrite(STDERR, "Specials block is not before categories.\n");
                  exit(1);
              }
          }
          '

          echo "EMDO_HOME_SPECIALS_PRODUCTION_OK version=$version"
          REMOTE

name: Home pre-ID sidebar class CLS guard 20260820

on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-mobile-sidebar-class-cls-20260820.yml']

permissions:
  contents: write

concurrency:
  group: home-mobile-sidebar-class-cls-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch pre-ID class guard
        run: |
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/cache-before-class.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php');s=p.read_text()
          old='@media(max-width:991px){html:not([data-emo-menu-intent="1"]) body.home #mobile-navigation.sidebar-menu{display:none!important}}'
          new='@media(max-width:991px){html:not([data-emo-menu-intent="1"]) body.home .sidebar-menu{display:none!important}}'
          if old not in s: raise SystemExit('mobile ID guard not found')
          p.write_text(s.replace(old,new,1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
      - name: Deploy and warm
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail; PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp);php_bin=$(command -v php||true);[ -n "$php_bin" ]||php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1);for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null);do p=$(dirname "$cfg");u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true);case "$u" in *elmercadodeorigen.com*)printf "%s" "$p";break;;esac;done')"; : "${PROD:?no prod}"; echo "$PROD">/tmp/prod-class
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/cache-class-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child';cp \"\$THEME/inc/home-cache.php\" /tmp/cache-server-before-class-${GITHUB_RUN_ID}.php;install -m0644 /tmp/cache-class-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\";php_bin=\$(command -v php||true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css"
          for i in 1 2;do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null;done
      - name: Lighthouse mobile 2x
        run: |
          mkdir -p runtime
          for i in 1 2;do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=mobile --output=json --output-path="/tmp/lh-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage';done
          python3 - <<'PY' | tee runtime/home-mobile-sidebar-class-cls-20260820.txt
          import json,statistics
          rows=[]
          for i in (1,2):
              r=json.load(open(f'/tmp/lh-{i}.json'));a=r['audits'];row={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue']};rows.append(row);print('run',i,row)
              for x in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]:n=x.get('node') or {};print(' shift',x.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(x[k] for x in rows) for k in rows[0]};print('median',med);keep=med['cls']<0.10 and med['lcp']<7000;print('keep=',str(keep).lower());open('/tmp/keep-class','w').write('1' if keep else '0')
          PY
      - name: Decide and record
        if: always()
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail;K=$(cat /tmp/keep-class 2>/dev/null||echo 0);PROD=$(cat /tmp/prod-class);PORT="${STAGING_PORT:-22}";SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "$K" != 1 ];then cp /tmp/cache-before-class.php elmercadodeorigen-child/inc/home-cache.php;sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child';install -m0644 /tmp/cache-server-before-class-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\";php_bin=\$(command -v php||true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css";fi
          [ -f runtime/home-mobile-sidebar-class-cls-20260820.txt ]||echo failed>runtime/home-mobile-sidebar-class-cls-20260820.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add elmercadodeorigen-child/inc/home-cache.php runtime/home-mobile-sidebar-class-cls-20260820.txt;git commit -m 'Measure pre-ID sidebar class CLS guard' || exit 0;git pull --rebase origin main;git push origin HEAD:main

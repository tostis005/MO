name: Diagnose bellota English sitemap production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-bellota-english-sitemap-20260829.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect WordPress sitemap runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true)
          php=$(command -v php || true)
          [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          prod=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in
              https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
            esac
          done
          : "${prod:?production path missing}"
          "$php" -d memory_limit=768M "$wp" eval '
            $id=13580;
            $p=get_post($id);
            echo "post=".($p?($p->post_status."|".$p->post_type."|".$p->post_name):"missing").PHP_EOL;
            foreach(array("_en_US_post_name","_en_US_published","_en_US_post_title") as $k){ echo $k."=".get_post_meta($id,$k,true).PHP_EOL; }
            if(function_exists("mdoer_sitemap")){
              $urls=mdoer_sitemap();
              $needle=home_url("/en/100-iberico-acorn-fed-ham/");
              echo "legacy_runtime_contains=".(in_array($needle,$urls,true)?"yes":"no").PHP_EOL;
            }
          ' --path="$prod" --allow-root
          REMOTE

      - name: Verify active sitemap architecture
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 EMDO sitemap diagnostic'
          curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -D /tmp/legacy-h.txt -o /tmp/legacy.xml "https://www.elmercadodeorigen.com/english-sitemap.xml?diag=${GITHUB_RUN_ID}"
          echo '=== LEGACY REDIRECT ==='
          grep -Ei 'HTTP/|location:|x-redirect-by:' /tmp/legacy-h.txt || true
          curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o /tmp/index.xml "https://www.elmercadodeorigen.com/sitemap_index.xml?diag=${GITHUB_RUN_ID}"
          echo '=== ACTIVE INDEX ==='
          grep -F 'mdo-sitemap-pages.xml' /tmp/index.xml
          curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o /tmp/pages.xml "https://www.elmercadodeorigen.com/mdo-sitemap-pages.xml?diag=${GITHUB_RUN_ID}"
          echo '=== LANDING IN ACTIVE PAGE SITEMAP ==='
          grep -F 'https://www.elmercadodeorigen.com/jamon-bellota-100-iberico/' /tmp/pages.xml
          grep -F 'https://www.elmercadodeorigen.com/en/100-iberico-acorn-fed-ham/' /tmp/pages.xml
          echo '=== PAGE SITEMAP URL COUNT ==='
          grep -o '<url>' /tmp/pages.xml | wc -l

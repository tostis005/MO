name: CPU diagnostic one-shot

on:
  push:
    branches: [diag-cpu-20260812]
    paths:
      - '.github/workflows/cpu-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Identify hot PHP workload read-only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set +e
          raw="${1%/}"
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1)"
            [ -n "$cfg" ] && dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          vhost_root="$(dirname "$prod_path")"
          php_bin="$(command -v php)"
          [ -x "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp)"

          echo '===== LOAD / HOT WORKERS ====='
          date -Is; uptime
          ps -eo pid,ppid,user,stat,lstart,etime,time,%cpu,%mem,comm,args --sort=-%cpu | grep -E 'PID|php-fpm: pool elmercadodeorigen.com|mysqld' | head -n 40

          echo '===== HOT PHP /PROC DETAILS ====='
          pids="$(pgrep -f 'php-fpm: pool elmercadodeorigen.com' | head -n 20)"
          for pid in $pids; do
            echo "--- PID $pid ---"
            ps -p "$pid" -o pid,ppid,user,stat,lstart,etime,time,%cpu,%mem,wchan:32,args
            printf 'cwd='; readlink "/proc/$pid/cwd" 2>&1
            printf 'exe='; readlink "/proc/$pid/exe" 2>&1
            printf 'cmd='; tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null; echo
            printf 'wchan='; cat "/proc/$pid/wchan" 2>/dev/null; echo
            echo 'fd targets:'
            for fd in /proc/$pid/fd/*; do readlink "$fd" 2>/dev/null; done | sort | uniq -c | sort -nr | head -n 30
          done

          echo '===== PHP-FPM DOMAIN CONFIG ====='
          grep -RniE 'elmercadodeorigen\.com|pm\.|request_slowlog_timeout|slowlog|access\.log|access\.format|status_path|catch_workers_output' /opt/plesk/php/8.2/etc/php-fpm.d /var/www/vhosts/system 2>/dev/null | grep -E 'elmercadodeorigen|pm\.|slowlog|access\.|status_path|catch_workers' | head -n 250

          echo '===== EMDO RUNS PROD ====='
          prefix="$("$php_bin" "$wp_bin" db prefix --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null | tail -n1)"
          "$php_bin" "$wp_bin" db query "SELECT id,supplier_id,trigger_type,status,started_at,finished_at,products_found,products_new,products_updated,products_excluded,errors_count,message FROM ${prefix}mdo_sync_runs WHERE started_at >= '2026-08-12 18:30:00' ORDER BY id DESC LIMIT 100" --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null
          echo '-- EMDO event counts since 18:30 --'
          "$php_bin" "$wp_bin" db query "SELECT run_id,supplier_id,event_type,severity,COUNT(*) AS n,MIN(created_at) AS first_at,MAX(created_at) AS last_at FROM ${prefix}mdo_sync_events WHERE created_at >= '2026-08-12 18:30:00' GROUP BY run_id,supplier_id,event_type,severity ORDER BY last_at DESC LIMIT 150" --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null

          echo '===== ACTION SCHEDULER TABLE DISCOVERY PROD ====='
          "$php_bin" "$wp_bin" db query "SHOW TABLES LIKE '%action%'" --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null
          "$php_bin" "$wp_bin" db query "SHOW TABLES LIKE '%schedul%'" --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null
          for table in "${prefix}actionscheduler_actions" "${prefix}actionscheduler_logs"; do
            exists="$("$php_bin" "$wp_bin" db query "SHOW TABLES LIKE '$table'" --skip-column-names --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null | tail -n1)"
            if [ "$exists" = "$table" ]; then
              echo "-- $table --"
              "$php_bin" "$wp_bin" db query "SELECT status,hook,COUNT(*) total,MIN(scheduled_date_gmt) oldest,MAX(scheduled_date_gmt) newest FROM ${prefix}actionscheduler_actions GROUP BY status,hook ORDER BY total DESC LIMIT 100" --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null
              "$php_bin" "$wp_bin" db query "SELECT action_id,hook,status,scheduled_date_gmt,attempts,last_attempt_gmt FROM ${prefix}actionscheduler_actions WHERE status IN ('pending','in-progress') ORDER BY scheduled_date_gmt ASC LIMIT 150" --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null
              break
            fi
          done

          echo '===== VHOST LOG FILES ====='
          find -L "$vhost_root/logs" /var/www/vhosts/system/elmercadodeorigen.com/logs -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %12s %p\n' 2>/dev/null | sort | tail -n 100

          echo '===== ACCESS LOG ANALYSIS ====='
          logs="$(find -L "$vhost_root/logs" /var/www/vhosts/system/elmercadodeorigen.com/logs -maxdepth 2 -type f \( -name '*access*log*' -o -name '*proxy*access*' \) 2>/dev/null | sort -u)"
          for log in $logs; do
            [ -s "$log" ] || continue
            echo "--- LOG $log size=$(stat -c %s "$log" 2>/dev/null) ---"
            tail -n 5 "$log"
            echo 'top IP last 5000:'
            tail -n 5000 "$log" | awk '{print $1}' | sort | uniq -c | sort -nr | head -n 15
            echo 'top request lines last 5000:'
            tail -n 5000 "$log" | awk -F'"' '{print $2}' | sort | uniq -c | sort -nr | head -n 25
            echo '19:30-20:00 local-like timestamps:'
            grep -E '12/Aug/2026:19:(3[0-9]|4[0-9]|5[0-9]):' "$log" | tail -n 80
            echo '17:30-18:00 UTC-like timestamps:'
            grep -E '12/Aug/2026:17:(3[0-9]|4[0-9]|5[0-9]):' "$log" | tail -n 80
          done

          echo '===== PHP-FPM / WEB ERROR LOG TAILS ====='
          for log in $(find -L "$vhost_root/logs" /var/www/vhosts/system/elmercadodeorigen.com/logs -maxdepth 2 -type f \( -name '*error*log*' -o -name '*php*log*' \) 2>/dev/null | sort -u); do
            [ -s "$log" ] || continue
            echo "--- $log ---"
            tail -n 80 "$log"
          done
          REMOTE

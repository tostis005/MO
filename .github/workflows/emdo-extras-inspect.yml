name: Validate EMDO automatic extras

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-extras-inspect.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Scrape import and verify target
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=768M $wp_bin --path=$wp_path --allow-root"
          script="$(mktemp /tmp/emdo-extras-e2e.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;
          $wc_id = 11235;
          $source_id = (int) get_post_meta( $wc_id, '_emdo_source_product_id', true );
          $source_table = MDO_Database::table( 'source_products' );
          $row = $wpdb->get_row( $wpdb->prepare( "SELECT * FROM {$source_table} WHERE id=%d", $source_id ), ARRAY_A );
          if ( ! $row ) { throw new RuntimeException('source row missing'); }
          $supplier = MDO_Supplier_Repository::find( (int) $row['supplier_id'] );
          if ( ! $supplier ) { throw new RuntimeException('supplier missing'); }

          $product = MDO_Connector_Iberico_Family::scrape_product( (string) $row['source_url'], $supplier );
          $product = MDO_Text::normalize_product( $product );
          echo 'EXTRA_GROUPS=' . wp_json_encode( $product['extra_groups'] ?? array(), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES ) . "\n";
          echo 'VARIATION_COUNT=' . (int) ( $product['variation_count'] ?? 0 ) . "\n";
          if ( empty( $product['extra_groups'][0]['options'] ) || count( $product['extra_groups'][0]['options'] ) !== 4 ) {
              throw new RuntimeException('expected four preparation extras');
          }
          if ( (int) ( $product['variation_count'] ?? 0 ) < 2 ) {
              throw new RuntimeException('weight variations disappeared');
          }

          $result = MDO_Connector_Iberico_Family::upsert_product( (int) $row['supplier_id'], $product );
          echo "UPSERT_RESULT={$result}\n";
          MDO_Woo_Importer::sync_if_active( (int) $row['supplier_id'], (string) $product['source_url'] );

          $block_id = (int) get_post_meta( $wc_id, '_emdo_yith_wapo_block_id', true );
          $sync_error = (string) get_post_meta( $wc_id, '_emdo_yith_wapo_sync_error', true );
          echo "BLOCK_ID={$block_id}\nSYNC_ERROR={$sync_error}\n";
          if ( $block_id <= 0 || '' !== $sync_error ) {
              throw new RuntimeException('YITH sync failed: ' . $sync_error);
          }

          $blocks = $wpdb->prefix . 'yith_wapo_blocks';
          $addons = $wpdb->prefix . 'yith_wapo_addons';
          $assoc  = $wpdb->prefix . 'yith_wapo_blocks_assoc';
          $block_name = (string) $wpdb->get_var( $wpdb->prepare( "SELECT name FROM {$blocks} WHERE id=%d", $block_id ) );
          $addon_rows = $wpdb->get_results( $wpdb->prepare( "SELECT id,settings,options FROM {$addons} WHERE block_id=%d ORDER BY priority,id", $block_id ), ARRAY_A );
          echo "BLOCK_NAME={$block_name}\nADDON_COUNT=" . count($addon_rows) . "\n";
          if ( 1 !== count( $addon_rows ) ) { throw new RuntimeException('expected one managed addon'); }
          $settings = maybe_unserialize( $addon_rows[0]['settings'] );
          $options = maybe_unserialize( $addon_rows[0]['options'] );
          echo 'ADDON_TITLE=' . (string) ( $settings['title'] ?? '' ) . "\n";
          echo 'ADDON_LABELS=' . implode( ' | ', (array) ( $options['label'] ?? array() ) ) . "\n";
          echo 'ADDON_PRICES=' . implode( ' | ', (array) ( $options['price'] ?? array() ) ) . "\n";
          if ( 'PREPARACIÓN' !== (string) ( $settings['title'] ?? '' ) ) { throw new RuntimeException('wrong addon title'); }
          if ( (array) ( $options['label'] ?? array() ) !== array('Pieza entera','Deshuesado','Cortado a Cuchillo','Cortado a máquina') ) { throw new RuntimeException('wrong addon labels'); }

          $variation_ids = get_posts(array('post_type'=>'product_variation','post_parent'=>$wc_id,'post_status'=>'publish','fields'=>'ids','posts_per_page'=>-1,'orderby'=>'ID','order'=>'ASC'));
          $expected_ids = array_merge(array($wc_id), array_map('intval',$variation_ids));
          $associated = array_map('intval', $wpdb->get_col($wpdb->prepare("SELECT object FROM {$assoc} WHERE rule_id=%d ORDER BY CAST(object AS UNSIGNED)",$block_id)));
          sort($expected_ids); sort($associated);
          echo 'EXPECTED_ASSOC=' . implode(',',$expected_ids) . "\nASSOCIATED=' . implode(',',$associated) . "\n";
          if ( $expected_ids !== $associated ) { throw new RuntimeException('association mismatch'); }
          foreach ( $variation_ids as $variation_id ) {
              if ( ! yith_wapo_product_has_blocks( $wc_id, (int) $variation_id ) ) {
                  throw new RuntimeException('YITH cannot resolve block for variation ' . $variation_id);
              }
          }
          echo "YITH_VARIATIONS_OK=yes\n";
          PHP
          $WP eval-file "$script"
          url="$($WP post url 11235 2>/dev/null)"
          html="$(curl -LfsS --max-time 30 -H 'Cache-Control: no-cache' "$url?emdo_extras_e2e=$(date +%s)")"
          printf '%s' "$html" | grep -Fq 'PREPARACIÓN'
          printf '%s' "$html" | grep -Fq 'Cortado a Cuchillo'
          printf '%s' "$html" | grep -Fq 'Cortado a máquina'
          echo 'FRONTEND_EXTRAS_OK=yes'
          REMOTE

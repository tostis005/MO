name: Inspect EMDO source extras

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-extras-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Inspect preparation markup
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          script="$(mktemp /tmp/emdo-extras.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;
          $source_id = (int) get_post_meta( 11235, '_emdo_source_product_id', true );
          $table = MDO_Database::table( 'source_products' );
          $row = $wpdb->get_row( $wpdb->prepare( "SELECT * FROM {$table} WHERE id=%d", $source_id ), ARRAY_A );
          if ( ! $row ) { throw new RuntimeException('source row missing'); }
          $response = wp_safe_remote_get( (string) $row['source_url'], array( 'timeout'=>20, 'redirection'=>4, 'user-agent'=>'EMDO extras inspect' ) );
          if ( is_wp_error($response) ) { throw new RuntimeException($response->get_error_message()); }
          $html = (string) wp_remote_retrieve_body($response);
          echo "HTML_BYTES=".strlen($html)."\n";
          $needles = array('Cortado a cuchillo','Cortado a máquina','Deshuesado','Pieza entera','prepar','lonche');
          foreach ($needles as $needle) {
              $pos = mb_stripos($html,$needle);
              echo "NEEDLE {$needle} POS=".($pos===false?'none':(string)$pos)."\n";
              if ($pos!==false) {
                  echo "SNIPPET=".trim(preg_replace('/\\s+/u',' ',strip_tags(mb_substr($html,max(0,$pos-900),2200))))."\n";
              }
          }
          $dom = new DOMDocument(); $prev=libxml_use_internal_errors(true); $dom->loadHTML('<?xml encoding="utf-8" ?>'.$html, LIBXML_NOWARNING|LIBXML_NOERROR|LIBXML_NONET); libxml_clear_errors(); libxml_use_internal_errors($prev); $xp=new DOMXPath($dom);
          foreach ($xp->query('//*[contains(translate(normalize-space(.),"ABCDEFGHIJKLMNOPQRSTUVWXYZ","abcdefghijklmnopqrstuvwxyz"),"cortado a cuchillo")]') ?: array() as $node) {
              if (!$node instanceof DOMElement) continue;
              echo "NODE tag={$node->tagName} class={$node->getAttribute('class')} id={$node->getAttribute('id')} text=".trim(preg_replace('/\\s+/u',' ',(string)$node->textContent))."\n";
              $attrs=[]; foreach($node->attributes ?: array() as $attr){$attrs[$attr->name]=$attr->value;} echo "ATTRS=".wp_json_encode($attrs,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          PHP
          $WP eval-file "$script" 2>/dev/null
          REMOTE

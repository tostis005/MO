name: Enforce and verify EMDO nightly schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-extras-inspect.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Enforce and verify supplier schedule
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          script="$(mktemp /tmp/emdo-nightly-check.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          global $wpdb;

          // Garantiza la migración del evento antiguo usando Action Scheduler ya inicializado.
          MDO_Nightly_Scheduler::ensure_nightly_dispatcher();

          $suppliers = MDO_Supplier_Repository::active();
          usort($suppliers, static fn($a,$b)=>(int)$a['id'] <=> (int)$b['id']);
          $daily = array();
          foreach ($suppliers as $supplier) {
              echo 'SUPPLIER id='.(int)$supplier['id'].' name='.(string)$supplier['name'].' connector='.(string)$supplier['connector'].' frequency='.(string)$supplier['sync_frequency']."\n";
              if ('daily' === (string)$supplier['sync_frequency'] && 'none' !== (string)$supplier['connector']) {
                  $daily[] = $supplier;
              }
          }
          echo 'DAILY_COUNT='.count($daily)."\n";
          echo 'WP_TIMEZONE='.wp_timezone_string()."\n";
          echo 'WP_NOW='.current_datetime()->format('Y-m-d H:i:s P')."\n";

          $next = 0;
          if ( function_exists('as_next_scheduled_action') ) {
              $next = (int) as_next_scheduled_action('mdo_supplier_sync_dispatch', array(), 'mdo-supplier-sync');
          }
          if (!$next) { $next = (int) wp_next_scheduled('mdo_supplier_sync_dispatch'); }
          echo 'NEXT_DISPATCH_TS='.$next."\n";
          echo 'NEXT_DISPATCH_LOCAL='.($next ? wp_date('Y-m-d H:i:s P',$next) : 'none')."\n";
          echo 'SCHEDULE_VERSION='.(string)get_option('mdo_nightly_schedule_version','')."\n";

          foreach ($daily as $slot => $supplier) {
              $planned = $next + ($slot * 30 * MINUTE_IN_SECONDS);
              echo 'PLANNED supplier_id='.(int)$supplier['id'].' name='.(string)$supplier['name'].' local='.wp_date('Y-m-d H:i:s P',$planned)."\n";
          }

          if (3 !== count($daily)) { throw new RuntimeException('expected three daily suppliers'); }
          if (!$next) { throw new RuntimeException('nightly dispatcher not scheduled'); }
          if ('03:00' !== wp_date('H:i',$next)) { throw new RuntimeException('next dispatcher is not at 03:00 local time'); }
          if ('4' !== (string)get_option('mdo_nightly_schedule_version','')) { throw new RuntimeException('nightly schedule migration version is not 4'); }
          PHP
          $WP eval-file "$script" 2>/dev/null
          REMOTE

name: Deploy store shipping tab to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-store-shipping-tab-production-20260819.yml'
      - 'mu-plugins/mdo-product-shipping-tab-20260819.php'
      - 'mu-plugins/mdo-store-shipping/mdo-store-shipping.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate shipping MU-plugin locally
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-product-shipping-tab-20260819.php
          php -l mu-plugins/mdo-store-shipping/mdo-store-shipping.php
          grep -Fq "wcfmmp_store_tabs" mu-plugins/mdo-product-shipping-tab-20260819.php
          grep -Fq "mdo_shipping" mu-plugins/mdo-product-shipping-tab-20260819.php
          grep -Fq "mdo-store-shipping" mu-plugins/mdo-store-shipping/mdo-store-shipping.php

      - name: Install SSH helper
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Deploy MU-plugin to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_MAIN="/tmp/mdo-store-shipping-${GITHUB_RUN_ID}.php"
          REMOTE_TEMPLATE="/tmp/mdo-store-shipping-template-${GITHUB_RUN_ID}.php"

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-product-shipping-tab-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE_MAIN"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-store-shipping/mdo-store-shipping.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TEMPLATE"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; \
            php_bin=\$(command -v php || true); \
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \
            \"\$php_bin\" -l '$REMOTE_MAIN'; \
            \"\$php_bin\" -l '$REMOTE_TEMPLATE'; \
            target='$PROD_PATH/wp-content/mu-plugins'; \
            mkdir -p \"\$target/mdo-store-shipping\"; \
            if [ -f \"\$target/mdo-product-shipping-tab-20260819.php\" ]; then cp -p \"\$target/mdo-product-shipping-tab-20260819.php\" \"\$target/mdo-product-shipping-tab-20260819.php.bak-$GITHUB_RUN_ID\"; fi; \
            if [ -f \"\$target/mdo-store-shipping/mdo-store-shipping.php\" ]; then cp -p \"\$target/mdo-store-shipping/mdo-store-shipping.php\" \"\$target/mdo-store-shipping/mdo-store-shipping.php.bak-$GITHUB_RUN_ID\"; fi; \
            mv '$REMOTE_MAIN' \"\$target/mdo-product-shipping-tab-20260819.php\"; \
            mv '$REMOTE_TEMPLATE' \"\$target/mdo-store-shipping/mdo-store-shipping.php\"; \
            chmod 0644 \"\$target/mdo-product-shipping-tab-20260819.php\" \"\$target/mdo-store-shipping/mdo-store-shipping.php\"; \
            \"\$php_bin\" -l \"\$target/mdo-product-shipping-tab-20260819.php\"; \
            \"\$php_bin\" -l \"\$target/mdo-store-shipping/mdo-store-shipping.php\""

      - name: Flush WordPress caches
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; \"\$php_bin\" \"\$wp_bin\" transient delete --all --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify public store shipping tab
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.elmercadodeorigen.com/tienda/1957/"
          BUST="emdo_shipping_verify=${GITHUB_RUN_ID}"

          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO Shipping verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/store.html "${BASE}?${BUST}"
          grep -Fq 'mdo_shipping=1' /tmp/store.html
          grep -Fq '>Envíos<' /tmp/store.html

          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO Shipping verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/shipping.html "${BASE}?mdo_shipping=1&${BUST}"
          grep -Fq 'mdo-store-shipping' /tmp/shipping.html
          grep -Fq 'El coste definitivo se confirma en el carrito' /tmp/shipping.html

          echo 'STORE_SHIPPING_PUBLIC_OK'

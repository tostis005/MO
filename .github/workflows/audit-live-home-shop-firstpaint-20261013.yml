name: Audit live Home Shop first paint 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-live-home-shop-firstpaint-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1 >/dev/null
      - name: Inspect mobile baseline and experiment with only Home CSS
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fLsS --max-time 45 https://www.elmercadodeorigen.com/tienda/ -o /tmp/emdo-live-shop.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/emdo-live-shop.html').read_text(errors='replace')
          print('SHOP_HTML_BYTES',len(html.encode()))
          print('SHOP_SSR_BANNER',bool(re.search(r'<header[^>]*emo-shop-title-block[^>]*>\s*<aside[^>]*emdo-navidad-promo',html,re.I)))
          print('SHOP_SSR_FILTER',bool(re.search(r'<button[^>]*data-emo-early-filter=["\']1',html,re.I)))
          print('SHOP_PRODUCT_MARKUP',bool(re.search(r'<ul[^>]*class=["\'][^"\']*products',html,re.I)))
          PY
          cat >/tmp/audit.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const sleep=n=>new Promise(r=>setTimeout(r,n));
          const CSS='<style id="emo-mobile-firstpaint-probe">@media(max-width:767px){html body.home.elmercado-child-theme .emo-home .emo-hero .emo-hero__visual.emo-hero__visual--vendors{grid-template-columns:repeat(2,minmax(0,1fr))!important;column-gap:10px!important;row-gap:10px!important;grid-auto-rows:137px!important;height:430px!important;min-height:430px!important;max-height:430px!important}html body.home.elmercado-child-theme .emo-home .emo-hero .emo-hero__visual.emo-hero__visual--vendors .emo-hero-card{height:137px!important;min-height:137px!important;max-height:137px!important}html body.home.elmercado-child-theme .emo-hero-card--5,html body.home.elmercado-child-theme .emo-hero-card--6{display:none!important}}</style>';
          (async()=>{
            const b=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [what,url,override] of [['home-base','https://www.elmercadodeorigen.com/',false],['home-css-candidate','https://www.elmercadodeorigen.com/',true],['shop-live','https://www.elmercadodeorigen.com/tienda/',false]]){
              const p=await b.newPage({viewport:{width:390,height:844}});
              const c=await p.context().newCDPSession(p);await c.send('Network.enable');await c.send('Network.emulateNetworkConditions',{offline:false,latency:120,downloadThroughput:500000,uploadThroughput:125000,connectionType:'cellular4g'});
              await p.addInitScript(()=>{window.__audit={cls:0,shifts:[],early:[]};new PerformanceObserver(l=>{for(const e of l.getEntries()){if(e.hadRecentInput)continue;window.__audit.cls+=e.value;window.__audit.shifts.push({ms:Math.round(e.startTime),v:+e.value.toFixed(4),src:e.sources?.slice(0,3).map(x=>x.node?.className?.toString().slice(0,90))});}}).observe({type:'layout-shift',buffered:true});
              let last='';setInterval(()=>{const e=document.querySelector('.emo-hero__visual');if(!e)return;const grid=getComputedStyle(e);const card=document.querySelector('.emo-hero-card--1');const c=getComputedStyle(card);const x={at:Math.round(performance.now()),cols:grid.gridTemplateColumns,gap:grid.gap,h:Math.round(e.getBoundingClientRect().height),cardH:Math.round(card.getBoundingClientRect().height),cardDisplay:c.display};if(JSON.stringify({...x,at:0})!==last){last=JSON.stringify({...x,at:0});window.__audit.early.push(x);}},25);
              });
              if(override)await p.route(url,async route=>{const o=await route.fetch({timeout:60000});let h=await o.text();h=h.replace(/<head\b[^>]*>/i,m=>m+CSS);await route.fulfill({response:o,body:h,headers:{...o.headers(),'content-type':'text/html;charset=UTF-8'}})});
              const res=await p.goto(url,{waitUntil:'domcontentloaded',timeout:65000});await sleep(1700);
              const m=await p.evaluate(()=>{const a=window.__audit;const box=s=>{let e=document.querySelector(s);if(!e)return null;let r=e.getBoundingClientRect();return{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};return{cls:+a.cls.toFixed(4),shifts:a.shifts,early:a.early.slice(0,8),hero:box('.emo-hero'),visual:box('.emo-hero__visual'),card1:box('.emo-hero-card--1'),card2:box('.emo-hero-card--2'),banner:box('.emdo-navidad-promo'),toolbar:box('.woostify-sorting'),products:box('ul.products'),filter:box('.emo-mobile-filter-toggle'),ssrFilter:!!document.querySelector('[data-emo-early-filter="1"]'),bannerCount:document.querySelectorAll('aside.emdo-navidad-promo--shop').length}});
              console.log('LIVE_FIRSTPAINT '+what+' HTTP='+res.status()+' '+JSON.stringify(m));
              if(what==='shop-live'){const t=p.locator('.emo-mobile-filter-toggle');await t.click();console.log('SHOP_FILTER_WORKS expanded='+(await t.getAttribute('aria-expanded'))+' panel='+(await p.locator('.emo-mobile-filter-shell').first().isVisible()));}
              await p.close();
            }await b.close();
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node /tmp/audit.cjs

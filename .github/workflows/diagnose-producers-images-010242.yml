name: Diagnose producer listing images 0.10.242

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-producers-images-010242.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production producer cards
        shell: bash
        env:
          BASE_URL: https://www.elmercadodeorigen.com
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const inspect=async(browser,width)=>{
            const page=await browser.newPage();
            await page.setCacheEnabled(false);
            await page.setViewport({width,height:1200,deviceScaleFactor:1});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'});
            await page.goto(`${process.env.BASE_URL}/productores/?diag242b=${Date.now()}-${width}`,{waitUntil:'networkidle2',timeout:60000});
            await sleep(700);
            const out=await page.evaluate(()=>{
              const rect=n=>{const r=n.getBoundingClientRect();return {w:r.width,h:r.height,x:r.x,y:r.y}};
              const css=n=>{const s=getComputedStyle(n);return {display:s.display,position:s.position,width:s.width,height:s.height,minHeight:s.minHeight,padding:s.padding,margin:s.margin,aspectRatio:s.aspectRatio,overflow:s.overflow,backgroundImage:s.backgroundImage,backgroundSize:s.backgroundSize,backgroundPosition:s.backgroundPosition,backgroundRepeat:s.backgroundRepeat}};
              const card=document.querySelector('#wcfmmp-stores-wrap li.wcfmmp-single-store');
              if(!card)return {error:'no card'};
              const info=card.querySelector('.store-info');
              const content=card.querySelector('.store-content');
              const wrapper=card.querySelector('.store-wrapper');
              const kids=info?[...info.children].map(n=>({tag:n.tagName,className:n.className,text:(n.textContent||'').trim().slice(0,180),rect:rect(n),css:css(n),html:n.outerHTML.slice(0,1400)})):[];
              const rules=[];
              for(const sheet of [...document.styleSheets]){
                let rs;try{rs=sheet.cssRules}catch(e){continue}
                for(const rule of [...rs]){
                  const text=rule.cssText||'';
                  if(/store-info|wcfmmp-single-store|store-content/.test(text) && /(height|aspect-ratio|background-size|padding|position)/.test(text)) rules.push(text.slice(0,1600));
                }
              }
              return {body:document.body.className,card:{rect:rect(card),css:css(card)},wrapper:wrapper?{rect:rect(wrapper),css:css(wrapper),html:wrapper.outerHTML.slice(0,4200)}:null,content:content?{rect:rect(content),css:css(content)}:null,info:info?{rect:rect(info),css:css(info),style:info.getAttribute('style')||'',kids}:null,rules:rules.slice(-30)};
            });
            console.log('PRODUCER_STRUCTURE',width,JSON.stringify(out));
            await page.close();
          };
          (async()=>{const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});await inspect(browser,390);await inspect(browser,1440);await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE

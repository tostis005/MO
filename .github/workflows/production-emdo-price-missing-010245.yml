name: Production EMDO pricing and source availability 0.10.245

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-emdo-price-missing-010245.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-sync-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch durable plugin behavior
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/patch-emdo-price-missing-010245.py
          php -l mdo-supplier-sync/includes/class-mdo-pricing.php
          php -l mdo-supplier-sync/includes/class-mdo-woo-importer.php
          php -l mdo-supplier-sync/includes/class-mdo-scheduler.php
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          grep -Fq 'Version: 1.0.13' mdo-supplier-sync/mdo-supplier-sync.php
          grep -Fq 'mark_source_unavailable' mdo-supplier-sync/includes/class-mdo-woo-importer.php
          grep -Fq 'reconcile_missing_products' mdo-supplier-sync/includes/class-mdo-scheduler.php

      - name: Commit durable source fix
        run: |
          set -Eeuo pipefail
          git config user.name 'El Mercado de Origen Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add mdo-supplier-sync/includes/class-mdo-pricing.php mdo-supplier-sync/includes/class-mdo-woo-importer.php mdo-supplier-sync/includes/class-mdo-scheduler.php mdo-supplier-sync/mdo-supplier-sync.php
          git commit -m 'Track source prices and retire missing products'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Deploy, resync Tolecarnes and verify
        run: bash .github/scripts/deploy-emdo-price-missing-010245.sh

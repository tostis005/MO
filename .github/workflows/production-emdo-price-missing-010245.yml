name: Production EMDO pricing and source availability 0.10.245

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-emdo-price-missing-010245.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-sync-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch durable plugin behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Pricing: preserve original/current sale information without reintroducing
          # related-product false positives on Tolecarnes.
          pricing = Path('mdo-supplier-sync/includes/class-mdo-pricing.php')
          text = pricing.read_text()
          start_marker = "\t\t/*\n\t\t * Tolecarnes incluye tarjetas de productos relacionados"
          end_marker = "\n\t\t// WooCommerce: <del>precio original</del> <ins>precio actual</ins>."
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Pricing Tolecarnes block not found')
          replacement = r'''\t\t/*
\t\t * Tolecarnes incluye precios de productos relacionados en la misma ficha.
\t\t * Por eso no recorremos <del>/<ins> globales: sólo miramos el precio del
\t\t * summary o, si el tema no usa esa clase, el primer bloque de precio
\t\t * posterior al H1 que no pertenezca a relacionados/upsells/cross-sells.
\t\t * Así conservamos ofertas reales (precio original + actual) sin volver a
\t\t * atribuir al producto principal descuentos de otras tarjetas.
\t\t */
\t\t$host = strtolower( (string) wp_parse_url( $url, PHP_URL_HOST ) );
\t\tif ( 'tolecarnes.com' === $host || str_ends_with( $host, '.tolecarnes.com' ) ) {
\t\t\t$queries = array(
\t\t\t\t"//*[contains(concat(' ', normalize-space(@class), ' '), ' summary ')]//p[contains(concat(' ', normalize-space(@class), ' '), ' price ')]",
\t\t\t\t"//*[contains(concat(' ', normalize-space(@class), ' '), ' summary ')]//*[contains(concat(' ', normalize-space(@class), ' '), ' price ')]",
\t\t\t\t"(//h1[1]/following::*[contains(concat(' ', normalize-space(@class), ' '), ' price ') and not(ancestor::*[contains(concat(' ', normalize-space(@class), ' '), ' related ') or contains(concat(' ', normalize-space(@class), ' '), ' upsells ') or contains(concat(' ', normalize-space(@class), ' '), ' up-sells ') or contains(concat(' ', normalize-space(@class), ' '), ' cross-sells ')])])[1]",
\t\t\t);
\t\t\t$fallback_current = null;
\t\t\tforeach ( $queries as $query ) {
\t\t\t\t$price_nodes = $xpath->query( $query );
\t\t\t\tif ( ! $price_nodes || ! $price_nodes->length ) {
\t\t\t\t\tcontinue;
\t\t\t\t}
\t\t\t\t$node = $price_nodes->item( 0 );
\t\t\t\t$del  = $xpath->query( './/del', $node );
\t\t\t\t$ins  = $xpath->query( './/ins', $node );
\t\t\t\tif ( $del && $del->length && $ins && $ins->length ) {
\t\t\t\t\t$regular = self::first_price_in_text( (string) $del->item( 0 )->textContent );
\t\t\t\t\t$current = self::first_price_in_text( (string) $ins->item( 0 )->textContent );
\t\t\t\t\tif ( null !== $regular && null !== $current && $current < $regular ) {
\t\t\t\t\t\treturn array( 'current' => $current, 'regular' => $regular );
\t\t\t\t\t}
\t\t\t\t}

\t\t\t\t$node_text = trim( preg_replace( '/\\s+/u', ' ', (string) $node->textContent ) );
\t\t\t\tif ( preg_match( '/precio original era:\\s*([0-9.,]+)\\s*€.*?([0-9.,]+)\\s*€\\s*el precio actual es/iu', $node_text, $match ) ) {
\t\t\t\t\t$regular = self::parse_price( $match[1] );
\t\t\t\t\t$current = self::parse_price( $match[2] );
\t\t\t\t\tif ( null !== $regular && null !== $current && $current < $regular ) {
\t\t\t\t\t\treturn array( 'current' => $current, 'regular' => $regular );
\t\t\t\t\t}
\t\t\t\t}

\t\t\t\t$current = self::first_price_in_text( $node_text );
\t\t\t\tif ( null !== $current && null === $fallback_current ) {
\t\t\t\t\t$fallback_current = $current;
\t\t\t\t}
\t\t\t}
\t\t\treturn array( 'current' => $fallback_current, 'regular' => $fallback_current );
\t\t}
'''
          # Turn escaped tabs from the raw Python literal into actual tabs/newlines.
          replacement = replacement.replace('\\t', '\t')
          text = text[:start] + replacement + text[end:]

          # Allow a safe detector to upgrade regular=current into a true original
          # price whenever the independently detected current price matches.
          old = """\t\t\t\tif (\n\t\t\t\t\tnull === $regular\n\t\t\t\t\t&& null !== $current\n\t\t\t\t\t&& null !== $detected_current\n\t\t\t\t\t&& null !== $detected_regular\n\t\t\t\t\t&& abs( $current - $detected_current ) < 0.005\n\t\t\t\t\t&& $detected_regular > $current\n\t\t\t\t) {\n\t\t\t\t\t$regular = $detected_regular;\n\t\t\t\t}\n"""
          new = """\t\t\t\tif (\n\t\t\t\t\tnull !== $current\n\t\t\t\t\t&& null !== $detected_current\n\t\t\t\t\t&& null !== $detected_regular\n\t\t\t\t\t&& abs( $current - $detected_current ) < 0.005\n\t\t\t\t\t&& $detected_regular > $current\n\t\t\t\t\t&& ( null === $regular || $regular <= $current + 0.005 )\n\t\t\t\t) {\n\t\t\t\t\t$regular = $detected_regular;\n\t\t\t\t\t$sale    = $current;\n\t\t\t\t}\n"""
          if old not in text:
              raise SystemExit('Pricing enrichment target not found')
          pricing.write_text(text.replace(old, new, 1))

          # 2) Woo importer: general source-unavailable state + automatic restoration.
          importer = Path('mdo-supplier-sync/includes/class-mdo-woo-importer.php')
          text = importer.read_text()
          marker = "\n\tpublic static function exclude_source_product( int $source_product_id ): void {"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Importer insertion point not found')
          methods = r'''
\n\t/**
\t * Retira de la venta un producto que ya no aparece en el catálogo de origen.
\t * Conservamos la relación EMDO para poder restaurarlo automáticamente si
\t * vuelve a aparecer en una sincronización posterior.
\t */
\tpublic static function mark_source_unavailable( int $source_product_id ): bool {
\t\tglobal $wpdb;
\t\t$table = MDO_Database::table( 'source_products' );
\t\t$row   = $wpdb->get_row( $wpdb->prepare( "SELECT id,status,wc_product_id,title FROM {$table} WHERE id = %d", $source_product_id ), ARRAY_A );
\t\tif ( ! $row || in_array( (string) $row['status'], array( 'excluded', 'unavailable' ), true ) ) {
\t\t\treturn false;
\t\t}

\t\t$wpdb->update(
\t\t\t$table,
\t\t\tarray(
\t\t\t\t'status'              => 'unavailable',
\t\t\t\t'source_stock_status' => 'outofstock',
\t\t\t\t'last_error'          => 'No encontrado en el catálogo de origen durante la última sincronización completa.',
\t\t\t),
\t\t\tarray( 'id' => $source_product_id )
\t\t);

\t\t$product_id = ! empty( $row['wc_product_id'] ) ? (int) $row['wc_product_id'] : 0;
\t\tif ( $product_id ) {
\t\t\t$product = wc_get_product( $product_id );
\t\t\tif ( $product ) {
\t\t\t\t$product->set_stock_status( 'outofstock' );
\t\t\t\t$product->set_catalog_visibility( 'hidden' );
\t\t\t\t$product->set_status( 'draft' );
\t\t\t\t$product->save();
\t\t\t\tupdate_post_meta( $product_id, '_emdo_source_unavailable', '1' );
\t\t\t}
\t\t}
\t\treturn true;
\t}

\tpublic static function mark_source_url_unavailable( int $supplier_id, string $source_url ): bool {
\t\tglobal $wpdb;
\t\t$table = MDO_Database::table( 'source_products' );
\t\t$id    = (int) $wpdb->get_var(
\t\t\t$wpdb->prepare(
\t\t\t\t"SELECT id FROM {$table} WHERE supplier_id = %d AND source_url = %s ORDER BY id DESC LIMIT 1",
\t\t\t\t$supplier_id,
\t\t\t\t$source_url
\t\t\t)
\t\t);
\t\treturn $id > 0 ? self::mark_source_unavailable( $id ) : false;
\t}

\t/**
\t * Si un producto marcado como no disponible reaparece, el payload ya ha sido
\t * actualizado por el conector. Lo reimportamos para recuperar publicación,
\t * visibilidad, precio y stock exactamente desde la fuente.
\t */
\tpublic static function restore_if_unavailable( int $supplier_id, string $source_url ): bool {
\t\tglobal $wpdb;
\t\t$table = MDO_Database::table( 'source_products' );
\t\t$row   = $wpdb->get_row(
\t\t\t$wpdb->prepare(
\t\t\t\t"SELECT id,status,wc_product_id FROM {$table} WHERE supplier_id = %d AND source_url = %s ORDER BY id DESC LIMIT 1",
\t\t\t\t$supplier_id,
\t\t\t\t$source_url
\t\t\t),
\t\t\tARRAY_A
\t\t);
\t\tif ( ! $row || 'unavailable' !== (string) $row['status'] ) {
\t\t\treturn false;
\t\t}

\t\tif ( ! empty( $row['wc_product_id'] ) ) {
\t\t\tself::import_source_product( (int) $row['id'] );
\t\t\tdelete_post_meta( (int) $row['wc_product_id'], '_emdo_source_unavailable' );
\t\t} else {
\t\t\t$wpdb->update( $table, array( 'status' => 'pending', 'last_error' => null ), array( 'id' => (int) $row['id'] ) );
\t\t}
\t\treturn true;
\t}
'''
          methods = methods.replace('\\n', '\n').replace('\\t', '\t')
          importer.write_text(text[:pos] + methods + text[pos:])

          # 3) Scheduler: reconcile a completed discovery against active source rows,
          # and immediately withdraw a known URL when the source returns 404/410.
          scheduler = Path('mdo-supplier-sync/includes/class-mdo-scheduler.php')
          text = scheduler.read_text()
          old = """\t\t\t$result  = $connector::upsert_product( $supplier_id, $product );\n\t\t\tself::increment_run( $run_id, $result );\n\n\t\t\tif ( 'updated' === $result ) {\n\t\t\t\ttry {\n\t\t\t\t\tMDO_Woo_Importer::sync_if_active( $supplier_id, (string) $product['source_url'] );\n\t\t\t\t} catch ( Throwable $sync_error ) {\n"""
          new = """\t\t\t$result   = $connector::upsert_product( $supplier_id, $product );\n\t\t\t$restored = MDO_Woo_Importer::restore_if_unavailable( $supplier_id, (string) $product['source_url'] );\n\t\t\tif ( $restored && 'unchanged' === $result ) {\n\t\t\t\t$result = 'updated';\n\t\t\t}\n\t\t\tself::increment_run( $run_id, $result );\n\n\t\t\tif ( 'updated' === $result && ! $restored ) {\n\t\t\t\ttry {\n\t\t\t\t\tMDO_Woo_Importer::sync_if_active( $supplier_id, (string) $product['source_url'] );\n\t\t\t\t} catch ( Throwable $sync_error ) {\n"""
          if old not in text:
              raise SystemExit('Scheduler restore target not found')
          text = text.replace(old, new, 1)

          old = """\t\t} catch ( Throwable $error ) {\n\t\t\tself::increment_run( $run_id, 'error' );\n\t\t\tself::log_event( $run_id, $supplier_id, 'product_error', 'error', $error->getMessage(), array( 'url' => $url ) );\n\t\t}\n\t\tself::finish_if_complete( $run_id, $supplier, $trigger_type );\n"""
          new = """\t\t} catch ( Throwable $error ) {\n\t\t\tself::increment_run( $run_id, 'error' );\n\t\t\tif ( preg_match( '/\\bHTTP\\s+(404|410)\\b/i', $error->getMessage() ) && MDO_Woo_Importer::mark_source_url_unavailable( $supplier_id, $url ) ) {\n\t\t\t\tself::log_event( $run_id, $supplier_id, 'product_unavailable', 'warning', 'Retirado de la venta: la ficha de origen devuelve ' . $error->getMessage(), array( 'url' => $url ) );\n\t\t\t}\n\t\t\tself::log_event( $run_id, $supplier_id, 'product_error', 'error', $error->getMessage(), array( 'url' => $url ) );\n\t\t}\n\t\tself::finish_if_complete( $run_id, $supplier, $trigger_type );\n"""
          if old not in text:
              raise SystemExit('Scheduler error target not found')
          text = text.replace(old, new, 1)

          old = """\t\t$status  = (int) $run['errors_count'] > 0 ? 'warning' : 'success';\n\t\t$message = sprintf(\n\t\t\t'Análisis completado: %d encontrados, %d nuevos, %d modificados, %d excluidos y %d errores.',\n\t\t\t(int) $run['products_found'],\n\t\t\t(int) $run['products_new'],\n\t\t\t(int) $run['products_updated'],\n\t\t\t(int) $run['products_excluded'],\n\t\t\t(int) $run['errors_count']\n\t\t);\n"""
          new = """\t\t$unavailable = self::reconcile_missing_products( $run_id, $supplier, $run );\n\t\t$status      = (int) $run['errors_count'] > 0 ? 'warning' : 'success';\n\t\t$message     = sprintf(\n\t\t\t'Análisis completado: %d encontrados, %d nuevos, %d modificados, %d excluidos, %d retirados del origen y %d errores.',\n\t\t\t(int) $run['products_found'],\n\t\t\t(int) $run['products_new'],\n\t\t\t(int) $run['products_updated'],\n\t\t\t(int) $run['products_excluded'],\n\t\t\t$unavailable,\n\t\t\t(int) $run['errors_count']\n\t\t);\n"""
          if old not in text:
              raise SystemExit('Scheduler finish target not found')
          text = text.replace(old, new, 1)

          marker = "\n\tprivate static function connector_class( array $supplier ): ?string {"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Scheduler helper insertion point not found')
          helper = r'''
\n\t/**
\t * Al cerrar una sincronización completa, cualquier producto activo que no
\t * haya generado un evento de descubrimiento en este run ya no forma parte
\t * del catálogo de origen. Se retira de la venta, pero se conserva para poder
\t * restaurarlo automáticamente si reaparece.
\t */
\tprivate static function reconcile_missing_products( int $run_id, array $supplier, array $run ): int {
\t\tif ( (int) ( $run['products_found'] ?? 0 ) <= 0 ) {
\t\t\tself::log_event( $run_id, (int) $supplier['id'], 'catalog_empty_guard', 'warning', 'El catálogo devolvió 0 productos; se omite la retirada automática por seguridad.' );
\t\t\treturn 0;
\t\t}

\t\tglobal $wpdb;
\t\t$events_table   = MDO_Database::table( 'sync_events' );
\t\t$products_table = MDO_Database::table( 'source_products' );
\t\t$payloads       = $wpdb->get_col(
\t\t\t$wpdb->prepare(
\t\t\t\t"SELECT payload FROM {$events_table} WHERE run_id = %d AND event_type IN ('product_new','product_updated','product_unchanged','product_excluded','product_error')",
\t\t\t\t$run_id
\t\t\t)
\t\t) ?: array();
\t\t$seen = array();
\t\tforeach ( $payloads as $payload_json ) {
\t\t\t$payload = json_decode( (string) $payload_json, true );
\t\t\t$url     = is_array( $payload ) ? esc_url_raw( (string) ( $payload['url'] ?? '' ) ) : '';
\t\t\tif ( $url ) {
\t\t\t\t$seen[ rtrim( $url, '/' ) ] = true;
\t\t\t}
\t\t}

\t\t$rows = $wpdb->get_results(
\t\t\t$wpdb->prepare(
\t\t\t\t"SELECT id,title,source_url,wc_product_id FROM {$products_table} WHERE supplier_id = %d AND status = 'active'",
\t\t\t\t(int) $supplier['id']
\t\t\t),
\t\t\tARRAY_A
\t\t) ?: array();
\t\t$count = 0;
\t\tforeach ( $rows as $row ) {
\t\t\t$url = rtrim( esc_url_raw( (string) $row['source_url'] ), '/' );
\t\t\tif ( '' !== $url && isset( $seen[ $url ] ) ) {
\t\t\t\tcontinue;
\t\t\t}
\t\t\tif ( MDO_Woo_Importer::mark_source_unavailable( (int) $row['id'] ) ) {
\t\t\t\t$count++;
\t\t\t\tself::log_event(
\t\t\t\t\t$run_id,
\t\t\t\t\t(int) $supplier['id'],
\t\t\t\t\t'product_unavailable',
\t\t\t\t\t'warning',
\t\t\t\t\t'Retirado de la venta porque ya no aparece en el catálogo de origen: ' . (string) $row['title'],
\t\t\t\t\tarray( 'url' => (string) $row['source_url'], 'source_product_id' => (int) $row['id'], 'wc_product_id' => (int) $row['wc_product_id'] )
\t\t\t\t);
\t\t\t}
\t\t}
\t\treturn $count;
\t}
'''
          helper = helper.replace('\\n', '\n').replace('\\t', '\t')
          scheduler.write_text(text[:pos] + helper + text[pos:])

          # 4) Version bump.
          main = Path('mdo-supplier-sync/mdo-supplier-sync.php')
          text = main.read_text()
          if 'Version: 1.0.12' not in text or "MDO_SUPPLIER_SYNC_VERSION', '1.0.12'" not in text:
              raise SystemExit('Expected 1.0.12 markers not found')
          text = text.replace('Version: 1.0.12', 'Version: 1.0.13', 1)
          text = text.replace("MDO_SUPPLIER_SYNC_VERSION', '1.0.12'", "MDO_SUPPLIER_SYNC_VERSION', '1.0.13'", 1)
          main.write_text(text)
          PY

          php -l mdo-supplier-sync/includes/class-mdo-pricing.php
          php -l mdo-supplier-sync/includes/class-mdo-woo-importer.php
          php -l mdo-supplier-sync/includes/class-mdo-scheduler.php
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          grep -Fq "mark_source_unavailable" mdo-supplier-sync/includes/class-mdo-woo-importer.php
          grep -Fq "reconcile_missing_products" mdo-supplier-sync/includes/class-mdo-scheduler.php
          grep -Fq 'Version: 1.0.13' mdo-supplier-sync/mdo-supplier-sync.php

      - name: Commit durable source fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'El Mercado de Origen Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add mdo-supplier-sync/includes/class-mdo-pricing.php mdo-supplier-sync/includes/class-mdo-woo-importer.php mdo-supplier-sync/includes/class-mdo-scheduler.php mdo-supplier-sync/mdo-supplier-sync.php
          git commit -m 'Track source prices and retire missing products'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Deploy, resync Tolecarnes and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o ServerAliveInterval=20 -o ServerAliveCountMax=40 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o ServerAliveInterval=20 -o ServerAliveCountMax=40 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] && [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          test -n "$PROD_PATH"
          echo PRODUCTION_PATH_OK

          PLUGIN="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          files=(
            "mdo-supplier-sync.php"
            "includes/class-mdo-pricing.php"
            "includes/class-mdo-woo-importer.php"
            "includes/class-mdo-scheduler.php"
          )
          for f in "${files[@]}"; do
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$PLUGIN/$f'; cp -p '$PLUGIN/$f' '/tmp/emdo-010245-${GITHUB_RUN_ID}-$(basename "$f").bak'"
            sshpass -e scp $SCP "mdo-supplier-sync/$f" "$STAGING_USER@$STAGING_HOST:$PLUGIN/$f"
          done

          rollback(){
            code=$?
            set +e
            echo CODE_ROLLBACK_START
            for f in "${files[@]}"; do
              b="/tmp/emdo-010245-${GITHUB_RUN_ID}-$(basename "$f").bak"
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "[ -f '$b' ] && cp -p '$b' '$PLUGIN/$f'" || true
            done
            echo CODE_ROLLED_BACK
            exit "$code"
          }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -l '$PLUGIN/mdo-supplier-sync.php' >/dev/null
            \"\$php_bin\" -l '$PLUGIN/includes/class-mdo-pricing.php' >/dev/null
            \"\$php_bin\" -l '$PLUGIN/includes/class-mdo-woo-importer.php' >/dev/null
            \"\$php_bin\" -l '$PLUGIN/includes/class-mdo-scheduler.php' >/dev/null
            grep -Fq 'Version: 1.0.13' '$PLUGIN/mdo-supplier-sync.php'
            grep -Fq 'mark_source_unavailable' '$PLUGIN/includes/class-mdo-woo-importer.php'
            grep -Fq 'reconcile_missing_products' '$PLUGIN/includes/class-mdo-scheduler.php'
          "

          # Validate fresh pricing directly against current origin pages. We require
          # Filetes Primera to remain a normal 18.99 product, and verify that at
          # least one currently discounted Tolecarnes page yields regular + sale.
          fresh="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval '
              \$urls=[
                \"https://tolecarnes.com/producto/filetes-primera-de-ternera-af/\",
                \"https://tolecarnes.com/producto/carne-picada-de-ternera/\",
                \"https://tolecarnes.com/producto/magro-ragu-ternera-az/\",
                \"https://tolecarnes.com/producto/roast-beef-de-ternera-adq/\",
                \"https://tolecarnes.com/producto/pecho-en-filetes-de-ternera/\"
              ];
              \$sales=0;
              foreach(\$urls as \$u){ try{\$p=MDO_Text::normalize_product(MDO_Connector_Tolecarnes::scrape_product(\$u)); \$o=[\"url\"=>\$u,\"title\"=>\$p[\"title\"]??null,\"price\"=>\$p[\"price\"]??null,\"regular\"=>\$p[\"regular_price\"]??null,\"sale\"=>\$p[\"sale_price\"]??null]; echo \"FRESH_PRICE=\".wp_json_encode(\$o,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).\"\\n\"; if(null!==\$o[\"sale\"] && (float)\$o[\"sale\"]<(float)\$o[\"regular\"]) \$sales++; if(str_contains(\$u,\"filetes-primera\") && (abs((float)\$o[\"price\"]-18.99)>0.005 || null!==\$o[\"sale\"])) exit(21); }catch(Throwable \$e){ echo \"FRESH_ERROR=\".\$u.\" :: \".\$e->getMessage().\"\\n\"; } }
              echo \"FRESH_REAL_SALES=\".\$sales.\"\\n\"; if(\$sales<1) exit(22);
            ' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$fresh"
          printf '%s\n' "$fresh" | grep -Fq 'FRESH_REAL_SALES='

          # Full manual Tolecarnes synchronization.
          sync_start="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval 'global \$wpdb; \$su=MDO_Database::table(\"suppliers\"); \$sid=(int)\$wpdb->get_var(\"SELECT id FROM {\$su} WHERE connector=\\\"tolecarnes\\\" OR LOWER(name) LIKE \\\"%tolecarnes%\\\" ORDER BY id LIMIT 1\"); if(!\$sid) exit(30); MDO_Scheduler::run_supplier(\$sid,\"manual\"); \$t=MDO_Database::table(\"sync_runs\"); echo \$sid.\":\".(int)\$wpdb->get_var(\$wpdb->prepare(\"SELECT MAX(id) FROM {\$t} WHERE supplier_id=%d\",\$sid));' --path='$PROD_PATH' --allow-root
          ")"
          SID="$(printf '%s' "$sync_start" | grep -oE '[0-9]+:[0-9]+' | tail -n1 | cut -d: -f1)"
          RUN_ID="$(printf '%s' "$sync_start" | grep -oE '[0-9]+:[0-9]+' | tail -n1 | cut -d: -f2)"
          test -n "$SID" && test -n "$RUN_ID"
          echo "TOLECARNES_FULL_SYNC_RUN_ID=$RUN_ID SUPPLIER_ID=$SID"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" action-scheduler run --group=mdo-supplier-sync --batch-size=20 --batches=0 --force --path='$PROD_PATH' --allow-root
          "

          report="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval 'global \$wpdb; \$t=MDO_Database::table(\"sync_runs\"); \$r=\$wpdb->get_row(\$wpdb->prepare(\"SELECT id,status,products_found,products_new,products_updated,products_excluded,errors_count,message,started_at,finished_at FROM {\$t} WHERE id=%d\",$RUN_ID),ARRAY_A); echo wp_json_encode(\$r,JSON_UNESCAPED_UNICODE); if(!\$r || !in_array(\$r[\"status\"],[\"success\",\"warning\"],true) || empty(\$r[\"finished_at\"])) exit(31);' --path='$PROD_PATH' --allow-root
          ")"
          echo "FULL_SYNC_REPORT=$report"

          # Reimport all active Tolecarnes products to guarantee Woo price fields are
          # rewritten from the newly enriched payload, including clearing stale sales.
          reimport="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval '
              global \$wpdb; \$t=MDO_Database::table(\"source_products\"); \$ids=array_map(\"intval\",\$wpdb->get_col(\$wpdb->prepare(\"SELECT id FROM {\$t} WHERE supplier_id=%d AND status=\\\"active\\\" AND wc_product_id IS NOT NULL AND wc_product_id>0 ORDER BY id\",$SID))); \$ok=0; \$bad=[];
              foreach(\$ids as \$id){ try{ MDO_Woo_Importer::import_source_product(\$id); \$ok++; }catch(Throwable \$e){ \$bad[]=[\"id\"=>\$id,\"error\"=>\$e->getMessage()]; } }
              echo \"FULL_REIMPORT_COUNT=\".count(\$ids).\" OK=\".\$ok.\" ERRORS=\".count(\$bad).\"\\n\"; foreach(\$bad as \$b) echo \"REIMPORT_ERROR=\".wp_json_encode(\$b,JSON_UNESCAPED_UNICODE).\"\\n\"; if(\$bad) exit(41);
            ' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$reimport"
          printf '%s\n' "$reimport" | grep -Fq 'ERRORS=0'

          audit="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval '
              global \$wpdb; echo \"PLUGIN_VERSION=\".MDO_SUPPLIER_SYNC_VERSION.\"\\n\"; if(\"1.0.13\"!==MDO_SUPPLIER_SYNC_VERSION) exit(50);
              \$st=MDO_Database::table(\"source_products\"); \$rows=\$wpdb->get_results(\$wpdb->prepare(\"SELECT id,title,status,wc_product_id,source_payload FROM {\$st} WHERE supplier_id=%d ORDER BY id\",$SID),ARRAY_A)?:[]; \$bad=[]; \$sale_count=0; \$active=0; \$unavailable=0;
              foreach(\$rows as \$row){ if(\"unavailable\"===\$row[\"status\"]){\$unavailable++; if(!empty(\$row[\"wc_product_id\"])){\$wp=wc_get_product((int)\$row[\"wc_product_id\"]); if(\$wp && (\"draft\"!==\$wp->get_status() || \"outofstock\"!==\$wp->get_stock_status())) \$bad[]=[\"title\"=>\$row[\"title\"],\"reason\"=>\"unavailable_not_blocked\"]; } continue;} if(\"active\"!==\$row[\"status\"] || empty(\$row[\"wc_product_id\"])) continue; \$active++; \$p=json_decode((string)\$row[\"source_payload\"],true); \$p=is_array(\$p)?\$p:[]; if(!empty(\$p[\"variations\"])) continue; \$cur=isset(\$p[\"price\"])&&is_numeric(\$p[\"price\"])?(float)\$p[\"price\"]:null; \$reg=isset(\$p[\"regular_price\"])&&is_numeric(\$p[\"regular_price\"])?(float)\$p[\"regular_price\"]:\$cur; \$sale=isset(\$p[\"sale_price\"])&&is_numeric(\$p[\"sale_price\"])?(float)\$p[\"sale_price\"]:null; \$valid=null!==\$sale&&null!==\$reg&&\$sale<\$reg&&null!==\$cur&&abs(\$cur-\$sale)<0.005; if(\$valid) \$sale_count++; \$pid=(int)\$row[\"wc_product_id\"]; \$wp=get_post_meta(\$pid,\"_price\",true); \$wr=get_post_meta(\$pid,\"_regular_price\",true); \$ws=get_post_meta(\$pid,\"_sale_price\",true); \$ep=\$valid?\$sale:\$cur; \$er=\$valid?\$reg:\$cur; \$es=\$valid?\$sale:null; if((null!==\$ep&&abs((float)\$wp-\$ep)>0.005)||(null!==\$er&&abs((float)\$wr-\$er)>0.005)||((null===\$es&&\$ws!==\"\")||(null!==\$es&&abs((float)\$ws-\$es)>0.005))) \$bad[]=[\"title\"=>\$row[\"title\"],\"payload\"=>[\$cur,\$reg,\$sale],\"woo\"=>[\$wp,\$wr,\$ws]]; }
              echo \"FINAL_AUDIT_ACTIVE=\".\$active.\" SALE_COUNT=\".\$sale_count.\" UNAVAILABLE=\".\$unavailable.\" MISMATCH_COUNT=\".count(\$bad).\"\\n\"; foreach(\$bad as \$b) echo \"MISMATCH=\".wp_json_encode(\$b,JSON_UNESCAPED_UNICODE).\"\\n\"; if(\$sale_count<1 || \$bad) exit(51);
              \$needle=\"%\".\$wpdb->esc_like(\"Filetes primera\").\"%\"; \$f=\$wpdb->get_row(\$wpdb->prepare(\"SELECT title,wc_product_id,source_payload FROM {\$st} WHERE supplier_id=%d AND title LIKE %s ORDER BY id DESC LIMIT 1\",$SID,\$needle),ARRAY_A); if(!\$f) exit(52); \$fp=json_decode((string)\$f[\"source_payload\"],true); \$fid=(int)\$f[\"wc_product_id\"]; echo \"FILETES_FINAL=\".wp_json_encode([\"payload\"=>[\"price\"=>\$fp[\"price\"]??null,\"regular\"=>\$fp[\"regular_price\"]??null,\"sale\"=>\$fp[\"sale_price\"]??null],\"woo\"=>[\"price\"=>get_post_meta(\$fid,\"_price\",true),\"regular\"=>get_post_meta(\$fid,\"_regular_price\",true),\"sale\"=>get_post_meta(\$fid,\"_sale_price\",true)]],JSON_UNESCAPED_UNICODE).\"\\n\";
            ' --path='$PROD_PATH' --allow-root
          ")"
          printf '%s\n' "$audit"
          printf '%s\n' "$audit" | grep -Fq 'MISMATCH_COUNT=0'
          printf '%s\n' "$audit" | grep -Fq 'SALE_COUNT='
          printf '%s\n' "$audit" | grep -Fq 'FILETES_FINAL='

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

          for f in "${files[@]}"; do
            b="/tmp/emdo-010245-${GITHUB_RUN_ID}-$(basename "$f").bak"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$b'" || true
          done
          trap - ERR
          echo PRODUCTION_EMDO_PRICE_MISSING_010245_OK

name: Active catalog safe SEO enrichment 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/seo-active-catalog-safe-enrichment-20260821.php'
      - '.github/workflows/seo-active-catalog-safe-enrichment-20260821.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-active-catalog-safe-seo-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint enrichment script
        run: php -l .github/scripts/seo-active-catalog-safe-enrichment-20260821.php
      - name: Install SSH helper
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Apply safe enrichment in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REPORT="$GITHUB_WORKSPACE/.github/reports/seo-active-catalog-safe-enrichment-20260821.txt"
          mkdir -p "$(dirname "$REPORT")"
          REMOTE="/tmp/seo-active-catalog-safe-enrichment-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/seo-active-catalog-safe-enrichment-20260821.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true; exit \$rc" | tee "$REPORT"
      - name: Verify public category archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a .github/reports/seo-active-catalog-safe-enrichment-20260821.txt
          import re, ssl, time, urllib.request, urllib.error
          base='https://www.elmercadodeorigen.com'
          ctx=ssl.create_default_context()
          stamp=str(time.time_ns())
          checks={
            '/categoria-producto/aceites/':'Aceites de oliva de distintas variedades',
            '/categoria-producto/jamones-paletas/':'Jamones y paletas en distintas calidades',
            '/categoria-producto/embutidos-y-curados/':'Chorizos, salchichones, lomos',
            '/categoria-producto/packs-y-lotes/':'Packs y lotes que reúnen distintas especialidades',
            '/categoria-producto/carnes/':'Carnes en distintos cortes y formatos',
            '/categoria-producto/conservas/':'Conservas de verduras y otras elaboraciones vegetales',
            '/categoria-producto/hortalizas-verduras/':'Hortalizas y verduras frescas de temporada',
            '/categoria-producto/legumbres/':'Alubias, garbanzos y lentejas',
          }
          failures=[]
          for path,needle in checks.items():
              url=base+path+'?emdo_category_verify='+stamp
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'EMDO-SEO-Category-Verify/2026-08-21'})
                  with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
                      status=r.status; body=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read().decode('utf-8','replace')
              text=' '.join(re.sub(r'<[^>]+>',' ',body).split())
              visible=needle.lower() in text.lower()
              print(f'CATEGORY_PUBLIC|{path}|HTTP={status}|DESCRIPTION_VISIBLE={visible}')
              if status!=200: failures.append(f'{path} HTTP {status}')
              if not visible: failures.append(f'{path} stored description not rendered publicly')
          if failures:
              print('CATEGORY_PUBLIC_FAILURES:')
              for f in failures: print('- '+f)
              raise SystemExit(2)
          print('ACTIVE_CATEGORY_PUBLIC_VERIFY=PASS')
          PY
      - name: Save enrichment report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT=.github/reports/seo-active-catalog-safe-enrichment-20260821.txt
          [ -f "$REPORT" ] || echo "Enrichment report missing" > "$REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record active catalog safe SEO enrichment [skip ci]"
          git pull --rebase origin main
          git push

name: Audit object cache and commerce latency 20261119
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-object-cache-latency-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Read-only cache, FPM, slow traces and MySQL counters
        shell: bash
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          PHP=/opt/plesk/php/8.2/bin/php
          WP=/usr/local/bin/wp
          SLOW=/var/www/vhosts/system/elmercadodeorigen.com/logs/php-fpm_slow.log
          echo "=== CURRENT ==="
          date -u; uptime; free -m | head -n 3
          echo "=== CACHE DROPINS ==="
          for f in "$ROOT/wp-content/object-cache.php" "$ROOT/wp-content/advanced-cache.php"; do
            if test -f "$f"; then stat -c '%n %s bytes updated %y' "$f"; else echo "MISSING $f"; fi
          done
          echo "=== SERVER SERVICES ==="
          systemctl is-active redis redis-server memcached mariadb plesk-php82-fpm nginx 2>/dev/null || true
          echo "=== FPM POOL LIMITS ==="
          grep -RHiE '^[[:space:]]*(pm|max_execution_time|request_slowlog_timeout|slowlog|php_admin_value\[memory_limit\])' /opt/plesk/php/8.2/etc/php-fpm.d/ 2>/dev/null | grep -i elmercadodeorigen | head -n 20 || true
          echo "=== WP OBJECT CACHE (single read-only CLI bootstrap) ==="
          timeout 20 "$PHP" -d memory_limit=768M "$WP" eval 'echo json_encode(["ext"=>wp_using_ext_object_cache(),"type"=>is_object($GLOBALS["wp_object_cache"]??null)?get_class($GLOBALS["wp_object_cache"]):"none","wp_cache"=>defined("WP_CACHE")?WP_CACHE:null]);' --path="$ROOT" --allow-root --skip-plugins --skip-themes 2>&1 | tail -n 5 || true
          echo "=== DB GLOBAL COUNTERS ==="
          for sql in "SHOW GLOBAL STATUS LIKE 'Threads_running'" "SHOW GLOBAL STATUS LIKE 'Slow_queries'" "SHOW VARIABLES LIKE 'slow_query_log'" "SHOW VARIABLES LIKE 'long_query_time'"; do
            echo "$sql"
            timeout 14 "$PHP" "$WP" db query "$sql" --path="$ROOT" --allow-root --skip-column-names 2>&1 | tail -n 3 || true
          done
          echo "=== ACTIVE CACHE-RELEVANT PLUGINS (filenames only) ==="
          find "$ROOT/wp-content/plugins" -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | grep -Ei 'redis|cache|rocket|perfmatters|speed|nitro|litespeed' | head -n 25 || true
          echo "=== PHP SLOWLOG ==="
          python3 - "$SLOW" <<'PY'
          import os,re,sys
          from collections import Counter
          p=sys.argv[1]
          if not os.path.isfile(p):print('MISSING_SLOWLOG');raise SystemExit(0)
          with open(p,'rb') as f:
            size=os.fstat(f.fileno()).st_size
            f.seek(max(0,size-4000000));s=f.read().decode('utf8','replace')
          files=Counter(re.findall(r'/wp-content/plugins/([^/\s]+)/',s))
          mu=Counter(re.findall(r'/wp-content/mu-plugins/([^/\s]+)/',s))
          stamps=re.findall(r'\[\d{2}-[A-Za-z]{3}-\d{4} [^\]]+\]',s)
          print('SLOWLOG_BYTES',size,'TAIL_SAMPLES',len(stamps),'FIRST_TIMESTAMP',stamps[0] if stamps else '','LAST_TIMESTAMP',stamps[-1] if stamps else '')
          print('SLOW_PLUGIN_FRAMES',files.most_common(14))
          print('SLOW_MU_FRAMES',mu.most_common(8))
          PY
          echo "=== CACHE HEADERS QUICK ==="
          for path in / /tienda/ /tienda/1957/ /carrito/; do
            echo "PATH $path"
            curl -ksSI --connect-timeout 2 --max-time 5 "https://www.elmercadodeorigen.com$path" | grep -Ei 'HTTP/|cache|age:|vary:|expires:|x-emdo' | head -n 15 || true
          done
          REMOTE

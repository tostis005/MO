name: Home static order check 20260820
on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-static-order-check-20260820.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          python3 - <<'PY' | tee runtime/home-static-order-check-20260820.txt
          s=open('/tmp/home.html',encoding='utf-8',errors='ignore').read()
          for x in ['<head','elmercado-home-first-view-css','elmercado-home-mobile-nav-intent-critical','<body','id="mobile-navigation"','</head>']:
              print(x, s.find(x))
          p=s.find('id="mobile-navigation"');print('mobile_context=',s[max(0,p-220):p+300].replace('\n',' '))
          g=s.find('html:not([data-emo-menu-intent="1"])');print('guard_context=',s[max(0,g-100):g+260].replace('\n',' '))
          PY
      - if: always()
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add runtime/home-static-order-check-20260820.txt;git commit -m 'Record Home critical drawer order' || exit 0;git pull --rebase origin main;git push origin HEAD:main

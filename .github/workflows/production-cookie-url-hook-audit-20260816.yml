name: Production cookie URL hook audit 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-cookie-url-hook-audit-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect cookie plugin settings and hooks
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path missing}"
          echo '--- COOKIE PLUGINS ---'
          "$php_bin" "$wp_bin" plugin list --status=active --field=name --path="$PROD_PATH" --allow-root 2>/dev/null | grep -Ei 'cookie|gdpr|consent' || true
          echo '--- PLUGIN DIRS ---'
          find "$PROD_PATH/wp-content/plugins" -maxdepth 1 -type d | grep -Ei 'cookie|gdpr|consent' || true
          echo '--- URL / SETTINGS HOOK CANDIDATES ---'
          for d in "$PROD_PATH"/wp-content/plugins/*cookie* "$PROD_PATH"/wp-content/plugins/*gdpr* "$PROD_PATH"/wp-content/plugins/*consent*; do
            [ -d "$d" ] || continue
            echo "PLUGIN=$d"
            grep -RniE 'CONSTANT_OPEN_URL|cli-plugin-main-link|privacy.*url|cookie.*url|policy.*url|apply_filters\(|get_option\(' "$d" --include='*.php' 2>/dev/null | head -n 260 || true
          done
          echo '--- COOKIE OPTIONS WITH POLICY URL ---'
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $rows=$wpdb->get_results("SELECT option_name, option_value FROM {$wpdb->options} WHERE option_name LIKE \"%cookie%\" OR option_name LIKE \"%cookielaw%\" OR option_name LIKE \"%cli%\" OR option_name LIKE \"%gdpr%\"");
            foreach($rows as $r){
              if(stripos($r->option_value,"politica-de-cookies")!==false || stripos($r->option_value,"cookie-policy")!==false || stripos($r->option_value,"CONSTANT_OPEN_URL")!==false){
                echo "OPTION={$r->option_name}\n";
                echo substr($r->option_value,0,12000)."\n---\n";
              }
            }
          ' --path="$PROD_PATH" --allow-root 2>/dev/null
          REMOTE

name: Production producer mobile layout parity 0.10.236 fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-producer-mobile-layout-parity-010236-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-production-producer-mobile-layout-parity-010236-fix
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://www.elmercadodeorigen.com
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and install tools
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php >/dev/null
          grep -Fq 'WCFM no puede estrechar el área' elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php
          grep -Fq "vendorLabel.textContent='Filtros'" elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable >/dev/null
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          THEME="$PROD_PATH/wp-content/themes/elmercadodeorigen-child"
          MODULE="$THEME/inc/catalog-mobile-controls-parity-010236.php"
          BACKUP="/tmp/catalog-mobile-controls-parity-010236-${GITHUB_RUN_ID}.bak"
          PROBE="elmercado-opcache-producer-mobile-fix-${GITHUB_RUN_ID}.php"
          ROLLED_BACK=0

          rollback() {
            code=$?
            [ "$ROLLED_BACK" -eq 0 ] || exit "$code"
            ROLLED_BACK=1
            set +e
            echo ROLLBACK_START
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "if [ -f '$BACKUP' ]; then cp -p '$BACKUP' '$MODULE'; rm -f '$BACKUP'; fi; rm -f '$PROD_PATH/$PROBE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true" || true
            echo ROLLED_BACK
            exit "${code:-1}"
          }
          trap rollback ERR

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; grep -Fq 'CATALOG_MOBILE_CONTROLS_010236_PRODUCTION' '$THEME/functions.php'; test -f '$MODULE'; cp -p '$MODULE' '$BACKUP'"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/catalog-mobile-controls-parity-010236.php "$STAGING_USER@$STAGING_HOST:$MODULE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$MODULE' >/dev/null; grep -Fq 'WCFM no puede estrechar el área' '$MODULE'; wp cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
          echo FILES_OK

          # Intentamos limpiar OPcache, pero si la URL temporal no responde seguimos:
          # la comprobación de runtime de abajo es la que decide si la versión nueva está viva.
          sshpass -e scp $SCP .github/scripts/elmercado-opcache-reset.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/$PROBE"
          set +e
          for i in $(seq 1 8); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-store' "$BASE_URL/$PROBE?run=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            printf '%s\n' "$body" | grep -q '^OPCACHE_RESET_OK$' && { echo OPCACHE_RESET_OK; break; }
            sleep 4
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$PROD_PATH/$PROBE'" >/dev/null 2>&1
          set -e

          runtime_ok=0
          set +e
          for i in $(seq 1 14); do
            html="$(curl -fsSL --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-store' -H 'Pragma: no-cache' "$BASE_URL/tienda/hidalgo-de-la-jara/?producer-mobile-fix=$GITHUB_RUN_ID-$i" 2>/dev/null)"
            if grep -Fq "vendorLabel.textContent='Filtros'" <<<"$html" && grep -Fq 'WCFM no puede estrechar el área' <<<"$html"; then runtime_ok=1; break; fi
            sleep 5
          done
          set -e
          test "$runtime_ok" -eq 1
          echo RUNTIME_NEW_PAYLOAD_OK

          BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const close=(a,b,t=3)=>Math.abs(a-b)<=t;
          const fail=(m,d)=>{throw new Error(`${m} ${JSON.stringify(d)}`)};
          const retry=async(fn)=>{let e;for(let i=0;i<5;i++){try{return await fn()}catch(x){e=x;await sleep(3000)}}throw e};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const inspect=async(path,vendor)=>{
              const p=await browser.newPage(); await p.setCacheEnabled(false); await p.setViewport({width:390,height:844});
              await retry(()=>p.goto(`${process.env.BASE_URL}${path}?mobile-parity=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000}));
              await p.waitForSelector('.emo-catalog-toolbar-shared-010229',{timeout:30000}); await sleep(1500);
              const d=await p.evaluate(vendor=>{
                const toolbar=document.querySelector('.emo-catalog-toolbar-shared-010229');
                const count=toolbar?.querySelector('.woocommerce-result-count,.emo-catalog-result-count-010220,.emo-vendor-result-count-010225');
                const select=toolbar?.querySelector('.woocommerce-ordering select');
                const trigger=vendor?document.querySelector('#wcfmmp-store .emo-mobile-filter-toggle.emo-filter-toggle-shared-010229'):document.querySelector('#emo-premium-filter-toggle');
                const label=trigger?.querySelector('.emo-filter-label');
                const first=document.querySelector(vendor?'#wcfmmp-store ul.products li.product':'ul.products li.product');
                const r=e=>{if(!e)return null;const x=e.getBoundingClientRect();return{top:x.top,bottom:x.bottom,width:x.width,height:x.height}};
                const s=e=>{if(!e)return null;const c=getComputedStyle(e);return{display:c.display,boxSizing:c.boxSizing,padding:c.padding,borderRadius:c.borderRadius,borderTopWidth:c.borderTopWidth,borderTopColor:c.borderTopColor,backgroundColor:c.backgroundColor,boxShadow:c.boxShadow,fontSize:c.fontSize,fontWeight:c.fontWeight,lineHeight:c.lineHeight,whiteSpace:c.whiteSpace,wordBreak:c.wordBreak,overflowWrap:c.overflowWrap,writingMode:c.writingMode}};
                return{toolbar:r(toolbar),count:r(count),select:r(select),trigger:r(trigger),first:r(first),toolbarStyle:s(toolbar),countStyle:s(count),selectStyle:s(select),triggerStyle:s(trigger),label:(label?.textContent||'').trim()};
              },vendor);
              if(!d.toolbar||!d.count||!d.select||!d.trigger||!d.first) fail('missing controls',{path,d});
              if(d.toolbar.width<300||d.count.width<95||d.count.height>45) fail('collapsed toolbar/count',{path,d});
              if(d.countStyle.whiteSpace!=='nowrap'||!String(d.countStyle.writingMode).startsWith('horizontal')) fail('count not horizontal',{path,d});
              if(!close(d.select.width,148,1)||d.selectStyle.boxSizing!=='border-box') fail('sort geometry',{path,d});
              if(d.label!=='Filtros'||!close(d.trigger.width,d.toolbar.width)) fail('filter parity',{path,d});
              if(d.trigger.top<d.toolbar.bottom-1||d.first.top<d.trigger.bottom+8) fail('vertical overlap',{path,d});
              await p.click(vendor?'#wcfmmp-store .emo-mobile-filter-toggle.emo-filter-toggle-shared-010229':'#emo-premium-filter-toggle'); await sleep(250);
              const opened=await p.evaluate(vendor=>{const e=vendor?document.querySelector('.emo-mobile-filter-shell.emo-filter-shell-shared-010229'):document.querySelector('#emo-premium-filter-shell');if(!e)return false;const c=getComputedStyle(e),r=e.getBoundingClientRect();return !e.hidden&&c.display!=='none'&&r.width>0&&r.height>0},vendor);
              if(!opened) fail('drawer closed',{path,d});
              await p.close(); return d;
            };
            const shop=await inspect('/tienda/',false);
            const vendors=[];
            for(const path of ['/tienda/hidalgo-de-la-jara/','/tienda/1957/','/tienda/el-mercado-de-origen/']) vendors.push(await inspect(path,true));
            for(const v of vendors){
              if(JSON.stringify(shop.selectStyle)!==JSON.stringify(v.selectStyle)) fail('sort style differs',{shop:shop.selectStyle,vendor:v.selectStyle});
              if(JSON.stringify(shop.triggerStyle)!==JSON.stringify(v.triggerStyle)) fail('filter style differs',{shop:shop.triggerStyle,vendor:v.triggerStyle});
              for(const k of ['display','padding','borderRadius','borderTopWidth','borderTopColor','backgroundColor','boxShadow','fontSize','fontWeight','lineHeight']) if(shop.toolbarStyle[k]!==v.toolbarStyle[k]) fail('toolbar style differs',{key:k,shop:shop.toolbarStyle,vendor:v.toolbarStyle});
              for(const k of ['display','fontSize','fontWeight','lineHeight','whiteSpace','wordBreak','overflowWrap','writingMode']) if(shop.countStyle[k]!==v.countStyle[k]) fail('count style differs',{key:k,shop:shop.countStyle,vendor:v.countStyle});
            }
            console.log('MOBILE_PARITY_OK',JSON.stringify({shop,vendors}));
            await browser.close();
          })().catch(e=>{console.error('MOBILE_PARITY_ERROR',e);process.exit(1)});
          NODE

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$BACKUP' '$PROD_PATH/$PROBE'"
          trap - ERR
          echo PRODUCTION_PRODUCER_MOBILE_LAYOUT_FIX_OK

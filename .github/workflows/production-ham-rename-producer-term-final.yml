name: Rename canonical producer term and verify production hams

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-ham-rename-producer-term-final.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-ham-producer-term
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOMAIN: elmercadodeorigen.com
      HOST: ${{ secrets.STAGING_HOST }}
      PORT: ${{ secrets.STAGING_PORT }}
      USER: ${{ secrets.STAGING_USER }}
      PASS: ${{ secrets.STAGING_PASSWORD }}
      HINT: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract approved Dev map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, base64, zlib, json
          s=open('.github/workflows/production-ham-apply-exact.yml',encoding='utf-8').read()
          m=re.search(r"cat > /tmp/map\.b64 <<'MAP'\n\s*([A-Za-z0-9+/=]+)\n\s*MAP",s)
          assert m
          data=zlib.decompress(base64.b64decode(m.group(1)))
          obj=json.loads(data)
          assert obj['n']==145 and len(obj['i'])==145
          open('/tmp/approved-map.json','wb').write(data)
          print('Approved Dev map:',len(obj['i']))
          PY

      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Resolve production and upload map
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$P" -H "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          OUT="$(sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$HINT' '$DOMAIN'" <<'REMOTE'
          set -eu
          hint="${1%/}"; target="$2"; wp="$(command -v wp)"; php="$(command -v php || true)"
          if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)"; fi
          f="$(mktemp)"; matches="$(mktemp)"; trap 'rm -f "$f" "$matches"' EXIT
          for b in "$(dirname "$hint")" "$HOME" /var/www/vhosts /var/www /home; do [ -d "$b" ]||continue; find "$b" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null>>"$f"||true; done
          while IFS= read -r c; do [ -n "$c" ]||continue; p="$(dirname "$c")"; s="$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true)"; h="$("$php" -d memory_limit=256M "$wp" option get home --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true)"; ns="$(printf '%s' "$s"|sed -E 's#^https?://##;s#^www\.##;s#/*$##')"; nh="$(printf '%s' "$h"|sed -E 's#^https?://##;s#^www\.##;s#/*$##')"; if [ "$ns" = "$target" ]||[ "$nh" = "$target" ]; then echo "$p">>"$matches"; fi; done<"$f"
          count="$(sort -u "$matches"|sed '/^$/d'|wc -l|tr -d ' ')"; [ "$count" = 1 ]||{ echo "Expected one production WP, got $count" >&2;exit 2;}; p="$(sort -u "$matches"|head -n1)"; echo "__WP_PATH__=$p"; echo "__SITEURL__=$("$php" -d memory_limit=256M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root)"
          REMOTE
          )"
          printf '%s\n' "$OUT"
          WP_PATH="$(printf '%s\n' "$OUT"|sed -n 's/^__WP_PATH__=//p'|tail -n1)"; : "${WP_PATH:?not resolved}"
          echo "WP_PATH=$WP_PATH">>"$GITHUB_ENV"
          REMOTE_MAP="/tmp/elmercado-approved-${GITHUB_SHA}.json"
          sshpass -e rsync -az -e "ssh $OPT" /tmp/approved-map.json "$USER@$HOST:$REMOTE_MAP"
          echo "REMOTE_MAP=$REMOTE_MAP">>"$GITHUB_ENV"

      - name: Rename the global WooCommerce producer term
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"; OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH'" <<'REMOTE'
          set -eu
          path="$1"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)"; fi
          script="$(mktemp --suffix=.php)";trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          $taxonomy = 'pa_productor';
          if ( ! taxonomy_exists( $taxonomy ) ) {
              fwrite( STDERR, "pa_productor does not exist.\n" );
              exit( 3 );
          }
          $term = get_term_by( 'slug', 'el-catedratico', $taxonomy );
          if ( ! $term ) {
              fwrite( STDERR, "Producer term el-catedratico was not found.\n" );
              exit( 4 );
          }
          $before = (string) $term->name;
          if ( 'El Catedrático' !== $before ) {
              $updated = wp_update_term(
                  (int) $term->term_id,
                  $taxonomy,
                  array(
                      'name' => 'El Catedrático',
                      'slug' => 'el-catedratico',
                  )
              );
              if ( is_wp_error( $updated ) ) {
                  fwrite( STDERR, $updated->get_error_message() . "\n" );
                  exit( 5 );
              }
          }
          clean_term_cache( (int) $term->term_id, $taxonomy );
          $after = get_term( (int) $term->term_id, $taxonomy );
          if ( is_wp_error( $after ) || ! $after || 'El Catedrático' !== $after->name ) {
              fwrite( STDERR, "Canonical producer term was not persisted.\n" );
              exit( 6 );
          }
          $count = (int) $GLOBALS['wpdb']->get_var(
              $GLOBALS['wpdb']->prepare(
                  "SELECT COUNT(*) FROM {$GLOBALS['wpdb']->term_relationships} tr INNER JOIN {$GLOBALS['wpdb']->term_taxonomy} tt ON tt.term_taxonomy_id=tr.term_taxonomy_id WHERE tt.term_id=%d AND tt.taxonomy=%s",
                  (int) $after->term_id,
                  $taxonomy
              )
          );
          echo wp_json_encode(
              array(
                  'status' => 'completed',
                  'siteurl' => get_option( 'siteurl' ),
                  'term_id' => (int) $after->term_id,
                  'slug' => $after->slug,
                  'before' => $before,
                  'after' => $after->name,
                  'relationships' => $count,
              ),
              JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT
          ) . PHP_EOL;
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" --path="$path" --allow-root
          "$php" -d memory_limit=512M "$wp" cache flush --path="$path" --allow-root||true
          REMOTE

      - name: Verify all 145 products exactly against Dev
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"; OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH' '$REMOTE_MAP'" <<'REMOTE'
          set -eu
          path="$1"; map="$2"; wp="$(command -v wp)"; php="$(command -v php || true)"; if [ -z "$php" ]; then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)"; fi
          script="$(mktemp --suffix=.php)";trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          function rr(array $r):int{global$wpdb;$st=$wpdb->prefix.'mdo_source_products';if(!empty($r['surl'])){$id=(int)$wpdb->get_var($wpdb->prepare("SELECT wc_product_id FROM {$st} WHERE source_url=%s AND wc_product_id>0 ORDER BY id DESC LIMIT 1",$r['surl']));if($id&&get_post_type($id)==='product')return$id;}if(!empty($r['slug'])){$p=get_page_by_path($r['slug'],OBJECT,'product');if($p)return(int)$p->ID;}return 0;}
          $m=json_decode(file_get_contents($args[0]),true);$errors=[];$checked=0;$coverage=[];$cat=get_term_by('slug','jamones-paletas','product_cat');$default=(int)get_option('default_product_cat',0);
          foreach(($m['i']??[])as$r){$id=rr($r);if(!$id){$errors[]=['slug'=>$r['slug'],'e'=>'notfound'];continue;}if(!$cat||!has_term((int)$cat->term_id,'product_cat',$id))$errors[]=['id'=>$id,'e'=>'category'];if($default&&has_term($default,'product_cat',$id))$errors[]=['id'=>$id,'e'=>'uncategorized'];foreach(['pa_tipo-pieza','pa_calidad','pa_raza-iberica','pa_alimentacion','pa_con-dop','pa_dop','pa_origen','pa_preparacion','pa_rango-peso','pa_curacion','pa_productor']as$tax){$a=wp_get_post_terms($id,$tax,['fields'=>'names']);$e=$r['a'][$tax]??[];$a=is_wp_error($a)?[]:array_values(array_map('strval',$a));$e=array_values(array_map('strval',$e));sort($a,SORT_NATURAL|SORT_FLAG_CASE);sort($e,SORT_NATURAL|SORT_FLAG_CASE);if($a!==$e)$errors[]=['id'=>$id,'name'=>get_the_title($id),'e'=>$tax,'actual'=>$a,'expected'=>$e];if($a)$coverage[$tax]=($coverage[$tax]??0)+1;}$a=wp_get_post_terms($id,'product_tag',['fields'=>'names']);$e=array_values(array_map('strval',$r['t']??[]));$a=is_wp_error($a)?[]:array_values(array_map('strval',$a));sort($a,SORT_NATURAL|SORT_FLAG_CASE);sort($e,SORT_NATURAL|SORT_FLAG_CASE);if($a!==$e)$errors[]=['id'=>$id,'name'=>get_the_title($id),'e'=>'tags'];$checked++;}
          ksort($coverage);echo wp_json_encode(['status'=>$errors?'failed':'completed','siteurl'=>get_option('siteurl'),'checked'=>$checked,'mismatch_count'=>count($errors),'coverage'=>$coverage,'mismatches'=>array_slice($errors,0,20)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if($checked!==145||$errors)exit(7);
          PHP
          "$php" -d memory_limit=1024M "$wp" eval-file "$script" "$map" --path="$path" --allow-root
          REMOTE

      - name: Trigger a real save on an El Catedrático product
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"; OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH'" <<'REMOTE'
          set -eu
          path="$1";wp="$(command -v wp)";php="$(command -v php||true)";if [ -z "$php" ];then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)";fi
          "$php" -d memory_limit=1024M "$wp" eval '$p=wc_get_product(12631);if(!$p)throw new Exception("Sample missing");$p->save();echo wp_json_encode(["saved"=>$p->get_id(),"name"=>$p->get_name()],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);' --path="$path" --allow-root
          REMOTE

      - name: Verify canonical producer survives save
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          P="${PORT:-22}"; OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P"
          sshpass -e ssh $OPT "$USER@$HOST" "sh -s -- '$WP_PATH'" <<'REMOTE'
          set -eu
          path="$1";wp="$(command -v wp)";php="$(command -v php||true)";if [ -z "$php" ];then php="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1||true)";fi
          "$php" -d memory_limit=1024M "$wp" eval '$p=wp_get_post_terms(12631,"pa_productor",["fields"=>"names"]);$w=wp_get_post_terms(12460,"pa_rango-peso",["fields"=>"names"]);$ok=$p===["El Catedrático"]&&$w===["4,5–5,5 kg","5,5–6,5 kg"];echo wp_json_encode(["status"=>$ok?"completed":"failed","producer"=>$p,"weight"=>$w],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;if(!$ok)exit(8);' --path="$path" --allow-root
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set +e
          if [ -n "${REMOTE_MAP:-}" ];then P="${PORT:-22}";OPT="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $P";sshpass -e ssh $OPT "$USER@$HOST" "rm -f -- '$REMOTE_MAP'";fi

name: Publish cheese batch 04 production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cheese-batch-04-data-a.php'
      - '.github/scripts/cheese-batch-04-data-b.php'
      - '.github/scripts/publish-cheese-batch-04-production.php'
      - '.github/workflows/publish-cheese-batch-04-production.yml'

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate editorial publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/cheese-batch-04-data-a.php
          php -l .github/scripts/cheese-batch-04-data-b.php
          php -l .github/scripts/publish-cheese-batch-04-production.php
          : "${STAGING_HOST:?}"
          : "${STAGING_USER:?}"
          : "${STAGING_PASSWORD:?}"

      - name: Publish ten Spanish and English articles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE_DIR="/tmp/emdo-cheese04-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          sshpass -e scp $SCP_OPTIONS \
            .github/scripts/cheese-batch-04-data-a.php \
            .github/scripts/cheese-batch-04-data-b.php \
            .github/scripts/publish-cheese-batch-04-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE_DIR/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_DIR/publish-cheese-batch-04-production.php' --path='$PROD_PATH' --allow-root; rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc" | tee /tmp/cheese04-output.txt
          grep -q 'EMDO_CHEESE_BATCH04_BEGIN' /tmp/cheese04-output.txt
          grep -q '"count":10' /tmp/cheese04-output.txt
          grep -q 'EMDO_CHEESE_BATCH04_END' /tmp/cheese04-output.txt

      - name: Verify twenty public URLs and editorial details
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'queso-ibores-dop-leche-cruda-cabra-corteza-pimenton-aceite'
            'queso-casin-dop-leche-cruda-pasta-amasada-sello'
            'queso-cebreiro-dop-forma-gorro-cocinero-leche-vaca'
            'queso-picon-bejes-tresviso-dop-queso-azul-leche-maduracion'
            'quesucos-liebana-dop-leches-formatos-ahumado'
            'queso-flor-guia-dop-cuajo-vegetal-media-flor-guia'
            'cuajo-queso-animal-vegetal-microbiano-coagulacion'
            'queso-ahumado-como-se-hace-humo-maderas-sabor'
            'maridaje-queso-vino-como-combinar-intensidad-textura'
            'afinado-queso-que-es-maduracion-corteza-humedad'
          )
          en_slugs=(
            'queso-ibores-pdo-raw-goat-milk-rind-paprika-how-identify'
            'queso-casin-pdo-raw-milk-kneaded-paste-stamped-face'
            'cebreiro-pdo-cheese-cooks-hat-shape-cow-milk-how-identify'
            'picon-bejes-tresviso-pdo-blue-cheese-milk-cave-maturation'
            'quesucos-de-liebana-pdo-milks-small-formats-smoking-how-identify'
            'queso-flor-de-guia-pdo-vegetable-rennet-media-flor-queso-de-guia'
            'what-is-rennet-in-cheese-animal-vegetable-microbial-coagulation'
            'smoked-cheese-how-it-is-made-wood-smoke-flavour-differences'
            'cheese-wine-pairing-how-to-match-intensity-texture-salt-acidity'
            'what-is-cheese-affinage-maturation-humidity-rind-care-affineur'
          )
          check_url() {
            local url="$1" code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then echo "OK $url"; return 0; fi
              sleep 4
            done
            echo "FAILED $code $url" >&2
            return 1
          }
          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done
          check_url "$base/category/quesos/"
          check_url "$base/en/journal/"

          curl -L -sS --max-time 45 "$base/queso-flor-guia-dop-cuajo-vegetal-media-flor-guia/?verify=$GITHUB_RUN_ID" -o /tmp/flor.html
          grep -Fq 'Flor, Media Flor y Guía: cómo leer la diferencia' /tmp/flor.html
          curl -L -sS --max-time 45 "$base/cuajo-queso-animal-vegetal-microbiano-coagulacion/?verify=$GITHUB_RUN_ID" -o /tmp/rennet.html
          grep -Fq 'Coagulación ácida y coagulación mixta' /tmp/rennet.html
          curl -L -sS --max-time 45 "$base/queso-ahumado-como-se-hace-humo-maderas-sabor/?verify=$GITHUB_RUN_ID" -o /tmp/smoke.html
          grep -Fq 'La madera importa: el ejemplo del abedul' /tmp/smoke.html
          curl -L -sS --max-time 45 "$base/en/what-is-cheese-affinage-maturation-humidity-rind-care-affineur/?verify=$GITHUB_RUN_ID" -o /tmp/affinage-en.html
          grep -Fq 'Why more months do not automatically mean better cheese' /tmp/affinage-en.html
          echo 'Cheese batch 04 public editorial verification OK'

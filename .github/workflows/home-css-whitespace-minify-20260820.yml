name: Home CSS whitespace minify 20260820

on:
  push:
    branches: [main]
    paths: ['.github/workflows/home-css-whitespace-minify-20260820.yml']

permissions:
  contents: write

concurrency:
  group: home-css-whitespace-minify-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Capture current CSS byte baseline
        shell: bash
        run: |
          set -euo pipefail;mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-before.html
          python3 - <<'PY' >/tmp/baseline.txt
          import re
          s=open('/tmp/home-before.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<style\b[^>]*id=["\']woostify-parent-style-inline-css["\'][^>]*>(.*?)</style>',s,re.I|re.S)
          print('blocking_before=',len(m.group(1).encode()) if m else -1)
          u=re.search(r'id=["\']elmercado-home-deferred-css["\'][^>]*href=["\']([^"\']+)',s,re.I)
          print('deferred_url=',u.group(1).replace('&amp;','&') if u else '')
          PY
          cat /tmp/baseline.txt
          URL=$(sed -n 's/^deferred_url=//p' /tmp/baseline.txt); if [ -n "$URL" ];then curl -fsS --compressed --max-time 45 "$URL" -o /tmp/deferred-before.css;wc -c </tmp/deferred-before.css | awk '{print "deferred_before=" $1}' >>/tmp/baseline.txt;else echo deferred_before=-1 >>/tmp/baseline.txt;fi

      - name: Add semantics-preserving CSS whitespace minifier
        shell: bash
        run: |
          set -euo pipefail
          cp elmercadodeorigen-child/inc/home-cache.php /tmp/home-cache-before-css-min.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php');s=p.read_text()
          anchor="""function elmercado_write_home_static_cache( string $html ): void {
\tif ( '' === $html || false === stripos( $html, '</html>' ) || false !== stripos( $html, 'wp-die-message' ) ) {
\t\treturn;
\t}
\telmercado_write_atomic_home_file( elmercado_home_static_cache_file(), $html );
}
"""
          fn=r'''
/**
 * Minifies CSS whitespace without touching selectors, declarations or values.
 * Comments are whitespace in CSS; quoted strings/escapes are copied verbatim.
 */
function elmercado_minify_home_css_whitespace( string $css ): string {
	$length        = strlen( $css );
	$output        = '';
	$quote         = '';
	$escaped       = false;
	$pending_space = false;

	for ( $i = 0; $i < $length; $i++ ) {
		$char = $css[ $i ];

		if ( '' !== $quote ) {
			$output .= $char;
			if ( $escaped ) {
				$escaped = false;
			} elseif ( '\\' === $char ) {
				$escaped = true;
			} elseif ( $char === $quote ) {
				$quote = '';
			}
			continue;
		}

		if ( '"' === $char || "'" === $char ) {
			if ( $pending_space && '' !== $output && ! str_ends_with( $output, ' ' ) ) {
				$output .= ' ';
			}
			$pending_space = false;
			$quote         = $char;
			$output       .= $char;
			continue;
		}

		if ( '/' === $char && $i + 1 < $length && '*' === $css[ $i + 1 ] ) {
			$end = strpos( $css, '*/', $i + 2 );
			if ( false === $end ) {
				break;
			}
			/* Keep /*! license comments; all ordinary comments behave as whitespace. */
			if ( $i + 2 < $length && '!' === $css[ $i + 2 ] ) {
				if ( $pending_space && '' !== $output && ! str_ends_with( $output, ' ' ) ) {
					$output .= ' ';
				}
				$output       .= substr( $css, $i, $end + 2 - $i );
				$pending_space = false;
			} else {
				$pending_space = true;
			}
			$i = $end + 1;
			continue;
		}

		if ( ctype_space( $char ) ) {
			$pending_space = true;
			continue;
		}

		if ( $pending_space && '' !== $output && ! str_ends_with( $output, ' ' ) ) {
			$output .= ' ';
		}
		$pending_space = false;
		$output       .= $char;
	}

	return trim( $output );
}
'''
          if anchor not in s: raise SystemExit('static cache anchor missing')
          s=s.replace(anchor,anchor+fn,1)
          old='''\t\t\tif ( str_contains( $matches[0], 'id="woostify-parent-style-inline-css"' ) || str_contains( $matches[0], "id='woostify-parent-style-inline-css'" ) ) {\n\t\t\t\treturn $matches[0];\n\t\t\t}\n\t\t\tif ( isset( $matches[1] ) && '' !== trim( $matches[1] ) ) {\n\t\t\t\t$css_parts[] = $matches[1];\n\t\t\t}'''
          new='''\t\t\tif ( str_contains( $matches[0], 'id="woostify-parent-style-inline-css"' ) || str_contains( $matches[0], "id='woostify-parent-style-inline-css'" ) ) {\n\t\t\t\t$minified = elmercado_minify_home_css_whitespace( (string) $matches[1] );\n\t\t\t\treturn str_replace( (string) $matches[1], $minified, $matches[0] );\n\t\t\t}\n\t\t\tif ( isset( $matches[1] ) && '' !== trim( $matches[1] ) ) {\n\t\t\t\t$css_parts[] = elmercado_minify_home_css_whitespace( (string) $matches[1] );\n\t\t\t}'''
          if old not in s: raise SystemExit('style callback anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
          grep -q 'elmercado_minify_home_css_whitespace' elmercadodeorigen-child/inc/home-cache.php

      - name: Deploy experiment and rebuild Home cache
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail;PORT="${STAGING_PORT:-22}";SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT";SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp);php_bin=$(command -v php||true);[ -n "$php_bin" ]||php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1);for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null);do p=$(dirname "$cfg");u=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true);case "$u" in *elmercadodeorigen.com*)printf "%s" "$p";break;;esac;done')";: "${PROD:?no prod}";echo "$PROD">/tmp/prod-css-min
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-css-min-${GITHUB_RUN_ID}.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child';cp \"\$THEME/inc/home-cache.php\" /tmp/home-cache-server-before-css-min-${GITHUB_RUN_ID}.php;install -m0644 /tmp/home-cache-css-min-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\";php_bin=\$(command -v php||true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css"
          for i in 1 2 3;do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null;done

      - name: Measure bytes mobile and desktop
        shell: bash
        run: |
          set -euo pipefail;mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-after.html
          python3 - <<'PY' >/tmp/after.txt
          import re
          s=open('/tmp/home-after.html',encoding='utf-8',errors='ignore').read();m=re.search(r'<style\b[^>]*id=["\']woostify-parent-style-inline-css["\'][^>]*>(.*?)</style>',s,re.I|re.S);print('blocking_after=',len(m.group(1).encode()) if m else -1);u=re.search(r'id=["\']elmercado-home-deferred-css["\'][^>]*href=["\']([^"\']+)',s,re.I);print('deferred_url=',u.group(1).replace('&amp;','&') if u else '')
          PY
          URL=$(sed -n 's/^deferred_url=//p' /tmp/after.txt);if [ -n "$URL" ];then curl -fsS --compressed --max-time 45 "$URL" -o /tmp/deferred-after.css;wc -c </tmp/deferred-after.css|awk '{print "deferred_after=" $1}' >>/tmp/after.txt;else echo deferred_after=-1 >>/tmp/after.txt;fi
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=mobile --output=json --output-path=/tmp/mobile.json --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path=/tmp/desktop.json --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          python3 - <<'PY' | tee runtime/home-css-whitespace-minify-20260820.txt
          import json,re
          def vals(path):
              d={}
              for line in open(path):
                  if '=' in line:
                      k,v=line.strip().split('=',1)
                      if k!='deferred_url': d[k]=int(v)
              return d
          b=vals('/tmp/baseline.txt');a=vals('/tmp/after.txt');print('bytes_before=',b);print('bytes_after=',a);print('blocking_saved=',b.get('blocking_before',-1)-a.get('blocking_after',-1));print('deferred_saved=',b.get('deferred_before',-1)-a.get('deferred_after',-1))
          rows={}
          for name in ('mobile','desktop'):
              r=json.load(open('/tmp/'+name+'.json'));x=r['audits'];rows[name]={'score':round(r['categories']['performance']['score']*100),'fcp':round(x['first-contentful-paint']['numericValue']),'lcp':round(x['largest-contentful-paint']['numericValue']),'tbt':round(x['total-blocking-time']['numericValue']),'cls':x['cumulative-layout-shift']['numericValue']};print(name,'=',rows[name])
          saving=(b.get('blocking_before',0)-a.get('blocking_after',0))+(b.get('deferred_before',0)-a.get('deferred_after',0));keep=saving>5000 and rows['mobile']['cls']<0.02 and rows['desktop']['cls']<0.10 and rows['mobile']['lcp']<5500 and rows['desktop']['lcp']<6500;print('total_saved=',saving);print('keep=',str(keep).lower());open('/tmp/keep-css-min','w').write('1' if keep else '0')
          PY

      - name: Keep only if safe and useful
        if: always()
        env: {SSHPASS: '${{ secrets.STAGING_PASSWORD }}'}
        shell: bash
        run: |
          set -euo pipefail;K=$(cat /tmp/keep-css-min 2>/dev/null||echo 0);PROD=$(cat /tmp/prod-css-min 2>/dev/null||true);PORT="${STAGING_PORT:-22}";SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          if [ "$K" != 1 ];then cp /tmp/home-cache-before-css-min.php elmercadodeorigen-child/inc/home-cache.php;[ -z "$PROD" ]||sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "THEME='$PROD/wp-content/themes/elmercadodeorigen-child';install -m0644 /tmp/home-cache-server-before-css-min-${GITHUB_RUN_ID}.php \"\$THEME/inc/home-cache.php\";php_bin=\$(command -v php||true);[ -n \"\$php_bin\" ]||php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null|sort -Vr|head -n1);wp_bin=\$(command -v wp);\"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD' --allow-root||true;rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css";fi
          mkdir -p runtime;[ -f runtime/home-css-whitespace-minify-20260820.txt ]||echo failed>runtime/home-css-whitespace-minify-20260820.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add elmercadodeorigen-child/inc/home-cache.php runtime/home-css-whitespace-minify-20260820.txt;git commit -m 'Measure safe Home CSS whitespace minification' || exit 0;git pull --rebase origin main;git push origin HEAD:main

name: Fast Home CLS baseline test 010286

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cls-baseline-fast-010286.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore proven CLS source
        shell: bash
        run: |
          set -euo pipefail
          BASE='db7a6b87a28b70dea64506fb342403da9d5b771c'
          git show "$BASE:elmercadodeorigen-child/mu-plugins/elmercado-home-cls-010256.php" > /tmp/home-cls.php
          git show "$BASE:elmercadodeorigen-child/assets/css/critical-woostify-home.min.css" > /tmp/home-critical.css
          php -l /tmp/home-cls.php
      - name: Deploy and clear Home
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD:?}"
          sshpass -e scp $SCP /tmp/home-cls.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cls-fast.php"
          sshpass -e scp $SCP /tmp/home-critical.css "$STAGING_USER@$STAGING_HOST:/tmp/home-critical-fast.css"
          timeout 150s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            install -m 0644 /tmp/home-cls-fast.php '$PROD/wp-content/mu-plugins/elmercado-home-cls-010256.php'
            install -m 0644 /tmp/home-critical-fast.css '$PROD/wp-content/themes/elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
            rm -f '$PROD/wp-content/mu-plugins/elmercado-home-header-cls-010279.php'
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true
            rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
          "
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
      - name: Lighthouse desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path=/tmp/lhr.json --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'
          python3 - <<'PY' | tee runtime/home-cls-baseline-fast-010286.txt
          import json
          r=json.load(open('/tmp/lhr.json')); a=r['audits']
          print('score=',round(r['categories']['performance']['score']*100))
          print('fcp=',round(a['first-contentful-paint']['numericValue']))
          print('lcp=',round(a['largest-contentful-paint']['numericValue']))
          print('tbt=',round(a['total-blocking-time']['numericValue']))
          print('cls=',a['cumulative-layout-shift']['numericValue'])
          for item in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:8]:
              n=item.get('node') or {}; print('shift=',item.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          PY
      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-cls-baseline-fast-010286.txt ] || echo 'failed' > runtime/home-cls-baseline-fast-010286.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-cls-baseline-fast-010286.txt
          git commit -m 'Record fast restored Home CLS baseline' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

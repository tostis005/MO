name: Production English visible Spanish inventory 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-english-visible-spanish-inventory-20260816.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Scan visible English body text
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          WP=$(command -v wp || true); PHP=$(command -v php || true)
          [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          "$PHP" -d memory_limit=512M "$WP" eval '
            foreach(get_posts(["post_type"=>"product","post_status"=>"publish","posts_per_page"=>-1,"fields"=>"ids","suppress_filters"=>true]) as $id){
              if((string)get_post_meta($id,"_en_US_published",true)!=="1") continue;
              $slug=(string)get_post_meta($id,"_en_US_post_name",true); if($slug!=="") echo "product|$id|/en/product/$slug/".PHP_EOL;
            }
          ' --path="$ROOT" --allow-root 2>/dev/null > /tmp/mdo-en-urls.txt
          cat >> /tmp/mdo-en-urls.txt <<'EOF'
          page|3699|/en/
          page|6|/en/shop/
          page|1142|/en/producers/
          page|1385|/en/contact/
          page|3|/en/privacy-policy/
          post|3025|/en/extra-virgin-olive-oil/
          post|3327|/en/iberian-ham/
          post|3794|/en/oranges/
          term|16|/en/product-category/oils/
          store|0|/en/store/hidalgo-de-la-jara/
          store|0|/en/store/1957/
          EOF
          python3 - <<'PY'
          import re
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/mdo-en-urls.txt').read_text().splitlines():
              line=line.strip()
              if line and '|' in line: rows.append(line)
          Path('/tmp/mdo-en-urls-clean.txt').write_text('\n'.join(rows)+'\n')
          PY
          stamp=$(date +%s%N)
          while IFS='|' read -r typ id path; do
            [ -n "$path" ] || continue
            file=/tmp/mdo-visible.html
            code=$(curl -ksSL --max-time 30 -o "$file" -w '%{http_code}' "https://www.elmercadodeorigen.com${path}?mdo_visible_inventory=$stamp" || true)
            echo "=== $typ $id $path HTTP=$code ==="
            [ "$code" = 200 ] || continue
            python3 - "$file" <<'PY'
import sys,re
from html.parser import HTMLParser
class V(HTMLParser):
    def __init__(self): super().__init__(convert_charrefs=True); self.ignore=[]; self.chunks=[]
    def handle_starttag(self,t,a):
        if t in {'head','script','style','noscript','svg','template'}: self.ignore.append(t)
    def handle_endtag(self,t):
        if self.ignore and t==self.ignore[-1]: self.ignore.pop()
    def handle_data(self,d):
        if not self.ignore:
            s=' '.join(d.split())
            if len(s)>1:self.chunks.append(s)
s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); p=V(); p.feed(s)
strong={'introducción','noviembre','pedido','pedidos','envío','envíos','elaborado','elaborada','nuestros','nuestras','jamón','paleta','naranjas','aceite','privacidad','política','información','nutricional','cerdo','cerdos','dehesa','añadir','carrito','mínimo','gastos','devolución','resolvemos','dudas','gratis','productores','formato','formatos','variedades','embutidos'}
common={'que','para','con','del','una','los','las','por','desde','hasta','este','esta','estos','estas','también','más','muy','y','el','la','de','en','un','se','es','su','sus'}
sus=[]
for c in p.chunks:
    ws=re.findall(r'[a-záéíóúüñ]+',c.lower())
    sh=sum(w in strong for w in ws); ch=sum(w in common for w in ws)
    if sh>=1 and ch>=2 or sh>=2:
        sus.append((sh+ch,c))
for score,c in sorted(sus,reverse=True)[:12]: print('VISIBLE_SPANISH',score,c[:900])
print('VISIBLE_SPANISH_CHUNKS',len(sus))
PY
          done < /tmp/mdo-en-urls-clean.txt
          REMOTE

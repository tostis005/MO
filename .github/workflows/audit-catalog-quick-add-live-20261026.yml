name: Audit live quick-add deployment (post production patch)

on:
  pull_request:
    paths:
      - '.github/workflows/audit-catalog-quick-add-live-20261026.yml'

permissions:
  contents: read

jobs:
  audit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify storefront and producer HTML after production patch
        shell: bash
        run: |
          set -euo pipefail
          for page in tienda/ tienda/1957/; do
            url="https://www.elmercadodeorigen.com/$page?emo-audit=${GITHUB_SHA}"
            status="$(curl -ksSL --max-time 40 -H 'Cache-Control: no-cache' -A 'Mozilla/5.0' -o /tmp/emo-live.html -w '%{http_code}' "$url")"
            echo "LIVE_URL=$url HTTP_STATUS=$status HTML_BYTES=$(wc -c < /tmp/emo-live.html)"
            for needle in emo-catalog-quick-add-js-20261026 emo-catalog-quick-add-20261026 'ul class="products' 'add_to_cart_button'; do
              if grep -Fq "$needle" /tmp/emo-live.html; then
                echo "PRESENT $needle"
              else
                echo "MISSING $needle"
              fi
            done
          done
      - name: Validate rendered desktop and mobile quick add buttons
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --prefix /tmp/emo-browser playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then echo 'Using runner Chrome'; else npx --prefix /tmp/emo-browser playwright install chromium > /tmp/emo-chromium-install.log 2>&1; fi
          cat > /tmp/emo-browser-check.cjs <<'CHECK_JS'
          const { chromium } = require('/tmp/emo-browser/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, ...(process.env.CHROME_AVAILABLE === 'yes' ? { channel: 'chrome' } : {}) });
            let failures = 0;
            try {
              for (const [pageName, path] of [['Tienda', '/tienda/'], ['1957', '/tienda/1957/']]) {
                for (const [device, viewport] of [['desktop', { width: 1440, height: 900 }], ['mobile', { width: 390, height: 844 }]]) {
                  const page = await browser.newPage({ viewport, locale: 'es-ES' });
                  page.on('pageerror', error => console.log('BROWSER_PAGE_ERROR ' + pageName + ' ' + device + ': ' + error.message));
                  const url = 'https://www.elmercadodeorigen.com' + path + '?quick-add-browser-check=20261026';
                  try {
                    await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                    await page.waitForSelector('ul.products li.product', { timeout: 25000 });
                    try {
                      await page.waitForSelector('ul.products li.product > a.emo-card-quick-add', { timeout: 4500 });
                    } catch (_) {}
                    const data = await page.evaluate(() => {
                      const cards = [...document.querySelectorAll('ul.products li.product')];
                      const buttons = [...document.querySelectorAll('ul.products li.product > a.emo-card-quick-add')];
                      const visible = buttons.filter(el => {
                        const style = getComputedStyle(el);
                        const rect = el.getBoundingClientRect();
                        return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0' && rect.width >= 35 && rect.height >= 35;
                      });
                      return {
                        cards: cards.length, buttons: buttons.length, visible: visible.length,
                        simple: buttons.filter(el => el.classList.contains('product_type_simple')).length,
                        options: buttons.filter(el => el.classList.contains('product_type_variable')).length,
                        positioned: visible.filter(el => getComputedStyle(el).position === 'absolute').length,
                        icons: visible.filter(el => Boolean(el.querySelector('.emo-card-quick-add__symbol'))).length,
                        pageClasses: document.body.className,
                        sourceAdd: document.querySelectorAll('ul.products li.product a.add_to_cart_button').length,
                        sourceVariable: document.querySelectorAll('ul.products li.product a.product_type_variable').length,
                        sourceAnchorClasses: [...document.querySelectorAll('ul.products li.product a')].slice(0,16).map(a => ({className:a.className,href:a.getAttribute('href')?.slice(0,70)})),
                        scriptPresent: Boolean(document.querySelector('script#emo-catalog-quick-add-js-20261026'))
                      };
                    });
                    console.log('RENDER_CHECK ' + JSON.stringify({ page: pageName, device, ...data }));
                    if (data.cards < 1 || data.buttons < 1 || data.visible < 1 || data.icons < 1 || data.positioned < 1) {
                      failures++;
                      console.error('RENDER_FAILURE ' + pageName + ' ' + device);
                    }
                  } catch (error) {
                    failures++;
                    console.error('RENDER_ERROR ' + pageName + ' ' + device + ' ' + error.message);
                  } finally {
                    await page.close();
                  }
                }
              }
            } finally {
              await browser.close();
            }
            if (failures > 0) process.exitCode = 1;
          })().catch(err => { console.error(err); process.exitCode = 1; });
          CHECK_JS
          if command -v google-chrome >/dev/null 2>&1; then export CHROME_AVAILABLE=yes; else export CHROME_AVAILABLE=no; fi
          node /tmp/emo-browser-check.cjs
      - name: Read production file status over existing SSH connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_PASSWORD" ] || [ -z "$STAGING_REMOTE_PATH" ]; then
            echo "MISSING_CONNECTION_SECRETS"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # El secreto de huella del servidor no coincide con la clave ofertada;
          # reproducir el procedimiento SSH empleado por los despliegues ya existentes.
          ssh-keyscan -T 15 -p "${STAGING_PORT:-22}" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$STAGING_PASSWORD"
          port="${STAGING_PORT:-22}"
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "$port" "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'AUDIT_REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}";; */wp-content) dev="$(dirname "$raw")";; *) dev="$raw";; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n 1 || true)"
            [ -n "$cfg" ] || { echo "STAGING_ROOT_UNRESOLVED"; exit 0; }
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          [ -f "$prod/wp-config.php" ] || { echo "PRODUCTION_ROOT_UNRESOLVED"; exit 0; }
          theme="$prod/wp-content/themes/elmercadodeorigen-child"
          if [ -f "$theme/inc/catalog-quick-add-20261026.php" ]; then
            echo "PRODUCTION_MODULE_PRESENT"
            grep -Fq 'emo-catalog-quick-add-js-20261026' "$theme/inc/catalog-quick-add-20261026.php" && echo "PRODUCTION_MODULE_VALID_MARKER"
          else
            echo "PRODUCTION_MODULE_MISSING"
          fi
          if grep -Fq 'catalog-quick-add-20261026.php' "$theme/functions.php"; then
            echo "PRODUCTION_MODULE_REGISTERED"
          else
            echo "PRODUCTION_MODULE_NOT_REGISTERED"
          fi
          AUDIT_REMOTE

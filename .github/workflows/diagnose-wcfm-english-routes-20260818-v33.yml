name: Diagnose WCFM English routes v33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wcfm-english-routes-20260818-v33.yml'
      - '.github/scripts/diagnose-wcfm-english-routes-20260818-v33.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production WCFM and translation metadata
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          REMOTE="/tmp/diagnose-wcfm-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/diagnose-wcfm-english-routes-20260818-v33.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > runtime/wcfm-english-v33.json
      - name: Make compact report
        shell: bash
        run: |
          jq '{roles,translation_postmeta_keys,relevant_pages,vendors,term_roots,sample_products,wcfm_rules,wcfm_options}' runtime/wcfm-english-v33.json > runtime/wcfm-english-v33-summary.json
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add runtime/wcfm-english-v33.json runtime/wcfm-english-v33-summary.json
          git commit -m 'Record WCFM English route diagnostic v33' || exit 0
          git push

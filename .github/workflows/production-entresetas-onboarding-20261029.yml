name: EntreSetas - alta segura y fichas en borrador
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emdo-entresetas-onboarding
  cancel-in-progress: false
jobs:
  onboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate onboarding source
        run: |
          set -Eeuo pipefail
          php -l mdo-supplier-sync/scripts/onboard-entresetas.php
          php -l mdo-supplier-sync/connectors/class-mdo-connector-entresetas.php
          php -l mdo-supplier-sync/includes/class-mdo-woo-importer.php
          test -n "$STAGING_HOST" && test -n "$STAGING_USER" && test -n "$SSHPASS"
          test -n "$EXPECTED_SHA"
      - name: Install transport for existing production SSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Provision disabled WCFM seller, synchronize and import drafts
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="$STAGING_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          LOCAL_CONNECTOR_HASH="$(sha256sum mdo-supplier-sync/connectors/class-mdo-connector-entresetas.php | cut -d ' ' -f1)"
          REMOTE_CONNECTOR_HASH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sha256sum '$PROD_PATH/wp-content/plugins/mdo-supplier-sync/connectors/class-mdo-connector-entresetas.php' | cut -d ' ' -f1" | tr -d '\r\n')"
          test "$LOCAL_CONNECTOR_HASH" = "$REMOTE_CONNECTOR_HASH"
          DEPLOYED_SHA="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cat '$PROD_PATH/wp-content/plugins/mdo-supplier-sync/.emdo-deployed-sha'" | tr -d '\r\n')"
          test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
          echo 'ENTRESETAS_PLUGIN_DEPLOY_VERIFIED'
          REMOTE_SCRIPT="/tmp/emdo-onboard-entresetas-$GITHUB_RUN_ID.php"
          sshpass -e scp $SCP mdo-supplier-sync/scripts/onboard-entresetas.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          remote_wp() {
            phase="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              wp_bin=\$(command -v wp)
              ENTRESETAS_PHASE='$phase' \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root
            "
          }
          remote_wp setup
          remote_wp discover
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" action-scheduler run --group=mdo-supplier-sync --batch-size=20 --batches=10 --force --path='$PROD_PATH' --allow-root
          "
          remote_wp report
          for i in $(seq 1 15); do
            result="$(remote_wp import)"
            printf '%s\n' "$result"
            remaining="$(printf '%s\n' "$result" | sed -nE 's/.*"remaining":([0-9]+).*/\1/p' | tail -n1)"
            test -n "$remaining"
            if [ "$remaining" = 0 ]; then break; fi
          done
          remote_wp report
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE_SCRIPT'"
          echo ENTRESETAS_PRELAUNCH_FINISHED

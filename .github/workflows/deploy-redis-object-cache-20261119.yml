name: Deploy bounded Redis object cache for WooCommerce 20261119
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-redis-object-cache-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emdo-production-object-cache
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - run: sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Install isolated bounded Redis object cache with immediate failure rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(id -u)" = 0
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          PHP=/opt/plesk/php/8.2/bin/php
          WP=/usr/local/bin/wp
          CONFIG="$ROOT/wp-config.php"
          DROPIN="$ROOT/wp-content/object-cache.php"
          PLUGIN="$ROOT/wp-content/plugins/redis-cache"
          CONF=/etc/redis/redis.conf
          test -s "$CONFIG"
          test -f "$ROOT/wp-content/advanced-cache.php"
          test ! -e "$DROPIN"
          test ! -e "$PLUGIN"
          ! grep -q 'WP_REDIS_PREFIX' "$CONFIG"
          # Package may already be staged from an automatically rolled-back attempt.
          "$PHP" -m | grep -qx redis
          nginx -t
          test "$(systemctl is-active nginx)" = active
          test "$(systemctl is-active mariadb)" = active
          BK="/root/emdo-redis-object-cache-$(date -u +%Y%m%dT%H%M%SZ)"
          install -d -m 0700 "$BK"
          cp -p "$CONFIG" "$BK/wp-config.php"
          echo "ROLLBACK_BACKUP=$BK"
          changed=0
          rollback() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$changed" = 1 ]; then
              echo 'ROLLBACK_START: reverting object cache and restoring WordPress configuration'
              rm -f "$DROPIN"
              cp -p "$BK/wp-config.php" "$CONFIG"
              if test -e "$PLUGIN"; then
                timeout 20 "$PHP" -d memory_limit=768M "$WP" plugin deactivate redis-cache --path="$ROOT" --allow-root --quiet || true
                mv "$PLUGIN" "$BK/redis-cache-plugin" || true
              fi
              if test -f "$BK/redis-original.conf"; then cp -p "$BK/redis-original.conf" "$CONF"; fi
              systemctl stop redis-server >/dev/null 2>&1 || true
              systemctl disable redis-server >/dev/null 2>&1 || true
              "$PHP" -l "$CONFIG" || true
              echo 'ROLLBACK_FINISHED'
            fi
            exit "$rc"
          }
          trap rollback EXIT
          changed=1
          echo 'INSTALLING_REDIS'
          export DEBIAN_FRONTEND=noninteractive
          timeout 100 apt-get install -y -qq --no-install-recommends redis-server >/dev/null
          test -x /usr/bin/redis-server
          test -s "$CONF"
          cp -p "$CONF" "$BK/redis-original.conf"
          cat >> "$CONF" <<'CONFADD'

          # BEGIN EMDO WORDPRESS BOUNDED OBJECT CACHE 20261119
          bind 127.0.0.1
          protected-mode yes
          port 6379
          maxmemory 192mb
          maxmemory-policy allkeys-lru
          save ""
          appendonly no
          # END EMDO WORDPRESS BOUNDED OBJECT CACHE 20261119
          CONFADD
          systemctl enable redis-server >/dev/null 2>&1
          systemctl restart redis-server
          test "$(systemctl is-active redis-server)" = active
          test "$(redis-cli ping)" = PONG
          test "$(redis-cli --raw config get maxmemory | tail -n 1)" = 201326592
          test "$(redis-cli --raw config get maxmemory-policy | tail -n 1)" = allkeys-lru
          # Never expose the cache to external networks.
          if ss -lnt | grep -E '0\.0\.0\.0:6379|\[::\]:6379'; then echo ERROR_PUBLIC_REDIS_LISTENER; exit 40; fi
          echo 'REDIS_LOCAL_ONLY_192MB_READY'
          echo 'CONFIGURING_WP_REDIS_PREFIX'
          python3 - "$CONFIG" <<'PY'
          import sys,re
          p=sys.argv[1]
          s=open(p,'r',encoding='utf8').read()
          assert 'WP_REDIS_PREFIX' not in s
          m=re.search(r'(?m)^.*require_once\s*\(?\s*ABSPATH\s*\.\s*[\x27\x22]wp-settings\.php[\x27\x22]',s)
          if not m:
              m=re.search(r'(?m)^.*wp-settings\.php',s)
          assert m,'Cannot locate wp-settings include in wp-config'
          block=(
              "// BEGIN EMDO REDIS OBJECT CACHE 20261119\n"
              "define('WP_REDIS_HOST', '127.0.0.1');\n"
              "define('WP_REDIS_PORT', 6379);\n"
              "define('WP_REDIS_DATABASE', 5);\n"
              "define('WP_REDIS_PREFIX', 'emdo_prod_20261119_');\n"
              "define('WP_REDIS_MAXTTL', 3600);\n"
              "define('WP_REDIS_TIMEOUT', 0.5);\n"
              "define('WP_REDIS_READ_TIMEOUT', 0.5);\n"
              "define('WP_REDIS_DISABLE_ADMINBAR', true);\n"
              "define('WP_REDIS_DISABLE_METRICS', true);\n"
              "// END EMDO REDIS OBJECT CACHE 20261119\n"
          )
          s=s[:m.start()]+block+s[m.start():]
          with open(p,'w',encoding='utf8') as f:f.write(s)
          PY
          "$PHP" -l "$CONFIG" | grep -q 'No syntax errors detected'
          echo 'INSTALLING_OFFICIAL_REDIS_CACHE_PLUGIN'
          timeout 85 "$PHP" -d memory_limit=768M "$WP" plugin install redis-cache --activate --path="$ROOT" --allow-root --quiet
          test -s "$PLUGIN/redis-cache.php"
          # Match ownership to existing site plugins, retaining future update ability.
          own=$(stat -c '%u:%g' "$ROOT/wp-content/plugins/woocommerce")
          chown -R "$own" "$PLUGIN"
          echo 'ENABLING_OBJECT_CACHE_DROPIN'
          timeout 35 "$PHP" -d memory_limit=768M "$WP" redis enable --path="$ROOT" --allow-root
          test -s "$DROPIN"
          chown "$own" "$DROPIN"
          timeout 20 "$PHP" -d memory_limit=768M "$WP" redis status --path="$ROOT" --allow-root | grep -Ei 'Status|Connected|Client|Drop-in|Redis'
          # Verify a cached value survives separate PHP processes.
          first=$(timeout 20 "$PHP" -d memory_limit=768M "$WP" eval 'echo wp_cache_set("emdo_redis_cross_process_probe","redis_ok_20261119","emdo_health",120)?"CACHE_SET":"CACHE_FAILED";' --path="$ROOT" --allow-root --skip-themes 2>/dev/null)
          test "$first" = CACHE_SET
          second=$(timeout 20 "$PHP" -d memory_limit=768M "$WP" eval 'echo wp_cache_get("emdo_redis_cross_process_probe","emdo_health");' --path="$ROOT" --allow-root --skip-themes 2>/dev/null)
          test "$second" = redis_ok_20261119
          echo 'PERSISTENT_OBJECT_CACHE_VERIFIED'
          # Low-frequency smoke tests; no login, checkout state changes, or purchases.
          for path in / /tienda/1957/ /carrito/ /finalizar-compra/; do
            result=$(curl -ksS --retry 0 --connect-timeout 3 --max-time 13 -o /dev/null -w '%{http_code} %{time_total}' "https://www.elmercadodeorigen.com$path")
            code=$(printf '%s' "$result" | awk '{print $1}')
            case "$code" in 200|301|302|303) : ;; *) echo "ERROR_BAD_SMOKE_RESPONSE $path $result"; exit 42;; esac
            echo "POST_REDIS_SMOKE path=$path status_time=$result"
          done
          "$PHP" -l "$CONFIG" | grep -q 'No syntax errors detected'
          nginx -t
          test "$(systemctl is-active nginx)" = active
          test "$(systemctl is-active redis-server)" = active
          test "$(systemctl is-active mariadb)" = active
          echo 'REDIS_OBJECT_CACHE_DEPLOYMENT_SUCCESS'
          redis-cli info memory | grep -E '^used_memory_human:|^maxmemory_human:'
          REMOTE

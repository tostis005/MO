name: Verify public Tolecarnes batch 07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Spanish and English rendered pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(pecho-en-filetes-de-ternera tomahawk-aguja burger-100-ternera-2-unidades roast-beef-de-ternera lote-2-tomahawk-de-aguja-y-vino)
          es_body=('El pecho de ternera, ya preparado en filetes' 'La aguja en formato Tomahawk' 'Hamburguesas 100% de ternera' 'Una pieza de lomo bajo para asar' 'Dos Tomahawk de aguja en un mismo lote')
          en_body=('Beef brisket, already prepared as steaks' 'Chuck in Tomahawk format' '100% beef burgers' 'A striploin joint for roasting' 'Two chuck Tomahawks in one box')
          es_short=('Pecho de ternera cortado en filetes pequeños y listo para cocinar' 'Aguja de ternera en formato Tomahawk' 'Hamburguesas elaboradas artesanalmente con 100% carne de ternera' 'Roast beef de ternera preparado a partir de lomo bajo' 'Lote compuesto por 2 Tomahawk de aguja de ternera')
          en_short=('Beef brisket cut into small steaks and ready to cook' 'Beef chuck in Tomahawk format' 'Handmade burgers prepared with 100% beef' 'Beef roast prepared from striploin' 'Box containing 2 beef chuck Tomahawks')
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"
            es="/tmp/es-${i}.html"; en="/tmp/en-${i}.html"
            esc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO batch07 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$es" "https://www.elmercadodeorigen.com/product/${s}/?emdo_b7_es=${GITHUB_RUN_ID}-${i}")
            enc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO batch07 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$en" "https://www.elmercadodeorigen.com/en/product/${s}/?emdo_b7_en=${GITHUB_RUN_ID}-${i}")
            esok=yes; enok=yes
            grep -Fq "${es_short[$i]}" "$es" || esok=no
            grep -Fq "${es_body[$i]}" "$es" || esok=no
            grep -Fq 'Sobre Tolecarnes' "$es" || esok=no
            grep -Fq 'Preguntas frecuentes' "$es" || esok=no
            grep -Fq "${en_short[$i]}" "$en" || enok=no
            grep -Fq "${en_body[$i]}" "$en" || enok=no
            grep -Fq 'About Tolecarnes' "$en" || enok=no
            grep -Fq 'Frequently asked questions' "$en" || enok=no
            if grep -Fq 'Sobre Tolecarnes' "$en" || grep -Fq 'Preguntas frecuentes' "$en"; then enok=no; fi
            status=OK
            if [[ "$esc" != 200 || "$enc" != 200 || "$esok" != yes || "$enok" != yes ]]; then status=FAIL; failures=$((failures+1)); fi
            echo "VERIFY slug=${s} ES_HTTP=${esc} ES=${esok} EN_HTTP=${enc} EN=${enok} STATUS=${status}"
          done
          echo "BATCH07_PUBLIC_FAILURES=${failures}"
          [[ "$failures" -eq 0 ]]

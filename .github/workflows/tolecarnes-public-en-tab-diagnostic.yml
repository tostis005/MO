name: Inspect public English Tolecarnes description tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect two English description tabs
        shell: bash
        run: |
          set -euo pipefail
          declare -A paths
          paths[carne]='carne-picada-extra'
          paths[entrecot]='entrecot-de-lomo-bajo'
          for key in carne entrecot; do
            f="/tmp/${key}.html"
            curl -L -sS --connect-timeout 8 --max-time 20 -A 'Mozilla/5.0 EMDO tab verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o "$f" "https://www.elmercadodeorigen.com/en/product/${paths[$key]}/?emdo_tab_verify=${GITHUB_RUN_ID}-${key}"
            echo "==== ${key} ===="
            if [[ "$key" == carne ]]; then
              checks=(
                '100% natural beef with no additives.'
                'Carne 100% Ternera Natural sin aditivos.'
                'An everyday kitchen staple'
                'Una carne para el día a día'
                'Ground beef is one of those ingredients that can be used in many different ways.'
                'La carne picada es una de esas opciones'
                'About Tolecarnes'
                'Sobre Tolecarnes'
                'Frequently asked questions'
                'Preguntas frecuentes'
              )
            else
              checks=(
                'Esta pieza se selecciona de la parte del lomo bajo sin hueso, muy tierna y sabrosa.'
                'A tender boneless loin steak'
                'Un entrecot tierno y sabroso'
                'The striploin entrecot comes from the lower loin area'
                'El entrecot de lomo bajo procede'
                'About Tolecarnes'
                'Sobre Tolecarnes'
                'Frequently asked questions'
                'Preguntas frecuentes'
              )
            fi
            for q in "${checks[@]}"; do
              if grep -Fq "$q" "$f"; then echo "FOUND: $q"; else echo "MISS: $q"; fi
            done
            echo '-- tab markers --'
            grep -n -m 5 -E 'tab-description|woocommerce-Tabs-panel|Description</h2>|Descripción</h2>' "$f" || true
            echo '-- old/new text context --'
            python3 - "$f" <<'PY'
import sys,re,html
p=sys.argv[1]
s=open(p,'r',encoding='utf-8',errors='ignore').read()
needles=['100% natural beef with no additives.','Carne 100% Ternera Natural sin aditivos.','An everyday kitchen staple','Una carne para el día a día','Esta pieza se selecciona de la parte del lomo bajo','A tender boneless loin steak','Un entrecot tierno y sabroso','About Tolecarnes','Sobre Tolecarnes']
for n in needles:
    i=s.find(n)
    if i>=0:
        chunk=s[max(0,i-350):i+700]
        chunk=re.sub(r'\s+',' ',chunk)
        print('CONTEXT',n,':',chunk[:1100])
PY
          done

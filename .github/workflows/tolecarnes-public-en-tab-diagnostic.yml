name: Inspect product image wrapper chain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect wrapper chain
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?wrappers='+Date.now(),{waitUntil:'networkidle',timeout:90000});
            const out=await page.evaluate(()=>{
              const img=document.querySelector('.product-gallery .product-images img');
              const arr=[];
              for(let e=img;e && arr.length<8;e=e.parentElement){
                const r=e.getBoundingClientRect(),s=getComputedStyle(e);
                arr.push({tag:e.tagName,cls:e.className||'',id:e.id||'',w:Math.round(r.width),h:Math.round(r.height),height:s.height,width:s.width,display:s.display,position:s.position,overflow:s.overflow,transform:s.transform});
                if(e.classList && e.classList.contains('product-images')) break;
              }
              return arr;
            });
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js

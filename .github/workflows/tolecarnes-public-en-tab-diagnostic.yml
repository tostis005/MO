name: Verify La Huerta de Ana Mary batch 01 public pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Spanish and English rendered pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(patatas-blancas calabacin brocoli 20-kg-de-patatas-blancas-variedad-kennebec flores-de-calabacin-8-unidades)
          es_body=('Patata Kennebec de Fresno de la Vega' 'Una hortaliza suave y muy versátil' 'Brócoli fresco para preparaciones sencillas' '20 kg de patata Kennebec' 'Flores de calabacín frescas')
          en_body=('Kennebec potatoes from Fresno de la Vega' 'A mild and highly versatile vegetable' 'Fresh broccoli for simple cooking' '20 kg of Kennebec potatoes' 'Fresh courgette flowers')
          es_short=('Patatas blancas variedad Kennebec' 'Calabacín fresco cultivado en Fresno de la Vega' 'Brócoli fresco cultivado en Fresno de la Vega' 'Formato de 20 kg de patata blanca variedad Kennebec' 'Caja de 8 flores de calabacín frescas')
          en_short=('White Kennebec potatoes grown in Fresno de la Vega' 'Fresh courgette grown in Fresno de la Vega' 'Fresh broccoli grown in Fresno de la Vega' '20 kg format of white Kennebec potatoes' 'Box of 8 fresh courgette flowers')
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"
            es="/tmp/es-${i}.html"; en="/tmp/en-${i}.html"
            esc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO huerta01 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$es" "https://www.elmercadodeorigen.com/product/${s}/?emdo_h1_es=${GITHUB_RUN_ID}-${i}")
            enc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO huerta01 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$en" "https://www.elmercadodeorigen.com/en/product/${s}/?emdo_h1_en=${GITHUB_RUN_ID}-${i}")
            esok=yes; enok=yes
            grep -Fq "${es_short[$i]}" "$es" || esok=no
            grep -Fq "${es_body[$i]}" "$es" || esok=no
            grep -Fq 'Sobre La Huerta de Ana Mary' "$es" || esok=no
            grep -Fq 'Preguntas frecuentes' "$es" || esok=no
            grep -Fq "${en_short[$i]}" "$en" || enok=no
            grep -Fq "${en_body[$i]}" "$en" || enok=no
            grep -Fq 'About La Huerta de Ana Mary' "$en" || enok=no
            grep -Fq 'Frequently asked questions' "$en" || enok=no
            if grep -Fq 'Sobre La Huerta de Ana Mary' "$en" || grep -Fq 'Preguntas frecuentes' "$en"; then enok=no; fi
            status=OK
            if [[ "$esc" != 200 || "$enc" != 200 || "$esok" != yes || "$enok" != yes ]]; then status=FAIL; failures=$((failures+1)); fi
            echo "VERIFY slug=${s} ES_HTTP=${esc} ES=${esok} EN_HTTP=${enc} EN=${enok} STATUS=${status}"
          done
          echo "HUERTA_BATCH01_PUBLIC_FAILURES=${failures}"
          [[ "$failures" -eq 0 ]]

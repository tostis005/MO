# footer-spacing-source
name: Inspect product footer spacing source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect footer spacing chain
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?footer_chain='+Date.now(),{waitUntil:'networkidle',timeout:90000});
            const out=await page.evaluate(()=>{
              const info=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,cls:e.className||'',id:e.id||'',top:Math.round(r.top),bottom:Math.round(r.bottom),h:Math.round(r.height),margin:s.margin,padding:s.padding,marginBottom:s.marginBottom,paddingBottom:s.paddingBottom};};
              const sels=['#content','.site-content','.site-main','main#main','.content-area','.woocommerce','.woocommerce-page','div.product','div.product > .woostify-container','.related.products','footer.site-footer'];
              const nodes={}; for(const s of sels) nodes[s]=info(document.querySelector(s));
              const related=document.querySelector('.related.products'); const chain=[]; for(let e=related;e&&chain.length<7;e=e.parentElement) chain.push(info(e));
              return {nodes,chain};
            });
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js

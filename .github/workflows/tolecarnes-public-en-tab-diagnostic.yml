# spacing-audit-trigger
name: Inspect product spacing and footer gap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect layout geometry
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const cfg of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height}});
              await page.goto('https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?spacing_audit='+Date.now(),{waitUntil:'networkidle',timeout:90000});
              const out=await page.evaluate(()=>{
                const info=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),top:Math.round(r.top),bottom:Math.round(r.bottom),margin:s.margin,padding:s.padding,bg:s.backgroundColor,display:s.display,gap:s.gap};};
                const q=s=>document.querySelector(s);
                const nav=q('.woostify-product-navigation');
                const gallery=q('.product-gallery');
                const summary=q('.product-summary');
                const frame=q('.product-gallery .product-images');
                const related=q('.related.products,.related');
                const footer=q('footer#colophon,.site-footer,#colophon,footer.site-footer');
                const productContainer=q('.product-page-container > .woostify-container');
                const tabs=q('.woocommerce-tabs');
                return {
                  nav:info(nav), gallery:info(gallery), summary:info(summary), frame:info(frame), productContainer:info(productContainer), tabs:info(tabs), related:info(related), footer:info(footer),
                  navGap:(nav&&gallery)?Math.round(gallery.getBoundingClientRect().top-nav.getBoundingClientRect().bottom):null,
                  rightBlank:(gallery&&summary)?Math.round(gallery.getBoundingClientRect().bottom-summary.getBoundingClientRect().bottom):null,
                  footerGap:(related&&footer)?Math.round(footer.getBoundingClientRect().top-related.getBoundingClientRect().bottom):null,
                  bodyH:document.body.scrollHeight
                };
              });
              console.log('SPACING',cfg.name,JSON.stringify(out));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js

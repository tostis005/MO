name: Inspect product spacing and description DOM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect rendered product structure
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?dom_inspect='+Date.now(),{waitUntil:'networkidle',timeout:90000});
            const out=await page.evaluate(()=>{
              const info=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,cls:e.className,id:e.id,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),margin:s.margin,padding:s.padding,bg:s.backgroundColor,display:s.display,position:s.position};};
              const nav=document.querySelector('.woostify-product-navigation');
              const ct=document.querySelector('.content-top');
              const ctc=document.querySelector('.content-top > .woostify-container');
              const pp=document.querySelector('.product-page-container');
              const ppc=document.querySelector('.product-page-container > .woostify-container');
              const gal=document.querySelector('.product-gallery');
              const tabs=document.querySelector('.woocommerce-tabs');
              const desc=document.querySelector('#tab-description');
              const rel=document.querySelector('.related');
              const ancestors=e=>{const a=[];for(let n=e;n&&a.length<6;n=n.parentElement)a.push(info(n));return a;};
              return {bodyClass:document.body.className,nav:info(nav),contentTop:info(ct),contentTopContainer:info(ctc),productPage:info(pp),productPageContainer:info(ppc),gallery:info(gal),tabs:info(tabs),desc:info(desc),related:info(rel),tabsAncestors:ancestors(tabs),productPageAncestors:ancestors(pp)};
            });
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js

name: Inspect supplier cycle completion hook 0.10.279

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect supplier scheduler and review module
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          : "${PROD_PATH:?production path not found}"
          echo '=== SCHEDULER ==='
          sed -n '1,340p' "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-scheduler.php"
          echo '=== REVIEW MODULE TAIL ==='
          sed -n '1,420p' "$PROD_PATH/wp-content/mu-plugins/z-mdo-review-count-sync-010279.php"
          echo '=== COUNTS ==='
          for k in mdo_google_review_count_010279 mdo_trustpilot_review_count_010279 mdo_review_counts_last_sync_010279; do printf '%s=' "$k"; "$php_bin" "$wp_bin" option get "$k" --path="$PROD_PATH" --skip-plugins --skip-themes --allow-root 2>/dev/null || true; done
          REMOTE

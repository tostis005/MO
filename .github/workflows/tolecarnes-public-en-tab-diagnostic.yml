name: Deploy product detail refinement 0.10.277

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/z-mdo-product-detail-refinement-010270.php'
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate refinement
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/z-mdo-product-detail-refinement-010270.php
          grep -Fq 'mdo-product-detail-refinement-010277' mu-plugins/z-mdo-product-detail-refinement-010270.php
          grep -Fq 'padding-bottom: 18px' mu-plugins/z-mdo-product-detail-refinement-010270.php
          grep -Fq 'width: 100vw' mu-plugins/z-mdo-product-detail-refinement-010270.php
      - name: Deploy refinement to production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          source='mu-plugins/z-mdo-product-detail-refinement-010270.php'
          base="$(basename "$source")"
          target="$PROD_PATH/wp-content/mu-plugins/$base"
          remote="/tmp/${base%.php}-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS "$source" "$STAGING_USER@$STAGING_HOST:$remote"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$target' ]; then cp '$target' '$target.bak-${GITHUB_RUN_ID}'; fi; install -m 0644 '$remote' '$target'; rm -f '$remote'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$target'"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify white navigation breathing space
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const cfg of [{name:'desktop',width:1440,height:1000,gap:18},{name:'mobile',width:390,height:844,gap:14}]){
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height}});
              await page.goto('https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?nav_white='+Date.now(),{waitUntil:'networkidle',timeout:90000});
              const m=await page.evaluate(()=>{
                const top=document.querySelector('.content-top');
                const nav=document.querySelector('.woostify-product-navigation');
                const gallery=document.querySelector('.product-gallery');
                const frame=document.querySelector('.product-gallery .product-images');
                const related=document.querySelector('.related');
                const footer=document.querySelector('.site-footer');
                const tr=top?.getBoundingClientRect(), nr=nav?.getBoundingClientRect(), gr=gallery?.getBoundingClientRect(), fr=frame?.getBoundingClientRect(), rr=related?.getBoundingClientRect(), fur=footer?.getBoundingClientRect();
                const s=top?getComputedStyle(top):null;
                const a=top?getComputedStyle(top,'::after'):null;
                return {
                  marker:!!document.querySelector('#mdo-product-detail-refinement-010277'),
                  paddingBottom:s?.paddingBottom||null,
                  marginBottom:s?.marginBottom||null,
                  afterBg:a?.backgroundColor||null,
                  afterHeight:a?.height||null,
                  afterWidth:a?.width||null,
                  navGap:(nr&&gr)?Math.round(gr.top-nr.bottom):null,
                  frameW:fr?Math.round(fr.width):null,
                  frameH:fr?Math.round(fr.height):null,
                  relatedFooterGap:(rr&&fur)?Math.round(fur.top-rr.bottom):null
                };
              });
              console.log('WHITE_GAP',cfg.name,JSON.stringify(m));
              if(!m.marker) throw new Error('marker missing');
              if(m.marginBottom !== '0px') throw new Error('margin gap still active');
              if(m.paddingBottom !== cfg.gap+'px') throw new Error('wrong padding: '+m.paddingBottom);
              if(m.afterBg !== 'rgb(255, 255, 255)') throw new Error('gap is not white');
              if(m.afterHeight !== cfg.gap+'px') throw new Error('wrong white strip height: '+m.afterHeight);
              if(m.navGap !== cfg.gap) throw new Error('visual nav gap mismatch: '+m.navGap);
              if(cfg.name==='desktop' && m.frameH !== 620) throw new Error('desktop gallery changed');
              if(cfg.name==='mobile' && m.frameH > 450) throw new Error('mobile gallery changed');
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.js

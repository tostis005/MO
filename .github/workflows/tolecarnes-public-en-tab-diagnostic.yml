name: Inspect product gallery proportions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect gallery geometry
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for (const cfg of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]) {
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height}});
              await page.goto('https://www.elmercadodeorigen.com/producto/jamon-de-bellota-100-iberico/?gallery_inspect='+Date.now(),{waitUntil:'networkidle',timeout:90000});
              const out=await page.evaluate(()=>{
                const info=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,cls:e.className,id:e.id,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:s.display,position:s.position,overflow:s.overflow,objectFit:s.objectFit,maxHeight:s.maxHeight,height:s.height,padding:s.padding,margin:s.margin,bg:s.backgroundColor};};
                const sels=['.product-gallery','.product-gallery .product-images','.product-gallery .product-image','.product-gallery .woocommerce-product-gallery__wrapper','.product-gallery .slick-list','.product-gallery .slick-track','.product-gallery .slick-slide','.product-gallery img','.product-thumbnail-images','.product-thumbnail-images .slick-list','.product-thumbnail-images img','.product-summary','.woocommerce-tabs','#tab-description','.related'];
                const nodes={};
                for(const s of sels) nodes[s]=info(document.querySelector(s));
                const imgs=[...document.querySelectorAll('.product-gallery img')].slice(0,8).map((img,i)=>({i,...info(img),naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,src:(img.currentSrc||img.src||'').split('?')[0].slice(-120)}));
                return {nodes,imgs};
              });
              console.log('GALLERY',cfg.name,JSON.stringify(out));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js

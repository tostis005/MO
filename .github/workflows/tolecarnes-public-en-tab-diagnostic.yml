name: Apply La Huerta batch 05 to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply batch 05
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          php -l .github/scripts/huerta-anamary-products-batch-05-production.php >/dev/null
          grep -Fq 'Repollo' .github/scripts/huerta-anamary-products-batch-05-production.php
          grep -Fq 'Guindillas en vinagre 720 ml' .github/scripts/huerta-anamary-products-batch-05-production.php
          grep -Fq 'La recolección se organiza en función de los pedidos' .github/scripts/huerta-anamary-products-batch-05-production.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;; esac; done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE=/tmp/huerta-batch05-${GITHUB_RUN_ID}.php
          sshpass -e scp $SCP_OPTIONS .github/scripts/huerta-anamary-products-batch-05-production.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify ten public pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(repollo mermelada-artesana-de-puerro-250-ml mermelada-artesana-de-pimiento-250-ml mermelada-artesana-de-tomate-250-ml guindillas-en-vinagre-720-ml)
          es_body=('Un repollo para platos de cuchara, salteados y ensaladas' 'Una mermelada salada de puerro con solo dos ingredientes' 'Mermelada de pimiento rojo de elaboración artesanal' 'Mermelada de tomate con una receta sencilla' 'Guindillas verdes en vinagre listas para servir')
          en_body=('A cabbage for stews, sautés and salads' 'A savoury leek jam made with just two ingredients' 'Traditionally prepared red pepper jam' 'Tomato jam with a simple recipe' 'Green guindilla peppers in vinegar, ready to serve')
          es_short=('Repollo fresco vendido por unidad' 'Mermelada artesana de puerro en tarro de cristal de 250 ml' 'Mermelada artesana de pimiento en tarro de cristal de 250 ml' 'Mermelada artesana de tomate en tarro de cristal de 250 ml' 'Guindillas verdes en vinagre de elaboración artesanal')
          en_short=('Fresh cabbage sold by the unit' 'Artisan leek jam in a 250 ml glass jar' 'Artisan pepper jam in a 250 ml glass jar' 'Artisan tomato jam in a 250 ml glass jar' 'Traditionally prepared green guindilla peppers in vinegar')
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"; es=/tmp/es-${i}.html; en=/tmp/en-${i}.html
            esc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO huerta05 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$es" "https://www.elmercadodeorigen.com/product/${s}/?emdo_h5_es=${GITHUB_RUN_ID}-${i}")
            enc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO huerta05 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$en" "https://www.elmercadodeorigen.com/en/product/${s}/?emdo_h5_en=${GITHUB_RUN_ID}-${i}")
            esok=yes; enok=yes
            grep -Fq "${es_short[$i]}" "$es" || esok=no
            grep -Fq "${es_body[$i]}" "$es" || esok=no
            grep -Fq 'Sobre La Huerta de Ana Mary' "$es" || esok=no
            grep -Fq 'Preguntas frecuentes' "$es" || esok=no
            grep -Fq 'La recolección se organiza en función de los pedidos' "$es" || esok=no
            grep -Fq "${en_short[$i]}" "$en" || enok=no
            grep -Fq "${en_body[$i]}" "$en" || enok=no
            grep -Fq 'About La Huerta de Ana Mary' "$en" || enok=no
            grep -Fq 'Frequently asked questions' "$en" || enok=no
            grep -Fq 'Harvesting is organised around orders' "$en" || enok=no
            if grep -Fq 'Sobre La Huerta de Ana Mary' "$en" || grep -Fq 'Preguntas frecuentes' "$en"; then enok=no; fi
            status=OK
            if [[ "$esc" != 200 || "$enc" != 200 || "$esok" != yes || "$enok" != yes ]]; then status=FAIL; failures=$((failures+1)); fi
            echo "VERIFY slug=${s} ES_HTTP=${esc} ES=${esok} EN_HTTP=${enc} EN=${enok} STATUS=${status}"
          done
          echo "HUERTA_BATCH05_PUBLIC_FAILURES=${failures}"
          [[ "$failures" -eq 0 ]]

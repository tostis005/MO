name: Verify public Tolecarnes batch 06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-public-en-tab-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Spanish and English rendered pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(ragout-de-pito-de-vacuno lote-filetes-magro tomahawk-de-ternera aleta-de-ternera-para-rellenar lote-barbacoa)
          es_body=('Carne troceada para guisos con sabor' 'Dos tipos de carne en un mismo lote' 'Un chuletón con todo el hueso de la costilla' 'Preparada para rellenar en casa' 'Un lote pensado para la barbacoa')
          en_body=('Diced beef for flavourful stews' 'Two types of beef in one box' 'A rib steak with the full rib bone' 'Prepared for stuffing at home' 'A box designed for the barbecue')
          es_short=('Ragout de pito de vacuno, preparado a partir de una pieza situada próxima a la entraña' 'Lote de ternera de aproximadamente 3 kg en total' 'Chuletón de ternera en formato Tomahawk' 'Aleta de ternera preparada ya abierta para rellenar en casa' 'Lote preparado para barbacoa con 2 kg de churrasco de ternera')
          en_short=('Beef pito ragout, prepared from a cut located close to the skirt area' 'Beef box weighing approximately 3 kg in total' 'Beef Tomahawk steak with the loin medallion attached to the long rib bone' 'Beef flank prepared already opened out for stuffing at home' 'Barbecue box containing 2 kg of beef churrasco')
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"
            es="/tmp/es-${i}.html"; en="/tmp/en-${i}.html"
            esc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO batch06 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$es" "https://www.elmercadodeorigen.com/product/${s}/?emdo_b6_es=${GITHUB_RUN_ID}-${i}")
            enc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO batch06 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$en" "https://www.elmercadodeorigen.com/en/product/${s}/?emdo_b6_en=${GITHUB_RUN_ID}-${i}")
            esok=yes; enok=yes
            grep -Fq "${es_short[$i]}" "$es" || esok=no
            grep -Fq "${es_body[$i]}" "$es" || esok=no
            grep -Fq 'Sobre Tolecarnes' "$es" || esok=no
            grep -Fq 'Preguntas frecuentes' "$es" || esok=no
            grep -Fq "${en_short[$i]}" "$en" || enok=no
            grep -Fq "${en_body[$i]}" "$en" || enok=no
            grep -Fq 'About Tolecarnes' "$en" || enok=no
            grep -Fq 'Frequently asked questions' "$en" || enok=no
            if grep -Fq 'Sobre Tolecarnes' "$en" || grep -Fq 'Preguntas frecuentes' "$en"; then enok=no; fi
            status=OK
            if [[ "$esc" != 200 || "$enc" != 200 || "$esok" != yes || "$enok" != yes ]]; then status=FAIL; failures=$((failures+1)); fi
            echo "VERIFY slug=${s} ES_HTTP=${esc} ES=${esok} EN_HTTP=${enc} EN=${enok} STATUS=${status}"
          done
          echo "BATCH06_PUBLIC_FAILURES=${failures}"
          [[ "$failures" -eq 0 ]]

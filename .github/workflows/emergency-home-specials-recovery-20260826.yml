name: Emergency recover homepage Specials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-home-specials-recovery-20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-home-specials-recovery-20260826-alt
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback main plugin
        shell: bash
        run: |
          set -euo pipefail
          php -l mdo-supplier-sync/mdo-supplier-sync.php
          ! grep -Fq 'class-mdo-home-specials.php' mdo-supplier-sync/mdo-supplier-sync.php
          ! grep -Fq 'MDO_Home_Specials::init' mdo-supplier-sync/mdo-supplier-sync.php

      - name: Restore production homepage immediately
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_MAIN="/tmp/mdo-main-rollback-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS mdo-supplier-sync/mdo-supplier-sync.php "$STAGING_USER@$STAGING_HOST:$REMOTE_MAIN"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_MAIN'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_MAIN="$2"
          PLUGIN_DIR="$PROD_PATH/wp-content/plugins/mdo-supplier-sync"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"
          test -n "$php_bin"
          test -d "$PLUGIN_DIR"

          cp "$REMOTE_MAIN" "$PLUGIN_DIR/mdo-supplier-sync.php"
          rm -f "$REMOTE_MAIN"
          rm -f "$PLUGIN_DIR/includes/class-mdo-home-specials.php"
          rm -f "$PLUGIN_DIR/assets/css/home-specials.css"

          "$php_bin" -l "$PLUGIN_DIR/mdo-supplier-sync.php" >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$PROD_PATH" --allow-root >/dev/null || true
          if "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active wp-rocket --path="$PROD_PATH" --allow-root >/dev/null 2>&1; then
            "$php_bin" -d memory_limit=512M "$wp_bin" rocket clean --confirm --path="$PROD_PATH" --allow-root >/dev/null 2>&1 || true
          fi

          stamp=$(date +%s%N)
          es=$(curl -k -L -sS --connect-timeout 5 --max-time 20 -o /tmp/home-rollback-es.html -w '%{http_code}' "https://www.elmercadodeorigen.com/?rollback=$stamp" || true)
          en=$(curl -k -L -sS --connect-timeout 5 --max-time 20 -o /tmp/home-rollback-en.html -w '%{http_code}' "https://www.elmercadodeorigen.com/en/?rollback=$stamp" || true)
          test "$es" = '200'
          test "$en" = '200'
          ! grep -Fq 'mdo-home-specials' /tmp/home-rollback-es.html
          ! grep -Fq 'mdo-home-specials' /tmp/home-rollback-en.html

          echo 'ROLLBACK=success'
          echo 'HOME_ES=200'
          echo 'HOME_EN=200'
          REMOTE

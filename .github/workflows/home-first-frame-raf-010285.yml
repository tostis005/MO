name: Home first-frame producer trace 010285

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-first-frame-raf-010285.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sample producer geometry every animation frame
        id: trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' | tee runtime/home-first-frame-raf-010285.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1350,height:940}});
            await page.addInitScript(()=>{
              window.__emoFrames=[];
              const snap=()=>{
                const card=document.querySelector('.emo-hero-card--1');
                const visual=document.querySelector('.emo-hero__visual--vendors');
                const nav=document.querySelector('#site-navigation');
                if(!card||!visual)return;
                const pack=e=>{const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {r:[+r.x.toFixed(1),+r.y.toFixed(1),+r.width.toFixed(1),+r.height.toFixed(1)],d:c.display,pos:c.position,w:c.width,h:c.height,minw:c.minWidth,minh:c.minHeight,gc:c.gridColumn,gr:c.gridRow,cols:c.gridTemplateColumns,rows:c.gridTemplateRows,tr:c.transform,contain:c.contain}};
                const row={t:+performance.now().toFixed(1),card:pack(card),visual:pack(visual),nav:nav?pack(nav):null,ready:document.readyState};
                const prev=window.__emoFrames.at(-1);
                if(!prev||JSON.stringify({c:prev.card,v:prev.visual,n:prev.nav})!==JSON.stringify({c:row.card,v:row.visual,n:row.nav})) window.__emoFrames.push(row);
              };
              const mo=new MutationObserver(()=>{snap();});
              mo.observe(document,{childList:true,subtree:true});
              const loop=()=>{snap();if(performance.now()<6000)requestAnimationFrame(loop)};
              requestAnimationFrame(loop);
            });
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1200);
            const rows=await page.evaluate(()=>window.__emoFrames||[]);
            console.log(JSON.stringify(rows,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Record trace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-first-frame-raf-010285.txt ] || printf 'trace=%s\n' '${{ steps.trace.outcome }}' > runtime/home-first-frame-raf-010285.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-first-frame-raf-010285.txt
          git commit -m 'Record Home producer first-frame geometry' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Home transient delete 0.10.258 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-transient-delete-010258-production.yml'

permissions:
  contents: write

jobs:
  delete-regenerate-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete exact transient
        id: flush
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            grep -q '! is_front_page()' \"\$THEME/inc/semantic-polish.php\"
            grep -q \"ELMERCADO_THEME_VERSION', '0.10.258\" \"\$THEME/functions.php\"
            critical=\"\$THEME/assets/css/critical-woostify-home.min.css\"
            stamp=\$(stat -c %Y \"\$critical\")
            wp_bin=\$(command -v wp)
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            home=\$(\"\$php_bin\" \"\$wp_bin\" option get home --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root)
            digest=\$(\"\$php_bin\" -r 'echo md5(\$argv[1]);' \"0.10.258|\$stamp|\$home\")
            key=\"elmercado_home_\$digest\"
            echo \"deleting=\$key\"
            \"\$php_bin\" \"\$wp_bin\" transient delete \"\$key\" --path='$PROD_PATH' --skip-plugins --skip-themes --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
          "
      - name: Regenerate and verify
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          HTML=/tmp/home-regenerated-010258.html
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          h1=$(grep -c 'visibleHeadingOne' "$HTML" || true)
          {
            printf 'flush=success\n'
            printf 'visibleHeadingOne=%s\n' "$h1"
            printf 'version_010258=%s\n' "$(grep -c 'home-deferred-0.10.258.css' "$HTML" || true)"
            printf 'mobile_hitareas=%s\n' "$(grep -c 'id="elmercado-mobile-header-hitareas-final"' "$HTML" || true)"
            printf 'catalog_parity=%s\n' "$(grep -c 'id="elmercado-catalog-mobile-controls-parity-script-010236"' "$HTML" || true)"
            printf 'ads_marker=%s\n' "$(grep -c 'elmercado-delayed-google-ads-source' "$HTML" || true)"
            printf 'hustle_inline=%s\n' "$(grep -c 'hustle_inline_styles_front-inline-css' "$HTML" || true)"
          } > runtime/home-transient-delete-010258.txt
          cat runtime/home-transient-delete-010258.txt
          test "$h1" -eq 0
      - name: Record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-transient-delete-010258.txt ] || printf 'flush=%s\nverify=%s\n' '${{ steps.flush.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-transient-delete-010258.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-transient-delete-010258.txt
          git commit -m 'Record Home exact transient regeneration' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish blog expansion batch 03 production

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/blog-expansion-03-*.b64'
      - '.github/scripts/publish-blog-expansion-03-production.php'
      - '.github/workflows/publish-blog-expansion-03-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate editorial package
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-blog-expansion-03-production.php
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re
          base=pathlib.Path('.github/scripts')
          encoded=''.join((base/f'blog-expansion-03-{i}.b64').read_text(encoding='utf-8').strip() for i in range(1,5))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='00f4aac76f0cb0ac6211005a3e0cc63cd30dac1fc2232788d462a8d3ff5883f1'
          decoded=gzip.decompress(compressed)
          assert hashlib.sha256(decoded).hexdigest()=='a79f9ef2a3c94dd8fba16d86e92598c92ebdca06ecf195193ef91a9d9e817566'
          articles=json.loads(decoded.decode('utf-8'))
          required={
              'pos','title','slug','excerpt','content','seo_title','seo_description','focus_keyword',
              'en_title','en_slug','en_excerpt','en_content','en_seo_title','en_seo_description','en_focus_keyword',
              'category_slug','category_name','product_cat_slug','product_cat_name','related_heading','en_related_heading'
          }
          assert len(articles)==10
          assert sorted(int(a['pos']) for a in articles)==list(range(21,31))
          assert len({a['slug'] for a in articles})==10
          assert len({a['en_slug'] for a in articles})==10
          allowed_blog={'aceites','hortalizas-y-verduras','carnes','jamones-y-paletas'}
          allowed_product={'aceites','hortalizas-verduras','carnes','jamones-paletas'}
          for a in articles:
              assert required <= a.keys(), (a.get('slug'), sorted(required-a.keys()))
              assert '<!-- EMDO_RELATED_PRODUCTS -->' in a['content'], a['slug']
              assert '<!-- EMDO_RELATED_PRODUCTS -->' in a['en_content'], a['slug']
              es=len(re.findall(r"\b\w+\b",re.sub(r'<[^>]+>',' ',a['content']),flags=re.UNICODE))
              en=len(re.findall(r"\b[A-Za-z][A-Za-z'-]*\b",re.sub(r'<[^>]+>',' ',a['en_content'])))
              assert es>=850 and en>=750, (a['slug'],es,en)
              assert a['category_slug'] in allowed_blog, a['slug']
              assert a['product_cat_slug'] in allowed_product, a['slug']
          pathlib.Path('/tmp/emdo-blog03.json').write_text(json.dumps(articles,ensure_ascii=False),encoding='utf-8')
          print('EDITORIAL_PACKAGE_OK=10')
          PY
          : "${STAGING_HOST:?Missing STAGING_HOST}"
          : "${STAGING_USER:?Missing STAGING_USER}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD}"

      - name: Publish with preflight, rollback and public verification
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-P $PORT -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          UA="Mozilla/5.0 EMDO safe blog expansion publication verification"
          mapfile -t TARGET_SLUGS < <(jq -r '.[].slug' /tmp/emdo-blog03.json)
          [ "${#TARGET_SLUGS[@]}" -eq 10 ]

          CRITICAL_URLS=(
            'https://www.elmercadodeorigen.com/'
            'https://www.elmercadodeorigen.com/tienda/'
            'https://www.elmercadodeorigen.com/blog/'
            'https://www.elmercadodeorigen.com/category/aceites/'
            'https://www.elmercadodeorigen.com/category/hortalizas-y-verduras/'
            'https://www.elmercadodeorigen.com/category/carnes/'
            'https://www.elmercadodeorigen.com/category/jamones-y-paletas/'
          )
          health_check() {
            local phase="$1"; shift
            for url in "$@"; do
              local file code bytes
              file="/tmp/health-${phase}-$(echo "$url"|tr '/:?&=' '_').html"
              code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$file" -w '%{http_code}' "${url}?emdo_health=${GITHUB_RUN_ID}-${phase}")"
              [ "$code" = "200" ] || { echo "Health ${phase}: HTTP ${code} ${url}" >&2; return 1; }
              bytes="$(wc -c < "$file")"
              [ "$bytes" -gt 5000 ] || { echo "Health ${phase}: small response ${bytes} ${url}" >&2; return 1; }
              grep -qi '</html>' "$file" || { echo "Health ${phase}: incomplete HTML ${url}" >&2; return 1; }
              echo "health_ok phase=${phase} http=${code} bytes=${bytes} url=${url}"
            done
          }
          health_check pre "${CRITICAL_URLS[@]}"

          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in
                https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break ;;
              esac
            done
            [ -n "$prod" ] || exit 4
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-blog-expansion-03-${GITHUB_RUN_ID}"

          for slug in "${TARGET_SLUGS[@]}"; do
            ids="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post list --path='$PROD' --allow-root --post_type=post --name='$slug' --format=ids 2>/dev/null || true")"
            [ -z "${ids// /}" ] || { echo "Safety stop: slug exists: ${slug} (${ids})" >&2; exit 10; }
          done

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/blog-expansion-03-{1,2,3,4}.b64 \
            .github/scripts/publish-blog-expansion-03-production.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          ROLLBACK_ACTIVE=1
          rollback_only_new_posts() {
            rc=$?
            if [ "${ROLLBACK_ACTIVE:-0}" = "1" ]; then
              echo "Verification failed: rolling back only the 10 new posts." >&2
              set +e
              for slug in "${TARGET_SLUGS[@]}"; do
                ids="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post list --path='$PROD' --allow-root --post_type=post --name='$slug' --format=ids 2>/dev/null || true")"
                [ -z "${ids// /}" ] || sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' post delete $ids --force --path='$PROD' --allow-root >/dev/null 2>&1 || true"
              done
              sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' rewrite flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" >/dev/null 2>&1 || true
              health_check rollback "${CRITICAL_URLS[@]}" || true
              set -e
            fi
            exit "$rc"
          }
          trap rollback_only_new_posts ERR

          trap - ERR
          set +e
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/publish-blog-expansion-03-production.php' --path='$PROD' --allow-root" > /tmp/blog03.raw 2> /tmp/blog03.err
          PUBLISH_RC=$?
          set -e
          trap rollback_only_new_posts ERR
          echo "publisher_rc=${PUBLISH_RC} stdout_bytes=$(wc -c < /tmp/blog03.raw) stderr_bytes=$(wc -c < /tmp/blog03.err)"
          [ ! -s /tmp/blog03.err ] || cat /tmp/blog03.err >&2
          [ ! -s /tmp/blog03.raw ] || cat /tmp/blog03.raw
          [ "$PUBLISH_RC" -eq 0 ]

          JSON_LINE="$(grep -E '^\{.*\}$' /tmp/blog03.raw | tail -n1 || true)"
          [ -n "$JSON_LINE" ] || { echo 'Publisher emitted no parseable JSON.' >&2; false; }
          printf '%s\n' "$JSON_LINE" > /tmp/blog03-result.json
          jq -e '.verified == true and .count == 10 and .default_featured_image_id == 13442 and (.errors|length)==0 and (.posts|length)==10 and ([.posts[].status]|all(.=="publish")) and ([.posts[].thumbnail_id]|all(.==13442))' /tmp/blog03-result.json >/dev/null

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"

          while IFS=$'\t' read -r slug en_slug title en_title permalink en_permalink category_slug product_cat; do
            es_file="/tmp/post-${slug}.html"; en_file="/tmp/post-${en_slug}.html"
            es_code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$es_file" -w '%{http_code}' "${permalink}?emdo_verify=${GITHUB_RUN_ID}")"
            [ "$es_code" = "200" ]; [ "$(wc -c < "$es_file")" -gt 5000 ]; grep -qi '</html>' "$es_file"; grep -Fq "$title" "$es_file"
            en_code="$(curl -L -sS --retry 3 --retry-delay 2 -A "$UA" -o "$en_file" -w '%{http_code}' "${en_permalink}?emdo_verify=${GITHUB_RUN_ID}")"
            [ "$en_code" = "200" ]; [ "$(wc -c < "$en_file")" -gt 5000 ]; grep -qi '</html>' "$en_file"; grep -Fq "$en_title" "$en_file"
            echo "post_ok es=${permalink} en=${en_permalink} category=${category_slug} products=${product_cat}"
          done < <(jq -r '.posts[]|[.slug,.en_slug,.title,.en_title,.permalink,.en_permalink,.category_slug,.product_cat]|@tsv' /tmp/blog03-result.json)

          for category_slug in aceites hortalizas-y-verduras carnes jamones-y-paletas; do
            category_file="/tmp/category-${category_slug}.html"
            curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/category/${category_slug}/?emdo_verify=${GITHUB_RUN_ID}" -o "$category_file"
            jq -r --arg c "$category_slug" '.posts[]|select(.category_slug==$c)|.slug' /tmp/blog03-result.json | while IFS= read -r slug; do grep -Fq "$slug" "$category_file"; done
          done

          curl -L -sS --retry 3 -A "$UA" "https://www.elmercadodeorigen.com/blog/?emdo_verify=${GITHUB_RUN_ID}" -o /tmp/blog.html
          for slug in $(jq -r '.posts[].slug' /tmp/blog03-result.json); do grep -Fq "$slug" /tmp/blog.html; done

          health_check post "${CRITICAL_URLS[@]}"
          ROLLBACK_ACTIVE=0
          trap - ERR
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"
          echo "SAFE_PUBLICATION_OK: 10 Spanish posts + 10 Falang English versions; categories, default featured image 13442 and related products set; public URLs and site health verified; no rollback needed."

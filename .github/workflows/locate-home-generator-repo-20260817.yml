name: Locate homepage generator in repo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/locate-home-generator-repo-20260817.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate and print generator
        shell: bash
        run: |
          set -euo pipefail
          f="$(find elmercadodeorigen-child/inc -maxdepth 1 -type f -name '*home-category-output-final.php' | head -n1)"
          echo "FILE=$f"
          test -n "$f"
          sed -n '1,260p' "$f"

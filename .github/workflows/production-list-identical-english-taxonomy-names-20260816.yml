name: Production list identical English taxonomy names 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-list-identical-english-taxonomy-names-20260816.yml'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: List identical Spanish and English taxonomy values
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac; done
          : "${ROOT:?missing production}"
          cat >/tmp/mdo-identical-tax.php <<'PHP'
          <?php
          ini_set('memory_limit','512M'); require $argv[1].'/wp-load.php';
          foreach(['product_cat','product_tag'] as $tax){
            echo "===== {$tax} =====\n";
            $terms=get_terms(['taxonomy'=>$tax,'hide_empty'=>false]); if(is_wp_error($terms)) continue;
            foreach($terms as $t){
              $en=(string)get_term_meta($t->term_id,'_en_US_name',true); if($en==='') continue;
              $clean=trim(html_entity_decode(wp_strip_all_tags($en),ENT_QUOTES|ENT_HTML5,'UTF-8'));
              if(mb_strtolower($clean,'UTF-8')===mb_strtolower(trim($t->name),'UTF-8')) echo "{$t->term_id}|{$t->slug}|ES={$t->name}|EN={$clean}|COUNT={$t->count}\n";
            }
          }
          PHP
          "$PHP" -d memory_limit=512M /tmp/mdo-identical-tax.php "$ROOT" 2>/dev/null
          REMOTE

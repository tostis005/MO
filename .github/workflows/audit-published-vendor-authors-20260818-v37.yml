name: Audit published vendor authors v37
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-published-vendor-authors-20260818-v37.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Query authors and profiles
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp=$(command -v wp); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" | sort -Vr | head -1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) echo -n "$p"; break;; esac; done')"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cd '$PROD_PATH'; wp=\$(command -v wp); php=\$(command -v php || true); [ -n \"\$php\" ] || php=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' | sort -Vr | head -1); prefix=\$(\"\$php\" \"\$wp\" db prefix --path='$PROD_PATH' --allow-root); \"\$php\" \"\$wp\" db query \"SELECT p.post_author,u.display_name,COUNT(*) published_products FROM \\${prefix}posts p JOIN \\${prefix}users u ON u.ID=p.post_author WHERE p.post_type='product' AND p.post_status='publish' GROUP BY p.post_author,u.display_name ORDER BY published_products DESC; SELECT u.ID,u.display_name,LEFT(um.meta_value,8000) profile FROM \\${prefix}users u JOIN \\${prefix}usermeta um ON um.user_id=u.ID AND um.meta_key='wcfmmp_profile_settings' ORDER BY u.ID;\" --path='$PROD_PATH' --allow-root" > runtime/published-vendor-authors-v37.txt
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add runtime/published-vendor-authors-v37.txt
          git commit -m 'Record published vendor authors v37' || exit 0
          git push

name: Production English missing-copy audit 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-english-missing-copy-audit-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect dictionary rows and source locations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -u
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=768M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          prefix=$(wp db prefix 2>/dev/null)
          table="${prefix}trp_dictionary_es_es_en_us"
          echo '=== SCHEMA ==='; wp db query "DESCRIBE \`$table\`;" --skip-column-names 2>/dev/null || true
          echo '=== CURRENT ROWS ==='
          wp db query "SELECT id,original,translated,status FROM \`$table\` WHERE original IN ('Filtros','VISITAR','Buscar','TU SELECCIÓN','Revisa tu carrito','Comprueba cantidades y productos antes de continuar. Verás el coste final y las opciones disponibles en el siguiente paso.','Pago protegido durante todo el proceso','Información clara antes de confirmar','Atención cercana si necesitas ayuda') ORDER BY original,id;" --skip-column-names 2>/dev/null || true
          echo '=== SOURCE LOCATIONS ==='
          grep -RniF --include='*.php' --include='*.js' --include='*.css' 'Revisa tu carrito' "$PROD_PATH/wp-content/themes" "$PROD_PATH/wp-content/plugins" "$PROD_PATH/wp-content/mu-plugins" 2>/dev/null | head -n 40 || true
          grep -RniF --include='*.php' --include='*.js' --include='*.css' 'Pago protegido durante todo el proceso' "$PROD_PATH/wp-content/themes" "$PROD_PATH/wp-content/plugins" "$PROD_PATH/wp-content/mu-plugins" 2>/dev/null | head -n 40 || true
          grep -RniF --include='*.php' --include='*.js' --include='*.css' 'Filtros' "$PROD_PATH/wp-content/themes/elmercadodeorigen-child" "$PROD_PATH/wp-content/mu-plugins" 2>/dev/null | head -n 80 || true
          REMOTE

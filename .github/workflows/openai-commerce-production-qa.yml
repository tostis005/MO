name: OpenAI Commerce Production QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-commerce-production-qa.yml'
      - 'tools/openai-commerce-runtime-qa.php'
      - 'mdo-supplier-sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-commerce-production-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate QA script
        run: php -l tools/openai-commerce-runtime-qa.php

      - name: Run production feed QA and health checks
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          REMOTE_QA="/tmp/openai-commerce-runtime-qa-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS tools/openai-commerce-runtime-qa.php "$STAGING_USER@$STAGING_HOST:$REMOTE_QA"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$PROD_PATH' '$REMOTE_QA'" <<'REMOTE'
          set -euo pipefail
          PROD_PATH="$1"
          REMOTE_QA="$2"
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"
          test -n "$php_bin"
          test -f "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/openai/class-mdo-openai-commerce.php"
          test -f "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/openai/class-mdo-openai-feed-access.php"
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$PROD_PATH" --allow-root

          qa_failed=0
          QA_JSON=/tmp/openai-commerce-runtime-qa.json
          QA_ERR=/tmp/openai-commerce-runtime-qa.err
          set +e
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval-file "$REMOTE_QA" --path="$PROD_PATH" --allow-root >"$QA_JSON" 2>"$QA_ERR"
          qa_status=$?
          set -e
          rm -f "$REMOTE_QA"
          if [ -s "$QA_ERR" ]; then cat "$QA_ERR" >&2; fi

          # Treat the JSON report itself as authoritative. WP-CLI eval-file can
          # occasionally normalize an internal exception to exit status 0, so
          # explicitly fail the job whenever the report contains failed checks
          # or catalog validation errors.
          set +e
          "$php_bin" -r '
            $j=json_decode(file_get_contents($argv[1]),true);
            if(!is_array($j)){fwrite(STDERR,"Runtime QA did not return JSON\n"); exit(2);}
            $failures=(int)($j["summary"]["failures"]??0);
            $catalog_errors=(int)($j["catalog"]["errors"]??0);
            printf("Runtime QA: %d checks, %d failures; exportable=%d; catalog errors=%d; warnings=%d\n",$j["summary"]["checks"]??0,$failures,$j["catalog"]["exportable"]??0,$catalog_errors,$j["catalog"]["warnings"]??0);
            foreach(($j["checks"]??[]) as $c){if(empty($c["ok"])) printf("QA FAILURE: %s | %s\n",$c["name"]??"unknown",json_encode($c["detail"]??null,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));}
            if($failures!==0 || $catalog_errors!==0 || empty($j["summary"]["ok"])) exit(3);
          ' "$QA_JSON"
          qa_json_status=$?
          set -e
          if [ "$qa_status" -ne 0 ] || [ "$qa_json_status" -ne 0 ]; then qa_failed=1; fi

          # Generate a fresh native snapshot with delivery explicitly disabled.
          GEN_JSON=/tmp/openai-commerce-generate.json
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '$s=mdo_openai_settings_20260909(); $s["format"]="native_jsonl_gz"; $s["delivery"]="none"; $s["auto_upload"]="0"; $p=new MDO_OpenAI_Commerce_Feed_Provider_20260909($s); echo wp_json_encode($p->generate());' --path="$PROD_PATH" --allow-root >"$GEN_JSON"
          "$php_bin" -r '
            $j=json_decode(file_get_contents($argv[1]),true);
            if(!is_array($j)||empty($j["ok"])) exit(2);
            $errors=(int)($j["report"]["errors"]??-1);
            printf("Generation: exported=%d; retired=%d; errors=%d; warnings=%d; bytes=%d\n",$j["report"]["exported"]??0,$j["report"]["retired"]??0,$errors,$j["report"]["warnings"]??0,$j["report"]["bytes"]??0);
            if($errors!==0) exit(3);
          ' "$GEN_JSON"
          FEED_PATH=$("$php_bin" -d memory_limit=512M "$wp_bin" eval 'echo mdo_openai_feed_path_20260909("native_jsonl_gz");' --path="$PROD_PATH" --allow-root)
          test -f "$FEED_PATH"
          test "$(basename "$FEED_PATH")" = 'mercado-de-origen-products.jsonl.gz'
          gzip -t "$FEED_PATH"

          "$php_bin" -r '
            $f=gzopen($argv[1],"rb"); if(!$f) exit(2); $n=0; $ids=[]; $required=["item_id","title","description","url","brand","seller_name","image_url","availability","price"];
            while(!gzeof($f)){ $line=trim(gzgets($f)); if($line==="") continue; $r=json_decode($line,true); if(!is_array($r)) exit(3); foreach($required as $k){if(!isset($r[$k])||trim((string)$r[$k])==="") exit(4);} if(isset($ids[$r["item_id"]])) exit(5); $ids[$r["item_id"]]=1; if(!preg_match("~^https://~",$r["url"])||!preg_match("~^https://~",$r["image_url"])) exit(6); if(!in_array($r["availability"],["in_stock","out_of_stock","pre_order","backorder","unknown"],true)) exit(7); if(!preg_match("/^(?:0|[1-9][0-9]*)\.[0-9]{2} [A-Z]{3}$/",$r["price"])) exit(8); if(isset($r["group_id"]) && $r["group_id"]===$r["item_id"]) exit(9); $n++; }
            gzclose($f); if($n<1) exit(10); printf("Native feed: %d JSONL records; gzip valid; UTF-8 JSON; unique item_id; required fields/HTTPS/availability/price valid\n",$n);
          ' "$FEED_PATH"

          "$php_bin" -d memory_limit=512M "$wp_bin" eval '$s=mdo_openai_settings_20260909(); if((string)$s["delivery"]!=="none" || (string)$s["auto_upload"]!=="0") {fwrite(STDERR,"External delivery unexpectedly enabled\n"); exit(2);} if((string)$s["direct_feed_access_confirmed"]!=="0") {fwrite(STDERR,"Direct feed access unexpectedly confirmed\n"); exit(3);} echo "External delivery: disabled; direct public feed: disabled (expected)\n";' --path="$PROD_PATH" --allow-root

          feed_code=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/openai-feed-public.txt -w '%{http_code}' 'https://www.elmercadodeorigen.com/emdo-feed/openai/mercado-de-origen-products.jsonl.gz')
          test "$feed_code" = '404'
          echo "Public feed guard: HTTP 404 while onboarding is unconfirmed"

          for url in \
            'https://www.elmercadodeorigen.com/' \
            'https://www.elmercadodeorigen.com/tienda/' \
            'https://www.elmercadodeorigen.com/blog/' \
            'https://www.elmercadodeorigen.com/categorias/' \
            'https://www.elmercadodeorigen.com/categoria-producto/jamones-paletas/'; do
            code=$(curl -k -L -sS --connect-timeout 5 --max-time 30 -o /tmp/health.html -w '%{http_code}' "$url")
            test "$code" = '200'
            ! grep -Eqi 'critical error|fatal error|there has been a critical error' /tmp/health.html
            echo "HTTP 200: $url"
          done

          exit "$qa_failed"
          REMOTE

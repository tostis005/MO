name: Production restore safe Home cache 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-restore-safe-home-cache-20260816.yml'
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate cache drop-in
        run: php -l elmercadodeorigen-child/dropins/advanced-cache.php
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Deploy and prime Spanish Home cache
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          ROOT=$(sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          WP=$(command -v wp || true); PHP=$(command -v php || true)
          [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) echo "$p"; break;; esac
          done
          REMOTE
          )
          : "${ROOT:?production root not found}"
          F="$ROOT/wp-content/advanced-cache.php"
          TS=$(date +%Y%m%d%H%M%S)
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" "cp -a '$F' '$F.bak-safe-cache-$TS'"
          cat elmercadodeorigen-child/dropins/advanced-cache.php | sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" "cat > '$F.new' && chown --reference='$F' '$F.new' && chmod --reference='$F' '$F.new' && mv '$F.new' '$F'"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" "php -l '$F' || /opt/plesk/php/8.2/bin/php -l '$F'"
          echo "BACKUP=$F.bak-safe-cache-$TS"

          echo '=== PRIME ==='
          curl -k -sS --max-time 45 -A 'MDO-Cache-Prime/1.0' -D /tmp/prime.h -o /tmp/prime.html -w 'prime_http=%{http_code} prime_total=%{time_total} prime_start=%{time_starttransfer} prime_size=%{size_download}\n' https://www.elmercadodeorigen.com/
          grep -Ei 'HTTP/|X-El-Mercado|Cache-Control' /tmp/prime.h || true
          grep -q 'data-emo-vendor-count' /tmp/prime.html
          grep -q 'translatepress-es_ES' /tmp/prime.html

          echo '=== CACHE HIT ==='
          curl -k -sS --max-time 15 -A 'MDO-Cache-QA/1.0' -D /tmp/hit.h -o /tmp/hit.html -w 'hit_http=%{http_code} hit_total=%{time_total} hit_start=%{time_starttransfer} hit_size=%{size_download}\n' https://www.elmercadodeorigen.com/
          cat /tmp/hit.h | grep -Ei 'HTTP/|X-El-Mercado|Cache-Control|Vary:' || true
          grep -qi '^X-El-Mercado-Early-Cache: HIT' /tmp/hit.h
          grep -q 'data-emo-vendor-count' /tmp/hit.html
          grep -q 'translatepress-es_ES' /tmp/hit.html

          echo '=== CART COOKIE BYPASS ==='
          curl -k -sS --max-time 45 -A 'MDO-Cache-Cart-QA/1.0' -H 'Cookie: woocommerce_items_in_cart=1' -D /tmp/cart.h -o /dev/null -w 'cart_http=%{http_code} cart_total=%{time_total} cart_start=%{time_starttransfer}\n' https://www.elmercadodeorigen.com/
          cat /tmp/cart.h | grep -Ei 'HTTP/|X-El-Mercado|Cache-Control' || true
          if grep -qi '^X-El-Mercado-Early-Cache: HIT' /tmp/cart.h; then echo 'ERROR: cart request was early-cached'; exit 21; fi

          echo '=== ENGLISH BYPASS/CURRENT ==='
          curl -k -sS --max-time 45 -A 'MDO-Cache-English-QA/1.0' -D /tmp/en.h -o /tmp/en.html -w 'en_http=%{http_code} en_total=%{time_total} en_start=%{time_starttransfer} en_size=%{size_download}\n' https://www.elmercadodeorigen.com/en/
          cat /tmp/en.h | grep -Ei 'HTTP/|X-El-Mercado|Cache-Control' || true
          if grep -qi '^X-El-Mercado-Early-Cache: HIT' /tmp/en.h; then echo 'ERROR: English request was early-cached'; exit 22; fi
          grep -q 'translatepress-en_US' /tmp/en.html
          grep -q 'data-emo-vendor-count' /tmp/en.html

          echo '=== SHOP TIMING ==='
          curl -k -sS --max-time 45 -A 'MDO-Cache-Shop-QA/1.0' -o /dev/null -w 'shop_http=%{http_code} shop_total=%{time_total} shop_start=%{time_starttransfer}\n' "https://www.elmercadodeorigen.com/tienda/?mdo_cache_qa=$(date +%s%N)"
          echo 'CACHE_QA=PASS'

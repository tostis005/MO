name: Catalog query parity 0.10.224 staging
# Final baseline verification after the disabled-vendor fixture cleaned itself up.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-query-parity-010224-staging.yml'
      - '.github/scripts/catalog-query-parity-010224-browser.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_URL: https://dev.elmercadodeorigen.com
      EXPECTED_VERSION: 0.10.224

    steps:
      - uses: actions/checkout@v4

      - name: Validate release and QA probes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ELMERCADO_THEME_VERSION', '$EXPECTED_VERSION'" elmercadodeorigen-child/functions.php
          grep -Eq '^Version:[[:space:]]*0\.10\.224$' elmercadodeorigen-child/style.css
          grep -q 'catalog-query-parity-010224.php' elmercadodeorigen-child/functions.php
          grep -q "'found_posts'" elmercadodeorigen-child/inc/catalog-query-parity-010224.php
          grep -q 'max_num_pages' elmercadodeorigen-child/inc/catalog-query-parity-010224.php
          grep -q 'elmercado_catalog_visible_category_count_010217' elmercadodeorigen-child/inc/catalog-query-parity-010224.php
          php -l elmercadodeorigen-child/inc/catalog-query-parity-010224.php >/dev/null
          php -l .github/scripts/catalog-actual-loop-parity-010224.php >/dev/null
          php -l .github/scripts/home-category-parity-data-010215.php >/dev/null
          node --check .github/scripts/catalog-query-parity-010224-browser.cjs
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install browser and SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1

      - name: Resolve staging and collect exact product sets
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\""
          )"
          : "${WP_PATH:?}"
          echo "STAGING_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

          ok=0
          for attempt in {1..45}; do
            VERSION="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "grep -o \"ELMERCADO_THEME_VERSION', '[^']*\" '$WP_PATH/wp-content/themes/elmercadodeorigen-child/functions.php' | head -n1 | sed \"s/.*'//\"" || true)"
            if [ "$VERSION" = "$EXPECTED_VERSION" ]; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "Staging version $VERSION != $EXPECTED_VERSION" >&2; exit 2; }

          REMOTE_AUDIT="/tmp/catalog-query-parity-data-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/catalog-actual-loop-parity-010224.php "$STAGING_USER@$STAGING_HOST:$REMOTE_AUDIT"
          AUDIT_OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_AUDIT' --path='$WP_PATH' --allow-root; rm -f '$REMOTE_AUDIT'" )"
          AUDIT_B64="$(printf '%s\n' "$AUDIT_OUT" | sed -n 's/^__CATALOG_AUDIT__=//p' | tail -n1)"
          : "${AUDIT_B64:?}"
          echo "CATALOG_AUDIT_JSON=$(printf '%s' "$AUDIT_B64" | base64 -d)" >> "$GITHUB_ENV"

          REMOTE_AUTH="/tmp/catalog-query-parity-auth-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/home-category-parity-data-010215.php "$STAGING_USER@$STAGING_HOST:$REMOTE_AUTH"
          AUTH_OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval-file '$REMOTE_AUTH' --path='$WP_PATH' --allow-root; rm -f '$REMOTE_AUTH'" )"
          NAME_B64="$(printf '%s\n' "$AUTH_OUT" | sed -n 's/^__COOKIE_NAME__=//p' | tail -n1)"
          VALUE_B64="$(printf '%s\n' "$AUTH_OUT" | sed -n 's/^__COOKIE_VALUE__=//p' | tail -n1)"
          : "${NAME_B64:?}"; : "${VALUE_B64:?}"
          COOKIE_VALUE="$(printf '%s' "$VALUE_B64" | base64 -d)"
          echo "::add-mask::$COOKIE_VALUE"
          echo "ADMIN_COOKIE_NAME=$(printf '%s' "$NAME_B64" | base64 -d)" >> "$GITHUB_ENV"
          echo "ADMIN_COOKIE_VALUE=$COOKIE_VALUE" >> "$GITHUB_ENV"

      - name: Verify exact Home counts, server loops, pagination and continuous loading
        shell: bash
        run: node .github/scripts/catalog-query-parity-010224-browser.cjs

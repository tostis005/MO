name: Incident read-only web server log diagnostic 2026-10-27
on:
  push:
    branches: [main]
    paths: ['.github/workflows/incident-readonly-log-diagnostic-20261027.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production health and recent server logs (no changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          export LC_ALL=C
          echo "=== INCIDENT SERVER TIME AND HEALTH ==="
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'; uptime; free -m | head -n 3; df -h / | tail -n 1
          echo "=== SERVICE STATUS ==="
          for svc in nginx apache2 httpd mariadb mysql plesk-php82-fpm plesk-php83-fpm; do printf '%s=' "$svc"; systemctl is-active "$svc" 2>/dev/null || true; done
          echo "=== WORKER AND CPU SUMMARY ==="
          ps -eo comm= | awk '/php-fpm/{a++} /apache|httpd/{b++} /nginx/{c++} /mariadb|mysqld/{d++} END {printf "php_fpm=%d apache=%d nginx=%d database=%d\n",a,b,c,d}'
          ps -eo comm=,%cpu=,%mem=,rss= --sort=-%cpu | awk 'NR<=15 {printf "%s cpu=%s mem=%s rssKB=%s\n",$1,$2,$3,$4}'
          echo "=== TCP CONNECTION SUMMARY ==="
          ss -s 2>/dev/null | head -n 8
          echo "=== NGINX CONFIG TEST ==="
          nginx -t 2>&1 | tail -n 3
          echo "=== SERVER LOG DIAGNOSIS ==="
          python3 - <<'PY'
          import os,re,json,glob,gzip
          from collections import Counter,defaultdict
          from datetime import datetime,timezone,timedelta
          now=datetime.now(timezone.utc); cut=now-timedelta(hours=3)
          base='/var/www/vhosts/system/elmercadodeorigen.com/logs'
          paths=sorted(set(glob.glob(base+'/*error*')+glob.glob(base+'/*slow*')+glob.glob('/var/log/nginx/error.log')+glob.glob('/var/log/plesk-php*-fpm/error.log')))
          patterns={
            'upstream_timeout':r'upstream timed out|proxy_read_timeout|timed out.*upstream',
            'upstream_connection':r'connect\(\) failed|upstream prematurely closed|no live upstream|connection refused',
            'gateway_error':r'\b(?:502|503|504)\b|bad gateway|service unavailable',
            'php_fatal':r'PHP Fatal|Fatal error|Uncaught (?:Error|Exception)|Allowed memory size',
            'fpm_worker_limit':r'max_children|server reached|pool seems busy|pool.*exhaust',
            'mysql_error':r'too many connections|mysql server has gone away|deadlock|database connection',
            'memory_kill':r'out of memory|oom-kill|killed process|cannot allocate memory',
            'other_php_warning':r'PHP Warning|PHP Parse error',
            'permission_error':r'Permission denied|access forbidden|open_basedir restriction',
            'security_rate_limit':r'limiting requests|limiting connections|rate limit|client denied',
          }
          for path in paths[:35]:
            try:
              size=os.path.getsize(path)
              with open(path,'rb') as f:
                f.seek(max(0,size-4500000)); data=f.read().decode('utf-8','replace')
              lines=data.splitlines()
              relevant=[s for s in lines if any(re.search(p,s,re.I) for p in patterns.values())]
              counts=Counter(k for s in relevant for k,rx in patterns.items() if re.search(rx,s,re.I))
              def clean(s):
                s=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','[IP]',s)
                s=re.sub(r'https?://[^\s"\x27]+','[URL]',s)
                s=re.sub(r'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b','[EMAIL]',s)
                s=re.sub(r'(/var/www/|/home/|/tmp/)[^\s:()]+','[SERVER_PATH]',s)
                s=re.sub(r'(?i)(password|token|secret|key)=[^\s&]+',r'\1=[REDACTED]',s)
                return s[:370]
              print('ERROR_LOG',json.dumps({'file':os.path.basename(path),'bytes':size,'mtime_utc':datetime.fromtimestamp(os.path.getmtime(path),timezone.utc).isoformat(),'tail_lines':len(lines),'patterns':counts,'last_examples':[clean(x) for x in relevant[-9:]]},ensure_ascii=False))
            except Exception as e: print('ERROR_LOG_UNAVAILABLE',os.path.basename(path),type(e).__name__)
          acc=base+'/access_ssl_log'
          totals=Counter(); minutes=defaultdict(Counter); routes=Counter(); uas=Counter(); counted=0
          rx=re.compile(r'^\S+\s+\S+\s+\S+\s+\[([^\]]+)\]\s+"(\S+)\s+([^"]*?)"\s+(\d{3})\b')
          if os.path.isfile(acc):
            try:
              with open(acc,'rb') as f:
                size=os.path.getsize(acc)
                f.seek(max(0,size-20000000))
                for b in f:
                  s=b.decode('utf-8','replace');m=rx.match(s)
                  if not m: continue
                  stamp,method,target,status=m.groups()
                  try: dt=datetime.strptime(stamp,'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
                  except ValueError: continue
                  if dt<cut:continue
                  counted+=1;totals[status]+=1;minutes[dt.strftime('%H:%M')[:4]+'0'][status]+=1
                  route=(target.split('?',1)[0] if target else '/')
                  if status[0]=='5':routes[route[:120]]+=1
              print('ACCESS_3H',json.dumps({'from_utc':cut.isoformat(),'to_utc':now.isoformat(),'requests':counted,'status_counts':totals,'5xx_route_top10':routes.most_common(10)},ensure_ascii=False))
              for minute,c in sorted(minutes.items()):
                print('ACCESS_BUCKET_10MIN',minute,json.dumps({'requests':sum(c.values()),'errors_5xx':sum(v for k,v in c.items() if k.startswith('5')),'errors_429':c['429']}))
            except Exception as e:print('ACCESS_LOG_UNAVAILABLE',type(e).__name__,str(e)[:120])
          else:print('ACCESS_LOG_MISSING')
          for p in glob.glob(base+'/php-fpm*slow*')[:4]:
            try:
              with open(p,'rb') as f:
                f.seek(max(0,os.path.getsize(p)-4000000))
                s=f.read().decode('utf8','replace')
              sources=Counter(re.findall(r'/wp-content/(?:plugins|themes)/([^/]+)/',s))
              print('FPM_SLOW',os.path.basename(p),'bytes',os.path.getsize(p),'common_sources',sources.most_common(12),'latest_marker',re.findall(r'\[\d\d-[A-Za-z]{3}-\d{4} [^\]]+\]',s)[-3:])
            except Exception as e: print('FPM_SLOW_UNAVAILABLE',type(e).__name__)
          PY
          echo "=== CONTROLLED HTTP CHECKS (origin localhost) ==="
          for url in 'https://www.elmercadodeorigen.com/' 'https://www.elmercadodeorigen.com/tienda/' 'https://www.elmercadodeorigen.com/wp-json/'; do
            curl -k -L -sS -o /dev/null -w 'HTTP %{http_code} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\n' --resolve www.elmercadodeorigen.com:443:127.0.0.1 --connect-timeout 3 --max-time 10 "$url" || true
          done
          echo "=== END READ-ONLY INCIDENT CHECK ==="
          REMOTE

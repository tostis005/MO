name: Incident identify Hidalgo traffic source 2026-10-27
on:
  push:
    branches: [main]
    paths: ['.github/workflows/incident-readonly-log-diagnostic-20261027.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Read-only identify Hidalgo requests clients URLs and filters
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          sshpass -e ssh -o ConnectTimeout=12 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set +e
          python3 - <<'PY'
          import os,re,datetime,collections,json,hashlib,urllib.parse,statistics
          p='/var/www/vhosts/system/elmercadodeorigen.com/logs/access_ssl_log'
          now=datetime.datetime.now(datetime.timezone.utc)
          paths=['/tienda/hidalgo-de-la-jara/','/en/tienda/hidalgo-de-la-jara/','/categoria-producto/jamones-paletas/']
          stats={v:dict(n=0,ips=collections.Counter(),ua=collections.Counter(),codes=collections.Counter(),ref=collections.Counter(),query_signatures=collections.Counter(),distinct_q=set(),n_params=collections.Counter(),params=collections.Counter(),filter_paths=collections.Counter(),minutes=collections.Counter(),with_args=0) for v in paths}
          allreq=0;rest=collections.Counter()
          with open(p,'rb') as f:
            f.seek(max(0,os.path.getsize(p)-17000000))
            for raw in f:
              line=raw.decode('utf8','replace')
              m=re.search(r'^(\S+)\s+\S+\s+\S+\s+\[([^\]]+)\]\s+"([^"]+)"\s+(\d{3})\s+\S+\s+"([^"]*)"\s+"([^"]*)"',line)
              if not m:continue
              ip,dt,req,code,referer,agent=m.groups()
              try:date=datetime.datetime.strptime(dt,'%d/%b/%Y:%H:%M:%S %z').astimezone(datetime.timezone.utc)
              except:continue
              if date<now-datetime.timedelta(minutes=25):continue
              parts=req.split()
              if len(parts)<2:continue
              method,url=parts[:2];path=url.split('?',1)[0]
              allreq+=1
              if path not in stats:
                rest[path[:110]]+=1
                continue
              a=stats[path];a['n']+=1;a['ips'][hashlib.sha256(ip.encode()).hexdigest()[:9]]+=1;a['codes'][code]+=1
              a['minutes'][date.strftime('%H:%M')]+=1
              ref= 'internal' if 'elmercadodeorigen.com' in referer else ('none' if referer=='-' else 'external')
              a['ref'][ref]+=1
              ua='bot_named' if re.search(r'bot|spider|crawler|semrush|ahrefs|MJ12|curl|wget|python',agent,re.I) else ('browser_claim' if 'Mozilla/5.0' in agent else 'other')
              a['ua'][(ua,agent[:115])]+=1
              query=url.partition('?')[2]
              if query:
                a['with_args']+=1;a['distinct_q'].add(hashlib.sha256(query.encode()).hexdigest())
                parsed=urllib.parse.parse_qsl(query,keep_blank_values=True)
                keys=tuple(sorted(k for k,v in parsed))
                a['query_signatures'][keys]+=1;a['n_params'][len(parsed)]+=1
                for k,v in parsed:a['params'][k]+=1
                a['filter_paths'][tuple(sorted(k for k,v in parsed if k.startswith('filter_')))]+=1
          def result(a):
            return {
              'requests':a['n'],'unique_source_ip_count':len(a['ips']),'top_anonymized_ip_counts':a['ips'].most_common(8),
              'http_statuses':a['codes'],'referrers':a['ref'],'distinct_query_string_count':len(a['distinct_q']),
              'requests_with_query':a['with_args'],'filter_counts':a['params'].most_common(14),
              'filter_combinations':[(list(k),v) for k,v in a['filter_paths'].most_common(10)],
              'query_param_count_histogram':a['n_params'],'user_agents':[(x[0][0],x[0][1],x[1]) for x in a['ua'].most_common(9)],
              'minute_distribution':sorted(a['minutes'].items())
            }
          print('FOCUS_REPORT',json.dumps({'generated_utc':now.isoformat(),'window_min':25,'all_requests':allreq,'hidalgo_spanish':result(stats[paths[0]]),'hidalgo_english':result(stats[paths[1]]),'jamones':result(stats[paths[2]]),'other_top_paths':rest.most_common(10)},ensure_ascii=False))
          PY
          echo "=== SERVER PHP POOL AND UPTIME ==="
          uptime; ps -eo stat=,args= | awk '/php-fpm: pool elmercadodeorigen.com/ {n++;if ($1~/R/)r++} END{print "PHP_WORKERS",n,"RUNNING",r}'
          REMOTE
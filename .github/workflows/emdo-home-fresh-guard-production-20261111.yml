name: EMDO fix home cache eviction on fallback production 20261111
on:
  push:
    branches: [diagnostics/emdo-performance-20261111]
    paths: ['.github/workflows/emdo-home-fresh-guard-production-20261111.yml']
permissions:
  contents: read
concurrency:
  group: emdo-home-fresh-production-v2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and no destructive read-path invalidation
        run: |
          set -Eeuo pipefail
          php -l elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php
          ! grep -Fq '@unlink( $static_html )' elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php
          ! grep -Fq 'delete_transient( $key )' elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php
      - name: Deploy guarded MU plugin atomically with rollback and check frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=12 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
          SOURCE_REMOTE="/tmp/emdo-home-fresh-$GITHUB_RUN_ID.php"
          sshpass -e scp $SSH_OPTS -P "$STAGING_PORT" \
            elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php \
            "$STAGING_USER@$STAGING_HOST:$SOURCE_REMOTE"
          sshpass -e ssh $SSH_OPTS -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" "bash -s -- '$SOURCE_REMOTE'" <<'REMOTE'
          set -Eeuo pipefail
          SOURCE="$1"
          ROOT=/var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs
          TARGET="$ROOT/wp-content/mu-plugins/elmercado-home-fresh.php"
          CACHE="$ROOT/wp-content/uploads/elmercado-home-static/index.html"
          PHP=/opt/plesk/php/8.2/bin/php
          test "$(id -u)" -eq 0
          test -s "$TARGET" && test -s "$SOURCE" && test ! -L "$TARGET"
          "$PHP" -l "$SOURCE"
          python3 - "$TARGET" <<'PY'
          import sys,hashlib
          d=open(sys.argv[1],'rb').read()
          sha=hashlib.sha1(b'blob '+str(len(d)).encode()+b'\x00'+d).hexdigest()
          assert sha=='e00680cf56002588cd4d054b06be10d671a89b54',f'Unexpected live plugin version: {sha}'
          print('EXACT_HOME_FRESH_BASELINE_OK',len(d))
          PY
          BACKUP=/root/emdo-home-fresh-20261111-$(date -u +%Y%m%dT%H%M%SZ).php
          cp -p "$TARGET" "$BACKUP"
          CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$CHANGED" = 1; then
              cp -p "$BACKUP" "$TARGET"
              "$PHP" -l "$TARGET" || true
              echo 'ROLLBACK_HOME_FRESH_COMPLETE'
            fi
            rm -f "$SOURCE" || true
            exit "$rc"
          }
          trap rollback EXIT
          NEW="$TARGET.hotfix-$$"
          cp -p "$TARGET" "$NEW"
          cat "$SOURCE" > "$NEW"
          "$PHP" -l "$NEW"
          python3 - "$TARGET" <<'PY'
          import sys,hashlib
          d=open(sys.argv[1],'rb').read()
          sha=hashlib.sha1(b'blob '+str(len(d)).encode()+b'\x00'+d).hexdigest()
          assert sha=='e00680cf56002588cd4d054b06be10d671a89b54','Concurrent plugin edit, refusing overwrite'
          PY
          mv -f "$NEW" "$TARGET"
          CHANGED=1
          "$PHP" -l "$TARGET"
          sleep 3
          URL=https://www.elmercadodeorigen.com/
          H=$(mktemp)
          B=$(mktemp)
          for attempt in 1 2 3; do
            code=$(curl -ksS --connect-timeout 3 --max-time 15 -D "$H" -o "$B" -w '%{http_code}' "$URL")
            test "$code" = 200
            if grep -qi '^X-El-Mercado-Home-Early-Cache: HIT' "$H"; then break; fi
          done
          grep -qi '^X-El-Mercado-Home-Early-Cache: HIT' "$H"
          test -s "$CACHE"
          M_BEFORE=$(stat -c %Y "$CACHE")
          echo "HOME_PRE_COOKIE_EARLY_CACHE=HIT updated_epoch=$M_BEFORE"
          for cookie in 'private_custom_cookie=1' 'woocommerce_items_in_cart=1' 'wordpress_logged_in_sample=1'; do
            code=$(curl -ksS --connect-timeout 3 --max-time 15 -H "Cookie: $cookie" -D "$H" -o /dev/null -w '%{http_code}' "$URL")
            test "$code" = 200
            if grep -qi '^X-El-Mercado-Home-Early-Cache: HIT' "$H"; then echo 'UNSAFE_PRIVATE_HIT';exit 1;fi
            test -s "$CACHE" || { echo 'CACHE_EVICTED_BY_PRIVATE_REQUEST';exit 1; }
          done
          M_AFTER=$(stat -c %Y "$CACHE")
          echo "HOME_CACHE_REMAINED_AVAILABLE before=$M_BEFORE after=$M_AFTER"
          echo 'PRIVATE_REQUESTS_NO_LONGER_EVICT_HOME_CACHE'
          code=$(curl -ksS --connect-timeout 3 --max-time 15 -D "$H" -o "$B" -w '%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s' "$URL")
          echo "HOME_ANON_AFTER_PRIVATE_REQUESTS $code"
          grep -qi '^X-El-Mercado-Home-Early-Cache: HIT' "$H"
          echo 'HOME_FRESH_GUARD_PRODUCTION_DEPLOY_SUCCESS'
          REMOTE

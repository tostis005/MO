name: Home runtime audit 0.10.258 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-runtime-audit-010258-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect WordPress production plugins
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            echo '=== ACTIVE PLUGINS RELEVANT ==='
            \"\$php_bin\" \"\$wp_bin\" plugin list --path='$PROD_PATH' --status=active --fields=name,version --format=csv --allow-root 2>/dev/null | grep -Ei 'hustle|google|analytics|tag|site-kit|jetpack|woocommerce|smush|cache|redis' || true
            echo '=== HUSTLE TABLES ==='
            \"\$php_bin\" \"\$wp_bin\" db tables --all-tables-with-prefix --path='$PROD_PATH' --allow-root 2>/dev/null | grep -i hustle || true
            echo '=== PLUGIN LIST FULL ==='
            \"\$php_bin\" \"\$wp_bin\" plugin list --path='$PROD_PATH' --status=active --fields=name,version --format=csv --allow-root 2>/dev/null | head -n 120
          " > /tmp/wp-audit.txt
          cat /tmp/wp-audit.txt

      - name: Inspect served Home HTML and browser DOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          HTML=/tmp/home-runtime.html
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          {
            echo '=== HTML META ==='
            printf 'bytes=%s\n' "$(wc -c < "$HTML")"
            printf 'gtag_src_count=%s\n' "$(grep -o 'googletagmanager.com/gtag/js' "$HTML" | wc -l)"
            printf 'hustle_inline_count=%s\n' "$(grep -o 'hustle_inline_styles_front-inline-css' "$HTML" | wc -l)"
            echo '=== GTAG CONTEXT ==='
            grep -n -B4 -A4 'googletagmanager.com/gtag/js' "$HTML" || true
            echo '=== HUSTLE CONTEXT ==='
            grep -n -B3 -A5 'hustle_inline_styles_front-inline-css' "$HTML" || true
            echo '=== PAGE LINES 2090-2140 ==='
            nl -ba "$HTML" | sed -n '2090,2140p' || true
            echo '=== PAGE LINES 2768-2800 ==='
            nl -ba "$HTML" | sed -n '2768,2800p' || true
            echo '=== PAGE LINES 3595-3640 ==='
            nl -ba "$HTML" | sed -n '3595,3640p' || true
            echo '=== WP AUDIT ==='
            cat /tmp/wp-audit.txt
          } > /tmp/static-audit.txt

          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/browser-audit.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(2500);
            const data=await page.evaluate(()=>{
              const scripts=[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js')).map(s=>({id:s.id||'',src:s.src,async:s.async,defer:s.defer,outer:s.outerHTML.slice(0,500)}));
              const resources=performance.getEntriesByType('resource').filter(r=>r.name.includes('googletagmanager.com/gtag/js')).map(r=>({name:r.name,duration:Math.round(r.duration),transferSize:r.transferSize,initiatorType:r.initiatorType}));
              const hustle=[...document.querySelectorAll('[id*="hustle" i],[class*="hustle" i]')].slice(0,80).map(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {tag:el.tagName,id:el.id||'',class:String(el.className||'').slice(0,180),display:s.display,visibility:s.visibility,opacity:s.opacity,w:Math.round(r.width),h:Math.round(r.height),text:(el.textContent||'').trim().slice(0,120)}});
              const visibleHustle=hustle.filter(x=>x.display!=='none'&&x.visibility!=='hidden'&&x.w>0&&x.h>0);
              return {scripts,resources,hustleCount:hustle.length,visibleHustle};
            });
            console.log(JSON.stringify(data,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

          cat /tmp/static-audit.txt /tmp/browser-audit.txt > runtime/home-runtime-audit-010258.txt
          cat runtime/home-runtime-audit-010258.txt

      - name: Record audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-runtime-audit-010258.txt ] || printf 'audit_failed=true\n' > runtime/home-runtime-audit-010258.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-runtime-audit-010258.txt
          git commit -m 'Record Home runtime performance audit' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

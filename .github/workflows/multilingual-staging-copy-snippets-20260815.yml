name: Inspect staging English copy snippets 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/multilingual-staging-copy-snippets-20260815.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect remaining English copy
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}"
          for path in /en/ /en/tienda/ /en/quienes-somos/ /en/contacto/; do
            echo "===== $path ====="
            curl -kLsS -H 'Cache-Control: no-cache' --max-time 35 "https://dev.elmercadodeorigen.com${path}?mdo_snippet=${stamp}" -o /tmp/p.html
            echo '-- raw targeted snippets --'
            grep -oEi '.{0,180}(Encuentra|Find what|favoritos|customers|Filter productos|Filter products|Mercado de Origin|Mercado de Origen).{0,220}' /tmp/p.html | head -n 80 || true
            echo '-- visible headings --'
            grep -oEi '<h[1-4][^>]*>[^<]{1,220}</h[1-4]>' /tmp/p.html | sed -E 's/<[^>]+>//g' | head -n 80 || true
            echo '-- selected Spanish leftovers in visible-ish HTML --'
            grep -oEi '>([^<>]{0,140})(Encuentra|favoritos|productos|productores|tienda|envío|comprar|selección|calidad|origen|contacto|jamón|paleta|queso|naranja)([^<>]{0,140})<' /tmp/p.html | sed -E 's/^>//;s/<$//' | head -n 100 || true
            echo
          done

name: Audit original Pasaporte pack product photographs and export evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-pasaporte-original-media-for-review-20261026.yml'
      - '.github/scripts/export-pasaporte-original-media-for-review-20261026.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musee-source-photo-forensic-review
  cancel-in-progress: false
jobs:
  pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate original media and private-pack safeguards
        run: |
          set -euo pipefail
          php -l .github/scripts/export-pasaporte-original-media-for-review-20261026.php
          php -l .github/scripts/export-pasaporte-original-media-for-review-20261026.php
          php -l mu-plugins/emdo-musee-mentta-review-hold-20261026.php
          php -l mu-plugins/emdo-mentta-exclusive-products.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Export nine original photo attachments from real WordPress source products
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          ID="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}"  .github/scripts/export-pasaporte-original-media-for-review-20261026.php "$TARGET:/tmp/pasaporte-source-export-$ID.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$PROD_PATH' '$ID'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; ID="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "/tmp/pasaporte-source-export-$ID.php" --path="$SITE" --allow-root
          ARCHIVE="/tmp/musee-pasaporte-original-photos-$ID.tar.gz"
          EXPORT_DIR="$(find /tmp -maxdepth 1 -type d -name 'musee-original-photo-export-*' -mmin -10 | sort | tail -n1)"
          test -n "$EXPORT_DIR" && test -f "$EXPORT_DIR/manifest.json"
          tar -czf "$ARCHIVE" -C "$EXPORT_DIR" .
          REMOTE
          sshpass -e scp "${SCP[@]}" "$TARGET:/tmp/musee-pasaporte-original-photos-$ID.tar.gz" "pasaporte-original-media.tar.gz"
          echo "PHOTO_AUDIT_ARCHIVE_READY"
      - name: Upload original photo evidence
        uses: actions/upload-artifact@v4
        with:
          name: pasaporte-original-media
          path: pasaporte-original-media.tar.gz
          retention-days: 1

      - name: Confirm all three public URLs remain 404
        run: |
          set -euo pipefail
          for KEY in pasaporte-salvaje safari-africano vuelta-al-mundo; do
            CODE="$(curl -sSL --connect-timeout 8 --max-time 30 -o /dev/null -w '%{http_code}' "https://www.elmercadodeorigen.com/producto/pack-musee-mentta-$KEY/")"
            echo "PRIVATE $KEY HTTP $CODE"
            test "$CODE" = 404
          done

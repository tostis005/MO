name: Deploy AdSense ads.txt to production

on:
  push:
    branches: [main]
    paths:
      - 'ads.txt'
      - '.github/workflows/ads-txt-production-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate ads.txt source
        shell: bash
        run: |
          set -euo pipefail
          test -s ads.txt
          grep -Fqx 'google.com, pub-3168527008181132, DIRECT, f08c47fec0942fa0' ads.txt
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Merge ads.txt into production root
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE_SOURCE="/tmp/emdo-ads-${GITHUB_RUN_ID}.txt"
          sshpass -e scp $SCP_OPTIONS ads.txt "$STAGING_USER@$STAGING_HOST:$REMOTE_SOURCE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; target='$PROD_PATH/ads.txt'; touch \"\$target\"; if [ -s \"\$target\" ] && [ \"\$(tail -c 1 \"\$target\" | wc -l)\" -eq 0 ]; then printf '\\n' >> \"\$target\"; fi; while IFS= read -r line || [ -n \"\$line\" ]; do [ -z \"\$line\" ] && continue; grep -Fqx -- \"\$line\" \"\$target\" || printf '%s\\n' \"\$line\" >> \"\$target\"; done < '$REMOTE_SOURCE'; chmod 644 \"\$target\"; rm -f '$REMOTE_SOURCE'"

      - name: Verify public ads.txt
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.elmercadodeorigen.com/ads.txt'
          EXPECTED='google.com, pub-3168527008181132, DIRECT, f08c47fec0942fa0'
          curl -fsSL --retry 5 --retry-delay 2 -A 'Mozilla/5.0 EMDO ads.txt verifier' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "$URL?verify=${GITHUB_RUN_ID}" -o /tmp/ads-public.txt
          grep -Fqx "$EXPECTED" /tmp/ads-public.txt
          echo 'ADS_TXT_PUBLIC_OK'

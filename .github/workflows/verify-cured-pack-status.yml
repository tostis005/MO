name: Verify cured pack status

on:
  push:
    branches: [verify/embutidos-curados-packs-20260812]
    paths:
      - '.github/workflows/verify-cured-pack-status.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify pack assignments read-only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          domain="$2"
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates"' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep "/${domain}/wp-config.php$" "$candidates" | head -n 1 || true)"
            [ -n "$preferred" ] || exit 2
            wp_path="$(dirname "$preferred")"
          fi
          printf '__WP_PATH__=%s\n' "$wp_path"
          REMOTE
          )"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"
          : "${WP_PATH:?Could not resolve staging WordPress path}"

          cat > verify-packs.php <<'PHP'
          <?php
          $packs_term = get_term_by( 'slug', 'packs-y-lotes', 'product_cat' );
          $ham_term   = get_term_by( 'slug', 'jamones-paletas', 'product_cat' );
          $cured_term = get_term_by( 'slug', 'embutidos-y-curados', 'product_cat' );
          $ids = wc_get_products( array( 'limit' => -1, 'return' => 'ids', 'status' => array( 'publish', 'private', 'draft', 'pending' ) ) );
          $status_counts = array();
          $pack_ids = array();
          $missing_packs = array();
          $missing_ham = array();
          $wrong_transversal_ham = array();
          foreach ( array_map( 'intval', $ids ) as $id ) {
              $raw = (string) get_post_meta( $id, '_emdo_cured_catalog_snapshot', true );
              if ( '' === $raw ) continue;
              $snapshot = json_decode( $raw, true );
              if ( ! is_array( $snapshot ) || empty( $snapshot['pack'] ) ) continue;
              $product = wc_get_product( $id );
              if ( ! $product ) continue;
              $pack_ids[] = $id;
              $status = $product->get_status();
              $status_counts[ $status ] = ( $status_counts[ $status ] ?? 0 ) + 1;
              $cats = array_map( 'intval', $product->get_category_ids() );
              if ( $packs_term instanceof WP_Term && ! in_array( (int) $packs_term->term_id, $cats, true ) ) {
                  $missing_packs[] = array( 'id' => $id, 'name' => $product->get_name(), 'status' => $status );
              }
              $families = array_filter( (array) ( $snapshot['families'] ?? array() ) );
              $family_count = count( $families );
              $should_ham = ! empty( $snapshot['pack_with_ham'] );
              $has_ham = $ham_term instanceof WP_Term && in_array( (int) $ham_term->term_id, $cats, true );
              if ( $should_ham && ! $has_ham ) {
                  $missing_ham[] = array( 'id' => $id, 'name' => $product->get_name(), 'status' => $status );
              }
              if ( $family_count > 2 && $has_ham ) {
                  $wrong_transversal_ham[] = array( 'id' => $id, 'name' => $product->get_name(), 'status' => $status, 'families' => array_keys( $families ) );
              }
          }
          ksort( $status_counts );
          echo wp_json_encode( array(
              'pack_snapshot_count' => count( $pack_ids ),
              'status_counts' => $status_counts,
              'packs_term_count_published' => $packs_term instanceof WP_Term ? (int) $packs_term->count : null,
              'ham_term' => $ham_term instanceof WP_Term ? array( 'id' => (int) $ham_term->term_id, 'count' => (int) $ham_term->count ) : null,
              'cured_term_count_published' => $cured_term instanceof WP_Term ? (int) $cured_term->count : null,
              'missing_packs_category' => $missing_packs,
              'missing_ham_category' => $missing_ham,
              'transversal_packs_wrongly_in_ham' => $wrong_transversal_ham,
          ), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT ) . PHP_EOL;
          PHP

          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          REMOTE_SCRIPT="/tmp/emdo-verify-packs-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS verify-packs.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$WP_PATH' '$REMOTE_SCRIPT'" <<'REMOTE'
          set -eu
          wp_path="$1"
          script="$2"
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          trap 'rm -f "$script"' EXIT
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file "$script" --path="$wp_path" --allow-root
          REMOTE

name: Audit duck cluster after taxonomy 20261001
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit-duck-cluster-after-taxonomy-20261001.php'
      - '.github/workflows/audit-duck-cluster-after-taxonomy-20261001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit production
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/audit-duck-cluster-after-taxonomy-20261001.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s|%s|%s" "$p" "$php" "$wp"; break;; esac
            done
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          test -n "$PROD"
          REMOTE="/tmp/audit-duck-post-taxonomy-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/audit-duck-cluster-after-taxonomy-20261001.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" > /tmp/audit.json
          jq '{batch,source_rows,active_duck_count,excluded_duck_count,public_duck_count,cluster_meta_count,taxonomy_meta_mismatch_count,category_counts,stock_counts,term_rows,blog:{count:.blog.count,filler_count:.blog.filler_count,pattern_hits:.blog.pattern_hits,min_words:.blog.min_words,max_words:.blog.max_words,avg_words:.blog.avg_words,term:.blog.term},vendor}' /tmp/audit.json
          echo 'MISMATCH_BEGIN'; jq '.taxonomy_meta_mismatch' /tmp/audit.json; echo 'MISMATCH_END'
          echo 'BLOG_FILLER_BEGIN'; jq '[.blog.rows[] | select(.has_filler==true) | {id,key,slug,title,words,pattern_hits}]' /tmp/audit.json; echo 'BLOG_FILLER_END'
          echo 'PUBLIC_DUCK_BEGIN'; jq '.public_duck' /tmp/audit.json; echo 'PUBLIC_DUCK_END'
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE'"

name: Deploy Home native lazy fix 2 20260819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-home-native-lazy-fix2-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-home-native-lazy-fix2-20260819
  cancel-in-progress: true

jobs:
  fix-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix exact attribute matching
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mu-plugins/mdo-home-performance-20260819.php')
          s=p.read_text()
          old="""function mdo_home_perf_set_tag_attribute( string $tag, string $name, string $value ): string {
    $pattern = '~\\b' . preg_quote( $name, '~' ) . '\\s*=\\s*([\"\\']).*?\\1~i';
    $escaped = htmlspecialchars( $value, ENT_QUOTES, 'UTF-8' );

    if ( preg_match( $pattern, $tag ) ) {
        $updated = preg_replace( $pattern, $name . '=\"' . $escaped . '\"', $tag, 1 );
        return is_string( $updated ) ? $updated : $tag;
    }

    return mdo_home_perf_add_img_attributes( $tag, $name . '=\"' . $escaped . '\"' );
}"""
          new="""function mdo_home_perf_set_tag_attribute( string $tag, string $name, string $value ): string {
    /* El espacio inicial evita confundir src con data-src o sizes con data-sizes. */
    $pattern = '~(\\s)' . preg_quote( $name, '~' ) . '\\s*=\\s*([\"\\']).*?\\2~i';
    $escaped = htmlspecialchars( $value, ENT_QUOTES, 'UTF-8' );

    if ( preg_match( $pattern, $tag ) ) {
        $updated = preg_replace_callback(
            $pattern,
            static fn ( array $matches ): string => $matches[1] . $name . '=\"' . $escaped . '\"',
            $tag,
            1
        );
        return is_string( $updated ) ? $updated : $tag;
    }

    return mdo_home_perf_add_img_attributes( $tag, $name . '=\"' . $escaped . '\"' );
}"""
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('setter target not found')
          s=s.replace('* Version: 1.4.0','* Version: 1.4.1',1)
          p.write_text(s)
          PY
          php -l mu-plugins/mdo-home-performance-20260819.php
          php <<'PHP'
          <?php
          $tag='<img data-src="real.jpg" src="placeholder.gif" data-sizes="old-data" sizes="old-real">';
          $escaped='new.jpg'; $name='src';
          $pattern='~(\s)'.preg_quote($name,'~').'\s*=\s*(["\']).*?\2~i';
          $tag=preg_replace_callback($pattern,static fn(array $m):string=>$m[1].$name.'="'.$escaped.'"',$tag,1);
          if (strpos($tag,'data-src="real.jpg"')===false || strpos($tag,' src="new.jpg"')===false) {fwrite(STDERR,$tag); exit(1);}
          $escaped='new-size'; $name='sizes';
          $pattern='~(\s)'.preg_quote($name,'~').'\s*=\s*(["\']).*?\2~i';
          $tag=preg_replace_callback($pattern,static fn(array $m):string=>$m[1].$name.'="'.$escaped.'"',$tag,1);
          if (strpos($tag,'data-sizes="old-data"')===false || strpos($tag,' sizes="new-size"')===false) {fwrite(STDERR,$tag); exit(1);}
          echo $tag,PHP_EOL;
          PHP
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mu-plugins/mdo-home-performance-20260819.php
          git commit -m 'Fix native lazy attribute matching' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy fixed MU plugin
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          REMOTE="/tmp/mdo-home-native-fix2-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP mu-plugins/mdo-home-performance-20260819.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            MU='$PROD_PATH/wp-content/mu-plugins'; STATIC='$PROD_PATH/wp-content/uploads/elmercado-home-static'
            install -m 0644 '$REMOTE' \"\$MU/mdo-home-performance-20260819.php\"
            php_bin=\$(command -v php || true); wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$MU/mdo-home-performance-20260819.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f \"\$STATIC/index.html\" \"\$STATIC\"/home-deferred-*.css '$REMOTE'
          "
          for i in 1 2 3 4; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/home.html').read_text(errors='replace')
          vals={
            'smush_script':len(re.findall(r'smush-lazy-load-native\.min\.js',s,re.I)),
            'img_data_src':len(re.findall(r'<img[^>]+\bdata-src=',s,re.I)),
            'placeholder':len(re.findall(r'<img[^>]+src=["\']data:image/gif;base64',s,re.I)),
            'lazyload_class':len(re.findall(r'<img[^>]+class=["\'][^"\']*\blazyload\b',s,re.I)),
          }
          print(vals)
          assert vals=={'smush_script':0,'img_data_src':0,'placeholder':0,'lazyload_class':0}, vals
          PY

      - name: Full-scroll browser verification
        run: |
          set -euo pipefail
          mkdir -p runtime
          npm install --no-save --no-audit --no-fund puppeteer-core@24 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME="$CHROME" node <<'JS' > /tmp/browser.json
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:412,height:915,deviceScaleFactor:1});
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle2',timeout:60000});
            await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=550){scrollTo(0,y);await new Promise(r=>setTimeout(r,90));}scrollTo(0,document.documentElement.scrollHeight)});
            await new Promise(r=>setTimeout(r,1200));
            const d=await page.evaluate(()=>{
              const imgs=[...document.images];
              const visible=imgs.filter(i=>{const r=i.getBoundingClientRect(),s=getComputedStyle(i);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'});
              return {count:imgs.length,visible:visible.length,broken:visible.filter(i=>i.complete&&i.naturalWidth===0).map(i=>({src:i.src,alt:i.alt,className:i.className})),placeholders:imgs.filter(i=>i.src.startsWith('data:image/gif;base64')).length,dataSrc:document.querySelectorAll('img[data-src]').length,smush:[...document.scripts].some(s=>(s.src||'').includes('smush-lazy-load-native')),products:[...document.querySelectorAll('img.elmercado-catalog-card-image-010241')].map(i=>({src:i.src,currentSrc:i.currentSrc,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,sizes:i.sizes,loading:i.loading})),logos:[...document.querySelectorAll('img.wcfmmp_sold_by_logo')].slice(0,5).map(i=>({src:i.src,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight})),payment:[...document.querySelectorAll('img.metodosPago')].map(i=>({src:i.src,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight}))};
            });
            console.log(JSON.stringify(d,null,2)); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 - <<'PY' > runtime/home-native-lazy-fix2-20260819.txt
          import json
          d=json.load(open('/tmp/browser.json'))
          print('browser=',json.dumps(d,ensure_ascii=False))
          assert d['placeholders']==0 and d['dataSrc']==0 and not d['smush'] and not d['broken'],d
          assert d['products'] and all(x['naturalWidth']>0 for x in d['products']),d['products']
          assert d['logos'] and all(x['naturalWidth']>0 for x in d['logos']),d['logos']
          PY
          cat runtime/home-native-lazy-fix2-20260819.txt

      - name: Lighthouse 3x normal Home
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3; do npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path="/tmp/lh-$i.json" --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet; done
          python3 - <<'PY' >> runtime/home-native-lazy-fix2-20260819.txt
          import json,statistics
          rows=[]
          for i in (1,2,3):
              a=json.load(open(f'/tmp/lh-{i}.json')); x=a['audits']; boot=x.get('bootup-time',{}); smush=0
              for z in (boot.get('details') or {}).get('items',[]):
                  if 'smush-lazy-load-native' in z.get('url',''): smush+=z.get('total',0) or 0
              rf=x.get('forced-reflow-insight',{}); theme=0
              for g in (rf.get('details') or {}).get('items',[]):
                  for z in g.get('items',[]):
                      q=z.get('source') or {}; u=q.get('url','') if isinstance(q,dict) else ''
                      if '/assets/js/theme.js' in u: theme+=z.get('reflowTime',0) or 0
              r={'score':round(a['categories']['performance']['score']*100),'fcp':round(x['first-contentful-paint']['numericValue']),'lcp':round(x['largest-contentful-paint']['numericValue']),'tbt':round(x['total-blocking-time']['numericValue']),'cls':x['cumulative-layout-shift']['numericValue'],'smush_cpu':round(smush,1),'theme_reflow':round(theme,3)}
              rows.append(r); print('run',i,r)
          for k in rows[0]: print('median_'+k+'=',statistics.median(r[k] for r in rows))
          m=json.load(open('/tmp/lh-2.json'))['audits']
          for key in ('image-delivery-insight','cache-insight','legacy-javascript-insight','unused-javascript','unused-css-rules','mainthread-work-breakdown','bootup-time'):
              v=m.get(key,{}); print('audit',key,'display=',v.get('displayValue'),'numeric=',v.get('numericValue'),'score=',v.get('score'))
          assert all(r['smush_cpu']==0 for r in rows),rows
          assert all(r['theme_reflow']==0 for r in rows),rows
          PY
          cat runtime/home-native-lazy-fix2-20260819.txt

      - name: Record result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-native-lazy-fix2-20260819.txt ] || echo 'verification_failed=true' > runtime/home-native-lazy-fix2-20260819.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-native-lazy-fix2-20260819.txt
          git commit -m 'Record Home native lazy fix 2 verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

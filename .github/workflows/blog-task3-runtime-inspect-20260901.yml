name: Blog SEO task 3 runtime inspect 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-task3-runtime-inspect-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect SEO runtime sources
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            echo EMDO_TASK3_HREFLANG_SOURCE_BEGIN
            grep -R -n -E 'hreflang|x-default' '$PROD_PATH/wp-content/mu-plugins' --include='*.php' 2>/dev/null | head -160 || true
            echo EMDO_TASK3_HREFLANG_SOURCE_END
            echo EMDO_TASK3_REDIRECT_SOURCE_BEGIN
            sed -n '1,260p' '$PROD_PATH/wp-content/mu-plugins/emdo-blog-consolidation-redirects.php' 2>/dev/null || true
            echo EMDO_TASK3_REDIRECT_SOURCE_END
            echo EMDO_TASK3_TRANSLATEPRESS_FILTERS_BEGIN
            grep -R -n -E 'apply_filters\([^)]*(hreflang|language_switcher|url)' '$PROD_PATH/wp-content/plugins/translatepress-multilingual' --include='*.php' 2>/dev/null | head -100 || true
            echo EMDO_TASK3_TRANSLATEPRESS_FILTERS_END
          "

      - name: Inspect all blog-category hreflang and thin archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          base='https://www.elmercadodeorigen.com'
          ua='Mozilla/5.0 EMDO SEO task3 runtime inspector'
          def get(url, follow=True):
              args=['curl','-fsS','--retry','3','--retry-delay','2','-A',ua]
              if follow: args.append('-L')
              args.append(url)
              return subprocess.check_output(args,text=True)
          def extract(html):
              canon=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',html,re.I)
              if not canon: canon=re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',html,re.I)
              robots=re.findall(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)',html,re.I)
              h=re.findall(r'<link[^>]+rel=["\']alternate["\'][^>]+hreflang=["\']([^"\']+)["\'][^>]+href=["\']([^"\']+)',html,re.I)
              return canon,robots,h
          xml=get(base+'/mdo-sitemap-blog-categories.xml')
          root=ET.fromstring(xml)
          urls=[x.text.strip() for x in root.iter() if x.tag.endswith('loc') and x.text]
          bad=[]
          for url in urls:
              if '/en/category/' not in url: continue
              html=get(url); canon,robots,h=extract(html)
              pairs=dict(h)
              es=pairs.get('es-ES',''); xd=pairs.get('x-default','')
              ok=bool(es) and '/en/category/' not in es and es.startswith(base+'/category/') and xd==es
              print(f'EMDO_TASK3_CATEGORY_HREFLANG url={url} es={es} xdefault={xd} canonical={canon[:1]} ok={int(ok)}')
              if not ok: bad.append((url,es,xd))
          print(f'EMDO_TASK3_CATEGORY_HREFLANG_SUMMARY english_checked={sum(1 for u in urls if "/en/category/" in u)} bad={len(bad)}')

          paths=['/author/admin-mercado/','/2026/08/','/?s=jamon','/feed/']
          for path in paths:
              try:
                  html=get(base+path); canon,robots,h=extract(html)
                  print(f'EMDO_TASK3_ARCHIVE path={path} canonical={canon[:2]!r} robots={robots[:2]!r} hreflang={h[:6]!r}')
              except Exception as exc:
                  print(f'EMDO_TASK3_ARCHIVE path={path} error={exc}')
          PY

name: Catalog query source inventory 20260822
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/catalog-query-source-inventory-20260822.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Locate catalog query modifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          sudo apt-get update -qq;sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}";SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp || true);php_bin=$(command -v php || true);[ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null|sort -Vr|head -n1);for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null);do p=$(dirname "$cfg");url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null||true);case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com) printf "%s" "$p";break;;esac;done')"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "grep -RInE --include='*.php' 'post__in|posts_per_page|set\(.paged.|MDO_Catalog_Ranking|mdo_catalog_rank_v3_|pre_get_posts' '$PROD_PATH/wp-content/mu-plugins' '$PROD_PATH/wp-content/themes/elmercadodeorigen-child/inc' 2>/dev/null || true" > /tmp/inventory.txt
          python3 - <<'PY'
          import pathlib,json
          lines=pathlib.Path('/tmp/inventory.txt').read_text(errors='replace').splitlines()
          # Keep only query-relevant source lines, bounded for report size.
          pathlib.Path('.deploy-status/catalog-query-source-inventory-20260822.json').write_text(json.dumps({'matches':lines[:700]},ensure_ascii=False,indent=2)+'\n')
          print('matches',len(lines))
          PY
      - name: Commit report
        run: |
          git config user.name github-actions;git config user.email github-actions@github.com
          git add .deploy-status/catalog-query-source-inventory-20260822.json
          git commit -m "Record catalog query source inventory ${GITHUB_RUN_ID} [skip ci]" || true
          git pull --rebase origin main;git push origin HEAD:main

name: Deploy Montjam sachet minimum to production

# Deploy only one independent MU plugin. Do not sync the child theme or database.
on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/inc/montjam-sliced-minimum-20261111.php'
      - '.github/workflows/deploy-montjam-sobres-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-montjam-sachets-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_PASSWORD: ${{ secrets.PRODUCTION_PASSWORD }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      PRODUCTION_WP_PATH: ${{ secrets.PRODUCTION_WP_PATH }}

    steps:
      - uses: actions/checkout@v4

      - name: Check source and production configuration
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=elmercadodeorigen-child/inc/montjam-sliced-minimum-20261111.php
          php -l "$SOURCE"
          test -f "$SOURCE"
          : "${PRODUCTION_HOST:?Configure PRODUCTION_HOST in the production environment}"
          : "${PRODUCTION_USER:?Configure PRODUCTION_USER in the production environment}"
          : "${PRODUCTION_PASSWORD:?Configure PRODUCTION_PASSWORD in the production environment}"
          : "${PRODUCTION_KNOWN_HOSTS:?Configure PRODUCTION_KNOWN_HOSTS in the production environment}"
          : "${PRODUCTION_WP_PATH:?Configure PRODUCTION_WP_PATH in the production environment}"
          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_WP_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$PRODUCTION_WP_PATH" != "/" ]]
          [[ "${PRODUCTION_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$RUNNER_TEMP/ssh"
          chmod 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Verify exact production WordPress before any write
        shell: bash
        env:
          SSHPASS: ${{ secrets.PRODUCTION_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "${PRODUCTION_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "sh -s -- '$PRODUCTION_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          [ -f "$wp_path/wp-config.php" ] || { echo 'WordPress installation not found' >&2; exit 1; }
          [ -f "$wp_path/wp-content/themes/elmercadodeorigen-child/functions.php" ] || { echo 'Expected child theme missing' >&2; exit 1; }
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI not installed' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          [ -x "$php_bin" ] || { echo 'PHP CLI not installed' >&2; exit 1; }
          siteurl="$("$php_bin" "$wp_bin" option get siteurl --path="$wp_path" --skip-plugins --skip-themes --allow-root)"
          case "$siteurl" in
            https://www.elmercadodeorigen.com|https://www.elmercadodeorigen.com/|https://elmercadodeorigen.com|https://elmercadodeorigen.com/) ;;
            *) echo "Refusing deployment: unrecognized production site URL ($siteurl)" >&2; exit 1 ;;
          esac
          theme="$("$php_bin" "$wp_bin" option get stylesheet --path="$wp_path" --skip-plugins --skip-themes --allow-root)"
          [ "$theme" = 'elmercadodeorigen-child' ] || { echo "Unexpected active theme: $theme" >&2; exit 1; }
          echo "Verified production WordPress and active child theme."
          REMOTE

      - name: Upload and activate the single MU plugin (with rollback)
        shell: bash
        env:
          SSHPASS: ${{ secrets.PRODUCTION_PASSWORD }}
        run: |
          set -euo pipefail
          SOURCE=elmercadodeorigen-child/inc/montjam-sliced-minimum-20261111.php
          DEST="$PRODUCTION_WP_PATH/wp-content/mu-plugins"
          REMOTE="$PRODUCTION_USER@$PRODUCTION_HOST"
          PORT="${PRODUCTION_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mkdir -p '$DEST' && umask 077 && cat > '$DEST/.elmercado-montjam-minimum.php.new'" < "$SOURCE"
          sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "sh -s -- '$PRODUCTION_WP_PATH'" <<'REMOTE_SCRIPT'
          set -eu
          wp_path="$1"
          dir="$wp_path/wp-content/mu-plugins"
          pending="$dir/.elmercado-montjam-minimum.php.new"
          target="$dir/elmercado-montjam-minimum.php"
          backup="$dir/.elmercado-montjam-minimum.php.bak-$(date -u +%Y%m%dT%H%M%SZ)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          [ -x "$php_bin" ] || { echo 'PHP CLI unavailable' >&2; exit 1; }
          wp_bin="$(command -v wp)"
          "$php_bin" -l "$pending"
          had_original=no
          if [ -f "$target" ]; then
            cp -p "$target" "$backup"
            had_original=yes
          fi
          mv -f "$pending" "$target"
          chmod 0644 "$target"

          if ! "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            if (!function_exists("elmercado_is_montjam_sliced_minimum_20261111")) {
              throw new Exception("Montjam minimum plugin did not load.");
            }
            foreach (array(
              "lomo-bellota-100-iberico-loncheado-montjam-90g",
              "chorizo-cular-iberico-extra-loncheado-montjam-90g"
            ) as $slug) {
              $post = get_page_by_path($slug, OBJECT, "product");
              if (!$post) { throw new Exception("Product not found: " . $slug); }
              $product = wc_get_product($post->ID);
              if (!elmercado_is_montjam_sliced_minimum_20261111($product)) {
                throw new Exception("Product not targeted: " . $slug);
              }
              $args = apply_filters("woocommerce_quantity_input_args", array(
                "min_value" => 1, "step" => 1, "input_value" => 1
              ), $product);
              if ((int)$args["min_value"] !== 5 || (int)$args["step"] !== 1) {
                throw new Exception("Wrong quantity constraint: " . $slug);
              }
              echo "Verified 5+ in steps of one: " . $slug . "\n";
            }
          ' --path="$wp_path" --allow-root; then
            echo 'Post-deploy verification failed; rolling back MU plugin.' >&2
            if [ "$had_original" = yes ]; then
              cp -p "$backup" "$target"
            else
              rm -f "$target"
            fi
            exit 1
          fi
          "$php_bin" "$wp_bin" cache flush --path="$wp_path" --allow-root || true
          echo 'Montjam minimum MU plugin activated in production.'
          REMOTE_SCRIPT

      - name: Public product page smoke test
        shell: bash
        run: |
          set -euo pipefail
          for slug in lomo-bellota-100-iberico-loncheado-montjam-90g chorizo-cular-iberico-extra-loncheado-montjam-90g; do
            curl --fail --silent --show-error --location --max-time 35 \
              "https://www.elmercadodeorigen.com/producto/$slug/?emdo_montjam_verification=$GITHUB_SHA" \
              | grep -qi 'Pedido mínimo'
            echo "Public product page verified: $slug"
          done

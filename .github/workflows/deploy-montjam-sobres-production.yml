name: Publish Montjam minimum sachets in production

# Reuse the SSH connection that already deploys approved producer banners
# to El Mercado de Origen production. Never synchronize the entire theme.
on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/inc/montjam-sliced-minimum-20261111.php'
      - '.github/workflows/deploy-montjam-sobres-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: elmercado-montjam-sachets-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
      ROOT: /var/www/vhosts/wizardly-shockley.82-223-25-247.plesk.page/httpdocs

    steps:
      - name: Checkout the committed rule
        uses: actions/checkout@v4

      - name: Validate PHP and existing SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/montjam-sliced-minimum-20261111.php
          : "${STAGING_HOST:?Existing deployment SSH host is missing}"
          : "${STAGING_USER:?Existing deployment SSH user is missing}"
          : "${SSHPASS:?Existing deployment SSH password is missing}"
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Install SSH helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Existing approved-banner production workflow uses the same host-key bootstrap.
          ssh-keyscan -T 15 -p "${STAGING_PORT:-22}" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify destination is actual El Mercado de Origen production
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$ROOT'" <<'CHECK'
          set -Eeuo pipefail
          root="$1"
          test -f "$root/wp-config.php"
          test -f "$root/wp-content/themes/elmercadodeorigen-child/functions.php"
          wp_bin="$(command -v wp)"
          php_bin=/opt/plesk/php/8.2/bin/php
          test -x "$php_bin"
          siteurl="$("$php_bin" "$wp_bin" option get siteurl --path="$root" --skip-plugins --skip-themes --allow-root)"
          case "$siteurl" in
            https://elmercadodeorigen.com|https://www.elmercadodeorigen.com|http://elmercadodeorigen.com|http://www.elmercadodeorigen.com) ;;
            *) echo "Unexpected WordPress site URL: $siteurl" >&2; exit 1 ;;
          esac
          echo "PRODUCTION_WORDPRESS_CONFIRMED"
          CHECK

      - name: Deploy just the MU plugin, verify and rollback on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          TARGET="$ROOT/wp-content/mu-plugins"
          SOURCE="elmercadodeorigen-child/inc/montjam-sliced-minimum-20261111.php"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$TARGET' && cat > '$TARGET/.emdo-montjam-sobres-$GITHUB_RUN_ID.new'" < "$SOURCE"
          sshpass -e ssh $SSH_OPTS "$STAGING_USER@$STAGING_HOST" "bash -s -- '$ROOT' '$GITHUB_RUN_ID'" <<'DEPLOY'
          set -Eeuo pipefail
          root="$1"
          run_id="$2"
          dir="$root/wp-content/mu-plugins"
          target="$dir/elmercado-montjam-minimum.php"
          incoming="$dir/.emdo-montjam-sobres-$run_id.new"
          backup="$dir/.emdo-montjam-sobres-$run_id.backup"
          php_bin=/opt/plesk/php/8.2/bin/php
          wp_bin="$(command -v wp)"
          original=0
          installed=0
          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$installed" -eq 1 ]; then
              echo "Restoring original Montjam MU plugin after a failed validation" >&2
              if [ "$original" -eq 1 ] && [ -f "$backup" ]; then
                cp -p "$backup" "$target"
              else
                rm -f "$target"
              fi
            fi
            rm -f "$incoming"
            exit "$status"
          }
          trap rollback EXIT
          test -s "$incoming"
          "$php_bin" -l "$incoming"
          if [ -f "$target" ]; then
            cp -p "$target" "$backup"
            original=1
          fi
          mv "$incoming" "$target"
          chmod 0644 "$target"
          installed=1
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            if (!function_exists("elmercado_is_montjam_sliced_minimum_20261111")) {
              throw new Exception("Montjam module has not loaded");
            }
            foreach (array(
              "lomo-bellota-100-iberico-loncheado-montjam-90g",
              "chorizo-cular-iberico-extra-loncheado-montjam-90g"
            ) as $slug) {
              $post = get_page_by_path($slug, OBJECT, "product");
              if (!$post) throw new Exception("Missing product: ".$slug);
              $p = wc_get_product($post->ID);
              if (!$p || !elmercado_is_montjam_sliced_minimum_20261111($p))
                throw new Exception("Product not recognized: ".$slug);
              $args = apply_filters("woocommerce_quantity_input_args",
                array("min_value"=>1, "step"=>1, "input_value"=>1), $p);
              $quantity_hooks = $GLOBALS["wp_filter"]["woocommerce_quantity_input_args"] ?? null;
              echo "MONTJAM_DIAGNOSTIC ".wp_json_encode(array(
                "slug"=>$p->get_slug(),
                "type"=>$p->get_type(),
                "min"=>$args["min_value"] ?? null,
                "step"=>$args["step"] ?? null,
                "input_value"=>$args["input_value"] ?? null,
                "hook_present"=>(bool)$quantity_hooks,
                "priorities"=>$quantity_hooks ? array_keys($quantity_hooks->callbacks) : array(),
                "module_loaded"=>function_exists("elmercado_is_montjam_sliced_minimum_20261111"),
              ))."\\n";
              if ((int)$args["min_value"] !== 5 || (int)$args["step"] !== 1)
                throw new Exception("Incorrect minimum/step for ".$slug);
              echo "PRODUCT_MINIMUM_5_STEP_1 ".$slug."\n";
            }
          ' --path="$root" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$root" --allow-root || true
          echo "MONJAM_RULE_INSTALLED_IN_PRODUCTION"
          DEPLOY

      - name: Verify public live product pages after deployment
        shell: bash
        run: |
          set -euo pipefail
          for slug in lomo-bellota-100-iberico-loncheado-montjam-90g chorizo-cular-iberico-extra-loncheado-montjam-90g; do
            url="https://www.elmercadodeorigen.com/producto/$slug/?emdo_montjam_verify=$GITHUB_RUN_ID"
            curl -fsSL --retry 3 --max-time 45 "$url" -o "/tmp/$slug.html"
            # The user requested that the explanatory text be removed, but the selector
            # must keep min=5 and step=1 on the public product page.
            python3 - "/tmp/$slug.html" "$slug" <<'PY'
          import sys
          from html.parser import HTMLParser
          class Inputs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.quantity = []
              def handle_starttag(self, tag, attrs):
                  if tag == "input":
                      d = dict(attrs)
                      if d.get("name") == "quantity":
                          self.quantity.append(d)
          html = open(sys.argv[1], encoding="utf-8").read()
          if 'class="elmercado-montjam-minimum"' in html or "Pedido mínimo: <strong>5 sobres</strong>" in html:
              raise SystemExit("Obsolete explanatory text still visible on " + sys.argv[2])
          parser = Inputs()
          parser.feed(html)
          if not any(float(i.get("min", "0")) == 5 and float(i.get("step", "1")) == 1
                     for i in parser.quantity):
              raise SystemExit("Quantity input with min=5 step=1 not found on " + sys.argv[2])
          print("LIVE_PUBLIC_MINIMUM_5_NO_EXPLANATORY_TEXT", sys.argv[2])
          PY
          done

      - name: Record verified production status on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Publish success only after both server-side and public URL checks pass.
          curl --fail --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"montjam/production-verified","description":"Verified min 5, step 1 and live product pages"}'
          echo "PRODUCTION_VERIFIED_STATUS_PUBLISHED"

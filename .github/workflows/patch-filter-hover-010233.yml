name: Patch filter hover parity 0.10.233

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-filter-hover-010233.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live Shop hover parity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cleanup = Path('elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php')
          text = cleanup.read_text()
          old = '''\t\t\thtml body.elmercado-child-theme :is(#secondary#secondary, #wcfmmp-store#wcfmmp-store .left_sidebar).emo-filter-rail-shared-010229 .emo-filter-row-shared-010229:hover,\n\t\t\thtml body.elmercado-child-theme :is(#secondary#secondary, #wcfmmp-store#wcfmmp-store .left_sidebar).emo-filter-rail-shared-010229 .emo-filter-row-shared-010229:is(.current-cat,.is-active,.chosen,.woocommerce-widget-layered-nav-list__item--chosen) {\n\t\t\t\tbackground-color:#d9ede0 !important; box-shadow:inset 0 0 0 1px rgba(47,125,93,.18) !important;\n\t\t\t}\n'''
          new = '''\t\t\thtml body.elmercado-child-theme :is(#secondary#secondary, #wcfmmp-store#wcfmmp-store .left_sidebar).emo-filter-rail-shared-010229 .emo-filter-row-shared-010229:hover {\n\t\t\t\tbackground:transparent !important;\n\t\t\t\tbox-shadow:none !important;\n\t\t\t}\n\t\t\thtml body.elmercado-child-theme :is(#secondary#secondary, #wcfmmp-store#wcfmmp-store .left_sidebar).emo-filter-rail-shared-010229 .emo-filter-row-shared-010229:is(.current-cat,.is-active,.chosen,.woocommerce-widget-layered-nav-list__item--chosen) {\n\t\t\t\tbackground:#d9ede0 !important;\n\t\t\t\tbox-shadow:inset 0 0 0 1px rgba(47,125,93,.18) !important;\n\t\t\t}\n'''
          if old not in text:
              raise SystemExit('Expected shared hover block not found')
          cleanup.write_text(text.replace(old, new, 1))
          PY
      - name: Validate patch
        run: |
          set -euo pipefail
          php -l elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php >/dev/null
          grep -Fq 'elmercado-catalog-filter-shared-interaction-010232' elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          grep -Fq 'background:transparent !important' elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/catalog-result-total-cleanup-010221.php
          git commit -m 'Match producer hover to live Shop reference'
          git push origin HEAD:main

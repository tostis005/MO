name: Probe Tolecarnes resync 0.10.243

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-tolecarnes-resync-010243.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read production resync state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp)
            grep -m1 '^ \* Version:' '$PROD_PATH/wp-content/plugins/mdo-supplier-sync/mdo-supplier-sync.php' || true
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" eval '
              global \$wpdb;
              \$runs=MDO_Database::table(\"sync_runs\"); \$src=MDO_Database::table(\"source_products\");
              \$run=\$wpdb->get_row(\"SELECT id,supplier_id,trigger_type,status,products_found,products_new,products_updated,products_excluded,errors_count,message,started_at,finished_at FROM {\$runs} WHERE supplier_id=1 ORDER BY id DESC LIMIT 1\",ARRAY_A);
              \$rows=[];
              foreach([\"%huesos de ternera%\",\"%burger mixtas%\"] as \$like){ \$r=\$wpdb->get_row(\$wpdb->prepare(\"SELECT id,title,source_price,status,wc_product_id,source_payload,last_seen_at,last_changed_at,last_error FROM {\$src} WHERE supplier_id=1 AND LOWER(title) LIKE %s ORDER BY id DESC LIMIT 1\",\$like),ARRAY_A); if(\$r){\$pl=json_decode(\$r[\"source_payload\"],true); \$p=wc_get_product((int)\$r[\"wc_product_id\"]); unset(\$r[\"source_payload\"]); \$r[\"payload_price\"]=\$pl[\"price\"]??null; \$r[\"payload_regular\"]=\$pl[\"regular_price\"]??null; \$r[\"payload_sale\"]=\$pl[\"sale_price\"]??null; \$r[\"woo_price\"]=\$p?\$p->get_price():null; \$r[\"woo_regular\"]=\$p?\$p->get_regular_price():null; \$r[\"woo_sale\"]=\$p?\$p->get_sale_price():null; \$rows[]=\$r; }}
              \$pending=function_exists(\"as_get_scheduled_actions\") ? count(as_get_scheduled_actions([\"group\"=>\"mdo-supplier-sync\",\"status\"=>ActionScheduler_Store::STATUS_PENDING,\"per_page\"=>1000],\"ids\")) : null;
              echo \"PROBE=\".wp_json_encode([\"version\"=>defined(\"MDO_SUPPLIER_SYNC_VERSION\")?MDO_SUPPLIER_SYNC_VERSION:null,\"latest_run\"=>\$run,\"pending_group_actions\"=>\$pending,\"products\"=>\$rows],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);
            ' --path='$PROD_PATH' --allow-root
          "

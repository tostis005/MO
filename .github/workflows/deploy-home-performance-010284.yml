name: Deploy Home Performance 0.10.284

on:
  push:
    branches: [ main ]
    paths:
      - 'mu-plugins/mdo-home-performance-010284.php'
      - '.github/workflows/deploy-home-performance-010284.yml'
      - '.github/deploy-home-performance-010284.trigger*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint MU plugin
        run: php -l mu-plugins/mdo-home-performance-010284.php

      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Locate production WordPress
        id: prod
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          ROOT=$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          existing=$(find /var/www/vhosts "$HOME" -maxdepth 10 -type f -path '*/httpdocs/wp-content/mu-plugins/mdo-home-performance-010284.php' 2>/dev/null | head -n1)
          if [ -n "$existing" ]; then
            printf '%s' "${existing%/wp-content/mu-plugins/mdo-home-performance-010284.php}"
            exit 0
          fi
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            root=$(dirname "$cfg")
            if grep -q 'elmercadodeorigen' "$cfg" 2>/dev/null; then printf '%s' "$root"; exit 0; fi
          done
          exit 23
          REMOTE
          )
          [ -n "$ROOT" ]
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo 'Production WordPress located.'

      - name: Deploy and prepare Home assets
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          ROOT='${{ steps.prod.outputs.root }}'
          sshpass -e ssh -o StrictHostKeyChecking=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" "mkdir -p '$ROOT/wp-content/mu-plugins'"
          sshpass -e scp -o StrictHostKeyChecking=no -P "$PORT" mu-plugins/mdo-home-performance-010284.php "$STAGING_USER@$STAGING_HOST:$ROOT/wp-content/mu-plugins/mdo-home-performance-010284.php"
          sshpass -e ssh -o StrictHostKeyChecking=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          [ -n "$php_bin" ] || exit 24
          "$php_bin" -l "$ROOT/wp-content/mu-plugins/mdo-home-performance-010284.php"
          upload_dir="$ROOT/wp-content/uploads/2026/08"
          src=$(find "$upload_dir" -maxdepth 1 -type f \( -iname 'La-huerta-de-ana-mary-fondo*.jpg' -o -iname 'La-huerta-de-ana-mary-fondo*.jpeg' -o -iname 'La-huerta-de-ana-mary-fondo*.png' -o -iname 'La-huerta-de-ana-mary-fondo*.webp' \) ! -iname '*-mdo-*' -printf '%s %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)
          [ -n "$src" ] || { echo 'La Huerta source image not found' >&2; exit 25; }
          "$php_bin" -r '
          $src=$argv[1]; $dir=dirname($src); $info=@getimagesize($src);
          if(!$info || !function_exists("imagewebp")){fwrite(STDERR,"GD/WebP unavailable\n");exit(41);} 
          switch($info[2]){case IMAGETYPE_JPEG:$im=@imagecreatefromjpeg($src);break;case IMAGETYPE_PNG:$im=@imagecreatefrompng($src);break;case IMAGETYPE_WEBP:$im=@imagecreatefromwebp($src);break;default:$im=false;}
          if(!$im){fwrite(STDERR,"Cannot decode source\n");exit(42);} $sw=imagesx($im);$sh=imagesy($im);
          foreach([480,960] as $target){$tw=min($target,$sw);$th=max(1,(int)round($sh*$tw/$sw));$out=imagecreatetruecolor($tw,$th);imagealphablending($out,false);imagesavealpha($out,true);$tr=imagecolorallocatealpha($out,0,0,0,127);imagefilledrectangle($out,0,0,$tw,$th,$tr);imagecopyresampled($out,$im,0,0,0,0,$tw,$th,$sw,$sh);$file=$dir."/La-huerta-de-ana-mary-fondo-mdo-".$target.".webp";if(!imagewebp($out,$file,82)){exit(43);}imagedestroy($out);$dim=getimagesize($file);echo basename($file)." ".$dim[0]."x".$dim[1]." ".filesize($file)." bytes\n";} imagedestroy($im);
          ' "$src"
          rm -f "$ROOT/wp-content/uploads/elmercado-home-static/index.html"
          echo 'Static Home cache invalidated.'
          REMOTE

      - name: Production smoke validation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 'https://www.elmercadodeorigen.com/?mdo_deploy_check=010284' -o /tmp/fresh.html
          curl -fsSL --retry 4 --retry-delay 2 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          grep -q '</html>' /tmp/home.html
          grep -q 'mdo-home-performance-010284' /tmp/home.html
          grep -Eq 'La-huerta-de-ana-mary-fondo-mdo-(480|960)\.webp' /tmp/home.html
          if grep -Eiq '<link[^>]+woo-coupon-usage' /tmp/home.html; then echo 'Coupon stylesheet remains on Home' >&2; exit 31; fi
          echo 'Home deployment smoke validation passed.'

name: Fix AOVE landing product set

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-aove-landings-product-set-production-20260830.yml'
      - '.github/scripts/fix-aove-landings-product-set-production-20260830.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify all three AOVE products
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" -d memory_limit=768M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/emdo-aove-fix-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE'"
          sshpass -e scp -P "$PORT" -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            .github/scripts/fix-aove-landings-product-set-production-20260830.php "$STAGING_USER@$STAGING_HOST:$REMOTE/"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE/fix-aove-landings-product-set-production-20260830.php' --path='$PROD' --allow-root" > /tmp/aove-fix.json
          cat /tmp/aove-fix.json
          jq -e '.verified==true and .product_count==3 and (.product_slugs|length)==3 and (.pages|length)==3' /tmp/aove-fix.json >/dev/null
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; '$PHP' '$WP' rocket clean --confirm --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          for url in \
            'https://www.elmercadodeorigen.com/aove-cordoba-directo-almazara/' \
            'https://www.elmercadodeorigen.com/aove-arbequina/' \
            'https://www.elmercadodeorigen.com/aove-picual/' \
            'https://www.elmercadodeorigen.com/en/cordoba-extra-virgin-olive-oil-direct-from-mill/' \
            'https://www.elmercadodeorigen.com/en/arbequina-extra-virgin-olive-oil/' \
            'https://www.elmercadodeorigen.com/en/picual-extra-virgin-olive-oil/'; do
            code="$(curl -LsS --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO AOVE verify' -o /tmp/aove.html -w '%{http_code}' "${url}?verify_aove=${GITHUB_RUN_ID}")"
            [ "$code" = "200" ] || { echo "HTTP $code for $url" >&2; exit 20; }
            grep -Fqi '15x1L' /tmp/aove.html || grep -Fqi '15 × 1L' /tmp/aove.html || { echo "15x1L product missing from $url" >&2; exit 21; }
          done
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'" || true
          echo complete_aove_product_set_verified
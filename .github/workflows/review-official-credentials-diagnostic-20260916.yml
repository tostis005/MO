name: Inspect official review API credential availability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-official-credentials-diagnostic-20260916.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Inspect production configuration names only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          [ -n "$wp_bin" ] || exit 1
          [ -n "$php_bin" ] || exit 1
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in *elmercadodeorigen.com*) PROD_PATH="$p"; break;; esac
          done
          : "${PROD_PATH:?production path not found}"
          prefix=$("$php_bin" -d memory_limit=512M "$wp_bin" db prefix --path="$PROD_PATH" --allow-root)

          echo '=== OFFICIAL REVIEW CONFIG INVENTORY ==='
          echo '-- wp-config constant names only --'
          perl -ne 'while (/define\s*\(\s*["'"'"']([^"'"'"']*(?:GOOGLE|TRUSTPILOT|OAUTH)[^"'"'"']*)["'"'"']/ig) { print "CONST:$1\n"; }' "$PROD_PATH/wp-config.php" | sort -u || true
          echo '-- environment variable names only --'
          env | cut -d= -f1 | grep -Ei 'GOOGLE|TRUSTPILOT|OAUTH' | sed 's/^/ENV:/' | sort -u || true
          echo '-- WordPress option names and byte lengths only --'
          "$php_bin" -d memory_limit=512M "$wp_bin" db query "SELECT option_name,LENGTH(option_value) FROM ${prefix}options WHERE (option_name LIKE '%google%' OR option_name LIKE '%trustpilot%' OR option_name LIKE '%oauth%') AND (option_name LIKE '%token%' OR option_name LIKE '%client%' OR option_name LIKE '%api%' OR option_name LIKE 'mdo_%') ORDER BY option_name" --skip-column-names --path="$PROD_PATH" --allow-root || true
          echo '-- active/mu plugin names related to Google/Trustpilot --'
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin list --fields=name,status,version --format=csv --path="$PROD_PATH" --allow-root | grep -Ei '^(name|.*(google|trustpilot).*)' || true
          echo '=== END OFFICIAL REVIEW CONFIG INVENTORY ==='
          REMOTE

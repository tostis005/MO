name: Verify top 3 internal links 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-top3-internal-links-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify rendered internal links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          import time
          import urllib.request
          from bs4 import BeautifulSoup

          targets = {
              'lentils': '/hay-que-poner-lentejas-en-remojo-cuanto-tiempo/',
              'chickpeas': '/garbanzos-tiempo-remojo-cuanto-tardan-cocerse/',
              'beef': '/en/how-much-protein-in-beef/',
          }

          sources = {
              'lentils': [
                  'https://www.elmercadodeorigen.com/hay-que-tirar-agua-remojo-legumbres-se-puede-aprovechar/',
                  'https://www.elmercadodeorigen.com/remojo-legumbres-pierden-nutrientes/',
                  'https://www.elmercadodeorigen.com/por-que-legumbres-quedan-duras-se-rompen-pierden-piel/',
              ],
              'chickpeas': [
                  'https://www.elmercadodeorigen.com/garbanzos-agua-caliente-o-fria-remojo-coccion/',
                  'https://www.elmercadodeorigen.com/hay-que-tirar-agua-remojo-legumbres-se-puede-aprovechar/',
                  'https://www.elmercadodeorigen.com/remojo-legumbres-pierden-nutrientes/',
              ],
              'beef': [
                  'https://www.elmercadodeorigen.com/en/beef-nutrients-protein-iron-zinc-vitamins/',
                  'https://www.elmercadodeorigen.com/en/high-protein-foods-meat-legumes-cured-products/',
                  'https://www.elmercadodeorigen.com/en/how-much-iron-in-beef/',
                  'https://www.elmercadodeorigen.com/en/how-much-meat-to-plan-per-person-by-cut-and-recipe/',
              ],
          }

          def fetch(url):
              last = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(
                          url + ('&' if '?' in url else '?') + 'mdo_link_verify=20260908',
                          headers={'User-Agent': 'Mozilla/5.0 MDO-SEO-Verify'}
                      )
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return r.read().decode('utf-8', 'replace')
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt)
              raise last

          for label, urls in sources.items():
              target = targets[label]
              linked_pages = 0
              for url in urls:
                  html = fetch(url)
                  soup = BeautifulSoup(html, 'html.parser')
                  anchors = [a for a in soup.find_all('a', href=True) if target in a.get('href', '')]
                  count = len(anchors)
                  print(label, url, 'links_to_target=', count)
                  if count:
                      linked_pages += 1
              print(label, 'linked_source_pages=', linked_pages)
              assert linked_pages >= 2, f'{label}: expected at least 2 contextual source pages linking to target, got {linked_pages}'
          PY

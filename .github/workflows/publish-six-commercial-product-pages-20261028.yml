name: Publish six commercial product pages with clean URLs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-six-commercial-product-pages-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: six-mentta-packs-commercial-urls-20261028
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint marketing presentation and six existing product updates
        run: |
          set -euo pipefail
          php -l mu-plugins/emdo-mentta-exclusive-products.php
          php -l .github/scripts/publish-six-mentta-packs-clean-slugs-20261028.php
          grep -Fq 'Version: 1.3.0' mu-plugins/emdo-mentta-exclusive-products.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Apply new slugs, clean descriptions and storefront pages in production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          RUN="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-exclusive-products.php "$TARGET:/tmp/commercial-six-views-$RUN.php"
          sshpass -e scp "${SCP[@]}" .github/scripts/publish-six-mentta-packs-clean-slugs-20261028.php "$TARGET:/tmp/commercial-six-slugs-$RUN.php"
          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$PROD_PATH' '$RUN'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; RUN="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          LIVE="$SITE/wp-content/mu-plugins/emdo-mentta-exclusive-products.php"
          SCRIPT="/tmp/commercial-six-slugs-$RUN.php"
          test -f "$LIVE"
          "$PHP_BIN" -l "$SCRIPT"
          "$PHP_BIN" -l "/tmp/commercial-six-views-$RUN.php"
          MDO_PACK_PUBLIC_MODE=preflight "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          cp -a "$LIVE" "$LIVE.before-commercial-urls-$RUN"
          MDO_PACK_PUBLIC_MODE=apply "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          install -m 0644 "/tmp/commercial-six-views-$RUN.php" "$LIVE"
          "$PHP_BIN" -l "$LIVE"
          MDO_PACK_PUBLIC_MODE=verify "$PHP_BIN" -d memory_limit=768M "$WP_BIN" eval-file "$SCRIPT" --path="$SITE" --allow-root
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval '
            foreach ([21814,21818,21820,21904,21906,21908] as $id) {
              clean_post_cache($id);
              if(function_exists("rocket_clean_post")) rocket_clean_post($id);
            }
            if(function_exists("rocket_clean_domain")) rocket_clean_domain();
            wp_cache_flush();
          ' --path="$SITE" --allow-root
          rm -f "$SCRIPT" "/tmp/commercial-six-views-$RUN.php"
          REMOTE
      - name: Ensure six clean public pages with zero technical references
        run: |
          set -euo pipefail
          BASE="https://www.elmercadodeorigen.com/producto"
          for SLUG in \
            pack-degustacion-pasaporte-salvaje \
            pack-degustacion-safari-africano \
            pack-degustacion-vuelta-al-mundo \
            pack-cafe-esencia-de-costa-rica \
            pack-cafe-ruta-de-los-cuatro-origenes \
            pack-cafe-coleccion-completa
          do
            FILE="/tmp/customer-six-$SLUG.html"
            HTTP="$(curl -sS -L --connect-timeout 9 --max-time 30 -o "$FILE" -w '%{http_code}' "$BASE/$SLUG/")"
            echo "CUSTOMER_PAGE $SLUG HTTP=$HTTP"
            test "$HTTP" = 200
            grep -Fq 'EL MERCADO DE ORIGEN' "$FILE"
            grep -Fq 'Descubre este pack' "$FILE"
            if grep -Eiq 'mentta|ficha de producto para revisión|integración con menta|revisión de menta|referencia:.*mentta|importador|exportador' "$FILE"; then
              echo "::error::Technical marketplace wording on $SLUG"; exit 1
            fi
          done
          for SLUG in \
            jamon-de-bellota-100-iberico-montjam-mentta \
            pack-musee-mentta-reserva-de-caza \
            pack-musee-mentta-parrilla-sin-fronteras-xl \
            pack-musee-mentta-universo-wagyu \
            pack-musee-mentta-leyendas-del-vacuno
          do
            HTTP="$(curl -sS -L --connect-timeout 9 --max-time 30 -o /dev/null -w '%{http_code}' "$BASE/$SLUG/")"
            echo "OTHER_PROTECTED $SLUG HTTP=$HTTP"
            test "$HTTP" = 404
          done
          echo SIX_CLEAN_CUSTOMER_FACING_PACK_URLS_VERIFIED

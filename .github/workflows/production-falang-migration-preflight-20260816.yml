name: Production Falang migration preflight 2026-08-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-falang-migration-preflight-20260816.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Audit TranslatePress data and API
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"; : "${PROD_PATH:?production path not found}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          wp(){ "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" --path="$PROD_PATH" --allow-root "$@"; }
          echo '=== PLUGIN ==='
          wp plugin list --fields=name,status,version --format=table | grep -Ei 'translatepress|falang' || true
          echo '=== TRP TABLES ==='
          prefix=$(wp db prefix)
          wp db query "SHOW TABLES LIKE '${prefix}trp%';" --skip-column-names || true
          echo '=== TRP TABLE COUNTS/COLUMNS ==='
          for t in $(wp db query "SHOW TABLES LIKE '${prefix}trp%';" --skip-column-names 2>/dev/null || true); do
            echo "--- $t ---"
            wp db query "SELECT COUNT(*) AS rows_count FROM \`$t\`;" --skip-column-names 2>/dev/null || true
            wp db query "SHOW COLUMNS FROM \`$t\`;" --skip-column-names 2>/dev/null | head -n 30 || true
          done
          echo '=== TRP API ==='
          wp eval 'echo "trp_translate=".(function_exists("trp_translate")?"yes":"no")."\n"; echo "TRP_Translate_Press=".(class_exists("TRP_Translate_Press")?"yes":"no")."\n";'
          echo '=== SAMPLE OBJECT TRANSLATIONS ==='
          wp eval '
            $ids=[1350];
            $front=(int)get_option("page_on_front"); if($front)$ids[]=$front;
            $shop=wc_get_page_id("shop"); if($shop>0)$ids[]=$shop;
            foreach(array_unique($ids) as $id){$p=get_post($id); if(!$p)continue; echo "ID={$id} type={$p->post_type}\n"; foreach(["post_title","post_excerpt","post_content"] as $f){$v=$p->$f; $t=function_exists("trp_translate")?trp_translate($v,"en_US"):$v; echo $f." original=".mb_substr(wp_strip_all_tags($v),0,180)."\n"; echo $f." english=".mb_substr(wp_strip_all_tags($t),0,180)."\n";} }
          ' 2>/dev/null || true
          echo '=== TRANSLATED DICTIONARY SAMPLE ==='
          dict=$(wp db query "SHOW TABLES LIKE '${prefix}trp_dictionary_es_es_en_us';" --skip-column-names 2>/dev/null | head -n1 || true)
          if [ -n "$dict" ]; then
            wp db query "SELECT id,original,translated,status FROM \`$dict\` WHERE status=2 AND translated<>'' ORDER BY id DESC LIMIT 30;" --skip-column-names 2>/dev/null || true
          fi
          echo '=== PAGE/PRODUCT COUNTS ==='
          wp eval 'foreach(["page","product"] as $pt){$c=wp_count_posts($pt);echo $pt." publish=".($c->publish??0)."\n";}'
          REMOTE

name: Verify blog specials live 2026-08-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-specials-live-verify-20260831.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public blog specials and grid
        shell: bash
        run: |
          set -euo pipefail
          # Cache-busted production request with hard network limits.
          url="https://www.elmercadodeorigen.com/blog/?emdo_specials_verify=${GITHUB_SHA:0:12}"
          html="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url")"

          grep -Fq 'emo-journal--discovery' <<<"$html"
          grep -Fq 'data-blog-specials="010266"' <<<"$html"
          grep -Fq '>Especiales<' <<<"$html"
          grep -Eq 'class="[^"]*products[^"]*columns-4[^"]*"|class="[^"]*columns-4[^"]*products[^"]*"' <<<"$html"
          grep -Fq 'emo-blog-grid' <<<"$html"

          BLOG_HTML="$html" python3 - <<'PY'
          import os, re
          html = os.environ['BLOG_HTML']
          marker = 'data-blog-specials="010266"'
          start = html.find(marker)
          if start < 0:
              raise SystemExit('Specials marker missing')
          end = html.find('emo-blog-featured', start)
          if end < 0:
              end = html.find('emo-blog-results', start)
          if end < 0:
              end = min(len(html), start + 120000)
          block = html[start:end]
          product_cards = len(re.findall(r'<li\b[^>]*class="[^"]*\bproduct\b', block, flags=re.I))
          if not 1 <= product_cards <= 4:
              raise SystemExit(f'Unexpected specials product count: {product_cards}')
          print(f'BLOG_SPECIALS_LIVE_OK=true product_cards={product_cards}')
          PY

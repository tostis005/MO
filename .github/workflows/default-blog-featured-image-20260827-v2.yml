name: Central default blog featured image v2 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/default-blog-featured-image-20260827-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: central-default-blog-featured-image-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate reconstructed image
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/apply-default-blog-featured-image-20260827.php
          php -l mu-plugins/mdo-default-blog-featured-image-20260827.php
          cat .github/assets/blog-default-featured/part-*.b64 | tr -d '\n\r ' | base64 -d > /tmp/emdo-blog-default.webp
          test -s /tmp/emdo-blog-default.webp
          echo '1f29e080a4628964818db7ea91e658ab87941ce1aad7397688c6cd167e4310c9  /tmp/emdo-blog-default.webp' | sha256sum -c -

      - name: Apply shared provisional image in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-default-blog-${GITHUB_RUN_ID}; IMG=$REMOTE/default.webp; PUB=$REMOTE/apply.php; PLUGIN=$REMOTE/default-plugin.php
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$REMOTE' '$PROD/wp-content/mu-plugins'"
          sshpass -e scp $SCP /tmp/emdo-blog-default.webp "$STAGING_USER@$STAGING_HOST:$IMG"
          sshpass -e scp $SCP .github/scripts/apply-default-blog-featured-image-20260827.php "$STAGING_USER@$STAGING_HOST:$PUB"
          sshpass -e scp $SCP mu-plugins/mdo-default-blog-featured-image-20260827.php "$STAGING_USER@$STAGING_HOST:$PLUGIN"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m 0644 '$PLUGIN' '$PROD/wp-content/mu-plugins/mdo-default-blog-featured-image-20260827.php'; export PATH='$(dirname "$PHP")':\$PATH; EMDO_DEFAULT_BLOG_IMAGE_FILE='$IMG' '$PHP' -d memory_limit=768M -d display_errors=0 '$WP' eval 'require \"$PUB\";' --path='$PROD' --allow-root" | tee /tmp/default-blog-apply.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' db query \"SELECT p.ID,p.post_name,thumb.meta_value,marker.meta_value FROM wp_posts p JOIN wp_postmeta marker ON marker.post_id=p.ID AND marker.meta_key='_emdo_uses_default_featured' AND marker.meta_value='1' LEFT JOIN wp_postmeta thumb ON thumb.post_id=p.ID AND thumb.meta_key='_thumbnail_id' WHERE p.post_type='post' ORDER BY p.ID;\" --skip-column-names --path='$PROD' --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" | tee /tmp/default-blog-db.txt
          test "$(wc -l < /tmp/default-blog-db.txt)" -ge 5
          test "$(awk -F '\t' '{print $3}' /tmp/default-blog-db.txt | grep -E '^[0-9]+$' | sort -u | wc -l)" -eq 1

      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; f=/tmp/default-blog-page.html; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO default image verifier' -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$url?defaultimg=$stamp"); test "$c" = 200; grep -Fq 'emo-article-featured' "$f"; grep -Fq 'el-mercado-de-origen-blog-provisional-' "$f"; }
          check "$BASE/jamon-iberico-o-paleta-iberica-diferencias-cual-elegir/"
          check "$BASE/en/iberian-ham-vs-iberian-shoulder-differences-which-to-choose/"
          check "$BASE/jamon-iberico-vs-jamon-serrano-diferencias-como-elegir/"
          check "$BASE/en/iberian-ham-vs-serrano-ham-differences-how-to-choose/"
          check "$BASE/lomo-iberico-vs-lomito-iberico-diferencias-cual-elegir/"
          check "$BASE/en/iberian-lomo-vs-lomito-differences-which-to-choose/"
          check "$BASE/chorizo-vs-salchichon-diferencias-ingredientes-sabor-curacion/"
          check "$BASE/en/chorizo-vs-salchichon-differences-ingredients-flavour-curing/"
          check "$BASE/jamon-entero-o-deshuesado-diferencias-cual-elegir/"
          check "$BASE/en/whole-vs-boneless-iberian-ham-differences-which-to-choose/"

      - name: Record verified deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json,os
          apply=json.load(open('/tmp/default-blog-apply.json',encoding='utf-8'))
          rows=[]
          for line in open('/tmp/default-blog-db.txt',encoding='utf-8'):
              p=line.rstrip('\n').split('\t')
              if len(p)>=4: rows.append({'id':int(p[0]),'slug':p[1],'thumbnail_id':int(p[2]),'default_marker':p[3]})
          out={'release':'20260827','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':True,'default_attachment_id':apply['default_attachment_id'],'default_hash':apply['default_hash'],'image_width':apply['image_width'],'image_height':apply['image_height'],'image_url':apply['image_url'],'posts':rows}
          open('.deploy-status/default-blog-featured-image-20260827.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/default-blog-featured-image-20260827.json
          git commit -m 'Record verified central default blog image [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

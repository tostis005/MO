name: Deploy CF7 REST guard fix 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - 'mu-plugins/mdo-cf7-rest-guard-20260828.php'
      - '.github/workflows/deploy-cf7-rest-guard-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate corrected guard
        shell: bash
        run: |
          set -euo pipefail
          php -l mu-plugins/mdo-cf7-rest-guard-20260828.php >/dev/null
          grep -Fq "Version: 1.0.1" mu-plugins/mdo-cf7-rest-guard-20260828.php
          grep -Fq "function mdo_cf7_rest_guard_token" mu-plugins/mdo-cf7-rest-guard-20260828.php
          grep -Fq 'wp_unslash( $_POST[ $field_name ] )' mu-plugins/mdo-cf7-rest-guard-20260828.php

      - name: Deploy to production and verify
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 1
            [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          TARGET="$PROD_PATH/wp-content/mu-plugins/mdo-cf7-rest-guard-20260828.php"
          REMOTE="/tmp/mdo-cf7-rest-guard-${GITHUB_RUN_ID}.php"
          LOCAL_HASH="$(sha256sum mu-plugins/mdo-cf7-rest-guard-20260828.php | cut -d' ' -f1)"

          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-cf7-rest-guard-20260828.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "set -e; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$REMOTE' >/dev/null; mkdir -p '$PROD_PATH/wp-content/mu-plugins'; if [ -f '$TARGET' ]; then cp -p '$TARGET' '$TARGET.bak-20260901'; fi; install -m 0644 '$REMOTE' '$TARGET'; rm -f '$REMOTE'"

          REMOTE_HASH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sha256sum '$TARGET' | cut -d' ' -f1")"
          test "$LOCAL_HASH" = "$REMOTE_HASH"

          REMOTE_VERSION="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=256M \"\$wp_bin\" eval 'echo defined(\"MDO_CF7_REST_GUARD_VERSION\") ? MDO_CF7_REST_GUARD_VERSION : \"missing\";' --path='$PROD_PATH' --skip-themes --allow-root")"
          test "$REMOTE_VERSION" = "1.0.1"

          echo "production_hash_match=yes"
          echo "production_version=$REMOTE_VERSION"

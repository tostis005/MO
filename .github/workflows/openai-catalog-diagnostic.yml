name: OpenAI Catalog Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-catalog-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Print OpenAI catalog validation issues
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          test -n "$wp_bin"; test -n "$php_bin"
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break ;;
            esac
          done
          test -n "$PROD_PATH"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval '
            $s=mdo_openai_settings_20260909(); $s["format"]="native_jsonl_gz"; $s["delivery"]="none";
            $r=mdo_openai_validate_catalog_20260909($s);
            printf("SUMMARY exported=%d errors=%d warnings=%d excluded=%d parents=%d variants=%d\n",$r["exported"]??0,$r["errors"]??0,$r["warnings"]??0,$r["excluded"]??0,$r["parents"]??0,$r["variants"]??0);
            foreach(($r["issues"]??[]) as $i=>$issue){printf("ISSUE %03d %s\n",$i+1,wp_json_encode($issue,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));}
          ' --path="$PROD_PATH" --allow-root
          REMOTE

name: PR certify production blog imagery 20260822

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/repair-blog-images-010262.php'
      - '.github/scripts/blog-image-state-010262.php'
      - '.github/scripts/fix-aove-cover-20260822.php'
      - '.github/scripts/certify-blog-images-20260822.php'
      - '.github/data/editorial-image-overrides-20260821.php'
      - '.github/data/legacy-blog-image-overrides-20260821.php'
      - '.github/workflows/pr-certify-blog-images-20260822.yml'

permissions:
  contents: read

jobs:
  repair-and-certify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate repair and certifier files
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/repair-blog-images-010262.php
          php -l .github/scripts/blog-image-state-010262.php
          php -l .github/scripts/fix-aove-cover-20260822.php
          php -l .github/scripts/certify-blog-images-20260822.php
          php -l .github/data/editorial-image-overrides-20260821.php
          php -l .github/data/legacy-blog-image-overrides-20260821.php
          : "${STAGING_HOST:?STAGING_HOST missing}"
          : "${STAGING_USER:?STAGING_USER missing}"
          : "${STAGING_PASSWORD:?STAGING_PASSWORD missing}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Repair approved images and certify WordPress production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          REMOTE="/tmp/emdo-diverse-blog-cert-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          sshpass -e scp $SCP \
            .github/scripts/repair-blog-images-010262.php \
            .github/scripts/blog-image-state-010262.php \
            .github/scripts/fix-aove-cover-20260822.php \
            .github/scripts/certify-blog-images-20260822.php \
            .github/data/editorial-image-overrides-20260821.php \
            .github/data/legacy-blog-image-overrides-20260821.php \
            "$STAGING_USER@$STAGING_HOST:$REMOTE/"

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PROD_PATH' '$REMOTE' '${GITHUB_SHA}'" <<'REMOTE_SCRIPT'
          set -eu
          prod="$1"; incoming="$2"; source_sha="$3"
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_cmd="$php_bin -d memory_limit=768M $wp_bin --path=$prod --skip-plugins --skip-themes --allow-root"

          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          backup_dir="$rollback_root/$(date -u +%Y%m%dT%H%M%SZ)-before-blog-image-diversity-${source_sha%??????????????????????????????????????}"
          mkdir -p "$backup_dir"
          state_file="$backup_dir/post-state.json"
          printf '%s\n' "$source_sha" > "$backup_dir/source-sha.txt"

          MDO_STATE_MODE=backup \
          MDO_STATE_FILE="$state_file" \
          MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
          MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
          sh -c "$wp_cmd eval-file '$incoming/blog-image-state-010262.php'" > "$backup_dir/backup.log"
          test -s "$state_file"

          changed=1
          rollback_on_error() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$changed" -eq 1 ]; then
              MDO_STATE_MODE=restore \
              MDO_STATE_FILE="$state_file" \
              MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
              MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
              sh -c "$wp_cmd eval-file '$incoming/blog-image-state-010262.php'" >/dev/null 2>&1 || true
              sh -c "$wp_cmd cache flush" >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap rollback_on_error EXIT

          MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
          MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
          sh -c "$wp_cmd eval-file '$incoming/repair-blog-images-010262.php'" > "$incoming/repair.json"
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);if(!is_array($r)||($r["status"]??"")!=="ok"||!empty($r["duplicates"])||($r["authority_post_count"]??0)<50){fwrite(STDERR,"repair validation failed\n");exit(1);}' "$incoming/repair.json"

          sh -c "$wp_cmd eval-file '$incoming/fix-aove-cover-20260822.php'" > "$incoming/aove.json"
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);if(!is_array($r)||($r["status"]??"")!=="ok"||($r["pexels_id"]??"")!=="18465070"){fwrite(STDERR,"AOVE cover validation failed\n");exit(1);}' "$incoming/aove.json"
          sh -c "$wp_cmd cache flush" >/dev/null 2>&1 || true

          MDO_AUTHORITY_IMAGE_OVERRIDES="$incoming/editorial-image-overrides-20260821.php" \
          MDO_LEGACY_IMAGE_OVERRIDES="$incoming/legacy-blog-image-overrides-20260821.php" \
          sh -c "$wp_cmd eval-file '$incoming/certify-blog-images-20260822.php'" > "$incoming/cert.json"
          "$php_bin" -r '$r=json_decode(file_get_contents($argv[1]),true);if(!is_array($r)||($r["status"]??"")!=="ok"||($r["authority_count"]??0)<50||!empty($r["duplicates_by_pexels"])||!empty($r["duplicates_by_md5"])||!empty($r["forbidden_hits"])||!empty($r["semantic_flags"])){fwrite(STDERR,"certification validation failed\n");exit(1);}' "$incoming/cert.json"

          cp "$incoming/repair.json" "$backup_dir/repair.json"
          cp "$incoming/aove.json" "$backup_dir/aove.json"
          cp "$incoming/cert.json" "$backup_dir/cert.json"
          trap - EXIT
          printf 'BACKUP_DIR=%s\n' "$backup_dir"
          echo WORDPRESS_REPAIR_AND_CERT_OK
          REMOTE_SCRIPT

          sshpass -e scp $SCP "$STAGING_USER@$STAGING_HOST:$REMOTE/cert.json" /tmp/blog-cert-report.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/blog-cert-report.json'))
          assert d['status']=='ok'
          assert d['authority_count'] >= 50
          assert not d['duplicates_by_pexels']
          assert not d['duplicates_by_md5']
          assert not d['forbidden_hits']
          assert not d['semantic_flags']
          print('WORDPRESS_PRODUCTION_CERT_OK')
          print('published_posts=', d['published_post_count'])
          print('authority_posts=', d['authority_count'])
          print('audited_images=', len(d['all_images']))
          print('duplicates_by_pexels=0')
          print('duplicates_by_md5=0')
          print('forbidden_hits=0')
          print('semantic_flags=0')
          PY

      - name: Verify public rendering and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/public-checks.tsv
          import json
          d=json.load(open('/tmp/blog-cert-report.json'))
          for row in d['public_checks']:
              print(f"{row['expected_pexels_id']}\t{row['url']}\t{row['context']}")
          PY

          checks=0
          while IFS=$'\t' read -r expected url context; do
            [ -n "$expected" ] && [ -n "$url" ]
            page="/tmp/emdo-public-${expected}.html"
            result="$(curl -ksS -L --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 60 -A 'EMDO production image certification/20260822' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$page" -w '%{http_code}|%{url_effective}' "${url}?emdo_image_cert=${GITHUB_SHA}")"
            code="${result%%|*}"
            [ "$code" = 200 ] || { echo "HTTP $code for $context" >&2; exit 1; }
            grep -Fq "$expected" "$page" || { echo "Expected image $expected not rendered for $context" >&2; exit 1; }
            ! grep -Eq '37328201|19370451|4441933|36601487|37328770|24706530|34314216|36215958|24906286|30795237|30795238|947174|14639925|6059884|25185476|30811288|36183155' "$page"
            checks=$((checks+1))
          done < /tmp/public-checks.tsv

          aove=/tmp/aove-cover.html
          curl -ksS -L --retry 3 --connect-timeout 12 --max-time 60 -H 'Cache-Control: no-cache' -o "$aove" "https://www.elmercadodeorigen.com/que-significa-aceite-oliva-virgen-extra/?emdo_image_cert=${GITHUB_SHA}"
          grep -Fq '18465070' "$aove"
          ! grep -Fq '36183155' "$aove"

          for path in '/en/journal/' '/en/journal/page/2/' '/en/journal/page/3/'; do
            file="/tmp/archive-$(echo "$path" | tr '/' '_').html"
            code="$(curl -ksS -L --retry 3 --connect-timeout 12 --max-time 60 -o "$file" -w '%{http_code}' "https://www.elmercadodeorigen.com${path}?emdo_image_cert=${GITHUB_SHA}")"
            [ "$code" = 200 ] || exit 1
            ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error on this website|Page not found|Página no encontrada' "$file"
          done
          echo "PUBLIC_RENDER_CERT_OK checks=$checks aove=1 pagination=3"

      - name: Certification passed
        run: echo BLOG_IMAGE_PRODUCTION_CERTIFIED

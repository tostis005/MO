name: PR verify final brand-safe Journal covers 20260824

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-certify-blog-images-20260822.yml'
      - '.github/scripts/apply-brand-safe-editorial-covers-20260824.php'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?STAGING_HOST missing}"
          : "${STAGING_USER:?STAGING_USER missing}"
          : "${STAGING_PASSWORD:?STAGING_PASSWORD missing}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Read final WordPress cover state
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 8 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?Production path not found}"

          REMOTE="/tmp/emdo-cover-readonly-${GITHUB_RUN_ID}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE' && cat > '$REMOTE/final-state.php'" <<'PHP'
          <?php
          if (!defined('ABSPATH')) { exit; }
          function emdo_find_final($kind,$value){
            if($kind==='authority'){$x=get_posts(array('post_type'=>'post','post_status'=>'publish','posts_per_page'=>2,'fields'=>'ids','meta_key'=>'_emdo_authority_key','meta_value'=>$value));}
            elseif($kind==='slug'){$p=get_page_by_path($value,OBJECT,'post');$x=$p instanceof WP_Post&&$p->post_status==='publish'?array($p->ID):array();}
            else{$x=array();foreach(get_posts(array('post_type'=>'post','post_status'=>'publish','posts_per_page'=>-1,'fields'=>'ids')) as $id){if(false!==stripos((string)get_the_title($id),$value)){$x[]=$id;}}}
            if(count($x)!==1){throw new RuntimeException('Target not unique: '.$kind.':'.$value);}
            return (int)$x[0];
          }
          $specs=array(
            array('authority','ham-cutting-guide','asset','emdo-jamon-corte-20260824'),
            array('authority','ham-quantity-per-person-guide','asset','emdo-jamon-raciones-20260824'),
            array('authority','sliced-ham-storage-guide','asset','emdo-jamon-loncheado-conservacion-20260824'),
            array('authority','iberian-ham-bones-trimmings-guide','asset','emdo-jamon-huesos-recortes-20260824'),
            array('authority','ham-starting-orientation-guide','asset','emdo-jamon-empezar-pieza-20260824'),
            array('authority','iberian-ham-parts-guide','asset','emdo-jamon-partes-20260824'),
            array('authority','whole-ham-before-opening-storage-guide','asset','emdo-jamon-conservacion-pieza-20260824'),
            array('authority','serve-iberian-ham-guide','asset','emdo-jamon-servir-20260824'),
            array('slug','jamon-iberico','asset','emdo-jamon-iberico-general-20260824'),
            array('slug','jamon-pieza-entera-o-loncheado-como-elegir','asset','emdo-jamon-entero-o-loncheado-20260824'),
            array('slug','jamon-o-paleta-diferencias-cual-elegir','asset','emdo-jamon-o-paleta-20260824'),
            array('authority','bellota-100-iberico-guide','pexels','34100094'),
            array('authority','iberian-board-guide','pexels','5865336'),
            array('authority','spanish-aperitivo-planning-guide','pexels','11406465'),
            array('authority','commercial-preserve-sterilisation-guide','pexels','33984949'),
            array('authority','evoo-expiry-quality-guide','pexels','7296399'),
            array('authority','evoo-packaging-format-guide','pexels','3737651'),
            array('title','Cómo conservar legumbres secas correctamente','pexels','8287244')
          );
          $items=array(); $files=array();
          foreach($specs as $s){
            $pid=emdo_find_final($s[0],$s[1]); $aid=(int)get_post_thumbnail_id($pid);
            if($aid<=0){throw new RuntimeException('Missing featured image: '.$s[1]);}
            $asset=(string)get_post_meta($aid,'_emdo_editorial_asset_id',true);
            $pex=(string)get_post_meta($aid,'_emdo_pexels_photo_id',true);
            if($s[2]==='asset' && $asset!==$s[3]){throw new RuntimeException('Asset mismatch '.$s[1].': '.$asset);}
            if($s[2]==='pexels' && $pex!==$s[3]){throw new RuntimeException('Pexels mismatch '.$s[1].': '.$pex);}
            $file=get_attached_file($aid); $hash=is_string($file)&&is_file($file)?md5_file($file):'';
            if($hash===''){throw new RuntimeException('Missing image bytes '.$s[1]);}
            if(isset($files[$hash])){throw new RuntimeException('Duplicate cover bytes '.$s[1].' / '.$files[$hash]);}
            $files[$hash]=$s[1];
            $items[]=array('target'=>$s[1],'post_id'=>$pid,'attachment_id'=>$aid,'asset_id'=>$asset,'pexels_id'=>$pex,'url'=>get_permalink($pid),'image_url'=>wp_get_attachment_url($aid),'md5'=>$hash);
          }
          $bad=array('37639098','37326564','37326360','28879279','31275833','28771514','34100077','17056969','11906259','6995300','3296657','38681145','5532663');
          $hits=array();
          foreach(get_posts(array('post_type'=>'post','post_status'=>'publish','posts_per_page'=>-1,'fields'=>'ids')) as $pid){
            $aid=(int)get_post_thumbnail_id((int)$pid); if($aid<=0){continue;}
            $pex=(string)get_post_meta($aid,'_emdo_pexels_photo_id',true);
            if(in_array($pex,$bad,true)){$hits[]=array('post_id'=>(int)$pid,'title'=>get_the_title($pid),'pexels_id'=>$pex);}
          }
          if($hits){throw new RuntimeException('Retired cover ids still live: '.wp_json_encode($hits));}
          echo wp_json_encode(array('status'=>'ok','items'=>$items,'retired_hits'=>$hits),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT).PHP_EOL;
          PHP

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            wp_bin=\$(command -v wp); php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE/final-state.php' --path='$PROD_PATH' --allow-root
          " > /tmp/brand-safe-final.raw

          python3 - <<'PY'
          import json
          s=open('/tmp/brand-safe-final.raw',encoding='utf-8-sig',errors='replace').read()
          obj=None
          for i,c in enumerate(s):
              if c!='{': continue
              try:
                  candidate=json.loads(s[i:])
              except Exception:
                  continue
              if isinstance(candidate,dict) and candidate.get('status')=='ok':
                  obj=candidate
                  break
          if obj is None:
              raise SystemExit('Could not extract final-state JSON from WP-CLI output:\n'+s[-3000:])
          assert len(obj['items'])==18, len(obj['items'])
          assert not obj['retired_hits'], obj['retired_hits']
          json.dump(obj,open('/tmp/brand-safe-final.json','w'),ensure_ascii=False,indent=2)
          print('WORDPRESS_FINAL_STATE_OK items=18 retired_hits=0')
          PY
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'"

      - name: Verify public Journal rendering and download previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/preview /tmp/archive
          python3 - <<'PY' > /tmp/items.tsv
          import json, os
          d=json.load(open('/tmp/brand-safe-final.json'))
          for i,row in enumerate(d['items']):
              stem=os.path.splitext(os.path.basename(row['image_url'].split('?')[0]))[0]
              safe=''.join(c if c.isalnum() or c in '-_' else '-' for c in row['target'])[:80]
              print(f"{i}\t{safe}\t{stem}\t{row['url']}\t{row['image_url']}")
          PY

          checks=0
          while IFS=$'\t' read -r idx safe stem url image_url; do
            page="/tmp/page-${idx}.html"
            result="$(curl -ksS -L --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 60 -A 'EMDO final cover certification/20260824' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$page" -w '%{http_code}|%{url_effective}' "${url}?emdo_cover_final=${GITHUB_SHA}")"
            code="${result%%|*}"
            [ "$code" = 200 ] || { echo "Article returned $code: $url" >&2; exit 1; }
            grep -Fq "$stem" "$page" || { echo "New cover not rendered on article: $url ($stem)" >&2; exit 1; }
            curl -ksS -L --retry 3 --connect-timeout 12 --max-time 60 "$image_url" -o "/tmp/preview/${idx}-${safe}.jpg"
            test -s "/tmp/preview/${idx}-${safe}.jpg"
            checks=$((checks+1))
          done < /tmp/items.tsv

          archive_all=/tmp/archive/all.html
          : > "$archive_all"
          pages=0
          for n in $(seq 1 10); do
            if [ "$n" -eq 1 ]; then path='/journal/'; else path="/journal/page/$n/"; fi
            out="/tmp/archive/page-$n.html"
            code="$(curl -ksS -L --retry 2 --connect-timeout 12 --max-time 60 -A 'EMDO final cover certification/20260824' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$out" -w '%{http_code}' "https://www.elmercadodeorigen.com${path}?emdo_cover_final=${GITHUB_SHA}")"
            if [ "$code" != 200 ]; then break; fi
            cat "$out" >> "$archive_all"
            pages=$((pages+1))
          done
          [ "$pages" -ge 6 ] || { echo "Too few Journal archive pages: $pages" >&2; exit 1; }
          while IFS=$'\t' read -r idx safe stem url image_url; do
            grep -Fq "$stem" "$archive_all" || { echo "New cover not found in Journal archives: $safe ($stem)" >&2; exit 1; }
          done < /tmp/items.tsv
          if grep -Eqi '37326564|37326360|28879279|31275833|28771514|34100077|17056969|11906259|6995300|3296657|38681145|5532663|DECHAUS|RUBIO' "$archive_all"; then
            echo 'A retired/brand-risk cover reference remains in Journal archives' >&2
            exit 1
          fi
          echo "PUBLIC_FINAL_COVERS_OK article_checks=$checks archive_pages=$pages"

      - name: Upload visual review set
        uses: actions/upload-artifact@v4
        with:
          name: brand-safe-cover-previews
          path: /tmp/preview/*.jpg
          if-no-files-found: error
          retention-days: 3

      - name: Final certification passed
        run: echo BRAND_SAFE_JOURNAL_COVERS_PRODUCTION_CERTIFIED

name: Diagnose WCFM shipping layout and quantity rates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wcfm-shipping-layout-qty-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Inspect live DOM and WCFM styles
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-bs4 >/dev/null
          mkdir -p .deploy-status
          OUT=.deploy-status/shipping-layout-qty-diagnostic.txt
          : > "$OUT"

          BASE='https://www.elmercadodeorigen.com/tienda/1957/'
          BUST="emdo_diag=${GITHUB_RUN_ID}"
          curl -fsSL -A 'Mozilla/5.0 EMDO diagnostic' -H 'Cache-Control: no-cache, no-store' -o /tmp/products.html "${BASE}?${BUST}"
          curl -fsSL -A 'Mozilla/5.0 EMDO diagnostic' -H 'Cache-Control: no-cache, no-store' -o /tmp/shipping.html "${BASE}?mdo_shipping=1&${BUST}"

          python3 - <<'PY' >> "$OUT"
          from bs4 import BeautifulSoup
          import re, urllib.request

          for label, path, selector in [
              ('PRODUCTS','/tmp/products.html','.products'),
              ('SHIPPING','/tmp/shipping.html','.mdo-store-shipping'),
          ]:
              html=open(path,encoding='utf-8',errors='ignore').read()
              soup=BeautifulSoup(html,'html.parser')
              node=soup.select_one(selector)
              print(f'=== {label} ANCESTORS ===')
              if not node:
                  print('NOT_FOUND')
                  continue
              cur=node
              for i in range(10):
                  if not cur or not getattr(cur,'name',None): break
                  attrs=[]
                  if cur.get('id'): attrs.append('#'+cur.get('id'))
                  if cur.get('class'): attrs.extend('.'+x for x in cur.get('class'))
                  print(i, cur.name + ''.join(attrs))
                  cur=cur.parent
              tabs=soup.select_one('#tab_links_area')
              if tabs:
                  print('TAB_PARENT', tabs.parent.name, tabs.parent.get('id'), tabs.parent.get('class'))
                  print('TAB_GRANDPARENT', tabs.parent.parent.name, tabs.parent.parent.get('id'), tabs.parent.parent.get('class'))

          soup=BeautifulSoup(open('/tmp/products.html',encoding='utf-8',errors='ignore').read(),'html.parser')
          print('=== RELEVANT CSS RULES ===')
          selectors=('tab_area','tab_links_area','product_area','products-wrapper','#products')
          for link in soup.find_all('link', href=True):
              href=link['href']
              if '.css' not in href: continue
              try:
                  req=urllib.request.Request(href,headers={'User-Agent':'Mozilla/5.0'})
                  css=urllib.request.urlopen(req,timeout=10).read().decode('utf-8','ignore')
              except Exception:
                  continue
              if not any(s in css for s in selectors):
                  continue
              print('CSS', href)
              for m in re.finditer(r'([^{}]+)\{([^{}]+)\}',css):
                  sel=m.group(1).strip(); body=m.group(2).strip()
                  if any(s in sel for s in selectors):
                      print(sel+'{'+body+'}')
          PY

          cat "$OUT"

      - name: Record diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/shipping-layout-qty-diagnostic.txt
          git commit -m 'Record WCFM shipping shell style diagnostic [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

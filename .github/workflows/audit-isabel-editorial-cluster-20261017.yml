name: Isabel - auditoria editorial y taxonomia 20261017
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-isabel-editorial-cluster-20261017.yml'
      - '.github/scripts/audit-isabel-editorial-cluster-20261017.php'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and inspect WordPress without changing data
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/audit-isabel-editorial-cluster-20261017.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/audit-isabel-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/audit-isabel-editorial-cluster-20261017.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            rm -f '$SCRIPT'
          " | tee /tmp/isabel-editorial-audit.log
          grep -q "^ISABEL_EDITORIAL_AUDIT=" /tmp/isabel-editorial-audit.log
          echo ISABEL_EDITORIAL_AUDIT_RUN_OK


      - name: Record audit report in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          sed -n 's/^ISABEL_EDITORIAL_AUDIT=//p' /tmp/isabel-editorial-audit.log | tail -1 | python3 -m json.tool --no-ensure-ascii > .deploy-status/isabel-editorial-audit-20261017.json
          python3 - <<'PY'
          import json
          j=json.load(open('.deploy-status/isabel-editorial-audit-20261017.json'))
          print('ISABEL_FINAL_QA',j['counts'],'POSTS',j['posts_count'],'CATEGORIES',len(j['term_details']),'LINKS',j['related_counts'])
          c=j['counts']
          assert j['posts_count']==30 and not j['post_warnings']
          assert c['total']==103 and c['published']==103
          assert c['approved_edits']==96
          assert c['instock']==86 and c['outofstock']==17
          assert c['category_root_only']==0 and c['category_conflicts']==0
          assert c['source_allergens_lost']==0 and c['source_preserved']==103
          assert c['short_empty']==0 and c['long_under300']==0
          assert len(j['term_details'])==9
          assert all(len(d.get('description',''))>=170 and len(d.get('en_description',''))>=170 for d in j['term_details'].values())
          assert len(j['related_counts'])==30 and j['related_counts']['15']>=1 and j['related_counts']['22']>=1
          assert j['related_counts']['10']==0  # all seasonal nougats currently unavailable
          assert not j['issues']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/isabel-editorial-audit-20261017.json
          git commit -m 'Record Isabel editorial audit [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

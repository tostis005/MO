name: Production Selectos de Castilla onboarding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-selectos-de-castilla-onboarding-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-selectos-de-castilla-onboarding
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for EMDO deploy, configure supplier, sync and import
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/onboard-selectos-de-castilla-20260929.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] && [ -n "$php_bin" ] || exit 1
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"

          deployed=""
          for i in $(seq 1 120); do
            deployed="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "cat '$PROD_PATH/wp-content/plugins/mdo-supplier-sync/.emdo-deployed-sha' 2>/dev/null || true" | tr -d '\r\n')"
            [ "$deployed" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          test "$deployed" = "$GITHUB_SHA"
          echo "EMDO_DEPLOY_MATCH=$deployed"

          REMOTE_SCRIPT="/tmp/onboard-selectos-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/onboard-selectos-de-castilla-20260929.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"

          remote_wp() {
            phase="$1"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
              set -e
              php_bin=\$(command -v php || true)
              [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
              wp_bin=\$(command -v wp)
              SELECTOS_PHASE='$phase' \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root
            "
          }

          setup="$(remote_wp setup)"
          printf '%s\n' "$setup"
          printf '%s\n' "$setup" | grep -Fq 'SUPPLIER_ID='

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" action-scheduler run --group=mdo-supplier-sync --batch-size=20 --batches=0 --force --path='$PROD_PATH' --allow-root
          "

          remote_wp scrape-report
          remote_wp queue-import

          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" action-scheduler run --group=mdo-supplier-sync --batch-size=10 --batches=0 --force --path='$PROD_PATH' --allow-root
          "

          remote_wp final-report
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE_SCRIPT'"
          echo SELECTOS_DE_CASTILLA_ONBOARDING_OK

name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect English runtime and live Puente sample
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || exit 1

          echo '=== RUNTIME_SEO_SOURCE ==='
          sed -n '1,360p' "$prod/wp-content/mu-plugins/mdo-english-island-runtime-seo.php" 2>/dev/null || true
          echo '=== SLUG_ROUTER_SOURCE ==='
          sed -n '1,320p' "$prod/wp-content/mu-plugins/mdo-english-slug-router.php" 2>/dev/null || true
          echo '=== ACTIVE_LANGUAGE_PLUGINS ==='
          "$php_bin" "$wp_bin" plugin list --status=active --field=name --path="$prod" --allow-root 2>/dev/null | grep -Ei 'falang|translate|wpml|poly|language' || true

          cat > /tmp/mo-puente-live.php <<'PHP'
          <?php
          $ids=array(11170,11171,11172);
          foreach($ids as $id){
              $p=get_post($id); if(!$p) continue;
              $urls=array(
                  'es'=>get_permalink($id),
                  'en_spanish_slug'=>home_url('/en/product/'.$p->post_name.'/'),
              );
              $en_slug=(string)get_post_meta($id,'_en_US_post_name',true);
              if($en_slug!=='') $urls['en_meta_slug']=home_url('/en/product/'.sanitize_title($en_slug).'/');
              foreach($urls as $kind=>$url){
                  $probe=add_query_arg('emdo_translation_audit',time().$id,$url);
                  $r=wp_remote_get($probe,array('timeout'=>20,'redirection'=>3,'headers'=>array('Cache-Control'=>'no-cache','Pragma'=>'no-cache'),'user-agent'=>'Mozilla/5.0 EMDO translation audit'));
                  if(is_wp_error($r)){echo "LIVE|$id|$kind|ERR=".$r->get_error_message()."|URL=$url\n";continue;}
                  $body=(string)wp_remote_retrieve_body($r);
                  $text=html_entity_decode(wp_strip_all_tags($body),ENT_QUOTES|ENT_HTML5,'UTF-8');
                  echo 'LIVE|'.$id.'|'.$kind.'|HTTP='.(int)wp_remote_retrieve_response_code($r)
                      .'|TITLE='.str_replace(array("\r","\n","|"),' ',(string)$p->post_title)
                      .'|HAS_ES_TITLE='.(stripos($text,$p->post_title)!==false?'yes':'no')
                      .'|HAS_EN_META='.(trim((string)get_post_meta($id,'_en_US_post_title',true))!==''?'yes':'no')
                      .'|FINAL='.wp_remote_retrieve_header($r,'location')
                      .'|URL='.$url."\n";
                  if($kind!=='es'){
                      $needle='Jamón';
                      $pos=stripos($text,$needle);
                      if($pos!==false){echo 'CONTEXT|'.$id.'|'.preg_replace('/\s+/',' ',substr($text,max(0,$pos-160),600))."\n";}
                  }
              }
          }
          PHP
          echo '=== PUENTE_LIVE ==='
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-puente-live.php --path="$prod" --allow-root
          rm -f /tmp/mo-puente-live.php
          REMOTE

name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Discover production vendor identities and English metadata schema
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'wp-cli not found'; exit 1; }

          cat > /tmp/mo-discover-vendors.php <<'PHP'
          <?php
          global $wpdb;

          $statuses = array('publish','draft','pending','private','future');
          $placeholders = implode(',', array_fill(0, count($statuses), '%s'));
          $sql = $wpdb->prepare(
              "SELECT ID, post_author, post_status, post_title, post_name FROM {$wpdb->posts} WHERE post_type='product' AND post_status IN ($placeholders) ORDER BY post_author, ID",
              $statuses
          );
          $raw_products = $wpdb->get_results($sql, ARRAY_A);

          $authors = array();
          $schema = array();
          $schema_samples = array();

          foreach ($raw_products as $r) {
              $id = (int) $r['ID'];
              $aid = (int) $r['post_author'];
              if (!isset($authors[$aid])) {
                  $u = get_user_by('id', $aid);
                  $dokan = function_exists('dokan_get_store_info') ? dokan_get_store_info($aid) : array();
                  $profile = get_user_meta($aid, 'dokan_profile_settings', true);
                  $authors[$aid] = array(
                      'author_id' => $aid,
                      'display_name' => $u ? $u->display_name : null,
                      'user_login' => $u ? $u->user_login : null,
                      'user_nicename' => $u ? $u->user_nicename : null,
                      'dokan_store_name' => is_array($dokan) ? ($dokan['store_name'] ?? null) : null,
                      'profile_store_name' => is_array($profile) ? ($profile['store_name'] ?? null) : null,
                      'product_count' => 0,
                      'status_counts' => array(),
                      'seller_store_names' => array(),
                      'samples' => array(),
                  );
              }
              $authors[$aid]['product_count']++;
              $st = $r['post_status'];
              if (!isset($authors[$aid]['status_counts'][$st])) $authors[$aid]['status_counts'][$st] = 0;
              $authors[$aid]['status_counts'][$st]++;
              $seller = trim((string) get_post_meta($id, '_seller_store_name', true));
              if ($seller !== '') $authors[$aid]['seller_store_names'][$seller] = true;
              if (count($authors[$aid]['samples']) < 8) {
                  $authors[$aid]['samples'][] = array('id'=>$id,'status'=>$st,'title'=>$r['post_title'],'slug'=>$r['post_name']);
              }

              $meta = get_post_meta($id);
              foreach ($meta as $key => $values) {
                  if (strpos($key, '_en_US_') !== 0) continue;
                  $schema[$key] = true;
                  if (!isset($schema_samples[$key])) {
                      $vals = array();
                      foreach ((array)$values as $v) $vals[] = maybe_unserialize($v);
                      $schema_samples[$key] = array('product_id'=>$id,'value'=>count($vals)===1?$vals[0]:$vals);
                  }
              }
          }

          foreach ($authors as &$a) {
              $a['seller_store_names'] = array_keys($a['seller_store_names']);
              ksort($a['status_counts']);
          }
          unset($a);
          ksort($authors);
          ksort($schema);
          ksort($schema_samples);

          echo "=== TOTAL_PRODUCTS ===\n" . count($raw_products) . "\n";
          echo "=== ENGLISH_META_SCHEMA ===\n";
          echo wp_json_encode(array_keys($schema), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";
          echo "=== ENGLISH_META_SAMPLES ===\n";
          echo wp_json_encode($schema_samples, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";
          echo "=== AUTHORS ===\n";
          foreach ($authors as $a) echo wp_json_encode($a, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . "\n";
          echo "=== END ===\n";
          PHP

          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-discover-vendors.php --path="$prod" --allow-root
          rm -f /tmp/mo-discover-vendors.php
          REMOTE

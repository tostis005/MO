name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit production vendor products and custom English metadata
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'wp-cli not found'; exit 1; }

          cat > /tmp/mo-audit-vendor-translations.php <<'PHP'
          <?php
          function mo_norm($value) {
              $value = remove_accents((string) $value);
              $value = strtolower($value);
              return preg_replace('/[^a-z0-9]+/', '', $value);
          }

          function mo_store_name($post) {
              $store = trim((string) get_post_meta($post->ID, '_seller_store_name', true));
              if ($store === '' && function_exists('dokan_get_store_info')) {
                  $info = dokan_get_store_info((int) $post->post_author);
                  if (is_array($info) && !empty($info['store_name'])) {
                      $store = trim((string) $info['store_name']);
                  }
              }
              if ($store === '') {
                  $user = get_user_by('id', (int) $post->post_author);
                  if ($user) $store = trim((string) $user->display_name);
              }
              return $store;
          }

          function mo_target_vendor($store) {
              $n = mo_norm($store);
              if (strpos($n, 'tolecarnes') !== false) return 'Tolecarnes';
              if (strpos($n, 'diplomatico') !== false) return 'El Diplomático';
              if (strpos($n, 'puenterobles') !== false) return 'Puente Robles';
              return null;
          }

          function mo_en_meta($post_id) {
              $all = get_post_meta($post_id);
              $out = array();
              foreach ($all as $key => $values) {
                  if (strpos($key, '_en_US_') !== 0) continue;
                  $decoded = array();
                  foreach ((array) $values as $value) {
                      $decoded[] = maybe_unserialize($value);
                  }
                  $out[$key] = count($decoded) === 1 ? $decoded[0] : $decoded;
              }
              ksort($out);
              return $out;
          }

          $posts = get_posts(array(
              'post_type' => 'product',
              'post_status' => array('publish','draft','pending','private','future'),
              'posts_per_page' => -1,
              'orderby' => 'ID',
              'order' => 'ASC',
          ));

          $rows = array();
          $schema = array();
          $counts = array('Tolecarnes' => 0, 'El Diplomático' => 0, 'Puente Robles' => 0);
          $status_counts = array();

          foreach ($posts as $post) {
              $store = mo_store_name($post);
              $vendor = mo_target_vendor($store);
              if (!$vendor) continue;

              $en = mo_en_meta($post->ID);
              foreach (array_keys($en) as $key) $schema[$key] = true;
              $counts[$vendor]++;
              if (!isset($status_counts[$vendor])) $status_counts[$vendor] = array();
              if (!isset($status_counts[$vendor][$post->post_status])) $status_counts[$vendor][$post->post_status] = 0;
              $status_counts[$vendor][$post->post_status]++;

              $rows[] = array(
                  'id' => (int) $post->ID,
                  'vendor' => $vendor,
                  'detected_store' => $store,
                  'author_id' => (int) $post->post_author,
                  'status' => $post->post_status,
                  'sku' => (string) get_post_meta($post->ID, '_sku', true),
                  'spanish' => array(
                      'title' => $post->post_title,
                      'slug' => $post->post_name,
                      'excerpt' => $post->post_excerpt,
                      'content' => $post->post_content,
                  ),
                  'english_meta' => $en,
              );
          }

          ksort($schema);
          echo "=== ENGLISH_META_SCHEMA ===\n";
          echo wp_json_encode(array_keys($schema), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT) . "\n";
          echo "=== SUMMARY ===\n";
          echo wp_json_encode(array('counts' => $counts, 'status_counts' => $status_counts, 'total' => count($rows)), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT) . "\n";
          echo "=== PRODUCTS_JSONL ===\n";
          foreach ($rows as $row) {
              echo wp_json_encode($row, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . "\n";
          }
          echo "=== END ===\n";
          PHP

          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-audit-vendor-translations.php --path="$prod" --allow-root
          rm -f /tmp/mo-audit-vendor-translations.php
          REMOTE

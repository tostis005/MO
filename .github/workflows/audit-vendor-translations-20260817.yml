name: Audit vendor translations 2026-08-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit production vendor products and WPML translations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'wp-cli not found'; exit 1; }

          cat > /tmp/mo-audit-vendor-translations.php <<'PHP'
          <?php
          global $wpdb;

          function mo_norm($value) {
              $value = remove_accents((string) $value);
              $value = strtolower($value);
              return preg_replace('/[^a-z0-9]+/', '', $value);
          }

          $targets = array(
              'Tolecarnes' => 'tolecarnes',
              'El Diplomático' => 'eldiplomatico',
              'Puente Robles' => 'puenterobles',
          );

          $vendors = array();
          $users = get_users(array('fields' => 'all_with_meta'));
          foreach ($users as $user) {
              $pieces = array($user->display_name, $user->user_login, $user->user_nicename);
              foreach (array('dokan_profile_settings', 'wcfmmp_profile_settings', 'pv_shop_name', 'store_name') as $key) {
                  $meta = get_user_meta($user->ID, $key, true);
                  if (!empty($meta)) {
                      $pieces[] = is_scalar($meta) ? (string) $meta : wp_json_encode($meta, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
                  }
              }
              $haystack = mo_norm(implode(' ', $pieces));
              foreach ($targets as $label => $needle) {
                  $needle2 = mo_norm($needle);
                  if ($needle2 !== '' && strpos($haystack, $needle2) !== false) {
                      $vendors[$user->ID] = array(
                          'id' => (int) $user->ID,
                          'label' => $label,
                          'display_name' => $user->display_name,
                          'user_login' => $user->user_login,
                      );
                  }
              }
          }

          echo "=== VENDORS ===\n";
          echo wp_json_encode(array_values($vendors), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT) . "\n";

          $table = $wpdb->prefix . 'icl_translations';
          $wpml_table = ($wpdb->get_var($wpdb->prepare('SHOW TABLES LIKE %s', $table)) === $table);
          echo "=== MULTILINGUAL ===\n";
          echo wp_json_encode(array(
              'wpml_translation_table' => $wpml_table,
              'ICL_SITEPRESS_VERSION' => defined('ICL_SITEPRESS_VERSION') ? ICL_SITEPRESS_VERSION : null,
              'default_language' => apply_filters('wpml_default_language', null),
              'active_languages' => apply_filters('wpml_active_languages', null, array('skip_missing' => 0)),
          ), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT) . "\n";

          if (!$vendors) {
              echo "NO_MATCHING_VENDORS\n";
              exit;
          }

          $vendor_ids = array_map('intval', array_keys($vendors));
          $products = get_posts(array(
              'post_type' => 'product',
              'post_status' => array('publish','draft','pending','private','future'),
              'posts_per_page' => -1,
              'author__in' => $vendor_ids,
              'orderby' => 'ID',
              'order' => 'ASC',
          ));

          echo "=== PRODUCTS ===\n";
          foreach ($products as $p) {
              $row = null;
              $translations = array();
              if ($wpml_table) {
                  $row = $wpdb->get_row($wpdb->prepare(
                      "SELECT translation_id, element_id, trid, language_code, source_language_code FROM {$table} WHERE element_type = 'post_product' AND element_id = %d LIMIT 1",
                      $p->ID
                  ), ARRAY_A);
                  if ($row && !empty($row['trid'])) {
                      $trs = $wpdb->get_results($wpdb->prepare(
                          "SELECT element_id, language_code, source_language_code FROM {$table} WHERE element_type = 'post_product' AND trid = %d ORDER BY language_code",
                          $row['trid']
                      ), ARRAY_A);
                      foreach ($trs as $tr) {
                          $tp = get_post((int) $tr['element_id']);
                          $translations[] = array(
                              'id' => (int) $tr['element_id'],
                              'language' => $tr['language_code'],
                              'source_language' => $tr['source_language_code'],
                              'status' => $tp ? $tp->post_status : null,
                              'title' => $tp ? $tp->post_title : null,
                              'content_len' => $tp ? strlen(trim(wp_strip_all_tags($tp->post_content))) : null,
                              'excerpt_len' => $tp ? strlen(trim(wp_strip_all_tags($tp->post_excerpt))) : null,
                          );
                      }
                  }
              }

              $out = array(
                  'id' => (int) $p->ID,
                  'vendor' => $vendors[$p->post_author]['label'] ?? $vendors[$p->post_author]['display_name'],
                  'author_id' => (int) $p->post_author,
                  'status' => $p->post_status,
                  'title' => $p->post_title,
                  'sku' => get_post_meta($p->ID, '_sku', true),
                  'content_len' => strlen(trim(wp_strip_all_tags($p->post_content))),
                  'excerpt_len' => strlen(trim(wp_strip_all_tags($p->post_excerpt))),
                  'wpml' => $row,
                  'translations' => $translations,
              );
              echo wp_json_encode($out, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . "\n";
          }

          echo "=== SUMMARY ===\n";
          echo wp_json_encode(array('vendor_count' => count($vendors), 'product_post_count' => count($products)), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . "\n";
          PHP

          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-audit-vendor-translations.php --path="$prod" --allow-root
          rm -f /tmp/mo-audit-vendor-translations.php
          REMOTE

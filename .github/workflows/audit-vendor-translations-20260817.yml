name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect translation layer and both sites
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'wp-cli not found'; exit 1; }

          echo '=== TRANSLATION_LAYER_FILES_PROD ==='
          for root in "$prod/wp-content/mu-plugins" "$prod/wp-content/themes" "$prod/wp-content/plugins"; do
            [ -d "$root" ] || continue
            grep -RIl --include='*.php' -E '_en_US_(post_title|post_content|post_name|published)|en_US_post_title|translated_post|english.*product|product.*english' "$root" 2>/dev/null | head -n 120 || true
          done

          echo '=== TRANSLATION_LAYER_MATCHES_PROD ==='
          for root in "$prod/wp-content/mu-plugins" "$prod/wp-content/themes"; do
            [ -d "$root" ] || continue
            grep -RIn --include='*.php' -E '_en_US_(post_title|post_content|post_name|published)' "$root" 2>/dev/null | head -n 180 || true
          done

          cat > /tmp/mo-site-inventory.php <<'PHP'
          <?php
          global $wpdb;
          echo "SITEURL=".get_option('siteurl')."\n";
          echo "WCFM_VENDORS\n";
          $users=get_users(array('role__in'=>array('wcfm_vendor','dc_vendor')));
          foreach($users as $u){
              $prof=get_user_meta($u->ID,'wcfmmp_profile_settings',true);
              $store=is_array($prof)&&isset($prof['store_name'])?(string)$prof['store_name']:'';
              $store2=(string)get_user_meta($u->ID,'_wcfm_vendor_store_name',true);
              $disabled=(string)get_user_meta($u->ID,'_wcfm_vendor_disable',true);
              $counts=$wpdb->get_results($wpdb->prepare("SELECT post_status,COUNT(*) qty FROM {$wpdb->posts} WHERE post_type='product' AND post_author=%d GROUP BY post_status ORDER BY post_status",$u->ID),ARRAY_A);
              echo wp_json_encode(array('id'=>(int)$u->ID,'login'=>$u->user_login,'nicename'=>$u->user_nicename,'display'=>$u->display_name,'store'=>$store,'store2'=>$store2,'disabled'=>$disabled,'products'=>$counts),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          echo "DIPLOM_SEARCH\n";
          $us=$wpdb->get_results("SELECT ID,user_login,user_nicename,display_name FROM {$wpdb->users} WHERE LOWER(CONCAT_WS(' ',user_login,user_nicename,display_name)) LIKE '%diplom%'",ARRAY_A);
          $um=$wpdb->get_results("SELECT user_id,meta_key,LEFT(meta_value,800) meta_value FROM {$wpdb->usermeta} WHERE LOWER(meta_value) LIKE '%diplom%' LIMIT 50",ARRAY_A);
          $ps=$wpdb->get_results("SELECT ID,post_author,post_type,post_status,post_title,post_name FROM {$wpdb->posts} WHERE LOWER(CONCAT_WS(' ',post_title,post_name,post_excerpt,post_content)) LIKE '%diplom%' LIMIT 100",ARRAY_A);
          echo wp_json_encode(array('users'=>$us,'usermeta'=>$um,'posts'=>$ps),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          echo "TRANSLATED_DRAFT_SAMPLES\n";
          $rows=$wpdb->get_results("SELECT p.ID,p.post_author,p.post_status,p.post_title,pm.meta_value en_title FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key='_en_US_post_title' WHERE p.post_type='product' AND p.post_status<>'publish' AND pm.meta_value<>'' ORDER BY p.ID DESC LIMIT 30",ARRAY_A);
          foreach($rows as $r){$r['en_published']=(string)get_post_meta((int)$r['ID'],'_en_US_published',true);$r['en_slug']=(string)get_post_meta((int)$r['ID'],'_en_US_post_name',true);echo wp_json_encode($r,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
          echo "TARGET_COUNTS\n";
          foreach(array(4507,4508,4509) as $aid){
              $u=get_user_by('id',$aid);if(!$u)continue;
              $counts=$wpdb->get_results($wpdb->prepare("SELECT post_status,COUNT(*) qty FROM {$wpdb->posts} WHERE post_type='product' AND post_author=%d GROUP BY post_status ORDER BY post_status",$aid),ARRAY_A);
              echo wp_json_encode(array('id'=>$aid,'name'=>$u->display_name,'counts'=>$counts),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          PHP

          echo '=== PROD_INVENTORY ==='
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-site-inventory.php --path="$prod" --allow-root 2>/dev/null
          echo '=== DEV_INVENTORY ==='
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-site-inventory.php --path="$dev" --allow-root 2>/dev/null || true
          rm -f /tmp/mo-site-inventory.php
          REMOTE

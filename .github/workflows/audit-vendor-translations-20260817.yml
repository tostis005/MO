name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Analyze unique product copy blocks
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || exit 1

          cat > /tmp/mo-block-audit.php <<'PHP'
          <?php
          global $wpdb;
          function blocks($html){
              $s=(string)$html;
              $s=preg_replace('~<(?:br\s*/?|/p|/div|/li|/h[1-6]|/tr|/td|/th|/ul|/ol)>~iu',"\n",$s);
              $s=html_entity_decode(wp_strip_all_tags($s),ENT_QUOTES|ENT_HTML5,'UTF-8');
              $lines=preg_split('/[\r\n]+/u',$s);
              $out=[];
              foreach($lines as $line){$line=trim(preg_replace('/\s+/u',' ',$line));if($line!==''&&mb_strlen($line)>=3)$out[]=$line;}
              return $out;
          }
          foreach([4508=>'Puente Robles',4509=>'El Catedrático'] as $aid=>$vendor){
              $ids=$wpdb->get_col($wpdb->prepare("SELECT ID FROM {$wpdb->posts} WHERE post_type='product' AND post_author=%d AND post_status IN ('publish','draft','pending','private','future','archived') ORDER BY ID",$aid));
              $freq=[];$samples=[];$total=0;$chars=0;
              foreach($ids as $id){$p=get_post((int)$id);foreach(blocks($p->post_content) as $b){$total++;$chars+=mb_strlen($b);$k=hash('sha256',$b);if(!isset($freq[$k])){$freq[$k]=['text'=>$b,'count'=>0,'ids'=>[]];}$freq[$k]['count']++;if(count($freq[$k]['ids'])<5)$freq[$k]['ids'][]=(int)$id;}}
              uasort($freq,function($a,$b){if($a['count']===$b['count'])return mb_strlen($b['text'])<=>mb_strlen($a['text']);return $b['count']<=>$a['count'];});
              $repeated=array_filter($freq,fn($x)=>$x['count']>1);
              echo 'BLOCK_SUMMARY|'.wp_json_encode(['vendor'=>$vendor,'products'=>count($ids),'total_blocks'=>$total,'unique_blocks'=>count($freq),'repeated_unique'=>count($repeated),'total_chars'=>$chars],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              $i=0;foreach($freq as $row){$i++; if($i>180)break; echo 'BLOCK|'.wp_json_encode(['vendor'=>$vendor,'count'=>$row['count'],'ids'=>$row['ids'],'text'=>$row['text']],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
          }
          PHP
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-block-audit.php --path="$prod" --allow-root
          rm -f /tmp/mo-block-audit.php
          REMOTE

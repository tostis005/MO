name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Locate El Diplomatico and audit translation completeness
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'wp-cli not found'; exit 1; }

          cat > /tmp/mo-locate-and-audit.php <<'PHP'
          <?php
          global $wpdb;

          function mo_nonempty($v) { return trim(wp_strip_all_tags((string)$v)) !== ''; }
          function mo_en($id, $key) { return (string)get_post_meta($id, '_en_US_'.$key, true); }
          function mo_translation_state($post) {
              $title = mo_en($post->ID, 'post_title');
              $slug = mo_en($post->ID, 'post_name');
              $content = mo_en($post->ID, 'post_content');
              $excerpt = mo_en($post->ID, 'post_excerpt');
              $published = mo_en($post->ID, 'published');
              $missing = array();
              if (!mo_nonempty($title)) $missing[] = 'post_title';
              if (trim($slug) === '') $missing[] = 'post_name';
              if (mo_nonempty($post->post_content) && !mo_nonempty($content)) $missing[] = 'post_content';
              if (mo_nonempty($post->post_excerpt) && !mo_nonempty($excerpt)) $missing[] = 'post_excerpt';
              if ($published !== '1') $missing[] = 'published';
              return array(
                  'missing' => $missing,
                  'english' => array(
                      'title' => $title,
                      'slug' => $slug,
                      'content' => $content,
                      'excerpt' => $excerpt,
                      'published' => $published,
                  ),
              );
          }

          echo "=== DIPLOMATICO_USERS ===\n";
          $users = $wpdb->get_results(
              "SELECT ID,user_login,user_nicename,display_name FROM {$wpdb->users} WHERE LOWER(CONCAT_WS(' ',user_login,user_nicename,display_name)) LIKE '%diplom%' ORDER BY ID",
              ARRAY_A
          );
          echo wp_json_encode($users, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";

          echo "=== DIPLOMATICO_USERMETA ===\n";
          $um = $wpdb->get_results(
              "SELECT user_id,meta_key,LEFT(meta_value,1200) AS meta_value FROM {$wpdb->usermeta} WHERE LOWER(meta_value) LIKE '%diplom%' ORDER BY user_id,umeta_id LIMIT 100",
              ARRAY_A
          );
          echo wp_json_encode($um, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";

          echo "=== DIPLOMATICO_POSTS ===\n";
          $dp = $wpdb->get_results(
              "SELECT ID,post_author,post_type,post_status,post_title,post_name FROM {$wpdb->posts} WHERE LOWER(CONCAT_WS(' ',post_title,post_name,post_excerpt,post_content)) LIKE '%diplom%' ORDER BY ID LIMIT 200",
              ARRAY_A
          );
          echo wp_json_encode($dp, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";

          echo "=== DIPLOMATICO_POSTMETA ===\n";
          $pm = $wpdb->get_results(
              "SELECT post_id,meta_key,LEFT(meta_value,1200) AS meta_value FROM {$wpdb->postmeta} WHERE LOWER(meta_value) LIKE '%diplom%' ORDER BY post_id,meta_id LIMIT 200",
              ARRAY_A
          );
          echo wp_json_encode($pm, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";

          echo "=== TARGET_AUDIT ===\n";
          $targets = array(4507=>'Tolecarnes', 4508=>'Puente Robles');
          foreach ($targets as $author_id => $vendor) {
              $ids = $wpdb->get_col($wpdb->prepare(
                  "SELECT ID FROM {$wpdb->posts} WHERE post_type='product' AND post_author=%d AND post_status IN ('publish','draft','pending','private','future') ORDER BY ID",
                  $author_id
              ));
              $summary = array('vendor'=>$vendor,'author_id'=>$author_id,'total'=>0,'complete'=>0,'incomplete'=>0,'by_status'=>array());
              $incomplete = array();
              foreach ($ids as $id) {
                  $post = get_post((int)$id);
                  if (!$post) continue;
                  $state = mo_translation_state($post);
                  $summary['total']++;
                  if (!isset($summary['by_status'][$post->post_status])) $summary['by_status'][$post->post_status] = 0;
                  $summary['by_status'][$post->post_status]++;
                  if (empty($state['missing'])) {
                      $summary['complete']++;
                  } else {
                      $summary['incomplete']++;
                      $incomplete[] = array(
                          'id'=>(int)$post->ID,
                          'status'=>$post->post_status,
                          'sku'=>(string)get_post_meta($post->ID,'_sku',true),
                          'missing'=>$state['missing'],
                          'spanish'=>array(
                              'title'=>$post->post_title,
                              'slug'=>$post->post_name,
                              'excerpt'=>$post->post_excerpt,
                              'content'=>$post->post_content,
                          ),
                          'english'=>$state['english'],
                      );
                  }
              }
              echo wp_json_encode(array('summary'=>$summary,'incomplete'=>$incomplete), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . "\n";
          }

          echo "=== ALL_PRODUCT_AUTHORS_ANY_STATUS ===\n";
          $authors = $wpdb->get_results(
              "SELECT p.post_author,u.user_login,u.user_nicename,u.display_name,p.post_status,COUNT(*) qty FROM {$wpdb->posts} p LEFT JOIN {$wpdb->users} u ON u.ID=p.post_author WHERE p.post_type='product' GROUP BY p.post_author,p.post_status ORDER BY p.post_author,p.post_status",
              ARRAY_A
          );
          echo wp_json_encode($authors, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT) . "\n";
          echo "=== END ===\n";
          PHP

          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-locate-and-audit.php --path="$prod" --allow-root
          rm -f /tmp/mo-locate-and-audit.php
          REMOTE

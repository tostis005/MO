name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit reusable English product translations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || exit 1

          cat > /tmp/mo-memory-audit.php <<'PHP'
          <?php
          global $wpdb;
          function ntitle($s){$s=html_entity_decode(wp_strip_all_tags((string)$s),ENT_QUOTES|ENT_HTML5,'UTF-8');$s=remove_accents(mb_strtolower(trim($s)));return preg_replace('/\s+/u',' ',$s);}
          function ncontent($s){$s=html_entity_decode(wp_strip_all_tags((string)$s),ENT_QUOTES|ENT_HTML5,'UTF-8');$s=remove_accents(mb_strtolower(trim($s)));return preg_replace('/\s+/u',' ',$s);}
          $translated_ids=$wpdb->get_col("SELECT DISTINCT post_id FROM {$wpdb->postmeta} WHERE meta_key='_en_US_published' AND meta_value='1'");
          $by_title=array();$by_content=array();$source_count=0;
          foreach($translated_ids as $sid){
              $sp=get_post((int)$sid); if(!$sp || $sp->post_type!=='product') continue;
              $et=(string)get_post_meta($sp->ID,'_en_US_post_title',true); if(trim(wp_strip_all_tags($et))==='') continue;
              $source_count++;
              $tk=ntitle($sp->post_title); if($tk!=='')$by_title[$tk][]=$sp->ID;
              $ck=ncontent($sp->post_content); if($ck!=='')$by_content[$ck][]=$sp->ID;
          }
          echo "SOURCE_TRANSLATED_PRODUCTS=$source_count\n";
          foreach(array(4507=>'Tolecarnes',4508=>'Puente Robles',4509=>'El Catedrático') as $aid=>$vendor){
              $ids=$wpdb->get_col($wpdb->prepare("SELECT ID FROM {$wpdb->posts} WHERE post_type='product' AND post_author=%d AND post_status IN ('publish','draft','pending','private','future','archived') ORDER BY ID",$aid));
              $summary=array('vendor'=>$vendor,'total'=>0,'already_complete'=>0,'title_match'=>0,'content_match'=>0,'both_same_source'=>0,'needs_manual'=>0);
              $rows=array();
              foreach($ids as $id){
                  $p=get_post((int)$id); if(!$p)continue; $summary['total']++;
                  $complete=(string)get_post_meta($id,'_en_US_published',true)==='1' && trim(wp_strip_all_tags((string)get_post_meta($id,'_en_US_post_title',true)))!=='' && trim((string)get_post_meta($id,'_en_US_post_name',true))!=='' && (trim(wp_strip_all_tags($p->post_content))==='' || trim(wp_strip_all_tags((string)get_post_meta($id,'_en_US_post_content',true)))!=='');
                  if($complete){$summary['already_complete']++;continue;}
                  $tm=$by_title[ntitle($p->post_title)]??array(); $cm=array();$ck=ncontent($p->post_content);if($ck!==''&&isset($by_content[$ck]))$cm=$by_content[$ck];
                  $tm=array_values(array_filter($tm,fn($v)=>(int)$v!==(int)$id));$cm=array_values(array_filter($cm,fn($v)=>(int)$v!==(int)$id));
                  if($tm)$summary['title_match']++;if($cm)$summary['content_match']++;
                  $same=array_values(array_intersect($tm,$cm));if($same)$summary['both_same_source']++;
                  if(!$same)$summary['needs_manual']++;
                  $rows[]=array('id'=>(int)$id,'status'=>$p->post_status,'title'=>$p->post_title,'content_chars'=>mb_strlen(wp_strip_all_tags($p->post_content)),'excerpt_chars'=>mb_strlen(wp_strip_all_tags($p->post_excerpt)),'title_matches'=>array_slice($tm,0,4),'content_matches'=>array_slice($cm,0,4),'same_source'=>array_slice($same,0,4));
              }
              echo 'SUMMARY|'.wp_json_encode($summary,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              foreach($rows as $r) echo 'ROW|'.wp_json_encode($r,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          PHP
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-memory-audit.php --path="$prod" --allow-root
          rm -f /tmp/mo-memory-audit.php
          REMOTE

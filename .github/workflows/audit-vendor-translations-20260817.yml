name: Audit vendor translations 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vendor-translations-20260817.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect translation engine configuration
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || exit 1
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || exit 1

          cat > /tmp/mo-tr-engine.php <<'PHP'
          <?php
          function redact_config($value,$key=''){
              if(is_array($value)){
                  $out=[];foreach($value as $k=>$v){$lk=strtolower((string)$k);if(preg_match('/key|token|secret|password|credential|auth/',$lk)){$out[$k]=is_string($v)&&$v!==''?'[configured]':'[empty]';}else{$out[$k]=redact_config($v,$k);}}return $out;
              }
              if(is_object($value)) return '[object]';
              if(is_string($value)&&strlen($value)>120)return substr($value,0,120).'…';
              return $value;
          }
          echo 'SITE='.get_option('siteurl')."\n";
          foreach(['trp_settings','trp_advanced_settings','trp_machine_translation_settings','trp_automatic_translation_settings'] as $name){$v=get_option($name,null);echo 'OPTION|'.$name.'|'.wp_json_encode(redact_config($v),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";}
          echo 'ACTIVE_PLUGINS|'.wp_json_encode(get_option('active_plugins',[]),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          echo 'TRANSLATEPRESS_LOADED='.(class_exists('TRP_Translate_Press')?'yes':'no')."\n";
          if(class_exists('TRP_Translate_Press')){
              $trp=TRP_Translate_Press::get_trp_instance();
              foreach(['machine_translator','automatic_translation','settings'] as $component){$obj=$trp->get_component($component);echo 'COMPONENT|'.$component.'|'.(is_object($obj)?get_class($obj):gettype($obj))."\n";}
          }
          PHP
          "$php_bin" -d memory_limit=768M "$wp_bin" eval-file /tmp/mo-tr-engine.php --path="$prod" --allow-root 2>/dev/null
          echo '=== PROVIDER_FILES ==='
          grep -RIl --include='*.php' -E 'Google_Translate|DeepL|automatic.translation|machine.translation|Machine_Translator' "$prod/wp-content/plugins/translatepress-multilingual" "$prod/wp-content/plugins/translatepress-business" "$prod/wp-content/plugins/translatepress-developer" 2>/dev/null | head -n 80 || true
          rm -f /tmp/mo-tr-engine.php
          REMOTE

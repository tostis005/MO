name: Restore standard WooCommerce template for six Mentta-only packs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-native-six-packs-woocommerce-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mentta-partner-review-direct-urls-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint the targeted public-detail exception and confirm SSH
        run: |
          set -euo pipefail
          php -l mu-plugins/emdo-mentta-exclusive-products.php
          php -l .github/scripts/verify-mentta-partner-direct-urls-20261028.php
          grep -Fq 'Version: 1.4.0' mu-plugins/emdo-mentta-exclusive-products.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
      - name: Safely deploy direct detail view exception to production
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT")
          SCP=(-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P "$PORT")
          TARGET="$STAGING_USER@$STAGING_HOST"
          PROD_PATH="$(sshpass -e ssh "${SSH[@]}" "$TARGET" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"
          RUN="$GITHUB_RUN_ID"
          sshpass -e scp "${SCP[@]}" mu-plugins/emdo-mentta-exclusive-products.php "$TARGET:/tmp/emdo-native-product-$RUN.php"

          sshpass -e ssh "${SSH[@]}" "$TARGET" "bash -s -- '$PROD_PATH' '$RUN'" <<'REMOTE'
          set -euo pipefail
          SITE="$1"; RUN="$2"
          PHP_BIN="$(command -v php || true)"
          [ -n "$PHP_BIN" ] || PHP_BIN="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP_BIN="$(command -v wp)"
          LIVE="$SITE/wp-content/mu-plugins/emdo-mentta-exclusive-products.php"
          test -f "$LIVE"
          test -f "/tmp/emdo-native-product-$RUN.php"
          "$PHP_BIN" -l "/tmp/emdo-native-product-$RUN.php"
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval 'foreach([21814,21818,21820,21904,21906,21908] as $id){ $p=wc_get_product($id);if(!$p||$p->get_status()!=="publish"||$p->get_catalog_visibility()!=="visible"||!in_array($id,emdo_mentta_exclusive_ids(),true))exit(2); } echo "PRODUCTS_INTACT\n";' --path="$SITE" --allow-root
          cp -a "$LIVE" "$LIVE.before-partner-review-$RUN"
          install -m 0644 "/tmp/emdo-native-product-$RUN.php" "$LIVE"
          "$PHP_BIN" -l "$LIVE"
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval 'foreach([21814,21818,21820,21904,21906,21908] as $id){ $p=wc_get_product($id);if(!$p||$p->get_status()!=="publish"||$p->get_catalog_visibility()!=="visible")exit(2); } echo "NATIVE_PACKS_PRESENT\n";' --path="$SITE" --allow-root
          "$PHP_BIN" -d memory_limit=512M "$WP_BIN" eval '
             foreach ([21814,21818,21820,21904,21906,21908] as $pid) {
               clean_post_cache($pid);
               if (function_exists("rocket_clean_post")) rocket_clean_post($pid);
             }
             if (class_exists("WC_Cache_Helper")) WC_Cache_Helper::get_transient_version("product",true);
             wp_cache_flush();
           ' --path="$SITE" --allow-root
          REMOTE
      - name: Verify six native WooCommerce product pages with header and menu
        run: |
          set -euo pipefail
          HOST="https://www.elmercadodeorigen.com/producto"
          for SLUG in \
            pack-degustacion-pasaporte-salvaje \
            pack-degustacion-safari-africano \
            pack-degustacion-vuelta-al-mundo \
            pack-cafe-esencia-de-costa-rica \
            pack-cafe-ruta-de-los-cuatro-origenes \
            pack-cafe-coleccion-completa
          do
            HTTP="$(curl -sSL --connect-timeout 10 --max-time 65 -o "/tmp/native-$SLUG.html" -w '%{http_code}' "$HOST/$SLUG/")"
            echo "NATIVE_PRODUCT $SLUG HTTP=$HTTP"
            test "$HTTP" = 200
            grep -Eiq 'class="[^"]*(single-product|woocommerce)|woocommerce-product-gallery|product-page-container' "/tmp/native-$SLUG.html"
            grep -Eiq 'site-header|primary-menu|main-navigation|woostify' "/tmp/native-$SLUG.html"
            grep -Eiq 'product_title|entry-title|product-summary' "/tmp/native-$SLUG.html"
            if grep -Eiq 'Ficha de producto para revisión|integración con Menta|revisión de Menta|Esta ficha puede abrirse' "/tmp/native-$SLUG.html"; then
              echo "::error::Old standalone page still present"; exit 1
            fi
          done
          for SLUG in \
            jamon-de-bellota-100-iberico-montjam-mentta \
            pack-musee-mentta-reserva-de-caza \
            pack-musee-mentta-parrilla-sin-fronteras-xl \
            pack-musee-mentta-universo-wagyu \
            pack-musee-mentta-leyendas-del-vacuno
          do
            HTTP="$(curl -sSL --connect-timeout 9 --max-time 35 -o /dev/null -w '%{http_code}' "$HOST/$SLUG/")"
            echo "STILL_PROTECTED $SLUG HTTP=$HTTP"
            test "$HTTP" = 404
          done
          echo SIX_STANDARD_WOOCOMMERCE_PRODUCT_TEMPLATES_OK

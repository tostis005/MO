name: Production English final gap audit 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-english-final-gap-audit-20260816.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect active vendors and live English residuals
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          wp_bin=$(command -v wp || true)
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          PROD_PATH=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg")
            url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$url" in
              https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) PROD_PATH="$p"; break;;
            esac
          done
          : "${PROD_PATH:?production path missing}"
          echo '=== VENDORS ==='
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            $users=get_users(["role__in"=>["wcfm_vendor","dc_vendor"]]);
            foreach($users as $u){
              $url=function_exists("wcfmmp_get_store_url") ? wcfmmp_get_store_url($u->ID) : "";
              echo "ID={$u->ID}\tlogin={$u->user_login}\tnicename={$u->user_nicename}\tdisplay={$u->display_name}\turl=$url\troles=".implode(",",$u->roles).PHP_EOL;
              foreach(["_wcfm_vendor_store_name","store_name","wcfmmp_profile_settings","_wcfm_vendor_disable"] as $k){$v=get_user_meta($u->ID,$k,true); if($v!==""&&$v!==[]) echo " META $k=".substr(wp_json_encode($v,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),0,1500).PHP_EOL;}
            }
          ' --path="$PROD_PATH" --allow-root 2>/dev/null

          echo '=== LIVE TEXT ==='
          urls=(
            '/en/'
            '/en/shop/'
            '/en/product/100-iberian-acorn-fed-ham-black-tag/'
            '/en/product/extra-virgin-olive-oil-5l/'
            '/en/product/100-iberian-acorn-fed-sobrasada/'
            '/en/product-category/oils/'
            '/en/extra-virgin-olive-oil/'
            '/en/iberian-ham/'
            '/en/oranges/'
            '/en/privacy-policy/'
            '/en/store/hidalgo-de-la-jara/'
            '/en/store/1957/'
            '/en/store/tolecarnes/'
          )
          stamp=$(date +%s%N)
          for p in "${urls[@]}"; do
            f=/tmp/mdo-gap-$(echo "$p" | tr '/' '_').html
            code=$(curl -ksSL --max-time 25 -o "$f" -w '%{http_code}' "https://www.elmercadodeorigen.com${p}?mdo_gap=$stamp" || true)
            echo "URL $p CODE $code"
            if [ -f "$f" ]; then
              python3 - "$f" <<'PY'
import sys,re,html
from html.parser import HTMLParser
class P(HTMLParser):
    def __init__(self): super().__init__(convert_charrefs=True); self.skip=0; self.parts=[]
    def handle_starttag(self,t,a):
        if t in {'script','style','noscript','svg','head','template'}: self.skip+=1
    def handle_endtag(self,t):
        if t in {'script','style','noscript','svg','head','template'} and self.skip: self.skip-=1
    def handle_data(self,d):
        if not self.skip:
            s=' '.join(d.split())
            if s:self.parts.append(s)
s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); p=P(); p.feed(s)
words={'que','para','con','del','una','uno','unos','unas','los','las','por','desde','hasta','nuestro','nuestra','nuestros','nuestras','este','esta','estos','estas','también','más','muy','producto','productos','tienda','comprar','carrito','pedido','pedidos','envío','envíos','mínimo','añadir','selecciona','seleccionar','filtros','filtro','ordenar','precio','precios','disponible','elaborado','elaborada','elaborados','elaboradas','aceite','jamón','jamones','paleta','paletas','queso','quesos','naranjas','agricultura','ganadería','productor','productores','calidad','sabor','textura','artesanal','familia','finca','cerdo','cerdos','gracias','contacto','nombre','correo','mensaje','buscar','resultados','categoría','categorías','descripción','información','política','privacidad','condiciones','devoluciones','vendedor'}
found=[]
for chunk in p.parts:
    hits=[w for w in re.findall(r'[a-záéíóúüñ]+',chunk.lower()) if w in words]
    if len(hits)>=3:
        found.append((len(hits),chunk[:700]))
for score,chunk in sorted(found,reverse=True)[:8]: print('SPANISH?',score,chunk)
for href in sorted(set(html.unescape(x) for x in re.findall(r'<a\b[^>]*href=["\']([^"\']+)',s,re.I|re.S))):
    if any(x in href for x in ['/en/tienda/','/en/producto/','/en/politica-de-cookies/']): print('BADLINK',href)
PY
            fi
          done
          REMOTE

name: Restore stable production multilingual bridge 2026-08-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-multilingual-emergency-restore-20260815.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable bridge locally
        run: php -l .github/scripts/mdo-production-native-render-bridge.php
      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Replace bridge without bootstrapping WordPress
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "find /var/www/vhosts -maxdepth 7 -type f -path '*/httpdocs/wp-content/themes/elmercadodeorigen-child/functions.php' 2>/dev/null | head -n1 | sed 's#/wp-content/themes/elmercadodeorigen-child/functions.php##'")"
          : "${PROD_PATH:?production path not found}"
          echo "PROD_PATH=$PROD_PATH" >> "$GITHUB_ENV"
          sshpass -e scp $SCP_OPTIONS .github/scripts/mdo-production-native-render-bridge.php "$STAGING_USER@$STAGING_HOST:/tmp/mdo-stable-bridge.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          php_bin=$(command -v php || true)
          [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php_bin" -l /tmp/mdo-stable-bridge.php
          mkdir -p "$PROD_PATH/wp-content/mu-plugins"
          if [ -f "$PROD_PATH/wp-content/mu-plugins/mdo-production-native-render-bridge.php" ]; then
            cp "$PROD_PATH/wp-content/mu-plugins/mdo-production-native-render-bridge.php" "/tmp/mdo-bridge-before-restore-${RANDOM}.php" || true
          fi
          cp /tmp/mdo-stable-bridge.php "$PROD_PATH/wp-content/mu-plugins/mdo-production-native-render-bridge.php"
          rm -f /tmp/mdo-stable-bridge.php
          REMOTE
      - name: Confirm WordPress and both languages boot normally
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          siteurl=$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d display_errors=0 \"\$wp_bin\" option get siteurl --path='$PROD_PATH' --allow-root 2>/dev/null | tail -n1")
          echo "siteurl=$siteurl"
          printf '%s' "$siteurl" | grep -Eq '^https?://(www\.)?elmercadodeorigen\.com/?$'
          for url in 'https://www.elmercadodeorigen.com/' 'https://www.elmercadodeorigen.com/en/' 'https://www.elmercadodeorigen.com/en/tienda/'; do
            code=$(curl -ksSL --max-time 45 -H 'Cache-Control: no-cache' -o /tmp/check.html -w '%{http_code}' "$url?mdo_restore=${GITHUB_RUN_ID}")
            echo "$code $url"
            test "$code" = 200
            ! grep -Eqi 'Fatal error|Parse error|WordPress database error|Allowed memory size' /tmp/check.html
          done

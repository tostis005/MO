name: Production inspect English commerce translation sources 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-inspect-english-commerce-translation-sources-20260816.yml'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Inspect legacy UI translations minimum order and product attributes
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          sshpass -e ssh -o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PHP=$(command -v php || true); [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          WP=$(command -v wp || true); ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          echo '===== LEGACY ENGLISH UI COPY ====='
          F=$(find "$ROOT/wp-content/themes/elmercadodeorigen-child/inc" -maxdepth 1 -type f -name 'english-ui-copy-final-010243.php.bak-*' | sort | tail -n1 || true)
          echo "LEGACY_FILE=$F"
          [ -z "$F" ] || sed -n '1,180p' "$F"
          echo '===== MINIMUM ORDER SOURCE ====='
          sed -n '85,175p' "$ROOT/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-minimum-order.php"
          echo '===== ATTRIBUTE TAXONOMIES AND TERMS ====='
          cat > /tmp/mdo-attrs.php <<'PHP'
          <?php
          ini_set('memory_limit','512M');
          require $argv[1] . '/wp-load.php';
          if (!function_exists('wc_get_attribute_taxonomies')) { echo "NO_WC\n"; exit; }
          foreach (wc_get_attribute_taxonomies() as $a) {
              $tax='pa_'.$a->attribute_name;
              echo "ATTR|{$tax}|{$a->attribute_label}\n";
              $terms=get_terms(['taxonomy'=>$tax,'hide_empty'=>false]);
              if (is_wp_error($terms)) continue;
              foreach ($terms as $t) {
                  $en_name=(string)get_term_meta($t->term_id,'_en_US_name',true);
                  echo "TERM|{$tax}|{$t->term_id}|{$t->slug}|{$t->name}|EN={$en_name}\n";
              }
          }
          PHP
          "$PHP" -d memory_limit=512M /tmp/mdo-attrs.php "$ROOT" 2>/dev/null | head -n 400 || true
          REMOTE

name: EMDO reviews import 512M 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-import-512-20260915.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect local review tables in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          run_wp(){ "$php" -d memory_limit=512M "$wp" "$@" --path="$PROD_PATH" --allow-root; }
          run_wp eval 'global $wpdb; $db=$wpdb->dbname; $rows=$wpdb->get_col($wpdb->prepare("SELECT table_name FROM information_schema.tables WHERE table_schema=%s AND (table_name LIKE %s OR table_name LIKE %s OR table_name LIKE %s) ORDER BY table_name",$db,"%trustindex%","%trustpilot%","%review%")); $out=array(); foreach($rows as $t){if(false===stripos($t,"trustindex") && false===stripos($t,"trustpilot")) continue; $count=(int)$wpdb->get_var("SELECT COUNT(*) FROM `".esc_sql($t)."`"); $cols=$wpdb->get_col("SHOW COLUMNS FROM `".esc_sql($t)."`",0); $out[]=array("table"=>$t,"count"=>$count,"columns"=>$cols);} echo "REVIEW_TABLES=".wp_json_encode($out).PHP_EOL;'
          run_wp eval '$paths=array(WP_PLUGIN_DIR."/review-widgets-for-trustpilot",WP_PLUGIN_DIR."/wp-reviews-plugin-for-google"); foreach($paths as $p){echo "PLUGIN_DIR=".basename($p)."|".(is_dir($p)?"yes":"no").PHP_EOL; if(is_dir($p)){foreach(glob($p."/*.php")?:array() as $f){$b=basename($f); $c=file_get_contents($f); if(false!==stripos($c,"get_tablename")||false!==stripos($c,"CREATE TABLE")){echo "PLUGIN_FILE_TABLE_REF=".basename($p)."/".$b.PHP_EOL;}}}}'
          REMOTE

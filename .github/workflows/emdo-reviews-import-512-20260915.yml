name: EMDO reviews import 512M 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-import-512-20260915.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Import Google and Trustpilot reviews
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          run_wp(){ "$php" -d memory_limit=512M "$wp" "$@" --path="$PROD_PATH" --allow-root; }
          run_wp eval 'MDO_Reviews_Schema::maybe_install(); MDO_Reviews_Integration::ensure_schedule(); $s=MDO_Reviews_Integration::import_external(); echo "EMDO_VERSION=".MDO_SUPPLIER_SYNC_VERSION.PHP_EOL; echo "EXTERNAL_IMPORT=".wp_json_encode($s).PHP_EOL;'
          run_wp eval 'global $wpdb; $t=$wpdb->prefix."mdo_reviews"; $rows=$wpdb->get_results("SELECT source,status,COUNT(*) total FROM {$t} GROUP BY source,status ORDER BY source,status",ARRAY_A); echo "REVIEW_COUNTS=".wp_json_encode($rows).PHP_EOL; $s=$wpdb->get_results("SELECT id,source,status,vendor_user_id,suggested_vendor_user_id,rating,author_name,review_date FROM {$t} WHERE source IN (\"google\",\"trustpilot\") ORDER BY review_date DESC,id DESC LIMIT 20",ARRAY_A); echo "EXTERNAL_SAMPLES=".wp_json_encode($s).PHP_EOL;'
          run_wp eval '$opts=array("trustindex-google-review-content","trustindex-google-reviews","google_reviews","trustindex-trustpilot-review-content","trustindex-trustpilot-reviews","trustpilot_reviews"); foreach($opts as $o){$v=get_option($o,null); echo "OPTION_DIAG={$o}|".gettype($v)."|".(is_string($v)?strlen($v):(is_array($v)?count($v):($v===null?0:1))).PHP_EOL;}'
          run_wp eval '$r=function_exists("as_next_scheduled_action")?as_next_scheduled_action("mdo_reviews_daily_import",array(),"mdo-supplier-sync"):wp_next_scheduled("mdo_reviews_daily_import"); $p=function_exists("as_next_scheduled_action")?as_next_scheduled_action("mdo_supplier_sync_dispatch",array(),"mdo-supplier-sync"):wp_next_scheduled("mdo_supplier_sync_dispatch"); echo "WP_TIMEZONE=".wp_timezone_string().PHP_EOL; echo "REVIEWS_NEXT=".($r?wp_date("Y-m-d H:i:s T",(int)$r):"NONE").PHP_EOL; echo "PRODUCTS_NEXT=".($p?wp_date("Y-m-d H:i:s T",(int)$p):"NONE").PHP_EOL;'
          run_wp eval 'global $wpdb; $t=$wpdb->prefix."mdo_reviews"; $v=(int)$wpdb->get_var("SELECT vendor_user_id FROM {$t} WHERE status=\"validated\" AND vendor_user_id>0 ORDER BY review_date DESC,id DESC LIMIT 1"); if(!$v){$v=(int)$wpdb->get_var("SELECT post_author FROM {$wpdb->posts} WHERE post_type=\"product\" AND post_status=\"publish\" AND post_author>0 LIMIT 1");} if($v && function_exists("wcfmmp_get_store_url")){echo "STORE_REVIEWS_URL=".trailingslashit(wcfmmp_get_store_url($v))."reviews/".PHP_EOL;}'
          REMOTE

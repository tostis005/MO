name: EMDO reviews import 512M 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-import-512-20260915.yml'

permissions:
  contents: read

jobs:
  deploy-and-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate integration PHP
        run: php -l mdo-supplier-sync/includes/class-mdo-reviews-integration.php
      - name: Deploy importer and run production sync
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          REMOTE_FILE="$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-reviews-integration.php"
          sshpass -e scp $SCP mdo-supplier-sync/includes/class-mdo-reviews-integration.php "$STAGING_USER@$STAGING_HOST:$REMOTE_FILE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp); php=$(command -v php); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php" -l "$PROD_PATH/wp-content/plugins/mdo-supplier-sync/includes/class-mdo-reviews-integration.php"
          run_wp(){ "$php" -d memory_limit=512M "$wp" "$@" --path="$PROD_PATH" --allow-root; }
          run_wp eval 'MDO_Reviews_Integration::ensure_schedule(); $s=MDO_Reviews_Integration::import_external(); echo "EXTERNAL_IMPORT=".wp_json_encode($s).PHP_EOL;'
          run_wp eval 'global $wpdb; $t=$wpdb->prefix."mdo_reviews"; $rows=$wpdb->get_results("SELECT source,status,COUNT(*) total FROM {$t} GROUP BY source,status ORDER BY source,status",ARRAY_A); echo "REVIEW_COUNTS=".wp_json_encode($rows).PHP_EOL; $r=function_exists("as_next_scheduled_action")?as_next_scheduled_action("mdo_reviews_daily_import",array(),"mdo-supplier-sync"):wp_next_scheduled("mdo_reviews_daily_import"); $p=function_exists("as_next_scheduled_action")?as_next_scheduled_action("mdo_supplier_sync_dispatch",array(),"mdo-supplier-sync"):wp_next_scheduled("mdo_supplier_sync_dispatch"); echo "REVIEWS_NEXT=".($r?wp_date("Y-m-d H:i:s T",(int)$r):"NONE").PHP_EOL; echo "PRODUCTS_NEXT=".($p?wp_date("Y-m-d H:i:s T",(int)$p):"NONE").PHP_EOL;'
          REMOTE

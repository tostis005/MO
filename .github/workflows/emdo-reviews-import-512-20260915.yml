name: EMDO reviews import 512M 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-import-512-20260915.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source structures in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          run_wp(){ "$php" -d memory_limit=512M "$wp" "$@" --path="$PROD_PATH" --allow-root; }
          run_wp eval '$v=get_option("trustindex-google-review-content",""); echo "GOOGLE_CACHE_LEN=".strlen((string)$v).PHP_EOL; $s=ltrim((string)$v); echo "GOOGLE_CACHE_FIRST=".(isset($s[0])?ord($s[0]):0).PHP_EOL; $j=json_decode((string)$v,true); echo "GOOGLE_CACHE_JSON=".(JSON_ERROR_NONE===json_last_error()?"yes":"no").PHP_EOL; preg_match_all("/class=[\\\"\\\x27]([^\\\"\\\x27]*(?:review|rating|star)[^\\\"\\\x27]*)[\\\"\\\x27]/i",(string)$v,$m); $classes=array_values(array_unique(array_slice($m[1]??array(),0,80))); echo "GOOGLE_CLASSES=".wp_json_encode($classes).PHP_EOL; preg_match_all("/data-([a-z0-9_-]+)/i",(string)$v,$a); $attrs=array_values(array_unique(array_slice($a[1]??array(),0,80))); echo "GOOGLE_DATA_ATTRS=".wp_json_encode($attrs).PHP_EOL; foreach(array("review","rating","star","author","date","text","content") as $needle){echo "GOOGLE_TOKEN_{$needle}=".substr_count(strtolower((string)$v),$needle).PHP_EOL;}'
          run_wp eval 'global $wpdb; $rows=$wpdb->get_results("SELECT option_name,LENGTH(option_value) AS len FROM {$wpdb->options} WHERE option_name LIKE \"%trustpilot%\" OR option_name LIKE \"%trustindex%\" ORDER BY option_name",ARRAY_A); echo "REVIEW_OPTION_NAMES=".wp_json_encode($rows).PHP_EOL;'
          run_wp eval '$plugins=get_option("active_plugins",array()); $hits=array_values(array_filter($plugins,fn($p)=>false!==stripos($p,"trust")||false!==stripos($p,"review"))); echo "REVIEW_PLUGINS=".wp_json_encode($hits).PHP_EOL;'
          REMOTE

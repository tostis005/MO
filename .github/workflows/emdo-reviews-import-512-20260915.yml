name: EMDO reviews import 512M 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-reviews-import-512-20260915.yml'

permissions:
  contents: read

jobs:
  inspect-trustpilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" -d memory_limit=512M "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          wp=$(command -v wp); php=$(command -v php); [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          "$php" -d memory_limit=512M "$wp" eval '$classes=array_filter(get_declared_classes(),fn($c)=>false!==stripos($c,"Trustindex")); foreach($classes as $c){$r=new ReflectionClass($c); $m=array(); foreach($r->getMethods(ReflectionMethod::IS_PUBLIC) as $x){if(false!==stripos($x->name,"review")||false!==stripos($x->name,"noreg")){$m[]=array("name"=>$x->name,"required"=>$x->getNumberOfRequiredParameters(),"total"=>$x->getNumberOfParameters());}} if($m) echo "CLASS_METHODS=".$c."|".wp_json_encode($m).PHP_EOL;}' --path="$PROD_PATH" --allow-root
          REMOTE

name: Publish editorial batch 76-93 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-editorial-76-93-production.yml'
      - '.github/scripts/publish-editorial-76-93-production.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate publisher
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-editorial-76-93-production.php
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"

      - name: Publish ES and EN articles in production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE="/tmp/publish-editorial-76-93-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/publish-editorial-76-93-production.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" | tee /tmp/editorial-76-93-output.txt

          grep -q 'EMDO_EDITORIAL_76_93_BEGIN' /tmp/editorial-76-93-output.txt
          grep -q '"count":18' /tmp/editorial-76-93-output.txt
          grep -q 'EMDO_EDITORIAL_76_93_END' /tmp/editorial-76-93-output.txt

      - name: Verify public ES and EN URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          es_slugs=(
            'denominaciones-origen-jamon-iberico-guijuelo-jabugo-extremadura-pedroches'
            'dop-guijuelo-que-garantiza-zona-elaboracion-como-reconocerla'
            'dop-jabugo-que-garantiza-territorio-como-reconocer-jamon'
            'dop-dehesa-extremadura-que-garantiza-como-reconocer-jamones-paletas'
            'zonas-productoras-jamon-iberico-espana-salamanca-huelva-extremadura-cordoba'
            'como-influye-clima-curacion-jamon-iberico'
            'dehesa-territorio-por-que-importan-jamon-iberico-bellota'
            'secadero-bodega-jamon-iberico-que-ocurre-curacion'
            'como-describir-jamon-iberico-aroma-grasa-textura-salinidad-persistencia'
            'denominaciones-origen-aceite-oliva-espana-que-garantizan-como-leerlas'
            'dop-priego-cordoba-variedades-perfil-aove-como-reconocerla'
            'dop-baena-variedades-perfil-aove-como-reconocerla'
            'dop-sierra-cazorla-picual-royal-perfil-aceite-oliva'
            'dop-sierra-magina-picual-territorio-perfil-aove'
            'dop-montes-toledo-cornicabra-territorio-perfil-aove'
            'como-influyen-clima-suelo-altitud-sabor-aove'
            'como-describir-aove-frutado-amargor-picor-aromas-equilibrio'
            'envases-aceite-oliva-vidrio-lata-pet-bag-in-box-cual-conviene'
          )
          en_slugs=(
            'iberian-ham-designations-origin-guijuelo-jabugo-dehesa-extremadura-los-pedroches'
            'guijuelo-pdo-what-it-guarantees-production-area-how-to-identify'
            'jabugo-pdo-what-it-guarantees-territory-how-to-identify-ham'
            'dehesa-de-extremadura-pdo-what-it-guarantees-identify-hams-shoulders'
            'iberian-ham-producing-areas-spain-salamanca-huelva-extremadura-cordoba'
            'how-climate-influences-iberian-ham-curing'
            'dehesa-territory-why-they-matter-acorn-fed-iberian-ham'
            'iberian-ham-drying-room-cellar-what-happens-during-curing'
            'how-to-describe-iberian-ham-aroma-fat-texture-saltiness-persistence'
            'olive-oil-designations-origin-spain-what-they-guarantee-how-to-read'
            'priego-de-cordoba-pdo-varieties-evoo-profile-how-to-identify'
            'baena-pdo-varieties-evoo-profile-how-to-identify'
            'sierra-de-cazorla-pdo-picual-royal-olive-oil-profile'
            'sierra-magina-pdo-picual-territory-evoo-profile'
            'montes-de-toledo-pdo-cornicabra-territory-evoo-profile'
            'how-climate-soil-altitude-influence-evoo-flavour'
            'how-to-describe-evoo-fruitiness-bitterness-pungency-aromas-balance'
            'olive-oil-packaging-glass-tin-pet-bag-in-box-which-suits-each-use'
          )

          check_url() {
            local url="$1"
            local code
            for attempt in 1 2 3 4; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = '200' ]; then
                echo "OK $url"
                return 0
              fi
              sleep 5
            done
            echo "FAILED $code $url" >&2
            return 1
          }

          for slug in "${es_slugs[@]}"; do check_url "$base/$slug/"; done
          for slug in "${en_slugs[@]}"; do check_url "$base/en/$slug/"; done

          check_url "$base/category/jamones-y-paletas/"
          check_url "$base/category/aceites/"
          check_url "$base/en/journal/"

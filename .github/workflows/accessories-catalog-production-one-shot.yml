name: Accessories catalog production one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessories-catalog-production-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-accessories-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate accessories release
        shell: bash
        run: |
          set -euo pipefail
          test -f mdo-supplier-sync/mdo-supplier-sync.php
          test -f mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -q "Version: 1.0.9" mdo-supplier-sync/mdo-supplier-sync.php
          grep -q "private const VERSION        = '1.0.1'" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -q "CATEGORY_SLUG  = 'accesorios'" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          grep -q "ATTRIBUTE_SLUG = 'tipo-producto'" mdo-supplier-sync/includes/class-mdo-accessories-catalog.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage plugin
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-accessories-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/plugin'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/plugin/"

      - name: Deploy classify and verify production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"
          dev_path=""
          case "$raw" in
            */wp-content/*) dev_path="${raw%%/wp-content/*}" ;;
            */wp-content) dev_path="$(dirname "$raw")" ;;
            *) dev_path="$raw" ;;
          esac
          if [ ! -f "$dev_path/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve development WordPress root.' >&2; exit 1; }
            dev_path="$(dirname "$cfg")"
          fi
          prod_path="$(dirname "$dev_path")/httpdocs"
          [ -f "$prod_path/wp-config.php" ] || { echo 'Production WordPress root missing.' >&2; exit 1; }

          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1 || true)"
          [ -n "$wp_bin" ] && [ -x "$php_bin" ] || { echo 'WP-CLI/PHP unavailable.' >&2; exit 1; }

          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod_path" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)"
          case "$siteurl" in
            https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;;
            *) echo "Unexpected production siteurl=$siteurl" >&2; exit 1 ;;
          esac

          target="$prod_path/wp-content/plugins/mdo-supplier-sync"
          backup="$prod_path/wp-content/plugins/.mdo-supplier-sync.accessories-${commit}"
          incoming_plugin="$incoming/plugin"
          [ -d "$target" ] || { echo 'Production EMDO plugin is missing.' >&2; exit 1; }
          find "$incoming_plugin" -type f -name '*.php' -print0 | xargs -0 -n1 "$php_bin" -l >/dev/null

          rm -rf "$backup"
          cp -a "$target" "$backup"
          rollback() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo 'Accessories production validation failed; restoring previous plugin files.' >&2
              rm -rf "$target"
              mv "$backup" "$target"
              "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true
            else
              rm -rf "$backup"
            fi
            rm -rf "$incoming"
            exit "$code"
          }
          trap rollback EXIT HUP INT TERM

          rsync -a --delete "$incoming_plugin/" "$target/"
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$prod_path" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod_path" --skip-plugins --allow-root >/dev/null 2>&1 || true

          report="$("$php_bin" -d memory_limit=1024M "$wp_bin" eval 'echo wp_json_encode( MDO_Accessories_Catalog::migrate_catalog( true ), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );' --path="$prod_path" --allow-root)"
          printf 'Accessories production report: %s\n' "$report"
          accessories="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["accessories"]??0);')"
          jamoneros="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["jamoneros"]??0);')"
          cuchillos="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo (int)($d["cuchillos"]??0);')"
          errors="$(printf '%s' "$report" | "$php_bin" -r '$d=json_decode(stream_get_contents(STDIN),true); echo count((array)($d["errors"]??array()));')"
          [ "$accessories" -eq 2 ] && [ "$jamoneros" -eq 1 ] && [ "$cuchillos" -eq 1 ] && [ "$errors" -eq 0 ] || {
            echo "Unexpected production accessory counts: accessories=$accessories jamoneros=$jamoneros cuchillos=$cuchillos errors=$errors" >&2
            exit 1
          }

          verify="$(cat <<'PHP'
          $checks = array(
            4067  => array('name'=>'Jamonero','type'=>'Jamonero'),
            12587 => array('name'=>'Blíster de cuchillo y afilador','type'=>'Cuchillo'),
          );
          foreach ($checks as $id => $expected) {
            $p = wc_get_product($id);
            if (!$p instanceof WC_Product) { fwrite(STDERR,"Missing accessory $id\n"); exit(31); }
            if (!has_term('accesorios','product_cat',$id)) { fwrite(STDERR,"Accessory $id lacks Accesorios\n"); exit(32); }
            $types = wp_get_post_terms($id,'pa_tipo-producto',array('fields'=>'names'));
            if (is_wp_error($types) || $types !== array($expected['type'])) { fwrite(STDERR,"Accessory $id wrong type: ".wp_json_encode($types)."\n"); exit(33); }
          }
          foreach (array(12599,12563) as $id) {
            if (has_term('accesorios','product_cat',$id)) { fwrite(STDERR,"Ham product $id wrongly in Accesorios\n"); exit(34); }
            $types = wp_get_post_terms($id,'pa_tipo-producto',array('fields'=>'names'));
            if (!is_wp_error($types) && array_intersect(array('Jamonero','Cuchillo'),$types)) { fwrite(STDERR,"Ham product $id wrongly typed\n"); exit(35); }
          }
          echo 'ACCESSORIES_PRODUCTION_DATA_OK';
          PHP
          )"
          "$php_bin" -d memory_limit=1024M "$wp_bin" eval "$verify" --path="$prod_path" --allow-root | grep -q 'ACCESSORIES_PRODUCTION_DATA_OK'

          echo "SITEURL=$siteurl"
          echo 'ACCESSORIES_PRODUCTION_QA=passed'
          rm -rf "$backup" "$incoming"
          trap - EXIT HUP INT TERM
          REMOTE
name: Chocolates - SEO editorial de categorias ES EN 20261017
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-chocolate-category-editorial-20261017.yml'
      - '.github/scripts/apply-chocolate-category-editorial-20261017.php'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify category editorial copy only
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l .github/scripts/apply-chocolate-category-editorial-20261017.php
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            set -e
            wp_bin=$(command -v wp)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          test -n "$PROD_PATH"
          SCRIPT="/tmp/category-choco-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/apply-chocolate-category-editorial-20261017.php "$STAGING_USER@$STAGING_HOST:$SCRIPT"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -d memory_limit=1536M \"\$wp_bin\" eval-file '$SCRIPT' --path='$PROD_PATH' --allow-root
            rm -f '$SCRIPT'
          " | tee /tmp/category-choco.log
          grep -q "^ISABEL_CATEGORY_EDITORIAL=" /tmp/category-choco.log
          echo ISABEL_CATEGORY_EDITORIAL_RUN_OK


      - name: Record verified chocolate category SEO descriptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          sed -n 's/^ISABEL_CATEGORY_EDITORIAL=//p' /tmp/category-choco.log | tail -1 | python3 -m json.tool --no-ensure-ascii > .deploy-status/chocolate-category-editorial-20261017.json
          python3 - <<'PY'
          import json
          j=json.load(open('.deploy-status/chocolate-category-editorial-20261017.json'))
          print('CHOCOLATE_CATEGORY_EDITORIAL',j['verified'],len(j['categories']))
          assert j['verified'] and len(j['categories'])==9
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/chocolate-category-editorial-20261017.json
          git commit -m 'Record chocolate category SEO copy [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

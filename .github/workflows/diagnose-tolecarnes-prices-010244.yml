name: Diagnose Tolecarnes false sale prices 0.10.244

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tolecarnes-prices-010244.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit all active Tolecarnes prices in production
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -P $PORT"

          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"

          cat > /tmp/audit-tolecarnes-010244.php <<'PHP'
          <?php
          if (!defined('ABSPATH')) exit;
          global $wpdb;
          $source_table = MDO_Database::table('source_products');
          $supplier_table = MDO_Database::table('suppliers');
          $supplier_id = (int)$wpdb->get_var("SELECT id FROM {$supplier_table} WHERE connector='tolecarnes' OR LOWER(name) LIKE '%tolecarnes%' ORDER BY id LIMIT 1");
          echo "SUPPLIER_ID={$supplier_id}\n";
          echo "PLUGIN_VERSION=" . (defined('MDO_SUPPLIER_SYNC_VERSION') ? MDO_SUPPLIER_SYNC_VERSION : 'unknown') . "\n";
          if (!$supplier_id) exit(2);

          $parse = static function(string $text): ?float {
            $text = str_replace(["\xC2\xA0", '€'], ' ', $text);
            if (!preg_match('/([0-9]{1,3}(?:[.\s][0-9]{3})*(?:,[0-9]{1,2})|[0-9]+(?:[.,][0-9]{1,2})?)/u', $text, $m)) return null;
            $raw = trim(str_replace(["\xC2\xA0", ' '], '', $m[1]));
            if (str_contains($raw, ',')) { $raw=str_replace('.','',$raw); $raw=str_replace(',','.',$raw); }
            elseif (substr_count($raw,'.') > 1) $raw=str_replace('.','',$raw);
            return is_numeric($raw) ? (float)$raw : null;
          };

          $inspect_html = static function(string $url) use ($parse): array {
            $r=wp_remote_get($url,['timeout'=>20,'redirection'=>5,'user-agent'=>'EMDO price audit 0.10.244','headers'=>['Accept'=>'text/html,application/xhtml+xml']]);
            if (is_wp_error($r)) return ['error'=>$r->get_error_message()];
            $html=(string)wp_remote_retrieve_body($r);
            $dom=new DOMDocument(); $prev=libxml_use_internal_errors(true); $dom->loadHTML('<?xml encoding="utf-8" ?>'.$html, LIBXML_NOWARNING|LIBXML_NOERROR|LIBXML_NONET); libxml_clear_errors(); libxml_use_internal_errors($prev); $xp=new DOMXPath($dom);
            $nodes=$xp->query("//*[contains(concat(' ', normalize-space(@class), ' '), ' summary ')]//p[contains(concat(' ', normalize-space(@class), ' '), ' price ')]");
            if (!$nodes || !$nodes->length) $nodes=$xp->query("//*[contains(concat(' ', normalize-space(@class), ' '), ' summary ')]//*[contains(concat(' ', normalize-space(@class), ' '), ' price ')]");
            $node=($nodes && $nodes->length) ? $nodes->item(0) : null;
            if (!$node) return ['error'=>'no-main-price-node'];
            $text=trim(preg_replace('/\s+/u',' ',(string)$node->textContent));
            $del=$xp->query('.//del',$node); $ins=$xp->query('.//ins',$node);
            $regular=null; $current=null; $is_sale=false;
            if ($del && $del->length && $ins && $ins->length) {
              $regular=$parse((string)$del->item(0)->textContent); $current=$parse((string)$ins->item(0)->textContent);
              $is_sale=null!==$regular && null!==$current && $current < $regular;
            } else {
              $current=$parse($text); $regular=$current;
            }
            return ['text'=>$text,'current'=>$current,'regular'=>$regular,'sale'=>$is_sale ? $current : null,'is_sale'=>$is_sale];
          };

          $rows=$wpdb->get_results($wpdb->prepare("SELECT id,title,source_url,source_price,status,wc_product_id,source_payload FROM {$source_table} WHERE supplier_id=%d AND status='active' AND wc_product_id IS NOT NULL AND wc_product_id>0 ORDER BY id",$supplier_id),ARRAY_A) ?: [];
          echo "ACTIVE_COUNT=".count($rows)."\n";
          $anomalies=[];
          foreach($rows as $row){
            $url=(string)$row['source_url'];
            $payload=json_decode((string)$row['source_payload'],true); $payload=is_array($payload)?$payload:[];
            $pid=(int)$row['wc_product_id'];
            $main=$inspect_html($url);
            try { $raw=MDO_Connector_Tolecarnes::scrape_product($url); $norm=MDO_Text::normalize_product($raw); }
            catch(Throwable $e){ $raw=['error'=>$e->getMessage()]; $norm=[]; }
            $woo=[
              'price'=>get_post_meta($pid,'_price',true),
              'regular'=>get_post_meta($pid,'_regular_price',true),
              'sale'=>get_post_meta($pid,'_sale_price',true),
            ];
            $norm_sale=$norm['sale_price']??null;
            $payload_sale=$payload['sale_price']??null;
            $woo_sale=($woo['sale']!=='' ? (float)$woo['sale'] : null);
            $main_is_sale=!empty($main['is_sale']);
            $suspect = (!$main_is_sale && ($norm_sale!==null || $payload_sale!==null || $woo_sale!==null));
            if (stripos((string)$row['title'],'filetes primera')!==false || stripos((string)$row['title'],'filetes de primera')!==false) $suspect=true;
            if ($suspect) {
              $entry=[
                'id'=>(int)$row['id'],'title'=>$row['title'],'url'=>$url,'wc_product_id'=>$pid,
                'main'=>$main,
                'raw'=>['price'=>$raw['price']??null,'variations'=>$raw['variations']??null],
                'norm'=>['price'=>$norm['price']??null,'regular'=>$norm['regular_price']??null,'sale'=>$norm['sale_price']??null,'discount'=>$norm['discount_percent']??null],
                'payload'=>['price'=>$payload['price']??null,'regular'=>$payload['regular_price']??null,'sale'=>$payload['sale_price']??null,'discount'=>$payload['discount_percent']??null],
                'woo'=>$woo,
              ];
              $anomalies[]=$entry;
              echo "ANOMALY=".wp_json_encode($entry,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
            }
          }
          echo "ANOMALY_COUNT=".count($anomalies)."\n";
          PHP

          sshpass -e scp $SCP /tmp/audit-tolecarnes-010244.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/audit-tolecarnes-010244.php"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=1024M \"\$wp_bin\" eval-file '$PROD_PATH/audit-tolecarnes-010244.php' --path='$PROD_PATH' --allow-root; rm -f '$PROD_PATH/audit-tolecarnes-010244.php'"

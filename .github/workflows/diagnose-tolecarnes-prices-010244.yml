name: Diagnose Tolecarnes false sale prices 0.10.244

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-tolecarnes-prices-010244.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit source payload against WooCommerce
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH="-o ServerAliveInterval=20 -o ServerAliveCountMax=12 -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac; done
          ')"
          test -n "$PROD_PATH"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval '
            global \$wpdb;
            \$st=MDO_Database::table(\"source_products\"); \$su=MDO_Database::table(\"suppliers\");
            \$sid=(int)\$wpdb->get_var(\"SELECT id FROM {\$su} WHERE connector=\\\"tolecarnes\\\" OR LOWER(name) LIKE \\\"%tolecarnes%\\\" ORDER BY id LIMIT 1\");
            \$rows=\$wpdb->get_results(\$wpdb->prepare(\"SELECT id,title,wc_product_id,source_payload FROM {\$st} WHERE supplier_id=%d AND status=\\\"active\\\" AND wc_product_id IS NOT NULL AND wc_product_id>0 ORDER BY id\",\$sid),ARRAY_A)?:[];
            \$bad=[];
            foreach(\$rows as \$row){
              \$p=json_decode((string)\$row[\"source_payload\"],true); \$p=is_array(\$p)?\$p:[]; \$pid=(int)\$row[\"wc_product_id\"];
              if(!empty(\$p[\"variations\"])) continue;
              \$current=isset(\$p[\"price\"])&&is_numeric(\$p[\"price\"])?(float)\$p[\"price\"]:null;
              \$regular=isset(\$p[\"regular_price\"])&&is_numeric(\$p[\"regular_price\"])?(float)\$p[\"regular_price\"]:\$current;
              \$sale=isset(\$p[\"sale_price\"])&&is_numeric(\$p[\"sale_price\"])?(float)\$p[\"sale_price\"]:null;
              \$wp=get_post_meta(\$pid,\"_price\",true); \$wr=get_post_meta(\$pid,\"_regular_price\",true); \$ws=get_post_meta(\$pid,\"_sale_price\",true);
              \$expected_sale=(null!==\$sale&&null!==\$regular&&\$sale<\$regular)?\$sale:null; \$expected_price=null!==\$expected_sale?\$expected_sale:\$current; \$expected_regular=\$regular??\$current;
              \$mismatch=(null!==\$expected_price && abs((float)\$wp-\$expected_price)>0.005)||(null!==\$expected_regular && abs((float)\$wr-\$expected_regular)>0.005)||((null===\$expected_sale && \$ws!==\"\")||(null!==\$expected_sale && abs((float)\$ws-\$expected_sale)>0.005));
              if(\$mismatch){\$bad[]=[\"id\"=>(int)\$row[\"id\"],\"title\"=>\$row[\"title\"],\"wc\"=>\$pid,\"payload\"=>[\"price\"=>\$current,\"regular\"=>\$regular,\"sale\"=>\$sale],\"woo\"=>[\"price\"=>\$wp,\"regular\"=>\$wr,\"sale\"=>\$ws]];}
            }
            echo \"ACTIVE=\".count(\$rows).\"\\n\"; echo \"MISMATCH_COUNT=\".count(\$bad).\"\\n\"; foreach(\$bad as \$b)echo \"MISMATCH=\".wp_json_encode(\$b,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).\"\\n\";
          ' --path='$PROD_PATH' --allow-root"

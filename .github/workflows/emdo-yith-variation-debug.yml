name: Verify YITH variation resolution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emdo-yith-variation-debug.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
      - name: Verify YITH helper for target and Hidalgo variations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"; domain="$2"; wp_path=""
          case "$raw" in */wp-content/*) wp_path="${raw%%/wp-content/*}" ;; */wp-content) wp_path="$(dirname "$raw")" ;; *) wp_path="$raw" ;; esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            wpconfig="$(find "$HOME" /var/www /home /srv /opt /data /web /www -maxdepth 9 -type f -path "*/${domain}/wp-config.php" 2>/dev/null | head -n1 || true)"
            [ -n "$wpconfig" ] || exit 1; wp_path="$(dirname "$wpconfig")"
          fi
          wp_bin="$(command -v wp)"; php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          WP="$php_bin -d memory_limit=512M $wp_bin --path=$wp_path --allow-root"
          prefix="$($WP db prefix 2>/dev/null)"
          echo '=== CURRENT TARGET ASSOCIATIONS ==='
          $WP db query "SELECT rule_id,object,type FROM ${prefix}yith_wapo_blocks_assoc WHERE rule_id=(SELECT meta_value FROM ${prefix}postmeta WHERE post_id=11235 AND meta_key='_emdo_yith_wapo_block_id' LIMIT 1) ORDER BY CAST(object AS UNSIGNED);" 2>/dev/null
          script="$(mktemp /tmp/emdo-yith-verify.XXXXXX.php)"; trap 'rm -f "$script"' EXIT
          cat > "$script" <<'PHP'
          <?php
          $cases = array(
              array( 11235, 11926, 'TARGET' ),
              array( 11235, 11927, 'TARGET' ),
              array( 11235, 11928, 'TARGET' ),
              array( 11235, 11929, 'TARGET' ),
              array( 11235, 11930, 'TARGET' ),
              array( 11235, 11931, 'TARGET' ),
              array( 11235, 11932, 'TARGET' ),
              array( 5045, 5046, 'HIDALGO' ),
              array( 5045, 5049, 'HIDALGO' ),
              array( 5045, 6310, 'HIDALGO' ),
          );
          foreach ( $cases as $case ) {
              list( $product_id, $variation_id, $label ) = $case;
              $has = yith_wapo_product_has_blocks( $product_id, $variation_id );
              echo $label . '_' . $product_id . '_' . $variation_id . '_HAS_BLOCKS=' . ( $has ? 'yes' : 'no' ) . "\n";
          }
          PHP
          $WP eval-file "$script" 2>/dev/null
          REMOTE

name: Home native stars 0.10.264 production

on:
  push:
    branches: [main]
    paths:
      - 'elmercadodeorigen-child/mu-plugins/elmercado-home-native-stars-010264.php'
      - '.github/workflows/home-native-stars-010264-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-native-stars-production
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PHP
        run: php -l elmercadodeorigen-child/mu-plugins/elmercado-home-native-stars-010264.php

      - name: Deploy MU plugin
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"
          command -v sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"

          PROD_PATH="$(timeout 90s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true)
            php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp_bin" ] || exit 2
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg")
              url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in
                https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
              esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          REMOTE="/tmp/elmercado-home-native-stars-${GITHUB_RUN_ID}.php"
          timeout 45s sshpass -e scp $SCP_OPTIONS elmercadodeorigen-child/mu-plugins/elmercado-home-native-stars-010264.php "$STAGING_USER@$STAGING_HOST:$REMOTE"

          timeout 180s sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            set -e
            MU_DIR='$PROD_PATH/wp-content/mu-plugins'
            mkdir -p \"\$MU_DIR\"
            install -m 0644 '$REMOTE' \"\$MU_DIR/elmercado-home-native-stars-010264.php\"
            php_bin=\$(command -v php || true)
            [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$MU_DIR/elmercado-home-native-stars-010264.php\"
            \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-*.css
            rm -f '$REMOTE'
          "

      - name: Verify live Home and Lighthouse network
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home.html
          marker=$(grep -c 'elmercado-home-native-stars-010264' /tmp/home.html || true)
          test "$marker" -ge 1

          npm install --no-save --no-audit --no-fund lighthouse@13.4.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          npx lighthouse@13.4.1 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr.json --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet

          python3 - <<'PY' > runtime/home-native-stars-010264.txt
          import json
          a=json.load(open('/tmp/lhr.json'))
          reqs=a['audits']['network-requests']['details']['items']
          star=[r.get('url','') for r in reqs if 'star.woff' in r.get('url','')]
          print('deploy=success')
          print('verify=success')
          print('star_requests=',len(star))
          print('score=',round(a['categories']['performance']['score']*100))
          print('fcp_ms=',round(a['audits']['first-contentful-paint']['numericValue']))
          print('lcp_ms=',round(a['audits']['largest-contentful-paint']['numericValue']))
          print('tbt_ms=',round(a['audits']['total-blocking-time']['numericValue']))
          print('cls=',a['audits']['cumulative-layout-shift']['numericValue'])
          print('si_ms=',round(a['audits']['speed-index']['numericValue']))
          if star:
              raise SystemExit('star.woff still requested')
          PY
          cat runtime/home-native-stars-010264.txt

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-native-stars-010264.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-native-stars-010264.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-native-stars-010264.txt
          git commit -m 'Record Home native stars 0.10.264 verification' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Inspect staging native TranslatePress storage 2026-08-15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/multilingual-staging-native-seed-inspect-20260815.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Inspect staging content and TranslatePress schema
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          WP_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "raw='${STAGING_REMOTE_PATH%/}'; case \"\$raw\" in */wp-content/*) p=\"\${raw%%/wp-content/*}\";; */wp-content) p=\"\$(dirname \"\$raw\")\";; *) p=\"\$raw\";; esac; if [ ! -f \"\$p/wp-config.php\" ]; then cfg=\$(find \"\$HOME\" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1); p=\$(dirname \"\$cfg\"); fi; printf '%s' \"\$p\"" )"
          : "${WP_PATH:?Unable to find staging WordPress path}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "WP_PATH='$WP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          wp_bin="$(command -v wp)"
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp() { "$php_bin" -d memory_limit=512M -d display_errors=0 "$wp_bin" --path="$WP_PATH" --allow-root "$@"; }
          siteurl="$(wp option get siteurl 2>/dev/null | tail -n1)"
          case "$siteurl" in https://dev.elmercadodeorigen.com*) ;; *) echo "Refusing non-staging: $siteurl" >&2; exit 2;; esac

          echo '===== PUBLISHED PAGES ====='
          wp post list --post_type=page --post_status=publish --fields=ID,post_title,post_name --format=table 2>/dev/null
          echo '===== 1957 USER ====='
          wp user get 3 --fields=ID,user_login,display_name,user_email --format=json 2>/dev/null || true
          echo '===== 1957 PUBLISHED PRODUCTS ====='
          wp post list --post_type=product --post_status=publish --author=3 --fields=ID,post_title,post_name --format=table 2>/dev/null
          for id in $(wp post list --post_type=product --post_status=publish --author=3 --field=ID 2>/dev/null); do
            echo "----- PRODUCT $id -----"
            echo "TITLE: $(wp post get "$id" --field=post_title 2>/dev/null)"
            echo "URL: $(wp post url "$id" 2>/dev/null)"
            echo 'EXCERPT:'
            wp post get "$id" --field=post_excerpt 2>/dev/null || true
            echo 'CONTENT:'
            wp post get "$id" --field=post_content 2>/dev/null || true
            echo 'CATEGORIES:'
            wp post term list "$id" product_cat --fields=term_id,name,slug --format=csv 2>/dev/null || true
            echo 'ATTRIBUTES META:'
            wp post meta get "$id" _product_attributes --format=json 2>/dev/null || true
          done

          echo '===== TRANSLATEPRESS INSTALLATION ====='
          wp plugin get translatepress-multilingual --format=json 2>/dev/null || true
          find "$WP_PATH/wp-content/plugins" -maxdepth 3 -type f \( -iname '*translatepress*.php' -o -name 'class-query.php' -o -name 'class-editor-api-regular-strings.php' \) -print 2>/dev/null | head -n 80 || true
          query_file="$(find "$WP_PATH/wp-content/plugins" -type f -name 'class-query.php' 2>/dev/null | grep -i translate | head -n1 || true)"
          echo "QUERY_FILE=$query_file"
          if [ -n "$query_file" ]; then
            echo '===== QUERY METHODS ====='
            grep -nE 'function (create|insert|update|get|maybe|check).*' "$query_file" | head -n 180 || true
            echo '===== QUERY DICTIONARY CODE ====='
            grep -nE 'dictionary|CREATE TABLE|original_strings|status' "$query_file" | head -n 240 || true
          fi
          editor_file="$(find "$WP_PATH/wp-content/plugins" -type f -name 'class-editor-api-regular-strings.php' 2>/dev/null | head -n1 || true)"
          echo "EDITOR_FILE=$editor_file"
          if [ -n "$editor_file" ]; then
            echo '===== EDITOR SAVE CODE ====='
            grep -nE 'save_translations|update_strings|insert|status|dictionary' "$editor_file" | head -n 220 || true
          fi

          prefix="$(wp db prefix)"
          echo '===== CURRENT TRP TABLES ====='
          wp db query "SHOW TABLES LIKE '${prefix}trp%';" --skip-column-names 2>/dev/null || true
          REMOTE

name: Verify public Tolecarnes batch 04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tolecarnes-batch-04-public-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Spanish and English rendered pages
        shell: bash
        run: |
          set -euo pipefail
          slugs=(osobuco-de-ternera carne-a-la-piedra-de-vaca-madurada rabo-de-ternera lote-familiar filetes-para-cachopos)
          es_body=('Morcillo de ternera cortado con hueso' 'Carne de vaca madurada y lista para cocinar' 'Rabo de ternera preparado para guisar' 'Tres kilos de ternera para distintas preparaciones' 'Filetes preparados para hacer cachopos')
          en_body=('Cross-cut beef shin with the bone' 'Matured beef ready for quick cooking' 'Beef tail prepared for stewing' 'Three kilograms of beef for different meals' 'Steaks prepared for making cachopos')
          es_short=('Osobuco de ternera obtenido del morcillo' 'Carne de vaca madurada durante más de 20 días' 'Rabo de ternera de los Montes de Toledo' 'Lote familiar de 3 kg de ternera' 'Filetes de ternera preparados especialmente para elaborar cachopos')
          en_short=('Beef osso buco cut crosswise from the shin' 'Beef matured for more than 20 days' 'Beef tail from the Montes de Toledo' 'Family beef box containing 3 kg in total' 'Beef steaks prepared specifically for making cachopos')
          failures=0
          for i in "${!slugs[@]}"; do
            s="${slugs[$i]}"
            es="/tmp/es-${i}.html"; en="/tmp/en-${i}.html"
            esc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO batch04 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$es" "https://www.elmercadodeorigen.com/product/${s}/?emdo_b4_es=${GITHUB_RUN_ID}-${i}")
            enc=$(curl -L -sS --connect-timeout 10 --max-time 30 --retry 1 -A 'Mozilla/5.0 EMDO batch04 verifier' -H 'Cache-Control: no-cache, no-store' -w '%{http_code}' -o "$en" "https://www.elmercadodeorigen.com/en/product/${s}/?emdo_b4_en=${GITHUB_RUN_ID}-${i}")
            esok=yes; enok=yes
            grep -Fq "${es_short[$i]}" "$es" || esok=no
            grep -Fq "${es_body[$i]}" "$es" || esok=no
            grep -Fq 'Sobre Tolecarnes' "$es" || esok=no
            grep -Fq 'Preguntas frecuentes' "$es" || esok=no
            grep -Fq "${en_short[$i]}" "$en" || enok=no
            grep -Fq "${en_body[$i]}" "$en" || enok=no
            grep -Fq 'About Tolecarnes' "$en" || enok=no
            grep -Fq 'Frequently asked questions' "$en" || enok=no
            if grep -Fq 'Sobre Tolecarnes' "$en" || grep -Fq 'Preguntas frecuentes' "$en"; then enok=no; fi
            status=OK
            if [[ "$esc" != 200 || "$enc" != 200 || "$esok" != yes || "$enok" != yes ]]; then status=FAIL; failures=$((failures+1)); fi
            echo "VERIFY slug=${s} ES_HTTP=${esc} ES=${esok} EN_HTTP=${enc} EN=${enok} STATUS=${status}"
          done
          echo "BATCH04_PUBLIC_FAILURES=${failures}"
          [[ "$failures" -eq 0 ]]

name: Finalize Selectos active taxonomy 20261001

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize-selectos-active-taxonomy-20261001.php'
      - '.github/workflows/finalize-selectos-active-taxonomy-20261001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize production taxonomy by source status
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/finalize-selectos-active-taxonomy-20261001.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass jq >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(command -v php || true)
            [ -n "$php" ] || php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            prod=""
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac
            done
            [ -n "$prod" ] || exit 22
            printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE="/tmp/finalize-selectos-taxonomy-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/finalize-selectos-active-taxonomy-20261001.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; '$PHP' -d memory_limit=768M '$WP' eval-file '$REMOTE' --path='$PROD' --allow-root" > /tmp/selectos-final-active-taxonomy.json
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE'; '$PHP' '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true"
          jq -e '.batch == "20261001-selectos-final-active-taxonomy"' /tmp/selectos-final-active-taxonomy.json >/dev/null
          jq -e '.active_products == 120 and .excluded_products == 78' /tmp/selectos-final-active-taxonomy.json >/dev/null
          jq -e '.active_missing_after == 0 and .active_uncategorized_after == 0 and .active_mentta_after == 0 and .excluded_with_categories_after == 0' /tmp/selectos-final-active-taxonomy.json >/dev/null
          jq -e '(.status_changes|length)==0 and (.stock_changes|length)==0' /tmp/selectos-final-active-taxonomy.json >/dev/null
          jq -e '(.deleted_categories|sort)==(["despensa-gourmet","vinos-licores"]|sort)' /tmp/selectos-final-active-taxonomy.json >/dev/null
          mkdir -p .deploy-status
          cp /tmp/selectos-final-active-taxonomy.json .deploy-status/selectos-final-active-taxonomy-20261001.json
          jq '{batch,supplier_id,active_products,excluded_products,active_missing_after,active_uncategorized_after,active_mentta_after,excluded_with_categories_after,deleted_categories,category_counts_active}' .deploy-status/selectos-final-active-taxonomy-20261001.json
      - name: Record verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/selectos-final-active-taxonomy-20261001.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record final Selectos active taxonomy [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Home cache critical key 0.10.257 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-cache-critical-key-010257-production.yml'

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Home cache key critical-CSS aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/inc/home-cache.php')
          s=p.read_text()
          old="""function elmercado_home_cache_key(): string {\n\treturn 'elmercado_home_' . md5( ELMERCADO_THEME_VERSION . '|' . home_url( '/' ) );\n}"""
          new="""function elmercado_home_cache_key(): string {\n\t$critical_file  = ELMERCADO_THEME_PATH . '/assets/css/critical-woostify-home.min.css';\n\t$critical_stamp = is_file( $critical_file ) ? (string) filemtime( $critical_file ) : '0';\n\n\treturn 'elmercado_home_' . md5( ELMERCADO_THEME_VERSION . '|' . $critical_stamp . '|' . home_url( '/' ) );\n}"""
          if old in s:
              s=s.replace(old,new)
          elif '$critical_stamp' not in s:
              raise SystemExit('cache key function did not match expected source')
          p.write_text(s)
          PY
          php -l elmercadodeorigen-child/inc/home-cache.php
          grep -q '\$critical_stamp' elmercadodeorigen-child/inc/home-cache.php
          grep -q 'body.home .topbar{display:none!important}' elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
      - name: Deploy cache key and critical CSS
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e scp $SCP elmercadodeorigen-child/inc/home-cache.php "$STAGING_USER@$STAGING_HOST:/tmp/home-cache-010257.php"
          sshpass -e scp $SCP elmercadodeorigen-child/assets/css/critical-woostify-home.min.css "$STAGING_USER@$STAGING_HOST:/tmp/critical-home-010257.css"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            set -e
            THEME='$PROD_PATH/wp-content/themes/elmercadodeorigen-child'
            install -m 0644 /tmp/home-cache-010257.php \"\$THEME/inc/home-cache.php\"
            install -m 0644 /tmp/critical-home-010257.css \"\$THEME/assets/css/critical-woostify-home.min.css\"
            php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
            wp_bin=\$(command -v wp)
            \"\$php_bin\" -l \"\$THEME/inc/home-cache.php\"
            \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root || true
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static/index.html'
            rm -f '$PROD_PATH/wp-content/uploads/elmercado-home-static'/home-deferred-0.10.256.css
            rm -f /tmp/home-cache-010257.php /tmp/critical-home-010257.css
          "
      - name: Verify fresh critical document and Lighthouse
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null
          HTML=$(mktemp)
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          topbar=$(grep -c 'body.home .topbar{display:none!important}' "$HTML" || true)
          cart=$(grep -c 'body.home:not(.emo-js-ready) #shop-cart-sidebar' "$HTML" || true)
          critical=$(grep -c 'id="elmercado-home-first-view-css"' "$HTML" || true)
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          export CHROME_PATH="$CHROME"
          npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --output=json --output-path=/tmp/lhr.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          TOPBAR="$topbar" CART="$cart" CRITICAL="$critical" python3 - <<'PY' > runtime/home-cache-critical-key-010257.txt
          import json,os
          a=json.load(open('/tmp/lhr.json'))['audits']
          print('deploy=success')
          print('initial_critical_css=',os.environ['CRITICAL'])
          print('initial_topbar_rule=',os.environ['TOPBAR'])
          print('initial_cart_rule=',os.environ['CART'])
          for k in ('first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','render-blocking-resources'):
              x=a.get(k,{})
              print(f'{k}: numeric={x.get("numericValue")} display={x.get("displayValue")} score={x.get("score")}')
          for item in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or []):
              n=item.get('node') or {}
              print('shift=',item.get('score'),'selector=',n.get('selector'),'label=',n.get('nodeLabel'))
          for group in ((a.get('lcp-breakdown-insight',{}).get('details') or {}).get('items') or []):
              if group.get('type')=='table': print('lcp_breakdown=',json.dumps(group,ensure_ascii=False,separators=(',',':')))
          PY
          cat runtime/home-cache-critical-key-010257.txt
          test "$critical" -ge 1
          test "$topbar" -ge 1
          test "$cart" -ge 1
      - name: Commit source and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-cache-critical-key-010257.txt ] || printf 'deploy=%s\nverify=%s\n' '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' > runtime/home-cache-critical-key-010257.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/home-cache.php runtime/home-cache-critical-key-010257.txt
          git commit -m 'Make Home cache key follow critical CSS and verify CLS' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

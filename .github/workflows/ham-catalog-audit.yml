name: Audit Jamones y Paletas staging

on:
  push:
    branches: [dev/ham-catalog-audit]
    paths:
      - 'scripts/ham-catalog-audit-export.php'
      - '.github/workflows/ham-catalog-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - uses: actions/checkout@v4

      - name: Validate audit exporter
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/ham-catalog-audit-export.php
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"

      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass rsync jq

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve staging WordPress path
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          domain="$2"
          wp_path=""
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates"' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep "/${domain}/wp-config.php$" "$candidates" | head -n 1 || true)"
            [ -n "$preferred" ] || { echo "No WordPress installation found for ${domain}." >&2; exit 1; }
            wp_path="$(dirname "$preferred")"
          fi
          [ "$(basename "$wp_path")" = "$domain" ] || { echo "Resolved path does not match ${domain}: ${wp_path}" >&2; exit 1; }
          printf '__WP_PATH__=%s\n' "$wp_path"
          REMOTE
          )"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"
          : "${WP_PATH:?Could not resolve staging WordPress path}"
          echo "STAGING_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Export full catalog evidence
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_SCRIPT="/tmp/emdo-ham-catalog-audit-${GITHUB_RUN_ID}.php"
          REMOTE_JSON="/tmp/emdo-ham-catalog-audit-${GITHUB_RUN_ID}.json"
          REMOTE_ERR="/tmp/emdo-ham-catalog-audit-${GITHUB_RUN_ID}.stderr.log"
          sshpass -e scp $SSH_OPTIONS scripts/ham-catalog-audit-export.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_WP_PATH' '$REMOTE_SCRIPT' '$REMOTE_JSON' '$REMOTE_ERR'" <<'REMOTE'
          set -eu
          wp_path="$1"
          script="$2"
          json="$3"
          err="$4"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI unavailable' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'PHP CLI unavailable' >&2; exit 1; }
          "$php_bin" -d memory_limit=1024M -d display_errors=0 "$wp_bin" eval-file "$script" --path="$wp_path" --allow-root > "$json" 2> "$err"
          test -s "$json"
          "$php_bin" -r '$j=json_decode(file_get_contents($argv[1]),true); if(!is_array($j)||!isset($j["items"])) exit(2); echo count($j["items"]),"\n";' "$json"
          REMOTE
          sshpass -e scp $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST:$REMOTE_JSON" ham-catalog-audit.json
          sshpass -e scp $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST:$REMOTE_ERR" ham-catalog-audit.stderr.log || true
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -f '$REMOTE_SCRIPT' '$REMOTE_JSON' '$REMOTE_ERR'" || true
          jq '{generated_at, count}' ham-catalog-audit.json
          jq -e '.count > 0 and (.items | length) == .count' ham-catalog-audit.json >/dev/null

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ham-catalog-audit
          path: |
            ham-catalog-audit.json
            ham-catalog-audit.stderr.log
          retention-days: 2

name: Deploy English launch fixes v62

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          php -l mu-plugins/mdo-zzz-english-launch-quality-010262.php
          php -l .github/scripts/fix-english-launch-content-20260818-v62.php
      - name: Deploy and persist fixes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD_PATH=''
          for n in 1 2 3; do
            PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
              wp_bin=$(command -v wp || true)
              php_bin=$(command -v php || true)
              [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
              for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
                p=$(dirname "$cfg")
                url=$("$php_bin" -d memory_limit=256M "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
                case "$url" in
                  https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break ;;
                esac
              done
            ' || true)"
            [ -n "$PROD_PATH" ] && break
            sleep $((n*2))
          done
          : "${PROD_PATH:?production path not found}"
          echo "Production path resolved."
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'; test ! -f '$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-launch-quality-010262.php' || cp -p '$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-launch-quality-010262.php' '$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-launch-quality-010262.php.bak-${GITHUB_RUN_ID}'"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-zzz-english-launch-quality-010262.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-zzz-english-launch-quality-010262.php"
          REMOTE_SCRIPT="/tmp/mdo-english-launch-v62-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/fix-english-launch-content-20260818-v62.php "$STAGING_USER@$STAGING_HOST:$REMOTE_SCRIPT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE_SCRIPT' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc" | tee /tmp/english-launch-fixes-v62.json
      - name: Smoke test corrected pages and cart session
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 AppleWebKit/537.36 Chrome/126 Safari/537.36'
          check(){ u="$1"; f="$2"; s=$(curl -A "$UA" -L -sS --max-time 40 -o "$f" -w '%{http_code}' "$u"); echo "$s $u"; test "$s" = 200; }
          check https://www.elmercadodeorigen.com/en/journal/ /tmp/journal
          grep -q 'Iberian ham is a unique product' /tmp/journal
          grep -q 'November is harvest time' /tmp/journal
          ! grep -qiE 'El Jam[oó]n Ib[eé]rico es|Noviembre es la [ée]poca' /tmp/journal
          check https://www.elmercadodeorigen.com/en/product-category/oils/ /tmp/oils
          grep -q 'Remove' /tmp/oils; ! grep -q 'Quitar' /tmp/oils; grep -q '3 results' /tmp/oils
          check https://www.elmercadodeorigen.com/en/variedad/tradicional-martena-picual/ /tmp/variety
          grep -q 'Variety:' /tmp/variety; ! grep -q 'Variedad:' /tmp/variety
          check https://www.elmercadodeorigen.com/en/cookie-policy/ /tmp/cookie
          ! grep -q 'First name' /tmp/cookie; ! grep -qiE 'hl=es|youronlinechoices\.com/es/' /tmp/cookie
          check https://www.elmercadodeorigen.com/en/product/extra-virgin-olive-oil-5l/ /tmp/oil
          ! grep -q 'NEW HARVEST 23/24' /tmp/oil; grep -q '2023/24 harvest' /tmp/oil
          rm -f /tmp/cj
          curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj 'https://www.elmercadodeorigen.com/en/?add-to-cart=1382' -o /tmp/add
          cart=$(curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj -o /tmp/cart -w '%{http_code}' 'https://www.elmercadodeorigen.com/en/cart/')
          echo "cart=$cart"; test "$cart" = 200; grep -qi 'Sobrasada' /tmp/cart
          checkout=$(curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj -o /tmp/checkout -w '%{http_code}' 'https://www.elmercadodeorigen.com/en/checkout/')
          echo "checkout=$checkout"; test "$checkout" = 200
          ! grep -qiE '>\s*(Carrito|Finalizar compra|Detalles de facturación|Realizar pedido|Pedido mínimo|Importe mínimo)\s*<' /tmp/cart /tmp/checkout
          echo ENGLISH_LAUNCH_QA_V62_OK

name: Deploy English launch fixes v62

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.title == 'Run English launch fixes v62')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          php -l mu-plugins/mdo-zzz-english-launch-quality-010262.php
          php -l .github/scripts/fix-english-launch-content-20260818-v62.php
      - name: Deploy and persist fixes
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD=/var/www/vhosts/elmercadodeorigen.com/httpdocs
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "test -f '$PROD/wp-config.php' && mkdir -p '$PROD/wp-content/mu-plugins'"
          sshpass -e scp $SCP mu-plugins/mdo-zzz-english-launch-quality-010262.php "$STAGING_USER@$STAGING_HOST:$PROD/wp-content/mu-plugins/mdo-zzz-english-launch-quality-010262.php"
          REMOTE="/tmp/mdo-english-launch-v62-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP .github/scripts/fix-english-launch-content-20260818-v62.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "wp=\$(command -v wp); ph=\$(command -v php || true); [ -n \"\$ph\" ] || ph=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -1); \"\$ph\" -d memory_limit=768M \"\$wp\" eval-file '$REMOTE' --path='$PROD' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" | tee runtime/english-launch-fixes-v62.json
      - name: Smoke test corrected pages and cart session
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 AppleWebKit/537.36 Chrome/126 Safari/537.36'
          out=runtime/english-launch-qa-v62.txt
          : > "$out"
          check(){ u="$1"; f="$2"; s=$(curl -A "$UA" -L -sS --max-time 40 -o "$f" -w '%{http_code}' "$u"); echo "$s $u" >> "$out"; test "$s" = 200; }
          check https://www.elmercadodeorigen.com/en/journal/ /tmp/journal
          grep -q 'Iberian ham is a unique product' /tmp/journal
          grep -q 'November is harvest time' /tmp/journal
          ! grep -qiE 'El Jam[oó]n Ib[eé]rico es|Noviembre es la [ée]poca' /tmp/journal
          check https://www.elmercadodeorigen.com/en/product-category/oils/ /tmp/oils
          grep -q 'Remove' /tmp/oils; ! grep -q 'Quitar' /tmp/oils; grep -q '3 results' /tmp/oils
          check https://www.elmercadodeorigen.com/en/variedad/tradicional-martena-picual/ /tmp/variety
          grep -q 'Variety:' /tmp/variety; ! grep -q 'Variedad:' /tmp/variety
          check https://www.elmercadodeorigen.com/en/cookie-policy/ /tmp/cookie
          ! grep -q 'First name' /tmp/cookie; ! grep -qiE 'hl=es|youronlinechoices\.com/es/' /tmp/cookie
          check https://www.elmercadodeorigen.com/en/product/extra-virgin-olive-oil-5l/ /tmp/oil
          ! grep -q 'NEW HARVEST 23/24' /tmp/oil; grep -q '2023/24 harvest' /tmp/oil
          rm -f /tmp/cj
          curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj 'https://www.elmercadodeorigen.com/en/?add-to-cart=1382' -o /tmp/add
          checkcart=$(curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj -o /tmp/cart -w '%{http_code}' 'https://www.elmercadodeorigen.com/en/cart/')
          echo "cart=$checkcart" >> "$out"; test "$checkcart" = 200; grep -qi 'Sobrasada' /tmp/cart
          checkout=$(curl -A "$UA" -L -sS -c /tmp/cj -b /tmp/cj -o /tmp/checkout -w '%{http_code}' 'https://www.elmercadodeorigen.com/en/checkout/')
          echo "checkout=$checkout" >> "$out"; test "$checkout" = 200
          ! grep -qiE '>\s*(Carrito|Finalizar compra|Detalles de facturación|Realizar pedido|Pedido mínimo|Importe mínimo)\s*<' /tmp/cart /tmp/checkout
          echo status=success >> "$out"
      - name: Record results
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase
          git add runtime/english-launch-fixes-v62.json runtime/english-launch-qa-v62.txt 2>/dev/null || true
          git commit -m 'Record English launch fixes and QA v62' || exit 0
          git push

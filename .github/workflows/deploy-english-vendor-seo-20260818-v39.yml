name: Deploy English vendor SEO v39

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-english-vendor-seo-20260818-v39.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Record run id immediately
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/english-vendor-v39.txt
          git add runtime/english-vendor-v39.txt
          git commit -m 'Start English vendor SEO v39'
          git push
      - name: Syntax check
        run: |
          php -l mu-plugins/mdo-z-english-vendor-seo-010260.php
          php -l .github/scripts/seed-english-vendor-seo-20260818-v38.php
      - name: Deploy and seed production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p '$PROD_PATH/wp-content/mu-plugins'"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-z-english-vendor-seo-010260.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php"
          REMOTE="/tmp/mdo-seed-v39-${GITHUB_RUN_ID}.php"
          sshpass -e scp $SCP_OPTIONS .github/scripts/seed-english-vendor-seo-20260818-v38.php "$STAGING_USER@$STAGING_HOST:$REMOTE"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -d memory_limit=768M \"\$wp_bin\" eval-file '$REMOTE' --path='$PROD_PATH' --allow-root; rc=\$?; rm -f '$REMOTE'; exit \$rc" > /tmp/seed.json
          cp /tmp/seed.json runtime/english-vendor-seed-v39.json
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "wp_bin=\$(command -v wp); php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"
      - name: Verify production URLs
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          out=runtime/english-vendor-check-v39.txt
          : > "$out"
          getpage(){ local u="$1"; local s; s=$(curl -A "$UA" -L -sS --max-time 35 -o /tmp/body -w '%{http_code}' "$u"); echo "status=$s url=$u bytes=$(wc -c </tmp/body)" >> "$out"; test "$s" = 200; }
          redirect(){ local u="$1" want="$2"; curl -A "$UA" -sS --max-time 25 -o /dev/null -D /tmp/h "$u"; local s l; s=$(awk 'toupper($1)~/^HTTP\//{x=$2}END{print x}' /tmp/h); l=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/h); echo "redirect=$s from=$u to=$l" >> "$out"; test "$s" = 301; case "$l" in *"$want"*) ;; *) exit 1;; esac; }
          getpage https://www.elmercadodeorigen.com/en/categories/
          grep -qi 'Categories' /tmp/body
          redirect https://www.elmercadodeorigen.com/en/categorias/ /en/categories/
          getpage https://www.elmercadodeorigen.com/en/store/1957/
          c=$(grep -oE '/en/product/[^"'"' <]+' /tmp/body | sort -u | wc -l | tr -d ' '); echo "1957_products=$c" >> "$out"; test "$c" -gt 0
          ! grep -qiE '>\s*Policies\s*<' /tmp/body
          grep -q '/en/store/1957/about/' /tmp/body
          getpage https://www.elmercadodeorigen.com/en/store/1957/about/
          grep -qi 'The story of' /tmp/body
          getpage https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/
          c=$(grep -oE '/en/product/[^"'"' <]+' /tmp/body | sort -u | wc -l | tr -d ' '); echo "hidalgo_products=$c" >> "$out"; test "$c" -gt 0
          ! grep -qiE '>\s*Policies\s*<' /tmp/body
          grep -q '/en/store/hidalgo-de-la-jara/about/' /tmp/body
          getpage https://www.elmercadodeorigen.com/en/store/hidalgo-de-la-jara/about/
          grep -qi 'livestock farmers' /tmp/body
          ! grep -qi 'Los ganaderos que integran' /tmp/body
          redirect https://www.elmercadodeorigen.com/en/tienda/1957/ /en/store/1957/
          redirect https://www.elmercadodeorigen.com/en/tienda/hidalgo-de-la-jara/acercade/ /en/store/hidalgo-de-la-jara/about/
          p=$(curl -A "$UA" -L -sS --max-time 35 https://www.elmercadodeorigen.com/en/store/1957/ | grep -oE 'https://www\.elmercadodeorigen\.com/en/product/[^"'"' ]+/' | head -1 || true)
          test -n "$p"
          getpage "$p"
          ! grep -qiE '>\s*Policies\s*<|>\s*Store Policies\s*<|Políticas de la tienda' /tmp/body
          grep -q '/en/store/1957/' /tmp/body
          echo "product=$p" >> "$out"
          echo status=success >> "$out"
      - name: Record success
        if: success()
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase
          printf 'run_id=%s\nstatus=success\n' "$GITHUB_RUN_ID" > runtime/english-vendor-v39.txt
          git add runtime/english-vendor-v39.txt runtime/english-vendor-seed-v39.json runtime/english-vendor-check-v39.txt
          git commit -m 'Verify English vendor SEO v39'
          git push

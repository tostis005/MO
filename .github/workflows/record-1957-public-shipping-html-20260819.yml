name: Record public 1957 shipping HTML diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-1957-public-shipping-html-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture shipping table text
        run: |
          set -euo pipefail
          URL="https://www.elmercadodeorigen.com/tienda/1957/?mdo_shipping=1&emdo_public_shipping_diag=${GITHUB_RUN_ID}"
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 EMDO shipping diagnostic' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' -o /tmp/shipping.html "$URL"
          mkdir -p .deploy-status
          python3 - <<'PY' > .deploy-status/1957-public-shipping-html.txt
          import html,re
          s=open('/tmp/shipping.html',encoding='utf-8',errors='ignore').read()
          print('has_shipping_block=' + ('yes' if 'mdo-store-shipping' in s else 'no'))
          rows=re.findall(r'<tr\b[^>]*>(.*?)</tr>',s,flags=re.I|re.S)
          print('row_count=%d' % len(rows))
          for i,row in enumerate(rows,1):
              text=html.unescape(re.sub(r'<[^>]+>',' ',row))
              text=re.sub(r'\s+',' ',text).strip()
              print('row_%d=%s' % (i,text[:1000]))
          m=re.search(r'<div[^>]+class="[^"]*mdo-store-shipping[^"]*"[^>]*>(.*?)</div>\s*</div>\s*</div>',s,flags=re.I|re.S)
          if m:
              text=html.unescape(re.sub(r'<[^>]+>',' ',m.group(1)))
              print('block_text=' + re.sub(r'\s+',' ',text).strip()[:4000])
          PY
          cat .deploy-status/1957-public-shipping-html.txt
      - name: Record diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/1957-public-shipping-html.txt
          git commit -m 'Record public 1957 shipping HTML [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

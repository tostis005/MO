name: Deploy EMDO plugin to staging

on:
  push:
    branches: [main]
    paths:
      - 'mdo-supplier-sync/**'
      - '.github/workflows/deploy-supplier-sync-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-supplier-sync-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f mdo-supplier-sync/mdo-supplier-sync.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve staging WordPress path
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          domain="$2"
          wp_path=""
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates"' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep "/${domain}/wp-config.php$" "$candidates" | head -n 1 || true)"
            [ -n "$preferred" ] || { echo "No WordPress installation found for ${domain}." >&2; exit 1; }
            wp_path="$(dirname "$preferred")"
          fi
          [ "$(basename "$wp_path")" = "$domain" ] || { echo "Resolved path does not match ${domain}: ${wp_path}" >&2; exit 1; }
          [ -f "$wp_path/wp-config.php" ]
          [ -d "$wp_path/wp-content/plugins" ]
          printf '__WP_PATH__=%s\n' "$wp_path"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"
          : "${WP_PATH:?Could not resolve staging WordPress path}"
          echo "STAGING_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Deploy activate classify audit finalize and provision cron
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          TARGET="${STAGING_WP_PATH%/}/wp-content/plugins/mdo-supplier-sync/"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p -- '$TARGET'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$TARGET"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI is unavailable.' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'No usable PHP CLI binary found.' >&2; exit 1; }
          command -v flock >/dev/null 2>&1 || { echo 'flock is unavailable.' >&2; exit 1; }

          "$php_bin" -d memory_limit=512M "$wp_bin" plugin activate mdo-supplier-sync --path="$wp_path" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$wp_path" --allow-root
          db_version="$("$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_supplier_sync_db_version --path="$wp_path" --allow-root)"
          [ "$db_version" = '1.2.0' ]

          taxonomy_report="$("$php_bin" -d memory_limit=768M "$wp_bin" eval 'echo wp_json_encode( MDO_Ham_Taxonomy::migrate_catalog( false ), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );' --path="$wp_path" --allow-root)"
          printf 'Jamones/Paletas taxonomy: %s\n' "$taxonomy_report"

          audit_report="$("$php_bin" -d memory_limit=1024M "$wp_bin" eval 'echo wp_json_encode( MDO_Ham_Catalog_Audit::apply_catalog(), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );' --path="$wp_path" --allow-root)"
          printf 'Jamones/Paletas exhaustive audit: %s\n' "$audit_report"

          final_report="$("$php_bin" -d memory_limit=1024M "$wp_bin" eval 'echo wp_json_encode( MDO_Ham_Catalog_Final::apply_catalog(), JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );' --path="$wp_path" --allow-root)"
          printf 'Jamones/Paletas special finalization: %s\n' "$final_report"

          # WP-Cron no puede depender del tráfico nocturno. Gestionamos únicamente
          # nuestro bloque de crontab y conservamos cualquier otra entrada existente.
          existing="$(mktemp)"
          cleaned="$(mktemp)"
          managed="$(mktemp)"
          trap 'rm -f "$existing" "$cleaned" "$managed"' EXIT
          crontab -l > "$existing" 2>/dev/null || true
          awk '
            $0 == "# BEGIN EMDO STAGING CRON" { skip=1; next }
            $0 == "# END EMDO STAGING CRON"   { skip=0; next }
            !skip { print }
          ' "$existing" > "$cleaned"
          cat "$cleaned" > "$managed"
          cat >> "$managed" <<CRON
          # BEGIN EMDO STAGING CRON
          * * * * * flock -n /tmp/emdo-staging-wp-cron.lock "$php_bin" -d memory_limit=768M "$wp_bin" cron event run --due-now --path="$wp_path" --allow-root --quiet >/dev/null 2>&1
          # END EMDO STAGING CRON
          CRON
          crontab "$managed"

          echo "EMDO ${db_version} active in ${wp_path}."
          echo 'Managed staging cron:'
          crontab -l | sed -n '/# BEGIN EMDO STAGING CRON/,/# END EMDO STAGING CRON/p'
          REMOTE

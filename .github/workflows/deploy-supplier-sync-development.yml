name: Deploy EMDO plugin to staging

on:
  push:
    branches: [main]
    paths:
      - 'mdo-supplier-sync/**'
      - '.github/workflows/deploy-supplier-sync-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elmercado-supplier-sync-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}
      STAGING_DOMAIN: dev.elmercadodeorigen.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f mdo-supplier-sync/mdo-supplier-sync.php
          find mdo-supplier-sync -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          : "${STAGING_HOST:?Missing STAGING_HOST secret}"
          : "${STAGING_USER:?Missing STAGING_USER secret}"
          : "${STAGING_PASSWORD:?Missing STAGING_PASSWORD secret}"
          : "${STAGING_REMOTE_PATH:?Missing STAGING_REMOTE_PATH secret}"
          PORT="${STAGING_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]]

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve staging WordPress path
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUTPUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$STAGING_DOMAIN'" <<'REMOTE'
          set -eu
          raw="${1%/}"
          domain="$2"
          wp_path=""
          case "$raw" in
            */wp-content/*) wp_path="${raw%%/wp-content/*}" ;;
            */wp-content) wp_path="$(dirname "$raw")" ;;
            *) wp_path="$raw" ;;
          esac
          if [ ! -f "$wp_path/wp-config.php" ]; then
            candidates="$(mktemp)"
            trap 'rm -f "$candidates"' EXIT
            for base in "$raw" "$HOME" /var/www /home /srv /opt /data /web /www; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 9 -type f -name wp-config.php ! -path '*/cache/*' ! -path '*/backup/*' ! -path '*/backups/*' 2>/dev/null >> "$candidates" || true
            done
            preferred="$(grep "/${domain}/wp-config.php$" "$candidates" | head -n 1 || true)"
            [ -n "$preferred" ] || { echo "No WordPress installation found for ${domain}." >&2; exit 1; }
            wp_path="$(dirname "$preferred")"
          fi
          [ "$(basename "$wp_path")" = "$domain" ] || { echo "Resolved path does not match ${domain}: ${wp_path}" >&2; exit 1; }
          [ -f "$wp_path/wp-config.php" ]
          [ -d "$wp_path/wp-content/plugins" ]
          printf '__WP_PATH__=%s\n' "$wp_path"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"
          WP_PATH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^__WP_PATH__=//p' | tail -n 1)"
          : "${WP_PATH:?Could not resolve staging WordPress path}"
          echo "STAGING_WP_PATH=$WP_PATH" >> "$GITHUB_ENV"

      - name: Deploy and activate EMDO
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          TARGET="${STAGING_WP_PATH%/}/wp-content/plugins/mdo-supplier-sync/"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "mkdir -p -- '$TARGET'"
          sshpass -e rsync -az --delete --exclude='.DS_Store' -e "ssh $SSH_OPTIONS" mdo-supplier-sync/ "$STAGING_USER@$STAGING_HOST:$TARGET"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          wp_bin="$(command -v wp || true)"
          [ -n "$wp_bin" ] || { echo 'WP-CLI is unavailable.' >&2; exit 1; }
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          [ -x "$php_bin" ] || { echo 'No usable PHP CLI binary found.' >&2; exit 1; }
          test -f "$wp_path/wp-content/plugins/mdo-supplier-sync/mdo-supplier-sync.php"
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin activate mdo-supplier-sync --path="$wp_path" --allow-root
          "$php_bin" -d memory_limit=512M "$wp_bin" plugin is-active mdo-supplier-sync --path="$wp_path" --allow-root
          db_version="$("$php_bin" -d memory_limit=512M "$wp_bin" option get mdo_supplier_sync_db_version --path="$wp_path" --allow-root)"
          [ "$db_version" = '1.2.0' ]
          echo "EMDO ${db_version} active in ${wp_path}."
          REMOTE

      - name: Verify EMDO description repair
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $table = MDO_Database::table("source_products");
            $stats = get_option("mdo_description_repair_stats", array());
            $version = (string) get_option("mdo_description_repair_version", "");
            echo "repair_version=" . $version . "\n";
            echo "repair_stats=" . wp_json_encode($stats, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . "\n";
            $rows = $wpdb->get_results("SELECT wc_product_id, source_payload FROM {$table} WHERE wc_product_id IS NOT NULL AND wc_product_id > 0 AND source_payload IS NOT NULL", ARRAY_A) ?: array();
            $remaining_woo = 0;
            $remaining_payload = 0;
            foreach ($rows as $row) {
              $id = absint($row["wc_product_id"] ?? 0);
              $content = (string) $wpdb->get_var($wpdb->prepare("SELECT post_content FROM {$wpdb->posts} WHERE ID=%d", $id));
              if ($content !== MDO_Text::normalize_description($content)) { $remaining_woo++; }
              $payload = json_decode((string)$row["source_payload"], true);
              if (is_array($payload) && array_key_exists("description", $payload)) {
                $desc = (string)$payload["description"];
                if ($desc !== MDO_Text::normalize_description($desc)) { $remaining_payload++; }
              }
            }
            echo "remaining_woo=" . $remaining_woo . "\n";
            echo "remaining_payload=" . $remaining_payload . "\n";
            if ($version !== "1" || (int)($stats["errors"] ?? 1) !== 0 || $remaining_woo !== 0 || $remaining_payload !== 0) { exit(9); }
          ' --path="$wp_path" --allow-root
          REMOTE

      - name: Validate El Catedratico weight variations
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_WP_PATH'" <<'REMOTE'
          set -eu
          wp_path="$1"
          wp_bin="$(command -v wp || true)"
          php_bin="$(command -v php || true)"
          if [ -z "$php_bin" ]; then
            php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n 1 || true)"
          fi
          "$php_bin" -d memory_limit=512M "$wp_bin" eval '
            global $wpdb;
            $suppliers = MDO_Database::table("suppliers");
            $supplier = $wpdb->get_row("SELECT * FROM {$suppliers} WHERE connector=\"el-catedratico\" ORDER BY id ASC LIMIT 1", ARRAY_A);
            if (!$supplier) { throw new RuntimeException("No hay proveedor El Catedrático configurado en staging."); }
            $url = "https://www.elcatedratico.com/es/jamon-de-bellota-iberico-75-raza-iberica";
            $product = MDO_Connector_Iberico_Family::scrape_product($url, $supplier);
            $product = MDO_Text::normalize_product($product);
            $vars = isset($product["variations"]) && is_array($product["variations"]) ? $product["variations"] : array();
            echo "variation_count=" . count($vars) . "\n";
            echo "base_price=" . json_encode($product["price"] ?? null) . " regular=" . json_encode($product["regular_price"] ?? null) . " unit=" . json_encode($product["unit_price"] ?? null) . "\n";
            echo "first=" . wp_json_encode($vars[0] ?? array(), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . "\n";
            echo "last=" . wp_json_encode($vars ? end($vars) : array(), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . "\n";
            if (count($vars) < 8) { throw new RuntimeException("No se detectaron todos los tramos de peso esperados."); }
            $first = $vars[0];
            $label = (string)($first["attributes"]["peso"] ?? "");
            if (strpos($label, "7,200 kg") === false || strpos($label, "7,400 kg") === false) { throw new RuntimeException("El primer tramo de peso no coincide con el origen."); }
            if (abs((float)($first["display_price"] ?? 0) - 248.20) > 0.08) { throw new RuntimeException("El precio de la primera variación no coincide con el origen."); }
            if ((float)($first["display_regular_price"] ?? 0) <= (float)($first["display_price"] ?? 0)) { throw new RuntimeException("No se conservó el precio regular de la oferta."); }
          ' --path="$wp_path" --allow-root
          REMOTE

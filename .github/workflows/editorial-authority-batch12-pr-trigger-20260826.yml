name: Editorial authority batch 12 PR production trigger 20260826

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: editorial-authority-batch12-pr-production-20260826
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'trigger/editorial-batch12-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish and verify batch 12 in production
        shell: bash
        run: bash .github/scripts/run-editorial-authority-batch12-production.sh

name: Production fix stale English homepage 2026-08-16
on:
  push:
    paths:
      - '.github/workflows/production-fix-english-home-stale-content-20260816.yml'
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
      - name: Patch English front page safely
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          OPTS="-o ConnectTimeout=15 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $OPTS "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          WP=$(command -v wp || true); PHP=$(command -v php || true)
          [ -n "$PHP" ] || PHP=$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)
          ROOT=""
          for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path '*/httpdocs/wp-config.php' 2>/dev/null); do
            p=$(dirname "$cfg"); u=$("$PHP" "$WP" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
            case "$u" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) ROOT="$p"; break;; esac
          done
          : "${ROOT:?missing production}"
          F="$ROOT/wp-content/mu-plugins/mdo-english-island-runtime-seo.php"
          [ -f "$F" ] || { echo "missing $F"; exit 2; }
          TS=$(date +%Y%m%d%H%M%S); B="$F.bak-home-current-$TS"; cp -a "$F" "$B"
          cat >/tmp/mdo-fix-en-home.php <<'PHP'
          <?php
          $f=$argv[1]; $s=file_get_contents($f);
          $old="add_filter( 'the_content', static function ( \$content ) {\n    if ( ! mdo_island_en_request() || ! is_singular() ) { return \$content; }\n    \$post_id = (int) get_the_ID();";
          $new="add_filter( 'the_content', static function ( \$content ) {\n    if ( ! mdo_island_en_request() || ! is_singular() ) { return \$content; }\n    // The Home presentation layer changes frequently; let TranslatePress render the current native Home instead of a stale metadata snapshot.\n    if ( is_front_page() ) { return \$content; }\n    \$post_id = (int) get_the_ID();";
          if (strpos($s,$new)!==false) { echo "already patched\n"; exit(0); }
          if (strpos($s,$old)===false) { fwrite(STDERR,"target block not found\n"); exit(3); }
          $s=str_replace($old,$new,$s,$count);
          if ($count!==1) { fwrite(STDERR,"replace count $count\n"); exit(4); }
          file_put_contents($f,$s);
          PHP
          "$PHP" /tmp/mdo-fix-en-home.php "$F"
          "$PHP" -l "$F"
          "$PHP" "$WP" cache flush --path="$ROOT" --allow-root >/dev/null 2>&1 || true
          echo "BACKUP=$B"
          REMOTE
      - name: Verify Spanish is intact and English uses current Home structure
        run: |
          python3 - <<'PY'
          import re,time,urllib.request
          base='https://www.elmercadodeorigen.com'
          def get(path):
              url=base+path+('?' if '?' not in path else '&')+'mdo_homefix='+str(time.time_ns())
              t=time.monotonic(); req=urllib.request.Request(url,headers={'User-Agent':'MDO-Home-Fix-QA/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  h=r.read().decode('utf-8','replace'); return r.status,round(time.monotonic()-t,3),h
          failures=[]
          for path in ['/','/tienda/','/en/']:
              s,t,h=get(path); print(path,'HTTP',s,'SEC',t,'LEN',len(h),'VENDORS',h.count('emo-hero-card'),'CATS',h.count('emo-category-card'))
              if s!=200 or len(h)<10000: failures.append(path)
              if path=='/' and ('translatepress-es_ES' not in h or 'data-emo-vendor-count' not in h): failures.append('es-home-structure')
              if path=='/tienda/' and 'woocommerce-shop' not in h: failures.append('es-shop')
              if path=='/en/' and ('translatepress-en_US' not in h or 'data-emo-vendor-count' not in h): failures.append('en-home-current-structure')
          if failures:
              print('FAIL',failures); raise SystemExit(1)
          print('HOME_FIX_QA=PASS')
          PY

name: Editorial authority batch 26 core publish 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/publish-editorial-authority-batch26-core-20260827.php'
      - '.github/data/editorial-authority-batch26-20260827/*.php'
      - '.github/workflows/editorial-authority-batch26-core-publish-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate editorial files
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/scripts/publish-editorial-authority-batch26-core-20260827.php
          test "$(find .github/data/editorial-authority-batch26-20260827 -maxdepth 1 -type f -name '*.php' | wc -l)" -eq 5
          for f in .github/data/editorial-authority-batch26-20260827/*.php; do php -l "$f"; done

      - name: Publish five posts with WordPress core only
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          INFO="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp=$(command -v wp || true); php=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            [ -n "$wp" ] || exit 2; [ -n "$php" ] || exit 3
            prod=""; for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); u=$("$php" "$wp" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$u" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) prod="$p"; break;; esac; done
            [ -n "$prod" ] || exit 4; printf "%s|%s|%s" "$prod" "$php" "$wp"
          ')"
          PROD="${INFO%%|*}"; REST="${INFO#*|}"; PHP="${REST%%|*}"; WP="${REST#*|}"
          REMOTE=/tmp/emdo-ab26core-${GITHUB_RUN_ID}; DATA=$REMOTE/data; PUB=$REMOTE/publish.php
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE'; mkdir -p '$DATA'"
          sshpass -e scp $SCP .github/scripts/publish-editorial-authority-batch26-core-20260827.php "$STAGING_USER@$STAGING_HOST:$PUB"
          sshpass -e scp $SCP .github/data/editorial-authority-batch26-20260827/*.php "$STAGING_USER@$STAGING_HOST:$DATA/"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "export PATH='$(dirname "$PHP")':\$PATH; EMDO_BATCH26_CORE_DIR='$DATA' '$PHP' -d memory_limit=768M -d display_errors=1 '$WP' eval 'require \"$PUB\";' --path='$PROD' --skip-plugins --skip-themes --allow-root; '$PHP' -d memory_limit=768M '$WP' cache flush --path='$PROD' --allow-root >/dev/null 2>&1 || true; rm -rf '$REMOTE'" | tee /tmp/ab26-core-output.txt
          python3 - <<'PY'
          import json
          s=open('/tmp/ab26-core-output.txt',encoding='utf-8').read()
          start=s.find('{\n    "batch": 26')
          if start < 0:
              start=s.find('{"batch":26')
          if start < 0:
              raise SystemExit('Batch 26 JSON output not found')
          obj=json.JSONDecoder().raw_decode(s[start:])[0]
          assert obj['batch']==26
          assert obj['default']==13359
          assert len(obj['posts'])==5
          for p in obj['posts']:
              assert p['status']=='publish', p
              assert int(p['thumbnail_id'])==13359, p
              assert str(p['provisional'])=='1', p
              assert int(p['words_es'])>=850, p
              assert int(p['words_en'])>=750, p
          open('/tmp/ab26-result.json','w',encoding='utf-8').write(json.dumps(obj,ensure_ascii=False,indent=2))
          print(json.dumps(obj,ensure_ascii=False,indent=2))
          PY

      - name: Verify ten public views and rendered products
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://www.elmercadodeorigen.com; stamp="$GITHUB_RUN_ID"
          check(){ url="$1"; marker="$2"; f=/tmp/ab26-page.html; c=$(curl -k -L -sS --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 EMDO editorial verifier' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$f" -w '%{http_code}' "$url?ab26core=$stamp"); echo "$c $url"; test "$c" = 200; grep -Fq "EMDO_AUTHORITY_BATCH26:$marker" "$f"; grep -Eq 'class="[^"]*products|class="[^"]*product' "$f"; ! grep -Fq '[products ' "$f"; grep -Fq 'emo-article-featured' "$f"; grep -Fq 'el-mercado-de-origen-blog-provisional-' "$f"; }
          check "$BASE/por-que-carne-se-pega-sarten-cuando-darle-vuelta/" meat-sticks-pan-when-turn-guide
          check "$BASE/en/why-meat-sticks-to-pan-when-to-turn-it/" meat-sticks-pan-when-turn-guide
          check "$BASE/liquido-cobertura-conservas-vegetales-que-es-para-que-sirve/" vegetable-preserve-covering-liquid-guide
          check "$BASE/en/vegetable-preserve-packing-liquid-what-it-is-what-it-does/" vegetable-preserve-covering-liquid-guide
          check "$BASE/verduras-conserva-pierden-nutrientes-frente-frescas/" canned-vs-fresh-vegetables-nutrients-guide
          check "$BASE/en/do-canned-vegetables-lose-nutrients-compared-with-fresh/" canned-vs-fresh-vegetables-nutrients-guide
          check "$BASE/conservas-tarro-vidrio-vs-lata-diferencias-conservacion-uso/" glass-jar-vs-can-preserves-guide
          check "$BASE/en/glass-jar-vs-can-preserves-differences-storage-use/" glass-jar-vs-can-preserves-guide
          check "$BASE/peso-neto-vs-peso-escurrido-conserva-que-significa/" net-vs-drained-weight-preserves-guide
          check "$BASE/en/net-weight-vs-drained-weight-in-preserves-what-each-means/" net-vs-drained-weight-preserves-guide

      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-status
          python3 - <<'PY'
          import json, os
          obj=json.load(open('/tmp/ab26-result.json',encoding='utf-8'))
          urls=[
            'https://www.elmercadodeorigen.com/por-que-carne-se-pega-sarten-cuando-darle-vuelta/',
            'https://www.elmercadodeorigen.com/en/why-meat-sticks-to-pan-when-to-turn-it/',
            'https://www.elmercadodeorigen.com/liquido-cobertura-conservas-vegetales-que-es-para-que-sirve/',
            'https://www.elmercadodeorigen.com/en/vegetable-preserve-packing-liquid-what-it-is-what-it-does/',
            'https://www.elmercadodeorigen.com/verduras-conserva-pierden-nutrientes-frente-frescas/',
            'https://www.elmercadodeorigen.com/en/do-canned-vegetables-lose-nutrients-compared-with-fresh/',
            'https://www.elmercadodeorigen.com/conservas-tarro-vidrio-vs-lata-diferencias-conservacion-uso/',
            'https://www.elmercadodeorigen.com/en/glass-jar-vs-can-preserves-differences-storage-use/',
            'https://www.elmercadodeorigen.com/peso-neto-vs-peso-escurrido-conserva-que-significa/',
            'https://www.elmercadodeorigen.com/en/net-weight-vs-drained-weight-in-preserves-what-each-means/'
          ]
          out={'verified':True,'batch':26,'date':'20260827','run_id':os.environ.get('GITHUB_RUN_ID'),'default_featured_attachment_id':obj['default'],'posts':obj['posts'],'public_urls':urls,'public_http_200':10,'rendered_product_shortcodes':10,'remaining_plan_articles':4}
          open('.deploy-status/editorial-authority-batch26-20260827.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .deploy-status/editorial-authority-batch26-20260827.json
          git commit -m 'Record verified editorial authority batch 26 publication [skip ci]'
          git push

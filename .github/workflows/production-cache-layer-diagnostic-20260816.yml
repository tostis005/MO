name: Production cache layer diagnostic 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-cache-layer-diagnostic-20260816.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify production flag controls are absent or hidden
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.elmercadodeorigen.com'
          for path in / /tienda/ /en/; do
            echo "=== $path HEADERS ==="
            curl -sSIL --max-time 30 "$base$path" | sed -n '1,40p'
            curl -sSL --max-time 30 "$base$path" -o /tmp/page.html

            style=0
            flag_signal=0
            grep -q 'mdo-hide-language-flags-20260816' /tmp/page.html && style=1 || true
            grep -qiE 'trp-floater-ls|trp-flag-image|trp-language-switcher[^<]*|/flags/[A-Za-z0-9_-]+\.(png|svg|webp)' /tmp/page.html && flag_signal=1 || true

            echo "PATH=$path HIDE_STYLE=$style FLAG_SIGNAL=$flag_signal"
            if [ "$flag_signal" -eq 1 ] && [ "$style" -ne 1 ]; then
              echo "Visible/unprotected language flag markup remains on $path" >&2
              grep -oiE 'trp-floater-ls|trp-flag-image|trp-language-switcher|/flags/[A-Za-z0-9_-]+\.(png|svg|webp)' /tmp/page.html | sort -u | head -n 30 || true
              exit 1
            fi
          done
          echo 'PRODUCTION_LANGUAGE_FLAGS=absent_or_hidden'

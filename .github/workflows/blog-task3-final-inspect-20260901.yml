name: Blog SEO task 3 final inspect 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-task3-final-inspect-20260901.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect runtime source and public archive behavior
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true)
            [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do
              p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true)
              case "$url" in https://www.elmercadodeorigen.com|http://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://elmercadodeorigen.com) printf "%s" "$p"; break;; esac
            done
          ')"
          : "${PROD_PATH:?production path not found}"

          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "
            echo EMDO_TASK3_PROD_EN_SEO_180_265_BEGIN
            sed -n '180,265p' '$PROD_PATH/wp-content/mu-plugins/mdo-production-english-seo-routes.php' 2>/dev/null || true
            echo EMDO_TASK3_PROD_EN_SEO_180_265_END
            echo EMDO_TASK3_EN_ISLAND_315_360_BEGIN
            sed -n '315,360p' '$PROD_PATH/wp-content/mu-plugins/mdo-english-island-runtime-seo.php' 2>/dev/null || true
            echo EMDO_TASK3_EN_ISLAND_315_360_END
            echo EMDO_TASK3_AIOSEO_ROBOTS_FILTERS_BEGIN
            grep -R -n -E "apply_filters\([^)]*(robots|robot)" '$PROD_PATH/wp-content/plugins/all-in-one-seo-pack' --include='*.php' 2>/dev/null | head -120 || true
            echo EMDO_TASK3_AIOSEO_ROBOTS_FILTERS_END
          "

          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          base='https://www.elmercadodeorigen.com'
          ua='Mozilla/5.0 EMDO SEO task3 final inspector'
          def get(url):
              return subprocess.check_output(['curl','-fsSL','--retry','3','--retry-delay','2','-A',ua,'-H','Cache-Control: no-cache',url],text=True)
          def head(url):
              return subprocess.check_output(['curl','-sS','-D','-','-o','/dev/null','--retry','3','--retry-delay','2','-A',ua,'-H','Cache-Control: no-cache',url],text=True)
          def seo(url):
              html=get(url)
              canon=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',html,re.I)
              if not canon: canon=re.findall(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',html,re.I)
              robots=re.findall(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)',html,re.I)
              return canon,robots

          for path in ['/author/admin-mercado/','/2026/08/','/etiqueta-producto/iberico/','/category/aceites/page/2/']:
              try:
                  c,r=seo(base+path); h=head(base+path)
                  xr=[x.strip() for x in re.findall(r'(?im)^x-robots-tag:\s*([^\r\n]+)',h)]
                  print(f'EMDO_TASK3_PUBLIC_ARCHIVE path={path} canonical={c[:2]!r} robots={r[:2]!r} xrobots={xr!r}')
              except Exception as e:
                  print(f'EMDO_TASK3_PUBLIC_ARCHIVE path={path} error={e}')

          # Parse all blog category hreflang pairs from sitemap XML, including xhtml alternates.
          xml=get(base+'/mdo-sitemap-blog-categories.xml')
          root=ET.fromstring(xml)
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9','x':'http://www.w3.org/1999/xhtml'}
          pairs=[]
          for u in root.findall('.//sm:url',ns):
              loc=u.find('sm:loc',ns)
              if loc is None or not loc.text: continue
              es=loc.text.strip(); en=''
              for link in u.findall('x:link',ns):
                  if link.attrib.get('hreflang') in ('en','en-US','en-GB'):
                      en=link.attrib.get('href','').strip(); break
              if en: pairs.append((es,en))
          print(f'EMDO_TASK3_BLOG_CATEGORY_PAIRS count={len(pairs)} pairs={pairs!r}')
          PY

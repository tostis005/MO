name: Production blog design 0.10.250

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-blog-design-010250.yml'

permissions:
  contents: read

concurrency:
  group: elmercado-production-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      STAGING_REMOTE_PATH: ${{ secrets.STAGING_REMOTE_PATH }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate final blog patch
        shell: bash
        run: |
          set -euo pipefail
          test -f elmercadodeorigen-child/functions.php
          test -f elmercadodeorigen-child/inc/blog-footer-layout-polish-010246.php
          test -f elmercadodeorigen-child/inc/blog-design-system-010248.php
          test -f elmercadodeorigen-child/inc/blog-editorial-body-class-010249.php
          test -f elmercadodeorigen-child/inc/blog-design-force-010250.php
          test -f scripts/blog-geometry-010248.cjs
          grep -q 'blog-design-force-010250.php' elmercadodeorigen-child/functions.php
          grep -q 'main#primary.emo-journal' elmercadodeorigen-child/inc/blog-design-force-010250.php
          grep -q 'main#primary.emo-article-page' elmercadodeorigen-child/inc/blog-design-force-010250.php
          grep -q 'blog-design-system-010248.php' elmercadodeorigen-child/inc/blog-footer-layout-polish-010246.php
          find elmercadodeorigen-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          : "${STAGING_HOST:?}"; : "${STAGING_USER:?}"; : "${STAGING_PASSWORD:?}"; : "${STAGING_REMOTE_PATH:?}"
          [[ "${STAGING_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

      - name: Install deployment and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync sshpass google-chrome-stable
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node -e "require('puppeteer-core'); console.log('PUPPETEER_OK')"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage blog patch files
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          REMOTE_TMP="/tmp/elmercado-blog-010250-${GITHUB_RUN_ID}"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP/inc'"
          sshpass -e rsync -az -e "ssh $SSH_OPTIONS" elmercadodeorigen-child/functions.php "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/functions.php"
          for f in blog-footer-layout-polish-010246.php blog-design-system-010248.php blog-editorial-body-class-010249.php blog-design-force-010250.php; do
            sshpass -e rsync -az -e "ssh $SSH_OPTIONS" "elmercadodeorigen-child/inc/$f" "$STAGING_USER@$STAGING_HOST:$REMOTE_TMP/inc/$f"
          done

      - name: Backup and apply production blog patch
        id: release
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          OUT="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$STAGING_REMOTE_PATH' '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          raw="${1%/}"; incoming="$2"; commit="$3"
          dev=""
          case "$raw" in */wp-content/*) dev="${raw%%/wp-content/*}" ;; */wp-content) dev="$(dirname "$raw")" ;; *) dev="$raw" ;; esac
          if [ ! -f "$dev/wp-config.php" ]; then
            cfg="$(find "$HOME" /var/www /home -maxdepth 9 -type f -path '*/dev.elmercadodeorigen.com/wp-config.php' 2>/dev/null | head -n1 || true)"
            [ -n "$cfg" ] || { echo 'Cannot resolve development WordPress root.' >&2; exit 1; }
            dev="$(dirname "$cfg")"
          fi
          prod="$(dirname "$dev")/httpdocs"
          theme="$prod/wp-content/themes/elmercadodeorigen-child"
          [ -f "$prod/wp-config.php" ] && [ -d "$theme/inc" ] || { echo 'Production theme path invalid.' >&2; exit 1; }

          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          [ -x "$php_bin" ] && [ -n "$wp_bin" ] || { echo 'PHP/WP-CLI unavailable.' >&2; exit 1; }
          siteurl="$("$php_bin" -d memory_limit=512M "$wp_bin" option get siteurl --path="$prod" --allow-root 2>/dev/null || true)"
          case "$siteurl" in https://elmercadodeorigen.com*|http://elmercadodeorigen.com*|https://www.elmercadodeorigen.com*|http://www.elmercadodeorigen.com*) ;; *) echo "Refusing production deploy: siteurl=$siteurl" >&2; exit 1 ;; esac

          for f in "$incoming/functions.php" "$incoming/inc/blog-footer-layout-polish-010246.php" "$incoming/inc/blog-design-system-010248.php" "$incoming/inc/blog-editorial-body-class-010249.php" "$incoming/inc/blog-design-force-010250.php"; do
            "$php_bin" -l "$f" >/dev/null
          done

          rollback_root="$HOME/.elmercado-rollbacks/elmercadodeorigen.com"
          short_commit="$(printf '%.10s' "$commit")"
          backup_name="$(date -u +%Y%m%dT%H%M%SZ)-before-blog-010250-$short_commit"
          backup_dir="$rollback_root/$backup_name"
          mkdir -p "$backup_dir"
          cp "$theme/functions.php" "$backup_dir/functions.php"
          cp "$theme/inc/blog-footer-layout-polish-010246.php" "$backup_dir/blog-footer-layout-polish-010246.php"
          for f in blog-design-system-010248.php blog-editorial-body-class-010249.php blog-design-force-010250.php; do
            if [ -f "$theme/inc/$f" ]; then
              cp "$theme/inc/$f" "$backup_dir/$f"
              printf '%s\n' yes > "$backup_dir/$f.existed"
            else
              printf '%s\n' no > "$backup_dir/$f.existed"
            fi
          done
          printf '%s\n' "$siteurl" > "$backup_dir/siteurl.txt"
          printf '%s\n' "$commit" > "$backup_dir/release-sha.txt"

          cp "$incoming/functions.php" "$theme/functions.php"
          cp "$incoming/inc/blog-footer-layout-polish-010246.php" "$theme/inc/blog-footer-layout-polish-010246.php"
          cp "$incoming/inc/blog-design-system-010248.php" "$theme/inc/blog-design-system-010248.php"
          cp "$incoming/inc/blog-editorial-body-class-010249.php" "$theme/inc/blog-editorial-body-class-010249.php"
          cp "$incoming/inc/blog-design-force-010250.php" "$theme/inc/blog-design-force-010250.php"

          "$php_bin" -l "$theme/functions.php" >/dev/null
          "$php_bin" -l "$theme/inc/blog-footer-layout-polish-010246.php" >/dev/null
          "$php_bin" -l "$theme/inc/blog-design-system-010248.php" >/dev/null
          "$php_bin" -l "$theme/inc/blog-editorial-body-class-010249.php" >/dev/null
          "$php_bin" -l "$theme/inc/blog-design-force-010250.php" >/dev/null
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true

          base="${siteurl%/}"
          code="$(curl -ksS -L -o /tmp/blog-010250 -w '%{http_code}' --max-time 35 "$base/blog/?release=$commit" || true)"
          [ "$code" = '200' ] || { echo "Blog HTTP $code" >&2; exit 1; }
          grep -q 'elmercado-blog-design-system-010248' /tmp/blog-010250
          grep -q 'elmercado-blog-design-force-010250' /tmp/blog-010250
          ! grep -Eqi 'Fatal error:|Parse error:|Uncaught Error:|There has been a critical error on this website' /tmp/blog-010250

          printf '__SITEURL__=%s\n' "$siteurl"
          printf '__PROD__=%s\n' "$prod"
          printf '__THEME__=%s\n' "$theme"
          printf '__BACKUP_DIR__=%s\n' "$backup_dir"
          REMOTE
          )"
          printf '%s\n' "$OUT"
          SITEURL="$(printf '%s\n' "$OUT" | sed -n 's/^__SITEURL__=//p' | tail -n1)"
          PROD="$(printf '%s\n' "$OUT" | sed -n 's/^__PROD__=//p' | tail -n1)"
          THEME="$(printf '%s\n' "$OUT" | sed -n 's/^__THEME__=//p' | tail -n1)"
          BACKUP_DIR="$(printf '%s\n' "$OUT" | sed -n 's/^__BACKUP_DIR__=//p' | tail -n1)"
          : "${SITEURL:?}"; : "${PROD:?}"; : "${THEME:?}"; : "${BACKUP_DIR:?}"
          echo "PRODUCTION_SITEURL=$SITEURL" >> "$GITHUB_ENV"
          echo "PRODUCTION_WP_PATH=$PROD" >> "$GITHUB_ENV"
          echo "PRODUCTION_THEME_PATH=$THEME" >> "$GITHUB_ENV"
          echo "PRODUCTION_BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Browser geometry QA on production
        shell: bash
        run: |
          set -euo pipefail
          node scripts/blog-geometry-010248.cjs

      - name: Release success
        if: success()
        run: echo "PRODUCTION_BLOG_DESIGN_010250_OK backup=$PRODUCTION_BACKUP_DIR"

      - name: Roll back blog patch on failure
        if: failure() && steps.release.outcome == 'success'
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "sh -s -- '$PRODUCTION_WP_PATH' '$PRODUCTION_THEME_PATH' '$PRODUCTION_BACKUP_DIR'" <<'REMOTE'
          set -eu
          prod="$1"; theme="$2"; backup="$3"
          cp "$backup/functions.php" "$theme/functions.php"
          cp "$backup/blog-footer-layout-polish-010246.php" "$theme/inc/blog-footer-layout-polish-010246.php"
          for f in blog-design-system-010248.php blog-editorial-body-class-010249.php blog-design-force-010250.php; do
            if [ "$(cat "$backup/$f.existed" 2>/dev/null || echo no)" = yes ]; then
              cp "$backup/$f" "$theme/inc/$f"
            else
              rm -f "$theme/inc/$f"
            fi
          done
          php_bin="$(command -v php || true)"
          [ -n "$php_bin" ] || php_bin="$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1)"
          wp_bin="$(command -v wp || true)"
          "$php_bin" -d memory_limit=512M "$wp_bin" cache flush --path="$prod" --skip-plugins --allow-root >/dev/null 2>&1 || true
          echo PRODUCTION_BLOG_DESIGN_010250_ROLLED_BACK
          REMOTE

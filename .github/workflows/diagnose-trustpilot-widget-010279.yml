name: Diagnose Trustpilot public widget data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-trustpilot-widget-010279.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Trustpilot public TrustBox JSON and home markup
        shell: bash
        run: |
          set -euo pipefail
          BU='61faf114a16cf7ffb4c3ddfa'
          for TEMPLATE in 5419b637fa0340045cd0c936 5419b6ffb0d04a076446a9af 53aa8807dec7e10d38f59f32; do
            URL="https://widget.trustpilot.com/trustbox-data/${TEMPLATE}?businessUnitId=${BU}&locale=es-ES"
            CODE=$(curl -L -sS -A 'Mozilla/5.0' -o "/tmp/tp-${TEMPLATE}.json" -w '%{http_code}' "$URL" || true)
            echo "TRUSTBOX ${TEMPLATE} HTTP=${CODE}"
            python3 - "$TEMPLATE" <<'PY'
          import json,sys,re
          p='/tmp/tp-'+sys.argv[1]+'.json'
          raw=open(p,'r',encoding='utf-8',errors='ignore').read()
          print('RAW_HEAD',raw[:500].replace('\n',' '))
          try:
              data=json.loads(raw)
          except Exception:
              continue_flag=False
          else:
              def walk(x,path=''):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          if re.search(r'(review|trust|score|star|count|total)',k,re.I):
                              if isinstance(v,(str,int,float,bool)) or v is None:
                                  print('FIELD',path+'/'+k,repr(v))
                          walk(v,path+'/'+k)
                  elif isinstance(x,list):
                      for i,v in enumerate(x[:10]): walk(v,path+f'/{i}')
              walk(data)
          PY
          done

          curl -L -sS --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 EMDO diagnostic' -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "https://www.elmercadodeorigen.com/?mdo_review_context=$(date +%s)" -o /tmp/home.html
          python3 - <<'PY'
          import re,html
          raw=open('/tmp/home.html','r',encoding='utf-8',errors='ignore').read()
          text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
          text=re.sub(r'\s+',' ',text)
          for needle in ['Google','Trustpilot','303','304','169','reseñas','opiniones']:
              print('\nNEEDLE',needle)
              for m in list(re.finditer(re.escape(needle),text,re.I))[:5]:
                  print(text[max(0,m.start()-350):m.start()+850])
          print('\nRAW_GOOGLE')
          for m in list(re.finditer('Google',raw,re.I))[:5]:
              print(re.sub(r'\s+',' ',raw[max(0,m.start()-700):m.start()+2500])[:3200])
          PY

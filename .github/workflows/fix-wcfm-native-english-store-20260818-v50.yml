name: Fix WCFM native English store v50

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-wcfm-native-english-store-20260818-v50.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          printf 'run_id=%s\nstatus=started\n' "$GITHUB_RUN_ID" > runtime/wcfm-native-en-v50.txt
          git add runtime/wcfm-native-en-v50.txt
          git commit -m 'Start WCFM native English store v50'
          git push origin HEAD:main

      - name: Copy legacy production router and patch both routers
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in https://www.elmercadodeorigen.com|https://elmercadodeorigen.com|http://www.elmercadodeorigen.com|http://elmercadodeorigen.com) printf '%s' "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          echo "$PROD_PATH" > /tmp/prod_v50
          sshpass -e scp $SCP_OPTIONS "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-slug-router.php" mu-plugins/mdo-english-slug-router.php

          python3 - <<'PY'
          from pathlib import Path
          p=Path('mu-plugins/mdo-english-slug-router.php')
          s=p.read_text()
          old="""    if ( $parts[0] === 'tienda' ) {
                  $target = mdo_en_root() . '/en/store/' . rawurlencode( $parts[1] ) . '/';
                  wp_safe_redirect( $target, 301, 'MDO English vendor base' );
                  exit;
              }
          """
          new="""    if ( $parts[0] === 'tienda' ) {
                  // Only canonicalise a URL that was publicly requested as /en/tienda/.
                  // Clean /en/store/ requests may be mapped to /en/tienda/ internally
                  // so WCFM can execute its native vendor query; those must never bounce.
                  $public_uri = isset( $GLOBALS['mdoev_original_public_uri_010260'] )
                      ? (string) $GLOBALS['mdoev_original_public_uri_010260']
                      : ( isset( $_SERVER['REQUEST_URI'] ) ? (string) wp_unslash( $_SERVER['REQUEST_URI'] ) : '' );
                  $public_path = trim( (string) wp_parse_url( $public_uri, PHP_URL_PATH ), '/' );
                  $public_parts = array_values( array_filter( explode( '/', $public_path ), 'strlen' ) );
                  if ( isset( $public_parts[0] ) && strtolower( (string) $public_parts[0] ) === 'en' ) {
                      array_shift( $public_parts );
                  }
                  if ( count( $public_parts ) !== 2 || strtolower( (string) $public_parts[0] ) !== 'tienda' ) {
                      return;
                  }
                  $target = mdo_en_root() . '/en/store/' . rawurlencode( $public_parts[1] ) . '/';
                  wp_safe_redirect( $target, 301, 'MDO English vendor base' );
                  exit;
              }
          """
          if old not in s:
              raise SystemExit('Legacy vendor redirect block not found')
          p.write_text(s.replace(old,new,1))

          q=Path('mu-plugins/mdo-z-english-vendor-seo-010260.php')
          t=q.read_text()
          needle="""\t} elseif ( preg_match( '#^en/store/([^/]+)/page/(\\d+)$#i', $path, $m ) ) {
          \t\t$internal = '/en/tienda/' . mdoev_store_slug_010260( $m[1] ) . '/page/' . max( 1, (int) $m[2] ) . '/';
          \t}
          """
          repl="""\t} elseif ( preg_match( '#^en/store/([^/]+)/page/(\\d+)$#i', $path, $m ) ) {
          \t\t$internal = '/en/tienda/' . mdoev_store_slug_010260( $m[1] ) . '/page/' . max( 1, (int) $m[2] ) . '/';
          \t} elseif ( preg_match( '#^en/store/([^/]+)$#i', $path, $m ) ) {
          \t\t$internal = '/en/tienda/' . mdoev_store_slug_010260( $m[1] ) . '/';
          \t}
          """
          if needle not in t:
              raise SystemExit('Clean vendor bootstrap insertion point not found')
          t=t.replace(needle,repl,1)
          t=t.replace(' * Version: 1.0.3',' * Version: 1.0.4',1)
          q.write_text(t)
          PY

          php -l mu-plugins/mdo-english-slug-router.php
          php -l mu-plugins/mdo-z-english-vendor-seo-010260.php
          grep -n "public_parts.*tienda\|MDO English vendor base" mu-plugins/mdo-english-slug-router.php
          grep -n "en/store/([^/]+).*internal\|internal = '/en/tienda/'" mu-plugins/mdo-z-english-vendor-seo-010260.php | head -10 || true

          git add mu-plugins/mdo-english-slug-router.php mu-plugins/mdo-z-english-vendor-seo-010260.php
          git commit -m 'Route English stores through native WCFM query'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy both routers
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          SCP_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
          PROD_PATH="$(cat /tmp/prod_v50)"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-english-slug-router.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-english-slug-router.php"
          sshpass -e scp $SCP_OPTIONS mu-plugins/mdo-z-english-vendor-seo-010260.php "$STAGING_USER@$STAGING_HOST:$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" "php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-english-slug-router.php'; \"\$php_bin\" -l '$PROD_PATH/wp-content/mu-plugins/mdo-z-english-vendor-seo-010260.php'; wp_bin=\$(command -v wp); \"\$php_bin\" \"\$wp_bin\" cache flush --path='$PROD_PATH' --allow-root >/dev/null 2>&1 || true"

      - name: Verify product-card parity and canonical URLs from production
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH_OPTIONS="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"
          sshpass -e ssh $SSH_OPTIONS "$STAGING_USER@$STAGING_HOST" '
            set -e
            out=/tmp/v50-report.txt
            : > "$out"
            check_store(){
              slug="$1"
              curl -k -L -sS --max-redirs 4 --connect-timeout 8 --max-time 40 "https://www.elmercadodeorigen.com/tienda/$slug/" -o /tmp/es50
              curl -k -L -sS --max-redirs 4 --connect-timeout 8 --max-time 40 -D /tmp/en50h "https://www.elmercadodeorigen.com/en/store/$slug/" -o /tmp/en50
              es=$(grep -oEi "<li[^>]+class=\"[^\"]*product[^\"]*\"" /tmp/es50 | wc -l | tr -d " ")
              en=$(grep -oEi "<li[^>]+class=\"[^\"]*product[^\"]*\"" /tmp/en50 | wc -l | tr -d " ")
              policies=$(grep -oiE ">[[:space:]]*(Policies|Store Policies)[[:space:]]*<|Políticas de la tienda" /tmp/en50 | wc -l | tr -d " ")
              hybrid=$(grep -oE "href=[\"'\''][^\"'\'']*/en/tienda/[^\"'\'']*" /tmp/en50 | wc -l | tr -d " ")
              about=$(grep -oE "/en/store/$slug/about/" /tmp/en50 | sort -u | wc -l | tr -d " ")
              redirects=$(grep -ic "^location:" /tmp/en50h || true)
              echo "store=$slug es_cards=$es en_cards=$en policies=$policies hybrid_links=$hybrid about_links=$about redirects=$redirects" >> "$out"
              test "$es" -gt 0
              test "$en" = "$es"
              test "$policies" = 0
              test "$hybrid" = 0
              test "$about" -gt 0
              test "$redirects" = 0
            }
            check_store 1957
            check_store hidalgo-de-la-jara
            check_store tolecarnes
            check_store puente-robles
            check_store el-catedratico

            curl -k -sS --connect-timeout 8 --max-time 25 -D /tmp/hybrid50h -o /dev/null https://www.elmercadodeorigen.com/en/tienda/1957/
            status=$(awk "toupper(\$1)~/^HTTP\\//{s=\$2}END{print s}" /tmp/hybrid50h)
            loc=$(awk "BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,\"\");sub(/\\r$/,\"\");print;exit}" /tmp/hybrid50h)
            echo "hybrid_redirect_status=$status hybrid_redirect_location=$loc" >> "$out"
            test "$status" = 301
            case "$loc" in *"/en/store/1957/"*) ;; *) exit 1;; esac
            cat "$out"
          ' > runtime/wcfm-native-en-products-v50.txt

      - name: Record final evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf 'run_id=%s\nstatus=complete\n' "$GITHUB_RUN_ID" > runtime/wcfm-native-en-v50.txt
          git add runtime/wcfm-native-en-v50.txt runtime/wcfm-native-en-products-v50.txt
          git commit -m 'Record WCFM English store parity v50' || true
          git pull --rebase origin main
          git push origin HEAD:main

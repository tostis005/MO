name: Home reflow star audit 0.10.261 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-reflow-star-audit-010261-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect served Home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          HTML=/tmp/home-010261.html
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o "$HTML"
          {
            echo '=== HTML META ==='
            printf 'bytes=%s\n' "$(wc -c < "$HTML")"
            echo '=== LINES 380-415 ==='
            nl -ba "$HTML" | sed -n '380,415p'
            echo '=== LINES 2335-2370 ==='
            nl -ba "$HTML" | sed -n '2335,2370p'
            echo '=== SEARCH SCRIPT CONTEXT ==='
            grep -n -B4 -A4 'search.min.js' "$HTML" || true
            echo '=== GENERAL SCRIPT CONTEXT ==='
            grep -n -B4 -A4 'general.min.js' "$HTML" || true
            echo '=== STAR CONTEXT HTML ==='
            grep -ni -B3 -A3 'star.woff\|font-family:[[:space:]]*star\|font-family:[[:space:]]*["'"'']star' "$HTML" || true
            echo '=== STAR RATING MARKUP ==='
            grep -ni -B2 -A2 'star-rating' "$HTML" | head -n 120 || true
          } > /tmp/static.txt

      - name: Inspect production sources
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"
          SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"
          PROD_PATH="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" '
            wp_bin=$(command -v wp || true); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1)
            for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done
          ')"
          : "${PROD_PATH:?}"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "
            echo '=== SEARCH.MIN SOURCE ==='
            find '$PROD_PATH/wp-content' -type f -name 'search.min.js' -print 2>/dev/null | head -n 30
            echo '=== GENERAL.MIN SOURCE ==='
            find '$PROD_PATH/wp-content' -type f -name 'general.min.js' -print 2>/dev/null | head -n 30
            echo '=== STAR.WOFF SOURCE ==='
            find '$PROD_PATH/wp-content' -type f -name 'star.woff' -print 2>/dev/null | head -n 30
            echo '=== STAR FONT CSS REFERENCES ==='
            grep -RIn --include='*.css' --include='*.php' 'star\.woff\|font-family:[[:space:]]*[\"'"'']\?star' '$PROD_PATH/wp-content/themes' '$PROD_PATH/wp-content/plugins/woocommerce' 2>/dev/null | head -n 100 || true
            echo '=== SEARCH PLUGIN NEARBY ==='
            for f in \$(find '$PROD_PATH/wp-content' -type f -name 'search.min.js' 2>/dev/null | head -n 5); do echo \"--- \$f\"; dirname \"\$f\"; done
          " > /tmp/server.txt

      - name: Inspect browser computed font users
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$CHROME" node <<'JS' > /tmp/browser.txt
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://www.elmercadodeorigen.com/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1200);
            const data=await page.evaluate(()=>{
              const selector=(el)=>{if(el.id)return '#'+CSS.escape(el.id); let s=el.tagName.toLowerCase(); if(el.classList.length)s+='.'+[...el.classList].slice(0,4).map(CSS.escape).join('.'); return s;};
              const fontUsers=[];
              for(const el of document.querySelectorAll('body *')){
                const cs=getComputedStyle(el), before=getComputedStyle(el,'::before'), after=getComputedStyle(el,'::after');
                if(/(^|[,\s"'])star([,\s"']|$)/i.test(cs.fontFamily)||/(^|[,\s"'])star([,\s"']|$)/i.test(before.fontFamily)||/(^|[,\s"'])star([,\s"']|$)/i.test(after.fontFamily)){
                  const r=el.getBoundingClientRect(); fontUsers.push({sel:selector(el),font:cs.fontFamily,before:before.fontFamily,after:after.fontFamily,w:Math.round(r.width),h:Math.round(r.height),text:(el.textContent||'').trim().slice(0,80)});
                }
              }
              const resources=performance.getEntriesByType('resource').filter(r=>/star\.woff|search\.min\.js|general\.min\.js/.test(r.name)).map(r=>({name:r.name,duration:Math.round(r.duration),transferSize:r.transferSize,initiatorType:r.initiatorType}));
              return {fontUsers:fontUsers.slice(0,60),resources};
            });
            console.log(JSON.stringify({errors,data},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cat /tmp/static.txt /tmp/server.txt /tmp/browser.txt > runtime/home-reflow-star-audit-010261.txt
          cat runtime/home-reflow-star-audit-010261.txt

      - name: Record audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          [ -f runtime/home-reflow-star-audit-010261.txt ] || printf 'audit_failed=true\n' > runtime/home-reflow-star-audit-010261.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/home-reflow-star-audit-010261.txt
          git commit -m 'Record Home reflow and star font audit' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

# trigger: 2

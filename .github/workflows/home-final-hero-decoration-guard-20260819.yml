name: Home final hero decoration CLS guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-final-hero-decoration-guard-20260819.yml'

permissions:
  contents: write

concurrency:
  group: home-selective-structural-css-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add critical decoration guard
        run: |
          set -euo pipefail
          CRIT='elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'
          cp "$CRIT" /tmp/critical-before-decoration-guard.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('elmercadodeorigen-child/assets/css/critical-woostify-home.min.css')
          s=p.read_text()
          marker='/*mdo-home-hero-decoration-cls-guard-20260819*/'
          rule='body.home.elmercado-child-theme .emo-home>.emo-hero::after{display:none!important;content:none!important;width:0!important;height:0!important}'
          if marker not in s: s += '\n'+marker+'\n'+rule+'\n'
          p.write_text(s)
          PY
          grep -q 'mdo-home-hero-decoration-cls-guard-20260819' "$CRIT"
      - name: Deploy guard and purge Home cache
        id: deploy
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20 -P $PORT"
          PROD="$(sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" 'wp_bin=$(command -v wp); php_bin=$(command -v php || true); [ -n "$php_bin" ] || php_bin=$(find /opt/plesk/php -maxdepth 3 -type f -path "*/bin/php" 2>/dev/null | sort -Vr | head -n1); for cfg in $(find /var/www/vhosts "$HOME" -maxdepth 7 -type f -path "*/httpdocs/wp-config.php" 2>/dev/null); do p=$(dirname "$cfg"); url=$("$php_bin" "$wp_bin" option get siteurl --path="$p" --skip-plugins --skip-themes --allow-root 2>/dev/null || true); case "$url" in *elmercadodeorigen.com*) printf "%s" "$p"; break;; esac; done')"
          : "${PROD:?}"; echo "$PROD" >/tmp/prod-final-guard
          sshpass -e scp $SCP elmercadodeorigen-child/assets/css/critical-woostify-home.min.css "$STAGING_USER@$STAGING_HOST:/tmp/final-guard-${GITHUB_RUN_ID}.css"
          sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "set -e; install -m0644 /tmp/final-guard-${GITHUB_RUN_ID}.css '$PROD/wp-content/themes/elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/final-guard-${GITHUB_RUN_ID}.css"
          for i in 1 2 3; do curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /dev/null; done
          curl -fsS --compressed --max-time 45 'https://www.elmercadodeorigen.com/' -o /tmp/home-final-guard.html
          grep -q 'mdo-home-hero-decoration-cls-guard-20260819' /tmp/home-final-guard.html
          grep -q 'id="woostify-parent-style-inline-css"' /tmp/home-final-guard.html
      - name: Lighthouse desktop 3x
        id: measure
        run: |
          set -euo pipefail; mkdir -p runtime
          for i in 1 2 3; do npx --yes lighthouse@12.8.2 'https://www.elmercadodeorigen.com/' --only-categories=performance --form-factor=desktop --screenEmulation.mobile=false --screenEmulation.width=1350 --screenEmulation.height=940 --screenEmulation.deviceScaleFactor=1 --throttling-method=simulate --output=json --output-path="/tmp/final-guard-$i.json" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'; done
          python3 - <<'PY' | tee runtime/home-final-hero-decoration-guard-20260819.txt
          import json,statistics
          rows=[]
          for i in range(1,4):
            r=json.load(open(f'/tmp/final-guard-{i}.json')); a=r['audits']; x={'score':round(r['categories']['performance']['score']*100),'fcp':round(a['first-contentful-paint']['numericValue']),'lcp':round(a['largest-contentful-paint']['numericValue']),'tbt':round(a['total-blocking-time']['numericValue']),'cls':a['cumulative-layout-shift']['numericValue'],'si':round(a['speed-index']['numericValue'])}; rows.append(x); print('run',i,x)
            for q in ((a.get('layout-shifts',{}).get('details') or {}).get('items') or [])[:6]: n=q.get('node') or {}; print(' shift',q.get('score'),n.get('selector') or n.get('nodeLabel') or '')
          med={k:statistics.median(z[k] for z in rows) for k in rows[0]}
          for k,v in med.items(): print('median_'+k+'=',v)
          keep=med['cls']<0.045 and med['lcp']<5500 and med['fcp']<3000
          print('keep=',str(keep).lower()); open('/tmp/keep-final-guard','w').write('1' if keep else '0')
          PY
      - name: Keep or revert
        if: always()
        shell: bash
        env:
          SSHPASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          KEEP=$(cat /tmp/keep-final-guard 2>/dev/null || echo 0)
          if [ "$KEEP" != 1 ]; then
            cp /tmp/critical-before-decoration-guard.css elmercadodeorigen-child/assets/css/critical-woostify-home.min.css
            PROD=$(cat /tmp/prod-final-guard); PORT="${STAGING_PORT:-22}"; SSH="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -p $PORT"; SCP="-o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -P $PORT"
            sshpass -e scp $SCP /tmp/critical-before-decoration-guard.css "$STAGING_USER@$STAGING_HOST:/tmp/revert-final-guard-${GITHUB_RUN_ID}.css"
            sshpass -e ssh $SSH "$STAGING_USER@$STAGING_HOST" "install -m0644 /tmp/revert-final-guard-${GITHUB_RUN_ID}.css '$PROD/wp-content/themes/elmercadodeorigen-child/assets/css/critical-woostify-home.min.css'; php_bin=\$(command -v php || true); [ -n \"\$php_bin\" ] || php_bin=\$(find /opt/plesk/php -maxdepth 3 -type f -path '*/bin/php' 2>/dev/null | sort -Vr | head -n1); wp_bin=\$(command -v wp); \"\$php_bin\" -d memory_limit=512M \"\$wp_bin\" cache flush --path='$PROD' --allow-root || true; rm -f '$PROD/wp-content/uploads/elmercado-home-static/index.html' '$PROD/wp-content/uploads/elmercado-home-static'/home-deferred-*.css /tmp/revert-final-guard-${GITHUB_RUN_ID}.css"
          fi
          mkdir -p runtime; [ -f runtime/home-final-hero-decoration-guard-20260819.txt ] || echo failed > runtime/home-final-hero-decoration-guard-20260819.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add elmercadodeorigen-child/assets/css/critical-woostify-home.min.css runtime/home-final-hero-decoration-guard-20260819.txt; git commit -m 'Measure final Home hero decoration CLS guard' || exit 0; git pull --rebase origin main; git push origin HEAD:main

name: Production product cards and Home hero density 0.10.246

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-card-hero-density-010246.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch permanent source
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/patch-card-hero-density-010246.py
          php -l elmercadodeorigen-child/inc/product-card-density-final-010162.php
          php -l elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php
          grep -Fq '0.10.246: compactamos' elmercadodeorigen-child/inc/product-card-density-final-010162.php
          grep -Fq 'translateY(-34px)' elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php

      - name: Commit permanent source
        run: |
          set -Eeuo pipefail
          git config user.name 'El Mercado de Origen Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add elmercadodeorigen-child/inc/product-card-density-final-010162.php elmercadodeorigen-child/mu-plugins/elmercado-home-fresh.php
          git commit -m 'Compact product cards and Home hero'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Deploy and verify production
        run: bash .github/scripts/deploy-card-hero-density-010246.sh

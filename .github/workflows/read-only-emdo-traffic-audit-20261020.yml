name: Read-only EMDO traffic and bot audit 20261020
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-only-emdo-traffic-audit-20261020.yml']
permissions:
  contents: read
concurrency:
  group: emdo-readonly-traffic-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSHPASS: ${{ secrets.STAGING_PASSWORD }}
    steps:
      - name: Analyze Plesk access logs anonymized and read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null
          PORT="${STAGING_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$PORT" -H "$STAGING_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -u
          export LC_ALL=C
          LOGDIR=/var/www/vhosts/system/elmercadodeorigen.com/logs
          echo '=== HOST HEALTH ==='
          date -u +'%Y-%m-%dT%H:%M:%SZ'; uptime; free -m; df -h /
          echo '=== ACCESS LOG METADATA ==='
          find "$LOGDIR" -maxdepth 1 -type f \( -name '*access*' -o -name '*error*' \) -printf '%TY-%Tm-%Td %TH:%TM %s %f\n' 2>/dev/null | sort | tail -n 40
          echo '=== SERVICES ==='
          ps -eo comm= | awk '/php-fpm|mysqld|mariadbd|nginx|apache2/{n[$1]++} END {for(k in n) print k,n[k]}'
          echo '=== ANONYMIZED LIVE ACCESS LOG ANALYSIS ==='
          timeout 220 nice -n 19 python3 - "$LOGDIR" <<'PY'
          import os,sys,re,collections,datetime,gzip,hashlib,secrets,json,time
          root=sys.argv[1]; now=datetime.datetime.now(datetime.timezone.utc)
          cutoff=now-datetime.timedelta(hours=48)
          salt=secrets.token_bytes(16)
          ipcode=lambda ip:hashlib.blake2s(ip.encode(),key=salt,digest_size=5).hexdigest()
          rx=re.compile(r'^(\S+)\s+\S+\s+\S+\s+\[([^\]]+)\]\s+"(\S+)\s+([^"]*?)(?:\s+HTTP/[0-9.]+)?"\s+(\d{3})\s+(\S+)(?:\s+"([^"]*)"\s+"([^"]*)")?')
          candidates=[]
          for n in os.listdir(root) if os.path.isdir(root) else []:
              if not re.match(r'^(?:access_ssl_log|access_log)(?:\..*)?$',n):continue
              p=os.path.join(root,n)
              if not os.path.isfile(p):continue
              if os.stat(p).st_mtime<time.time()-4*86400:continue
              candidates.append((p,os.stat(p).st_size))
          candidates.sort(key=lambda z:os.stat(z[0]).st_mtime,reverse=True)
          chosen=[];size=0
          for p,n in candidates:
              if size+n>850_000_000:continue
              chosen.append(p);size+=n
          print('LOG_SELECTION',json.dumps({"files":[os.path.basename(x) for x in chosen],"bytes":size}))
          windows={'10m':600,'1h':3600,'24h':86400,'48h':172800}
          fields=['reqs','dynamic','posts','faceted','heavy_facets']
          totals={w:collections.Counter() for w in windows}
          routes={w:collections.Counter() for w in windows}
          statuses={w:collections.Counter() for w in windows}
          uas={w:collections.Counter() for w in windows}
          ips={w:collections.Counter() for w in windows}
          ip_uas={w:collections.defaultdict(set) for w in windows}
          pages={w:collections.Counter() for w in windows}
          page_ips={w:collections.defaultdict(set) for w in windows}
          page_codes={w:collections.defaultdict(collections.Counter) for w in windows}
          minutes={w:collections.Counter() for w in windows}
          ten_secs={w:collections.Counter() for w in windows}
          producer_burst_hits=collections.Counter()
          producer_burst_ips=collections.defaultdict(set)
          lines_read=0; parsed_recent=0; bad_lines=0
          asset_re=re.compile(r'\.(?:css|js|png|webp|avif|jpe?g|gif|svg|ico|woff2?|ttf|eot|map|mp4|pdf)(?:$|\?)',re.I)
          def cohort(ua):
              x=(ua or '').lower()
              patterns=[('Googlebot claimed',['googlebot','google-inspectiontool','googleother','adsbot-google']),
              ('Bingbot claimed',['bingbot','bingpreview']),('Meta claimed',['facebookexternalhit','meta-externalagent','meta-externalfetch']),
              ('Pinterest claimed',['pinterestbot']),('DuckDuckBot claimed',['duckduckbot','duckassist']),
              ('ClaudeBot claimed',['claudebot','claude-searchbot']),('OpenAI claimed',['gptbot','chatgpt-user','oai-searchbot']),
              ('Other crawlers claimed',['bot','crawler','spider','bytespider','semrush','ahrefs','headless','petalbot','mj12']),
              ('Scripts/clients',['python-requests','curl/','wget/','go-http-client','httpclient','okhttp','axios/'])]
              for name,terms in patterns:
                  if any(t in x for t in terms):return name
              return 'Browser-like or unknown'
          def route(path):
              x=path.lower()
              if '/store/' in x:return 'producer-store'
              if '/producto/' in x or '/product/' in x:return 'product'
              if '/categoria-producto/' in x or '/product-category/' in x:return 'category'
              if x in ('/tienda/','/en/shop/'):return 'shop'
              if '/wp-admin/admin-ajax.php' in x:return 'admin-ajax'
              if '/wp-json/' in x:return 'wp-json'
              if '/wp-login.php' in x or '/xmlrpc.php' in x:return 'login/xmlrpc'
              if '/blog/' in x:return 'blog'
              if x in ('/','/en/'):return 'home'
              if asset_re.search(x):return 'static'
              return 'other'
          for path in chosen:
              opener=gzip.open if path.endswith('.gz') else open
              try:f=opener(path,'rt',encoding='utf-8',errors='replace')
              except Exception as e:print('OPEN_ERROR',os.path.basename(path),type(e).__name__);continue
              with f:
                  for line in f:
                      lines_read+=1;m=rx.match(line)
                      if not m:bad_lines+=1;continue
                      ip,dtstr,method,url,code,body,ref,ua=m.groups()
                      try:dt=datetime.datetime.strptime(dtstr,'%d/%b/%Y:%H:%M:%S %z').astimezone(datetime.timezone.utc)
                      except:bad_lines+=1;continue
                      if dt<cutoff or dt>now+datetime.timedelta(minutes=5):continue
                      parsed_recent+=1;ip=ipcode(ip);ua=ua or '';co=cohort(ua)
                      path=url.split('?',1)[0]
                      if path.startswith('http'):path=re.sub(r'^https?://[^/]+','',path)
                      path=path or '/'
                      r=route(path)
                      qs=url.split('?',1)[1] if '?' in url else ''
                      facet_count=sum(1 for k in re.findall(r'(?:^|&)([^=&]+)=',qs) if k.lower().startswith(('filter_','query_type_')))
                      minute=dt.strftime('%Y-%m-%dT%H:%MZ')
                      second10=dt.strftime('%Y-%m-%dT%H:%M:')+str(dt.second//10)
                      is_dynamic=r!='static'
                      if r=='producer-store':
                          producer_burst_hits[(minute,path)]+=1;producer_burst_ips[(minute,path)].add(ip)
                      for w,duration in windows.items():
                          if (now-dt).total_seconds()>duration:continue
                          totals[w]['all']+=1
                          if is_dynamic:totals[w]['dynamic']+=1;ips[w][ip]+=1;ip_uas[w][ip].add(co);minutes[w][minute]+=1;ten_secs[w][second10]+=1
                          if method=='POST':totals[w]['post']+=1
                          if facet_count:totals[w]['faceted']+=1
                          if facet_count>=3:totals[w]['heavy_facets']+=1
                          routes[w][r]+=1; statuses[w][code]+=1;uas[w][co]+=1
                          pages[w][path]+=1;page_ips[w][path].add(ip);page_codes[w][path][code]+=1
          print('LINES',json.dumps({"read":lines_read,"valid_recent":parsed_recent,"unparsed":bad_lines}))
          for w in windows:
              pi=ips[w];vals=sorted(pi.values(),reverse=True)
              tops=[]
              for p,n in pages[w].most_common(80):
                  if route(p)=='static':continue
                  tops.append({"path":p[:165],"requests":n,"distinct_ips":len(page_ips[w][p]),"statuses":dict(page_codes[w][p].most_common(4))})
                  if len(tops)==18:break
              d={"window":w,"totals":dict(totals[w]),"routes":dict(routes[w]),"statuses":dict(statuses[w]),"user_agents_claimed":dict(uas[w]),"distinct_dynamic_ips":len(pi),"top_ip_pseudonyms":[{"id":ip,"requests":n,"user_agent_groups":sorted(ip_uas[w][ip])} for ip,n in pi.most_common(12)],"ips_over_50_requests":sum(v>=50 for v in pi.values()),"ips_over_200_requests":sum(v>=200 for v in pi.values()),"dynamic_share_top10_ips":round(sum(vals[:10])/max(1,sum(vals)),3),"peak_requests_min":max(minutes[w].values(),default=0),"peak_requests_10sec":max(ten_secs[w].values(),default=0),"top_minutes":minutes[w].most_common(5),"top_pages":tops}
              print('WINDOW_JSON',json.dumps(d,ensure_ascii=False))
          bursts=[{"minute":m,"path":p[:140],"requests":n,"distinct_ips":len(producer_burst_ips[(m,p)])} for (m,p),n in producer_burst_hits.items() if n>=6]
          bursts.sort(key=lambda x:(x['distinct_ips'],x['requests']),reverse=True)
          print('PRODUCER_BURSTS',json.dumps(bursts[:35],ensure_ascii=False))
          PY
          echo '=== ERROR COUNTS FROM LATEST 3000 LINES ==='
          python3 - "$LOGDIR" <<'PY'
          import sys,os,collections
          for name in ['error_log','proxy_error_log']:
              p=os.path.join(sys.argv[1],name)
              if not os.path.isfile(p):continue
              from collections import deque
              with open(p,'r',errors='replace') as f:q=deque(f,maxlen=3000)
              words=['max_children','upstream timed out','timeout','out of memory','fatal error','connection refused','too many connections','no space left']
              print(name,len(q),{x:sum(x in line.lower() for line in q) for x in words})
          PY
          echo '=== NO-BODY CACHE AND PAGE RESPONSE ==='
          for p in / /tienda/ /en/store/hidalgo-de-la-jara/ /en/store/montjam/ /categoria-producto/jamones-paletas/; do
            echo "PATH=$p"
            curl -sS -L --max-time 18 -o /dev/null -D /tmp/emdo-read-only-header-audit -A 'MDO-ReadOnly-BotAudit/20261020' -w 'HTTP=%{http_code} TTFB=%{time_starttransfer} TOTAL=%{time_total} BYTES=%{size_download}\n' "https://www.elmercadodeorigen.com$p" || true
            grep -iE '^(x-el-mercado-[^:]+|x-cache|cf-cache-status|cache-control|server):' /tmp/emdo-read-only-header-audit | cut -c1-180 | head -n 10 || true
          done
          REMOTE
